name: Truely Launch 2 Final Certificate ad575 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/launch-2-final-certificate-ad575-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: truely-launch-2-final-certificate-ad575-20260729
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: ad5758557e14f10ae9294a4a8de4dd69d188b58d
  EXPECTED_BRANCH: ops/launch-2-final-certificate-ad575-20260729
  DEPLOY_RUN_ID: "30499730489"
  DEPLOY_ARTIFACT: launch-current-main-ad575-production-1
  DEPLOY_ARTIFACT_DIGEST: sha256:ae14e396e30a0e463d41afa498d4f72b65613ecb6b5ee1819815f8e05c24dccb
  VERCEL_SCOPE: truelycollectables-projects
  EVIDENCE_DIR: .audit/launch-2-final-ad575
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  final-production-certificate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/launch-2-final-certificate-ad575-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out guarded certificate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact current source and branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main ops/truely-full-launch-audit-20260729 ops/launch-2-final-certificate-20260729
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/launch-2-final-certificate-ad575-20260729.yml"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          mkdir -p "$EVIDENCE_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact current dependencies
        run: npm ci

      - name: Verify signed exact Production deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          target="$EVIDENCE_DIR/signed-production"
          mkdir -p "$target"
          conclusion="$(gh run view "$DEPLOY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          test "$conclusion" = "success"
          gh run download "$DEPLOY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$DEPLOY_ARTIFACT" --dir "$target"
          source_file="$(find "$target" -name source-sha.txt -type f -print -quit)"
          verification_file="$(find "$target" -name production-verification.txt -type f -print -quit)"
          deployment_file="$(find "$target" -name staged-deployment-url.txt -type f -print -quit)"
          audit_file="$(find "$target" -name npm-audit-summary.json -type f -print -quit)"
          test -n "$source_file"
          test -n "$verification_file"
          test -n "$deployment_file"
          test -n "$audit_file"
          test "$(tr -d '\r\n' < "$source_file")" = "$EXPECTED_MAIN_SHA"
          test "$(tr -d '\r\n' < "$verification_file")" = "PASS"
          deployment_url="$(tr -d '\r\n' < "$deployment_file")"
          test -n "$deployment_url"
          printf '%s\n' "$deployment_url" > "$EVIDENCE_DIR/exact-production-deployment-url.txt"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.EVIDENCE_DIR, 'signed-production');
          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out); else out.push(full);
            }
            return out;
          }
          const files = walk(root);
          const auditPath = files.find((file) => path.basename(file) === 'npm-audit-summary.json');
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          if ((audit.high || 0) !== 0 || (audit.critical || 0) !== 0) throw new Error(`Signed deployment audit is not clean: ${JSON.stringify(audit)}`);
          const simulations = files.filter((file) => /simulation-shard-\d+\.json$/.test(file));
          if (simulations.length < 6) throw new Error(`Only ${simulations.length} signed simulation reports were found.`);
          const failed = simulations.flatMap((file) => {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            return (value.results || []).filter((row) => row.status !== 'passed').map((row) => ({ file, name: row.name, status: row.status }));
          });
          if (failed.length) throw new Error(`Signed deployment simulations contain failures: ${JSON.stringify(failed)}`);
          fs.writeFileSync(path.join(process.env.EVIDENCE_DIR, 'signed-production-summary.json'), JSON.stringify({
            runId: Number(process.env.DEPLOY_RUN_ID),
            artifact: process.env.DEPLOY_ARTIFACT,
            artifactDigest: process.env.DEPLOY_ARTIFACT_DIGEST,
            sourceSha: process.env.EXPECTED_MAIN_SHA,
            npmAudit: audit,
            simulationReports: simulations.length,
            failedSimulations: failed,
          }, null, 2));
          NODE

      - name: Run current-source security and privileged-route audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/source-security"
          tracked="$RUNNER_TEMP/truely-tracked-source"
          rm -rf "$tracked"
          mkdir -p "$tracked"
          git archive HEAD | tar -x -C "$tracked"
          docker run --rm \
            -v "$tracked:/repo:ro" \
            -v "$PWD/$EVIDENCE_DIR/source-security:/evidence" \
            zricethezav/gitleaks:v8.28.0 dir /repo \
            --no-banner --redact --report-format json --exit-code 0 \
            --report-path /evidence/gitleaks.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/source-security/gitleaks.json', 'utf8'));
          const expected = new Set(["docs/TCOS_OPERATOR_MANUAL.md:generic-api-key:5172","docs/TCOS_OPERATOR_MANUAL_PRINT.html:generic-api-key:4918","scripts/check-production-guardrails.mjs:stripe-access-token:34","scripts/check-production-guardrails.mjs:stripe-access-token:35","scripts/check-production-guardrails.mjs:generic-api-key:41","scripts/check-production-guardrails.mjs:generic-api-key:43","scripts/check-production-guardrails.mjs:jwt:46","scripts/check-production-guardrails.mjs:generic-api-key:4165","scripts/check-production-guardrails.mjs:generic-api-key:4604","scripts/check-production-guardrails.mjs:stripe-access-token:6331","scripts/check-production-guardrails.mjs:generic-api-key:6334","scripts/check-production-guardrails.mjs:stripe-access-token:6339","scripts/check-production-guardrails.mjs:generic-api-key:6342","scripts/check-production-guardrails.mjs:generic-api-key:6346","scripts/check-production-guardrails.mjs:stripe-access-token:6354","scripts/check-production-guardrails.mjs:generic-api-key:6357","scripts/deploy-production.mjs:stripe-access-token:554","scripts/deploy-production.mjs:stripe-access-token:555","scripts/deploy-production.mjs:generic-api-key:561","scripts/deploy-production.mjs:generic-api-key:563","scripts/deploy-production.mjs:jwt:566","scripts/smoke-production.mjs:stripe-access-token:531","scripts/smoke-production.mjs:stripe-access-token:532","scripts/smoke-production.mjs:generic-api-key:538","scripts/smoke-production.mjs:generic-api-key:540","scripts/smoke-production.mjs:jwt:543","src/app/admin/instacomp/DuckAiWitness.tsx:generic-api-key:16","src/app/api/admin/verified-reference-bootstrap/route.ts:generic-api-key:18"]);
          const actual = new Set(report.map((row) => `${String(row.File || '').replace(/^\\/repo\\//, '')}:${row.RuleID}:${row.StartLine}`));
          const unexpected = [...actual].filter((value) => !expected.has(value)).sort();
          const missing = [...expected].filter((value) => !actual.has(value)).sort();
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/source-security/gitleaks-classification.json', JSON.stringify({
            totalFindings: report.length,
            expectedKnownFalsePositives: expected.size,
            unexpected,
            missing,
          }, null, 2));
          if (unexpected.length || missing.length || report.length !== expected.size) {
            throw new Error(`Gitleaks fingerprint baseline changed: ${JSON.stringify({ unexpected, missing, count: report.length })}`);
          }
          NODE
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const files = cp.execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean);
          const patterns = [
            /sk_(?:live|test)_[A-Za-z0-9]{16,}/,
            /whsec_[A-Za-z0-9]{16,}/,
            /re_[A-Za-z0-9]{16,}/,
            /(?:ghp|github_pat)_[A-Za-z0-9_]{16,}/,
            /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/,
          ];
          const hits = [];
          for (const file of files) {
            let text;
            try { text = fs.readFileSync(file, 'utf8'); } catch { continue; }
            for (const pattern of patterns) if (pattern.test(text)) hits.push({ file, pattern: String(pattern) });
          }
          if (hits.length) throw new Error(`Tracked-source secret scan found ${hits.length} match(es): ${JSON.stringify(hits)}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/source-security/tracked-secret-scan.json', JSON.stringify({ ok: true, filesScanned: files.length }, null, 2));
          NODE
          node scripts/run-privileged-api-route-audit.mjs | tee "$EVIDENCE_DIR/source-security/privileged-route-audit.log"
          npm run simulate:privileged-route-auth | tee "$EVIDENCE_DIR/source-security/privileged-route-simulation.log"

      - name: Run all six current-source Launch 2 simulations
        shell: bash
        run: |
          set -euo pipefail
          git show origin/ops/truely-full-launch-audit-20260729:scripts/run-truely-launch-audit-20260729.mjs > scripts/.final-launch-audit-runner-20260729.mjs
          rm -rf .audit/simulations
          for shard in 0 1 2 3 4 5; do
            node scripts/.final-launch-audit-runner-20260729.mjs simulations --shard="$shard" --shards=6
          done
          mkdir -p "$EVIDENCE_DIR/current-simulations"
          cp -R .audit/simulations/. "$EVIDENCE_DIR/current-simulations/"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.EVIDENCE_DIR + '/current-simulations';
          const files = fs.readdirSync(dir).filter((name) => /^simulation-shard-\d+\.json$/.test(name));
          if (files.length < 6) throw new Error(`Only ${files.length} current simulation reports exist.`);
          const failures = files.flatMap((name) => {
            const value = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
            return (value.results || []).filter((row) => row.status !== 'passed').map((row) => ({ shard: name, name: row.name, status: row.status }));
          });
          if (failures.length) throw new Error(`Current simulations failed: ${JSON.stringify(failures)}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/current-simulation-summary.json', JSON.stringify({ reports: files.length, failures }, null, 2));
          NODE

      - name: Run current dependency audit lint TypeScript and Production build
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$EVIDENCE_DIR/current-npm-audit.json" || audit_status=$?
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/current-npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/current-npm-audit-summary.json', JSON.stringify(counts, null, 2));
          if ((counts.high || 0) !== 0 || (counts.critical || 0) !== 0) throw new Error(`High or critical advisories remain: ${JSON.stringify(counts)}`);
          NODE
          npm audit --audit-level=high
          npm run lint
          npx tsc --noEmit --pretty false
          npm run build
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/current-main-sha.txt"

      - name: Run current live Production crawl and access audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit/live
          AUDIT_BASE_URL="https://truelycollectables.com" node scripts/.final-launch-audit-runner-20260729.mjs live
          mkdir -p "$EVIDENCE_DIR/live-production"
          cp -R .audit/live/. "$EVIDENCE_DIR/live-production/"
          rm -f scripts/.final-launch-audit-runner-20260729.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/live-production/live-production-audit.json', 'utf8'));
          const blockers = (value.findings || []).filter((row) => row.severity === 'blocker');
          if (blockers.length) throw new Error(`Live Production blockers: ${JSON.stringify(blockers)}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/live-production-summary.json', JSON.stringify({ blockers: 0, findings: value.findings?.length || 0 }, null, 2));
          NODE

      - name: Resolve exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-identity.txt"

      - name: Create protected disposable Production-runtime audit deployment
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          mkdir -p src/app/api/internal/launch-audit-runtime-20260729
          git show origin/ops/launch-2-final-certificate-20260729:src/app/api/internal/launch-audit-runtime-20260729/route.js > src/app/api/internal/launch-audit-runtime-20260729/route.js
          git diff --check
          npx vercel@56.2.0 deploy --prod --yes --force --skip-domain \
            --meta "launchSourceSha=$EXPECTED_MAIN_SHA" \
            --meta "launchPurpose=launch-2-final-runtime-audit-ad575" \
            --env "TCOS_LAUNCH_AUDIT_TOKEN=$token" \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/runtime-deployment.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$EVIDENCE_DIR/runtime-deployment.log" | head -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > "$EVIDENCE_DIR/runtime-deployment-url.txt"

      - name: Verify Production-runtime integrations and data invariants
        env:
          AUDIT_URL: ${{ steps.runtime.outputs.url }}
          AUDIT_TOKEN: ${{ steps.runtime.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          root_code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 120 --output "$EVIDENCE_DIR/runtime-root.html" --write-out '%{http_code}' "$AUDIT_URL/")"
          test "$root_code" = "200"
          unauth_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output "$EVIDENCE_DIR/runtime-unauthorized.json" --write-out '%{http_code}' --request POST "$AUDIT_URL/api/internal/launch-audit-runtime-20260729")"
          test "$unauth_code" = "401"
          auth_code="$(curl --silent --show-error --connect-timeout 15 --max-time 300 --output "$EVIDENCE_DIR/runtime-integrations.json" --write-out '%{http_code}' \
            --request POST --header "x-tcos-launch-audit-token: $AUDIT_TOKEN" \
            "$AUDIT_URL/api/internal/launch-audit-runtime-20260729")"
          test "$auth_code" = "200"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/runtime-integrations.json', 'utf8'));
          if (value.environment !== 'production') throw new Error('Runtime audit was not Production-targeted.');
          const blockers = (value.findings || []).filter((row) => row.severity === 'blocker');
          if (blockers.length || value.blockerCount !== 0) throw new Error(`Runtime integration blockers: ${JSON.stringify(blockers)}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/runtime-summary.json', JSON.stringify({ blockers: 0, warnings: (value.findings || []).filter((row) => row.severity === 'warning').length, summaries: value.summaries }, null, 2));
          NODE

      - name: Verify exact live Production boundaries and metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          for path in / /shop /cart /account/signup /account/login /shipping /returns /buyer-protection; do
            file="${path//\//-}"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 120 --output "$EVIDENCE_DIR/custom-${file}.html" --write-out '%{http_code}' "https://truelycollectables.com$path")"
            test "$code" = "200"
          done
          admin_code="$(curl --silent --show-error --output "$EVIDENCE_DIR/custom-admin.html" --write-out '%{http_code}' https://truelycollectables.com/admin)"
          login_code="$(curl --location --silent --show-error --output "$EVIDENCE_DIR/custom-admin-login.html" --write-out '%{http_code}' https://truelycollectables.com/admin/login)"
          webhook_code="$(curl --silent --show-error --request POST --header 'Content-Type: application/json' --data '{}' --output "$EVIDENCE_DIR/custom-webhook.json" --write-out '%{http_code}' https://truelycollectables.com/api/webhook)"
          test "$admin_code" = "307"
          test "$login_code" = "200"
          test "$webhook_code" = "400" -o "$webhook_code" = "401"
          grep -Fq 'Admin Login' "$EVIDENCE_DIR/custom-admin-login.html"
          grep -Fq 'rel="canonical" href="https://truelycollectables.com/cart"' "$EVIDENCE_DIR/custom--cart.html"
          grep -Fq 'rel="canonical" href="https://truelycollectables.com/account/signup"' "$EVIDENCE_DIR/custom--account-signup.html"
          grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$EVIDENCE_DIR/custom--cart.html"
          grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$EVIDENCE_DIR/custom--account-signup.html"
          npx vercel@56.2.0 inspect https://truelycollectables.com --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-custom-domain-inspect.txt" 2>&1
          node - <<'NODE'
          const fs = require('node:fs');
          const deploymentUrl = fs.readFileSync(process.env.EVIDENCE_DIR + '/exact-production-deployment-url.txt', 'utf8').trim();
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/current-source.json', JSON.stringify({
            mainSha: process.env.EXPECTED_MAIN_SHA,
            productionDeploymentSourceSha: process.env.EXPECTED_MAIN_SHA,
            signedDeploymentRunId: Number(process.env.DEPLOY_RUN_ID),
            signedDeploymentArtifact: process.env.DEPLOY_ARTIFACT,
            signedDeploymentArtifactDigest: process.env.DEPLOY_ARTIFACT_DIGEST,
            exactProductionDeployment: deploymentUrl,
            verifiedAt: new Date().toISOString(),
          }, null, 2));
          NODE

      - name: Run strict custom-domain Lighthouse suite
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://truelycollectables.com/"
            "https://truelycollectables.com/shop"
            "https://truelycollectables.com/account/signup"
            "https://truelycollectables.com/cart"
          )
          names=(home shop signup cart)
          for index in "${!urls[@]}"; do
            npx --yes lighthouse@12.8.2 "${urls[$index]}" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="$EVIDENCE_DIR/lighthouse-${names[$index]}.json" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pages = [['home', true], ['shop', true], ['signup', false], ['cart', false]];
          const rows = [];
          const blockers = [];
          for (const [name, indexable] of pages) {
            const report = JSON.parse(fs.readFileSync(path.join(process.env.EVIDENCE_DIR, `lighthouse-${name}.json`), 'utf8'));
            const category = (id) => Math.round((report.categories[id]?.score || 0) * 100);
            const audit = (id) => report.audits[id];
            const row = {
              page: name,
              performance: category('performance'),
              accessibility: category('accessibility'),
              bestPractices: category('best-practices'),
              seo: category('seo'),
              crawlable: audit('is-crawlable')?.score,
              canonical: audit('canonical')?.score,
              selectName: audit('select-name')?.score,
              labelContentNameMismatch: audit('label-content-name-mismatch')?.score,
              labelContentFailingNodes: audit('label-content-name-mismatch')?.details?.items?.length || 0,
            };
            rows.push(row);
            if (row.accessibility !== 100) blockers.push(`${name}: accessibility ${row.accessibility}`);
            if (row.bestPractices < 90) blockers.push(`${name}: best practices ${row.bestPractices}`);
            if (row.canonical !== 1) blockers.push(`${name}: canonical failed`);
            if (indexable) {
              if (row.seo < 95) blockers.push(`${name}: SEO ${row.seo}`);
              if (row.crawlable !== 1) blockers.push(`${name}: not crawlable`);
            } else if (row.crawlable !== 0) blockers.push(`${name}: transactional page is not intentionally noindex`);
            if (name === 'shop' && row.selectName !== 1) blockers.push('shop: select-name failed');
            if (![1, null, undefined].includes(row.labelContentNameMismatch) || row.labelContentFailingNodes !== 0) blockers.push(`${name}: visible-label accessible-name failure`);
          }
          fs.writeFileSync(path.join(process.env.EVIDENCE_DIR, 'lighthouse-summary.json'), JSON.stringify({ rows, blockers }, null, 2));
          if (blockers.length) throw new Error(`Lighthouse blockers: ${JSON.stringify(blockers)}`);
          NODE

      - name: Assemble exact final Launch 2 certificate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.EVIDENCE_DIR;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
          const source = read('current-source.json');
          const audit = read('current-npm-audit-summary.json');
          const simulations = read('current-simulation-summary.json');
          const live = read('live-production-summary.json');
          const runtime = read('runtime-summary.json');
          const lighthouse = read('lighthouse-summary.json');
          const blockers = [];
          if (source.mainSha !== process.env.EXPECTED_MAIN_SHA || source.productionDeploymentSourceSha !== process.env.EXPECTED_MAIN_SHA) blockers.push('Exact source mismatch.');
          if ((audit.high || 0) !== 0 || (audit.critical || 0) !== 0) blockers.push('High or critical npm advisories remain.');
          if (simulations.failures?.length) blockers.push('Current simulation failures remain.');
          if (live.blockers !== 0) blockers.push('Live Production blockers remain.');
          if (runtime.blockers !== 0) blockers.push('Runtime integration blockers remain.');
          if (lighthouse.blockers?.length) blockers.push('Lighthouse blockers remain.');
          const result = blockers.length ? 'BLOCKED' : 'PASS';
          const certificate = {
            schema: 'truelycollectables.launch2.finalProductionCertificate.ad575.v1',
            result,
            generatedAt: new Date().toISOString(),
            exactMainSha: process.env.EXPECTED_MAIN_SHA,
            exactProductionDeployment: source.exactProductionDeployment,
            signedDeploymentEvidence: {
              runId: source.signedDeploymentRunId,
              artifact: source.signedDeploymentArtifact,
              digest: source.signedDeploymentArtifactDigest,
            },
            gates: {
              trackedSourceSecretScan: 'PASS',
              privilegedRouteProtection: 'PASS',
              npmHighCritical: audit,
              allSixCurrentSimulationShards: simulations,
              lint: 'PASS',
              typeScript: 'PASS',
              productionBuild: 'PASS',
              liveProductionCrawlAndAccess: live,
              runtimeIntegrationsAndData: runtime,
              exactDeploymentAndBoundaries: 'PASS',
              lighthouse,
            },
            blockers,
            separateUnperformedRealWorldProofs: {
              controlledRealMoneyCharge: false,
              physicalDelivery: false,
              postagePurchase: false,
              carrierAcceptanceScan: false,
              refund: false,
              dispute: false,
              customerOrOwnerInboxReceipt: false,
            },
          };
          fs.writeFileSync(path.join(dir, 'final-launch-2-certificate.json'), JSON.stringify(certificate, null, 2));
          fs.writeFileSync(path.join(dir, 'final-launch-2-certificate.md'), [
            '# TruelyCollectables.com Launch 2.0 final Production certificate',
            '',
            `**Result: ${result}**`,
            '',
            `- Exact main SHA: \`${certificate.exactMainSha}\``,
            `- Exact Production deployment: ${certificate.exactProductionDeployment}`,
            `- Signed deployment run: ${certificate.signedDeploymentEvidence.runId}`,
            `- Signed artifact: ${certificate.signedDeploymentEvidence.artifact}`,
            `- Artifact digest: \`${certificate.signedDeploymentEvidence.digest}\``,
            `- npm audit: ${audit.high || 0} high, ${audit.critical || 0} critical, ${audit.moderate || 0} moderate`,
            `- Current simulation reports: ${simulations.reports}; failures: ${simulations.failures.length}`,
            `- Runtime warnings: ${runtime.warnings}`,
            '',
            '## Lighthouse',
            ...lighthouse.rows.map((row) => `- ${row.page}: Performance ${row.performance}, Accessibility ${row.accessibility}, Best Practices ${row.bestPractices}, SEO ${row.seo}, crawlable ${row.crawlable}, canonical ${row.canonical}`),
            '',
            '## Blockers',
            ...(blockers.length ? blockers.map((value) => `- ${value}`) : ['- None']),
            '',
            'Real-money charge, physical delivery, postage, carrier acceptance, refund, dispute, and customer/owner inbox receipt were not manufactured and are not claimed.',
          ].join('\n') + '\n');
          if (result !== 'PASS') process.exit(1);
          NODE

      - name: Remove disposable credential-bound runtime deployment
        if: always()
        env:
          AUDIT_URL: ${{ steps.runtime.outputs.url }}
        shell: bash
        run: |
          set +e
          if [ -n "${AUDIT_URL:-}" ]; then
            npx vercel@56.2.0 remove "$AUDIT_URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/runtime-deployment-removal.log" 2>&1
          fi
          rm -rf src/app/api/internal/launch-audit-runtime-20260729
          rm -f scripts/.final-launch-audit-runner-20260729.mjs
          exit 0

      - name: Upload sanitized exact final certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truely-launch-2-final-production-certificate-ad575
          path: .audit/launch-2-final-ad575
          if-no-files-found: error
          retention-days: 90
