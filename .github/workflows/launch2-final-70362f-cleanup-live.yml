name: Launch 2 Final 70362f Cleanup Live

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/launch2-final-70362f-cleanup-live.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch2-final-70362f-cleanup-live
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 70362f6181e7a1ff019d43f51481ee8ef3c25963
  EXPECTED_BRANCH: ops/launch2-final-70362f-20260730
  VERCEL_SCOPE: truelycollectables-projects
  PROJECT_REF: rfdzsoykhnngzdnvzlhz
  EVIDENCE_DIR: .audit/launch2-final-70362f-cleanup-live

jobs:
  cleanup-and-live:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/launch2-final-70362f-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Pin exact main and operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = ".github/workflows/launch2-final-70362f-app-email.yml"
          test "${changed[1]}" = ".github/workflows/launch2-final-70362f-cleanup-live.yml"
          test "${changed[2]}" = ".github/workflows/launch2-final-70362f-email.yml"
          test "${changed[3]}" = ".github/workflows/launch2-final-70362f.yml"
          test -n "${VERCEL_TOKEN:-}" && test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/launch2-cleanup-live"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"

      - name: Remove residual controlled test records and verify credential restoration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const endpoint=`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`;
          const request=async(query,readOnly=false)=>{const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({query,parameters:[],read_only:readOnly})});const text=await response.text();if(!response.ok)throw new Error(`Supabase ${response.status}: ${text.slice(0,900)}`);return text?JSON.parse(text):[]};
          await request(`begin;
            delete from public.order_notification_deliveries where order_id=7 and recipient_email in ('truelycollectables+launch-buyer@gmail.com','truelycollectables+launch-owner@gmail.com');
            delete from public.order_items where order_id=7 and title='Launch Audit Card — Email Rendering Test';
            delete from public.orders where id=7 and customer_email='truelycollectables+launch-buyer@gmail.com' and stripe_session_id like 'cs_test_launch_%';
            commit;`);
          const rows=await request(`select json_build_object(
            'test_order_rows',(select count(*) from public.orders where customer_email='truelycollectables+launch-buyer@gmail.com' and stripe_session_id like 'cs_test_launch_%'),
            'test_item_rows',(select count(*) from public.order_items where order_id=7 and title='Launch Audit Card — Email Rendering Test'),
            'test_notification_rows',(select count(*) from public.order_notification_deliveries where order_id=7 and recipient_email in ('truelycollectables+launch-buyer@gmail.com','truelycollectables+launch-owner@gmail.com')),
            'temporary_credential_absent',coalesce((select not ((metadata->'admin_auth_v1'->>'passwordUpdatedAt')::timestamptz between '2026-07-30T06:43:45Z'::timestamptz and '2026-07-30T06:44:30Z'::timestamptz) from public.store_settings where store_id='00000000-0000-4000-8000-000000000001'),true),
            'negative_products',(select count(*) from public.products where quantity<0 or price<0),
            'captured_at',now()) receipt;`,true);
          const receipt=rows?.[0]?.receipt||rows;
          for(const key of ['test_order_rows','test_item_rows','test_notification_rows','negative_products']) if(Number(receipt[key])!==0) throw new Error(`${key}=${receipt[key]}`);
          if(receipt.temporary_credential_absent!==true) throw new Error('Temporary audit admin credential is still active.');
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+process.env.EVIDENCE_DIR+'/residual-cleanup-receipt.json',JSON.stringify({ok:true,orderId:7,exactMainSha:process.env.EXPECTED_MAIN_SHA,receipt,verifiedAt:new Date().toISOString()},null,2));
          NODE

      - name: Verify exact Production deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.2.0 inspect https://truely-collectables-gugzaemni-truelycollectables-projects.vercel.app --wait --timeout=10m --no-color --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/deployment-inspect.txt"
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/truely-collectables-gugzaemni-truelycollectables-projects.vercel.app?slug=$VERCEL_SCOPE" > "$RUNNER_TEMP/launch2-cleanup-live/deployment.json"
          FILE="$RUNNER_TEMP/launch2-cleanup-live/deployment.json" OUT="$EVIDENCE_DIR/deployment-receipt.json" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const aliases=Array.isArray(value.alias)?value.alias:(Array.isArray(value.aliases)?value.aliases:[]);
          const sha=String(value?.meta?.githubCommitSha||'');
          if(String(value.target).toLowerCase()!=='production'||String(value.readyState).toUpperCase()!=='READY'||sha!==process.env.EXPECTED_MAIN_SHA||!aliases.includes('truelycollectables.com')) throw new Error(`Exact Production metadata failed ${JSON.stringify({target:value.target,readyState:value.readyState,sha,aliases})}`);
          fs.writeFileSync(process.env.OUT,JSON.stringify({ok:true,deploymentId:value.id,deploymentHost:value.url,exactMainSha:sha,customDomainAlias:'truelycollectables.com',verifiedAt:new Date().toISOString()},null,2));
          NODE
          rm -f "$RUNNER_TEMP/launch2-cleanup-live/deployment.json"

      - name: Verify live customer routes product navigation and protected boundaries
        shell: bash
        run: |
          set -euo pipefail
          routes=(/ /shop /cart /account /account/signup /account/login /shipping /returns /buyer-protection /contact /terms /privacy)
          printf '{"routes":[' > "$EVIDENCE_DIR/live-route-crawl.json"
          first=true
          for route in "${routes[@]}"; do
            code="$(curl -L -sS --max-time 45 -o /dev/null -w '%{http_code}' "https://truelycollectables.com$route")"
            $first || printf ',' >> "$EVIDENCE_DIR/live-route-crawl.json"
            first=false
            printf '{"route":"%s","status":%s}' "$route" "$code" >> "$EVIDENCE_DIR/live-route-crawl.json"
            test "$code" = 200
          done
          printf '],"exactMainSha":"%s","verifiedAt":"%s"}\n' "$EXPECTED_MAIN_SHA" "$(date -u +%FT%TZ)" >> "$EVIDENCE_DIR/live-route-crawl.json"
          shop_html="$(curl -L -sS --max-time 45 https://truelycollectables.com/shop)"
          product_path="$(printf '%s' "$shop_html" | grep -oE 'href="/product/[^"]+' | head -n1 | cut -d'"' -f2 || true)"
          test -n "$product_path"
          test "$(curl -L -sS --max-time 45 -o /dev/null -w '%{http_code}' "https://truelycollectables.com$product_path")" = 200
          for path in /admin /admin/orders /admin/products /api/admin/order-notifications/retry /api/admin/orders/mark-fulfilled; do
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "https://truelycollectables.com$path" || true)"
            case "$code" in 301|302|303|307|308|401|403|405) ;; *) echo "Unsigned privileged boundary failed $path HTTP $code" >&2; exit 1;; esac
          done
          webhook="$(curl -sS --max-time 30 -X POST -H 'content-type: application/json' --data '{}' -o /dev/null -w '%{http_code}' https://truelycollectables.com/api/webhook || true)"
          test "$webhook" != 200
          printf '{"productPath":"%s","unsignedWebhook":%s,"privilegedRoutesProtected":true,"verifiedAt":"%s"}\n' "$product_path" "$webhook" "$(date -u +%FT%TZ)" > "$EVIDENCE_DIR/live-boundary-receipt.json"

      - name: Run Production Lighthouse gates
        shell: bash
        run: |
          set -euo pipefail
          npm install --global lighthouse@12.8.2 >/dev/null
          for spec in home:/ shop:/shop signup:/account/signup cart:/cart; do
            page="${spec%%:*}"
            path="${spec#*:}"
            lighthouse "https://truelycollectables.com$path" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --output=json --output-path="$EVIDENCE_DIR/lighthouse-$page.json"
          done
          EVIDENCE="$EVIDENCE_DIR" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const receipt={ok:true,pages:{},verifiedAt:new Date().toISOString()};
          for(const page of ['home','shop','signup','cart']){const report=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE}/lighthouse-${page}.json`,'utf8'));const categories=report.categories;const scores={performance:categories.performance.score,accessibility:categories.accessibility.score,bestPractices:categories['best-practices'].score,seo:categories.seo.score};if(scores.performance<.70||scores.accessibility<.95||scores.bestPractices<.95)throw new Error(`${page} Lighthouse blocker ${JSON.stringify(scores)}`);if(['home','shop'].includes(page)&&scores.seo<.95)throw new Error(`${page} SEO blocker ${scores.seo}`);receipt.pages[page]=scores;}
          fs.writeFileSync(`${process.env.EVIDENCE}/lighthouse-summary.json`,JSON.stringify(receipt,null,2));
          NODE

      - name: Write cleanup and live exact Production certificate
        shell: bash
        run: |
          cat > "$EVIDENCE_DIR/cleanup-live-certificate.json" <<EOF
          {
            "schema":"truelycollectables.launch2CleanupLiveCertificate.v1",
            "status":"PASS",
            "exactProductionSha":"$EXPECTED_MAIN_SHA",
            "productionDeployment":"https://truely-collectables-gugzaemni-truelycollectables-projects.vercel.app",
            "baseCertificateRun":30519570854,
            "baseCertificateArtifact":8750313615,
            "appEmailRun":30520485785,
            "appEmailArtifact":8750541430,
            "controlledProductionAppEmailsSent":6,
            "idempotentReplayDispatches":6,
            "temporaryCredentialRestored":true,
            "residualTestDatabaseRecords":0,
            "liveRoutesAndBoundariesPassed":true,
            "lighthousePassed":true,
            "gmailReceiptInspectionPending":true,
            "realMoneyCharge":false,
            "realPostagePurchase":false,
            "carrierAcceptanceScan":false,
            "physicalDelivery":false,
            "refundOrDispute":false,
            "certifiedAt":"$(date -u +%FT%TZ)"
          }
          EOF

      - name: Upload sanitized cleanup and live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-final-70362f-cleanup-live-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
