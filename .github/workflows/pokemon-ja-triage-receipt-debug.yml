name: Pokémon Japanese Triage Receipt Debug

on:
  pull_request:
    paths:
      - ".github/workflows/pokemon-ja-triage-receipt-debug.yml"
      - "scripts/finalize-pokemon-japanese-official-verification.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-triage-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out current TCGdex source
        run: >-
          git clone --depth 1
          https://github.com/tcgdex/cards-database.git
          .codex-run/tcgdex-cards-database

      - name: Build Japanese Registry bundles
        run: >-
          npx tsx scripts/build-tcgdex-japanese-registry-bundles.ts
          .codex-run/tcgdex-cards-database
          .codex-run/tcgdex-ja-registry-bundles
          --receipt .codex-run/tcgdex-ja-build-receipt.json

      - name: Recheck the ten reported hard mismatches
        run: >-
          npx tsx scripts/run-pokemon-japanese-official-verification.ts
          .codex-run/tcgdex-ja-registry-bundles
          --set M-P
          --set MC
          --set SV1a
          --set SV1S
          --set SV1V
          --set SV5K
          --set SV8
          --set SVK
          --set SVLN
          --set SVLS
          --delay-ms 75
          --detail-samples 3
          --receipt .codex-run/pokemon-ja-triage-official-receipt.json
          --queue .codex-run/pokemon-ja-triage-official-queue.json

      - name: Upload triage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-triage-receipt
          path: |
            .codex-run/pokemon-ja-triage-official-receipt.json
            .codex-run/pokemon-ja-triage-official-queue.json
          if-no-files-found: error
