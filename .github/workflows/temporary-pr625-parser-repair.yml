name: Temporary PR 625 Parser Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Synchronize certified main and season source files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main agent/import-2025-26-upper-deck-hockey
          git merge --no-edit origin/main
          git checkout origin/agent/import-2025-26-upper-deck-hockey -- \
            .github/workflows/import-upper-deck-2025-26-hockey.yml \
            scripts/import-upper-deck-2025-26-hockey.ts \
            src/lib/checklist-registry/server.ts \
            src/lib/checklist-registry/upper-deck-artifacts-official-html.ts \
            src/lib/checklist-registry/upper-deck-black-diamond-official-html.ts \
            src/lib/checklist-registry/upper-deck-mvp-official-html.ts \
            src/lib/checklist-registry/upper-deck-team-canada-official-html.ts \
            src/lib/checklist-registry/upper-deck-tim-hortons-official-html.ts
      - name: Apply bounded official-source parser repairs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const parserPath = 'src/lib/checklist-registry/upper-deck-html.ts';
          let parser = fs.readFileSync(parserPath, 'utf8');

          parser = parser.replace(
            'return normalized.includes("setname") && normalized.includes("card");',
            'return normalized.includes("setname") && (normalized.includes("card") || normalized.includes("cardnumber"));',
          );
          parser = parser.replace(
            'card: findHeaderIndex(table.headers, ["Card"]),',
            'card: findHeaderIndex(table.headers, ["Card", "Card Number"]),',
          );
          parser = parser.replace(
            'description: findHeaderIndex(table.headers, ["Description", "Player Name"]),',
            'description: findHeaderIndex(table.headers, ["Description", "Player Name", "Player"]),',
          );
          parser = parser.replace(
            '  const period = releasePeriod(title);',
            '  const releaseEvidence = `${title} ${artifact.originalFilename} ${artifact.sourceUrl}`;\n  const period = releasePeriod(releaseEvidence);',
          );

          const serialBefore = `  if (/\\b1\\s*(?:of|-|\\/)\\s*1\\b/i.test(normalized)) return 1;\n  if (/^\\/?\\d{1,7}$/.test(normalized)) {`;
          const serialAfter = `  if (/\\b1\\s*(?:of|-|\\/)\\s*1\\b/i.test(normalized)) return 1;\n  const numberedCopy = normalized.match(/^\\d{1,7}\\s+of\\s+(\\d{1,7})$/i);\n  if (numberedCopy) {\n    const result = Number.parseInt(numberedCopy[1], 10);\n    return result > 0 ? result : null;\n  }\n  if (/^\\/?\\d{1,7}$/.test(normalized)) {`;
          if (parser.includes(serialBefore)) parser = parser.replace(serialBefore, serialAfter);

          const variationBefore = `    const players = splitSubjects(row.description);\n    const teams = teamsFrom(row.teamCity, row.teamName);\n    const variation = buildVariation(row);`;
          const variationAfter = `    const players = splitSubjects(row.description);\n    const teams = teamsFrom(row.teamCity, row.teamName);\n    const baseVariation = buildVariation(row);\n    const requiresSubjectVariation =\n      (/o-pee-chee/i.test(product) &&\n        (/^playing cards$/i.test(setName) || /^p-\\d+$/i.test(row.cardNumber))) ||\n      (/chicago blackhawks 100th anniversary/i.test(product) &&\n        /^cs-[a-z0-9]+$/i.test(row.cardNumber));\n    const subjectVariation = requiresSubjectVariation\n      ? \`Subject: \${players\n          .slice()\n          .sort((left, right) => comparable(left).localeCompare(comparable(right)))\n          .join(" / ")}\`\n      : null;\n    const variation = [baseVariation, subjectVariation].filter(Boolean).join("; ") || null;`;
          if (parser.includes(variationBefore)) parser = parser.replace(variationBefore, variationAfter);

          for (const required of [
            'normalized.includes("cardnumber")',
            '["Description", "Player Name", "Player"]',
            'const releaseEvidence =',
            'const numberedCopy =',
            'chicago blackhawks 100th anniversary',
          ]) {
            if (!parser.includes(required)) throw new Error(`parser repair missing: ${required}`);
          }
          fs.writeFileSync(parserPath, parser);

          const regressionPath = 'scripts/run-checklist-registry-upper-deck-simulations.ts';
          let regression = fs.readFileSync(regressionPath, 'utf8');
          const marker = `scenario(\n  "all_identity_fingerprints_are_unique",`;
          if (!regression.includes(marker)) throw new Error('Upper Deck regression marker missing');

          if (!regression.includes('official_card_number_and_player_headers_are_supported')) {
            const block = `const alternateHeaderPlan = parseUpperDeckOfficialHtmlChecklist({\n  sourceUrl: "https://upperdeck.com/checklist/chicago-blackhawks-100th-anniversary-set-checklist-hobby/",\n  originalFilename: "2025-26-chicago-blackhawks-100th-hobby.html",\n  mimeType: "text/html",\n  retrievedAt: "2026-08-03T17:00:00.000Z",\n  authority: "official_manufacturer",\n  redistributionAllowed: false,\n  content: \`<!doctype html><html><body><h1>Chicago Blackhawks 100th Anniversary Set Checklist - HOBBY</h1><table><tbody>\n    <tr><th>Set Name</th><th>Card Number</th><th>Player</th><th>Auto</th><th>Mem/Tech</th><th>#'d</th><th>SP's</th><th>Odds</th><th>Pts.</th></tr>\n    <tr><td>Base Set</td><td>2</td><td>Connor Bedard</td><td></td><td></td><td>1 of 1926</td><td></td><td>5:1 h, 5:1 e</td><td>20</td></tr>\n  </tbody></table></body></html>\`,\n});\nscenario(\n  "official_card_number_and_player_headers_are_supported",\n  "Official Upper Deck header variants, source-pinned season metadata, and numbered-copy serial language parse deterministically.",\n  alternateHeaderPlan.validation.status === "passed" &&\n    alternateHeaderPlan.release.season === "2025-26" &&\n    alternateHeaderPlan.validation.counts.cards === 1 &&\n    alternateHeaderPlan.identities[0]?.fingerprint.normalized.serialRun === "/1926" &&\n    alternateHeaderPlan.cards[0]?.cardNumber === "2" &&\n    alternateHeaderPlan.cards[0]?.players[0] === "Connor Bedard",\n  { release: alternateHeaderPlan.release, counts: alternateHeaderPlan.validation.counts, issues: alternateHeaderPlan.validation.issues },\n);\n\n`;
            regression = regression.replace(marker, block + marker);
          }

          if (!regression.includes('chicago_cs_numbers_are_subject_disambiguated')) {
            const block = `const chicagoSubjectPlan = parseUpperDeckOfficialHtmlChecklist({\n  sourceUrl: "https://upperdeck.com/checklist/chicago-blackhawks-100th-anniversary-set-checklist-hobby/",\n  originalFilename: "2025-26-chicago-blackhawks-100th-hobby.html",\n  mimeType: "text/html",\n  retrievedAt: "2026-08-03T17:05:00.000Z",\n  authority: "official_manufacturer",\n  redistributionAllowed: false,\n  content: \`<!doctype html><html><body><h1>Chicago Blackhawks 100th Anniversary Set Checklist - HOBBY</h1><table><tbody>\n    <tr><th>Set Name</th><th>Card Number</th><th>Player</th><th>#'d</th></tr>\n    <tr><td>Base Set</td><td>CS-CC</td><td>Connor Bedard</td><td>1 of 1926</td></tr>\n    <tr><td>Base Set</td><td>CS-CC</td><td>Chris Chelios</td><td>1 of 1926</td></tr>\n  </tbody></table></body></html>\`,\n});\nscenario(\n  "chicago_cs_numbers_are_subject_disambiguated",\n  "The anniversary product preserves legitimate reused CS card numbers as distinct subject variations without weakening other duplicate checks.",\n  chicagoSubjectPlan.validation.status === "passed" &&\n    chicagoSubjectPlan.validation.counts.cards === 2 &&\n    chicagoSubjectPlan.validation.counts.identities === 2 &&\n    allUnique(chicagoSubjectPlan) &&\n    chicagoSubjectPlan.cards.every((card) => card.variation?.startsWith("Subject: ")),\n  { counts: chicagoSubjectPlan.validation.counts, issues: chicagoSubjectPlan.validation.issues, variations: chicagoSubjectPlan.cards.map((card) => card.variation) },\n);\n\n`;
            regression = regression.replace(marker, block + marker);
          }

          if (!regression.includes('opc_reused_numbers_are_subject_disambiguated')) {
            const block = `const opcReusedNumberPlan = parseUpperDeckOfficialHtmlChecklist({\n  sourceUrl: "https://upperdeck.com/checklist/2025-26-o-pee-chee-checklist/",\n  originalFilename: "2025-26-o-pee-chee-checklist.html",\n  mimeType: "text/html",\n  retrievedAt: "2026-08-03T16:45:00.000Z",\n  authority: "official_manufacturer",\n  redistributionAllowed: false,\n  content: \`<!doctype html><html><body><h1>2025-26 O-Pee-Chee Checklist</h1><table><tbody>\n    <tr><th>Set Name</th><th>Card</th><th>Description</th></tr>\n    <tr><td>Playing Cards</td><td>9-CLUBS</td><td>Connor McDavid</td></tr>\n    <tr><td>Playing Cards</td><td>9-CLUBS</td><td>Nathan MacKinnon</td></tr>\n    <tr><td>Base Set</td><td>P-1</td><td>Connor McDavid Puzzle</td></tr>\n    <tr><td>Base Set</td><td>P-1</td><td>Sidney Crosby Puzzle</td></tr>\n  </tbody></table></body></html>\`,\n});\nscenario(\n  "opc_reused_numbers_are_subject_disambiguated",\n  "O-Pee-Chee playing cards and puzzle cards preserve legitimate reused printed numbers as distinct subject variations.",\n  opcReusedNumberPlan.validation.status === "passed" &&\n    opcReusedNumberPlan.validation.counts.cards === 4 &&\n    opcReusedNumberPlan.validation.counts.identities === 4 &&\n    allUnique(opcReusedNumberPlan) &&\n    opcReusedNumberPlan.cards.every((card) => card.variation?.startsWith("Subject: ")),\n  { counts: opcReusedNumberPlan.validation.counts, issues: opcReusedNumberPlan.validation.issues, variations: opcReusedNumberPlan.cards.map((card) => card.variation) },\n);\n\n`;
            regression = regression.replace(marker, block + marker);
          }
          fs.writeFileSync(regressionPath, regression);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate all official season sources
        run: |
          npx tsx scripts/run-checklist-registry-upper-deck-simulations.ts
          npx tsx scripts/import-upper-deck-2025-26-hockey.ts --output .upper-deck-work/2025-26-hockey-validation-receipt.json
          npx eslint src/lib/checklist-registry/upper-deck-html.ts src/lib/checklist-registry/upper-deck-*-official-html.ts src/lib/checklist-registry/server.ts scripts/run-checklist-registry-upper-deck-simulations.ts scripts/import-upper-deck-2025-26-hockey.ts
          npx tsc --noEmit
          node scripts/run-dependency-security-audit.mjs
          npm run build
      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/bootstrap-upper-deck-2025-26-hockey-clean.yml
          rm -f .github/workflows/temporary-pr625-parser-repair.yml
          git add -A
          git commit -m "feat: validate complete 2025-26 Upper Deck hockey season"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
