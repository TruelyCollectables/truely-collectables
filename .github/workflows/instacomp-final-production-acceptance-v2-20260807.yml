name: InstaComp Final Production Acceptance V2 20260807

on:
  push:
    branches:
      - ops/instacomp-final-production-acceptance-v2-20260807
    paths:
      - ".github/workflows/instacomp-final-production-acceptance-v2-20260807.yml"
      - "scripts/ops/run-instacomp-final-production-acceptance.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-final-production-acceptance-v2-20260807.yml"
      - "scripts/ops/run-instacomp-final-production-acceptance.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-final-production-acceptance-v2-20260807
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: ops/instacomp-final-production-acceptance-v2-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  EXPECTED_MAC_FINGERPRINT: 2770182734974db303a76c5c8a440bcfb75d430b5d6281ae3eda95bf6b5d1a32
  EVIDENCE_DIR: evidence/instacomp-final-production-acceptance-v2-20260807

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact frozen acceptance source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$EXPECTED_BRANCH)"
          git fetch origin main
          git merge-base --is-ancestor 8d733d6e26c298b3d8a9298f48785a12f5e29d89 HEAD
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/instacomp-final-production-acceptance-v2-20260807.yml' 'scripts/ops/run-instacomp-final-production-acceptance.mjs' | sort)"
          test "$changed" = "$expected"
          if git diff --name-only dc781cf690bc9adb389d605d2b2e896e71c20c5e..HEAD -- services/instacomp-ai/app/local_vision.py services/instacomp-ai/app/ollama.py | grep -q .; then
            echo "Mac vision source changed after the fingerprinted Mac update." >&2
            exit 2
          fi
          grep -Fq 'imageTruthArtifactId: 8994498762' scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'registryCandidateArtifactId: 8993929571' scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'registryIdentityId: "2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f"' scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'registryIdentityId: "bde0577b-72e8-4e59-8287-89aaf2f9e7e2"' scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'registryIdentityId: "c58ffc4f-e1c7-4cd9-b6e2-599af5a29044"' scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'registryIdentityId: "575556fe-fdd4-4083-baee-c5071ed3161f"' scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'registryIdentityId: "70ad307e-06bb-45c2-90ea-689b6e2f302e"' scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'receipt.testedCards === 5 && receipt.passedCards === 5' scripts/ops/run-instacomp-final-production-acceptance.mjs
          echo "acceptance_source=$(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and link exact Production project
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          mkdir -p "$RUNNER_TEMP/instacomp-final-acceptance-v2" "$EVIDENCE_DIR"

      - name: Resolve read-only Production database credential
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/instacomp-final-acceptance-v2/production.env"
          runtime_file="$RUNNER_TEMP/instacomp-final-acceptance-v2/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i < 1) continue;
            const key = line.slice(0, i).trim();
            let value = line.slice(i + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          (async () => {
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '').trim();
            if (!productionUrl) throw new Error('Missing Production Supabase URL');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, {
              headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Supabase key lookup HTTP ${response.status}: ${text.slice(0, 300)}`);
            const keys = text ? JSON.parse(text) : [];
            if (!Array.isArray(keys)) throw new Error('Supabase key lookup returned non-array payload');
            const value = (entry) => String(entry?.api_key || entry?.key || entry?.value || '');
            const modern = keys.find((entry) => /^sb_secret_/i.test(value(entry)));
            const legacy = keys.find((entry) => entry?.name === 'service_role' && /^eyJ/.test(value(entry))) ||
              keys.find((entry) => entry?.secret_jwt_template?.role === 'service_role' && /^eyJ/.test(value(entry)));
            const serverKey = value(modern || legacy);
            if (!serverKey) throw new Error('No Production Supabase server key found');
            console.log(`supabase_server_key_kind=${/^sb_secret_/i.test(serverKey) ? 'secret' : 'legacy_service_role'}`);
            console.log(`::add-mask::${productionUrl}`);
            console.log(`::add-mask::${serverKey}`);
            fs.writeFileSync(
              process.env.RUNTIME_ENV_PATH,
              `export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(productionUrl)}\n` +
              `export SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(serverKey)}\n`,
              { mode: 0o600 },
            );
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Provision temporary scoped scanner credential
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/instacomp-final-acceptance-v2/service-token"
          openssl rand -hex 32 > "$secret_file"
          chmod 600 "$secret_file"
          secret="$(cat "$secret_file")"
          echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$secret_file" >/dev/null
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-provisioned"

      - name: Remote Vercel Production deploy of exact acceptance revision
        shell: bash
        run: |
          set -uo pipefail
          log="$EVIDENCE_DIR/test-deploy.log"
          set +e
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Vercel acceptance deployment failed with exit status $status" >&2
            exit "$status"
          fi
          source_sha="$(git rev-parse HEAD)"
          grep -Fq "InstaComp release manifest bound to $source_sha." "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$log" | tail -n 1)"
          test -n "$url"
          printf '%s\n' "$url" > "$EVIDENCE_DIR/test-deploy-url.txt"
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v2/test-deployed"

      - name: Prove exact repaired Mac runtime through Production
        shell: bash
        run: |
          set -euo pipefail
          readiness="$EVIDENCE_DIR/readiness-before-scans.json"
          code=""
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?acceptance=v2&attempt=$attempt&ts=$(date +%s)")"
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"
          cat "$readiness"
          node - "$readiness" "$EXPECTED_MAC_FINGERPRINT" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = process.argv[3];
          for (const key of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) {
            if (body[key] !== true) throw new Error(`Production readiness failed: ${key}`);
          }
          if (body.runtimeSourceFingerprint !== expected) {
            throw new Error(`Mac fingerprint mismatch: ${body.runtimeSourceFingerprint || 'missing'}`);
          }
          NODE

      - name: Frozen five Production acceptance pass 1
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/instacomp-final-acceptance-v2/runtime-env.sh"
          token="$(cat "$RUNNER_TEMP/instacomp-final-acceptance-v2/service-token")"
          echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-1.json" pass-1

      - name: Frozen five Production acceptance pass 2
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/instacomp-final-acceptance-v2/runtime-env.sh"
          token="$(cat "$RUNNER_TEMP/instacomp-final-acceptance-v2/service-token")"
          echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-2.json" pass-2

      - name: Remove temporary Production scanner credential
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-provisioned" ]; then
            exit 0
          fi
          removed=0
          for attempt in 1 2 3; do
            if npx --yes vercel@56.2.0 env rm INSTACOMP_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
              removed=1
              break
            fi
            sleep 3
          done
          if [ "$removed" != "1" ]; then
            echo "Failed to remove temporary INSTACOMP_SERVICE_TOKEN after three attempts." >&2
            exit 2
          fi
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-removed"

      - name: Redeploy same tested revision clean
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-provisioned" ] && [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-removed" ]; then
            echo "Refusing clean deploy because temporary scanner credential removal is unproven." >&2
            exit 2
          fi
          if [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-provisioned" ]; then
            exit 0
          fi
          log="$EVIDENCE_DIR/clean-deploy.log"
          set +e
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Vercel clean redeployment failed with exit status $status" >&2
            exit "$status"
          fi
          source_sha="$(git rev-parse HEAD)"
          grep -Fq "InstaComp release manifest bound to $source_sha." "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$log" | tail -n 1)"
          test -n "$url"
          printf '%s\n' "$url" > "$EVIDENCE_DIR/clean-deploy-url.txt"
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v2/clean-deployed"

      - name: Prove clean Production and removed credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-provisioned" ] && [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v2/clean-deployed" ]; then
            echo "Clean Production deployment was not completed." >&2
            exit 2
          fi
          if [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v2/secret-provisioned" ]; then
            exit 0
          fi
          readiness="$EVIDENCE_DIR/readiness-clean.json"
          code=""
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?clean=v2&attempt=$attempt&ts=$(date +%s)")"
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"
          node - "$readiness" "$EXPECTED_MAC_FINGERPRINT" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.ok !== true || body.runtimeSourceFingerprint !== process.argv[3]) {
            throw new Error('Clean Production readiness/fingerprint failed');
          }
          NODE
          token="$(cat "$RUNNER_TEMP/instacomp-final-acceptance-v2/service-token")"
          echo "::add-mask::$token"
          auth_body="$EVIDENCE_DIR/removed-token-response.json"
          auth_code="$(curl -sS --max-time 30 -o "$auth_body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $token" -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
          if [ "$auth_code" != "401" ] && [ "$auth_code" != "403" ]; then
            echo "Temporary scanner credential still appears accepted; HTTP $auth_code" >&2
            cat "$auth_body" >&2 || true
            exit 2
          fi
          printf '{"ready":true,"runtimeSourceFingerprint":"%s","temporaryCredentialRemoved":true,"removedCredentialHttpStatus":%s}\n' "$EXPECTED_MAC_FINGERPRINT" "$auth_code" > "$EVIDENCE_DIR/clean-production.json"

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-final-production-acceptance-v2-20260807
          path: evidence/instacomp-final-production-acceptance-v2-20260807
          if-no-files-found: warn
          retention-days: 90

      - name: Remove local temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/instacomp-final-acceptance-v2"
          rm -f .env.local .env.production.local
