name: Ops Apply InstaComp Free Comp Learning Council 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/instacomp-free-comp-learning-council.trigger'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.ref == 'feature/instacomp-free-comp-learning-council-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instacomp-free-comp-learning-council-20260810
          fetch-depth: 0

      - name: Apply bounded source patch
        run: python scripts/ops/patch-instacomp-free-comp-learning-council-20260810.py

      - name: Reject malformed diff
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run teacher council regression
        run: npx tsx scripts/run-instacomp-teacher-market-provider-simulations.ts

      - name: Run teacher runtime regression
        run: npx tsx scripts/run-instacomp-teacher-runtime-status-simulations.ts

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Mac service dependencies
        working-directory: services/instacomp-ai
        run: python -m pip install -r requirements.txt

      - name: Run comp learning tests
        working-directory: services/instacomp-ai
        run: >-
          python -m pytest -q
          tests/test_teacher_comp_learning.py
          tests/test_teacher_comp_registry_binding.py
          tests/test_student_comp_learning.py

      - name: Remove one-shot branch patch machinery
        run: |
          rm -f .github/instacomp-free-comp-learning-council.trigger
          rm -f .github/workflows/ops-patch-instacomp-free-comp-learning-council-20260810.yml
          rm -f scripts/ops/patch-instacomp-free-comp-learning-council-20260810.py
          rm -f src/lib/instacomp-free-comp-learning-council.trigger

      - name: Commit validated source to feature branch
        run: |
          set -euo pipefail
          git config user.name 'TruelyCollectables'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build InstaComp free comp learning council'
          git push origin HEAD:feature/instacomp-free-comp-learning-council-20260810
