name: Encrypted Production Secrets Backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-production-secrets-backup.yml'
      - '.github/encrypted-production-secrets-backup-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-encrypted-production-secrets-backup
  cancel-in-progress: false

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  BACKUP_GH_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BACKUP_GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  BACKUP_GH_CRON_SECRET: ${{ secrets.CRON_SECRET }}
  BACKUP_GH_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  BACKUP_GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  BACKUP_GH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  BACKUP_GH_TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
  BACKUP_GH_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  BACKUP_GH_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  BACKUP_GH_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  backup:
    name: Collect, encrypt, and package production credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require recovery credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN BACKUP_GH_CLOUDFLARE_ACCOUNT_ID BACKUP_GH_CLOUDFLARE_API_TOKEN BACKUP_GH_SUPABASE_ACCESS_TOKEN; do
            [ -n "${!key:-}" ] || { echo "Required backup credential is unavailable: $key"; exit 2; }
          done
          echo 'Required recovery credentials are available; values will not be printed.'

      - name: Install isolated backup tooling
        run: npm install --no-save --package-lock=false vercel@58.10.0 dotenv@latest

      - name: Preserve Vercel pause state and temporarily allow encrypted export
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl -sS --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?slug=$VERCEL_SCOPE" \
            -o /tmp/vercel-before-backup.json
          node <<'NODE'
          const fs = require('node:fs');
          const project = JSON.parse(fs.readFileSync('/tmp/vercel-before-backup.json', 'utf8'));
          if (!project.id) throw new Error('Vercel project was not resolved.');
          const paused = Boolean(project.paused || project.pausedAt);
          fs.writeFileSync('/tmp/vercel-backup-project-id', String(project.id), { mode: 0o600 });
          fs.writeFileSync('/tmp/vercel-backup-was-paused', paused ? '1' : '0', { mode: 0o600 });
          console.log('Vercel state captured; initiallyPaused=' + paused);
          NODE
          if [ "$(cat /tmp/vercel-backup-was-paused)" = '1' ]; then
            project=$(cat /tmp/vercel-backup-project-id)
            curl -sS --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
              "https://api.vercel.com/v1/projects/$project/unpause?slug=$VERCEL_SCOPE" \
              -o /tmp/vercel-backup-unpause.json
            sleep 8
          fi

      - name: Recover every configured application variable without logging values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color >/dev/null
          npx vercel env pull /tmp/vercel-production-variable-names.env \
            --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes --no-color >/dev/null

          EXPORT_KEY=$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")
          echo "::add-mask::$EXPORT_KEY"
          export EXPORT_KEY
          printf '%s' "$EXPORT_KEY" > /tmp/vercel-backup-export-key
          DEPLOYMENT_URL=$(npx vercel deploy --prod --skip-domain --yes \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            --env "TCOS_CF_SECRET_EXPORT_KEY=$EXPORT_KEY" --no-color)
          printf '%s' "$DEPLOYMENT_URL" | grep -qE '^https://[^[:space:]]+\.vercel\.app$' || {
            echo 'Encrypted export deployment did not return a valid URL.'; exit 3;
          }
          printf '%s' "$DEPLOYMENT_URL" > /tmp/vercel-backup-staged-url
          export DEPLOYMENT_URL

          node <<'NODE'
          const fs = require('node:fs');
          const dotenv = require('dotenv');
          const parsed = dotenv.parse(fs.readFileSync('/tmp/vercel-production-variable-names.env'));
          const platformPrefixes = ['VERCEL_', 'AWS_', 'GITHUB_', 'ACTIONS_', 'RUNNER_'];
          const platformExact = new Set([
            'PATH', 'HOME', 'PWD', 'OLDPWD', 'SHELL', 'USER', 'LOGNAME', 'HOSTNAME',
            'NODE_ENV', 'NODE_VERSION', 'NPM_CONFIG_PREFIX', 'NPM_CONFIG_USERCONFIG',
            'NX_DAEMON', 'TURBO_CACHE', 'TURBO_DOWNLOAD_LOCAL_ENABLED',
            'TURBO_REMOTE_ONLY', 'TURBO_RUN_SUMMARY',
          ]);
          const names = Object.keys(parsed)
            .filter((name) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(name))
            .filter((name) => !platformPrefixes.some((prefix) => name.startsWith(prefix)))
            .filter((name) => !platformExact.has(name))
            .filter((name) => name !== 'TCOS_CF_SECRET_EXPORT_KEY')
            .sort();
          if (!names.length) throw new Error('No Vercel Production application variable names were resolved.');
          fs.writeFileSync('/tmp/encrypted-export-request.json', JSON.stringify({ names }), { mode: 0o600 });
          fs.writeFileSync('/tmp/vercel-expected-variable-names.json', JSON.stringify(names), { mode: 0o600 });
          console.log('Encrypted export requested for ' + names.length + ' configured application variable(s).');
          NODE

          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 45 \
            "$DEPLOYMENT_URL/api/internal/cloudflare-secret-export" -X POST \
            -H "Authorization: Bearer $EXPORT_KEY" \
            -H 'X-TCOS-Secret-Export-Confirm: truely-cloudflare-cutover-v1' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/encrypted-export-request.json \
            -o /tmp/encrypted-export-response.json

      - name: Build complete plaintext recovery payload in runner memory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const { createDecipheriv, createHash } = require('node:crypto');

          const keyMaterial = fs.readFileSync('/tmp/vercel-backup-export-key', 'utf8');
          const envelope = JSON.parse(fs.readFileSync('/tmp/encrypted-export-response.json', 'utf8'));
          if (!envelope?.ok || envelope.version !== 1 || envelope.algorithm !== 'aes-256-gcm') {
            throw new Error('Encrypted export envelope is invalid.');
          }
          const key = createHash('sha256').update(keyMaterial, 'utf8').digest();
          const decipher = createDecipheriv('aes-256-gcm', key, Buffer.from(envelope.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
          const plaintext = Buffer.concat([
            decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
            decipher.final(),
          ]).toString('utf8');
          const exported = JSON.parse(plaintext);
          const vercelValues = exported?.values && typeof exported.values === 'object' ? exported.values : {};
          const expectedNames = JSON.parse(fs.readFileSync('/tmp/vercel-expected-variable-names.json', 'utf8'));
          const unavailable = Array.isArray(envelope.unavailableNames) ? envelope.unavailableNames : [];
          const missingVercel = expectedNames.filter((name) => !String(vercelValues[name] ?? ''));
          if (unavailable.length || missingVercel.length || Object.keys(vercelValues).length !== expectedNames.length) {
            throw new Error(
              'Vercel variable recovery was incomplete: expected=' + expectedNames.length +
              ' recovered=' + Object.keys(vercelValues).length +
              ' unavailable=' + unavailable.length +
              ' missing=' + missingVercel.length
            );
          }

          const githubEnvironmentMap = {
            CLOUDFLARE_ACCOUNT_ID: 'BACKUP_GH_CLOUDFLARE_ACCOUNT_ID',
            CLOUDFLARE_API_TOKEN: 'BACKUP_GH_CLOUDFLARE_API_TOKEN',
            CRON_SECRET: 'BACKUP_GH_CRON_SECRET',
            NEXT_PUBLIC_SUPABASE_URL: 'BACKUP_GH_NEXT_PUBLIC_SUPABASE_URL',
            SUPABASE_ACCESS_TOKEN: 'BACKUP_GH_SUPABASE_ACCESS_TOKEN',
            SUPABASE_SERVICE_ROLE_KEY: 'BACKUP_GH_SUPABASE_SERVICE_ROLE_KEY',
            TCOS_CRON_SECRET: 'BACKUP_GH_TCOS_CRON_SECRET',
            VERCEL_ORG_ID: 'BACKUP_GH_VERCEL_ORG_ID',
            VERCEL_PROJECT_ID: 'BACKUP_GH_VERCEL_PROJECT_ID',
            VERCEL_TOKEN: 'BACKUP_GH_VERCEL_TOKEN',
          };
          const githubValues = {};
          const githubUnavailable = [];
          for (const [name, environmentName] of Object.entries(githubEnvironmentMap)) {
            const value = String(process.env[environmentName] || '');
            if (value) {
              githubValues[name] = value;
            } else {
              githubUnavailable.push(name);
            }
          }
          for (const required of ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'SUPABASE_ACCESS_TOKEN', 'VERCEL_TOKEN']) {
            if (!githubValues[required]) throw new Error('Required GitHub recovery credential is unavailable: ' + required);
          }

          const payload = {
            schema: 'tcos.production-secrets-backup.v1',
            createdAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            sources: {
              vercelProductionApplicationVariables: vercelValues,
              githubActionsReferencedSecrets: githubValues,
            },
            coverage: {
              vercelConfiguredNames: expectedNames.length,
              vercelRecoveredNames: Object.keys(vercelValues).length,
              vercelUnavailableNames: unavailable,
              githubReferencedNames: Object.keys(githubEnvironmentMap).length,
              githubRecoveredNames: Object.keys(githubValues).length,
              githubUnavailableNames: githubUnavailable,
              cloudflareRecoveryBasis: 'The Vercel application values in this vault are the verified source values bulk-copied to the Cloudflare Worker.',
            },
          };
          fs.writeFileSync('/tmp/TruelyCollectables-production-secrets.json', JSON.stringify(payload, null, 2) + '\n', { mode: 0o600 });
          console.log(
            'Plaintext recovery payload assembled without printing values: Vercel=' +
            Object.keys(vercelValues).length + '/' + expectedNames.length +
            ', GitHub=' + Object.keys(githubValues).length + '/' + Object.keys(githubEnvironmentMap).length
          );
          NODE

      - name: Encrypt vault with a new offline recovery key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const { createCipheriv, createHash, randomBytes } = require('node:crypto');
          const plaintextPath = '/tmp/TruelyCollectables-production-secrets.json';
          const vaultPath = '/tmp/TruelyCollectables-production-secrets.tcosvault';
          const recoveryPath = '/tmp/TruelyCollectables-production-secrets.recovery-key.txt';
          const plaintext = fs.readFileSync(plaintextPath);
          const key = randomBytes(32);
          const iv = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
          const envelope = {
            format: 'tcos-secrets-vault',
            version: 1,
            cipher: 'aes-256-gcm',
            keyEncoding: 'base64url',
            iv: iv.toString('base64'),
            authenticationTag: cipher.getAuthTag().toString('base64'),
            ciphertext: ciphertext.toString('base64'),
            plaintextSha256: createHash('sha256').update(plaintext).digest('hex'),
            createdAt: new Date().toISOString(),
          };
          fs.writeFileSync(vaultPath, JSON.stringify(envelope) + '\n', { mode: 0o600 });
          fs.writeFileSync(
            recoveryPath,
            [
              'TRUELY COLLECTABLES PRODUCTION SECRETS RECOVERY KEY',
              'Keep this file offline and separate from the encrypted vault.',
              'keyEncoding: base64url',
              'key: ' + key.toString('base64url'),
              'vaultSha256: ' + createHash('sha256').update(fs.readFileSync(vaultPath)).digest('hex'),
              '',
            ].join('\n'),
            { mode: 0o600 }
          );
          console.log('AES-256-GCM vault created; no secret values were printed.');
          NODE
          shred -u /tmp/TruelyCollectables-production-secrets.json

      - name: Upload encrypted vault
        uses: actions/upload-artifact@v4
        with:
          name: truely-production-secrets-vault-${{ github.run_id }}
          path: /tmp/TruelyCollectables-production-secrets.tcosvault
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload separate recovery key
        uses: actions/upload-artifact@v4
        with:
          name: truely-production-secrets-recovery-key-${{ github.run_id }}
          path: /tmp/TruelyCollectables-production-secrets.recovery-key.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove staged export and restore paused state
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s /tmp/vercel-backup-staged-url ]; then
            npx vercel remove "$(cat /tmp/vercel-backup-staged-url)" --yes \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color >/tmp/vercel-backup-remove.log 2>&1
          fi
          if [ -s /tmp/vercel-backup-project-id ] && [ -s /tmp/vercel-backup-was-paused ] && [ "$(cat /tmp/vercel-backup-was-paused)" = '1' ]; then
            project=$(cat /tmp/vercel-backup-project-id)
            curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
              "https://api.vercel.com/v1/projects/$project/pause?slug=$VERCEL_SCOPE" >/tmp/vercel-backup-repause.json
          fi
          for path in \
            /tmp/vercel-production-variable-names.env \
            /tmp/encrypted-export-request.json \
            /tmp/vercel-expected-variable-names.json \
            /tmp/encrypted-export-response.json \
            /tmp/vercel-backup-export-key \
            /tmp/TruelyCollectables-production-secrets.json \
            /tmp/TruelyCollectables-production-secrets.tcosvault \
            /tmp/TruelyCollectables-production-secrets.recovery-key.txt; do
            [ -e "$path" ] && shred -u "$path"
          done
          echo 'Staged export removed, prior Vercel pause state restored, and runner files destroyed.'
