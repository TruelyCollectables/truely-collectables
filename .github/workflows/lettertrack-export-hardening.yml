name: LetterTrack Export Hardening

on:
  pull_request:
    paths:
      - "src/lib/lettertrack-export.ts"
      - "src/lib/lettertrack-shipstation.ts"
      - "src/app/api/admin/shipping/lettertrack-export/route.ts"
      - "src/app/api/admin/orders/*/lettertrack-postage/**"
      - "src/app/admin/orders/*/LetterTrackPostagePurchase.tsx"
      - "src/app/admin/orders/*/ShippingLabelActions.tsx"
      - "src/app/api/tcos/shipping-safety/route.ts"
      - "scripts/run-lettertrack-export-hardening-simulations.ts"
      - "scripts/run-lettertrack-shipstation-bridge-simulations.ts"
      - ".github/workflows/lettertrack-export-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run LetterTrack adversarial simulations
        run: node --import tsx scripts/run-lettertrack-export-hardening-simulations.ts
      - name: Run LetterTrack ShipStation bridge simulations
        run: node --import tsx scripts/run-lettertrack-shipstation-bridge-simulations.ts
      - name: TypeScript
        run: npx tsc --noEmit
