name: Patch List Regressions and Mobile Parser

on:
  push:
    branches: [agent/simplified-list-route]
    paths:
      - ".github/workflows/patch-list-regressions-and-mobile-parser.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplified-list-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact regression updates
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile = Path('src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx')
          text = mobile.read_text()
          old = 'const data = (await response.json()) as ScanResult;'
          new = 'const data = (await response.json().catch(() => ({}))) as ScanResult;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one mobile JSON parse, found {text.count(old)}')
          mobile.write_text(text.replace(old, new))

          simulation = Path('scripts/run-admin-product-status-simulations.mjs')
          text = simulation.read_text()
          read_anchor = '''const newProductPageSource = await readFile(\n  new URL("../src/app/admin/products/new/page.tsx", import.meta.url),\n  "utf8",\n);\n'''
          read_insert = read_anchor + '''const simplifiedListPageSource = await readFile(\n  new URL("../src/app/list/page.tsx", import.meta.url),\n  "utf8",\n);\nconst simplifiedListLayoutSource = await readFile(\n  new URL("../src/app/list/layout.tsx", import.meta.url),\n  "utf8",\n);\nconst simpleListDraftRouteSource = await readFile(\n  new URL("../src/app/api/admin/simple-list-drafts/route.ts", import.meta.url),\n  "utf8",\n);\n'''
          if text.count(read_anchor) != 1:
              raise SystemExit(f'Expected one new-product source anchor, found {text.count(read_anchor)}')
          text = text.replace(read_anchor, read_insert)

          start = text.index('scenario("new product intake keeps manual creation safe and professional", () => {')
          end = text.index('\nscenario("inventory engine enforces admin product status policy"', start)
          replacement = '''scenario("new product intake redirects to the protected simplified listing workspace", () => {\n  assert(\n    newProductPageSource.includes('redirect("/list")'),\n    "Expected the legacy new-product route to redirect to /list.",\n  );\n\n  for (const fragment of [\n    "SimpleListIntake",\n    "SimpleListingQueue",\n    "List Cards",\n    "Upload photos",\n    "Review and list selected",\n  ]) {\n    assert(\n      simplifiedListPageSource.includes(fragment),\n      `Expected simplified listing page fragment ${fragment}.`,\n    );\n  }\n\n  for (const fragment of [\n    "ADMIN_SESSION_COOKIE_NAMES",\n    "isValidAdminSessionValue",\n    "/admin/login",\n    'encodeURIComponent("/list")',\n  ]) {\n    assert(\n      simplifiedListLayoutSource.includes(fragment),\n      `Expected protected /list layout fragment ${fragment}.`,\n    );\n  }\n\n  for (const fragment of [\n    'actor.type !== "admin"',\n    "A front card photo is required.",\n    "Listing title is required.",\n    "Listing price must be greater than zero.",\n    "Quantity must be at least one.",\n    "createSellerDraftProduct",\n  ]) {\n    assert(\n      simpleListDraftRouteSource.includes(fragment),\n      `Expected simplified draft route fragment ${fragment}.`,\n    );\n  }\n});\n'''
          text = text[:start] + replacement + text[end:]
          simulation.write_text(text)
          PY
      - name: Validate corrected regressions
        run: |
          npm run simulate:admin-product-status
          npm run verify:admin-dashboard
          npx eslint src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx scripts/run-admin-product-status-simulations.mjs
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx scripts/run-admin-product-status-simulations.mjs
          git commit -m "Update list regressions and mobile scan error handling"
          git push origin HEAD:agent/simplified-list-route
