name: InstaComp Final Production Acceptance V3 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-final-production-acceptance-v3-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-final-production-acceptance-v3-20260807
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: ops/instacomp-final-production-acceptance-v3-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  EXPECTED_MAC_FINGERPRINT: dfc2dc241f61cd615b0811c68f7b843dd44c19e22fd29adc7d839ee1e62289cb
  SCANNER_REPAIR_COMMIT: 2249ce075d32c0cac9e074d8e4e5656830d05b79
  EVIDENCE_DIR: evidence/instacomp-final-production-acceptance-v3-20260807

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on synchronized frozen acceptance source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$EXPECTED_BRANCH)"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor "$SCANNER_REPAIR_COMMIT" HEAD
          if git diff --name-only "$SCANNER_REPAIR_COMMIT"..HEAD -- \
            services/instacomp-ai/app/local_vision.py \
            services/instacomp-ai/app/ollama.py | grep -q .; then
            echo "Mac runtime source changed after the fingerprinted scanner repair." >&2
            exit 2
          fi
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/instacomp-final-production-acceptance-v2-20260807.yml' \
            '.github/workflows/instacomp-final-production-acceptance-v3-20260807.yml' \
            'scripts/ops/run-instacomp-final-production-acceptance.mjs' | sort)"
          test "$changed" = "$expected"
          runner=scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'imageTruthArtifactId: 8994498762' "$runner"
          grep -Fq 'registryCandidateArtifactId: 8993929571' "$runner"
          grep -Fq 'registryIdentityId: "2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f"' "$runner"
          grep -Fq 'registryIdentityId: "bde0577b-72e8-4e59-8287-89aaf2f9e7e2"' "$runner"
          grep -Fq 'registryIdentityId: "c58ffc4f-e1c7-4cd9-b6e2-599af5a29044"' "$runner"
          grep -Fq 'registryIdentityId: "575556fe-fdd4-4083-baee-c5071ed3161f"' "$runner"
          grep -Fq 'registryIdentityId: "70ad307e-06bb-45c2-90ea-689b6e2f302e"' "$runner"
          grep -Fq 'receipt.testedCards === 5 && receipt.passedCards === 5' "$runner"
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/instacomp-final-acceptance-v3"
          echo "acceptance_source=$(git rev-parse HEAD)"

      - name: Read-only preflight - Production already sees repaired Mac
        shell: bash
        run: |
          set -euo pipefail
          readiness="$EVIDENCE_DIR/readiness-preflight.json"
          code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?acceptance=v3-preflight&ts=$(date +%s)")"
          test "$code" = "200"
          cat "$readiness"
          node - "$readiness" "$EXPECTED_MAC_FINGERPRINT" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const expected=process.argv[3];
          for (const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) {
            if (b[k] !== true) throw new Error(`Preflight failed: ${k}`);
          }
          if (b.runtimeSourceFingerprint !== expected) {
            throw new Error(`Preflight Mac fingerprint mismatch: ${b.runtimeSourceFingerprint || 'missing'}`);
          }
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and link exact Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          npm ci
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Resolve Production proof database credential and stale token state
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/instacomp-final-acceptance-v3/production.env"
          runtime_file="$RUNNER_TEMP/instacomp-final-acceptance-v3/runtime-env.sh"
          stale_file="$RUNNER_TEMP/instacomp-final-acceptance-v3/stale-service-token"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" STALE_TOKEN_PATH="$stale_file" node - <<'NODE'
          const fs=require('node:fs');
          const parsed={};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)) {
            const line=raw.trim(); if (!line || line.startsWith('#')) continue;
            const i=line.indexOf('='); if (i<1) continue;
            const key=line.slice(0,i).trim(); let value=line.slice(i+1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value=JSON.parse(value); } catch { value=value.slice(1,-1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value=value.slice(1,-1);
            parsed[key]=value;
          }
          const stale=String(parsed.INSTACOMP_SERVICE_TOKEN||'').trim();
          if (stale) fs.writeFileSync(process.env.STALE_TOKEN_PATH, stale, {mode:0o600});
          (async()=>{
            const productionUrl=String(parsed.NEXT_PUBLIC_SUPABASE_URL||'').trim();
            if (!productionUrl) throw new Error('Missing Production Supabase URL');
            const projectRef=new URL(productionUrl).hostname.split('.')[0];
            const r=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});
            const text=await r.text(); if (!r.ok) throw new Error(`Supabase key lookup HTTP ${r.status}: ${text.slice(0,300)}`);
            const keys=text?JSON.parse(text):[]; if (!Array.isArray(keys)) throw new Error('Supabase key response was not an array');
            const value=(e)=>String(e?.api_key||e?.key||e?.value||'');
            const modern=keys.find(e=>/^sb_secret_/i.test(value(e)));
            const legacy=keys.find(e=>e?.name==='service_role'&&/^eyJ/.test(value(e))) || keys.find(e=>e?.secret_jwt_template?.role==='service_role'&&/^eyJ/.test(value(e)));
            const serverKey=value(modern||legacy); if (!serverKey) throw new Error('No Production server key found');
            console.log(`::add-mask::${productionUrl}`); console.log(`::add-mask::${serverKey}`);
            fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(productionUrl)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(serverKey)}\n`,{mode:0o600});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Remove and prove any stale temporary scanner credential before test
        shell: bash
        run: |
          set -euo pipefail
          stale="$RUNNER_TEMP/instacomp-final-acceptance-v3/stale-service-token"
          if [ ! -s "$stale" ]; then
            echo "PASS  No stale INSTACOMP_SERVICE_TOKEN exists before acceptance."
            exit 0
          fi
          token="$(cat "$stale")"; echo "::add-mask::$token"
          echo "A stale temporary scanner credential exists; removing it before acceptance."
          npx --yes vercel@56.2.0 env rm INSTACOMP_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          body="$EVIDENCE_DIR/stale-token-response.json"
          code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $token" -F 'aiCouncilTier=basic' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "Stale temporary credential is still accepted; HTTP $code" >&2
            cat "$body" >&2 || true
            exit 2
          fi
          echo "PASS  Stale temporary credential removed and rejected with HTTP $code."

      - name: Provision fresh scoped scanner credential
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/instacomp-final-acceptance-v3/service-token"
          openssl rand -hex 32 > "$secret_file"; chmod 600 "$secret_file"
          secret="$(cat "$secret_file")"; echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$secret_file" >/dev/null
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v3/secret-provisioned"

      - name: Deploy synchronized acceptance revision to Production
        shell: bash
        run: |
          set -euo pipefail
          log="$EVIDENCE_DIR/test-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$log" | tail -n1)"; test -n "$url"
          printf '%s\n' "$url" > "$EVIDENCE_DIR/test-deploy-url.txt"
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v3/test-deployed"

      - name: Re-prove repaired Mac through deployed Production
        shell: bash
        run: |
          set -euo pipefail
          readiness="$EVIDENCE_DIR/readiness-before-scans.json"; code=""
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?acceptance=v3&attempt=$attempt&ts=$(date +%s)")"
            [ "$code" = "200" ] || { sleep 5; continue; }
            if node - "$readiness" "$EXPECTED_MAC_FINGERPRINT" <<'NODE'
            const fs=require('node:fs'); const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            if (b.runtimeSourceFingerprint!==process.argv[3]) process.exit(1);
            for (const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if (b[k]!==true) process.exit(1);
            NODE
            then break; fi
            sleep 5
          done
          test "$code" = "200"
          node - "$readiness" "$EXPECTED_MAC_FINGERPRINT" <<'NODE'
          const fs=require('node:fs'); const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (b.runtimeSourceFingerprint!==process.argv[3]) throw new Error('Mac fingerprint mismatch');
          for (const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if (b[k]!==true) throw new Error(`Readiness failed: ${k}`);
          NODE

      - name: Frozen five Production acceptance pass 1
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/instacomp-final-acceptance-v3/runtime-env.sh"
          token="$(cat "$RUNNER_TEMP/instacomp-final-acceptance-v3/service-token")"; echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-1.json" pass-1

      - name: Frozen five Production acceptance pass 2
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/instacomp-final-acceptance-v3/runtime-env.sh"
          token="$(cat "$RUNNER_TEMP/instacomp-final-acceptance-v3/service-token")"; echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-2.json" pass-2

      - name: Remove temporary Production scanner credential
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v3/secret-provisioned" ]; then exit 0; fi
          removed=0
          for attempt in 1 2 3; do
            if npx --yes vercel@56.2.0 env rm INSTACOMP_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then removed=1; break; fi
            sleep 3
          done
          [ "$removed" = "1" ] || { echo "Failed to remove temporary scanner credential." >&2; exit 2; }
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v3/secret-removed"

      - name: Redeploy same application source clean
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v3/secret-provisioned" ]; then exit 0; fi
          [ -f "$RUNNER_TEMP/instacomp-final-acceptance-v3/secret-removed" ] || { echo "Refusing clean deploy: token removal unproven." >&2; exit 2; }
          log="$EVIDENCE_DIR/clean-deploy.log"
          set +e
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}; set -e
          [ "$status" -eq 0 ] || exit "$status"
          touch "$RUNNER_TEMP/instacomp-final-acceptance-v3/clean-deployed"

      - name: Prove clean Production and dead temporary credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/instacomp-final-acceptance-v3/secret-provisioned" ]; then exit 0; fi
          [ -f "$RUNNER_TEMP/instacomp-final-acceptance-v3/clean-deployed" ] || { echo "Clean deploy did not complete." >&2; exit 2; }
          readiness="$EVIDENCE_DIR/readiness-clean.json"; code=""
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?clean=v3&attempt=$attempt&ts=$(date +%s)")"
            [ "$code" = "200" ] && break; sleep 5
          done
          test "$code" = "200"
          node - "$readiness" "$EXPECTED_MAC_FINGERPRINT" <<'NODE'
          const fs=require('node:fs'); const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (b.ok!==true || b.runtimeSourceFingerprint!==process.argv[3]) throw new Error('Clean Production readiness/fingerprint failed');
          NODE
          token="$(cat "$RUNNER_TEMP/instacomp-final-acceptance-v3/service-token")"; echo "::add-mask::$token"
          body="$EVIDENCE_DIR/removed-token-response.json"
          auth_code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $token" -F 'aiCouncilTier=basic' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
          if [ "$auth_code" != "401" ] && [ "$auth_code" != "403" ]; then
            echo "Temporary scanner credential is still accepted; HTTP $auth_code" >&2
            cat "$body" >&2 || true
            exit 2
          fi
          printf '{"ready":true,"runtimeSourceFingerprint":"%s","temporaryCredentialRemoved":true,"removedCredentialHttpStatus":%s}\n' "$EXPECTED_MAC_FINGERPRINT" "$auth_code" > "$EVIDENCE_DIR/clean-production.json"

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-final-production-acceptance-v3-20260807
          path: evidence/instacomp-final-production-acceptance-v3-20260807
          if-no-files-found: warn
          retention-days: 90

      - name: Remove local temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/instacomp-final-acceptance-v3"
          rm -f .env.local .env.production.local
