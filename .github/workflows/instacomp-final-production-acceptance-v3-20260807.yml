name: InstaComp Final Production Acceptance V3 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-final-production-acceptance-v3-20260807.yml"
      - "scripts/ops/run-instacomp-final-production-acceptance.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-final-production-acceptance-v3-20260807
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: ops/instacomp-final-production-acceptance-v3-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  EXPECTED_MAC_FINGERPRINT: dfc2dc241f61cd615b0811c68f7b843dd44c19e22fd29adc7d839ee1e62289cb
  SCANNER_REPAIR_COMMIT: 2249ce075d32c0cac9e074d8e4e5656830d05b79
  EVIDENCE_DIR: evidence/instacomp-final-production-acceptance-v3-20260807
  TEMP_DIR: /tmp/instacomp-final-production-acceptance-v3-20260807

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on synchronized frozen acceptance source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$EXPECTED_BRANCH)"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor "$SCANNER_REPAIR_COMMIT" HEAD
          if git diff --name-only "$SCANNER_REPAIR_COMMIT"..HEAD -- services/instacomp-ai/app/local_vision.py services/instacomp-ai/app/ollama.py | grep -q .; then
            echo "Mac runtime source changed after fingerprinted scanner repair." >&2
            exit 2
          fi
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/instacomp-final-production-acceptance-v3-20260807.yml' 'scripts/ops/run-instacomp-final-production-acceptance.mjs' | sort)"
          test "$changed" = "$expected"
          runner=scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'imageTruthArtifactId: 8994498762' "$runner"
          grep -Fq 'registryCandidateArtifactId: 8993929571' "$runner"
          grep -Fq 'registryIdentityId: "2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f"' "$runner"
          grep -Fq 'registryIdentityId: "bde0577b-72e8-4e59-8287-89aaf2f9e7e2"' "$runner"
          grep -Fq 'registryIdentityId: "c58ffc4f-e1c7-4cd9-b6e2-599af5a29044"' "$runner"
          grep -Fq 'registryIdentityId: "575556fe-fdd4-4083-baee-c5071ed3161f"' "$runner"
          grep -Fq 'registryIdentityId: "70ad307e-06bb-45c2-90ea-689b6e2f302e"' "$runner"
          grep -Fq 'receipt.testedCards === 5 && receipt.passedCards === 5' "$runner"
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR"
          echo "acceptance_source=$(git rev-parse HEAD)"

      - name: Read-only preflight exact repaired Mac through Production
        shell: bash
        run: |
          set -euo pipefail
          readiness="$EVIDENCE_DIR/readiness-preflight.json"
          code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?acceptance=v3-preflight&ts=$(date +%s)")"
          echo "readiness_http=$code"
          cat "$readiness"
          test "$code" = "200"
          node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const expected=process.argv[2];for(const k of ["ok","configured","reachable","internalMemoryReady","checklistReady","localModelReady"])if(b[k]!==true)throw new Error(`Preflight failed: ${k}=${b[k]}`);if(b.runtimeSourceFingerprint!==expected)throw new Error(`Fingerprint mismatch: ${b.runtimeSourceFingerprint}`);console.log(`PASS exact repaired Mac ${expected}`);' "$readiness" "$EXPECTED_MAC_FINGERPRINT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          npm ci
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Resolve Production Supabase proof credentials
        shell: bash
        run: |
          set -euo pipefail
          env_file="$TEMP_DIR/production.env"
          runtime_file="$TEMP_DIR/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node -e 'const fs=require("node:fs");const parsed={};for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,"utf8").split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith("#"))continue;const i=line.indexOf("=");if(i<1)continue;const key=line.slice(0,i).trim();let value=line.slice(i+1).trim();if(value.startsWith("\"")&&value.endsWith("\"")){try{value=JSON.parse(value)}catch{value=value.slice(1,-1)}}else if(value.startsWith("\u0027")&&value.endsWith("\u0027"))value=value.slice(1,-1);parsed[key]=value}(async()=>{const productionUrl=String(parsed.NEXT_PUBLIC_SUPABASE_URL||"").trim();if(!productionUrl)throw new Error("Missing Production Supabase URL");const projectRef=new URL(productionUrl).hostname.split(".")[0];const r=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});const text=await r.text();if(!r.ok)throw new Error(`Supabase key lookup HTTP ${r.status}: ${text.slice(0,300)}`);const keys=text?JSON.parse(text):[];if(!Array.isArray(keys))throw new Error("Supabase key response was not an array");const val=e=>String(e?.api_key||e?.key||e?.value||"");const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));const legacy=keys.find(e=>e?.name==="service_role"&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==="service_role"&&/^eyJ/.test(val(e)));const serverKey=val(modern||legacy);if(!serverKey)throw new Error("No Production server key found");console.log(`::add-mask::${productionUrl}`);console.log(`::add-mask::${serverKey}`);fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(productionUrl)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(serverKey)}\n`,{mode:0o600})})().catch(e=>{console.error(e);process.exit(1)});'

      - name: Clear any pre-existing temporary scanner credential
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes vercel@56.2.0 env rm INSTACOMP_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1
          set -e
          log="$EVIDENCE_DIR/pretest-clean-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          source_sha="$(git rev-parse HEAD)"
          grep -Fq "InstaComp release manifest bound to $source_sha." "$log"

      - name: Provision fresh scoped scanner credential
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$TEMP_DIR/service-token"
          openssl rand -hex 32 > "$secret_file"
          chmod 600 "$secret_file"
          secret="$(cat "$secret_file")"
          echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$secret_file" >/dev/null
          touch "$TEMP_DIR/secret-provisioned"

      - name: Deploy acceptance revision with fresh scanner credential
        shell: bash
        run: |
          set -euo pipefail
          log="$EVIDENCE_DIR/test-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          source_sha="$(git rev-parse HEAD)"
          grep -Fq "InstaComp release manifest bound to $source_sha." "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$log" | tail -n1)"
          test -n "$url"
          printf '%s\n' "$url" > "$EVIDENCE_DIR/test-deploy-url.txt"
          touch "$TEMP_DIR/test-deployed"

      - name: Re-prove exact repaired Mac before scans
        shell: bash
        run: |
          set -euo pipefail
          readiness="$EVIDENCE_DIR/readiness-before-scans.json"
          verified=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?acceptance=v3&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const expected=process.argv[2];for(const k of ["ok","configured","reachable","internalMemoryReady","checklistReady","localModelReady"])if(b[k]!==true)process.exit(1);if(b.runtimeSourceFingerprint!==expected)process.exit(1);' "$readiness" "$EXPECTED_MAC_FINGERPRINT"; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = "1"
          cat "$readiness"

      - name: Frozen five Production acceptance pass 1
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          token="$(cat "$TEMP_DIR/service-token")"
          echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-1.json" pass-1

      - name: Frozen five Production acceptance pass 2
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          token="$(cat "$TEMP_DIR/service-token")"
          echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-2.json" pass-2

      - name: Remove temporary scanner credential
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$TEMP_DIR/secret-provisioned" ]; then exit 0; fi
          removed=0
          for attempt in 1 2 3; do
            if npx --yes vercel@56.2.0 env rm INSTACOMP_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
              removed=1
              break
            fi
            sleep 3
          done
          if [ "$removed" != "1" ]; then
            echo "Failed to remove temporary scanner credential." >&2
            exit 2
          fi
          touch "$TEMP_DIR/secret-removed"

      - name: Redeploy tested source clean
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$TEMP_DIR/secret-provisioned" ]; then exit 0; fi
          if [ ! -f "$TEMP_DIR/secret-removed" ]; then echo "Refusing clean deploy: credential removal unproven." >&2; exit 2; fi
          log="$EVIDENCE_DIR/clean-deploy.log"
          set +e
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          source_sha="$(git rev-parse HEAD)"
          grep -Fq "InstaComp release manifest bound to $source_sha." "$log"
          touch "$TEMP_DIR/clean-deployed"

      - name: Prove clean Production and dead temporary credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/secret-provisioned" ]; then exit 0; fi
          test -f "$TEMP_DIR/clean-deployed"
          readiness="$EVIDENCE_DIR/readiness-clean.json"
          ready=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$readiness" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?clean=v3&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(b.ok!==true||b.runtimeSourceFingerprint!==process.argv[2])process.exit(1);' "$readiness" "$EXPECTED_MAC_FINGERPRINT"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1"
          token="$(cat "$TEMP_DIR/service-token")"
          echo "::add-mask::$token"
          body="$EVIDENCE_DIR/removed-token-response.json"
          auth_code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $token" -F 'aiCouncilTier=basic' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
          echo "removed_credential_http=$auth_code"
          if [ "$auth_code" != "401" ] && [ "$auth_code" != "403" ]; then
            echo "Temporary scanner credential is still accepted." >&2
            cat "$body" >&2 || true
            exit 2
          fi
          printf '{"ready":true,"runtimeSourceFingerprint":"%s","temporaryCredentialRemoved":true,"removedCredentialHttpStatus":%s}\n' "$EXPECTED_MAC_FINGERPRINT" "$auth_code" > "$EVIDENCE_DIR/clean-production.json"

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-final-production-acceptance-v3-20260807
          path: evidence/instacomp-final-production-acceptance-v3-20260807
          if-no-files-found: warn
          retention-days: 90

      - name: Remove local temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$TEMP_DIR"
          rm -f .env.local .env.production.local
