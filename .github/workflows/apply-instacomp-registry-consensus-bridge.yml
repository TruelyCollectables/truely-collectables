name: Apply InstaComp Registry Consensus Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/instacomp-learning-server.ts"
      - "scripts/run-instacomp-registry-consensus-bridge-regression.ts"
      - ".github/workflows/apply-instacomp-registry-consensus-bridge.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Canonicalize Registry identity for scanner consensus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/instacomp-learning-server.ts")
          text = path.read_text()
          replacements = [
              (
                  "    brand: match.brand,",
                  "    brand: match.manufacturer || match.brand,\n    registryBrand: match.brand,",
              ),
              (
                  "    setName: match.setName,",
                  "    setName: match.product || match.setName,\n    registrySetName: match.setName,",
              ),
          ]
          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"Expected field mapping was not found exactly once: {old}")
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              path.write_text(text)
              print("Applied Registry manufacturer/product consensus mapping.")
          else:
              print("Registry consensus identity mapping is already applied.")
          PY

      - name: Run exact Registry bridge and identity firewall regressions
        run: |
          npx tsx scripts/run-instacomp-registry-consensus-bridge-regression.ts
          npx tsx scripts/run-instacomp-live-shedeur-107-regression.ts
          npx tsx scripts/run-instacomp-identity-firewall-regressions.ts
          npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts
          npm run simulate:instacomp-consensus

      - name: Lint and typecheck changed identity files
        run: |
          npx eslint \
            src/lib/instacomp-learning-server.ts \
            scripts/run-instacomp-registry-consensus-bridge-regression.ts
          npx tsc --noEmit

      - name: Commit validated source change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/instacomp-learning-server.ts; then
            echo "Validated source already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-learning-server.ts
          git commit -m "Fix Registry identity fields for scanner consensus"
          git push origin "HEAD:${{ github.head_ref }}"
