name: Cloudflare Cutover Build

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-cutover-build.yml"
      - "cloudflare-worker.ts"
      - "wrangler.jsonc"
      - "public/_headers"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  SITE_URL: https://truelycollectables.com
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
  STRIPE_SECRET_KEY: sk_test_build_only_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
  ADMIN_PASSWORD: build-only-placeholder-password
  ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
  EBAY_CLIENT_ID: build-only-placeholder-client-id
  EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
  EBAY_ENVIRONMENT: production
  CRON_SECRET: build-only-placeholder-cron-secret-123456
  MARKET_INTEL_INGEST_SECRET: build-only-placeholder-market-secret
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  open-next:
    name: OpenNext build and Wrangler dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install Cloudflare deployment tooling without changing lockfile
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
      - name: Build Next.js for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Validate Worker bundle with Wrangler
        run: npx wrangler deploy --dry-run
