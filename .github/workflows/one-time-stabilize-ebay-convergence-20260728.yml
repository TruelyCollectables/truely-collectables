name: One-Time Stabilize eBay Convergence 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-stabilize-ebay-convergence-20260728.yml"

permissions:
  contents: write

concurrency:
  group: one-time-stabilize-ebay-convergence-20260728
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/stabilize-ebay-convergence-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-ebay-convergence-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Stabilize authoritative comparisons and receipts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source_path = Path('src/lib/ebay-authoritative-store-sync.ts')
          source = source_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'import { getStoreSettings } from "./store-settings";\nimport { InventoryRepository } from "../modules/inventory";',
              'import { getStoreSettings } from "./store-settings";\nimport { listingImageIdentity } from "./listing-image-utils";\nimport { InventoryRepository } from "../modules/inventory";',
              'listing image identity import',
          )

          replace_once(
              '''function listingChanged(
            local: LocalProduct,
            remote: EbayStoreRemoteListing,
          ) {
            return (
              local.title !== remote.title ||
              Number(local.quantity) !== remote.quantity ||
              Math.round(Number(local.price) * 100) !==
                Math.round(remote.price * 100) ||
              local.image_url !== remote.imageUrl ||
              local.sport !== remote.sport ||
              (!local.sku && Boolean(remote.sku))
            );
          }''',
              '''function normalizedNullableText(value: unknown) {
            return String(value || "").trim();
          }

          function listingChanged(
            local: LocalProduct,
            remote: EbayStoreRemoteListing,
          ) {
            return (
              local.title !== remote.title ||
              Number(local.quantity) !== remote.quantity ||
              Math.round(Number(local.price) * 100) !==
                Math.round(remote.price * 100) ||
              listingImageIdentity(local.image_url) !==
                listingImageIdentity(remote.imageUrl) ||
              normalizedNullableText(local.sport) !==
                normalizedNullableText(remote.sport) ||
              (!local.sku && Boolean(remote.sku))
            );
          }''',
              'stable listing comparison',
          )

          source = source.replace(
              '"Local title, quantity, price, image, sport, or SKU differs from eBay."',
              '"Local title, quantity, price, image identity, sport, or SKU differs from eBay."',
          )
          source_path.write_text(source)

          route_path = Path('src/app/api/cron/ebay-store-fixed-price-sync/route.ts')
          route = route_path.read_text()
          marker = '''        errorSample: sync.errors.slice(0, 5).map((entry) => ({
                  itemId: entry.itemId,
                  error: safeErrorMessage(entry.error, "Unknown listing sync error"),
                })),'''
          replacement = marker + '''
                changedSample: sync.actions
                  .filter((entry) =>
                    ["insert", "update", "deactivate", "error"].includes(
                      entry.action,
                    ),
                  )
                  .slice(0, 10)
                  .map((entry) => ({
                    itemId: entry.itemId,
                    action: entry.action,
                    reason: safeErrorMessage(entry.reason, "Listing changed"),
                    remoteQuantity: entry.remoteQuantity,
                    localQuantity: entry.localQuantity,
                    remotePrice: entry.remotePrice,
                    localPrice: entry.localPrice,
                  })),'''
          if route.count(marker) != 1:
              raise SystemExit('receipt changed-sample marker was not unique')
          route_path.write_text(route.replace(marker, replacement, 1))

          test_path = Path('scripts/run-storefront-taxonomy-regressions.ts')
          test = test_path.read_text()
          marker = 'assert.ok(\n  authoritativeSyncSource.includes("const MAX_ACTIVE_LISTINGS = 3000;"),'
          additions = '''assert.ok(
            authoritativeSyncSource.includes(
              'import { listingImageIdentity } from "./listing-image-utils";',
            ),
            "Authoritative convergence must compare stable eBay image identities.",
          );
          assert.match(
            authoritativeSyncSource,
            /listingImageIdentity\\(local\\.image_url\\) !==[\\s\\S]*listingImageIdentity\\(remote\\.imageUrl\\)/,
            "Image resolution variants must not create endless inventory updates.",
          );
          assert.match(
            authoritativeSyncSource,
            /normalizedNullableText\\(local\\.sport\\) !==[\\s\\S]*normalizedNullableText\\(remote\\.sport\\)/,
            "Null and empty storefront category values must compare consistently.",
          );
          ''' + marker
          if test.count(marker) != 1:
              raise SystemExit('convergence regression marker was not unique')
          test_path.write_text(test.replace(marker, additions, 1))

          image_test = Path('scripts/run-ebay-import-admin-client-simulations.ts')
          test = image_test.read_text()
          marker = 'assert.match(\n  scheduledEbaySync,\n  /syncEbayAllListingImages/,'
          additions = '''assert.match(
            scheduledEbaySync,
            /changedSample: sync\\.actions/,
            "Production receipts must expose a bounded sample of non-converged listings.",
          );
          ''' + marker
          if test.count(marker) != 1:
              raise SystemExit('receipt regression marker was not unique')
          image_test.write_text(test.replace(marker, additions, 1))

          Path('.github/workflows/one-time-stabilize-ebay-convergence-20260728.yml').unlink()
          PY

      - name: Validate convergence repair
        run: |
          set -euo pipefail
          npm ci
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
          npx eslint src/lib/ebay-authoritative-store-sync.ts src/app/api/cron/ebay-store-fixed-price-sync/route.ts scripts/run-storefront-taxonomy-regressions.ts scripts/run-ebay-import-admin-client-simulations.ts
          npm run build

      - name: Commit validated convergence repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add src/lib/ebay-authoritative-store-sync.ts src/app/api/cron/ebay-store-fixed-price-sync/route.ts scripts/run-storefront-taxonomy-regressions.ts scripts/run-ebay-import-admin-client-simulations.ts .github/workflows/one-time-stabilize-ebay-convergence-20260728.yml
          git commit -m "Stabilize authoritative eBay inventory convergence"
          git push origin HEAD:agent/stabilize-ebay-convergence-20260728
