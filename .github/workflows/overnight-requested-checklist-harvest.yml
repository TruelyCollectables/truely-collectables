name: Overnight Requested Checklist Harvest

# Source-only overnight collector. It downloads at most one unresolved checklist
# source per five-minute interval and never writes the Production Registry.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/overnight-requested-checklist-harvest.yml'
      - 'scripts/overnight-checklist-harvest.mjs'
      - 'data/overnight-checklist-harvest-seeds.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: overnight-requested-checklist-harvest
  cancel-in-progress: false

jobs:
  harvest-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore rolling harvest state
        uses: actions/cache/restore@v4
        with:
          path: data/overnight-checklist-harvest-state.json
          key: overnight-checklist-state-${{ github.run_id }}
          restore-keys: |
            overnight-checklist-state-

      - name: Harvest at most one requested checklist source
        id: harvest
        run: node scripts/overnight-checklist-harvest.mjs

      - name: Save rolling harvest state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/overnight-checklist-harvest-state.json
          key: overnight-checklist-state-${{ github.run_id }}

      - name: Preserve raw source and receipt as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-checklist-source-${{ github.run_id }}
          path: .overnight-checklist-harvest/current/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Show harvest progress
        if: always()
        shell: bash
        run: |
          if [[ -s .overnight-checklist-harvest/current/receipt.json ]]; then
            cat .overnight-checklist-harvest/current/receipt.json
            echo '### Overnight checklist harvest' >> "$GITHUB_STEP_SUMMARY"
            jq -r '"Action: **\(.action.status // .status // \"unknown\")**\n\nRemaining source downloads: **\(.after.remainingDownloadCount // \"unknown\")**\n\nDatabase writes: **\(.databaseWrites)**"' .overnight-checklist-harvest/current/receipt.json >> "$GITHUB_STEP_SUMMARY" || true
          fi
