name: InstaComp Final Cloud Registry Consensus V3C 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/patch-instacomp-final-cloud-registry-consensus-v3-20260807.py"
      - "scripts/ops/patch-instacomp-final-cloud-registry-consensus-v3-type-20260807.py"
      - "scripts/ops/run-instacomp-final-registry-v3-live-proof.ts"
      - "scripts/run-instacomp-final-registry-consensus-v3-simulations.ts"
      - ".github/workflows/instacomp-final-cloud-registry-consensus-v3c-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-final-cloud-registry-consensus-v3c-20260807
  cancel-in-progress: true

env:
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: truelycollectables-projects

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-final-cloud-registry-consensus-v3-20260807
          fetch-depth: 0

      - name: Apply cloud-only root-cause repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/patch-instacomp-final-cloud-registry-consensus-v3-20260807.py
          python scripts/ops/patch-instacomp-final-cloud-registry-consensus-v3-type-20260807.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pure Base Ice Groovy consensus regressions
        run: npx tsx scripts/run-instacomp-final-registry-consensus-v3-simulations.ts

      - name: Full TypeScript compile
        run: npx tsc --noEmit

      - name: Link Vercel and resolve Production Supabase server key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$RUNNER_TEMP/production.env"
          runtime_file="$RUNNER_TEMP/registry-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node - <<'NODE'
          const fs=require('node:fs');
          const parsed={};
          for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)){
            const line=raw.trim(); if(!line||line.startsWith('#')) continue;
            const i=line.indexOf('='); if(i<1) continue;
            const k=line.slice(0,i).trim(); let v=line.slice(i+1).trim();
            if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}
            parsed[k]=v;
          }
          (async()=>{
            const url=String(parsed.NEXT_PUBLIC_SUPABASE_URL||'').trim();
            if(!url) throw new Error('Missing Production Supabase URL');
            const ref=new URL(url).hostname.split('.')[0];
            const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});
            const text=await r.text(); if(!r.ok) throw new Error(`Supabase keys HTTP ${r.status}: ${text.slice(0,300)}`);
            const keys=text?JSON.parse(text):[]; const val=e=>String(e?.api_key||e?.key||e?.value||'');
            const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));
            const legacy=keys.find(e=>e?.name==='service_role'&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==='service_role'&&/^eyJ/.test(val(e)));
            const key=val(modern||legacy); if(!key) throw new Error('No Production server key');
            console.log(`::add-mask::${url}`); console.log(`::add-mask::${key}`);
            fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(url)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(key)}\n`,{mode:0o600});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Live Registry proof on frozen five identities
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/registry-env.sh"
          npx tsx scripts/ops/run-instacomp-final-registry-v3-live-proof.ts

      - name: Source safety and cloud-only boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort -u)"
          expected="$(printf '%s\n' \
            'src/app/api/instacomp/scan/route.ts' \
            'src/lib/instacomp-ai-local.ts' \
            'src/lib/instacomp-consensus.ts' \
            'src/lib/instacomp-learning-server.ts' | sort)"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- services/instacomp-ai/app services/instacomp-ai/scripts)"
          grep -Fq 'registryVisibleText' src/app/api/instacomp/scan/route.ts
          grep -Fq 'localVisionOcrText' src/lib/instacomp-ai-local.ts
          grep -Fq 'softVisibleSetRows' src/lib/instacomp-learning-server.ts
          grep -Fq 'unresolvedSurfaceRiskFamilies.length >= 2' src/lib/instacomp-consensus.ts
          grep -Fq 'comparableParallel(readerEvidenceText(reader))' src/lib/instacomp-consensus.ts

      - name: Commit certified permanent source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/app/api/instacomp/scan/route.ts \
            src/lib/instacomp-ai-local.ts \
            src/lib/instacomp-consensus.ts \
            src/lib/instacomp-learning-server.ts
          git commit -m 'Fix final InstaComp Registry and consensus blockers v3'
          git push origin HEAD:fix/instacomp-final-cloud-registry-consensus-v3-20260807
