name: Fix Active Market Read Freshness Test Types

on:
  push:
    branches:
      - agent/quarantine-stale-active-market-results
    paths:
      - "scripts/fix-active-market-read-freshness-test-types.mjs"
      - ".github/workflows/fix-active-market-read-freshness-test-types.yml"

permissions:
  contents: write

jobs:
  fix-test-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply test type fix
        run: node scripts/fix-active-market-read-freshness-test-types.mjs

      - name: Validate patch
        run: git diff --check

      - name: Commit test type fix
        run: |
          if git diff --quiet; then
            echo "Read freshness test types were already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-active-market-read-freshness-simulations.ts
          git commit -m "Fix Active Market read freshness test types"
          git push origin HEAD:${{ github.ref_name }}
