name: Audit Storefront Taxonomy V7 Live Receipt 20260728

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-storefront-taxonomy-v7-live-receipt-20260728.yml"

permissions:
  contents: read

jobs:
  audit-live-catalog:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/audit-storefront-taxonomy-v7-production-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
      RECEIPT_NOT_BEFORE_UTC: 2026-07-29T03:30:00Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/audit-storefront-taxonomy-v7-production-20260728
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link Vercel Production
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel taxonomy-v7-live-audit/logs taxonomy-v7-live-audit/pages
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Capture latest authoritative inventory receipt
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 12); do
            raw="taxonomy-v7-live-audit/logs/runtime-${attempt}.jsonl"
            npx vercel@56.2.0 logs \
              --project truely-collectables \
              --environment production \
              --since "$RECEIPT_NOT_BEFORE_UTC" \
              --no-branch \
              --json \
              --expand \
              --limit 1000 \
              --query "ebay_store_fixed_price_sync_completed" \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" \
              > "$raw" 2> "taxonomy-v7-live-audit/logs/runtime-${attempt}.stderr" || true
            ATTEMPT="$attempt" RAW_FILE="$raw" node <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readFileSync(process.env.RAW_FILE, 'utf8').split(/\r?\n/).filter(Boolean);
          const receipts = [];
          const inspect = (value) => {
            if (!value) return;
            if (typeof value === 'object') {
              if (value.event === 'ebay_store_fixed_price_sync_completed') receipts.push(value);
              for (const nested of Object.values(value)) inspect(nested);
              return;
            }
            if (typeof value !== 'string') return;
            const prefix = '[ebay-store-fixed-price-sync] ';
            const index = value.indexOf(prefix);
            if (index >= 0) {
              try {
                const parsed = JSON.parse(value.slice(index + prefix.length));
                if (parsed?.event === 'ebay_store_fixed_price_sync_completed') receipts.push(parsed);
              } catch {}
            }
            const schemaIndex = value.indexOf('{"schema":"truelycollectables.ebayStoreFixedPriceSyncReceipt.v2"');
            if (schemaIndex >= 0) {
              try {
                const parsed = JSON.parse(value.slice(schemaIndex));
                if (parsed?.event === 'ebay_store_fixed_price_sync_completed') receipts.push(parsed);
              } catch {}
            }
          };
          for (const line of rows) {
            try { inspect(JSON.parse(line)); } catch {}
          }
          const latest = receipts.sort((a, b) => Date.parse(a.completedAt || 0) - Date.parse(b.completedAt || 0)).at(-1) || null;
          fs.writeFileSync(`taxonomy-v7-live-audit/logs/receipt-${process.env.ATTEMPT}.json`, `${JSON.stringify({ rowsRead: rows.length, receipt: latest }, null, 2)}\n`);
          NODE
            if grep -Fq '"receipt": {' "taxonomy-v7-live-audit/logs/receipt-${attempt}.json"; then
              cp "taxonomy-v7-live-audit/logs/receipt-${attempt}.json" taxonomy-v7-live-audit/receipt.json
              found="$attempt"
              break
            fi
            sleep 15
          done
          test -n "$found"
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('taxonomy-v7-live-audit/receipt.json', 'utf8')).receipt;
          const final = receipt.finalAuthoritative || (receipt.convergencePasses || []).at(-1 || null);
          const audit = receipt.databaseAudit || {};
          if (!receipt?.success || (receipt.errors || []).length) throw new Error(`Latest inventory receipt failed: ${JSON.stringify(receipt?.errors || [])}`);
          if (!final?.cycleComplete || Number(final.failed || 0) !== 0) throw new Error('Latest final authoritative cycle was not complete.');
          if (Number(final.representedInventoryRows || 0) <= 0) throw new Error('Latest receipt had no represented inventory total.');
          if (audit.matchesEligibleEbayInventory !== true) throw new Error('Latest database audit did not match eligible eBay inventory.');
          const summary = {
            completedAt: receipt.completedAt,
            remoteFixedPriceTotal: Number(final.remoteFixedPriceTotal || 0),
            eligibleCollectibles: Number(final.eligibleCollectibles || 0),
            mergedAliasListings: Number(final.mergedAliasListings || 0),
            representedInventoryRows: Number(final.representedInventoryRows || 0),
            activeLinkedProducts: Number(audit.activeLinkedProducts || 0),
          };
          fs.writeFileSync('taxonomy-v7-live-audit/receipt-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          NODE

      - name: Fetch complete live taxonomy pages
        shell: bash
        run: |
          set -euo pipefail
          fetch_page() {
            key="$1"; path="$2"
            curl --location --fail --silent --show-error \
              --connect-timeout 15 --max-time 240 \
              --header 'Cache-Control: no-cache' \
              --output "taxonomy-v7-live-audit/pages/${key}.html" \
              "${PRODUCTION_ORIGIN}${path}"
          }
          fetch_page all '/shop'
          fetch_page other_collectables '/shop?section=Other%20Collectables'
          fetch_page other_sports '/shop?section=Other%20Sports'
          fetch_page memorabilia '/shop?section=Memorabilia'
          fetch_page needs_review '/shop?section=Needs%20Review'
          fetch_page memorabilia_cards '/shop?feature=memorabilia'
          fetch_page graded_cards '/shop?feature=graded'
          fetch_page autographs '/shop?feature=autograph'
          fetch_page jerseys '/shop?section=Jerseys'
          fetch_page pucks '/shop?section=Pucks'
          fetch_page music '/shop?section=Music'
          fetch_page trading_cards '/shop?section=Trading%20Card%20Games'

      - name: Certify live taxonomy v7 catalog
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const decode = (value) => value
            .replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"')
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ')
            .replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          const html = (key) => fs.readFileSync(`taxonomy-v7-live-audit/pages/${key}.html`, 'utf8');
          const text = (key) => decode(html(key).replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' '));
          const count = (key) => {
            const match = text(key).match(/([\d,]+) active cards & collectibles/i);
            return match ? Number(match[1].replaceAll(',', '')) : null;
          };
          const titles = (key) => Array.from(html(key).matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/gi), (match) => decode(match[1]));
          const articles = Array.from(html('all').matchAll(/<article[^>]*>([\s\S]*?)<\/article>/gi), (match) => {
            const body = match[1];
            const title = decode((body.match(/<h2[^>]*>([\s\S]*?)<\/h2>/i) || [,''])[1]);
            const section = decode((body.match(/text-blue-700[^>]*>([\s\S]*?)<\/p>/i) || [,''])[1]);
            const badges = Array.from(body.matchAll(/text-\[10px\][^>]*>([\s\S]*?)<\/span>/gi), (badge) => decode(badge[1]));
            return { title, section, badges };
          }).filter((item) => item.title);
          const receipt = JSON.parse(fs.readFileSync('taxonomy-v7-live-audit/receipt-summary.json', 'utf8'));
          const counts = {
            all: count('all'),
            otherCollectables: count('other_collectables'),
            otherSports: count('other_sports'),
            memorabilia: count('memorabilia'),
            needsReview: count('needs_review'),
            memorabiliaCards: count('memorabilia_cards'),
            gradedCards: count('graded_cards'),
            autographs: count('autographs'),
            jerseys: count('jerseys'),
            pucks: count('pucks'),
            music: count('music'),
            tradingCards: count('trading_cards'),
          };
          const deprecated = articles.filter((item) => ['Other Collectables','Other Collectibles','Other Sports','Memorabilia','Autographs','Needs Review'].includes(item.section));
          const missingSection = articles.filter((item) => !item.section);
          const negativeAutographs = titles('autographs').filter((title) => /\b(?:facsimile|pre[- ]?printed|printed signature|unsigned|not signed|not autographed|non[- ]?auto|auto racing)\b/i.test(title));
          const jerseyCardLeaks = titles('jerseys').filter((title) => /\b(?:card|topps|panini|upper deck|donruss|prizm|bowman|skybox|sp game used|relic|patch|swatch|proof|materials)\b/i.test(title));
          const puckCardLeaks = titles('pucks').filter((title) => /\b(?:card|topps|panini|upper deck|donruss|prizm|bowman|relic|patch|swatch)\b/i.test(title));
          const nonMemorabiliaFeature = titles('memorabilia_cards').filter((title) => !/\b(?:relic|patch|swatch|jersey|materials?|fabrics?|rpa|frameworks|microfibers|emblems?)\b/i.test(title.replace(/\bnew jersey\b/gi, '')));
          const nonGradedFeature = titles('graded_cards').filter((title) => !/\b(?:psa|bgs|sgc|cgc|csg|hga|isa|ksa)\s*(?:authentic|a|\d{1,2}(?:\.\d)?)\b/i.test(title));
          if (counts.all !== receipt.representedInventoryRows) throw new Error(`Live total ${counts.all} != represented inventory ${receipt.representedInventoryRows}.`);
          if (articles.length !== counts.all) throw new Error(`Parsed ${articles.length} live articles but page reports ${counts.all}.`);
          for (const key of ['otherCollectables','otherSports','memorabilia','needsReview']) if (counts[key] !== 0) throw new Error(`${key} still contains ${counts[key]} items.`);
          if (deprecated.length) throw new Error(`Deprecated sections remain: ${JSON.stringify(deprecated.slice(0,20))}`);
          if (missingSection.length) throw new Error(`Items without a section remain: ${JSON.stringify(missingSection.slice(0,20))}`);
          if (negativeAutographs.length) throw new Error(`False autograph results remain: ${JSON.stringify(negativeAutographs.slice(0,20))}`);
          if (jerseyCardLeaks.length) throw new Error(`Card listings remain in Jerseys: ${JSON.stringify(jerseyCardLeaks.slice(0,20))}`);
          if (puckCardLeaks.length) throw new Error(`Card listings remain in Pucks: ${JSON.stringify(puckCardLeaks.slice(0,20))}`);
          if (nonMemorabiliaFeature.length) throw new Error(`Suspicious Memorabilia Card results: ${JSON.stringify(nonMemorabiliaFeature.slice(0,20))}`);
          if (nonGradedFeature.length) throw new Error(`Suspicious Graded Card results: ${JSON.stringify(nonGradedFeature.slice(0,20))}`);
          const allText = text('all');
          for (const label of ['Shop by sport','Collectible types','Card features','Memorabilia Cards','Graded Cards','NBA','WNBA']) if (!allText.includes(label)) throw new Error(`Missing control ${label}.`);
          const sectionCounts = articles.reduce((result, item) => {
            result[item.section] = (result[item.section] || 0) + 1;
            return result;
          }, {});
          const report = {
            success: true,
            auditedAt: new Date().toISOString(),
            receipt,
            counts,
            sectionCounts,
            samples: {
              memorabiliaCards: titles('memorabilia_cards').slice(0,30),
              gradedCards: titles('graded_cards').slice(0,30),
              autographs: titles('autographs').slice(0,30),
              jerseys: titles('jerseys').slice(0,30),
              pucks: titles('pucks').slice(0,30),
              music: titles('music').slice(0,30),
              tradingCards: titles('trading_cards').slice(0,30),
            },
            articles,
          };
          fs.writeFileSync('taxonomy-v7-live-audit/report.json', `${JSON.stringify(report, null, 2)}\n`);
          fs.writeFileSync('taxonomy-v7-live-audit/summary.json', `${JSON.stringify({ success: true, auditedAt: report.auditedAt, receipt, counts, sectionCounts }, null, 2)}\n`);
          console.log(JSON.stringify({ success: true, counts, sectionCounts }));
          NODE

      - name: Upload taxonomy v7 live certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-taxonomy-v7-live-certificate-${{ github.run_number }}
          path: taxonomy-v7-live-audit
          if-no-files-found: error
          retention-days: 30
