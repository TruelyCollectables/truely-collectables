name: InstaComp Sentinel One-Command Control Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "services/instacomp-ai/app/sentinel_routes.py"
      - "services/instacomp-ai/scripts/install-sentinel-control.sh"
      - "services/instacomp-ai/.env.example"
      - "services/instacomp-ai/tests/test_sentinel_control.py"
      - "src/lib/instacomp-sentinel-auth.ts"
      - "src/app/api/instacomp/checklist-sentinel/**"
      - "src/app/admin/instacomp/checklist-sentinel/**"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-instacomp-sentinel-control-audit.mjs"
      - ".github/workflows/instacomp-sentinel-control-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify macOS installer syntax
        run: bash -n services/instacomp-ai/scripts/install-sentinel-control.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Install InstaComp AI dependencies
        working-directory: services/instacomp-ai
        run: pip install -r requirements.txt

      - name: Compile Sentinel service modules
        working-directory: services/instacomp-ai
        run: python -m py_compile app/sentinel.py app/sentinel_routes.py app/sentinel_sources.py app/sentinel_store.py app/settings_routes.py

      - name: Run Sentinel scheduler and control tests
        working-directory: services/instacomp-ai
        run: pytest -q tests/test_sentinel.py tests/test_sentinel_control.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Run complete Sentinel control source audit
        run: node scripts/run-instacomp-sentinel-control-audit.mjs

      - name: Lint Sentinel website files
        run: >-
          npx eslint
          src/lib/instacomp-sentinel-auth.ts
          src/app/api/instacomp/checklist-sentinel/route.ts
          src/app/api/instacomp/checklist-sentinel/import/route.ts
          src/app/admin/instacomp/checklist-sentinel/page.tsx
          src/app/components/AdminInstaCompMobileShortcut.tsx

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
