name: Temporary InstaComp Market Sweet Spot

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-validate:
    if: github.event_name == 'push' || github.head_ref == 'agent/instacomp-market-sweet-spot-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out market-pricing branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-market-sweet-spot-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize deterministic patch targets
        run: node scripts/normalize-instacomp-market-patch-targets.mjs

      - name: Apply full market-pricing package
        id: patch
        continue-on-error: true
        run: |
          node scripts/apply-instacomp-market-sweet-spot.mjs > /tmp/instacomp-market-patch.log 2>&1
          node scripts/fix-instacomp-market-guard.mjs >> /tmp/instacomp-market-patch.log 2>&1

      - name: Persist patch failure evidence
        if: steps.patch.outcome == 'failure'
        run: |
          cp /tmp/instacomp-market-patch.log /tmp/instacomp-market-patch.saved
          git reset --hard HEAD
          mkdir -p docs
          cp /tmp/instacomp-market-patch.saved docs/instacomp-market-patch-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/instacomp-market-patch-failure.txt
          git commit -m "Record InstaComp market patch failure"
          git push origin HEAD:agent/instacomp-market-sweet-spot-20260726
          cat docs/instacomp-market-patch-failure.txt
          exit 1

      - name: Run market sweet-spot regressions
        run: node --import tsx scripts/run-instacomp-market-sweet-spot-regressions.ts

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Commit validated package
        run: |
          rm -f scripts/apply-instacomp-market-sweet-spot.mjs
          rm -f scripts/normalize-instacomp-market-patch-targets.mjs
          rm -f scripts/fix-instacomp-market-guard.mjs
          rm -f docs/instacomp-market-patch-failure.txt
          rm -f docs/.instacomp-market-sweet-spot-retry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-market-pricing.ts \
            src/app/api/account/seller/inventory/instacomp-universal/route.ts \
            src/app/api/account/seller/instacomp-pending/route.ts \
            src/app/api/account/seller/instacomp-pending/price/route.ts \
            src/app/seller/instacomp-pending/page.tsx \
            scripts/run-instacomp-market-sweet-spot-regressions.ts \
            scripts/apply-instacomp-market-sweet-spot.mjs \
            scripts/normalize-instacomp-market-patch-targets.mjs \
            scripts/fix-instacomp-market-guard.mjs \
            docs/instacomp-market-patch-failure.txt \
            docs/.instacomp-market-sweet-spot-retry
          if git diff --cached --quiet; then
            echo "No market-pricing changes remain to commit."
            exit 0
          fi
          git commit -m "Combine sold value and active competition in InstaComp pricing"
          git push origin HEAD:agent/instacomp-market-sweet-spot-20260726
