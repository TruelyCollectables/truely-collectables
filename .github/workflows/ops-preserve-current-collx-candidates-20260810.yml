name: Ops Preserve Current CollX Candidates 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-preserve-current-collx-candidates-20260810.yml"
      - ".github/ops/preserve-current-collx-candidates.part*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-preserve-current-collx-candidates-20260810
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/collx-preserve"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-preserve/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Preserve unresolved candidate scans in owned storage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { setTimeout as sleep } from 'node:timers/promises';

          const EXPECTED_SHA='6bc4c81b00506c58793a1bcf9dc702dbf91248dfb19d51ee21b8b3b08abf0ef7';
          const EXPECTED_ROWS=281;
          const EXPECTED_URLS=512;
          const BUCKET='truely-product-images';
          const parts=[0,1,2].map(i=>fs.readFileSync(`.github/ops/preserve-current-collx-candidates.part${i}`,'utf8').trim());
          const packed=parts.join('');
          if(packed.length!==9876)throw new Error(`Packed manifest length mismatch: ${packed.length}`);
          const raw=gunzipSync(Buffer.from(packed,'base64'));
          const digest=crypto.createHash('sha256').update(raw).digest('hex');
          if(digest!==EXPECTED_SHA)throw new Error(`Manifest checksum mismatch: ${digest}`);
          const rows=JSON.parse(raw.toString('utf8'));
          if(!Array.isArray(rows)||rows.length!==EXPECTED_ROWS)throw new Error(`Expected ${EXPECTED_ROWS} rows, got ${rows?.length}`);
          const collxIds=new Set(rows.map(r=>String(r.c)));
          if(collxIds.size!==EXPECTED_ROWS)throw new Error('Candidate manifest has duplicate CollX ids');
          const urls=[...new Set(rows.flatMap(r=>[r.f,r.b].filter(Boolean).map(String)))];
          if(urls.length!==EXPECTED_URLS)throw new Error(`Expected ${EXPECTED_URLS} unique images, got ${urls.length}`);
          console.log(JSON.stringify({candidateRows:rows.length,uniqueImages:urls.length,manifestSha256:digest}));

          function parseEnv(text){const e={};for(const rawLine of text.split(/\r?\n/)){const line=rawLine.trim();if(!line||line.startsWith('#'))continue;const i=line.indexOf('=');if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}else if(v.startsWith("'")&&v.endsWith("'"))v=v.slice(1,-1);e[k]=v}return e}
          const env=parseEnv(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'collx-preserve','production.env'),'utf8'));
          const base=env.NEXT_PUBLIC_SUPABASE_URL;
          if(!base)throw new Error('Production Supabase URL unavailable');
          const ref=new URL(base).hostname.split('.')[0];
          const mgmt=process.env.GH_SUPABASE_ACCESS_TOKEN;
          let key=env.SUPABASE_SERVICE_ROLE_KEY||env.SUPABASE_SERVICE_KEY||env.SUPABASE_SECRET_KEY||'';
          if(!key){
            const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${mgmt}`},signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw new Error(`Supabase API-key lookup failed ${r.status}: ${(await r.text()).slice(0,400)}`);
            const keys=await r.json();
            const chosen=keys.find(x=>String(x.name||'').toLowerCase()==='service_role')||keys.find(x=>String(x.type||'').toLowerCase()==='secret')||keys.find(x=>String(x.name||'').toLowerCase().includes('secret'));
            key=chosen?.api_key||'';
            if(!key)throw new Error(`No elevated Supabase key returned; names=${keys.map(x=>x.name).join(',')}`);
          }
          const auth={Authorization:`Bearer ${key}`,apikey:key};

          // The dedicated bucket already exists from the ownership migration, but keep this idempotent.
          let br=await fetch(`${base}/storage/v1/bucket`,{headers:auth,signal:AbortSignal.timeout(20000)});
          if(!br.ok)throw new Error(`List buckets failed ${br.status}: ${(await br.text()).slice(0,300)}`);
          const buckets=await br.json();
          if(!buckets.some(b=>b.id===BUCKET||b.name===BUCKET)){
            const cr=await fetch(`${base}/storage/v1/bucket`,{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({id:BUCKET,name:BUCKET,public:true,file_size_limit:20971520}),signal:AbortSignal.timeout(20000)});
            if(!cr.ok&&cr.status!==409)throw new Error(`Create bucket failed ${cr.status}: ${(await cr.text()).slice(0,300)}`);
          }

          function extension(type,url){const t=(type||'').toLowerCase();if(t.includes('png'))return'png';if(t.includes('webp'))return'webp';if(t.includes('gif'))return'gif';if(t.includes('jpeg')||t.includes('jpg'))return'jpg';const m=/\.(jpe?g|png|webp|gif)(?:[?#]|$)/i.exec(url);return m?(m[1].toLowerCase()==='jpeg'?'jpg':m[1].toLowerCase()):'jpg'}
          async function download(url){let last='';for(let a=1;a<=6;a++){try{const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(30000)});const type=r.headers.get('content-type')||'';if(r.ok&&type.toLowerCase().startsWith('image/'))return{bytes:Buffer.from(await r.arrayBuffer()),type};last=`HTTP ${r.status} ${type}`}catch(e){last=String(e?.message||e)}if(a<6)await sleep(Math.min(5000,a*500))}throw new Error(`Download failed ${url}: ${last}`)}
          async function preserve(url){const {bytes,type}=await download(url);const hash=crypto.createHash('sha256').update(url).digest('hex');const object=`collx-mirror/${hash}.${extension(type,url)}`;let last='';for(let a=1;a<=6;a++){try{const r=await fetch(`${base}/storage/v1/object/${BUCKET}/${object}`,{method:'POST',headers:{...auth,'Content-Type':type,'x-upsert':'true'},body:bytes,signal:AbortSignal.timeout(30000)});if(r.ok)return{source:url,owned:`${base}/storage/v1/object/public/${BUCKET}/${object}`,object,bytes:bytes.length};last=`HTTP ${r.status}: ${(await r.text()).slice(0,200)}`}catch(e){last=String(e?.message||e)}if(a<6)await sleep(Math.min(5000,a*500))}throw new Error(`Upload failed ${url}: ${last}`)}

          const mappings=[];let next=0;const errors=[];
          async function worker(){while(true){const i=next++;if(i>=urls.length)return;try{mappings.push(await preserve(urls[i]))}catch(e){errors.push({url:urls[i],error:String(e?.message||e)})}if((i+1)%50===0)console.log(`Preserved ${i+1}/${urls.length}; errors=${errors.length}`)}}
          await Promise.all(Array.from({length:6},()=>worker()));
          if(errors.length)throw new Error(`Candidate preservation failed for ${errors.length} image(s): ${JSON.stringify(errors.slice(0,5))}`);
          if(mappings.length!==urls.length)throw new Error(`Preservation count mismatch ${mappings.length}/${urls.length}`);
          mappings.sort((a,b)=>a.source.localeCompare(b.source));

          // Public bucket is already exercised by live owned images. Prove a small spread of preserved objects without hammering the endpoint.
          const sampleIndexes=[0,Math.floor(mappings.length*.2),Math.floor(mappings.length*.4),Math.floor(mappings.length*.6),Math.floor(mappings.length*.8),mappings.length-1];
          for(const idx of [...new Set(sampleIndexes)]){const m=mappings[idx];let ok=false,last=0;for(let a=1;a<=8&&!ok;a++){const r=await fetch(m.owned,{headers:{Range:'bytes=0-0'},signal:AbortSignal.timeout(20000)});last=r.status;ok=r.ok&&(r.headers.get('content-type')||'').toLowerCase().startsWith('image/');if(!ok&&(r.status===429||r.status>=500)&&a<8)await sleep(Math.min(5000,a*600))}if(!ok)throw new Error(`Public sample proof failed ${last}: ${m.owned}`);await sleep(400)}

          const bySource=new Map(mappings.map(m=>[m.source,m.owned]));
          const ownedCandidates=rows.map(r=>({collx_id:String(r.c),front_source:r.f,front_owned:bySource.get(String(r.f)),back_source:r.b||null,back_owned:r.b?bySource.get(String(r.b)):null}));
          const outDir=path.join(process.env.RUNNER_TEMP,'collx-preserve');
          fs.writeFileSync(path.join(outDir,'candidate-owned-map.json'),JSON.stringify({manifestSha256:digest,candidateRows:ownedCandidates.length,uniqueImages:mappings.length,candidates:ownedCandidates},null,2));
          const receipt={ok:true,event:'collx_unresolved_candidates_preserved',manifestSha256:digest,candidateRows:rows.length,uniqueImagesPreserved:mappings.length,totalBytes:mappings.reduce((s,m)=>s+Number(m.bytes||0),0),bucket:BUCKET,databaseWrites:false,completedAt:new Date().toISOString()};
          fs.writeFileSync(path.join(outDir,'receipt.json'),JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          NODE
          rm -f "$RUNNER_TEMP/collx-preserve/production.env"

      - name: Upload preservation map and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-unresolved-candidates-owned-copy
          path: |
            ${{ runner.temp }}/collx-preserve/candidate-owned-map.json
            ${{ runner.temp }}/collx-preserve/receipt.json
          retention-days: 7
          if-no-files-found: warn
