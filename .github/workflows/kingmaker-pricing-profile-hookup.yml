name: KINGMAKER Pricing Profile Hookup

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-pricing-profile-server.ts"
      - "src/app/api/instacomp/pricing/decision/route.ts"
      - "scripts/run-kingmaker-pricing-profile-hookup-regressions.ts"
      - ".github/workflows/kingmaker-pricing-profile-hookup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pricing-profile-hookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Profile hookup regressions
        run: node --import tsx scripts/run-kingmaker-pricing-profile-hookup-regressions.ts
      - name: Ownership and fallback contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sellerAccountId: actor.type === "seller"' src/lib/kingmaker-pricing-profile-server.ts
          grep -q 'selection: "fallback"' src/lib/kingmaker-pricing-profile-server.ts
          grep -q 'profileId: body.profileId' src/app/api/instacomp/pricing/decision/route.ts
          grep -q '?? profile.targetMarginPct' src/app/api/instacomp/pricing/decision/route.ts
          grep -q 'sourceDisclosure: null' src/app/api/instacomp/pricing/decision/route.ts
          ! grep -RIni 'beckett' src/lib/kingmaker-pricing-profile-server.ts src/app/api/instacomp/pricing/decision/route.ts scripts/run-kingmaker-pricing-profile-hookup-regressions.ts
      - name: Lint
        run: npx eslint src/lib/kingmaker-pricing-profile-server.ts src/app/api/instacomp/pricing/decision/route.ts scripts/run-kingmaker-pricing-profile-hookup-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder-admin-session
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
