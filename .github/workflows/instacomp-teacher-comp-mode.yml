name: InstaComp teacher comp mode

on:
  push:
    branches:
      - fix/instacomp-teacher-comp-mode-20260808
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-and-apply:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[teacher-mode-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/instacomp-teacher-comp-mode-20260808
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pytest

      - name: Apply student/teacher boundary and teacher-first comp chain
        run: |
          node scripts/apply-instacomp-teacher-comp-mode.mjs
          node scripts/apply-instacomp-teacher-learning-bridge.mjs

      - name: Reject malformed patch
        run: git diff --check

      - name: Run teacher consensus regressions
        run: node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts

      - name: Run InstaComp AI teacher learning regressions
        run: |
          cd services/instacomp-ai
          python -m pytest tests/test_teacher_comp_learning.py tests/test_teacher_comp_registry_binding.py -q
          python -m compileall -q app

      - name: Run existing InstaComp consensus regressions
        run: npm run simulate:instacomp-consensus

      - name: Build Production application
        run: npm run build

      - name: Commit certified runtime changes
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if git diff --quiet -- src/app/api/instacomp/deal-hunter/evaluate/core.ts src/app/api/instacomp/live-scan/route.ts src/lib/instacomp-teacher-market-provider.ts; then
            echo "No runtime patch changes to commit."
            exit 0
          fi
          git config user.name "Truely Collectables CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/app/api/instacomp/deal-hunter/evaluate/core.ts \
            src/app/api/instacomp/live-scan/route.ts \
            src/lib/instacomp-teacher-market-provider.ts
          git commit -m "Activate outside-teacher InstaComp comp mode [teacher-mode-applied]"
          git push origin HEAD:fix/instacomp-teacher-comp-mode-20260808
