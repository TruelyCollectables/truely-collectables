name: InstaComp teacher comp mode

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r services/instacomp-ai/requirements.txt

      - name: Reject malformed diff
        run: git diff --check origin/main...HEAD

      - name: Run teacher consensus regressions
        run: node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts

      - name: Run teacher runtime configuration regressions
        run: |
          node --import tsx scripts/run-instacomp-teacher-runtime-status-simulations.ts
          node --import tsx scripts/run-instacomp-groq-runtime-status-simulations.ts

      - name: Verify fail-closed Mac teacher credential sync
        run: |
          bash -n services/instacomp-ai/scripts/update-live-from-main.sh
          node scripts/run-instacomp-mac-teacher-env-sync-simulations.mjs

      - name: Run InstaComp AI teacher learning regressions
        run: |
          cd services/instacomp-ai
          python -m pytest \
            tests/test_teacher_comp_learning.py \
            tests/test_teacher_comp_registry_binding.py \
            tests/test_teacher_comp_majority.py \
            tests/test_teacher_comp_training.py -q
          python -m compileall -q app

      - name: Run existing InstaComp consensus regressions
        run: npm run simulate:instacomp-consensus

      - name: Build Production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build

  repair_gateway_gemini:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/instacomp-gateway-gemini-native-search-20260810'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact clean Gemini branch
        uses: actions/checkout@v4
        with:
          ref: fix/instacomp-gateway-gemini-native-search-20260810
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply proven raw REST Gemini patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:scripts/ops/repair-gateway-gemini-raw-rest.py > /tmp/repair-gateway-gemini.py
          git show origin/main:scripts/ops/fix-gateway-gemini-single-family-vote.py > /tmp/fix-gateway-gemini-single-family-vote.py
          python /tmp/repair-gateway-gemini.py
          python /tmp/fix-gateway-gemini-single-family-vote.py
          rm -f scripts/ops/gateway-gemini-repair-trigger.txt

      - name: Run Gateway Gemini regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx scripts/run-instacomp-groq-runtime-status-simulations.ts
          node --import tsx scripts/run-instacomp-gateway-perplexity-teacher-simulations.ts
          node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts
          npx tsc --noEmit
          NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key \
          SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-service-role-key \
          npm run build
          git diff --check

      - name: Push permanent Gateway Gemini repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/ops/gateway-gemini-repair-trigger.txt
          git config user.name 'TruelyCollectables Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/instacomp-teacher-market-provider.ts \
            src/lib/instacomp-teacher-runtime-status.ts \
            scripts/run-instacomp-groq-runtime-status-simulations.ts \
            scripts/run-instacomp-gateway-perplexity-teacher-simulations.ts \
            scripts/ops/gateway-gemini-repair-trigger.txt
          git commit -m 'Restore Gemini through Gateway native search'
          git push origin HEAD:fix/instacomp-gateway-gemini-native-search-20260810
