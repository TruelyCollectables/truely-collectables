name: InstaComp teacher comp mode

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r services/instacomp-ai/requirements.txt

      - name: Reject malformed diff
        run: git diff --check origin/main...HEAD

      - name: Run teacher consensus regressions
        run: node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts

      - name: Run teacher runtime configuration regressions
        run: |
          node --import tsx scripts/run-instacomp-teacher-runtime-status-simulations.ts
          node --import tsx scripts/run-instacomp-groq-runtime-status-simulations.ts

      - name: Verify fail-closed Mac teacher credential sync
        run: |
          bash -n services/instacomp-ai/scripts/update-live-from-main.sh
          node scripts/run-instacomp-mac-teacher-env-sync-simulations.mjs

      - name: Run InstaComp AI teacher learning regressions
        run: |
          cd services/instacomp-ai
          python -m pytest \
            tests/test_teacher_comp_learning.py \
            tests/test_teacher_comp_registry_binding.py \
            tests/test_teacher_comp_majority.py \
            tests/test_teacher_comp_training.py -q
          python -m compileall -q app

      - name: Run existing InstaComp consensus regressions
        run: npm run simulate:instacomp-consensus

      - name: Build Production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build

  repair_deal_hunter_internal_security:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/deal-hunter-internal-live-scan-security-20260811'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact Deal Hunter repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/deal-hunter-internal-live-scan-security-20260811
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch internal live-scan trust boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          route = Path('src/app/api/instacomp/live-scan/route.ts')
          s = route.read_text()
          old = '''import {
            instaCompJobErrorResponse,
            requireInstaCompJobActor,
          } from "../../../../lib/instacomp-job-server";
          '''.replace('          ', '')
          new = '''import {
            instaCompJobErrorResponse,
            isValidInstaCompServiceRequest,
            requireInstaCompJobActor,
          } from "../../../../lib/instacomp-job-server";
          '''.replace('          ', '')
          if old not in s:
              raise SystemExit('live-scan job-server import anchor missing')
          s = s.replace(old, new, 1)
          old = '''async function authorizeLiveScan(request: NextRequest) {
            const actor = await requireInstaCompJobActor(request);
          '''.replace('          ', '')
          new = '''async function authorizeLiveScan(request: NextRequest) {
            // This branch is reachable only with the dedicated internal service
            // credential. It bypasses the PUBLIC endpoint rate limiter, not
            // authentication, so a Supabase rate-limit outage cannot break the
            // already-authenticated physical Mac -> website scan channel.
            if (isValidInstaCompServiceRequest(request)) return null;

            const actor = await requireInstaCompJobActor(request);
          '''.replace('          ', '')
          if old not in s:
              raise SystemExit('authorizeLiveScan anchor missing')
          s = s.replace(old, new, 1)
          route.write_text(s)
          PY

          cat > scripts/run-instacomp-live-scan-internal-security-simulations.ts <<'TS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          process.env.INSTACOMP_SERVICE_TOKEN = "internal-service-token-" + "x".repeat(48);
          delete process.env.ADMIN_SESSION_SECRET;
          delete process.env.INSTACOMP_ACCEPTANCE_SERVICE_TOKEN;

          const { isValidInstaCompServiceRequest } = await import(
            "../src/lib/instacomp-job-server"
          );

          const expected = process.env.INSTACOMP_SERVICE_TOKEN!;
          const valid = new Request("https://truelycollectables.com/api/instacomp/live-scan", {
            method: "POST",
            headers: { "x-tcos-instacomp-service-token": expected },
          });
          const wrong = new Request("https://truelycollectables.com/api/instacomp/live-scan", {
            method: "POST",
            headers: { "x-tcos-instacomp-service-token": `${expected}-wrong` },
          });
          const missing = new Request("https://truelycollectables.com/api/instacomp/live-scan", {
            method: "POST",
          });

          assert.equal(isValidInstaCompServiceRequest(valid), true);
          assert.equal(isValidInstaCompServiceRequest(wrong), false);
          assert.equal(isValidInstaCompServiceRequest(missing), false);

          delete process.env.INSTACOMP_SERVICE_TOKEN;
          const noConfiguredSecret = new Request(
            "https://truelycollectables.com/api/instacomp/live-scan",
            {
              method: "POST",
              headers: { "x-tcos-instacomp-service-token": expected },
            },
          );
          assert.equal(isValidInstaCompServiceRequest(noConfiguredSecret), false);

          const source = readFileSync(
            "src/app/api/instacomp/live-scan/route.ts",
            "utf8",
          );
          const authorization = source.indexOf(
            "if (isValidInstaCompServiceRequest(request)) return null;",
          );
          const actor = source.indexOf(
            "const actor = await requireInstaCompJobActor(request);",
          );
          const publicRateLimit = source.indexOf(
            "const rateLimit = await checkPublicEndpointRateLimit({",
          );
          assert.ok(authorization >= 0, "internal service bypass must exist");
          assert.ok(actor > authorization, "public actor lookup must occur after service-token bypass");
          assert.ok(
            publicRateLimit > actor,
            "public rate limiting must remain after public actor authentication",
          );

          console.log(
            "InstaComp internal live-scan security regressions passed: trusted service token bypasses only public rate limiting; wrong/missing/unconfigured credentials remain fail-closed.",
          );
          TS

          rm -f scripts/ops/deal-hunter-security-repair-trigger.txt

      - name: Run security and build gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx scripts/run-instacomp-live-scan-internal-security-simulations.ts
          node --import tsx scripts/run-instacomp-groq-runtime-status-simulations.ts
          node --import tsx scripts/run-instacomp-gateway-perplexity-teacher-simulations.ts
          npx tsc --noEmit
          NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key \
          SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-service-role-key \
          npm run build
          git diff --check

      - name: Push permanent Deal Hunter security repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/ops/deal-hunter-security-repair-trigger.txt
          git config user.name 'TruelyCollectables Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/api/instacomp/live-scan/route.ts \
            scripts/run-instacomp-live-scan-internal-security-simulations.ts \
            scripts/ops/deal-hunter-security-repair-trigger.txt
          git commit -m 'Keep trusted Mac scans independent of public rate-limit storage'
          git push origin HEAD:fix/deal-hunter-internal-live-scan-security-20260811
