name: KINGMAKER Phases 30-37 Control Plane

on:
  pull_request:
    paths:
      - 'src/lib/kingmaker-phases-30-37-control-plane.ts'
      - 'scripts/run-kingmaker-phases-30-37-control-plane-regressions.ts'
      - 'supabase/migrations/20260803190500_kingmaker_phases_30_37_control_plane.sql'
      - '.github/workflows/kingmaker-phases-30-37-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Control-plane regressions
        run: node --import tsx scripts/run-kingmaker-phases-30-37-control-plane-regressions.ts
      - name: Migration security
        run: |
          set -euo pipefail
          file='supabase/migrations/20260803190500_kingmaker_phases_30_37_control_plane.sql'
          grep -Eiq 'enable row level security' "$file"
          grep -Eiq 'revoke all .* from anon, authenticated' "$file"
          grep -Eiq 'grant all .* to service_role' "$file"
          ! grep -Eiq 'grant .* to (anon|authenticated)' "$file"
          grep -Eiq 'unique\(certification_id,evidence_id\)' "$file"
          grep -Eiq 'unique\(certification_id,artifact_digest\)' "$file"
      - name: Dependency security
        run: node scripts/run-dependency-security-audit.mjs
      - name: Lint
        run: npx eslint src/lib/kingmaker-phases-30-37-control-plane.ts scripts/run-kingmaker-phases-30-37-control-plane-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff integrity
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Production build
        run: npm run build
