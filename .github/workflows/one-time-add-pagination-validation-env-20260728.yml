name: One-Time Add Pagination Validation Env 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-add-pagination-validation-env-20260728.yml"

permissions:
  contents: write

jobs:
  update-writer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-ebay-local-pagination-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ebay-local-pagination-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add established build-only environment
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-time-fix-ebay-local-pagination-20260728.yml')
          text = path.read_text()
          old = '''    runs-on: ubuntu-latest
            steps:
          '''
          new = '''    runs-on: ubuntu-latest
            env:
              NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
              NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
              SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
              ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
              NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
              STRIPE_SECRET_KEY: sk_test_build_only_placeholder
              NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
              STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
              EBAY_CLIENT_ID: build-only-placeholder-client-id
              EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
              EBAY_ENVIRONMENT: production
              TCOS_LIVE_PAYMENTS_ENABLED: "false"
              TCOS_SHIPPING_PURCHASE_MODE: dry_run
              TCOS_LIVE_SHIPPING_ENABLED: "false"
            steps:
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one writer job marker; found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/one-time-add-pagination-validation-env-20260728.yml').unlink()
          PY

      - name: Commit writer environment fix
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add .github/workflows/one-time-fix-ebay-local-pagination-20260728.yml .github/workflows/one-time-add-pagination-validation-env-20260728.yml
          git commit -m "Use standard build environment for pagination validation"
          git push origin HEAD:agent/fix-ebay-local-pagination-20260728
