name: Temporary All Inventory Policy Writer

on:
  push:
    branches:
      - agent/collectibles-catalog-sync-20260728
    paths:
      - "scripts/apply-all-inventory-exclusion-policy.py"
      - ".github/workflows/temporary-all-inventory-policy-writer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-all-inventory-exclusion-policy.py"
      - ".github/workflows/temporary-all-inventory-policy-writer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-inventory-policy-writer
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collectibles-catalog-sync-20260728
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply literal catalog policy
        run: python scripts/apply-all-inventory-exclusion-policy.py
      - name: Install exact dependencies
        run: npm ci
      - name: Run catalog policy regressions
        run: |
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
      - name: Lint catalog policy paths
        run: >-
          npx eslint
          src/lib/sports-card-launch-scope.ts
          src/lib/ebay-authoritative-store-sync.ts
          src/lib/server-inventory-engine.ts
          scripts/run-storefront-taxonomy-regressions.ts
          scripts/run-ebay-import-admin-client-simulations.ts
      - name: Build production application
        run: npm run build
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/ebay-authoritative-store-sync.ts \
            scripts/run-storefront-taxonomy-regressions.ts \
            scripts/run-ebay-import-admin-client-simulations.ts
          git commit -m "Enforce literal eBay catalog exclusions"
          git push origin HEAD:agent/collectibles-catalog-sync-20260728
