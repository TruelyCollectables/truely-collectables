name: Deal Hunter Market History Production Proof V2 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deal-hunter-market-history-prod-proof-v2-20260807.yml"
      - "scripts/run-deal-hunter-market-history-prod-proof.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deal-hunter-market-history-prod-proof-v2-20260807
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: ops/deal-hunter-market-history-prod-proof-v2-20260807
  FEATURE_MERGE_SHA: dc781cf690bc9adb389d605d2b2e896e71c20c5e
  VERCEL_SCOPE: truelycollectables-projects
  EVIDENCE_DIR: .audit/deal-hunter-market-history-prod-proof-v2-20260807

jobs:
  production-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/deal-hunter-market-history-prod-proof-v2-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out guarded operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on feature ancestry and operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$FEATURE_MERGE_SHA" "$current_main"
          git merge-base --is-ancestor "$FEATURE_MERGE_SHA" HEAD
          scope_base="$(git merge-base origin/main HEAD)"
          mapfile -t changed < <(git diff --name-only "$scope_base"...HEAD | sort)
          expected=(
            .github/workflows/deal-hunter-market-history-prod-proof-v2-20260807.yml
            scripts/run-deal-hunter-market-history-prod-proof.mjs
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git diff --check "$scope_base"...HEAD
          echo "EXPECTED_MAIN_SHA=$current_main" >> "$GITHUB_ENV"
          printf '%s\n' "$current_main" > "$EVIDENCE_DIR/current-main-sha.txt"
          printf '%s\n' "$FEATURE_MERGE_SHA" > "$EVIDENCE_DIR/feature-merge-sha.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Resolve Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/deal-hunter-market-history-proof-v2"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/deal-hunter-market-history-proof-v2/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/deal-hunter-market-history-proof-v2/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/deal-hunter-market-history-proof-v2/production.env" >> "$GITHUB_ENV"

      - name: Reconfirm feature is still on current main before DB mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$FEATURE_MERGE_SHA" origin/main
          printf '%s\n' "$(git rev-parse origin/main)" > "$EVIDENCE_DIR/pre-db-current-main-sha.txt"

      - name: Apply Deal Hunter migrations and run rollback-only Production proof
        run: node scripts/run-deal-hunter-market-history-prod-proof.mjs

      - name: Verify live Production Deal Hunter route boundary
        shell: bash
        run: |
          set -euo pipefail
          base="https://truelycollectables.com"
          root="$(curl --location --silent --show-error --max-time 90 --output "$EVIDENCE_DIR/root.html" --write-out '%{http_code}' "$base/")"
          test "$root" = "200"
          history="$(curl --silent --show-error --max-time 60 --output "$EVIDENCE_DIR/history-unauthorized.json" --write-out '%{http_code}' "$base/api/instacomp/market-history")"
          test "$history" = "401"
          printf '{"root":%s,"marketHistoryUnauthorized":%s}\n' "$root" "$history" > "$EVIDENCE_DIR/deployment-boundaries.json"

      - name: Remove pulled Production environment
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deal-hunter-market-history-proof-v2/production.env"

      - name: Upload sanitized Production proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-hunter-market-history-prod-proof-v2-20260807
          path: .audit/deal-hunter-market-history-prod-proof-v2-20260807
          if-no-files-found: warn
          retention-days: 90
