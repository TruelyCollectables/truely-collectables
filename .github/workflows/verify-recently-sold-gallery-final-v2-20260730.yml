name: Verify Recently Sold Gallery Final V2 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-recently-sold-gallery-final-v2-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-final-live:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/verify-recently-sold-gallery-final-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 62185767fb910e2e0ba05a1e5a373994cc251987
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: 62185767fb910e2e0ba05a1e5a373994cc251987
          fetch-depth: 0

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          grep -Fq 'href: "/recently-sold", label: "Recently Sold"' src/app/components/Navbar.tsx
          grep -Fq 'Recently Sold — See What You Missed' src/app/recently-sold/page.tsx
          grep -Fq 'ProductImageGallery' src/app/product/'[id]'/page.tsx
          grep -Fq 'ProductImageGallery' src/app/product/'[id]'/layout.tsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/final-gallery-v2"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/final-gallery-v2/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/final-gallery-v2/production.env"

      - name: Retrieve Production server key and two-photo candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createClient } from '@supabase/supabase-js';

          const workDir = path.join(process.env.RUNNER_TEMP, 'final-gallery-v2');
          const text = fs.readFileSync(path.join(workDir, 'production.env'), 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const productionUrl = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl) throw new Error('Production Supabase URL missing.');
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          const body = await response.text();
          if (!response.ok) throw new Error(`Supabase key retrieval failed: HTTP ${response.status}: ${body.slice(0, 1000)}`);
          const keys = JSON.parse(body);
          const elevated = Array.isArray(keys)
            ? keys.find((entry) => typeof entry?.api_key === 'string' && entry.api_key.startsWith('sb_secret_'))
              || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase().includes('service'))
            : null;
          const serviceKey = elevated?.api_key;
          if (!serviceKey) throw new Error('No Production server key returned.');
          console.log('::add-mask::' + serviceKey);

          const supabase = createClient(productionUrl, serviceKey, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          async function allRows(factory) {
            const rows = [];
            for (let page = 0; page < 50; page += 1) {
              const from = page * 1000;
              const { data, error } = await factory(from, from + 999);
              if (error) throw error;
              const batch = data || [];
              rows.push(...batch);
              if (batch.length < 1000) return rows;
            }
            throw new Error('Pagination exceeded 50000 rows.');
          }

          const products = await allRows((from, to) =>
            supabase.from('products').select('id,title,quantity,store_id')
              .gt('quantity', 0).order('id', { ascending: false }).range(from, to),
          );
          const productIds = new Set(products.map((row) => Number(row.id)));
          const inventory = await allRows((from, to) =>
            supabase.from('inventory_items').select('id,legacy_product_id,store_id')
              .order('id', { ascending: false }).range(from, to),
          );
          const activeInventory = inventory.filter((row) => productIds.has(Number(row.legacy_product_id)));
          const counts = new Map();
          for (let offset = 0; offset < activeInventory.length; offset += 20) {
            const ids = activeInventory.slice(offset, offset + 20).map((row) => String(row.id));
            if (!ids.length) continue;
            const { data, error } = await supabase.from('inventory_images')
              .select('inventory_item_id,image_url,sort_order').in('inventory_item_id', ids);
            if (error) throw error;
            for (const row of data || []) {
              const id = String(row.inventory_item_id);
              if (!counts.has(id)) counts.set(id, new Set());
              const url = String(row.image_url || '').trim();
              if (url) counts.get(id).add(url);
            }
          }
          const candidates = [];
          for (const row of activeInventory) {
            if ((counts.get(String(row.id))?.size || 0) >= 2) {
              candidates.push(Number(row.legacy_product_id));
              if (candidates.length >= 150) break;
            }
          }
          if (!candidates.length) throw new Error('No active two-photo candidates found.');
          const receipt = {
            activeProducts: products.length,
            activeInventory: activeInventory.length,
            candidateCount: candidates.length,
            candidates,
          };
          fs.writeFileSync(path.join(workDir, 'candidates.json'), JSON.stringify(receipt, null, 2));
          console.log(JSON.stringify({
            activeProducts: receipt.activeProducts,
            activeInventory: receipt.activeInventory,
            candidateCount: receipt.candidateCount,
            firstCandidates: candidates.slice(0, 10),
          }, null, 2));
          NODE

      - name: Verify live routes and a real public front-back item
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(node -e 'const r=require(process.argv[1]); for(const id of r.candidates) console.log(id)' "$RUNNER_TEMP/final-gallery-v2/candidates.json")
          for attempt in $(seq 1 10); do
            shop_file="$RUNNER_TEMP/final-gallery-v2/shop.html"
            sold_file="$RUNNER_TEMP/final-gallery-v2/sold.html"
            shop_status="$(curl -sS -L --max-time 60 -o "$shop_file" -w '%{http_code}' "https://truelycollectables.com/shop?final_v2=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            sold_status="$(curl -sS -L --max-time 60 -o "$sold_file" -w '%{http_code}' "https://truelycollectables.com/recently-sold?final_v2=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            route_status="$(curl -sS -L --max-time 60 -o /dev/null -w '%{http_code}' -X POST "https://truelycollectables.com/api/internal/recently-sold-gallery-sync?final_v2=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"

            public_two_photo_id=""
            checked=0
            for candidate in "${candidates[@]}"; do
              checked=$((checked + 1))
              [ "$checked" -le 60 ] || break
              product_file="$RUNNER_TEMP/final-gallery-v2/product-${candidate}.html"
              product_status="$(curl -sS -L --max-time 30 -o "$product_file" -w '%{http_code}' "https://truelycollectables.com/product/${candidate}?final_v2=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
              if [ "$product_status" = "200" ] \
                && grep -Fq 'Front photo' "$product_file" \
                && grep -Fq 'Back photo' "$product_file"; then
                public_two_photo_id="$candidate"
                break
              fi
            done

            shop_ok=false
            sold_ok=false
            if [ "$shop_status" = "200" ] \
              && grep -Fq '/recently-sold' "$shop_file" \
              && ! grep -Fq 'Error loading products' "$shop_file"; then shop_ok=true; fi
            if [ "$sold_status" = "200" ] \
              && grep -Fq 'Recently Sold' "$sold_file" \
              && grep -Fq 'See What You Missed' "$sold_file"; then sold_ok=true; fi

            echo "attempt=${attempt} shop=${shop_status}/${shop_ok} sold=${sold_status}/${sold_ok} route=${route_status} public_two_photo_id=${public_two_photo_id:-none} checked=${checked}"
            if [ "$shop_ok" = true ] \
              && [ "$sold_ok" = true ] \
              && [ -n "$public_two_photo_id" ] \
              && [ "$route_status" != "200" ] \
              && [ "$route_status" != "401" ]; then
              echo "Final live Recently Sold and front/back gallery verification passed with product ${public_two_photo_id}."
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/final-gallery-v2"
