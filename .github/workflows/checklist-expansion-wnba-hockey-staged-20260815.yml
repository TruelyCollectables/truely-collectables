name: Checklist Expansion WNBA Hockey Staged 20260815

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: checklist-expansion-wnba-hockey-staged-20260815
  cancel-in-progress: false

jobs:
  direct-harvest:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 100
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PUBLIC_WEB_MINIMUM_CARD_ROWS: '25'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          npm ci
          node --check scripts/promote-mainstream-2005plus-public-web-candidates.mjs
          node --check scripts/mainstream-checklist/gogts-structured-normalizer.mjs
          MAINSTREAM_CHECKLIST_SELF_TEST=true node --import tsx scripts/ingest-mainstream-checklist-backlog.mjs

      - name: Enable GoGTS normalization
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'scripts/mainstream-checklist/source-tools.mjs';
          let source = readFileSync(path, 'utf8');
          const importAnchor = 'import { extname, resolve } from "node:path";\n';
          const importLine = 'import { normalizeGoGtsStructuredText } from "./gogts-structured-normalizer.mjs";\n';
          if (!source.includes(importLine)) {
            if (!source.includes(importAnchor)) throw new Error('GoGTS normalizer import anchor not found');
            source = source.replace(importAnchor, `${importAnchor}${importLine}`);
          }
          const parseAnchor = '  const text = extractText(downloaded, filename);';
          const normalizedParse = '  const text = normalizeGoGtsStructuredText(extractText(downloaded, filename));';
          if (!source.includes(normalizedParse)) {
            const n = source.split(parseAnchor).length - 1;
            if (n !== 1) throw new Error(`Expected one parser handoff anchor, found ${n}`);
            source = source.replace(parseAnchor, normalizedParse);
          }
          writeFileSync(path, source, 'utf8');
          NODE
          node --check scripts/mainstream-checklist/source-tools.mjs

      - name: Resolve and prove Production Supabase access
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/expansion-production"
          mkdir -p "$root"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$root/projects.json" "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$root/api-keys.json" "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$root/api-keys.json")"
          test -n "$project_ref"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$project_ref.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Write expansion target manifest
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/expansion-harvest"
          mkdir -p "$out/apply"
          cat > "$out/targets.json" <<'JSON'
          [
            {"exactSetKey":"basketball|2019|donruss|wnba","year":2019,"sport":"basketball","sourceUrl":"https://gogts.net/2019-donruss-wnba-basketball-cards-checklist/"},
            {"exactSetKey":"basketball|2020|panini|prizm-wnba","year":2020,"sport":"basketball","sourceUrl":"https://gogts.net/2020-panini-prizm-wnba-basketball-cards-checklist/"},
            {"exactSetKey":"basketball|2021|panini|prizm-wnba","year":2021,"sport":"basketball","sourceUrl":"https://cconnect.s3.amazonaws.com/wp-content/uploads/2021/08/2021-Panini-Prizm-WNBA-Basketball-checklist-Excel-spreadsheet.xlsx"},
            {"exactSetKey":"basketball|2022|panini|revolution-wnba-added","year":2022,"sport":"basketball","sourceUrl":"https://gogts.net/2022-panini-revolution-wnba-basketball-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|o-pee-chee-nhl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-o-pee-chee-nhl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|parkhurst-nhl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-parkhurst-nhl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|skybox-metal-universe-nhl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-skybox-metal-universe-nhl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|pwhl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-upper-deck-pwhl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|sp-game-used-nhl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-upper-deck-sp-game-used-nhl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|flair-nhl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-flair-nhl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|ultimate-collection-nhl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-upper-deck-ultimate-collection-nhl-hockey-cards/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|chl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-upper-deck-chl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|ahl","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-upper-deck-ahl-hockey-cards-checklist/"},
            {"exactSetKey":"hockey|2025-26|upper-deck|sp-nhl-retail","year":2025,"sport":"hockey","sourceUrl":"https://gogts.net/2025-26-upper-deck-sp-nhl-hockey-cards-retail-checklist/"}
          ]
          JSON
          jq -e 'length == 14 and all(.[]; (.exactSetKey|length)>0 and (.sourceUrl|length)>0)' "$out/targets.json" >/dev/null
          jq -r 'to_entries[] | "\(.key+1). \(.value.exactSetKey) -> \(.value.sourceUrl)"' "$out/targets.json"

      - name: Validate and persist every expansion source fail-closed
        shell: bash
        run: |
          set -u
          out="$RUNNER_TEMP/expansion-harvest"
          total="$(jq 'length' "$out/targets.json")"
          attempted=0
          while IFS= read -r target; do
            attempted=$((attempted+1))
            key="$(jq -r '.exactSetKey' <<<"$target")"
            url="$(jq -r '.sourceUrl' <<<"$target")"
            year="$(jq -r '.year' <<<"$target")"
            sport="$(jq -r '.sport' <<<"$target")"
            slug="$(printf '%s' "$key" | tr '|/' '__' | tr -cd '[:alnum:]_.-')"
            queue="$out/apply/$slug-queue.json"
            filter="$out/apply/$slug-filter.json"
            receipt="$out/apply/$slug-receipt.json"
            validated="$out/apply/$slug-validated.json"

            jq -n --arg key "$key" --argjson year "$year" --arg sport "$sport" '{schema:"tcos.checklist.mainstream2005plusCandidateValidationQueue.v1",count:1,targets:[{exactSetKey:$key,year:$year,sport:$sport,sourceArtifact:"tonight-expansion-20260815",exactCandidateCount:1,trustedAutoImportCandidateCount:1,candidates:[]}]}' > "$queue"
            jq -n --arg key "$key" --arg url "$url" '{schema:"tcos.checklist.tonightExpansionPinnedSource.v1",targets:[{exactSetKey:$key,sourceUrl:$url}]}' > "$filter"

            export PUBLIC_WEB_CANDIDATE_QUEUE="$queue"
            export PUBLIC_WEB_TARGET_FILTER="$filter"
            export PUBLIC_WEB_PROMOTION_APPLY=true
            export PUBLIC_WEB_PROMOTION_OUTPUT="$receipt"
            export PUBLIC_WEB_VALIDATED_TARGETS_OUTPUT="$validated"

            echo "=== EXPANSION APPLY $attempted/$total :: $key ==="
            if timeout 300s node --import tsx scripts/promote-mainstream-2005plus-public-web-candidates.mjs; then
              rc=0
            else
              rc=$?
            fi
            if [ ! -s "$receipt" ]; then
              jq -n --arg key "$key" --arg url "$url" --argjson rc "$rc" '{schema:"tcos.checklist.syntheticFailureReceipt.v1",results:[{exactSetKey:$key,status:"failed",sourceUrl:$url,message:("ingest process produced no receipt; exit="+($rc|tostring))}]}' > "$receipt"
            fi
            status="$(jq -r '.results[0].status // "unknown"' "$receipt")"
            persisted="$(jq -r '.results[0].persistence.ok // false' "$receipt")"
            cards="$(jq -r '.results[0].counts.cards // 0' "$receipt")"
            parallels="$(jq -r '.results[0].counts.parallels // 0' "$receipt")"
            echo "RESULT $key status=$status persisted=$persisted cards=$cards parallels=$parallels rc=$rc"
          done < <(jq -c '.[]' "$out/targets.json")

          python - <<'PY'
          import glob,json,os
          root=os.environ['RUNNER_TEMP']+'/expansion-harvest/apply'
          rows=[]
          for p in sorted(glob.glob(root+'/*-receipt.json')):
            try: r=json.load(open(p))
            except Exception: continue
            rows.extend(r.get('results',[]))
          wins=[x for x in rows if x.get('status')=='imported' and (x.get('persistence') or {}).get('ok') is True]
          failures=[x for x in rows if x not in wins]
          summary={'schema':'tcos.checklist.tonightExpansionWnbaHockeySummary.v1','attempted':len(rows),'productionPersistedCount':len(wins),'wins':wins,'nonWins':failures}
          json.dump(summary,open(os.environ['RUNNER_TEMP']+'/expansion-harvest/production-summary.json','w'),indent=2)
          print(json.dumps({'attempted':len(rows),'productionPersistedCount':len(wins),'nonWins':len(failures)}))
          PY
          jq '{attempted,productionPersistedCount,wins:[.wins[]|{exactSetKey,sourceUrl,counts,persistence}],nonWins:[.nonWins[]|{exactSetKey,status,sourceUrl,message,errors}]}' "$out/production-summary.json"
          test "$(jq '.attempted' "$out/production-summary.json")" -eq "$total"
          test "$(jq '.productionPersistedCount' "$out/production-summary.json")" -gt 0

      - name: Upload expansion receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-expansion-wnba-hockey-${{ github.run_id }}
          path: ${{ runner.temp }}/expansion-harvest
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup protected files
        if: always()
        run: rm -rf "$RUNNER_TEMP/expansion-production" .env.local .env.production.local .vercel
