name: Deploy Fixed Launch SHA

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-fixed-launch-sha.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-fixed-launch-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT_NAME: truely-collectables
      LAUNCH_SHA: ecc5f566d9cfd9a2cc7bcac56a09a24672c92487
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out exact launch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LAUNCH_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify fixed commit and credentials
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$LAUNCH_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build exact launch commit
        run: npm run build

      - name: Link Production project without deploying
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tcos-vercel-cli-56.2.0"
          npm --prefix "$RUNNER_TEMP/tcos-vercel-cli-56.2.0" exec --yes --package=vercel@56.2.0 -- \
            vercel --cwd "$PWD" link --yes --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color

      - name: Deploy exact launch commit to Production
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix "$RUNNER_TEMP/tcos-vercel-cli-56.2.0" exec --yes --package=vercel@56.2.0 -- \
            vercel --cwd "$PWD" deploy --prod --yes --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" --no-color \
            | tee "$RUNNER_TEMP/fixed-launch-deploy.log"
          cp "$RUNNER_TEMP/fixed-launch-deploy.log" fixed-launch-deploy.log

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-launch-deploy-evidence
          path: fixed-launch-deploy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove project cache
        if: always()
        run: rm -rf .vercel
