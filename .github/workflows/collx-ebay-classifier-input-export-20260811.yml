name: CollX eBay Classifier Input Export 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-ebay-classifier-input-export-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Export active eBay products and linked inventory images read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json,os,subprocess
          API='https://api.supabase.com/v1'; T=os.environ['SUPABASE_ACCESS_TOKEN']; STORE=os.environ['FLAGSHIP_STORE_ID']
          def call(method,url,body=None):
            cmd=['curl','-sS','--max-time','120','-X',method,'-H',f'Authorization: Bearer {T}','-H','Accept: application/json','-H','Content-Type: application/json','-o','/tmp/out','-w','%{http_code}']
            if body is not None: cmd+=['--data-binary',json.dumps(body)]
            cmd+=[url]; p=subprocess.run(cmd,capture_output=True,text=True); raw=open('/tmp/out').read() if os.path.exists('/tmp/out') else ''
            try:b=json.loads(raw) if raw else None
            except:b=raw
            return int((p.stdout or '0').strip()[-3:]),b
          s,ps=call('GET',API+'/projects'); cs=[p for p in ps] if s==200 and isinstance(ps,list) else []; cs=[p for p in cs if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(cs)!=1: raise SystemExit(2)
          ref=str(cs[0].get('id') or cs[0].get('ref'))
          q=f"""
          with ep as (
            select id,title,description,price,quantity,image_url,sport,player,sku,ebay_item_id
            from public.products
            where store_id='{STORE}'::uuid and archived_at is null and ebay_item_id is not null
          ), linked as (
            select i.id inventory_item_id,i.legacy_product_id
            from public.inventory_items i join ep p on p.id=i.legacy_product_id
            where i.store_id='{STORE}'::uuid
          ), imgs as (
            select l.legacy_product_id,array_agg(ii.image_url order by ii.sort_order,ii.id) filter(where ii.image_url is not null) inventory_images
            from linked l left join public.inventory_images ii on ii.inventory_item_id=l.inventory_item_id
            group by l.legacy_product_id
          )
          select ep.*,coalesce(imgs.inventory_images,array[]::text[]) inventory_images from ep left join imgs on imgs.legacy_product_id=ep.id order by ep.id;
          """
          s,data=call('POST',f'{API}/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':True})
          if s not in (200,201) or not isinstance(data,list): print('SQL',s); raise SystemExit(3)
          print('EBAY_PRODUCTS='+str(len(data)))
          open('/tmp/collx-ebay-classifier-input.json','w').write(json.dumps(data,separators=(',',':'),ensure_ascii=False))
          PY
      - name: Upload classifier input
        uses: actions/upload-artifact@v4
        with:
          name: collx-ebay-classifier-input-20260811
          path: /tmp/collx-ebay-classifier-input.json
          if-no-files-found: error
          retention-days: 1
