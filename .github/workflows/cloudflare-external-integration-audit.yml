name: Cloudflare Final Cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-external-integration-trigger'
      - '.github/workflows/cloudflare-external-integration-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-cloudflare-final-cutover
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TEAM_SLUG: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  WORKER: truely-collectables-preview
  PREVIEW_URL: https://truely-collectables-preview.truelycollectables.workers.dev
  APEX: truelycollectables.com
  WWW: www.truelycollectables.com
  ZONE_PROBE: cf-cutover-probe.truelycollectables.com

jobs:
  deploy-and-validate:
    name: Deploy optimized current main and validate Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VERCEL_TOKEN SUPABASE_ACCESS_TOKEN; do
            test -n "${!key:-}" || { echo "Missing $key"; exit 2; }
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application and Cloudflare tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.2 wrangler@4.122.0 vercel@56.2.0 dotenv@latest

      - name: Pull Truely production build environment
        shell: bash
        run: |
          set -euo pipefail
          npx vercel link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color >/dev/null
          umask 077
          npx vercel env pull .env.production.local \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --yes \
            --no-color >/dev/null
          test -s .env.production.local

      - name: Recover only build-critical Supabase keys if Vercel redacts them
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const dotenv = require('dotenv');
          async function main() {
            const path = '.env.production.local';
            const parsed = dotenv.parse(fs.readFileSync(path));
            const needAnon = !String(parsed.NEXT_PUBLIC_SUPABASE_ANON_KEY || '').trim();
            const needService = !String(parsed.SUPABASE_SERVICE_ROLE_KEY || '').trim();
            if (!needAnon && !needService) return;
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/api-keys?reveal=true`, {
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, accept: 'application/json' },
            });
            if (!response.ok) throw new Error(`Supabase Management API HTTP ${response.status}`);
            const keys = await response.json();
            const anon = keys.find((key) => String(key?.name || '').toLowerCase() === 'anon' && key?.api_key)?.api_key
              || keys.filter((key) => String(key?.type || '').toLowerCase() === 'publishable' && key?.api_key)[0]?.api_key;
            const service = keys.find((key) => String(key?.name || '').toLowerCase() === 'service_role' && key?.api_key)?.api_key
              || keys.filter((key) => String(key?.type || '').toLowerCase() === 'secret' && key?.api_key)[0]?.api_key;
            if (needAnon && !anon) throw new Error('Could not recover Supabase anon key');
            if (needService && !service) throw new Error('Could not recover Supabase service key');
            if (needAnon) { parsed.NEXT_PUBLIC_SUPABASE_ANON_KEY = String(anon); console.log(`::add-mask::${anon}`); }
            if (needService) { parsed.SUPABASE_SERVICE_ROLE_KEY = String(service); console.log(`::add-mask::${service}`); }
            fs.writeFileSync(path, Object.entries(parsed).map(([k,v]) => `${k}=${JSON.stringify(String(v ?? ''))}`).join('\n') + '\n', { mode: 0o600 });
          }
          main().catch((error) => { console.error(error.message || String(error)); process.exit(5); });
          NODE

      - name: Build current main for Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const dotenv = require('dotenv');
          const parsed = dotenv.parse(fs.readFileSync('.env.production.local'));
          for (const key of ['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY','NEXT_PUBLIC_SITE_URL']) {
            if (!String(parsed[key] || '').trim()) throw new Error(`Missing build-critical value: ${key}`);
          }
          console.log('Build-critical production values verified; values are not printed.');
          const result = spawnSync('npx', ['opennextjs-cloudflare', 'build'], { stdio: 'inherit', env: { ...process.env, ...parsed } });
          process.exit(result.status ?? 1);
          NODE

      - name: Deploy current main while preserving recovered Cloudflare runtime secrets
        run: npx wrangler deploy --config wrangler.preview.jsonc

      - name: Validate storefront and integrations on Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          probe() {
            local path="$1"
            local tag="$2"
            local headers="/tmp/${tag}.headers"
            local out
            out=$(curl -L --fail-with-body -sS --max-time 45 -D "$headers" -o /dev/null -w '%{http_code} %{time_total}' "$PREVIEW_URL$path")
            echo "$path -> $out"
            grep -qi '^x-truely-origin: cloudflare-worker' "$headers" || { echo "Missing Cloudflare origin proof on $path"; exit 30; }
          }
          probe '/product/1991' product
          probe '/shop' shop
          probe '/' home
          probe '/admin/login' admin
          probe '/robots.txt' robots

          curl -L --fail-with-body -sS --max-time 30 -D /tmp/ebay.headers "$PREVIEW_URL/api/ebay/listings" -o /tmp/ebay.json
          grep -qi '^x-truely-origin: cloudflare-worker' /tmp/ebay.headers
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/ebay.json','utf8'));
          if (body.authenticated !== true) throw new Error('Cloudflare eBay client authentication failed');
          console.log('eBay client authentication -> PASS');
          NODE

          curl -L -sS --max-time 35 -D /tmp/instacomp.headers "$PREVIEW_URL/api/instacomp/internal-readiness" -o /tmp/instacomp.json -w '%{http_code}' > /tmp/instacomp.status
          grep -qi '^x-truely-origin: cloudflare-worker' /tmp/instacomp.headers
          node - <<'NODE'
          const fs = require('node:fs');
          const status = Number(fs.readFileSync('/tmp/instacomp.status','utf8'));
          const body = JSON.parse(fs.readFileSync('/tmp/instacomp.json','utf8'));
          console.log(`InstaComp -> HTTP ${status}; configured=${body.configured}; reachable=${body.reachable}; databaseReady=${body.internalMemoryReady}; checklistReady=${body.checklistReady}; reason=${body.reason || 'none'}`);
          if (!body.configured || !body.reachable || status !== 200) throw new Error('Cloudflare InstaComp readiness failed');
          NODE

          curl -L --fail-with-body -sS --max-time 45 -D /tmp/payments.headers "$PREVIEW_URL/api/admin/live-payment-launch" -o /tmp/payments.json
          grep -qi '^x-truely-origin: cloudflare-worker' /tmp/payments.headers
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/payments.json','utf8'));
          if (body.success !== true || !body.report) throw new Error('Cloudflare live-payment readiness route failed');
          console.log(`Live-payment readiness route -> PASS; checks=${Array.isArray(body.report.checks) ? body.report.checks.length : 0}`);
          NODE

      - name: Remove temporary build and probe files
        if: always()
        shell: bash
        run: rm -f .env.production.local /tmp/*.headers /tmp/ebay.json /tmp/instacomp.json /tmp/instacomp.status /tmp/payments.json

  cutover:
    name: Route live traffic, pause Vercel, then enable Cloudflare cron
    needs: deploy-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve Vercel project and verify Cloudflare preview proof
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail-with-body -sS --max-time 45 -D /tmp/preflight.headers -o /dev/null "$PREVIEW_URL/product/1991"
          grep -qi '^x-truely-origin: cloudflare-worker' /tmp/preflight.headers || { echo 'Preview is not proven to be Cloudflare.'; exit 40; }
          curl -sS --fail-with-body --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?slug=$VERCEL_TEAM_SLUG" \
            -o /tmp/vercel-project.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/vercel-project.json','utf8'));
          if(!p.id) throw new Error('Vercel project ID not resolved');
          fs.writeFileSync('/tmp/vercel-project-id', p.id);
          console.log(`Vercel project resolved; paused=${Boolean(p.paused)}`);
          NODE

      - name: Resolve Cloudflare zone through temporary Worker domain
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
          curl -sS --fail-with-body -X PUT "$api" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"hostname\":\"$ZONE_PROBE\",\"service\":\"$WORKER\",\"zone_name\":\"$APEX\"}" \
            -o /tmp/zone-probe.json
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/zone-probe.json','utf8'));
          if(!r.success || !r.result?.zone_id || !r.result?.id) throw new Error('Could not resolve Cloudflare zone from temporary Worker domain');
          fs.writeFileSync('/tmp/zone-id',r.result.zone_id);
          fs.writeFileSync('/tmp/probe-domain-id',r.result.id);
          console.log('Cloudflare zone resolved.');
          NODE
          probe_id=$(cat /tmp/probe-domain-id)
          curl -sS --fail-with-body -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$probe_id" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/tmp/probe-delete.json

      - name: Snapshot and switch both live Worker routes
        shell: bash
        run: |
          set -euo pipefail
          zone=$(cat /tmp/zone-id)
          base="https://api.cloudflare.com/client/v4/zones/$zone/workers/routes"
          curl -sS --fail-with-body "$base" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/routes-before.json
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/routes-before.json','utf8'));
          if(!r.success || !Array.isArray(r.result)) throw new Error('Could not list Worker routes');
          const patterns=['truelycollectables.com/*','www.truelycollectables.com/*'];
          const snapshot={};
          for(const pattern of patterns){
            const old=r.result.find(x=>x.pattern===pattern);
            snapshot[pattern]=old ? {id:old.id,script:old.script ?? null} : null;
          }
          fs.writeFileSync('/tmp/route-snapshot.json',JSON.stringify(snapshot));
          NODE
          for pattern in 'truelycollectables.com/*' 'www.truelycollectables.com/*'; do
            route_id=$(node -e "const s=require('/tmp/route-snapshot.json'); console.log(s[process.argv[1]]?.id||'')" "$pattern")
            body=$(node -e "console.log(JSON.stringify({pattern:process.argv[1],script:process.argv[2]}))" "$pattern" "$WORKER")
            if [ -n "$route_id" ]; then
              curl -sS --fail-with-body -X PUT "$base/$route_id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/tmp/route-update.json
            else
              curl -sS --fail-with-body -X POST "$base" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/tmp/route-create.json
            fi
          done
          curl -sS --fail-with-body "$base" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/routes-after.json
          node <<'NODE'
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/routes-after.json','utf8'));
          for(const p of ['truelycollectables.com/*','www.truelycollectables.com/*']){
            const x=r.result?.find(v=>v.pattern===p);
            if(!x||x.script!=='truely-collectables-preview') throw new Error(`Route not active: ${p}`);
          }
          console.log('Both live hostnames route to the Cloudflare Worker.');
          NODE

      - name: Prove live domains are actually served by Cloudflare before pausing Vercel
        shell: bash
        run: |
          set -euo pipefail
          verify_live() {
            local url="$1"
            local tag="$2"
            local ok=0
            for attempt in $(seq 1 12); do
              rm -f "/tmp/${tag}.headers"
              code=$(curl -L -sS --max-time 45 -D "/tmp/${tag}.headers" -o /dev/null -w '%{http_code}' "$url" || true)
              origin=$(grep -i '^x-truely-origin:' "/tmp/${tag}.headers" | tail -1 | tr -d '\r' || true)
              echo "pre-pause $url attempt=$attempt status=$code origin=${origin:-missing}"
              case "$code" in 2*|3*) grep -qi '^x-truely-origin: cloudflare-worker' "/tmp/${tag}.headers" && ok=1;; esac
              [ "$ok" = 1 ] && break
              sleep 2
            done
            test "$ok" = 1
          }
          verify_live "https://$APEX/product/1991" apex_product
          verify_live "https://$APEX/shop" apex_shop
          verify_live "https://$APEX/" apex_home
          verify_live "https://$WWW/" www_home

      - name: Pause Vercel after Cloudflare traffic proof
        shell: bash
        run: |
          set -euo pipefail
          project=$(cat /tmp/vercel-project-id)
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v1/projects/$project/pause?slug=$VERCEL_TEAM_SLUG" \
            -o /tmp/vercel-pause.json
          echo 'Vercel project pause request succeeded.'
          sleep 8

      - name: Prove live site survives with Vercel paused
        shell: bash
        run: |
          set -euo pipefail
          for spec in "https://$APEX/product/1991|post_product" "https://$APEX/shop|post_shop" "https://$APEX/|post_home" "https://$WWW/|post_www" "https://$APEX/admin/login|post_admin"; do
            url=${spec%%|*}; tag=${spec##*|}
            code=$(curl -L -sS --max-time 45 -D "/tmp/${tag}.headers" -o /dev/null -w '%{http_code}' "$url" || true)
            origin=$(grep -i '^x-truely-origin:' "/tmp/${tag}.headers" | tail -1 | tr -d '\r' || true)
            echo "post-pause $url -> $code origin=${origin:-missing}"
            case "$code" in 2*|3*) ;; *) exit 60;; esac
            grep -qi '^x-truely-origin: cloudflare-worker' "/tmp/${tag}.headers" || exit 61
          done
          echo 'Live Truely traffic survives with Vercel paused.'

      - name: Enable Cloudflare scheduler only after Vercel is paused
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/schedules"
          curl -sS --fail-with-body -X PUT "$endpoint" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '[{"cron":"* * * * *"}]' -o /tmp/schedule-put.json
          curl -sS --fail-with-body "$endpoint" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/schedule-get.json
          node <<'NODE'
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/schedule-get.json','utf8'));
          const schedules=r.result?.schedules || r.result || [];
          if(!Array.isArray(schedules)||!schedules.some(x=>x.cron==='* * * * *')) throw new Error('Cloudflare scheduler not confirmed');
          console.log('Cloudflare one-minute scheduler confirmed active.');
          NODE

      - name: Final production proof
        shell: bash
        run: |
          set -euo pipefail
          for spec in "https://$APEX/product/1991|final_product" "https://$APEX/shop|final_shop" "https://$APEX/|final_home"; do
            url=${spec%%|*}; tag=${spec##*|}
            code=$(curl -L -sS --max-time 45 -D "/tmp/${tag}.headers" -o /dev/null -w '%{http_code}' "$url")
            echo "final $url -> $code"
            case "$code" in 2*|3*) ;; *) exit 70;; esac
            grep -qi '^x-truely-origin: cloudflare-worker' "/tmp/${tag}.headers" || exit 71
          done
          echo 'CUTOVER COMPLETE: live traffic and scheduler are on Cloudflare; Vercel production is paused.'

      - name: Emergency rollback on any cutover failure
        if: failure()
        shell: bash
        run: |
          set +e
          schedule_endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/schedules"
          curl -sS -X PUT "$schedule_endpoint" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '[]' >/tmp/schedule-rollback.json
          if [ -s /tmp/vercel-project-id ]; then
            project=$(cat /tmp/vercel-project-id)
            curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
              "https://api.vercel.com/v1/projects/$project/unpause?slug=$VERCEL_TEAM_SLUG" >/tmp/vercel-unpause.json
          fi
          if [ -s /tmp/zone-id ] && [ -s /tmp/route-snapshot.json ]; then
            zone=$(cat /tmp/zone-id)
            base="https://api.cloudflare.com/client/v4/zones/$zone/workers/routes"
            curl -sS "$base" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/routes-current.json
            node <<'NODE' > /tmp/rollback-plan.tsv
          const fs=require('fs');
          const snap=JSON.parse(fs.readFileSync('/tmp/route-snapshot.json','utf8'));
          const current=JSON.parse(fs.readFileSync('/tmp/routes-current.json','utf8')).result||[];
          for(const [pattern,old] of Object.entries(snap)){
            const now=current.find(x=>x.pattern===pattern);
            if(old){ console.log(['restore',now?.id||old.id,pattern,old.script??''].join('\t')); }
            else if(now){ console.log(['delete',now.id,pattern,''].join('\t')); }
          }
          NODE
            while IFS=$'\t' read -r action id pattern script; do
              [ -n "$id" ] || continue
              if [ "$action" = delete ]; then
                curl -sS -X DELETE "$base/$id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null
              else
                body=$(node -e "console.log(JSON.stringify({pattern:process.argv[1],script:process.argv[2]||undefined}))" "$pattern" "$script")
                curl -sS -X PUT "$base/$id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/dev/null
              fi
            done < /tmp/rollback-plan.tsv
          fi
          echo 'Emergency rollback attempted: Cloudflare cron disabled, Vercel unpaused, prior Worker routes restored.'
