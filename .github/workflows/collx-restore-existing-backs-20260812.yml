name: Restore Existing CollX Backs 20260812

on:
  push:
    paths:
      - '.github/workflows/collx-restore-existing-backs-20260812.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collx-restore-existing-backs-20260812
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: 00000000-0000-4000-8000-000000000001
    steps:
      - name: Restore every verified owned CollX back image
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time

          API='https://api.supabase.com/v1'
          TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']
          STORE=os.environ['FLAGSHIP_STORE_ID']
          BATCH=250
          MAX_OFFSET=7000

          def req(method,path,body=None,timeout=180,retries=5):
              last=None
              for attempt in range(retries):
                  out=tempfile.NamedTemporaryFile(delete=False)
                  out.close()
                  cmd=['curl','-sS','--max-time',str(timeout),'-X',method,
                       '-H',f'Authorization: Bearer {TOKEN}',
                       '-H','Accept: application/json',
                       '-H','Content-Type: application/json',
                       '-o',out.name,'-w','%{http_code}',API+path]
                  if body is not None:
                      cmd += ['--data-binary',json.dumps(body)]
                  p=subprocess.run(cmd,capture_output=True,text=True)
                  raw=open(out.name).read()
                  os.unlink(out.name)
                  try: payload=json.loads(raw) if raw else None
                  except Exception: payload=raw
                  try: status=int((p.stdout or '0').strip()[-3:])
                  except Exception: status=0
                  if status in (200,201):
                      return payload
                  last=(status,payload)
                  if status in (429,500,502,503,504,522,524,544) and attempt+1 < retries:
                      time.sleep(2*(attempt+1))
                      continue
                  break
              raise RuntimeError(f'{method} {path} HTTP {last[0] if last else 0}: {str(last[1] if last else "")[:4000]}')

          projects=req('GET','/projects',timeout=30)
          cand=[p for p in projects if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(cand)!=1:
              raise SystemExit(f'Expected exactly one Truely Collectables Supabase project, got {len(cand)}')
          ref=str(cand[0].get('id') or cand[0].get('ref') or '')
          if not ref:
              raise SystemExit('Could not resolve Supabase project ref')

          def sql(query, read_only):
              return req('POST',f'/projects/{ref}/database/query',{
                  'query':query,
                  'parameters':[],
                  'read_only':read_only,
              },180)

          def candidate_cte(offset):
              return f"""
              with batch as (
                select p.id product_id,p.sku,p.title,p.archived_at,p.quantity,p.price,p.store_id
                from public.products p
                where p.store_id='{STORE}'::uuid
                  and p.sku>='COLLX-' and p.sku<'COLLY'
                  and p.ebay_item_id is null
                order by p.id
                offset {offset} limit {BATCH}
              ), candidates as (
                select b.*,i.id inventory_item_id,o.name object_name,
                       'https://{ref}.supabase.co/storage/v1/object/public/truely-product-images/'||o.name canonical_url
                from batch b
                join public.inventory_items i
                  on i.store_id=b.store_id and i.legacy_product_id=b.product_id and i.sku=b.sku
                join lateral (
                  select so.name
                  from storage.objects so
                  where so.bucket_id='truely-product-images'
                    and so.name in (
                      'collx-full/20260811/'||substring(b.sku from 7)||'/back.jpg',
                      'collx-full/20260811/'||substring(b.sku from 7)||'/back.jpeg',
                      'collx-full/20260811/'||substring(b.sku from 7)||'/back.png',
                      'collx-full/20260811/'||substring(b.sku from 7)||'/back.webp'
                    )
                  order by case
                    when so.name like '%/back.jpg' then 0
                    when so.name like '%/back.jpeg' then 1
                    when so.name like '%/back.png' then 2
                    else 3 end
                  limit 1
                ) o on true
              )
              """

          total_mapped=0
          total_inserted=0
          processed=0

          for offset in range(0,MAX_OFFSET,BATCH):
              q=candidate_cte(offset)+"""
              , inserted as (
                insert into public.inventory_images
                  (inventory_item_id,image_url,alt_text,sort_order,is_primary)
                select c.inventory_item_id,c.canonical_url,
                       coalesce(nullif(btrim(c.title),''),c.sku)||' back',1,false
                from candidates c
                where not exists (
                  select 1 from public.inventory_images x
                  where x.inventory_item_id=c.inventory_item_id
                    and x.image_url=c.canonical_url
                )
                returning inventory_item_id
              )
              select
                (select count(*)::int from batch) batch_products,
                (select count(*)::int from candidates) verified_back_objects,
                (select count(*)::int from inserted) restored_back_rows;
              """
              rows=sql(q,False)
              row=(rows or [{}])[0]
              batch_products=int(row.get('batch_products') or 0)
              mapped=int(row.get('verified_back_objects') or 0)
              inserted=int(row.get('restored_back_rows') or 0)
              processed += batch_products
              total_mapped += mapped
              total_inserted += inserted
              print(f'BATCH offset={offset} products={batch_products} verified_backs={mapped} restored={inserted}')
              if batch_products < BATCH:
                  break

          # Normalize only the canonical back rows in small batches. Front images are never changed.
          total_normalized=0
          for offset in range(0,MAX_OFFSET,BATCH):
              q=candidate_cte(offset)+"""
              , updated as (
                update public.inventory_images ii
                   set sort_order=1,
                       is_primary=false,
                       alt_text=coalesce(nullif(btrim(c.title),''),c.sku)||' back'
                  from candidates c
                 where ii.inventory_item_id=c.inventory_item_id
                   and ii.image_url=c.canonical_url
                returning ii.inventory_item_id
              )
              select
                (select count(*)::int from batch) batch_products,
                (select count(*)::int from updated) normalized_back_rows;
              """
              rows=sql(q,False)
              row=(rows or [{}])[0]
              batch_products=int(row.get('batch_products') or 0)
              total_normalized += int(row.get('normalized_back_rows') or 0)
              if batch_products < BATCH:
                  break

          # Hard verification, again batched: every physical canonical back discovered above must now be attached.
          verify_mapped=0
          verify_attached=0
          verify_missing=0
          verify_live_missing=0
          for offset in range(0,MAX_OFFSET,BATCH):
              q=candidate_cte(offset)+"""
              select
                (select count(*)::int from batch) batch_products,
                count(*)::int verified_back_objects,
                count(*) filter (where ii.inventory_item_id is not null)::int attached_back_rows,
                count(*) filter (where ii.inventory_item_id is null)::int missing_back_rows,
                count(*) filter (
                  where c.archived_at is null and c.quantity>0 and c.price>0
                    and ii.inventory_item_id is null
                )::int live_missing_back_rows
              from candidates c
              left join public.inventory_images ii
                on ii.inventory_item_id=c.inventory_item_id
               and ii.image_url=c.canonical_url;
              """
              rows=sql(q,True)
              row=(rows or [{}])[0]
              batch_products=int(row.get('batch_products') or 0)
              verify_mapped += int(row.get('verified_back_objects') or 0)
              verify_attached += int(row.get('attached_back_rows') or 0)
              verify_missing += int(row.get('missing_back_rows') or 0)
              verify_live_missing += int(row.get('live_missing_back_rows') or 0)
              if batch_products < BATCH:
                  break

          result={
            'products_scanned':processed,
            'verified_back_objects':verify_mapped,
            'restored_back_rows':total_inserted,
            'normalized_back_rows':total_normalized,
            'attached_verified_backs':verify_attached,
            'verified_backs_still_missing_attachment':verify_missing,
            'live_verified_backs_still_missing_attachment':verify_live_missing,
          }
          print('FINAL='+json.dumps(result,sort_keys=True))
          if verify_mapped != total_mapped:
              raise SystemExit(f'FAIL: verification mapped {verify_mapped} but restore pass mapped {total_mapped}')
          if verify_missing != 0:
              raise SystemExit('FAIL: verified CollX back objects remain unattached')
          if verify_live_missing != 0:
              raise SystemExit('FAIL: live CollX products with a verified back remain unattached')
          print('COLLX_EXISTING_BACK_RESTORE=SUCCESS')
          PY
