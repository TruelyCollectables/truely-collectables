name: KINGMAKER Pricing Profile Lifecycle

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-pricing-profile-lifecycle.ts"
      - "src/lib/kingmaker-pricing-profile-lifecycle-server.ts"
      - "src/app/api/instacomp/pricing/profiles/**"
      - "scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts"
      - "supabase/migrations/20260803220000_kingmaker_pricing_profile_lifecycle.sql"
      - ".github/workflows/kingmaker-pricing-profile-lifecycle.yml"

jobs:
  verify-profile-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lifecycle regressions
        run: node --import tsx scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts
      - name: Security and audit contracts
        run: |
          set -euo pipefail
          grep -q 'archived_at' supabase/migrations/20260803220000_kingmaker_pricing_profile_lifecycle.sql
          grep -q 'revoke all.*anon, authenticated' supabase/migrations/20260803220000_kingmaker_pricing_profile_lifecycle.sql
          grep -q 'expectedVersion' src/lib/kingmaker-pricing-profile-lifecycle.ts
          grep -q 'assertTrustedInstaCompMutationRequest' src/app/api/instacomp/pricing/profiles/presets/route.ts
          grep -q 'assertTrustedInstaCompMutationRequest' 'src/app/api/instacomp/pricing/profiles/[profileId]/route.ts'
          ! grep -RIni 'beckett' src/lib/kingmaker-pricing-profile-lifecycle* src/app/api/instacomp/pricing/profiles scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts supabase/migrations/20260803220000_kingmaker_pricing_profile_lifecycle.sql
      - name: Lint
        run: npx eslint src/lib/kingmaker-pricing-profile-lifecycle.ts src/lib/kingmaker-pricing-profile-lifecycle-server.ts src/app/api/instacomp/pricing/profiles scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
