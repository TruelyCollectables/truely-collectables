name: KINGMAKER Pricing Profile Lifecycle

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-pricing-profile-lifecycle.ts"
      - "src/lib/kingmaker-pricing-profile-lifecycle-server.ts"
      - "src/app/api/instacomp/pricing/profiles/**"
      - "scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts"
      - "scripts/test-instacomp-pricing-profile-atomic.sql"
      - "supabase/migrations/20260803190000_kingmaker_pricing_profiles.sql"
      - "supabase/migrations/20260803220000_kingmaker_pricing_profile_lifecycle.sql"
      - "supabase/migrations/20260804004500_kingmaker_pricing_profile_atomic_lifecycle.sql"
      - ".github/workflows/kingmaker-pricing-profile-lifecycle.yml"

permissions:
  contents: read

jobs:
  verify-profile-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lifecycle regressions
        run: node --import tsx scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts
      - name: PostgreSQL race, rollback, owner, and replay attacks
        run: psql -h localhost -U postgres -d postgres -f scripts/test-instacomp-pricing-profile-atomic.sql
      - name: Security and audit contracts
        run: |
          set -euo pipefail
          grep -Fq 'pg_advisory_xact_lock' supabase/migrations/20260804004500_kingmaker_pricing_profile_atomic_lifecycle.sql
          grep -Fq 'v_current_version <> p_expected_version' supabase/migrations/20260804004500_kingmaker_pricing_profile_atomic_lifecycle.sql
          grep -q 'revoke all.*anon, authenticated' supabase/migrations/20260804004500_kingmaker_pricing_profile_atomic_lifecycle.sql
          grep -Fq 'Pricing profile expectedVersion is required.' src/lib/kingmaker-pricing-profile-lifecycle-server.ts
          grep -Fq 'expectedVersion: body.expectedVersion' 'src/app/api/instacomp/pricing/profiles/[profileId]/route.ts'
          grep -Fq 'assertTrustedInstaCompMutationRequest' src/app/api/instacomp/pricing/profiles/presets/route.ts
          grep -Fq 'assertTrustedInstaCompMutationRequest' 'src/app/api/instacomp/pricing/profiles/[profileId]/route.ts'
          ! grep -Fq 'resetDefaults' src/lib/kingmaker-pricing-profile-lifecycle-server.ts
          ! grep -RIni 'beckett' src/lib/kingmaker-pricing-profile-lifecycle* src/app/api/instacomp/pricing/profiles scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts scripts/test-instacomp-pricing-profile-atomic.sql supabase/migrations/20260804004500_kingmaker_pricing_profile_atomic_lifecycle.sql
      - name: Lint
        run: npx eslint src/lib/kingmaker-pricing-profile-lifecycle.ts src/lib/kingmaker-pricing-profile-lifecycle-server.ts src/app/api/instacomp/pricing/profiles scripts/run-kingmaker-pricing-profile-lifecycle-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder-admin-session
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
