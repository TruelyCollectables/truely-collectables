name: Patch Complete Admin Static Navigation 20260809

on:
  push:
    branches:
      - fix/kingmaker-certify-current-head-20260809
    paths:
      - ".github/workflows/patch-admin-complete-static-nav-20260809.yml"

permissions:
  contents: write

jobs:
  patch-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-certify-current-head-20260809
          fetch-depth: 0

      - name: Link all remaining runtime-smoked static Admin pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/admin/LegacyAdminDashboard.tsx')
          source = path.read_text('utf-8')

          pricing_anchor = '        { href: "/admin/instacomp/checklist-sentinel", label: "Checklist Sentinel™" },\n'
          pricing_links = pricing_anchor + '''        { href: "/admin/instacomp/pricing", label: "Pricing Command" },
        { href: "/admin/instacomp/pricing/receipts", label: "Pricing Receipts" },
        { href: "/admin/instacomp/pricing/analytics", label: "Pricing Analytics" },
        { href: "/admin/instacomp/pricing/coverage", label: "Pricing Coverage" },
        { href: "/admin/instacomp/pricing/coverage/work-orders", label: "Coverage Work Orders" },
        { href: "/admin/instacomp/pricing/profiles", label: "Pricing Profiles" },
        { href: "/admin/instacomp/pricing/bulk-plan", label: "Bulk Pricing Plan" },
        { href: "/admin/instacomp/pricing/scenarios", label: "Pricing Scenarios" },
        { href: "/admin/instacomp/pricing/review", label: "Pricing Review" },
        { href: "/admin/instacomp/pricing/views", label: "Pricing Views" },
        { href: "/admin/instacomp/pricing/audit", label: "Pricing Audit" },
'''
          if '/admin/instacomp/pricing/coverage/work-orders' not in source:
              if pricing_anchor not in source:
                  raise SystemExit('Checklist Sentinel navigation anchor not found')
              source = source.replace(pricing_anchor, pricing_links, 1)

          market_anchor = '        { href: "/admin/market-intel", label: "Command Desk" },\n'
          market_links = market_anchor + '''        { href: "/admin/market-intel/kingmaker", label: "KINGMAKER Capital Intelligence" },
        { href: "/admin/market-intel/kingmaker/capital-ledger", label: "Capital Ledger Command" },
        { href: "/admin/market-intel/kingmaker/morning-intelligence", label: "Morning Intelligence" },
'''
          if '/admin/market-intel/kingmaker/capital-ledger' not in source:
              if market_anchor not in source:
                  raise SystemExit('Market Intel navigation anchor not found')
              source = source.replace(market_anchor, market_links, 1)

          path.write_text(source, 'utf-8')
          PY
          git diff --check

      - name: Persist complete navigation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/LegacyAdminDashboard.tsx
          if git diff --cached --quiet; then
            echo "Complete static Admin navigation already present."
          else
            git commit -m "Link remaining static Admin command pages"
            git push origin HEAD:fix/kingmaker-certify-current-head-20260809
          fi

# retry-trigger-2
