name: Temporary Authoritative eBay Taxonomy Writer

on:
  push:
    branches:
      - agent/authoritative-ebay-taxonomy-sync-20260728
    paths:
      - "scripts/apply-authoritative-ebay-taxonomy-sync.py"
      - ".github/workflows/temporary-authoritative-ebay-taxonomy-writer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-authoritative-ebay-taxonomy-sync.py"
      - ".github/workflows/temporary-authoritative-ebay-taxonomy-writer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authoritative-ebay-taxonomy-writer
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoritative-ebay-taxonomy-sync-20260728
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply authoritative taxonomy patch
        shell: bash
        run: |
          set -o pipefail
          python scripts/apply-authoritative-ebay-taxonomy-sync.py 2>&1 | tee authoritative-taxonomy-patch.log
      - name: Install exact dependencies
        run: npm ci
      - name: Run storefront and authoritative sync regressions
        run: node --import tsx scripts/run-storefront-taxonomy-regressions.ts
      - name: Lint authoritative taxonomy paths
        run: >-
          npx eslint
          src/lib/ebay-authoritative-store-sync.ts
          src/lib/storefront-taxonomy.ts
          src/lib/ebay-category-mapper.ts
          scripts/run-storefront-taxonomy-regressions.ts
      - name: Build production application
        run: npm run build
      - name: Upload certification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-taxonomy-certification-${{ github.run_number }}
          path: |
            authoritative-taxonomy-patch.log
            src/lib/ebay-authoritative-store-sync.ts
            scripts/run-storefront-taxonomy-regressions.ts
          if-no-files-found: warn
          retention-days: 14
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/ebay-authoritative-store-sync.ts \
            scripts/run-storefront-taxonomy-regressions.ts
          git commit -m "Refresh storefront taxonomy in authoritative eBay sync"
          git push origin HEAD:agent/authoritative-ebay-taxonomy-sync-20260728
