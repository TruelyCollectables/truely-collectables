name: InstaComp GitHub Runtime Secret Diagnostic Pinned 20260727

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/instacomp-github-runtime-secret-diagnostic-pinned-20260727.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: instacomp-github-runtime-secret-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Announce diagnostic
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/143/comments" \
            -f body="Pinned InstaComp GitHub runtime credential diagnostic started on commit \`${GITHUB_SHA}\` (Actions run ${GITHUB_RUN_ID})."

      - name: Check runtime credential presence
        run: |
          node <<'NODE'
          const presence = {
            openAi: Boolean(String(process.env.OPENAI_API_KEY || "").trim()),
            serpApi: Boolean(String(process.env.SERPAPI_API_KEY || "").trim()),
            ebayClientId: Boolean(String(process.env.EBAY_CLIENT_ID || "").trim()),
            ebayClientSecret: Boolean(String(process.env.EBAY_CLIENT_SECRET || "").trim()),
            supabaseUrl: Boolean(String(process.env.NEXT_PUBLIC_SUPABASE_URL || "").trim()),
            supabaseAnon: Boolean(String(process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY || "").trim()),
            supabaseService: Boolean(String(process.env.SUPABASE_SERVICE_ROLE_KEY || "").trim()),
          };
          console.log(`runtime_secret_presence=${JSON.stringify(presence)}`);
          require("node:fs").writeFileSync("runtime-secret-presence.json", `${JSON.stringify(presence, null, 2)}\n`);
          if (!presence.openAi || !presence.serpApi || !presence.ebayClientId || !presence.ebayClientSecret) process.exit(1);
          NODE

      - name: Validate eBay application credentials
        run: |
          node <<'NODE'
          const auth = Buffer.from(`${process.env.EBAY_CLIENT_ID}:${process.env.EBAY_CLIENT_SECRET}`).toString("base64");
          const response = await fetch("https://api.ebay.com/identity/v1/oauth2/token", {
            method: "POST",
            headers: {
              Authorization: `Basic ${auth}`,
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
              grant_type: "client_credentials",
              scope: "https://api.ebay.com/oauth/api_scope",
            }),
            signal: AbortSignal.timeout(30000),
          });
          const payload = await response.json().catch(() => ({}));
          console.log(`ebay_oauth_status=${response.status}`);
          if (!response.ok || !payload.access_token) process.exit(1);
          NODE

      - name: Announce diagnostic passed
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/143/comments" \
            -f body="Pinned InstaComp GitHub runtime diagnostic ${GITHUB_RUN_ID} passed: OpenAI, SerpAPI, and eBay application credentials are present and eBay OAuth succeeded. Vercel can be bypassed for the live torture audit."

      - name: Upload presence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-runtime-secret-presence-${{ github.run_number }}
          path: runtime-secret-presence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Post final status
        if: always()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/143/comments" \
            -f body="Pinned InstaComp GitHub runtime diagnostic ${GITHUB_RUN_ID} finished with job status **${{ job.status }}** on commit \`${GITHUB_SHA}\`."
