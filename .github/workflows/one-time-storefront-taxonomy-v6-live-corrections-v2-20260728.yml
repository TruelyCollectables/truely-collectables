name: One-Time Storefront Taxonomy V6 Live Corrections V2 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-storefront-taxonomy-v6-live-corrections-v2-20260728.yml"

permissions:
  contents: write

concurrency:
  group: one-time-storefront-taxonomy-v6-live-corrections-v2-20260728
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/storefront-taxonomy-v6-live-corrections-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-taxonomy-v6-live-corrections-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply structural live audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          def regex_once(path: Path, pattern: str, replacement: str, label: str) -> None:
              text = path.read_text()
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(updated)

          taxonomy = Path('src/lib/storefront-taxonomy.ts')
          replace_once(taxonomy, 'return Number(metadata.tcos_taxonomy_version || 0) >= 5;', 'return Number(metadata.tcos_taxonomy_version || 0) >= 6;', 'trusted taxonomy version')
          card_evidence = r'''  const isCardPrimary = ["sports_cards", "trading_cards", "sealed_wax"].includes(
            primaryCategory,
          );
          const explicitCardSignal =
            /\b(?:sports |trading |collectible )?cards?\b|\brookie card\b|\bcard #|\b(?:relic|patch|swatch|jersey|memorabilia) card\b|\bsports trading card\b/.test(
              `${objectFocused} ${primaryCategory}`,
            );
          const cardBrandSignal =
            /\b(?:topps|panini|upper deck|bowman|donruss|prizm|skybox|sky box|sp game used|sp authentic|select|national treasures|immaculate|flawless|chronicles|contenders|mosaic|optic|finest|heritage|stadium club|score|fleer|leaf|o pee chee|opc)\b/.test(
              objectFocused,
            );
          const cardCatalogSignal =
            /(?:^|\s)#[a-z0-9-]+\b|\b(?:base|insert|parallel|refractor|rookie|rc|proof|relic|patch|swatch|jersey)\b/.test(
              objectFocused,
            );
          const isCardLike =
            isCardPrimary ||
            explicitCardSignal ||
            (cardBrandSignal && cardCatalogSignal);

          if (!isCardLike)'''
          regex_once(
              taxonomy,
              r'  const isCardPrimary = \["sports_cards", "trading_cards", "sealed_wax"\]\.includes\([\s\S]*?\n\n  if \(!isCardLike\)',
              card_evidence,
              'card versus wearable/object evidence',
          )
          text = taxonomy.read_text()
          old_negative = r'/\b(?:facsimile|pre[- ]?printed|printed signature|reproduction|reprint autograph|unsigned|not signed|not autographed)\b/.test('
          new_negative = r'/\b(?:facsimile|pre[- ]?printed|printed signature|reproduction|reprint autograph|unsigned|not signed|not autographed|non[- ]?auto)\b/.test('
          if text.count(old_negative) != 1:
              raise SystemExit(f'non-auto negative evidence: expected one match, found {text.count(old_negative)}')
          text = text.replace(old_negative, new_negative, 1)
          text = text.replace('tcos_taxonomy_version: "5"', 'tcos_taxonomy_version: "6"', 1)
          text = text.replace('tcos_taxonomy_version: 5', 'tcos_taxonomy_version: 6', 1)
          taxonomy.write_text(text)

          mapper = Path('src/lib/ebay-category-mapper.ts')
          text = mapper.read_text()
          if text.count(old_negative) != 1:
              raise SystemExit(f'mapper non-auto negative evidence: expected one match, found {text.count(old_negative)}')
          mapper.write_text(text.replace(old_negative, new_negative, 1))

          authoritative = Path('src/lib/ebay-authoritative-store-sync.ts')
          replace_once(authoritative, 'const STOREFRONT_TAXONOMY_VERSION = 5;', 'const STOREFRONT_TAXONOMY_VERSION = 6;', 'authoritative taxonomy version')

          shop = Path('src/app/shop/page.tsx')
          replace_once(shop, 'import type { StorefrontSort } from "../../lib/storefront-taxonomy";', 'import { sortStorefrontSections, type StorefrontSort } from "../../lib/storefront-taxonomy";', 'shop taxonomy import')
          replace_once(
              shop,
              '''  const activeFilters = Boolean(q || section || feature || sort !== "section");
            const quickSections = QUICK_SECTIONS.filter((name) => sections.includes(name));''',
              '''  const activeFilters = Boolean(q || section || feature || sort !== "section");
          const quickSections = QUICK_SECTIONS;
          const sectionOptions = sortStorefrontSections([...QUICK_SECTIONS, ...sections]);''',
              'always-visible core section navigation',
          )
          replace_once(
              shop,
              '''          {sections.map((name) => (
                        <option key={name} value={name}>{name}</option>
                      ))}''',
              '''          {sectionOptions.map((name) => (
                        <option key={name} value={name}>{name}</option>
                      ))}''',
              'complete section dropdown',
          )

          tests = Path('scripts/run-storefront-taxonomy-regressions.ts')
          test_text = tests.read_text()
          marker = '''const puckRelicCard = classifyStorefrontItem({
            title: "2024 Upper Deck Hockey Puck Relic Card",
            rawSport: "Ice Hockey",
            primaryCategory: "sports_cards",
          });
          assert.equal(puckRelicCard.section, "Hockey");'''
          addition = marker + '''

          const nonAutoSuperfractor = classifyStorefrontItem({
            title: "2013 Bowman Platinum Prospects Justin Nicolino Superfractor /1 BGS 9.5 Non Auto",
            rawSport: "Baseball",
            primaryCategory: "sports_cards",
            aspects: { Autographed: ["No"] },
          });
          assert.equal(nonAutoSuperfractor.section, "Baseball");
          assert.equal(nonAutoSuperfractor.features.autograph, false);

          const skyboxJerseyCard = classifyStorefrontItem({
            title: "2004 SkyBox LE #20 Josh Beckett PINSTRIPE Jersey Proof /299",
            rawSport: "Baseball",
            primaryCategory: "memorabilia",
          });
          assert.equal(skyboxJerseyCard.section, "Baseball");

          const spGameUsedJerseyCard = classifyStorefrontItem({
            title: "2017-18 SP Game Used #FW-JQ Jonathan Quick Frameworks Jumbo Jersey Relic",
            rawSport: "Ice Hockey",
            primaryCategory: "memorabilia",
          });
          assert.equal(spGameUsedJerseyCard.section, "Hockey");

          const staleV5JerseyCard = classifyStorefrontItem({
            title: "2025-26 SP Game Used #100 Peter Forsberg Red Jersey",
            rawSport: "Ice Hockey",
            primaryCategory: "memorabilia",
            metadata: { tcos_storefront_section: "Jerseys", tcos_taxonomy_version: 5 },
          });
          assert.equal(staleV5JerseyCard.section, "Hockey");'''
          if test_text.count(marker) != 1:
              raise SystemExit('live audit test marker was not unique')
          tests.write_text(test_text.replace(marker, addition, 1))

          simulations = Path('scripts/run-ebay-import-admin-client-simulations.ts')
          simulation_text = simulations.read_text()
          marker = 'assert.ok(shopPageSource.includes("View Item"));'
          addition = marker + '''
          assert.match(shopPageSource, /const quickSections = QUICK_SECTIONS;/);
          assert.match(shopPageSource, /const sectionOptions = sortStorefrontSections/);'''
          if simulation_text.count(marker) != 1:
              raise SystemExit('shop navigation test marker was not unique')
          simulations.write_text(simulation_text.replace(marker, addition, 1))

          for workflow in [
              '.github/workflows/one-time-storefront-taxonomy-v6-live-corrections-20260728.yml',
              '.github/workflows/one-time-storefront-taxonomy-v6-live-corrections-v2-20260728.yml',
          ]:
              path = Path(workflow)
              if path.exists(): path.unlink()
          PY

      - name: Validate taxonomy v6 corrections
        run: |
          set -euo pipefail
          npm ci
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
          npx eslint src/lib/storefront-taxonomy.ts src/lib/ebay-category-mapper.ts src/lib/ebay-authoritative-store-sync.ts src/app/shop/page.tsx scripts/run-storefront-taxonomy-regressions.ts scripts/run-ebay-import-admin-client-simulations.ts
          npm run build

      - name: Commit validated taxonomy v6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Correct live autograph and jersey classification"
          git push origin HEAD:agent/storefront-taxonomy-v6-live-corrections-20260728
