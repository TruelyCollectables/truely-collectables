name: InstaComp Fast Overnight Build 20260809

on:
  push:
    branches:
      - agent/instacomp-fast-overnight-audit

permissions:
  contents: write

concurrency:
  group: instacomp-fast-overnight-build-20260809
  cancel-in-progress: false

jobs:
  patch-persist-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-fast-overnight-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch season-year preservation and release blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scan_path = Path('src/app/api/instacomp/scan/route.ts')
          text = scan_path.read_text()

          helper_marker = 'function preserveSeasonYear('
          if helper_marker not in text:
              needle = 'function normalizeInstaCompAiResult(value: unknown): InstaCompAiResult {'
              if needle not in text:
                  raise SystemExit('Could not locate normalizeInstaCompAiResult insertion point')
              helper = r'''function preserveSeasonYear(
            evidenceYear: unknown,
            registryYear: unknown,
            identityContext?: unknown,
          ): string | null {
            const evidence = String(evidenceYear || "").trim();
            const registry = String(registryYear || "").trim();
            const context = String(identityContext || "").trim();
            const candidates = [evidence, context];

            for (const candidate of candidates) {
              const match = candidate.match(/\b((?:19|20)\d{2})\s*[-/]\s*((?:19|20)?\d{2})\b/);
              if (!match) continue;

              const start = Number(match[1]);
              const rawEnd = match[2];
              const end = rawEnd.length === 2
                ? Math.floor(start / 100) * 100 + Number(rawEnd)
                : Number(rawEnd);
              const canonical = `${start}-${String(end).slice(-2).padStart(2, "0")}`;
              const registryNumber = Number(registry);

              if (!registry || registryNumber === start || registryNumber === end) {
                return canonical;
              }
            }

            return registry || evidence || null;
          }

          '''
              text = text.replace(needle, helper + needle, 1)

          old = 'year: registryMatch.year ? String(registryMatch.year) : consensusAi.year,'
          new = 'year: preserveSeasonYear(consensusAi.year, registryMatch.year, registrySetName),'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not locate Registry year override')

          scan_path.write_text(text)

          def repair_clock(path_text: str) -> str:
              path_text = path_text.replace('Date.now()', 'readElapsedClockMs()')
              path_text = path_text.replace('performance.now()', 'readElapsedClockMs()')
              helper_body = 'function readElapsedClockMs() {\n  return performance.now();\n}\n\n'
              recursive_body = 'function readElapsedClockMs() {\n  return readElapsedClockMs();\n}\n\n'
              if recursive_body in path_text:
                  path_text = path_text.replace(recursive_body, helper_body, 1)
              if 'function readElapsedClockMs()' not in path_text:
                  marker = 'const IDENTITY_CONCURRENCY = 2;\n\n'
                  if marker not in path_text:
                      raise SystemExit('Could not locate Fast scanner clock helper insertion point')
                  path_text = path_text.replace(marker, marker + helper_body, 1)
              return path_text

          fast_path = Path('src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx')
          fast = repair_clock(fast_path.read_text())
          effect = '''  useEffect(() => {\n    if (!editing && ai) setDraft({ ...ai });\n  }, [ai, editing]);\n\n'''
          if effect in fast:
              fast = fast.replace(effect, '', 1)
          fast = fast.replace('import { useEffect, useMemo, useRef, useState } from "react";', 'import { useMemo, useRef, useState } from "react";', 1)
          fast_path.write_text(fast)

          v2_path = Path('src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx')
          v2_path.write_text(repair_clock(v2_path.read_text()))

          sentinel_path = Path('src/app/admin/instacomp/checklist-sentinel/page.tsx')
          sentinel = sentinel_path.read_text()
          unsafe = '(await response.json()) as ProxyPayload;'
          safe = '(await response.json().catch(() => ({}))) as ProxyPayload;'
          if unsafe in sentinel:
              sentinel = sentinel.replace(unsafe, safe)
          elif safe not in sentinel:
              raise SystemExit('Could not locate Checklist Sentinel JSON parse')
          sentinel = sentinel.replace('max-w-7xl', 'max-w-[1600px]')
          sentinel_path.write_text(sentinel)

          smoke_path = Path('scripts/smoke-admin-runtime.mjs')
          smoke = smoke_path.read_text()
          sentinel_route = '    path: "/admin/instacomp/checklist-sentinel",'
          if sentinel_route not in smoke:
              marker = '  {\n    path: "/admin/instacomp/checklists",\n    auth: true,\n    expectedText: "Checklist Registry",\n  },\n'
              addition = marker + '  {\n    path: "/admin/instacomp/checklist-sentinel",\n    auth: true,\n    expectedText: "Checklist Sentinel™",\n  },\n'
              if marker not in smoke:
                  raise SystemExit('Could not locate admin runtime smoke checklist insertion point')
              smoke = smoke.replace(marker, addition, 1)
          smoke_path.write_text(smoke)

          audit_path = Path('scripts/run-instacomp-sentinel-control-audit.mjs')
          audit = audit_path.read_text()
          stale_deploy = 'npx vercel --prod --yes --cwd "$repo_root"'
          current_deploy = 'npx vercel --prod --yes --archive=tgz --cwd "$repo_root"'
          if stale_deploy in audit:
              audit = audit.replace(stale_deploy, current_deploy, 1)
          elif current_deploy not in audit:
              raise SystemExit('Could not locate Sentinel Production deploy audit contract')
          audit_path.write_text(audit)
          PY

      - name: Refresh dependency lockfile security fixes
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Persist release blocker fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/app/api/instacomp/scan/route.ts \
            src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx \
            src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx \
            src/app/admin/instacomp/checklist-sentinel/page.tsx \
            scripts/smoke-admin-runtime.mjs \
            scripts/run-instacomp-sentinel-control-audit.mjs \
            package-lock.json
          if git diff --cached --quiet; then
            echo 'Release blocker fixes already persisted.'
          else
            git commit -m 'Finish InstaComp release integration'
            git push origin HEAD:agent/instacomp-fast-overnight-audit
          fi

      - name: Verify release-contract source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-instacomp-fast-workbench-regressions.mjs
          node scripts/run-instacomp-sentinel-control-audit.mjs
          grep -q 'preserveSeasonYear(consensusAi.year, registryMatch.year, registrySetName)' src/app/api/instacomp/scan/route.ts
          grep -q 'Year / season' src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx
          grep -q 'Edit card' src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx
          grep -q 'progressPercent' src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx
          grep -q 'aiCouncilTier.*, "basic"' src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx
          grep -q 'aiCouncilTier.*, "adaptive"' src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx
          grep -q 'response.json().catch(() => ({}))' src/app/admin/instacomp/checklist-sentinel/page.tsx
          grep -q 'path: "/admin/instacomp/checklist-sentinel"' scripts/smoke-admin-runtime.mjs
          ! grep -q 'max-w-7xl' src/app/admin/instacomp/checklist-sentinel/page.tsx
          ! grep -q 'Date.now()' src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx
          ! grep -q 'Date.now()' src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx
          test "$(grep -o 'performance.now()' src/app/admin/instacomp/fast/InstaCompFastDropScanner.tsx | wc -l)" -eq 1
          test "$(grep -o 'performance.now()' src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx | wc -l)" -eq 1

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        run: node scripts/run-dependency-security-audit.mjs

      - name: Admin dashboard contract
        run: npm run verify:admin-dashboard

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit

      - name: InstaComp regression battery
        shell: bash
        run: |
          set -euo pipefail
          npm run simulate:instacomp-accuracy
          npm run simulate:instacomp-consensus
          npm run simulate:instacomp-catalog-identity
          npm run simulate:instacomp-card-knowledge
          npm run simulate:instacomp-identity-guard
          npm run simulate:instacomp-scan-review
          npm run simulate:instacomp-jobs

      - name: Production build
        run: npm run build

# certification-trigger: idempotent-integration-fix-pass
