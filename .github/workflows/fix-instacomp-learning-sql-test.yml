name: Fix InstaComp Learning Integration IDs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature/instacomp-learning-registry-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instacomp-learning-registry-v1
          fetch-depth: 0

      - name: Fix UUID construction
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-instacomp-learning-registry.sql')
          text = path.read_text()
          old = "    v_scan_id := format('10000000-0000-0000-0000-%012s', v_scan_number)::uuid;"
          new = "    v_scan_id := ('10000000-0000-0000-0000-00000000000' || v_scan_number)::uuid;"
          if old not in text:
              raise SystemExit('UUID construction line not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit correction
        run: |
          rm .github/workflows/fix-instacomp-learning-sql-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-instacomp-learning-registry.sql .github/workflows/fix-instacomp-learning-sql-test.yml
          git commit -m "Fix deterministic InstaComp learning integration scan IDs"
          git push origin HEAD:feature/instacomp-learning-registry-v1
