name: Apply Order Notification Hardening PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/order-notification-hardening-20260726' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic caller patch
        run: python3 scripts/apply-order-notification-hardening.py

      - name: Commit patched callers
        run: |
          if git diff --quiet; then
            echo "Order notification callers already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/checkout-order-finalization.ts src/app/api/orders/mark-shipped/route.ts src/app/api/orders/update-tracking/route.ts
          git commit -m "Wire durable notifications into order events"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
