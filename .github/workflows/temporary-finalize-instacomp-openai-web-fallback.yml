name: Finalize Clean InstaComp OpenAI Web Fallback

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy-patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Copy reusable cited web provider from laboratory branch
        shell: bash
        run: |
          git fetch origin agent/instacomp-exact-market-proof-20260726
          mkdir -p src/lib
          git show origin/agent/instacomp-exact-market-proof-20260726:src/lib/instacomp-openai-web-market-provider.ts > src/lib/instacomp-openai-web-market-provider.ts
      - name: Repair escaped live-proof template
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-instacomp-openai-web-fallback-final.mjs")
          source = path.read_text()
          before = r'\`${JSON.stringify(proof, null, 2)}\\n\`'
          after = r'\`\${JSON.stringify(proof, null, 2)}\\n\`'
          if before not in source:
              raise SystemExit("Live-proof template marker was not found")
          path.write_text(source.replace(before, after))
          PY
      - name: Apply fallback to clean release candidate
        run: node scripts/apply-instacomp-openai-web-fallback-final.mjs
      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-instacomp-openai-web-fallback-final.mjs
          rm -f .github/workflows/temporary-finalize-instacomp-openai-web-fallback.yml
      - run: npm ci
      - name: Exactness pass 1
        run: node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
      - name: Exactness pass 2
        run: node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
      - name: Exactness pass 3
        run: node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit clean verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cited exact sold and active fallback"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
