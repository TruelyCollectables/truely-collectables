name: KINGMAKER Phase 18 Disaster Recovery Business Continuity

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-phase-18-*.ts"
      - "scripts/run-kingmaker-phase-18-*.ts"
      - "supabase/migrations/*kingmaker_phase_18*.sql"
      - ".github/workflows/kingmaker-phase-18-disaster-recovery-business-continuity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/run-kingmaker-phase-18-disaster-recovery-business-continuity-regressions.ts
      - name: Migration security
        shell: bash
        run: |
          set -euo pipefail
          file=supabase/migrations/20260803203000_kingmaker_phase_18_disaster_recovery_business_continuity.sql
          grep -Eiq 'enable row level security' "$file"
          grep -Eiq 'revoke all' "$file"
          ! grep -Eiq 'grant .* to (anon|authenticated)' "$file"
      - name: Dangerous execution scan
        run: "! grep -RInE '\\beval\\s*\\(|new Function\\s*\\(|child_process|execSync\\s*\\(|spawnSync\\s*\\(' src/lib/kingmaker-phase-18-*.ts scripts/run-kingmaker-phase-18-*.ts"
      - run: node scripts/run-dependency-security-audit.mjs
      - run: npx eslint src/lib/kingmaker-phase-18-*.ts scripts/run-kingmaker-phase-18-*.ts
      - run: npx tsc --noEmit
      - run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
