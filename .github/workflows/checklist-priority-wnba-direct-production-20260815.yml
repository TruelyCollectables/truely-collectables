name: Checklist Priority WNBA Direct Production 20260815

on:
  push:
    branches:
      - ops/checklist-conveyor-live-20260815
    paths:
      - '.github/workflows/checklist-priority-wnba-direct-production-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PUBLIC_WEB_MINIMUM_CARD_ROWS: '25'

jobs:
  wnba-production:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 90
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          npm ci
      - name: Enable GoGTS normalization
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path='scripts/mainstream-checklist/source-tools.mjs';
          let s=readFileSync(path,'utf8');
          const ia='import { extname, resolve } from "node:path";\n';
          const il='import { normalizeGoGtsStructuredText } from "./gogts-structured-normalizer.mjs";\n';
          if(!s.includes(il)) s=s.replace(ia,ia+il);
          s=s.replace('  const text = extractText(downloaded, filename);','  const text = normalizeGoGtsStructuredText(extractText(downloaded, filename));');
          writeFileSync(path,s);
          NODE
      - name: Resolve Production Supabase
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wnba-prod"; mkdir -p "$root"
          curl -sS --fail --retry 5 --retry-all-errors --max-time 45 -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" -o "$root/projects.json" https://api.supabase.com/v1/projects
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          curl -sS --fail --retry 5 --retry-all-errors --max-time 45 -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" -o "$root/keys.json" "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$root/keys.json")"
          test -n "$service_key"; echo "::add-mask::$service_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$project_ref.supabase.co" >> "$GITHUB_ENV"
          echo "RESOLVED_SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Load and verify all 2024 and 2025 WNBA checklists
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wnba-direct"; mkdir -p "$out/receipts"
          OUT="$out" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';
          const out=process.env.OUT;
          const targets=[
            ['basketball|2024|panini|origins','https://gogts.net/2024-panini-origins-wnba-basketball-cards-checklist/'],
            ['basketball|2024|panini|prizm','https://gogts.net/2024-panini-prizm-wnba-basketball-cards-checklist/'],
            ['basketball|2024|panini|select','https://gogts.net/2024-panini-select-wnba-basketball-cards-checklist/'],
            ['basketball|2025|panini|donruss','https://gogts.net/2025-donruss-wnba-basketball-cards-checklist/'],
            ['basketball|2025|panini|impeccable','https://gogts.net/2025-panini-impeccable-wnba-basketball-cards-checklist/'],
            ['basketball|2025|panini|one-and-one','https://gogts.net/2025-panini-one-and-one-wnba-basketball-cards-checklist/'],
            ['basketball|2025|panini|prizm','https://gogts.net/2025-panini-prizm-wnba-basketball-cards-checklist/'],
            ['basketball|2025|panini|select','https://gogts.net/2025-panini-select-wnba-basketball-cards-checklist/']
          ].map(([exactSetKey,page])=>({exactSetKey,page}));
          const summary={schema:'tcos.checklist.wnbaDirectProduction.v1',runId:process.env.GITHUB_RUN_ID||null,targetCount:targets.length,verified:0,cards:0,netNew:0,alreadyPresent:0,failed:0,results:[],startedAt:new Date().toISOString()};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function fetchText(url){for(let a=0;a<4;a++){try{const c=new AbortController();const timer=setTimeout(()=>c.abort(),20000);const r=await fetch(url,{signal:c.signal,redirect:'follow'});clearTimeout(timer);if(r.ok)return await r.text();}catch{}await sleep(800*(a+1));}return '';}
          async function sources(page){let html='';try{const u=new URL(page);const slug=u.pathname.split('/').filter(Boolean).pop();const body=await fetchText(`https://gogts.net/wp-json/wp/v2/posts?slug=${encodeURIComponent(slug)}&_fields=content,link`);const rows=body?JSON.parse(body):[];html=String(rows?.[0]?.content?.rendered||'');}catch{}if(!html)html=await fetchText(page);const urls=new Set();for(const m of html.matchAll(/(?:href|data-href)=["']([^"']+\.(?:xlsx?|csv|pdf)(?:\?[^"']*)?)["']/gi)){try{urls.add(new URL(String(m[1]).replaceAll('&amp;','&'),page).href)}catch{}}const arr=[...urls].sort((a,b)=>(/\.xlsx?/i.test(a)?0:/\.csv/i.test(a)?1:2)-(/\.xlsx?/i.test(b)?0:/\.csv/i.test(b)?1:2));if(!arr.length)arr.push(page);return arr.slice(0,4);}
          function apply(t,url,label){const slug=t.exactSetKey.replace(/[^a-zA-Z0-9_.-]+/g,'_'),q=join(out,`q-${slug}-${label}.json`),f=join(out,`f-${slug}-${label}.json`),r=join(out,'receipts',`${slug}-${label}.json`),v=join(out,'receipts',`${slug}-${label}-v.json`);const year=Number(t.exactSetKey.split('|')[1].slice(0,4));writeFileSync(q,JSON.stringify({schema:'tcos.checklist.mainstream2005plusCandidateValidationQueue.v1',count:1,targets:[{exactSetKey:t.exactSetKey,year,sport:'basketball',sourceArtifact:'wnba-direct-20260815',exactCandidateCount:1,trustedAutoImportCandidateCount:1,candidates:[]}]},null,2));writeFileSync(f,JSON.stringify({schema:'tcos.checklist.wnbaDirectTarget.v1',targets:[{exactSetKey:t.exactSetKey,sourceUrl:url}]},null,2));const c=spawnSync('node',['--import','tsx','scripts/promote-mainstream-2005plus-public-web-candidates.mjs'],{encoding:'utf8',timeout:150000,env:{...process.env,PUBLIC_WEB_CANDIDATE_QUEUE:q,PUBLIC_WEB_TARGET_FILTER:f,PUBLIC_WEB_PROMOTION_APPLY:'true',PUBLIC_WEB_PROMOTION_OUTPUT:r,PUBLIC_WEB_VALIDATED_TARGETS_OUTPUT:v}});if(c.stdout)process.stdout.write(c.stdout.slice(-9000));if(c.stderr)process.stderr.write(c.stderr.slice(-5000));try{const rec=JSON.parse(readFileSync(r,'utf8'));return (rec.results||[])[0]||null;}catch{return null;}}
          for(let i=0;i<targets.length;i++){const t=targets[i];console.log(`=== WNBA ${i+1}/${targets.length} ${t.exactSetKey} ===`);let success=null,reason='no usable source';const urls=await sources(t.page);for(let u=0;u<urls.length;u++){const first=apply(t,urls[u],`apply-${u}`);if(first?.status!=='imported'||first?.persistence?.ok!==true){reason=first?.message||(first?.errors||[]).join('; ')||`apply ${first?.status||'no receipt'}`;continue;}const verify=apply(t,urls[u],`verify-${u}`);if(verify?.status==='imported'&&verify?.persistence?.ok===true&&verify?.persistence?.idempotent===true){success={first,verify,url:urls[u]};break;}reason=verify?.message||(verify?.errors||[]).join('; ')||`verify ${verify?.status||'no receipt'}`;}
            if(success){const already=success.first.persistence?.idempotent===true;const cards=Number(success.first.counts?.cards||success.verify.counts?.cards||0);summary.verified++;summary.cards+=cards;if(already)summary.alreadyPresent++;else summary.netNew++;summary.results.push({exactSetKey:t.exactSetKey,status:'verified-production',cards,sourceUrl:success.url,firstPersistence:success.first.persistence,verificationPersistence:success.verify.persistence});console.log(`>>> WNBA VERIFIED ${already?'ALREADY':'NET-NEW'} ${t.exactSetKey} cards=${cards}`);}else{summary.failed++;summary.results.push({exactSetKey:t.exactSetKey,status:'failed',reason,candidateUrls:urls});console.error(`--- WNBA FAILED ${t.exactSetKey}: ${reason}`);}writeFileSync(join(out,'summary.json'),JSON.stringify(summary,null,2));}
          summary.completedAt=new Date().toISOString();writeFileSync(join(out,'summary.json'),JSON.stringify(summary,null,2));console.log('FINAL_WNBA_SUMMARY '+JSON.stringify({targetCount:summary.targetCount,verified:summary.verified,cards:summary.cards,netNew:summary.netNew,alreadyPresent:summary.alreadyPresent,failed:summary.failed}));if(summary.failed)process.exitCode=2;
          NODE
      - name: Upload WNBA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-wnba-direct-${{ github.run_id }}
          path: ${{ runner.temp }}/wnba-direct
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/wnba-prod" .env.local .env.production.local .vercel
