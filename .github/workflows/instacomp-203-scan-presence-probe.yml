name: InstaComp 203 Scan Presence Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-203-scan-presence-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      RESULT_BRANCH: instacomp-203-presence-receipt
      RESULT_PATH: audits/instacomp-supervised/scan-0001-0203-presence.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Production Mac coordinates
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/instacomp-probe" .vercel
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/instacomp-probe/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/instacomp-probe/production.env" >> "$GITHUB_ENV"
      - name: Probe named supervised scan IDs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const envText = fs.readFileSync(process.env.PRODUCTION_ENV_FILE, 'utf8');
          function value(key) {
            const m = envText.match(new RegExp(`^${key}=(?:"([^"]*)"|'([^']*)'|([^\\r\\n]*))`, 'm'));
            return String(m?.[1] ?? m?.[2] ?? m?.[3] ?? '').trim();
          }
          const base = value('INSTACOMP_AI_LOCAL_URL').replace(/\/+$/, '');
          const key = value('INSTACOMP_AI_LOCAL_KEY');
          if (!/^https:\/\/[^/]+\.truelycollectables\.com$/i.test(base) || !key) throw new Error('Production Mac coordinates unavailable.');
          const headers = { 'X-InstaComp-AI-Key': key, Accept: 'application/json' };
          const ids = Array.from({length:203}, (_, i) => `SCAN-${String(i+1).padStart(4,'0')}`);
          const rows = [];
          for (const id of ids) {
            try {
              const r = await fetch(`${base}/v1/scans/${id}/archive`, { headers, cache:'no-store', signal:AbortSignal.timeout(15000) });
              if (r.ok) {
                const p = await r.json();
                rows.push({ scanId:id, exists:true, hasFront:p.has_front_image===true, hasBack:p.has_back_image===true, status:p.status||null });
              } else rows.push({ scanId:id, exists:false, httpStatus:r.status });
            } catch (e) { rows.push({ scanId:id, exists:false, error:e instanceof Error?e.message:String(e) }); }
          }
          const missing = rows.filter(r=>!r.exists).map(r=>r.scanId);
          const incompleteImages = rows.filter(r=>r.exists && (!r.hasFront || !r.hasBack)).map(r=>r.scanId);
          const out = {
            schema:'tcos.instacomp-ai.supervised-scan-presence.v1',
            checkedAt:new Date().toISOString(), total:ids.length,
            present:rows.length-missing.length, missingCount:missing.length,
            missing, completeImagePairs:rows.filter(r=>r.exists&&r.hasFront&&r.hasBack).length,
            incompleteImagePairs:incompleteImages,
            rows
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/presence.json', JSON.stringify(out,null,2));
          console.log(JSON.stringify({total:out.total,present:out.present,missingCount:out.missingCount,completeImagePairs:out.completeImagePairs,incompleteImagePairs:out.incompleteImagePairs},null,2));
          NODE
      - name: Publish sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/heads/$RESULT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RESULT_BRANCH"
            git switch -C "$RESULT_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$RESULT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$(dirname "$RESULT_PATH")"
          cp "$RUNNER_TEMP/presence.json" "$RESULT_PATH"
          git add "$RESULT_PATH"
          git commit -m "Update supervised 203 scan presence receipt"
          git push --force origin "HEAD:$RESULT_BRANCH"
      - name: Remove Production environment
        if: always()
        run: rm -f "$RUNNER_TEMP/instacomp-probe/production.env"
