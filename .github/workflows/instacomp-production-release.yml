name: Release InstaComp Evidence-First Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-production-release.yml"
      - "public/instacomp-release.json"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/lib/instacomp-learning-server.ts"
      - "supabase/migrations/20260802224500_instacomp_learning_provenance_receipt.sql"
      - "scripts/apply-instacomp-learning-provenance-production.mjs"
      - "scripts/run-instacomp-evidence-first-regressions.ts"
      - "scripts/run-instacomp-ai-council-30-regressions.ts"
      - "scripts/run-instacomp-release-attestation-regressions.mjs"
      - "scripts/write-instacomp-release-manifest.mjs"
      - "scripts/check-live-instacomp-release.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-instacomp-evidence-first-production
  cancel-in-progress: false

jobs:
  verify-deploy-smoke:
    name: Verify, deploy, and prove evidence-first production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Vercel and pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          fi
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull .env.production.local \
            --yes \
            --environment production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          chmod 600 .env.production.local

      - name: Detect learning-provenance Production migration release
        id: learning_migration_change
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || \
            [ -z "$base_sha" ] || \
            [ "$base_sha" = "0000000000000000000000000000000000000000" ] || \
            ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          release_paths=(
            .github/workflows/instacomp-production-release.yml
            scripts/apply-instacomp-learning-provenance-production.mjs
            supabase/migrations/20260802224500_instacomp_learning_provenance_receipt.sql
          )
          if git diff --quiet "$base_sha" "$GITHUB_SHA" -- "${release_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Learning-provenance migration release is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Learning-provenance migration release changed and requires privileged convergence."
          fi

      - name: Apply and verify learning-provenance Production migration
        if: steps.learning_migration_change.outputs.changed == 'true'
        env:
          PRODUCTION_ENV_FILE: .env.production.local
        run: |
          set -euo pipefail
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          node scripts/apply-instacomp-learning-provenance-production.mjs

      - name: Converge, validate, and deploy exact main
        shell: bash
        run: |
          set -euo pipefail
          deployed_commit_file="$RUNNER_TEMP/instacomp-deployed-commit"
          rm -f "$deployed_commit_file"

          validate_current_main() {
            git fetch origin main
            git reset --hard origin/main
            exact_commit="$(git rev-parse HEAD)"
            npm ci
            TCOS_RELEASE_COMMIT="$exact_commit" \
              node scripts/write-instacomp-release-manifest.mjs
            node scripts/run-instacomp-release-attestation-regressions.mjs
            node scripts/apply-instacomp-learning-provenance-production.mjs --self-test
            npx tsx scripts/run-instacomp-evidence-first-regressions.ts
            npx tsx scripts/run-instacomp-ai-council-30-regressions.ts
            npx eslint \
              src/lib/instacomp-learning-server.ts \
              src/app/api/instacomp/scan/route.ts \
              scripts/run-instacomp-evidence-first-regressions.ts \
              scripts/run-instacomp-ai-council-30-regressions.ts \
              scripts/run-instacomp-release-attestation-regressions.mjs \
              scripts/apply-instacomp-learning-provenance-production.mjs \
              scripts/write-instacomp-release-manifest.mjs \
              scripts/check-live-instacomp-release.mjs
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            NEXT_PUBLIC_SUPABASE_ANON_KEY=build-only-anon-key \
            SUPABASE_SERVICE_ROLE_KEY=build-only-service-role-key \
            TCOS_RELEASE_COMMIT="$exact_commit" \
              npm run build
          }

          for attempt in 1 2 3; do
            echo "Exact-main production attempt ${attempt}/3"
            validate_current_main
            candidate_commit="$(git rev-parse HEAD)"

            git fetch origin main
            if [ "$candidate_commit" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced during validation; rebuilding the newer commit."
              continue
            fi

            deploy_log="$RUNNER_TEMP/instacomp-deploy-${attempt}.log"
            if TCOS_RELEASE_COMMIT="$candidate_commit" \
              npm run deploy:production 2>&1 | tee "$deploy_log"; then
              printf '%s\n' "$candidate_commit" > "$deployed_commit_file"
              exit 0
            fi

            if grep -q "Local HEAD does not match origin/main" "$deploy_log"; then
              echo "main advanced at the deploy boundary; rebuilding the newer commit."
              continue
            fi

            echo "Deployment failed for a reason other than a moving main branch."
            exit 1
          done

          echo "main changed during all three exact-commit deployment attempts."
          exit 1

      - name: Prove both Production aliases serve the exact deployed commit
        shell: bash
        run: |
          set -euo pipefail
          deployed_commit_file="$RUNNER_TEMP/instacomp-deployed-commit"
          test -s "$deployed_commit_file"
          INSTACOMP_EXPECTED_COMMIT="$(cat "$deployed_commit_file")" \
            node scripts/check-live-instacomp-release.mjs

      - name: Remove protected Production and attestation files
        if: always()
        shell: bash
        run: |
          rm -f .env.production.local
          rm -f "$RUNNER_TEMP/instacomp-deployed-commit"
