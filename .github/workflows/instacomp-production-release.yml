name: InstaComp Production Release Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-production-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-release:
    name: Verify evidence-first production aliases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live InstaComp release contract
        run: node scripts/check-live-instacomp-release.mjs
