name: Release InstaComp Evidence-First Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-production-release.yml"
      - "public/instacomp-release.json"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/lib/instacomp-learning-server.ts"
      - "scripts/run-instacomp-evidence-first-regressions.ts"
      - "scripts/run-instacomp-ai-council-30-regressions.ts"
      - "scripts/check-live-instacomp-release.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-instacomp-evidence-first-production
  cancel-in-progress: false

jobs:
  verify-deploy-smoke:
    name: Verify, deploy, and prove evidence-first production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Vercel and pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          fi
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull .env.production.local \
            --yes \
            --environment production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          chmod 600 .env.production.local

      - name: Verify evidence-first and AI council source
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/run-instacomp-evidence-first-regressions.ts
          npx tsx scripts/run-instacomp-ai-council-30-regressions.ts
          npx eslint \
            src/lib/instacomp-learning-server.ts \
            src/app/api/instacomp/scan/route.ts \
            scripts/run-instacomp-evidence-first-regressions.ts \
            scripts/run-instacomp-ai-council-30-regressions.ts \
            scripts/check-live-instacomp-release.mjs
          npm run build

      - name: Deploy merged main to Production
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:production

      - name: Prove both Production aliases
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-live-instacomp-release.mjs

      - name: Remove protected Production environment file
        if: always()
        shell: bash
        run: rm -f .env.production.local
