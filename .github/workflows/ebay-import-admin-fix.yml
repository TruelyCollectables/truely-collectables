name: eBay Import Admin Fix

on:
  push:
    branches:
      - launch/sunday-one-build
    paths:
      - "src/modules/inventory/admin-engine.ts"
      - "src/modules/inventory/index.ts"
      - "src/app/api/ebay/import-listings/route.ts"
      - "scripts/run-ebay-import-admin-client-simulations.ts"
      - ".github/workflows/ebay-import-admin-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eBay import admin-client regression
        run: node --import tsx scripts/run-ebay-import-admin-client-simulations.ts

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
