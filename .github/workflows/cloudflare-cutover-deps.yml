name: Cloudflare cutover dependencies

on:
  push:
    branches:
      - cloudflare-cutover-2026-08-12

permissions:
  contents: write

jobs:
  lock-cloudflare-dependencies:
    if: ${{ !contains(github.event.head_commit.message, '[cf-deps]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-cutover-2026-08-12

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install official Cloudflare Next.js adapter
        run: npm install --save @opennextjs/cloudflare@latest

      - name: Install Wrangler
        run: npm install --save-dev wrangler@latest

      - name: Commit reproducible dependency lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Cloudflare dependencies are already locked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add Cloudflare deployment dependencies [cf-deps]"
          git push origin HEAD:cloudflare-cutover-2026-08-12
