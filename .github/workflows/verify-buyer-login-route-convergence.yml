name: Verify Buyer Login Route Convergence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-buyer-login-route-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: verify-buyer-login-route-convergence
  cancel-in-progress: true

env:
  CONVERGENCE_TRIGGER: "2026-07-31T15:00Z"

jobs:
  prove-deployment-and-alias:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOYMENT_ORIGIN: https://truely-collectables-j303t3ahn-truelycollectables-projects.vercel.app
      PRODUCTION_ORIGIN: https://truelycollectables.com
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean deployment artifact and Production alias convergence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const deploymentOrigin = String(process.env.DEPLOYMENT_ORIGIN || "").replace(/\/$/, "");
          const productionOrigin = String(process.env.PRODUCTION_ORIGIN || "").replace(/\/$/, "");
          const sourceSha = process.env.GITHUB_SHA || "unknown";
          const stamp = `${sourceSha.slice(0, 12)}-${Date.now()}`;
          const requiredLoginText = [
            "Account Login",
            "No card verification is required for buyer accounts",
            "Create one",
          ];

          function visibleText(value) {
            return value
              .replace(/<!--[\s\S]*?-->/g, " ")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/\s+/g, " ")
              .trim();
          }

          function safeDiagnostic(value) {
            return visibleText(value)
              .replace(/\b(?:sk|rk|pk)_(?:live|test)_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .replace(/\bwhsec_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .slice(0, 360);
          }

          async function fetchPage(origin, path, redirect = "manual") {
            const response = await fetch(`${origin}${path}`, {
              redirect,
              headers: {
                "cache-control": "no-cache, no-store, max-age=0",
                pragma: "no-cache",
                "user-agent": "TruelyCollectablesBuyerLoginConvergence/1.0",
              },
              signal: AbortSignal.timeout(60_000),
            });
            const body = await response.text();
            return {
              response,
              body,
              text: visibleText(body),
            };
          }

          function loginResultIsCorrect(result) {
            const url = new URL(result.response.url);
            return (
              result.response.status === 200 &&
              url.pathname === "/account/login" &&
              requiredLoginText.every(
                (expected) => result.body.includes(expected) || result.text.includes(expected),
              ) &&
              !result.text.includes("Checking your account")
            );
          }

          async function requireCorrectLogin(origin, label, attempts, delayMs) {
            let lastResult;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const separator = "/account/login".includes("?") ? "&" : "?";
              const result = await fetchPage(
                origin,
                `/account/login${separator}buyer_login_convergence=${stamp}-${label}-${attempt}`,
                "manual",
              );
              lastResult = result;
              const location = result.response.headers.get("location") || "";
              const cache = result.response.headers.get("x-vercel-cache") || "";
              const age = result.response.headers.get("age") || "";
              console.log(
                `${label} attempt ${attempt}/${attempts}: status=${result.response.status}; final=${result.response.url}; location=${location || "none"}; x-vercel-cache=${cache || "none"}; age=${age || "none"}`,
              );

              if (loginResultIsCorrect(result)) {
                console.log(`PASS ${label} buyer login route`);
                return result;
              }

              if (attempt < attempts) {
                await new Promise((resolve) => setTimeout(resolve, delayMs));
              }
            }

            throw new Error(
              `${label} buyer login did not converge; diagnostic=${safeDiagnostic(lastResult?.body || "")}`,
            );
          }

          await requireCorrectLogin(deploymentOrigin, "deployment", 4, 2_000);
          await requireCorrectLogin(productionOrigin, "production-alias", 24, 5_000);

          const criticalChecks = [
            ["/", "Find the collectible your collection is missing"],
            ["/shop", "Shop Sports Cards & Collectibles"],
            ["/account", "Checking your account"],
            ["/cart", "Shopping Cart"],
            ["/buyer-protection", "Truely Collectables Shipment Protection"],
            ["/robots.txt", "User-agent"],
            ["/sitemap.xml", "urlset"],
          ];
          for (let index = 0; index < criticalChecks.length; index += 1) {
            const [path, expected] = criticalChecks[index];
            const result = await fetchPage(
              productionOrigin,
              `${path}?buyer_login_convergence_check=${stamp}-${index}`,
              "follow",
            );
            if (
              result.response.status !== 200 ||
              (!result.body.includes(expected) && !result.text.includes(expected))
            ) {
              throw new Error(
                `${path} failed after alias convergence; status=${result.response.status}; diagnostic=${safeDiagnostic(result.body)}`,
              );
            }
            for (const fatal of [
              "Error loading products",
              "permission denied for view",
              "Missing Supabase environment variables",
              "Internal Server Error",
            ]) {
              if (result.body.includes(fatal) || result.text.includes(fatal)) {
                throw new Error(`${path} exposed fatal marker ${fatal}`);
              }
            }
            console.log(`PASS ${path}`);
          }

          const home = await fetch(`${productionOrigin}/?buyer_login_convergence_headers=${stamp}`, {
            redirect: "manual",
            headers: {
              "cache-control": "no-cache, no-store, max-age=0",
              pragma: "no-cache",
              "user-agent": "TruelyCollectablesBuyerLoginConvergenceHeaders/1.0",
            },
            signal: AbortSignal.timeout(60_000),
          });
          for (const header of [
            "strict-transport-security",
            "content-security-policy",
            "x-content-type-options",
            "x-frame-options",
          ]) {
            const value = home.headers.get(header);
            if (!value) throw new Error(`Missing security header: ${header}`);
            if (header === "x-content-type-options" && value.toLowerCase() !== "nosniff") {
              throw new Error(`x-content-type-options must be nosniff; received ${value}`);
            }
            console.log(`PASS header ${header}`);
          }

          for (const path of ["/admin", "/admin/products/new", "/admin/orders"]) {
            const response = await fetch(
              `${productionOrigin}${path}?buyer_login_convergence_boundary=${stamp}`,
              {
                redirect: "manual",
                headers: {
                  "cache-control": "no-cache, no-store, max-age=0",
                  "user-agent": "TruelyCollectablesBuyerLoginConvergenceBoundary/1.0",
                },
                signal: AbortSignal.timeout(60_000),
              },
            );
            const location = response.headers.get("location") || "";
            if (![302, 303, 307, 308].includes(response.status) || !location.includes("/admin/login")) {
              throw new Error(
                `Unauthenticated ${path} boundary failed; status=${response.status}; location=${location || "none"}`,
              );
            }
            console.log(`PASS admin boundary ${path}`);
          }

          console.log("BUYER_LOGIN_DEPLOYMENT_AND_ALIAS_CONVERGENCE=passed");
          NODE

      - name: Launch final Production certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/verify-pr393-production-release.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "Final Production certification dispatched."
