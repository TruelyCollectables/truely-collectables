name: Verify Buyer Login Route Convergence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-buyer-login-route-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: verify-buyer-login-route-convergence
  cancel-in-progress: true

jobs:
  deploy-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
    steps:
      - name: Check out newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate public account route boundary source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git reset --hard origin/main
          grep -Fq 'PUBLIC_ACCOUNT_ROUTES' src/app/account/AccountSessionBoundary.tsx
          grep -Fq '"/account/login"' src/app/account/AccountSessionBoundary.tsx
          grep -Fq '"/account/signup"' src/app/account/AccountSessionBoundary.tsx
          grep -Fq 'if (isPublicAccountRoute)' src/app/account/AccountSessionBoundary.tsx
          grep -Fq 'export const dynamic = "force-dynamic"' src/app/account/login/page.tsx
          test -f src/app/account/login/AccountLoginClient.tsx
          grep -Fq 'No card verification is required for buyer accounts' src/app/account/login/AccountLoginClient.tsx
          npm ci
          npm run lint

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Force clean Production deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          source_sha=$(git rev-parse HEAD)
          echo "Deploying source SHA: $source_sha"

          test -f src/app/account/login/AccountLoginClient.tsx
          grep -Fq 'PUBLIC_ACCOUNT_ROUTES' src/app/account/AccountSessionBoundary.tsx
          grep -Fq 'export const dynamic = "force-dynamic"' src/app/account/login/page.tsx

          deploy_log="$RUNNER_TEMP/account-boundary-deploy.log"
          set +e
          npx vercel@56.2.0 --prod --yes --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" 2>&1 | tee "$deploy_log"
          deploy_status=${PIPESTATUS[0]}
          set -e
          test "$deploy_status" -eq 0

          deployed_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$deploy_log" | tail -1)
          test -n "$deployed_url"
          echo "Immutable deployment: $deployed_url"

          npx vercel@56.2.0 alias set "$deployed_url" truelycollectables.com \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

          echo "DEPLOYMENT_ORIGIN=$deployed_url" >> "$GITHUB_ENV"
          echo "DEPLOYED_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Prove immutable deployment and live alias
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const deploymentOrigin = String(process.env.DEPLOYMENT_ORIGIN || "").replace(/\/$/, "");
          const productionOrigin = String(process.env.PRODUCTION_ORIGIN || "").replace(/\/$/, "");
          const sourceSha = String(process.env.DEPLOYED_SOURCE_SHA || "unknown");
          if (!deploymentOrigin.endsWith(".vercel.app")) {
            throw new Error(`Invalid immutable deployment origin: ${deploymentOrigin || "missing"}`);
          }
          const stamp = `${sourceSha.slice(0, 12)}-${Date.now()}`;
          const loginText = [
            "Account Login",
            "No card verification is required for buyer accounts",
            "Create one",
          ];

          function visibleText(value) {
            return value
              .replace(/<!--[\s\S]*?-->/g, " ")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/\s+/g, " ")
              .trim();
          }

          function diagnostic(value) {
            return visibleText(value)
              .replace(/\b(?:sk|rk|pk)_(?:live|test)_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .replace(/\bwhsec_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .slice(0, 420);
          }

          async function fetchPage(origin, path, redirect = "manual") {
            const response = await fetch(`${origin}${path}`, {
              redirect,
              headers: {
                "cache-control": "no-cache, no-store, max-age=0",
                pragma: "no-cache",
                "user-agent": "TruelyCollectablesAccountBoundaryCertification/1.0",
              },
              signal: AbortSignal.timeout(60_000),
            });
            const body = await response.text();
            return { response, body, text: visibleText(body) };
          }

          function correctLogin(result) {
            const finalUrl = new URL(result.response.url);
            return (
              result.response.status === 200 &&
              finalUrl.pathname === "/account/login" &&
              loginText.every((text) => result.body.includes(text) || result.text.includes(text)) &&
              !result.text.includes("Checking your account")
            );
          }

          async function requireLogin(origin, label, attempts, delayMs) {
            let lastResult;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const result = await fetchPage(
                origin,
                `/account/login?account_boundary=${stamp}-${label}-${attempt}`,
                "manual",
              );
              lastResult = result;
              console.log(
                `${label} ${attempt}/${attempts}: status=${result.response.status}; url=${result.response.url}; cache=${result.response.headers.get("x-vercel-cache") || "none"}; age=${result.response.headers.get("age") || "none"}`,
              );
              if (correctLogin(result)) {
                console.log(`PASS ${label} /account/login`);
                return;
              }
              if (attempt < attempts) {
                await new Promise((resolve) => setTimeout(resolve, delayMs));
              }
            }
            throw new Error(
              `${label} /account/login failed; diagnostic=${diagnostic(lastResult?.body || "")}`,
            );
          }

          await requireLogin(deploymentOrigin, "immutable-deployment", 10, 3_000);
          await requireLogin(productionOrigin, "production-alias", 30, 5_000);

          const signup = await fetchPage(
            productionOrigin,
            `/account/signup?account_boundary=${stamp}-signup`,
            "manual",
          );
          if (
            signup.response.status !== 200 ||
            signup.text.includes("Checking your account") ||
            (!signup.body.includes("Create") && !signup.text.includes("Create"))
          ) {
            throw new Error(
              `Public signup route is still session-gated; diagnostic=${diagnostic(signup.body)}`,
            );
          }
          console.log("PASS public /account/signup bypass");

          const routeChecks = [
            ["/", "Find the collectible your collection is missing"],
            ["/shop", "Shop Sports Cards & Collectibles"],
            ["/account", "Checking your account"],
            ["/cart", "Shopping Cart"],
            ["/buyer-protection", "Truely Collectables Shipment Protection"],
            ["/robots.txt", "User-agent"],
            ["/sitemap.xml", "urlset"],
          ];
          for (let index = 0; index < routeChecks.length; index += 1) {
            const [path, expected] = routeChecks[index];
            const result = await fetchPage(
              productionOrigin,
              `${path}?account_boundary_check=${stamp}-${index}`,
              "follow",
            );
            if (
              result.response.status !== 200 ||
              (!result.body.includes(expected) && !result.text.includes(expected))
            ) {
              throw new Error(
                `${path} failed; status=${result.response.status}; diagnostic=${diagnostic(result.body)}`,
              );
            }
            for (const fatal of [
              "Error loading products",
              "permission denied for view",
              "Missing Supabase environment variables",
              "Internal Server Error",
            ]) {
              if (result.body.includes(fatal) || result.text.includes(fatal)) {
                throw new Error(`${path} exposed fatal marker ${fatal}`);
              }
            }
            console.log(`PASS ${path}`);
          }

          const home = await fetch(`${productionOrigin}/?account_boundary_headers=${stamp}`, {
            redirect: "manual",
            headers: {
              "cache-control": "no-cache, no-store, max-age=0",
              "user-agent": "TruelyCollectablesAccountBoundaryHeaders/1.0",
            },
            signal: AbortSignal.timeout(60_000),
          });
          for (const header of [
            "strict-transport-security",
            "content-security-policy",
            "x-content-type-options",
            "x-frame-options",
          ]) {
            const value = home.headers.get(header);
            if (!value) throw new Error(`Missing security header: ${header}`);
            if (header === "x-content-type-options" && value.toLowerCase() !== "nosniff") {
              throw new Error(`x-content-type-options must be nosniff; received ${value}`);
            }
            console.log(`PASS header ${header}`);
          }

          for (const path of ["/admin", "/admin/products/new", "/admin/orders"]) {
            const response = await fetch(
              `${productionOrigin}${path}?account_boundary_admin=${stamp}`,
              {
                redirect: "manual",
                headers: {
                  "cache-control": "no-cache, no-store, max-age=0",
                  "user-agent": "TruelyCollectablesAccountBoundaryAdmin/1.0",
                },
                signal: AbortSignal.timeout(60_000),
              },
            );
            const location = response.headers.get("location") || "";
            if (![302, 303, 307, 308].includes(response.status) || !location.includes("/admin/login")) {
              throw new Error(
                `Unauthenticated ${path} boundary failed; status=${response.status}; location=${location || "none"}`,
              );
            }
            console.log(`PASS admin boundary ${path}`);
          }

          console.log("ACCOUNT_PUBLIC_ROUTE_BOUNDARY_FIX=passed");
          console.log(`DEPLOYED_SOURCE_SHA=${sourceSha}`);
          NODE

      - name: Launch final Production certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/verify-pr393-production-release.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "Final Production certification dispatched."
