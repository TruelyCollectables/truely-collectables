name: Check Production Secret Availability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-production-secret-availability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CHECK_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHECK_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHECK_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CHECK_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CHECK_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHECK_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CHECK_EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      CHECK_EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      CHECK_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHECK_INSTACOMP_AI_LOCAL_KEY: ${{ secrets.INSTACOMP_AI_LOCAL_KEY }}
      CHECK_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CHECK_MARKET_INTEL_FROM_EMAIL: ${{ secrets.MARKET_INTEL_FROM_EMAIL }}
      CHECK_MARKET_INTEL_ALERT_EMAIL: ${{ secrets.MARKET_INTEL_ALERT_EMAIL }}
      CHECK_ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      CHECK_CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CHECK_TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
    steps:
      - name: Report names only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN \
            EBAY_CLIENT_ID EBAY_CLIENT_SECRET OPENAI_API_KEY \
            INSTACOMP_AI_LOCAL_KEY RESEND_API_KEY \
            MARKET_INTEL_FROM_EMAIL MARKET_INTEL_ALERT_EMAIL \
            ADMIN_SESSION_SECRET CRON_SECRET TCOS_CRON_SECRET; do
            var="CHECK_${name}"
            if [ -n "${!var:-}" ]; then
              echo "SECRET_AVAILABILITY ${name}=present"
            else
              echo "SECRET_AVAILABILITY ${name}=missing"
            fi
          done
