name: Emergency Navbar Production Deploy 20260730

on:
  push:
    branches: [main]
    paths:
      - "src/app/components/Navbar.tsx"
      - "scripts/run-navbar-feature-link-regressions.mjs"
      - ".github/workflows/emergency-navbar-production-deploy-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-navbar-production-deploy-20260730
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify navbar uses real feature filters
        run: node scripts/run-navbar-feature-link-regressions.mjs

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy Production
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify live navigation and shop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            home="$(curl --location --silent --show-error --max-time 30 "https://truelycollectables.com/?navbar_fix=$GITHUB_SHA" || true)"
            shop="$(curl --location --silent --show-error --max-time 30 "https://truelycollectables.com/shop?feature=autograph&navbar_fix=$GITHUB_SHA" || true)"
            if printf '%s' "$home" | grep -Fq '/shop?feature=autograph' \
              && printf '%s' "$home" | grep -Fq '/shop?feature=rookie' \
              && printf '%s' "$home" | grep -Fq '/shop?feature=graded' \
              && ! printf '%s' "$home" | grep -Fq '/shop?q=autograph' \
              && ! printf '%s' "$shop" | grep -Fq 'permission denied for view collx_only_inventory_boundary_violations'; then
              echo "Live navbar and autograph feature route verified."
              exit 0
            fi
            sleep 10
          done
          echo "Live verification did not observe the fixed deployment." >&2
          exit 1
