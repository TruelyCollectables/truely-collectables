name: Patch InstaComp Consensus Surface Risk 20260809

on:
  push:
    branches:
      - fix/kingmaker-certify-current-head-20260809
    paths:
      - ".github/workflows/patch-instacomp-consensus-surface-risk-20260809.yml"

permissions:
  contents: write

jobs:
  patch-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-certify-current-head-20260809
          fetch-depth: 0

      - name: Make one unresolved surface witness block Registry Base
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/instacomp-consensus.ts')
          source = path.read_text('utf-8')
          old = '''  if (isGenericBase(catalogParallel)) {
            if (unresolvedSurfaceRiskFamilies.length >= 2) {
              conflicts.push(
                "catalog Base parallel conflicts with unresolved visible surface/finish evidence",
              );
            }
          }'''.replace('            ', '')
          new = '''  if (isGenericBase(catalogParallel)) {
            if (unresolvedSurfaceRiskFamilies.length >= 1) {
              conflicts.push(
                "catalog Base parallel conflicts with unresolved visible surface/finish evidence",
              );
            }
          }'''.replace('            ', '')
          if old in source:
              source = source.replace(old, new, 1)
          elif 'unresolvedSurfaceRiskFamilies.length >= 1' not in source:
              raise SystemExit('Registry Base surface-risk council guard not found')
          path.write_text(source, 'utf-8')
          PY
          git diff --check

      - name: Persist referee repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-consensus.ts
          if git diff --cached --quiet; then
            echo "Registry referee surface-risk guard already repaired."
          else
            git commit -m "Fail closed on one unresolved Registry surface witness"
            git push origin HEAD:fix/kingmaker-certify-current-head-20260809
          fi
