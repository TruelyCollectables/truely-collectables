name: InstaComp Current 25 eBay User Stress

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-current-25-ebay-user-stress.yml"

permissions:
  contents: read

concurrency:
  group: instacomp-current-25-ebay-user-stress
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: test/instacomp-current-25-ebay-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  PRODUCTION_ORIGIN: https://truelycollectables.com
  INSTACOMP_BENCHMARK_TARGET: "25"
  INSTACOMP_BENCHMARK_CONCURRENCY: "2"

jobs:
  live-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main --quiet
          base="$(git merge-base HEAD origin/main)"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/instacomp-current-25-ebay-user-stress.yml'
          git diff --check "$base"...HEAD
          app_drift="$(git diff --name-only origin/main...HEAD -- ':!.github/workflows/instacomp-current-25-ebay-user-stress.yml')"
          test -z "$app_drift"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify current InstaComp safety gates
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:instacomp
          npx tsx scripts/run-instacomp-identity-firewall-regressions.ts
          npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Prove certified Production InstaComp is ready before audit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/instacomp-readiness-before.json"
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?audit25=before&ts=$(date +%s)")"
          test "$code" = "200"
          node - "$out" <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if(b[k]!==true) throw new Error(`${k}=${b[k]}`);
          console.log(JSON.stringify({ok:b.ok,configured:b.configured,reachable:b.reachable,version:b.version||null,runtimeSourceFingerprint:b.runtimeSourceFingerprint||null}));
          NODE

      - name: Generate one-run benchmark credential
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "INSTACOMP_BENCHMARK_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Atomically deploy app-equivalent audit runtime to Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy --prod --yes --force --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            --env "INSTACOMP_BENCHMARK_TOKEN=$INSTACOMP_BENCHMARK_TOKEN" \
            > deployment-url.txt
          deployment_url="$(tail -n 1 deployment-url.txt | tr -d '\r\n')"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "INSTACOMP_AUDIT_DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"

      - name: Re-prove certified InstaComp on audit deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            if npx vercel@56.2.0 curl /api/instacomp/internal-readiness \
              --deployment "$INSTACOMP_AUDIT_DEPLOYMENT_URL" \
              > "$RUNNER_TEMP/readiness-audit.json" 2> "$RUNNER_TEMP/readiness-audit.stderr"; then
              if node - "$RUNNER_TEMP/readiness-audit.json" <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if(b[k]!==true) process.exit(1);
          NODE
              then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Verify live eBay benchmark manifest
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 curl /api/instacomp/benchmark/ebay-25 \
            --deployment "$INSTACOMP_AUDIT_DEPLOYMENT_URL" \
            --header "Authorization: Bearer $INSTACOMP_BENCHMARK_TOKEN" \
            > benchmark-manifest.json 2> benchmark-manifest-stderr.txt
          node - <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('benchmark-manifest.json','utf8'));
          if(!p.ok||!Array.isArray(p.cases)||p.cases.length<25) throw new Error(`Benchmark manifest not ready: ${JSON.stringify(p).slice(0,1200)}`);
          console.log(`LIVE_MANIFEST_CASES=${p.cases.length}`);
          NODE

      - name: Run 25 live eBay front/back cards through current InstaComp
        id: benchmark
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          INSTACOMP_PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Print full grading receipt
        if: always()
        shell: bash
        run: |
          if [ -f reports/instacomp-ebay-25-report.json ]; then
            echo 'INSTACOMP_25_REPORT_START'
            cat reports/instacomp-ebay-25-report.json
            echo 'INSTACOMP_25_REPORT_END'
          else
            echo 'NO_BENCHMARK_REPORT'
          fi

      - name: Upload full benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-current-25-ebay-user-stress
          path: |
            reports/instacomp-ebay-25-report.json
            reports/instacomp-ebay-25-report.md
            benchmark-manifest.json
            benchmark-manifest-stderr.txt
            deployment-url.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Grade test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/instacomp-ebay-25-report.json
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('reports/instacomp-ebay-25-report.json','utf8'));const s=r.summary||{};
          console.log('INSTACOMP_25_SUMMARY='+JSON.stringify({requested:s.requestedCards||25,attempted:s.attemptedCards||0,completed:s.completedCards||0,passed:s.passedCards||0,passRate:s.passRate||0,averageScore:s.averageScore??null,registryCoverage:s.catalogCoverageRate||0,criticalErrors:s.criticalErrors||0,majorErrors:s.majorErrors||0,targetMet:!!s.targetMet}));
          if(Number(s.completedCards||0)<25) throw new Error(`Incomplete: ${s.completedCards||0}/25`);
          NODE

      - name: Clean redeploy exact main without audit credential
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git checkout --force --detach origin/main
          npx vercel@56.2.0 deploy --prod --yes --force --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > cleanup-deployment-url.txt
          clean_url="$(tail -n 1 cleanup-deployment-url.txt | tr -d '\r\n')"
          test -n "$clean_url"
          ready=0
          for attempt in $(seq 1 18); do
            out="$RUNNER_TEMP/instacomp-readiness-clean.json"
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?audit25=clean&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node - "$out" <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if(b[k]!==true) process.exit(1);
          NODE
            then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"
