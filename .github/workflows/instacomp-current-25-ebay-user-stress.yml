name: InstaComp Current 25 eBay User Stress

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-current-25-ebay-user-stress.yml"
      - "audits/instacomp-live-25-mixed-input.tsv"

permissions:
  contents: read

concurrency:
  group: instacomp-current-25-ebay-user-stress
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: test/instacomp-current-25-ebay-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  PRODUCTION_ORIGIN: https://truelycollectables.com
  PANEL_PATH: audits/instacomp-live-25-mixed-input.tsv
  TEMP_DIR: /tmp/instacomp-current-25-ebay-user-stress

jobs:
  live-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on audit-only scope and exact 25 panel
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          mkdir -p "$TEMP_DIR" reports
          git fetch origin main --quiet
          base="$(git merge-base HEAD origin/main)"
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/instacomp-current-25-ebay-user-stress.yml'
          test "${changed[1]}" = 'audits/instacomp-live-25-mixed-input.tsv'
          git diff --check "$base"...HEAD
          PANEL_PATH="$PANEL_PATH" node <<'NODE'
          const fs=require('node:fs');
          const lines=fs.readFileSync(process.env.PANEL_PATH,'utf8').trim().split(/\r?\n/);
          const header=lines.shift().split('\t');
          const rows=lines.filter(Boolean).map(line=>Object.fromEntries(line.split('\t').map((v,i)=>[header[i],v])));
          if(rows.length!==25) throw new Error(`Panel has ${rows.length}, expected 25.`);
          const ids=new Set(rows.map(r=>r.legacy_item_id));
          if(ids.size!==25) throw new Error(`Panel has ${ids.size} unique listing IDs, expected 25.`);
          const sports=[...new Set(rows.map(r=>r.sport))];
          for(const required of ['Hockey','Basketball','Baseball','Football']) if(!sports.includes(required)) throw new Error(`Missing ${required}`);
          const positives={auto:rows.filter(r=>r.is_auto==='true').length,relic:rows.filter(r=>r.is_relic==='true').length,serial:rows.filter(r=>Number(r.serial_denominator)>0).length,rookie:rows.filter(r=>r.is_rookie==='true').length};
          if(positives.auto<2||positives.relic<1||positives.serial<2) throw new Error(`Special-card mix too weak: ${JSON.stringify(positives)}`);
          console.log('PANEL='+JSON.stringify({count:rows.length,uniqueListings:ids.size,sports,positives}));
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies and verify current scanner safety gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:instacomp
          npx tsx scripts/run-instacomp-identity-firewall-regressions.ts
          npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts

      - name: Link Vercel Production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Prove certified Production InstaComp healthy before audit
        shell: bash
        run: |
          set -euo pipefail
          out="$TEMP_DIR/readiness-before.json"
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?audit25=mixed-before&ts=$(date +%s)")"
          test "$code" = "200"
          node - "$out" <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if(b[k]!==true) throw new Error(`${k}=${b[k]}`);
          console.log('READINESS_BEFORE='+JSON.stringify({ok:b.ok,configured:b.configured,reachable:b.reachable,version:b.version||null,runtimeSourceFingerprint:b.runtimeSourceFingerprint||null}));
          NODE

      - name: Pull eBay Browse credentials and hydrate current front/back listing images
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          env_file="$TEMP_DIR/production.env"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" PANEL_PATH="$PANEL_PATH" PAIRS_OUT="$TEMP_DIR/live-pairs.json" node <<'NODE'
          const fs=require('node:fs');
          function parseEnv(text){const out={};for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('#'))continue;const i=line.indexOf('=');if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}else if(v.startsWith("'")&&v.endsWith("'")){v=v.slice(1,-1)}out[k]=v;}return out;}
          function readPanel(path){const lines=fs.readFileSync(path,'utf8').trim().split(/\r?\n/);const h=lines.shift().split('\t');return lines.filter(Boolean).map(line=>Object.fromEntries(line.split('\t').map((v,i)=>[h[i],v])));}
          const env=parseEnv(fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8'));
          const clientId=String(env.EBAY_CLIENT_ID||'').trim(),clientSecret=String(env.EBAY_CLIENT_SECRET||'').trim();
          if(!clientId||!clientSecret) throw new Error('EBAY_CLIENT_ID / EBAY_CLIENT_SECRET unavailable from Production environment.');
          console.log(`::add-mask::${clientId}`);console.log(`::add-mask::${clientSecret}`);
          const rows=readPanel(process.env.PANEL_PATH);
          const full=u=>String(u||'').replace(/\/s-l\d+(?=\.(?:jpe?g|png|webp)(?:\?|$))/i,'/s-l1600');
          (async()=>{
            const tr=await fetch('https://api.ebay.com/identity/v1/oauth2/token',{method:'POST',headers:{Authorization:`Basic ${Buffer.from(`${clientId}:${clientSecret}`).toString('base64')}`,'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'client_credentials',scope:'https://api.ebay.com/oauth/api_scope'}),signal:AbortSignal.timeout(30000)});
            const tp=await tr.json().catch(()=>({}));if(!tr.ok||!tp.access_token)throw new Error(`eBay token HTTP ${tr.status}: ${JSON.stringify(tp).slice(0,500)}`);const token=String(tp.access_token);
            const pairs=[];
            for(let i=0;i<rows.length;i++){
              const row=rows[i];
              const r=await fetch(`https://api.ebay.com/buy/browse/v1/item/${encodeURIComponent(row.item_id)}`,{headers:{Authorization:`Bearer ${token}`,'X-EBAY-C-MARKETPLACE-ID':'EBAY_US'},signal:AbortSignal.timeout(30000)});
              const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(`eBay item ${row.legacy_item_id} HTTP ${r.status}: ${JSON.stringify(p).slice(0,800)}`);
              const urls=[p.image?.imageUrl,...(Array.isArray(p.additionalImages)?p.additionalImages.map(x=>x?.imageUrl):[])].map(full).filter(Boolean);
              const unique=[...new Set(urls)];
              if(unique.length<2)throw new Error(`Listing ${row.legacy_item_id} has only ${unique.length} distinct Browse images.`);
              pairs.push({caseId:row.case_id,expected:{player:row.player,year:row.year,brand:row.brand,setName:row.set_name,cardNumber:row.card_number,parallel:row.parallel||'Base',serialDenominator:row.serial_denominator?Number(row.serial_denominator):null,team:row.team,sport:row.sport,isRookie:row.is_rookie==='true',isAuto:row.is_auto==='true',isRelic:row.is_relic==='true'},listing:{itemId:row.item_id,legacyItemId:row.legacy_item_id,title:String(p.title||row.title),url:String(p.itemWebUrl||`https://www.ebay.com/itm/${row.legacy_item_id}`),frontImageUrl:unique[0],backImageUrl:unique[1],imageCount:unique.length}});
              console.log(`HYDRATE ${i+1}/25 ${row.sport} ${row.legacy_item_id} images=${unique.length}`);
            }
            if(pairs.length!==25||new Set(pairs.map(x=>x.listing.legacyItemId)).size!==25)throw new Error('Hydrated panel is not 25 unique listings.');
            fs.writeFileSync(process.env.PAIRS_OUT,JSON.stringify(pairs,null,2));
            const counts={};for(const x of pairs)counts[x.expected.sport]=(counts[x.expected.sport]||0)+1;
            console.log('HYDRATED_PANEL='+JSON.stringify({count:pairs.length,sports:counts,positiveAutos:pairs.filter(x=>x.expected.isAuto).length,positiveRelics:pairs.filter(x=>x.expected.isRelic).length,serialNumbered:pairs.filter(x=>x.expected.serialDenominator).length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          rm -f "$env_file"

      - name: Provision isolated Production scan credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          list="$TEMP_DIR/env-clean.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          if grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"; then
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          fi
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          secret="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy app-equivalent source with isolated scan credential and prove auth path
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$TEMP_DIR/acceptance-deploy.log" 2>&1
          touch "$TEMP_DIR/acceptance-deployed"
          ready=0
          for attempt in $(seq 1 18); do
            out="$TEMP_DIR/readiness-before-scans.json"
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?audit25=mixed-scans&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node - "$out" <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if(b[k]!==true) process.exit(1);
          NODE
            then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          body="$TEMP_DIR/auth-heartbeat.json"
          code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $token" -F 'aiCouncilTier=basic' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
          test "$code" = "400"
          grep -Fq 'Upload a front card image.' "$body"

      - name: Scan and grade 25 real mixed-sport eBay front/back cards
        id: direct_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          PAIRS_PATH="$TEMP_DIR/live-pairs.json" REPORT_PATH="$GITHUB_WORKSPACE/reports/instacomp-direct-25-production.json" node <<'NODE'
          const fs=require('node:fs');
          const pairs=JSON.parse(fs.readFileSync(process.env.PAIRS_PATH,'utf8'));
          const ORIGIN='https://truelycollectables.com',token=process.env.INSTACOMP_ACCEPTANCE_SERVICE_TOKEN;
          const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
          const norm=v=>clean(v).normalize('NFKD').replace(/[’']/g,'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9/]+/g,' ').replace(/\s+/g,' ').trim();
          const compact=v=>norm(v).replace(/[^a-z0-9]/g,'');
          const record=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
          const tokenSet=v=>norm(v).split(' ').filter(Boolean).sort().join(' ');
          function textEquivalent(a,b){const A=norm(a),B=norm(b);if(A===B)return true;if(!A||!B)return false;if(A.includes(B)||B.includes(A))return true;return tokenSet(A)===tokenSet(B);}
          function playerEquivalent(a,b){const A=norm(a),B=norm(b);if(A===B)return true;const parts=clean(b).split('/').map(norm).filter(Boolean);return parts.length>1&&parts.every(p=>A.includes(p));}
          function canonicalParallel(v){const n=norm(v);if(!n||['base','base card','none','null','standard','regular'].includes(n))return 'base';return tokenSet(n.replace(/\bprizms?\b/g,'').trim());}
          function serialDen(v){const m=clean(v).match(/\b\d{1,5}\s*\/\s*(\d{1,6})\b/);return m?Number(m[1]):null;}
          async function image(url,side){const r=await fetch(url,{signal:AbortSignal.timeout(30000),headers:{'User-Agent':'TCOS-InstaComp-25-Live-Mixed-Audit/1.0'}});if(!r.ok)throw new Error(`${side} image HTTP ${r.status}`);const type=(r.headers.get('content-type')||'image/jpeg').split(';')[0].trim();const bytes=Buffer.from(await r.arrayBuffer());if(bytes.length<500)throw new Error(`${side} image too small`);return new File([bytes],`${side}.jpg`,{type});}
          async function scan(front,back){const form=new FormData();form.append('frontImage',front,front.name);form.append('backImage',back,back.name);form.append('aiCouncilTier','basic');const r=await fetch(`${ORIGIN}/api/instacomp/scan`,{method:'POST',body:form,redirect:'error',signal:AbortSignal.timeout(295000),headers:{'x-tcos-instacomp-service-token':token,'User-Agent':'TCOS-InstaComp-25-Live-Mixed-Audit/1.0'}});const t=await r.text();let p={};try{p=t?JSON.parse(t):{}}catch{p={error:`Non-JSON: ${t.slice(0,500)}`}}return {httpOk:r.ok,httpStatus:r.status,payload:p};}
          function grade(row,res){const e=row.expected||{},p=record(res.payload),a=record(p.ai),reg=record(p.checklistRegistry),dec=record(p.identityDecision);let conf=Number(dec.confidence??reg.identityConfidence??NaN);if(Number.isFinite(conf)&&conf>1)conf/=100;const actual={player:clean(a.player),year:clean(a.year),brand:clean(a.manufacturer||a.brand),setName:clean(a.setName||a.set_name),cardNumber:clean(a.cardNumber||a.card_number),parallel:clean(a.parallel)||'Base',serialNumber:clean(a.serialNumber||a.serial_number),team:clean(a.team),sport:clean(a.sport),isRookie:(a.isRookie??a.is_rookie)===true,isAuto:(a.isAuto??a.is_auto)===true,isRelic:(a.isRelic??a.is_relic)===true,confidence:Number.isFinite(conf)?conf:null,registryMatched:reg.matched===true,identityConfirmed:dec.confirmed===true||reg.identityConfirmed===true,registryIdentityId:clean(reg.identityId)||null};
            const fields=[];const add=(field,weight,pass,note)=>fields.push({field,weight,pass:!!pass,earned:pass?weight:0,note});
            add('player',15,playerEquivalent(actual.player,e.player),`${actual.player||'missing'} vs ${e.player}`);
            add('year',10,norm(actual.year)===norm(e.year),`${actual.year||'missing'} vs ${e.year}`);
            add('brand',8,textEquivalent(actual.brand,e.brand),`${actual.brand||'missing'} vs ${e.brand}`);
            add('set',10,textEquivalent(actual.setName,e.setName),`${actual.setName||'missing'} vs ${e.setName}`);
            add('cardNumber',12,compact(actual.cardNumber)===compact(e.cardNumber),`${actual.cardNumber||'missing'} vs ${e.cardNumber}`);
            add('parallel',10,canonicalParallel(actual.parallel)===canonicalParallel(e.parallel),`${actual.parallel||'missing'} vs ${e.parallel}`);
            const expectedDen=Number(e.serialDenominator||0)||null,actualDen=serialDen(actual.serialNumber);
            add('serial',8,expectedDen?actualDen===expectedDen:!actualDen,`${actual.serialNumber||'none'} vs ${expectedDen?'/'+expectedDen:'none'}`);
            add('team',6,!clean(e.team)||textEquivalent(actual.team,e.team),`${actual.team||'missing'} vs ${e.team||'n/a'}`);
            add('sport',4,textEquivalent(actual.sport,e.sport),`${actual.sport||'missing'} vs ${e.sport}`);
            add('rookie',5,actual.isRookie===Boolean(e.isRookie),`${actual.isRookie} vs ${Boolean(e.isRookie)}`);
            add('auto',4,actual.isAuto===Boolean(e.isAuto),`${actual.isAuto} vs ${Boolean(e.isAuto)}`);
            add('relic',3,actual.isRelic===Boolean(e.isRelic),`${actual.isRelic} vs ${Boolean(e.isRelic)}`);
            add('confidence',5,(actual.confidence??0)>=0.95,`${actual.confidence}`);
            const score=fields.reduce((s,x)=>s+x.earned,0),critical=fields.filter(x=>['player','year','cardNumber'].includes(x.field)&&!x.pass).map(x=>x.field),major=fields.filter(x=>['parallel','serial'].includes(x.field)&&!x.pass).map(x=>x.field);const exactCore=['player','year','brand','set','cardNumber','parallel'].every(f=>fields.find(x=>x.field===f)?.pass)&&(expectedDen?fields.find(x=>x.field==='serial')?.pass:true);const registryLock=actual.registryMatched&&actual.identityConfirmed;return {actual,fields,score,critical,major,exactCore,registryLock,pass:res.httpOk&&p.ok===true&&critical.length===0&&major.length===0&&score>=85&&registryLock};}
          (async()=>{
            const startedAt=new Date().toISOString(),results=[];
            for(let i=0;i<pairs.length;i++){
              const row=pairs[i],started=Date.now();let res={httpOk:false,httpStatus:0,payload:{}},failure=null;
              try{const [front,back]=await Promise.all([image(row.listing.frontImageUrl,'front'),image(row.listing.backImageUrl,'back')]);res=await scan(front,back);}catch(e){failure=String(e?.message||e);}
              const graded=grade(row,res),out={number:i+1,caseId:row.caseId,listing:row.listing,expected:row.expected,http:{ok:res.httpOk,status:res.httpStatus},routeOk:res.payload?.ok===true,failure:failure||clean(res.payload?.error)||null,...graded,durationMs:Date.now()-started};results.push(out);console.log(`CARD ${i+1}/25 ${graded.pass?'PASS':'FAIL'} score=${graded.score} core=${graded.exactCore} registry=${graded.registryLock} auto=${graded.actual.isAuto} relic=${graded.actual.isRelic} serial=${graded.actual.serialNumber||'-'} :: ${row.listing.title}`);fs.writeFileSync(process.env.REPORT_PATH,JSON.stringify({schema:'tcos.instacomp.direct25LiveMixed.v1',startedAt,updatedAt:new Date().toISOString(),results},null,2));
            }
            const total=results.length,passed=results.filter(x=>x.pass).length,core=results.filter(x=>x.exactCore).length,registry=results.filter(x=>x.registryLock).length,httpOk=results.filter(x=>x.http.ok&&x.routeOk).length,avg=total?+(results.reduce((s,x)=>s+x.score,0)/total).toFixed(1):0;
            const serialRows=results.filter(x=>Number(x.expected?.serialDenominator)>0),rookieRows=results.filter(x=>x.expected?.isRookie===true),parallelRows=results.filter(x=>canonicalParallel(x.expected?.parallel)!=='base'),autoRows=results.filter(x=>x.expected?.isAuto===true),relicRows=results.filter(x=>x.expected?.isRelic===true);const bySport={};for(const x of results)bySport[x.expected.sport]=(bySport[x.expected.sport]||0)+1;
            const summary={requested:25,completed:total,httpRouteOk:httpOk,passed,passRate:total?+(passed/total*100).toFixed(1):0,exactCore:core,exactCoreRate:total?+(core/total*100).toFixed(1):0,registryLocked:registry,registryRate:total?+(registry/total*100).toFixed(1):0,averageScore:avg,sports:bySport,serialNumbered:{tested:serialRows.length,correct:serialRows.filter(x=>x.fields.find(f=>f.field==='serial')?.pass).length},rookies:{tested:rookieRows.length,correct:rookieRows.filter(x=>x.fields.find(f=>f.field==='rookie')?.pass).length},nonBaseParallels:{tested:parallelRows.length,correct:parallelRows.filter(x=>x.fields.find(f=>f.field==='parallel')?.pass).length},positiveAutos:{tested:autoRows.length,correct:autoRows.filter(x=>x.fields.find(f=>f.field==='auto')?.pass).length},positiveRelics:{tested:relicRows.length,correct:relicRows.filter(x=>x.fields.find(f=>f.field==='relic')?.pass).length},criticalErrors:results.reduce((s,x)=>s+x.critical.length,0),majorErrors:results.reduce((s,x)=>s+x.major.length,0),safeRefusals:results.filter(x=>!x.http.ok||!x.routeOk||!x.registryLock).length};
            const final={schema:'tcos.instacomp.direct25LiveMixed.v1',startedAt,completedAt:new Date().toISOString(),summary,grading:'100 points: player15 year10 brand8 set10 card#12 parallel10 serial8 team6 sport4 rookie5 auto4 relic3 confidence5. Pass requires no critical player/year/card# error, no major parallel/serial error, score >=85, route success, and Registry lock.',results};fs.writeFileSync(process.env.REPORT_PATH,JSON.stringify(final,null,2));console.log('INSTACOMP_DIRECT_25_SUMMARY='+JSON.stringify(summary));if(total!==25)throw new Error(`Incomplete ${total}/25`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Print full 25-card grading receipt
        if: always()
        shell: bash
        run: |
          if [ -s reports/instacomp-direct-25-production.json ]; then
            echo 'INSTACOMP_DIRECT_25_REPORT_START'
            cat reports/instacomp-direct-25-production.json
            echo 'INSTACOMP_DIRECT_25_REPORT_END'
          else
            echo 'NO_DIRECT_25_REPORT'
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-direct-25-production
          path: reports/instacomp-direct-25-production.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove isolated scan credential and clean redeploy exact main
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$TEMP_DIR/token-provisioned" ]; then
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          fi
          git fetch origin main --quiet
          git checkout --force --detach origin/main
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$TEMP_DIR/clean-deploy.log" 2>&1
          ready=0
          for attempt in $(seq 1 18); do
            out="$TEMP_DIR/readiness-clean.json"
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?audit25=mixed-clean&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node - "$out" <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const k of ['ok','configured','reachable','internalMemoryReady','checklistReady','localModelReady']) if(b[k]!==true) process.exit(1);
          NODE
            then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"
          if [ -s "$TEMP_DIR/acceptance-token" ]; then
            dead="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$dead"
            body="$TEMP_DIR/dead-token.json"
            auth_code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $dead" -F 'aiCouncilTier=basic' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
            test "$auth_code" = "401" -o "$auth_code" = "403"
          fi

      - name: Final completeness gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s reports/instacomp-direct-25-production.json
          node - <<'NODE'
          const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('reports/instacomp-direct-25-production.json','utf8'));console.log(JSON.stringify(r.summary||{},null,2));if(Number(r.summary?.completed||0)!==25)throw new Error(`Incomplete: ${r.summary?.completed||0}/25`);
          NODE

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR"
