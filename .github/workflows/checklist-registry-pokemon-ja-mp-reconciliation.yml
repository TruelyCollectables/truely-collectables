name: Checklist Registry Pokémon Japanese M-P Reconciliation

on:
  pull_request:
    paths:
      - "scripts/analyze-pokemon-japanese-mp-reconciliation.ts"
      - "scripts/finalize-pokemon-japanese-mp-reconciliation-analysis.ts"
      - "scripts/verify-pokemon-japanese-official-sources.ts"
      - "scripts/finalize-pokemon-japanese-official-verification.ts"
      - "scripts/run-pokemon-japanese-official-verification.ts"
      - "scripts/build-tcgdex-japanese-registry-bundles.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-mp-reconciliation.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/analyze-pokemon-japanese-mp-reconciliation.ts"
      - "scripts/finalize-pokemon-japanese-mp-reconciliation-analysis.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-mp-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-mp-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint M-P reconciliation analyzers
        run: >-
          npx eslint
          scripts/analyze-pokemon-japanese-mp-reconciliation.ts
          scripts/finalize-pokemon-japanese-mp-reconciliation-analysis.ts

      - name: Check out current TCGdex source
        run: >-
          git clone --depth 1
          https://github.com/tcgdex/cards-database.git
          .codex-run/tcgdex-cards-database

      - name: Build Japanese Registry base bundles
        run: >-
          npx tsx scripts/build-tcgdex-japanese-registry-bundles.ts
          .codex-run/tcgdex-cards-database
          .codex-run/tcgdex-ja-registry-bundles
          --receipt .codex-run/tcgdex-ja-build-receipt.json

      - name: Audit M-P against the official source
        run: >-
          npx tsx scripts/run-pokemon-japanese-official-verification.ts
          .codex-run/tcgdex-ja-registry-bundles
          --set M-P
          --delay-ms 50
          --detail-samples 5
          --receipt .codex-run/pokemon-ja-mp-audit-receipt.json
          --queue .codex-run/pokemon-ja-mp-audit-queue.json

      - name: Collect complete M-P number and name crosswalk
        run: >-
          npx tsx scripts/analyze-pokemon-japanese-mp-reconciliation.ts
          .codex-run/tcgdex-ja-registry-bundles
          --audit-receipt .codex-run/pokemon-ja-mp-audit-receipt.json
          --delay-ms 50
          --receipt .codex-run/pokemon-ja-mp-reconciliation-analysis.json
          --queue .codex-run/pokemon-ja-mp-reconciliation-queue.json

      - name: Finalize unnumbered and excluded-card evidence
        run: >-
          npx tsx scripts/finalize-pokemon-japanese-mp-reconciliation-analysis.ts
          .codex-run/pokemon-ja-mp-reconciliation-analysis.json
          --delay-ms 50
          --receipt .codex-run/pokemon-ja-mp-reconciliation-final.json
          --queue .codex-run/pokemon-ja-mp-reconciliation-construction-queue.json

      - name: Verify exact reconciliation result
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/pokemon-ja-mp-reconciliation-final.json');
          const expected = {
            registryCards: 83,
            officialComparableCards: 106,
            officialNumberedCards: 91,
            officialUnnumberedCards: 15,
            exactNumberNameMatches: 75,
            sameNumberNameMismatches: 0,
            registryOnlyNumbers: 8,
            officialOnlyNumberedCards: 16,
            excludedProductCards: 8,
            resolvedRegistryRemaps: 8,
            unresolvedRegistryRemaps: 0,
            unmatchedExcludedCards: 0,
            netPopulationChange: 23,
          };
          if (receipt.mode !== 'read_only') throw new Error(`Unexpected mode: ${receipt.mode}`);
          if (receipt.targetSet.id !== 'M-P') throw new Error(`Unexpected set: ${receipt.targetSet.id}`);
          if (JSON.stringify(receipt.counts) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected M-P reconciliation counts: ${JSON.stringify(receipt.counts)}`);
          }
          if (receipt.safeForBundleConstruction !== true) {
            throw new Error('M-P evidence should be ready for bundle construction.');
          }
          if (receipt.automaticProductionWriteAllowed !== false) {
            throw new Error('The evidence analyzer must never authorize a Production write.');
          }
          console.log(JSON.stringify({
            targetSet: receipt.targetSet,
            official: {
              productCardCount: receipt.official.productCardCount,
              comparableCardCount: receipt.official.comparableCardCount,
              excludedCardCount: receipt.official.excludedCardCount,
              excludedSetCodeCounts: receipt.official.excludedSetCodeCounts,
            },
            counts: receipt.counts,
            safeForBundleConstruction: receipt.safeForBundleConstruction,
            automaticProductionWriteAllowed: receipt.automaticProductionWriteAllowed,
          }, null, 2));
          NODE

      - name: Upload M-P reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-mp-reconciliation-evidence
          path: |
            .codex-run/pokemon-ja-mp-audit-receipt.json
            .codex-run/pokemon-ja-mp-reconciliation-analysis.json
            .codex-run/pokemon-ja-mp-reconciliation-final.json
            .codex-run/pokemon-ja-mp-reconciliation-construction-queue.json
          if-no-files-found: error
          retention-days: 14
