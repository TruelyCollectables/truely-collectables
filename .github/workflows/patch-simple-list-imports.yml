name: Patch Simple List Imports

on:
  push:
    branches: [agent/simplified-list-route]
    paths:
      - ".github/workflows/patch-simple-list-imports.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplified-list-route
          fetch-depth: 0
      - name: Correct exact import depth
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/api/admin/simple-list-drafts/route.ts')
          text = path.read_text()
          old = '../../../../../'
          count = text.count(old)
          if count != 5:
              raise SystemExit(f'Expected 5 over-deep imports, found {count}')
          path.write_text(text.replace(old, '../../../../'))
          PY
      - name: Verify imports
        run: |
          grep -Fq 'from "../../../../lib/authenticity"' src/app/api/admin/simple-list-drafts/route.ts
          grep -Fq 'from "../../../../modules/inventory"' src/app/api/admin/simple-list-drafts/route.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/admin/simple-list-drafts/route.ts
          git commit -m "Fix simplified list endpoint import depth"
          git push origin HEAD:agent/simplified-list-route
