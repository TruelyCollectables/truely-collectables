name: Patch Versioned Identity Constraint

on:
  push:
    branches:
      - agent/checklist-versioned-identity-repair
  pull_request:
    paths:
      - ".github/workflows/patch-versioned-identity-constraint.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/checklist-versioned-identity-repair
          fetch-depth: 0

      - name: Replace truncated-name removal with catalog detection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260801132000_checklist_registry_versioned_identities.sql")
          text = path.read_text()
          old = '''alter table public.checklist_card_identities
            drop constraint if exists checklist_card_identities_identity_schema_fingerprint_sha256_key;

          drop index if exists public.checklist_card_identities_identity_schema_fingerprint_sha256_key;
'''
          new = '''do $constraint_cleanup$
          declare
            v_constraint record;
          begin
            for v_constraint in
              select constraint_row.conname
              from pg_constraint constraint_row
              where constraint_row.conrelid = 'public.checklist_card_identities'::regclass
                and constraint_row.contype = 'u'
                and pg_get_constraintdef(constraint_row.oid) ~*
                    '^UNIQUE \\(identity_schema, fingerprint_sha256\\)$'
            loop
              execute format(
                'alter table public.checklist_card_identities drop constraint %I',
                v_constraint.conname
              );
            end loop;
          end;
          $constraint_cleanup$;
'''
          if old not in text:
              if "$constraint_cleanup$" in text:
                  raise SystemExit(0)
              raise SystemExit("Original global constraint block was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- supabase/migrations/20260801132000_checklist_registry_versioned_identities.sql; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260801132000_checklist_registry_versioned_identities.sql
          git commit -m "Detect the original identity constraint by columns"
          git push origin HEAD:agent/checklist-versioned-identity-repair
