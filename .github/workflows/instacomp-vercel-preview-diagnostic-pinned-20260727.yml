name: InstaComp Vercel Preview Diagnostic Pinned 20260727

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/instacomp-vercel-preview-diagnostic-pinned-20260727.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: instacomp-vercel-preview-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Announce diagnostic
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/143/comments" \
            -f body="Pinned InstaComp Vercel diagnostic started on commit \`${GITHUB_SHA}\` (Actions run ${GITHUB_RUN_ID}). Testing token, project link, and preview pull separately."

      - name: Check out pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Vercel token identity
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx vercel@latest whoami --token "$VERCEL_TOKEN"

      - name: Link exact Vercel project
        run: |
          set -euo pipefail
          npx vercel@latest link \
            --yes \
            --project truely-collectables \
            --scope truelycollectables-projects \
            --token "$VERCEL_TOKEN"
          test -f .vercel/project.json
          node -e 'const p=require("./.vercel/project.json"); console.log(JSON.stringify({orgIdPresent:Boolean(p.orgId),projectIdPresent:Boolean(p.projectId)})); if(!p.orgId||!p.projectId) process.exit(1)'

      - name: Pull preview environment
        run: |
          set -euo pipefail
          npx vercel@latest pull \
            --yes \
            --environment=preview \
            --token "$VERCEL_TOKEN"
          test -f .vercel/.env.preview.local
          node --env-file=.vercel/.env.preview.local <<'NODE'
          const presence = {
            openAi: Boolean(String(process.env.OPENAI_API_KEY || "").trim()),
            serpApi: Boolean(String(process.env.SERPAPI_API_KEY || "").trim()),
            ebayClientId: Boolean(String(process.env.EBAY_CLIENT_ID || "").trim()),
            ebayClientSecret: Boolean(String(process.env.EBAY_CLIENT_SECRET || "").trim()),
            supabase: Boolean(String(process.env.NEXT_PUBLIC_SUPABASE_URL || "").trim()),
          };
          console.log(`preview_env_presence=${JSON.stringify(presence)}`);
          if (!presence.ebayClientId || !presence.ebayClientSecret || !presence.supabase) process.exit(1);
          NODE

      - name: Announce diagnostic passed
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/143/comments" \
            -f body="Pinned InstaComp Vercel diagnostic ${GITHUB_RUN_ID} passed: token, exact project link, and preview environment pull are working."

      - name: Post final diagnostic status
        if: always()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/143/comments" \
            -f body="Pinned InstaComp Vercel diagnostic ${GITHUB_RUN_ID} finished with job status **${{ job.status }}** on commit \`${GITHUB_SHA}\`."
