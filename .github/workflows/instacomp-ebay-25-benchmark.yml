name: InstaComp eBay 25-Card Benchmark

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - "scripts/harden-instacomp-*.py"
      - "scripts/run-instacomp-certification-safe.py"
      - "scripts/run-instacomp-certification-round2-safe.py"
      - "scripts/run-instacomp-exact-market-proof-regressions.ts"
      - ".github/workflows/instacomp-ebay-25-benchmark.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/harden-instacomp-*.py"
      - "scripts/run-instacomp-certification-safe.py"
      - "scripts/run-instacomp-certification-round2-safe.py"
      - "scripts/run-instacomp-exact-market-proof-regressions.ts"
      - ".github/workflows/instacomp-ebay-25-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-round2-regression-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  regression-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out certification branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply all hardening
        run: |
          python -m py_compile scripts/harden-instacomp-*.py scripts/run-instacomp-certification-safe.py scripts/run-instacomp-certification-round2-safe.py
          python scripts/harden-instacomp-ebay-benchmark.py
          python scripts/harden-instacomp-benchmark-source.py
          python scripts/harden-instacomp-benchmark-cleanup.py
          python scripts/run-instacomp-certification-safe.py
          python scripts/harden-instacomp-visual-proof.py
          python scripts/harden-instacomp-visual-review-types.py
          python scripts/harden-instacomp-benchmark-report.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Capture exactness regression diagnostics
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts 2>&1 | tee instacomp-round2-regression.log

      - name: Upload exactness regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-round2-regression-${{ github.run_number }}
          path: instacomp-round2-regression.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exactness regression
        if: ${{ steps.regression.outcome != 'success' }}
        run: |
          cat instacomp-round2-regression.log
          exit 1
