name: InstaComp eBay 25-Card Benchmark

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - "src/app/api/instacomp/benchmark/ebay-25/route.ts"
      - "src/app/api/instacomp/live-scan/route.ts"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/lib/client-identity.ts"
      - "src/lib/instacomp-ebay-benchmark-cases.ts"
      - "src/lib/instacomp-curated-checklist.ts"
      - "src/lib/instacomp*.ts"
      - "scripts/run-instacomp-ebay-25-benchmark.mjs"
      - "scripts/run-instacomp-ebay-25-through-vercel-curl.mjs"
      - ".github/workflows/instacomp-ebay-25-benchmark.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/app/api/instacomp/benchmark/ebay-25/route.ts"
      - "src/app/api/instacomp/live-scan/route.ts"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/lib/client-identity.ts"
      - "src/lib/instacomp-ebay-benchmark-cases.ts"
      - "src/lib/instacomp-curated-checklist.ts"
      - "src/lib/instacomp*.ts"
      - "scripts/run-instacomp-ebay-25-benchmark.mjs"
      - "scripts/run-instacomp-ebay-25-through-vercel-curl.mjs"
      - ".github/workflows/instacomp-ebay-25-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-ebay-25-real-cards
  cancel-in-progress: true

jobs:
  ebay-25-real-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
      INSTACOMP_BENCHMARK_TARGET: "25"
      INSTACOMP_BENCHMARK_CONCURRENCY: "2"
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0

      - name: Harden benchmark source selection and image validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/api/instacomp/benchmark/ebay-25/route.ts")
          text = path.read_text()

          old = '''function compactCardNumber(value: unknown) {
  return normalized(value).replace(/[^a-z0-9]/g, "");
}
'''
          new = '''function compactCardNumber(value: unknown) {
  return normalized(value).replace(/[^a-z0-9]/g, "");
}

function titleHasExactCardNumber(title: string, cardNumber: string) {
  const expected = compactCardNumber(cardNumber);
  if (!expected) return false;

  const escaped = clean(cardNumber)
    .replace(/[.*+?^${}()|[\\]\\]/g, "\\$&")
    .replace(/[-\\s]+/g, "[-\\s]?");
  const explicit = new RegExp(
    `(?:#|card(?:\\s*(?:no\\.?|number))?)\\s*${escaped}(?![a-z0-9])`,
    "i",
  );
  if (explicit.test(title)) return true;

  const tokens = clean(title).match(/[a-z0-9]+(?:-[a-z0-9]+)*/gi) || [];
  const disallowedPrevious = new Set([
    "series",
    "season",
    "year",
    "lot",
    "qty",
    "quantity",
    "box",
    "case",
    "of",
  ]);
  return tokens.some((token, index) => {
    if (compactCardNumber(token) !== expected) return false;
    const previous = normalized(tokens[index - 1]);
    if (disallowedPrevious.has(previous)) return false;
    const start = Math.max(0, title.toLowerCase().indexOf(token.toLowerCase()) - 1);
    if (title[start] === "/") return false;
    return true;
  });
}
'''
          if old not in text:
            raise SystemExit("compactCardNumber insertion point not found")
          text = text.replace(old, new, 1)

          old = '''function rejectedTitle(title: string) {
  return /\\b(?:lot|team set|complete set|reprint|custom|digital|nft|break|you pick|choose your card|psa|bgs|sgc|cgc|graded|gem mint)\\b/i.test(
    title,
  );
}
'''
          new = '''function rejectedTitle(title: string) {
  return /\\b(?:lot|team set|complete set|reprint|custom|digital|nft|break|you pick|choose your card|psa|bgs|sgc|cgc|graded|gem mint|oversized|oversize|jumbo|mini|box topper|5x7|8x10|promo)\\b/i.test(
    title,
  );
}
'''
          if old not in text:
            raise SystemExit("rejectedTitle block not found")
          text = text.replace(old, new, 1)

          old = '''  const numberPass = text.replace(/[^a-z0-9]/g, "").includes(compactCardNumber(expected.cardNumber));
'''
          new = '''  const numberPass = titleHasExactCardNumber(title, expected.cardNumber);
'''
          if old not in text:
            raise SystemExit("title card-number check not found")
          text = text.replace(old, new, 1)

          old = '''async function downloadImage(url: string, fileName: string) {
  const response = await fetch(url, {
    cache: "no-store",
    headers: { "User-Agent": "TCOS-InstaComp-Benchmark/1.0" },
    signal: AbortSignal.timeout(60_000),
  });
  if (!response.ok) {
    throw new Error(`Could not download ${fileName} (${response.status}).`);
  }
  const bytes = await response.arrayBuffer();
  if (!bytes.byteLength || bytes.byteLength > MAX_IMAGE_BYTES) {
    throw new Error(`${fileName} was empty or exceeded 12 MB.`);
  }
  const reportedType = clean(response.headers.get("content-type")).split(";")[0].toLowerCase();
  const inferredType = /\\.png(?:\\?|$)/i.test(url)
    ? "image/png"
    : /\\.webp(?:\\?|$)/i.test(url)
      ? "image/webp"
      : "image/jpeg";
  const type = ALLOWED_IMAGE_TYPES.has(reportedType) ? reportedType : inferredType;
  return new File([bytes], fileName, { type });
}
'''
          new = '''function imageTypeFromMagic(bytes: Uint8Array) {
  if (bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) {
    return "image/jpeg";
  }
  if (
    bytes.length >= 8 &&
    bytes[0] === 0x89 &&
    bytes[1] === 0x50 &&
    bytes[2] === 0x4e &&
    bytes[3] === 0x47 &&
    bytes[4] === 0x0d &&
    bytes[5] === 0x0a &&
    bytes[6] === 0x1a &&
    bytes[7] === 0x0a
  ) {
    return "image/png";
  }
  if (
    bytes.length >= 12 &&
    String.fromCharCode(...bytes.slice(0, 4)) === "RIFF" &&
    String.fromCharCode(...bytes.slice(8, 12)) === "WEBP"
  ) {
    return "image/webp";
  }
  return null;
}

async function downloadImage(url: string, fileName: string) {
  const response = await fetch(url, {
    cache: "no-store",
    headers: { "User-Agent": "TCOS-InstaComp-Benchmark/1.0" },
    signal: AbortSignal.timeout(60_000),
  });
  if (!response.ok) {
    throw new Error(`Could not download ${fileName} (${response.status}).`);
  }
  const buffer = await response.arrayBuffer();
  if (!buffer.byteLength || buffer.byteLength > MAX_IMAGE_BYTES) {
    throw new Error(`${fileName} was empty or exceeded 12 MB.`);
  }
  const bytes = new Uint8Array(buffer);
  const type = imageTypeFromMagic(bytes);
  if (!type || !ALLOWED_IMAGE_TYPES.has(type)) {
    const reportedType = clean(response.headers.get("content-type")).split(";")[0].toLowerCase();
    throw new Error(
      `${fileName} was not a real JPEG, PNG, or WebP image (reported ${reportedType || "unknown"}).`,
    );
  }
  return new File([buffer], fileName, { type });
}
'''
          if old not in text:
            raise SystemExit("downloadImage block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate hardened benchmark code
        run: |
          git diff --check
          npx eslint \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/lib/client-identity.ts \
            src/lib/instacomp-ebay-benchmark-cases.ts \
            scripts/run-instacomp-ebay-25-benchmark.mjs \
            scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Build hardened production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
          ADMIN_PASSWORD: build-only-placeholder-password
          ADMIN_SESSION_SECRET: build-only-placeholder-admin-session-secret
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_only_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only-placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
          EBAY_CLIENT_ID: build-only-placeholder-client-id
          EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: npm run build

      - name: Commit hardened benchmark route
        run: |
          if git diff --quiet -- src/app/api/instacomp/benchmark/ebay-25/route.ts; then
            echo "Benchmark route already hardened."
          else
            git config user.name "OpenAI Audit Agent"
            git config user.email "actions@users.noreply.github.com"
            git add src/app/api/instacomp/benchmark/ebay-25/route.ts
            git commit -m "Harden InstaComp eBay torture source validation"
            git push origin HEAD:agent/instacomp-exact-market-final-20260726
          fi

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx vercel@latest link
          --yes
          --project "$VERCEL_PROJECT"
          --scope "$VERCEL_SCOPE"
          --token "$VERCEL_TOKEN"

      - name: Generate isolated benchmark secrets
        run: |
          BENCHMARK_TOKEN="$(openssl rand -hex 32)"
          BENCHMARK_ADMIN_SECRET="$(openssl rand -hex 48)"
          echo "INSTACOMP_BENCHMARK_TOKEN=$BENCHMARK_TOKEN" >> "$GITHUB_ENV"
          echo "INSTACOMP_BENCHMARK_ADMIN_SECRET=$BENCHMARK_ADMIN_SECRET" >> "$GITHUB_ENV"

      - name: Deploy isolated preview benchmark
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest deploy \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --env "INSTACOMP_BENCHMARK_TOKEN=$INSTACOMP_BENCHMARK_TOKEN" \
            --env "ADMIN_SESSION_SECRET=$INSTACOMP_BENCHMARK_ADMIN_SECRET" \
            > deployment-url.txt
          PREVIEW_URL="$(tail -n 1 deployment-url.txt | tr -d '\r\n')"
          test -n "$PREVIEW_URL"
          echo "INSTACOMP_BENCHMARK_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview benchmark deployment: $PREVIEW_URL"

      - name: Verify preview benchmark endpoint through Vercel protection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          npx vercel@latest curl \
            /api/instacomp/benchmark/ebay-25 \
            --deployment "$INSTACOMP_BENCHMARK_URL" \
            --header "Authorization: Bearer $INSTACOMP_BENCHMARK_TOKEN" \
            > benchmark-manifest.json 2> benchmark-manifest-error.txt
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ]; then
            cat benchmark-manifest-error.txt >&2
            exit "$CURL_STATUS"
          fi
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("benchmark-manifest.json","utf8"));if(!p.ok||!Array.isArray(p.cases)||p.cases.length<25)throw new Error(`Benchmark manifest is not ready: ${JSON.stringify(p).slice(0,1000)}`);console.log(`Manifest ready: ${p.cases.length} official checklist cases`);'

      - name: Run 25 real eBay cards through InstaComp — audit pass 1
        id: benchmark_pass_1
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          INSTACOMP_PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.preview_url }}
          INSTACOMP_BENCHMARK_REPORT_DIR: reports/pass-1
        run: node scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Run 25 real eBay cards through InstaComp — audit pass 2
        id: benchmark_pass_2
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          INSTACOMP_PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.preview_url }}
        run: node scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Summarize benchmark results
        if: always()
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const reports = [
            ["Pass 1", "reports/pass-1/instacomp-ebay-25-report.json"],
            ["Pass 2", "reports/instacomp-ebay-25-report.json"],
          ];
          const lines = ["# InstaComp eBay 25-Card Double Audit", ""];
          for (const [label, file] of reports) {
            if (!fs.existsSync(file)) {
              lines.push(`## ${label}`, "No report file was produced.", "");
              continue;
            }
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const summary = report.summary || {};
            lines.push(
              `## ${label}`,
              `Preview: ${report.previewUrl || "unknown"}`,
              `Completed: ${summary.completedCards || 0}/${report.requestedTarget || 25}`,
              `Target met: ${Boolean(summary.targetMet)}`,
              `Average score: ${summary.averageScore ?? "n/a"}`,
              `Catalog confirmed: ${summary.catalogIdentityConfirmed || 0}/${summary.completedCards || 0}`,
              `Exact sold supported: ${summary.exactSoldSupportedCards || 0}/${summary.completedCards || 0}`,
              `Trusted sold-backed prices: ${summary.trustedPriceCards || 0}/${summary.completedCards || 0}`,
              `Weird errors: ${summary.totalWeirdErrors || 0} (${summary.criticalErrors || 0} critical, ${summary.majorErrors || 0} major, ${summary.minorErrors || 0} minor)`,
              "",
            );
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE

      - name: Upload double-audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-ebay-25-double-audit-${{ github.run_number }}
          path: |
            reports/instacomp-ebay-25-report.json
            reports/instacomp-ebay-25-report.md
            reports/pass-1/instacomp-ebay-25-report.json
            reports/pass-1/instacomp-ebay-25-report.md
            benchmark-manifest.json
            benchmark-manifest-error.txt
            deployment-url.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce two completed 25-card passes
        if: always()
        run: |
          test -f reports/pass-1/instacomp-ebay-25-report.json
          test -f reports/instacomp-ebay-25-report.json
          node - <<'NODE'
          const fs = require("fs");
          const reports = [
            ["pass 1", "reports/pass-1/instacomp-ebay-25-report.json"],
            ["pass 2", "reports/instacomp-ebay-25-report.json"],
          ];
          for (const [label, file] of reports) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!report?.summary?.targetMet || Number(report?.summary?.completedCards || 0) < 25) {
              throw new Error(`${label} incomplete: ${report?.summary?.completedCards || 0}/25 real cards completed.`);
            }
            console.log(`${label} complete: ${report.summary.completedCards}/25 real eBay cards.`);
          }
          NODE
