name: InstaComp eBay 25-Card Benchmark

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - "src/app/api/instacomp/benchmark/ebay-25/route.ts"
      - "src/app/api/instacomp/live-scan/route.ts"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/app/api/account/seller/inventory/instacomp/route.ts"
      - "src/lib/client-identity.ts"
      - "src/lib/instacomp-ebay-benchmark-cases.ts"
      - "src/lib/instacomp-curated-checklist.ts"
      - "src/lib/instacomp*.ts"
      - "scripts/harden-instacomp-*.py"
      - "scripts/run-instacomp-ebay-25-benchmark.mjs"
      - "scripts/run-instacomp-ebay-25-through-vercel-curl.mjs"
      - "scripts/run-instacomp-exact-market-proof-regressions.ts"
      - ".github/workflows/instacomp-ebay-25-benchmark.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/app/api/instacomp/benchmark/ebay-25/route.ts"
      - "src/app/api/instacomp/live-scan/route.ts"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/app/api/account/seller/inventory/instacomp/route.ts"
      - "src/lib/client-identity.ts"
      - "src/lib/instacomp-ebay-benchmark-cases.ts"
      - "src/lib/instacomp-curated-checklist.ts"
      - "src/lib/instacomp*.ts"
      - "scripts/harden-instacomp-*.py"
      - "scripts/run-instacomp-ebay-25-benchmark.mjs"
      - "scripts/run-instacomp-ebay-25-through-vercel-curl.mjs"
      - "scripts/run-instacomp-exact-market-proof-regressions.ts"
      - ".github/workflows/instacomp-ebay-25-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-ebay-25-certification
  cancel-in-progress: true

jobs:
  build-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out certification branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair and apply all audit hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/harden-instacomp-certification.py")
          text = path.read_text().replace(
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)",
              "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)",
          )
          path.write_text(text)
          PY
          python -m py_compile scripts/harden-instacomp-*.py
          python scripts/harden-instacomp-ebay-benchmark.py
          python scripts/harden-instacomp-benchmark-source.py
          python scripts/harden-instacomp-benchmark-cleanup.py
          python scripts/harden-instacomp-certification.py
          python scripts/harden-instacomp-visual-proof.py
          python scripts/harden-instacomp-visual-review-types.py
          python scripts/harden-instacomp-benchmark-report.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify exactness and lint
        run: |
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          npx eslint \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/app/api/instacomp/live-scan/route.ts \
            src/app/api/instacomp/scan/route.ts \
            src/app/api/account/seller/inventory/instacomp/route.ts \
            src/lib/client-identity.ts \
            src/lib/instacomp.ts \
            src/lib/instacomp-live-pipeline.ts \
            src/lib/instacomp-exact-market-provider.ts \
            src/lib/instacomp-openai-web-market-provider.ts \
            src/lib/instacomp-comp-visual-verification.ts \
            src/lib/instacomp-ebay-benchmark-cases.ts \
            src/lib/instacomp-curated-checklist.ts \
            scripts/run-instacomp-exact-market-proof-regressions.ts \
            scripts/run-instacomp-ebay-25-benchmark.mjs \
            scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Capture production build diagnostics
        id: build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
          ADMIN_PASSWORD: build-only-placeholder-password
          ADMIN_SESSION_SECRET: build-only-placeholder-admin-session-secret
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_only_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build-only-placeholder
          EBAY_CLIENT_ID: build-only-placeholder-client-id
          EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee instacomp-build-diagnostics.log

      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-build-diagnostics-${{ github.run_number }}
          path: instacomp-build-diagnostics.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce production build
        if: ${{ steps.build.outcome != 'success' }}
        run: |
          cat instacomp-build-diagnostics.log
          exit 1
