name: InstaComp Frozen Certification

on:
  push:
    branches:
      - agent/instacomp-certification-freeze-20260727
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-frozen-certification
  cancel-in-progress: false

jobs:
  frozen-static-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out immutable certification branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-certification-freeze-20260727
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run fail-closed InstaComp certification
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
          ADMIN_PASSWORD: build-only-placeholder-password
          ADMIN_SESSION_SECRET: build-only-placeholder-admin-session-secret
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_only_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build-only-placeholder
          EBAY_CLIENT_ID: build-only-placeholder-client-id
          EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: |
          set -euo pipefail
          mkdir -p receipts

          {
            python -m py_compile scripts/harden-instacomp-*.py scripts/run-instacomp-*.py
            python scripts/harden-instacomp-ebay-benchmark.py
            python scripts/harden-instacomp-benchmark-source.py
            python scripts/harden-instacomp-benchmark-cleanup.py
            python scripts/run-instacomp-certification-safe.py
            python scripts/harden-instacomp-visual-proof.py
            python scripts/harden-instacomp-visual-review-types.py
            python scripts/harden-instacomp-benchmark-report.py
            python scripts/run-instacomp-final-materialization.py
            npm pkg set 'dependencies.sharp=^0.34.5'
            npm install --package-lock-only
            git diff --check
            python scripts/check-instacomp-control-characters.py
            python scripts/assert-instacomp-final-source.py
            git status --short
          } 2>&1 | tee instacomp-materialization.log
          touch receipts/materialization.ok

          npm ci 2>&1 | tee instacomp-dependencies.log
          touch receipts/dependencies.ok

          {
            node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
            node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
            node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
            node --import tsx scripts/run-instacomp-final-audit-regressions.ts
            node --import tsx scripts/run-instacomp-final-audit-regressions.ts
            node --import tsx scripts/run-instacomp-final-audit-regressions.ts
            node --import tsx scripts/run-instacomp-live-pipeline-regressions.ts
            node --import tsx scripts/run-instacomp-batch-drop-regressions.ts
          } 2>&1 | tee instacomp-regressions.log
          touch receipts/regressions.ok

          npx eslint \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/app/api/instacomp/live-scan/route.ts \
            src/app/api/instacomp/scan/route.ts \
            src/app/api/account/seller/inventory/instacomp/route.ts \
            src/app/instacomp-test/InstaCompBatchLiveScanner.tsx \
            src/lib/instacomp.ts \
            src/lib/instacomp-live-pipeline.ts \
            src/lib/instacomp-exact-market-provider.ts \
            src/lib/instacomp-openai-web-market-provider.ts \
            src/lib/instacomp-comp-visual-verification.ts \
            src/lib/instacomp-curated-checklist.ts \
            src/lib/instacomp-benchmark-title.ts \
            src/lib/instacomp-image-safety.ts \
            src/lib/instacomp-image-orientation.ts \
            scripts/run-instacomp-exact-market-proof-regressions.ts \
            scripts/run-instacomp-final-audit-regressions.ts \
            scripts/run-instacomp-ebay-25-benchmark.mjs \
            scripts/run-instacomp-ebay-25-through-vercel-curl.mjs \
            2>&1 | tee instacomp-lint.log
          touch receipts/lint.ok

          npm run build 2>&1 | tee instacomp-build.log
          touch receipts/build.ok

          test -f receipts/materialization.ok
          test -f receipts/dependencies.ok
          test -f receipts/regressions.ok
          test -f receipts/lint.ok
          test -f receipts/build.ok

      - name: Upload frozen certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-frozen-static-${{ github.run_number }}
          path: |
            receipts/
            instacomp-materialization.log
            instacomp-dependencies.log
            instacomp-regressions.log
            instacomp-lint.log
            instacomp-build.log
            package.json
            package-lock.json
            src/app/api/instacomp/benchmark/ebay-25/route.ts
            src/app/api/instacomp/live-scan/route.ts
            src/app/api/instacomp/scan/route.ts
            src/app/api/account/seller/inventory/instacomp/route.ts
            src/app/instacomp-test/InstaCompBatchLiveScanner.tsx
            src/lib/instacomp.ts
            src/lib/instacomp-live-pipeline.ts
            src/lib/instacomp-exact-market-provider.ts
            src/lib/instacomp-comp-visual-verification.ts
            src/lib/instacomp-curated-checklist.ts
            src/lib/instacomp-benchmark-title.ts
            src/lib/instacomp-image-safety.ts
            src/lib/instacomp-image-orientation.ts
            scripts/run-instacomp-exact-market-proof-regressions.ts
            scripts/run-instacomp-final-audit-regressions.ts
          if-no-files-found: warn
          retention-days: 30
