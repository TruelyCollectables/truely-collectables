name: Repair Supabase Service Role and Send Admin Reset 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-admin-password-recovery-final-deploy-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-supabase-service-role-admin-reset
  cancel-in-progress: true

jobs:
  repair-deploy-reset:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/admin-password-recovery-proxy-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GITHUB_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_SHA: c4dd23b29f50a3fdbd1231bd30e0029c50b969e1
    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: c4dd23b29f50a3fdbd1231bd30e0029c50b969e1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link exact Vercel project
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .deployment-evidence
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi

      - name: Validate encrypted GitHub Supabase service-role key
        run: |
          set -euo pipefail
          test -n "${GITHUB_SUPABASE_SERVICE_ROLE_KEY:-}"
          echo "::add-mask::$GITHUB_SUPABASE_SERVICE_ROLE_KEY"
          cat > /tmp/validate-supabase-service-role.mjs <<'NODE'
          const url = String(process.env.NEXT_PUBLIC_SUPABASE_URL || "").replace(/\/+$/, "");
          const key = String(process.env.GITHUB_SUPABASE_SERVICE_ROLE_KEY || "");
          const storeId = "00000000-0000-4000-8000-000000000001";
          if (!url || !key) throw new Error("Supabase URL or encrypted GitHub service-role key is unavailable.");
          const headers = {
            apikey: key,
            Authorization: `Bearer ${key}`,
            "Content-Type": "application/json",
          };
          const read = await fetch(`${url}/rest/v1/store_settings?store_id=eq.${storeId}&select=store_id,metadata`, { headers });
          const readText = await read.text();
          console.log(`service-role-read HTTP=${read.status}`);
          if (!read.ok) throw new Error(`Encrypted GitHub key cannot read store_settings: HTTP ${read.status}; ${readText.slice(0, 500)}`);
          const rows = JSON.parse(readText || "[]");
          if (rows.length !== 1) throw new Error(`Expected one store_settings row, found ${rows.length}.`);
          const metadata = rows[0]?.metadata && typeof rows[0].metadata === "object" ? rows[0].metadata : {};
          const write = await fetch(`${url}/rest/v1/store_settings?store_id=eq.${storeId}`, {
            method: "PATCH",
            headers: { ...headers, Prefer: "return=minimal" },
            body: JSON.stringify({ metadata }),
          });
          const writeText = await write.text();
          console.log(`service-role-write HTTP=${write.status}`);
          if (!write.ok) throw new Error(`Encrypted GitHub key cannot write store_settings: HTTP ${write.status}; ${writeText.slice(0, 500)}`);
          console.log("ENCRYPTED_GITHUB_SERVICE_ROLE_VALID");
          NODE
          GITHUB_SUPABASE_SERVICE_ROLE_KEY="$GITHUB_SUPABASE_SERVICE_ROLE_KEY" \
            npx vercel@56.2.0 env run -e production -- node /tmp/validate-supabase-service-role.mjs

      - name: Replace bad Vercel Production service-role value
        run: |
          set -euo pipefail
          echo "::add-mask::$GITHUB_SUPABASE_SERVICE_ROLE_KEY"
          printf '%s\n' "$GITHUB_SUPABASE_SERVICE_ROLE_KEY" | npx vercel@56.2.0 env add SUPABASE_SERVICE_ROLE_KEY production \
            --force \
            --sensitive \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
          printf '%s\n' 'Validated encrypted GitHub service-role key installed as sensitive Vercel Production variable.' > .deployment-evidence/service-role-repair.txt

      - name: Redeploy exact merged admin recovery source
        id: deploy
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_SHA" > .deployment-evidence/source-sha.txt
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee .deployment-evidence/vercel-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' .deployment-evidence/vercel-deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DEPLOYMENT_URL" > .deployment-evidence/deployment-url.txt

      - name: Verify recovery write succeeds on deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .deployment-evidence/deployment-reset-body.html \
            --dump-header .deployment-evidence/deployment-reset.headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'next=/admin' \
            "$DEPLOYMENT_URL/api/admin/password-reset/request" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' .deployment-evidence/deployment-reset.headers | tail -n 1)"
          echo "deployment-reset HTTP=$code location=$location"
          case "$code" in 302|303|307|308) ;; *) exit 1 ;; esac
          if printf '%s' "$location" | grep -Fq 'reset=storage_error'; then
            echo "Credential storage still failed after service-role repair."
            exit 1
          fi
          printf '%s' "$location" | grep -Eq 'reset=(sent|email_error)'

      - name: Wait for custom-domain promotion and cooldown
        run: |
          set -euo pipefail
          ready=""
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/custom-login.html --write-out '%{http_code}' https://truelycollectables.com/admin/login || true)"
            if [ "$code" = "200" ] && grep -Fq "Email Owner Reset Link" .deployment-evidence/custom-login.html; then
              ready=1
              break
            fi
            sleep 10
          done
          test -n "$ready"
          sleep 95

      - name: Send one custom-domain owner reset email
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .deployment-evidence/custom-reset-body.html \
            --dump-header .deployment-evidence/custom-reset.headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'next=/api/admin/market-intel/profit-hunter-token?reveal=1' \
            https://truelycollectables.com/api/admin/password-reset/request || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' .deployment-evidence/custom-reset.headers | tail -n 1)"
          echo "custom-reset HTTP=$code location=$location"
          case "$code" in 302|303|307|308) ;; *) exit 1 ;; esac
          printf '%s' "$location" | grep -Fq 'reset=sent'
          if printf '%s' "$location" | grep -Eq 'reset=(storage_error|email_error)'; then
            echo "Owner reset email was not accepted."
            exit 1
          fi
          printf '%s\n' 'Production accepted one custom-domain owner reset email request. No password, reset token, or service-role value is stored in evidence.' > .deployment-evidence/reset-email-receipt.txt

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-admin-password-recovery-${{ github.run_number }}
          path: .deployment-evidence
          if-no-files-found: warn
          retention-days: 30
