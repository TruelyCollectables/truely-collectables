name: Diagnose Live Admin Password Reset Failure 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-admin-password-recovery-final-deploy-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-live-admin-password-reset-failure
  cancel-in-progress: true

jobs:
  diagnose-reset:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/admin-password-recovery-proxy-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Link exact Vercel project
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi

      - name: Trigger one redacted reset request
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output /tmp/reset-body.html \
            --dump-header /tmp/reset.headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'next=/admin' \
            https://truelycollectables.com/api/admin/password-reset/request || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' /tmp/reset.headers | tail -n 1)"
          echo "reset-request HTTP=$code location=$location"
          case "$code" in
            302|303|307|308) ;;
            *) exit 1 ;;
          esac

      - name: Pull exact Production runtime exception
        run: |
          set -euo pipefail
          sleep 8
          npx vercel@56.2.0 logs \
            --environment production \
            --since 15m \
            --query "Admin password reset request failed" \
            --expand \
            --limit 20 \
            --no-branch \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
