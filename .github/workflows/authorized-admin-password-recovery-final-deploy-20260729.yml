name: Inventory Supabase Recovery Credentials 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-admin-password-recovery-final-deploy-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-supabase-recovery-credentials
  cancel-in-progress: true

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/admin-password-recovery-proxy-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GH_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GH_SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      GH_SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      GH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report encrypted GitHub credential availability only
        run: |
          set -euo pipefail
          bool() { if [ -n "$1" ]; then printf 'true'; else printf 'false'; fi; }
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=$(bool "${GH_SUPABASE_ACCESS_TOKEN:-}")"
          echo "SUPABASE_PROJECT_REF_PRESENT=$(bool "${GH_SUPABASE_PROJECT_REF:-}")"
          echo "SUPABASE_SECRET_KEY_PRESENT=$(bool "${GH_SUPABASE_SECRET_KEY:-}")"
          echo "SUPABASE_DB_PASSWORD_PRESENT=$(bool "${GH_SUPABASE_DB_PASSWORD:-}")"
          echo "SUPABASE_PAT_PRESENT=$(bool "${GH_SUPABASE_PAT:-}")"
          echo "SUPABASE_JWT_SECRET_PRESENT=$(bool "${GH_SUPABASE_JWT_SECRET:-}")"
          echo "SUPABASE_SERVICE_ROLE_KEY_PRESENT=$(bool "${GH_SUPABASE_SERVICE_ROLE_KEY:-}")"

      - name: Link project and list Production variable names only
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi
          echo "--- Supabase-related Production variable names ---"
          npx vercel@56.2.0 env ls production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color | grep -Ei 'SUPABASE|POSTGRES|DATABASE' || true
