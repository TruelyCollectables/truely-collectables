name: Grant Supabase Service Role and Send Admin Reset 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-admin-password-recovery-final-deploy-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grant-supabase-service-role-admin-reset
  cancel-in-progress: true

jobs:
  grant-deploy-reset:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/admin-password-recovery-proxy-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_SHA: c4dd23b29f50a3fdbd1231bd30e0029c50b969e1
    steps:
      - name: Check out exact merged admin recovery source
        uses: actions/checkout@v4
        with:
          ref: c4dd23b29f50a3fdbd1231bd30e0029c50b969e1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link exact Vercel project
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel .deployment-evidence
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi

      - name: Grant minimal store-settings write privileges and recover secret key
        run: |
          set -euo pipefail
          cat > /tmp/grant-and-recover-supabase-key.mjs <<'NODE'
          import { appendFile } from "node:fs/promises";

          const supabaseUrl = String(process.env.NEXT_PUBLIC_SUPABASE_URL || "").replace(/\/+$/, "");
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || "");
          const githubEnv = String(process.env.GITHUB_ENV || "");
          const storeId = "00000000-0000-4000-8000-000000000001";
          if (!supabaseUrl || !accessToken || !githubEnv) {
            throw new Error("Supabase URL, management token, or GITHUB_ENV is unavailable.");
          }
          const ref = new URL(supabaseUrl).hostname.split(".")[0];
          if (!ref) throw new Error("Supabase project ref could not be derived.");
          const managementHeaders = {
            Authorization: `Bearer ${accessToken}`,
            "Content-Type": "application/json",
          };

          const grantSql = `
            grant usage on schema public to service_role;
            grant select, insert, update on table public.store_settings to service_role;
          `;
          const grantResponse = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
            method: "POST",
            headers: managementHeaders,
            body: JSON.stringify({ query: grantSql, parameters: [], read_only: false }),
          });
          const grantText = await grantResponse.text();
          console.log(`database-grant HTTP=${grantResponse.status}`);
          if (!grantResponse.ok) {
            throw new Error(`Supabase database grant failed: HTTP ${grantResponse.status}; ${grantText.slice(0, 800)}`);
          }

          const keysResponse = await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`, {
            headers: managementHeaders,
          });
          const keysText = await keysResponse.text();
          if (!keysResponse.ok) {
            throw new Error(`Supabase API-key listing failed: HTTP ${keysResponse.status}; ${keysText.slice(0, 500)}`);
          }
          const keys = JSON.parse(keysText || "[]");
          for (const entry of keys) {
            if (entry?.api_key) console.log(`::add-mask::${entry.api_key}`);
          }
          const candidates = [...keys].sort((left, right) => {
            const score = (entry) => {
              const type = String(entry?.type || "").toLowerCase();
              const name = String(entry?.name || "").toLowerCase();
              const prefix = String(entry?.prefix || "").toLowerCase();
              const role = String(entry?.secret_jwt_template?.role || "").toLowerCase();
              if (type === "secret" || prefix.startsWith("sb_secret_")) return 100;
              if (name.includes("service_role") || name.includes("service role") || role === "service_role") return 90;
              return 0;
            };
            return score(right) - score(left);
          });

          async function validateWrite(key) {
            if (!key) return false;
            console.log(`::add-mask::${key}`);
            const headers = {
              apikey: key,
              Authorization: `Bearer ${key}`,
              "Content-Type": "application/json",
            };
            const read = await fetch(`${supabaseUrl}/rest/v1/store_settings?store_id=eq.${storeId}&select=store_id,metadata`, { headers });
            const readText = await read.text();
            if (!read.ok) {
              console.log(`candidate-read HTTP=${read.status}`);
              return false;
            }
            const rows = JSON.parse(readText || "[]");
            if (rows.length !== 1) return false;
            const metadata = rows[0]?.metadata && typeof rows[0].metadata === "object" ? rows[0].metadata : {};
            const write = await fetch(`${supabaseUrl}/rest/v1/store_settings?store_id=eq.${storeId}`, {
              method: "PATCH",
              headers: { ...headers, Prefer: "return=minimal" },
              body: JSON.stringify({ metadata }),
            });
            console.log(`candidate-write HTTP=${write.status}`);
            return write.ok;
          }

          let selected = null;
          let selectedMetadata = null;
          for (const entry of candidates) {
            if (await validateWrite(entry?.api_key)) {
              selected = entry.api_key;
              selectedMetadata = {
                type: entry?.type || null,
                name: entry?.name || null,
                prefix: entry?.prefix || null,
              };
              break;
            }
          }
          if (!selected) {
            throw new Error("Database grant succeeded, but no revealed elevated Supabase key could write store_settings.");
          }
          console.log(`::add-mask::${selected}`);
          console.log(JSON.stringify({ grantApplied: true, keyWriteVerified: true, selected: selectedMetadata }));
          await appendFile(githubEnv, `RECOVERED_SUPABASE_SERVER_KEY=${selected}\n`, "utf8");
          console.log("SUPABASE_SERVICE_ROLE_GRANT_AND_KEY_VERIFIED");
          NODE
          GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" \
            npx vercel@56.2.0 env run -e production -- node /tmp/grant-and-recover-supabase-key.mjs
          printf '%s\n' 'Granted service_role minimal write access to public.store_settings and validated an elevated Supabase API key. No key value is stored in evidence.' > .deployment-evidence/database-grant.txt

      - name: Install validated Supabase server key in Vercel Production
        run: |
          set -euo pipefail
          test -n "${RECOVERED_SUPABASE_SERVER_KEY:-}"
          echo "::add-mask::$RECOVERED_SUPABASE_SERVER_KEY"
          printf '%s\n' "$RECOVERED_SUPABASE_SERVER_KEY" | npx vercel@56.2.0 env add SUPABASE_SERVICE_ROLE_KEY production \
            --force \
            --sensitive \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Redeploy exact merged admin recovery source
        id: deploy
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_SHA" > .deployment-evidence/source-sha.txt
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee .deployment-evidence/vercel-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' .deployment-evidence/vercel-deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DEPLOYMENT_URL" > .deployment-evidence/deployment-url.txt

      - name: Wait for custom-domain promotion
        run: |
          set -euo pipefail
          ready=""
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/custom-login.html --write-out '%{http_code}' https://truelycollectables.com/admin/login || true)"
            if [ "$code" = "200" ] && grep -Fq "Email Owner Reset Link" .deployment-evidence/custom-login.html; then
              ready=1
              break
            fi
            sleep 10
          done
          test -n "$ready"

      - name: Send exactly one owner reset email
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .deployment-evidence/reset-body.html \
            --dump-header .deployment-evidence/reset.headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'next=/api/admin/market-intel/profit-hunter-token?reveal=1' \
            https://truelycollectables.com/api/admin/password-reset/request || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' .deployment-evidence/reset.headers | tail -n 1)"
          echo "reset-request HTTP=$code location=$location"
          case "$code" in 302|303|307|308) ;; *) exit 1 ;; esac
          printf '%s' "$location" | grep -Fq 'reset=sent'
          if printf '%s' "$location" | grep -Eq 'reset=(storage_error|email_error)'; then
            echo "Owner reset email was not accepted."
            exit 1
          fi
          printf '%s\n' 'Production accepted exactly one custom-domain owner reset email request. No password, reset token, management token, or Supabase server key is stored in evidence.' > .deployment-evidence/reset-email-receipt.txt

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granted-service-role-admin-reset-${{ github.run_number }}
          path: .deployment-evidence
          if-no-files-found: warn
          retention-days: 30
