name: Authorized Final Admin Password Recovery Deploy 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-admin-password-recovery-final-deploy-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-final-admin-password-recovery-deploy
  cancel-in-progress: true

jobs:
  deploy-and-send-reset:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/admin-password-recovery-proxy-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      SOURCE_SHA: c4dd23b29f50a3fdbd1231bd30e0029c50b969e1
    steps:
      - name: Check out exact merged recovery source
        uses: actions/checkout@v4
        with:
          ref: c4dd23b29f50a3fdbd1231bd30e0029c50b969e1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link exact Vercel project
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .deployment-evidence
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi
          printf '%s\n' "$SOURCE_SHA" > .deployment-evidence/source-sha.txt

      - name: Deploy exact merged revision to Production
        id: deploy
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee .deployment-evidence/vercel-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' .deployment-evidence/vercel-deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DEPLOYMENT_URL" > .deployment-evidence/deployment-url.txt

      - name: Verify recovery and privacy boundaries on deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          login_code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/login.html --write-out '%{http_code}' "$DEPLOYMENT_URL/admin/login" || true)"
          reset_page_code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/reset-page.html --write-out '%{http_code}' "$DEPLOYMENT_URL/admin/reset-password" || true)"
          request_get_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/request-get.json --write-out '%{http_code}' "$DEPLOYMENT_URL/api/admin/password-reset/request" || true)"
          confirm_get_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/confirm-get.json --write-out '%{http_code}' "$DEPLOYMENT_URL/api/admin/password-reset/confirm" || true)"
          token_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/private-token.json --write-out '%{http_code}' -H 'Accept: application/json' "$DEPLOYMENT_URL/api/admin/market-intel/profit-hunter-token?reveal=1" || true)"
          echo "login=$login_code reset-page=$reset_page_code request-GET=$request_get_code confirm-GET=$confirm_get_code token=$token_code"
          test "$login_code" = "200"
          test "$reset_page_code" = "200"
          test "$request_get_code" = "405"
          test "$confirm_get_code" = "405"
          test "$token_code" = "401"
          grep -Fq "Email Owner Reset Link" .deployment-evidence/login.html
          grep -Fq "Choose a permanent admin password" .deployment-evidence/reset-page.html

      - name: Wait for custom-domain promotion
        run: |
          set -euo pipefail
          ready=""
          for attempt in $(seq 1 30); do
            login_code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/custom-login.html --write-out '%{http_code}' https://truelycollectables.com/admin/login || true)"
            reset_code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/custom-reset-page.html --write-out '%{http_code}' https://truelycollectables.com/admin/reset-password || true)"
            request_get_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output .deployment-evidence/custom-request-get.json --write-out '%{http_code}' https://truelycollectables.com/api/admin/password-reset/request || true)"
            echo "custom attempt=$attempt login=$login_code reset=$reset_code request-GET=$request_get_code"
            if [ "$login_code" = "200" ] && [ "$reset_code" = "200" ] && [ "$request_get_code" = "405" ] && grep -Fq "Email Owner Reset Link" .deployment-evidence/custom-login.html && grep -Fq "Choose a permanent admin password" .deployment-evidence/custom-reset-page.html; then
              ready=1
              break
            fi
            sleep 15
          done
          test -n "$ready"

      - name: Send one real owner reset email
        run: |
          set -euo pipefail
          response_code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .deployment-evidence/reset-request-body.html \
            --dump-header .deployment-evidence/reset-request.headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'next=/api/admin/market-intel/profit-hunter-token?reveal=1' \
            https://truelycollectables.com/api/admin/password-reset/request || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' .deployment-evidence/reset-request.headers | tail -n 1)"
          echo "reset-request HTTP=$response_code location=$location"
          case "$response_code" in
            302|303|307|308) ;;
            *) echo "Reset request did not return a safe redirect."; exit 1 ;;
          esac
          printf '%s' "$location" | grep -Fq 'reset=sent'
          if printf '%s' "$location" | grep -Eq 'reset=(email_error|storage_error)'; then
            echo "Owner reset email was not accepted."
            exit 1
          fi
          printf '%s\n' 'Production accepted one custom-domain owner reset email request. No password or reset token is stored in evidence.' > .deployment-evidence/reset-email-receipt.txt

      - name: Upload redacted deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-admin-password-recovery-${{ github.run_number }}
          path: .deployment-evidence
          if-no-files-found: warn
          retention-days: 30
