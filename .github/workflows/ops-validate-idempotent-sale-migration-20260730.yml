name: Ops Validate Idempotent Sale Migration

on:
  pull_request:
    branches:
      - fix/idempotent-sale-recorder-current-main-20260730
    paths:
      - ".github/workflows/ops-validate-idempotent-sale-migration-20260730.yml"

permissions:
  contents: read

env:
  EXPECTED_PARENT_SHA: 1b0b9e418466070137d0bc6db9569dde20dfd89f
  VERCEL_SCOPE: truelycollectables-projects

jobs:
  validate-exact-parent:
    if: github.event.pull_request.head.ref == 'ops/validate-idempotent-sale-migration-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
      ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-validation-admin-password
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_validation
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
      STRIPE_WEBHOOK_SECRET: whsec_build_validation
      EBAY_CLIENT_ID: build-validation-client-id
      EBAY_CLIENT_SECRET: build-validation-client-secret
      EBAY_ENVIRONMENT: production
      CRON_SECRET: build-validation-cron-secret-that-is-long-enough
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out exact migration repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/idempotent-sale-recorder-current-main-20260730
          fetch-depth: 0

      - name: Fail closed on exact parent SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/idempotent-sale-recorder-current-main-20260730
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-parse origin/fix/idempotent-sale-recorder-current-main-20260730)" = "$EXPECTED_PARENT_SHA"
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run issue 253 and privileged-route simulations
        run: |
          node scripts/run-sold-lifecycle-simulations.mjs
          node scripts/run-sold-trigger-order-simulation.mjs
          node scripts/run-privileged-api-route-audit.mjs
          npm run simulate:privileged-route-auth

      - name: Run lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run Production build
        run: npm run build

      - name: Validate repeatable migrations against current Production schema with rollback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/sale-migration-validation"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/sale-migration-validation/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const envPath = path.join(process.env.RUNNER_TEMP, 'sale-migration-validation', 'production.env');
          const text = fs.readFileSync(envPath, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const productionUrl = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) {
            throw new Error('Production NEXT_PUBLIC_SUPABASE_URL was not pulled.');
          }
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;
          const request = async (query, readOnly) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
            });
            const body = await response.text();
            if (!response.ok) {
              const safe = body
                .replace(/postgres(?:ql)?:\/\/[^\s"']+/gi, 'postgresql://[REDACTED]')
                .replace(/Bearer\s+[A-Za-z0-9._~+/=-]+/gi, 'Bearer [REDACTED]')
                .slice(0, 5000);
              throw new Error(`Production rollback validation failed with HTTP ${response.status}: ${safe}`);
            }
            return body ? JSON.parse(body) : [];
          };

          const migrations = [
            '20260726050000_collectible_asset_lifecycle.sql',
            '20260730001950_correct_offer_order_item_paid_prices.sql',
            '20260730002000_sold_storefront_retention_and_sale_history.sql',
            '20260730002100_manual_sale_ebay_outbox.sql',
            '20260730002200_capture_ebay_inactive_sale_state.sql',
            '20260730002300_refine_verified_sale_timestamps.sql',
            '20260730002400_make_sale_recording_idempotent.sql',
            '20260730002500_reset_sold_presentation_on_restock.sql',
            '20260730002600_atomic_ebay_order_sales_and_outbox_scope.sql',
            '20260730002700_run_sale_guards_before_restock_reset.sql',
            '20260730002800_enforce_collx_inventory_boundary.sql',
          ];
          const parts = [];
          for (const name of migrations) {
            let sql = fs.readFileSync(path.join('supabase', 'migrations', name), 'utf8').trim();
            const hasBegin = /^begin\s*;/i.test(sql);
            const hasCommit = /commit\s*;\s*$/i.test(sql);
            if (hasBegin !== hasCommit) throw new Error(`Incomplete transaction wrapper: ${name}`);
            if (hasBegin) sql = sql.replace(/^begin\s*;/i, '').replace(/commit\s*;\s*$/i, '').trim();
            parts.push(`\n-- ${name}\n${sql}\n`);
          }

          const fingerprint = `
            select json_build_object(
              'relations', coalesce((select json_agg(c.relname order by c.relname)
                from pg_class c join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relname in (
                  'collectible_assets','collectible_asset_events','collectible_sales',
                  'instacomp_internal_sold_comps','collx_only_inventory_boundary_violations',
                  'ebay_inbound_sale_guards'
                )), '[]'::json),
              'functions', coalesce((select json_agg(p.proname order by p.proname)
                from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname='public' and p.proname in (
                  'record_collectible_sale','record_collectible_sale_unsafe_20260730',
                  'archive_expired_collectible_sales','apply_ebay_order_collectible_sale'
                )), '[]'::json)
            ) as state;
          `;
          const before = await request(fingerprint, true);
          await request(`begin;\n${parts.join('\n')}\nrollback;`, false);
          const after = await request(fingerprint, true);
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            throw new Error('Rollback validation changed the Production schema fingerprint.');
          }
          console.log(`Validated ${migrations.length} migrations against the current partially-applied Production schema with rollback.`);
          NODE
          rm -f "$RUNNER_TEMP/sale-migration-validation/production.env"
