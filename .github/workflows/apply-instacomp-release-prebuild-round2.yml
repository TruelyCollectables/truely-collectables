name: Apply InstaComp Exact Release Prebuild Round Two

on:
  pull_request:
    paths:
      - ".github/workflows/apply-instacomp-release-prebuild-round2.yml"

permissions:
  contents: write

concurrency:
  group: instacomp-round2-branch-writer
  cancel-in-progress: false

jobs:
  apply-release-prebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Inject exact release manifest before every build
        run: |
          python - <<'PY'
          from pathlib import Path
          package = Path('package.json')
          source = package.read_text()
          build = '    "build": "next build --webpack",'
          prebuild = '    "prebuild": "node scripts/write-instacomp-release-manifest.mjs --auto",'
          if prebuild not in source:
              if source.count(build) != 1:
                  raise SystemExit(f'package build marker count was {source.count(build)}')
              source = source.replace(build, f'{prebuild}\n{build}')
          package.write_text(source)
          PY

      - name: Verify universal build attestation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.scripts.prebuild !== 'node scripts/write-instacomp-release-manifest.mjs --auto') {
            throw new Error('Universal exact-release prebuild hook is missing.');
          }
          NODE
          TCOS_RELEASE_COMMIT="$(git rev-parse HEAD)" node scripts/write-instacomp-release-manifest.mjs --auto
          node -e "const p=require('./public/instacomp-release.json'); if(p.sourceCommit!==process.argv[1]) process.exit(1)" "$(git rev-parse HEAD)"
          git checkout -- public/instacomp-release.json

      - name: Commit permanent hook and remove one-time workflow
        run: |
          git rm -f .github/workflows/apply-instacomp-release-prebuild-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Inject exact InstaComp release commit before every build"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
