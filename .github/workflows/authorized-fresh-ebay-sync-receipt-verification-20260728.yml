name: Authorized Fresh eBay Receipt Verification 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-fresh-ebay-sync-receipt-verification-20260728.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-fresh-ebay-receipt-verification-20260728
  cancel-in-progress: true

jobs:
  verify-receipt-and-storefront:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/verify-full-ebay-catalog-sync-20260728')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
      CRON_NOT_BEFORE_UTC: 2026-07-28T15:01:30Z
      CRON_COMPLETION_TARGET_UTC: 2026-07-28T15:10:00Z
    steps:
      - name: Check out verification runner
        uses: actions/checkout@v4
        with:
          ref: ops/verify-full-ebay-catalog-sync-20260728
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel verification/logs verification/storefront
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > verification/logs/vercel-link.log 2>&1
          fi

      - name: Wait for protected cron completion
        shell: bash
        run: |
          set -euo pipefail
          target="$(date -u -d "$CRON_COMPLETION_TARGET_UTC" +%s)"
          now="$(date -u +%s)"
          if [ "$target" -gt "$now" ]; then
            sleep "$((target - now))"
          fi

      - name: Capture and validate sanitized convergence receipt
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 12); do
            raw="verification/logs/runtime-${attempt}.jsonl"
            npx vercel@56.2.0 logs \
              --project truely-collectables \
              --environment production \
              --since "$CRON_NOT_BEFORE_UTC" \
              --no-branch \
              --json \
              --expand \
              --limit 1000 \
              --query "ebay_store_fixed_price_sync_completed" \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" \
              > "$raw" 2> "verification/logs/runtime-${attempt}.stderr" || true
            ATTEMPT="$attempt" RAW_FILE="$raw" node <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readFileSync(process.env.RAW_FILE, 'utf8').split(/\r?\n/).filter(Boolean);
          const receipts = [];
          const inspect = (value) => {
            if (!value) return;
            if (typeof value === 'object') {
              if (value.event === 'ebay_store_fixed_price_sync_completed') receipts.push(value);
              for (const nested of Object.values(value)) inspect(nested);
              return;
            }
            if (typeof value !== 'string') return;
            const prefix = '[ebay-store-fixed-price-sync] ';
            for (const marker of [prefix, '{"schema":"truelycollectables.ebayStoreFixedPriceSyncReceipt.v2"']) {
              const index = value.indexOf(marker);
              if (index < 0) continue;
              const candidate = value.slice(index + (marker === prefix ? prefix.length : 0));
              try {
                const parsed = JSON.parse(candidate);
                if (parsed?.event === 'ebay_store_fixed_price_sync_completed') receipts.push(parsed);
              } catch {}
            }
          };
          for (const line of rows) {
            try { inspect(JSON.parse(line)); } catch {}
          }
          const latest = receipts.sort((a, b) => Date.parse(a.completedAt || 0) - Date.parse(b.completedAt || 0)).at(-1) || null;
          fs.writeFileSync(`verification/logs/receipt-${process.env.ATTEMPT}.json`, `${JSON.stringify({ rowsRead: rows.length, receipt: latest }, null, 2)}\n`);
          NODE
            if grep -Fq '"receipt": {' "verification/logs/receipt-${attempt}.json"; then
              cp "verification/logs/receipt-${attempt}.json" verification/fresh-sync-receipt.json
              found="$attempt"
              break
            fi
            sleep 30
          done
          test -n "$found"
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('verification/fresh-sync-receipt.json', 'utf8')).receipt;
          const fail = (message) => { throw new Error(message); };
          if (!receipt) fail('No production receipt found.');
          if (receipt.schema !== 'truelycollectables.ebayStoreFixedPriceSyncReceipt.v2') fail(`Unexpected schema ${receipt.schema}`);
          if (receipt.success !== true || (receipt.errors || []).length) fail(`Sync reported errors: ${JSON.stringify(receipt.errors || [])}`);
          const first = receipt.authoritative;
          const final = receipt.finalAuthoritative || (receipt.convergencePasses || []).at(-1);
          const images = (receipt.imagePasses || []).at(-1);
          const audit = receipt.databaseAudit || {};
          if (!first?.cycleComplete || Number(first.failed || 0) !== 0) fail('Initial authoritative cycle was incomplete or failed.');
          if (Number(first.eligibleCollectibles || 0) + Number(first.skippedNonCollectibles || 0) !== Number(first.remoteFixedPriceTotal || 0)) fail('Remote totals do not reconcile.');
          if (!images?.cycleComplete || Number(images.failed || 0) !== 0 || Number(images.remainingCandidates || 0) !== 0) fail('Image synchronization did not converge.');
          if (!receipt.quantities || Number(receipt.quantities.failed || 0) !== 0) fail('Quantity reconciliation failed.');
          if (!final?.cycleComplete || Number(final.failed || 0) !== 0) fail('Final authoritative cycle failed.');
          if (Number(final.inserted || 0) || Number(final.updated || 0) || Number(final.deactivated || 0)) fail(`Inventory did not converge: ${JSON.stringify(final)}`);
          if (Number(final.unchanged || 0) !== Number(final.eligibleCollectibles || 0)) fail('Final unchanged total differs from eligible inventory.');
          if (audit.matchesEligibleEbayInventory !== true || Number(audit.activeLinkedProducts || 0) !== Number(final.eligibleCollectibles || 0)) fail('Database audit does not match eligible eBay inventory.');
          fs.writeFileSync('verification/validated-summary.json', `${JSON.stringify({
            success: true,
            completedAt: receipt.completedAt,
            remoteFixedPriceTotal: final.remoteFixedPriceTotal,
            eligibleCollectibles: final.eligibleCollectibles,
            skippedNonCollectibles: final.skippedNonCollectibles,
            activeLinkedProducts: audit.activeLinkedProducts,
            initialChanges: { inserted: first.inserted, updated: first.updated, deactivated: first.deactivated },
            imagePasses: (receipt.imagePasses || []).length,
            convergencePasses: (receipt.convergencePasses || []).length,
          }, null, 2)}\n`);
          console.log(fs.readFileSync('verification/validated-summary.json', 'utf8'));
          NODE

      - name: Verify live catalog and exclusions
        shell: bash
        run: |
          set -euo pipefail
          fetch_page() {
            key="$1"; path="$2"; body="verification/storefront/${key}.html"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --header 'Cache-Control: no-cache' --output "$body" --write-out '%{http_code}' "${PRODUCTION_ORIGIN}${path}" || true)"
            test "$code" = '200'
          }
          fetch_page all '/shop'
          fetch_page pucks '/shop?section=Pucks'
          fetch_page autographs '/shop?feature=autograph'
          fetch_page shoes '/shop?q=shoes'
          fetch_page pants '/shop?q=pants'
          fetch_page parts '/shop?q=fuel%20sensor'
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('verification/validated-summary.json', 'utf8'));
          const text = (key) => fs.readFileSync(`verification/storefront/${key}.html`, 'utf8').replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          const count = (key) => {
            const match = text(key).match(/([\d,]+) active cards & collectibles/i);
            return match ? Number(match[1].replaceAll(',', '')) : null;
          };
          const results = { all: count('all'), pucks: count('pucks'), autographs: count('autographs'), shoes: count('shoes'), pants: count('pants'), parts: count('parts') };
          if (results.all !== Number(summary.eligibleCollectibles)) throw new Error(`Storefront total ${results.all} != eligible ${summary.eligibleCollectibles}`);
          if (!Number.isInteger(results.pucks) || results.pucks < 1) throw new Error('No pucks are live.');
          if (!Number.isInteger(results.autographs) || results.autographs < 1) throw new Error('No autographs are live.');
          for (const key of ['shoes', 'pants', 'parts']) if (results[key] !== 0) throw new Error(`${key} exclusion returned ${results[key]} items.`);
          fs.writeFileSync('verification/storefront-summary.json', `${JSON.stringify({ success: true, results }, null, 2)}\n`);
          console.log(JSON.stringify(results));
          NODE

      - name: Upload fresh sync verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-ebay-sync-receipt-verification-${{ github.run_number }}
          path: verification
          if-no-files-found: warn
          retention-days: 30
