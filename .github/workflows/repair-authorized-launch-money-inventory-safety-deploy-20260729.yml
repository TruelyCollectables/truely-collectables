name: Repair Authorized Launch Money and Inventory Safety Deploy 20260729
# Operations-only writer. Never merge this repair PR.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-authorized-launch-money-inventory-safety-deploy-20260729.yml"

permissions:
  contents: write

concurrency:
  group: repair-authorized-launch-money-inventory-safety-deploy-20260729
  cancel-in-progress: false

jobs:
  repair-deployment-workflow:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/repair-launch-money-inventory-cutover-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: 9b35f1990998bb0bd47394f19905fd9292c4c5bc
      TARGET_BRANCH: deploy/launch-money-inventory-safety-20260729
      TARGET_WORKFLOW: .github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml
      WRITER_WORKFLOW: .github/workflows/repair-authorized-launch-money-inventory-safety-deploy-20260729.yml
    steps:
      - name: Check out guarded deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/launch-money-inventory-safety-20260729
          fetch-depth: 0

      - name: Confirm exact current main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Repair exact-source validation ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml")
          old_sha = "392c967180d5ada94b88412292f951dd35ef41cf"
          new_sha = "9b35f1990998bb0bd47394f19905fd9292c4c5bc"
          text = path.read_text(encoding="utf-8")

          if text.count(old_sha) != 2:
              raise SystemExit("Expected exactly two stale source SHA references.")
          text = text.replace(old_sha, new_sha)

          revalidate_marker = "      - name: Revalidate both launch-blocking safety repairs\n"
          link_marker = "      - name: Link exact Vercel project\n"
          confirm_marker = "      - name: Confirm staged Production and promotion commands exist\n"

          revalidate_start = text.find(revalidate_marker)
          link_start = text.find(link_marker)
          confirm_start = text.find(confirm_marker)
          if min(revalidate_start, link_start, confirm_start) < 0:
              raise SystemExit("Expected deployment workflow markers were not found.")
          if not (revalidate_start < link_start < confirm_start):
              raise SystemExit("Deployment workflow ordering changed unexpectedly.")

          old_revalidation = text[revalidate_start:link_start]
          if "npm run build" not in old_revalidation:
              raise SystemExit("Expected unguarded Production build command was not found.")
          link_block = text[link_start:confirm_start]

          new_revalidation = """      - name: Revalidate current launch-blocking safety repairs
        shell: bash
        run: |
          set -euo pipefail
          npm run simulate:post-sale-ebay-sync
          npm run simulate:accepted-offer-reservations
          node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts
          node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts
          node --import tsx scripts/run-buyer-protection-simulations.ts
          node scripts/run-launch-database-migration-coverage.mjs
          node scripts/run-privileged-api-route-audit.mjs
          npm run simulate:privileged-route-auth
          node scripts/run-ebay-browse-runtime-contracts.mjs
          npm run lint
          npx tsc --noEmit --pretty false
          npx vercel@56.2.0 env run -e production -- npm run build

"""

          text = text[:revalidate_start] + link_block + new_revalidation + text[confirm_start:]

          required = [
              f"SOURCE_SHA: {new_sha}",
              f"ref: {new_sha}",
              "npm run simulate:post-sale-ebay-sync",
              "npm run simulate:accepted-offer-reservations",
              "npm run simulate:privileged-route-auth",
              "node scripts/run-ebay-browse-runtime-contracts.mjs",
              "npm run lint",
              "npx tsc --noEmit --pretty false",
              "npx vercel@56.2.0 env run -e production -- npm run build",
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f"Missing repaired workflow requirement: {value}")
          if old_sha in text:
              raise SystemExit("Stale source SHA remains after repair.")
          if text.find(link_marker) > text.find("      - name: Revalidate current launch-blocking safety repairs\n"):
              raise SystemExit("Vercel project linking must precede the environment-backed build.")

          path.write_text(text, encoding="utf-8")
          PY
          rm -- "$WRITER_WORKFLOW"

      - name: Validate narrow guarded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml"
          test "${changed[1]}" = ".github/workflows/repair-authorized-launch-money-inventory-safety-deploy-20260729.yml"
          grep -Fq "SOURCE_SHA: $EXPECTED_SOURCE_SHA" "$TARGET_WORKFLOW"
          grep -Fq "ref: $EXPECTED_SOURCE_SHA" "$TARGET_WORKFLOW"
          grep -Fq "npx vercel@56.2.0 env run -e production -- npm run build" "$TARGET_WORKFLOW"

      - name: Commit repaired deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_WORKFLOW" "$WRITER_WORKFLOW"
          git commit -m "Repair guarded money and inventory cutover validation"
          git push origin "HEAD:$TARGET_BRANCH"
