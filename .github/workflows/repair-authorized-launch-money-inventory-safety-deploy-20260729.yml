name: Remove Orphaned Launch Cutover Deployment 20260729
# Operations-only cleanup. Never merge this PR.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-authorized-launch-money-inventory-safety-deploy-20260729.yml"

permissions:
  contents: read

concurrency:
  group: remove-orphaned-launch-cutover-deployment-20260729
  cancel-in-progress: false

jobs:
  remove-orphaned-cutover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/repair-launch-money-inventory-cutover-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: 8baee1bb26a17f974388b4d8e50b4321bbdfb685
      EXPECTED_TARGET_SHA: 062e14057aaf584add9cd21a0171bb95887d5ef9
      EPHEMERAL_URL: https://truely-collectables-mlp1vd0p3-truelycollectables-projects.vercel.app
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out operations branch
        uses: actions/checkout@v4
        with:
          ref: ops/repair-launch-money-inventory-cutover-20260729
          fetch-depth: 0

      - name: Confirm exact repository state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          git fetch origin main deploy/launch-money-inventory-safety-20260729
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/deploy/launch-money-inventory-safety-20260729)" = "$EXPECTED_TARGET_SHA"
          case "$EPHEMERAL_URL" in
            https://truely-collectables-mlp1vd0p3-truelycollectables-projects.vercel.app) ;;
            *) exit 1 ;;
          esac

      - name: Inspect exact orphaned deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cleanup-evidence
          npx vercel@56.2.0 inspect "$EPHEMERAL_URL" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            > cleanup-evidence/inspect-before.txt 2>&1
          grep -Fq 'truely-collectables-mlp1vd0p3-truelycollectables-projects.vercel.app' cleanup-evidence/inspect-before.txt

      - name: Remove exact orphaned deployment
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 remove "$EPHEMERAL_URL" \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            > cleanup-evidence/remove.txt 2>&1

      - name: Verify deployment is gone
        shell: bash
        run: |
          set -euo pipefail
          if npx vercel@56.2.0 inspect "$EPHEMERAL_URL" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            > cleanup-evidence/inspect-after.txt 2>&1; then
            echo 'The exact ephemeral deployment still resolves.' >&2
            exit 1
          fi
          grep -Eiq 'not found|could not find|does not exist|no deployment' cleanup-evidence/inspect-after.txt

      - name: Upload sanitized cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orphaned-launch-cutover-cleanup-${{ github.run_number }}
          path: cleanup-evidence
          if-no-files-found: error
          retention-days: 30
