name: Repair Authorized Launch Money and Inventory Safety Deploy 20260729
# Operations-only writer. Never merge this repair PR.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-authorized-launch-money-inventory-safety-deploy-20260729.yml"

permissions:
  contents: read

concurrency:
  group: repair-authorized-launch-money-inventory-safety-deploy-20260729
  cancel-in-progress: false

jobs:
  repair-deployment-workflow:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/repair-launch-money-inventory-cutover-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: 8baee1bb26a17f974388b4d8e50b4321bbdfb685
      TARGET_WORKFLOW: .github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml
    steps:
      - name: Check out guarded deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/launch-money-inventory-safety-20260729
          fetch-depth: 0

      - name: Confirm exact current main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Refresh exact source and remove invalid Vercel promote preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml')
          text = path.read_text(encoding='utf-8')
          old_sha = 'c5cf45854c329771a2a541d2f7f75a631c491e16'
          new_sha = '8baee1bb26a17f974388b4d8e50b4321bbdfb685'
          old_name = '      - name: Confirm staged Production and promotion commands exist\n'
          new_name = '      - name: Confirm staged Production and safe promotion fallback\n'
          old_line = '          npx vercel@56.2.0 promote --help > .deployment-evidence/vercel-promote-help.txt 2>&1\n'
          new_line = "          printf '%s\\n' 'alias-set-fallback' > .deployment-evidence/vercel-promotion-method.txt\n"

          if text.count(old_sha) != 2:
              raise SystemExit('Expected exactly two stale exact-source SHA references.')
          if text.count(old_name) != 1:
              raise SystemExit('Expected exactly one stale preflight step name.')
          if text.count(old_line) != 1:
              raise SystemExit('Expected exactly one invalid Vercel promote preflight command.')
          text = text.replace(old_sha, new_sha)
          text = text.replace(old_name, new_name).replace(old_line, new_line)

          required = [
              f'SOURCE_SHA: {new_sha}',
              f'ref: {new_sha}',
              "grep -Fq -- '--skip-domain'",
              'alias-set-fallback',
              'npx vercel@56.2.0 promote "$DEPLOYMENT_URL"',
              'npx vercel@56.2.0 alias set "$DEPLOYMENT_URL" truelycollectables.com',
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f'Missing guarded workflow requirement: {value}')
          if old_sha in text or old_line in text:
              raise SystemExit('Stale source or invalid promote preflight remains.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate narrow guarded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_WORKFLOW"
          grep -Fq "SOURCE_SHA: $EXPECTED_SOURCE_SHA" "$TARGET_WORKFLOW"
          grep -Fq "ref: $EXPECTED_SOURCE_SHA" "$TARGET_WORKFLOW"
          grep -Fq 'Confirm staged Production and safe promotion fallback' "$TARGET_WORKFLOW"
          grep -Fq 'alias-set-fallback' "$TARGET_WORKFLOW"
          ! grep -Fq 'promote --help' "$TARGET_WORKFLOW"

      - name: Prepare sanitized repaired workflow artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .repair-output
          cp "$TARGET_WORKFLOW" .repair-output/authorized-launch-money-inventory-safety-deploy-20260729.yml
          sha256sum .repair-output/authorized-launch-money-inventory-safety-deploy-20260729.yml > .repair-output/SHA256SUMS

      - name: Upload sanitized repaired workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: repaired-launch-money-inventory-cutover-${{ github.run_number }}
          path: .repair-output
          if-no-files-found: error
          retention-days: 7
