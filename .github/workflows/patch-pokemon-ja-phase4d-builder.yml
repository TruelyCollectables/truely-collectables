name: Patch Japanese Phase 4D Builder

on:
  pull_request:
    paths:
      - ".github/workflows/patch-pokemon-ja-phase4d-builder.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pokemon-ja-phase4d-safe-bundles
          fetch-depth: 0

      - name: Classify historical source rows before additions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-pokemon-japanese-historical-safe-bundles.ts')
          text = path.read_text()

          anchor = '''  if (sourceByLocalId.size !== source.sourceCards.length) {
    throw new Error(`${source.setId} repeats normalized TCGdex local IDs.`);
  }
  const evidenceBySourceLocalId = new Map<string, NormalizedResolution["evidence"][number]>();'''
          replacement = '''  if (sourceByLocalId.size !== source.sourceCards.length) {
    throw new Error(`${source.setId} repeats normalized TCGdex local IDs.`);
  }
  const resolvedEvidence = resolution.evidence.map((entry) => {
    if (resolution.schema !== HISTORICAL_SCHEMA || !clean(entry.numerator)) {
      return entry;
    }
    const sourceCard = sourceByLocalId.get(
      normalizedLocalId(entry.numerator),
    );
    if (!sourceCard) return entry;
    return {
      ...entry,
      origin: "source_number_crosswalk" as const,
      sourceLocalId: sourceCard.localId,
      sourcePath: sourceCard.sourcePath,
      localId: sourceCard.localId,
    };
  });
  const resolvedCounts = {
    sourceNumber: resolvedEvidence.filter(
      (entry) => entry.origin === "source_number_crosswalk",
    ).length,
    sourceEnergy: resolvedEvidence.filter(
      (entry) => entry.origin === "source_energy_alias",
    ).length,
    numberedAdded: resolvedEvidence.filter(
      (entry) => entry.origin === "official_numbered_addition",
    ).length,
    unnumberedAdded: resolvedEvidence.filter(
      (entry) => entry.origin === "official_unnumbered_energy_addition",
    ).length,
  };
  if (
    resolvedCounts.sourceNumber !==
      resolution.sourceNumberCrosswalkCount ||
    resolvedCounts.sourceEnergy !== resolution.sourceEnergyAliasCount ||
    resolvedCounts.numberedAdded !== resolution.numberedAddedCardCount ||
    resolvedCounts.unnumberedAdded !== resolution.unnumberedAddedCardCount
  ) {
    throw new Error(`${source.setId} resolved evidence origins do not match receipt counts.`);
  }
  const evidenceBySourceLocalId = new Map<string, NormalizedResolution["evidence"][number]>();'''
          if 'const resolvedEvidence = resolution.evidence.map' not in text:
              if anchor not in text:
                  raise SystemExit('Builder source-classification anchor not found')
              text = text.replace(anchor, replacement, 1)

          text = text.replace(
              '  for (const entry of resolution.evidence) {\n',
              '  for (const entry of resolvedEvidence) {\n',
              1,
          )
          text = text.replace(
              '    resolution.evidence.length !== resolution.officialCardCount\n',
              '    resolvedEvidence.length !== resolution.officialCardCount\n',
              1,
          )
          text = text.replace(
              '  for (const row of resolution.evidence.filter((entry) =>\n',
              '  for (const row of resolvedEvidence.filter((entry) =>\n',
              1,
          )
          path.write_text(text)
          PY

      - name: Commit builder patch
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/build-pokemon-japanese-historical-safe-bundles.ts
          then
            echo "Phase 4D builder already classifies source rows."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-pokemon-japanese-historical-safe-bundles.ts
          git commit -m "Classify historical source rows before additions"
          git push origin HEAD:agent/pokemon-ja-phase4d-safe-bundles
