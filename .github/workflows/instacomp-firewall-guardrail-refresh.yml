name: InstaComp Firewall Guardrail Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: github.head_ref == 'fix/instacomp-identity-firewall' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      IP_INTELLIGENCE_REQUIRED: "false"
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-identity-firewall
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update permanent production guardrails
        run: python3 scripts/apply-instacomp-firewall-guardrail-update.py

      - name: Run production guardrail audit
        run: node scripts/run-production-guardrails-evidence-first.mjs

      - name: Run consensus simulations
        run: npm run simulate:instacomp-consensus

      - name: Run identity firewall regressions
        run: npx tsx scripts/run-instacomp-identity-firewall-regressions.ts

      - name: Run serial color regressions
        run: npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts

      - name: Run evidence-first regressions
        run: npx tsx scripts/run-instacomp-evidence-first-regressions.ts

      - name: Run adversarial hardening simulations
        run: npx tsx scripts/run-instacomp-v2-hardening-simulations.ts

      - name: Lint affected files
        run: >-
          npx eslint
          scripts/check-production-guardrails.mjs
          scripts/run-instacomp-consensus-simulations.ts
          scripts/run-instacomp-evidence-first-regressions.ts
          scripts/run-instacomp-identity-firewall-regressions.ts
          src/lib/instacomp-consensus.ts
          src/lib/instacomp-learning-server.ts
          src/app/api/instacomp/scan/route.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated permanent guardrails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-production-guardrails.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Require fail-closed InstaComp identity firewall guardrails"
            git push origin HEAD:fix/instacomp-identity-firewall
          fi
