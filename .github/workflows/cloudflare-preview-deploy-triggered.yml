name: Cloudflare Preview Deploy Triggered

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-preview-deploy-trigger'

permissions:
  contents: read

concurrency:
  group: truely-cloudflare-preview-deploy
  cancel-in-progress: false

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
  PREVIEW_URL: https://truely-collectables-preview.truelycollectables.workers.dev

jobs:
  deploy-preview:
    name: Build current main and deploy no-cron Cloudflare preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require Truely deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VERCEL_TOKEN SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 2
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application and Cloudflare tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.2 wrangler@4.122.0 vercel@56.2.0 dotenv@latest

      - name: Link only the Truely Vercel project and pull build environment
        shell: bash
        run: |
          set -euo pipefail
          npx vercel link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color >/dev/null
          umask 077
          npx vercel env pull .env.production.local \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --yes \
            --no-color >/dev/null
          test -s .env.production.local

      - name: Recover only build-critical Supabase keys if Vercel redacts them
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const dotenv = require('dotenv');
          async function main() {
            const path = '.env.production.local';
            const parsed = dotenv.parse(fs.readFileSync(path));
            const needAnon = !String(parsed.NEXT_PUBLIC_SUPABASE_ANON_KEY || '').trim();
            const needService = !String(parsed.SUPABASE_SERVICE_ROLE_KEY || '').trim();
            if (!needAnon && !needService) return;
            const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/api-keys?reveal=true`, {
              headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, accept: 'application/json' },
            });
            if (!response.ok) throw new Error(`Supabase Management API HTTP ${response.status}`);
            const keys = await response.json();
            const anon = keys.find((key) => String(key?.name || '').toLowerCase() === 'anon' && key?.api_key)?.api_key
              || keys.filter((key) => String(key?.type || '').toLowerCase() === 'publishable' && key?.api_key)[0]?.api_key;
            const service = keys.find((key) => String(key?.name || '').toLowerCase() === 'service_role' && key?.api_key)?.api_key
              || keys.filter((key) => String(key?.type || '').toLowerCase() === 'secret' && key?.api_key)[0]?.api_key;
            if (needAnon && !anon) throw new Error('Could not recover Supabase anon key');
            if (needService && !service) throw new Error('Could not recover Supabase service key');
            if (needAnon) { parsed.NEXT_PUBLIC_SUPABASE_ANON_KEY = String(anon); console.log(`::add-mask::${anon}`); }
            if (needService) { parsed.SUPABASE_SERVICE_ROLE_KEY = String(service); console.log(`::add-mask::${service}`); }
            fs.writeFileSync(path, Object.entries(parsed).map(([k,v]) => `${k}=${JSON.stringify(String(v ?? ''))}`).join('\n') + '\n', { mode: 0o600 });
          }
          main().catch((error) => { console.error(error.message || String(error)); process.exit(5); });
          NODE

      - name: Build current main with production build environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const dotenv = require('dotenv');
          const parsed = dotenv.parse(fs.readFileSync('.env.production.local'));
          for (const key of ['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY','NEXT_PUBLIC_SITE_URL']) {
            if (!String(parsed[key] || '').trim()) throw new Error(`Missing build-critical value: ${key}`);
          }
          console.log('Build-critical production values verified; values are not printed.');
          const result = spawnSync('npx', ['opennextjs-cloudflare', 'build'], { stdio: 'inherit', env: { ...process.env, ...parsed } });
          process.exit(result.status ?? 1);
          NODE

      - name: Deploy code and assets while preserving recovered Cloudflare secrets
        run: npx wrangler deploy --config wrangler.preview.jsonc

      - name: Smoke current Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          probe() {
            local path="$1"
            local out
            out=$(curl -L --fail-with-body -sS --max-time 35 -o /dev/null -w '%{http_code} %{time_total}' "$PREVIEW_URL$path")
            echo "$path -> $out"
          }
          probe '/'
          probe '/shop'
          probe '/product/1991'
          probe '/admin/login'
          probe '/robots.txt'

          curl -L --fail-with-body -sS --max-time 25 "$PREVIEW_URL/api/ebay/listings" -o /tmp/ebay.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/ebay.json','utf8'));
          if (body.authenticated !== true) throw new Error('Cloudflare eBay client authentication failed');
          console.log(`eBay authentication -> PASS; environment=${body.environment || 'production'}; tokenReturned=true`);
          NODE

          curl -L -sS --max-time 30 "$PREVIEW_URL/api/instacomp/internal-readiness" -o /tmp/instacomp.json -w '%{http_code}' > /tmp/instacomp.status
          node - <<'NODE'
          const fs = require('node:fs');
          const status = Number(fs.readFileSync('/tmp/instacomp.status','utf8'));
          const body = JSON.parse(fs.readFileSync('/tmp/instacomp.json','utf8'));
          console.log(`InstaComp readiness -> HTTP ${status}; configured=${body.configured}; reachable=${body.reachable}; databaseReady=${body.internalMemoryReady}; checklistReady=${body.checklistReady}; reason=${body.reason || 'none'}`);
          if (!body.configured || !body.reachable) throw new Error('Cloudflare cannot reach the configured InstaComp engine');
          NODE

          curl -L --fail-with-body -sS --max-time 35 "$PREVIEW_URL/api/admin/live-payment-launch" -o /tmp/payments.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/payments.json','utf8'));
          if (body.success !== true || !body.report) throw new Error('Cloudflare live-payment readiness route failed');
          const checks = Array.isArray(body.report.checks) ? body.report.checks : [];
          const stripeRelated = checks.filter((check) => /stripe|payment/i.test(`${check.key || ''} ${check.label || ''}`));
          console.log(`Live-payment readiness -> PASS; checks=${checks.length}; stripe/payment checks=${stripeRelated.map((c) => `${c.key}:${c.status}`).join(',') || 'none'}`);
          NODE

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -f .env.production.local /tmp/ebay.json /tmp/instacomp.json /tmp/instacomp.status /tmp/payments.json
