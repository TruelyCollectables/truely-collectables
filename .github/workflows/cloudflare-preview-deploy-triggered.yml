name: Cloudflare Preview Deploy Triggered

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-preview-deploy-trigger'

permissions:
  contents: read

concurrency:
  group: truely-cloudflare-preview-deploy
  cancel-in-progress: false

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz

jobs:
  deploy-preview:
    name: Pull Vercel production env and deploy no-cron Cloudflare preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require Truely account deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VERCEL_TOKEN SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 2
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install migration tooling without changing lockfile
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest vercel@56.2.0 dotenv@latest

      - name: Link only the Truely Vercel project
        shell: bash
        run: |
          set -euo pipefail
          npx vercel link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color

      - name: Pull Vercel Production environment without printing values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx vercel env pull .env.production.local \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --yes \
            --no-color
          test -s .env.production.local
          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            NEXT_PUBLIC_SITE_URL
            ADMIN_PASSWORD
            ADMIN_SESSION_SECRET
            STRIPE_LIVE_SECRET_KEY
            NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY
            STRIPE_LIVE_WEBHOOK_SECRET
            TCOS_LIVE_PAYMENTS_ENABLED
            EBAY_CLIENT_ID
            EBAY_CLIENT_SECRET
            EBAY_ENVIRONMENT
            RESEND_API_KEY
            CRON_SECRET
          )
          missing=()
          for key in "${required[@]}"; do
            if ! grep -qE "^${key}=" .env.production.local; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Vercel Production is missing required migration variable name(s): %s\n' "${missing[*]}"
            exit 3
          fi
          count=$(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' .env.production.local || true)
          printf 'Pulled %s Vercel Production variable(s); values remain masked and are not printed.\n' "$count"

      - name: Recover empty Supabase production keys without printing values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const dotenv = require('dotenv');

          async function main() {
            const path = '.env.production.local';
            const parsed = dotenv.parse(fs.readFileSync(path));
            const needAnon = !String(parsed.NEXT_PUBLIC_SUPABASE_ANON_KEY || '').trim();
            const needService = !String(parsed.SUPABASE_SERVICE_ROLE_KEY || '').trim();

            if (!needAnon && !needService) {
              console.log('Vercel Production already contains non-empty Supabase keys.');
              return;
            }

            const token = String(process.env.SUPABASE_ACCESS_TOKEN || '').trim();
            const projectRef = String(process.env.SUPABASE_PROJECT_REF || '').trim();
            if (!token || !projectRef) throw new Error('Supabase management credential is unavailable.');

            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, {
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json',
              },
            });
            if (!response.ok) throw new Error(`Supabase Management API returned HTTP ${response.status}.`);

            const keys = await response.json();
            if (!Array.isArray(keys)) throw new Error('Supabase Management API returned an invalid key list.');

            const namedAnon = keys.find((key) => String(key?.name || '').toLowerCase() === 'anon' && key?.api_key);
            const publishable = keys.filter((key) => String(key?.type || '').toLowerCase() === 'publishable' && key?.api_key);
            const namedService = keys.find((key) => String(key?.name || '').toLowerCase() === 'service_role' && key?.api_key);
            const secretKeys = keys.filter((key) => String(key?.type || '').toLowerCase() === 'secret' && key?.api_key);

            const anon = namedAnon?.api_key || (publishable.length === 1 ? publishable[0].api_key : null);
            const service = namedService?.api_key || (secretKeys.length === 1 ? secretKeys[0].api_key : null);

            if (needAnon && !anon) throw new Error('Could not resolve the Production Supabase anon/publishable key.');
            if (needService && !service) throw new Error('Could not resolve the Production Supabase service-role/secret key.');

            let recovered = 0;
            if (needAnon) {
              parsed.NEXT_PUBLIC_SUPABASE_ANON_KEY = String(anon);
              console.log(`::add-mask::${anon}`);
              recovered += 1;
            }
            if (needService) {
              parsed.SUPABASE_SERVICE_ROLE_KEY = String(service);
              console.log(`::add-mask::${service}`);
              recovered += 1;
            }

            const serialized = Object.entries(parsed)
              .map(([key, value]) => `${key}=${JSON.stringify(String(value ?? ''))}`)
              .join('\n') + '\n';
            fs.writeFileSync(path, serialized, { mode: 0o600 });
            console.log(`Recovered ${recovered} empty Supabase production key(s) directly from the linked Production project; values remain masked.`);
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(5);
          });
          NODE

      - name: Build OpenNext with Truely Production environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const dotenv = require('dotenv');
          const parsed = dotenv.parse(fs.readFileSync('.env.production.local'));
          const required = [
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_ANON_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
          ];
          const empty = required.filter((key) => !String(parsed[key] || '').trim());
          if (empty.length) {
            console.error(`Production environment still has empty required value(s): ${empty.join(' ')}`);
            process.exit(4);
          }
          console.log('Verified non-empty Supabase production values; secret values remain masked and are not printed.');
          const result = spawnSync(
            'npx',
            ['opennextjs-cloudflare', 'build'],
            {
              stdio: 'inherit',
              env: { ...process.env, ...parsed },
            },
          );
          process.exit(result.status ?? 1);
          NODE

      - name: Deploy isolated no-cron Cloudflare preview with migrated secrets
        run: npx wrangler deploy --config wrangler.preview.jsonc --secrets-file .env.production.local

      - name: Remove temporary environment file
        if: always()
        shell: bash
        run: rm -f .env.production.local
