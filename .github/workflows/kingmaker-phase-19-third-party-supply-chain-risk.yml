name: KINGMAKER Phase 19 Third Party Supply Chain Risk

on:
  pull_request:
    paths:
      - 'src/lib/kingmaker-phase-19-third-party-supply-chain-risk.ts'
      - 'scripts/run-kingmaker-phase-19-third-party-supply-chain-risk-regressions.ts'
      - 'supabase/migrations/20260803223000_kingmaker_phase_19_third_party_supply_chain_risk.sql'
      - '.github/workflows/kingmaker-phase-19-third-party-supply-chain-risk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Phase 19 regressions
        run: node --import tsx scripts/run-kingmaker-phase-19-third-party-supply-chain-risk-regressions.ts
      - name: Migration security
        run: |
          set -euo pipefail
          file='supabase/migrations/20260803223000_kingmaker_phase_19_third_party_supply_chain_risk.sql'
          grep -Eiq 'enable row level security' "$file"
          grep -Eiq 'revoke all .* from anon, authenticated' "$file"
          grep -Eiq 'grant all .* to service_role' "$file"
          ! grep -Eiq 'grant .* to (anon|authenticated)' "$file"
      - name: Dependency security
        run: node scripts/run-dependency-security-audit.mjs
      - name: Lint
        run: npx eslint src/lib/kingmaker-phase-19-third-party-supply-chain-risk.ts scripts/run-kingmaker-phase-19-third-party-supply-chain-risk-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff integrity
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Production build
        run: npm run build
