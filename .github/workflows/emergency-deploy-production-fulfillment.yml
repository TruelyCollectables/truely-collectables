name: Emergency Deploy Production Fulfillment

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/emergency-deploy-production-fulfillment.yml"

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  EXPECTED_MARKER: fulfillment-hotfix-2026-07-29-2018-mt

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout current Production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm fulfillment hotfix source is present
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'createSupabaseServerClient({ admin: true })' src/app/admin/orders/page.tsx
          grep -Fq "$EXPECTED_MARKER" src/app/api/build-info/route.ts
          grep -Fq 'fulfillment-service-role' src/app/api/fulfillment-health/route.ts

      - name: Require Vercel token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo 'VERCEL_TOKEN is unavailable to this workflow.'; exit 20; }

      - name: Confirm existing Vercel project
        shell: bash
        run: npm exec --yes --package=vercel@56.2.0 -- vercel project inspect "$VERCEL_PROJECT" --token="$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Link existing Vercel project
        shell: bash
        run: npm exec --yes --package=vercel@56.2.0 -- vercel link --yes --project "$VERCEL_PROJECT" --token="$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Deploy source with Vercel Production environment
        shell: bash
        run: npm exec --yes --package=vercel@56.2.0 -- vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Verify live fulfillment hotfix
        shell: bash
        run: |
          set -euo pipefail
          build_url='https://truelycollectables.com/api/build-info'
          health_url='https://truelycollectables.com/api/fulfillment-health'

          for attempt in $(seq 1 36); do
            build_body="$(curl --location --silent --show-error --max-time 20 "$build_url" || true)"
            health_body="$(curl --location --silent --show-error --max-time 20 "$health_url" || true)"

            if printf '%s' "$build_body" | grep -Fq "$EXPECTED_MARKER" && \
               printf '%s' "$health_body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' && \
               printf '%s' "$health_body" | grep -Fq 'fulfillment-service-role'; then
              echo "LIVE_PRODUCTION_BUILD_VERIFIED=$EXPECTED_MARKER"
              echo "LIVE_FULFILLMENT_SERVICE_ROLE_VERIFIED=true"
              exit 0
            fi

            echo "Attempt $attempt/36: waiting for the clean Production domain to serve the deployed hotfix."
            sleep 10
          done

          echo 'Production deployment completed, but live verification did not pass.'
          exit 1
