name: Launch 2 Issue 253 Final f7b164

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/launch2-issue253-final-f7b164.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch2-issue253-final-f7b164
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: f7b164543e1b6189fa6dbc5404f21fc29c01dfe8
  EXPECTED_BRANCH: ops/launch2-issue253-final-f7b164-20260730
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  PROJECT_REF: rfdzsoykhnngzdnvzlhz
  EVIDENCE_DIR: .audit/launch2-issue253-final-f7b164

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/launch2-issue253-final-f7b164-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out guarded operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Pin exact current main and operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/launch2-issue253-final-f7b164.yml"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          test -n "${VERCEL_TOKEN:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/launch2-f7b164"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"
          git worktree add --detach "$RUNNER_TEMP/exact-main-f7b164" "$EXPECTED_MAIN_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Revalidate exact source and launch gates
        working-directory: ${{ runner.temp }}/exact-main-f7b164
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
          ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
          ADMIN_PASSWORD: build-validation-admin-password
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_validation
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
          STRIPE_WEBHOOK_SECRET: whsec_build_validation
          EBAY_CLIENT_ID: build-validation-client-id
          EBAY_CLIENT_SECRET: build-validation-client-secret
          EBAY_ENVIRONMENT: production
          CRON_SECRET: build-validation-cron-secret-that-is-long-enough
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-platform-fee-service-role-delete-grant.mjs | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/platform-fee-grant-contract.log"
          node scripts/verify-issue253-marketplace-runtime-self-test-contract.mjs | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/marketplace-runtime-contract.log"
          node scripts/verify-runtime-admin-orders-self-test-contract.mjs | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/admin-runtime-contract.log"
          node scripts/run-sold-lifecycle-simulations.mjs | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/sold-lifecycle.log"
          node scripts/run-sold-trigger-order-simulation.mjs | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/sold-trigger-order.log"
          node scripts/run-privileged-api-route-audit.mjs | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/privileged-route-audit.log"
          npm run simulate:privileged-route-auth | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/privileged-route-auth.log"
          npm audit --json > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/npm-audit.json" || true
          EVIDENCE_PATH="$GITHUB_WORKSPACE/$EVIDENCE_DIR/npm-audit.json" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.EVIDENCE_PATH, 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          if ((counts.high || 0) !== 0 || (counts.critical || 0) !== 0) throw new Error(`Dependency blocker: ${JSON.stringify(counts)}`);
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/' + process.env.EVIDENCE_DIR + '/npm-audit-summary.json', JSON.stringify(counts, null, 2));
          NODE
          npm run lint
          npx tsc --noEmit --pretty false
          npm run build
          git diff --check

      - name: Apply service-role fee cleanup grant and verify issue 253 Production data
        working-directory: ${{ runner.temp }}/exact-main-f7b164
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`;
          const request = async (query, readOnly = false) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Supabase query HTTP ${response.status}: ${body.slice(0, 1200)}`);
            return body ? JSON.parse(body) : [];
          };
          const migration = fs.readFileSync(path.join('supabase','migrations','20260730050000_grant_platform_fee_delete_service_role.sql'), 'utf8');
          await request(migration, false);
          const rows = await request(`select json_build_object(
            'service_role_delete', has_table_privilege('service_role','public.platform_fee_ledger_entries','DELETE'),
            'anon_delete', has_table_privilege('anon','public.platform_fee_ledger_entries','DELETE'),
            'authenticated_delete', has_table_privilege('authenticated','public.platform_fee_ledger_entries','DELETE'),
            'required_relations', (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('collectible_assets','collectible_asset_events','collectible_grader_verifications','collectible_market_snapshots','collectible_sales','instacomp_internal_sold_comps','collx_only_inventory_boundary_violations','ebay_inbound_sale_guards')),
            'verified_or_manual_price_missing', (select count(*) from public.collectible_sales where evidence_status in ('verified','manual') and sold_price is null),
            'null_price_not_flagged_unresolved', (select count(*) from public.collectible_sales where sold_price is null and evidence_status <> 'unresolved'),
            'historical_sold_products_without_sale_record', (select count(*) from public.products p where p.sold_at < timestamptz '2026-07-28 00:00:00+00' and not exists (select 1 from public.collectible_sales s where s.store_id=p.store_id and s.legacy_product_id=p.id)),
            'collx_only_boundary_violations', (select count(*) from public.collx_only_inventory_boundary_violations),
            'duplicate_sale_event_groups', (select count(*) from (select store_id,event_key from public.collectible_sales group by store_id,event_key having count(*) > 1) d),
            'negative_product_quantities', (select count(*) from public.products where quantity < 0),
            'negative_inventory_quantities', (select count(*) from public.inventory_items where quantity < 0),
            'sold_stock_restoration_violations', (select count(*) from public.products where sold_at is not null and quantity > 0),
            'inactive_guard_trigger_count', (select count(*) from pg_trigger where tgname='capture_ebay_inactive_collectible_sale' and not tgisinternal),
            'inactive_guard_function_installed', (select case when to_regprocedure('public.capture_ebay_inactive_collectible_sale()') is null then false else position('ebay_inbound_sale_guards' in pg_get_functiondef(to_regprocedure('public.capture_ebay_inactive_collectible_sale()'))) > 0 end),
            'captured_at', now()
          ) as receipt;`, true);
          const receipt = rows?.[0]?.receipt || rows;
          if (receipt.service_role_delete !== true || receipt.anon_delete === true || receipt.authenticated_delete === true) throw new Error(`Fee privilege invariant failed: ${JSON.stringify(receipt)}`);
          for (const key of ['verified_or_manual_price_missing','null_price_not_flagged_unresolved','historical_sold_products_without_sale_record','collx_only_boundary_violations','duplicate_sale_event_groups','negative_product_quantities','negative_inventory_quantities','sold_stock_restoration_violations']) {
            if (Number(receipt[key]) !== 0) throw new Error(`${key}=${receipt[key]}`);
          }
          if (Number(receipt.required_relations) !== 8 || Number(receipt.inactive_guard_trigger_count) !== 1 || receipt.inactive_guard_function_installed !== true) throw new Error(`Issue 253 structure failed: ${JSON.stringify(receipt)}`);
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/' + process.env.EVIDENCE_DIR + '/hosted-data-receipt.json', JSON.stringify({ ok:true, exactMainSha:process.env.EXPECTED_MAIN_SHA, receipt, containsOnlyAggregateCounts:true, verifiedAt:new Date().toISOString() }, null, 2));
          NODE

      - name: Reconfirm exact main before deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Deploy exact main and verify Vercel metadata
        working-directory: ${{ runner.temp }}/exact-main-f7b164
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          deployment_url="$(npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz --meta "githubCommitSha=$EXPECTED_MAIN_SHA" --meta "launchGate=launch2-issue253-final-f7b164" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2> "$RUNNER_TEMP/launch2-f7b164/deploy-stderr.txt" | tail -n 1)"
          test -n "$deployment_url"
          deployment_host="${deployment_url#https://}"
          printf '%s\n' "$deployment_url" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/deployment-url.txt"
          printf 'DEPLOYMENT_URL=%s\nDEPLOYMENT_HOST=%s\n' "$deployment_url" "$deployment_host" >> "$GITHUB_ENV"
          npx vercel@56.2.0 inspect "$deployment_url" --wait --timeout=12m --no-color --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/deployment-inspect.txt"
          curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$deployment_host?slug=$VERCEL_SCOPE" > "$RUNNER_TEMP/launch2-f7b164/deployment.json"
          DEPLOYMENT_JSON="$(cat "$RUNNER_TEMP/launch2-f7b164/deployment.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(process.env.DEPLOYMENT_JSON || '{}');
          const aliases = Array.isArray(value.alias) ? value.alias : Array.isArray(value.aliases) ? value.aliases : [];
          const metaSha = String(value?.meta?.githubCommitSha || '').trim();
          if (String(value.target || '').toLowerCase() !== 'production' || String(value.readyState || '').toUpperCase() !== 'READY') throw new Error('Deployment not READY Production.');
          if (metaSha !== process.env.EXPECTED_MAIN_SHA) throw new Error(`Deployment SHA mismatch: ${metaSha}`);
          if (!aliases.includes('truelycollectables.com')) throw new Error('Custom-domain alias missing.');
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/' + process.env.EVIDENCE_DIR + '/deployment-receipt.json', JSON.stringify({ ok:true, deploymentId:value.id, deploymentHost:value.url, exactMainSha:process.env.EXPECTED_MAIN_SHA, metadataSha:metaSha, customDomainAlias:'truelycollectables.com', verifiedAt:new Date().toISOString() }, null, 2));
          NODE
          rm -f "$RUNNER_TEMP/launch2-f7b164/deployment.json"

      - name: Verify live storefront, admin runtime, and unsigned boundaries
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 72); do
            home_code="$(curl -L -sS --max-time 30 -o "$RUNNER_TEMP/home.html" -w '%{http_code}' https://truelycollectables.com/ || true)"
            shop_code="$(curl -L -sS --max-time 30 -o "$RUNNER_TEMP/shop.html" -w '%{http_code}' https://truelycollectables.com/shop || true)"
            runtime_code="$(curl -sS --max-time 180 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -o "$RUNNER_TEMP/admin-runtime.json" -w '%{http_code}' https://truelycollectables.com/api/release/admin-orders-self-test || true)"
            unsigned_admin="$(curl -L -sS --max-time 30 -o /dev/null -w '%{http_code}' https://truelycollectables.com/api/admin-orders-health || true)"
            unsigned_marketplace="$(curl -sS --max-time 30 -X POST -o /dev/null -w '%{http_code}' 'https://truelycollectables.com/api/release/issue253-marketplace-self-test?step=ebay-order-sales' || true)"
            unsigned_webhook="$(curl -sS --max-time 30 -X POST -H 'content-type: application/json' --data '{}' -o /dev/null -w '%{http_code}' https://truelycollectables.com/api/webhook || true)"
            if [ "$home_code" = 200 ] && [ "$shop_code" = 200 ] && [ "$runtime_code" = 200 ] && [ "$unsigned_admin" = 401 ] && [ "$unsigned_marketplace" = 401 ] && [ "$unsigned_webhook" != 200 ] && jq -e '.success == true and .adminNavigation == "passed" and .sessionRefresh == "passed" and .refundConfirmationGuard == "passed" and .refundIssued == false and (.directStoreTcosFeesRemaining | tonumber) == 0' "$RUNNER_TEMP/admin-runtime.json" >/dev/null; then
              success=true
              break
            fi
            sleep 10
          done
          if [ "$success" != true ]; then
            printf 'home=%s shop=%s runtime=%s unsigned_admin=%s unsigned_marketplace=%s unsigned_webhook=%s\n' "$home_code" "$shop_code" "$runtime_code" "$unsigned_admin" "$unsigned_marketplace" "$unsigned_webhook" >&2
            cat "$RUNNER_TEMP/admin-runtime.json" >&2 || true
            exit 1
          fi
          jq '{ok:true,success,release,orderId,adminNavigation,sessionRefresh,refundConfirmationGuard,refundIssued,directStoreTcosFeesRemaining,removedDirectStoreFeeRows}' "$RUNNER_TEMP/admin-runtime.json" > "$EVIDENCE_DIR/admin-runtime-receipt.json"
          printf '{"home":%s,"shop":%s,"adminRuntime":%s,"unsignedAdmin":%s,"unsignedMarketplace":%s,"unsignedWebhook":%s,"verifiedAt":"%s"}\n' "$home_code" "$shop_code" "$runtime_code" "$unsigned_admin" "$unsigned_marketplace" "$unsigned_webhook" "$(date -u +%FT%TZ)" > "$EVIDENCE_DIR/live-boundary-receipt.json"
          rm -f "$RUNNER_TEMP/home.html" "$RUNNER_TEMP/shop.html" "$RUNNER_TEMP/admin-runtime.json"

      - name: Run protected issue 253 marketplace chain
        shell: bash
        run: |
          set -euo pipefail
          for step in ebay-order-sales ebay-full-sync seller-reconciliation sold-archive; do
            raw="$RUNNER_TEMP/marketplace-${step}.json"
            code="$(curl -sS --max-time 320 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -o "$raw" -w '%{http_code}' "https://truelycollectables.com/api/release/issue253-marketplace-self-test?step=$step" || true)"
            if [ "$code" != 200 ] || ! jq -e --arg step "$step" '.success == true and .schema == "truelycollectables.issue253MarketplaceRuntimeSelfTest.v1" and .step == $step and .upstreamStatus == 200 and .cronSecretConfigured == true' "$raw" >/dev/null; then
              echo "$step failed HTTP $code" >&2
              cat "$raw" >&2
              exit 1
            fi
            jq --arg sha "$EXPECTED_MAIN_SHA" '{ok:true,exactMainSha:$sha,step,sourcePath,upstreamStatus,durationMs,result,verifiedAt:.completedAt}' "$raw" > "$EVIDENCE_DIR/marketplace-${step}-receipt.json"
            rm -f "$raw"
          done

      - name: Verify post-sync guards and sale evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`;
          const response = await fetch(endpoint, {
            method:'POST',
            headers:{ Authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'Content-Type':'application/json' },
            body:JSON.stringify({ read_only:true, parameters:[], query:`select json_build_object(
              'sale_records_total',(select count(*) from public.collectible_sales),
              'verified_sales',(select count(*) from public.collectible_sales where evidence_status='verified'),
              'unresolved_sales',(select count(*) from public.collectible_sales where evidence_status='unresolved'),
              'invalid_unresolved',(select count(*) from public.collectible_sales where sold_price is null and evidence_status <> 'unresolved'),
              'duplicate_event_groups',(select count(*) from (select store_id,event_key from public.collectible_sales group by store_id,event_key having count(*)>1)d),
              'active_guard_violations',(select count(*) from public.ebay_inbound_sale_guards g left join public.products p on p.id=g.legacy_product_id and p.seller_id=g.store_id left join public.inventory_items i on i.id=g.inventory_item_id where g.active and (coalesce(p.quantity,0)>g.protected_quantity or coalesce(i.quantity,0)>g.protected_quantity)),
              'collx_only_boundary_violations',(select count(*) from public.collx_only_inventory_boundary_violations),
              'sold_stock_restoration_violations',(select count(*) from public.products where sold_at is not null and quantity>0),
              'captured_at',now()) as receipt;` }),
          });
          const body=await response.text();
          if(!response.ok) throw new Error(`Post-sync HTTP ${response.status}: ${body.slice(0,1000)}`);
          const rows=body?JSON.parse(body):[];
          const receipt=rows?.[0]?.receipt||rows;
          for(const key of ['invalid_unresolved','duplicate_event_groups','active_guard_violations','collx_only_boundary_violations','sold_stock_restoration_violations']) if(Number(receipt[key])!==0) throw new Error(`${key}=${receipt[key]}`);
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+process.env.EVIDENCE_DIR+'/post-sync-receipt.json',JSON.stringify({ok:true,exactMainSha:process.env.EXPECTED_MAIN_SHA,receipt,verifiedAt:new Date().toISOString()},null,2));
          NODE

      - name: Upload sanitized exact Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-issue253-final-f7b164-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
