name: InstaComp Mac Push Image Recovery

on:
  pull_request:
    paths:
      - "services/instacomp-ai/scripts/repair-pending-images-from-mac.py"
      - "services/instacomp-ai/tests/test_mac_pending_image_push.py"
      - ".github/workflows/instacomp-mac-push-image-recovery.yml"
  push:
    paths:
      - "services/instacomp-ai/scripts/repair-pending-images-from-mac.py"
      - "services/instacomp-ai/tests/test_mac_pending_image_push.py"
      - ".github/workflows/instacomp-mac-push-image-recovery.yml"

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile recovery script
        run: python -m py_compile services/instacomp-ai/scripts/repair-pending-images-from-mac.py
      - name: Install pytest
        run: python -m pip install pytest==8.4.1
      - name: Run Mac push recovery tests
        run: python -m pytest services/instacomp-ai/tests/test_mac_pending_image_push.py -q
