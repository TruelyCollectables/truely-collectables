name: Cancel obsolete checklist run 20260815

on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/cancel-obsolete-gogts-run-20260815.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel and verify obsolete pre-fix conveyor run is dead
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="31909622572"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | jq -r '.status')"
            echo "attempt=$attempt status=$status"
            if [ "$status" = "completed" ]; then exit 0; fi
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/cancel-response.txt" --write-out '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/cancel")"
            echo "cancel_http=$code"
            case "$code" in 202|409) ;; *) cat "$RUNNER_TEMP/cancel-response.txt" >&2; exit 1 ;; esac
            sleep 10
          done
          final="$(curl --silent --show-error --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" | jq -r '.status + ":" + (.conclusion // "")')"
          echo "final=$final"
          test "${final%%:*}" = "completed"
