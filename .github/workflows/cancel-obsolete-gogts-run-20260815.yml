name: Cancel obsolete serial GoGTS feed 20260815

on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/cancel-obsolete-gogts-run-20260815.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete serial GoGTS run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cancel-response.txt" --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31905794391/cancel")"
          echo "cancel_http=$code"
          case "$code" in
            202|409) exit 0 ;;
            *) cat "$RUNNER_TEMP/cancel-response.txt" >&2; exit 1 ;;
          esac
