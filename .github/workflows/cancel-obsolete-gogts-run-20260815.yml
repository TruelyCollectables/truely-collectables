name: Cancel obsolete checklist run 20260815

on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/cancel-obsolete-gogts-run-20260815.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Force-cancel obsolete pre-fix conveyor run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="31909622572"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          status="$(curl --silent --show-error --fail \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" | jq -r '.status')"
          echo "before=$status"
          if [ "$status" != "completed" ]; then
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/force-response.txt" --write-out '%{http_code}' \
              -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/force-cancel")"
            echo "force_cancel_http=$code"
            case "$code" in 202|409) ;; *) cat "$RUNNER_TEMP/force-response.txt" >&2; exit 1 ;; esac
          fi
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            final="$(curl --silent --show-error --fail \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | jq -r '.status + ":" + (.conclusion // "")')"
            echo "poll=$attempt final=$final"
            [ "${final%%:*}" = "completed" ] && exit 0
          done
          exit 1
