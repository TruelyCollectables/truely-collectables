name: Deploy InstaComp 2.0 Hardening 20260801

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-instacomp-2-hardening-20260801.yml"
      - "scripts/ops/deploy-instacomp-2-hardening.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-instacomp-2-hardening-20260801
  cancel-in-progress: false

env:
  BASE_MAIN_SHA: 79dbec772ca6e9ef92fb3de757137ce9584a1536
  EXPECTED_MAIN_SHA: 79dbec772ca6e9ef92fb3de757137ce9584a1536
  EXPECTED_BRANCH: ops/deploy-instacomp-2-hardening-20260801
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  CRON_SECRET: build-validation-cron-secret-that-is-long-enough
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"
  PRODUCTION_ORIGIN: https://truelycollectables.com

jobs:
  migrate-deploy-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope and exact merged main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          current_main_sha="$(git rev-parse origin/main)"
          test "$current_main_sha" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$BASE_MAIN_SHA" HEAD

          mapfile -t changed < <(git diff --name-only "$BASE_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/deploy-instacomp-2-hardening-20260801.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/ops/deploy-instacomp-2-hardening.mjs'
          git diff --check "$BASE_MAIN_SHA"...HEAD

          cp scripts/ops/deploy-instacomp-2-hardening.mjs "$RUNNER_TEMP/deploy-instacomp-2-hardening.mjs"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reprove exact merged application before touching Production
        shell: bash
        run: |
          set -euo pipefail
          node --check "$RUNNER_TEMP/deploy-instacomp-2-hardening.mjs"
          npm ci
          node --import tsx scripts/run-instacomp-scan-review-simulations.ts
          node --import tsx scripts/run-instacomp-v2-hardening-simulations.ts
          node --import tsx scripts/run-checklist-complexity-simulations.ts
          npx eslint \
            src/lib/instacomp-market-evidence.ts \
            src/lib/instacomp-v2.ts \
            src/lib/instacomp-scan-review.ts \
            src/lib/instacomp-listing-gate.ts \
            src/lib/instacomp-learning-server.ts \
            src/lib/checklist-registry/server.ts \
            src/lib/public-endpoint-rate-limit.ts \
            src/app/api/instacomp/scan/route.ts \
            src/app/api/instacomp/scan-fast/route.ts \
            src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx
          npx tsc --noEmit
          npm run build

      - name: Resolve Production Vercel and Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/instacomp-2-production" "$RUNNER_TEMP/instacomp-2-evidence"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/instacomp-2-production/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

      - name: Apply and behavior-certify all four Production hardening migrations
        id: migrate
        shell: bash
        env:
          PRODUCTION_ENV_PATH: ${{ runner.temp }}/instacomp-2-production/production.env
          EVIDENCE_DIR: ${{ runner.temp }}/instacomp-2-evidence
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/deploy-instacomp-2-hardening.mjs"

      - name: Provision temporary protected verifier secret
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/instacomp-2-live-verify-secret"
          openssl rand -hex 32 > "$secret_file"
          chmod 600 "$secret_file"
          echo "::add-mask::$(cat "$secret_file")"
          npx vercel@56.2.0 env add INSTACOMP_LIVE_VERIFY_SECRET production \
            --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            < "$secret_file" >/dev/null

      - name: Deploy exact merged main revision to Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -z "$(git status --porcelain)"
          output="$(npx vercel@56.2.0 deploy --prod --yes --no-color \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify protected InstaComp 2.0 runtime on Production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          secret="$(cat "$RUNNER_TEMP/instacomp-2-live-verify-secret")"
          code=""
          for attempt in $(seq 1 30); do
            code="$(curl -sS -L --max-time 120 \
              -o "$RUNNER_TEMP/instacomp-2-live.json" \
              -w '%{http_code}' \
              -H "x-instacomp-live-verify: $secret" \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -A 'InstaComp2HardeningRelease/1.0' \
              "$PRODUCTION_ORIGIN/api/internal/instacomp-mobile-live-verify?attempt=$attempt&sha=$EXPECTED_MAIN_SHA")"
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          echo "LIVE_VERIFY_HTTP_STATUS=$code"
          cat "$RUNNER_TEMP/instacomp-2-live.json" || true
          test "$code" = "200"
          node - "$RUNNER_TEMP/instacomp-2-live.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!payload.ok) throw new Error(payload.error || 'Runtime verification failed');
          const required = [
            'adminDashboard', 'instacompMobile', 'decisionWorkbench',
            'checklistRegistry', 'learningControls', 'cardStudio',
            'listWorkspace', 'listPasswordBoundary', 'noAutoPilot',
            'noBatchControls', 'portraitRevision', 'compSource',
          ];
          for (const key of required) {
            if (payload.checks?.[key] !== true) {
              throw new Error(`Missing live check: ${key}`);
            }
          }
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/instacomp-2-evidence/live-runtime.json',
            JSON.stringify(payload, null, 2) + '\n',
          );
          console.log('LIVE_INSTACOMP_2_HARDENING=passed');
          NODE

      - name: Remove and prove absence of temporary verifier secret
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/instacomp-2-live-verify-secret"
          remove_log="$RUNNER_TEMP/instacomp-2-live-secret-remove.log"

          if ! npx vercel@56.2.0 env rm INSTACOMP_LIVE_VERIFY_SECRET production \
            --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            >"$remove_log" 2>&1; then
            cat "$remove_log"
            if grep -Eqi 'not found|does not exist|no environment variable' "$remove_log"; then
              echo "Temporary verifier secret was already absent."
            else
              if ! printf 'y\n' | npx vercel@56.2.0 env rm \
                INSTACOMP_LIVE_VERIFY_SECRET production \
                --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
                >"$remove_log" 2>&1; then
                cat "$remove_log"
                exit 1
              fi
            fi
          fi

          env_list="$(npx vercel@56.2.0 env ls production \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1)"
          if printf '%s\n' "$env_list" | grep -Fq 'INSTACOMP_LIVE_VERIFY_SECRET'; then
            echo "Temporary verifier secret still exists in Production."
            exit 1
          fi
          rm -f "$secret_file" "$remove_log"
          echo "TEMP_VERIFY_SECRET_ABSENT=passed"

      - name: Redeploy clean exact main without temporary secret
        id: clean_deploy
        if: steps.migrate.outcome == 'success' && steps.verify.outcome == 'success' && steps.cleanup.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$EXPECTED_MAIN_SHA"
          git clean -fdx -e .vercel/
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          output="$(npx vercel@56.2.0 deploy --prod --yes --no-color \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

          code=""
          for attempt in $(seq 1 18); do
            code="$(curl -sS -L --max-time 60 -o "$RUNNER_TEMP/instacomp-2-post-clean.json" \
              -w '%{http_code}' -H 'Cache-Control: no-cache' \
              -A 'InstaComp2PostCleanVerifier/1.0' \
              "$PRODUCTION_ORIGIN/api/internal/instacomp-mobile-live-verify?clean=$attempt&sha=$EXPECTED_MAIN_SHA")"
            if [ "$code" = "401" ]; then break; fi
            sleep 10
          done
          test "$code" = "401"
          echo "POST_CLEAN_VERIFY_ENDPOINT_UNAUTHORIZED=passed"

      - name: Write final sanitized certification receipt
        if: steps.migrate.outcome == 'success' && steps.verify.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.clean_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > "$RUNNER_TEMP/instacomp-2-evidence/release-certification.md" <<EOF
          # InstaComp 2.0 Production hardening certification

          - Certified at: $timestamp
          - Exact merged source: \`$EXPECTED_MAIN_SHA\`
          - Production domain: https://truelycollectables.com
          - Initial tested deployment: ${{ steps.deploy.outputs.url }}
          - Clean deployment without temporary secret: ${{ steps.clean_deploy.outputs.url }}
          - Four Production migrations: PASS
          - Rollback-only Production database behavior certification: PASS
          - Protected runtime checks: 12/12 PASS
          - Temporary verifier secret absence: PASS
          - Post-clean verifier endpoint without secret: HTTP 401 PASS
          - Exact-main clean redeployment: PASS
          EOF
          echo "INSTACOMP_2_PRODUCTION_CERTIFIED=passed"

      - name: Remove pulled Production environment
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/instacomp-2-production/production.env"
          rm -f "$RUNNER_TEMP/instacomp-2-live-verify-secret"

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-2-hardening-production-20260801
          path: ${{ runner.temp }}/instacomp-2-evidence
          if-no-files-found: error
          retention-days: 90
