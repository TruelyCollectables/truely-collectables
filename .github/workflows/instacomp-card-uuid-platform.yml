name: InstaComp Permanent Card UUID Platform

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-card-uuid-platform.yml"
      - "scripts/patch-instacomp-card-uuid-platform.py"
      - "scripts/verify-instacomp-card-uuid-platform.mjs"
      - "services/instacomp-ai/app/models.py"
      - "services/instacomp-ai/app/storage.py"
      - "services/instacomp-ai/app/training.py"
      - "services/instacomp-ai/app/main.py"
      - "services/instacomp-ai/scripts/update-live-from-main.sh"
      - "services/instacomp-ai/tests/test_card_uuid_tracking.py"
      - "src/lib/instacomp-ai-local.ts"
      - "src/app/api/instacomp/live-scan/route.ts"
      - "supabase/migrations/20260809032000_instacomp_card_uuid_tracking.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-card-uuid-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: feature/instacomp-card-uuid-platform-20260808

jobs:
  apply-test-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Apply permanent physical card UUID patch
        run: |
          set -euo pipefail
          python3 scripts/patch-instacomp-card-uuid-platform.py
          git diff --check
          node scripts/verify-instacomp-card-uuid-platform.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Run complete InstaComp Mac-service suite
        run: |
          set -euo pipefail
          pip install -r services/instacomp-ai/requirements.txt
          python -m compileall services/instacomp-ai/app services/instacomp-ai/tests
          PYTHONPATH=services/instacomp-ai pytest -q services/instacomp-ai/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify website UUID bridge contract
        run: |
          set -euo pipefail
          npm ci >/dev/null
          node scripts/verify-instacomp-card-uuid-platform.mjs

      - name: Persist generated runtime patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/instacomp-ai/app/models.py \
            services/instacomp-ai/app/storage.py \
            services/instacomp-ai/app/training.py \
            services/instacomp-ai/app/main.py \
            services/instacomp-ai/scripts/update-live-from-main.sh \
            src/lib/instacomp-ai-local.ts \
            src/app/api/instacomp/live-scan/route.ts
          if ! git diff --cached --quiet; then
            git commit -m "Make InstaComp card UUID permanent across rescans [skip ci]"
            git push origin "HEAD:$EXPECTED_BRANCH"
          fi
