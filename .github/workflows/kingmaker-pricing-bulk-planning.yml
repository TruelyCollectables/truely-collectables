name: KINGMAKER Pricing Bulk Planning

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-pricing-bulk-planner.ts"
      - "src/app/api/instacomp/pricing/bulk-plan/route.ts"
      - "scripts/run-kingmaker-pricing-bulk-planning-regressions.ts"
      - ".github/workflows/kingmaker-pricing-bulk-planning.yml"

permissions:
  contents: read

jobs:
  verify-pricing-bulk-planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bulk planning regressions
        run: node --import tsx scripts/run-kingmaker-pricing-bulk-planning-regressions.ts
      - name: Advisory and privacy contracts
        run: |
          set -euo pipefail
          grep -q 'advisory_only' src/lib/kingmaker-pricing-bulk-planner.ts
          grep -q 'sourceDisclosure: null' src/app/api/instacomp/pricing/bulk-plan/route.ts
          grep -q 'assertTrustedInstaCompMutationRequest' src/app/api/instacomp/pricing/bulk-plan/route.ts
          ! grep -RIni 'beckett' src/lib/kingmaker-pricing-bulk-planner.ts src/app/api/instacomp/pricing/bulk-plan/route.ts scripts/run-kingmaker-pricing-bulk-planning-regressions.ts
          ! grep -RIn 'seller_account_id\|store_id' src/lib/kingmaker-pricing-bulk-planner.ts src/app/api/instacomp/pricing/bulk-plan/route.ts
          ! grep -RIn 'auto.buy\|auto.list\|automatic purchase\|automatic listing' src/lib/kingmaker-pricing-bulk-planner.ts src/app/api/instacomp/pricing/bulk-plan/route.ts
      - name: Lint
        run: npx eslint src/lib/kingmaker-pricing-bulk-planner.ts src/app/api/instacomp/pricing/bulk-plan/route.ts scripts/run-kingmaker-pricing-bulk-planning-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder-admin-session
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build-placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
