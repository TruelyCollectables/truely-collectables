name: Apply Shipping Contract Audit Patch

on:
  push:
    branches:
      - agent/emergency-post-launch-audit-fixes-20260726
    paths:
      - ".audit/shipping-contract.patch"

permissions:
  contents: write

jobs:
  apply-shipping-contract-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/emergency-post-launch-audit-fixes-20260726
          fetch-depth: 0

      - name: Apply verified shipping contract patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .audit/shipping-contract.patch
          git apply --check .audit/shipping-contract.patch
          git apply .audit/shipping-contract.patch
          rm .audit/shipping-contract.patch
          rmdir .audit 2>/dev/null || true
          rm .github/workflows/apply-shipping-contract-audit-patch.yml
          git config user.name "Truely Collectables Audit"
          git config user.email "sales@truelycollectables.com"
          git add -A
          git commit -m "Correct tracked-letter shipping contract tests"
          git push origin HEAD:agent/emergency-post-launch-audit-fixes-20260726
