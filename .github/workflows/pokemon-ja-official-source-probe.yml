name: Pokémon Japanese Official Source Probe

on:
  pull_request:
    paths:
      - "scripts/probe-pokemon-card-official-search.ts"
      - ".github/workflows/pokemon-ja-official-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-card-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe official Pokémon Card set search
        run: >-
          npx tsx scripts/probe-pokemon-card-official-search.ts
          'https://www.pokemon-card.com/card-search/index.php?mode=statuslist&pg=882'
