name: CollX Park Current Unpriced Triggered 20260812

on:
  push:
    branches: [main]
    paths:
      - '.github/collx-park-current-trigger-20260812'

permissions:
  contents: read

jobs:
  park-current-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rfdzsoykhnngzdnvzlhz
      STORE_ID: 00000000-0000-4000-8000-000000000001
    steps:
      - name: Park the 127 currently unpriced CollX cards and certify the rest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time
          token=os.environ['SUPABASE_ACCESS_TOKEN']; ref=os.environ['PROJECT_REF']; store=os.environ['STORE_ID']
          url=f'https://api.supabase.com/v1/projects/{ref}/database/query'
          def sql(q, ro, retries=7):
              last=''
              for i in range(retries):
                  f=tempfile.NamedTemporaryFile(delete=False); f.close()
                  p=subprocess.run(['curl','-sS','--max-time','90','-o',f.name,'-w','%{http_code}','-X','POST',url,'-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','--data-binary',json.dumps({'query':q,'parameters':[],'read_only':ro})],capture_output=True,text=True)
                  raw=open(f.name).read(); os.unlink(f.name); code=(p.stdout or '000')[-3:]
                  if code in ('200','201'): return json.loads(raw)
                  last=f'HTTP {code}: {raw[:1200]}'
                  if code in ('000','429','500','502','503','504','522','524','544') and i+1<retries: time.sleep(2*(i+1)); continue
                  break
              raise SystemExit(last)
          target=f"p.store_id='{store}'::uuid and p.sku>='COLLX-' and p.sku<'COLLY' and p.ebay_item_id is null and p.archived_at is null and p.quantity>0 and p.price<=0"
          q=f'''with target as (select p.id,p.sku,p.quantity from public.products p where {target}), guard as (
            select count(*)::int rows,coalesce(sum(quantity),0)::int units,count(*) filter (where exists(select 1 from public.inventory_items ii where ii.store_id='{store}'::uuid and (ii.legacy_product_id=target.id or (ii.legacy_product_id is null and ii.sku=target.sku))))::int bridged from target),
          upd as (update public.inventory_items ii set status='draft',updated_at=now() from target t,guard g where g.rows=127 and g.units=127 and g.bridged=127 and ii.store_id='{store}'::uuid and (ii.legacy_product_id=t.id or (ii.legacy_product_id is null and ii.sku=t.sku)) returning ii.id)
          select g.rows target_rows,g.units target_units,g.bridged bridged_rows,(select count(*) from upd)::int inventory_rows_updated from guard g;'''
          m=sql(q,False); print('COLLX_CURRENT_PENDING_MUTATION='+json.dumps(m,sort_keys=True)); r=(m or [{}])[0]
          if [int(r.get(k) or 0) for k in ('target_rows','target_units','bridged_rows')] != [127,127,127]: raise SystemExit('Safety guard failed; no approved mutation certified')
          vq=f'''with c as (select * from public.products p where p.store_id='{store}'::uuid and p.sku>='COLLX-' and p.sku<'COLLY' and p.ebay_item_id is null), e as (select id,sku,quantity from c where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is not null), d as (select id,sku,quantity from c where archived_at is null and quantity>0 and price<=0)
          select (select count(*) from c)::int total_rows,(select coalesce(sum(greatest(quantity,0)),0) from c)::int total_units,(select count(*) from c where archived_at is not null)::int archived_rows,(select coalesce(sum(greatest(quantity,0)),0) from c where archived_at is not null)::int archived_units,(select count(*) from e)::int eligible_rows,(select coalesce(sum(quantity),0) from e)::int eligible_units,(select count(*) from d)::int pending_rows,(select coalesce(sum(quantity),0) from d)::int pending_units,(select count(*) from d x where exists(select 1 from public.inventory_items ii where ii.store_id='{store}'::uuid and (ii.legacy_product_id=x.id or (ii.legacy_product_id is null and ii.sku=x.sku)) and ii.status='draft'))::int pending_draft_rows,(select count(*) from e x where exists(select 1 from public.inventory_items ii where ii.store_id='{store}'::uuid and (ii.legacy_product_id=x.id or (ii.legacy_product_id is null and ii.sku=x.sku)) and ii.status='active'))::int eligible_active_rows,(select count(*) from e x where not exists(select 1 from public.inventory_items ii where ii.store_id='{store}'::uuid and (ii.legacy_product_id=x.id or (ii.legacy_product_id is null and ii.sku=x.sku))))::int eligible_missing_bridge_rows,(select count(*) from e x where exists(select 1 from public.inventory_items ii where ii.store_id='{store}'::uuid and (ii.legacy_product_id=x.id or (ii.legacy_product_id is null and ii.sku=x.sku)) and ii.status<>'active'))::int eligible_has_nonactive_bridge_rows,(select count(*) from c where archived_at is null and quantity<=0)::int active_zero_qty_rows,(select count(*) from c where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is null)::int missing_front_rows;'''
          v=sql(vq,True); print('COLLX_CURRENT_PENDING_VERIFY='+json.dumps(v,sort_keys=True)); z=(v or [{}])[0]
          expected={'total_rows':6155,'total_units':6315,'archived_rows':740,'archived_units':0,'eligible_rows':5288,'eligible_units':6188,'pending_rows':127,'pending_units':127,'pending_draft_rows':127,'eligible_active_rows':5288,'eligible_missing_bridge_rows':0,'eligible_has_nonactive_bridge_rows':0,'active_zero_qty_rows':0,'missing_front_rows':0}
          bad=[f'{k}={z.get(k)} expected {want}' for k,want in expected.items() if int(z.get(k) or 0)!=want]
          if bad: raise SystemExit('Verification failed: '+'; '.join(bad))
          print('COLLX_CURRENT_PENDING_PARK=SUCCESS')
          PY
