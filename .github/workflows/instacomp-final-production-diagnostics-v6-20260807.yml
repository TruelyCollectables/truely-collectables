name: InstaComp Final Production Diagnostics V6 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-final-production-diagnostics-v6-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-final-production-diagnostics-v6-20260807
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: ops/instacomp-final-production-acceptance-v4-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  FINAL_REPAIR_COMMIT: b2668c5d67803e6c24362f5665ed5e240d45d585
  CERTIFIED_MAC_FINGERPRINT: ab42f3632012ddffd1e45a73e5adcef1504e15ffde50b8e7f747ba7c61b9f245
  EVIDENCE_DIR: evidence/instacomp-final-production-diagnostics-v6-20260807
  TEMP_DIR: /tmp/instacomp-final-production-diagnostics-v6-20260807

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Freeze exact certified source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git cat-file -e "${FINAL_REPAIR_COMMIT}^{commit}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$FINAL_REPAIR_COMMIT"
          git merge-base --is-ancestor "$FINAL_REPAIR_COMMIT" HEAD
          scanner_drift="$(git diff --name-only "$FINAL_REPAIR_COMMIT"...HEAD -- \
            services/instacomp-ai/app/local_vision.py \
            services/instacomp-ai/app/ollama.py \
            src/app/api/instacomp/scan/route.ts \
            src/lib/instacomp-ai-local.ts \
            src/lib/instacomp-consensus.ts \
            src/lib/instacomp-learning-server.ts)"
          test -z "$scanner_drift"
          fp="$(python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          root=Path('services/instacomp-ai')
          d=sha256()
          for rel in ('app/local_vision.py','app/ollama.py'):
              d.update(rel.encode()); d.update(b'\0'); d.update((root/rel).read_bytes()); d.update(b'\0')
          print(d.hexdigest())
          PY
          )"
          test "$fp" = "$CERTIFIED_MAC_FINGERPRINT"
          echo "EXPECTED_MAC_FINGERPRINT=$fp" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR"
          printf '{"certifiedSource":"%s","currentMainObserved":"%s","macFingerprint":"%s","mode":"diagnostics_only_no_scanner_source_change"}\n' \
            "$FINAL_REPAIR_COMMIT" "$(git rev-parse origin/main)" "$fp" > "$EVIDENCE_DIR/source-lock.json"

      - name: Exact Production Mac preflight
        shell: bash
        run: |
          set -euo pipefail
          out="$EVIDENCE_DIR/readiness-preflight.json"
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?v6=preflight&ts=$(date +%s)")"
          test "$code" = "200"
          node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const k of ["ok","configured","reachable","internalMemoryReady","checklistReady","localModelReady"])if(b[k]!==true)throw new Error(`${k}=${b[k]}`);if(b.runtimeSourceFingerprint!==process.argv[2])throw new Error(`fingerprint=${b.runtimeSourceFingerprint}`);' "$out" "$EXPECTED_MAC_FINGERPRINT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and link Production project
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Resolve Production proof database key
        shell: bash
        run: |
          set -euo pipefail
          env_file="$TEMP_DIR/production.env"
          runtime_file="$TEMP_DIR/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node -e 'const fs=require("node:fs");const parsed={};for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,"utf8").split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith("#"))continue;const i=line.indexOf("=");if(i<1)continue;const key=line.slice(0,i).trim();let value=line.slice(i+1).trim();if(value.startsWith("\"")&&value.endsWith("\"")){try{value=JSON.parse(value)}catch{value=value.slice(1,-1)}}else if(value.startsWith("\u0027")&&value.endsWith("\u0027"))value=value.slice(1,-1);parsed[key]=value}(async()=>{const productionUrl=String(parsed.NEXT_PUBLIC_SUPABASE_URL||"").trim();if(!productionUrl)throw new Error("Missing Production Supabase URL");const projectRef=new URL(productionUrl).hostname.split(".")[0];const r=await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});const text=await r.text();if(!r.ok)throw new Error(`Supabase key lookup HTTP ${r.status}`);const keys=text?JSON.parse(text):[];const val=e=>String(e?.api_key||e?.key||e?.value||"");const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));const legacy=keys.find(e=>e?.name==="service_role"&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==="service_role"&&/^eyJ/.test(val(e)));const serverKey=val(modern||legacy);if(!serverKey)throw new Error("No server key");console.log(`::add-mask::${productionUrl}`);console.log(`::add-mask::${serverKey}`);fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(productionUrl)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(serverKey)}\n`,{mode:0o600})})().catch(e=>{console.error(e);process.exit(1)});'

      - name: Provision isolated diagnostics credential
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          secret="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy exact source with isolated diagnostics credential
        shell: bash
        run: |
          set -euo pipefail
          log="$EVIDENCE_DIR/diagnostics-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          grep -Fq "InstaComp release manifest bound to $(git rev-parse HEAD)." "$log"
          touch "$TEMP_DIR/deployed"

      - name: Instrument local acceptance receipt only
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ops/run-instacomp-final-production-acceptance.mjs "$TEMP_DIR/original-runner.mjs"
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/ops/run-instacomp-final-production-acceptance.mjs')
          s=p.read_text()
          old='''    diagnostics: diagnostics(response.payload),\n    durationMs: Date.now() - started,'''
          new='''    diagnostics: diagnostics(response.payload),\n    deepDiagnostics: {\n      topLevelKeys: Object.keys(response.payload || {}).sort(),\n      ai: response.payload?.ai ?? null,\n      review: response.payload?.review ?? null,\n      consensus: response.payload?.consensus ?? null,\n      consensusEscalation: response.payload?.consensusEscalation ?? null,\n      identityDecision: response.payload?.identityDecision ?? null,\n      compSearchDecision: response.payload?.compSearchDecision ?? null,\n      catalogEvidence: response.payload?.catalogEvidence ?? null,\n      checklistResolution: response.payload?.checklistResolution ?? null,\n      checklistRegistry: response.payload?.checklistRegistry ?? null,\n      ocrDiagnostics: response.payload?.ocrDiagnostics ?? null,\n      imageOrientation: response.payload?.imageOrientation ?? null,\n    },\n    durationMs: Date.now() - started,'''
          if old not in s: raise SystemExit('diagnostic insertion point missing')
          p.write_text(s.replace(old,new,1))
          print('PASS instrumented local receipt only')
          PY

      - name: Frozen five deep diagnostic scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-deep.json" diagnostics-v6

      - name: Restore acceptance runner before cleanup deploy
        if: always()
        shell: bash
        run: |
          if [ -f "$TEMP_DIR/original-runner.mjs" ]; then cp "$TEMP_DIR/original-runner.mjs" scripts/ops/run-instacomp-final-production-acceptance.mjs; fi

      - name: Remove isolated diagnostics credential
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          removed=0
          for attempt in 1 2 3; do
            if npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then removed=1; break; fi
            sleep 3
          done
          test "$removed" = "1"
          touch "$TEMP_DIR/token-removed"

      - name: Clean redeploy and prove removed credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          test -f "$TEMP_DIR/token-removed"
          log="$EVIDENCE_DIR/clean-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          out="$EVIDENCE_DIR/readiness-clean.json"
          ready=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?v6=clean&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(b.ok!==true||b.runtimeSourceFingerprint!==process.argv[2])process.exit(1);' "$out" "$EXPECTED_MAC_FINGERPRINT"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          body="$EVIDENCE_DIR/removed-token.json"
          code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $token" -F 'aiCouncilTier=basic' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
          test "$code" = "401" -o "$code" = "403"
          printf '{"clean":true,"removedTokenHttp":%s,"runtimeFingerprint":"%s"}\n' "$code" "$EXPECTED_MAC_FINGERPRINT" > "$EVIDENCE_DIR/cleanup-proof.json"

      - name: Upload deep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-final-production-diagnostics-v6-20260807
          path: evidence/instacomp-final-production-diagnostics-v6-20260807
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR"
