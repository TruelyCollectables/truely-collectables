name: Apply InstaComp Internal Inventory Scope

on:
  push:
    branches:
      - agent/instacomp-2-hardening-rebased
    paths:
      - "scripts/fix-instacomp-internal-inventory-scope.mjs"
      - ".github/workflows/apply-instacomp-internal-inventory-scope.yml"

permissions:
  contents: write

concurrency:
  group: apply-instacomp-internal-inventory-scope
  cancel-in-progress: false

jobs:
  apply-inventory-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-2-hardening-rebased
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply actor-scoped internal inventory correction
        run: node scripts/fix-instacomp-internal-inventory-scope.mjs

      - name: Validate internal inventory boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/app/api/instacomp/scan/route.ts', 'utf8');
          const start = source.indexOf('async function getTcosInventoryProvider(');
          const end = source.indexOf('async function saveScanToSupabase(', start);
          const section = source.slice(start, end);
          for (const marker of [
            'INSTACOMP_INVENTORY_SCOPE_V2',
            '.from("inventory_items")',
            '.eq("store_id", actor.storeId)',
            '.eq("status", "active")',
            '.gt("quantity", 0)',
            '.eq("seller_account_id", actor.sellerAccountId)',
            '"not used for pricing"',
          ]) {
            if (!section.includes(marker)) throw new Error(`Missing inventory boundary marker: ${marker}`);
          }
          if (section.includes('.from("products")')) {
            throw new Error('Legacy products-table query remains in the actor-scoped internal provider.');
          }
          NODE

      - name: Commit corrected provider to isolated branch
        run: |
          if git diff --quiet -- src/app/api/instacomp/scan/route.ts; then
            echo "Internal inventory scope already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/instacomp/scan/route.ts
          git commit -m "Scope InstaComp internal comps to actor-owned active inventory"
          git push origin HEAD:agent/instacomp-2-hardening-rebased
