name: Ops Upper Deck 2025-26 Hockey Production Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-upper-deck-2025-26-hockey-production.yml"
  push:
    branches:
      - ops/upper-deck-2025-26-hockey-production-20260804
    paths:
      - ".github/workflows/ops-upper-deck-2025-26-hockey-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-upper-deck-2025-26-hockey-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-all-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact operations revision
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate every official 2025-26 hockey source without writes
        run: |
          npx tsx scripts/import-upper-deck-2025-26-hockey.ts \
            --output .upper-deck-work/2025-26-hockey-validation-receipt.json

      - name: Require a complete passing validation receipt
        run: |
          node - <<'NODE'
          const receipt = require('./.upper-deck-work/2025-26-hockey-validation-receipt.json');
          if (receipt.status !== 'passed' || receipt.mode !== 'validation_only') {
            throw new Error(`Validation did not pass: ${JSON.stringify(receipt)}`);
          }
          if (receipt.sourceCount !== 33 || receipt.results?.length !== 33) {
            throw new Error(`Expected 33 validated sources: ${JSON.stringify({ sourceCount: receipt.sourceCount, results: receipt.results?.length })}`);
          }
          const invalid = receipt.results.filter((row) => row.status !== 'validated' || !row.sha256 || row.counts?.cards < 1 || row.counts?.identities < 1);
          if (invalid.length) {
            throw new Error(`Incomplete validation rows: ${JSON.stringify(invalid)}`);
          }
          console.log(JSON.stringify({ status: receipt.status, sourceCount: receipt.sourceCount, completedAt: receipt.completedAt }, null, 2));
          NODE

      - name: Upload sanitized validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-deck-2025-26-hockey-validation-receipt
          path: .upper-deck-work/*.json
          if-no-files-found: warn
          retention-days: 90
