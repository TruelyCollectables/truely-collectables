name: Query Supabase Checklist Production Health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/query-supabase-checklist-production-health.yml"

permissions:
  contents: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PROJECT_REF: rfdzsoykhnngzdnvzlhz
  STATUS_BRANCH: ops/mainstream-checklist-status
  STATUS_PATH: docs/operations/supabase-checklist-production-health.json

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe post-restart project health and lock graph
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-health"
          report="$RUNNER_TEMP/supabase-health/report.json"
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          auth=(--header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Accept: application/json")

          req() {
            local method="$1" url="$2" out="$3" data="${4:-}"
            local code
            : > "$out.body"; : > "$out.stderr"
            if [[ -n "$data" ]]; then
              code="$(curl --silent --show-error --max-time 25 --request "$method" "${auth[@]}" --header "Content-Type: application/json" --data "$data" --output "$out.body" --write-out '%{http_code}' "$url" 2>"$out.stderr" || true)"
            else
              code="$(curl --silent --show-error --max-time 25 --request "$method" "${auth[@]}" --output "$out.body" --write-out '%{http_code}' "$url" 2>"$out.stderr" || true)"
            fi
            printf '%s' "${code:-000}" > "$out.code"
          }

          req GET "$api" "$RUNNER_TEMP/supabase-health/project"
          req GET "$api/health?services=db&services=rest&services=storage&services=auth" "$RUNNER_TEMP/supabase-health/services"

          sql="select json_build_object(
            'max_connections', current_setting('max_connections')::int,
            'total_connections', (select count(*)::int from pg_stat_activity),
            'active_connections', (select count(*)::int from pg_stat_activity where state='active'),
            'waiting_connections', (select count(*)::int from pg_stat_activity where wait_event is not null),
            'waiting_locks', (select count(*)::int from pg_locks where not granted),
            'checklist_catalog_readable', (select exists(select 1 from public.checklist_source_catalog limit 1)),
            'blockers', (
              select coalesce(json_agg(row_to_json(x)), '[]'::json)
              from (
                select a.pid::int blocked_pid,
                       coalesce(nullif(a.application_name,''),'<empty>') blocked_application,
                       coalesce(a.wait_event_type,'<null>') blocked_wait_type,
                       coalesce(a.wait_event,'<null>') blocked_wait_event,
                       b.pid::int blocker_pid,
                       coalesce(nullif(b.application_name,''),'<empty>') blocker_application,
                       coalesce(b.state,'<null>') blocker_state,
                       round(extract(epoch from (now()-coalesce(b.xact_start,b.query_start,b.backend_start)))::numeric,1) blocker_age_seconds,
                       md5(coalesce(b.query,'')) blocker_query_hash
                from pg_stat_activity a
                cross join lateral unnest(pg_blocking_pids(a.pid)) p(blocker_pid)
                join pg_stat_activity b on b.pid=p.blocker_pid
                order by blocker_age_seconds desc
                limit 30
              ) x
            )
          ) health;"
          body="$(jq -n --arg query "$sql" '{query:$query}')"
          req POST "$api/database/query/read-only" "$RUNNER_TEMP/supabase-health/sql" "$body"

          project_code="$(cat "$RUNNER_TEMP/supabase-health/project.code" 2>/dev/null || printf 000)"
          services_code="$(cat "$RUNNER_TEMP/supabase-health/services.code" 2>/dev/null || printf 000)"
          sql_code="$(cat "$RUNNER_TEMP/supabase-health/sql.code" 2>/dev/null || printf 000)"
          project="$(jq 'if type=="object" then {status:(.status//null),region:(.region//null),error:(.error//.message//null)} else null end' "$RUNNER_TEMP/supabase-health/project.body" 2>/dev/null || printf null)"
          services="$(jq 'if type=="array" then [.[]|{name:(.name//null),healthy:(.healthy//null),status:(.status//null),error:(if .error then (.error|tostring|.[0:300]) else null end)}] else [] end' "$RUNNER_TEMP/supabase-health/services.body" 2>/dev/null || printf '[]')"
          service_error="$(jq 'if type=="object" then ((.error//.message//null)|if .==null then null else (tostring|.[0:300]) end) else null end' "$RUNNER_TEMP/supabase-health/services.body" 2>/dev/null || printf null)"
          sql_result="$(jq '.' "$RUNNER_TEMP/supabase-health/sql.body" 2>/dev/null || printf null)"

          jq -n \
            --arg checkedAt "$checked_at" \
            --arg projectCode "$project_code" --arg servicesCode "$services_code" --arg sqlCode "$sql_code" \
            --arg projectTransport "$(head -c 300 "$RUNNER_TEMP/supabase-health/project.stderr" 2>/dev/null || true)" \
            --arg servicesTransport "$(head -c 300 "$RUNNER_TEMP/supabase-health/services.stderr" 2>/dev/null || true)" \
            --arg sqlTransport "$(head -c 300 "$RUNNER_TEMP/supabase-health/sql.stderr" 2>/dev/null || true)" \
            --argjson project "$project" --argjson services "$services" --argjson serviceError "$service_error" --argjson sqlResult "$sql_result" \
            '{schema:"tcos.supabase.checklistProductionHealth.v3",checkedAt:$checkedAt,
              managementProject:{httpCode:$projectCode,data:$project,transportError:(if $projectTransport=="" then null else $projectTransport end)},
              serviceHealth:{httpCode:$servicesCode,services:$services,error:$serviceError,transportError:(if $servicesTransport=="" then null else $servicesTransport end)},
              readOnlyDatabaseQuery:{httpCode:$sqlCode,result:$sqlResult,transportError:(if $sqlTransport=="" then null else $sqlTransport end)}}' > "$report"
          cat "$report"
      - name: Publish sanitized health receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/supabase-health/report.json"
          if [[ ! -s "$report" ]]; then
            mkdir -p "$(dirname "$report")"
            jq -n --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{schema:"tcos.supabase.checklistProductionHealth.v3",checkedAt:$checkedAt,error:"diagnostic_failed_before_report"}' > "$report"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$report" "$STATUS_PATH"
          git add "$STATUS_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Query Supabase checklist Production health [skip ci]"
            git push origin "HEAD:$STATUS_BRANCH"
          fi

# Post-restart health probe: 2026-08-07T18:15Z
