name: KINGMAKER Marketplaces Dynamic Build Cert 20260807

on:
  push:
    branches:
      - fix/kingmaker-marketplaces-dynamic-build-20260807
    paths:
      - "src/app/kingmaker/marketplaces/page.tsx"
      - ".github/workflows/kingmaker-marketplaces-dynamic-build-cert-20260807.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/app/kingmaker/marketplaces/page.tsx"
      - ".github/workflows/kingmaker-marketplaces-dynamic-build-cert-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  certify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-marketplaces-dynamic-build-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Load exact Vercel Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull .env.local --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s .env.local
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/kingmaker-build.log
          grep -Eq '^[[:space:]]*├[[:space:]]+ƒ /kingmaker/marketplaces|^[[:space:]]*└[[:space:]]+ƒ /kingmaker/marketplaces' /tmp/kingmaker-build.log
          if grep -Fq 'Failed to build /kingmaker/marketplaces/page' /tmp/kingmaker-build.log; then
            echo 'KINGMAKER marketplaces still timed out during static generation.' >&2
            exit 1
          fi
          echo 'KINGMAKER marketplaces is dynamic and Production build completed.'
      - name: Remove local Production environment
        if: always()
        run: rm -f .env.local .env.production.local
