name: KINGMAKER Marketplaces Dynamic Build Cert 20260807

on:
  push:
    branches:
      - fix/kingmaker-marketplaces-dynamic-build-20260807
    paths:
      - "src/app/kingmaker/marketplaces/page.tsx"
      - ".github/workflows/kingmaker-marketplaces-dynamic-build-cert-20260807.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/app/kingmaker/marketplaces/page.tsx"
      - ".github/workflows/kingmaker-marketplaces-dynamic-build-cert-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  certify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-marketplaces-dynamic-build-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Pull exact Vercel Production project state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 pull --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s .vercel/.env.production.local
      - name: Vercel Production build
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          npx --yes vercel@56.2.0 build --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/kingmaker-vercel-build.log
          if grep -Fq 'Failed to build /kingmaker/marketplaces/page' /tmp/kingmaker-vercel-build.log; then
            echo 'KINGMAKER marketplaces still timed out during static generation.' >&2
            exit 1
          fi
          if grep -Fq 'Export encountered an error on /kingmaker/marketplaces/page' /tmp/kingmaker-vercel-build.log; then
            echo 'KINGMAKER marketplaces still failed static export.' >&2
            exit 1
          fi
          grep -Eq '^[[:space:]]*├[[:space:]]+ƒ /kingmaker/marketplaces|^[[:space:]]*└[[:space:]]+ƒ /kingmaker/marketplaces' /tmp/kingmaker-vercel-build.log
          echo 'KINGMAKER marketplaces is dynamic and Vercel Production build completed.'
      - name: Remove local Vercel state
        if: always()
        shell: bash
        run: rm -rf .vercel .env.local .env.production.local
