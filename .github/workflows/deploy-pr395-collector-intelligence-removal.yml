name: Verify PR 395 Collector Intelligence Removal in Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pr395-collector-intelligence-removal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pr395-collector-intelligence-removal
  cancel-in-progress: true

jobs:
  verify-live-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify TCOS Collector Intelligence is absent from a live card page
        id: verify_live
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(git rev-parse --short=12 HEAD)-$(date +%s)"
          work="$RUNNER_TEMP/pr395-production"
          mkdir -p "$work"

          sitemap="$work/sitemap.xml"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            -A "TruelyCollectablesPR395Verify/1.0" \
            "https://truelycollectables.com/sitemap.xml?pr395_verify=$stamp" \
            -o "$sitemap"

          product_url="$(grep -oE 'https://truelycollectables\.com/product/[0-9]+' "$sitemap" | head -n 1)"
          test -n "$product_url"

          product="$work/product.html"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            -H "Pragma: no-cache" \
            -A "TruelyCollectablesPR395Verify/1.0" \
            "${product_url}?pr395_verify=$stamp" \
            -o "$product"

          grep -Fq "Collector Snapshot" "$product"

          forbidden=(
            "Collector Intelligence"
            "Collector Research Page"
            "Research before you make it yours"
            "TCOS only shows a public trend"
            "Search TCOS"
            "130point Sales Search"
            "Complete The Set Or Run"
          )

          for text in "${forbidden[@]}"; do
            if grep -Fq "$text" "$product"; then
              echo "Forbidden TCOS storefront text still present: $text" >&2
              exit 1
            fi
          done

          echo "product_url=$product_url" >> "$GITHUB_OUTPUT"
          echo "Production verified: $product_url no longer contains TCOS Collector Intelligence."

      - name: Record verified Production deployment
        shell: bash
        env:
          PRODUCT_URL: ${{ steps.verify_live.outputs.product_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin main
          git reset --hard origin/main
          mkdir -p deployment-receipts
          cat > deployment-receipts/pr395-collector-intelligence-removal.md <<EOF
          # PR 395 Production Deployment

          - Result: verified
          - Vercel deployment source: 06efb1e47aafae1dda268bb5960e872cbf38383e
          - Production alias: https://truelycollectables.com
          - Product checked: ${PRODUCT_URL}
          - Verification: the live product page contains Collector Snapshot and excludes all TCOS Collector Intelligence storefront text.
          - Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add deployment-receipts/pr395-collector-intelligence-removal.md
          git commit -m "Record PR 395 Production deployment [skip ci]"
          git push origin HEAD:main
