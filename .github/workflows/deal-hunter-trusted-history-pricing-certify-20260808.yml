name: Deal Hunter Trusted History Pricing Certify 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/deal-hunter-trusted-sold-history.ts'
      - 'scripts/run-deal-hunter-trusted-history-regressions.ts'
      - 'scripts/patch-deal-hunter-trusted-history-pricing-20260808.py'
      - 'src/lib/deal-hunter-trusted-history-pricing-20260808.marker'
      - '.github/workflows/deal-hunter-trusted-history-pricing-certify-20260808.yml'

permissions:
  contents: write

jobs:
  certify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact Deal Hunter core patch
        run: python3 scripts/patch-deal-hunter-trusted-history-pricing-20260808.py
      - name: Trusted sold-history regressions
        run: node --import tsx scripts/run-deal-hunter-trusted-history-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Guard sold-history trust boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'observation_kind === "SOLD"' src/lib/deal-hunter-trusted-sold-history.ts >/dev/null
          grep -F 'matchScore < 0.95' src/lib/deal-hunter-trusted-sold-history.ts >/dev/null
          grep -F 'maxAgeDays: 90' src/app/api/instacomp/deal-hunter/evaluate/core.ts >/dev/null
          grep -F 'registryFingerprintSha256' src/app/api/instacomp/deal-hunter/evaluate/core.ts >/dev/null
          grep -F 'exactSoldRequiredForPositiveEconomics: true' src/app/api/instacomp/deal-hunter/evaluate/core.ts >/dev/null
          git diff --check
      - name: Materialize certified runtime and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Truely Collectables CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/api/instacomp/deal-hunter/evaluate/core.ts src/lib/deal-hunter-trusted-sold-history.ts scripts/run-deal-hunter-trusted-history-regressions.ts
          git rm scripts/patch-deal-hunter-trusted-history-pricing-20260808.py
          git rm src/lib/deal-hunter-trusted-history-pricing-20260808.marker
          git rm .github/workflows/deal-hunter-trusted-history-pricing-certify-20260808.yml
          git commit -m 'Use trusted exact sold history when live providers are down'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
