name: Launch 2 Final B30F084 Production Retry 3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/launch2-final-b30f084-production-retry3-20260730.yml"

permissions:
  contents: read
  actions: read

env:
  EXPECTED_MAIN_SHA: b30f084775775d258e02affafd695028261c12c9
  EXPECTED_BRANCH: ops/launch2-final-b30f084-production-retry2-20260730
  PRIOR_PRODUCTION_RUN: "30517430659"
  PRIOR_PRODUCTION_ARTIFACT: launch2-final-production-b30f084-retry2
  CURRENT_VALIDATION_RUN: "30516896769"
  CURRENT_VALIDATION_ARTIFACT: launch2-final-b30f084-bound-evidence
  ORIGINAL_CERT_RUN: "30501917103"
  ORIGINAL_CERT_ARTIFACT: truely-launch-2-final-production-certificate-ad575
  VERCEL_SCOPE: truelycollectables-projects
  PROJECT_REF: rfdzsoykhnngzdnvzlhz
  EVIDENCE_DIR: .audit/launch2-final-b30f084-production-retry3

jobs:
  certify:
    if: github.event.pull_request.head.ref == 'ops/launch2-final-b30f084-production-retry2-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_API_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out guarded operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact current main and operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          expected=(
            .github/workflows/launch2-final-b30f084-production-retry2-20260730.yml
            .github/workflows/launch2-final-b30f084-production-retry3-20260730.yml
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          test -n "${VERCEL_TOKEN:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"

      - name: Download exact Production deployment evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIOR_PRODUCTION_ARTIFACT }}
          path: ${{ runner.temp }}/prior-production
          github-token: ${{ github.token }}
          repository: TruelyCollectables/truely-collectables
          run-id: ${{ env.PRIOR_PRODUCTION_RUN }}

      - name: Download exact-main validation evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CURRENT_VALIDATION_ARTIFACT }}
          path: ${{ runner.temp }}/current-evidence
          github-token: ${{ github.token }}
          repository: TruelyCollectables/truely-collectables
          run-id: ${{ env.CURRENT_VALIDATION_RUN }}

      - name: Download original Launch 2 certificate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORIGINAL_CERT_ARTIFACT }}
          path: ${{ runner.temp }}/original-certificate
          github-token: ${{ github.token }}
          repository: TruelyCollectables/truely-collectables
          run-id: ${{ env.ORIGINAL_CERT_RUN }}

      - name: Bind immutable source deployment and original certificate evidence
        shell: bash
        run: |
          set -euo pipefail
          prior="$RUNNER_TEMP/prior-production"
          current="$RUNNER_TEMP/current-evidence"
          original="$RUNNER_TEMP/original-certificate"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.ok==true and .exactMainSha==$sha and .customDomainAlias=="truelycollectables.com" and (.deploymentId|length)>0 and (.deploymentHost|length)>0' "$prior/exact-production.json" >/dev/null
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.ok==true and .cleanedMainSha==$sha and .onlyTemporaryVerificationFilesRemoved==true and .permanentAdminOrderRefundFeeSourcesChanged==false' "$current/cleanup-binding.json" >/dev/null
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.ok==true and .currentCleanedMainSha==$sha and .priorSignedAdminRuntime=="passed" and .cleanupOnlyDiff=="passed"' "$current/prior-evidence-binding.json" >/dev/null
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.ok==true and .exactMainSha==$sha and .serviceRoleDelete==true and .anonDelete==false and .authenticatedDelete==false' "$current/platform-fee-grant-production.json" >/dev/null
          jq -e '.ok==true and .contract=="Launch 2.0 issue #253" and .soldRetentionDays==7 and .authoritativeEbayPollingMinutes==15 and .checks>=169' "$current/sold-lifecycle.log" >/dev/null
          jq -e '.ok==true and .contract=="sale guards execute before restock reset" and (.protectedFlows|index("collx-via-ebay"))!=null' "$current/sold-trigger.log" >/dev/null
          jq -e '.ok==true and .protectedByVercelTeamToken==true and .runtimeCronSecretNonDisclosure==true and (.steps|length)==4' "$current/marketplace-runtime-contract.log" >/dev/null
          jq -e '.result=="PASS" and (.blockers|length)==0 and .gates.trackedSourceSecretScan=="PASS" and .gates.privilegedRouteProtection=="PASS" and .gates.lint=="PASS" and .gates.typeScript=="PASS" and .gates.productionBuild=="PASS" and .gates.liveProductionCrawlAndAccess.blockers==0 and .gates.runtimeIntegrationsAndData.blockers==0 and (.gates.lighthouse.blockers|length)==0' "$original/final-launch-2-certificate.json" >/dev/null
          cp "$prior/exact-production.json" "$EVIDENCE_DIR/exact-production.json"
          cp "$prior/deployment-url.txt" "$EVIDENCE_DIR/deployment-url.txt"
          jq -n --arg sha "$EXPECTED_MAIN_SHA" --arg priorRun "$PRIOR_PRODUCTION_RUN" --arg validationRun "$CURRENT_VALIDATION_RUN" --arg originalRun "$ORIGINAL_CERT_RUN" '{ok:true,exactMainSha:$sha,exactProductionRun:($priorRun|tonumber),currentValidationRun:($validationRun|tonumber),originalCertificateRun:($originalRun|tonumber),sourceSecurityBuildBound:true,issue253SimulationAndRetryContractsBound:true,exactProductionDeploymentBound:true,originalLaunch2GatesBound:true,verifiedAt:(now|todate)}' > "$EVIDENCE_DIR/evidence-binding.json"

      - name: Reverify exact Vercel Production metadata
        shell: bash
        run: |
          set -euo pipefail
          host="$(jq -r '.deploymentHost' "$EVIDENCE_DIR/exact-production.json")"
          curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?slug=$VERCEL_SCOPE" > "$EVIDENCE_DIR/deployment-metadata.json"
          DEPLOYMENT_JSON="$(cat "$EVIDENCE_DIR/deployment-metadata.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value=JSON.parse(process.env.DEPLOYMENT_JSON||'{}');
          const aliases=Array.isArray(value.alias)?value.alias:Array.isArray(value.aliases)?value.aliases:[];
          const sha=String(value?.meta?.githubCommitSha||'');
          if(String(value.target).toLowerCase()!=='production'||String(value.readyState).toUpperCase()!=='READY'||sha!==process.env.EXPECTED_MAIN_SHA||!aliases.includes('truelycollectables.com'))throw new Error(`Exact Production metadata mismatch: ${JSON.stringify({target:value.target,readyState:value.readyState,sha,aliases})}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/production-metadata-recheck.json',JSON.stringify({ok:true,deploymentId:value.id,deploymentHost:value.url,exactMainSha:sha,target:value.target,readyState:value.readyState,customDomainAlias:'truelycollectables.com',verifiedAt:new Date().toISOString()},null,2));
          NODE
          rm -f "$EVIDENCE_DIR/deployment-metadata.json"

      - name: Verify live custom-domain boundaries with propagation retries
        shell: bash
        run: |
          set -euo pipefail
          evidence="$EVIDENCE_DIR/live-boundary-attempts.tsv"
          : > "$evidence"
          success=false
          for attempt in $(seq 1 36); do
            home="$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' https://truelycollectables.com/ || true)"
            shop="$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' https://truelycollectables.com/shop || true)"
            shipping="$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' https://truelycollectables.com/shipping || true)"
            returns="$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' https://truelycollectables.com/returns || true)"
            protection="$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' https://truelycollectables.com/buyer-protection || true)"
            admin="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' https://truelycollectables.com/admin || true)"
            health="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' https://truelycollectables.com/api/admin-orders-health || true)"
            webhook="$(curl -sS --max-time 60 -X POST -H 'content-type: application/json' --data '{}' -o /dev/null -w '%{http_code}' https://truelycollectables.com/api/webhook || true)"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$attempt" "$home" "$shop" "$shipping" "$returns" "$protection" "$admin" "$health" "$webhook" >> "$evidence"
            if [ "$home" = 200 ] && [ "$shop" = 200 ] && [ "$shipping" = 200 ] && [ "$returns" = 200 ] && [ "$protection" = 200 ] && [ "$admin" = 307 ] && [ "$health" = 401 ] && [ "$webhook" != 200 ]; then success=true; break; fi
            sleep 10
          done
          test "$success" = true
          tail -n 1 "$evidence" | awk -F '\t' -v sha="$EXPECTED_MAIN_SHA" '{printf "{\"ok\":true,\"exactMainSha\":\"%s\",\"attempt\":%s,\"home\":%s,\"shop\":%s,\"shipping\":%s,\"returns\":%s,\"buyerProtection\":%s,\"unsignedAdmin\":%s,\"unsignedAdminHealth\":%s,\"unsignedWebhook\":%s}\n",sha,$1,$2,$3,$4,$5,$6,$7,$8,$9}' > "$EVIDENCE_DIR/live-boundaries.json"

      - name: Run protected marketplace convergence chain
        shell: bash
        run: |
          set -euo pipefail
          for step in ebay-order-sales ebay-full-sync seller-reconciliation sold-archive; do
            code="$(curl -sS --max-time 320 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -o "$EVIDENCE_DIR/runtime-${step}.json" -w '%{http_code}' "https://truelycollectables.com/api/release/issue253-marketplace-self-test?step=${step}")"
            if [ "$code" != 200 ] || ! jq -e --arg step "$step" '.success==true and .cronSecretConfigured==true and .upstreamStatus==200 and .step==$step' "$EVIDENCE_DIR/runtime-${step}.json" >/dev/null; then cat "$EVIDENCE_DIR/runtime-${step}.json" >&2; exit 1; fi
          done

      - name: Verify final hosted sale history CollX boundary and stock guards
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const endpoint=`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`;
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({read_only:true,parameters:[],query:`select json_build_object(
            'required_relations',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('collectible_assets','collectible_asset_events','collectible_grader_verifications','collectible_market_snapshots','collectible_sales','instacomp_internal_sold_comps','collx_only_inventory_boundary_violations','ebay_inbound_sale_guards')),
            'sale_records_total',(select count(*) from public.collectible_sales),'verified_sales',(select count(*) from public.collectible_sales where evidence_status='verified'),'manual_sales',(select count(*) from public.collectible_sales where evidence_status='manual'),'unresolved_sales',(select count(*) from public.collectible_sales where evidence_status='unresolved'),
            'verified_or_manual_price_missing',(select count(*) from public.collectible_sales where evidence_status in ('verified','manual') and sold_price is null),'null_price_not_flagged_unresolved',(select count(*) from public.collectible_sales where sold_price is null and evidence_status<>'unresolved'),'historical_sold_products_without_sale_record',(select count(*) from public.products p where p.sold_at<timestamptz '2026-07-28 00:00:00+00' and not exists(select 1 from public.collectible_sales s where s.store_id=p.store_id and s.legacy_product_id=p.id)),
            'collx_via_linked_ebay_sales',(select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay'),'chain_evidence_rows',(select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay' and evidence->>'source_chain'='collx_or_ebay_to_ebay_to_truely_collectables'),'collx_only_boundary_violations',(select count(*) from public.collx_only_inventory_boundary_violations),'duplicate_sale_event_groups',(select count(*) from(select store_id,event_key from public.collectible_sales group by store_id,event_key having count(*)>1)d),
            'violated_guards',(select count(*) from public.ebay_inbound_sale_guards g where active and (coalesce((select p.quantity from public.products p where p.id=g.legacy_product_id and p.seller_id=g.store_id),0)>g.protected_quantity or coalesce((select i.quantity from public.inventory_items i where i.id=g.inventory_item_id),0)>g.protected_quantity)),'sold_stock_restoration_violations',(select count(*) from public.products where sold_at is not null and quantity>0),'negative_product_quantities',(select count(*) from public.products where quantity<0),'negative_inventory_quantities',(select count(*) from public.inventory_items where quantity<0),'inactive_guard_trigger_count',(select count(*) from pg_trigger where tgname='capture_ebay_inactive_collectible_sale' and not tgisinternal),'maximum_propagation_minutes',json_build_object('completed_order_poll',5,'inactive_full_sync',15,'seller_reconciliation',15),'captured_at',now()) receipt;`})});
          const body=await response.text();if(!response.ok)throw new Error(`Final hosted audit HTTP ${response.status}: ${body.slice(0,1200)}`);const receipt=JSON.parse(body)?.[0]?.receipt||{};const blockers=[];
          if(Number(receipt.required_relations)!==8)blockers.push(`required_relations=${receipt.required_relations}`);if(Number(receipt.collx_via_linked_ebay_sales||0)<1)blockers.push('no persisted indirect eBay/CollX sale evidence');if(Number(receipt.chain_evidence_rows||0)<1)blockers.push('no persisted indirect source-chain evidence');if(Number(receipt.inactive_guard_trigger_count)!==1)blockers.push(`inactive_guard_trigger_count=${receipt.inactive_guard_trigger_count}`);
          for(const key of ['verified_or_manual_price_missing','null_price_not_flagged_unresolved','historical_sold_products_without_sale_record','collx_only_boundary_violations','duplicate_sale_event_groups','violated_guards','sold_stock_restoration_violations','negative_product_quantities','negative_inventory_quantities'])if(Number(receipt[key]||0)!==0)blockers.push(`${key}=${receipt[key]}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/final-hosted-state.json',JSON.stringify({ok:blockers.length===0,exactMainSha:process.env.EXPECTED_MAIN_SHA,receipt,blockers,realMarketplaceOrderCreatedByAudit:false,verifiedAt:new Date().toISOString()},null,2));if(blockers.length)throw new Error(blockers.join('; '));
          NODE

      - name: Run exact Production Lighthouse gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/lighthouse"
          for spec in 'home|/' 'shop|/shop' 'signup|/account/signup' 'cart|/cart'; do name="${spec%%|*}"; path="${spec#*|}"; npx --yes lighthouse@12.8.2 "https://truelycollectables.com$path" --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path="$EVIDENCE_DIR/lighthouse/$name.json"; done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';const pages=['home','shop','signup','cart'];const rows=[];const blockers=[];for(const page of pages){const value=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/lighthouse/${page}.json`,'utf8'));const categories=value.categories||{};const row={page,performance:Math.round((categories.performance?.score||0)*100),accessibility:Math.round((categories.accessibility?.score||0)*100),bestPractices:Math.round((categories['best-practices']?.score||0)*100),seo:Math.round((categories.seo?.score||0)*100)};rows.push(row);if(row.performance<70)blockers.push(`${page} performance ${row.performance}`);if(row.accessibility<95)blockers.push(`${page} accessibility ${row.accessibility}`);if(row.bestPractices<95)blockers.push(`${page} best-practices ${row.bestPractices}`);if((page==='home'||page==='shop')&&row.seo<95)blockers.push(`${page} SEO ${row.seo}`);}fs.writeFileSync(process.env.EVIDENCE_DIR+'/lighthouse-summary.json',JSON.stringify({ok:blockers.length===0,rows,blockers},null,2));if(blockers.length)throw new Error(blockers.join('; '));
          NODE

      - name: Issue strict exact Production certificate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true and (.blockers|length)==0' "$EVIDENCE_DIR/final-hosted-state.json" >/dev/null
          jq -e '.ok==true and (.blockers|length)==0' "$EVIDENCE_DIR/lighthouse-summary.json" >/dev/null
          jq -n --arg sha "$EXPECTED_MAIN_SHA" --arg deployment "$(cat "$EVIDENCE_DIR/deployment-url.txt")" --arg run "$GITHUB_RUN_ID" '{schema:"truelycollectables.launch2Issue253FinalProductionCertificate.v1",result:"PASS",blockerCount:0,exactProductionSha:$sha,exactProductionDeployment:$deployment,workflowRunId:($run|tonumber),originalLaunch2GatesBound:true,currentExactMainSourceSecurityBuildBound:true,issue253ImmutableSaleHistory:true,sevenDaySoldPresentationAndArchive:true,authoritativeHistoricalBackfill:true,unresolvedPricesExplicitlyFlagged:true,ebaySoldInactiveAndFifteenMinuteReconciliation:true,indirectCollXViaLinkedEbayChain:true,collxOnlyExcluded:true,adminMarkSoldElsewhereFallback:true,noInboundSoldStockRestoration:true,lighthouseExactProduction:true,realMarketplaceOrderCreatedByAudit:false,realMoneyChargeCreatedByAudit:false,realPostagePurchasedByAudit:false,physicalDeliveryCreatedByAudit:false,refundIssuedByAudit:false,disputeCreatedByAudit:false,inboxReceiptClaimedByAudit:false,issuedAt:(now|todate)}' > "$EVIDENCE_DIR/final-production-certificate.json"

      - name: Upload final sanitized certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-final-production-b30f084-retry3
          path: .audit/launch2-final-b30f084-production-retry3
          if-no-files-found: error
          retention-days: 90
