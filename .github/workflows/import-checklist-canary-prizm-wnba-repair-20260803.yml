name: Import Checklist Canary Prizm WNBA Repair 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-checklist-canary-prizm-wnba-repair-20260803.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: pokemon-checklist-registry-production
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: d0784767fd664bf0960bf28e71afd7ca15533182
  EXPECTED_BRANCH: ops/import-checklist-canary-prizm-wnba-repair-20260803
  SOURCE_IMPORTER_BRANCH: ops/import-checklist-canary-prizm-wnba-20260803
  SOURCE_IMPORTER_COMMIT: 936849583fe1c6189c82204536d0ca8ca4fac59d
  VALIDATION_ARTIFACT_ID: "8845633740"
  VALIDATION_ARTIFACT_SHA256: 780963f8bdbdbb2ab5cedb3ac0c727f6f14155c8e7fee94c0e92c9e937fb9239
  REPAIRED_PLAN_SHA256: 49edca289849a82694b0565a8e2e1eabe99ea71449e59f94bb4093c74d6de6f8
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/checklist-canary-prizm-wnba-repair-20260803

jobs:
  repair-import-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact repair scope and pin source importer
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main "$EXPECTED_BRANCH" "$SOURCE_IMPORTER_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "origin/$EXPECTED_BRANCH"
          test "$(git rev-parse "origin/$SOURCE_IMPORTER_BRANCH")" = "$SOURCE_IMPORTER_COMMIT"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/import-checklist-canary-prizm-wnba-repair-20260803.yml'
          git diff --check "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH"
          git show "$SOURCE_IMPORTER_COMMIT:scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs" \
            > "$RUNNER_TEMP/import-checklist-canary-prizm-wnba-20260803.mjs"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/import-checklist-canary-prizm-wnba-20260803.mjs" \
            scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs
          printf '{"schema":"tcos.checklist.repairedCanaryRunContext.v1","runId":"%s","releaseSlug":"2024-panini-prizm-wnba","sourceImporterCommit":"%s","productionWritesAuthorized":true}\n' \
            "$GITHUB_RUN_ID" "$SOURCE_IMPORTER_COMMIT" > "$EVIDENCE_DIR/run-context.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and resolve masked Production credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false pg@8.16.3
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"

          mkdir -p .vercel "$RUNNER_TEMP/checklist-canary-repair-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi

          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/checklist-canary-repair-production/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

          PRODUCTION_ENV_PATH="$RUNNER_TEMP/checklist-canary-repair-production/production.env" node - <<'NODE'
          const fs = require('node:fs');
          function parseEnv(filePath) {
            const parsed = {};
            for (const raw of fs.readFileSync(filePath, 'utf8').split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const index = line.indexOf('=');
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }
          (async () => {
            const parsed = parseEnv(process.env.PRODUCTION_ENV_PATH);
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
            if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            if (!projectRef) throw new Error('Could not resolve Production project ref');
            let serviceKey = String(
              parsed.SUPABASE_SERVICE_ROLE_KEY ||
              parsed.SUPABASE_SECRET_KEY ||
              Object.entries(parsed).find(([key, value]) => /^SUPABASE_SECRET_.*_KEY$/.test(key) && value)?.[1] ||
              ''
            );
            if (!serviceKey) {
              const response = await fetch(
                `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
                { headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` } },
              );
              const text = await response.text();
              if (!response.ok) throw new Error(`Supabase API-key lookup failed with HTTP ${response.status}: ${text.slice(0, 500)}`);
              const keys = text ? JSON.parse(text) : [];
              if (!Array.isArray(keys)) throw new Error('Supabase API-key lookup returned an unexpected payload');
              const legacy = keys.find((key) => key?.name === 'service_role' && key?.api_key);
              const roleSecret = keys.find((key) => key?.secret_jwt_template?.role === 'service_role' && key?.api_key);
              const secret = keys.find((key) => key?.type === 'secret' && key?.api_key);
              serviceKey = String(legacy?.api_key || roleSecret?.api_key || secret?.api_key || '');
            }
            if (!serviceKey) throw new Error('No elevated Supabase API key could be resolved');
            for (const value of [productionUrl, serviceKey]) console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_ROLE_KEY<<SUPABASE_KEY_EOF\n${serviceKey}\nSUPABASE_KEY_EOF\n`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Download and verify pinned validation artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checklist-canary-repair-artifact"
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/checklist-canary-repair-artifact.zip"
          echo "$VALIDATION_ARTIFACT_SHA256  $RUNNER_TEMP/checklist-canary-repair-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/checklist-canary-repair-artifact.zip" \
            -d "$RUNNER_TEMP/checklist-canary-repair-artifact"

      - name: Require exact passing source canary without writes
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/checklist-canary-repair-artifact" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.ARTIFACT_ROOT;
          const receipt = JSON.parse(fs.readFileSync(path.join(root, 'validation.json'), 'utf8'));
          const id = '2024-panini-prizm-wnba';
          const result = receipt.results?.find((entry) => entry.id === id);
          if (receipt.schema !== 'tcos.checklist.sixReleaseValidation.v1' || receipt.status !== 'passed') throw new Error('Pinned validation receipt did not pass');
          if (!result || result.validationStatus !== 'passed') throw new Error('Pinned source canary validation did not pass');
          const expected = { rows:6702, sets:12, cards:337, parallels:121, identities:6702 };
          for (const [key, value] of Object.entries(expected)) if (Number(result.counts?.[key]) !== value) throw new Error(`Pinned source canary ${key} is wrong`);
          const directory = path.join(root, 'private', id);
          if (!fs.existsSync(path.join(directory, `${id}.plan.json`)) || !fs.existsSync(path.join(directory, `${id}.xlsx`))) throw new Error('Pinned source canary files are missing');
          if (receipt.safety?.productionDatabaseWrites !== false || receipt.safety?.rowSourcesNeverRepresentedAsOfficialManufacturer !== true) throw new Error('Pinned validation safety receipt is wrong');
          console.log(JSON.stringify({ status: result.validationStatus, id, sourceCounts: result.counts }, null, 2));
          NODE

      - name: Apply exact canonical-card collision repair to importer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          importer = Path('scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs')
          text = importer.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''  normalizedPlanSha256: "e3d529384fc3778732f1f4fc6897079154506cb167b39f14d02bd60bd2b28159",
            sets: 12,
            cards: 337,''',
          '''  originalNormalizedPlanSha256: "e3d529384fc3778732f1f4fc6897079154506cb167b39f14d02bd60bd2b28159",
            normalizedPlanSha256: "49edca289849a82694b0565a8e2e1eabe99ea71449e59f94bb4093c74d6de6f8",
            sets: 12,
            sourceCards: 337,
            cards: 335,''',
          'source repair contract')

          replace_once(
          '''  active_cards: 36_324,''',
          '''  active_cards: 36_322,''',
          'post-import active-card total')

          replace_once(
          '''    ["cards", Number(counts.cards), SOURCE.cards],''',
          '''    ["cards", Number(counts.cards), SOURCE.sourceCards],''',
          'source card-count validation')

          replace_once(
          '''      SOURCE.normalizedPlanSha256,
              ],''',
          '''      SOURCE.originalNormalizedPlanSha256,
              ],''',
          'source semantic digest validation')

          replace_once(
          '''  return { plan, rawBytes, planPath, rawPath };
            }

            function managementContext() {''',
          '''  const repairReceipt = applyCanonicalRepairs(plan);
              return { plan, rawBytes, planPath, rawPath, repairReceipt };
            }

            const EMPTY_FINGERPRINT_VALUE = "∅";

            function canonicalField(name, value) {
              const encoded = Array.isArray(value)
                ? value.length
                  ? value.join("+")
                  : EMPTY_FINGERPRINT_VALUE
                : value || EMPTY_FINGERPRINT_VALUE;
              return `${name}=${encoded}`;
            }

            function normalizeFingerprintList(values) {
              return [...values]
                .map((value) =>
                  String(value)
                    .normalize("NFKC")
                    .replace(/[‐‑‒–—―]/g, "-")
                    .replace(/&/g, " and ")
                    .replace(/[’‘]/g, "'")
                    .replace(/\s+/g, " ")
                    .trim()
                    .toLowerCase(),
                )
                .sort((left, right) => left.localeCompare(right));
            }

            function rebuildFingerprint(fingerprint, players, teams) {
              const normalized = {
                ...fingerprint.normalized,
                players: normalizeFingerprintList(players),
                teams: normalizeFingerprintList(teams),
              };
              const canonicalKey = [
                canonicalField("schema", normalized.schema),
                canonicalField("release_year", normalized.releaseYear),
                canonicalField("season", normalized.season),
                canonicalField("manufacturer", normalized.manufacturer),
                canonicalField("brand", normalized.brand),
                canonicalField("product", normalized.product),
                canonicalField("sport", normalized.sport),
                canonicalField("league", normalized.league),
                canonicalField("set", normalized.setName),
                canonicalField("subset", normalized.subset),
                canonicalField("card_number", normalized.cardNumber),
                canonicalField("players", normalized.players),
                canonicalField("teams", normalized.teams),
                canonicalField("parallel", normalized.parallel),
                canonicalField("variation", normalized.variation),
                canonicalField("serial_run", normalized.serialRun),
                canonicalField("autograph", normalized.autographStatus),
                canonicalField("memorabilia", normalized.memorabiliaStatus),
                canonicalField(
                  "configuration",
                  normalized.configurationExclusivity,
                ),
              ].join("|");
              return {
                schema: normalized.schema,
                normalized,
                canonicalKey,
                fingerprintSha256: sha256(canonicalKey),
              };
            }

            function applyCanonicalRepairs(plan) {
              const repairs = [
                {
                  setSourceKey: "set:base",
                  cardNumber: "140",
                  keep: "card:base:140:998bc19c8763f18b",
                  drop: "card:base:140:a3fc543e6dfffb74",
                  players: ["Elizabeth Kitley"],
                  teams: ["Las Vegas Aces"],
                },
                {
                  setSourceKey: "set:fearless",
                  cardNumber: "10",
                  keep: "card:fearless:10:ea3a847abe4e4a30",
                  drop: "card:fearless:10:f218e343535c72b0",
                  players: ["Caitlin Clark"],
                  teams: ["Indiana Fever"],
                },
              ];

              if (plan.cards.length !== SOURCE.sourceCards) {
                throw new Error(
                  `Canonical repair expected ${SOURCE.sourceCards} source cards, received ${plan.cards.length}.`,
                );
              }
              if (plan.identities.length !== SOURCE.identities) {
                throw new Error(
                  `Canonical repair expected ${SOURCE.identities} identities, received ${plan.identities.length}.`,
                );
              }

              const applied = [];
              for (const repair of repairs) {
                const keepRows = plan.cards.filter(
                  (card) => card.sourceKey === repair.keep,
                );
                const dropRows = plan.cards.filter(
                  (card) => card.sourceKey === repair.drop,
                );
                if (keepRows.length !== 1 || dropRows.length !== 1) {
                  throw new Error(
                    `Canonical repair source keys were not exact for ${repair.setSourceKey}/${repair.cardNumber}.`,
                  );
                }
                const keep = keepRows[0];
                const drop = dropRows[0];
                for (const card of [keep, drop]) {
                  if (
                    card.setSourceKey !== repair.setSourceKey ||
                    String(card.cardNumber) !== repair.cardNumber ||
                    String(card.variation || "") !== ""
                  ) {
                    throw new Error(
                      `Canonical repair key mismatch for ${card.sourceKey}.`,
                    );
                  }
                }

                keep.players = [...repair.players];
                keep.teams = [...repair.teams];
                keep.sourceNotes = [
                  keep.sourceNotes,
                  `canonical_card_repair=source_parallel_conflict`,
                  `dropped_source_key=${repair.drop}`,
                ]
                  .filter(Boolean)
                  .join("; ");

                const beforeCards = plan.cards.length;
                plan.cards = plan.cards.filter(
                  (card) => card.sourceKey !== repair.drop,
                );
                if (plan.cards.length !== beforeCards - 1) {
                  throw new Error(`Canonical repair did not remove ${repair.drop}.`);
                }

                let remappedIdentities = 0;
                for (const identity of plan.identities) {
                  if (
                    identity.cardSourceKey === repair.keep ||
                    identity.cardSourceKey === repair.drop
                  ) {
                    identity.cardSourceKey = repair.keep;
                    identity.fingerprint = rebuildFingerprint(
                      identity.fingerprint,
                      repair.players,
                      repair.teams,
                    );
                    remappedIdentities += 1;
                  }
                }
                if (remappedIdentities < 2) {
                  throw new Error(
                    `Canonical repair remapped only ${remappedIdentities} identities for ${repair.keep}.`,
                  );
                }
                applied.push({
                  setSourceKey: repair.setSourceKey,
                  cardNumber: repair.cardNumber,
                  keptSourceKey: repair.keep,
                  droppedSourceKey: repair.drop,
                  players: repair.players,
                  teams: repair.teams,
                  remappedIdentities,
                });
              }

              plan.validation.counts.cards = plan.cards.length;
              plan.validation.counts.identities = plan.identities.length;
              plan.validation.issues = [
                ...(plan.validation.issues || []),
                {
                  code: "canonical_card_repairs_applied",
                  severity: "warning",
                  message:
                    "Resolved two pinned third-party parallel-row subject conflicts against canonical base checklist rows.",
                },
              ];

              const uniqueCardKeys = new Set(
                plan.cards.map(
                  (card) =>
                    `${card.setSourceKey}|${card.cardNumber}|${card.variation || ""}`,
                ),
              );
              const uniqueFingerprints = new Set(
                plan.identities.map(
                  (identity) => identity.fingerprint.fingerprintSha256,
                ),
              );
              const digest = normalizedPlanDigest(plan);
              const failures = [];
              if (plan.cards.length !== SOURCE.cards) {
                failures.push(`cards=${plan.cards.length}, expected=${SOURCE.cards}`);
              }
              if (uniqueCardKeys.size !== SOURCE.cards) {
                failures.push(
                  `uniqueCardKeys=${uniqueCardKeys.size}, expected=${SOURCE.cards}`,
                );
              }
              if (plan.identities.length !== SOURCE.identities) {
                failures.push(
                  `identities=${plan.identities.length}, expected=${SOURCE.identities}`,
                );
              }
              if (uniqueFingerprints.size !== SOURCE.identities) {
                failures.push(
                  `uniqueFingerprints=${uniqueFingerprints.size}, expected=${SOURCE.identities}`,
                );
              }
              if (digest !== SOURCE.normalizedPlanSha256) {
                failures.push(
                  `normalizedPlanSha256=${digest}, expected=${SOURCE.normalizedPlanSha256}`,
                );
              }
              if (failures.length) {
                throw new Error(
                  `Canonical repair validation blocked: ${failures.join("; ")}`,
                );
              }

              return {
                schema: "tcos.checklist.canonicalCardRepair.v1",
                status: "passed",
                sourceCards: SOURCE.sourceCards,
                canonicalCards: SOURCE.cards,
                identities: SOURCE.identities,
                uniqueCardKeys: uniqueCardKeys.size,
                uniqueFingerprints: uniqueFingerprints.size,
                normalizedPlanSha256: digest,
                repairs: applied,
              };
            }

            function managementContext() {''',
          'canonical repair implementation')

          replace_once(
          '''    normalizedPlanSha256: SOURCE.normalizedPlanSha256,
              postgresConnection: connectionReceipt,''',
          '''    normalizedPlanSha256: SOURCE.normalizedPlanSha256,
              canonicalRepair: entry.repairReceipt,
              postgresConnection: connectionReceipt,''',
          'repair receipt persistence')

          replace_once(
          '''      thirdPartyRowsNeverRepresentedAsOfficialManufacturer: true,
                  exactVerifiedTransportOnly: true,''',
          '''      thirdPartyRowsNeverRepresentedAsOfficialManufacturer: true,
                  canonicalCardRepairsApplied: true,
                  sourceConflictRepairsExact: 2,
                  databaseCardUniquenessValidated: true,
                  exactVerifiedTransportOnly: true,''',
          'repair safety receipt')

          importer.write_text(text)
          PY

          node --check scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs
          grep -q '49edca289849a82694b0565a8e2e1eabe99ea71449e59f94bb4093c74d6de6f8' \
            scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs
          test "$(grep -c 'canonicalCardRepairsApplied: true' scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs)" -eq 1
          test "$(grep -c 'sourceCards: 337' scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs)" -eq 1
          test "$(grep -c 'cards: 335' scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs)" -eq 1

      - name: Import and audit repaired 2024 Prizm WNBA canary
        shell: bash
        env:
          ALLOW_PRODUCTION_CHECKLIST_CANARY_IMPORT: "YES"
          ARTIFACT_ROOT: ${{ runner.temp }}/checklist-canary-repair-artifact
        run: |
          set -euo pipefail
          node scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs \
            --apply \
            --artifact-root "$ARTIFACT_ROOT" \
            --receipt "$EVIDENCE_DIR/production-import.json" \
            --failure-receipt "$EVIDENCE_DIR/failure.json"

      - name: Require sanitized passing repaired-canary receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/checklist-canary-prizm-wnba-repair-20260803/production-import.json', 'utf8'));
          if (receipt.schema !== 'tcos.checklist.prizmWnbaCanaryProductionImport.v1' || receipt.status !== 'passed') throw new Error('Repaired canary receipt did not pass');
          if (receipt.releaseSlug !== '2024-panini-prizm-wnba') throw new Error('Wrong repaired canary release');
          const expectedCounts = { sets:12, cards:335, parallels:121, identities:6702 };
          for (const [key, value] of Object.entries(expectedCounts)) if (Number(receipt.counts?.[key]) !== value) throw new Error(`Unexpected ${key}`);
          if (receipt.normalizedPlanSha256 !== process.env.REPAIRED_PLAN_SHA256) throw new Error('Wrong repaired semantic digest');
          const repair = receipt.canonicalRepair || {};
          if (repair.schema !== 'tcos.checklist.canonicalCardRepair.v1' || repair.status !== 'passed' || repair.sourceCards !== 337 || repair.canonicalCards !== 335 || repair.identities !== 6702 || repair.uniqueCardKeys !== 335 || repair.uniqueFingerprints !== 6702 || repair.repairs?.length !== 2 || repair.normalizedPlanSha256 !== process.env.REPAIRED_PLAN_SHA256) throw new Error('Canonical repair receipt is incomplete');
          const final = receipt.finalAudit || {};
          const expectedFinal = { releases:298, active_versions:298, active_cards:36322, active_identities:50918, identity_deficit_versions:0, failed_import_runs:0, registry_public_grants:0, temporary_login_roles:0 };
          for (const [key, value] of Object.entries(expectedFinal)) if (Number(final[key]) !== value) throw new Error(`Unexpected final ${key}: ${final[key]}`);
          if (final.targets?.length !== 1 || final.private_source_bucket !== true || final.writer_rpc !== true) throw new Error('Final repaired-canary audit is incomplete');
          const connection = receipt.postgresConnection || {};
          if (connection.source !== 'shared-pooler' || connection.poolMode !== 'transaction' || connection.userClass !== 'project-qualified-temporary-login' || connection.writerRole !== 'service_role') throw new Error('Repaired canary used an unverified transport');
          const safety = receipt.safety || {};
          if (safety.canonicalCardRepairsApplied !== true || safety.sourceConflictRepairsExact !== 2 || safety.databaseCardUniquenessValidated !== true || safety.exactVerifiedTransportOnly !== true || safety.noCandidateLoop !== true || safety.noSleepPreflight !== true || safety.canaryAuditedBeforeAnyFurtherRelease !== true || safety.temporaryLoginRoleDeleted !== true || safety.migrationsApplied !== false || safety.deploymentPerformed !== false) throw new Error('Repaired-canary safety receipt is incomplete');
          console.log(JSON.stringify({ status: receipt.status, releaseSlug: receipt.releaseSlug, counts: receipt.counts, canonicalRepair: repair, final }, null, 2));
          NODE

      - name: Capture read-only state after failure
        if: failure()
        shell: bash
        run: |
          set +e
          node - <<'NODE'
          const fs = require('node:fs');
          const productionUrl = String(process.env.NEXT_PUBLIC_SUPABASE_URL || '');
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const output = `${process.env.EVIDENCE_DIR}/workflow-failure-audit.json`;
          (async () => {
            if (!productionUrl || !accessToken) return;
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            const query = `with active_versions as (select * from public.checklist_versions where is_active), identity_counts as (select v.id,v.normalized_identity_count expected_identities,count(i.id)::bigint actual_identities from active_versions v left join public.checklist_card_identities i on i.version_id=v.id group by v.id,v.normalized_identity_count) select json_build_object('releases',(select count(*) from public.checklist_releases),'active_versions',(select count(*) from active_versions),'active_cards',(select count(*) from public.checklist_cards c join active_versions v on v.id=c.version_id),'active_identities',(select count(*) from public.checklist_card_identities i join active_versions v on v.id=i.version_id),'identity_deficit_versions',(select count(*) from identity_counts where actual_identities<>expected_identities),'failed_import_runs',(select count(*) from public.checklist_import_runs where status='failed'),'temporary_login_roles',(select count(*) from pg_roles where rolname like 'cli_login_%'),'target_count',(select count(*) from public.checklist_releases where slug='2024-panini-prizm-wnba')) state;`;
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, { method:'POST', headers:{ Authorization:`Bearer ${accessToken}`, Accept:'application/json', 'Content-Type':'application/json' }, body:JSON.stringify({ query, parameters:[], read_only:true }) });
            const text = await response.text();
            const payload = response.ok ? { status:'captured', state:(text ? JSON.parse(text) : [])?.[0]?.state || null } : { status:'audit_failed', httpStatus:response.status };
            fs.writeFileSync(output, `${JSON.stringify(payload, null, 2)}\n`);
          })().catch((error) => fs.writeFileSync(output, `${JSON.stringify({ status:'audit_exception', error:String(error?.message || error).slice(0,500) }, null, 2)}\n`));
          NODE

