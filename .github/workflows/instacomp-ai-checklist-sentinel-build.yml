name: Build InstaComp AI Checklist Sentinel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/instacomp-ai/app/__init__.py"
      - "services/instacomp-ai/app/sentinel*.py"
      - "services/instacomp-ai/app/runtime_compat.py"
      - "services/instacomp-ai/app/verified_checklist_sources*.py"
      - "services/instacomp-ai/app/deterministic_checklist_recovery.py"
      - "services/instacomp-ai/app/settings_routes.py"
      - "services/instacomp-ai/scripts/install-sentinel-control.sh"
      - "services/instacomp-ai/scripts/update-live-from-main.sh"
      - "services/instacomp-ai/.env.example"
      - "services/instacomp-ai/data/sentinel-target-keys.txt"
      - "data/checklist-recovery-modern-gap-keys.txt"
      - "services/instacomp-ai/tests/test_sentinel.py"
      - "services/instacomp-ai/tests/test_sentinel_control.py"
      - "services/instacomp-ai/tests/test_runtime_compat.py"
      - "services/instacomp-ai/tests/test_verified_checklist_recovery.py"
      - "services/instacomp-ai/tests/test_deterministic_checklist_recovery.py"
      - "services/instacomp-ai/CHECKLIST_SENTINEL.md"
      - "src/lib/instacomp-sentinel-auth.ts"
      - "src/app/api/instacomp/checklist-sentinel/**"
      - "src/app/admin/page.tsx"
      - "src/app/admin/instacomp/checklist-sentinel/**"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-instacomp-sentinel-control-audit.mjs"
      - ".github/workflows/instacomp-ai-checklist-sentinel-build.yml"
  push:
    branches: [main]
    paths:
      - "services/instacomp-ai/app/__init__.py"
      - "services/instacomp-ai/app/sentinel*.py"
      - "services/instacomp-ai/app/runtime_compat.py"
      - "services/instacomp-ai/app/verified_checklist_sources*.py"
      - "services/instacomp-ai/app/deterministic_checklist_recovery.py"
      - "services/instacomp-ai/app/settings_routes.py"
      - "services/instacomp-ai/scripts/install-sentinel-control.sh"
      - "services/instacomp-ai/scripts/update-live-from-main.sh"
      - "services/instacomp-ai/.env.example"
      - "services/instacomp-ai/data/sentinel-target-keys.txt"
      - "data/checklist-recovery-modern-gap-keys.txt"
      - "services/instacomp-ai/tests/test_sentinel.py"
      - "services/instacomp-ai/tests/test_sentinel_control.py"
      - "services/instacomp-ai/tests/test_runtime_compat.py"
      - "services/instacomp-ai/tests/test_verified_checklist_recovery.py"
      - "services/instacomp-ai/tests/test_deterministic_checklist_recovery.py"
      - "services/instacomp-ai/CHECKLIST_SENTINEL.md"
      - "src/lib/instacomp-sentinel-auth.ts"
      - "src/app/api/instacomp/checklist-sentinel/**"
      - "src/app/admin/page.tsx"
      - "src/app/admin/instacomp/checklist-sentinel/**"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-instacomp-sentinel-control-audit.mjs"
      - ".github/workflows/instacomp-ai-checklist-sentinel-build.yml"

permissions:
  contents: read

concurrency:
  group: instacomp-ai-checklist-sentinel-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and certify Sentinel
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Verify macOS Sentinel scripts syntax
        run: |
          bash -n services/instacomp-ai/scripts/install-sentinel-control.sh
          bash -n services/instacomp-ai/scripts/update-live-from-main.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Install InstaComp AI dependencies
        run: python -m pip install -r services/instacomp-ai/requirements.txt

      - name: Compile Sentinel and InstaComp service
        run: python -m compileall -q services/instacomp-ai/app

      - name: Verify audited recovery target inventory
        working-directory: services/instacomp-ai
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.sentinel_sources import parse_target_key

          path = Path("../../data/checklist-recovery-modern-gap-keys.txt")
          keys = [line.strip() for line in path.read_text("utf-8").splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(keys) != 375:
              raise SystemExit(f"Expected 375 audited missing-set keys, found {len(keys)}")
          if len(set(keys)) != 375:
              raise SystemExit("Audited recovery target inventory contains duplicate keys")
          invalid = [key for key in keys if parse_target_key(key) is None]
          if invalid:
              raise SystemExit(f"Invalid recovery target keys: {invalid[:10]}")
          print("Audited recovery target inventory: 375 unique parseable exact-set keys")
          PY

      - name: Run Sentinel, control, recovery, and storage migration tests
        working-directory: services/instacomp-ai
        env:
          INSTACOMP_AI_SENTINEL_ENABLED: "false"
        run: |
          pytest -q tests/test_sentinel.py tests/test_sentinel_control.py
          pytest -q tests/test_runtime_compat.py tests/test_verified_checklist_recovery.py tests/test_deterministic_checklist_recovery.py
          pytest -q tests/test_storage_migration.py

      - name: Import FastAPI service and certify Sentinel routes
        working-directory: services/instacomp-ai
        env:
          INSTACOMP_AI_SENTINEL_ENABLED: "false"
          INSTACOMP_AI_DATABASE_PATH: "/tmp/instacomp-sentinel-smoke.sqlite3"
          INSTACOMP_AI_IMAGE_STORE_PATH: "/tmp/instacomp-sentinel-images"
          INSTACOMP_AI_BACKUP_DEFAULT_DESTINATION: "/tmp/instacomp-sentinel-backups"
        run: |
          python - <<'PY'
          from app.main import app

          paths = {route.path for route in app.routes}
          required = {
              "/v1/checklist-sentinel/status",
              "/v1/checklist-sentinel/run",
              "/v1/checklist-sentinel/refresh-targets",
              "/v1/checklist-sentinel/targets",
              "/v1/checklist-sentinel/findings",
              "/v1/checklist-sentinel/downloads",
              "/v1/checklist-sentinel/sources",
              "/v1/checklist-sentinel/registry-import-relay",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"Missing Sentinel routes: {missing}")
          print("InstaComp AI Checklist Sentinel routes certified")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Run complete Sentinel control source audit
        run: node scripts/run-instacomp-sentinel-control-audit.mjs

      - name: Lint Sentinel website files
        run: >-
          npx eslint
          src/lib/instacomp-sentinel-auth.ts
          src/app/api/instacomp/checklist-sentinel/route.ts
          src/app/api/instacomp/checklist-sentinel/import/route.ts
          src/app/admin/page.tsx
          src/app/admin/instacomp/checklist-sentinel/page.tsx
          src/app/components/AdminInstaCompMobileShortcut.tsx

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        env:
          # CI-only inert values satisfy module initialization without exposing
          # Production Supabase credentials to pull-request code. Any accidental
          # build-time data request fails closed against localhost and is handled
          # by routes such as sitemap that intentionally tolerate unavailable data.
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:9"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-sentinel-anon-placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "ci-sentinel-service-role-placeholder"
        run: npm run build
