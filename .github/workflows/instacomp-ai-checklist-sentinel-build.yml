name: Build InstaComp AI Checklist Sentinel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/instacomp-ai/app/sentinel*.py"
      - "services/instacomp-ai/app/settings_routes.py"
      - "services/instacomp-ai/scripts/install-sentinel-control.sh"
      - "services/instacomp-ai/.env.example"
      - "services/instacomp-ai/data/sentinel-target-keys.txt"
      - "services/instacomp-ai/tests/test_sentinel.py"
      - "services/instacomp-ai/tests/test_sentinel_control.py"
      - "services/instacomp-ai/CHECKLIST_SENTINEL.md"
      - "src/lib/instacomp-sentinel-auth.ts"
      - "src/app/api/instacomp/checklist-sentinel/**"
      - "src/app/admin/instacomp/checklist-sentinel/**"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-instacomp-sentinel-control-audit.mjs"
      - ".github/workflows/instacomp-ai-checklist-sentinel-build.yml"

permissions:
  contents: read

concurrency:
  group: instacomp-ai-checklist-sentinel-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and certify Sentinel
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Verify one-command macOS installer syntax
        run: bash -n services/instacomp-ai/scripts/install-sentinel-control.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Install InstaComp AI dependencies
        run: python -m pip install -r services/instacomp-ai/requirements.txt

      - name: Compile Sentinel and InstaComp service
        run: python -m compileall -q services/instacomp-ai/app

      - name: Run Sentinel, control, and storage migration tests
        working-directory: services/instacomp-ai
        env:
          INSTACOMP_AI_SENTINEL_ENABLED: "false"
        run: |
          pytest -q tests/test_sentinel.py tests/test_sentinel_control.py
          pytest -q tests/test_storage_migration.py

      - name: Import FastAPI service and certify Sentinel routes
        working-directory: services/instacomp-ai
        env:
          INSTACOMP_AI_SENTINEL_ENABLED: "false"
          INSTACOMP_AI_DATABASE_PATH: "/tmp/instacomp-sentinel-smoke.sqlite3"
          INSTACOMP_AI_IMAGE_STORE_PATH: "/tmp/instacomp-sentinel-images"
          INSTACOMP_AI_BACKUP_DEFAULT_DESTINATION: "/tmp/instacomp-sentinel-backups"
        run: |
          python - <<'PY'
          from app.main import app

          paths = {route.path for route in app.routes}
          required = {
              "/v1/checklist-sentinel/status",
              "/v1/checklist-sentinel/run",
              "/v1/checklist-sentinel/refresh-targets",
              "/v1/checklist-sentinel/targets",
              "/v1/checklist-sentinel/findings",
              "/v1/checklist-sentinel/downloads",
              "/v1/checklist-sentinel/sources",
              "/v1/checklist-sentinel/registry-import-relay",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"Missing Sentinel routes: {missing}")
          print("InstaComp AI Checklist Sentinel routes certified")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Run complete Sentinel control source audit
        run: node scripts/run-instacomp-sentinel-control-audit.mjs

      - name: Lint Sentinel website files
        run: >-
          npx eslint
          src/lib/instacomp-sentinel-auth.ts
          src/app/api/instacomp/checklist-sentinel/route.ts
          src/app/api/instacomp/checklist-sentinel/import/route.ts
          src/app/admin/instacomp/checklist-sentinel/page.tsx
          src/app/components/AdminInstaCompMobileShortcut.tsx

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
