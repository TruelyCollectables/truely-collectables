name: Apply Admin Session Secret Hardening

on:
  push:
    branches:
      - agent/admin-session-secret-fail-closed-20260726
    paths:
      - scripts/apply-admin-session-secret-hardening.mjs
      - .github/workflows/apply-admin-session-secret-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'TruelyCollectables'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-session-secret-fail-closed-20260726
          fetch-depth: 0

      - name: Apply exact admin-session transformation
        run: node scripts/apply-admin-session-secret-hardening.mjs

      - name: Validate patch shape
        run: git diff --check

      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet -- src/lib/admin-session.ts src/app/admin/launch-readiness/page.tsx src/app/api/admin/launch-readiness/route.ts; then
            echo "No admin-session hardening changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/admin-session.ts src/app/admin/launch-readiness/page.tsx src/app/api/admin/launch-readiness/route.ts
          git commit -m "Require independent admin session secret"
          git push origin HEAD:agent/admin-session-secret-fail-closed-20260726
