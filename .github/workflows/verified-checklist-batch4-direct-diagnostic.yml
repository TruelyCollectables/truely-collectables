name: Verified Checklist Batch 4 Direct Diagnostic

on:
  push:
    branches: [fix/direct-checklist-registry-recovery-20260809]
    paths:
      - ".github/workflows/verified-checklist-batch4-direct-diagnostic.yml"

permissions:
  contents: read

env:
  CHECKLIST_RECOVERY_BATCH_INDEX: "4"
  CHECKLIST_RECOVERY_BATCH_SIZE: "15"
  CHECKLIST_RECOVERY_WORKERS: "2"
  CHECKLIST_RECOVERY_APPLY: "false"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --user --quiet openpyxl xlrd
      - name: Prevent browser masking for literal downloadable files
        shell: python3 {0}
        run: |
          from pathlib import Path
          path = Path('scripts/run-verified-checklist-recovery-production.mjs')
          text = path.read_text()
          old = '  const browserCaptureHost = host.endsWith("beckett.com") || host.endsWith("checklistinsider.com");\n  if (!browserCaptureHost) return false;'
          new = '  const directFile = /\\.(?:pdf|csv|tsv|txt|xls|xlsx)(?:$|[?#])/i.test(String(source.url || ""));\n  const browserCaptureHost = !directFile && (host.endsWith("beckett.com") || host.endsWith("checklistinsider.com"));\n  if (!browserCaptureHost) return false;'
          if old not in text:
              raise SystemExit('capture guard anchor missing')
          path.write_text(text.replace(old, new, 1))
      - name: Run Batch 4 direct-file diagnostic
        run: node --import tsx scripts/run-verified-checklist-recovery-production.mjs
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-checklist-batch4-direct-diagnostic
          path: evidence/verified-checklist-recovery/
          retention-days: 7
