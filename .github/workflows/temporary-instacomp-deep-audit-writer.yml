name: Temporary InstaComp Deep Audit Writer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-instacomp-deep-audit-writer.yml"
      - "scripts/apply-instacomp-deep-audit-fixes.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-instacomp-deep-audit-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  harden-test-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic deep-audit fixes
        run: |
          set -euo pipefail
          echo "Applying audited source patch set v3"
          python -m py_compile scripts/apply-instacomp-deep-audit-fixes.py
          python scripts/apply-instacomp-deep-audit-fixes.py
          python scripts/check-instacomp-control-characters.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        run: |
          set -euo pipefail
          node --import tsx scripts/run-instacomp-live-pipeline-regressions.ts
          node --import tsx scripts/run-instacomp-provider-safety-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-batch-drop-regressions.ts

      - name: Lint changed runtime files
        run: |
          npx eslint \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/app/api/instacomp/live-scan/route.ts \
            src/app/api/account/seller/inventory/instacomp/route.ts \
            src/lib/instacomp-live-pipeline.ts \
            src/lib/instacomp-exact-market-provider.ts \
            src/lib/instacomp-openai-web-market-provider.ts \
            src/lib/instacomp-comp-visual-verification.ts \
            src/lib/instacomp-image-orientation.ts \
            src/lib/instacomp-provider-safety.ts \
            scripts/run-instacomp-live-pipeline-regressions.ts \
            scripts/run-instacomp-provider-safety-regressions.ts \
            scripts/run-instacomp-batch-001-live-market-proof.ts

      - name: Build production application
        run: npm run build

      - name: Commit hardened source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/instacomp-ebay-25-benchmark.yml \
            .github/workflows/instacomp-live-pipeline.yml \
            .github/workflows/temporary-instacomp-exact-market-proof-main.yml \
            scripts/run-instacomp-final-materialization.py \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/app/api/instacomp/live-scan/route.ts \
            src/app/api/account/seller/inventory/instacomp/route.ts \
            src/lib/instacomp-exact-market-provider.ts \
            src/lib/instacomp-openai-web-market-provider.ts \
            src/lib/instacomp-comp-visual-verification.ts \
            src/lib/instacomp-image-orientation.ts
          git diff --cached --check
          git diff --cached --quiet && { echo "Deep-audit source already materialized"; exit 0; }
          git commit -m "Apply InstaComp deep-audit runtime hardening"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
