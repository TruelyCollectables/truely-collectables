name: InstaComp Frozen Sonia Memory Repair 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-frozen-sonia-memory-repair-20260810.yml"
      - "src/app/api/instacomp/acceptance-frozen-sonia-memory-repair/route.ts"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: instacomp-production-acceptance-global
  cancel-in-progress: false

env:
  PROOF_MAIN_SHA: 2f6599cbd9a190a02269da4a80064156c48e8a0a
  EXPECTED_BRANCH: ops/instacomp-frozen-sonia-memory-repair-20260810
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  REGISTRY_PROOF_ARTIFACT_ID: "9069262233"
  REGISTRY_PROOF_ARTIFACT_DIGEST: sha256:bcc7aee63f338ad96b6feab7156a4d1ce4c1701cc86375adc6380771a7a78a23
  FROZEN_IMAGE_ARTIFACT_ID: "8994498762"
  SONIA_INVENTORY_ID: ef0e06a3-a6de-4242-8c52-52b420185850
  SONIA_FRONT_SHA256: eaacec37493b419f1d397df739aedd9df218639ded876c481b2fb28b2b3eb2b1
  SONIA_BACK_SHA256: 3ecd070456e09342ed83ca88193ed2d029cd8a77ed5b2e2ae1ce443e9866978c
  SONIA_REGISTRY_ID: 2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f
  SONIA_REGISTRY_FINGERPRINT: 4366f96b6cf8b136e5ae4da70c35539d56e1793de0a42bcccbf970a892791e59
  EVIDENCE_DIR: evidence/instacomp-frozen-sonia-memory-repair-20260810
  TEMP_DIR: /tmp/instacomp-frozen-sonia-memory-repair-20260810

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Lock exact main lineage and bounded operations scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR/proof" "$TEMP_DIR/frozen"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          changed="$(git diff --name-only origin/main HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/instacomp-frozen-sonia-memory-repair-20260810.yml' \
            'src/app/api/instacomp/acceptance-frozen-sonia-memory-repair/route.ts' | sort)"
          test "$changed" = "$expected"
          grep -Fq 'FROZEN_SONIA_MEMORY_REPAIR_FAILED' src/app/api/instacomp/acceptance-frozen-sonia-memory-repair/route.ts
          grep -Fq 'acceptance_token_rejected' src/app/api/instacomp/acceptance-frozen-sonia-memory-repair/route.ts
          grep -Fq 'FROZEN_IMAGE_HASH_MISMATCH' src/app/api/instacomp/acceptance-frozen-sonia-memory-repair/route.ts
          grep -Fq 'local_key_exposed: false' src/app/api/instacomp/acceptance-frozen-sonia-memory-repair/route.ts
          grep -Fq 'nothing_published: true' src/app/api/instacomp/acceptance-frozen-sonia-memory-repair/route.ts
          printf '{"operationsSource":"%s","proofMain":"%s","registryProofArtifactId":%s,"frozenImageArtifactId":%s,"temporaryRoute":"/api/instacomp/acceptance-frozen-sonia-memory-repair","registryMutation":false,"inventoryMutation":false,"pricingMutation":false,"publishingMutation":false,"macRuntimeSourceMutation":false,"localKeyReadableByRunner":false}\n' \
            "$(git rev-parse HEAD)" "$PROOF_MAIN_SHA" "$REGISTRY_PROOF_ARTIFACT_ID" "$FROZEN_IMAGE_ARTIFACT_ID" > "$EVIDENCE_DIR/source-lock.json"
          git diff --check origin/main HEAD

      - name: Compile temporary route before Production deployment
        shell: bash
        run: |
          set -euo pipefail
          npm ci >/dev/null
          npx tsc --noEmit

      - name: Download and verify immutable Registry proof receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$TEMP_DIR/registry-proof-artifact.json"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REGISTRY_PROOF_ARTIFACT_ID}" > "$metadata"
          actual_digest="$(node -e 'const b=require(process.argv[1]);process.stdout.write(String(b.digest||""))' "$metadata")"
          test "$actual_digest" = "$REGISTRY_PROOF_ARTIFACT_DIGEST"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REGISTRY_PROOF_ARTIFACT_ID}/zip" > "$TEMP_DIR/registry-proof.zip"
          unzip -q "$TEMP_DIR/registry-proof.zip" -d "$TEMP_DIR/proof"
          SONIA_REGISTRY_ID="$SONIA_REGISTRY_ID" SONIA_REGISTRY_FINGERPRINT="$SONIA_REGISTRY_FINGERPRINT" PROOF_MAIN_SHA="$PROOF_MAIN_SHA" node - "$TEMP_DIR/proof" <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const root=process.argv[2];
          const read=name=>JSON.parse(fs.readFileSync(path.join(root,name),'utf8'));
          const source=read('source-lock.json');
          const proof=read('registry-proof.json');
          const final=read('final.json');
          const cleanup=read('cleanup-proof.json');
          if(source.proofMain!==process.env.PROOF_MAIN_SHA) throw new Error(`proof main=${source.proofMain}`);
          if(proof.status!=='passed'||proof.immutableFrozenTruthMatched!==true) throw new Error('Registry proof not passed/frozen-bound');
          if(proof.registryIdentityId!==process.env.SONIA_REGISTRY_ID) throw new Error(`Registry UUID=${proof.registryIdentityId}`);
          if(String(proof.registryFingerprintSha256||'').toLowerCase()!==process.env.SONIA_REGISTRY_FINGERPRINT) throw new Error(`Registry fingerprint=${proof.registryFingerprintSha256}`);
          if(proof.candidateCount!==1||proof.lockedFields?.parallel!=='Base') throw new Error('Registry proof did not lock one Base candidate');
          if(final.status!=='passed'||final.registryExact!==true||final.temporaryCredentialRemoved!==true||final.macMutation!==false||final.nothingPublished!==true) throw new Error('Final Registry proof marker invalid');
          if(cleanup.clean!==true||cleanup.acceptanceCredentialPresent!==false) throw new Error('Registry proof cleanup not clean');
          console.log(JSON.stringify({status:'passed',registryIdentityId:proof.registryIdentityId,registryFingerprintSha256:proof.registryFingerprintSha256,candidateCount:proof.candidateCount,temporaryCredentialRemoved:true},null,2));
          NODE
          cp "$TEMP_DIR/proof/registry-proof.json" "$EVIDENCE_DIR/consumed-registry-proof.json"

      - name: Download immutable frozen images and prove Sonia raw hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_IMAGE_ARTIFACT_ID}/zip" > "$TEMP_DIR/frozen.zip"
          unzip -q "$TEMP_DIR/frozen.zip" -d "$TEMP_DIR/frozen"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          test -f "$front" && test -f "$back"
          test "$(sha256sum "$front" | awk '{print $1}')" = "$SONIA_FRONT_SHA256"
          test "$(sha256sum "$back" | awk '{print $1}')" = "$SONIA_BACK_SHA256"
          cp "$TEMP_DIR/frozen/receipt.json" "$EVIDENCE_DIR/frozen-image-receipt.json"
          printf '{"frontSha256":"%s","backSha256":"%s","exact":true}\n' "$SONIA_FRONT_SHA256" "$SONIA_BACK_SHA256" > "$EVIDENCE_DIR/sonia-raw-image-proof.json"

      - name: Link Production project and prove stale acceptance credential absent
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          list="$TEMP_DIR/env-before.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          if grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"; then
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          fi
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"

      - name: Provision isolated acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          secret="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy bounded server-side repair source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$EVIDENCE_DIR/repair-deploy.log"
          touch "$TEMP_DIR/repair-deployed"

      - name: Execute exact frozen Sonia correction through server-side sensitive key
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$token"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          out="$EVIDENCE_DIR/repair-result.json"
          code="$(curl -sS --max-time 300 -o "$out" -w '%{http_code}' -X POST \
            -H "x-tcos-instacomp-service-token: $token" \
            -F "front=@${front};type=image/jpeg" \
            -F "back=@${back};type=image/jpeg" \
            "$PRODUCTION_ORIGIN/api/instacomp/acceptance-frozen-sonia-memory-repair?ts=$(date +%s)")"
          test "$code" = "200"
          SONIA_REGISTRY_ID="$SONIA_REGISTRY_ID" SONIA_REGISTRY_FINGERPRINT="$SONIA_REGISTRY_FINGERPRINT" node - "$out" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(b.ok!==true) throw new Error(`ok=${b.ok} code=${b.code} stage=${b.stage} error=${b.error}`);
          if(b.registry_proof?.exact_match!==true||b.registry_proof?.candidate_count!==1) throw new Error('route Registry proof not exact');
          if(b.registry_proof?.identity_id!==process.env.SONIA_REGISTRY_ID) throw new Error(`Registry UUID=${b.registry_proof?.identity_id}`);
          if(String(b.registry_proof?.fingerprint_sha256||'').toLowerCase()!==process.env.SONIA_REGISTRY_FINGERPRINT) throw new Error(`Registry fingerprint=${b.registry_proof?.fingerprint_sha256}`);
          if(b.mac_readiness?.database!=='ready'||b.mac_readiness?.central_registry!=='ready') throw new Error('Mac read-only auth/readiness failed');
          if(!b.correction||typeof b.correction.performed!=='boolean') throw new Error('correction receipt missing');
          if(b.analyze?.http_status!==200||b.analyze?.status!=='trusted_memory_match'||b.analyze?.match_source!=='exact_image_pair') throw new Error(`analyze=${JSON.stringify(b.analyze)}`);
          if(b.analyze?.pricing_allowed!==true||b.analyze?.learning_allowed!==true||b.analyze?.local_vision_present!==true) throw new Error('post-correction trust/witness gate failed');
          if(b.analyze?.trusted_identity?.player!=='Sonia Citron'||String(b.analyze?.trusted_identity?.card_number||'')!=='122'||b.analyze?.trusted_identity?.parallel!=='Base') throw new Error('post-correction identity mismatch');
          if(b.analyze?.checklist?.outcome!=='exact_match'||b.analyze?.checklist?.identity_id!==process.env.SONIA_REGISTRY_ID) throw new Error('post-correction Registry identity mismatch');
          const receipts=Array.isArray(b.analyze?.checklist?.source_receipts)?b.analyze.checklist.source_receipts:[];
          if(!receipts.includes(`registry_fingerprint:${process.env.SONIA_REGISTRY_FINGERPRINT}`)) throw new Error('post-correction Registry fingerprint receipt missing');
          if(b.local_url_exposed!==false||b.local_key_exposed!==false||b.mac_runtime_source_changed!==false||b.registry_data_changed!==false||b.inventory_changed!==false||b.pricing_changed!==false||b.nothing_published!==true) throw new Error('safety receipt failed');
          console.log(JSON.stringify({status:'passed',correctionPerformed:b.correction.performed,correction:b.correction,analyze:b.analyze,localKeyExposed:b.local_key_exposed,nothingPublished:b.nothing_published},null,2));
          NODE
          touch "$TEMP_DIR/repair-passed"

      - name: Remove isolated acceptance credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          list="$TEMP_DIR/env-after.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"
          touch "$TEMP_DIR/token-removed"

      - name: Clean redeploy exact current main and remove temporary route
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/repair-deployed" ]; then exit 0; fi
          test -f "$TEMP_DIR/token-removed"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          git checkout --detach origin/main
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$EVIDENCE_DIR/clean-deploy.log"
          removed=0
          for attempt in $(seq 1 12); do
            code="$(curl -sS --max-time 30 -o "$TEMP_DIR/route-removed-body" -w '%{http_code}' -X POST "$PRODUCTION_ORIGIN/api/instacomp/acceptance-frozen-sonia-memory-repair?removed=$attempt&ts=$(date +%s)")"
            if [ "$code" = "404" ]; then removed=1; break; fi
            sleep 3
          done
          test "$removed" = "1"
          printf '{"clean":true,"deployedMain":"%s","acceptanceCredentialPresent":false,"temporaryRouteRemoved":true}\n' "$PROOF_MAIN_SHA" > "$EVIDENCE_DIR/cleanup-proof.json"
          touch "$TEMP_DIR/route-removed"

      - name: Final repair marker
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          if [ -f "$TEMP_DIR/repair-passed" ] && [ -f "$TEMP_DIR/token-removed" ] && [ -f "$TEMP_DIR/route-removed" ]; then
            printf '{"status":"passed","immutableRegistryProofConsumed":true,"rawFrozenImagesProved":true,"serverSideSensitiveKeyOnly":true,"directMacAnalyze200":true,"exactImagePairMemory":true,"temporaryCredentialRemoved":true,"temporaryRouteRemoved":true,"nothingPublished":true}\n' > "$EVIDENCE_DIR/final.json"
          else
            printf '{"status":"incomplete_or_failed","repairPassed":%s,"temporaryCredentialRemoved":%s,"temporaryRouteRemoved":%s,"nothingPublished":true}\n' \
              "$([ -f "$TEMP_DIR/repair-passed" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/token-removed" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/route-removed" ] && echo true || echo false)" > "$EVIDENCE_DIR/final.json"
          fi

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-frozen-sonia-memory-repair-20260810
          path: evidence/instacomp-frozen-sonia-memory-repair-20260810
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR" .env.local .env.production.local
