name: InstaComp Sentinel PSA First-Party

on:
  push:
    branches:
      - agent/sentinel-psa-first-party
    paths:
      - "scripts/patch-sentinel-psa-first-party.py"
      - ".github/workflows/instacomp-sentinel-psa-first-party.yml"
      - "services/instacomp-ai/app/sentinel_sources.py"
      - "services/instacomp-ai/tests/test_sentinel_psa_sources.py"
      - "src/lib/checklist-registry/psa-apr-html.ts"
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch-sentinel-psa-first-party.py"
      - ".github/workflows/instacomp-sentinel-psa-first-party.yml"
      - "services/instacomp-ai/app/sentinel_sources.py"
      - "services/instacomp-ai/tests/test_sentinel_psa_sources.py"
      - "src/lib/checklist-registry/psa-apr-html.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-sentinel-psa-first-party-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: agent/sentinel-psa-first-party

jobs:
  apply-test-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Apply PSA-first Sentinel patch
        run: |
          set -euo pipefail
          python3 scripts/patch-sentinel-psa-first-party.py
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Install InstaComp AI dependencies
        run: pip install -r services/instacomp-ai/requirements.txt

      - name: Compile Sentinel
        working-directory: services/instacomp-ai
        run: python -m compileall -q app

      - name: Run PSA Sentinel and Registry recovery-gate tests
        working-directory: services/instacomp-ai
        run: pytest -q tests/test_sentinel_psa_sources.py tests/test_sentinel_registry_recovery_gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run PSA Registry adapter simulations
        run: node --import tsx scripts/run-psa-apr-checklist-adapter-simulations.ts

      - name: Typecheck integrated Sentinel/Registry path
        run: npx tsc --noEmit

      - name: Persist tested Sentinel runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/instacomp-ai/app/sentinel_sources.py \
            services/instacomp-ai/tests/test_sentinel_psa_sources.py \
            src/lib/checklist-registry/psa-apr-html.ts
          if ! git diff --cached --quiet; then
            git commit -m "Make Sentinel search PSA before SERP [skip ci]"
            git push origin "HEAD:$EXPECTED_BRANCH"
          fi
