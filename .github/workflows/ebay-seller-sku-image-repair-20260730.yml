name: eBay Seller SKU Image Repair 20260730

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebay-seller-sku-image-repair-20260730
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/ebay-seller-sku-image-repair-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ebay-seller-sku-image-repair-20260730
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare protected seller-SKU repair route
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ebay-seller-sku-image-repair"
          mkdir -p "$work" .vercel src/app/api/internal/ebay-seller-sku-image-repair
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          cp ops/templates/ebay-seller-sku-image-repair-route.txt src/app/api/internal/ebay-seller-sku-image-repair/route.ts
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" > "$work/token"
          echo "::add-mask::$token"
          printf '%s\n' "$token" | npx vercel@56.2.0 env add EBAY_SELLER_SKU_IMAGE_REPAIR_TOKEN_20260730 production --force --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx tsc --noEmit --pretty false

      - name: Deploy repair runtime
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ebay-seller-sku-image-repair"
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee "$work/deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$work/deploy.log" | tail -1)"
          test -n "$url"
          printf '%s' "$url" > "$work/url"

      - name: Resolve actual seller SKUs and pull every inventory image
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ebay-seller-sku-image-repair"
          token="$(cat "$work/token")"
          url="$(cat "$work/url")"
          response="$work/response.json"
          status="$(curl -sS --max-time 330 -H "x-tcos-repair-token: $token" -X POST -o "$response" -w '%{http_code}' "$url/api/internal/ebay-seller-sku-image-repair?run=${GITHUB_RUN_ID}" || true)"
          echo "repair_status=$status"
          cat "$response"
          echo
          test "$status" = "200"
          node -e 'const r=require(process.argv[1]); const s={sellerPages:r.sellerPages,sellerListings:r.sellerListings,requested:r.requested,foundProducts:r.foundProducts,repaired:r.repaired,stillMissingCount:r.stillMissingCount,stillMissing:r.stillMissing,results:r.results.map(x=>({productId:x.productId,title:x.title,sellerListingFound:x.sellerListingFound,sellerSku:x.sellerSku,sellerPictureCount:x.sellerPictureCount,inventoryApiStatus:x.inventoryApiStatus,inventoryApiCount:x.inventoryApiCount,finalImageCount:x.finalImageCount,changedRows:x.changedRows,hasBack:x.hasBack,inventoryApiError:x.inventoryApiError,error:x.error||null}))}; console.log("SELLER_SKU_IMAGE_REPAIR_SUMMARY="+JSON.stringify(s));' "$response"

      - name: Restore clean production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env rm EBAY_SELLER_SKU_IMAGE_REPAIR_TOKEN_20260730 production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/ebay-seller-sku-image-repair"
