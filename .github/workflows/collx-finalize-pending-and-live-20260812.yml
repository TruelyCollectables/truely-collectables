name: CollX Finalize Pending And Live 20260812

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/collx-finalize-pending-and-live-20260812.yml'

permissions:
  contents: read

concurrency:
  group: collx-finalize-pending-and-live-20260812
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rfdzsoykhnngzdnvzlhz
      STORE_ID: 00000000-0000-4000-8000-000000000001
    steps:
      - name: Park missing-image cards and certify all remaining CollX inventory active
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time

          token=os.environ['SUPABASE_ACCESS_TOKEN']
          ref=os.environ['PROJECT_REF']
          store=os.environ['STORE_ID']
          url=f'https://api.supabase.com/v1/projects/{ref}/database/query'

          def sql(q, read_only, timeout=75, retries=6):
              last=''
              for i in range(retries):
                  f=tempfile.NamedTemporaryFile(delete=False); f.close()
                  p=subprocess.run([
                      'curl','-sS','--max-time',str(timeout),'-o',f.name,'-w','%{http_code}','-X','POST',url,
                      '-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json',
                      '--data-binary',json.dumps({'query':q,'parameters':[],'read_only':read_only})
                  ],capture_output=True,text=True)
                  raw=open(f.name).read(); os.unlink(f.name)
                  code=(p.stdout or '000')[-3:]
                  if code in ('200','201'):
                      return json.loads(raw)
                  last=f'HTTP {code}: {raw[:1200]}'
                  if code in ('000','429','500','502','503','504','522','524','544') and i+1<retries:
                      time.sleep(2*(i+1)); continue
                  break
              raise SystemExit(last)

          base=f"p.store_id='{store}'::uuid and p.sku>='COLLX-' and p.sku<'COLLY' and p.ebay_item_id is null"

          pre=sql(f'''select
            count(*) filter(where p.archived_at is null and p.quantity>0 and p.price<=0)::int bad_price_rows,
            count(*) filter(where p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is null)::int missing_front_rows,
            count(*) filter(where p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is not null)::int live_eligible_rows
            from public.products p where {base};''', True)
          print('COLLX_FINALIZE_PRE='+json.dumps(pre,sort_keys=True))
          r=(pre or [{}])[0]
          if [int(r.get('bad_price_rows') or 0),int(r.get('missing_front_rows') or 0),int(r.get('live_eligible_rows') or 0)] != [127,5,5283]:
              raise SystemExit('Safety stop: current CollX counts changed; no mutation performed')

          park=sql(f'''with target as (
            select p.id,p.sku from public.products p
            where {base} and p.archived_at is null and p.quantity>0 and (
              p.price<=0 or (p.price>0 and nullif(btrim(p.image_url),'') is null)
            )
          ), upd as (
            update public.inventory_items ii set status='draft',updated_at=now()
            from target t
            where ii.store_id='{store}'::uuid
              and (ii.legacy_product_id=t.id or (ii.legacy_product_id is null and ii.sku=t.sku))
            returning ii.id
          ) select count(*)::int rows_updated from upd;''', False)
          print('COLLX_FINALIZE_PENDING_UPDATE='+json.dumps(park,sort_keys=True))

          activate=sql(f'''with target as (
            select p.id,p.sku from public.products p
            where {base} and p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is not null
          ), upd as (
            update public.inventory_items ii set status='active',updated_at=now()
            from target t
            where ii.store_id='{store}'::uuid
              and (ii.legacy_product_id=t.id or (ii.legacy_product_id is null and ii.sku=t.sku))
            returning ii.id
          ) select count(*)::int rows_updated from upd;''', False)
          print('COLLX_FINALIZE_ACTIVE_UPDATE='+json.dumps(activate,sort_keys=True))

          metrics=sql(f'''select count(*)::int total_rows,
            coalesce(sum(greatest(p.quantity,0)),0)::int total_units,
            count(*) filter(where p.archived_at is not null)::int archived_rows,
            coalesce(sum(greatest(p.quantity,0)) filter(where p.archived_at is not null),0)::int archived_units,
            count(*) filter(where p.archived_at is null and p.quantity>0 and p.price<=0)::int bad_price_rows,
            count(*) filter(where p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is null)::int missing_front_rows,
            count(*) filter(where p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is not null)::int live_eligible_rows,
            coalesce(sum(p.quantity) filter(where p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is not null),0)::int live_eligible_units,
            count(*) filter(where p.archived_at is null and p.quantity<=0)::int zero_qty_rows
            from public.products p where {base};''', True)
          print('COLLX_FINALIZE_METRICS='+json.dumps(metrics,sort_keys=True))
          m=(metrics or [{}])[0]
          expected={'total_rows':6155,'total_units':6315,'archived_rows':740,'archived_units':0,'bad_price_rows':127,'missing_front_rows':5,'live_eligible_rows':5283,'live_eligible_units':6183,'zero_qty_rows':0}
          bad=[f'{k}={m.get(k)} expected {v}' for k,v in expected.items() if int(m.get(k) or 0)!=v]
          if bad: raise SystemExit('Product verification failed: '+'; '.join(bad))

          q1=sql(f'''select count(distinct p.id)::int n from public.products p join public.inventory_items ii
            on ii.store_id=p.store_id and (ii.legacy_product_id=p.id or (ii.legacy_product_id is null and ii.sku=p.sku))
            where p.store_id='{store}'::uuid and p.sku>='COLLX-' and p.sku<'COLLY' and p.ebay_item_id is null
              and p.archived_at is null and p.quantity>0 and p.price<=0 and ii.status='draft';''', True)
          q2=sql(f'''select count(distinct p.id)::int n from public.products p join public.inventory_items ii
            on ii.store_id=p.store_id and (ii.legacy_product_id=p.id or (ii.legacy_product_id is null and ii.sku=p.sku))
            where p.store_id='{store}'::uuid and p.sku>='COLLX-' and p.sku<'COLLY' and p.ebay_item_id is null
              and p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is null and ii.status='draft';''', True)
          q3=sql(f'''select count(distinct p.id)::int n from public.products p join public.inventory_items ii
            on ii.store_id=p.store_id and (ii.legacy_product_id=p.id or (ii.legacy_product_id is null and ii.sku=p.sku))
            where p.store_id='{store}'::uuid and p.sku>='COLLX-' and p.sku<'COLLY' and p.ebay_item_id is null
              and p.archived_at is null and p.quantity>0 and p.price>0 and nullif(btrim(p.image_url),'') is not null and ii.status='active';''', True)
          counts={'bad_price_draft':int((q1 or [{}])[0].get('n') or 0),'missing_front_draft':int((q2 or [{}])[0].get('n') or 0),'live_active':int((q3 or [{}])[0].get('n') or 0)}
          print('COLLX_FINALIZE_STATUS_COUNTS='+json.dumps(counts,sort_keys=True))
          if counts != {'bad_price_draft':127,'missing_front_draft':5,'live_active':5283}:
              raise SystemExit('Status verification failed: '+json.dumps(counts,sort_keys=True))
          print('COLLX_FINALIZE=SUCCESS')
          PY
