name: Authorized Full eBay Catalog Sync Verification 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-full-ebay-catalog-sync-verification-20260728.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-full-ebay-catalog-sync-verification
  cancel-in-progress: true

jobs:
  sync-and-verify-production:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/verify-full-ebay-catalog-sync-20260728')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
      PRODUCTION_SOURCE_SHA: 46317364f71c46ca4ae17fa1625cf1d7d3229ac7
    steps:
      - name: Check out exact deployed production source
        uses: actions/checkout@v4
        with:
          ref: 46317364f71c46ca4ae17fa1625cf1d7d3229ac7
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Pull secured Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .sync-private sync-verification/storefront
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" \
              > .sync-private/vercel-link.log 2>&1
          fi
          npx vercel@56.2.0 pull \
            --yes \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            > .sync-private/vercel-pull.log 2>&1
          env_file=''
          for candidate in .vercel/.env.production.local .env.production.local .env.local; do
            if [ -f "$candidate" ]; then env_file="$candidate"; break; fi
          done
          test -n "$env_file"
          printf '%s\n' "$env_file" > .sync-private/env-file.txt

      - name: Run fresh authoritative eBay pull and converge inventory
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(cat .sync-private/env-file.txt)"
          set -a
          # shellcheck disable=SC1090
          . "$env_file"
          set +a
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY EBAY_CLIENT_ID EBAY_CLIENT_SECRET; do
            test -n "${!key:-}"
          done
          node --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { runEbayAuthoritativeStoreSync } from './src/lib/ebay-authoritative-store-sync.ts';
          import { syncEbayAllListingImages } from './src/lib/ebay-all-image-sync.ts';
          import { syncRecentLegacyEbayQuantities } from './src/lib/ebay-fixed-price-backfill.ts';
          import { createSupabaseServerClient } from './src/lib/supabase-server.ts';
          import { getActiveStoreId } from './src/lib/stores.ts';

          const outputDir = 'sync-verification';
          fs.mkdirSync(outputDir, { recursive: true });
          const supabase = createSupabaseServerClient({ admin: true });
          const storeId = getActiveStoreId();
          const compactAuthoritative = (value) => value ? ({
            remoteFixedPriceTotal: value.remoteFixedPriceTotal,
            pagesRead: value.pagesRead,
            cycleComplete: value.cycleComplete,
            eligibleCollectibles: value.eligibleCollectibles,
            skippedNonCollectibles: value.skippedNonCollectibles,
            inserted: value.inserted,
            updated: value.updated,
            unchanged: value.unchanged,
            deactivated: value.deactivated,
            failed: value.failed,
            localLinkedBefore: value.localLinkedBefore,
            localLinkedAfter: value.localLinkedAfter,
            errorSample: (value.errors || []).slice(0, 20),
          }) : null;
          const compactImages = (value) => value ? ({
            checked: value.checked,
            updated: value.updated,
            imagesAdded: value.imagesAdded,
            imagesRemoved: value.imagesRemoved,
            pagesRead: value.pagesRead,
            cycleComplete: value.cycleComplete,
            remainingCandidates: value.remainingCandidates,
            failed: (value.errors || []).length,
            errorSample: (value.errors || []).slice(0, 20),
          }) : null;
          const compactQuantities = (value) => value ? ({
            checked: value.checked,
            pushedToEbay: value.pushedToEbay,
            endedOnEbay: value.endedOnEbay,
            reducedLocally: value.reducedLocally,
            unchanged: value.unchanged,
            failed: value.failed,
            errorSample: (value.errors || []).slice(0, 20),
          }) : null;
          const write = (name, value) => fs.writeFileSync(`${outputDir}/${name}`, `${JSON.stringify(value, null, 2)}\n`);

          console.log('[sync] Starting full authoritative apply with ended-listing deactivation enabled.');
          const first = await runEbayAuthoritativeStoreSync({
            supabase,
            storeId,
            mode: 'apply',
            deactivateEnded: true,
          });
          write('authoritative-first.json', compactAuthoritative(first));
          console.log(`[sync] first=${JSON.stringify(compactAuthoritative(first))}`);
          if (!first.cycleComplete) throw new Error('The first authoritative eBay page cycle did not complete.');
          if (Number(first.failed || 0) !== 0) throw new Error(`The first authoritative pass had ${first.failed} failures.`);
          if (Number(first.remoteFixedPriceTotal || 0) < 1) throw new Error('eBay returned no active fixed-price inventory.');
          if (Number(first.eligibleCollectibles || 0) + Number(first.skippedNonCollectibles || 0) !== Number(first.remoteFixedPriceTotal || 0)) {
            throw new Error('The eBay active-listing total did not reconcile to eligible plus intentionally skipped inventory.');
          }

          const imagePasses = [];
          let finalImages = null;
          for (let pass = 1; pass <= 10; pass += 1) {
            const result = await syncEbayAllListingImages({ supabase, storeId });
            const compact = compactImages(result);
            imagePasses.push({ pass, ...compact });
            write(`images-pass-${String(pass).padStart(2, '0')}.json`, compact);
            console.log(`[images] pass=${pass} ${JSON.stringify(compact)}`);
            if (!result.cycleComplete) throw new Error(`Image pass ${pass} did not read every eBay page.`);
            if ((result.errors || []).length) throw new Error(`Image pass ${pass} had ${result.errors.length} failures.`);
            finalImages = result;
            if (Number(result.remainingCandidates || 0) === 0) break;
          }
          if (!finalImages || Number(finalImages.remainingCandidates || 0) !== 0) {
            throw new Error('Image synchronization did not converge to zero remaining candidates.');
          }

          const quantities = await syncRecentLegacyEbayQuantities({ supabase, storeId });
          write('quantity-reconciliation.json', compactQuantities(quantities));
          console.log(`[quantities] ${JSON.stringify(compactQuantities(quantities))}`);
          if (Number(quantities.failed || 0) !== 0) throw new Error(`Quantity reconciliation had ${quantities.failed} failures.`);

          console.log('[sync] Starting second authoritative apply to prove convergence against a new eBay read.');
          const final = await runEbayAuthoritativeStoreSync({
            supabase,
            storeId,
            mode: 'apply',
            deactivateEnded: true,
          });
          write('authoritative-final.json', compactAuthoritative(final));
          console.log(`[sync] final=${JSON.stringify(compactAuthoritative(final))}`);
          if (!final.cycleComplete) throw new Error('The final authoritative eBay page cycle did not complete.');
          if (Number(final.failed || 0) !== 0) throw new Error(`The final authoritative pass had ${final.failed} failures.`);
          if (Number(final.inserted || 0) !== 0 || Number(final.updated || 0) !== 0 || Number(final.deactivated || 0) !== 0) {
            throw new Error(`Inventory did not converge cleanly: inserted=${final.inserted}, updated=${final.updated}, deactivated=${final.deactivated}.`);
          }
          if (Number(final.unchanged || 0) !== Number(final.eligibleCollectibles || 0)) {
            throw new Error(`Final unchanged count ${final.unchanged} did not equal eligible eBay inventory ${final.eligibleCollectibles}.`);
          }

          const activeLinkedResult = await supabase
            .from('products')
            .select('id', { count: 'exact', head: true })
            .eq('store_id', storeId)
            .gt('quantity', 0)
            .not('ebay_item_id', 'is', null);
          if (activeLinkedResult.error) throw activeLinkedResult.error;
          const activeLinkedProducts = Number(activeLinkedResult.count || 0);
          if (activeLinkedProducts !== Number(final.eligibleCollectibles || 0)) {
            throw new Error(`Active linked product count ${activeLinkedProducts} did not equal current eligible eBay inventory ${final.eligibleCollectibles}.`);
          }

          const summary = {
            schema: 'truelycollectables.freshEbayInventorySync.v1',
            generatedAt: new Date().toISOString(),
            productionSourceSha: process.env.PRODUCTION_SOURCE_SHA,
            success: true,
            first: compactAuthoritative(first),
            imagePasses,
            quantities: compactQuantities(quantities),
            final: compactAuthoritative(final),
            databaseAudit: { activeLinkedProducts },
          };
          write('fresh-sync-summary.json', summary);
          console.log(`[sync] COMPLETE ${JSON.stringify({
            remoteFixedPriceTotal: final.remoteFixedPriceTotal,
            eligibleCollectibles: final.eligibleCollectibles,
            skippedNonCollectibles: final.skippedNonCollectibles,
            activeLinkedProducts,
            imagePasses: imagePasses.length,
          })}`);
          NODE

      - name: Capture and verify live storefront against fresh eBay total
        shell: bash
        run: |
          set -euo pipefail
          fetch_page() {
            key="$1"
            path="$2"
            body="sync-verification/storefront/${key}.html"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 \
              --header 'Cache-Control: no-cache' \
              --output "$body" --write-out '%{http_code}' \
              "${PRODUCTION_ORIGIN}${path}" || true)"
            printf '%s\n' "$code" > "sync-verification/storefront/${key}.status"
            echo "$key HTTP=$code"
            test "$code" = '200'
          }
          fetch_page all '/shop'
          fetch_page pucks '/shop?section=Pucks'
          fetch_page autographs '/shop?feature=autograph'
          fetch_page forsberg-hockey '/shop?section=Hockey&q=Peter%20Forsberg%20Red%20Jersey'
          fetch_page forsberg-jerseys '/shop?section=Jerseys&q=Peter%20Forsberg%20Red%20Jersey'
          fetch_page howe-hockey '/shop?section=Hockey&q=Gordie%20Howe%20Exquisite'
          fetch_page howe-tcg '/shop?section=Trading%20Card%20Games&q=Gordie%20Howe%20Exquisite'
          fetch_page wailord-tcg '/shop?section=Trading%20Card%20Games&q=Wailord'
          fetch_page shoes-blocked '/shop?q=shoes'
          fetch_page pants-blocked '/shop?q=pants'
          fetch_page parts-blocked '/shop?q=fuel%20sensor'
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('sync-verification/fresh-sync-summary.json', 'utf8'));
          const expectedAll = Number(summary.final.eligibleCollectibles);
          const decode = (value) => value
            .replace(/<script[\s\S]*?<\/script>/gi, ' ')
            .replace(/<style[\s\S]*?<\/style>/gi, ' ')
            .replace(/<[^>]*>/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&#39;/g, "'")
            .replace(/&quot;/g, '"')
            .replace(/&nbsp;/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
          const checks = [
            { key: 'all', exact: expectedAll },
            { key: 'pucks', min: 1 },
            { key: 'autographs', min: 1 },
            { key: 'forsberg-hockey', min: 1 },
            { key: 'forsberg-jerseys', exact: 0 },
            { key: 'howe-hockey', min: 1 },
            { key: 'howe-tcg', exact: 0 },
            { key: 'wailord-tcg', min: 1 },
            { key: 'shoes-blocked', exact: 0 },
            { key: 'pants-blocked', exact: 0 },
            { key: 'parts-blocked', exact: 0 },
          ];
          const results = [];
          for (const check of checks) {
            const html = fs.readFileSync(`sync-verification/storefront/${check.key}.html`, 'utf8');
            const plain = decode(html);
            const match = plain.match(/([\d,]+) active cards & collectibles/i);
            const activeItems = match ? Number(match[1].replaceAll(',', '')) : null;
            const result = {
              key: check.key,
              activeItems,
              markerPresent: plain.includes('Cards and memorabilia stay in their correct section.'),
            };
            results.push(result);
            console.log(JSON.stringify(result));
            if (!result.markerPresent) throw new Error(`${check.key} is missing the deployed v4 storefront marker.`);
            if (!Number.isInteger(activeItems)) throw new Error(`${check.key} active inventory count could not be parsed.`);
            if (Number.isInteger(check.exact) && activeItems !== check.exact) throw new Error(`${check.key} expected ${check.exact}; found ${activeItems}.`);
            if (Number.isInteger(check.min) && activeItems < check.min) throw new Error(`${check.key} expected at least ${check.min}; found ${activeItems}.`);
          }
          fs.writeFileSync('sync-verification/storefront-verification.json', `${JSON.stringify({
            generatedAt: new Date().toISOString(),
            expectedAll,
            success: true,
            results,
          }, null, 2)}\n`);
          NODE

      - name: Remove secured Production environment material
        if: always()
        run: rm -rf .vercel .sync-private .env.production.local .env.local

      - name: Upload fresh inventory synchronization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-ebay-inventory-sync-${{ github.run_number }}
          path: sync-verification
          if-no-files-found: error
          retention-days: 30
