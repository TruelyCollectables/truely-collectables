name: Authorized Full eBay Catalog Sync Verification 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-full-ebay-catalog-sync-verification-20260728.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-full-ebay-catalog-sync-verification
  cancel-in-progress: true

jobs:
  verify-production-sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/verify-full-ebay-catalog-sync-20260728')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
      CRON_NOT_BEFORE_UTC: 2026-07-28T05:01:30Z
    steps:
      - name: Check out verification runner
        uses: actions/checkout@v4
        with:
          ref: ops/verify-full-ebay-catalog-sync-20260728
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel sync-verification/logs sync-verification/storefront
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi

      - name: Wait for completed protected eBay cron status
        shell: bash
        run: |
          set -euo pipefail
          completed=''
          for attempt in $(seq 1 16); do
            echo "Runtime completion query ${attempt}/16"
            raw="sync-verification/logs/vercel-runtime-${attempt}.jsonl"
            npx vercel@56.2.0 logs \
              --project truely-collectables \
              --environment production \
              --since 60m \
              --no-branch \
              --json \
              --limit 1000 \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" \
              > "$raw" \
              2> "sync-verification/logs/vercel-runtime-${attempt}.stderr" || true
            ATTEMPT="$attempt" RAW_FILE="$raw" node <<'NODE'
            const fs = require('node:fs');
            const notBefore = Date.parse(process.env.CRON_NOT_BEFORE_UTC);
            const lines = fs.readFileSync(process.env.RAW_FILE, 'utf8').split(/\r?\n/).filter(Boolean);
            const rows = [];
            for (const line of lines) {
              try {
                const row = JSON.parse(line);
                if (
                  row.requestPath === '/api/cron/ebay-store-fixed-price-sync' &&
                  Number(row.timestamp || 0) >= notBefore
                ) rows.push(row);
              } catch {}
            }
            const unique = Array.from(
              new Map(rows.map((row) => [`${row.id}|${row.source}|${row.responseStatusCode}`, row])).values(),
            ).sort((a, b) => Number(a.timestamp || 0) - Number(b.timestamp || 0));
            const statuses = unique.map((row) => Number(row.responseStatusCode || 0));
            const completedSuccess = statuses.includes(200);
            const completedWithErrors = statuses.includes(207);
            const completedFailure = statuses.some((status) => status >= 400);
            const summary = {
              attempt: Number(process.env.ATTEMPT),
              notBefore: process.env.CRON_NOT_BEFORE_UTC,
              matchedEntries: unique.length,
              statuses,
              completedSuccess,
              completedWithErrors,
              completedFailure,
              entries: unique,
            };
            fs.writeFileSync(
              `sync-verification/logs/ebay-cron-summary-${process.env.ATTEMPT}.json`,
              JSON.stringify(summary, null, 2) + '\n',
            );
            console.log(JSON.stringify({
              attempt: summary.attempt,
              matchedEntries: summary.matchedEntries,
              statuses,
              completedSuccess,
              completedWithErrors,
              completedFailure,
            }));
            NODE
            summary="sync-verification/logs/ebay-cron-summary-${attempt}.json"
            if grep -Fq '"completedSuccess": true' "$summary"; then
              cp "$summary" sync-verification/logs/ebay-cron-final.json
              completed="$attempt"
              break
            fi
            if grep -Fq '"completedWithErrors": true' "$summary" || grep -Fq '"completedFailure": true' "$summary"; then
              cp "$summary" sync-verification/logs/ebay-cron-final.json
              cat "$summary"
              exit 1
            fi
            sleep 30
          done
          test -n "$completed"
          echo "Protected eBay cron completed successfully on query attempt $completed"

      - name: Capture live storefront pages with curl
        shell: bash
        run: |
          set -euo pipefail
          fetch_page() {
            key="$1"
            path="$2"
            body="sync-verification/storefront/${key}.html"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 \
              --header 'Cache-Control: no-cache' \
              --output "$body" --write-out '%{http_code}' \
              "${PRODUCTION_ORIGIN}${path}" || true)"
            printf '%s\n' "$code" > "sync-verification/storefront/${key}.status"
            printf '%s\n' "${PRODUCTION_ORIGIN}${path}" > "sync-verification/storefront/${key}.url"
            echo "$key HTTP=$code"
            test "$code" = '200'
          }
          fetch_page all '/shop'
          fetch_page pucks '/shop?section=Pucks'
          fetch_page balls '/shop?section=Balls'
          fetch_page jerseys '/shop?section=Jerseys'
          fetch_page autographs '/shop?feature=autograph'
          fetch_page tcg '/shop?section=Trading%20Card%20Games'
          fetch_page other '/shop?section=Other%20Collectables'
          fetch_page shoes-blocked '/shop?q=shoes'
          fetch_page pants-blocked '/shop?q=pants'
          fetch_page parts-blocked '/shop?q=fuel%20sensor'

      - name: Verify live storefront catalog and exclusions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const keys = [
            { key: 'all', requireItems: true },
            { key: 'pucks' },
            { key: 'balls' },
            { key: 'jerseys' },
            { key: 'autographs' },
            { key: 'tcg' },
            { key: 'other' },
            { key: 'shoes-blocked', expectZero: true },
            { key: 'pants-blocked', expectZero: true },
            { key: 'parts-blocked', expectZero: true },
          ];
          const decode = (value) => value
            .replace(/<script[\s\S]*?<\/script>/gi, ' ')
            .replace(/<style[\s\S]*?<\/style>/gi, ' ')
            .replace(/<[^>]*>/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&#39;/g, "'")
            .replace(/&quot;/g, '"')
            .replace(/&nbsp;/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
          const results = [];
          for (const check of keys) {
            const html = fs.readFileSync(`sync-verification/storefront/${check.key}.html`, 'utf8');
            const plain = decode(html);
            const activeMatch = plain.match(/([\d,]+) active cards & collectibles/i);
            const activeItems = activeMatch ? Number(activeMatch[1].replaceAll(',', '')) : null;
            const titles = Array.from(html.matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/gi))
              .map((match) => decode(match[1]))
              .filter(Boolean)
              .slice(0, 10);
            const result = {
              key: check.key,
              url: fs.readFileSync(`sync-verification/storefront/${check.key}.url`, 'utf8').trim(),
              status: Number(fs.readFileSync(`sync-verification/storefront/${check.key}.status`, 'utf8').trim()),
              markerPresent: plain.includes('Cards and memorabilia stay in their correct section.'),
              activeItems,
              sampleTitles: titles,
            };
            results.push(result);
            console.log(JSON.stringify(result));
            if (!result.markerPresent) throw new Error(`${check.key} is not serving the full-catalog release.`);
            if (!Number.isInteger(activeItems)) throw new Error(`${check.key} inventory count could not be parsed.`);
            if (check.requireItems && activeItems < 1) throw new Error('The live shop has no active inventory.');
            if (check.expectZero && activeItems !== 0) {
              throw new Error(`${check.key} exposed ${activeItems} excluded item(s).`);
            }
          }
          fs.writeFileSync(
            'sync-verification/storefront-verification.json',
            JSON.stringify({ generatedAt: new Date().toISOString(), success: true, results }, null, 2) + '\n',
          );
          NODE

      - name: Upload full-catalog sync verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ebay-catalog-sync-verification-${{ github.run_number }}
          path: sync-verification
          if-no-files-found: error
          retention-days: 30
