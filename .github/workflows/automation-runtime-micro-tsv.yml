name: Build Micro Automation Runtime TSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-runtime-micro-tsv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build micro TSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,re
          RUN='dh-20260730T170046Z-7d4c2a91';SEQ=4
          with open('tmp/automation-runtime-results.json') as f:raw=json.load(f)
          obs=raw.get('fetchedAt') or '2026-07-30T17:05:44Z'
          lab={'wnba':'WNBA','ivan_demidov':'IVAN','matvei_michkov_young_guns':'MICHKOV YG','matvei_michkov_opc_platinum':'MICHKOV OPCP','baseball_prospects':'MLB PROSPECT','signed_baseballs':'SIGNED BALL'}
          def clean(v):
            if v is None:return ''
            if isinstance(v,bool):return 'TRUE' if v else 'FALSE'
            s=str(v).replace('\t',' ').replace('\r',' ').replace('\n',' ').strip()
            if s and s[0] in '=+-@':s="'"+s
            return s
          m={}; coverage=[]
          for ep,o in raw.get('endpoints',{}).items():
            d=o.get('data') or {}
            for x in d.get('sourceCoverage') or []:
              coverage.append([RUN,SEQ,'eBay Native Browse',lab.get(ep,ep)+'/'+str(x.get('familyId') or ''),x.get('status') or '',x.get('query') or '',x.get('rawResultCount') or 0,x.get('acceptedResultCount') or 0,0,'native; rejected='+str(x.get('rejectedResultCount') or 0)])
            for c in d.get('results') or []:
              k=str(c.get('listingItemId') or c.get('listingUrl') or '')
              if not k:continue
              if k not in m:m[k]={'eps':set([ep]),**c}
              else:m[k]['eps'].add(ep)
          with open('tmp/automation-runtime-candidates-micro.tsv','w') as f:
            for k,c in sorted(m.items(),key=lambda x:(sorted(x[1]['eps'])[0],str(x[1].get('listingItemId') or ''))):
              eps=sorted(c.pop('eps'));dig=hashlib.sha1(('|'.join(eps)+'|'+k).encode()).hexdigest()[:18];rawid=str(c.get('listingItemId') or '');nums=re.findall(r'\d{9,15}',rawid);num=nums[0] if nums else '';url='https://www.ebay.com/itm/'+num if num else str(c.get('listingUrl') or '').split('?')[0]
              row=['']*77
              vals={0:'cand-s4-ebay-'+dig,1:RUN,2:SEQ,3:obs,4:'+'.join(lab.get(e,e) for e in eps)+'/'+str(c.get('lane') or ''),5:c.get('watchedPerson') or '',6:c.get('itemType') or '',7:'eBay',8:c.get('sellerName') or '',10:rawid,11:url,12:'LIVE',13:str(c.get('title') or '')[:140],14:'{}',15:'{}',16:'preliminary|'+dig,17:'ebay|'+str(c.get('sellerName') or 'unknown')+'|'+rawid,20:False,21:False,22:False,23:False,24:'{}',35:'UNASSESSED',36:'[]',37:c.get('itemPrice'),38:c.get('inboundShipping'),55:'INSUFFICIENT',72:'MANUAL REVIEW / UNPRICED',73:False,74:False,75:'["pending_exact_verification"]',76:'{}'}
              for i,v in vals.items():row[i]=v
              f.write('\t'.join(clean(v) for v in row)+'\n')
          with open('tmp/automation-runtime-coverage-micro.tsv','w') as f:
            for row in coverage:f.write('\t'.join(clean(v) for v in row)+'\n')
          PY
      - name: Commit micro TSV
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/automation-runtime-candidates-micro.tsv tmp/automation-runtime-coverage-micro.tsv
          git commit -m 'Build micro automation runtime sheet rows' || exit 0
          git push origin HEAD:main
