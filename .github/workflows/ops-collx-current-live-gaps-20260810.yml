name: Ops CollX Current Live Gaps 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-current-live-gaps-20260810.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/collx-current-gaps"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-current-gaps/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
      - name: Snapshot active eBay-backed products still missing owned CollX scans
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { setTimeout as sleep } from 'node:timers/promises';
          const STORE='00000000-0000-4000-8000-000000000001';
          function parseEnv(text){const e={};for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('#'))continue;const i=line.indexOf('=');if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}else if(v.startsWith("'")&&v.endsWith("'"))v=v.slice(1,-1);e[k]=v}return e}
          const root=path.join(process.env.RUNNER_TEMP,'collx-current-gaps');
          const env=parseEnv(fs.readFileSync(path.join(root,'production.env'),'utf8'));
          const base=env.NEXT_PUBLIC_SUPABASE_URL;if(!base)throw new Error('Supabase URL unavailable');
          const ref=new URL(base).hostname.split('.')[0];const token=process.env.GH_SUPABASE_ACCESS_TOKEN;
          const endpoint=`https://api.supabase.com/v1/projects/${ref}/database/query`;
          async function q(sql,label){let last='';for(let a=1;a<=10;a++){try{const r=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({query:sql,parameters:[],read_only:true}),signal:AbortSignal.timeout(30000)});const t=await r.text();if(r.ok)return t?JSON.parse(t):[];last=`${r.status} ${t.slice(0,500)}`;if(![429,500,502,503,504,522,524,544].includes(r.status)&&!/timeout|57P01|connection/i.test(t))throw new Error(`${label}: ${last}`)}catch(e){last=String(e?.message||e)}if(a<10)await sleep(Math.min(8000,a*700))}throw new Error(`${label}: ${last}`)}
          const rows=await q(`
            select p.id product_id,i.id inventory_item_id,p.title,p.player,p.sport,p.price,p.quantity product_quantity,p.ebay_item_id,p.image_url,i.status,i.quantity inventory_quantity,
              coalesce(array_remove(array_agg(img.image_url order by img.sort_order,img.id),null),'{}'::text[]) image_urls,
              count(*) filter(where img.image_url like '%/storage/v1/object/public/truely-product-images/collx-mirror/%' or img.alt_text like 'CollX verified %') owned_collx_count
            from public.products p join public.inventory_items i on i.legacy_product_id=p.id and i.store_id='${STORE}'::uuid
            left join public.inventory_images img on img.inventory_item_id=i.id
            where p.store_id='${STORE}'::uuid and i.status='active' and coalesce(i.quantity,0)>0 and p.archived_at is null and coalesce(p.quantity,0)>0 and coalesce(p.price,0)>0 and nullif(btrim(coalesce(p.ebay_item_id,'')),'') is not null
            group by p.id,i.id,p.title,p.player,p.sport,p.price,p.quantity,p.ebay_item_id,p.image_url,i.status,i.quantity
            having count(*) filter(where img.image_url like '%/storage/v1/object/public/truely-product-images/collx-mirror/%' or img.alt_text like 'CollX verified %')=0
            order by p.id;
          `,'current gaps');
          const out={generated_at:new Date().toISOString(),count:rows.length,rows};
          fs.writeFileSync(path.join(root,'current-gaps.json'),JSON.stringify(out,null,2));
          console.log(JSON.stringify({currentGaps:rows.length}));
          NODE
          rm -f "$RUNNER_TEMP/collx-current-gaps/production.env"
      - name: Upload current gap snapshot
        uses: actions/upload-artifact@v4
        with:
          name: collx-current-live-gaps
          path: ${{ runner.temp }}/collx-current-gaps/current-gaps.json
          retention-days: 2
          if-no-files-found: error
