name: PR 98 Build Diagnostic

on:
  pull_request:
    paths:
      - "src/lib/collectible-assets.ts"
      - "src/lib/inventory-activation.ts"
      - "src/app/api/admin/verified-reference-import/**"
      - "src/app/api/account/seller/collectible-assets/**"
      - "src/app/admin/verified-reference-import/**"
      - "src/app/seller/collectible-assets/**"
      - "supabase/migrations/20260726050000_collectible_asset_lifecycle.sql"
      - ".github/workflows/pr98-build-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run collectible lifecycle structural checks
        run: node scripts/run-collectible-asset-lifecycle-simulations.mjs
      - name: Build production application
        id: diagnostic_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > /tmp/pr98-build.log 2>&1
          status=$?
          tail -n 100 /tmp/pr98-build.log > pr98-build-tail.txt
          echo "build_status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload exact build failure tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr98-build-tail
          path: pr98-build-tail.txt
          if-no-files-found: error
          retention-days: 7
      - name: Print exact build failure tail
        if: always()
        run: cat pr98-build-tail.txt
      - name: Enforce production build
        if: steps.diagnostic_build.outcome == 'failure'
        run: exit 1
