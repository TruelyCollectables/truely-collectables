name: Apply Seller Membership Authorization Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-seller-membership-auth-fix.yml"
      - "scripts/apply-seller-membership-auth-fix.py"

permissions:
  contents: write

jobs:
  apply-seller-auth-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/emergency-post-launch-audit-fixes-20260726
          fetch-depth: 0

      - name: Require an existing active seller membership
        run: python scripts/apply-seller-membership-auth-fix.py

      - name: Commit the seller authorization repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-seller-membership-auth-fix.py
          git config user.name "Truely Collectables Audit"
          git config user.email "sales@truelycollectables.com"
          git add src/lib/account-auth.ts src/app/api/account/seller src/lib/active-market-*.ts scripts/run-seller-membership-authorization-simulations.ts scripts/apply-seller-membership-auth-fix.py
          git commit -m "Require active seller membership for seller APIs"
          git push origin HEAD:agent/emergency-post-launch-audit-fixes-20260726
