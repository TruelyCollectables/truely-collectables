name: InstaComp Layout PDF Recovery Validate

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/instacomp-layout-pdf-recovery-validate.yml'
      - 'scripts/instacomp-target-checklists/recover-layout-pdf-easy.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-layout-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERIFIED_HARVEST_ROOT: /home/runner/work/_temp/layout-pdf-harvest
      LAYOUT_PDF_RECEIPT: /home/runner/work/_temp/layout-pdf-harvest/layout-pdf-recovery-receipt.json
      LAYOUT_PDF_PLAN_DIR: /home/runner/work/_temp/layout-pdf-harvest/layout-pdf-plans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF text tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Download immutable 122-catalog harvest
        uses: actions/download-artifact@v4
        with:
          name: exhaustive-hockey-wnba-31924171342
          path: /home/runner/work/_temp/layout-pdf-harvest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31924171342
      - name: Prove immutable source bundle
        run: jq -e '.targetCount == 122 and .readyCount == 90 and .validationFailedCount == 32 and .failedCount == 0' "$VERIFIED_HARVEST_ROOT/output/summary.json"
      - name: Parse and validate three layout-PDF recoveries
        run: node --import tsx scripts/instacomp-target-checklists/recover-layout-pdf-easy.mjs
      - name: Show validation receipt
        if: always()
        run: test -s "$LAYOUT_PDF_RECEIPT" && jq '{targetCount,validatedCount,unresolvedCount,results:[.results[]|{exactSetKey,status,layoutRows,counts,validationErrors}]}' "$LAYOUT_PDF_RECEIPT" || true
      - name: Upload validation plans and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-layout-pdf-recovery-${{ github.run_id }}
          path: |
            /home/runner/work/_temp/layout-pdf-harvest/layout-pdf-recovery-receipt.json
            /home/runner/work/_temp/layout-pdf-harvest/layout-pdf-plans
          if-no-files-found: warn
          retention-days: 90
