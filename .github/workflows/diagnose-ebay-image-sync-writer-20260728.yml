name: Diagnose eBay Image Sync Writer 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-ebay-image-sync-writer-20260728.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-ebay-image-sync-chunking-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ebay-image-sync-chunking-20260728
          fetch-depth: 1
      - name: Inspect writer targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python <<'PY'
          from pathlib import Path
          import json, re

          source = Path('src/lib/ebay-all-image-sync.ts').read_text()
          route = Path('src/app/api/cron/ebay-store-fixed-price-sync/route.ts').read_text()
          test = Path('scripts/run-ebay-import-admin-client-simulations.ts').read_text()
          checks = {
            'constants_literal': source.count('const APPLY_CONCURRENCY = 8;\nconst MAX_ITEMS_PER_RUN = 250;'),
            'decode_marker': source.count('function decodeXml(value: string) {'),
            'export_marker': source.count('export async function syncEbayAllListingImages(params: {'),
            'product_regex': len(re.findall(r'  const \{ data: productRows, error: productError \} = await params\.supabase[\s\S]*?  const products = \(productRows \|\| \[\]\) as ProductRow\[\];\n  const productIds = products\.map\(\(product\) => Number\(product\.id\)\);', source)),
            'inventory_regex': len(re.findall(r'  const \{ data: inventoryRows, error: inventoryError \} = await params\.supabase[\s\S]*?  if \(imageError\) throw imageError;', source)),
            'worker_regex': len(re.findall(r'        error:\n          error instanceof Error \? error\.message\.slice\(0, 400\) : "Unknown image sync error",', source)),
            'route_regex': len(re.findall(r'function safeErrorMessage\(value: unknown, fallback: string\) \{[\s\S]*?\n\}\n\nfunction summarizeAuthoritative', route)),
            'test_marker': test.count('assert.match(\n  scheduledEbaySync,\n  /syncEbayAllListingImages/,\n  "The scheduled authoritative eBay job must run complete 1–20 image reconciliation.",\n);'),
            'already_chunked': source.count('function chunkValues<T>'),
          }
          Path('diagnostics/counts.json').write_text(json.dumps(checks, indent=2) + '\n')
          Path('diagnostics/image-tail.txt').write_text(source[source.find('export async function syncEbayAllListingImages'):])
          print(json.dumps(checks))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ebay-image-sync-writer-diagnostics-${{ github.run_number }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
