name: Run Market Intel Freshness Catch-up Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-market-intel-catchup-now.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TRIGGER_REVISION: "2026-07-31T15:20Z"

concurrency:
  group: run-market-intel-catchup-now
  cancel-in-progress: false

jobs:
  refresh-report-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PRODUCTION_ORIGIN: https://truelycollectables.com
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify protected catch-up route and run it
        id: catchup
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/market-intel"
          unauthorized_body="$RUNNER_TEMP/market-intel/unauthorized.json"
          result_body="$RUNNER_TEMP/market-intel/result.json"
          stamp="$(date +%s)"

          unauthorized_status="$(curl --silent --show-error --location \
            --retry 5 --retry-all-errors \
            --max-time 60 \
            --output "$unauthorized_body" \
            --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -A 'TCOSMarketIntelCatchupNow/1.0' \
            "$PRODUCTION_ORIGIN/api/cron/market-intel/reports/daily-catchup?verify=$stamp")"

          if [ "$unauthorized_status" != "401" ]; then
            printf '%s\n' "route_status=unexpected-$unauthorized_status" >> "$GITHUB_OUTPUT"
            printf '%s\n' "http_status=$unauthorized_status" >> "$GITHUB_OUTPUT"
            printf '%s\n' "result_file=$unauthorized_body" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            printf '%s\n' "route_status=live-but-github-secret-missing" >> "$GITHUB_OUTPUT"
            printf '%s\n' "http_status=not-called" >> "$GITHUB_OUTPUT"
            printf '%s\n' "result_file=$unauthorized_body" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::add-mask::$CRON_SECRET"
          set +e
          http_status="$(curl --silent --show-error --location \
            --retry 2 --retry-all-errors \
            --max-time 310 \
            --output "$result_body" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -A 'TCOSMarketIntelCatchupNow/1.0' \
            "$PRODUCTION_ORIGIN/api/cron/market-intel/reports/daily-catchup?run=$stamp")"
          curl_status=$?
          set -e

          printf '%s\n' "route_status=called" >> "$GITHUB_OUTPUT"
          printf '%s\n' "http_status=$http_status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "curl_status=$curl_status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "result_file=$result_body" >> "$GITHUB_OUTPUT"

      - name: Build freshness evidence
        id: evidence
        shell: bash
        env:
          ROUTE_STATUS: ${{ steps.catchup.outputs.route_status }}
          HTTP_STATUS: ${{ steps.catchup.outputs.http_status }}
          CURL_STATUS: ${{ steps.catchup.outputs.curl_status }}
          RESULT_FILE: ${{ steps.catchup.outputs.result_file }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/market-intel-evidence.json"
          node - "$RESULT_FILE" "$evidence" <<'NODE'
          const fs = require("node:fs");
          const input = process.argv[2];
          const output = process.argv[3];
          let payload = {};
          try {
            payload = JSON.parse(fs.readFileSync(input, "utf8"));
          } catch {
            payload = { raw: fs.existsSync(input) ? fs.readFileSync(input, "utf8").slice(0, 1000) : "" };
          }
          const refresh = payload.refresh || payload.report?.report_json?.sourceFreshness || {};
          const delivery = payload.delivery || {};
          const evidence = {
            routeStatus: process.env.ROUTE_STATUS || "unknown",
            httpStatus: process.env.HTTP_STATUS || "unknown",
            curlStatus: process.env.CURL_STATUS || "unknown",
            error: payload.error || null,
            skipped: payload.skipped ?? false,
            reason: payload.reason || delivery.reason || null,
            refreshed: payload.refreshed ?? false,
            reportId: payload.report?.id || payload.reportId || null,
            reportDate: payload.report?.report_date || null,
            headline: payload.report?.headline || null,
            sourceStatus: refresh.status || null,
            refreshedAt: refresh.refreshedAt || payload.refreshedAt || null,
            activeIdentityCount: refresh.activeIdentityCount ?? null,
            targetCount: refresh.targetCount ?? null,
            successfulTargetCount: refresh.successfulTargetCount ?? null,
            failedTargetCount: refresh.failedTargetCount ?? null,
            skippedIdentityCount: refresh.skippedIdentityCount ?? null,
            candidatesAccepted: refresh.candidatesAccepted ?? null,
            listingsCreated: refresh.listingsCreated ?? null,
            listingsUpdated: refresh.listingsUpdated ?? null,
            priceChanges: refresh.priceChanges ?? null,
            listingsScored: refresh.listingsScored ?? null,
            delivered: delivery.delivered ?? false,
            alreadyDelivered: delivery.alreadyDelivered ?? false,
            deliverySkipped: delivery.skipped ?? false,
            deliveryFailed: delivery.failed ?? false,
            deliveryError: delivery.error || null,
          };
          fs.writeFileSync(output, JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
          echo "evidence_file=$evidence" >> "$GITHUB_OUTPUT"

      - name: Record live catch-up result
        shell: bash
        env:
          EVIDENCE_FILE: ${{ steps.evidence.outputs.evidence_file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            git reset --hard origin/main
            mkdir -p deployment-receipts
            node - "$EVIDENCE_FILE" > deployment-receipts/market-intel-freshness-live-run.md <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const show = (input) => input === null || input === undefined || input === "" ? "not reported" : String(input);
          console.log(`# Market Intel Freshness Live Run\n
- Result: ${value.httpStatus === "200" ? "route completed" : "route did not complete"}
- Route protection: ${show(value.routeStatus)}
- HTTP status: ${show(value.httpStatus)}
- Curl status: ${show(value.curlStatus)}
- Error: ${show(value.error)}
- Skipped: ${show(value.skipped)}
- Reason: ${show(value.reason)}
- Refreshed: ${show(value.refreshed)}
- Report ID: ${show(value.reportId)}
- Report date: ${show(value.reportDate)}
- Headline: ${show(value.headline)}
- Source status: ${show(value.sourceStatus)}
- Refreshed at: ${show(value.refreshedAt)}
- Active identities: ${show(value.activeIdentityCount)}
- Targets attempted: ${show(value.targetCount)}
- Successful targets: ${show(value.successfulTargetCount)}
- Failed targets: ${show(value.failedTargetCount)}
- Skipped identities: ${show(value.skippedIdentityCount)}
- Candidates accepted: ${show(value.candidatesAccepted)}
- Listings created: ${show(value.listingsCreated)}
- Listings updated: ${show(value.listingsUpdated)}
- Price changes: ${show(value.priceChanges)}
- Listings rescored: ${show(value.listingsScored)}
- Delivery sent: ${show(value.delivered)}
- Delivery already complete: ${show(value.alreadyDelivered)}
- Delivery skipped: ${show(value.deliverySkipped)}
- Delivery failed: ${show(value.deliveryFailed)}
- Delivery error: ${show(value.deliveryError)}
- Recorded at: ${new Date().toISOString()}`);
          NODE
            git add deployment-receipts/market-intel-freshness-live-run.md
            git commit -m "Record Market Intel freshness live run [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 3
              continue
            fi
          done
          exit 1

      - name: Require successful live catch-up
        shell: bash
        env:
          HTTP_STATUS: ${{ steps.catchup.outputs.http_status }}
          CURL_STATUS: ${{ steps.catchup.outputs.curl_status }}
        run: |
          set -euo pipefail
          test "${CURL_STATUS:-0}" = "0"
          test "$HTTP_STATUS" = "200"
