name: Cloudflare Supabase Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-supabase-probe-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT_NAME: truely-collectables
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROBE_URL: https://truely-collectables-preview.truelycollectables.workers.dev/api/cron/cloudflare-supabase-probe
    steps:
      - name: Install probe tooling
        run: npm install --no-save --package-lock=false vercel@56.2.0 dotenv@latest wrangler@4.122.0

      - name: Repair empty preview cron secret and call live Worker probe
        shell: bash
        run: |
          set -euo pipefail
          npx vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color >/dev/null
          umask 077
          npx vercel env pull .env.probe --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes --no-color >/dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const dotenv = require('dotenv');
          const env = dotenv.parse(fs.readFileSync('.env.probe'));
          const cronSecret = String(env.CRON_SECRET || '').trim();
          const fallbackSecret = String(env.PROFIT_HUNTER_RUN_SECRET || '').trim();
          const secret = cronSecret || fallbackSecret;
          if (!secret) throw new Error('Neither CRON_SECRET nor PROFIT_HUNTER_RUN_SECRET is available.');
          console.log(`::add-mask::${secret}`);

          const repair = spawnSync(
            'npx',
            ['wrangler', 'secret', 'put', 'CRON_SECRET', '--name', 'truely-collectables-preview'],
            {
              input: `${secret}\n`,
              stdio: ['pipe', 'inherit', 'inherit'],
              env: process.env,
            },
          );
          if (repair.status !== 0) process.exit(repair.status || 3);
          console.log(cronSecret ? 'Preview CRON_SECRET already had a source value; refreshed live secret.' : 'Preview CRON_SECRET repaired from stable Profit Hunter server secret.');

          async function main() {
            const response = await fetch(process.env.PROBE_URL, {
              headers: { authorization: `Bearer ${secret}` },
            });
            const text = await response.text();
            console.log(`Probe HTTP ${response.status}`);
            console.log(text);
            if (!response.ok) process.exit(2);
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
          rm -f .env.probe
