name: Topps Seed Set Archive
run-name: Topps Seed Set Archive — ${{ github.event_name }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/archive-topps-seed-sets.ts"
      - ".github/workflows/topps-seed-set-archive.yml"
  push:
    branches:
      - agent/topps-isolated-sport-pipelines
    paths:
      - "scripts/archive-topps-seed-sets.ts"
      - ".github/workflows/topps-seed-set-archive.yml"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/topps-isolated-sport-pipelines
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download first official Topps checklist sets
        run: node --import tsx scripts/archive-topps-seed-sets.ts
      - name: Verify seed archive
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('.topps-seed-archive/manifest.json', 'utf8'));
          if (manifest.schema !== 'tcos.topps.seedArchiveManifest.v1') throw new Error('Wrong seed archive schema');
          if (manifest.totals?.archived !== 4) throw new Error(`Expected 4 archived sets, got ${manifest.totals?.archived}`);
          NODE
      - name: Package first Topps sets
        run: tar -C .topps-seed-archive -czf topps-seed-set-archive.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: topps-seed-set-archive
          path: topps-seed-set-archive.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: topps-seed-set-manifest
          path: .topps-seed-archive/manifest.json
          if-no-files-found: error
          retention-days: 90
