name: Dispatch Cloudflare Complete Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-complete-migration-dispatch-trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current Cloudflare production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deal-hunter-cloudflare-production-release.yml --repo "$GITHUB_REPOSITORY" --ref main
