name: Sentinel Mainstream Today Sprint 20260808

on:
  push:
    branches:
      - agent/sentinel-mainstream-today-sprint
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sentinel-mainstream-today-sprint
          fetch-depth: 0

      - name: Apply narrow Sentinel requeue patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-sentinel-mainstream-today-sprint-20260808.py
          git diff --check
          grep -q 'def requeue_targets(' services/instacomp-ai/app/sentinel_store.py
          grep -q '@protected.post("/requeue-targets")' services/instacomp-ai/app/sentinel_routes.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Test Sentinel requeue and complete Mac service
        working-directory: services/instacomp-ai
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m compileall app tests
          PYTHONPATH=. pytest -q tests/test_sentinel_requeue.py
          PYTHONPATH=. pytest -q

      - name: Persist tested runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/instacomp-ai/app/sentinel_store.py services/instacomp-ai/app/sentinel_routes.py
          if git diff --cached --quiet; then
            echo 'Sentinel today-sprint runtime patch already persisted.'
            exit 0
          fi
          git commit -m 'Add safe Sentinel unresolved requeue'
          git push origin HEAD:agent/sentinel-mainstream-today-sprint
