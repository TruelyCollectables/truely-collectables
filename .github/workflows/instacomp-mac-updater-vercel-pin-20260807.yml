name: InstaComp Mac Updater Vercel Pin 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "services/instacomp-ai/scripts/update-live-from-main.sh"
      - "scripts/ops/patch-instacomp-mac-updater-vercel-pin-20260807.py"
      - ".github/workflows/instacomp-mac-updater-vercel-pin-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-mac-updater-vercel-pin-20260807
  cancel-in-progress: true

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-mac-updater-vercel-pin-20260807
          fetch-depth: 0
      - name: Apply updater pin
        run: python scripts/ops/patch-instacomp-mac-updater-vercel-pin-20260807.py
      - name: Shell safety
        shell: bash
        run: |
          set -euo pipefail
          bash -n services/instacomp-ai/scripts/update-live-from-main.sh
          grep -Fq 'vercel_cli="vercel@56.2.0"' services/instacomp-ai/scripts/update-live-from-main.sh
          grep -Fq 'npx --yes "$vercel_cli" deploy --prod --yes --cwd "$repo_root"' services/instacomp-ai/scripts/update-live-from-main.sh
          test "$(grep -c 'npx vercel' services/instacomp-ai/scripts/update-live-from-main.sh)" = "0"
          git diff --check
      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "services/instacomp-ai/scripts/update-live-from-main.sh"
      - name: Commit certified updater repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/instacomp-ai/scripts/update-live-from-main.sh
          git commit -m 'Pin InstaComp Mac updater to proven Vercel CLI'
          git push origin HEAD:fix/instacomp-mac-updater-vercel-pin-20260807
