name: Ops Probe Gemini Raw Gateway Search 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4

      - name: Acquire project OIDC without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          set -a
          source .env.local
          set +a
          test -n "${VERCEL_OIDC_TOKEN:-}"
          echo "GEMINI_GATEWAY_OIDC_ACQUIRED=true"

      - name: Probe raw Gateway REST encodings for Gemini native Google Search
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.local
          set +a
          cat > .gemini-raw-rest-probe.mjs <<'NODE'
          const token = process.env.VERCEL_OIDC_TOKEN;
          const prompt = 'Use Google Search grounding before answering. Search the live web for site:ebay.com/itm "2024 Panini Prizm Caitlin Clark" "Silver" "22". Do not invent prices or URLs. Reply only with JSON saying whether search ran.';
          const attempts = [
            {
              name: 'responses_google_search_type',
              url: 'https://ai-gateway.vercel.sh/v1/responses',
              body: {
                model: 'google/gemini-2.5-flash-lite',
                input: [{ type: 'message', role: 'user', content: prompt }],
                max_output_tokens: 600,
                temperature: 0,
                tools: [{ type: 'google_search' }],
                tool_choice: 'required',
                providerOptions: { gateway: { only: ['vertex'] } },
              },
            },
            {
              name: 'responses_provider_defined',
              url: 'https://ai-gateway.vercel.sh/v1/responses',
              body: {
                model: 'google/gemini-2.5-flash-lite',
                input: [{ type: 'message', role: 'user', content: prompt }],
                max_output_tokens: 600,
                temperature: 0,
                tools: [{ type: 'provider-defined', id: 'google.google_search', name: 'google_search', args: { searchTypes: { webSearch: {} } } }],
                providerOptions: { gateway: { only: ['vertex'] } },
              },
            },
            {
              name: 'responses_google_provider_option',
              url: 'https://ai-gateway.vercel.sh/v1/responses',
              body: {
                model: 'google/gemini-2.5-flash-lite',
                input: [{ type: 'message', role: 'user', content: prompt }],
                max_output_tokens: 600,
                temperature: 0,
                providerOptions: { gateway: { only: ['vertex'] }, google: { useSearchGrounding: true }, vertex: { useSearchGrounding: true } },
              },
            },
            {
              name: 'chat_google_search_tool',
              url: 'https://ai-gateway.vercel.sh/v1/chat/completions',
              body: {
                model: 'google/gemini-2.5-flash-lite',
                messages: [{ role: 'user', content: prompt }],
                max_tokens: 600,
                temperature: 0,
                tools: [{ type: 'google_search' }],
                providerOptions: { gateway: { only: ['vertex'] } },
              },
            },
          ];

          let winner = null;
          for (const attempt of attempts) {
            let status = 0;
            let payload = {};
            try {
              const response = await fetch(attempt.url, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(attempt.body),
                signal: AbortSignal.timeout(120000),
              });
              status = response.status;
              const text = await response.text();
              try { payload = text ? JSON.parse(text) : {}; } catch { payload = { raw: text.slice(0, 500) }; }
            } catch (error) {
              payload = { error: String(error?.message || error) };
            }
            const serialized = JSON.stringify(payload);
            const grounded = /groundingMetadata|webSearchQueries|searchEntryPoint|groundingChunks/i.test(serialized);
            const outputText = serialized.includes('output_text') || serialized.includes('choices');
            const errorMessage = payload?.error?.message || payload?.error || null;
            console.log('GEMINI_RAW_ATTEMPT=' + JSON.stringify({ name: attempt.name, status, grounded, outputText, topKeys: Object.keys(payload || {}), error: errorMessage ? String(errorMessage).slice(0, 240) : null }));
            if (status >= 200 && status < 300 && grounded) {
              winner = attempt.name;
              break;
            }
          }
          console.log('GEMINI_RAW_SEARCH_WINNER=' + JSON.stringify({ winner }));
          if (!winner) process.exit(2);
          NODE
          node ./.gemini-raw-rest-probe.mjs
          rm -f .gemini-raw-rest-probe.mjs
