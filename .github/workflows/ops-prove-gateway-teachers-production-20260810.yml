name: Ops Compact Deal Hunter Evaluator Errors 20260811

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: truely-collectables
    steps:
      - name: Resolve latest READY Production deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v2/teams?limit=100' > teams.json
          TEAM_ID="$(node - <<'NODE'
          const p=require('./teams.json'); const t=(p.teams||[]).find(x=>x.slug==='truelycollectables-projects'); if(!t?.id) process.exit(2); process.stdout.write(t.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT?teamId=$TEAM_ID" > project.json
          PROJECT_ID="$(node - <<'NODE'
          const p=require('./project.json'); if(!p.id) process.exit(2); process.stdout.write(p.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=20&teamId=$TEAM_ID" > deployments.json
          node - <<'NODE'
          const fs=require('fs'); const p=require('./deployments.json');
          const ready=(Array.isArray(p.deployments)?p.deployments:[]).find(d=>String(d.state||d.readyState||'').toUpperCase()==='READY'&&d.url);
          if(!ready) throw new Error('No READY production deployment.');
          console.log('PROD='+JSON.stringify({commit:ready.meta?.githubCommitSha||ready.meta?.gitCommitSha||null,url:ready.url}));
          fs.appendFileSync(process.env.GITHUB_ENV,`DEPLOY_URL=https://${ready.url}\n`);
          NODE

      - name: Print latest Mac evaluator errors
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o outcomes.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" "$DEPLOY_URL/api/release/instacomp-deal-hunter-mac-outcomes" || true)"
          echo "HTTP=$code"
          test "$code" = "200"
          node - <<'NODE'
          const p=require('./outcomes.json'); if(!p.success) throw new Error(p.error||'failed');
          const rows=Array.isArray(p.candidates)?p.candidates:[];
          console.log('SUMMARY '+JSON.stringify(p.summary||{}));
          const grouped={};
          rows.forEach((r,i)=>{
            const msg=String(r.errorMessage||'').replace(/\s+/g,' ').slice(0,900)||'-';
            grouped[msg]=(grouped[msg]||0)+1;
            console.log(`ERR ${String(i+1).padStart(2,'0')} code=${r.errorCode||'-'} msg=${msg} title=${String(r.title||'').slice(0,150)}`);
          });
          console.log('ERROR_GROUPS '+JSON.stringify(grouped));
          NODE
