name: Ops Probe Gemini Native Search 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4

      - name: Acquire project OIDC without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -f .env.local
          set -a
          source .env.local
          set +a
          test -n "${VERCEL_OIDC_TOKEN:-}"
          echo "GEMINI_GATEWAY_OIDC_ACQUIRED=true"

      - name: Install isolated Gateway and Google tool definitions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts ai@7.0.58 @ai-sdk/gateway@4.0.46 @ai-sdk/google@3.0.26 >/dev/null

      - name: Require free Gemini 2.5 Flash Lite with native Google Search
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.local
          set +a
          cat > .gemini-native-search-probe.mjs <<'NODE'
          import { generateText } from 'ai';
          import { google } from '@ai-sdk/google';

          const result = await generateText({
            model: 'google/gemini-2.5-flash-lite',
            prompt: [
              'Use Google Search grounding.',
              'Search the live web for this exact query: site:ebay.com/itm "2024 Panini Prizm Caitlin Clark" "Silver" "22".',
              'Do not invent prices or URLs.',
              'Reply with a short JSON object: {"searched":true,"ebayEvidenceFound":true_or_false}.'
            ].join('\n'),
            temperature: 0,
            maxOutputTokens: 600,
            timeout: 120000,
            tools: {
              google_search: google.tools.googleSearch({
                searchTypes: { webSearch: {} },
              }),
            },
          });

          const sources = Array.isArray(result.sources) ? result.sources : [];
          const metadata = result.providerMetadata || {};
          const googleMeta = metadata.google || metadata['google.generative-ai'] || null;
          const gatewayMeta = metadata.gateway || null;
          const grounding = googleMeta?.groundingMetadata || gatewayMeta?.groundingMetadata || null;
          const queries = Array.isArray(grounding?.webSearchQueries) ? grounding.webSearchQueries.length : 0;
          const chunks = Array.isArray(grounding?.groundingChunks) ? grounding.groundingChunks.length : 0;
          const safe = {
            model: 'google/gemini-2.5-flash-lite',
            textReturned: typeof result.text === 'string' && result.text.trim().length > 0,
            finishReason: result.finishReason || null,
            sourceCount: sources.length,
            groundingQueryCount: queries,
            groundingChunkCount: chunks,
            metadataKeys: Object.keys(metadata),
          };
          console.log('GEMINI_NATIVE_SEARCH_PROOF=' + JSON.stringify(safe));
          if (!safe.textReturned || safe.finishReason === 'error' || (safe.sourceCount < 1 && safe.groundingQueryCount < 1 && safe.groundingChunkCount < 1)) process.exit(2);
          NODE
          node ./.gemini-native-search-probe.mjs
          rm -f .gemini-native-search-probe.mjs
