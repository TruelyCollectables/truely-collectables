name: Ops Prove Gateway Teachers Production 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy exact current main to Production
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          git fetch --no-tags origin main
          git checkout --detach origin/main
          CURRENT_MAIN="$(git rev-parse HEAD)"
          echo "PROOF_MAIN=$CURRENT_MAIN"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          DEPLOYMENT_URL="$(npx --yes vercel@latest --prod --yes --archive=tgz --cwd . --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')"
          test -n "$DEPLOYMENT_URL"
          printf '%s' "$DEPLOYMENT_URL" > deployment-url.txt
          echo "PRODUCTION_DEPLOYED_MAIN=$CURRENT_MAIN"
          echo "PRODUCTION_DEPLOYMENT_URL_RESOLVED=true"

      - name: Require exact deployment two-family teacher configuration
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$BASE_URL/api/release/instacomp-teacher-runtime-diagnostics" > runtime.json
          node - <<'NODE'
          const p=require('./runtime.json'); const c=p.configuration||{};
          const safe={success:Boolean(p.success),geminiConfigured:Boolean(c.geminiConfigured),groqConfigured:Boolean(c.groqConfigured),gatewayPerplexityConfigured:Boolean(c.gatewayPerplexityConfigured),votingTeacherCount:Number(c.votingTeacherCount||0),requiredVotes:Number(c.requiredVotes||0),teacherConsensusOperational:Boolean(c.teacherConsensusOperational),macLearningBridgeConfigured:Boolean(c.macLearningBridgeConfigured),onlineCompLearnMode:Boolean(c.onlineCompLearnMode)};
          console.log('EXACT_DEPLOYMENT_TEACHER_CONFIGURATION='+JSON.stringify(safe));
          if(!safe.success||safe.geminiConfigured||!safe.groqConfigured||!safe.gatewayPerplexityConfigured||safe.votingTeacherCount!==2||safe.requiredVotes!==2||!safe.teacherConsensusOperational||!safe.macLearningBridgeConfigured||!safe.onlineCompLearnMode) process.exit(1);
          NODE

      - name: Read Mac-only candidate failure bodies
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          code="$(curl -sS -o mac-candidates.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$BASE_URL/api/release/instacomp-deal-hunter-mac-candidate-diagnostics" || true)"
          echo "MAC_ONLY_CANDIDATES_HTTP=$code"
          HTTP_CODE="$code" node - <<'NODE'
          const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync('mac-candidates.json','utf8'))}catch{}
          const rows=Array.isArray(p.candidates)?p.candidates:[];
          const errors=[...new Set(rows.map(r=>r.errorMessage).filter(Boolean))];
          const runIds=[...new Set(rows.map(r=>r.runId).filter(Boolean))];
          console.log('MAC_ONLY_CANDIDATE_RECEIPT='+JSON.stringify({success:Boolean(p.success),error:p.error?String(p.error).slice(0,1200):null,errorCounts:p.errorCounts||null,candidateCount:rows.length,runIds:runIds.slice(0,10),uniqueErrors:errors.slice(0,20)}));
          if(process.env.HTTP_CODE!=='200'||!p.success) process.exit(1);
          NODE

      - name: Prove exact run-complete publish contract
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          code="$(curl -sS -o summary-probe.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$BASE_URL/api/release/instacomp-deal-hunter-run-summary-probe" || true)"
          echo "RUN_SUMMARY_PROBE_HTTP=$code"
          HTTP_CODE="$code" node - <<'NODE'
          const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync('summary-probe.json','utf8'))}catch{}
          const inner=p.evaluatePayload||{};
          const safe={success:Boolean(p.success),evaluateStatus:Number(p.evaluateStatus||0),evaluateOk:inner.ok===true,evaluateKind:inner.kind||null,evaluateError:inner.error?String(inner.error).slice(0,1200):null,cleanupSucceeded:Boolean(p.cleanupSucceeded),cleanupError:p.cleanupError?String(p.cleanupError).slice(0,1200):null};
          console.log('EXACT_RUN_SUMMARY_PROBE='+JSON.stringify(safe));
          if(process.env.HTTP_CODE!=='200'||!safe.success||safe.evaluateStatus<200||safe.evaluateStatus>=300||!safe.evaluateOk||safe.evaluateKind!=='run_complete'||!safe.cleanupSucceeded) process.exit(1);
          NODE

      - name: Wait for physical Mac Deal Hunter idle
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o status.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$BASE_URL/api/release/instacomp-deal-hunter-learning-self-test?mode=status" || true)"
            if [ "$code" = "200" ]; then
              state="$(node - <<'NODE'
          const p=require('./status.json'); const s=p.scheduler||{};
          console.log(JSON.stringify({success:Boolean(p.success),physicalMacHealthy:Boolean(p.physicalMacHealthy),enabled:Boolean(s.enabled),running:Boolean(s.running),activeRunId:s.activeRunId||null,evaluationKeyConfigured:Boolean(s.evaluationKeyConfigured),lastStatus:s.lastStatus||null,lastError:s.lastError||null}));
          NODE
              )"
              echo "MAC_IDLE_CHECK_${attempt}=$state"
              running="$(node -e "const p=require('./status.json'); process.stdout.write(String(Boolean(p.success&&p.physicalMacHealthy&&p.scheduler?.enabled&&p.scheduler?.evaluationKeyConfigured&&p.scheduler?.running)))")"
              ready="$(node -e "const p=require('./status.json'); process.stdout.write(String(Boolean(p.success&&p.physicalMacHealthy&&p.scheduler?.enabled&&p.scheduler?.evaluationKeyConfigured)))")"
              if [ "$ready" != "true" ]; then
                echo "Physical Mac Deal Hunter readiness failed."
                exit 1
              fi
              if [ "$running" = "false" ]; then
                echo "PHYSICAL_MAC_DEAL_HUNTER_IDLE=true"
                exit 0
              fi
            else
              echo "MAC_IDLE_CHECK_${attempt}_HTTP=$code"
            fi
            sleep 5
          done
          echo "Physical Mac Deal Hunter did not become idle in the bounded window."
          exit 1

      - name: Force fresh bounded Ivan Deal Hunter run
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          code="$(curl -sS -o targeted.json -w '%{http_code}' --connect-timeout 10 --max-time 320 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$BASE_URL/api/release/instacomp-deal-hunter-targeted-self-test?lane=ivan_demidov&limit=10" || true)"
          echo "TARGETED_IVAN_HTTP=$code"
          node - <<'NODE'
          const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync('targeted.json','utf8'))}catch{}
          const r=p.run||{};
          const safe={success:Boolean(p.success),lane:p.lane||null,runId:r.runId||null,status:r.status||null,discoveryCount:Number(r.discoveryCount||0),evaluatedCount:Number(r.evaluatedCount||0),actionableCount:Number(r.actionableCount||0),manualReviewCount:Number(r.manualReviewCount||0),failureCount:Number(r.failureCount||0),error:p.error?String(p.error).slice(0,1200):null};
          console.log('FRESH_TARGETED_IVAN_RECEIPT='+JSON.stringify(safe));
          if(!p.success||p.lane!=='ivan_demidov'||!r.runId||r.status!=='completed'||Number(r.discoveryCount||0)<=0||Number(r.evaluatedCount||0)<=0) process.exit(1);
          fs.writeFileSync('run-id.txt',String(r.runId));
          NODE

      - name: Read only fresh run teacher receipts
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          RUN_ID="$(cat run-id.txt)"
          code="$(curl -sS -o teachers.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$BASE_URL/api/release/instacomp-deal-hunter-teacher-run-diagnostics?runId=$RUN_ID" || true)"
          echo "RUN_SCOPED_TEACHER_DIAGNOSTICS_HTTP=$code"
          node - <<'NODE'
          const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync('teachers.json','utf8'))}catch{}
          const expected=fs.readFileSync('run-id.txt','utf8').trim();
          const run=p.run||{};
          const safe={success:Boolean(p.success),runId:p.runId||null,status:run.status||null,teacherReceiptCount:Array.isArray(p.teacherReceipts)?p.teacherReceipts.length:0,error:p.error?String(p.error).slice(0,1200):null};
          console.log('RUN_SCOPED_TEACHER_DIAGNOSTICS='+JSON.stringify(safe));
          if(!p.success||p.runId!==expected||run.run_id!==expected||run.status!=='completed'||!Array.isArray(p.teacherReceipts)||p.teacherReceipts.length===0) process.exit(1);
          NODE

      - name: Prove actual Groq and Gateway Perplexity calls from fresh run
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./teachers.json');
          const receipts=Array.isArray(p.teacherReceipts)?p.teacherReceipts:[];
          console.log('FRESH_LIVE_TEACHER_RECEIPTS='+JSON.stringify(receipts));
          const gatewayLive=receipts.some(r=>Array.isArray(r.attempts)&&r.attempts.some(a=>a.teacher==='gateway_perplexity'&&a.configured===true&&a.ok===true));
          const groqLive=receipts.some(r=>Array.isArray(r.attempts)&&r.attempts.some(a=>(a.teacher==='groq'||a.teacher==='groq_browser')&&a.configured===true&&a.ok===true));
          const correctVotes=receipts.some(r=>Number(r.requiredVotes||0)===2&&Array.isArray(r.configuredTeachers)&&r.configuredTeachers.includes('gateway_perplexity')&&(r.configuredTeachers.includes('groq')||r.configuredTeachers.includes('groq_browser')));
          const eligibleLessons=receipts.filter(r=>r.teacherLearning?.studentTrainingEligible===true);
          console.log('FRESH_PRODUCTION_TEACHER_CALL_PROOF='+JSON.stringify({runId:p.runId||null,receiptRows:receipts.length,gatewayPerplexityLive:gatewayLive,groqFamilyLive:groqLive,twoVoteConfigurationProven:correctVotes,studentTrainingEligibleReceipts:eligibleLessons.length}));
          if(!gatewayLive||!groqLive||!correctVotes) process.exit(2);
          NODE
