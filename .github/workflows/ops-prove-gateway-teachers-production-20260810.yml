          SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-service-role-key \
          npm run build
          git diff --check

      - name: Push permanent Gemini repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TruelyCollectables Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/instacomp-teacher-market-provider.ts \
