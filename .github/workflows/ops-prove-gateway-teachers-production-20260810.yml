name: Ops Prove Gateway Teachers Production 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE_URL: https://truelycollectables.com
    steps:
      - name: Emit exact safe Production teacher configuration
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/runtime.json -w '%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$SITE_URL/api/release/instacomp-teacher-runtime-diagnostics" || true)"
          echo "DIAGNOSTICS_HTTP=$code"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/runtime.json','utf8'));
          const c=p.configuration||{};
          const safe={
            success:Boolean(p.success),
            geminiConfigured:Boolean(c.geminiConfigured),
            anthropicConfigured:Boolean(c.anthropicConfigured),
            xaiConfigured:Boolean(c.xaiConfigured),
            groqConfigured:Boolean(c.groqConfigured),
            groqBrowserConfigured:Boolean(c.groqBrowserConfigured),
            gatewayPerplexityConfigured:Boolean(c.gatewayPerplexityConfigured),
            directPerplexityConfigured:Boolean(c.perplexityConfigured),
            openRouterConfigured:Boolean(c.openRouterConfigured),
            cloudflareConfigured:Boolean(c.cloudflareConfigured),
            votingTeacherCount:Number(c.votingTeacherCount||0),
            requiredVotes:Number(c.requiredVotes||0),
            teacherConsensusOperational:Boolean(c.teacherConsensusOperational),
            macLearningBridgeConfigured:Boolean(c.macLearningBridgeConfigured),
            onlineCompLearnMode:Boolean(c.onlineCompLearnMode),
          };
          console.log('SAFE_PRODUCTION_TEACHER_DIAGNOSTICS='+JSON.stringify(safe));
          if(!p.success) process.exit(1);
          NODE
