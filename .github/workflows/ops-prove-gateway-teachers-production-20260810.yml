name: Ops Probe Gemini Gateway Search 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4

      - name: Acquire project OIDC without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -f .env.local
          set -a
          source .env.local
          set +a
          test -n "${VERCEL_OIDC_TOKEN:-}"
          echo "GEMINI_GATEWAY_OIDC_ACQUIRED=true"

      - name: Install isolated Gateway probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts ai@7.0.58 @ai-sdk/gateway@4.0.46 >/dev/null

      - name: Require Gemini 3.6 Flash plus forced Parallel web search
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.local
          set +a
          cat > /tmp/gemini-gateway-probe.mjs <<'NODE'
          import { generateText, stepCountIs } from 'ai';
          import { gateway } from '@ai-sdk/gateway';

          const result = await generateText({
            model: 'google/gemini-3.6-flash',
            prompt: [
              'You are testing live sports-card market research.',
              'Use the provided web-search tool before answering.',
              'Search only eBay for: 2024 Panini Prizm Caitlin Clark #22 Silver sold.',
              'Then answer with one short sentence saying whether search results were returned.',
              'Do not guess a price.'
            ].join('\n'),
            temperature: 0,
            maxOutputTokens: 900,
            timeout: 120000,
            tools: {
              parallel_search: gateway.tools.parallelSearch({
                mode: 'one-shot',
                maxResults: 8,
                sourcePolicy: { includeDomains: ['ebay.com'] },
              }),
            },
            prepareStep: ({ stepNumber }) => stepNumber === 0
              ? { toolChoice: { type: 'tool', toolName: 'parallel_search' } }
              : { toolChoice: 'none' },
            stopWhen: stepCountIs(3),
          });

          const steps = Array.isArray(result.steps) ? result.steps : [];
          const toolCalls = steps.flatMap((step) => Array.isArray(step.toolCalls) ? step.toolCalls : []);
          const toolResults = steps.flatMap((step) => Array.isArray(step.toolResults) ? step.toolResults : []);
          const parallelCalls = toolCalls.filter((call) => call.toolName === 'parallel_search');
          const parallelResults = toolResults.filter((row) => row.toolName === 'parallel_search');
          const safe = {
            model: 'google/gemini-3.6-flash',
            textReturned: typeof result.text === 'string' && result.text.trim().length > 0,
            stepCount: steps.length,
            parallelSearchCalls: parallelCalls.length,
            parallelSearchResults: parallelResults.length,
            finishReason: result.finishReason || null,
          };
          console.log('GEMINI_GATEWAY_SEARCH_PROOF=' + JSON.stringify(safe));
          if (!safe.textReturned || safe.parallelSearchCalls < 1 || safe.parallelSearchResults < 1) process.exit(2);
          NODE
          node /tmp/gemini-gateway-probe.mjs
