name: Ops Compact Mac Deal Hunter Matrix 20260811

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: truely-collectables
    steps:
      - name: Resolve latest READY Production deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v2/teams?limit=100' > teams.json
          TEAM_ID="$(node - <<'NODE'
          const p=require('./teams.json'); const t=(p.teams||[]).find(x=>x.slug==='truelycollectables-projects'); if(!t?.id) process.exit(2); process.stdout.write(t.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT?teamId=$TEAM_ID" > project.json
          PROJECT_ID="$(node - <<'NODE'
          const p=require('./project.json'); if(!p.id) process.exit(2); process.stdout.write(p.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=20&teamId=$TEAM_ID" > deployments.json
          node - <<'NODE'
          const fs=require('fs'); const p=require('./deployments.json');
          const ready=(Array.isArray(p.deployments)?p.deployments:[]).find(d=>String(d.state||d.readyState||'').toUpperCase()==='READY'&&d.url);
          if(!ready) throw new Error('No READY production deployment.');
          console.log('PROD='+JSON.stringify({commit:ready.meta?.githubCommitSha||ready.meta?.gitCommitSha||null,url:ready.url}));
          fs.appendFileSync(process.env.GITHUB_ENV,`DEPLOY_URL=https://${ready.url}\n`);
          NODE

      - name: Print compact latest Mac run matrix
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o outcomes.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" "$DEPLOY_URL/api/release/instacomp-deal-hunter-mac-outcomes" || true)"
          echo "HTTP=$code"
          test "$code" = "200"
          node - <<'NODE'
          const p=require('./outcomes.json'); if(!p.success) throw new Error(p.error||'failed');
          const rows=Array.isArray(p.candidates)?p.candidates:[];
          const counts={
            total:rows.length,
            failed:rows.filter(r=>r.status==='failed').length,
            actionable:rows.filter(r=>r.actionable).length,
            trustedPrice:rows.filter(r=>Number(r.exactMarket?.trustedSuggestedPrice||0)>0).length,
            memoryPriced:rows.filter(r=>r.exactMarket?.historicalSoldMemory?.used||r.exactMarket?.historicalSoldFallback?.used).length,
            teacherRan:rows.filter(r=>(r.exactMarket?.configuredTeachers||[]).length>0).length,
            teacherExactSold:rows.filter(r=>Number(r.exactMarket?.pricingEligibleSoldCount||0)>0&&(r.exactMarket?.configuredTeachers||[]).length>0).length,
          };
          console.log('SUMMARY '+JSON.stringify({...p.summary,...counts}));
          rows.forEach((r,i)=>{
            const m=r.exactMarket||{}; const id=r.identity||{};
            const mem=m.historicalSoldMemory?.used?`cur:${m.historicalSoldMemory.soldCount}@${m.historicalSoldMemory.medianDeliveredPrice}`:(m.historicalSoldFallback?.used?`fallback:${m.historicalSoldFallback.soldCount}@${m.historicalSoldFallback.medianDeliveredPrice}`:'none');
            const teachers=(m.teacherAttempts||[]).filter(a=>a.configured).map(a=>`${a.teacher}:${a.ok?'ok':'err'}:${a.soldCount}`).join(',')||'none';
            const ident=[id.year,id.brand,id.setName,id.player,id.cardNumber,id.parallel,id.serialNumber,id.gradingCompany,id.gradeValue].filter(v=>v!==null&&v!==undefined&&String(v)!=='').join('|');
            console.log(`ROW ${String(i+1).padStart(2,'0')} status=${r.status||'-'} code=${r.errorCode||'-'} label=${r.dealLabel||'-'} price=${m.trustedSuggestedPrice??'-'} sold=${m.pricingEligibleSoldCount||0} mem=${mem} teachers=${teachers} id=${ident||'-'} title=${String(r.title||'').slice(0,180)}`);
          });
          NODE
