name: Ops Prove Gateway Teachers Production 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE_URL: https://truelycollectables.com
    steps:
      - name: Read Production and Mac candidate diagnostics inside Vercel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$SITE_URL/api/release/instacomp-deal-hunter-candidate-diagnostics" > diagnostics.json
          node - <<'NODE'
          const p=require('./diagnostics.json');
          if(!p.success) throw new Error(JSON.stringify(p));
          const since=Date.parse('2026-08-11T00:32:00.000Z');
          const runs=(Array.isArray(p.latestRuns)?p.latestRuns:[]).filter(r=>Date.parse(r.completed_at||r.completedAt||0)>=since);
          console.log('POST_TIMEOUT_RUNS='+JSON.stringify(runs.map(r=>({
            runId:r.run_id||r.runId||null,
            status:r.status||null,
            completedAt:r.completed_at||r.completedAt||null,
            discoveryCount:Number(r.discovery_count??r.discoveryCount??0),
            evaluatedCount:Number(r.evaluated_count??r.evaluatedCount??0),
            actionableCount:Number(r.actionable_count??r.actionableCount??0),
            manualReviewCount:Number(r.manual_review_count??r.manualReviewCount??0),
            failureCount:Number(r.failure_count??r.failureCount??0),
          }))));

          const prod=(Array.isArray(p.productionCandidates)?p.productionCandidates:[]).filter(r=>Date.parse(r.updated_at||0)>=since);
          const mac=Array.isArray(p.macCandidates)?p.macCandidates:[];
          const receipts=[];
          for(const row of prod){
            const market=row?.exact_market&&typeof row.exact_market==='object'?row.exact_market:{};
            const consensus=market?.teacherConsensus&&typeof market.teacherConsensus==='object'?market.teacherConsensus:null;
            const attempts=Array.isArray(consensus?.attempts)?consensus.attempts:[];
            if(!attempts.length) continue;
            const safeAttempts=attempts.map(a=>({
              teacher:String(a?.teacher||''),
              configured:Boolean(a?.configured),
              ok:Boolean(a?.ok),
              soldCount:Array.isArray(a?.sold)?a.sold.length:0,
              activeCount:Array.isArray(a?.active)?a.active.length:0,
              error:a?.error?String(a.error).slice(0,240):null,
            }));
            receipts.push({
              runId:String(row?.run_id||''),
              updatedAt:row?.updated_at||null,
              title:String(row?.title||'').slice(0,180),
              configuredTeachers:Array.isArray(consensus?.configuredTeachers)?consensus.configuredTeachers:[],
              requiredVotes:Number(consensus?.requiredVotes||0),
              attempts:safeAttempts,
              trustedSoldCount:Number(market?.pricingEligibleSoldCount||0),
              teacherLearning:market?.teacherLearning?{
                status:market.teacherLearning.status||null,
                trustedMarketTruth:Boolean(market.teacherLearning.trustedMarketTruth),
                studentTrainingEligible:Boolean(market.teacherLearning.studentTrainingEligible),
                pricingAuthority:Boolean(market.teacherLearning.pricingAuthority),
              }:null,
            });
          }
          console.log('POST_TIMEOUT_TEACHER_RECEIPTS='+JSON.stringify(receipts.slice(0,25)));
          console.log('MAC_POST_TIMEOUT_RECEIPTS='+JSON.stringify(mac.filter(r=>Date.parse(r.createdAt||0)>=since).slice(0,25).map(r=>({runId:r.runId,title:r.title,status:r.status,errorCode:r.errorCode,dealLabel:r.dealLabel}))));
          const gatewayLive=receipts.some(r=>r.attempts.some(a=>a.teacher==='gateway_perplexity'&&a.configured&&a.ok));
          const groqLive=receipts.some(r=>r.attempts.some(a=>(a.teacher==='groq'||a.teacher==='groq_browser')&&a.configured&&a.ok));
          const correctVotes=receipts.some(r=>r.requiredVotes===2&&r.configuredTeachers.includes('gateway_perplexity')&&(r.configuredTeachers.includes('groq')||r.configuredTeachers.includes('groq_browser')));
          console.log('POST_TIMEOUT_TEACHER_PROOF='+JSON.stringify({
            productionCandidateRows:prod.length,
            receiptRows:receipts.length,
            gatewayPerplexityLive:gatewayLive,
            groqFamilyLive:groqLive,
            twoVoteConfigurationProven:correctVotes,
            macCandidateError:p.macCandidateError||null,
          }));
          if(!gatewayLive||!groqLive||!correctVotes) process.exit(2);
          NODE
