name: Ops Inspect Mac-Local Deal Hunter Outcomes 20260811

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy exact current main with Mac-local diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main
          CURRENT_MAIN="$(git rev-parse HEAD)"
          git merge-base --is-ancestor c42e8d7b75af7cb68e03ec5f6259494f4a0e7c8b "$CURRENT_MAIN"
          echo "DIAGNOSTIC_MAIN=$CURRENT_MAIN"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@latest --prod --yes --archive=tgz --cwd . --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-prod.log
          DEPLOY_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-prod.log | tail -n 1)"
          test -n "$DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "PRODUCTION_MAC_DIAGNOSTIC_DEPLOYMENT=$DEPLOY_URL"

      - name: Read latest Mac-local Deal Hunter run
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o outcomes.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" "$DEPLOY_URL/api/release/instacomp-deal-hunter-mac-outcomes" || true)"
          echo "MAC_OUTCOMES_HTTP=$code"
          node - <<'NODE'
          const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync('outcomes.json','utf8'))}catch{}
          if(!p.success){console.log('MAC_OUTCOMES_ERROR='+JSON.stringify({error:p.error?String(p.error).slice(0,1200):null}));process.exit(2)}
          console.log('MAC_DEAL_HUNTER_SUMMARY='+JSON.stringify(p.summary||null));
          console.log('MAC_DEAL_HUNTER_CANDIDATES='+JSON.stringify(p.candidates||[]));
          NODE
