name: Ops Read Latest Deal Hunter Teacher Receipts 20260811

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest READY Production deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v2/teams?limit=100' > teams.json
          TEAM_ID="$(node - <<'NODE'
          const p=require('./teams.json'); const t=(p.teams||[]).find(x=>x.slug==='truelycollectables-projects'); if(!t?.id) process.exit(2); process.stdout.write(t.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT?teamId=$TEAM_ID" > project.json
          PROJECT_ID="$(node - <<'NODE'
          const p=require('./project.json'); if(!p.id) process.exit(2); process.stdout.write(p.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=20&teamId=$TEAM_ID" > deployments.json
          node - <<'NODE'
          const fs=require('fs'); const p=require('./deployments.json');
          const ready=(Array.isArray(p.deployments)?p.deployments:[]).find(d=>String(d.state||d.readyState||'').toUpperCase()==='READY' && d.url);
          if(!ready) throw new Error('No READY Production deployment found.');
          console.log('LATEST_READY_PRODUCTION='+JSON.stringify({url:ready.url||null,metaCommit:ready.meta?.githubCommitSha||ready.meta?.gitCommitSha||null,createdAt:ready.createdAt||null}));
          fs.appendFileSync(process.env.GITHUB_ENV,`DEPLOY_URL=https://${ready.url}\n`);
          NODE

      - name: Read newest teacher receipts and latest run IDs
        shell: bash
        run: |
          set -euo pipefail
          SINCE="$(node -p "new Date(Date.now()-3*60*60*1000).toISOString()")"
          encoded_since="$(node -p "encodeURIComponent(process.argv[1])" "$SINCE")"
          code="$(curl -sS -o teachers.json -w '%{http_code}' --connect-timeout 5 --max-time 45 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" "$DEPLOY_URL/api/release/instacomp-deal-hunter-candidate-diagnostics?mode=teachers&since=$encoded_since" || true)"
          echo "TEACHERS_HTTP=$code"
          node - <<'NODE'
          const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync('teachers.json','utf8'))}catch{}
          if(!p.success){console.log('TEACHERS_ERROR='+JSON.stringify({error:p.error?String(p.error).slice(0,800):null}));process.exit(2)}
          const runs=Array.isArray(p.latestRuns)?p.latestRuns.map(r=>({runId:r.run_id||null,status:r.status||null,startedAt:r.started_at||null,completedAt:r.completed_at||null,discoveryCount:Number(r.discovery_count||0),evaluatedCount:Number(r.evaluated_count||0),actionableCount:Number(r.actionable_count||0),manualReviewCount:Number(r.manual_review_count||0),failureCount:Number(r.failure_count||0),summary:r.summary||null})):[];
          const receipts=Array.isArray(p.teacherReceipts)?p.teacherReceipts.map(r=>({runId:r.runId||null,title:r.title||null,updatedAt:r.updatedAt||null,configuredTeachers:r.configuredTeachers||[],requiredVotes:Number(r.requiredVotes||0),pricingEligibleSoldCount:Number(r.pricingEligibleSoldCount||0),attempts:Array.isArray(r.attempts)?r.attempts.map(a=>({teacher:a.teacher||null,configured:Boolean(a.configured),ok:Boolean(a.ok),soldCount:Number(a.soldCount||0),activeCount:Number(a.activeCount||0),error:a.error?String(a.error).slice(0,260):null})):[],teacherLearning:r.teacherLearning||null})):[];
          console.log('LATEST_RUNS='+JSON.stringify(runs));
          console.log('LATEST_TEACHER_RECEIPTS='+JSON.stringify(receipts));
          const newest=runs[0]?.runId||null;
          console.log('LATEST_RUN_ID='+String(newest||''));
          NODE
