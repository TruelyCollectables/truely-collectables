name: Ops Prove Gateway Teachers Production 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE_URL: https://truelycollectables.com
    steps:
      - name: Wait until canonical Production serves Production-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o diagnostics.json -w '%{http_code}' --max-time 30 -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$SITE_URL/api/release/instacomp-deal-hunter-candidate-diagnostics?mode=production" || true)"
            if [ "$code" = "200" ] && node - <<'NODE'
          const fs=require('fs');
          let p={}; try { p=JSON.parse(fs.readFileSync('diagnostics.json','utf8')); } catch {}
          if(!p.success || p.mode!=='production') process.exit(1);
          console.log('PRODUCTION_ONLY_DIAGNOSTICS_READY='+JSON.stringify({success:true,mode:p.mode,checkedAt:p.checkedAt||null,productionCandidateCount:Array.isArray(p.productionCandidates)?p.productionCandidates.length:0,runCount:Array.isArray(p.latestRuns)?p.latestRuns.length:0}));
          NODE
            then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo 'Canonical Production never served the new mode=production diagnostics contract.' >&2
            exit 1
          fi

      - name: Require live two-family teacher configuration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$SITE_URL/api/release/instacomp-teacher-runtime-diagnostics" > runtime.json
          node - <<'NODE'
          const p=require('./runtime.json'); const c=p.configuration||{};
          const safe={
            success:Boolean(p.success),
            geminiConfigured:Boolean(c.geminiConfigured),
            groqConfigured:Boolean(c.groqConfigured),
            gatewayPerplexityConfigured:Boolean(c.gatewayPerplexityConfigured),
            votingTeacherCount:Number(c.votingTeacherCount||0),
            requiredVotes:Number(c.requiredVotes||0),
            teacherConsensusOperational:Boolean(c.teacherConsensusOperational),
            macLearningBridgeConfigured:Boolean(c.macLearningBridgeConfigured),
            onlineCompLearnMode:Boolean(c.onlineCompLearnMode),
          };
          console.log('PRODUCTION_TEACHER_CONFIGURATION='+JSON.stringify(safe));
          if(!safe.success || safe.geminiConfigured || !safe.groqConfigured || !safe.gatewayPerplexityConfigured || safe.votingTeacherCount!==2 || safe.requiredVotes!==2 || !safe.teacherConsensusOperational || !safe.macLearningBridgeConfigured || !safe.onlineCompLearnMode) process.exit(1);
          NODE

      - name: Prove actual Groq and Gateway Perplexity calls from existing Production receipts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./diagnostics.json');
          const since=Date.parse('2026-08-11T00:32:00.000Z');
          const runs=(Array.isArray(p.latestRuns)?p.latestRuns:[]).filter(r=>Date.parse(r.completed_at||0)>=since);
          console.log('POST_TIMEOUT_RUNS='+JSON.stringify(runs.map(r=>({
            runId:r.run_id||null,
            status:r.status||null,
            completedAt:r.completed_at||null,
            discoveryCount:Number(r.discovery_count||0),
            evaluatedCount:Number(r.evaluated_count||0),
            actionableCount:Number(r.actionable_count||0),
            manualReviewCount:Number(r.manual_review_count||0),
            failureCount:Number(r.failure_count||0),
          }))));

          const prod=(Array.isArray(p.productionCandidates)?p.productionCandidates:[]).filter(r=>Date.parse(r.updated_at||0)>=since);
          const receipts=[];
          for(const row of prod){
            const market=row?.exact_market&&typeof row.exact_market==='object'?row.exact_market:{};
            const consensus=market?.teacherConsensus&&typeof market.teacherConsensus==='object'?market.teacherConsensus:null;
            const attempts=Array.isArray(consensus?.attempts)?consensus.attempts:[];
            if(!attempts.length) continue;
            const safeAttempts=attempts.map(a=>({
              teacher:String(a?.teacher||''),
              configured:Boolean(a?.configured),
              ok:Boolean(a?.ok),
              soldCount:Array.isArray(a?.sold)?a.sold.length:0,
              activeCount:Array.isArray(a?.active)?a.active.length:0,
              error:a?.error?String(a.error).slice(0,240):null,
            }));
            receipts.push({
              runId:String(row?.run_id||''),
              updatedAt:row?.updated_at||null,
              title:String(row?.title||'').slice(0,180),
              configuredTeachers:Array.isArray(consensus?.configuredTeachers)?consensus.configuredTeachers:[],
              requiredVotes:Number(consensus?.requiredVotes||0),
              attempts:safeAttempts,
              trustedSoldCount:Number(market?.pricingEligibleSoldCount||0),
              teacherLearning:market?.teacherLearning?{
                status:market.teacherLearning.status||null,
                trustedMarketTruth:Boolean(market.teacherLearning.trustedMarketTruth),
                studentTrainingEligible:Boolean(market.teacherLearning.studentTrainingEligible),
                pricingAuthority:Boolean(market.teacherLearning.pricingAuthority),
              }:null,
            });
          }
          console.log('LIVE_TEACHER_RECEIPTS='+JSON.stringify(receipts.slice(0,25)));
          const gatewayLive=receipts.some(r=>r.attempts.some(a=>a.teacher==='gateway_perplexity'&&a.configured&&a.ok));
          const groqLive=receipts.some(r=>r.attempts.some(a=>(a.teacher==='groq'||a.teacher==='groq_browser')&&a.configured&&a.ok));
          const correctVotes=receipts.some(r=>r.requiredVotes===2&&r.configuredTeachers.includes('gateway_perplexity')&&(r.configuredTeachers.includes('groq')||r.configuredTeachers.includes('groq_browser')));
          const eligibleLessons=receipts.filter(r=>r.teacherLearning?.studentTrainingEligible===true);
          console.log('PRODUCTION_TEACHER_CALL_PROOF='+JSON.stringify({
            productionCandidateRows:prod.length,
            receiptRows:receipts.length,
            gatewayPerplexityLive:gatewayLive,
            groqFamilyLive:groqLive,
            twoVoteConfigurationProven:correctVotes,
            studentTrainingEligibleReceipts:eligibleLessons.length,
          }));
          if(!gatewayLive||!groqLive||!correctVotes) process.exit(2);
          NODE
