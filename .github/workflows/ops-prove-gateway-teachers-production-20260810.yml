name: Ops Prove Gateway Teachers Production 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest READY Production deployment URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v2/teams?limit=100' > teams.json
          TEAM_ID="$(node - <<'NODE'
          const p=require('./teams.json'); const t=(p.teams||[]).find(x=>x.slug==='truelycollectables-projects'); if(!t?.id) process.exit(2); process.stdout.write(t.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT?teamId=$TEAM_ID" > project.json
          PROJECT_ID="$(node - <<'NODE'
          const p=require('./project.json'); if(!p.id) process.exit(2); process.stdout.write(p.id);
          NODE
          )"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=20&teamId=$TEAM_ID" > deployments.json
          node - <<'NODE'
          const fs=require('fs'); const p=require('./deployments.json');
          const rows=Array.isArray(p.deployments)?p.deployments:[];
          const safe=rows.slice(0,10).map(d=>({uid:d.uid||null,url:d.url||null,state:d.state||d.readyState||null,createdAt:d.createdAt||null,metaCommit:d.meta?.githubCommitSha||d.meta?.gitCommitSha||null}));
          console.log('RECENT_PRODUCTION_DEPLOYMENTS='+JSON.stringify(safe));
          const ready=rows.find(d=>String(d.state||d.readyState||'').toUpperCase()==='READY' && d.url);
          if(!ready) throw new Error('No READY Production deployment found.');
          fs.writeFileSync('deployment-url.txt',`https://${ready.url}`);
          console.log('EXACT_PRODUCTION_DEPLOYMENT='+JSON.stringify({uid:ready.uid||null,url:ready.url,createdAt:ready.createdAt||null,metaCommit:ready.meta?.githubCommitSha||ready.meta?.gitCommitSha||null}));
          NODE

      - name: Prove exact deployment exposes Production-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          code="$(curl -sS -o diagnostics.json -w '%{http_code}' --connect-timeout 5 --max-time 30 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$BASE_URL/api/release/instacomp-deal-hunter-candidate-diagnostics?mode=production" || true)"
          echo "EXACT_DEPLOYMENT_DIAGNOSTICS_HTTP=$code"
          node - <<'NODE'
          const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync('diagnostics.json','utf8'))}catch{}
          console.log('EXACT_DEPLOYMENT_DIAGNOSTICS_SAFE='+JSON.stringify({success:Boolean(p.success),mode:p.mode||null,checkedAt:p.checkedAt||null,productionCandidateCount:Array.isArray(p.productionCandidates)?p.productionCandidates.length:0,runCount:Array.isArray(p.latestRuns)?p.latestRuns.length:0,error:p.error?String(p.error).slice(0,300):null}));
          if(!p.success||p.mode!=='production') process.exit(1);
          NODE

      - name: Require exact deployment two-family teacher configuration
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(cat deployment-url.txt)"
          curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$BASE_URL/api/release/instacomp-teacher-runtime-diagnostics" > runtime.json
          node - <<'NODE'
          const p=require('./runtime.json'); const c=p.configuration||{};
          const safe={success:Boolean(p.success),geminiConfigured:Boolean(c.geminiConfigured),groqConfigured:Boolean(c.groqConfigured),gatewayPerplexityConfigured:Boolean(c.gatewayPerplexityConfigured),votingTeacherCount:Number(c.votingTeacherCount||0),requiredVotes:Number(c.requiredVotes||0),teacherConsensusOperational:Boolean(c.teacherConsensusOperational),macLearningBridgeConfigured:Boolean(c.macLearningBridgeConfigured),onlineCompLearnMode:Boolean(c.onlineCompLearnMode)};
          console.log('EXACT_DEPLOYMENT_TEACHER_CONFIGURATION='+JSON.stringify(safe));
          if(!safe.success||safe.geminiConfigured||!safe.groqConfigured||!safe.gatewayPerplexityConfigured||safe.votingTeacherCount!==2||safe.requiredVotes!==2||!safe.teacherConsensusOperational||!safe.macLearningBridgeConfigured||!safe.onlineCompLearnMode) process.exit(1);
          NODE

      - name: Prove actual Groq and Gateway Perplexity calls from Production receipts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./diagnostics.json');
          const since=Date.parse('2026-08-11T00:32:00.000Z');
          const runs=(Array.isArray(p.latestRuns)?p.latestRuns:[]).filter(r=>Date.parse(r.completed_at||0)>=since);
          console.log('POST_TIMEOUT_RUNS='+JSON.stringify(runs.map(r=>({runId:r.run_id||null,status:r.status||null,completedAt:r.completed_at||null,discoveryCount:Number(r.discovery_count||0),evaluatedCount:Number(r.evaluated_count||0),actionableCount:Number(r.actionable_count||0),manualReviewCount:Number(r.manual_review_count||0),failureCount:Number(r.failure_count||0)}))));
          const prod=(Array.isArray(p.productionCandidates)?p.productionCandidates:[]).filter(r=>Date.parse(r.updated_at||0)>=since);
          const receipts=[];
          for(const row of prod){
            const market=row?.exact_market&&typeof row.exact_market==='object'?row.exact_market:{};
            const consensus=market?.teacherConsensus&&typeof market.teacherConsensus==='object'?market.teacherConsensus:null;
            const attempts=Array.isArray(consensus?.attempts)?consensus.attempts:[];
            if(!attempts.length) continue;
            const safeAttempts=attempts.map(a=>({teacher:String(a?.teacher||''),configured:Boolean(a?.configured),ok:Boolean(a?.ok),soldCount:Array.isArray(a?.sold)?a.sold.length:0,activeCount:Array.isArray(a?.active)?a.active.length:0,error:a?.error?String(a.error).slice(0,240):null}));
            receipts.push({runId:String(row?.run_id||''),updatedAt:row?.updated_at||null,title:String(row?.title||'').slice(0,180),configuredTeachers:Array.isArray(consensus?.configuredTeachers)?consensus.configuredTeachers:[],requiredVotes:Number(consensus?.requiredVotes||0),attempts:safeAttempts,trustedSoldCount:Number(market?.pricingEligibleSoldCount||0),teacherLearning:market?.teacherLearning?{status:market.teacherLearning.status||null,trustedMarketTruth:Boolean(market.teacherLearning.trustedMarketTruth),studentTrainingEligible:Boolean(market.teacherLearning.studentTrainingEligible),pricingAuthority:Boolean(market.teacherLearning.pricingAuthority)}:null});
          }
          console.log('LIVE_TEACHER_RECEIPTS='+JSON.stringify(receipts.slice(0,25)));
          const gatewayLive=receipts.some(r=>r.attempts.some(a=>a.teacher==='gateway_perplexity'&&a.configured&&a.ok));
          const groqLive=receipts.some(r=>r.attempts.some(a=>(a.teacher==='groq'||a.teacher==='groq_browser')&&a.configured&&a.ok));
          const correctVotes=receipts.some(r=>r.requiredVotes===2&&r.configuredTeachers.includes('gateway_perplexity')&&(r.configuredTeachers.includes('groq')||r.configuredTeachers.includes('groq_browser')));
          const eligibleLessons=receipts.filter(r=>r.teacherLearning?.studentTrainingEligible===true);
          console.log('PRODUCTION_TEACHER_CALL_PROOF='+JSON.stringify({productionCandidateRows:prod.length,receiptRows:receipts.length,gatewayPerplexityLive:gatewayLive,groqFamilyLive:groqLive,twoVoteConfigurationProven:correctVotes,studentTrainingEligibleReceipts:eligibleLessons.length}));
          if(!gatewayLive||!groqLive||!correctVotes) process.exit(2);
          NODE
