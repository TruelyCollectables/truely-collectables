name: Ops Inspect Compact Deal Hunter Outcomes 20260811

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-prove-gateway-teachers-production-20260810.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy exact current main with compact diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main
          CURRENT_MAIN="$(git rev-parse HEAD)"
          git merge-base --is-ancestor 185beb1a2228eec52968dcadb4c7a3cc5714ea8a "$CURRENT_MAIN"
          echo "DIAGNOSTIC_MAIN=$CURRENT_MAIN"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@latest --prod --yes --archive=tgz --cwd . --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-prod.log
          DEPLOY_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-prod.log | tail -n 1)"
          test -n "$DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "PRODUCTION_DIAGNOSTIC_DEPLOYMENT=$DEPLOY_URL"

      - name: Read compact latest Deal Hunter outcomes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o outcomes.json -w '%{http_code}' --connect-timeout 5 --max-time 25 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" "$DEPLOY_URL/api/release/instacomp-deal-hunter-latest-outcomes" || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          echo "OUTCOMES_HTTP=$code"
          test "$code" = "200"
          node - <<'NODE'
          const p=require('./outcomes.json');
          if(!p.success) throw new Error(JSON.stringify(p));
          console.log('LATEST_DEAL_HUNTER_SUMMARY='+JSON.stringify({latestRun:p.latestRun||null,queryWindow:p.queryWindow||null,summary:p.summary||null}));
          console.log('LATEST_DEAL_HUNTER_CANDIDATES='+JSON.stringify(p.candidates||[]));
          NODE
