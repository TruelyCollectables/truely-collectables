name: CollX Exact Source Rebuild 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-exact-source-rebuild-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collx-exact-source-rebuild-20260811
  cancel-in-progress: false

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"
  EXPECTED_COLLX_IMPORT_ROWS: "6011"

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Back out and rebuild every CollX physical-copy row
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess

          API='https://api.supabase.com/v1'
          TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']
          STORE=os.environ['FLAGSHIP_STORE_ID']
          EXPECTED=int(os.environ['EXPECTED_COLLX_IMPORT_ROWS'])

          # CSV source truth: all 6,909 rows were parsed before this workflow was created.
          # 6,902 rows have quantity 1. These are the only seven quantity exceptions.
          QTY_EXCEPTIONS={
            '1118487216741062656':150,
            '1096066047819933696':5,
            '1096066043650795520':5,
            '1054830295389308928':2,
            '1003302000714319872':2,
            '995291373047649280':2,
            '925094340036305920':2,
          }

          def req(method,path,body=None,timeout=120):
              cmd=['curl','-sS','--max-time',str(timeout),'-X',method,
                   '-H',f'Authorization: Bearer {TOKEN}',
                   '-H','Accept: application/json','-H','Content-Type: application/json',
                   '-o','/tmp/sb.json','-w','%{http_code}',API+path]
              if body is not None:
                  cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              raw=open('/tmp/sb.json').read() if os.path.exists('/tmp/sb.json') else ''
              try: payload=json.loads(raw) if raw else None
              except Exception: payload=raw
              try: status=int((p.stdout or '0').strip()[-3:])
              except Exception: status=0
              if p.returncode != 0 and status == 0:
                  status,payload=599,{'error':p.stderr.strip()}
              return status,payload

          s,projects=req('GET','/projects',timeout=30)
          candidates=[p for p in projects] if s==200 and isinstance(projects,list) else []
          candidates=[p for p in candidates if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(candidates)!=1:
              print('PROJECT_FAILURE',s,json.dumps(candidates,default=str)); raise SystemExit(2)
          ref=str(candidates[0].get('id') or candidates[0].get('ref') or '')
          print('PROJECT_REF='+ref)
          PUBLIC_BASE=f'https://{ref}.supabase.co/storage/v1/object/public/truely-product-images/collx-full/20260811'

          def sql(q, readonly=True, timeout=120):
              status,body=req('POST',f'/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':readonly},timeout)
              if status not in (200,201):
                  print('SQL_FAILURE',status,json.dumps(body,default=str)[:8000]); raise SystemExit(3)
              return body

          qty_case_product="CASE substring(p.sku from 7) " + ' '.join(
              f"WHEN '{k}' THEN {v}" for k,v in QTY_EXCEPTIONS.items()
          ) + " ELSE 1 END"
          qty_case_item="CASE substring(i.sku from 7) " + ' '.join(
              f"WHEN '{k}' THEN {v}" for k,v in QTY_EXCEPTIONS.items()
          ) + " ELSE 1 END"

          # ----- READ-ONLY PREFLIGHT -----
          pre=sql(f"""
          with cp as (
            select * from public.products
            where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY'
          ), ci as (
            select * from public.inventory_items
            where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY'
          ), j as (
            select p.id product_id,p.sku product_sku,p.ebay_item_id,p.archived_at,p.quantity product_qty,p.price product_price,p.image_url,
                   i.id inventory_item_id,i.sku item_sku,i.legacy_product_id,i.quantity inventory_qty,i.price inventory_price,i.status
            from cp p join ci i on i.legacy_product_id=p.id and i.sku=p.sku
          )
          select
            (select count(*)::int from cp) products,
            (select count(*)::int from ci) inventory_items,
            (select count(*)::int from j) exact_pairs,
            (select count(*)::int from cp where coalesce(btrim(ebay_item_id::text),'')<>'') ebay_linked,
            (select count(*)::int from cp where sku is null or sku !~ '^COLLX-[0-9]+$') malformed_skus,
            (select count(*)::int from (select sku from cp group by sku having count(*)<>1) d) duplicate_product_skus,
            (select count(*)::int from (select sku from ci group by sku having count(*)<>1) d) duplicate_item_skus,
            (select count(*)::int from ci where coalesce(price,0)<=0) nonpositive_item_prices,
            (select count(*)::int from public.checkout_inventory_reservations r join cp p on p.id=r.legacy_product_id where r.store_id='{STORE}'::uuid and r.status='active' and r.expires_at>now()) active_reservations,
            (select count(*)::int from cp p where not exists (
              select 1 from storage.objects o where o.bucket_id='truely-product-images'
              and o.name='collx-full/20260811/'||substring(p.sku from 7)||'/front.jpg'
            )) missing_owned_fronts;
          """)
          print('PREFLIGHT='+json.dumps(pre,default=str))
          if not isinstance(pre,list) or len(pre)!=1: raise SystemExit(10)
          pr=pre[0]
          required_zero=['ebay_linked','malformed_skus','duplicate_product_skus','duplicate_item_skus','nonpositive_item_prices','active_reservations','missing_owned_fronts']
          if int(pr.get('products') or 0)!=EXPECTED or int(pr.get('inventory_items') or 0)!=EXPECTED or int(pr.get('exact_pairs') or 0)!=EXPECTED:
              print('REFUSING_COUNT_MISMATCH'); raise SystemExit(11)
          if any(int(pr.get(k) or 0)!=0 for k in required_zero):
              print('REFUSING_PREFLIGHT_GUARD'); raise SystemExit(12)

          # Refuse to reset source quantities if any CollX product has ever been captured in an order line.
          cols=sql("""select table_name,column_name from information_schema.columns where table_schema='public' and table_name in ('order_items','order_line_items') and column_name in ('product_id','legacy_product_id');""")
          sales_found=0
          for c in cols if isinstance(cols,list) else []:
              table=str(c.get('table_name') or '')
              col=str(c.get('column_name') or '')
              if table not in ('order_items','order_line_items') or col not in ('product_id','legacy_product_id'): continue
              q=sql(f"select count(*)::int as n from public.{table} oi join public.products p on p.id=oi.{col} where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY';")
              if isinstance(q,list) and q: sales_found += int(q[0].get('n') or 0)
          print('COLLX_ORDER_LINES='+str(sales_found))
          if sales_found:
              print('REFUSING_SOLD_COLLX_SOURCE_RESET'); raise SystemExit(13)

          # Backup names are intentionally durable until post-rebuild cleanup is explicitly done.
          existing_backup=sql("""select count(*)::int as n from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('ops_collx_rebuild_backup_products_20260811','ops_collx_rebuild_backup_items_20260811','ops_collx_rebuild_backup_images_20260811');""")
          if not isinstance(existing_backup,list) or int(existing_backup[0].get('n') or 0)!=0:
              print('REFUSING_EXISTING_BACKUP_TABLES'); raise SystemExit(14)

          # ----- PHASE 1: BACK OUT EVERY COLLX ROW FROM STOREFRONT -----
          quarantine=sql(f"""
          begin;
          create table public.ops_collx_rebuild_backup_products_20260811 as
            select * from public.products where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY';
          create table public.ops_collx_rebuild_backup_items_20260811 as
            select * from public.inventory_items where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY';
          create table public.ops_collx_rebuild_backup_images_20260811 as
            select ii.* from public.inventory_images ii join public.inventory_items i on i.id=ii.inventory_item_id
            where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY';

          update public.inventory_items i
          set status='draft',quantity=0,updated_at=now(),
              metadata=coalesce(i.metadata,'{{}}'::jsonb) || jsonb_build_object('exact_source_rebuild_20260811',jsonb_build_object('phase','quarantined','recorded_at',now()))
          where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY';

          update public.products p
          set quantity=0,price=0,archived_at=now()
          where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY';
          commit;
          select
            (select count(*)::int from public.products where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY' and archived_at is null and quantity>0 and price>0) live_products,
            (select count(*)::int from public.inventory_items where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY' and status='active' and quantity>0) live_items;
          """,readonly=False)
          print('QUARANTINE_RESULT='+json.dumps(quarantine,default=str))
          if not isinstance(quarantine,list) or int(quarantine[-1].get('live_products') or 0)!=0 or int(quarantine[-1].get('live_items') or 0)!=0:
              print('QUARANTINE_VERIFY_FAILED'); raise SystemExit(20)

          # ----- PHASE 2: REBUILD ONE PHYSICAL COLLX ID PER PRODUCT ROW -----
          # No title/player/set grouping is used. Every COLLX-<id> row is restored independently.
          rebuild=sql(f"""
          begin;

          update public.inventory_items i
          set quantity={qty_case_item},
              status='active',
              notes=trim(both ' |' from regexp_replace(coalesce(i.notes,''),'\\s*\\|?\\s*DRAFT / NOT FOR SALE','', 'gi')),
              metadata=(coalesce(i.metadata,'{{}}'::jsonb)
                - 'collx_same_price_consolidation_20260811')
                || jsonb_build_object(
                  'source','collx_full_migration_20260811',
                  'collx_id',substring(i.sku from 7),
                  'original_quantity',{qty_case_item},
                  'migration_quarantine_released',true,
                  'exact_source_rebuild_20260811',jsonb_build_object('phase','rebuilt','quantity_source','CollX CSV quantity column','image_key','collx_id','recorded_at',now())
                ),
              updated_at=now()
          where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY';

          update public.products p
          set quantity={qty_case_product},
              price=i.price,
              image_url='{PUBLIC_BASE}/'||substring(p.sku from 7)||'/front.jpg',
              archived_at=null
          from public.inventory_items i
          where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY'
            and i.store_id=p.store_id and i.legacy_product_id=p.id and i.sku=p.sku;

          delete from public.inventory_images ii
          using public.inventory_items i
          where ii.inventory_item_id=i.id and i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY';

          insert into public.inventory_images(inventory_item_id,image_url,alt_text,sort_order,is_primary)
          select i.id,'{PUBLIC_BASE}/'||substring(i.sku from 7)||'/front.jpg',i.title,0,true
          from public.inventory_items i
          where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY';

          insert into public.inventory_images(inventory_item_id,image_url,alt_text,sort_order,is_primary)
          select i.id,'{PUBLIC_BASE}/'||substring(i.sku from 7)||'/back.jpg',i.title,1,false
          from public.inventory_items i
          where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY'
            and exists (
              select 1 from storage.objects o where o.bucket_id='truely-product-images'
                and o.name='collx-full/20260811/'||substring(i.sku from 7)||'/back.jpg'
            );

          do $$
          declare
            v_products int; v_items int; v_qty_bad int; v_product_image_bad int;
            v_front_bad int; v_bad_extra_images int; v_live int;
          begin
            select count(*)::int into v_products from public.products p where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY';
            select count(*)::int into v_items from public.inventory_items i where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY';
            select count(*)::int into v_qty_bad
            from public.products p join public.inventory_items i on i.store_id=p.store_id and i.legacy_product_id=p.id and i.sku=p.sku
            where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY'
              and (p.quantity <> {qty_case_product} or i.quantity <> {qty_case_item});
            select count(*)::int into v_product_image_bad
            from public.products p where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY'
              and p.image_url <> '{PUBLIC_BASE}/'||substring(p.sku from 7)||'/front.jpg';
            select count(*)::int into v_front_bad
            from public.inventory_items i where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY'
              and not exists (select 1 from public.inventory_images ii where ii.inventory_item_id=i.id and ii.image_url='{PUBLIC_BASE}/'||substring(i.sku from 7)||'/front.jpg' and ii.is_primary=true and ii.sort_order=0);
            select count(*)::int into v_bad_extra_images
            from public.inventory_images ii join public.inventory_items i on i.id=ii.inventory_item_id
            where i.store_id='{STORE}'::uuid and i.sku >= 'COLLX-' and i.sku < 'COLLY'
              and ii.image_url not in ('{PUBLIC_BASE}/'||substring(i.sku from 7)||'/front.jpg','{PUBLIC_BASE}/'||substring(i.sku from 7)||'/back.jpg');
            select count(*)::int into v_live
            from public.products p join public.inventory_items i on i.store_id=p.store_id and i.legacy_product_id=p.id and i.sku=p.sku
            where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY'
              and p.archived_at is null and p.quantity>0 and p.price>0 and i.status='active' and i.quantity=p.quantity and i.price=p.price;
            if v_products <> {EXPECTED} or v_items <> {EXPECTED} or v_qty_bad<>0 or v_product_image_bad<>0 or v_front_bad<>0 or v_bad_extra_images<>0 or v_live<>{EXPECTED} then
              raise exception 'exact_rebuild_postcondition_failed products=% items=% qty_bad=% product_image_bad=% front_bad=% extra_images=% live=%',v_products,v_items,v_qty_bad,v_product_image_bad,v_front_bad,v_bad_extra_images,v_live;
            end if;
          end $$;
          commit;
          """,readonly=False,timeout=180)
          print('REBUILD_SQL_DONE='+json.dumps(rebuild,default=str))

          verify=sql(f"""
          with cp as (
            select * from public.products where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY'
          ), ci as (
            select * from public.inventory_items where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY'
          )
          select
            (select count(*)::int from cp) products,
            (select count(*)::int from ci) inventory_items,
            (select count(*)::int from cp where archived_at is null and quantity>0 and price>0) live_products,
            (select count(*)::int from ci where status='active' and quantity>0 and price>0) active_items,
            (select coalesce(sum(quantity),0)::int from cp) total_units,
            (select count(*)::int from cp p where p.quantity <> {qty_case_product}) source_quantity_mismatches,
            (select count(*)::int from ci i where i.quantity <> {qty_case_item}) item_quantity_mismatches,
            (select count(*)::int from cp p where p.image_url <> '{PUBLIC_BASE}/'||substring(p.sku from 7)||'/front.jpg') product_front_mismatches,
            (select count(*)::int from public.inventory_images ii join ci i on i.id=ii.inventory_item_id where ii.image_url not in ('{PUBLIC_BASE}/'||substring(i.sku from 7)||'/front.jpg','{PUBLIC_BASE}/'||substring(i.sku from 7)||'/back.jpg')) wrong_inventory_images;
          """)
          print('FINAL_VERIFY='+json.dumps(verify,default=str))
          if not isinstance(verify,list) or len(verify)!=1: raise SystemExit(30)
          vr=verify[0]
          if int(vr.get('products') or 0)!=EXPECTED or int(vr.get('inventory_items') or 0)!=EXPECTED or int(vr.get('live_products') or 0)!=EXPECTED or int(vr.get('active_items') or 0)!=EXPECTED:
              raise SystemExit(31)
          for k in ('source_quantity_mismatches','item_quantity_mismatches','product_front_mismatches','wrong_inventory_images'):
              if int(vr.get(k) or 0)!=0: raise SystemExit(32)

          aja=sql(f"""
          select p.id product_id,p.sku,p.title,p.price,p.quantity,p.image_url,
                 i.id inventory_item_id,i.quantity inventory_quantity,i.status,
                 array_agg(ii.image_url order by ii.sort_order) filter (where ii.image_url is not null) images
          from public.products p
          join public.inventory_items i on i.store_id=p.store_id and i.legacy_product_id=p.id and i.sku=p.sku
          left join public.inventory_images ii on ii.inventory_item_id=i.id
          where p.store_id='{STORE}'::uuid and p.sku in ('COLLX-1116438452553061376','COLLX-1111931109962371072')
          group by p.id,p.sku,p.title,p.price,p.quantity,p.image_url,i.id,i.quantity,i.status
          order by p.sku;
          """)
          print('AJA_FINAL='+json.dumps(aja,default=str))
          if not isinstance(aja,list) or len(aja)!=2 or any(int(r.get('quantity') or 0)!=1 or int(r.get('inventory_quantity') or 0)!=1 for r in aja):
              raise SystemExit(33)
          if len({str(r.get('image_url') or '') for r in aja})!=2:
              raise SystemExit(34)

          exceptions=sql(f"""
          select p.sku,p.title,p.quantity,p.image_url from public.products p
          where p.store_id='{STORE}'::uuid and p.sku in ({','.join(repr('COLLX-'+k) for k in QTY_EXCEPTIONS)}) order by p.sku;
          """)
          print('SOURCE_QTY_EXCEPTION_ROWS_PRESENT='+json.dumps(exceptions,default=str))
          print('COLLX_EXACT_SOURCE_REBUILD=SUCCESS')
          PY
