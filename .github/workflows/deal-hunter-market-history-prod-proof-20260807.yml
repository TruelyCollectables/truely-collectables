name: Deal Hunter Market History Production Proof 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deal-hunter-market-history-prod-proof-20260807.yml"
      - "scripts/run-deal-hunter-market-history-prod-proof.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deal-hunter-market-history-prod-proof-20260807
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: dc781cf690bc9adb389d605d2b2e896e71c20c5e
  EXPECTED_BRANCH: ops/deal-hunter-market-history-prod-proof-20260807
  VERCEL_SCOPE: truelycollectables-projects
  EVIDENCE_DIR: .audit/deal-hunter-market-history-prod-proof-20260807

jobs:
  production-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/deal-hunter-market-history-prod-proof-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out guarded operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact main and operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          expected=(
            .github/workflows/deal-hunter-market-history-prod-proof-20260807.yml
            scripts/run-deal-hunter-market-history-prod-proof.mjs
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/source-sha.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Resolve Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/deal-hunter-market-history-proof"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/deal-hunter-market-history-proof/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/deal-hunter-market-history-proof/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/deal-hunter-market-history-proof/production.env" >> "$GITHUB_ENV"

      - name: Reconfirm exact main immediately before Production DB mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Apply Deal Hunter migrations and run rollback-only Production proof
        run: node scripts/run-deal-hunter-market-history-prod-proof.mjs

      - name: Deploy exact merged main to Vercel Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          exact="$RUNNER_TEMP/deal-hunter-market-history-exact-main"
          rm -rf "$exact"
          git worktree add --detach "$exact" "$EXPECTED_MAIN_SHA"
          test "$(git -C "$exact" rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -z "$(git -C "$exact" status --porcelain)"
          mkdir -p "$exact/.vercel"
          cp .vercel/project.json "$exact/.vercel/project.json"
          cd "$exact"
          npx vercel@56.2.0 deploy --prod --yes --force \
            --meta "launchSourceSha=$EXPECTED_MAIN_SHA" \
            --meta "launchPurpose=deal-hunter-market-history-proof" \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/vercel-deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$GITHUB_WORKSPACE/$EVIDENCE_DIR/vercel-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/deployment-url.txt"

      - name: Verify deployed Deal Hunter routes exist and stay protected
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          root="$(curl --location --silent --show-error --max-time 90 --output "$EVIDENCE_DIR/root.html" --write-out '%{http_code}' "$DEPLOYMENT_URL/")"
          test "$root" = "200"
          history="$(curl --silent --show-error --max-time 60 --output "$EVIDENCE_DIR/history-unauthorized.json" --write-out '%{http_code}' "$DEPLOYMENT_URL/api/instacomp/market-history")"
          test "$history" = "401"
          printf '{"root":%s,"marketHistoryUnauthorized":%s}\n' "$root" "$history" > "$EVIDENCE_DIR/deployment-boundaries.json"

      - name: Remove pulled Production environment
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/deal-hunter-market-history-proof/production.env"

      - name: Upload sanitized Production proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-hunter-market-history-prod-proof-20260807
          path: .audit/deal-hunter-market-history-prod-proof-20260807
          if-no-files-found: error
          retention-days: 90
