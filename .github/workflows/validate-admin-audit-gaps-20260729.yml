name: Validate Admin Audit Gaps 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-admin-audit-gaps-20260729.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-only-placeholder-admin-password
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build-only-placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-admin-audit-gaps-20260729
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified admin audit fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          smoke = Path('scripts/smoke-admin-runtime.mjs')
          text = smoke.read_text()

          def add_after(anchor, addition, marker, label):
              global text
              if marker in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'{label} insertion anchor missing')
              text = text.replace(anchor, anchor + addition, 1)

          add_after(
              '''  {
              path: "/admin/login",
              auth: false,
              expectedText: "Admin password",
            },
          ''',
              '''  {
              path: "/admin/reset-password",
              auth: false,
              expectedText: "Choose a permanent admin password",
            },
          ''',
              'path: "/admin/reset-password"',
              'reset-password smoke',
          )
          add_after(
              '''  {
              path: "/admin/quick-list",
              auth: true,
              expectedText: "Accuracy Council + InstaComp™",
            },
          ''',
              '''  {
              path: "/admin/verified-reference-import",
              auth: true,
              expectedText: "Verified Reference → Pending Listings",
            },
          ''',
              'path: "/admin/verified-reference-import"',
              'verified-reference-import smoke',
          )
          add_after(
              '''  {
              path: "/admin/orders",
              auth: true,
              expectedText: "Orders",
            },
          ''',
              '''  {
              path: "/admin/order-notifications",
              auth: true,
              expectedText: "Order Notification Delivery",
            },
          ''',
              'path: "/admin/order-notifications"',
              'order-notifications smoke',
          )
          add_after(
              '''  {
              path: "/admin/accounts",
              auth: true,
              expectedTexts: ["Customer Account Lookup", "Customer Accounts"],
            },
          ''',
              '''  {
              path: "/admin/buyer-protection",
              auth: true,
              expectedText: "Buyer Protection Claims",
            },
          ''',
              'path: "/admin/buyer-protection"',
              'buyer-protection smoke',
          )
          add_after(
              '''  {
              path: "/admin/ebay/full-store-sync",
              auth: true,
              expectedText: "Full eBay Store Sync",
            },
          ''',
              '''  {
              path: "/admin/ebay/launch-ready-sync",
              auth: true,
              expectedText: "eBay Launch Readiness",
            },
          ''',
              'path: "/admin/ebay/launch-ready-sync"',
              'launch-ready-sync smoke',
          )
          smoke.write_text(text)

          admin_page = Path('src/app/admin/page.tsx')
          text = admin_page.read_text()

          def add_admin_link(anchor, addition, marker, label):
              global text
              if marker in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'{label} link anchor missing')
              text = text.replace(anchor, anchor + addition, 1)

          add_admin_link(
              '        { href: "/admin/live-payment-launch", label: "Payment Gate" },\n',
              '        { href: "/admin/buyer-protection", label: "Buyer Protection" },\n',
              'href: "/admin/buyer-protection"',
              'buyer-protection',
          )
          add_admin_link(
              '        { href: "/admin/ebay/full-store-sync", label: "Full Store Sync" },\n',
              '        { href: "/admin/ebay/launch-ready-sync", label: "Launch Ready Sync" },\n',
              'href: "/admin/ebay/launch-ready-sync"',
              'launch-ready-sync',
          )
          add_admin_link(
              '        { href: "/admin/quick-list", label: "Quick List" },\n',
              '        { href: "/admin/verified-reference-import", label: "Verified Intake" },\n',
              'href: "/admin/verified-reference-import"',
              'verified-reference-import',
          )
          support_anchor = '''        { href: "/admin/orders", label: "Orders" },
                { href: "/admin/order-review-cases", label: "Review Cases" },
          '''
          support_replacement = '''        { href: "/admin/orders", label: "Orders" },
                { href: "/admin/order-notifications", label: "Order Notifications" },
                { href: "/admin/order-review-cases", label: "Review Cases" },
          '''
          if 'href: "/admin/order-notifications"' not in text:
              if support_anchor not in text:
                  raise SystemExit('order-notifications link anchor missing')
              text = text.replace(support_anchor, support_replacement, 1)
          add_admin_link(
              '        { href: "/admin/settings", label: "Settings" },\n',
              '        { href: "/admin/reset-password", label: "Owner Recovery" },\n',
              'href: "/admin/reset-password"',
              'reset-password',
          )
          scope_copy = 'Hides the alert only; the product record stays unchanged.'
          scope_expression = '{"Hides the alert only; the product record stays unchanged."}'
          if scope_expression not in text:
              if scope_copy not in text:
                  raise SystemExit('price-radar scope copy missing')
              text = text.replace(scope_copy, scope_expression, 1)
          admin_page.write_text(text)

          reset_page = Path('src/app/admin/reset-password/page.tsx')
          text = reset_page.read_text()
          dynamic_login = 'href={`/admin/login?next=${encodeURIComponent(nextPath)}`}'
          if 'href="/admin/login"' not in text:
              if dynamic_login not in text:
                  raise SystemExit('reset-password login link anchor missing')
              text = text.replace(dynamic_login, 'href="/admin/login"', 1)
          reset_page.write_text(text)

          notifications = Path('src/app/admin/order-notifications/page.tsx')
          text = notifications.read_text()
          if 'max-w-7xl' not in text:
              raise SystemExit('order notification shell anchor missing')
          notifications.write_text(text.replace('max-w-7xl', 'max-w-[1500px]', 1))

          payment = Path('src/app/admin/live-payment-launch/page.tsx')
          text = payment.read_text()
          next_step_anchor = '  const paymentNextStep =\n'
          if 'const paymentApprovalPosture =' not in text:
              if next_step_anchor not in text:
                  raise SystemExit('payment next-step anchor missing')
              insertion = '''  const paymentApprovalPosture =
            approvalBlockingCount > 0 ? "NOT APPROVABLE" : databaseApproval.status;
          '''
              text = text.replace(next_step_anchor, insertion + next_step_anchor, 1)
          old = '            status={databaseApproval.status}\n'
          new = '            status={paymentApprovalPosture}\n'
          if old not in text:
              raise SystemExit('database approval status anchor missing')
          payment.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/validate-admin-audit-gaps-20260729.yml

      - name: Install dependencies
        run: npm ci

      - name: Format changed source
        run: npx prettier --write scripts/smoke-admin-runtime.mjs src/app/admin/page.tsx src/app/admin/reset-password/page.tsx src/app/admin/order-notifications/page.tsx src/app/admin/live-payment-launch/page.tsx

      - name: Run targeted admin regressions
        run: |
          npm run simulate:admin-dashboard-actions
          npm run simulate:admin-live-launch-gates

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Run Production build
        run: npm run build

      - name: Confirm narrow clean diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf '%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              scripts/smoke-admin-runtime.mjs|src/app/admin/page.tsx|src/app/admin/reset-password/page.tsx|src/app/admin/order-notifications/page.tsx|src/app/admin/live-payment-launch/page.tsx|.github/workflows/validate-admin-audit-gaps-20260729.yml) ;;
              *) echo "Unexpected file: $file" >&2; exit 1 ;;
            esac
          done

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-admin-runtime.mjs src/app/admin/page.tsx src/app/admin/reset-password/page.tsx src/app/admin/order-notifications/page.tsx src/app/admin/live-payment-launch/page.tsx .github/workflows/validate-admin-audit-gaps-20260729.yml
          git commit -m "Fix admin audit coverage and gate posture"
          git push origin HEAD:agent/fix-admin-audit-gaps-20260729
