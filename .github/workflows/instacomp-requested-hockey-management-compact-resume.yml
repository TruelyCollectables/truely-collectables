    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/instacomp-requested-hockey-management-compact-resume.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-requested-hockey-management-production
  cancel-in-progress: true

jobs:
  production-writes-paused:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep Production checklist writes paused overnight
        run: echo 'Production checklist Registry writes are intentionally paused while the 5-minute source-only harvest runs.'
