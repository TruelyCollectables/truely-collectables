name: One-Hour Storefront Launch Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run-one-hour-launch-audit.mjs"
      - "scripts/audit-public-supabase-schema-from-storefront.mjs"
      - "scripts/run-supabase-management-launch-audit.mjs"
      - "scripts/audit-unapplied-storefront-migrations.mjs"
      - "scripts/audit-live-money-database-preflight.mjs"
      - ".github/workflows/one-hour-launch-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-hour-launch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT_NAME: truely-collectables
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel authentication
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is missing"; exit 1; }

      - name: Link the known Vercel project without deployment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tcos-vercel-cli-56.2.0"
          npm --prefix "$RUNNER_TEMP/tcos-vercel-cli-56.2.0" exec --yes --package=vercel@56.2.0 -- \
            vercel --cwd "$PWD" link --yes --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color

      - name: List Production environment names
        shell: bash
        run: |
          npm --prefix "$RUNNER_TEMP/tcos-vercel-cli-56.2.0" exec --yes --package=vercel@56.2.0 -- \
            vercel --cwd "$PWD" env ls production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" --no-color > vercel-production-env-names.txt

      - name: Pull usable Production environment values without deployment
        id: env_pull
        continue-on-error: true
        shell: bash
        run: |
          npm --prefix "$RUNNER_TEMP/tcos-vercel-cli-56.2.0" exec --yes --package=vercel@56.2.0 -- \
            vercel --cwd "$PWD" env pull .env.storefront.production \
            --environment=production --yes --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" --no-color

      - name: Read deployment quota without deploying
        continue-on-error: true
        shell: bash
        run: node scripts/deploy-production.mjs --quota-status --json > vercel-quota-status.json

      - name: Audit live schema, current storefront, quota, and migration access
        shell: bash
        run: node scripts/run-one-hour-launch-audit.mjs

      - name: Audit live Supabase schema through public storefront assets
        shell: bash
        run: node scripts/audit-public-supabase-schema-from-storefront.mjs

      - name: Audit Supabase through the Management API
        id: supabase_management
        continue-on-error: true
        shell: bash
        run: node scripts/run-supabase-management-launch-audit.mjs

      - name: Compare live history to repository storefront migrations
        id: migration_compare
        continue-on-error: true
        shell: bash
        run: node scripts/audit-unapplied-storefront-migrations.mjs

      - name: Audit live-money database blockers
        id: live_money_db
        continue-on-error: true
        shell: bash
        run: node scripts/audit-live-money-database-preflight.mjs

      - name: Verify protected Production Stripe reconciliation
        id: stripe_cron
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TCOS_CRON_SECRET:-}" || { echo "TCOS_CRON_SECRET is missing"; exit 1; }
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/stripe-reconciliation.json" --write-out "%{http_code}" \
            --header "Authorization: Bearer ${TCOS_CRON_SECRET}" \
            "https://truelycollectables.com/api/cron/stripe-reconciliation")
          node - "$status" "$RUNNER_TEMP/stripe-reconciliation.json" <<'NODE'
          const fs = require('fs');
          const status = Number(process.argv[2]);
          const raw = fs.readFileSync(process.argv[3], 'utf8');
          let body = null;
          try { body = JSON.parse(raw); } catch {}
          const safe = {
            checkedAt: new Date().toISOString(),
            httpStatus: status,
            success: body?.success === true,
            error: typeof body?.error === 'string' ? body.error : null,
            runIdPresent: Boolean(body?.runId || body?.run_id),
            itemCount: Number(body?.itemCount ?? body?.item_count ?? body?.items?.length ?? 0),
            discrepancyCount: Number(body?.discrepancyCount ?? body?.discrepancy_count ?? 0),
            secretValuesIncluded: false
          };
          fs.writeFileSync('production-stripe-cron-verification.json', JSON.stringify(safe, null, 2) + '\n');
          if (status !== 200 || body?.success !== true) process.exit(1);
NODE

      - name: Upload redacted launch audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-hour-launch-audit-evidence
          path: |
            one-hour-launch-audit.json
            public-supabase-schema-audit.json
            supabase-management-launch-audit.json
            unapplied-storefront-migrations.json
            live-money-database-preflight.json
            production-stripe-cron-verification.json
          if-no-files-found: error
          retention-days: 2

      - name: Remove linked-project and environment files
        if: always()
        shell: bash
        run: |
          rm -rf .vercel
          rm -f .env.storefront.production vercel-production-env-names.txt vercel-quota-status.json one-hour-launch-audit.json public-supabase-schema-audit.json supabase-management-launch-audit.json unapplied-storefront-migrations.json live-money-database-preflight.json production-stripe-cron-verification.json
