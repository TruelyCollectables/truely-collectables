name: Launch 2 Final B30F084 Production 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/launch2-final-b30f084-production-20260730.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: launch2-final-b30f084-production-20260730
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: b30f084775775d258e02affafd695028261c12c9
  EXPECTED_BRANCH: ops/launch2-final-b30f084-production-20260730
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  PROJECT_REF: rfdzsoykhnngzdnvzlhz
  EVIDENCE_DIR: .audit/launch2-final-b30f084-production
  CURRENT_EVIDENCE_RUN: "30516896769"
  CURRENT_EVIDENCE_ARTIFACT: launch2-final-b30f084-bound-evidence
  ORIGINAL_CERT_RUN: "30501917103"
  ORIGINAL_CERT_ARTIFACT: truely-launch-2-final-production-certificate-ad575

jobs:
  certify-production:
    if: github.event.pull_request.head.ref == 'ops/launch2-final-b30f084-production-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out guarded operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/launch2-final-b30f084-production-20260730.yml"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          test -n "${VERCEL_TOKEN:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"

      - name: Download current exact-main validation evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CURRENT_EVIDENCE_ARTIFACT }}
          path: ${{ runner.temp }}/current-main-evidence
          github-token: ${{ github.token }}
          repository: TruelyCollectables/truely-collectables
          run-id: ${{ env.CURRENT_EVIDENCE_RUN }}

      - name: Download original Launch 2 Production certificate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORIGINAL_CERT_ARTIFACT }}
          path: ${{ runner.temp }}/original-launch2-certificate
          github-token: ${{ github.token }}
          repository: TruelyCollectables/truely-collectables
          run-id: ${{ env.ORIGINAL_CERT_RUN }}

      - name: Bind original gates and current exact-main gates
        shell: bash
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/current-main-evidence"
          original="$RUNNER_TEMP/original-launch2-certificate"
          test -f "$current/cleanup-binding.json"
          test -f "$current/prior-evidence-binding.json"
          test -f "$current/platform-fee-grant-production.json"
          test -f "$current/sold-lifecycle.log"
          test -f "$current/sold-trigger.log"
          test -f "$current/privileged-route-audit.log"
          test -f "$current/privileged-route-auth.log"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.ok == true and .cleanedMainSha == $sha and .onlyTemporaryVerificationFilesRemoved == true and .permanentAdminOrderRefundFeeSourcesChanged == false' "$current/cleanup-binding.json" >/dev/null
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.ok == true and .currentCleanedMainSha == $sha and .priorSignedAdminRuntime == "passed" and .cleanupOnlyDiff == "passed"' "$current/prior-evidence-binding.json" >/dev/null
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.ok == true and .exactMainSha == $sha and .serviceRoleDelete == true and .anonDelete == false and .authenticatedDelete == false' "$current/platform-fee-grant-production.json" >/dev/null
          grep -q 'All issue #253 sold-lifecycle simulations passed' "$current/sold-lifecycle.log"
          grep -q 'All issue #253 sold trigger-order simulations passed' "$current/sold-trigger.log"
          grep -q 'Privileged API route audit passed' "$current/privileged-route-audit.log"
          grep -q 'Privileged route authorization simulation passed' "$current/privileged-route-auth.log"
          test -f "$original/final-launch-2-certificate.json"
          jq -e '.result == "PASS" and (.blockers|length) == 0 and .gates.trackedSourceSecretScan == "PASS" and .gates.privilegedRouteProtection == "PASS" and .gates.lint == "PASS" and .gates.typeScript == "PASS" and .gates.productionBuild == "PASS" and .gates.liveProductionCrawlAndAccess.blockers == 0 and .gates.runtimeIntegrationsAndData.blockers == 0 and (.gates.lighthouse.blockers|length) == 0' "$original/final-launch-2-certificate.json" >/dev/null
          jq -n --arg sha "$EXPECTED_MAIN_SHA" --arg currentRun "$CURRENT_EVIDENCE_RUN" --arg originalRun "$ORIGINAL_CERT_RUN" '{ok:true,exactCurrentMainSha:$sha,currentExactMainEvidenceRun:($currentRun|tonumber),originalLaunch2CertificateRun:($originalRun|tonumber),originalLaunch2GatesBound:true,currentIssue253SourceSecurityBuildBound:true,currentCleanupOnlyAdminEvidenceBound:true,verifiedAt:(now|todate)}' > "$EVIDENCE_DIR/evidence-binding.json"

      - name: Reconfirm exact main before Production deployment
        run: git fetch origin main && test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Deploy exact cleaned main to Vercel Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          exact="$RUNNER_TEMP/launch2-final-b30f084-exact"
          rm -rf "$exact"
          git worktree add --detach "$exact" "$EXPECTED_MAIN_SHA"
          test "$(git -C "$exact" rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          mkdir -p "$exact/.vercel" && cp .vercel/project.json "$exact/.vercel/project.json"
          cd "$exact"
          url="$(npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz --meta "githubCommitSha=$EXPECTED_MAIN_SHA" --meta "launchPurpose=launch2-final-b30f084-production" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2> "$RUNNER_TEMP/launch2-final-b30f084-deploy-stderr.txt" | tail -n 1)"
          test -n "$url"
          printf '%s\n' "$url" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/deployment-url.txt"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          npx vercel@56.2.0 inspect "$url" --wait --timeout=12m --no-color --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/deployment-inspect.txt"

      - name: Verify exact Production metadata and public boundaries
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          host="${DEPLOYMENT_URL#https://}"
          curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?slug=$VERCEL_SCOPE" > "$EVIDENCE_DIR/deployment.json"
          DEPLOYMENT_JSON="$(cat "$EVIDENCE_DIR/deployment.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const v=JSON.parse(process.env.DEPLOYMENT_JSON||'{}');
          const aliases=Array.isArray(v.alias)?v.alias:Array.isArray(v.aliases)?v.aliases:[];
          const sha=String(v?.meta?.githubCommitSha||'');
          if(String(v.target).toLowerCase()!=='production'||String(v.readyState).toUpperCase()!=='READY'||sha!==process.env.EXPECTED_MAIN_SHA||!aliases.includes('truelycollectables.com')) throw new Error(`Exact Production metadata failed: ${JSON.stringify({target:v.target,readyState:v.readyState,sha,aliases})}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/exact-production.json',JSON.stringify({ok:true,deploymentId:v.id,deploymentHost:v.url,exactMainSha:sha,customDomainAlias:'truelycollectables.com',verifiedAt:new Date().toISOString()},null,2));
          NODE
          rm -f "$EVIDENCE_DIR/deployment.json"
          for base in "$DEPLOYMENT_URL" https://truelycollectables.com; do
            test "$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' "$base/")" = 200
            test "$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' "$base/shop")" = 200
            test "$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' "$base/shipping")" = 200
            test "$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' "$base/returns")" = 200
            test "$(curl -L -sS --max-time 60 -o /dev/null -w '%{http_code}' "$base/buyer-protection")" = 200
            test "$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' "$base/admin")" = 307
            test "$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' "$base/api/admin-orders-health")" = 401
            webhook="$(curl -sS --max-time 60 -X POST -H 'content-type: application/json' --data '{}' -o /dev/null -w '%{http_code}' "$base/api/webhook")"
            test "$webhook" != 200
          done
          printf '{"ok":true,"exactMainSha":"%s","home":200,"shop":200,"policyPages":200,"unsignedAdmin":401,"unsignedWebhookRejected":true,"verifiedAt":"%s"}\n' "$EXPECTED_MAIN_SHA" "$(date -u +%FT%TZ)" > "$EVIDENCE_DIR/live-boundaries.json"

      - name: Run protected issue 253 marketplace convergence chain
        shell: bash
        run: |
          set -euo pipefail
          for step in ebay-order-sales ebay-full-sync seller-reconciliation sold-archive; do
            code="$(curl -sS --max-time 320 -X POST -H "Authorization: Bearer $VERCEL_TOKEN" --output "$EVIDENCE_DIR/runtime-${step}.json" -w '%{http_code}' "https://truelycollectables.com/api/release/issue253-marketplace-self-test?step=${step}")"
            if [ "$code" != 200 ] || ! jq -e --arg step "$step" '.success == true and .cronSecretConfigured == true and .upstreamStatus == 200 and .step == $step' "$EVIDENCE_DIR/runtime-${step}.json" >/dev/null; then
              cat "$EVIDENCE_DIR/runtime-${step}.json" >&2
              exit 1
            fi
          done

      - name: Audit final hosted issue 253 and CollX state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const endpoint=`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query`;
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({read_only:true,parameters:[],query:`select json_build_object(
            'required_relations',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('collectible_assets','collectible_asset_events','collectible_grader_verifications','collectible_market_snapshots','collectible_sales','instacomp_internal_sold_comps','collx_only_inventory_boundary_violations','ebay_inbound_sale_guards')),
            'sale_records_total',(select count(*) from public.collectible_sales),
            'verified_sales',(select count(*) from public.collectible_sales where evidence_status='verified'),
            'manual_sales',(select count(*) from public.collectible_sales where evidence_status='manual'),
            'unresolved_sales',(select count(*) from public.collectible_sales where evidence_status='unresolved'),
            'verified_or_manual_price_missing',(select count(*) from public.collectible_sales where evidence_status in ('verified','manual') and sold_price is null),
            'null_price_not_flagged_unresolved',(select count(*) from public.collectible_sales where sold_price is null and evidence_status <> 'unresolved'),
            'historical_sold_products_without_sale_record',(select count(*) from public.products p where p.sold_at < timestamptz '2026-07-28 00:00:00+00' and not exists(select 1 from public.collectible_sales s where s.store_id=p.store_id and s.legacy_product_id=p.id)),
            'collx_via_linked_ebay_sales',(select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay'),
            'chain_evidence_rows',(select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay' and evidence->>'source_chain'='collx_or_ebay_to_ebay_to_truely_collectables'),
            'collx_only_boundary_violations',(select count(*) from public.collx_only_inventory_boundary_violations),
            'duplicate_sale_event_groups',(select count(*) from (select store_id,event_key from public.collectible_sales group by store_id,event_key having count(*)>1)d),
            'violated_guards',(select count(*) from public.ebay_inbound_sale_guards g where active and (coalesce((select p.quantity from public.products p where p.id=g.legacy_product_id and p.seller_id=g.store_id),0)>g.protected_quantity or coalesce((select i.quantity from public.inventory_items i where i.id=g.inventory_item_id),0)>g.protected_quantity)),
            'sold_stock_restoration_violations',(select count(*) from public.products where sold_at is not null and quantity>0),
            'negative_product_quantities',(select count(*) from public.products where quantity<0),
            'negative_inventory_quantities',(select count(*) from public.inventory_items where quantity<0),
            'inactive_guard_trigger_count',(select count(*) from pg_trigger where tgname='capture_ebay_inactive_collectible_sale' and not tgisinternal),
            'maximum_propagation_minutes',json_build_object('completed_order_poll',5,'inactive_full_sync',15,'seller_reconciliation',15),
            'captured_at',now()) receipt;`})});
          const body=await response.text();if(!response.ok)throw new Error(`Final hosted audit HTTP ${response.status}: ${body.slice(0,1200)}`);
          const receipt=JSON.parse(body)?.[0]?.receipt||{};const blockers=[];
          if(Number(receipt.required_relations)!==8)blockers.push(`required_relations=${receipt.required_relations}`);
          if(Number(receipt.collx_via_linked_ebay_sales||0)<1)blockers.push('no persisted indirect eBay/CollX sale evidence');
          if(Number(receipt.chain_evidence_rows||0)<1)blockers.push('no persisted indirect source-chain evidence');
          if(Number(receipt.inactive_guard_trigger_count)!==1)blockers.push(`inactive_guard_trigger_count=${receipt.inactive_guard_trigger_count}`);
          for(const key of ['verified_or_manual_price_missing','null_price_not_flagged_unresolved','historical_sold_products_without_sale_record','collx_only_boundary_violations','duplicate_sale_event_groups','violated_guards','sold_stock_restoration_violations','negative_product_quantities','negative_inventory_quantities']) if(Number(receipt[key]||0)!==0) blockers.push(`${key}=${receipt[key]}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/final-hosted-issue253.json',JSON.stringify({ok:blockers.length===0,exactMainSha:process.env.EXPECTED_MAIN_SHA,receipt,blockers,realMarketplaceOrderCreatedByAudit:false,verifiedAt:new Date().toISOString()},null,2));
          if(blockers.length)throw new Error(blockers.join('; '));
          NODE

      - name: Run exact Production Lighthouse gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/lighthouse"
          npx --yes lighthouse@12.8.2 https://truelycollectables.com/ --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path="$EVIDENCE_DIR/lighthouse/home.json"
          npx --yes lighthouse@12.8.2 https://truelycollectables.com/shop --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path="$EVIDENCE_DIR/lighthouse/shop.json"
          npx --yes lighthouse@12.8.2 https://truelycollectables.com/account/signup --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path="$EVIDENCE_DIR/lighthouse/signup.json"
          npx --yes lighthouse@12.8.2 https://truelycollectables.com/cart --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path="$EVIDENCE_DIR/lighthouse/cart.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pages=['home','shop','signup','cart'];const rows=[];const blockers=[];
          for(const page of pages){const v=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/lighthouse/${page}.json`,'utf8'));const c=v.categories||{};const row={page,performance:Math.round((c.performance?.score||0)*100),accessibility:Math.round((c.accessibility?.score||0)*100),bestPractices:Math.round((c['best-practices']?.score||0)*100),seo:Math.round((c.seo?.score||0)*100)};rows.push(row);if(row.performance<70)blockers.push(`${page} performance ${row.performance}`);if(row.accessibility<95)blockers.push(`${page} accessibility ${row.accessibility}`);if(row.bestPractices<95)blockers.push(`${page} best-practices ${row.bestPractices}`);if((page==='home'||page==='shop')&&row.seo<95)blockers.push(`${page} SEO ${row.seo}`);}
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/lighthouse-summary.json',JSON.stringify({ok:blockers.length===0,rows,blockers},null,2));if(blockers.length)throw new Error(blockers.join('; '));
          NODE

      - name: Issue strict exact-Production certificate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok == true and (.blockers|length) == 0' "$EVIDENCE_DIR/final-hosted-issue253.json" >/dev/null
          jq -e '.ok == true and (.blockers|length) == 0' "$EVIDENCE_DIR/lighthouse-summary.json" >/dev/null
          jq -n --arg sha "$EXPECTED_MAIN_SHA" --arg deployment "$(cat "$EVIDENCE_DIR/deployment-url.txt")" --arg run "$GITHUB_RUN_ID" '{schema:"truelycollectables.launch2Issue253FinalProductionCertificate.v1",result:"PASS",blockerCount:0,exactProductionSha:$sha,exactProductionDeployment:$deployment,workflowRunId:($run|tonumber),originalLaunch2GatesBound:true,currentExactMainSourceSecurityBuildBound:true,issue253ImmutableSaleHistory:true,sevenDaySoldPresentationAndArchive:true,authoritativeHistoricalBackfill:true,unresolvedPricesExplicitlyFlagged:true,ebaySoldInactiveAndFifteenMinuteReconciliation:true,indirectCollXViaLinkedEbayChain:true,collxOnlyExcluded:true,adminMarkSoldElsewhereFallback:true,noInboundSoldStockRestoration:true,lighthouseExactProduction:true,realMoneyChargeCreatedByAudit:false,realPostagePurchasedByAudit:false,physicalDeliveryCreatedByAudit:false,refundIssuedByAudit:false,disputeCreatedByAudit:false,inboxReceiptClaimedByAudit:false,issuedAt:(now|todate)}' > "$EVIDENCE_DIR/final-production-certificate.json"

      - name: Upload final sanitized Production certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-final-production-b30f084
          path: .audit/launch2-final-b30f084-production
          if-no-files-found: error
          retention-days: 90
