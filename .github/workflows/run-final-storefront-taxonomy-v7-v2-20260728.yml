name: Run Final Storefront Taxonomy V7 V2 20260728

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-final-storefront-taxonomy-v7-v2-20260728.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/storefront-taxonomy-v7-no-junk-buckets-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-taxonomy-v7-no-junk-buckets-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply standalone taxonomy v7 patch
        run: python scripts/apply-taxonomy-v7-final.py

      - name: Correct formatted import assertion and remove writers
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/run-ebay-import-admin-client-simulations.ts')
          text = path.read_text()
          old = r'/SPORT_SECTIONS[\s\S]*COLLECTIBLE_SECTIONS[\s\S]*sortStorefrontSections/'
          new = r'/COLLECTIBLE_SECTIONS[\s\S]*SPORT_SECTIONS[\s\S]*sortStorefrontSections/'
          if text.count(old) != 1:
              raise SystemExit(f'central taxonomy import assertion: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          for name in [
              '.github/workflows/run-final-storefront-taxonomy-v7-20260728.yml',
              '.github/workflows/run-final-storefront-taxonomy-v7-v2-20260728.yml',
          ]:
              candidate = Path(name)
              if candidate.exists(): candidate.unlink()
          PY

      - name: Format and validate taxonomy v7
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write \
            src/lib/storefront-taxonomy.ts \
            src/modules/inventory/types.ts \
            src/app/shop/page.tsx \
            src/lib/sports-card-launch-scope.ts \
            src/lib/ebay-authoritative-store-sync.ts \
            scripts/run-storefront-taxonomy-regressions.ts \
            scripts/run-ebay-import-admin-client-simulations.ts
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
          npx eslint \
            src/lib/storefront-taxonomy.ts \
            src/modules/inventory/types.ts \
            src/app/shop/page.tsx \
            src/lib/sports-card-launch-scope.ts \
            src/lib/ebay-authoritative-store-sync.ts \
            scripts/run-storefront-taxonomy-regressions.ts \
            scripts/run-ebay-import-admin-client-simulations.ts
          npm run build

      - name: Commit validated taxonomy v7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Eliminate fallback storefront buckets"
          git push origin HEAD:agent/storefront-taxonomy-v7-no-junk-buckets-20260728
