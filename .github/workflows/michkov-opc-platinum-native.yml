name: Validate Michkov OPC Platinum Native Lane

on:
  push:
    branches: [main]
    paths:
      - "src/app/api/tcos/deal-hunter-michkov-opc-platinum/route.js"
      - "scripts/run-michkov-opc-platinum-native-contracts.mjs"
      - ".github/workflows/michkov-opc-platinum-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/tcos/deal-hunter-michkov-opc-platinum/route.js"
      - "scripts/run-michkov-opc-platinum-native-contracts.mjs"
      - ".github/workflows/michkov-opc-platinum-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: michkov-opc-platinum-native-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  CRON_SECRET: build-validation-cron-secret-that-is-long-enough
  RESEND_API_KEY: re_build_validation
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify fixed search and screening contracts
        run: node scripts/run-michkov-opc-platinum-native-contracts.mjs

      - name: Lint route and contract
        run: npx eslint src/app/api/tcos/deal-hunter-michkov-opc-platinum/route.js scripts/run-michkov-opc-platinum-native-contracts.mjs

      - name: Build production application
        run: npm run build

      - name: Verify clean diff
        run: git diff --check
