name: Bootstrap Clean 2025-26 Upper Deck Hockey Import

on:
  push:
    branches:
      - agent/import-2025-26-upper-deck-hockey-clean-v2
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-2025-26-upper-deck-hockey-clean-v2
          fetch-depth: 0
      - name: Copy season importer from validated source branch
        run: |
          git fetch origin agent/import-2025-26-upper-deck-hockey
          git checkout origin/agent/import-2025-26-upper-deck-hockey -- \
            .github/workflows/import-upper-deck-2025-26-hockey.yml \
            scripts/import-upper-deck-2025-26-hockey.ts \
            src/lib/checklist-registry/server.ts \
            src/lib/checklist-registry/upper-deck-artifacts-official-html.ts \
            src/lib/checklist-registry/upper-deck-black-diamond-official-html.ts \
            src/lib/checklist-registry/upper-deck-mvp-official-html.ts \
            src/lib/checklist-registry/upper-deck-team-canada-official-html.ts \
            src/lib/checklist-registry/upper-deck-tim-hortons-official-html.ts
      - name: Preserve legitimate O-Pee-Chee reused printed numbers
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const parserPath = 'src/lib/checklist-registry/upper-deck-html.ts';
          let parser = fs.readFileSync(parserPath, 'utf8');
          const before = `    const players = splitSubjects(row.description);\n    const teams = teamsFrom(row.teamCity, row.teamName);\n    const variation = buildVariation(row);`;
          const after = `    const players = splitSubjects(row.description);\n    const teams = teamsFrom(row.teamCity, row.teamName);\n    const baseVariation = buildVariation(row);\n    const requiresSubjectVariation =\n      /o-pee-chee/i.test(product) &&\n      (/^playing cards$/i.test(setName) || /^p-\\d+$/i.test(row.cardNumber));\n    const subjectVariation = requiresSubjectVariation\n      ? \`Subject: \${players\n          .slice()\n          .sort((left, right) => comparable(left).localeCompare(comparable(right)))\n          .join(" / ")}\`\n      : null;\n    const variation = [baseVariation, subjectVariation].filter(Boolean).join("; ") || null;`;
          if (parser.includes(before)) parser = parser.replace(before, after);
          if (!parser.includes('const requiresSubjectVariation =')) throw new Error('O-Pee-Chee parser anchor missing');
          fs.writeFileSync(parserPath, parser);

          const regressionPath = 'scripts/run-checklist-registry-upper-deck-simulations.ts';
          let regression = fs.readFileSync(regressionPath, 'utf8');
          if (!regression.includes('opc_reused_numbers_are_subject_disambiguated')) {
            const marker = `scenario(\n  "all_identity_fingerprints_are_unique",`;
            const block = `const opcReusedNumberPlan = parseUpperDeckOfficialHtmlChecklist({\n  sourceUrl: "https://upperdeck.com/checklist/2025-26-o-pee-chee-checklist/",\n  originalFilename: "2025-26-o-pee-chee-checklist.html",\n  mimeType: "text/html",\n  retrievedAt: "2026-08-03T16:45:00.000Z",\n  authority: "official_manufacturer",\n  redistributionAllowed: false,\n  content: \`<!doctype html><html><body><h1>2025-26 O-Pee-Chee Checklist</h1><table><tbody>\n    <tr><th>Set Name</th><th>Card</th><th>Description</th></tr>\n    <tr><td>Playing Cards</td><td>9-CLUBS</td><td>Connor McDavid</td></tr>\n    <tr><td>Playing Cards</td><td>9-CLUBS</td><td>Nathan MacKinnon</td></tr>\n    <tr><td>Base Set</td><td>P-1</td><td>Connor McDavid Puzzle</td></tr>\n    <tr><td>Base Set</td><td>P-1</td><td>Sidney Crosby Puzzle</td></tr>\n  </tbody></table></body></html>\`,\n});\nscenario(\n  "opc_reused_numbers_are_subject_disambiguated",\n  "O-Pee-Chee playing cards and puzzle cards preserve legitimate reused printed numbers as distinct subject variations.",\n  opcReusedNumberPlan.validation.status === "passed" &&\n    opcReusedNumberPlan.validation.issues.every((entry) => entry.severity !== "error") &&\n    opcReusedNumberPlan.validation.counts.cards === 4 &&\n    opcReusedNumberPlan.validation.counts.identities === 4 &&\n    allUnique(opcReusedNumberPlan) &&\n    opcReusedNumberPlan.cards.every((card) => card.variation?.startsWith("Subject: ")),\n  {\n    counts: opcReusedNumberPlan.validation.counts,\n    issues: opcReusedNumberPlan.validation.issues,\n    variations: opcReusedNumberPlan.cards.map((card) => card.variation),\n  },\n);\n\n`;
            if (!regression.includes(marker)) throw new Error('Upper Deck regression marker missing');
            regression = regression.replace(marker, block + marker);
            fs.writeFileSync(regressionPath, regression);
          }

          fs.rmSync('.github/workflows/bootstrap-upper-deck-2025-26-hockey-clean.yml');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate complete 33-source season package
        run: |
          npx tsx scripts/run-checklist-registry-upper-deck-simulations.ts
          npx tsx scripts/import-upper-deck-2025-26-hockey.ts --output .upper-deck-work/2025-26-hockey-validation-receipt.json
          npx eslint src/lib/checklist-registry/upper-deck-html.ts src/lib/checklist-registry/upper-deck-*-official-html.ts src/lib/checklist-registry/server.ts scripts/run-checklist-registry-upper-deck-simulations.ts scripts/import-upper-deck-2025-26-hockey.ts
          npx tsc --noEmit
          node scripts/run-dependency-security-audit.mjs
          npm run build
      - name: Commit validated clean season importer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: validate complete 2025-26 Upper Deck hockey season"
          git push origin HEAD:agent/import-2025-26-upper-deck-hockey-clean-v2
