name: InstaComp OCR Registry Hard Facts 20260807

on:
  push:
    branches:
      - fix/instacomp-ocr-registry-and-five-card-truth-20260807
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-ocr-registry-and-five-card-truth-20260807
          fetch-depth: 0
      - name: Apply runtime repair
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'loadRegistryRowsBounded' src/lib/instacomp-checklist-first-server.ts; then
            echo 'runtime already patched'
          else
            python3 scripts/patch-instacomp-ocr-registry-and-five-card-truth.py
          fi
          git diff --check
          grep -q 'def _year_hint(observations' services/instacomp-ai/app/local_vision.py
          grep -q 'loadRegistryRowsBounded' src/lib/instacomp-checklist-first-server.ts
          grep -q 'hard_fields = {"year", "manufacturer", "card_number"}' services/instacomp-ai/app/ollama.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - name: Certify Mac service
        working-directory: services/instacomp-ai
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m compileall app tests scripts
          PYTHONPATH=. pytest -q tests/test_ocr_registry_hard_facts.py
          PYTHONPATH=. pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Certify website Registry resolver
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-instacomp-bounded-registry-query.mjs
          npx tsc --noEmit
      - name: Persist tested runtime files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/instacomp-ai/app/local_vision.py \
            services/instacomp-ai/app/ollama.py \
            src/lib/instacomp-checklist-first-server.ts
          if git diff --cached --quiet; then
            echo 'No generated runtime changes to persist.'
            exit 0
          fi
          git commit -m 'Make OCR hard facts outrank model guesses'
          git push origin HEAD:fix/instacomp-ocr-registry-and-five-card-truth-20260807

  apply-production-indexes:
    needs: apply-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-ocr-registry-and-five-card-truth-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Production project and apply additive lookup indexes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          mkdir -p .vercel "$RUNNER_TEMP/instacomp-registry-indexes"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull "$RUNNER_TEMP/instacomp-registry-indexes/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PROJECT_REF=$(node - "$RUNNER_TEMP/instacomp-registry-indexes/production.env" <<'NODE'
          const fs=require('fs');
          const path=process.argv[2];
          const text=fs.readFileSync(path,'utf8');
          let value='';
          for (const raw of text.split(/\r?\n/)) {
            const line=raw.trim();
            if (!line.startsWith('NEXT_PUBLIC_SUPABASE_URL=')) continue;
            value=line.slice(line.indexOf('=')+1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value=JSON.parse(value); } catch { value=value.slice(1,-1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value=value.slice(1,-1);
          }
          if (!value) process.exit(2);
          process.stdout.write(new URL(value).hostname.split('.')[0]);
          NODE
          )
          test -n "$PROJECT_REF"
          jq -Rs '{query: ., read_only: false}' supabase/migrations/20260807122000_instacomp_registry_lookup_indexes.sql > "$RUNNER_TEMP/instacomp-registry-indexes/body.json"
          curl --silent --show-error --fail \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/instacomp-registry-indexes/body.json" \
            --output "$RUNNER_TEMP/instacomp-registry-indexes/response.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          jq -e 'if type == "object" and (.error? // null) then error(.error) else true end' "$RUNNER_TEMP/instacomp-registry-indexes/response.json" >/dev/null
          echo 'Production Registry lookup indexes: PASS'
