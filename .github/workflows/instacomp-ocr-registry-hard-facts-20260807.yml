name: InstaComp OCR Registry Hard Facts 20260807

on:
  push:
    branches:
      - fix/instacomp-ocr-registry-and-five-card-truth-20260807
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply existing OCR Registry runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-instacomp-ocr-registry-and-five-card-truth.py')
          source = path.read_text(encoding='utf-8')
          old = '    updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)\n'
          new = '    compiled = re.compile(pattern, re.S)\n    updated, count = compiled.subn(lambda _match: replacement, source, count=1)\n'
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          if grep -q 'loadRegistryRowsBounded' src/lib/instacomp-checklist-first-server.ts; then
            echo 'OCR/Registry runtime already patched.'
          else
            python3 scripts/patch-instacomp-ocr-registry-and-five-card-truth.py
          fi
          python3 scripts/patch-instacomp-registry-year-helper.py
          git diff --check
          grep -q 'def _year_hint(observations' services/instacomp-ai/app/local_vision.py
          grep -q 'loadRegistryRowsBounded' src/lib/instacomp-checklist-first-server.ts
          grep -q 'registryYearStart' src/lib/instacomp-checklist-first-server.ts
          grep -q 'hard_fields = {"year", "manufacturer", "card_number"}' services/instacomp-ai/app/ollama.py

      - name: Apply marker-gated Ivan Deal Hunter Registry repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git diff --name-only origin/main...HEAD | grep -qx 'src/lib/deal-hunter-registry-set-hints-v2.marker'; then
            echo 'No Ivan repair marker; skipping targeted scanner patch.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/api/instacomp/scan/route.ts')
          s=p.read_text()
          if 'listingIdentityHint.brand' in s and 'listingIdentityHint.setName' in s:
              print('Controlled Registry brand/set hints already present.')
              raise SystemExit(0)
          old='''function extractUntrustedListingIdentityHint(value: unknown) {
  const title = String(value || "").trim().slice(0, 1000);
  if (!title) return { title: null, year: null, cardNumber: null };
  const year = title.match(/\\b((?:19|20)\\d{2})(?:[-/]\\d{2,4})?\\b/)?.[1] || null;
  const cardNumber =
    title.match(/(?:\\bcard\\s*)?#\\s*([A-Za-z0-9][A-Za-z0-9.-]{0,24})\\b/i)?.[1] || null;
  return { title, year, cardNumber };
}
'''
          new='''function extractUntrustedListingIdentityHint(value: unknown) {
  const title = String(value || "").trim().slice(0, 1000);
  if (!title) return { title: null, year: null, cardNumber: null, brand: null, setName: null };
  const season =
    title.match(/\\b((?:19|20)\\d{2}[-/](?:\\d{2}|(?:19|20)\\d{2}))\\b/)?.[1] ||
    title.match(/\\b((?:19|20)\\d{2})\\b/)?.[1] || null;
  const cardNumber =
    title.match(/(?:\\bcard\\s*)?#\\s*([A-Za-z0-9][A-Za-z0-9.-]{0,24})\\b/i)?.[1] || null;
  const productRules: Array<{ pattern: RegExp; brand: string; setName: string }> = [
    { pattern: /\\bO-?Pee-?Chee\\s+Platinum\\b/i, brand: "O-Pee-Chee", setName: "O-Pee-Chee Platinum" },
    { pattern: /\\bNational\\s+Hockey\\s+Card\\s+Day\\b/i, brand: "Upper Deck", setName: "National Hockey Card Day" },
    { pattern: /\\bParkhurst\\b/i, brand: "Upper Deck", setName: "Parkhurst" },
    { pattern: /\\bSPx\\b/i, brand: "Upper Deck", setName: "SPx" },
    { pattern: /\\bFlair\\b/i, brand: "Upper Deck", setName: "Flair" },
    { pattern: /\\bTopps\\s+Now\\b/i, brand: "Topps", setName: "Topps Now" },
    { pattern: /\\bPrizm\\b/i, brand: "Panini", setName: "Prizm" },
    { pattern: /\\bBowman\\s+Draft\\b/i, brand: "Topps", setName: "Bowman Draft" },
    { pattern: /\\bBowman\\b/i, brand: "Topps", setName: "Bowman" },
  ];
  const product = productRules.find((rule) => rule.pattern.test(title)) || null;
  const brand = product?.brand || (/\\bUpper\\s+Deck\\b/i.test(title) ? "Upper Deck" : null);
  return { title, year: season, cardNumber, brand, setName: product?.setName || null };
}
'''
          if old not in s:
              raise SystemExit('v1 Deal Hunter hint helper anchor not found')
          s=s.replace(old,new,1)
          old2='''    const registryProbeAi = {
      ...evidenceAi,
      ...(listingIdentityHint.year ? { year: listingIdentityHint.year } : {}),
      ...(listingIdentityHint.cardNumber ? { cardNumber: listingIdentityHint.cardNumber } : {}),
    };'''
          new2='''    const registryProbeAi = {
      ...evidenceAi,
      ...(listingIdentityHint.year ? { year: listingIdentityHint.year } : {}),
      ...(listingIdentityHint.brand ? { brand: listingIdentityHint.brand } : {}),
      ...(listingIdentityHint.setName ? { setName: listingIdentityHint.setName } : {}),
      ...(listingIdentityHint.cardNumber ? { cardNumber: listingIdentityHint.cardNumber } : {}),
    };'''
          if old2 not in s: raise SystemExit('Registry probe anchor not found')
          s=s.replace(old2,new2,1)
          old3='''        untrustedListingIdentityHint: {
          supplied: Boolean(listingIdentityHint.title),
          year: listingIdentityHint.year,
          cardNumber: listingIdentityHint.cardNumber,
          trustedForIdentity: false,
        },'''
          new3='''        untrustedListingIdentityHint: {
          supplied: Boolean(listingIdentityHint.title),
          year: listingIdentityHint.year,
          brand: listingIdentityHint.brand,
          setName: listingIdentityHint.setName,
          cardNumber: listingIdentityHint.cardNumber,
          trustedForIdentity: false,
        },'''
          if old3 not in s: raise SystemExit('hint diagnostics anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY

      - name: Verify controlled Ivan title coordinates
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git diff --name-only origin/main...HEAD | grep -qx 'src/lib/deal-hunter-registry-set-hints-v2.marker'; then exit 0; fi
          python3 - <<'PY'
          import re
          cases=[
            ('2025-26 Upper Deck Parkhurst - Rookies Ivan Demidov #236 (RC)',('2025-26','Upper Deck','Parkhurst','236')),
            ('Upper Deck 2025-26 Flair Ivan Demidov #190 Rookie Montreal Canadiens NHL',('2025-26','Upper Deck','Flair','190')),
            ('O-Pee-Chee Platinum Marquee Rookie Ivan Demidov #232 Canadiens NHL 2025-26',('2025-26','O-Pee-Chee','O-Pee-Chee Platinum','232')),
            ('2026 Upper Deck National Hockey Card Day Ivan Demidov RC #NHCD-31 Rookie Card',('2026','Upper Deck','National Hockey Card Day','NHCD-31')),
            ('2025-26 NHL TOPPS NOW Sticker #87 - Ivan Demidov',('2025-26','Topps','Topps Now','87')),
            ('Panini 2025 Prizm WNBA Sonia Citron #148 RC Rookie',('2025','Panini','Prizm','148')),
            ('2025 Bowman Draft - Chrome Franklin Arias #BDC-13 Sky Blue Refractor',('2025','Topps','Bowman Draft','BDC-13')),
          ]
          def parse(t):
            m=re.search(r'\b((?:19|20)\d{2}[-/](?:\d{2}|(?:19|20)\d{2}))\b',t) or re.search(r'\b((?:19|20)\d{2})\b',t)
            c=re.search(r'(?:\bcard\s*)?#\s*([A-Za-z0-9][A-Za-z0-9.-]{0,24})\b',t,re.I)
            rules=[(r'O-?Pee-?Chee\s+Platinum','O-Pee-Chee','O-Pee-Chee Platinum'),(r'National\s+Hockey\s+Card\s+Day','Upper Deck','National Hockey Card Day'),(r'Parkhurst','Upper Deck','Parkhurst'),(r'SPx','Upper Deck','SPx'),(r'Flair','Upper Deck','Flair'),(r'Topps\s+Now','Topps','Topps Now'),(r'Prizm','Panini','Prizm'),(r'Bowman\s+Draft','Topps','Bowman Draft'),(r'Bowman','Topps','Bowman')]
            product=next(((b,s) for p,b,s in rules if re.search(p,t,re.I)),None)
            brand,setn=product if product else (('Upper Deck',None) if re.search(r'Upper\s+Deck',t,re.I) else (None,None))
            return (m.group(1) if m else None,brand,setn,c.group(1) if c else None)
          for title, expected in cases:
            got=parse(title); assert got==expected,(title,got,expected)
          print('Ivan/cross-sport controlled Registry coordinates: 7/7 PASS')
          PY
          grep -q 'listingIdentityHint.brand' src/app/api/instacomp/scan/route.ts
          grep -q 'listingIdentityHint.setName' src/app/api/instacomp/scan/route.ts
          grep -q 'trustedForIdentity: false' src/app/api/instacomp/scan/route.ts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Certify Mac service
        working-directory: services/instacomp-ai
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m compileall app tests scripts
          PYTHONPATH=. pytest -q tests/test_ocr_registry_hard_facts.py
          PYTHONPATH=. pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Certify website Registry resolver
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-instacomp-bounded-registry-query.mjs
          npx tsc --noEmit

      - name: Production build for PR head
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
        run: npm run build

      - name: Persist tested runtime files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/patch-instacomp-ocr-registry-and-five-card-truth.py \
            services/instacomp-ai/app/local_vision.py \
            services/instacomp-ai/app/ollama.py \
            src/lib/instacomp-checklist-first-server.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make OCR hard facts outrank model guesses'
          git push origin HEAD:fix/instacomp-ocr-registry-and-five-card-truth-20260807

      - name: Persist certified Ivan scanner repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git diff --name-only origin/main...HEAD | grep -qx 'src/lib/deal-hunter-registry-set-hints-v2.marker'; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/instacomp/scan/route.ts
          if git diff --cached --quiet; then
            echo 'Ivan scanner repair already committed.'
            exit 0
          fi
          git commit -m 'Fix Ivan Deal Hunter Registry lookup hints'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  apply-production-indexes:
    if: github.event_name != 'pull_request'
    needs: apply-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-ocr-registry-and-five-card-truth-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Production project and apply additive lookup indexes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          mkdir -p .vercel "$RUNNER_TEMP/instacomp-registry-indexes"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull "$RUNNER_TEMP/instacomp-registry-indexes/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PROJECT_REF=$(node - "$RUNNER_TEMP/instacomp-registry-indexes/production.env" <<'NODE'
          const fs=require('fs');
          const path=process.argv[2];
          const text=fs.readFileSync(path,'utf8');
          let value='';
          for (const raw of text.split(/\r?\n/)) {
            const line=raw.trim();
            if (!line.startsWith('NEXT_PUBLIC_SUPABASE_URL=')) continue;
            value=line.slice(line.indexOf('=')+1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value=JSON.parse(value); } catch { value=value.slice(1,-1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value=value.slice(1,-1);
          }
          if (!value) process.exit(2);
          process.stdout.write(new URL(value).hostname.split('.')[0]);
          NODE
          )
          test -n "$PROJECT_REF"
          jq -Rs '{query: ., read_only: false}' supabase/migrations/20260807122000_instacomp_registry_lookup_indexes.sql > "$RUNNER_TEMP/instacomp-registry-indexes/body.json"
          curl --silent --show-error --fail \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/instacomp-registry-indexes/body.json" \
            --output "$RUNNER_TEMP/instacomp-registry-indexes/response.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          jq -e 'if type == "object" and (.error? // null) then error(.error) else true end' "$RUNNER_TEMP/instacomp-registry-indexes/response.json" >/dev/null
          echo 'Production Registry lookup indexes: PASS'
