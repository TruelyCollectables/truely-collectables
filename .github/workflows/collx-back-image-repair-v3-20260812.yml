name: CollX Back Image Repair V3 20260812

on:
  push:
    branches: [fix/collx-back-images-20260812]
    paths:
      - ".github/workflows/collx-back-image-repair-v3-20260812.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collx-back-image-repair-v3-20260812
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Production environment and service key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          mkdir -p .vercel "$RUNNER_TEMP/collx-back-repair-v3"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-back-repair-v3/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'collx-back-repair-v3');
          const text = fs.readFileSync(path.join(dir, 'production.env'), 'utf8');
          const env = {};
          for (const raw of text.split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i < 1) continue;
            const key = line.slice(0, i).trim();
            let value = line.slice(i + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            env[key] = value;
          }
          const url = env.NEXT_PUBLIC_SUPABASE_URL;
          if (!url) throw new Error('NEXT_PUBLIC_SUPABASE_URL missing from Production env');
          const ref = new URL(url).hostname.split('.')[0];
          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` },
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Supabase key retrieval HTTP ${response.status}: ${body.slice(0, 500)}`);
          const keys = JSON.parse(body);
          const row = keys.find((x) => typeof x?.api_key === 'string' && x.api_key.startsWith('sb_secret_'))
            || keys.find((x) => String(x?.name || '').toLowerCase() === 'service_role')
            || keys.find((x) => String(x?.name || '').toLowerCase().includes('service'));
          if (!row?.api_key) throw new Error('No Production service-role key returned');
          console.log('::add-mask::' + row.api_key);
          fs.writeFileSync(path.join(dir, 'service-role-key'), row.api_key, { mode: 0o600 });
          fs.writeFileSync(path.join(dir, 'supabase-url'), url, { mode: 0o600 });
          console.log('PRODUCTION_REPAIR_CREDENTIALS=VERIFIED');
          NODE

      - name: Patch repair to bypass broken missing-object HEAD checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/collx-back-image-repair-20260812.mjs')
          s=p.read_text()
          old='''    let owned = await findOwnedBack(collxId, preferredExt);\n    if (!owned) owned = await copyBack(collxId);'''
          new='''    const owned = await copyBack(collxId);'''
          if old not in s:
              raise SystemExit('expected repair block not found')
          s=s.replace(old,new,1)
          s=s.replace('await mapLimit(targets, 8,', 'await mapLimit(targets, 3,', 1)
          p.write_text(s)
          print('RUNTIME_PATCH=APPLIED_DIRECT_SOURCE_COPY_CONCURRENCY_3')
          PY

      - name: Repair missing exact back associations
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/collx-back-repair-v3/service-role-key")"
          supabase_url="$(cat "$RUNNER_TEMP/collx-back-repair-v3/supabase-url")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
          NEXT_PUBLIC_SUPABASE_URL="$supabase_url" \
          OUTPUT_DIR="$RUNNER_TEMP/collx-back-repair-v3" \
            node --import tsx scripts/collx-back-image-repair-20260812.mjs

      - name: Verify repair receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          root=os.path.join(os.environ['RUNNER_TEMP'],'collx-back-repair-v3')
          receipt=json.load(open(os.path.join(root,'repair.json')))
          s=receipt['stats']
          final_exact=(s['alreadyExactBack']+s['associatedExistingOwnedBack']+s['copiedAndAssociatedBack']+s['replacedNonExactBack'])
          print('FINAL_EXACT_BACK_ASSOCIATIONS='+str(final_exact))
          print('NO_SOURCE_BACK='+str(s['noSourceBack']))
          print('SKIPPED_EBAY_BACKED='+str(s['skippedEbayBacked']))
          print('REPAIR_ERRORS='+str(s['errors']))
          if s['errors'] != 0:
              raise SystemExit('repair receipt contains errors')
          PY

      - name: Verify live Allisha Gray storefront pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          root=os.path.join(os.environ['RUNNER_TEMP'],'collx-back-repair-v3')
          rows=json.load(open(os.path.join(root,'allisha.json')))
          checked=[]
          for row in rows:
              if not row.get('exactBack'): continue
              url=f"https://truelycollectables.com/product/{row['productId']}?back_repair={int(time.time())}"
              ok=False; unavailable=None; status=None; err=None
              for attempt in range(1,7):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'TruelyBackRepair/20260812'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          status=r.status; body=r.read().decode('utf-8','replace')
                      unavailable=bool(re.search(r'Back photo unavailable',body,re.I))
                      ok=(status==200 and not unavailable)
                      if ok: break
                  except Exception as e:
                      err=str(e)
                  time.sleep(min(10,attempt*2))
              checked.append({'productId':row['productId'],'status':status,'backUnavailable':unavailable,'ok':ok,'error':err})
          print('ALLISHA_DB='+json.dumps(rows))
          print('LIVE_ALLISHA_VERIFY='+json.dumps(checked))
          json.dump(checked,open(os.path.join(root,'live-allisha.json'),'w'),indent=2)
          if not rows:
              raise SystemExit('No in-stock Allisha Gray rows found in Production')
          if not any(x.get('exactBack') for x in rows):
              raise SystemExit('No exact-back Allisha Gray row in Production')
          if not any(x['ok'] for x in checked):
              raise SystemExit('No exact-back Allisha Gray product rendered successfully on the live storefront')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collx-back-image-repair-v3-20260812
          path: ${{ runner.temp }}/collx-back-repair-v3/*.json
          if-no-files-found: warn
          retention-days: 7
