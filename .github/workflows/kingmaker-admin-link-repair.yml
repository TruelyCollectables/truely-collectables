name: KINGMAKER Admin Link Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/kingmaker-admin-link-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/kingmaker-morning-intel'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kingmaker-morning-intel
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact navigation-only edit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/admin/page.tsx")
          source = path.read_text()
          route = '/admin/market-intel/kingmaker/morning-intelligence'
          marker = '        { href: "/admin/market-intel", label: "Command Desk" },\n'
          addition = '''        {
          href: "/admin/market-intel/kingmaker/morning-intelligence",
          label: "KINGMAKER Morning Intelligence",
        },
'''

          if route not in source:
              if source.count(marker) != 1:
                  raise SystemExit("Refusing repair: expected one exact Command Desk marker")
              source = source.replace(marker, marker + addition, 1)
              path.write_text(source)

          workflow = Path(".github/workflows/kingmaker-admin-link-repair.yml")
          workflow.unlink()
          PY
      - name: Verify exact repair
        run: |
          git diff --check
          test "$(grep -F -c '/admin/market-intel/kingmaker/morning-intelligence' src/app/admin/page.tsx)" -eq 1
          test ! -e .github/workflows/kingmaker-admin-link-repair.yml
          npm ci
          npm run verify:admin-dashboard
          npx tsc --noEmit
      - name: Commit repaired navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx .github/workflows/kingmaker-admin-link-repair.yml
          git commit -m "Add KINGMAKER morning console to admin navigation"
          git push origin HEAD:agent/kingmaker-morning-intel
