name: Verify InstaComp Mobile Production v2

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/admin/instacomp/mobile/**"
      - ".github/workflows/verify-instacomp-mobile-pr-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-instacomp-mobile-production-legacy-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-verifier-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use the protected in-runtime v3 verifier
        run: |
          echo "PASS: legacy signed-cookie verifier retired."
          echo "Vercel intentionally masks ADMIN_SESSION_SECRET when Production variables are pulled."
          echo "Verify InstaComp Mobile Production v3 is the canonical pull-request Production verifier."
