name: Ops CollX Full Collection Classify 20260811

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-full-classify-20260811.yml"
      - ".github/ops/collx-full-metadata.part*"
      - ".github/ops/collx-full-metadata.sha256"
      - ".github/ops/collx-full-classify.py.part*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-collx-full-classify-20260811
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STORE_ID: 00000000-0000-4000-8000-000000000001
      EXPECTED_ROWS: "6909"
      EXPECTED_SHA: e5675ad8a23c345bf76aa7f28d73fe5cf8f56452a2bff4595b92a88a6358e904
      WORK: /tmp/collx-full-classify
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify authoritative CollX export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK" .vercel
          sha256sum -c .github/ops/collx-full-metadata.sha256
          cat .github/ops/collx-full-metadata.part{00..15} > "$WORK/source.xz.b64"
          base64 -d "$WORK/source.xz.b64" | xz -d > "$WORK/source.csv"
          test "$(sha256sum "$WORK/source.csv" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(($(wc -l < "$WORK/source.csv")-1))" = "$EXPECTED_ROWS"
          cat .github/ops/collx-full-classify.py.part{00..01} > "$WORK/classify.py"
      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$WORK/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
      - name: Install fingerprint tools
        shell: bash
        run: python3 -m pip install --quiet Pillow ImageHash
      - name: Classify full collection against current eBay inventory
        shell: bash
        run: python3 "$WORK/classify.py"
      - name: Remove Production env copy
        if: always()
        shell: bash
        run: rm -f "$WORK/production.env"
      - name: Upload classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-full-migration-classification
          path: |
            ${{ env.WORK }}/classification.json
            ${{ env.WORK }}/receipt.json
          retention-days: 7
          if-no-files-found: warn
