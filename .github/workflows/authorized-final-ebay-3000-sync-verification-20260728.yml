name: Authorized Launch-Ready Alias-Aware Verification 1927 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-final-ebay-3000-sync-verification-20260728.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-final-ebay-3000-sync-verification-20260728
  cancel-in-progress: true

jobs:
  verify-final-production-sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/verify-full-ebay-catalog-sync-20260728')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
      CRON_NOT_BEFORE_UTC: 2026-07-28T18:16:30Z
      CRON_COMPLETION_TARGET_UTC: 2026-07-28T18:27:00Z
      BASELINE_REMOTE_TOTAL_0902: "893"
      BASELINE_ELIGIBLE_0902: "865"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/verify-full-ebay-catalog-sync-20260728
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link Vercel Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel final-verification/logs final-verification/storefront
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > final-verification/logs/vercel-link.log 2>&1
          fi

      - name: Wait for protected cron completion
        shell: bash
        run: |
          set -euo pipefail
          target="$(date -u -d "$CRON_COMPLETION_TARGET_UTC" +%s)"
          now="$(date -u +%s)"
          if [ "$target" -gt "$now" ]; then sleep "$((target - now))"; fi

      - name: Capture and certify alias-aware production receipt
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 16); do
            raw="final-verification/logs/runtime-${attempt}.jsonl"
            npx vercel@56.2.0 logs \
              --project truely-collectables \
              --environment production \
              --since "$CRON_NOT_BEFORE_UTC" \
              --no-branch \
              --json \
              --expand \
              --limit 1000 \
              --query "ebay_store_fixed_price_sync_completed" \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" \
              > "$raw" 2> "final-verification/logs/runtime-${attempt}.stderr" || true
            ATTEMPT="$attempt" RAW_FILE="$raw" node <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readFileSync(process.env.RAW_FILE, 'utf8').split(/\r?\n/).filter(Boolean);
          const receipts = [];
          const inspect = (value) => {
            if (!value) return;
            if (typeof value === 'object') {
              if (value.event === 'ebay_store_fixed_price_sync_completed') receipts.push(value);
              for (const nested of Object.values(value)) inspect(nested);
              return;
            }
            if (typeof value !== 'string') return;
            const prefix = '[ebay-store-fixed-price-sync] ';
            const index = value.indexOf(prefix);
            if (index >= 0) {
              try {
                const parsed = JSON.parse(value.slice(index + prefix.length));
                if (parsed?.event === 'ebay_store_fixed_price_sync_completed') receipts.push(parsed);
              } catch {}
            }
            const schemaIndex = value.indexOf('{"schema":"truelycollectables.ebayStoreFixedPriceSyncReceipt.v2"');
            if (schemaIndex >= 0) {
              try {
                const parsed = JSON.parse(value.slice(schemaIndex));
                if (parsed?.event === 'ebay_store_fixed_price_sync_completed') receipts.push(parsed);
              } catch {}
            }
          };
          for (const line of rows) {
            try { inspect(JSON.parse(line)); } catch {}
          }
          const latest = receipts.sort((a, b) => Date.parse(a.completedAt || 0) - Date.parse(b.completedAt || 0)).at(-1) || null;
          fs.writeFileSync(`final-verification/logs/receipt-${process.env.ATTEMPT}.json`, `${JSON.stringify({ rowsRead: rows.length, receipt: latest }, null, 2)}\n`);
          NODE
            if grep -Fq '"receipt": {' "final-verification/logs/receipt-${attempt}.json"; then
              cp "final-verification/logs/receipt-${attempt}.json" final-verification/final-receipt.json
              found="$attempt"
              break
            fi
            sleep 30
          done
          test -n "$found"
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('final-verification/final-receipt.json', 'utf8')).receipt;
          const fail = (message) => { throw new Error(message); };
          if (!receipt) fail('No final production receipt found.');
          if (receipt.schema !== 'truelycollectables.ebayStoreFixedPriceSyncReceipt.v2') fail(`Unexpected receipt schema ${receipt.schema}`);
          if (receipt.success !== true || (receipt.errors || []).length) fail(`Production sync failed: ${JSON.stringify(receipt.errors || [])}`);
          const first = receipt.authoritative;
          const final = receipt.finalAuthoritative || (receipt.convergencePasses || []).at(-1);
          const images = (receipt.imagePasses || []).at(-1);
          const audit = receipt.databaseAudit || {};
          if (!first?.cycleComplete || Number(first.pagesRead || 0) < 1 || Number(first.failed || 0) !== 0) fail('Initial active eBay cycle was incomplete or failed.');
          if (Number(first.remoteFixedPriceTotal || 0) > 3000) fail(`Active eBay total ${first.remoteFixedPriceTotal} exceeded the approved 3,000 ceiling.`);
          if (Number(first.eligibleCollectibles || 0) + Number(first.skippedNonCollectibles || 0) !== Number(first.remoteFixedPriceTotal || 0)) fail('Eligible plus excluded listings did not reconcile to the active eBay total.');
          if (Number(first.representedInventoryRows || 0) + Number(first.mergedAliasListings || 0) !== Number(first.eligibleCollectibles || 0)) fail('Represented rows plus merged aliases did not reconcile to eligible eBay listings.');
          if (!images?.cycleComplete || Number(images.failed || 0) !== 0 || Number(images.remainingCandidates || 0) !== 0) fail('Complete image synchronization did not converge.');
          if (!receipt.quantities || Number(receipt.quantities.failed || 0) !== 0) fail('Quantity reconciliation failed.');
          if (!final?.cycleComplete || Number(final.failed || 0) !== 0) fail('Final authoritative cycle failed.');
          if (Number(final.inserted || 0) !== 0 || Number(final.updated || 0) !== 0 || Number(final.deactivated || 0) !== 0) fail(`Final cycle was not stable: ${JSON.stringify(final)}`);
          if (Number(final.unchanged || 0) !== Number(final.representedInventoryRows || 0)) fail('Final unchanged total did not equal represented website inventory rows.');
          if (Number(final.representedInventoryRows || 0) + Number(final.mergedAliasListings || 0) !== Number(final.eligibleCollectibles || 0)) fail('Final alias-aware totals did not reconcile.');
          if (audit.matchesEligibleEbayInventory !== true || Number(audit.activeLinkedProducts || 0) !== Number(final.representedInventoryRows || 0)) fail('Active website database rows did not match represented eBay inventory.');
          const baselineRemote = Number(process.env.BASELINE_REMOTE_TOTAL_0902 || 0);
          const baselineEligible = Number(process.env.BASELINE_ELIGIBLE_0902 || 0);
          const summary = {
            success: true,
            completedAt: receipt.completedAt,
            remoteFixedPriceTotal: Number(final.remoteFixedPriceTotal || 0),
            eligibleCollectibles: Number(final.eligibleCollectibles || 0),
            skippedNonCollectibles: Number(final.skippedNonCollectibles || 0),
            mergedAliasListings: Number(final.mergedAliasListings || 0),
            representedInventoryRows: Number(final.representedInventoryRows || 0),
            activeLinkedProducts: Number(audit.activeLinkedProducts || 0),
            firstPassChanges: {
              inserted: Number(first.inserted || 0),
              updated: Number(first.updated || 0),
              deactivated: Number(first.deactivated || 0),
            },
            imagePasses: (receipt.imagePasses || []).length,
            quantityChecked: Number(receipt.quantities.checked || 0),
            convergencePasses: (receipt.convergencePasses || []).length,
            baseline0902: { remoteFixedPriceTotal: baselineRemote, eligibleCollectibles: baselineEligible },
            deltaSince0902: {
              remoteFixedPriceTotal: Number(final.remoteFixedPriceTotal || 0) - baselineRemote,
              eligibleCollectibles: Number(final.eligibleCollectibles || 0) - baselineEligible,
            },
          };
          fs.writeFileSync('final-verification/certified-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary));
          NODE

      - name: Verify live storefront total and exclusions
        shell: bash
        run: |
          set -euo pipefail
          fetch_page() {
            key="$1"; path="$2"; body="final-verification/storefront/${key}.html"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --header 'Cache-Control: no-cache' --output "$body" --write-out '%{http_code}' "${PRODUCTION_ORIGIN}${path}" || true)"
            test "$code" = '200'
          }
          fetch_page all '/shop'
          fetch_page pucks '/shop?section=Pucks'
          fetch_page autographs '/shop?feature=autograph'
          fetch_page shoes '/shop?q=shoes'
          fetch_page pants '/shop?q=pants'
          fetch_page parts '/shop?q=fuel%20sensor'
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('final-verification/certified-summary.json', 'utf8'));
          const text = (key) => fs.readFileSync(`final-verification/storefront/${key}.html`, 'utf8').replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          const count = (key) => {
            const match = text(key).match(/([\d,]+) active cards & collectibles/i);
            return match ? Number(match[1].replaceAll(',', '')) : null;
          };
          const results = { all: count('all'), pucks: count('pucks'), autographs: count('autographs'), shoes: count('shoes'), pants: count('pants'), parts: count('parts') };
          if (results.all !== summary.representedInventoryRows) throw new Error(`Live storefront ${results.all} does not match represented eBay inventory ${summary.representedInventoryRows}.`);
          if (!Number.isInteger(results.pucks) || results.pucks < 1) throw new Error('Pucks section is empty.');
          if (!Number.isInteger(results.autographs) || results.autographs < 1) throw new Error('Autographs filter is empty.');
          for (const key of ['shoes', 'pants', 'parts']) if (results[key] !== 0) throw new Error(`${key} exclusion returned ${results[key]} items.`);
          fs.writeFileSync('final-verification/storefront-summary.json', `${JSON.stringify({ success: true, results }, null, 2)}\n`);
          NODE

      - name: Upload final alias-aware synchronization certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-alias-aware-ebay-sync-certificate-${{ github.run_number }}
          path: final-verification
          if-no-files-found: warn
          retention-days: 30
