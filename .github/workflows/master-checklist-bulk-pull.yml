name: Master Checklist Bulk Pull
# Production incident kill switch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/master-checklist-bulk-pull.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-checklist-bulk-pull-refs/heads/main
  cancel-in-progress: true

jobs:
  emergency-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm checklist bulk pull paused
        run: echo "Master checklist bulk pull paused during storefront incident."
