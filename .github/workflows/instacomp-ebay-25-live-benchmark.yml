name: InstaComp eBay 25-Card Live Benchmark

on:
  push:
    branches:
      - fix/instacomp-ebay-25-live-benchmark-20260727
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-ebay-25-live-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
      INSTACOMP_BENCHMARK_TARGET: "25"
      INSTACOMP_BENCHMARK_CONCURRENCY: "2"
    steps:
      - name: Check out benchmark revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate benchmark source
        run: >-
          npx eslint
          src/app/api/instacomp/benchmark/ebay-25/route.ts
          src/app/api/instacomp/live-scan/route.ts
          src/app/api/instacomp/scan/route.ts
          src/lib/instacomp-ebay-benchmark-cases.ts
          scripts/run-instacomp-ebay-25-benchmark.mjs
          scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
          ADMIN_PASSWORD: build-only-placeholder-password
          ADMIN_SESSION_SECRET: build-only-placeholder-admin-session-secret
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_only_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
          EBAY_CLIENT_ID: build-only-placeholder-client-id
          EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: npm run build

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx vercel@latest link
          --yes
          --project "$VERCEL_PROJECT"
          --scope "$VERCEL_SCOPE"
          --token "$VERCEL_TOKEN"

      - name: Generate one-run benchmark token
        run: |
          BENCHMARK_TOKEN="$(openssl rand -hex 32)"
          echo "INSTACOMP_BENCHMARK_TOKEN=$BENCHMARK_TOKEN" >> "$GITHUB_ENV"

      - name: Deploy isolated preview benchmark
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx vercel@latest deploy \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --env "INSTACOMP_BENCHMARK_TOKEN=$INSTACOMP_BENCHMARK_TOKEN" \
            > deployment-url.txt
          PREVIEW_URL="$(tail -n 1 deployment-url.txt | tr -d '\r\n')"
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "INSTACOMP_PREVIEW_DEPLOYMENT_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Verify protected preview transport
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Vercel CLI 57 forwards --scope/--token placed after the curl
          # subcommand to system curl. Keep project authentication in the
          # linked .vercel directory and VERCEL_TOKEN environment instead.
          npx vercel@latest curl \
            /api/instacomp/benchmark/ebay-25 \
            --deployment "$INSTACOMP_PREVIEW_DEPLOYMENT_URL" \
            --header "Authorization: Bearer $INSTACOMP_BENCHMARK_TOKEN" \
            > benchmark-manifest.json \
            2> benchmark-manifest-stderr.txt
          node - <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("benchmark-manifest.json", "utf8").trim();
          if (!raw) throw new Error("Protected-preview manifest response was empty.");
          const payload = JSON.parse(raw);
          if (!payload.ok || !Array.isArray(payload.cases) || payload.cases.length < 25) {
            throw new Error(`Benchmark manifest was not ready: ${raw.slice(0, 1200)}`);
          }
          console.log(`Protected-preview transport verified with ${payload.cases.length} cases.`);
          NODE

      - name: Run 25 real eBay cards through InstaComp
        id: benchmark
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          INSTACOMP_PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.preview_url }}
        run: node scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Summarize benchmark
        if: always()
        run: |
          if [ -f reports/instacomp-ebay-25-report.json ]; then
            node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("reports/instacomp-ebay-25-report.json", "utf8"));
          const summary = report.summary || {};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "# InstaComp eBay 25-Card Live Benchmark",
            "",
            `Completed: ${summary.completedCards || 0}/${report.requestedTarget || 25}`,
            `Target met: ${Boolean(summary.targetMet)}`,
            `Average score: ${summary.averageScore ?? "n/a"}`,
            `Median score: ${summary.medianScore ?? "n/a"}`,
            `Catalog confirmed: ${summary.catalogIdentityConfirmed || 0}/${summary.completedCards || 0}`,
            `Exact sold supported: ${summary.exactSoldSupportedCards || 0}/${summary.completedCards || 0}`,
            `Trusted prices: ${summary.trustedPriceCards || 0}/${summary.completedCards || 0}`,
            `Weird errors: ${summary.totalWeirdErrors || 0} (${summary.criticalErrors || 0} critical, ${summary.majorErrors || 0} major, ${summary.minorErrors || 0} minor)`,
            "",
          ].join("\n"));
          NODE
          else
            echo "# InstaComp eBay 25-Card Live Benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "No benchmark report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report and transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-ebay-25-live-report-${{ github.run_number }}
          path: |
            reports/instacomp-ebay-25-report.json
            reports/instacomp-ebay-25-report.md
            benchmark-manifest.json
            benchmark-manifest-stderr.txt
            deployment-url.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce completed 25-card report
        if: always()
        run: |
          test -f reports/instacomp-ebay-25-report.json
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("reports/instacomp-ebay-25-report.json", "utf8"));
          const completed = Number(report?.summary?.completedCards || 0);
          if (!report?.summary?.targetMet || completed < 25) {
            throw new Error(`Benchmark incomplete: ${completed}/25 real eBay cards completed.`);
          }
          console.log(`Benchmark complete: ${completed}/25 real eBay cards.`);
          NODE
