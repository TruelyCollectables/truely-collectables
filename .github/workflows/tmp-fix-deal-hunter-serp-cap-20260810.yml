name: Temporary Fix Deal Hunter Serp Cap 20260810

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 1045 && github.event.pull_request.head.ref == 'agent/deal-hunter-comp-memory-20260810' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/deal-hunter-comp-memory-20260810
      - name: Preserve query ladder while capping paid attempts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          exact = Path('src/lib/instacomp-exact-market-provider.ts')
          text = exact.read_text()
          old = 'const MAX_QUERY_ATTEMPTS = 1;\n'
          new = 'const MAX_QUERY_ATTEMPTS = 6;\nconst MAX_SERPAPI_QUERY_ATTEMPTS = 1;\n'
          if old not in text: raise SystemExit('MAX_QUERY_ATTEMPTS patch anchor missing')
          text = text.replace(old, new, 1)
          old = '  for (const query of params.queries) {\n'
          new = '  for (const query of params.queries.slice(0, MAX_SERPAPI_QUERY_ATTEMPTS)) {\n'
          if old not in text: raise SystemExit('provider query loop patch anchor missing')
          exact.write_text(text.replace(old, new, 1))

          contract = Path('scripts/run-deal-hunter-market-memory-first-contract.mjs')
          text = contract.read_text()
          old = "assert.ok(exact.includes('const MAX_QUERY_ATTEMPTS = 1;'));"
          new = "assert.ok(exact.includes('const MAX_QUERY_ATTEMPTS = 6;'));\nassert.ok(exact.includes('const MAX_SERPAPI_QUERY_ATTEMPTS = 1;'));\nassert.ok(exact.includes('params.queries.slice(0, MAX_SERPAPI_QUERY_ATTEMPTS)'));"
          if old not in text: raise SystemExit('contract patch anchor missing')
          contract.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact provider regression and market-memory contract
        run: |
          set -euo pipefail
          node --import tsx scripts/run-instacomp-exact-provider-regressions.ts
          node scripts/run-deal-hunter-market-memory-first-contract.mjs
          npx tsc --noEmit --pretty false
          git diff --check
      - name: Commit focused regression fix
        run: |
          set -euo pipefail
          git config user.name 'truelycollectables-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/instacomp-exact-market-provider.ts scripts/run-deal-hunter-market-memory-first-contract.mjs
          git commit -m 'Cap SerpApi attempts without removing query ladder'
          git push origin HEAD:agent/deal-hunter-comp-memory-20260810
