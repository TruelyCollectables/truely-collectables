name: Diagnose Registry Preflight Hang

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-registry-preflight-hang-pr.yml"

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve protected Production Supabase credentials
        run: bash scripts/resolve-mainstream-checklist-production-env.sh
      - name: Read Supabase project, REST, and database health
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN"
          base="https://api.supabase.com/v1/projects/$RESOLVED_SUPABASE_PROJECT_REF"

          echo '--- project metadata ---'
          curl --silent --show-error --max-time 15 \
            --header "$auth" \
            "$base" \
            | jq '{ref,name,status,region,inserted_at}'

          for service in rest db; do
            echo "--- $service service health ---"
            file="$RUNNER_TEMP/${service}-health.json"
            status=$(curl --silent --show-error --max-time 15 \
              --output "$file" \
              --write-out '%{http_code}' \
              --header "$auth" \
              "$base/health?services=$service" || true)
            echo "${service}_health_http=$status"
            jq . "$file" 2>/dev/null || cat "$file" || true
          done
      - name: Remove protected Production files
        if: always()
        run: rm -rf "$RUNNER_TEMP/mainstream-checklist-ingestion" .env.local .env.production.local "$RUNNER_TEMP/rest-health.json" "$RUNNER_TEMP/db-health.json"
