name: Run Pending Import Fallback Patch

on:
  push:
    branches:
      - agent/pending-import-without-lifecycle-migration-20260725
    paths:
      - ".github/workflows/pending-import-fallback-run.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pending-import-without-lifecycle-migration-20260725
      - name: Patch importer
        run: python scripts/one-time-patch-pending-import-fallback.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Truely Collectables CI"
          git config user.email "sales@truelycollectables.com"
          git add src/app/api/admin/verified-reference-import/route.ts
          git commit -m "Allow verified drafts before lifecycle migration"
          git push origin HEAD:agent/pending-import-without-lifecycle-migration-20260725
