name: InstaComp Same-Origin 25-Card Live Certification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-benchmark-same-origin-live-certification.yml"

permissions:
  contents: read

concurrency:
  group: instacomp-benchmark-same-origin-live-certification
  cancel-in-progress: true

env:
  EXPECTED_BASE_SHA: f0ebe3293de39750067a88c347c0612e198e094f
  EXPECTED_BRANCH: fix/instacomp-benchmark-same-origin
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  INSTACOMP_BENCHMARK_TARGET: "25"
  INSTACOMP_BENCHMARK_CONCURRENCY: "2"

jobs:
  live-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on focused repair scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            ".github/workflows/instacomp-benchmark-same-origin-live-certification.yml"
            "scripts/run-instacomp-benchmark-request-security-regression.ts"
            "src/app/api/instacomp/benchmark/ebay-25/route.ts"
            "src/lib/instacomp-benchmark-request-security.ts"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          grep -Fq 'buildInstaCompBenchmarkSameOriginHeaders(scanUrl)' \
            src/app/api/instacomp/benchmark/ebay-25/route.ts
          git diff --check "$EXPECTED_BASE_SHA"...HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reprove security and identity gates
        run: |
          node --import tsx scripts/run-instacomp-benchmark-request-security-regression.ts
          npm run simulate:privileged-route-auth
          npx tsx scripts/run-instacomp-registry-consensus-bridge-regression.ts
          npx tsx scripts/run-instacomp-live-shedeur-107-regression.ts
          npx eslint \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/lib/instacomp-benchmark-request-security.ts \
            scripts/run-instacomp-benchmark-request-security-regression.ts \
            scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx vercel@56.2.0 link \
            --yes \
            --project "$VERCEL_PROJECT" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

      - name: Generate one-run benchmark credentials
        shell: bash
        run: |
          set -euo pipefail
          benchmark_token="$(openssl rand -hex 32)"
          benchmark_admin_secret="$(openssl rand -hex 48)"
          echo "::add-mask::$benchmark_token"
          echo "::add-mask::$benchmark_admin_secret"
          echo "INSTACOMP_BENCHMARK_TOKEN=$benchmark_token" >> "$GITHUB_ENV"
          echo "BENCHMARK_ADMIN_SESSION_SECRET=$benchmark_admin_secret" >> "$GITHUB_ENV"

      - name: Deploy isolated protected preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --env "INSTACOMP_BENCHMARK_TOKEN=$INSTACOMP_BENCHMARK_TOKEN" \
            --env "ADMIN_SESSION_SECRET=$BENCHMARK_ADMIN_SESSION_SECRET" \
            > deployment-url.txt
          preview_url="$(tail -n 1 deployment-url.txt | tr -d '\r\n')"
          test -n "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "INSTACOMP_PREVIEW_DEPLOYMENT_URL=$preview_url" >> "$GITHUB_ENV"

      - name: Verify protected preview transport
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 curl \
            /api/instacomp/benchmark/ebay-25 \
            --deployment "$INSTACOMP_PREVIEW_DEPLOYMENT_URL" \
            --header "Authorization: Bearer $INSTACOMP_BENCHMARK_TOKEN" \
            > benchmark-manifest.json \
            2> benchmark-manifest-stderr.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('benchmark-manifest.json', 'utf8').trim();
          if (!raw) throw new Error('Protected-preview manifest response was empty.');
          const payload = JSON.parse(raw);
          const target = Number(process.env.INSTACOMP_BENCHMARK_TARGET || 25);
          if (!payload.ok || !Array.isArray(payload.cases) || payload.cases.length < target) {
            throw new Error(`Benchmark manifest was not ready: ${raw.slice(0, 1200)}`);
          }
          console.log(`Protected preview exposes ${payload.cases.length} official cases for a ${target}-card run.`);
          NODE

      - name: Run 25+ real cards through repaired InstaComp
        id: benchmark
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          INSTACOMP_PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.preview_url }}
        run: node scripts/run-instacomp-ebay-25-through-vercel-curl.mjs

      - name: Summarize benchmark
        if: always()
        shell: bash
        run: |
          if [ ! -f reports/instacomp-ebay-25-report.json ]; then
            echo "# InstaComp Same-Origin 25-Card Live Certification" >> "$GITHUB_STEP_SUMMARY"
            echo "No benchmark report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/instacomp-ebay-25-report.json', 'utf8'));
          const summary = report.summary || {};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# InstaComp Same-Origin 25-Card Live Certification',
            '',
            `Completed: ${summary.completedCards || 0}/${report.requestedTarget || 25}`,
            `Passed: ${summary.passedCards || 0}/${summary.completedCards || 0}`,
            `Pass rate: ${Number(summary.passRate || 0).toFixed(2)}%`,
            `Average score: ${summary.averageScore ?? 'n/a'}`,
            `Registry coverage: ${Number(summary.catalogCoverageRate || 0).toFixed(2)}%`,
            `Critical identity errors: ${summary.criticalErrors || 0}`,
            `Provider-error cards: ${summary.providerErrorCards || 0}`,
            `Exact sold supported: ${summary.exactSoldSupportedCards || 0}`,
            `Trusted-price cards: ${summary.trustedPriceCards || 0}`,
            '',
          ].join('\n'));
          NODE

      - name: Upload sanitized live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-same-origin-25-card-live-report
          path: |
            reports/instacomp-ebay-25-report.json
            reports/instacomp-ebay-25-report.md
            benchmark-manifest.json
            benchmark-manifest-stderr.txt
            deployment-url.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Require 95 percent live identity accuracy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.benchmark.outcome }}" = "success"
          test -f reports/instacomp-ebay-25-report.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/instacomp-ebay-25-report.json', 'utf8'));
          const summary = report.summary || {};
          const completed = Number(summary.completedCards || 0);
          const passRate = Number(summary.passRate || 0);
          const registryCoverage = Number(summary.catalogCoverageRate || 0);
          const criticalErrors = Number(summary.criticalErrors || 0);
          if (!summary.targetMet || completed < 25) {
            throw new Error(`Benchmark incomplete: ${completed}/25 cards completed.`);
          }
          if (passRate < 95) {
            throw new Error(`Identity accuracy below target: ${passRate.toFixed(2)}%, required 95%.`);
          }
          if (registryCoverage < 95) {
            throw new Error(`Registry coverage below target: ${registryCoverage.toFixed(2)}%, required 95%.`);
          }
          if (criticalErrors !== 0) {
            throw new Error(`Critical identity errors detected: ${criticalErrors}.`);
          }
          console.log(`Live identity gate passed: ${completed} cards, ${passRate.toFixed(2)}% pass rate, ${registryCoverage.toFixed(2)}% Registry coverage, zero critical errors.`);
          NODE
