name: InstaComp AI Local

on:
  pull_request:
    paths:
      - "services/instacomp-ai/**"
      - "lib/instacomp-ai-local.ts"
      - ".github/workflows/instacomp-ai-local.yml"
  push:
    branches:
      - "feature/instacomp-ai-local-foundation"
    paths:
      - "services/instacomp-ai/**"
      - "lib/instacomp-ai-local.ts"
      - ".github/workflows/instacomp-ai-local.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/instacomp-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app scripts tests
      - run: pytest -q
      - name: Validate checklist template
        run: python scripts/validate_checklist.py checklists/checklist-template.csv
