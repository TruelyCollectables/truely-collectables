name: Fix Order Notification Leftovers

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/order-notification-hardening-20260726' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove stale inline email setup
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/app/api/orders/mark-shipped/route.ts")
          text = path.read_text()
          text = text.replace(
              'import { getStoreSettings } from "../../../../lib/store-settings";\n',
              '',
              1,
          )
          old = '''    const resendApiKey = process.env.RESEND_API_KEY;
    const supabase = createSupabaseServerClient({ admin: true });
    const storeId = getActiveStoreId();
    const storeSettings = await getStoreSettings(supabase, storeId);
    const activeStoreName = storeName(storeSettings.displayName);
'''
          new = '''    const supabase = createSupabaseServerClient({ admin: true });
    const storeId = getActiveStoreId();
'''
          if old not in text and new not in text:
              raise SystemExit("Expected stale shipment email setup was not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "Shipment route already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/orders/mark-shipped/route.ts
          git commit -m "Remove stale inline shipment email setup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
