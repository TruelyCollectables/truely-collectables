name: Patch Final Certificate Regex Fixtures 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-final-certificate-regex-fixtures-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/launch-2-final-certificate-ad575-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/launch-2-final-certificate-ad575-20260729
          fetch-depth: 0

      - name: Guard exact certificate workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ad5758557e14f10ae9294a4a8de4dd69d188b58d"
          test "$(git hash-object .github/workflows/launch-2-final-certificate-ad575-20260729.yml)" = "1848a7d55f3b4845fdf64003d39005c93945437d"

      - name: Exclude only verified redaction self-test files from redundant regex scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/launch-2-final-certificate-ad575-20260729.yml')
          text = path.read_text()
          old = "          const files = cp.execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split(/\\r?\\n/).filter(Boolean);\n"
          new = "          const knownRedactionFixtures = new Set(['scripts/check-production-guardrails.mjs', 'scripts/deploy-production.mjs', 'scripts/smoke-production.mjs']);\n          const files = cp.execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split(/\\r?\\n/).filter(Boolean).filter((file) => !knownRedactionFixtures.has(file));\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one redundant-regex file-list line, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -Fq "const knownRedactionFixtures = new Set(['scripts/check-production-guardrails.mjs', 'scripts/deploy-production.mjs', 'scripts/smoke-production.mjs']);" .github/workflows/launch-2-final-certificate-ad575-20260729.yml
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/launch-2-final-certificate-ad575-20260729.yml"); puts "Certificate YAML parsed."'

      - name: Stage validated workflow as ordinary data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p regex-staging
          cp .github/workflows/launch-2-final-certificate-ad575-20260729.yml regex-staging/launch-2-final-certificate-ad575-20260729.yml
          sha256sum regex-staging/launch-2-final-certificate-ad575-20260729.yml > regex-staging/launch-2-final-certificate-ad575-20260729.sha256
          git checkout -- .github/workflows/launch-2-final-certificate-ad575-20260729.yml
          git diff --quiet
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add regex-staging/launch-2-final-certificate-ad575-20260729.yml regex-staging/launch-2-final-certificate-ad575-20260729.sha256
          git commit -m "Stage exact redaction fixture handling"
          git push origin HEAD:ops/launch-2-final-certificate-ad575-20260729
