name: Ops CollX Visual Parts Check 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-visual-parts-check-20260810.yml"
      - ".github/ops/collx-visual-manifest.chunk*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact staged chunk sizes and hashes
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/ops/collx-visual-manifest.chunk*
          sha256sum .github/ops/collx-visual-manifest.chunk*
