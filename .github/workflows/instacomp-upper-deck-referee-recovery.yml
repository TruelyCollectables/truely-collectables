name: InstaComp Upper Deck Registry Referee Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/instacomp-learning-server.ts"
      - "scripts/run-instacomp-upper-deck-referee-recovery-regression.ts"
      - ".github/workflows/instacomp-upper-deck-referee-recovery.yml"

permissions:
  contents: read

jobs:
  referee-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prove Upper Deck Registry referee recovery
        run: node --import tsx scripts/run-instacomp-upper-deck-referee-recovery-regression.ts

      - name: Preserve existing Registry and identity firewalls
        run: |
          npx tsx scripts/run-instacomp-registry-consensus-bridge-regression.ts
          npx tsx scripts/run-instacomp-live-shedeur-107-regression.ts
          npx tsx scripts/run-instacomp-identity-firewall-regressions.ts
          npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts
          npm run simulate:instacomp-consensus

      - name: Lint permanent recovery files
        run: |
          npx eslint \
            src/lib/instacomp-learning-server.ts \
            scripts/run-instacomp-upper-deck-referee-recovery-regression.ts

      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
          ADMIN_PASSWORD: build-only-placeholder-password
          ADMIN_SESSION_SECRET: build-only-placeholder-admin-session-secret
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_only_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
          EBAY_CLIENT_ID: build-only-placeholder-client-id
          EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: npm run build
