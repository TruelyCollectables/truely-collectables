name: InstaComp Seller Sweep

on:
  pull_request:
    paths:
      - "src/app/admin/instacomp/seller-sweep/**"
      - "src/app/api/admin/instacomp/seller-sweep/**"
      - "src/app/api/internal/instacomp-seller-sweep-live-verify/**"
      - "src/lib/instacomp-seller-sweep-*.ts"
      - "supabase/migrations/20260802002500_instacomp_seller_sweeps.sql"
      - "scripts/run-instacomp-seller-sweep-contracts.mjs"
      - "scripts/run-instacomp-seller-sweep-live-smoke.mjs"
      - "scripts/run-instacomp-seller-sweep-live-verifier-simulations.ts"
      - "scripts/run-instacomp-seller-sweep-reconciliation-simulations.ts"
      - ".github/workflows/instacomp-seller-sweep.yml"
      - ".github/workflows/release-instacomp-seller-sweep-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-seller-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fail-closed Seller Sweep contracts
        run: node scripts/run-instacomp-seller-sweep-contracts.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify exact-identity receipt proof adapter
        run: node --import tsx scripts/run-instacomp-seller-sweep-proof-simulations.ts
      - name: Verify conservative photo reconciliation
        run: node --import tsx scripts/run-instacomp-seller-sweep-reconciliation-simulations.ts
      - name: Verify bounded Production smoke harness
        run: node scripts/run-instacomp-seller-sweep-live-smoke.mjs --self-test
      - name: Verify scoped Production live verifier
        run: node --import tsx scripts/run-instacomp-seller-sweep-live-verifier-simulations.ts
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
