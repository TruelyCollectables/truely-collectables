name: Verify TCOS Profit Hunter MCP Production 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-profit-hunter-mcp-production-deploy-20260728.yml"
      - "scripts/verify-tcos-profit-hunter-production.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-tcos-profit-hunter-mcp-production
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/tcos-profit-hunter-mcp-20260728')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_URL: https://truelycollectables.com
    steps:
      - name: Link project and run raw authenticated MCP verifier
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/TruelyCollectables/truely-collectables/deploy/tcos-profit-hunter-mcp-20260728/scripts/verify-tcos-profit-hunter-production.mjs \
            --output /tmp/verify-tcos-profit-hunter-production.mjs
          PRODUCTION_URL="$PRODUCTION_URL" \
            npx vercel@56.2.0 env run -e production -- node /tmp/verify-tcos-profit-hunter-production.mjs
