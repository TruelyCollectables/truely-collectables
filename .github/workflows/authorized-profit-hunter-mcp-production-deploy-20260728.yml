name: Verify TCOS Profit Hunter MCP Production 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-profit-hunter-mcp-production-deploy-20260728.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-tcos-profit-hunter-mcp-production
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/tcos-profit-hunter-mcp-20260728')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      DEPLOY_SOURCE_SHA: 203168cf1a4825d7772a9f21044d407035c1595b
      PRODUCTION_URL: https://truelycollectables.com
    steps:
      - name: Check out exact deployed source
        uses: actions/checkout@v4
        with:
          ref: 203168cf1a4825d7772a9f21044d407035c1595b
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact MCP client dependencies
        run: npm ci

      - name: Confirm Vercel identity and project
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN"
          mkdir -p .vercel .verification-evidence
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi

      - name: Verify private routes reject unauthenticated requests
        run: |
          set -euo pipefail
          for base in https://truely-collectables.vercel.app https://truelycollectables.com; do
            for path in /api/tcos-profit-hunter/mcp /api/admin/market-intel/profit-hunter-token; do
              code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output .verification-evidence/unauthorized-response.json --write-out '%{http_code}' "$base$path" || true)"
              echo "$base$path HTTP=$code"
              test "$code" = "401"
            done
          done

      - name: Create authenticated MCP verification client
        run: |
          cat > .verification-evidence/verify-profit-hunter.mjs <<'NODE'
          import { createHmac } from "node:crypto";
          import { Client } from "@modelcontextprotocol/sdk/client/index.js";
          import { StreamableHTTPClientTransport } from "@modelcontextprotocol/sdk/client/streamableHttp.js";

          const root = String(process.env.ADMIN_SESSION_SECRET || "").trim();
          const explicit = String(process.env.TCOS_CONNECTOR_TOKEN || "").trim();
          const token = explicit || (root
            ? createHmac("sha256", root)
                .update("TCOS Profit Hunter connector bearer v1", "utf8")
                .digest("base64url")
            : "");
          if (!token) throw new Error("Production connector token could not be derived.");

          const endpoint = new URL(
            "/api/tcos-profit-hunter/mcp",
            String(process.env.PRODUCTION_URL || "https://truelycollectables.com"),
          );
          const transport = new StreamableHTTPClientTransport(endpoint, {
            requestInit: {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            },
          });
          const client = new Client({ name: "tcos-production-verifier", version: "1.0.0" });
          client.onerror = (error) => {
            console.error(`MCP transport error: ${error.message}`);
          };

          await client.connect(transport);
          const listed = await client.listTools();
          const names = listed.tools.map((tool) => tool.name).sort();
          const expected = [
            "profit_hunter_status",
            "search_profit_hunter_candidates",
            "verify_profit_hunter_listing",
          ].sort();
          for (const name of expected) {
            if (!names.includes(name)) throw new Error(`Missing MCP tool: ${name}`);
          }

          const result = await client.callTool({
            name: "profit_hunter_status",
            arguments: {},
          });
          if (result.isError) {
            throw new Error(`Profit Hunter status tool failed: ${JSON.stringify(result.content)}`);
          }
          const text = result.content?.find((entry) => entry.type === "text")?.text;
          if (!text) throw new Error("Profit Hunter status returned no text payload.");
          const payload = JSON.parse(text);
          if (payload?.hardenedInstaComp?.configured !== true) {
            throw new Error("Hardened InstaComp is not configured in Production.");
          }
          if (payload?.purchaseWritesEnabled !== false) {
            throw new Error("Profit Hunter MCP unexpectedly exposes purchase writes.");
          }
          if (
            !payload?.discovery?.openAiPublicWeb &&
            !payload?.discovery?.ebayBrowse &&
            !payload?.discovery?.xRecentSearch
          ) {
            throw new Error("No automatic public discovery provider is configured in Production.");
          }

          console.log(JSON.stringify({
            connected: true,
            sourceSha: process.env.DEPLOY_SOURCE_SHA,
            toolCount: names.length,
            tools: names,
            hardenedInstaCompConfigured: true,
            automaticDiscoveryConfigured: true,
            purchaseWritesEnabled: false,
          }));
          await client.close();
          NODE

      - name: Run authenticated MCP verification with Production environment
        run: |
          set -euo pipefail
          PRODUCTION_URL="$PRODUCTION_URL" DEPLOY_SOURCE_SHA="$DEPLOY_SOURCE_SHA" \
            npx vercel@56.2.0 env run -e production -- node .verification-evidence/verify-profit-hunter.mjs \
            2>&1 | tee .verification-evidence/authenticated-mcp-verification.log
          grep -Fq '"connected":true' .verification-evidence/authenticated-mcp-verification.log
          grep -Fq '"hardenedInstaCompConfigured":true' .verification-evidence/authenticated-mcp-verification.log
          grep -Fq '"automaticDiscoveryConfigured":true' .verification-evidence/authenticated-mcp-verification.log
          grep -Fq '"purchaseWritesEnabled":false' .verification-evidence/authenticated-mcp-verification.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcos-profit-hunter-mcp-production-verification-${{ github.run_number }}
          path: .verification-evidence
          if-no-files-found: warn
          retention-days: 30
