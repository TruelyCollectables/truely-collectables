name: InstaComp Endpoint Repair Now

on:
  push:
    branches: [main]
    paths:
      - '.github/instacomp-endpoint-repair-now-trigger'

permissions:
  contents: read

concurrency:
  group: truely-instacomp-endpoint-repair-now
  cancel-in-progress: false

env:
  INSTACOMP_URL: https://instacomp.truelycollectables.com
  PREVIEW_URL: https://truely-collectables-preview.truelycollectables.workers.dev
  WORKER_NAME: truely-collectables-preview
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require existing deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VERCEL_TOKEN; do
            test -n "${!key:-}" || { echo "Missing $key"; exit 2; }
          done

      - name: Prove permanent InstaComp endpoint healthy before changing config
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --fail-with-body --max-time 20 \
            -o /tmp/health.json -w '%{http_code}' "$INSTACOMP_URL/health")
          echo "Permanent InstaComp health -> HTTP $status"
          test "$status" = "200"
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if (body?.ok !== true || body?.database !== 'ready' || body?.checklist !== 'ready') {
            throw new Error('Permanent InstaComp endpoint is not ready');
          }
          console.log(`InstaComp ready: app=${body.app || 'unknown'} database=${body.database} checklist=${body.checklist}`);
          NODE

      - name: Restore Truely Vercel production InstaComp URL
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.2.0 link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color >/dev/null
          printf '%s' "$INSTACOMP_URL" | npx --yes vercel@56.2.0 env add \
            INSTACOMP_AI_LOCAL_URL production --force \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color >/dev/null
          echo 'Vercel production InstaComp URL restored.'

      - name: Replace only the Cloudflare Worker InstaComp URL secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$INSTACOMP_URL" | npx --yes wrangler@4.122.0 secret put \
            INSTACOMP_AI_LOCAL_URL --name "$WORKER_NAME" >/dev/null
          echo 'Cloudflare Worker InstaComp URL secret repaired.'

      - name: Verify Cloudflare readiness after repair
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            result=$(curl -sS --max-time 25 -D /tmp/readiness.headers \
              -o /tmp/readiness.json -w '%{http_code} %{time_total}' \
              "$PREVIEW_URL/api/instacomp/internal-readiness" || true)
            http=$(printf '%s' "$result" | awk '{print $1}')
            elapsed=$(printf '%s' "$result" | awk '{print $2}')
            origin=$(awk 'BEGIN{IGNORECASE=1} /^x-truely-origin:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' /tmp/readiness.headers || true)
            echo "Readiness attempt $attempt -> HTTP ${http:-curl_error} time=${elapsed:-n/a}s origin=${origin:-missing}"
            if [ "$http" = "200" ] && [ "$origin" = "cloudflare-worker" ]; then
              if node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/readiness.json','utf8'));
          if (body?.configured !== true || body?.reachable !== true || body?.internalMemoryReady !== true || body?.checklistReady !== true) process.exit(1);
          console.log(`Cloudflare InstaComp ready: configured=${body.configured} reachable=${body.reachable} database=${body.internalMemoryReady} checklist=${body.checklistReady}`);
          NODE
              then
                exit 0
              fi
            fi
            sleep 5
          done
          cat /tmp/readiness.json || true
          echo
          exit 5
