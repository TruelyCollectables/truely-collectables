name: Temporary InstaComp Exact Parallel Patcher

on:
  push:
    branches:
      - agent/instacomp-exact-parallel-guard-20260726
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/instacomp-exact-parallel-guard-20260726')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact-parallel branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-parallel-guard-20260726
          fetch-depth: 0

      - name: Apply exact-parallel guard
        id: apply
        continue-on-error: true
        run: node scripts/apply-instacomp-exact-parallel-guard.mjs > exact-parallel-patch.log 2>&1

      - name: Upload exact-parallel patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-parallel-patch-log
          path: exact-parallel-patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when patch failed
        if: steps.apply.outcome == 'failure'
        run: |
          cat exact-parallel-patch.log
          exit 1

      - name: Commit patched branch
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject wrong parallels from InstaComp exact competition"
          git push origin HEAD:agent/instacomp-exact-parallel-guard-20260726
