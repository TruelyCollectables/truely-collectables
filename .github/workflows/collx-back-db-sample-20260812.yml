name: CollX Back DB Sample 20260812

on:
  push:
    branches: [fix/collx-back-images-20260812]
    paths:
      - ".github/workflows/collx-back-db-sample-20260812.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"
    steps:
      - name: Read sample only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json,os,subprocess
          API='https://api.supabase.com/v1'; TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']; STORE=os.environ['FLAGSHIP_STORE_ID']
          def req(method,path,body=None,timeout=45):
              cmd=['curl','-sS','--max-time',str(timeout),'-X',method,'-H',f'Authorization: Bearer {TOKEN}','-H','Accept: application/json','-H','Content-Type: application/json','-o','/tmp/sb.json','-w','%{http_code}',API+path]
              if body is not None: cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True); raw=open('/tmp/sb.json').read()
              try: payload=json.loads(raw) if raw else None
              except Exception: payload=raw
              return int((p.stdout or '0').strip()[-3:]),payload
          s,projects=req('GET','/projects',timeout=30)
          c=[p for p in projects if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if s!=200 or len(c)!=1: print('PROJECT_FAILURE',s,c); raise SystemExit(2)
          ref=str(c[0].get('id') or c[0].get('ref') or '')
          def sql(q):
              s,b=req('POST',f'/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':True},45)
              if s not in (200,201): print('SQL_FAILURE',s,b); raise SystemExit(3)
              return b
          sample=sql(f"select id,sku,title,image_url,quantity from public.products where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY' order by id limit 20;")
          print('PRODUCT_SAMPLE='+json.dumps(sample,default=str))
          gray=sql(f"select id,sku,title,image_url,quantity from public.products where store_id='{STORE}'::uuid and title ilike '%Allisha Gray%' and title ilike '%Green Ice%' order by id limit 20;")
          print('ALLISHA_GRAY='+json.dumps(gray,default=str))
          ids=[str(r.get('id')) for r in gray]
          if ids:
              q=','.join(ids)
              items=sql(f"select id,legacy_product_id,sku,quantity,status from public.inventory_items where store_id='{STORE}'::uuid and legacy_product_id in ({q}) order by id;")
              print('GRAY_ITEMS='+json.dumps(items,default=str))
              itemids=[str(r.get('id')) for r in items]
              if itemids:
                  quoted=','.join("'"+x+"'" for x in itemids)
                  images=sql(f"select id,inventory_item_id,image_url,sort_order,is_primary from public.inventory_images where inventory_item_id in ({quoted}) order by inventory_item_id,coalesce(sort_order,2147483647),id;")
                  print('GRAY_IMAGES='+json.dumps(images,default=str))
          PY
