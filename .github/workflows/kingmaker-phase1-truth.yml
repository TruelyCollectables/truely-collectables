name: KINGMAKER Phase 1 Truth

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-truth.ts"
      - "src/lib/kingmaker-truth-server.ts"
      - "scripts/run-kingmaker-phase1-truth-regressions.ts"
      - "supabase/migrations/20260802173000_kingmaker_phase1_truth_engine.sql"
      - ".github/workflows/kingmaker-phase1-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-truth-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lifecycle regressions
        run: npx tsx scripts/run-kingmaker-phase1-truth-regressions.ts

      - name: Lint KINGMAKER truth layer
        run: npx eslint src/lib/kingmaker-truth.ts src/lib/kingmaker-truth-server.ts scripts/run-kingmaker-phase1-truth-regressions.ts

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
        run: npm run build
