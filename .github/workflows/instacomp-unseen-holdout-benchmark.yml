name: InstaComp Unseen Holdout Benchmark Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-unseen-holdout-benchmark.yml"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py"
      - "services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py"
      - "services/instacomp-ai/app/**"
      - "services/instacomp-ai/requirements.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-unseen-holdout-benchmark.yml"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py"
      - "services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py"
      - "services/instacomp-ai/app/**"
      - "services/instacomp-ai/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile benchmark and syntax-check launcher
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py
          bash -n services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
      - name: Run unseen benchmark self-test five times
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            echo "===== UNSEEN HOLDOUT LINUX SELF-TEST ${pass}/5 ====="
            python services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py --self-test
          done
      - name: Prove no train or Frozen-25 leakage and no mutations
        run: |
          target=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py
          grep -q 'locked_validation_holdout' "$target"
          grep -q 'post_dataset_operator_confirmed' "$target"
          grep -q '_frozen_25_signatures' "$target"
          grep -q '_assert_unseen_contract' "$target"
          grep -q '_candidate_probe' "$target"
          grep -q 'EXACT_RATE_GATE = 0.95' "$target"
          grep -q 'wrong_authoritative_identity_nonzero' "$target"
          grep -q 'dangerous_variant_errors_nonzero' "$target"
          grep -q 'candidate_fallbacks_nonzero' "$target"
          ! grep -Eq 'UPDATE[[:space:]]+training_examples|INSERT[[:space:]]+INTO[[:space:]]+training_examples|DELETE[[:space:]]+FROM[[:space:]]+training_examples' "$target"
          ! grep -q 'enable-lora-candidate-macos.sh' services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
          ! grep -q 'automatic_promotion' "$target"

  contract-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile benchmark and prove macOS launcher syntax
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py
          bash -n services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
      - name: Run unseen benchmark self-test five times on macOS
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            echo "===== UNSEEN HOLDOUT MACOS SELF-TEST ${pass}/5 ====="
            python services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py --self-test
          done
      - name: Prove launcher remains read-only
        run: |
          grep -q 'Live benchmark is read-only' services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
          grep -q 'Current Registry UUID/fingerprint and physical evidence remain authoritative' services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
          ! grep -q 'enable-lora-candidate-macos.sh' services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
