name: InstaComp Unseen Holdout Benchmark Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-unseen-holdout-benchmark.yml"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v4.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v5.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v6.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v7.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v9.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py"
      - "services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py"
      - "services/instacomp-ai/app/**"
      - "src/app/api/instacomp/registry-holdout-lock/**"
      - "src/app/api/instacomp/registry-holdout-lock-fast/**"
      - "src/app/api/instacomp/registry-holdout-lock-player-card/**"
      - "services/instacomp-ai/requirements.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-unseen-holdout-benchmark.yml"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v4.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v5.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v6.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v7.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v9.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py"
      - "services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py"
      - "services/instacomp-ai/app/**"
      - "src/app/api/instacomp/registry-holdout-lock/**"
      - "src/app/api/instacomp/registry-holdout-lock-fast/**"
      - "src/app/api/instacomp/registry-holdout-lock-player-card/**"
      - "services/instacomp-ai/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile benchmark and syntax-check launcher
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v4.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v5.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v6.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v7.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v9.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py
          bash -n services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
      - name: Run unseen V11 benchmark self-test five times
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            echo "===== UNSEEN HOLDOUT V11 LINUX SELF-TEST ${pass}/5 ====="
            python services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py --self-test
          done
      - name: Prove no train or Frozen-25 leakage and no mutations
        run: |
          target=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py
          v4=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v4.py
          v5=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v5.py
          v6=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v6.py
          v7=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v7.py
          v8=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py
          v9=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v9.py
          v10=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py
          v11=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py
          launcher=services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
          grep -q 'locked_validation_holdout' "$target"
          grep -q 'post_dataset_operator_confirmed' "$target"
          grep -q '_frozen_25_signatures' "$target"
          grep -q '_assert_unseen_contract' "$target"
          grep -q '_candidate_probe' "$target"
          grep -q 'EXACT_RATE_GATE = 0.95' "$target"
          grep -q 'wrong_authoritative_identity_nonzero' "$target"
          grep -q 'dangerous_variant_errors_nonzero' "$target"
          grep -q 'candidate_fallbacks_nonzero' "$target"
          grep -q 'latest_training_examples' "$v4"
          grep -q '_image_bytes_match_current_example' "$v4"
          grep -q 'current_trusted_training_example_exact_id_and_image_hash' "$v4"
          grep -q '_CANONICAL_AUTHORITATIVE_HOLDOUT' "$v5"
          grep -q 'registry-holdout-lock-fast' "$v6"
          grep -q '_ready_first_order' "$v6"
          grep -q '_fast_bootstrap_one' "$v6"
          grep -q '_bounded_authoritative_holdout' "$v7"
          grep -q 'PREFLIGHT_WALL_BUDGET_SECONDS' "$v7"
          grep -q 'UNSEEN PREFLIGHT PROGRESS' "$v7"
          grep -q '_recovering_lock_identity' "$v8"
          grep -q 'RECOVERY_CONCURRENCY = 3' "$v8"
          grep -q 'registry_receipt_revalidation_accepted' "$v8"
          grep -q 'current_registry_bootstrap_receipt_revalidated_plus_v20_physical_witness' "$v8"
          grep -q 'BOOTSTRAP_OUTAGE_MIN_ATTEMPTS = 40' "$v9"
          grep -q 'BOOTSTRAP_OUTAGE_TRANSPORT_RATIO = 0.90' "$v9"
          grep -q 'UNSEEN REGISTRY OUTAGE CIRCUIT BREAKER' "$v9"
          grep -q 'LIVE_PREFLIGHT_REQUIRED_HEALTHY = 3' "$v10"
          grep -q 'PASS UNSEEN REGISTRY LIVE PREFLIGHT' "$v10"
          grep -q '_systemic_registry_failure' "$v10"
          grep -q 'expected_identity' "$v11"
          grep -q 'expected_image_pair_sha256' "$v11"
          grep -q 'receipt provenance only' "$v11"
          grep -q 'benchmark_lora_unseen_holdout_v11.py' "$launcher"
          ! grep -Eq 'UPDATE[[:space:]]+training_examples|INSERT[[:space:]]+INTO[[:space:]]+training_examples|DELETE[[:space:]]+FROM[[:space:]]+training_examples' "$target" "$v4" "$v5" "$v6" "$v7" "$v8" "$v9" "$v10" "$v11"
          ! grep -q 'enable-lora-candidate-macos.sh' "$launcher"
          ! grep -q 'automatic_promotion' "$target" "$v4" "$v5" "$v6" "$v7" "$v8" "$v9" "$v10" "$v11"

  contract-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile benchmark and prove macOS launcher syntax
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v1.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v4.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v5.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v6.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v7.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v9.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py \
            services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v19.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v20.py
          bash -n services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
      - name: Run unseen V11 benchmark self-test five times on macOS
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            echo "===== UNSEEN HOLDOUT V11 MACOS SELF-TEST ${pass}/5 ====="
            python services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py --self-test
          done
      - name: Prove launcher remains read-only and V11-gated
        run: |
          launcher=services/instacomp-ai/scripts/run-unseen-holdout-benchmark-from-main.sh
          v7=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v7.py
          v8=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py
          v9=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v9.py
          v10=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py
          v11=services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v11.py
          grep -q 'Live benchmark is read-only' "$launcher"
          grep -q "current trusted exact-ID, exact-image-hash training example" "$launcher"
          grep -q 'active Registry versions only' "$launcher"
          grep -q 'normal V20 Registry and physical revalidation' "$launcher"
          grep -q 'V8 may recover server input_incomplete only through one bounded fast Registry receipt' "$launcher"
          grep -q 'V9 aborts fail-closed when bootstrap sees a sustained systemic Registry transport outage' "$launcher"
          grep -q 'V10 performs three database-backed player/card Registry probes before any unseen exam work' "$launcher"
          grep -q 'V10 also treats 429/5xx/52x overload responses as systemic Registry failures' "$launcher"
          grep -q 'V11 persists the exact exam-admitted identity' "$launcher"
          grep -q 'Current Registry UUID/fingerprint and physical evidence remain authoritative' "$launcher"
          grep -q 'benchmark_lora_unseen_holdout_v11.py' "$launcher"
          grep -q 'registry_preflight_item_timeout' "$v7"
          grep -q 'UNSEEN PREFLIGHT WATCHDOG' "$v7"
          grep -q 'registry_bootstrap_receipt_revalidation_not_accepted' "$v8"
          grep -q 'RegistryOutageAbort' "$v9"
          grep -q 'LIVE_PREFLIGHT_REQUIRED_HEALTHY = 3' "$v10"
          grep -q 'no unseen exam work will start' "$v10"
          grep -q 'expected_identity' "$v11"
          ! grep -q 'enable-lora-candidate-macos.sh' "$launcher"
