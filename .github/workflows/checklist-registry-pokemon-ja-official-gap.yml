name: Checklist Registry Pokémon Japanese Official Gap

on:
  pull_request:
    paths:
      - "src/lib/checklist-registry/pokemon-japanese-official-reconciled.ts"
      - "src/lib/checklist-registry/server.ts"
      - "scripts/build-pokemon-japanese-official-gap-bundles.ts"
      - "scripts/import-pokemon-japanese-official-gap-bundles.ts"
      - "scripts/run-checklist-registry-pokemon-ja-official-gap-simulations.ts"
      - "scripts/verify-pokemon-japanese-official-sources.ts"
      - "scripts/finalize-pokemon-japanese-official-verification.ts"
      - "scripts/run-pokemon-japanese-official-verification.ts"
      - "scripts/build-tcgdex-japanese-registry-bundles.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-official-gap.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/checklist-registry/pokemon-japanese-official-reconciled.ts"
      - "src/lib/checklist-registry/server.ts"
      - "scripts/build-pokemon-japanese-official-gap-bundles.ts"
      - "scripts/import-pokemon-japanese-official-gap-bundles.ts"
      - "scripts/run-checklist-registry-pokemon-ja-official-gap-simulations.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-official-gap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-gap-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint official reconciliation code
        run: >-
          npx eslint
          src/lib/checklist-registry/pokemon-japanese-official-reconciled.ts
          src/lib/checklist-registry/server.ts
          scripts/build-pokemon-japanese-official-gap-bundles.ts
          scripts/import-pokemon-japanese-official-gap-bundles.ts
          scripts/run-checklist-registry-pokemon-ja-official-gap-simulations.ts

      - name: Verify official reconciliation adapter
        run: >-
          npx tsx
          scripts/run-checklist-registry-pokemon-ja-official-gap-simulations.ts

      - name: Check out current TCGdex source
        run: >-
          git clone --depth 1
          https://github.com/tcgdex/cards-database.git
          .codex-run/tcgdex-cards-database

      - name: Build Japanese Registry base bundles
        run: >-
          npx tsx scripts/build-tcgdex-japanese-registry-bundles.ts
          .codex-run/tcgdex-cards-database
          .codex-run/tcgdex-ja-registry-bundles
          --receipt .codex-run/tcgdex-ja-build-receipt.json

      - name: Audit SV5K and SV8 against the official source
        run: >-
          npx tsx scripts/run-pokemon-japanese-official-verification.ts
          .codex-run/tcgdex-ja-registry-bundles
          --set SV5K
          --set SV8
          --delay-ms 50
          --detail-samples 2
          --receipt .codex-run/pokemon-ja-gap-audit-receipt.json
          --queue .codex-run/pokemon-ja-gap-audit-queue.json

      - name: Classify safe append-only reconciliation scope
        id: reconciliation
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = require('./.codex-run/pokemon-ja-gap-audit-receipt.json');
          const expectedSets = ['SV5K', 'SV8'];
          const rows = expectedSets.map((setId) => {
            const row = audit.rows.find((candidate) => candidate.setId === setId);
            if (!row) throw new Error(`Missing official audit row for ${setId}.`);
            return row;
          });
          const allowedMismatchReasons = new Set([
            'official_card_count_mismatch',
            'official_name_population_mismatch',
          ]);
          const mismatches = [];
          for (const row of rows) {
            const extras = (row.extraRegistryNames || []).reduce(
              (sum, entry) => sum + Number(entry.count || 0),
              0,
            );
            const missing = (row.missingOfficialNamesInRegistry || []).reduce(
              (sum, entry) => sum + Number(entry.count || 0),
              0,
            );
            const officialCount = Number(row.officialComparableCount);
            const registryCount = Number(row.registryCardCount);
            const unsafeDetail = (row.detailEvidence || []).some(
              (detail) => detail.error || detail.nameMatches === false ||
                detail.numberMatches === false || detail.setCodeMatches === false,
            );

            if (row.status === 'verified') {
              if (
                row.countMatches !== true ||
                row.setCodeMatches !== true ||
                row.nameMultisetMatches !== true ||
                Number(row.orderedNameMismatchCount || 0) !== 0 ||
                extras !== 0 ||
                missing !== 0 ||
                unsafeDetail ||
                officialCount !== registryCount
              ) {
                throw new Error(`Verified row is not exact and source-backed: ${JSON.stringify(row)}`);
              }
              continue;
            }

            if (row.status !== 'mismatch') {
              throw new Error(`Unsafe official audit status for ${row.setId}: ${row.status}`);
            }
            if (!row.officialProduct || row.setCodeMatches !== true || unsafeDetail) {
              throw new Error(`Mismatch row lacks a safe official source boundary: ${JSON.stringify(row)}`);
            }
            if (
              !Number.isInteger(officialCount) ||
              !Number.isInteger(registryCount) ||
              officialCount <= registryCount ||
              extras !== 0 ||
              missing !== officialCount - registryCount
            ) {
              throw new Error(`Mismatch is not append-only: ${JSON.stringify(row)}`);
            }
            const unsafeReasons = (row.reasons || []).filter(
              (reason) => !allowedMismatchReasons.has(reason),
            );
            if (unsafeReasons.length > 0) {
              throw new Error(`Mismatch has unsafe reasons: ${unsafeReasons.join(', ')}`);
            }
            mismatches.push(row.setId);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `needs_reconciliation=${mismatches.length > 0}\nsets=${mismatches.join(' ')}\n`,
          );
          console.log(JSON.stringify({
            expectedSets,
            verifiedSets: rows.filter((row) => row.status === 'verified').map((row) => row.setId),
            mismatchSets: mismatches,
          }, null, 2));
          NODE

      - name: Build complete reconciled bundles
        if: steps.reconciliation.outputs.needs_reconciliation == 'true'
        env:
          RECONCILIATION_SETS: ${{ steps.reconciliation.outputs.sets }}
        run: |
          set -euo pipefail
          args=()
          for set_id in $RECONCILIATION_SETS; do
            args+=(--set "$set_id")
          done
          npx tsx scripts/build-pokemon-japanese-official-gap-bundles.ts \
            .codex-run/tcgdex-ja-registry-bundles \
            .codex-run/pokemon-ja-official-gap-bundles \
            --audit-receipt .codex-run/pokemon-ja-gap-audit-receipt.json \
            --delay-ms 50 \
            --continue-on-error \
            --receipt .codex-run/pokemon-ja-official-gap-build-receipt.json \
            "${args[@]}"

      - name: Validate reconciled bundles
        if: steps.reconciliation.outputs.needs_reconciliation == 'true'
        run: >-
          npx tsx scripts/import-pokemon-japanese-official-gap-bundles.ts
          .codex-run/pokemon-ja-official-gap-bundles
          --continue-on-error
          --receipt .codex-run/pokemon-ja-official-gap-validation-receipt.json

      - name: Verify exact source-backed totals or safe no-op
        env:
          RECONCILIATION_SETS: ${{ steps.reconciliation.outputs.sets }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = require('./.codex-run/pokemon-ja-gap-audit-receipt.json');
          const expectedSets = ['SV5K', 'SV8'];
          const rows = expectedSets.map((setId) => audit.rows.find((row) => row.setId === setId));
          if (rows.some((row) => !row)) throw new Error('Official audit is missing a target set.');
          const mismatchSets = String(process.env.RECONCILIATION_SETS || '')
            .split(/\s+/)
            .filter(Boolean)
            .sort();
          const officialTotal = rows.reduce(
            (sum, row) => sum + Number(row.officialComparableCount || 0),
            0,
          );
          const registryTotal = rows.reduce(
            (sum, row) => sum + Number(row.registryCardCount || 0),
            0,
          );
          if (officialTotal !== 238) {
            throw new Error(`Unexpected official target population: ${officialTotal}`);
          }

          if (mismatchSets.length === 0) {
            if (rows.some((row) => row.status !== 'verified')) {
              throw new Error(`No-op requires every target to be verified: ${JSON.stringify(rows)}`);
            }
            if (registryTotal !== officialTotal) {
              throw new Error(`Verified no-op count mismatch: ${registryTotal}/${officialTotal}`);
            }
            if (
              fs.existsSync('./.codex-run/pokemon-ja-official-gap-build-receipt.json') ||
              fs.existsSync('./.codex-run/pokemon-ja-official-gap-validation-receipt.json')
            ) {
              throw new Error('Verified no-op unexpectedly created reconciliation receipts.');
            }
            console.log(JSON.stringify({
              mode: 'verified_noop',
              verifiedSets: expectedSets,
              officialCards: officialTotal,
              registryCards: registryTotal,
            }, null, 2));
            process.exit(0);
          }

          const build = require('./.codex-run/pokemon-ja-official-gap-build-receipt.json');
          const validation = require('./.codex-run/pokemon-ja-official-gap-validation-receipt.json');
          const mismatchRows = rows.filter((row) => mismatchSets.includes(row.setId));
          const expectedOfficial = mismatchRows.reduce(
            (sum, row) => sum + Number(row.officialComparableCount || 0),
            0,
          );
          const expectedBase = mismatchRows.reduce(
            (sum, row) => sum + Number(row.registryCardCount || 0),
            0,
          );
          const expectedAdded = expectedOfficial - expectedBase;
          const builtSets = build.rows
            .filter((row) => row.status === 'built')
            .map((row) => row.setId)
            .sort();
          if (
            build.attemptedSets !== mismatchSets.length ||
            build.failedSets !== 0 ||
            JSON.stringify(builtSets) !== JSON.stringify(mismatchSets)
          ) {
            throw new Error(`Unexpected build result: ${JSON.stringify(build)}`);
          }
          if (
            build.totals.baseCards !== expectedBase ||
            build.totals.officialCards !== expectedOfficial ||
            build.totals.addedCards !== expectedAdded ||
            build.totals.fetchedDetails !== expectedOfficial
          ) {
            throw new Error(`Unexpected build totals: ${JSON.stringify(build.totals)}`);
          }
          if (validation.attemptedFiles !== mismatchSets.length || validation.failedFiles !== 0) {
            throw new Error(`Unexpected validation result: ${JSON.stringify(validation)}`);
          }
          if (
            validation.totals.sets !== mismatchSets.length ||
            validation.totals.cards !== expectedOfficial ||
            validation.totals.parallels !== 0 ||
            validation.totals.identities !== expectedOfficial ||
            validation.totals.addedOfficialCards !== expectedAdded
          ) {
            throw new Error(`Unexpected validation totals: ${JSON.stringify(validation.totals)}`);
          }
          console.log(JSON.stringify({
            mode: 'append_only_reconciliation',
            builtSets,
            buildTotals: build.totals,
            validationTotals: validation.totals,
            adapterIds: [...new Set(validation.rows.map((row) => row.adapterId))],
          }, null, 2));
          NODE
