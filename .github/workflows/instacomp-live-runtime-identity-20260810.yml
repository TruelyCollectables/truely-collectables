name: InstaComp Live Runtime Identity 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-live-runtime-identity-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare physical Mac identity with current source fingerprint
        shell: bash
        run: |
          set -euo pipefail
          dir=evidence/instacomp-live-runtime-identity-20260810
          mkdir -p "$dir"
          out="$dir/runtime-identity.json"
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' https://instacomp.truelycollectables.com/v1/runtime-identity)"
          test "$code" = "200"
          python3 - "$out" "$dir/fingerprint-comparison.json" <<'PY'
          import hashlib,json,pathlib,sys
          live=json.load(open(sys.argv[1],encoding='utf-8'))
          root=pathlib.Path('services/instacomp-ai')
          files=(
              'app/__init__.py','app/main.py','app/local_vision.py','app/ollama.py',
              'app/lora_candidate_runtime.py','scripts/run_lora_candidate_server.py',
          )
          digest=hashlib.sha256()
          for relative in files:
              digest.update(relative.encode())
              digest.update(b'\0')
              digest.update((root/relative).read_bytes())
              digest.update(b'\0')
          expected=digest.hexdigest()
          actual=str(live.get('runtime_source_fingerprint') or '')
          result={
              'expected_current_source_fingerprint':expected,
              'live_physical_mac_fingerprint':actual,
              'exact_match':actual==expected,
              'tracked_files':list(files),
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instacomp-live-runtime-identity-20260810
          path: evidence/instacomp-live-runtime-identity-20260810
          retention-days: 30
