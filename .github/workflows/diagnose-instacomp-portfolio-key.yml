name: Diagnose Portfolio InstaComp Credential

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-instacomp-portfolio-key.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted production vault
        uses: actions/download-artifact@v4
        with:
          name: truely-production-secrets-vault-31773508121
          path: /tmp/diag-vault
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31773508121

      - name: Download recovery key
        uses: actions/download-artifact@v4
        with:
          name: truely-production-secrets-recovery-key-31773508121
          path: /tmp/diag-key
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31773508121

      - name: Probe protected production evaluator without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createDecipheriv, createHash } = require('node:crypto');
          const filesBelow = (root) => fs.readdirSync(root, { recursive: true, withFileTypes: true }).filter((e) => e.isFile()).map((e) => path.join(e.parentPath || e.path, e.name));
          const vaultPath = filesBelow('/tmp/diag-vault').find((f) => f.endsWith('.tcosvault'));
          const keyPath = filesBelow('/tmp/diag-key').find((f) => f.endsWith('.recovery-key.txt'));
          if (!vaultPath || !keyPath) throw new Error('Recovery artifacts incomplete.');
          const envelope = JSON.parse(fs.readFileSync(vaultPath, 'utf8'));
          const keyText = fs.readFileSync(keyPath, 'utf8');
          const match = keyText.match(/(?:^|\n)key: ([A-Za-z0-9_-]+)(?:\n|$)/);
          if (!match) throw new Error('Recovery key invalid.');
          const decipher = createDecipheriv('aes-256-gcm', Buffer.from(match[1], 'base64url'), Buffer.from(envelope.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(envelope.authenticationTag, 'base64'));
          const plaintext = Buffer.concat([decipher.update(Buffer.from(envelope.ciphertext, 'base64')), decipher.final()]);
          if (createHash('sha256').update(plaintext).digest('hex') !== envelope.plaintextSha256) throw new Error('Vault checksum failed.');
          const payload = JSON.parse(plaintext.toString('utf8'));
          const all = { ...(payload?.sources?.vercelProductionApplicationVariables || {}), ...(payload?.sources?.githubActionsReferencedSecrets || {}) };
          const credential = String(all.INSTACOMP_AI_LOCAL_KEY || '').trim();
          if (!credential) throw new Error('INSTACOMP_AI_LOCAL_KEY is absent from recovery vault.');
          const form = new FormData();
          const response = await fetch('https://truelycollectables.com/api/instacomp/deal-hunter/evaluate', {
            method: 'POST',
            headers: { 'x-instacomp-ai-key': credential, Accept: 'application/json' },
            body: form,
            redirect: 'manual',
            signal: AbortSignal.timeout(30_000),
          });
          const body = await response.json().catch(() => ({}));
          console.log(`INSTACOMP CREDENTIAL PROBE status=${response.status} error=${String(body?.error || '').slice(0, 300)}`);
          if (response.status === 401) throw new Error('Recovered InstaComp credential does not match the routed production Worker secret.');
          if (response.status !== 400) throw new Error(`Unexpected evaluator probe status ${response.status}.`);
          if (!/listingJson|required|frontImage|backImage|images/i.test(String(body?.error || ''))) throw new Error('Credential passed auth but evaluator did not return the expected missing-input validation.');
          console.log('INSTACOMP CREDENTIAL MATCH: recovered key passed routed production authentication.');
          NODE

      - name: Shred recovered material
        if: always()
        run: |
          find /tmp/diag-vault /tmp/diag-key -type f -exec shred -u {} + 2>/dev/null || true
