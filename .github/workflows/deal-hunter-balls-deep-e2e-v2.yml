name: BALLS DEEP Deal Hunter Production E2E v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deal-hunter-balls-deep-e2e-v2.yml"
      - ".github/workflows/deal-hunter-cloudflare-production-release.yml"
      - "scripts/balls-deep-deal-hunter-e2e.mjs"
      - "scripts/run-wrangler-deploy-redacted.mjs"
      - "src/app/api/tcos/deal-hunter-native-ebay/**"
      - "src/app/api/tcos/deal-hunter-michkov-opc-platinum/**"
      - "src/app/api/tcos/deal-hunter-balls-deep-delivery/**"
      - "src/lib/deal-hunter-balls-deep-email.ts"
      - "src/lib/market-intel-delivery.ts"
      - "cloudflare-native-fetch.ts"
      - "cloudflare-worker.ts"
      - "wrangler.jsonc"
      - "wrangler.production-route.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balls-deep-deal-hunter-production-e2e-v2
  cancel-in-progress: false

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run every live Deal Hunter scope and require production Worker email proof
        env:
          TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
        run: node scripts/balls-deep-deal-hunter-e2e.mjs

      - name: Remove BALLS DEEP result material
        if: always()
        shell: bash
        run: shred -u /tmp/balls-deep-result.json 2>/dev/null || true
