name: Deploy Pokémon Checklist Registry 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pokemon-checklist-registry-20260802.yml"
      - "scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-pokemon-checklist-registry-20260802
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 4ac3ba0c2ca64dca1988a6d834b855126838be31
  EXPECTED_BRANCH: ops/deploy-pokemon-checklist-registry-20260802
  TCGDEX_SOURCE_COMMIT: 138c145b80f1a0d6a533f98fd3afe1ffc5b4f8d6
  HISTORICAL_ARTIFACT_ID: "8841223344"
  HISTORICAL_ARTIFACT_SHA256: 83cf5d76cc2b26fcc5387ab2e96ea130ba1599f3dbc4b57906636f9a0321f6b6
  VARIANT_ARTIFACT_ID: "8841169405"
  VARIANT_ARTIFACT_SHA256: 49e564ede63d399f125b9171584e620322a325bf5e17c9371a25d1ba68ceeb44
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/pokemon-checklist-registry-20260802

jobs:
  migrate-audit-import-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/deploy-pokemon-checklist-registry-20260802.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD

          mkdir -p "$RUNNER_TEMP/pokemon-registry-ops"
          cp scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs \
            "$RUNNER_TEMP/pokemon-registry-ops/"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/pokemon-registry-ops/deploy-pokemon-checklist-registry-20260802.mjs" \
            scripts/ops/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and verify operations script
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs

      - name: Resolve Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/pokemon-registry-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/pokemon-registry-production/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          echo "PRODUCTION_ENV_PATH=$RUNNER_TEMP/pokemon-registry-production/production.env" >> "$GITHUB_ENV"

      - name: Download pinned validated 17-set and 2-set artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/pokemon-artifacts/historical" \
            "$RUNNER_TEMP/pokemon-artifacts/variant" \
            .codex-run/production-bundles/historical \
            .codex-run/production-bundles/variant

          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/pokemon-artifacts/historical.zip"
          echo "$HISTORICAL_ARTIFACT_SHA256  $RUNNER_TEMP/pokemon-artifacts/historical.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokemon-artifacts/historical.zip" \
            -d "$RUNNER_TEMP/pokemon-artifacts/historical"

          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VARIANT_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/pokemon-artifacts/variant.zip"
          echo "$VARIANT_ARTIFACT_SHA256  $RUNNER_TEMP/pokemon-artifacts/variant.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokemon-artifacts/variant.zip" \
            -d "$RUNNER_TEMP/pokemon-artifacts/variant"

          find "$RUNNER_TEMP/pokemon-artifacts/historical" \
            -type f -path '*/pokemon-ja-historical-safe-bundles/*.bundle.json' \
            -exec cp {} .codex-run/production-bundles/historical/ \;
          find "$RUNNER_TEMP/pokemon-artifacts/variant/pokemon-ja-variant-reconciled-bundles" \
            -maxdepth 1 -type f -name '*.bundle.json' \
            -exec cp {} .codex-run/production-bundles/variant/ \;

          test "$(find .codex-run/production-bundles/historical -type f -name '*.bundle.json' | wc -l | tr -d ' ')" = "17"
          test "$(find .codex-run/production-bundles/variant -type f -name '*.bundle.json' | wc -l | tr -d ' ')" = "2"

      - name: Build the pinned three repaired Japanese bundles
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tcgdex/cards-database.git \
            .codex-run/tcgdex-cards-database
          git -C .codex-run/tcgdex-cards-database checkout --detach "$TCGDEX_SOURCE_COMMIT"
          test "$(git -C .codex-run/tcgdex-cards-database rev-parse HEAD)" = "$TCGDEX_SOURCE_COMMIT"

          node --import tsx scripts/build-tcgdex-japanese-registry-bundles.ts \
            .codex-run/tcgdex-cards-database \
            .codex-run/tcgdex-ja-registry-bundles \
            --receipt .codex-run/tcgdex-ja-build-receipt.json \
            > .codex-run/tcgdex-ja-build-output.json

          node --import tsx scripts/inventory-pokemon-japanese-incomplete-sets.ts \
            .codex-run/tcgdex-cards-database \
            --build-receipt .codex-run/tcgdex-ja-build-receipt.json \
            --delay-ms 35 \
            --continue-on-error \
            --receipt .codex-run/pokemon-ja-incomplete-inventory-receipt.json \
            --queue .codex-run/pokemon-ja-incomplete-inventory-queue.json \
            > .codex-run/pokemon-ja-incomplete-inventory-output.json

          node --import tsx scripts/build-pokemon-japanese-incomplete-reconciled-bundles.ts \
            .codex-run/tcgdex-cards-database \
            .codex-run/production-bundles/incomplete \
            --build-receipt .codex-run/tcgdex-ja-build-receipt.json \
            --inventory-receipt .codex-run/pokemon-ja-incomplete-inventory-receipt.json \
            --continue-on-error \
            --receipt .codex-run/pokemon-ja-incomplete-reconciled-build-receipt.json \
            > .codex-run/pokemon-ja-incomplete-reconciled-build-output.json

          node - <<'NODE'
          const receipt = require('./.codex-run/pokemon-ja-incomplete-reconciled-build-receipt.json');
          const ok = receipt.attemptedSets === 3 && receipt.successfulSets === 3 &&
            receipt.failedSets === 0 && receipt.totals?.sourceCards === 291 &&
            receipt.totals?.officialCards === 327;
          console.log(JSON.stringify(receipt.totals, null, 2));
          if (!ok) process.exit(1);
          NODE

      - name: Revalidate all 22 bundles without Production writes
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/import-pokemon-japanese-incomplete-reconciled-bundles.ts \
            .codex-run/production-bundles/incomplete \
            --continue-on-error \
            --receipt .codex-run/validate-incomplete.json >/dev/null
          node --import tsx scripts/import-pokemon-japanese-historical-safe-bundles.ts \
            .codex-run/production-bundles/historical \
            --continue-on-error \
            --receipt .codex-run/validate-historical.json >/dev/null
          node --import tsx scripts/import-pokemon-japanese-variant-reconciled-bundles.ts \
            .codex-run/production-bundles/variant \
            --continue-on-error \
            --receipt .codex-run/validate-variant.json >/dev/null

          node - <<'NODE'
          const incomplete = require('./.codex-run/validate-incomplete.json');
          const historical = require('./.codex-run/validate-historical.json');
          const variant = require('./.codex-run/validate-variant.json');
          const checks = [
            incomplete.attemptedFiles === 3,
            incomplete.successfulFiles === 3,
            incomplete.failedFiles === 0,
            incomplete.totals?.cards === 327,
            incomplete.totals?.identities === 327,
            historical.attemptedFiles === 17,
            historical.successfulFiles === 17,
            historical.failedFiles === 0,
            historical.totals?.cards === 1926,
            historical.totals?.identities === 1926,
            variant.attemptedFiles === 2,
            variant.successfulFiles === 2,
            variant.failedFiles === 0,
            variant.totals?.cards === 193,
            variant.totals?.identities === 288,
          ];
          console.log(JSON.stringify({
            incomplete: incomplete.totals,
            historical: historical.totals,
            variant: variant.totals,
          }, null, 2));
          if (checks.some((value) => value !== true)) process.exit(1);
          NODE

      - name: Apply only the six approved Registry migrations and audit Production
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs migrate-audit

      - name: Load masked service-role import environment
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          for (const key of ['NEXT_PUBLIC_SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY']) {
            const value = String(parsed[key] || '');
            if (!value) throw new Error(`Missing ${key} in Production environment`);
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}<<${key}_EOF\n${value}\n${key}_EOF\n`);
          }
          NODE

      - name: Import S8a canary
        shell: bash
        run: |
          set -euo pipefail
          canary_file="$(find .codex-run/production-bundles/historical -maxdepth 1 -type f -name '*-S8a.*.bundle.json' -print -quit)"
          test -n "$canary_file"
          node --import tsx scripts/import-pokemon-japanese-historical-safe-bundles.ts \
            "$canary_file" --apply \
            --receipt "$EVIDENCE_DIR/import-canary-s8a.json" >/dev/null
          node - <<'NODE'
          const r = require('./evidence/pokemon-checklist-registry-20260802/import-canary-s8a.json');
          if (r.attemptedFiles !== 1 || r.successfulFiles !== 1 || r.failedFiles !== 0 ||
              r.totals?.cards !== 33 || r.totals?.identities !== 34) process.exit(1);
          NODE

      - name: Verify S8a canary in Production
        shell: bash
        env:
          BASELINE_PATH: evidence/pokemon-checklist-registry-20260802/production-baseline.json
          EXPECTED_RELEASE_DELTA: "1"
          EXPECTED_CARD_DELTA: "33"
          EXPECTED_IDENTITY_DELTA: "34"
          EXPECTED_INCOMPLETE_ADAPTER_COUNT: "0"
          EXPECTED_HISTORICAL_ADAPTER_COUNT: "1"
          EXPECTED_VARIANT_ADAPTER_COUNT: "0"
          VERIFICATION_LABEL: canary-s8a
        run: node scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs verify-delta

      - name: Import the remaining 16 historical Japanese sets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex-run/production-bundles/historical-remaining
          find .codex-run/production-bundles/historical -maxdepth 1 -type f -name '*.bundle.json' \
            ! -name '*-S8a.*.bundle.json' \
            -exec cp {} .codex-run/production-bundles/historical-remaining/ \;
          test "$(find .codex-run/production-bundles/historical-remaining -type f -name '*.bundle.json' | wc -l | tr -d ' ')" = "16"
          node --import tsx scripts/import-pokemon-japanese-historical-safe-bundles.ts \
            .codex-run/production-bundles/historical-remaining \
            --apply --continue-on-error \
            --receipt "$EVIDENCE_DIR/import-historical-remaining.json" >/dev/null
          node - <<'NODE'
          const r = require('./evidence/pokemon-checklist-registry-20260802/import-historical-remaining.json');
          if (r.attemptedFiles !== 16 || r.successfulFiles !== 16 || r.failedFiles !== 0 ||
              r.totals?.cards !== 1893 || r.totals?.identities !== 1892) process.exit(1);
          NODE

      - name: Verify all 17 historical sets in Production
        shell: bash
        env:
          BASELINE_PATH: evidence/pokemon-checklist-registry-20260802/production-baseline.json
          EXPECTED_RELEASE_DELTA: "17"
          EXPECTED_CARD_DELTA: "1926"
          EXPECTED_IDENTITY_DELTA: "1926"
          EXPECTED_INCOMPLETE_ADAPTER_COUNT: "0"
          EXPECTED_HISTORICAL_ADAPTER_COUNT: "17"
          EXPECTED_VARIANT_ADAPTER_COUNT: "0"
          VERIFICATION_LABEL: historical-17
        run: node scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs verify-delta

      - name: Import the three repaired Japanese sets
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/import-pokemon-japanese-incomplete-reconciled-bundles.ts \
            .codex-run/production-bundles/incomplete \
            --apply --continue-on-error \
            --receipt "$EVIDENCE_DIR/import-incomplete-three.json" >/dev/null
          node - <<'NODE'
          const r = require('./evidence/pokemon-checklist-registry-20260802/import-incomplete-three.json');
          if (r.attemptedFiles !== 3 || r.successfulFiles !== 3 || r.failedFiles !== 0 ||
              r.totals?.cards !== 327 || r.totals?.identities !== 327) process.exit(1);
          NODE

      - name: Verify 20 imported Japanese sets in Production
        shell: bash
        env:
          BASELINE_PATH: evidence/pokemon-checklist-registry-20260802/production-baseline.json
          EXPECTED_RELEASE_DELTA: "20"
          EXPECTED_CARD_DELTA: "2253"
          EXPECTED_IDENTITY_DELTA: "2253"
          EXPECTED_INCOMPLETE_ADAPTER_COUNT: "3"
          EXPECTED_HISTORICAL_ADAPTER_COUNT: "17"
          EXPECTED_VARIANT_ADAPTER_COUNT: "0"
          VERIFICATION_LABEL: repaired-and-historical-20
        run: node scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs verify-delta

      - name: Import final S10a and S11a variant-reconciled sets
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/import-pokemon-japanese-variant-reconciled-bundles.ts \
            .codex-run/production-bundles/variant \
            --apply --continue-on-error \
            --receipt "$EVIDENCE_DIR/import-final-two.json" >/dev/null
          node - <<'NODE'
          const r = require('./evidence/pokemon-checklist-registry-20260802/import-final-two.json');
          if (r.attemptedFiles !== 2 || r.successfulFiles !== 2 || r.failedFiles !== 0 ||
              r.totals?.cards !== 193 || r.totals?.identities !== 288) process.exit(1);
          NODE

      - name: Verify all 294 English and Japanese releases in Production
        shell: bash
        env:
          BASELINE_PATH: evidence/pokemon-checklist-registry-20260802/production-baseline.json
          EXPECTED_RELEASE_DELTA: "22"
          EXPECTED_CARD_DELTA: "2446"
          EXPECTED_IDENTITY_DELTA: "2541"
          EXPECTED_INCOMPLETE_ADAPTER_COUNT: "3"
          EXPECTED_HISTORICAL_ADAPTER_COUNT: "17"
          EXPECTED_VARIANT_ADAPTER_COUNT: "2"
          VERIFICATION_LABEL: final-294-releases
        run: node scripts/ops/deploy-pokemon-checklist-registry-20260802.mjs verify-delta

      - name: Write sanitized Production summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const final = require('./evidence/pokemon-checklist-registry-20260802/production-final-294-releases.json');
          const baseline = require('./evidence/pokemon-checklist-registry-20260802/production-baseline.json');
          const text = [
            '# Pokémon Checklist Registry Production deployment',
            '',
            `- Source SHA: \`${final.sourceSha}\``,
            '- Approved migrations applied and recorded: 6/6',
            `- Releases before: ${baseline.state.releases}`,
            `- Releases after: ${final.state.releases}`,
            '- New Japanese releases: 22',
            '- Total English + Japanese releases: 294',
            '- New active cards: 2,446',
            '- New active physical-printing identities: 2,541',
            '- Active versions with identity deficits: 0',
            '- Public Registry grants: 0',
            '',
          ].join('\n');
          fs.writeFileSync('./evidence/pokemon-checklist-registry-20260802/production-summary.md', text);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          NODE

      - name: Remove Production environment file
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/pokemon-registry-production/production.env"

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-checklist-registry-production-20260802
          path: evidence/pokemon-checklist-registry-20260802
          if-no-files-found: error
          retention-days: 90
