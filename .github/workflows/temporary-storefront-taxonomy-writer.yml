name: Temporary Storefront Taxonomy Writer

on:
  push:
    branches:
      - agent/storefront-taxonomy-ebay-sync-20260727
    paths:
      - "scripts/apply-storefront-taxonomy-fix.py"
      - ".github/workflows/temporary-storefront-taxonomy-writer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-storefront-taxonomy-fix.py"
      - ".github/workflows/temporary-storefront-taxonomy-writer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storefront-taxonomy-writer-visible
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-taxonomy-ebay-sync-20260727
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply taxonomy patch
        run: python scripts/apply-storefront-taxonomy-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run taxonomy regressions
        run: node --import tsx scripts/run-storefront-taxonomy-regressions.ts
      - name: Lint changed paths
        run: >-
          npx eslint
          src/lib/storefront-taxonomy.ts
          src/lib/ebay-category-mapper.ts
          src/lib/ebay-sync.ts
          src/modules/inventory/types.ts
          src/modules/inventory/repository.ts
          src/modules/inventory/engine.ts
          src/app/shop/page.tsx
          src/app/page.tsx
          src/app/components/Navbar.tsx
          scripts/run-storefront-taxonomy-regressions.ts
      - name: Build production application
        run: npm run build
      - name: Commit verified patch and remove one-time writer
        run: |
          rm scripts/apply-storefront-taxonomy-fix.py
          rm .github/workflows/temporary-storefront-taxonomy-writer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize eBay storefront sections and feature filters"
          git push origin HEAD:agent/storefront-taxonomy-ebay-sync-20260727
