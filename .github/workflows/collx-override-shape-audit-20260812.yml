name: CollX Override Shape Audit 20260812

on:
  push:
    branches: [fix/collx-back-images-20260812]
    paths:
      - ".github/workflows/collx-override-shape-audit-20260812.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Production Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/allisha-management"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/allisha-management/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir=path.join(process.env.RUNNER_TEMP,'allisha-management');
          const raw=fs.readFileSync(path.join(dir,'production.env'),'utf8');
          const env={};
          for (const line0 of raw.split(/\r?\n/)) {
            const line=line0.trim(); if(!line || line.startsWith('#')) continue;
            const i=line.indexOf('='); if(i<1) continue;
            let v=line.slice(i+1).trim();
            if(v.startsWith('"')&&v.endsWith('"')) { try{v=JSON.parse(v)}catch{v=v.slice(1,-1)} }
            else if(v.startsWith("'")&&v.endsWith("'")) v=v.slice(1,-1);
            env[line.slice(0,i).trim()]=v;
          }
          const url=env.NEXT_PUBLIC_SUPABASE_URL;
          if(!url) throw new Error('NEXT_PUBLIC_SUPABASE_URL missing');
          const ref=new URL(url).hostname.split('.')[0];
          const response=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`}});
          const body=await response.text();
          if(!response.ok) throw new Error(`Supabase key HTTP ${response.status}: ${body.slice(0,500)}`);
          const keys=JSON.parse(body);
          const row=keys.find((x)=>typeof x?.api_key==='string'&&x.api_key.startsWith('sb_secret_'))
            || keys.find((x)=>String(x?.name||'').toLowerCase()==='service_role')
            || keys.find((x)=>String(x?.name||'').toLowerCase().includes('service'));
          if(!row?.api_key) throw new Error('No service-role key returned');
          console.log('::add-mask::'+row.api_key);
          fs.writeFileSync(path.join(dir,'service-role-key'),row.api_key,{mode:0o600});
          fs.writeFileSync(path.join(dir,'supabase-url'),url,{mode:0o600});
          fs.writeFileSync(path.join(dir,'project-ref'),ref,{mode:0o600});
          console.log('ALLISHA_MANAGEMENT_CREDENTIALS=VERIFIED');
          NODE

      - name: Exact Production repair and live verification
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/allisha-management/service-role-key")"
          supabase_url="$(cat "$RUNNER_TEMP/allisha-management/supabase-url")"
          project_ref="$(cat "$RUNNER_TEMP/allisha-management/project-ref")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
          NEXT_PUBLIC_SUPABASE_URL="$supabase_url" \
          SUPABASE_PROJECT_REF="$project_ref" \
          OUTPUT_DIR="$RUNNER_TEMP/allisha-management" \
            node scripts/allisha-management-back-repair-20260812.mjs

      - name: Mark corrected schema verifier
        run: echo "ALLISHA_EXACT_SCHEMA_VERIFIER=20260812-v2"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allisha-management-back-verify-20260812
          path: ${{ runner.temp }}/allisha-management/*.json
          if-no-files-found: warn
          retention-days: 7
