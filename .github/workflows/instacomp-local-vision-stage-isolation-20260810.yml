name: InstaComp Local Vision Stage Isolation 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/instacomp-local-vision-stage-isolation-20260810.yml'
      - 'scripts/ops/patch-instacomp-local-vision-stage-isolation.py'
      - 'services/instacomp-ai/app/local_vision.py'
      - 'services/instacomp-ai/tests/test_local_vision_stage_isolation.py'

permissions:
  contents: write

jobs:
  repair-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-local-vision-stage-isolation-20260810
          fetch-depth: 0

      - name: Lock repair scope to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git merge-base HEAD origin/main)" = "8a38268e53c69e14f74ec9c20ef49826dc62e661"
          changed="$(git diff --name-only 8a38268e53c69e14f74ec9c20ef49826dc62e661...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/instacomp-local-vision-stage-isolation-20260810.yml' 'scripts/ops/patch-instacomp-local-vision-stage-isolation.py' | sort)"
          test "$changed" = "$expected"

      - name: Apply bounded witness-stage repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/patch-instacomp-local-vision-stage-isolation.py
          python -m py_compile services/instacomp-ai/app/local_vision.py services/instacomp-ai/tests/test_local_vision_stage_isolation.py

      - name: Run focused local vision regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r services/instacomp-ai/requirements.txt
          PYTHONPATH=services/instacomp-ai python -m pytest -q \
            services/instacomp-ai/tests/test_local_vision_stage_isolation.py \
            services/instacomp-ai/tests/test_local_vision_failover.py \
            services/instacomp-ai/tests/test_apple_vision_fail_closed.py

      - name: Run complete Mac service-compatible suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/instacomp-ai python -m pytest -q services/instacomp-ai/tests

      - name: Prove authority boundaries unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 8a38268e53c69e14f74ec9c20ef49826dc62e661 -- \
            src/app/api/instacomp/scan/route.ts \
            src/lib/instacomp-ai-local.ts \
            services/instacomp-ai/app/checklist.py \
            services/instacomp-ai/app/lora_candidate_runtime.py
          grep -Fq 'opencv_decode_failed' services/instacomp-ai/app/local_vision.py
          grep -Fq 'apple_vision_stage_failed' services/instacomp-ai/app/local_vision.py
          grep -Fq 'identity_hint_failed' services/instacomp-ai/app/local_vision.py

      - name: Commit only permanent repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/instacomp-local-vision-stage-isolation-20260810.yml scripts/ops/patch-instacomp-local-vision-stage-isolation.py
          git add services/instacomp-ai/app/local_vision.py services/instacomp-ai/tests/test_local_vision_stage_isolation.py
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/instacomp-local-vision-stage-isolation-20260810.yml' 'scripts/ops/patch-instacomp-local-vision-stage-isolation.py' 'services/instacomp-ai/app/local_vision.py' 'services/instacomp-ai/tests/test_local_vision_stage_isolation.py' | sort)"
          test "$changed" = "$expected"
          git commit -m 'Isolate local vision witness stage failures'
          git push origin HEAD:fix/instacomp-local-vision-stage-isolation-20260810
