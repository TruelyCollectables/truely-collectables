name: Run Storefront Taxonomy V9 Oakley Fix 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-taxonomy-v9-oakley-fix-20260729.yml"

permissions:
  contents: write

concurrency:
  group: run-taxonomy-v9-oakley-fix-20260729
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/storefront-taxonomy-v9-oakley-accessory-override-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-taxonomy-v9-oakley-accessory-override-20260729
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply taxonomy v9 Oakley production correction
        run: python scripts/one-time-taxonomy-v9-oakley-patch.py

      - name: Remove one-time runner
        run: rm -f .github/workflows/run-taxonomy-v9-oakley-fix-20260729.yml

      - name: Format and validate taxonomy v9
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write src/lib/storefront-taxonomy.ts src/lib/ebay-category-mapper.ts src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
          npx eslint src/lib/storefront-taxonomy.ts src/lib/ebay-category-mapper.ts src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts
          npm run build

      - name: Commit validated taxonomy v9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Classify Oakley accessories before card keywords"
          git push origin HEAD:agent/storefront-taxonomy-v9-oakley-accessory-override-20260729
