name: Ops CollX Image Import Batch 2 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-image-import-batch2-20260810.yml"
      - ".github/ops/collx-batch2-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-collx-image-import-batch2-20260810
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/collx-batch2-import"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-batch2-import/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Syntax check importer
        run: node --check .github/ops/collx-batch2-import.mjs

      - name: Verify and import batch 2 images
        run: node .github/ops/collx-batch2-import.mjs

      - name: Upload import receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-image-import-batch2-receipt
          path: ${{ runner.temp }}/collx-batch2-import/receipt.json
          retention-days: 7
          if-no-files-found: warn
