name: Import Checklist Canary Prizm WNBA 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-checklist-canary-prizm-wnba-20260803.yml"
      - "scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs"

permissions:
  actions: read
  contents: read

concurrency:
  group: pokemon-checklist-registry-production
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: d0784767fd664bf0960bf28e71afd7ca15533182
  EXPECTED_BRANCH: ops/import-checklist-canary-prizm-wnba-20260803
  VALIDATION_ARTIFACT_ID: "8845633740"
  VALIDATION_ARTIFACT_SHA256: 780963f8bdbdbb2ab5cedb3ac0c727f6f14155c8e7fee94c0e92c9e937fb9239
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/checklist-canary-prizm-wnba-20260803

jobs:
  audit-import-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact canary scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "origin/$EXPECTED_BRANCH"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/import-checklist-canary-prizm-wnba-20260803.yml'
          test "${changed[1]}" = 'scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs'
          git diff --check "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH"
          cp scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs \
            "$RUNNER_TEMP/import-checklist-canary-prizm-wnba-20260803.mjs"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/import-checklist-canary-prizm-wnba-20260803.mjs" \
            scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs
          printf '{"schema":"tcos.checklist.canaryRunContext.v1","runId":"%s","releaseSlug":"2024-panini-prizm-wnba","productionWritesAuthorized":true}\n' \
            "$GITHUB_RUN_ID" > "$EVIDENCE_DIR/run-context.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and resolve masked Production credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false pg@8.16.3
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"

          mkdir -p .vercel "$RUNNER_TEMP/checklist-canary-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi

          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/checklist-canary-production/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

          PRODUCTION_ENV_PATH="$RUNNER_TEMP/checklist-canary-production/production.env" node - <<'NODE'
          const fs = require('node:fs');
          function parseEnv(filePath) {
            const parsed = {};
            for (const raw of fs.readFileSync(filePath, 'utf8').split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const index = line.indexOf('=');
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }
          (async () => {
            const parsed = parseEnv(process.env.PRODUCTION_ENV_PATH);
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
            if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            if (!projectRef) throw new Error('Could not resolve Production project ref');
            let serviceKey = String(
              parsed.SUPABASE_SERVICE_ROLE_KEY ||
              parsed.SUPABASE_SECRET_KEY ||
              Object.entries(parsed).find(([key, value]) => /^SUPABASE_SECRET_.*_KEY$/.test(key) && value)?.[1] ||
              ''
            );
            if (!serviceKey) {
              const response = await fetch(
                `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
                { headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` } },
              );
              const text = await response.text();
              if (!response.ok) throw new Error(`Supabase API-key lookup failed with HTTP ${response.status}: ${text.slice(0, 500)}`);
              const keys = text ? JSON.parse(text) : [];
              if (!Array.isArray(keys)) throw new Error('Supabase API-key lookup returned an unexpected payload');
              const legacy = keys.find((key) => key?.name === 'service_role' && key?.api_key);
              const roleSecret = keys.find((key) => key?.secret_jwt_template?.role === 'service_role' && key?.api_key);
              const secret = keys.find((key) => key?.type === 'secret' && key?.api_key);
              serviceKey = String(legacy?.api_key || roleSecret?.api_key || secret?.api_key || '');
            }
            if (!serviceKey) throw new Error('No elevated Supabase API key could be resolved');
            for (const value of [productionUrl, serviceKey]) console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_ROLE_KEY<<SUPABASE_KEY_EOF\n${serviceKey}\nSUPABASE_KEY_EOF\n`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Download and verify pinned validation artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checklist-canary-artifact"
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/checklist-canary-artifact.zip"
          echo "$VALIDATION_ARTIFACT_SHA256  $RUNNER_TEMP/checklist-canary-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/checklist-canary-artifact.zip" \
            -d "$RUNNER_TEMP/checklist-canary-artifact"

      - name: Require exact passing canary files without writes
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/checklist-canary-artifact" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.ARTIFACT_ROOT;
          const receipt = JSON.parse(fs.readFileSync(path.join(root, 'validation.json'), 'utf8'));
          const id = '2024-panini-prizm-wnba';
          const result = receipt.results?.find((entry) => entry.id === id);
          if (receipt.schema !== 'tcos.checklist.sixReleaseValidation.v1' || receipt.status !== 'passed') throw new Error('Pinned validation receipt did not pass');
          if (!result || result.validationStatus !== 'passed') throw new Error('Pinned canary validation did not pass');
          const expected = { rows:6702, sets:12, cards:337, parallels:121, identities:6702 };
          for (const [key, value] of Object.entries(expected)) if (Number(result.counts?.[key]) !== value) throw new Error(`Pinned canary ${key} is wrong`);
          const directory = path.join(root, 'private', id);
          if (!fs.existsSync(path.join(directory, `${id}.plan.json`)) || !fs.existsSync(path.join(directory, `${id}.xlsx`))) throw new Error('Pinned canary files are missing');
          if (receipt.safety?.productionDatabaseWrites !== false || receipt.safety?.rowSourcesNeverRepresentedAsOfficialManufacturer !== true) throw new Error('Pinned validation safety receipt is wrong');
          console.log(JSON.stringify({ status: result.validationStatus, id, counts: result.counts }, null, 2));
          NODE
          node --check scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs

      - name: Import and audit 2024 Prizm WNBA canary
        shell: bash
        env:
          ALLOW_PRODUCTION_CHECKLIST_CANARY_IMPORT: "YES"
          ARTIFACT_ROOT: ${{ runner.temp }}/checklist-canary-artifact
        run: |
          set -euo pipefail
          node scripts/ops/import-checklist-canary-prizm-wnba-20260803.mjs \
            --apply \
            --artifact-root "$ARTIFACT_ROOT" \
            --receipt "$EVIDENCE_DIR/production-import.json" \
            --failure-receipt "$EVIDENCE_DIR/failure.json"

      - name: Require sanitized passing canary receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/checklist-canary-prizm-wnba-20260803/production-import.json', 'utf8'));
          if (receipt.schema !== 'tcos.checklist.prizmWnbaCanaryProductionImport.v1' || receipt.status !== 'passed') throw new Error('Canary receipt did not pass');
          if (receipt.releaseSlug !== '2024-panini-prizm-wnba') throw new Error('Wrong canary release');
          const expectedCounts = { sets:12, cards:337, parallels:121, identities:6702 };
          for (const [key, value] of Object.entries(expectedCounts)) if (Number(receipt.counts?.[key]) !== value) throw new Error(`Unexpected ${key}`);
          const final = receipt.finalAudit || {};
          const expectedFinal = { releases:298, active_versions:298, active_cards:36324, active_identities:50918, identity_deficit_versions:0, failed_import_runs:0, registry_public_grants:0, temporary_login_roles:0 };
          for (const [key, value] of Object.entries(expectedFinal)) if (Number(final[key]) !== value) throw new Error(`Unexpected final ${key}: ${final[key]}`);
          if (final.targets?.length !== 1 || final.private_source_bucket !== true || final.writer_rpc !== true) throw new Error('Final canary audit is incomplete');
          const connection = receipt.postgresConnection || {};
          if (connection.source !== 'shared-pooler' || connection.poolMode !== 'transaction' || connection.userClass !== 'project-qualified-temporary-login' || connection.writerRole !== 'service_role') throw new Error('Canary used an unverified transport');
          const safety = receipt.safety || {};
          if (safety.exactVerifiedTransportOnly !== true || safety.noCandidateLoop !== true || safety.noSleepPreflight !== true || safety.canaryAuditedBeforeAnyFurtherRelease !== true || safety.temporaryLoginRoleDeleted !== true || safety.migrationsApplied !== false || safety.deploymentPerformed !== false) throw new Error('Canary safety receipt is incomplete');
          console.log(JSON.stringify({ status: receipt.status, releaseSlug: receipt.releaseSlug, counts: receipt.counts, final }, null, 2));
          NODE

      - name: Capture read-only state after failure
        if: failure()
        shell: bash
        run: |
          set +e
          node - <<'NODE'
          const fs = require('node:fs');
          const productionUrl = String(process.env.NEXT_PUBLIC_SUPABASE_URL || '');
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const output = `${process.env.EVIDENCE_DIR}/workflow-failure-audit.json`;
          (async () => {
            if (!productionUrl || !accessToken) return;
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            const query = `with active_versions as (select * from public.checklist_versions where is_active) select json_build_object('releases',(select count(*) from public.checklist_releases),'active_versions',(select count(*) from active_versions),'active_cards',(select count(*) from public.checklist_cards c join active_versions v on v.id=c.version_id),'active_identities',(select count(*) from public.checklist_card_identities i join active_versions v on v.id=i.version_id),'temporary_login_roles',(select count(*) from pg_roles where rolname like 'cli_login_%'),'target_count',(select count(*) from public.checklist_releases where slug='2024-panini-prizm-wnba')) state;`;
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, { method:'POST', headers:{ Authorization:`Bearer ${accessToken}`, Accept:'application/json', 'Content-Type':'application/json' }, body:JSON.stringify({ query, parameters:[], read_only:true }) });
            const text = await response.text();
            const payload = response.ok ? { status:'captured', state:(text ? JSON.parse(text) : [])?.[0]?.state || null } : { status:'audit_failed', httpStatus:response.status };
            fs.writeFileSync(output, `${JSON.stringify(payload, null, 2)}\n`);
          })().catch((error) => fs.writeFileSync(output, `${JSON.stringify({ status:'audit_exception', error:String(error?.message || error).slice(0,500) }, null, 2)}\n`));
          NODE

      - name: Upload sanitized canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-canary-prizm-wnba-production-20260803
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/checklist-canary-production"
          rm -rf "$RUNNER_TEMP/checklist-canary-artifact"
          rm -f "$RUNNER_TEMP/checklist-canary-artifact.zip"
          rm -f .env.local .env.production.local
