name: One-Time Finalize Merged eBay Aliases 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-finalize-merged-ebay-aliases-20260728.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/finalize-merged-ebay-aliases-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-merged-ebay-aliases-20260728
          fetch-depth: 1
      - name: Capture structural patch failure
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python scripts/temporary_finalize_merged_ebay_aliases.py > diagnostics/stdout.txt 2> diagnostics/stderr.txt
          status=$?
          printf '%s\n' "$status" > diagnostics/status.txt
          cat diagnostics/stderr.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: merged-alias-structural-patch-diagnostics-${{ github.run_number }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
