name: KINGMAKER Private Pricing Work Order Activity

on:
  pull_request:
    paths:
      - "supabase/migrations/20260804074500_private_pricing_work_order_activity.sql"
      - "scripts/run-kingmaker-private-pricing-work-order-activity-regressions.sql"
      - "scripts/run-kingmaker-private-pricing-work-order-activity-regressions.ts"
      - "src/lib/kingmaker-private-pricing-work-order-activity-server.ts"
      - "src/app/api/instacomp/pricing/coverage/work-orders/activity/route.ts"
      - "src/app/admin/instacomp/pricing/_components/private-pricing-work-order-activity.tsx"
      - "src/app/admin/instacomp/pricing/coverage/work-orders/page.tsx"
      - ".github/workflows/kingmaker-private-pricing-work-order-activity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-work-order-activity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kingmaker_work_order_activity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kingmaker_work_order_activity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: kingmaker_work_order_activity_test
      CHECKLIST_MIGRATION: supabase/migrations/20260725200000_tcos_checklist_registry_core.sql
      KINGMAKER_MIGRATION: supabase/migrations/20260803030000_kingmaker_intelligence_fusion.sql
      COVERAGE_MIGRATION: supabase/migrations/20260804034500_kingmaker_private_pricing_coverage.sql
      SNAPSHOT_MIGRATION: supabase/migrations/20260804043000_cache_kingmaker_private_pricing_coverage.sql
      SNAPSHOT_TEMP_FIX: supabase/migrations/20260804043100_fix_private_pricing_coverage_refresh_temp_table.sql
      QUALITY_FIREWALL: supabase/migrations/20260804050000_private_pricing_coverage_quality_firewall.sql
      QUALITY_PERIOD_FIX: supabase/migrations/20260804050100_fix_private_pricing_quality_periods.sql
      WORK_ORDERS_MIGRATION: supabase/migrations/20260804062000_private_pricing_coverage_work_orders.sql
      RECONCILIATION_MIGRATION: supabase/migrations/20260804070000_private_pricing_work_order_reconciliation.sql
      ACTIVITY_MIGRATION: supabase/migrations/20260804074500_private_pricing_work_order_activity.sql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create Supabase-compatible roles and storage contract
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null unique,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          SQL

      - name: Apply Registry, coverage, work-order, reconciliation, and activity migrations
        run: |
          PRIVATE_PRICING_MIGRATION="$(find supabase/migrations -maxdepth 1 -name '20260803043000_kingmaker_*_price_guides.sql' -print -quit)"
          test -n "$PRIVATE_PRICING_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$CHECKLIST_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$KINGMAKER_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$PRIVATE_PRICING_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$COVERAGE_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$SNAPSHOT_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$SNAPSHOT_TEMP_FIX"
          psql -v ON_ERROR_STOP=1 --file "$QUALITY_FIREWALL"
          psql -v ON_ERROR_STOP=1 --file "$QUALITY_PERIOD_FIX"
          psql -v ON_ERROR_STOP=1 --file "$WORK_ORDERS_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$RECONCILIATION_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$ACTIVITY_MIGRATION"

      - name: Reapply activity migration to prove idempotence
        run: psql -v ON_ERROR_STOP=1 --file "$ACTIVITY_MIGRATION"

      - name: Run ordering, filtering, privacy, privilege, and zero-promotion regression
        run: psql -v ON_ERROR_STOP=1 --file scripts/run-kingmaker-private-pricing-work-order-activity-regressions.sql

      - name: Install application dependencies
        run: npm ci

      - name: Run application activity boundary regression
        run: node --import tsx scripts/run-kingmaker-private-pricing-work-order-activity-regressions.ts

      - name: Lint activity files
        run: >-
          npx eslint
          scripts/run-kingmaker-private-pricing-work-order-activity-regressions.ts
          src/lib/kingmaker-private-pricing-work-order-activity-server.ts
          src/app/api/instacomp/pricing/coverage/work-orders/activity/route.ts
          src/app/admin/instacomp/pricing/_components/private-pricing-work-order-activity.tsx
          src/app/admin/instacomp/pricing/coverage/work-orders/page.tsx

      - name: Type-check application
        run: npx tsc --noEmit
