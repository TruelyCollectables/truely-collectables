name: KINGMAKER Private Pricing Coverage Snapshot

on:
  pull_request:
    paths:
      - "supabase/migrations/20260804043000_cache_kingmaker_private_pricing_coverage.sql"
      - "supabase/migrations/20260804043100_fix_private_pricing_coverage_refresh_temp_table.sql"
      - "scripts/run-kingmaker-private-pricing-coverage-snapshot-regressions.sql"
      - "scripts/run-kingmaker-private-pricing-coverage-refresh.mjs"
      - ".github/workflows/kingmaker-private-pricing-coverage-refresh.yml"
      - ".github/workflows/kingmaker-private-pricing-coverage-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-pricing-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kingmaker_private_pricing_snapshot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kingmaker_private_pricing_snapshot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: kingmaker_private_pricing_snapshot_test
      CHECKLIST_MIGRATION: supabase/migrations/20260725200000_tcos_checklist_registry_core.sql
      KINGMAKER_MIGRATION: supabase/migrations/20260803030000_kingmaker_intelligence_fusion.sql
      PRIVATE_PRICING_MIGRATION: supabase/migrations/20260803043000_kingmaker_beckett_price_guides.sql
      COVERAGE_MIGRATION: supabase/migrations/20260804034500_kingmaker_private_pricing_coverage.sql
      SNAPSHOT_MIGRATION: supabase/migrations/20260804043000_cache_kingmaker_private_pricing_coverage.sql
      SNAPSHOT_TEMP_FIX: supabase/migrations/20260804043100_fix_private_pricing_coverage_refresh_temp_table.sql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create Supabase-compatible roles and storage contract
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null unique,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          SQL

      - name: Apply Registry, KINGMAKER, coverage, snapshot, and refresh fix
        run: |
          psql -v ON_ERROR_STOP=1 --file "$CHECKLIST_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$KINGMAKER_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$PRIVATE_PRICING_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$COVERAGE_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$SNAPSHOT_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$SNAPSHOT_TEMP_FIX"

      - name: Reapply snapshot chain to prove idempotence
        run: |
          psql -v ON_ERROR_STOP=1 --file "$SNAPSHOT_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$SNAPSHOT_TEMP_FIX"

      - name: Run snapshot, repeated-refresh, invalidation, privacy, and zero-promotion regression
        run: psql -v ON_ERROR_STOP=1 --file scripts/run-kingmaker-private-pricing-coverage-snapshot-regressions.sql

      - name: Validate refresh runner syntax
        run: node --check scripts/run-kingmaker-private-pricing-coverage-refresh.mjs

      - name: Verify permanent refresh schedule and boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'cron: "37 * * * *"' .github/workflows/kingmaker-private-pricing-coverage-refresh.yml
          grep -F 'environment: Production' .github/workflows/kingmaker-private-pricing-coverage-refresh.yml
          grep -F 'SUPABASE_ACCESS_TOKEN' .github/workflows/kingmaker-private-pricing-coverage-refresh.yml
          grep -F 'pricesPromotedByThisOperation !== 0' .github/workflows/kingmaker-private-pricing-coverage-refresh.yml
          grep -F 'drop table if exists pg_temp.tcos_private_pricing_coverage_refresh;' "$SNAPSHOT_TEMP_FIX"
          ! grep -Eqi 'raw_text|value_low|value_high|original_filename|storage_object_path' .github/workflows/kingmaker-private-pricing-coverage-refresh.yml
