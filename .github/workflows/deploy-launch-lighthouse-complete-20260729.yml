name: Deploy Launch Lighthouse Complete 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-launch-lighthouse-complete-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-launch-lighthouse-complete-20260729
  cancel-in-progress: false

jobs:
  deploy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      DEPLOY_SOURCE_SHA: 7765f115d44e2629d47cc38871273dacdafcb8e7
    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: 7765f115d44e2629d47cc38871273dacdafcb8e7
          fetch-depth: 0

      - name: Fail closed if main moved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SOURCE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SOURCE_SHA"
          git diff --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .audit/lighthouse-complete
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          printf '%s\n' "$DEPLOY_SOURCE_SHA" > .audit/lighthouse-complete/source-sha.txt

      - name: Deploy exact current main to Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" 2>&1 | tee .audit/lighthouse-complete/vercel-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' .audit/lighthouse-complete/vercel-deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          printf '%s\n' "$DEPLOYMENT_URL" > .audit/lighthouse-complete/deployment-url.txt
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify live storefront and privileged boundary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          for label in deployment custom; do
            if [ "$label" = deployment ]; then base="$DEPLOYMENT_URL"; else base="https://truelycollectables.com"; fi
            root_code="$(curl --location --silent --show-error --output ".audit/lighthouse-complete/${label}-root.html" --write-out '%{http_code}' "$base/")"
            shop_code="$(curl --location --silent --show-error --output ".audit/lighthouse-complete/${label}-shop.html" --write-out '%{http_code}' "$base/shop")"
            admin_code="$(curl --silent --show-error --output ".audit/lighthouse-complete/${label}-admin.html" --write-out '%{http_code}' "$base/admin")"
            login_code="$(curl --location --silent --show-error --output ".audit/lighthouse-complete/${label}-admin-login.html" --write-out '%{http_code}' "$base/admin/login")"
            test "$root_code" = "200"
            test "$shop_code" = "200"
            test "$admin_code" = "307"
            test "$login_code" = "200"
            grep -Fq 'id="shop-search"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'id="shop-section"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'id="shop-feature"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'id="shop-sort"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'for="shop-search"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'for="shop-section"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'for="shop-feature"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'for="shop-sort"' ".audit/lighthouse-complete/${label}-shop.html"
            grep -Fq 'Admin Login' ".audit/lighthouse-complete/${label}-admin-login.html"
            if grep -Fq 'aria-label="Truely Collectables home"' ".audit/lighthouse-complete/${label}-shop.html"; then
              echo "Stale overriding navbar aria-label remains on $label" >&2
              exit 1
            fi
          done

      - name: Run exact Lighthouse remediation certificate
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          for label in deployment custom; do
            if [ "$label" = deployment ]; then url="$DEPLOYMENT_URL/shop"; else url="https://truelycollectables.com/shop"; fi
            npx --yes lighthouse@12.8.2 "$url" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path=".audit/lighthouse-complete/${label}-shop-lighthouse.json" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet
          done
          node - <<'NODE'
          const fs = require('fs');
          const rows = [];
          for (const label of ['deployment', 'custom']) {
            const report = JSON.parse(fs.readFileSync(`.audit/lighthouse-complete/${label}-shop-lighthouse.json`, 'utf8'));
            const audit = (id) => report.audits[id];
            const row = {
              target: label,
              performance: Math.round((report.categories.performance?.score || 0) * 100),
              accessibility: Math.round((report.categories.accessibility?.score || 0) * 100),
              bestPractices: Math.round((report.categories['best-practices']?.score || 0) * 100),
              seo: Math.round((report.categories.seo?.score || 0) * 100),
              selectName: audit('select-name')?.score,
              labelContentNameMismatch: audit('label-content-name-mismatch')?.score,
              crawlable: audit('is-crawlable')?.score,
              canonical: audit('canonical')?.score,
            };
            if (row.accessibility !== 100) throw new Error(`${label} accessibility is ${row.accessibility}`);
            if (row.bestPractices < 85) throw new Error(`${label} best practices is ${row.bestPractices}`);
            if (row.selectName !== 1) throw new Error(`${label} select-name did not pass`);
            if (row.labelContentNameMismatch !== 1) throw new Error(`${label} visible-label accessible-name audit did not pass`);
            if (row.canonical !== 1) throw new Error(`${label} canonical audit did not pass`);
            if (label === 'custom') {
              if (row.seo < 90) throw new Error(`custom-domain SEO is ${row.seo}`);
              if (row.crawlable !== 1) throw new Error('custom domain is not crawlable');
            } else {
              const sources = audit('is-crawlable')?.details?.items?.map((item) => item.source) || [];
              if (row.crawlable !== 0 || !sources.some((source) => /x-robots-tag:\s*noindex/i.test(source))) {
                throw new Error('generated Vercel deployment is not intentionally protected by x-robots-tag noindex');
              }
            }
            rows.push(row);
          }
          fs.writeFileSync('.audit/lighthouse-complete/summary.json', JSON.stringify({ sourceSha: process.env.DEPLOY_SOURCE_SHA, rows }, null, 2));
          fs.writeFileSync('.audit/lighthouse-complete/summary.md', '# Lighthouse remediation certificate\n\n' + rows.map((row) => `- ${row.target}: Performance ${row.performance}, Accessibility ${row.accessibility}, Best Practices ${row.bestPractices}, SEO ${row.seo}, select-name ${row.selectName}, visible-label-name ${row.labelContentNameMismatch}, crawlable ${row.crawlable}, canonical ${row.canonical}`).join('\n') + '\n');
          console.table(rows);
          NODE

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-lighthouse-complete-production
          path: .audit/lighthouse-complete
          if-no-files-found: error
          retention-days: 30
