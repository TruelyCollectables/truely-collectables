name: Modernize Buyer Account Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: modernize-buyer-account-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  modernize:
    if: github.event.pull_request.head.ref == 'agent/dual-marketplace-card-intake'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align production guard with current buyer policy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/check-production-guardrails.mjs';
          let text = fs.readFileSync(path, 'utf8');

          const oldLogin = `assertFileIncludes(
            "account login response contract",
            "src/app/api/account/login/route.ts",
            [
              "accountAuthResponseHeaders",
              'action: "login"',
              'status: "missing_credentials"',
              'status: "blocked"',
              'status: "invalid_credentials"',
              'status: "payment_verification_required"',
              'status: "inactive"',
              'status: "authenticated"',
              'cardVerification: "required"',
              'cardVerification: profile?.card_verified ? "verified" : "active"',
              'session: "issued"',
              'membership: "buyer"',
            ],
          );`;

          const newLogin = `assertFileIncludes(
            "account login response contract",
            "src/app/api/account/login/route.ts",
            [
              "accountAuthResponseHeaders",
              'action: "login"',
              'status: "missing_credentials"',
              'status: "blocked"',
              'status: "invalid_credentials"',
              'status: "seller_payment_verification_required"',
              'status: "inactive"',
              'status: "authenticated"',
              "shouldActivateLegacyBuyerAccount",
              "buyer_card_verification_requirement_removed",
              "Seller verification must be completed through TCOS seller onboarding",
              'cardVerification: "seller_only"',
              'cardVerification: buyerAccount ? "not_required" : "seller_only"',
              'session: "issued"',
              'membership: "buyer"',
            ],
          );
          assertFileExcludes(
            "account login retired buyer card-verification contract",
            "src/app/api/account/login/route.ts",
            [
              'status: "payment_verification_required"',
              'cardVerification: "required"',
              'cardVerification: profile?.card_verified ? "verified" : "active"',
            ],
          );`;

          const oldSignup = `assertFileIncludes(
            "account signup response contract",
            "src/app/api/account/signup/route.ts",
            [
              "accountAuthResponseHeaders",
              'action: "signup"',
              'status: "missing_credentials"',
              'status: "weak_password"',
              'status: "terms_required"',
              'status: "blocked"',
              'status: "payment_runtime_unavailable"',
              'status: "signup_failed"',
              '"created_pending_card_verification"',
              '"created_active"',
              "stripeSessionId",
              "cardVerificationUrl",
              '!cardVerificationRequired && data.session ? "issued" : "not_issued"',
              'membership: "buyer"',
            ],
          );`;

          const newSignup = `assertFileIncludes(
            "account signup response contract",
            "src/app/api/account/signup/route.ts",
            [
              "accountAuthResponseHeaders",
              'action: "signup"',
              'status: "missing_credentials"',
              'status: "weak_password"',
              'status: "terms_required"',
              'status: "blocked"',
              'status: "signup_failed"',
              'status: "created_active_buyer"',
              "BUYER_ACCOUNT_ACTIVE_STATUS",
              "BUYER_CARD_VERIFICATION_REQUIRED",
              "BUYER_MEMBERSHIP_ACTIVE_STATUS",
              "cardVerificationRequired: BUYER_CARD_VERIFICATION_REQUIRED",
              "stripeSessionId: null",
              "cardVerificationUrl: null",
              'cardVerification: "not_required"',
              'session: data.session ? "issued" : "not_issued"',
              'membership: "buyer"',
            ],
          );
          assertFileExcludes(
            "account signup retired buyer card-verification contract",
            "src/app/api/account/signup/route.ts",
            [
              'status: "payment_runtime_unavailable"',
              '"created_pending_card_verification"',
              'from "stripe"',
              "getStripePaymentRuntime",
              "checkout.sessions.create",
            ],
          );
          assertFileIncludes(
            "buyer account no-card policy",
            "src/lib/buyer-account-policy.ts",
            [
              "BUYER_CARD_VERIFICATION_REQUIRED = false",
              'BUYER_ACCOUNT_ACTIVE_STATUS = "active"',
              'BUYER_MEMBERSHIP_ACTIVE_STATUS = "active"',
              "shouldActivateLegacyBuyerAccount",
              'normalized(params.accountStatus) === "payment_verification_required"',
              "isBuyerAccountType(params.defaultAccountType, params.authAccountType)",
            ],
          );
          assertFileIncludes(
            "buyer account no-card regression suite",
            "scripts/run-buyer-account-no-card-regressions.ts",
            [
              "BUYER_CARD_VERIFICATION_REQUIRED",
              "shouldActivateLegacyBuyerAccount",
              "Seller verification must be completed through TCOS seller onboarding",
              "Buyer account signup without card verification regressions passed.",
            ],
          );`;

          for (const [label, oldValue, newValue] of [
            ['login', oldLogin, newLogin],
            ['signup', oldSignup, newSignup],
          ]) {
            const count = text.split(oldValue).length - 1;
            if (count !== 1) {
              throw new Error(`Expected one ${label} guard block, found ${count}.`);
            }
            text = text.replace(oldValue, newValue);
          }

          fs.writeFileSync(path, text);
          NODE

      - name: Validate buyer account policy
        run: node --import tsx scripts/run-buyer-account-no-card-regressions.ts

      - name: Validate production guardrails
        run: npm run check:production-guardrails

      - name: Commit guard modernization
        shell: bash
        run: |
          if git diff --quiet -- scripts/check-production-guardrails.mjs; then
            echo "Guard already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-production-guardrails.mjs
          git commit -m "Align buyer account production guard"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
