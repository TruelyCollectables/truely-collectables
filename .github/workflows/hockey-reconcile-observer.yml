name: Hockey Reconcile Observer

on:
  push:
    branches:
      - main
    paths:
      - ".github/hockey-reconcile-observer-trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: hockey-reconcile-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STATUS_URL: https://truelycollectables.com/api/internal/checklist-registry/hockey-reconcile-status
      STATUS_BRANCH: ops/hockey-reconcile-observer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch live Actions and Registry status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/ops

          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/automatic-checklist-discovery.yml/runs?branch=main&event=push&per_page=10" \
            > /tmp/actions-runs.json

          status_code="$(curl -sS --max-time 30 -o /tmp/registry-status.raw -w '%{http_code}' "${STATUS_URL}" || true)"
          if [[ "${status_code}" == "200" ]] && jq -e '.ok == true' /tmp/registry-status.raw >/dev/null 2>&1; then
            cp /tmp/registry-status.raw /tmp/registry-status.json
            registry_error='null'
          else
            printf '%s\n' 'null' > /tmp/registry-status.json
            registry_error="$(jq -Rs --arg code "${status_code:-unavailable}" '{httpStatus:$code,body:(.[0:4000])}' < /tmp/registry-status.raw 2>/dev/null || jq -n --arg code "${status_code:-unavailable}" '{httpStatus:$code,body:"observer request failed"}')"
          fi

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile actions /tmp/actions-runs.json \
            --slurpfile registry /tmp/registry-status.json \
            --argjson registryError "${registry_error}" \
            '{
              generatedAt:$generatedAt,
              automaticChecklistDiscoveryRuns:[
                $actions[0].workflow_runs[] | {
                  id,
                  run_number,
                  run_attempt,
                  event,
                  status,
                  conclusion,
                  head_sha,
                  head_branch,
                  created_at,
                  run_started_at,
                  updated_at,
                  html_url
                }
              ],
              registryStatus:$registry[0],
              registryStatusError:$registryError
            }' > data/ops/hockey-reconcile-observer.json
      - name: Publish observer snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${STATUS_BRANCH}"
          git add data/ops/hockey-reconcile-observer.json
          git commit -m "ops(checklists): publish hockey reconcile observer snapshot" || true
          git push --force origin "HEAD:${STATUS_BRANCH}"
