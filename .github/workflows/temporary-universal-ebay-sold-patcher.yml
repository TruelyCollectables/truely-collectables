name: Temporary Universal eBay Sold Patcher

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only-placeholder
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out universal eBay branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-universal-ebay-sold-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply universal eBay sold and active engine
        run: |
          if [ -f scripts/apply-instacomp-universal-ebay-sold.mjs ]; then
            node scripts/apply-instacomp-universal-ebay-sold.mjs
          fi
          if [ -f scripts/finalize-instacomp-universal-ebay-sold.mjs ]; then
            node scripts/finalize-instacomp-universal-ebay-sold.mjs
          fi

      - name: Validate universal eBay sold regression
        run: node --import tsx scripts/run-instacomp-universal-ebay-sold-regressions.ts

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Commit validated engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes remain to commit."
            exit 0
          fi
          git commit -m "Make eBay sold and active search universal for InstaComp"
          git push origin HEAD:agent/instacomp-universal-ebay-sold-20260726
