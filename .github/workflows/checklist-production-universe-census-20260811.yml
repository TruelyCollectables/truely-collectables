name: Checklist Production Universe Census 20260811

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checklist-production-universe-census-20260811.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  EXPECTED_MAIN: 56d29f01c1f123e99ae15004bba0346cfbe7927a
  MASTER_RUN_ID: '31100986894'
  MASTER_ARTIFACT_ID: '8972199339'
  VERCEL_SCOPE: truelycollectables-projects

jobs:
  census:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove pinned main and read-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha || env.EXPECTED_MAIN }}" = "$EXPECTED_MAIN"
          bad="$(git diff --name-only "$EXPECTED_MAIN"...HEAD | grep -Ev '^\.github/workflows/checklist-production-universe-census-20260811\.yml$' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }

      - name: Download audited 2000-2026 master catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MASTER_ARTIFACT_ID}/zip" \
            --output master-catalog.zip
          rm -rf .checklist-universe-census
          mkdir -p .checklist-universe-census/master
          unzip -q master-catalog.zip -d .checklist-universe-census/master
          test -f .checklist-universe-census/master/phase1-sports-2000-plus/sports-sets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.checklist-universe-census/master/phase1-sports-2000-plus/sports-sets.json')
          rows=json.loads(p.read_text())
          assert len(rows)==5643, len(rows)
          keys=[r['exactSetKey'] for r in rows]
          assert len(keys)==len(set(keys))==5643
          print('audited canonical universe=5643')
          PY

      - name: Resolve protected Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/checklist-census"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx --yes vercel@56.2.0 env pull "$RUNNER_TEMP/checklist-census/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          chmod 600 "$RUNNER_TEMP/checklist-census/production.env"
          echo "PRODUCTION_ENV_PATH=$RUNNER_TEMP/checklist-census/production.env" >> "$GITHUB_ENV"

      - name: Resolve masked Supabase service role
        env:
          GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$PRODUCTION_ENV_PATH"; set +a
          project_ref="$(node -e 'const u=new URL(process.argv[1]);process.stdout.write(u.hostname.split(".")[0])' "$NEXT_PUBLIC_SUPABASE_URL")"
          keys="$RUNNER_TEMP/checklist-census/api-keys.json"
          curl --silent --show-error --fail --retry 5 --retry-all-errors \
            --header "Authorization: Bearer ${GH_SUPABASE_ACCESS_TOKEN}" \
            --output "$keys" \
            "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$keys")"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "RESOLVED_SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Compare Production Registry to all 5,643 canonical sets
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$PRODUCTION_ENV_PATH"; set +a
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from pathlib import Path
          from collections import Counter

          root=os.environ['NEXT_PUBLIC_SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'apikey':key,'Authorization':'Bearer '+key,'Accept':'application/json'}

          def get(path, attempts=6):
              url=root+'/rest/v1/'+path
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode())
                  except Exception as e:
                      last=e
                      if i+1<attempts:
                          time.sleep(min(2**i,12))
              raise last

          def pages(table, select, filters=''):
              out=[]; offset=0; limit=1000
              while True:
                  q=f'{table}?select={urllib.parse.quote(select, safe=",.*()")}&limit={limit}&offset={offset}'
                  if filters: q += '&'+filters
                  batch=get(q)
                  out.extend(batch)
                  if len(batch)<limit: break
                  offset += limit
              return out

          def slug(v):
              s=str(v or '').strip().lower()
              s=s.replace('&',' and ')
              s=re.sub(r"[’']",'',s)
              s=re.sub(r'[^a-z0-9]+','-',s).strip('-')
              return s

          master=json.loads(Path('.checklist-universe-census/master/phase1-sports-2000-plus/sports-sets.json').read_text())
          universe={r['exactSetKey'].lower():r for r in master}
          assert len(universe)==5643

          manufacturers=pages('checklist_manufacturers','id,name,slug')
          sports=pages('checklist_sports','id,name,slug')
          releases=pages('checklist_releases','id,manufacturer_id,sport_id,product_name,slug,release_year,season,checklist_status,import_status,metadata')
          versions=pages('checklist_versions','release_id,status,is_active,normalized_card_count','is_active=eq.true&status=eq.live')
          catalog=pages('checklist_source_catalog','source_url,status,metadata','status=in.(imported,unchanged)')

          man={r['id']:slug(r.get('slug') or r.get('name')) for r in manufacturers}
          sport={r['id']:slug(r.get('slug') or r.get('name')) for r in sports}
          live_release_ids={v['release_id'] for v in versions if v.get('is_active') and v.get('status')=='live' and int(v.get('normalized_card_count') or 0)>0}

          def strings(obj):
              if isinstance(obj,str):
                  yield obj
              elif isinstance(obj,dict):
                  for v in obj.values(): yield from strings(v)
              elif isinstance(obj,list):
                  for v in obj: yield from strings(v)

          matched=set(); methods=Counter()
          active_releases=0
          for r in releases:
              if r['id'] not in live_release_ids: continue
              active_releases += 1
              explicit=[]
              for s in strings(r.get('metadata') or {}):
                  s=s.strip().lower()
                  if s in universe: explicit.append(s)
              if explicit:
                  for k in explicit: matched.add(k)
                  methods['release_metadata_exact'] += len(set(explicit))
              sp=sport.get(r.get('sport_id'),'')
              ma=man.get(r.get('manufacturer_id'),'')
              season=str(r.get('season') or r.get('release_year') or '').strip().lower()
              product=slug(r.get('product_name'))
              derived='|'.join([sp,season,ma,product])
              if derived in universe:
                  matched.add(derived); methods['derived_taxonomy_exact'] += 1

          for row in catalog:
              for s in strings(row.get('metadata') or {}):
                  s=s.strip().lower()
                  if s in universe:
                      matched.add(s); methods['source_catalog_exact'] += 1

          missing=set(universe)-matched
          by_sport=Counter(universe[k]['sport'] for k in missing)
          covered_by_sport=Counter(universe[k]['sport'] for k in matched)
          receipt={
              'schema':'tcos.checklist.productionUniverseCensus.v1',
              'masterRunId':31100986894,
              'masterArtifactId':8972199339,
              'canonicalUniverse':len(universe),
              'productionActiveLiveReleases':active_releases,
              'productionMatchedCanonicalSets':len(matched),
              'productionMissingCanonicalSets':len(missing),
              'coveragePercent':round(len(matched)*100/len(universe),4),
              'matchMethods':dict(methods),
              'missingBySport':dict(sorted(by_sport.items())),
              'coveredBySport':dict(sorted(covered_by_sport.items())),
              'missingExactSetKeys':sorted(missing),
          }
          Path('.checklist-universe-census/production-universe-census.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='missingExactSetKeys'},indent=2))
          print('MISSING_CANONICAL_SETS='+str(len(missing)))
          PY

      - name: Upload exact census receipt
        uses: actions/upload-artifact@v4
        with:
          name: checklist-production-universe-census-${{ github.run_id }}
          path: .checklist-universe-census/production-universe-census.json
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf .checklist-universe-census master-catalog.zip "$RUNNER_TEMP/checklist-census" .env.local .vercel
