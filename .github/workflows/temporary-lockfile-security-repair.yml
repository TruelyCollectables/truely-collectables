name: Temporary Lockfile Security Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-lockfile-security-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/kingmaker-phases-60-73-sovereign-resilience-batch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit fix --package-lock-only --omit=dev
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: repair vulnerable production dependency lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
