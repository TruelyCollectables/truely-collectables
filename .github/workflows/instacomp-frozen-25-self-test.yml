name: InstaComp Staged Frozen Promotion Self Test

on:
  pull_request:
    branches: [main]
    paths:
      - "services/instacomp-ai/app/__init__.py"
      - "services/instacomp-ai/app/candidate_identity_guard.py"
      - "services/instacomp-ai/app/card_number_evidence_guard.py"
      - "services/instacomp-ai/app/lora_candidate_runtime.py"
      - "services/instacomp-ai/app/lora_candidate_runtime_v2.py"
      - "services/instacomp-ai/app/ollama.py"
      - "services/instacomp-ai/app/serial_evidence_guard.py"
      - "services/instacomp-ai/tests/test_card_number_evidence_guard.py"
      - "services/instacomp-ai/tests/test_serial_evidence_guard.py"
      - "services/instacomp-ai/scripts/run_lora_candidate_server.py"
      - "services/instacomp-ai/scripts/run_lora_candidate_server_legacy.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v2.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v3.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v4.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v5.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v6.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v7.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v9.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py"
      - "services/instacomp-ai/scripts/run_frozen_25_promotion.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py"
      - "services/instacomp-ai/requirements.txt"
      - ".github/workflows/instacomp-frozen-25-self-test.yml"
  push:
    branches: [main]
    paths:
      - "services/instacomp-ai/app/__init__.py"
      - "services/instacomp-ai/app/candidate_identity_guard.py"
      - "services/instacomp-ai/app/card_number_evidence_guard.py"
      - "services/instacomp-ai/app/lora_candidate_runtime.py"
      - "services/instacomp-ai/app/lora_candidate_runtime_v2.py"
      - "services/instacomp-ai/app/ollama.py"
      - "services/instacomp-ai/app/serial_evidence_guard.py"
      - "services/instacomp-ai/tests/test_card_number_evidence_guard.py"
      - "services/instacomp-ai/tests/test_serial_evidence_guard.py"
      - "services/instacomp-ai/scripts/run_lora_candidate_server.py"
      - "services/instacomp-ai/scripts/run_lora_candidate_server_legacy.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v2.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v3.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v4.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v5.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v6.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v7.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v9.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py"
      - "services/instacomp-ai/scripts/run_frozen_25_promotion.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py"
      - "services/instacomp-ai/requirements.txt"
      - ".github/workflows/instacomp-frozen-25-self-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-frozen-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact InstaComp service requirements
        run: pip install -r services/instacomp-ai/requirements.txt

      - name: Compile staged promotion code and candidate runtime
        run: |
          python -m py_compile \
            services/instacomp-ai/app/candidate_identity_guard.py \
            services/instacomp-ai/app/card_number_evidence_guard.py \
            services/instacomp-ai/app/lora_candidate_runtime_v2.py \
            services/instacomp-ai/app/serial_evidence_guard.py \
            services/instacomp-ai/tests/test_card_number_evidence_guard.py \
            services/instacomp-ai/tests/test_serial_evidence_guard.py \
            services/instacomp-ai/scripts/run_lora_candidate_server.py \
            services/instacomp-ai/scripts/run_lora_candidate_server_legacy.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v2.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v3.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v4.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v5.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v6.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v7.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v9.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py

      - name: Prove card-number OCR cannot overwrite an explicit candidate
        env:
          PYTHONPATH: services/instacomp-ai
        run: python -m pytest -q services/instacomp-ai/tests/test_card_number_evidence_guard.py

      - name: Prove physical serial evidence parsing and candidate reconciliation
        env:
          PYTHONPATH: services/instacomp-ai
        run: python -m pytest -q services/instacomp-ai/tests/test_serial_evidence_guard.py

      - name: Prove sidecar structured response recovery and fail-closed diagnostics
        run: python services/instacomp-ai/scripts/run_lora_candidate_server.py --self-test

      - name: Validate launcher defaults to Frozen 10 staged target
        run: |
          bash -n services/instacomp-ai/scripts/run_frozen_25_promotion.sh
          grep -q 'promotion-v11-frozen-10-15-25' services/instacomp-ai/scripts/run_frozen_25_promotion.sh
          grep -q 'promote_lora_candidate_frozen_25_v11.py' services/instacomp-ai/scripts/run_frozen_25_promotion.sh
          grep -q 'DEFAULT_STAGE_TARGET = 10' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py
          grep -q 'REGISTRY_ATTEMPT_BUDGETS = {10: 100, 15: 250, 25: 750}' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py

      - name: Prove staged bounded preflight plus every prior gate
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py --self-test

  staged-frozen-v11-macos-contract:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact InstaComp service requirements
        run: pip install -r services/instacomp-ai/requirements.txt

      - name: Compile v11 on macOS
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py \
            services/instacomp-ai/app/candidate_identity_guard.py \
            services/instacomp-ai/app/card_number_evidence_guard.py \
            services/instacomp-ai/app/serial_evidence_guard.py
          bash -n services/instacomp-ai/scripts/run_frozen_25_promotion.sh

      - name: Prove v11 staged ladder and every prior gate on macOS
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py --self-test
