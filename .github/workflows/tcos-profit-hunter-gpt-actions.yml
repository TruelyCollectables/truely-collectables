name: KM252 Fanatics Safe Sweep
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run rate-limited Fanatics exact-sold sweep
        run: npx tsx scripts/km252-fanatics-safe-sweep.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km252-fanatics-${{ github.run_id }}
          path: artifacts/km252-fanatics
          if-no-files-found: warn
          retention-days: 7
