name: KM252 InstaComp Pricing Run

on:
  workflow_dispatch:
    inputs:
      only_n:
        description: "Optional comma-separated KM252 card numbers for smoke testing"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  price-km252:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KM252_ONLY_N: ${{ inputs.only_n }}
      KM252_PRICE_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run audited KM252 pricing
        run: npx tsx scripts/km252-price-actions.ts
      - name: Upload pricing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km252-pricing-${{ github.run_id }}
          path: artifacts/km252-pricing
          if-no-files-found: warn
          retention-days: 7
