name: KM252 OpenAI Discovery Smoke

on:
  workflow_dispatch:
    inputs:
      only_n:
        description: "Comma-separated KM252 card numbers"
        required: true
        default: "68"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KM252_ONLY_N: ${{ inputs.only_n }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact OpenAI Web discovery
        run: npx tsx scripts/km252-openai-discovery-actions.ts
      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km252-openai-discovery-${{ github.run_id }}
          path: artifacts/km252-openai-discovery
          if-no-files-found: warn
          retention-days: 7
