name: Commit Final Merged Alias Contract 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/commit-final-merged-alias-contract-20260728.yml"

permissions:
  contents: write

jobs:
  commit-certified-files:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/finalize-merged-ebay-aliases-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-merged-ebay-aliases-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Correct certified structural matcher
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/temporary_finalize_merged_ebay_aliases.py')
          text = path.read_text()
          old = '''source = replace_once(
              source,
              "      : remote.listings\\n        .map((listing) => localByItemId.get(listing.itemId) || null)",
              "      : effectiveRemoteListings\\n        .map((listing) => localByItemId.get(listing.itemId) || null)",
              "effective unchanged listings",
          )'''
          new = '''pattern = re.compile(
              r"      : remote\\.listings\\s+\\.map\\(\\(listing\\) => localByItemId\\.get\\(listing\\.itemId\\) \\|\\| null\\)",
              re.S,
          )
          source, count = pattern.subn(
              "      : effectiveRemoteListings\\n        .map((listing) => localByItemId.get(listing.itemId) || null)",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"effective unchanged listings: expected one match, found {count}")'''
          if text.count(old) != 1:
              raise SystemExit(f'unchanged matcher patch: found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply previously certified contract
        run: python scripts/temporary_finalize_merged_ebay_aliases.py

      - name: Remove temporary operations files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-finalize-merged-ebay-aliases-20260728.yml \
            .github/workflows/diagnose-final-merged-alias-writer-20260728.yml \
            .github/workflows/materialize-final-merged-alias-contract-20260728.yml \
            .github/workflows/commit-final-merged-alias-contract-20260728.yml \
            .github/workflows/ops-finalize-certified-ebay-fix-20260728.yml \
            .github/diagnostics/retrigger-final-merged-alias-writer.txt \
            scripts/temporary_finalize_merged_ebay_aliases.py

      - name: Commit certified production contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Finalize merged eBay alias inventory synchronization"
          git push origin HEAD:agent/finalize-merged-ebay-aliases-20260728
