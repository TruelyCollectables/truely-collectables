name: Checklist Registry Postgres

on:
  pull_request:
    paths:
      - "supabase/migrations/20260725_tcos_checklist_registry_core.sql"
      - "supabase/migrations/20260725_tcos_checklist_source_storage.sql"
      - "src/lib/checklist-registry/**"
      - "scripts/run-checklist-registry-*-simulations.ts"
      - "scripts/fixtures/checklist-registry/**"
      - ".github/workflows/checklist-registry-postgres.yml"
  push:
    branches:
      - "feature/tcos-checklist-registry-release-calendar-v1"
    paths:
      - "supabase/migrations/20260725_tcos_checklist_registry_core.sql"
      - "supabase/migrations/20260725_tcos_checklist_source_storage.sql"
      - "src/lib/checklist-registry/**"
      - "scripts/run-checklist-registry-*-simulations.ts"
      - "scripts/fixtures/checklist-registry/**"
      - ".github/workflows/checklist-registry-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: checklist_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d checklist_registry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: checklist_registry_test
      CORE_MIGRATION: supabase/migrations/20260725_tcos_checklist_registry_core.sql
      STORAGE_MIGRATION: supabase/migrations/20260725_tcos_checklist_source_storage.sql

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create Supabase-compatible roles and storage tables
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            create role anon nologin;
          exception when duplicate_object then null;
          end;
          $$;

          do $$
          begin
            create role authenticated nologin;
          exception when duplicate_object then null;
          end;
          $$;

          do $$
          begin
            create role service_role nologin bypassrls;
          exception when duplicate_object then null;
          end;
          $$;

          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null unique,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          SQL

      - name: Apply Registry migrations
        run: |
          psql -v ON_ERROR_STOP=1 --file "$CORE_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$STORAGE_MIGRATION"

      - name: Reapply Registry migrations to prove idempotence
        run: |
          psql -v ON_ERROR_STOP=1 --file "$CORE_MIGRATION"
          psql -v ON_ERROR_STOP=1 --file "$STORAGE_MIGRATION"

      - name: Verify database contracts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            registry_table_count integer;
            rls_table_count integer;
            public_policy_count integer;
            public_grant_count integer;
            service_select_count integer;
            history_trigger_count integer;
            basketball_id uuid;
            wnba_id uuid;
            panini_id uuid;
            release_id uuid;
            revision_id uuid;
            source_file_id uuid;
            append_update_blocked boolean := false;
            append_delete_blocked boolean := false;
            duplicate_hash_blocked boolean := false;
            duplicate_version_blocked boolean := false;
            storage_contract_ok boolean := false;
            storage_bucket_ok boolean := false;
          begin
            select count(*) into registry_table_count
            from pg_class relation
            join pg_namespace namespace on namespace.oid = relation.relnamespace
            where namespace.nspname = 'public'
              and relation.relkind = 'r'
              and relation.relname like 'checklist\_%' escape '\';

            if registry_table_count <> 25 then
              raise exception 'Expected 25 Registry tables, found %', registry_table_count;
            end if;

            select count(*) into rls_table_count
            from pg_class relation
            join pg_namespace namespace on namespace.oid = relation.relnamespace
            where namespace.nspname = 'public'
              and relation.relkind = 'r'
              and relation.relname like 'checklist\_%' escape '\'
              and relation.relrowsecurity;

            if rls_table_count <> 25 then
              raise exception 'Expected RLS on 25 Registry tables, found %', rls_table_count;
            end if;

            select count(*) into public_policy_count
            from pg_policies
            where schemaname = 'public'
              and tablename like 'checklist\_%' escape '\';

            if public_policy_count <> 0 then
              raise exception 'Registry must not create public policies; found %', public_policy_count;
            end if;

            select count(*) into public_grant_count
            from information_schema.role_table_grants
            where table_schema = 'public'
              and table_name like 'checklist\_%' escape '\'
              and grantee in ('anon', 'authenticated');

            if public_grant_count <> 0 then
              raise exception 'Public roles unexpectedly have % Registry grants', public_grant_count;
            end if;

            select count(*) into service_select_count
            from information_schema.role_table_grants
            where table_schema = 'public'
              and table_name like 'checklist\_%' escape '\'
              and grantee = 'service_role'
              and privilege_type = 'SELECT';

            if service_select_count <> 25 then
              raise exception 'service_role SELECT expected on 25 tables, found %', service_select_count;
            end if;

            select count(*) into history_trigger_count
            from pg_trigger trigger_row
            join pg_class relation on relation.oid = trigger_row.tgrelid
            join pg_namespace namespace on namespace.oid = relation.relnamespace
            where namespace.nspname = 'public'
              and relation.relname in (
                'checklist_release_date_revisions',
                'checklist_release_status_events',
                'checklist_revision_diffs'
              )
              and trigger_row.tgname like '%_append_only'
              and not trigger_row.tgisinternal;

            if history_trigger_count <> 3 then
              raise exception 'Expected 3 append-only triggers, found %', history_trigger_count;
            end if;

            select exists (
              select 1
              from public.checklist_source_storage_contracts
              where id = 'tcos-checklist-source-files-v1'
                and bucket_name = 'tcos-checklist-source-files'
                and path_schema = 'tcos.checklist.sourcePath.v1'
                and is_public = false
                and expose_public_urls = false
                and archive_originals = true
                and max_size_bytes = 52428800
                and 'application/json' = any(allowed_mime_types)
                and 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' = any(allowed_mime_types)
            ) into storage_contract_ok;

            if not storage_contract_ok then
              raise exception 'Private application storage contract is missing or incorrect';
            end if;

            select exists (
              select 1
              from storage.buckets
              where id = 'tcos-checklist-source-files'
                and name = 'tcos-checklist-source-files'
                and public = false
                and file_size_limit = 52428800
                and 'application/json' = any(allowed_mime_types)
            ) into storage_bucket_ok;

            if not storage_bucket_ok then
              raise exception 'Private Supabase-compatible source bucket is missing or incorrect';
            end if;

            select id into basketball_id from public.checklist_sports where slug = 'basketball';
            select id into wnba_id
            from public.checklist_leagues
            where sport_id = basketball_id and slug = 'wnba';
            select id into panini_id from public.checklist_manufacturers where slug = 'panini';

            if basketball_id is null or wnba_id is null or panini_id is null then
              raise exception 'Panini/WNBA taxonomy seed is incomplete';
            end if;

            insert into public.checklist_releases (
              manufacturer_id, sport_id, league_id, product_name, slug,
              release_year, current_release_date, release_status,
              checklist_status, import_status
            ) values (
              panini_id, basketball_id, wnba_id,
              '2025 Panini Select WNBA CI Fixture',
              '2025-panini-select-wnba-ci-fixture',
              '2025', date '2026-05-15', 'released', 'detected', 'queued'
            ) returning id into release_id;

            insert into public.checklist_release_date_revisions (
              release_id, date_kind, previous_date, new_date, change_reason
            ) values (
              release_id, 'current_release_date', date '2026-05-13',
              date '2026-05-15', 'CI append-only verification'
            ) returning id into revision_id;

            begin
              update public.checklist_release_date_revisions
              set change_reason = 'must fail' where id = revision_id;
            exception when others then
              if position('append-only' in sqlerrm) > 0 then
                append_update_blocked := true;
              else
                raise;
              end if;
            end;

            begin
              delete from public.checklist_release_date_revisions where id = revision_id;
            exception when others then
              if position('append-only' in sqlerrm) > 0 then
                append_delete_blocked := true;
              else
                raise;
              end if;
            end;

            if not append_update_blocked or not append_delete_blocked then
              raise exception 'Append-only history did not reject update and delete';
            end if;

            insert into public.checklist_source_files (
              release_id, source_file_type, source_url, original_filename,
              storage_object_path, mime_type, size_bytes, sha256
            ) values (
              release_id,
              'checklist',
              'https://www.paniniamerica.net/2025-panini-select-wnba-trading-card-box-hobby-blaster',
              '2025-panini-select-wnba.json',
              'tcos/checklist/sourcePath/v1/panini/2025-panini-select-wnba/aa/' || repeat('a', 64) || '-2025-panini-select-wnba.json',
              'application/json',
              100,
              repeat('a', 64)
            ) returning id into source_file_id;

            begin
              insert into public.checklist_source_files (
                release_id, source_file_type, source_url, original_filename,
                storage_object_path, mime_type, size_bytes, sha256
              ) values (
                release_id, 'checklist', 'https://www.paniniamerica.net/copy',
                'copy.json',
                'tcos/checklist/sourcePath/v1/panini/2025-panini-select-wnba/aa/' || repeat('a', 64) || '-copy.json',
                'application/json', 100, repeat('a', 64)
              );
            exception when unique_violation then
              duplicate_hash_blocked := true;
            end;

            if not duplicate_hash_blocked then
              raise exception 'Duplicate source SHA-256 was not rejected';
            end if;

            insert into public.checklist_versions (
              release_id, source_file_id, version_number, parser_version
            ) values (release_id, source_file_id, 1, 'panini-structured-v1');

            begin
              insert into public.checklist_versions (
                release_id, source_file_id, version_number, parser_version
              ) values (release_id, source_file_id, 2, 'panini-structured-v1');
            exception when unique_violation then
              duplicate_version_blocked := true;
            end;

            if not duplicate_version_blocked then
              raise exception 'Duplicate source/parser/schema version was not rejected';
            end if;
          end;
          $$;

          select json_build_object(
            'schema', 'tcos.checklist.postgresVerification.v2',
            'status', 'passed',
            'registry_tables', 25,
            'migration_applications', 2,
            'private_storage_contract', true,
            'private_storage_bucket', true,
            'append_only_history', true,
            'source_hash_deduplication', true,
            'version_deduplication', true
          );
          SQL

      - name: Install Node dependencies
        run: npm ci

      - name: Run Registry core simulations
        run: npx tsx scripts/run-checklist-registry-core-simulations.ts

      - name: Run 2025 Panini Select WNBA importer simulations
        run: npx tsx scripts/run-checklist-registry-panini-select-wnba-simulations.ts
