name: FBI CIA Full Stack Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbi-cia-full-stack-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
  STRIPE_SECRET_KEY: sk_test_build_only_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
  ADMIN_PASSWORD: build-only-placeholder-password
  ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
  EBAY_CLIENT_ID: build-only-placeholder-client-id
  EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  core-release:
    name: Core release, database, dependencies, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject moderate-or-higher production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Reject high-or-critical vulnerabilities anywhere in the dependency tree
        run: npm audit --audit-level=high
      - name: Validate launch contract
        run: node --import tsx scripts/run-sunday-launch-one-build.ts
      - name: Validate database schema definitions
        run: node scripts/run-launch-database-schema-definition-simulations.mjs
      - name: Validate hardened checkout database functions
        run: node scripts/run-hardened-checkout-function-migration-simulations.mjs
      - name: Validate storefront boundary permissions and security headers
        run: node scripts/run-storefront-boundary-permission-simulations.mjs
      - name: Full repository lint
        run: npm run lint
      - name: Independent production build and TypeScript check
        run: npm run build:isolated

  payments-checkout:
    name: Payments, checkout, offers, refunds and reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts
      - run: node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts
      - run: node --import tsx scripts/run-live-payment-owner-marker-simulations.ts
      - run: node scripts/run-live-money-bootstrap-fail-closed-simulations.mjs
      - run: node scripts/run-launch-readiness-service-role-blocker-simulations.mjs
      - run: node --import tsx scripts/run-public-trust-policy-simulations.ts
      - run: node --import tsx scripts/run-buyer-protection-simulations.ts
      - run: node --import tsx scripts/run-storefront-shipment-protection-simulations.ts
      - run: npm run simulate:admin-payment-simulation-actions
      - run: npm run simulate:admin-financial-reconciliation
      - run: npm run simulate:admin-offer-decision

  shipping-labels:
    name: Shipping prices, dry-run labels, tracking and claims
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Complete shipping calculation and dry-run purchase suite
        run: npm run verify:shipping
      - name: Admin label, tracking, coverage and claim actions
        run: npm run simulate:admin-shipping-actions
      - name: Live shipping launch remains fail closed
        run: npm run simulate:admin-live-launch-gates

  inventory-marketplaces:
    name: Inventory mutations, card intake, eBay and InstaComp
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run simulate:admin-product-bulk
      - run: npm run simulate:admin-product-status
      - run: npm run simulate:ebay-duplicates
      - run: npm run simulate:admin-ebay-actions
      - run: npm run simulate:instacomp-row-actions
      - run: npm run simulate:instacomp-row-removal
      - run: npm run simulate:instacomp-jobs
      - run: npm run simulate:instacomp-accuracy
      - run: npm run simulate:instacomp-consensus
      - run: npm run simulate:instacomp-catalog-identity
      - run: npm run simulate:instacomp-card-knowledge
      - run: npm run simulate:instacomp-identity-guard
      - run: npm run simulate:instacomp-scan-review
      - run: node --import tsx scripts/run-dual-marketplace-audit-simulations.ts
      - run: node --import tsx scripts/run-dual-marketplace-edge-audit-simulations.ts
      - run: node --import tsx scripts/run-dual-marketplace-condition-boundary-audit.ts

  security-access:
    name: Authentication, privileged routes, OAuth and deploy gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run simulate:admin-login
      - run: npm run simulate:privileged-route-auth
      - run: npm run simulate:admin-security-actions
      - run: node scripts/run-privileged-api-route-audit.mjs
      - run: node --import tsx scripts/run-ebay-oauth-state-simulations.ts
      - run: node scripts/audit-vercel-production-environment.mjs --self-test
      - run: node scripts/run-production-deploy-environment-gate-simulations.mjs
      - run: npm run check:production-guardrails

  fulfillment-post-purchase:
    name: Orders, fulfillment, notifications, payouts and buyer lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/run-mobile-buyer-flow-simulations.ts
      - run: node --import tsx scripts/run-post-purchase-buyer-flow-simulations.ts
      - run: npm run simulate:admin-order-review-actions
      - run: npm run simulate:order-review-payout-resolution
      - run: npm run simulate:admin-seller-payout-actions
      - run: npm run verify:admin-dashboard

  live-production-surface:
    name: Live domain, public routes and security headers
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe current production
        env:
          TCOS_AUDIT_ORIGIN: https://truelycollectables.com
        run: node scripts/run-live-production-surface-audit.mjs
