name: Deploy Recently Sold Gallery V2 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-recently-sold-gallery-v2-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-recently-sold-gallery-v2-20260730
  cancel-in-progress: false

jobs:
  deploy-sync-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/deploy-recently-sold-gallery-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: 62185767fb910e2e0ba05a1e5a373994cc251987
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: 62185767fb910e2e0ba05a1e5a373994cc251987
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          test -f src/app/recently-sold/page.tsx
          test -f src/app/components/ProductImageGallery.tsx
          grep -Fq 'href: "/recently-sold", label: "Recently Sold"' src/app/components/Navbar.tsx
          grep -Fq 'ProductImageGallery' src/app/product/'[id]'/page.tsx
          grep -Fq 'ProductImageGallery' src/app/product/'[id]'/layout.tsx
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Vercel and pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/recently-sold-gallery-v2"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/recently-sold-gallery-v2/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/recently-sold-gallery-v2/production.env"

      - name: Retrieve and verify Production Supabase server key
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const workDir = path.join(process.env.RUNNER_TEMP, 'recently-sold-gallery-v2');
          const envPath = path.join(workDir, 'production.env');
          const text = fs.readFileSync(envPath, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const productionUrl = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) {
            throw new Error('Production NEXT_PUBLIC_SUPABASE_URL was not pulled from Vercel.');
          }
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !token) throw new Error('Production Supabase management credentials are unavailable.');

          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          const responseText = await response.text();
          if (!response.ok) {
            throw new Error(`Unable to retrieve Production Supabase API keys: HTTP ${response.status}: ${responseText.slice(0, 1000)}`);
          }
          const keys = JSON.parse(responseText);
          const elevated = Array.isArray(keys)
            ? keys.find((entry) => typeof entry?.api_key === 'string' && entry.api_key.startsWith('sb_secret_'))
              || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase() === 'service_role')
              || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase().includes('service'))
            : null;
          const serviceKey = elevated?.api_key;
          if (!serviceKey) throw new Error('No elevated Supabase server key was returned.');
          console.log('::add-mask::' + serviceKey);

          const testResponse = await fetch(
            `${productionUrl}/rest/v1/products?select=id&limit=1`,
            {
              headers: {
                apikey: serviceKey,
                Authorization: `Bearer ${serviceKey}`,
              },
            },
          );
          const testText = await testResponse.text();
          if (!testResponse.ok) {
            throw new Error(`Elevated Supabase key failed Production REST verification: HTTP ${testResponse.status}: ${testText.slice(0, 1000)}`);
          }
          fs.writeFileSync(path.join(workDir, 'service-role-key'), serviceKey, { mode: 0o600 });
          console.log('Verified Production Supabase server key.');
          NODE

      - name: Ensure Production Vercel has the server key
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/recently-sold-gallery-v2/service-role-key"
          test -s "$key_file"
          service_key="$(cat "$key_file")"
          echo "::add-mask::$service_key"
          printf '%s\n' "$service_key" | npx vercel@56.2.0 env add SUPABASE_SERVICE_ROLE_KEY production \
            --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Reconcile all eBay listing photos into inventory images
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/recently-sold-gallery-v2/service-role-key")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
            node --env-file="$RUNNER_TEMP/recently-sold-gallery-v2/production.env" --import tsx --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          import { syncEbayAllListingImages } from './src/lib/ebay-all-image-sync.ts';
          import { getActiveStoreId } from './src/lib/stores.ts';

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) throw new Error('Production Supabase server credentials are unavailable.');
          const supabase = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const storeId = getActiveStoreId();
          const passes = [];
          for (let pass = 1; pass <= 5; pass += 1) {
            const result = await syncEbayAllListingImages({ supabase, storeId });
            passes.push({
              pass,
              checked: result.checked,
              updated: result.updated,
              imagesAdded: result.imagesAdded,
              imagesRemoved: result.imagesRemoved,
              remainingCandidates: result.remainingCandidates,
              failed: result.errors.length,
              cycleComplete: result.cycleComplete,
            });
            if (!result.cycleComplete) throw new Error(`Image sync page cycle was incomplete on pass ${pass}.`);
            if (result.errors.length) throw new Error(`Image sync had ${result.errors.length} failures on pass ${pass}.`);
            if (result.remainingCandidates === 0) break;
          }
          const finalPass = passes[passes.length - 1];
          if (!finalPass || finalPass.remainingCandidates !== 0) {
            throw new Error('Image sync did not converge to zero remaining candidates.');
          }
          console.log(JSON.stringify({ imageSync: passes }, null, 2));
          NODE

      - name: Measure Production front and back photo coverage
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/recently-sold-gallery-v2/service-role-key")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
            node --env-file="$RUNNER_TEMP/recently-sold-gallery-v2/production.env" --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createClient } from '@supabase/supabase-js';
          import { getActiveStoreId } from './src/lib/stores.ts';

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) throw new Error('Production Supabase server credentials are unavailable.');
          const supabase = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const storeId = getActiveStoreId();

          async function allRows(factory) {
            const rows = [];
            for (let page = 0; page < 50; page += 1) {
              const from = page * 1000;
              const { data, error } = await factory(from, from + 999);
              if (error) throw error;
              const batch = data || [];
              rows.push(...batch);
              if (batch.length < 1000) return rows;
            }
            throw new Error('Production coverage pagination exceeded 50000 rows.');
          }

          const products = await allRows((from, to) =>
            supabase
              .from('products')
              .select('id,title,quantity')
              .eq('store_id', storeId)
              .gt('quantity', 0)
              .order('id', { ascending: true })
              .range(from, to),
          );
          const productIds = new Set(products.map((row) => Number(row.id)));
          const inventory = await allRows((from, to) =>
            supabase
              .from('inventory_items')
              .select('id,legacy_product_id')
              .eq('store_id', storeId)
              .order('id', { ascending: true })
              .range(from, to),
          );
          const activeInventory = inventory.filter((row) => productIds.has(Number(row.legacy_product_id)));
          const images = [];
          for (let offset = 0; offset < activeInventory.length; offset += 20) {
            const ids = activeInventory.slice(offset, offset + 20).map((row) => String(row.id));
            if (!ids.length) continue;
            const { data, error } = await supabase
              .from('inventory_images')
              .select('inventory_item_id,image_url,sort_order')
              .in('inventory_item_id', ids)
              .order('inventory_item_id', { ascending: true })
              .order('sort_order', { ascending: true });
            if (error) throw error;
            images.push(...(data || []));
          }
          const counts = new Map();
          for (const image of images) {
            const id = String(image.inventory_item_id);
            counts.set(id, (counts.get(id) || 0) + 1);
          }
          let noPhoto = 0;
          let frontOnly = 0;
          let frontBack = 0;
          let sampleProductId = null;
          for (const row of activeInventory) {
            const count = counts.get(String(row.id)) || 0;
            if (count === 0) noPhoto += 1;
            else if (count === 1) frontOnly += 1;
            else {
              frontBack += 1;
              if (sampleProductId === null) sampleProductId = Number(row.legacy_product_id);
            }
          }
          if (products.length && activeInventory.length === 0) {
            throw new Error('Active products exist but no bridged inventory rows were found.');
          }
          if (activeInventory.length && frontBack === 0) {
            throw new Error('No active listing has both front and back photos after image reconciliation.');
          }
          const receipt = {
            activeProducts: products.length,
            activeInventoryRows: activeInventory.length,
            noPhoto,
            frontOnly,
            frontBack,
            frontBackPercent: activeInventory.length
              ? Math.round((frontBack / activeInventory.length) * 10000) / 100
              : 0,
            sampleProductId,
            checkedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'recently-sold-gallery-v2', 'coverage.json'),
            JSON.stringify(receipt, null, 2),
          );
          console.log(JSON.stringify({ photoCoverage: receipt }, null, 2));
          NODE

      - name: Deploy exact merged application to Production
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify live Recently Sold link page and front back gallery
        shell: bash
        run: |
          set -euo pipefail
          sample_id="$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.sampleProductId ? String(r.sampleProductId) : "")' "$RUNNER_TEMP/recently-sold-gallery-v2/coverage.json")"
          for attempt in $(seq 1 18); do
            shop="$(curl -fsSL --max-time 45 "https://truelycollectables.com/shop?gallery_verify=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            sold="$(curl -fsSL --max-time 45 "https://truelycollectables.com/recently-sold?gallery_verify=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            product=""
            if [ -n "$sample_id" ]; then
              product="$(curl -fsSL --max-time 45 "https://truelycollectables.com/product/${sample_id}?gallery_verify=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            fi
            if [ -n "$shop" ] \
              && grep -Fq 'Recently Sold' <<<"$shop" \
              && [ -n "$sold" ] \
              && grep -Fq 'Recently Sold — See What You Missed' <<<"$sold" \
              && { [ -z "$sample_id" ] || { grep -Fq 'Front photo' <<<"$product" && grep -Fq 'Back photo' <<<"$product"; }; }; then
              echo "Live Recently Sold and front/back gallery verified on attempt ${attempt}."
              cat "$RUNNER_TEMP/recently-sold-gallery-v2/coverage.json"
              exit 0
            fi
            sleep 10
          done
          echo "Live Recently Sold or front/back gallery verification failed." >&2
          exit 1

      - name: Remove temporary Production environment files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/recently-sold-gallery-v2/production.env"
          rm -f "$RUNNER_TEMP/recently-sold-gallery-v2/service-role-key"
          rm -f "$RUNNER_TEMP/recently-sold-gallery-v2/coverage.json"
