name: Supabase Obsolete Exporter Cleanup

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete queued exporter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN=31920997543
          code=$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN/cancel")
          echo "cancel obsolete run $RUN -> HTTP $code"
          rm -f /tmp/cancel.txt
          case "$code" in 202|409) exit 0;; *) exit 1;; esac
