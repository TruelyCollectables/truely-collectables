name: Market Intel Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate InstaComp Duck.ai witness
        run: node --import tsx scripts/run-instacomp-duck-ai-witness-simulations.ts

      - name: Capture eBay validation diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > ebay-admin-validation.log
          echo "=== integrity workflow command ===" | tee -a ebay-admin-validation.log
          grep -R -n -B 4 -A 8 "Validate eBay admin client" .github/workflows 2>&1 | tee -a ebay-admin-validation.log
          echo "=== simulate:admin-ebay-actions ===" | tee -a ebay-admin-validation.log
          npm run simulate:admin-ebay-actions 2>&1 | tee -a ebay-admin-validation.log
          echo "exit=$?" | tee -a ebay-admin-validation.log
          echo "=== simulate:admin-market-intel-ebay-comps ===" | tee -a ebay-admin-validation.log
          npm run simulate:admin-market-intel-ebay-comps 2>&1 | tee -a ebay-admin-validation.log
          echo "exit=$?" | tee -a ebay-admin-validation.log
          echo "=== simulate:ebay-duplicates ===" | tee -a ebay-admin-validation.log
          npm run simulate:ebay-duplicates 2>&1 | tee -a ebay-admin-validation.log
          echo "exit=$?" | tee -a ebay-admin-validation.log
          exit 0

      - name: Upload eBay validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebay-admin-validation-log
          path: ebay-admin-validation.log
          if-no-files-found: error

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://example.com
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee market-intel-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intel-build-log
          path: market-intel-build.log
          if-no-files-found: warn
