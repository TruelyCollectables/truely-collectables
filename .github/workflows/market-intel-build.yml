name: Supabase Backup Pressure Relief

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read
  actions: write

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz

jobs:
  relieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Cancel stale database-heavy backup runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for RUN in 31919372290 31918164539; do
            code=$(curl -sS -o /tmp/cancel-$RUN.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN/cancel")
            echo "cancel run $RUN -> HTTP $code"
          done
          rm -f /tmp/cancel-*.txt

      - name: Verify Supabase project metadata remains healthy
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 20
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")
          status=$(jq -r '.status // "UNKNOWN"' /tmp/project.json)
          echo "Supabase project metadata: HTTP $code status=$status"
          rm -f /tmp/project.json
          [ "$code" = 200 ]
