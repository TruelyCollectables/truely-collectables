name: Supabase App-Credential Recovery Probe

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated recovery branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Link retired Vercel project for credential recovery only
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN}"
          npx --yes vercel@58.10.0 link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color >/dev/null
          echo 'Vercel project linked locally for environment recovery; no deployment created.'

      - name: Probe database using recovered production environment
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cat > /tmp/tc-db-probe.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          DB_URL="${DATABASE_URL:-${POSTGRES_URL:-${POSTGRES_URL_NON_POOLING:-}}}"
          [ -n "$DB_URL" ] || { echo 'No database connection variable was injected.'; exit 20; }
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || { echo 'SUPABASE_SERVICE_ROLE_KEY was not injected.'; exit 21; }
          [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || { echo 'NEXT_PUBLIC_SUPABASE_URL was not injected.'; exit 22; }
          echo 'Required production database + Supabase service credentials are present; values not printed.'
          if timeout 35s psql "$DB_URL" -Atqc 'select 1' >/dev/null 2>/tmp/tc-db-probe.err; then
            echo 'Production database credential SQL connection PASS.'
            printf 'database_credential=present\nservice_role=present\nsupabase_url=present\nsql_connection=PASS\n' > /tmp/probe-summary.txt
          else
            echo 'Production database credential exists but SQL connection failed.'
            exit 23
          fi
          SH
          chmod 700 /tmp/tc-db-probe.sh
          npx --yes vercel@58.10.0 env run -e production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" -- /tmp/tc-db-probe.sh
          rm -f /tmp/tc-db-probe.sh /tmp/tc-db-probe.err

      - name: Upload safe probe receipt
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-supabase-app-credential-probe-2026-08-15
          path: /tmp/probe-summary.txt
          if-no-files-found: error
          retention-days: 1
