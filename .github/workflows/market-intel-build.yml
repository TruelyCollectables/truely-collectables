name: Supabase Ephemeral Login Backup Retry

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retry ephemeral database login after exporter cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN}"
          REF="$SUPABASE_PROJECT_REF"
          API="https://api.supabase.com/v1/projects/$REF"
          HDR="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          cleanup() {
            curl -sS -X DELETE "$API/cli/login-role" -H "$HDR" >/dev/null 2>&1 || true
            rm -f /tmp/login.json /tmp/pooler.json /tmp/dsn.txt /tmp/psql.err /tmp/dump.err
          }
          trap cleanup EXIT

          SUCCESS=0
          for ATTEMPT in 1 2 3; do
            code=$(curl --max-time 40 -sS -o /tmp/login.json -w '%{http_code}' -X POST "$API/cli/login-role" \
              -H "$HDR" -H 'Content-Type: application/json' -d '{"read_only":false}' || true)
            echo "ephemeral login attempt $ATTEMPT -> HTTP $code"
            if [ "$code" = 200 ] || [ "$code" = 201 ]; then SUCCESS=1; break; fi
            sleep 10
          done
          [ "$SUCCESS" = 1 ] || { echo 'Ephemeral login API still unavailable after cleanup.'; exit 20; }

          code=$(curl --max-time 25 -sS -o /tmp/pooler.json -w '%{http_code}' "$API/config/database/pooler" -H "$HDR" || true)
          [ "$code" = 200 ] || { echo "Pooler config HTTP $code"; exit 21; }
          ROLE=$(jq -r '.role // empty' /tmp/login.json)
          PASS=$(jq -r '.password // empty' /tmp/login.json)
          TTL=$(jq -r '.ttl_seconds // 0' /tmp/login.json)
          HOST=$(jq -r '.[0].db_host // .[0].host // empty' /tmp/pooler.json)
          [ -n "$ROLE" ] && [ -n "$PASS" ] && [ -n "$HOST" ]
          echo "Ephemeral login issued; ttl_seconds=$TTL; no credential values printed."

          export PGPASSWORD="$PASS"
          CONNECTED=0
          WORKING_USER=''
          for USER in "$ROLE.$REF" "$ROLE"; do
            if timeout 25s psql "host=$HOST port=5432 dbname=postgres user=$USER sslmode=require connect_timeout=10" -Atqc 'select 1' >/dev/null 2>/tmp/psql.err; then
              CONNECTED=1; WORKING_USER="$USER"; break
            fi
          done
          [ "$CONNECTED" = 1 ] || { echo 'Ephemeral role issued but session-pooler connection failed.'; exit 22; }
          echo 'Session-pooler SQL connection PASS.'

          node -e 'const fs=require("fs"); const [u,p,h]=process.argv.slice(1); fs.writeFileSync("/tmp/dsn.txt",`postgresql://${encodeURIComponent(u)}:${encodeURIComponent(p)}@${h}:5432/postgres?sslmode=require`,{mode:0o600})' "$WORKING_USER" "$PASS" "$HOST"
          DSN=$(cat /tmp/dsn.txt)
          timeout 6m npx --yes supabase@latest db dump --db-url "$DSN" --schema public -f /tmp/public-schema-probe.sql >/dev/null 2>/tmp/dump.err
          [ -s /tmp/public-schema-probe.sql ]
          SIZE=$(wc -c < /tmp/public-schema-probe.sql)
          TABLES=$(grep -c '^CREATE TABLE' /tmp/public-schema-probe.sql || true)
          printf 'ephemeral_login=PASS\nsession_pooler=PASS\npublic_schema_dump=PASS\npublic_schema_bytes=%s\ncreate_table_statements=%s\n' "$SIZE" "$TABLES" > /tmp/probe-summary.txt
          echo "Logical schema probe PASS: bytes=$SIZE tables=$TABLES"

      - name: Upload safe retry receipt
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-supabase-clean-retry-2026-08-15
          path: |
            /tmp/probe-summary.txt
            /tmp/public-schema-probe.sql
          if-no-files-found: error
          retention-days: 1
