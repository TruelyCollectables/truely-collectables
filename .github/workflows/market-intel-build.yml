name: Supabase Independent Disaster Recovery Snapshot

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
  PINNED_MAIN_SHA: 7659fe3da536f8ce48f0b14b2a17b2ec09831a07

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pinned production source for schema inventory
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_MAIN_SHA }}
          fetch-depth: 1
          path: pinned-source

      - name: Require Supabase management access
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 2; }
          echo 'Supabase management credential is available; secret values will not be printed.'

      - name: Install isolated Supabase client
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/tc-supabase-tool
          cd /tmp/tc-supabase-tool
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @supabase/supabase-js@2

      - name: Export application data, auth users, and Storage objects
        shell: bash
        continue-on-error: true
        run: |
          set -u
          umask 077
          mkdir -p /tmp/tc-supabase-independent/{data,auth,storage/objects,metadata}
          cd /tmp/tc-supabase-tool
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';

          const ref = process.env.SUPABASE_PROJECT_REF;
          const mgmt = process.env.SUPABASE_ACCESS_TOKEN;
          const apiUrl = `https://${ref}.supabase.co`;
          const sourceRoot = path.join(process.env.GITHUB_WORKSPACE, 'pinned-source');
          const root = '/tmp/tc-supabase-independent';
          const dataDir = path.join(root, 'data');
          const authDir = path.join(root, 'auth');
          const objectDir = path.join(root, 'storage', 'objects');
          const metaDir = path.join(root, 'metadata');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const safe = s => String(s).replace(/[^A-Za-z0-9._-]+/g, '_');

          const manifest = {
            schema: 'truelycollectables.supabase-independent-backup.v2',
            createdAt: new Date().toISOString(), projectRef: ref, pinnedMainSha: process.env.PINNED_MAIN_SHA,
            sourceTablesDiscovered: 0, tablesExported: 0, rowsExported: 0,
            authUsersExported: 0, storageBuckets: 0, storageObjects: 0, storageBytes: 0,
            tableErrors: [], authErrors: [], storageErrors: [], tables: [], buckets: [], objects: []
          };
          const writeManifest = () => {
            fs.writeFileSync(path.join(metaDir,'manifest.json'), JSON.stringify(manifest,null,2)+'\n',{mode:0o600});
            fs.writeFileSync(path.join(metaDir,'summary.txt'), [
              `createdAt=${manifest.createdAt}`,
              `sourceTablesDiscovered=${manifest.sourceTablesDiscovered}`,
              `tablesExported=${manifest.tablesExported}`,
              `rowsExported=${manifest.rowsExported}`,
              `tableErrors=${manifest.tableErrors.length}`,
              `authUsersExported=${manifest.authUsersExported}`,
              `authErrors=${manifest.authErrors.length}`,
              `storageBuckets=${manifest.storageBuckets}`,
              `storageObjects=${manifest.storageObjects}`,
              `storageBytes=${manifest.storageBytes}`,
              `storageErrors=${manifest.storageErrors.length}`
            ].join('\n')+'\n',{mode:0o600});
          };

          async function retrySdk(label, fn, attempts=8) {
            let last;
            for (let i=0;i<attempts;i++) {
              try {
                const r=await fn();
                if (!r?.error) return r;
                last=r;
                const s=Number(r.error?.status||r.error?.statusCode||0);
                if (![429,500,502,503,504,520,522,524,544].includes(s)) return r;
              } catch(e) { last={data:null,error:e}; }
              if(i===0) console.log(`${label}: provider busy; retrying.`);
              await sleep(Math.min(12000,1000*2**Math.min(i,4)));
            }
            return last||{data:null,error:new Error(`${label}: attempts exhausted`)};
          }

          try {
            const kr=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${mgmt}`,'Content-Type':'application/json'}});
            if(!kr.ok) throw new Error(`Management API key retrieval failed HTTP ${kr.status}`);
            const keys=await kr.json();
            const legacy=keys.find(k=>String(k?.name||'').toLowerCase()==='service_role'&&k?.api_key);
            const modern=keys.find(k=>String(k?.type||'').toLowerCase()==='secret'&&k?.api_key)||keys.find(k=>String(k?.api_key||'').startsWith('sb_secret_'));
            const serverKey=String((legacy||modern)?.api_key||'');
            if(!serverKey) throw new Error('No server-side API key resolved');
            console.log('Resolved server-side Supabase access; value is intentionally not printed.');
            const supabase=createClient(apiUrl,serverKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});

            // Derive the table inventory from the exact pinned production SQL migrations, avoiding PostgREST OpenAPI discovery.
            const sqlFiles=[];
            const walk=d=>{ for(const ent of fs.readdirSync(d,{withFileTypes:true})) { const p=path.join(d,ent.name); if(ent.isDirectory()) walk(p); else if(ent.isFile()&&p.endsWith('.sql')) sqlFiles.push(p); } };
            walk(sourceRoot);
            const tables=new Set();
            const re=/create\s+table\s+(?:if\s+not\s+exists\s+)?(?:(?:public\.)?"?([A-Za-z_][A-Za-z0-9_]*)"?)/ig;
            for(const f of sqlFiles){ let text=''; try{text=fs.readFileSync(f,'utf8')}catch{}; let m; while((m=re.exec(text))) { if(!['if','public'].includes(m[1].toLowerCase())) tables.add(m[1]); } }
            const tableList=[...tables].sort();
            manifest.sourceTablesDiscovered=tableList.length;
            fs.writeFileSync(path.join(metaDir,'source-derived-tables.txt'),tableList.join('\n')+'\n',{mode:0o600});

            for(const table of tableList){
              const out=fs.createWriteStream(path.join(dataDir,`${safe(table)}.jsonl`),{mode:0o600});
              let offset=0, rowsWritten=0, complete=true;
              const pageSize=1000;
              for(;;){
                const r=await retrySdk(`table ${table} offset ${offset}`,()=>supabase.from(table).select('*').range(offset,offset+pageSize-1));
                if(r?.error){ manifest.tableErrors.push({table,offset,error:r.error.message||String(r.error),status:r.error.status||r.error.statusCode||null}); complete=false; break; }
                const rows=Array.isArray(r.data)?r.data:[];
                for(const row of rows) out.write(JSON.stringify(row)+'\n');
                rowsWritten+=rows.length; manifest.rowsExported+=rows.length;
                if(rows.length<pageSize) break;
                offset+=rows.length;
                if(offset>5000000){manifest.tableErrors.push({table,offset,error:'5,000,000-row safety cap'});complete=false;break;}
              }
              await new Promise(resolve=>out.end(resolve));
              manifest.tables.push({table,rows:rowsWritten,file:`data/${safe(table)}.jsonl`,complete});
              if(complete) manifest.tablesExported++;
              if(manifest.tables.length%25===0){writeManifest();console.log(`Table progress ${manifest.tables.length}/${tableList.length}`);}
            }

            const authOut=fs.createWriteStream(path.join(authDir,'users.jsonl'),{mode:0o600});
            for(let page=1;;page++){
              const r=await retrySdk(`auth users ${page}`,()=>supabase.auth.admin.listUsers({page,perPage:1000}));
              if(r?.error){manifest.authErrors.push({page,error:r.error.message||String(r.error),status:r.error.status||null});break;}
              const users=r?.data?.users||[]; for(const u of users) authOut.write(JSON.stringify(u)+'\n'); manifest.authUsersExported+=users.length; if(users.length<1000)break;
            }
            await new Promise(resolve=>authOut.end(resolve));

            const clean=s=>String(s||'').replace(/[\\/\0]/g,'_')||'_';
            const dest=(bucket,obj)=>{const bd=path.join(objectDir,clean(bucket));let t=path.join(bd,...String(obj).split('/').map(clean));const base=path.resolve(bd)+path.sep;if(!path.resolve(t).startsWith(base))t=path.join(bd,'_hashed',crypto.createHash('sha256').update(obj).digest('hex')+path.extname(obj).slice(0,20));return t;};
            const br=await retrySdk('list storage buckets',()=>supabase.storage.listBuckets({limit:1000,offset:0}),12);
            if(br?.error){manifest.storageErrors.push({operation:'listBuckets',error:br.error.message||String(br.error),status:br.error.status||br.error.statusCode||null});}
            else{
              const buckets=br.data||[]; manifest.storageBuckets=buckets.length;
              async function listFolder(bucket,prefix=''){
                let offset=0; const limit=1000;
                for(;;){
                  const lr=await retrySdk(`storage list ${bucket}/${prefix}`,()=>supabase.storage.from(bucket).list(prefix,{limit,offset,sortBy:{column:'name',order:'asc'}}),12);
                  if(lr?.error){manifest.storageErrors.push({bucket,prefix,operation:'list',error:lr.error.message||String(lr.error),status:lr.error.status||lr.error.statusCode||null});return;}
                  const entries=lr.data||[];
                  for(const item of entries){
                    const obj=prefix?`${prefix}/${item.name}`:item.name;
                    if(item.id===null||item.id===undefined){await listFolder(bucket,obj);continue;}
                    const dr=await retrySdk(`storage download ${bucket}/${obj}`,()=>supabase.storage.from(bucket).download(obj),12);
                    if(dr?.error||!dr?.data){manifest.storageErrors.push({bucket,path:obj,operation:'download',error:dr?.error?.message||'No data',status:dr?.error?.status||dr?.error?.statusCode||null});continue;}
                    const bytes=Buffer.from(await dr.data.arrayBuffer()); const target=dest(bucket,obj); fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700}); fs.writeFileSync(target,bytes,{mode:0o600});
                    manifest.storageObjects++; manifest.storageBytes+=bytes.length; manifest.objects.push({bucket,path:obj,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),localPath:path.relative(root,target),metadata:item.metadata||null,createdAt:item.created_at||null,updatedAt:item.updated_at||null});
                  }
                  if(entries.length<limit)break; offset+=entries.length;
                }
              }
              for(const b of buckets){manifest.buckets.push({id:b.id,name:b.name,public:b.public,fileSizeLimit:b.file_size_limit??null,allowedMimeTypes:b.allowed_mime_types??null,createdAt:b.created_at??null,updatedAt:b.updated_at??null});await listFolder(b.id,'');writeManifest();}
            }
          } catch(e) {
            manifest.tableErrors.push({fatal:true,error:e?.message||String(e)});
          }
          writeManifest();
          console.log(`Snapshot staged: tables=${manifest.tablesExported}/${manifest.sourceTablesDiscovered}, rows=${manifest.rowsExported}, authUsers=${manifest.authUsersExported}, buckets=${manifest.storageBuckets}, objects=${manifest.storageObjects}, tableErrors=${manifest.tableErrors.length}, storageErrors=${manifest.storageErrors.length}`);
          NODE

      - name: Encrypt staged Supabase recovery snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          tar -C /tmp -czf /tmp/TruelyCollectables-supabase-independent-2026-08-15.tar.gz tc-supabase-independent
          openssl rand -base64 48 > /tmp/TruelyCollectables-supabase-independent-2026-08-15.recovery-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 310000 -md sha256 -in /tmp/TruelyCollectables-supabase-independent-2026-08-15.tar.gz -out /tmp/TruelyCollectables-supabase-independent-2026-08-15.tar.gz.enc -pass file:/tmp/TruelyCollectables-supabase-independent-2026-08-15.recovery-key.txt
          sha256sum /tmp/TruelyCollectables-supabase-independent-2026-08-15.tar.gz.enc > /tmp/TruelyCollectables-supabase-independent-2026-08-15.sha256
          rm -f /tmp/TruelyCollectables-supabase-independent-2026-08-15.tar.gz

      - name: Upload encrypted independent Supabase backup
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-supabase-independent-encrypted-2026-08-15
          path: |
            /tmp/TruelyCollectables-supabase-independent-2026-08-15.tar.gz.enc
            /tmp/TruelyCollectables-supabase-independent-2026-08-15.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload independent Supabase recovery key separately
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-supabase-independent-recovery-key-2026-08-15
          path: /tmp/TruelyCollectables-supabase-independent-2026-08-15.recovery-key.txt
          if-no-files-found: error
          retention-days: 1
