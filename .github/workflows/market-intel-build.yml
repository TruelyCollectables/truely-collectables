name: Supabase Targeted SQL Recovery Probe

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run safe targeted SQL probes
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ref=process.env.SUPABASE_PROJECT_REF;
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token) throw new Error('Missing SUPABASE_ACCESS_TOKEN');
          const url=`https://api.supabase.com/v1/projects/${ref}/database/query/read-only`;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function q(name,query,ms=20000){
            const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
            const started=Date.now();
            try{
              const r=await fetch(url,{method:'POST',headers,body:JSON.stringify({query,parameters:[]}),signal:c.signal});
              const text=await r.text(); let body; try{body=JSON.parse(text)}catch{body=text}
              const out={name,status:r.status,ok:r.ok,ms:Date.now()-started,body};
              fs.writeFileSync(`/tmp/${name}.json`,JSON.stringify(out,null,2)+'\n',{mode:0o600});
              console.log(`${name}: status=${r.status} ok=${r.ok} ms=${out.ms} resultItems=${Array.isArray(body)?body.length:'n/a'}`);
            }catch(e){
              const out={name,status:0,ok:false,ms:Date.now()-started,error:e.name+': '+e.message};
              fs.writeFileSync(`/tmp/${name}.json`,JSON.stringify(out,null,2)+'\n',{mode:0o600});
              console.log(`${name}: aborted/error after ${out.ms}ms`);
            }finally{clearTimeout(t)}
          }
          await q('current-db','select current_database() as db, now() as now');
          await q('public-table-names',`select c.relname as table_name from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') order by c.relname`,30000);
          await q('products-count','select count(*)::bigint as count from public.products',30000);
          await q('products-one','select row_to_json(t) as row from (select * from public.products limit 1) t',30000);
          await q('storage-buckets-count','select count(*)::bigint as count from storage.buckets',30000);
          await q('storage-objects-count','select count(*)::bigint as count from storage.objects',30000);
          NODE

      - name: Upload safe probe receipts
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-supabase-targeted-sql-probe-2026-08-15
          path: /tmp/*.json
          if-no-files-found: error
          retention-days: 1
