name: Supabase Production Restart Recover

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/supabase-production-restart-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Restart Production project and prove database recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o evidence/projects.json https://api.supabase.com/v1/projects
          mapfile -t refs < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' evidence/projects.json)
          test "${#refs[@]}" -eq 1
          ref="${refs[0]}"
          echo "$ref" > evidence/project-ref.txt

          echo 'Restarting Supabase Production project.'
          code="$(curl --silent --show-error --max-time 45 \
            -X POST -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -o evidence/restart.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/$ref/restart")"
          echo "$code" > evidence/restart.status
          test "$code" = '200'

          recovered=0
          for attempt in $(seq 1 36); do
            sleep 10
            project_code="$(curl --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
              -o evidence/project-current.json -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/$ref" || true)"
            project_status="$(jq -r '.status // "UNKNOWN"' evidence/project-current.json 2>/dev/null || echo UNKNOWN)"
            echo "Recovery probe $attempt: project HTTP=$project_code status=$project_status"

            jq -cn '{query:"select 1 as ok;",read_only:true}' > evidence/smoke-query.json
            query_code="$(curl --silent --show-error --max-time 30 \
              -X POST -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @evidence/smoke-query.json \
              -o evidence/smoke-result.json -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/$ref/database/query" || true)"
            echo "$query_code" > evidence/smoke-result.status
            if [[ "$query_code" =~ ^20[01]$ ]] && jq -e '.[0].ok == 1' evidence/smoke-result.json >/dev/null 2>&1; then
              echo "Database recovered on probe $attempt."
              recovered=1
              break
            fi
            echo "Database not ready yet: HTTP=$query_code $(cat evidence/smoke-result.json 2>/dev/null | head -c 500 || true)"
          done
          test "$recovered" = '1'
          rm -f evidence/projects.json evidence/smoke-query.json
          jq . evidence/project-current.json || true
          jq . evidence/smoke-result.json
      - name: Upload restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-restart-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30

# Trigger the controlled restart after the writer was paused.
