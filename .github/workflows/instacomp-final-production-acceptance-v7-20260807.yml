name: InstaComp Final Production Acceptance V7 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-final-production-acceptance-v7-20260807.yml"
      - "scripts/ops/run-instacomp-final-production-acceptance.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-final-production-acceptance-v7-20260807
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: ops/instacomp-final-production-acceptance-v7-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  FINAL_REPAIR_COMMIT: d0526bd8e8b4de809045fb39bb89b3aeffa78537
  CERTIFIED_MAC_FINGERPRINT: d1f81dfa0054a5b1ca36f32c0f32c5c03f09a2de507e69041815861385878be3
  EVIDENCE_DIR: evidence/instacomp-final-production-acceptance-v7-20260807
  TEMP_DIR: /tmp/instacomp-final-production-acceptance-v7-20260807

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Freeze current main and prove certified scanner source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          frozen_main_sha="$(git rev-parse origin/main)"
          test -n "$frozen_main_sha"
          git merge-base --is-ancestor "$FINAL_REPAIR_COMMIT" "$frozen_main_sha"
          scanner_drift="$(git diff --name-only "$FINAL_REPAIR_COMMIT".."$frozen_main_sha" -- \
            services/instacomp-ai/app/main.py \
            services/instacomp-ai/app/local_vision.py \
            services/instacomp-ai/app/ollama.py \
            services/instacomp-ai/app/runtime_identity.py \
            src/app/api/instacomp/scan/route.ts \
            src/lib/instacomp-ai-local.ts \
            src/lib/instacomp-consensus.ts \
            src/lib/instacomp-learning-server.ts \
            src/lib/instacomp-checklist-first-server.ts \
            src/lib/instacomp-checklist-first.ts)"
          test -z "$scanner_drift"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$frozen_main_sha"
          changed="$(git diff --name-only "$frozen_main_sha"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/instacomp-final-production-acceptance-v7-20260807.yml' \
            'scripts/ops/run-instacomp-final-production-acceptance.mjs' | sort)"
          test "$changed" = "$expected"
          runner=scripts/ops/run-instacomp-final-production-acceptance.mjs
          grep -Fq 'imageTruthArtifactId: 8994498762' "$runner"
          grep -Fq 'registryCandidateArtifactId: 8993929571' "$runner"
          grep -Fq 'answerKeyMode: "fixed_external_truth_not_inventory_title_or_metadata"' "$runner"
          fp="$(python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          root=Path('services/instacomp-ai')
          d=sha256()
          for rel in ('app/main.py','app/local_vision.py','app/ollama.py'):
              d.update(rel.encode()); d.update(b'\0'); d.update((root/rel).read_bytes()); d.update(b'\0')
          print(d.hexdigest())
          PY
          )"
          test "$fp" = "$CERTIFIED_MAC_FINGERPRINT"
          echo "FROZEN_MAIN_SHA=$frozen_main_sha" >> "$GITHUB_ENV"
          echo "EXPECTED_MAC_FINGERPRINT=$fp" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR"
          printf '{"acceptanceSource":"%s","frozenMain":"%s","finalRepair":"%s","expectedMacFingerprint":"%s"}\n' \
            "$(git rev-parse HEAD)" "$frozen_main_sha" "$FINAL_REPAIR_COMMIT" "$fp" > "$EVIDENCE_DIR/source-lock.json"

      - name: Read-only exact Mac preflight
        shell: bash
        run: |
          set -euo pipefail
          out="$EVIDENCE_DIR/readiness-preflight.json"
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?v7=preflight&ts=$(date +%s)")"
          test "$code" = "200"
          node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const k of ["ok","configured","reachable","internalMemoryReady","checklistReady","localModelReady"])if(b[k]!==true)throw new Error(`${k}=${b[k]}`);if(b.runtimeSourceFingerprint!==process.argv[2])throw new Error(`fingerprint=${b.runtimeSourceFingerprint}`);' "$out" "$EXPECTED_MAC_FINGERPRINT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          npm ci
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Resolve Production Supabase proof credentials
        shell: bash
        run: |
          set -euo pipefail
          env_file="$TEMP_DIR/production.env"
          runtime_file="$TEMP_DIR/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node -e 'const fs=require("node:fs");const p={};for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,"utf8").split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith("#"))continue;const i=line.indexOf("=");if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith("\"")&&v.endsWith("\"")){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}p[k]=v}(async()=>{const u=String(p.NEXT_PUBLIC_SUPABASE_URL||"").trim();if(!u)throw new Error("Missing Production Supabase URL");const ref=new URL(u).hostname.split(".")[0];const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});const text=await r.text();if(!r.ok)throw new Error(`Supabase key lookup HTTP ${r.status}`);const keys=text?JSON.parse(text):[];const val=e=>String(e?.api_key||e?.key||e?.value||"");const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));const legacy=keys.find(e=>e?.name==="service_role"&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==="service_role"&&/^eyJ/.test(val(e)));const key=val(modern||legacy);if(!key)throw new Error("No Production server key");console.log(`::add-mask::${u}`);console.log(`::add-mask::${key}`);fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(u)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(key)}\n`,{mode:0o600})})().catch(e=>{console.error(e);process.exit(1)});'

      - name: Clear stale acceptance token and deploy clean frozen source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1
          set -e
          log="$EVIDENCE_DIR/pretest-clean-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          grep -Fq "InstaComp release manifest bound to $(git rev-parse HEAD)." "$log"

      - name: Provision isolated acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy frozen source with isolated acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          log="$EVIDENCE_DIR/acceptance-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          grep -Fq "InstaComp release manifest bound to $(git rev-parse HEAD)." "$log"
          touch "$TEMP_DIR/acceptance-deployed"

      - name: Re-prove exact Mac before scans
        shell: bash
        run: |
          set -euo pipefail
          out="$EVIDENCE_DIR/readiness-before-scans.json"
          ok=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?v7=before&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(b.ok!==true||b.runtimeSourceFingerprint!==process.argv[2])process.exit(1);' "$out" "$EXPECTED_MAC_FINGERPRINT"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Frozen five pass 1
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-1.json" pass-1

      - name: Strict pass 1 validation
        shell: bash
        run: |
          set -euo pipefail
          node - "$EVIDENCE_DIR/receipt-pass-1.json" <<'NODE'
          const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const fps={'2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f':'4366f96b6cf8b136e5ae4da70c35539d56e1793de0a42bcccbf970a892791e59','bde0577b-72e8-4e59-8287-89aaf2f9e7e2':'112f66efaa6b13de4f33e18f632a5c364c8bd2895b610d157a538748c858ba32','c58ffc4f-e1c7-4cd9-b6e2-599af5a29044':'dd4d9c92ff0cc4b985ef0b3aa29c8bcfb882ffe27021aa8809fde3c97db7a2ad','575556fe-fdd4-4083-baee-c5071ed3161f':'66531f084322d986e26c569e12a152bada033904c67b7068c00572c3efaa7d42','70ad307e-06bb-45c2-90ea-689b6e2f302e':'bdbf4845dae6d1da4d783fd23d9c387883769cd68aee3c663b144013bb891028'};
          const norm=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,' ');
          if(r.status!=='passed'||r.testedCards!==5||r.passedCards!==5||r.results?.length!==5)throw new Error('pass1 not exact 5/5');
          for(const x of r.results){if(norm(x.actual?.setName)!==norm(x.expected?.setName))throw new Error(`set mismatch card ${x.position}`);if(x.actual?.registryFingerprintSha256!==fps[x.expected?.registryIdentityId])throw new Error(`fingerprint mismatch card ${x.position}`);let c=Number(x.actual?.identityConfidence);if(c>1)c/=100;if(!Number.isFinite(c)||c<0.95)throw new Error(`confidence <95 card ${x.position}: ${x.actual?.identityConfidence}`)}
          console.log('PASS strict pass1 exact set/fingerprint/confidence');
          NODE

      - name: Frozen five pass 2
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          export INSTACOMP_ACCEPTANCE_SERVICE_TOKEN="$token"
          node scripts/ops/run-instacomp-final-production-acceptance.mjs "$EVIDENCE_DIR/receipt-pass-2.json" pass-2

      - name: Strict pass 2 validation
        shell: bash
        run: |
          set -euo pipefail
          node - "$EVIDENCE_DIR/receipt-pass-2.json" <<'NODE'
          const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const fps={'2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f':'4366f96b6cf8b136e5ae4da70c35539d56e1793de0a42bcccbf970a892791e59','bde0577b-72e8-4e59-8287-89aaf2f9e7e2':'112f66efaa6b13de4f33e18f632a5c364c8bd2895b610d157a538748c858ba32','c58ffc4f-e1c7-4cd9-b6e2-599af5a29044':'dd4d9c92ff0cc4b985ef0b3aa29c8bcfb882ffe27021aa8809fde3c97db7a2ad','575556fe-fdd4-4083-baee-c5071ed3161f':'66531f084322d986e26c569e12a152bada033904c67b7068c00572c3efaa7d42','70ad307e-06bb-45c2-90ea-689b6e2f302e':'bdbf4845dae6d1da4d783fd23d9c387883769cd68aee3c663b144013bb891028'};
          const norm=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,' ');
          if(r.status!=='passed'||r.testedCards!==5||r.passedCards!==5||r.results?.length!==5)throw new Error('pass2 not exact 5/5');
          for(const x of r.results){if(norm(x.actual?.setName)!==norm(x.expected?.setName))throw new Error(`set mismatch card ${x.position}`);if(x.actual?.registryFingerprintSha256!==fps[x.expected?.registryIdentityId])throw new Error(`fingerprint mismatch card ${x.position}`);let c=Number(x.actual?.identityConfidence);if(c>1)c/=100;if(!Number.isFinite(c)||c<0.95)throw new Error(`confidence <95 card ${x.position}: ${x.actual?.identityConfidence}`)}
          console.log('PASS strict pass2 exact set/fingerprint/confidence');
          NODE

      - name: Remove isolated acceptance credential
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          removed=0
          for attempt in 1 2 3; do
            if npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then removed=1; break; fi
            sleep 3
          done
          test "$removed" = "1"
          touch "$TEMP_DIR/token-removed"

      - name: Clean redeploy tested source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          test -f "$TEMP_DIR/token-removed"
          log="$EVIDENCE_DIR/clean-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          grep -Fq "InstaComp release manifest bound to $(git rev-parse HEAD)." "$log"
          touch "$TEMP_DIR/clean-deployed"

      - name: Prove clean Production and dead token
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          test -f "$TEMP_DIR/clean-deployed"
          out="$EVIDENCE_DIR/readiness-clean.json"
          ok=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?v7=clean&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(b.ok!==true||b.runtimeSourceFingerprint!==process.argv[2])process.exit(1);' "$out" "$EXPECTED_MAC_FINGERPRINT"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          token="$(cat "$TEMP_DIR/acceptance-token")"; echo "::add-mask::$token"
          body="$EVIDENCE_DIR/removed-token-response.json"
          code="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' -X POST -H "x-tcos-instacomp-service-token: $token" -F 'aiCouncilTier=basic' "$PRODUCTION_ORIGIN/api/instacomp/scan")"
          test "$code" = "401" -o "$code" = "403"
          printf '{"ready":true,"runtimeFingerprint":"%s","acceptanceCredentialRemoved":true,"removedTokenHttp":%s}\n' "$EXPECTED_MAC_FINGERPRINT" "$code" > "$EVIDENCE_DIR/clean-production.json"

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-final-production-acceptance-v7-20260807
          path: evidence/instacomp-final-production-acceptance-v7-20260807
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR"
