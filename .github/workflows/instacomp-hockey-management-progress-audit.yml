name: InstaComp Hockey Management Progress Audit

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/instacomp-hockey-management-progress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read current checklist import progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o evidence/projects.json \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select(.name == "TruelyCollectables") | (.id // .ref // empty)' evidence/projects.json)
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          read -r -d '' sql <<'SQL' || true
          select id, release_id, status, is_active, normalized_card_count, normalized_identity_count, created_at
          from public.checklist_versions
          order by created_at desc
          limit 25;
          SQL
          jq -cn --arg query "$sql" '{query:$query,read_only:true}' > evidence/query.json
          code="$(curl --silent --show-error --max-time 45 \
            -X POST -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @evidence/query.json \
            -o evidence/progress.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/$project_ref/database/query" || true)"
          echo "$code" > evidence/status.txt
          echo "HTTP $code"
          cat evidence/progress.json
          echo
          test "$code" = '200'
          jq . evidence/progress.json
      - name: Upload progress audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-hockey-management-progress-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
