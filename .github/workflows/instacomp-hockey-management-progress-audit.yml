name: InstaComp Hockey Management Progress Audit

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/instacomp-hockey-management-progress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read exact 23 residual release progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o evidence/projects.json \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select(.name == "TruelyCollectables") | (.id // .ref // empty)' evidence/projects.json)
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          read -r -d '' sql <<'SQL' || true
          with wanted(slug) as (values
            ('2021-22-upper-deck-skybox-metal-universe-nhl-hockey'),
            ('2022-23-upper-deck-synergy-nhl-hockey'),
            ('2025-26-upper-deck-new-york-rangers-centennial-hockey'),
            ('2023-24-upper-deck-synergy-nhl-hockey'),
            ('2024-25-upper-deck-the-cup-nhl-hockey'),
            ('2024-25-upper-deck-ultimate-collection-nhl-hockey'),
            ('2022-23-upper-deck-ultimate-collection-nhl-hockey'),
            ('2024-25-upper-deck-premier-nhl-hockey'),
            ('2023-24-upper-deck-engrained-nhl-hockey'),
            ('2022-23-upper-deck-spx-nhl-hockey'),
            ('2023-24-upper-deck-spx-nhl-hockey'),
            ('2024-25-upper-deck-spx-nhl-hockey'),
            ('2024-25-upper-deck-credentials-nhl-hockey'),
            ('2023-24-upper-deck-premier-nhl-hockey'),
            ('2022-23-upper-deck-trilogy-nhl-hockey'),
            ('2025-26-upper-deck-sp-game-used-nhl-hockey'),
            ('2024-25-upper-deck-artifacts-nhl-hockey'),
            ('2021-22-upper-deck-o-pee-chee-platinum-nhl-hockey'),
            ('2025-26-upper-deck-allure-nhl-hockey'),
            ('2024-25-upper-deck-o-pee-chee-platinum-nhl-hockey'),
            ('2023-24-upper-deck-o-pee-chee-platinum-nhl-hockey'),
            ('2023-24-upper-deck-artifacts-nhl-hockey'),
            ('2022-23-upper-deck-o-pee-chee-platinum-nhl-hockey')
          )
          select w.slug,
                 exists(
                   select 1 from public.checklist_releases r
                   join public.checklist_versions v on v.release_id=r.id
                   where r.slug=w.slug and v.is_active=true and v.status in ('live','revised')
                     and coalesce(v.normalized_card_count,0)>0 and coalesce(v.normalized_identity_count,0)>0
                 ) as complete
          from wanted w order by w.slug;
          SQL
          jq -cn --arg query "$sql" '{query:$query,read_only:true}' > evidence/query.json
          curl --silent --show-error --fail --retry 4 --retry-all-errors --retry-delay 2 --max-time 60 \
            -X POST -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @evidence/query.json -o evidence/progress.json \
            "https://api.supabase.com/v1/projects/$project_ref/database/query"
          jq -e 'length == 23' evidence/progress.json
          jq '{targetCount:length,liveCount:(map(select(.complete==true))|length),unresolvedCount:(map(select(.complete!=true))|length),unresolved:[.[]|select(.complete!=true)|.slug]}' evidence/progress.json | tee evidence/summary.json
      - name: Upload progress audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-hockey-management-progress-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
