name: InstaComp Pinned Staged Promotion Self Test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-staged-pinned-promotion.yml"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py"
      - "services/instacomp-ai/scripts/repair_trusted_visual_memory.py"
      - "services/instacomp-ai/scripts/run_staged_pinned_promotion.sh"
      - "services/instacomp-ai/tests/test_trusted_visual_memory_parallel_override.py"
      - "services/instacomp-ai/app/**"
      - "services/instacomp-ai/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-contract-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile pinned promotion and visual-memory repair runners
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py \
            services/instacomp-ai/scripts/repair_trusted_visual_memory.py
          bash -n services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
      - name: Prove throttle handling and pinned backfill regression
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py --self-test
      - name: Prove trusted visual-memory hydration and Base-to-Silver merge
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          python services/instacomp-ai/scripts/repair_trusted_visual_memory.py --self-test
          python -m pytest -q services/instacomp-ai/tests/test_trusted_visual_memory_parallel_override.py
      - name: Prove pinned backfill, visual-memory repair, and throttle source contract
        run: |
          grep -q 'PINNED_BACKFILL_POOL_SIZES = {10: 8, 15: 15, 25: 20}' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py
          grep -q 'REQUIRED_NEW_FIXTURES = {10: 5, 15: 10, 25: 20}' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py
          grep -q 'MAX_THROTTLE_WINDOWS_PER_REQUEST = 6' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py
          grep -q 'class RegistryThrottleAbort(BaseException)' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py
          grep -q 'await sleep_fn(delay)' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py
          grep -q 'promotion-v14-pinned-backfill' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q 'promote_lora_candidate_frozen_25_v14.py' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q 'repair_trusted_visual_memory.py' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q 'supervised_203_operator_confirmed' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh

  pinned-contract-macos:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile and prove v14 visual-memory repair on macOS
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py \
            services/instacomp-ai/scripts/repair_trusted_visual_memory.py
          bash -n services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          python services/instacomp-ai/scripts/repair_trusted_visual_memory.py --self-test
          python -m pytest -q services/instacomp-ai/tests/test_trusted_visual_memory_parallel_override.py
          python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py --self-test
