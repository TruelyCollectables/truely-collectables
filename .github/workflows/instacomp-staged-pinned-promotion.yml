name: InstaComp V18 Staged Promotion Self Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-staged-pinned-promotion.yml"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py"
      - "services/instacomp-ai/scripts/run_staged_pinned_promotion.sh"
      - "services/instacomp-ai/scripts/run-staged-learning-from-main.sh"
      - "services/instacomp-ai/scripts/v18-query-guard/**"
      - "services/instacomp-ai/app/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-staged-pinned-promotion.yml"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v17.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v16.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v15.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v9.py"
      - "services/instacomp-ai/scripts/repair_trusted_visual_memory.py"
      - "services/instacomp-ai/scripts/repair_pinned_visual_memory.py"
      - "services/instacomp-ai/scripts/repair_pinned_visual_memory_v15.py"
      - "services/instacomp-ai/scripts/run_staged_pinned_promotion.sh"
      - "services/instacomp-ai/scripts/run-staged-learning-from-main.sh"
      - "services/instacomp-ai/scripts/v18-query-guard/**"
      - "services/instacomp-ai/tests/test_opencv_pattern_native.py"
      - "services/instacomp-ai/tests/test_trusted_visual_memory_parallel_override.py"
      - "services/instacomp-ai/tests/test_prizm_back_mark_guard.py"
      - "services/instacomp-ai/app/**"
      - "services/instacomp-ai/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v18-contract-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile V18 and syntax-check both launchers
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v17.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v15.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py \
            services/instacomp-ai/scripts/v18-query-guard/sitecustomize.py \
            services/instacomp-ai/app/lora_candidate_runtime.py \
            services/instacomp-ai/app/prizm_back_mark_guard.py
          bash -n services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          bash -n services/instacomp-ai/scripts/run-staged-learning-from-main.sh
      - name: Prove query guard cannot poison bootstrap Python stdin
        env:
          INSTACOMP_V18_STAGED_QUERY_GUARD: "1"
          PYTHONPATH: services/instacomp-ai/scripts/v18-query-guard
        run: |
          python - <<'PY'
          import sys
          assert (3, 11) <= sys.version_info[:2] < (3, 14)
          assert "promote_lora_candidate_frozen_25_v10" not in sys.modules
          print("PASS bare stdin runtime probe bypasses the V18 query guard")
          PY
          PYTHONPATH="services/instacomp-ai/scripts/v18-query-guard:services/instacomp-ai:services/instacomp-ai/scripts" \
            python - --self-test <<'PY'
          import promote_lora_candidate_frozen_25_v10 as v10
          assert getattr(v10, "_v18_card_number_guard_installed", False) is True
          print("PASS V18 self-test stdin installs the query guard")
          PY
      - name: Run complete V18 contract five consecutive times on Linux
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            echo "===== V18 LINUX SELF-TEST PASS ${pass}/5 ====="
            python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py --self-test
          done
      - name: Prove physical pattern and Prizm regressions
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          python -m pytest -q \
            services/instacomp-ai/tests/test_opencv_pattern_native.py \
            services/instacomp-ai/tests/test_prizm_back_mark_guard.py \
            services/instacomp-ai/tests/test_trusted_visual_memory_parallel_override.py
      - name: Prove V18 source and orchestration contract
        run: |
          grep -q 'CANDIDATE_DRY_PASSES = 2' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py
          grep -q 'Use legacy Frozen Five only as preference, never as accepted truth' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py
          grep -q 'v14.run_round_exhaustive' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py
          grep -q 'v18_current_authoritative_selection' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py
          ! grep -q 'return v12.main' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py
          grep -q 'promotion-v18-current-authoritative-two-pass' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q 'promote_lora_candidate_frozen_25_v18.py' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q '15) stages=(10 15)' services/instacomp-ai/scripts/run-staged-learning-from-main.sh
          grep -q '25) stages=(10 15 25)' services/instacomp-ai/scripts/run-staged-learning-from-main.sh
          grep -q 'V18 current-authoritative Registry/physical/candidate gates' services/instacomp-ai/scripts/run-staged-learning-from-main.sh

  v18-contract-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile V18 and prove macOS Bash nounset paths
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v17.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v15.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v14.py \
            services/instacomp-ai/scripts/v18-query-guard/sitecustomize.py \
            services/instacomp-ai/app/lora_candidate_runtime.py \
            services/instacomp-ai/app/prizm_back_mark_guard.py
          bash -n services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          bash -n services/instacomp-ai/scripts/run-staged-learning-from-main.sh
          bash -uc 'a=(); present=0; if [[ "$present" == "1" ]]; then printf "%s\n" "${a[@]}"; else true; fi'
      - name: Prove macOS query guard cannot poison bootstrap Python stdin
        env:
          INSTACOMP_V18_STAGED_QUERY_GUARD: "1"
          PYTHONPATH: services/instacomp-ai/scripts/v18-query-guard
        run: |
          python - <<'PY'
          import sys
          assert (3, 11) <= sys.version_info[:2] < (3, 14)
          assert "promote_lora_candidate_frozen_25_v10" not in sys.modules
          print("PASS bare stdin runtime probe bypasses the V18 query guard")
          PY
          PYTHONPATH="services/instacomp-ai/scripts/v18-query-guard:services/instacomp-ai:services/instacomp-ai/scripts" \
            python - --stage-target 10 <<'PY'
          import promote_lora_candidate_frozen_25_v10 as v10
          assert getattr(v10, "_v18_card_number_guard_installed", False) is True
          print("PASS staged stdin installs the V18 query guard")
          PY
      - name: Run complete V18 contract five consecutive times on macOS
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5; do
            echo "===== V18 MACOS SELF-TEST PASS ${pass}/5 ====="
            python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v18.py --self-test
          done
      - name: Prove macOS physical pattern and Prizm regressions
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          python -m pytest -q \
            services/instacomp-ai/tests/test_opencv_pattern_native.py \
            services/instacomp-ai/tests/test_prizm_back_mark_guard.py \
            services/instacomp-ai/tests/test_trusted_visual_memory_parallel_override.py
      - name: Prove V18 launcher source contract on macOS
        run: |
          grep -q 'promotion-v18-current-authoritative-two-pass' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q 'promote_lora_candidate_frozen_25_v18.py' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q 'passthrough_present=0' services/instacomp-ai/scripts/run-staged-learning-from-main.sh
          grep -q 'V18 live staged promotion ladder' services/instacomp-ai/scripts/run-staged-learning-from-main.sh
