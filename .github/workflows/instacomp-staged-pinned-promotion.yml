name: InstaComp Pinned Staged Promotion Self Test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-staged-pinned-promotion.yml"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v9.py"
      - "services/instacomp-ai/scripts/run_staged_pinned_promotion.sh"
      - "services/instacomp-ai/app/**"
      - "services/instacomp-ai/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-contract-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile pinned promotion runners
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v11.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v10.py
          bash -n services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
      - name: Reproduce and prevent throttle swallow regression
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py --self-test
      - name: Prove pinned limits and throttle backoff source contract
        run: |
          grep -q 'PINNED_EXPANSION_BUDGETS = {10: 5, 15: 10, 25: 20}' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py
          grep -q 'MAX_THROTTLE_WINDOWS_PER_REQUEST = 6' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py
          grep -q 'class RegistryThrottleAbort(BaseException)' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py
          grep -q 'await sleep_fn(delay)' services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py
          grep -q 'promotion-v13-pinned-throttle-backoff' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          grep -q 'promote_lora_candidate_frozen_25_v13.py' services/instacomp-ai/scripts/run_staged_pinned_promotion.sh

  pinned-contract-macos:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install service requirements
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile and prove v13 on macOS
        env:
          PYTHONPATH: services/instacomp-ai:services/instacomp-ai/scripts
        run: |
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v12.py
          bash -n services/instacomp-ai/scripts/run_staged_pinned_promotion.sh
          python services/instacomp-ai/scripts/promote_lora_candidate_frozen_25_v13.py --self-test
