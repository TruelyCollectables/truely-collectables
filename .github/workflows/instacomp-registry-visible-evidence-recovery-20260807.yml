name: InstaComp Registry Visible Evidence Recovery 20260807

on:
  push:
    branches:
      - fix/instacomp-registry-recovery-hard-facts-20260807
    paths:
      - "scripts/ops/patch-instacomp-registry-visible-evidence-recovery-20260807.py"
      - "scripts/test-instacomp-registry-visible-evidence-recovery.ts"
      - ".github/workflows/instacomp-registry-visible-evidence-recovery-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-registry-recovery-hard-facts-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Registry recovery repair
        run: python scripts/ops/patch-instacomp-registry-visible-evidence-recovery-20260807.py
      - name: Install
        run: npm ci
      - name: Registry recovery simulations
        run: node --import tsx scripts/test-instacomp-registry-visible-evidence-recovery.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/lib/instacomp-learning-server.ts"
          ! grep -Fq 'refractor|prizm|prism|shimmer' src/lib/instacomp-learning-server.ts
          grep -Fq 'const normalizedParallel = normalizedText(ai.parallel);' src/lib/instacomp-learning-server.ts
          grep -Fq 'const signatureTokens = directTokens.length ? directTokens : noteTokens;' src/lib/instacomp-learning-server.ts
      - name: Commit certified Registry recovery
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/instacomp-learning-server.ts; then
            echo 'No Registry source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/instacomp-learning-server.ts
          git commit -m 'Recover exact Registry identities from visible evidence'
          git push origin HEAD:fix/instacomp-registry-recovery-hard-facts-20260807
