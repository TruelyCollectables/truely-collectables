name: Cancel Stuck Checklist Writer 20260816

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-checklist-writer-20260816.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-stuck-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stuck selected checklist writer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST /repos/${{ github.repository }}/actions/runs/31966640706/cancel || true
          for n in 1 2 3 4 5 6; do
            status="$(gh api /repos/${{ github.repository }}/actions/runs/31966640706 --jq .status)"
            conclusion="$(gh api /repos/${{ github.repository }}/actions/runs/31966640706 --jq '.conclusion // ""')"
            echo "writer_status=$status conclusion=$conclusion"
            if [ "$status" != "in_progress" ] && [ "$status" != "queued" ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'Writer did not leave in-progress state after cancellation request.' >&2
          exit 1
