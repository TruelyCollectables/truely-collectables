name: Finish card image editor

on:
  push:
    branches: [agent/card-image-rotation-swap]

permissions:
  contents: write

jobs:
  patch-build-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[card-image-tools-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-at-least-32-characters
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      OPENAI_API_KEY: build-only-placeholder-openai-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-image-rotation-swap
          fetch-depth: 0

      - name: Patch TCOS gateway and admin link
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing patch marker: {label}")
              return text.replace(old, new, 1)

          gateway_path = Path("src/app/admin/pending-card-import/TcosListingGateway.tsx")
          gateway = gateway_path.read_text()

          gateway = replace_once(
              gateway,
              "  const instaCompPercent = instaCompProgress?.total\n",
              '''  async function editCardImages(params: {
            inventoryItemId: string;
            action: "rotate" | "swap";
            side?: "front" | "back";
            degrees?: -90 | 90;
          }) {
            if (working) return;
            const row = rowsRef.current.find(
              (candidate) => candidate.inventoryItemId === params.inventoryItemId,
            );
            if (!row) {
              setError("The selected card is no longer in the listing queue.");
              return;
            }

            const actionLabel =
              params.action === "swap"
                ? "Swapping front and back images"
                : `Rotating ${params.side} image ${params.degrees === 90 ? "right" : "left"}`;
            setBusy(`image-${params.action}-${params.inventoryItemId}`);
            setError("");
            setNotice(`${actionLabel} for ${row.websiteTitle}...`);
            setPreview(null);

            try {
              const response = await fetch("/api/admin/card-listing-images", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify(params),
              });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || !data.success) {
                throw new Error(data.error || "Card image editing failed.");
              }

              const frontImageUrl = String(data.frontImageUrl || "");
              const backImageUrl = String(data.backImageUrl || "");
              updateRow(params.inventoryItemId, (current) => {
                const remainingImages = (current.imageUrls || []).filter(
                  (url) =>
                    url &&
                    url !== current.frontImageUrl &&
                    url !== current.backImageUrl &&
                    url !== frontImageUrl &&
                    url !== backImageUrl,
                );
                return {
                  ...current,
                  frontImageUrl,
                  backImageUrl: backImageUrl || null,
                  imageUrls: [frontImageUrl, backImageUrl, ...remainingImages].filter(
                    (value): value is string => Boolean(value),
                  ),
                  instaCompStatus: "pending",
                  instaCompScanId: null,
                  instaCompConfidence: null,
                  instaCompSuggestedPrice: null,
                };
              });
              setSelectedIds((current) =>
                current.includes(params.inventoryItemId)
                  ? current
                  : [...current, params.inventoryItemId],
              );
              const warningText =
                Array.isArray(data.warnings) && data.warnings.length
                  ? ` Warning: ${data.warnings.join(" · ")}`
                  : "";
              setNotice(`${data.message || `${actionLabel} complete.`}${warningText}`);
              await loadRows([params.inventoryItemId]);
            } catch (nextError) {
              setError(
                nextError instanceof Error
                  ? nextError.message
                  : "Card image editing failed.",
              );
            } finally {
              setBusy(null);
            }
          }

          const instaCompPercent = instaCompProgress?.total
''',
              "image edit function insertion",
          )

          gateway = replace_once(
              gateway,
              "            View the exact front and back, run InstaComp 2.0, fix or delete bad drafts,\n",
              "            View the exact front and back, rotate or swap problem photos, run InstaComp 2.0, fix or delete bad drafts,\n",
              "gateway description",
          )

          old_image_block = '''                  <div className="grid grid-cols-2 gap-3">
                    <CardImage
                      url={front}
                      side="Front"
                      title={row.websiteTitle}
                      onPreview={setPreview}
                    />
                    <CardImage
                      url={back}
                      side="Back"
                      title={row.websiteTitle}
                      onPreview={setPreview}
                    />
                  </div>
'''
          new_image_block = '''                  <div className="grid grid-cols-2 gap-3">
                    <CardImage
                      url={front}
                      side="Front"
                      title={row.websiteTitle}
                      onPreview={setPreview}
                      disabled={working}
                      onRotateLeft={() =>
                        void editCardImages({
                          inventoryItemId: row.inventoryItemId,
                          action: "rotate",
                          side: "front",
                          degrees: -90,
                        })
                      }
                      onRotateRight={() =>
                        void editCardImages({
                          inventoryItemId: row.inventoryItemId,
                          action: "rotate",
                          side: "front",
                          degrees: 90,
                        })
                      }
                    />
                    <CardImage
                      url={back}
                      side="Back"
                      title={row.websiteTitle}
                      onPreview={setPreview}
                      disabled={working}
                      onRotateLeft={() =>
                        void editCardImages({
                          inventoryItemId: row.inventoryItemId,
                          action: "rotate",
                          side: "back",
                          degrees: -90,
                        })
                      }
                      onRotateRight={() =>
                        void editCardImages({
                          inventoryItemId: row.inventoryItemId,
                          action: "rotate",
                          side: "back",
                          degrees: 90,
                        })
                      }
                    />
                  </div>
                  <button
                    type="button"
                    onClick={() =>
                      void editCardImages({
                        inventoryItemId: row.inventoryItemId,
                        action: "swap",
                      })
                    }
                    disabled={working || !front || !back}
                    className="mt-3 w-full rounded-xl border-2 border-violet-800 bg-violet-50 px-4 py-2 font-black text-violet-900 disabled:border-neutral-300 disabled:bg-neutral-100 disabled:text-neutral-400"
                  >
                    Swap front ↔ back
                  </button>
                  <p className="mt-2 text-xs font-semibold leading-5 text-neutral-600">
                    Rotation and swaps are saved to the inventory images. InstaComp 2.0 resets to pending so stale scan results are not reused.
                  </p>
'''
          gateway = replace_once(
              gateway,
              old_image_block,
              new_image_block,
              "front/back image controls",
          )

          old_card_image = '''function CardImage({
  url,
  side,
  title,
  onPreview,
}: {
  url: string;
  side: "Front" | "Back";
  title: string;
  onPreview: (image: PreviewImage) => void;
}) {
  return (
    <div>
      <p className="mb-1 text-xs font-black uppercase tracking-[0.12em] text-neutral-600">
        {side}
      </p>
      {url ? (
        <button
          type="button"
          onClick={() => onPreview({ url, side, title })}
          className="relative block aspect-[4/5] w-full overflow-hidden rounded-xl border-2 border-neutral-300 bg-neutral-100 transition hover:border-blue-700"
        >
          <Image
            src={url}
            alt={`${title} ${side}`}
            fill
            unoptimized
            className="object-contain"
          />
        </button>
      ) : (
        <div className="flex aspect-[4/5] items-center justify-center rounded-xl border-2 border-dashed border-neutral-300 bg-neutral-50 p-3 text-center text-sm font-black text-neutral-500">
          {side} image missing
        </div>
      )}
    </div>
  );
}
'''
          new_card_image = '''function CardImage({
  url,
  side,
  title,
  onPreview,
  onRotateLeft,
  onRotateRight,
  disabled,
}: {
  url: string;
  side: "Front" | "Back";
  title: string;
  onPreview: (image: PreviewImage) => void;
  onRotateLeft: () => void;
  onRotateRight: () => void;
  disabled: boolean;
}) {
  return (
    <div>
      <p className="mb-1 text-xs font-black uppercase tracking-[0.12em] text-neutral-600">
        {side}
      </p>
      {url ? (
        <>
          <button
            type="button"
            onClick={() => onPreview({ url, side, title })}
            className="relative block aspect-[4/5] w-full overflow-hidden rounded-xl border-2 border-neutral-300 bg-neutral-100 transition hover:border-blue-700"
          >
            <Image
              src={url}
              alt={`${title} ${side}`}
              fill
              unoptimized
              className="object-contain"
            />
          </button>
          <div className="mt-2 grid grid-cols-2 gap-2">
            <button
              type="button"
              onClick={onRotateLeft}
              disabled={disabled}
              className="rounded-lg border-2 border-neutral-950 bg-white px-2 py-2 text-xs font-black disabled:opacity-40"
              title={`Rotate ${side.toLowerCase()} image 90 degrees left`}
            >
              Rotate left
            </button>
            <button
              type="button"
              onClick={onRotateRight}
              disabled={disabled}
              className="rounded-lg border-2 border-neutral-950 bg-white px-2 py-2 text-xs font-black disabled:opacity-40"
              title={`Rotate ${side.toLowerCase()} image 90 degrees right`}
            >
              Rotate right
            </button>
          </div>
        </>
      ) : (
        <div className="flex aspect-[4/5] items-center justify-center rounded-xl border-2 border-dashed border-neutral-300 bg-neutral-50 p-3 text-center text-sm font-black text-neutral-500">
          {side} image missing
        </div>
      )}
    </div>
  );
}
'''
          gateway = replace_once(
              gateway,
              old_card_image,
              new_card_image,
              "CardImage rotation controls",
          )
          gateway_path.write_text(gateway)

          admin_path = Path("src/app/admin/page.tsx")
          admin = admin_path.read_text()
          old_admin_button = '''            <BaseCommandButton
              href={adminHref("/admin/products/new")}
              label="Add Product"
              primary
            />
'''
          new_admin_button = '''            <BaseCommandButton
              href={adminHref("/admin/pending-card-import")}
              label="Card Intake & Listing"
              primary
            />
            <BaseCommandButton
              href={adminHref("/admin/products/new")}
              label="Add Product"
            />
'''
          admin = replace_once(
              admin,
              old_admin_button,
              new_admin_button,
              "admin Card Intake button",
          )
          old_rhythm = '''      title: "Scan, price, then publish",
      detail:
        "Use InstaComp™ Direct for bad scans, quantity merges, price refreshes, and draft creation before marketplace publishing.",
      href: "/admin/instacomp-direct",
'''
          new_rhythm = '''      title: "Scan, correct, price, then publish",
      detail:
        "Use Card Intake & Listing for front/back scans, image rotation or swapping, InstaComp 2.0, and marketplace publishing.",
      href: "/admin/pending-card-import",
'''
          admin = replace_once(
              admin,
              old_rhythm,
              new_rhythm,
              "admin operating rhythm Card Intake link",
          )
          admin_path.write_text(admin)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/run-card-image-editor-audit.mjs
      - run: node scripts/run-tcos-listing-gateway-audit.mjs
      - run: node scripts/run-simplified-list-route-audit.mjs
      - run: npm run verify:admin-dashboard
      - run: npm run build

      - name: Commit verified image editor
        run: |
          rm .github/workflows/finish-card-image-editor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx \
            src/app/admin/pending-card-import/TcosListingGateway.tsx \
            src/app/api/admin/card-listing-images/route.ts \
            scripts/run-card-image-editor-audit.mjs \
            .github/workflows/finish-card-image-editor.yml
          git commit -m "Add card image rotation, swap, and admin access [card-image-tools-ready]"
          git push origin HEAD:agent/card-image-rotation-swap
