name: Ops Runtime OIDC Repair Runner 20260810

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/instacomp-gateway-runtime-oidc-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add Vercel OIDC runtime helper dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact @vercel/oidc@3.8.1 --ignore-scripts

      - name: Apply deterministic request-context OIDC patch
        run: python scripts/ops/apply-instacomp-gateway-runtime-oidc-repair.py

      - name: Run focused regressions, TypeScript and Production build
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: |
          set -euo pipefail
          node --import tsx scripts/run-instacomp-groq-runtime-status-simulations.ts
          node --import tsx scripts/run-instacomp-gateway-perplexity-teacher-simulations.ts
          node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts
          npx tsc --noEmit
          npm run build

      - name: Publish only permanent source, tests and dependency lock
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ops/apply-instacomp-gateway-runtime-oidc-repair.py
          git config user.name 'Truely Collectables CI'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json \
                  src/lib/instacomp-teacher-market-provider.ts \
                  src/lib/instacomp-teacher-runtime-status.ts \
                  scripts/run-instacomp-groq-runtime-status-simulations.ts \
                  scripts/ops/apply-instacomp-gateway-runtime-oidc-repair.py
          git diff --cached --check
          git commit -m 'Use request-context OIDC for Gateway comp teacher'
          git push origin "HEAD:$HEAD_BRANCH"
