name: Apply One-Hour Storefront Migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-one-hour-storefront-migrations.mjs"
      - ".github/workflows/apply-one-hour-storefront-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-storefront-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT_NAME: truely-collectables
      APPLY_STOREFRONT_MIGRATIONS: "true"
    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify launch credentials
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }

      - name: Link known Vercel project without deployment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tcos-vercel-cli-56.2.0"
          npm --prefix "$RUNNER_TEMP/tcos-vercel-cli-56.2.0" exec --yes --package=vercel@56.2.0 -- \
            vercel --cwd "$PWD" link --yes --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color

      - name: Pull project URL without deployment
        shell: bash
        run: |
          npm --prefix "$RUNNER_TEMP/tcos-vercel-cli-56.2.0" exec --yes --package=vercel@56.2.0 -- \
            vercel --cwd "$PWD" env pull .env.storefront.production \
            --environment=production --yes --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" --no-color

      - name: Apply selected storefront migrations
        id: apply_migrations
        continue-on-error: true
        shell: bash
        run: node scripts/apply-one-hour-storefront-migrations.mjs

      - name: Upload migration application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-migration-apply-evidence
          path: storefront-migration-apply.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove linked-project and environment files
        if: always()
        shell: bash
        run: |
          rm -rf .vercel
          rm -f .env.storefront.production storefront-migration-apply.json

      - name: Enforce migration application
        if: steps.apply_migrations.outcome == 'failure'
        shell: bash
        run: |
          echo "Storefront migration application failed. Review the redacted evidence artifact."
          exit 1
