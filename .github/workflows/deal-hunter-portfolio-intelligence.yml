name: BALLS DEEP Portfolio Intelligence

# Production portfolio intelligence: scheduled + on-demand + change-triggered.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deal-hunter-portfolio-intelligence.yml"
      - "scripts/deal-hunter-portfolio-intelligence.mjs"
      - "src/app/api/instacomp/deal-hunter/evaluate/**"
      - "src/lib/instacomp-market-history.ts"
      - "src/lib/deal-hunter-ebay-query-families.js"
  workflow_dispatch:
  schedule:
    - cron: "25 */6 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: deal-hunter-portfolio-intelligence
  cancel-in-progress: false

jobs:
  portfolio-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted production vault
        uses: actions/download-artifact@v4
        with:
          name: truely-production-secrets-vault-31773508121
          path: /tmp/portfolio-production-vault
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31773508121

      - name: Download separate recovery key
        uses: actions/download-artifact@v4
        with:
          name: truely-production-secrets-recovery-key-31773508121
          path: /tmp/portfolio-production-key
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31773508121

      - name: Recover only required portfolio intelligence configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createDecipheriv, createHash } = require('node:crypto');

          function filesBelow(root) {
            return fs.readdirSync(root, { recursive: true, withFileTypes: true })
              .filter((entry) => entry.isFile())
              .map((entry) => path.join(entry.parentPath || entry.path, entry.name));
          }

          const vaultPath = filesBelow('/tmp/portfolio-production-vault').find((file) => file.endsWith('.tcosvault'));
          const keyPath = filesBelow('/tmp/portfolio-production-key').find((file) => file.endsWith('.recovery-key.txt'));
          if (!vaultPath || !keyPath) throw new Error('Production recovery artifacts are incomplete.');

          const envelope = JSON.parse(fs.readFileSync(vaultPath, 'utf8'));
          const keyText = fs.readFileSync(keyPath, 'utf8');
          const keyMatch = keyText.match(/(?:^|\n)key: ([A-Za-z0-9_-]+)(?:\n|$)/);
          if (!keyMatch) throw new Error('Production recovery key is invalid.');
          if (envelope?.format !== 'tcos-secrets-vault' || envelope?.cipher !== 'aes-256-gcm') throw new Error('Production vault envelope is invalid.');

          const decipher = createDecipheriv('aes-256-gcm', Buffer.from(keyMatch[1], 'base64url'), Buffer.from(envelope.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(envelope.authenticationTag, 'base64'));
          const plaintext = Buffer.concat([decipher.update(Buffer.from(envelope.ciphertext, 'base64')), decipher.final()]);
          const digest = createHash('sha256').update(plaintext).digest('hex');
          if (digest !== envelope.plaintextSha256) throw new Error('Production vault checksum failed.');

          const payload = JSON.parse(plaintext.toString('utf8'));
          const all = {
            ...(payload?.sources?.vercelProductionApplicationVariables || {}),
            ...(payload?.sources?.githubActionsReferencedSecrets || {}),
          };
          const selected = {};
          for (const name of [
            'INSTACOMP_AI_LOCAL_KEY',
            'OPENAI_API_KEY',
            'TCOS_SEARCH_MODEL',
            'NEXT_PUBLIC_SUPABASE_URL',
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
            'RESEND_API_KEY',
            'MARKET_INTEL_FROM_EMAIL',
            'MARKET_INTEL_ALERT_EMAIL',
            'MARKET_INTEL_EMAIL_ENABLED',
          ]) {
            if (Object.prototype.hasOwnProperty.call(all, name)) selected[name] = all[name];
          }
          fs.writeFileSync('/tmp/deal-hunter-portfolio-env.json', JSON.stringify(selected), { mode: 0o600 });
          const required = ['INSTACOMP_AI_LOCAL_KEY', 'OPENAI_API_KEY', 'RESEND_API_KEY', 'MARKET_INTEL_FROM_EMAIL', 'MARKET_INTEL_ALERT_EMAIL'];
          const missing = required.filter((name) => !String(selected[name] || '').trim());
          if (missing.length) throw new Error(`Portfolio intelligence required configuration missing: ${missing.join(', ')}`);
          console.log(`Portfolio intelligence configuration recovered: ${Object.keys(selected).length} fields; values withheld.`);
          NODE

      - name: Run live 15 percent ROI portfolio intelligence
        env:
          PORTFOLIO_MAX_EVALUATIONS: "50"
          PORTFOLIO_EVALUATION_CONCURRENCY: "2"
          PORTFOLIO_RECENT_EVALUATION_HOURS: "24"
        run: node scripts/deal-hunter-portfolio-intelligence.mjs

      - name: Upload non-secret run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-hunter-portfolio-summary-${{ github.run_id }}
          path: /tmp/deal-hunter-portfolio-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove recovered secret material
        if: always()
        shell: bash
        run: |
          find /tmp/portfolio-production-vault /tmp/portfolio-production-key -type f -exec shred -u {} + 2>/dev/null || true
          shred -u /tmp/deal-hunter-portfolio-env.json /tmp/deal-hunter-portfolio-result.json 2>/dev/null || true
