name: Import KINGMAKER Beckett Full OCR 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-kingmaker-beckett-full-ocr-20260803.yml"
      - "scripts/ops/import-kingmaker-beckett-compact-production.py"

permissions:
  contents: read

concurrency:
  group: import-kingmaker-beckett-full-ocr-20260803
  cancel-in-progress: false

env:
  EXPECTED_BASE_SHA: 9d05137031e58450cbd336b17e2f4d0c37ce6f46
  EXPECTED_BRANCH: ops/import-kingmaker-beckett-full-ocr-20260803
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  PAYLOAD_DOWNLOAD_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-00bd-81f7-a164-ead407a21522/raw?se=2026-08-04T00%3A25%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=e76fa463-6c9b-50c8-840f-a65c6de80459&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T17%3A01%3A59Z&ske=2026-08-04T17%3A01%3A59Z&sks=b&skv=2026-02-06&sig=p9t8QsL2F/tpgTujNLFywQ4vYKL2tKvFto2q/560XE8%3D"
  PAYLOAD_B64_SHA256: 8db0e1da0ebf76b510726576dad94599a78faf7db95c5f99b0a25300697cadc2
  PAYLOAD_ZIP_SHA256: f61ec34bf1bbd0f699703a2e026e74e83078e86174f0b685eeaa41d20c79cd44
  RECEIPT_PATH: evidence/kingmaker-beckett-full-ocr-production-20260803/receipt.json

jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/import-kingmaker-beckett-full-ocr-20260803.yml'
          test "${changed[1]}" = 'scripts/ops/import-kingmaker-beckett-compact-production.py'
          git diff --check "$EXPECTED_BASE_SHA"...HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact importer dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.32.4 msgpack==1.1.1 cryptography==45.0.5

      - name: Download and verify encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          payload_b64="$RUNNER_TEMP/kingmaker-beckett-payload.b64.txt"
          payload_zip="$RUNNER_TEMP/kingmaker-beckett-payload.zip"
          payload_dir="$RUNNER_TEMP/kingmaker-beckett-payload"
          curl --silent --show-error --fail --location --retry 3 \
            --output "$payload_b64" \
            "$PAYLOAD_DOWNLOAD_URL"
          printf '%s  %s\n' "$PAYLOAD_B64_SHA256" "$payload_b64" | sha256sum --check --strict
          base64 --decode "$payload_b64" > "$payload_zip"
          printf '%s  %s\n' "$PAYLOAD_ZIP_SHA256" "$payload_zip" | sha256sum --check --strict
          mkdir -p "$payload_dir"
          unzip -q "$payload_zip" -d "$payload_dir"
          test -s "$payload_dir/envelope.json"
          test "$(find "$payload_dir/chunks" -type f -name '*.b64' | wc -l)" -eq 6
          test "$(jq -r '.totalPages' "$payload_dir/envelope.json")" -eq 642
          test "$(jq -r '.totalEntries' "$payload_dir/envelope.json")" -eq 87679
          echo "PAYLOAD_DIR=$payload_dir" >> "$GITHUB_ENV"

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/kingmaker-beckett-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/kingmaker-beckett-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/kingmaker-beckett-production/production.env"
          chmod 600 "$RUNNER_TEMP/kingmaker-beckett-production/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/kingmaker-beckett-production/production.env" >> "$GITHUB_ENV"

      - name: Resolve Production project and service role
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_FILE"
          set +a
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}"
          project_ref="$(node -e 'const u=new URL(process.argv[1]); const r=u.hostname.split(".")[0]; if(!/^[a-z0-9]{16,40}$/.test(r)) throw new Error("bad project ref"); process.stdout.write(r)' "$NEXT_PUBLIC_SUPABASE_URL")"
          keys_file="$RUNNER_TEMP/kingmaker-beckett-production/api-keys.json"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$keys_file" \
            "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$keys_file")"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
          echo "RESOLVED_SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"
          echo "PRODUCTION_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"

      - name: Retrieve unused one-time private transport key
        shell: bash
        run: |
          set -euo pipefail
          transport_id="$(jq -r '.transportId' "$PAYLOAD_DIR/envelope.json")"
          test -n "$transport_id"
          request="$RUNNER_TEMP/kingmaker-beckett-production/private-key-request.json"
          response="$RUNNER_TEMP/kingmaker-beckett-production/private-key-response.json"
          jq -n --arg id "$transport_id" '{query:"select private_key_pem, expires_at, consumed_at from private.tcos_kingmaker_beckett_transport_keys where transport_id = $1",parameters:[$id],read_only:true}' > "$request"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request" \
            --output "$response" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          private_key="$(jq -r '.[0].private_key_pem // empty' "$response")"
          expires_at="$(jq -r '.[0].expires_at // empty' "$response")"
          consumed_at="$(jq -r '.[0].consumed_at // empty' "$response")"
          test -n "$private_key"
          test "$consumed_at" = ""
          python - "$expires_at" <<'PY'
          import datetime, sys
          expiry = datetime.datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          if expiry <= datetime.datetime.now(datetime.timezone.utc): raise SystemExit('transport key expired')
          PY
          private_file="$RUNNER_TEMP/kingmaker-beckett-production/private-key.pem"
          printf '%s\n' "$private_key" > "$private_file"
          chmod 600 "$private_file"
          while IFS= read -r line; do echo "::add-mask::$line"; done < "$private_file"
          echo "TRANSPORT_ID=$transport_id" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY_FILE=$private_file" >> "$GITHUB_ENV"

      - name: Decrypt, stage, Registry-match, and verify all five guides
        shell: bash
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="$PRODUCTION_SUPABASE_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          python scripts/ops/import-kingmaker-beckett-compact-production.py \
            --envelope "$PAYLOAD_DIR/envelope.json" \
            --chunks "$PAYLOAD_DIR/chunks" \
            --private-key "$PRIVATE_KEY_FILE" \
            --receipt "$RECEIPT_PATH"

      - name: Consume and erase one-time private key
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/kingmaker-beckett-production/consume-key-request.json"
          jq -n --arg id "$TRANSPORT_ID" '{query:"delete from private.tcos_kingmaker_beckett_transport_keys where transport_id = $1 returning transport_id",parameters:[$id],read_only:false}' > "$request"
          result="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          test "$(printf '%s' "$result" | jq -r '.[0].transport_id // empty')" = "$TRANSPORT_ID"

      - name: Require sanitized passing receipt
        shell: bash
        run: |
          set -euo pipefail
          python - "$RECEIPT_PATH" <<'PY'
          import json, pathlib, re, sys
          path = pathlib.Path(sys.argv[1]); receipt = json.loads(path.read_text())
          assert receipt['schema'] == 'tcos.kingmaker.beckettProductionImportReceipt.v1'
          assert receipt['status'] == 'passed'
          assert receipt['totalPages'] == 642
          assert receipt['totalEntries'] == 87679
          assert receipt['promotedObservations'] == 0
          assert len(receipt['guides']) == 5
          assert sum(x['pages'] for x in receipt['guides']) == 642
          assert sum(x['entries'] for x in receipt['guides']) == 87679
          text = path.read_text()
          assert not re.search(r'BEGIN PRIVATE KEY|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|postgres(?:ql)?://', text, re.I)
          PY

      - name: Upload sanitized Production receipt
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-beckett-full-ocr-production-20260803
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove protected and decrypted material
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/kingmaker-beckett-production" \
            "$RUNNER_TEMP/kingmaker-beckett-payload" \
            "$RUNNER_TEMP/kingmaker-beckett-payload.zip" \
            "$RUNNER_TEMP/kingmaker-beckett-payload.b64.txt" \
            .env.local \
            .env.production.local
