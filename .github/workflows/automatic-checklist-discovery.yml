name: Automatic Checklist Discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or import clean discoveries
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
      max_pages:
        description: Archive pages to inspect for backlog candidates
        required: true
        default: "50"
      max_sources:
        description: Maximum checklist sources to process per run
        required: true
        default: "60"
  push:
    branches:
      - main
    paths:
      - ".github/checklist-discovery-catchup-trigger-20260816"
  schedule:
    # Daily catch-up budget: 60 Upper Deck sources + 40 Topps product candidates = 100 checks/day.
    - cron: "17 11 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: automatic-checklist-discovery
  cancel-in-progress: false

jobs:
  discover-and-import:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 45
    env:
      CHECKLIST_REGISTRY_ACTION_URL: https://truelycollectables.com/api/internal/checklist-registry/action-ingest
      CHECKLIST_DISCOVERY_AUTO_IMPORT: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'apply' }}
      CHECKLIST_DISCOVERY_MAX_PAGES: ${{ inputs.max_pages || '50' }}
      CHECKLIST_DISCOVERY_MAX_SOURCES: ${{ inputs.max_sources || '60' }}
      CHECKLIST_DISCOVERY_OUTPUT: .checklist-discovery/receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Discover, validate, and safely import
        run: npx tsx scripts/discover-and-import-checklists.ts
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-checklist-discovery-receipt
          path: .checklist-discovery/*.json
          if-no-files-found: warn
          retention-days: 90
