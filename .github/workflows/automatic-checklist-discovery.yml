name: Automatic Checklist Discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or import clean discoveries
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
      scope:
        description: Standard discovery or full 2021-plus hockey reconciliation
        required: true
        default: standard
        type: choice
        options:
          - standard
          - hockey_2021_plus
      earliest_year:
        description: Oldest Upper Deck checklist-year archive to sweep during catch-up
        required: true
        default: "1990"
      max_year_pages:
        description: Maximum archive pages to inspect per Upper Deck checklist year
        required: true
        default: "12"
      target_new:
        description: Net-new checklist discoveries required during catch-up
        default: "100"
        required: true
      max_attempts:
        description: Unseen checklist candidates allowed to reach the net-new target
        required: true
        default: "250"
  push:
    branches:
      - main
    paths:
      - ".github/checklist-discovery-catchup-trigger-20260816"
      - ".github/hockey-checklist-reconcile-trigger-20260816"
  schedule:
    # Catch-up mode: newest releases first, then walk backward year-by-year until 100 net-new discoveries land.
    - cron: "17 11 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: automatic-checklist-discovery
  # A newer catch-up control run must be able to preempt an old writer so
  # priority Registry imports are never forced to wait behind stale discovery.
  cancel-in-progress: true

jobs:
  discover-and-import:
    # A marker commit on the dedicated trigger path is a deliberate no-op used
    # to cancel an older broad catch-up writer while a priority import runs.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[pause-checklist-catchup]') }}
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 120
    env:
      CHECKLIST_REGISTRY_ACTION_URL: https://truelycollectables.com/api/internal/checklist-registry/action-ingest
      CHECKLIST_DISCOVERY_AUTO_IMPORT: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'apply' }}
      CHECKLIST_DISCOVERY_EARLIEST_YEAR: ${{ inputs.earliest_year || '1990' }}
      CHECKLIST_DISCOVERY_MAX_YEAR_PAGES: ${{ inputs.max_year_pages || '12' }}
      CHECKLIST_DISCOVERY_TARGET_NEW: ${{ inputs.target_new || '100' }}
      CHECKLIST_DISCOVERY_MAX_ATTEMPTS: ${{ inputs.max_attempts || '250' }}
      CHECKLIST_DISCOVERY_OUTPUT: .checklist-discovery/receipt.json
      HOCKEY_CHECKLIST_START_DATE: "2021-07-01T00:00:00Z"
      HOCKEY_CHECKLIST_MAX_CATEGORY_PAGES: "40"
      HOCKEY_CHECKLIST_OUTPUT: .hockey-checklist-reconcile/receipt.json
      REQUESTED_DISCOVERY_SCOPE: ${{ inputs.scope || 'standard' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select checklist run mode
        shell: bash
        run: |
          set -euo pipefail
          hockey=false
          if [[ "${REQUESTED_DISCOVERY_SCOPE}" == "hockey_2021_plus" ]]; then
            hockey=true
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            marker=".github/hockey-checklist-reconcile-trigger-20260816"
            if git diff --name-only HEAD^ HEAD | grep -Fxq "${marker}"; then
              hockey=true
            fi
          fi
          echo "HOCKEY_RECONCILE=${hockey}" >> "${GITHUB_ENV}"
          if [[ "${hockey}" == "true" ]]; then
            echo "CHECKLIST_REGISTRY_ACTION_TIMEOUT_MS=600000" >> "${GITHUB_ENV}"
          fi
      - name: Reconcile every 2021-plus hockey checklist
        if: ${{ env.HOCKEY_RECONCILE == 'true' }}
        run: npx tsx scripts/reconcile-hockey-checklists-2021plus.ts
      - name: Discover, validate, and safely import
        if: ${{ env.HOCKEY_RECONCILE != 'true' }}
        run: npx tsx scripts/discover-and-import-checklists.ts
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-checklist-discovery-receipt
          path: |
            .checklist-discovery/*.json
            .hockey-checklist-reconcile/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
