name: Automatic Checklist Discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or import clean discoveries
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
      scope:
        description: Standard discovery or full 2021-plus hockey reconciliation
        required: true
        default: standard
        type: choice
        options:
          - standard
          - hockey_2021_plus
      earliest_year:
        description: Oldest Upper Deck checklist-year archive to sweep during catch-up
        required: true
        default: "1990"
      max_year_pages:
        description: Maximum archive pages to inspect per Upper Deck checklist year
        required: true
        default: "12"
      target_new:
        description: Net-new checklist discoveries required during catch-up
        default: "100"
        required: true
      max_attempts:
        description: Unseen checklist candidates allowed to reach the net-new target
        required: true
        default: "250"
  push:
    branches:
      - main
    paths:
      - ".github/checklist-discovery-catchup-trigger-20260816"
      - ".github/hockey-checklist-reconcile-trigger-20260816"
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: automatic-checklist-discovery
  cancel-in-progress: true

jobs:
  discover-and-import:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[pause-checklist-catchup]')) }}
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 120
    env:
      CHECKLIST_REGISTRY_ACTION_URL: https://truelycollectables.com/api/internal/checklist-registry/action-ingest
      CHECKLIST_DISCOVERY_AUTO_IMPORT: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
      CHECKLIST_DISCOVERY_EARLIEST_YEAR: ${{ inputs.earliest_year || '1990' }}
      CHECKLIST_DISCOVERY_MAX_YEAR_PAGES: ${{ inputs.max_year_pages || '12' }}
      CHECKLIST_DISCOVERY_TARGET_NEW: ${{ inputs.target_new || '100' }}
      CHECKLIST_DISCOVERY_MAX_ATTEMPTS: ${{ inputs.max_attempts || '250' }}
      CHECKLIST_DISCOVERY_OUTPUT: .checklist-discovery/receipt.json
      HOCKEY_CHECKLIST_START_DATE: "2021-07-01T00:00:00Z"
      HOCKEY_CHECKLIST_MAX_CATEGORY_PAGES: "40"
      HOCKEY_CHECKLIST_OUTPUT: .hockey-checklist-reconcile/receipt.json
      HOCKEY_INGEST_REVISION_URL: https://truelycollectables.com/api/internal/checklist-registry/ingest-revision
      EXPECTED_HOCKEY_INGEST_REVISION: "2026-08-18-hockey-preflight-v4"
      HOCKEY_STATUS_BRANCH: "ops/hockey-reconcile-status"
      REQUESTED_DISCOVERY_SCOPE: ${{ inputs.scope || 'standard' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select checklist run mode
        shell: bash
        run: |
          set -euo pipefail
          hockey=false
          if [[ "${REQUESTED_DISCOVERY_SCOPE}" == "hockey_2021_plus" ]]; then
            hockey=true
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            marker=".github/hockey-checklist-reconcile-trigger-20260816"
            if git diff --name-only HEAD^ HEAD | grep -Fxq "${marker}"; then
              hockey=true
            fi
          fi
          echo "HOCKEY_RECONCILE=${hockey}" >> "${GITHUB_ENV}"
          if [[ "${hockey}" == "true" ]]; then
            echo "CHECKLIST_REGISTRY_ACTION_TIMEOUT_MS=180000" >> "${GITHUB_ENV}"
          fi
      - name: Wait for repaired Production checklist ingest
        if: ${{ env.HOCKEY_RECONCILE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl -fsS --max-time 15 "${HOCKEY_INGEST_REVISION_URL}" 2>/dev/null || true)"
            revision="$(printf '%s' "${body}" | jq -r '.upperDeckIngestRevision // empty' 2>/dev/null || true)"
            if [[ "${revision}" == "${EXPECTED_HOCKEY_INGEST_REVISION}" ]]; then
              echo "Production checklist ingest revision ready: ${revision}"
              exit 0
            fi
            echo "Production ingest not ready yet (${attempt}/36); observed revision='${revision:-unavailable}'"
            sleep 10
          done
          echo "Repaired Production checklist ingest revision never became ready." >&2
          exit 1
      - name: Validate hockey parser repairs
        if: ${{ env.HOCKEY_RECONCILE == 'true' }}
        run: npx tsx scripts/validate-clear-cut-checklist-repair.ts
      - name: Publish hockey Production gate receipt
        if: ${{ env.HOCKEY_RECONCILE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${HOCKEY_STATUS_BRANCH}"
          mkdir -p data/ops
          jq -n \
            --arg status "production_ingest_ready" \
            --arg ingestRevision "${EXPECTED_HOCKEY_INGEST_REVISION}" \
            --arg triggerSha "${GITHUB_SHA}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,ingestRevision:$ingestRevision,triggerSha:$triggerSha,runId:$runId,generatedAt:$generatedAt}' \
            > data/ops/hockey-checklist-reconcile-gate.json
          git add data/ops/hockey-checklist-reconcile-gate.json
          git commit -m "ops(checklists): hockey Production ingest gate passed" || true
          git push --force origin "HEAD:${HOCKEY_STATUS_BRANCH}"
      - name: Reconcile every 2021-plus hockey checklist
        if: ${{ env.HOCKEY_RECONCILE == 'true' }}
        run: npx tsx scripts/reconcile-hockey-checklists-2021plus.ts
      - name: Discover, validate, and safely import
        if: ${{ env.HOCKEY_RECONCILE != 'true' }}
        run: npx tsx scripts/discover-and-import-checklists.ts
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-checklist-discovery-receipt
          path: |
            .checklist-discovery/*.json
            .hockey-checklist-reconcile/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Publish latest hockey reconcile receipt
        if: ${{ always() && env.HOCKEY_RECONCILE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          receipt=".hockey-checklist-reconcile/receipt.json"
          if [[ ! -f "${receipt}" ]]; then
            echo "No hockey receipt was produced." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current_branch="$(git branch --show-current)"
          if [[ "${current_branch}" != "${HOCKEY_STATUS_BRANCH}" ]]; then
            git switch -C "${HOCKEY_STATUS_BRANCH}"
          fi
          mkdir -p data/ops
          cp "${receipt}" data/ops/hockey-checklist-reconcile-latest.json
          git add data/ops/hockey-checklist-reconcile-latest.json
          if git diff --cached --quiet; then
            echo "Published hockey receipt is already current."
            exit 0
          fi
          git commit -m "ops(checklists): publish hockey reconcile receipt"
          git push origin "HEAD:${HOCKEY_STATUS_BRANCH}"
