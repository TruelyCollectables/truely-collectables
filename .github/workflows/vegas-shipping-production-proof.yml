name: Vegas Shipping Production Proof

on:
  workflow_run:
    workflows: ["Cloudflare Production Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vegas-shipping-production-proof
  cancel-in-progress: true

jobs:
  prove-production-safety:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prove dry-run shipping state and admin auth boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://truelycollectables.com';

          async function fetchWithRetry(url, init = {}) {
            let lastFailure = 'No request attempted.';
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}proof=${Date.now()}`, {
                  ...init,
                  redirect: 'manual',
                  signal: AbortSignal.timeout(30_000),
                });
                return response;
              } catch (error) {
                lastFailure = `attempt=${attempt} error=${error instanceof Error ? error.message : String(error)}`;
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            throw new Error(`Production request failed: ${lastFailure}`);
          }

          const safetyResponse = await fetchWithRetry(`${base}/api/tcos/shipping-safety`, {
            headers: { Accept: 'application/json' },
          });
          const safetyText = await safetyResponse.text();
          let safety;
          try {
            safety = JSON.parse(safetyText);
          } catch {
            throw new Error(`Shipping safety endpoint returned non-JSON: status=${safetyResponse.status} body=${safetyText.slice(0, 300)}`);
          }

          const safetyValid =
            safetyResponse.status === 200 &&
            safetyResponse.headers.get('x-tcos-shipping-safety') === 'safe' &&
            safetyResponse.headers.get('x-truely-origin') === 'cloudflare-worker' &&
            safety?.ok === true &&
            safety?.purchaseMode === 'dry_run' &&
            safety?.liveShippingEnabled === false &&
            safety?.liveAdapterSupported === false &&
            safety?.livePostagePossible === false &&
            safety?.standardEnvelope?.livePurchaseSupported === false &&
            safety?.standardEnvelope?.manualPurchaseRequired === true &&
            safety?.letterTrackShipStation?.enabled === false &&
            safety?.letterTrackShipStation?.ready === false &&
            safety?.shipStationParcel?.enabled === false &&
            safety?.shipStationParcel?.ready === false;

          if (!safetyValid) {
            throw new Error(
              `Shipping safety proof failed: status=${safetyResponse.status} origin=${safetyResponse.headers.get('x-truely-origin')} safety=${safetyResponse.headers.get('x-tcos-shipping-safety')} payload=${JSON.stringify(safety)}`,
            );
          }

          for (const method of ['GET', 'POST']) {
            const response = await fetchWithRetry(
              `${base}/api/admin/shipping/lettertrack-export`,
              method === 'POST'
                ? {
                    method,
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify({}),
                  }
                : { method, headers: { Accept: 'application/json' } },
            );
            if (response.status !== 401) {
              const body = await response.text();
              throw new Error(
                `Unauthenticated ${method} LetterTrack export request was not blocked: status=${response.status} body=${body.slice(0, 300)}`,
              );
            }
          }

          const guardedRequests = [
            {
              label: 'ShipStation connection test GET',
              url: `${base}/api/admin/shipping/shipstation-connection-test`,
              init: { method: 'GET', headers: { Accept: 'application/json' } },
            },
            {
              label: 'LetterTrack ShipStation postage POST',
              url: `${base}/api/admin/orders/1/lettertrack-postage`,
              init: {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ confirmPurchase: true, machinableAttested: true, ounces: 1 }),
              },
            },
            {
              label: 'ShipStation parcel postage POST',
              url: `${base}/api/admin/orders/1/shipstation-parcel`,
              init: {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ confirmPurchase: true, ounces: 4, lengthIn: 8, widthIn: 6, heightIn: 1 }),
              },
            },
          ];

          for (const guarded of guardedRequests) {
            const response = await fetchWithRetry(guarded.url, guarded.init);
            if (response.status !== 401) {
              const body = await response.text();
              throw new Error(
                `Unauthenticated ${guarded.label} was not blocked: status=${response.status} body=${body.slice(0, 300)}`,
              );
            }
          }

          console.log('VEGAS SHIPPING PROOF PASSED');
          console.log('- Cloudflare routed Worker confirmed.');
          console.log('- Runtime generic purchase mode: dry_run.');
          console.log('- Generic live shipping flag: false.');
          console.log('- Generic live provider adapter supported: false.');
          console.log('- LetterTrack/ShipStation live lane: disabled + not ready.');
          console.log('- ShipStation parcel live lane: disabled + not ready.');
          console.log('- Unauthenticated LetterTrack export GET/POST: 401.');
          console.log('- Unauthenticated ShipStation connection test GET: 401.');
          console.log('- Unauthenticated LetterTrack postage POST: 401.');
          console.log('- Unauthenticated ShipStation parcel postage POST: 401.');
          console.log('- No authenticated mutation or postage purchase was attempted.');
          NODE
