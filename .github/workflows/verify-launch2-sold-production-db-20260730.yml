name: Verify Launch 2 SOLD Production DB 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-launch2-sold-production-db-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-launch2-sold-production-db-20260730
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 4bb20535f68d5d28bb83434ecda93a6ed8d96e9a
  EXPECTED_BRANCH: ops/apply-launch2-sold-migrations-20260730
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  read-only-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact Production source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD

      - name: Pull Production project identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/launch2-sold-db-verification" evidence/launch2-sold-production-db
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/launch2-sold-db-verification/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Verify committed migration and backfill state read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const envPath = path.join(process.env.RUNNER_TEMP, 'launch2-sold-db-verification', 'production.env');
          const parsed = {};
          for (const rawLine of fs.readFileSync(envPath, 'utf8').split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const productionUrl = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) throw new Error('Production Supabase URL is unavailable.');
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !token) throw new Error('Production Supabase management credentials are incomplete.');

          const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              read_only: true,
              parameters: [],
              query: `
                select json_build_object(
                  'collectible_assets', (select count(*) from public.collectible_assets),
                  'sale_records', (select count(*) from public.collectible_sales),
                  'historical_sales_before_2026_07_28', (
                    select count(*) from public.collectible_sales
                    where sold_at < '2026-07-28 00:00:00+00'::timestamptz
                  ),
                  'historical_verified_or_manual', (
                    select count(*) from public.collectible_sales
                    where sold_at < '2026-07-28 00:00:00+00'::timestamptz
                      and sold_price is not null
                      and evidence_status in ('verified','manual')
                  ),
                  'historical_unresolved', (
                    select count(*) from public.collectible_sales
                    where sold_at < '2026-07-28 00:00:00+00'::timestamptz
                      and (sold_price is null or evidence_status = 'unresolved')
                  ),
                  'missing_historical_sale_rows', (
                    select count(*) from public.products p
                    where p.sold_at is not null
                      and p.sold_at < '2026-07-28 00:00:00+00'::timestamptz
                      and not exists (
                        select 1 from public.collectible_sales s
                        where s.store_id = p.store_id and s.legacy_product_id = p.id
                      )
                  ),
                  'resolved_sales_missing_price', (
                    select count(*) from public.collectible_sales
                    where evidence_status in ('verified','manual') and sold_price is null
                  ),
                  'unresolved_sales_not_flagged', (
                    select count(*) from public.collectible_sales
                    where sold_price is null and evidence_status <> 'unresolved'
                  ),
                  'invalid_sales', (
                    select count(*) from public.collectible_sales
                    where sold_quantity <= 0 or sold_price < 0
                  ),
                  'duplicate_event_keys', (
                    select count(*) from (
                      select store_id, event_key from public.collectible_sales
                      group by store_id, event_key having count(*) > 1
                    ) duplicate_rows
                  ),
                  'collx_only_excluded_items', (
                    select count(*) from public.collx_only_inventory_boundary_violations
                  ),
                  'active_sale_guards', (
                    select count(*) from public.ebay_inbound_sale_guards where active
                  ),
                  'product_guard_violations', (
                    select count(*)
                    from public.ebay_inbound_sale_guards guard
                    join public.products product
                      on product.store_id = guard.store_id
                     and product.id = guard.legacy_product_id
                    where guard.active and product.quantity > guard.protected_quantity
                  ),
                  'inventory_guard_violations', (
                    select count(*)
                    from public.ebay_inbound_sale_guards guard
                    join public.inventory_items item
                      on item.store_id = guard.store_id
                     and item.legacy_product_id = guard.legacy_product_id
                    where guard.active and item.quantity > guard.protected_quantity
                  ),
                  'append_only_trigger', exists (
                    select 1 from pg_trigger
                    where tgname = 'collectible_sales_append_only' and not tgisinternal
                  ),
                  'archive_function', exists (
                    select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                    where n.nspname = 'public' and p.proname = 'archive_expired_collectible_sales'
                  ),
                  'record_sale_function', exists (
                    select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                    where n.nspname = 'public' and p.proname = 'record_collectible_sale'
                  ),
                  'ebay_sale_function', exists (
                    select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                    where n.nspname = 'public' and p.proname = 'apply_ebay_order_collectible_sale'
                  )
                ) as state;
              `,
            }),
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Read-only Production verification failed with HTTP ${response.status}: ${body.slice(0, 2000)}`);
          const rows = body ? JSON.parse(body) : [];
          const state = rows?.[0]?.state;
          if (!state) throw new Error('Read-only Production verification returned no state.');

          const blockers = [];
          for (const key of [
            'missing_historical_sale_rows',
            'resolved_sales_missing_price',
            'unresolved_sales_not_flagged',
            'invalid_sales',
            'duplicate_event_keys',
            'product_guard_violations',
            'inventory_guard_violations',
          ]) if (Number(state[key] || 0) !== 0) blockers.push(`${key}=${state[key]}`);
          for (const key of ['append_only_trigger','archive_function','record_sale_function','ebay_sale_function']) {
            if (state[key] !== true) blockers.push(`${key}=false`);
          }
          if (blockers.length) throw new Error(`Production SOLD database blockers: ${blockers.join(', ')}`);

          const receipt = {
            schema: 'truelycollectables.launch2.soldProductionDb.v1',
            sourceSha: process.env.EXPECTED_MAIN_SHA,
            verifiedAt: new Date().toISOString(),
            readOnly: true,
            state,
            blockers,
            notes: {
              historicalUnresolvedPricesRemainExplicitlyFlagged: true,
              noHistoricalPriceWasFabricatedByTheAudit: true,
              collxOnlyRowsAreExcludedInventoryNotMissingEbayInventory: true,
              adminMarkSoldElsewhereUsesRecordCollectibleSale: true,
            },
          };
          const dir = path.join('evidence', 'launch2-sold-production-db');
          fs.writeFileSync(path.join(dir, 'production-db-receipt.json'), `${JSON.stringify(receipt, null, 2)}\n`);
          fs.writeFileSync(path.join(dir, 'production-db-receipt.md'), [
            '# Launch 2 SOLD Production database receipt',
            '',
            `- Source SHA: \`${receipt.sourceSha}\``,
            `- Sale records: ${state.sale_records}`,
            `- Historical sales before July 28: ${state.historical_sales_before_2026_07_28}`,
            `- Historical verified/manual prices: ${state.historical_verified_or_manual}`,
            `- Historical unresolved prices: ${state.historical_unresolved}`,
            `- CollX-only items excluded: ${state.collx_only_excluded_items}`,
            `- Active inbound sale guards: ${state.active_sale_guards}`,
            '- Blockers: none',
            '',
          ].join('\n'));
          console.log(JSON.stringify({ ok: true, state }, null, 2));
          NODE
          rm -f "$RUNNER_TEMP/launch2-sold-db-verification/production.env"

      - name: Upload sanitized read-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-sold-production-db-receipt
          path: evidence/launch2-sold-production-db
          if-no-files-found: error
          retention-days: 90
