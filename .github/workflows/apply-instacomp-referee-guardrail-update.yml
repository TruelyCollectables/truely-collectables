name: Apply InstaComp Referee Guardrail Update

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-instacomp-referee-guardrail-update.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/instacomp-upper-deck-referee-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-upper-deck-referee-recovery
          fetch-depth: 0

      - name: Replace stale exact-parallel assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/check-production-guardrails.mjs")
          text = path.read_text()
          old = '  "registryParallelSignature === targetParallelSignature",\n'
          new = '  "registryParallelSignature !== parallelProfile.signature",\n'
          if text.count(old) != 1:
              raise SystemExit(
                  f"Exact-parallel guardrail anchor changed; refusing to patch ({text.count(old)} matches)."
              )
          path.write_text(text.replace(old, new, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prove updated production guardrail and matcher boundary
        run: |
          node scripts/check-production-guardrails.mjs
          node --import tsx scripts/run-instacomp-upper-deck-referee-recovery-regression.ts
          npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts
          npx tsx scripts/run-instacomp-identity-firewall-regressions.ts

      - name: Lint permanent files
        run: |
          npx eslint \
            scripts/check-production-guardrails.mjs \
            scripts/run-instacomp-upper-deck-referee-recovery-regression.ts \
            src/lib/instacomp-learning-server.ts
          git diff --check

      - name: Commit permanent guardrail update
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short scripts/check-production-guardrails.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-production-guardrails.mjs
          git commit -m "Update exact parallel production guardrail"
          git push origin HEAD:fix/instacomp-upper-deck-referee-recovery
