name: InstaComp teacher xAI contract fix

on:
  push:
    branches:
      - fix/instacomp-teacher-comp-mode-20260808

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[xai-contract-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out teacher branch
        uses: actions/checkout@v4
        with:
          ref: fix/instacomp-teacher-comp-mode-20260808
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply documented xAI Responses API contract
        run: node scripts/apply-instacomp-teacher-xai-contract-fix.mjs

      - name: Verify Grok teacher request and consensus
        run: node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts

      - name: Reject malformed patch
        run: git diff --check

      - name: Commit contract repair
        run: |
          git config user.name "Truely Collectables CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/instacomp-teacher-market-provider.ts
          git commit -m "Fix Grok teacher web search contract [xai-contract-applied]"
          git push origin HEAD:fix/instacomp-teacher-comp-mode-20260808
