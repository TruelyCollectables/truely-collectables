name: Apply KINGMAKER Auto Rematch 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-kingmaker-auto-rematch-20260803.yml"
      - "scripts/ops/apply-kingmaker-auto-rematch-20260803.mjs"

permissions:
  contents: read

concurrency:
  group: apply-kingmaker-auto-rematch-20260803
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 4fe527e3897b1a5376545033d604298117afc225
  EXPECTED_BRANCH: ops/apply-kingmaker-auto-rematch-20260803
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/kingmaker-auto-rematch-production-20260803

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/apply-kingmaker-auto-rematch-20260803.yml'
          test "${changed[1]}" = 'scripts/ops/apply-kingmaker-auto-rematch-20260803.mjs'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          cp scripts/ops/apply-kingmaker-auto-rematch-20260803.mjs "$RUNNER_TEMP/apply-kingmaker-auto-rematch-20260803.mjs"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/apply-kingmaker-auto-rematch-20260803.mjs" scripts/ops/apply-kingmaker-auto-rematch-20260803.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/kingmaker-auto-rematch-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/kingmaker-auto-rematch-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/kingmaker-auto-rematch-production/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/kingmaker-auto-rematch-production/production.env" >> "$GITHUB_ENV"

      - name: Apply, regress, backfill, and verify Production auto-rematch
        shell: bash
        env:
          ALLOW_KINGMAKER_AUTO_REMATCH_APPLY: "YES"
          RECEIPT_PATH: evidence/kingmaker-auto-rematch-production-20260803/receipt.json
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-kingmaker-checklist-auto-rematch-regressions.sql")
          text = path.read_text()
          old = "'regression/' || source_file_id || '.csv'"
          new = (
              "'tcos/checklist/sourcePath/v1/topps/topps-chrome-regression-' || "
              "replace(release_id::text, '-', '') || "
              "'/11/' || repeat('1', 64) || '-topps-chrome-regression.csv'"
          )
          if old not in text:
              raise SystemExit("Expected legacy regression storage path was not found.")
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/ops/apply-kingmaker-auto-rematch-20260803.mjs

      - name: Require sanitized passing receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'evidence/kingmaker-auto-rematch-production-20260803/receipt.json';
          const receipt = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (receipt.schema !== 'tcos.kingmaker.beckettAutoRematchProductionReceipt.v1') throw new Error('Unexpected receipt schema');
          if (receipt.status !== 'passed') throw new Error('Production auto-rematch receipt did not pass');
          if (receipt.expectedMainSha !== process.env.EXPECTED_MAIN_SHA) throw new Error('Receipt main SHA mismatch');
          if (receipt.regression?.passed !== true) throw new Error('Synthetic Production regression did not pass');
          if (receipt.pricesPromotedByThisOperation !== 0) throw new Error('Auto-rematch promoted prices');
          if (receipt.secretsPersisted !== false) throw new Error('Receipt safety assertion failed');
          const required = ['trigger_present','rpc_present','audit_table_present','audit_rls_enabled','public_table_grants_revoked','public_rpc_execute_revoked','service_rpc_execute'];
          for (const field of required) if (receipt.verification?.[field] !== true) throw new Error(`Missing verification ${field}`);
          if (receipt.after.exact < receipt.before.exact) throw new Error('Exact coverage decreased');
          if (receipt.after.beckettObservations !== receipt.before.beckettObservations) throw new Error('Beckett observation count changed');
          const text = fs.readFileSync(path, 'utf8');
          if (/eyJ[A-Za-z0-9_-]{20,}\.|sb_secret_|SUPABASE_ACCESS_TOKEN|VERCEL_TOKEN|postgres(?:ql)?:\/\//i.test(text)) throw new Error('Receipt contains secret-like material');
          NODE

      - name: Upload sanitized Production receipt
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-auto-rematch-production-20260803
          path: evidence/kingmaker-auto-rematch-production-20260803/receipt.json
          if-no-files-found: error
          retention-days: 30
