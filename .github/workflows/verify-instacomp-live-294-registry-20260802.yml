name: Verify InstaComp Live 294 Registry 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-instacomp-live-294-registry-20260802.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-instacomp-live-294-registry-20260802
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: c4af89106fd610f357933d321a7918575f2731f1
  EXPECTED_FIREWALL_SHA: bd7032819f87cbca3f3a2973452c37a2439edfd5
  EXPECTED_BRANCH: ops/verify-instacomp-live-294-registry-20260802
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/instacomp-live-294-registry-20260802

jobs:
  verify-live-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/verify-instacomp-live-294-registry-20260802.yml'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run complete InstaComp verification suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:instacomp
          node scripts/run-instacomp-release-attestation-regressions.mjs

      - name: Resolve masked Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"

          mkdir -p .vercel "$RUNNER_TEMP/instacomp-live-294"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi

          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/instacomp-live-294/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

          echo "PRODUCTION_ENV_PATH=$RUNNER_TEMP/instacomp-live-294/production.env" >> "$GITHUB_ENV"

      - name: Audit exact live 294-release Registry state
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/audit-instacomp-live-registry.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const envPath = String(process.env.PRODUCTION_ENV_PATH || '');
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const evidenceDir = String(process.env.EVIDENCE_DIR || 'evidence/instacomp-live-294-registry-20260802');
          if (!envPath || !accessToken) throw new Error('Production audit environment is incomplete.');

          const parsed = {};
          for (const raw of fs.readFileSync(envPath, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }

          const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          if (!projectRef) throw new Error('Could not resolve Production Supabase project.');
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;

          const query = `with active_versions as (
            select * from public.checklist_versions where is_active
          ), identity_counts as (
            select
              version_row.id,
              version_row.normalized_identity_count as expected_identities,
              count(identity_row.id)::bigint as actual_identities
            from active_versions version_row
            left join public.checklist_card_identities identity_row
              on identity_row.version_id = version_row.id
            group by version_row.id, version_row.normalized_identity_count
          ), adapter_counts as (
            select
              coalesce(release_row.metadata->>'latestAdapterId', '(none)') as adapter_id,
              count(*)::bigint as release_count
            from public.checklist_releases release_row
            group by coalesce(release_row.metadata->>'latestAdapterId', '(none)')
          )
          select json_build_object(
            'releases', (select count(*) from public.checklist_releases),
            'active_versions', (select count(*) from active_versions),
            'active_cards', (
              select count(*) from public.checklist_cards card_row
              join active_versions version_row on version_row.id = card_row.version_id
            ),
            'active_identities', (
              select count(*) from public.checklist_card_identities identity_row
              join active_versions version_row on version_row.id = identity_row.version_id
            ),
            'identity_deficit_versions', (
              select count(*) from identity_counts
              where actual_identities <> expected_identities
            ),
            'failed_import_runs', (
              select count(*) from public.checklist_import_runs where status = 'failed'
            ),
            'incomplete_adapter_releases', coalesce((
              select release_count from adapter_counts
              where adapter_id = 'pokemon-japanese-official-incomplete-reconciled'
            ), 0),
            'historical_adapter_releases', coalesce((
              select release_count from adapter_counts
              where adapter_id = 'pokemon-japanese-official-historical-reconciled'
            ), 0),
            'variant_adapter_releases', coalesce((
              select release_count from adapter_counts
              where adapter_id = 'pokemon-japanese-official-variant-reconciled'
            ), 0),
            'writer_rpc', to_regprocedure(
              'public.tcos_apply_checklist_import_plan(jsonb,text,text,bigint,text,text,text)'
            ) is not null,
            'private_source_bucket', exists (
              select 1 from storage.buckets
              where id = 'tcos-checklist-source-files' and public = false
            ),
            'registry_public_grants', (
              select count(*) from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name like 'checklist\\_%' escape '\\'
                and grantee in ('anon', 'authenticated')
            )
          ) as state;`;

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${accessToken}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ query, parameters: [], read_only: true }),
          });
          const text = await response.text();
          if (!response.ok) {
            throw new Error(`Supabase read-only audit failed with HTTP ${response.status}: ${text.slice(0, 1000)}`);
          }
          const rows = text ? JSON.parse(text) : [];
          const state = rows?.[0]?.state;
          if (!state) throw new Error('Production audit returned no state.');

          const expected = {
            releases: 294,
            active_versions: 294,
            active_cards: 33483,
            active_identities: 35898,
            identity_deficit_versions: 0,
            failed_import_runs: 0,
            incomplete_adapter_releases: 3,
            historical_adapter_releases: 17,
            variant_adapter_releases: 2,
            registry_public_grants: 0,
          };

          const mismatches = Object.entries(expected)
            .filter(([key, value]) => Number(state[key]) !== value)
            .map(([key, value]) => `${key}=${state[key]}, expected=${value}`);
          if (state.writer_rpc !== true) mismatches.push('writer_rpc=false');
          if (state.private_source_bucket !== true) mismatches.push('private_source_bucket=false');
          if (mismatches.length) throw new Error(`Live Registry audit blocked: ${mismatches.join(', ')}`);

          fs.mkdirSync(evidenceDir, { recursive: true });
          fs.writeFileSync(
            path.join(evidenceDir, 'production-registry.json'),
            `${JSON.stringify({ sourceSha: process.env.EXPECTED_MAIN_SHA, state }, null, 2)}\n`,
          );
          console.log(JSON.stringify(state, null, 2));
          NODE

          node "$RUNNER_TEMP/audit-instacomp-live-registry.mjs"

      - name: Verify both live InstaComp release endpoints contain the identity firewall
        shell: bash
        run: |
          set -euo pipefail
          primary='https://truelycollectables.com/instacomp-release.json'
          alias='https://truely-collectables.vercel.app/instacomp-release.json'

          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-${attempt}"
            echo "Live release verification attempt ${attempt}/30"
            primary_ok=false
            alias_ok=false
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${primary}?v=${nonce}" -o /tmp/primary.json && primary_ok=true || true
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${alias}?v=${nonce}" -o /tmp/alias.json && alias_ok=true || true

            if [[ "$primary_ok" == true && "$alias_ok" == true ]]; then
              if node <<'NODE'
          const fs = require('node:fs');
          const primary = JSON.parse(fs.readFileSync('/tmp/primary.json', 'utf8'));
          const alias = JSON.parse(fs.readFileSync('/tmp/alias.json', 'utf8'));
          const expectedRelease = 'evidence-first-95-ai-council-30';
          const validSha = (value) => /^[0-9a-f]{40}$/i.test(String(value || ''));
          const contractOk = (value) =>
            value.schema === 'tcos.instacomp.release.v1' &&
            value.backendRelease === expectedRelease &&
            value.identityThreshold === 0.95 &&
            value.requiresBackImage === true &&
            value.compSearchRequiresConfirmedIdentity === true &&
            value.learningRequiresConfirmedIdentity === true &&
            value.aiCouncilDefaultReaders === 8 &&
            value.aiCouncilMaxReaders === 30 &&
            value.aiCouncilFamilyVoteCap === true &&
            value.aiCouncilReserveReaders === true &&
            value.aiCouncilCustomProviderSlots === 14 &&
            validSha(value.sourceCommit);
          if (!contractOk(primary) || !contractOk(alias)) process.exit(1);
          if (primary.sourceCommit !== alias.sourceCommit) process.exit(1);
          fs.writeFileSync('/tmp/production-sha', primary.sourceCommit);
          fs.mkdirSync(process.env.EVIDENCE_DIR, { recursive: true });
          fs.copyFileSync('/tmp/primary.json', `${process.env.EVIDENCE_DIR}/primary-release.json`);
          fs.copyFileSync('/tmp/alias.json', `${process.env.EVIDENCE_DIR}/alias-release.json`);
          console.log(`Both domains report ${primary.backendRelease} at ${primary.sourceCommit}.`);
          NODE
              then
                production_sha="$(cat /tmp/production-sha)"
                git fetch --no-tags origin "$production_sha" --depth=1 || true
                if git merge-base --is-ancestor "$EXPECTED_FIREWALL_SHA" "$production_sha"; then
                  printf '%s\n' "$production_sha" > "$EVIDENCE_DIR/production-source-commit.txt"
                  echo "PASS: Production contains identity firewall $EXPECTED_FIREWALL_SHA."
                  exit 0
                fi
                echo "Production commit $production_sha does not yet contain the identity firewall."
              else
                echo "Production release contract is incomplete, stale, or inconsistent."
              fi
            else
              echo "One or both Production release endpoints are not ready."
            fi

            sleep 20
          done

          echo "FAIL: Production did not prove the identity firewall within 10 minutes."
          exit 1

      - name: Write sanitized verification summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const registry = require('./evidence/instacomp-live-294-registry-20260802/production-registry.json');
          const productionSha = fs.readFileSync('./evidence/instacomp-live-294-registry-20260802/production-source-commit.txt', 'utf8').trim();
          const text = [
            '# InstaComp live 294-release Registry verification',
            '',
            `- Verified source commit: \`${process.env.EXPECTED_MAIN_SHA}\``,
            `- Live Production source commit: \`${productionSha}\``,
            `- Required identity firewall: \`${process.env.EXPECTED_FIREWALL_SHA}\``,
            `- Registry releases: ${registry.state.releases}`,
            `- Active Registry versions: ${registry.state.active_versions}`,
            `- Active cards: ${registry.state.active_cards}`,
            `- Active physical-printing identities: ${registry.state.active_identities}`,
            `- Identity deficit versions: ${registry.state.identity_deficit_versions}`,
            `- Failed import runs: ${registry.state.failed_import_runs}`,
            `- Japanese final-variant releases: ${registry.state.variant_adapter_releases}`,
            '- Complete InstaComp verification suite: passed',
            '- Both Production domains: passed',
            '- Registry audit mode: read-only',
            '',
          ].join('\n');
          fs.writeFileSync('./evidence/instacomp-live-294-registry-20260802/summary.md', text);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          NODE

      - name: Remove temporary Production environment file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/instacomp-live-294/production.env"

      - name: Upload sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-live-294-registry-20260802
          path: evidence/instacomp-live-294-registry-20260802
          if-no-files-found: warn
          retention-days: 90
