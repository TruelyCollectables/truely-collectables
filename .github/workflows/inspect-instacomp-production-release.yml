name: Inspect InstaComp Production Release

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inspect-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect fixed InstaComp production release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: caba3a751a502c12800fe4640f4a6c143ab9d7b7
        run: |
          set -euo pipefail
          response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/instacomp-production-release.yml/runs?branch=main&event=push&per_page=20")"
          echo "$response" | jq -r '.workflow_runs[] | [.id,.head_sha,.status,(.conclusion // "pending"),.created_at,.html_url] | @tsv'
          run="$(echo "$response" | jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha == $sha)' | head -n 1)"
          test -n "$run"
          echo "Matched release run:"
          echo "$run" | jq '{id,head_sha,status,conclusion,created_at,updated_at,html_url}'
          run_id="$(echo "$run" | jq -r '.id')"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | {id,name,status,conclusion,started_at,completed_at,html_url,steps:[.steps[] | {name,status,conclusion}]}'
