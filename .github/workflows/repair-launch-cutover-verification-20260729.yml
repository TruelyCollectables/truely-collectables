name: Repair Launch Cutover Verification 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-launch-cutover-verification-20260729.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/launch-money-inventory-safety-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out guarded deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/launch-money-inventory-safety-20260729
          fetch-depth: 0

      - name: Patch verified assertion and disposable deployment handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml')
          text = target.read_text(encoding='utf-8')

          if text.count('order_notification_outbox') != 2:
              raise SystemExit('Expected exactly two stale order notification table references.')
          text = text.replace('order_notification_outbox', 'order_notification_deliveries')

          if text.count('| tail -n 1)') != 2:
              raise SystemExit('Expected exactly two deployment URL tail selectors.')
          text = text.replace('| tail -n 1)', '| head -n 1)')

          marker = '''          node -e 'const p=require("./.vercel/project.json"); if(!p.orgId||!p.projectId) process.exit(1);'\n\n      - name: Revalidate all affected safety gates\n'''
          cleanup = '''          node -e 'const p=require("./.vercel/project.json"); if(!p.orgId||!p.projectId) process.exit(1);'\n\n      - name: Remove prior disposable deployment if present\n        shell: bash\n        run: |\n          set +e\n          npx vercel@56.2.0 remove https://truely-collectables-mlp1vd0p3-truelycollectables-projects.vercel.app --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/prior-cutover-removal.txt" 2>&1\n          exit 0\n\n      - name: Revalidate all affected safety gates\n'''
          if marker not in text:
              raise SystemExit('Expected Vercel link-to-revalidation marker was not found.')
          text = text.replace(marker, cleanup, 1)

          target.write_text(text, encoding='utf-8')
          PY
          git rm -- .github/workflows/repair-launch-cutover-verification-20260729.yml
          git diff --check
          grep -Fq "order_notification_deliveries" .github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml
          ! grep -Fq "order_notification_outbox" .github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml
          grep -Fq "| head -n 1)" .github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml
          grep -Fq "Remove prior disposable deployment if present" .github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml

      - name: Commit guarded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/authorized-launch-money-inventory-safety-deploy-20260729.yml
          git commit -m "Correct guarded cutover verification and cleanup"
          git push origin HEAD:deploy/launch-money-inventory-safety-20260729
