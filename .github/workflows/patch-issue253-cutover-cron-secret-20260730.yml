name: Patch Issue 253 Cutover Cron Secret 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-issue253-cutover-cron-secret-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'deploy/issue253-hosted-cutover-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLD_BLOCK_B64: 
      NEW_BLOCK_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/issue253-hosted-cutover-20260730
          fetch-depth: 0

      - name: Guard exact workflow source and main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "11b95609b4af979283c1d72cf1019f1bc0e9fc85"
          test "$(git hash-object .github/workflows/issue253-hosted-cutover-20260730.yml)" = "c05fbe1e351e559a64964b700d564b5212079678"

      - name: Patch Vercel Production cron-secret import
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,base64; from pathlib import Path; p=Path(".github/workflows/issue253-hosted-cutover-20260730.yml"); t=p.read_text(); t=t.replace("      LIVE_CRON_SECRET: ${{ secrets.CRON_SECRET }}\n", "", 1); old=base64.b64decode(os.environ["OLD_BLOCK_B64"]).decode(); new=base64.b64decode(os.environ["NEW_BLOCK_B64"]).decode(); assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1))'
          git diff --check
          grep -Fq 'values.CRON_SECRET' .github/workflows/issue253-hosted-cutover-20260730.yml
          if grep -Fq 'secrets.CRON_SECRET' .github/workflows/issue253-hosted-cutover-20260730.yml; then exit 1; fi
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/issue253-hosted-cutover-20260730.yml"); puts "Cutover YAML parsed."'

      - name: Stage validated workflow as ordinary data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutover-staging
          cp .github/workflows/issue253-hosted-cutover-20260730.yml cutover-staging/issue253-hosted-cutover-20260730.yml
          sha256sum cutover-staging/issue253-hosted-cutover-20260730.yml > cutover-staging/issue253-hosted-cutover-20260730.sha256
          git checkout -- .github/workflows/issue253-hosted-cutover-20260730.yml
          git diff --quiet
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cutover-staging/issue253-hosted-cutover-20260730.yml cutover-staging/issue253-hosted-cutover-20260730.sha256
          git commit -m "Stage Vercel-sourced cutover credential workflow"
          git push origin HEAD:deploy/issue253-hosted-cutover-20260730
