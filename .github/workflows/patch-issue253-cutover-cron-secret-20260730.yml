name: Patch Issue 253 Cutover Cron Secret 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-issue253-cutover-cron-secret-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'deploy/issue253-hosted-cutover-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/issue253-hosted-cutover-20260730
          fetch-depth: 0

      - name: Guard exact workflow source and main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "11b95609b4af979283c1d72cf1019f1bc0e9fc85"
          test "$(git hash-object .github/workflows/issue253-hosted-cutover-20260730.yml)" = "c05fbe1e351e559a64964b700d564b5212079678"

      - name: Patch Vercel Production cron-secret import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/issue253-hosted-cutover-20260730.yml')
          text = path.read_text()
          text = ''.join(
              line for line in text.splitlines(True)
              if 'LIVE_CRON_SECRET:' not in line
          )
          old_test = '          test -n "${LIVE_CRON_SECRET:-}"\n'
          old_mask = '          echo "::add-mask::$LIVE_CRON_SECRET"\n'
          anchor = '''          npx vercel@56.2.0 env pull "$RUNNER_TEMP/issue253-cutover/production.env" \\
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
'''
          addition = anchor + '''          unset CRON_SECRET
          set -a
          source "$RUNNER_TEMP/issue253-cutover/production.env"
          set +a
          test -n "${CRON_SECRET:-}"
          test "$CRON_SECRET" != "build-validation-cron-secret-that-is-long-enough"
          echo "::add-mask::$CRON_SECRET"
          printf 'LIVE_CRON_SECRET=%s\\n' "$CRON_SECRET" >> "$GITHUB_ENV"
          unset CRON_SECRET
'''
          if text.count(old_test) != 1:
              raise SystemExit(f'Expected one LIVE_CRON_SECRET test, found {text.count(old_test)}.')
          if text.count(old_mask) != 1:
              raise SystemExit(f'Expected one LIVE_CRON_SECRET mask, found {text.count(old_mask)}.')
          text = text.replace(old_test, '', 1).replace(old_mask, '', 1)
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one Vercel env-pull anchor, found {text.count(anchor)}.')
          path.write_text(text.replace(anchor, addition, 1))
          PY
          git diff --check
          grep -Fq 'source "$RUNNER_TEMP/issue253-cutover/production.env"' .github/workflows/issue253-hosted-cutover-20260730.yml
          grep -Fq "printf 'LIVE_CRON_SECRET=%s" .github/workflows/issue253-hosted-cutover-20260730.yml
          if grep -Fq 'secrets.CRON_SECRET' .github/workflows/issue253-hosted-cutover-20260730.yml; then exit 1; fi
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/issue253-hosted-cutover-20260730.yml"); puts "Cutover YAML parsed."'

      - name: Stage validated workflow as ordinary data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutover-staging
          cp .github/workflows/issue253-hosted-cutover-20260730.yml cutover-staging/issue253-hosted-cutover-20260730.yml
          sha256sum cutover-staging/issue253-hosted-cutover-20260730.yml > cutover-staging/issue253-hosted-cutover-20260730.sha256
          git checkout -- .github/workflows/issue253-hosted-cutover-20260730.yml
          git diff --quiet
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cutover-staging/issue253-hosted-cutover-20260730.yml cutover-staging/issue253-hosted-cutover-20260730.sha256
          git commit -m "Stage Vercel-sourced cutover credential workflow"
          git push origin HEAD:deploy/issue253-hosted-cutover-20260730
