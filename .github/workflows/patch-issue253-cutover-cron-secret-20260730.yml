name: Patch Issue 253 Cutover Cron Secret 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-issue253-cutover-cron-secret-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'deploy/issue253-hosted-cutover-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/issue253-hosted-cutover-20260730
          fetch-depth: 0

      - name: Guard exact workflow source and main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "11b95609b4af979283c1d72cf1019f1bc0e9fc85"
          test "$(git hash-object .github/workflows/issue253-hosted-cutover-20260730.yml)" = "c05fbe1e351e559a64964b700d564b5212079678"

      - name: Patch Vercel Production cron-secret import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/issue253-hosted-cutover-20260730.yml')
          text = path.read_text()
          text = text.replace('      LIVE_CRON_SECRET: ${{ secrets.CRON_SECRET }}\n', '', 1)
          old = '''          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          test -n "${LIVE_CRON_SECRET:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$LIVE_CRON_SECRET"
          mkdir -p .vercel "$RUNNER_TEMP/issue253-cutover"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/issue253-cutover/production.env" \\
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
'''
          new = '''          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/issue253-cutover"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/issue253-cutover/production.env" \\
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const file = path.join(process.env.RUNNER_TEMP, 'issue253-cutover', 'production.env');
          const text = fs.readFileSync(file, 'utf8');
          const values = {};
          for (const raw of text.split(/\\r?\\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            values[line.slice(0, index).trim()] = value;
          }
          const cronSecret = String(values.CRON_SECRET || '').trim();
          if (cronSecret.length < 16 || cronSecret === 'build-validation-cron-secret-that-is-long-enough') {
            throw new Error('Production CRON_SECRET was not pulled from Vercel.');
          }
          console.log(`::add-mask::${cronSecret}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `LIVE_CRON_SECRET=${cronSecret}\\n`);
          NODE
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one credential block, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -Fq 'values.CRON_SECRET' .github/workflows/issue253-hosted-cutover-20260730.yml
          if grep -Fq 'secrets.CRON_SECRET' .github/workflows/issue253-hosted-cutover-20260730.yml; then exit 1; fi
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/issue253-hosted-cutover-20260730.yml"); puts "Cutover YAML parsed."'

      - name: Stage validated workflow as ordinary data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutover-staging
          cp .github/workflows/issue253-hosted-cutover-20260730.yml cutover-staging/issue253-hosted-cutover-20260730.yml
          sha256sum cutover-staging/issue253-hosted-cutover-20260730.yml > cutover-staging/issue253-hosted-cutover-20260730.sha256
          git checkout -- .github/workflows/issue253-hosted-cutover-20260730.yml
          git diff --quiet
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cutover-staging/issue253-hosted-cutover-20260730.yml cutover-staging/issue253-hosted-cutover-20260730.sha256
          git commit -m "Stage Vercel-sourced cutover credential workflow"
          git push origin HEAD:deploy/issue253-hosted-cutover-20260730
