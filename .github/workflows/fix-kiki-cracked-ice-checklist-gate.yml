name: Fix Kiki Cracked Ice checklist gate

on:
  push:
    branches: [agent/fix-kiki-cracked-ice-checklist-gate]

permissions:
  contents: write

jobs:
  patch-test-build-commit:
    if: ${{ !contains(github.event.head_commit.message, '[kiki-checklist-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-at-least-32-characters
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      OPENAI_API_KEY: build-only-placeholder-openai-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-kiki-cracked-ice-checklist-gate
          fetch-depth: 0

      - run: python scripts/fix-kiki-cracked-ice-checklist-gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/run-kiki-cracked-ice-checklist-audit.mjs
      - run: node scripts/run-card-image-editor-audit.mjs
      - run: node scripts/run-tcos-listing-gateway-audit.mjs
      - run: node scripts/run-simplified-list-route-audit.mjs
      - run: npm run verify:admin-dashboard
      - run: npm run build

      - name: Commit verified checklist fix
        run: |
          rm .github/workflows/fix-kiki-cracked-ice-checklist-gate.yml
          rm scripts/fix-kiki-cracked-ice-checklist-gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Checklist-gate InstaComp and restore Kiki Cracked Ice [kiki-checklist-ready]"
          git push origin HEAD:agent/fix-kiki-cracked-ice-checklist-gate
