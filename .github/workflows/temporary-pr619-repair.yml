name: Temporary PR 619 Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      ADMIN_SESSION_SECRET: placeholder-placeholder-placeholder-placeholder
      OPENAI_API_KEY: placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      RESEND_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Merge certified main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate synchronized workbenches
        run: |
          node --import tsx scripts/run-kingmaker-pricing-workbenches-regressions.ts
          npx eslint src/app/admin/instacomp/pricing scripts/run-kingmaker-pricing-workbenches-regressions.ts
          npx tsc --noEmit
          node scripts/run-dependency-security-audit.mjs
      - name: Push synchronized branch
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
