name: Diagnose Storefront Taxonomy V7 Features 20260728

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-storefront-taxonomy-v7-features-20260728.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/storefront-taxonomy-v7-no-junk-buckets-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-taxonomy-v7-no-junk-buckets-20260728
          fetch-depth: 1

      - name: Materialize taxonomy v7 candidate
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/one-time-storefront-taxonomy-v7-no-junk-buckets-v2-20260728.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format and validate taxonomy v7"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/taxonomy-v7-patch.py').write_text(textwrap.dedent(workflow[start:end]))
          PY
          python /tmp/taxonomy-v7-patch.py

      - name: Diagnose feature values
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cat > /tmp/taxonomy-v7-diagnostic.ts <<'TS'
          import fs from "node:fs";
          import { classifyStorefrontItem, matchesStorefrontFilters } from "./src/lib/storefront-taxonomy";
          const cases = {
            baseballJerseyCard: classifyStorefrontItem({
              title: "2004 SkyBox LE #20 Josh Beckett PINSTRIPE Jersey Proof /299",
              rawSport: "Baseball",
              primaryCategory: "memorabilia",
            }),
            hockeyRelicCard: classifyStorefrontItem({
              title: "2017-18 SP Game Used #FW-JQ Jonathan Quick Frameworks Jumbo Jersey Relic",
              rawSport: "Ice Hockey",
              primaryCategory: "memorabilia",
            }),
            gradedBaseball: classifyStorefrontItem({
              title: "1989 Upper Deck #13 Gary Sheffield RC PSA 10",
              primaryCategory: "sports_cards",
            }),
            multiFeatureCard: classifyStorefrontItem({
              title: "2025 Panini Origins Shedeur Sanders RC Jumbo Patch Auto Pink RPA FOTL /12 PSA 9",
              primaryCategory: "sports_cards",
            }),
          };
          const output = {
            cases,
            memorabiliaFilter: matchesStorefrontFilters(cases.baseballJerseyCard, {
              feature: "memorabilia cards",
            }),
          };
          fs.mkdirSync("taxonomy-v7-diagnostic", { recursive: true });
          fs.writeFileSync("taxonomy-v7-diagnostic/result.json", `${JSON.stringify(output, null, 2)}\n`);
          console.log(JSON.stringify(output));
          TS
          cp /tmp/taxonomy-v7-diagnostic.ts taxonomy-v7-diagnostic/diagnostic.ts
          node --import tsx taxonomy-v7-diagnostic/diagnostic.ts
          npx prettier --write scripts/run-storefront-taxonomy-regressions.ts
          cp scripts/run-storefront-taxonomy-regressions.ts taxonomy-v7-diagnostic/generated-regressions.ts
          set +e
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts > taxonomy-v7-diagnostic/regression.log 2>&1
          echo "$?" > taxonomy-v7-diagnostic/regression-exit.txt
          set -e

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-v7-feature-diagnostic-${{ github.run_number }}
          path: taxonomy-v7-diagnostic
          if-no-files-found: error
          retention-days: 30
