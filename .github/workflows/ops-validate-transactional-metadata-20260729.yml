name: Validate Transactional Metadata 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-validate-transactional-metadata-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-transactional-metadata-20260729
  cancel-in-progress: false

jobs:
  validate-exact-source:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/validate-transactional-metadata-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: 7765f115d44e2629d47cc38871273dacdafcb8e7
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      EVIDENCE_DIR: /tmp/transactional-metadata-evidence
    steps:
      - name: Check out exact merged metadata source
        uses: actions/checkout@v4
        with:
          ref: 7765f115d44e2629d47cc38871273dacdafcb8e7
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused transactional metadata regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          node scripts/simulate-transactional-canonical-metadata.mjs | tee "$EVIDENCE_DIR/transactional-metadata-contracts.log"

      - name: Run lint and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run lint | tee "$EVIDENCE_DIR/lint.log"
          npx tsc --noEmit --pretty false | tee "$EVIDENCE_DIR/typescript.log"

      - name: Run full local Production build
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_SUPABASE_URL=https://build-validation.invalid \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=build-validation-anon-key \
          SUPABASE_SERVICE_ROLE_KEY=build-validation-service-role-key \
          NEXT_PUBLIC_SITE_URL=https://truelycollectables.com \
          STRIPE_SECRET_KEY=sk_test_build_only_placeholder \
          STRIPE_WEBHOOK_SECRET=whsec_build_only_placeholder \
          ADMIN_SESSION_SECRET=build-only-placeholder-session-secret-that-is-long-enough \
          ADMIN_PASSWORD=build-only-placeholder-admin-password \
            npm run build | tee "$EVIDENCE_DIR/production-build.log"

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          node -e 'const p=require("./.vercel/project.json"); if(!p.orgId||!p.projectId) process.exit(1);'

      - name: Stage exact merged source with Production environment and no domains
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          npx vercel@56.2.0 deploy --prod --yes --force --skip-domain \
            --meta "launchSourceSha=$SOURCE_SHA" \
            --meta "launchPurpose=transactional-metadata-validation" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/vercel-stage.log"
          STAGE_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$EVIDENCE_DIR/vercel-stage.log" | head -n 1)"
          test -n "$STAGE_URL"
          echo "stage_url=$STAGE_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$STAGE_URL" > "$EVIDENCE_DIR/stage-url.txt"

      - name: Verify rendered canonical and privacy metadata
        env:
          STAGE_URL: ${{ steps.stage.outputs.stage_url }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'cart:/cart' 'signup:/account/signup'; do
            name="${pair%%:*}"
            path="${pair#*:}"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output "$EVIDENCE_DIR/${name}.html" --write-out '%{http_code}' "$STAGE_URL$path")"
            test "$code" = "200"
            grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex[^"]*nofollow|<meta[^>]+content="[^"]*noindex[^"]*nofollow[^"]*"[^>]+name="robots"' "$EVIDENCE_DIR/${name}.html"
            grep -Eiq "<link[^>]+rel=\"canonical\"[^>]+href=\"https://truelycollectables.com${path}\"|<link[^>]+href=\"https://truelycollectables.com${path}\"[^>]+rel=\"canonical\"" "$EVIDENCE_DIR/${name}.html"
          done

      - name: Run focused staged Lighthouse policy checks
        env:
          STAGE_URL: ${{ steps.stage.outputs.stage_url }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'cart:/cart' 'signup:/account/signup'; do
            name="${pair%%:*}"
            path="${pair#*:}"
            npx --yes lighthouse@12.8.2 "$STAGE_URL$path" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="$EVIDENCE_DIR/lighthouse-${name}.json" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet
          done
          node - <<'NODE'
          const fs = require('fs');
          const dir = process.env.EVIDENCE_DIR;
          const summary = [];
          for (const name of ['cart', 'signup']) {
            const report = JSON.parse(fs.readFileSync(`${dir}/lighthouse-${name}.json`, 'utf8'));
            const row = {
              page: name,
              performance: Math.round((report.categories.performance?.score || 0) * 100),
              accessibility: Math.round((report.categories.accessibility?.score || 0) * 100),
              bestPractices: Math.round((report.categories['best-practices']?.score || 0) * 100),
              seo: Math.round((report.categories.seo?.score || 0) * 100),
              canonical: report.audits.canonical?.score,
              crawlable: report.audits['is-crawlable']?.score,
            };
            if (row.canonical !== 1) throw new Error(`${name} canonical audit did not pass.`);
            if (row.crawlable !== 0) throw new Error(`${name} must remain intentionally non-indexable.`);
            if (row.accessibility < 90) throw new Error(`${name} accessibility is below 90.`);
            if (row.bestPractices < 85) throw new Error(`${name} best practices are below 85.`);
            summary.push(row);
          }
          fs.writeFileSync(`${dir}/lighthouse-policy-summary.json`, JSON.stringify({ ok: true, rows: summary }, null, 2));
          console.table(summary);
          NODE

      - name: Upload sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transactional-metadata-validation-${{ github.run_number }}
          path: /tmp/transactional-metadata-evidence
          if-no-files-found: error
          retention-days: 30
