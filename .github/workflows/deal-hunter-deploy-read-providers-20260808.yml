name: Deal Hunter Deploy And Read Providers 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/deal-hunter-deploy-read-providers-20260808.marker'
      - '.github/workflows/deal-hunter-deploy-read-providers-20260808.yml'

permissions:
  contents: read

jobs:
  deploy-and-read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      SITE_URL: https://truelycollectables.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy exact current main
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          git fetch origin main
          git checkout --detach origin/main
          echo "DEPLOYING_MAIN_SHA=$(git rev-parse HEAD)"
          npx vercel@56.2.0 --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
      - name: Read exact identity and pricing-stage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o diagnostics.json -w '%{http_code}' --max-time 60 -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$SITE_URL/api/release/instacomp-deal-hunter-candidate-diagnostics" || true)"
            if [[ "$code" == "200" ]] && node -e "const p=require('./diagnostics.json'); process.exit(p.success===true?0:1)"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Candidate diagnostics never became ready; HTTP=$code" >&2
              cat diagnostics.json >&2 || true
              exit 1
            fi
            sleep 10
          done
          cat diagnostics.json
          node - <<'NODE'
          const p=require('./diagnostics.json');
          if(!p.success) throw new Error(JSON.stringify(p));
          const latestRun=(p.latestRuns||[])[0]||null;
          const runId=latestRun?.run_id||null;
          const rows=(p.productionCandidates||[]).filter(r=>!runId || r.run_id===runId);
          const byError={};
          const byLabel={};
          const identity=[];
          for(const row of rows){
            const ev=row.evaluation||{};
            const code=ev.errorCode||ev.error_code||'NONE';
            const label=row.deal_label||ev.dealLabel||'NONE';
            byError[code]=(byError[code]||0)+1;
            byLabel[label]=(byLabel[label]||0)+1;
            const ai=row.identity||{};
            const market=row.exact_market||{};
            identity.push({
              candidateKey:row.candidate_key,
              title:row.title,
              player:ai.playerName||ai.player||null,
              year:ai.year||null,
              brand:ai.brand||null,
              setName:ai.setName||ai.set||null,
              cardNumber:ai.cardNumber||null,
              parallel:ai.parallel||ai.parallelName||null,
              serialNumber:ai.serialNumber||ai.serial||null,
              autograph:ai.autograph??ai.isAutograph??null,
              relic:ai.relic??ai.isRelic??null,
              identityConfidence:ai.confidence??null,
              exactMarketStatus:market.status||null,
              missingIdentityFields:market.missingIdentityFields||[],
              pricingEligibleSoldCount:market.pricingEligibleSoldCount??market.soldCount??null,
              trustedSuggestedPrice:market.trustedSuggestedPrice??null,
              errorCode:code,
              reason:ev.reason||null,
            });
          }
          console.log('DEAL_HUNTER_LIVE_IDENTITY_DIAGNOSTICS='+JSON.stringify({latestRun,runCandidateCount:rows.length,byError,byLabel,identity}));
          NODE
