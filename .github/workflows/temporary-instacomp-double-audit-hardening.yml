name: Commit Certified InstaComp Source

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/temporary-instacomp-double-audit-hardening.yml"

permissions:
  contents: write

jobs:
  materialize-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize final audited source
        run: |
          set -euo pipefail
          python -m py_compile scripts/harden-instacomp-*.py scripts/run-instacomp-*.py
          python scripts/harden-instacomp-ebay-benchmark.py
          python scripts/harden-instacomp-benchmark-source.py
          python scripts/harden-instacomp-benchmark-cleanup.py
          python scripts/run-instacomp-certification-safe.py
          python scripts/harden-instacomp-visual-proof.py
          python scripts/harden-instacomp-visual-review-types.py
          python scripts/harden-instacomp-benchmark-report.py
          python scripts/run-instacomp-final-materialization.py
          npm pkg set 'dependencies.sharp=^0.34.5'
          npm install --package-lock-only
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          python scripts/check-instacomp-control-characters.py
          git diff --check

      - name: Install exact materialized dependencies
        run: npm ci

      - name: Verify certified source
        run: |
          set -euo pipefail
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-live-pipeline-regressions.ts
          node --import tsx scripts/run-instacomp-batch-drop-regressions.ts
          npx eslint \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/app/api/instacomp/live-scan/route.ts \
            src/app/api/instacomp/scan/route.ts \
            src/app/api/account/seller/inventory/instacomp/route.ts \
            src/app/instacomp-test/InstaCompBatchLiveScanner.tsx \
            src/lib/instacomp.ts \
            src/lib/instacomp-benchmark-title.ts \
            src/lib/instacomp-live-pipeline.ts \
            src/lib/instacomp-exact-market-provider.ts \
            src/lib/instacomp-openai-web-market-provider.ts \
            src/lib/instacomp-comp-visual-verification.ts \
            src/lib/instacomp-curated-checklist.ts \
            src/lib/instacomp-image-safety.ts \
            src/lib/instacomp-image-orientation.ts \
            scripts/run-instacomp-exact-market-proof-regressions.ts \
            scripts/run-instacomp-final-audit-regressions.ts
          npm run build

      - name: Commit certified source
        run: |
          set -euo pipefail
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f instacomp-final-materialization.log instacomp-materialization-status.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts src
          git diff --cached --check
          git diff --cached --quiet && { echo "No certified source changes were produced"; exit 1; }
          git commit -m "Commit certified InstaComp hardened source"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
