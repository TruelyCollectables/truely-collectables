name: Temporary InstaComp Catalog Commit

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/temporary-instacomp-double-audit-hardening.yml"

permissions:
  contents: write

jobs:
  commit-catalog-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate audited catalog resolver
        run: |
          python -m py_compile scripts/harden-instacomp-catalog-registry.py scripts/harden-instacomp-official-catalog-resolution.py
          python scripts/harden-instacomp-catalog-registry.py
          python scripts/harden-instacomp-official-catalog-resolution.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/instacomp-curated-checklist.ts")
          text = path.read_text()
          if "\x08" in text:
              raise SystemExit("The committed curated checklist still contains a hidden backspace byte")
          required = (
              "officialBenchmarkCatalogCandidate",
              "parallelEvidenceTokens",
              "inputParallelDistinctive.every",
              "tcos-official-${testCase.id}",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f"Missing audited catalog markers: {missing}")
          PY
          git diff --check

      - name: Verify exact-market regression and build
        run: |
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          npm run build

      - name: Commit generated catalog source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-curated-checklist.ts
          git diff --cached --quiet && { echo "No catalog source changes were produced"; exit 1; }
          git commit -m "Commit audited InstaComp catalog resolver"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
