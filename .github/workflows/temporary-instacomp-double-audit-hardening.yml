name: Materialize Certified InstaComp Source

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/temporary-instacomp-double-audit-hardening.yml"

permissions:
  contents: write

jobs:
  materialize-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize certified source
        run: |
          set -euo pipefail
          python -m py_compile scripts/harden-instacomp-*.py scripts/run-instacomp-*.py
          python scripts/harden-instacomp-ebay-benchmark.py
          python scripts/harden-instacomp-benchmark-source.py
          python scripts/harden-instacomp-benchmark-cleanup.py
          python scripts/run-instacomp-certification-safe.py
          python scripts/run-instacomp-visual-proof-safe.py
          python scripts/harden-instacomp-visual-review-types.py
          python scripts/harden-instacomp-benchmark-report.py
          python scripts/run-instacomp-final-materialization.py
          npm pkg set 'dependencies.sharp=^0.34.5'
          npm install --package-lock-only --ignore-scripts
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          python scripts/check-instacomp-control-characters.py
          python scripts/assert-instacomp-final-source.py
          git diff --check

      - name: Commit certified source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts src
          git diff --cached --check
          git diff --cached --quiet && { echo "No certified source changes were produced"; exit 1; }
          git commit -m "Commit certified InstaComp hardened source"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
