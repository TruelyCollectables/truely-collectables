name: InstaComp Final Acceptance Lock Diagnostic 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-final-acceptance-lock-diagnostic-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  EXPECTED_MAC_FINGERPRINT: 2770182734974db303a76c5c8a440bcfb75d430b5d6281ae3eda95bf6b5d1a32

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Production acceptance lock state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > /tmp/vercel-env.txt
          if grep -q 'INSTACOMP_SERVICE_TOKEN' /tmp/vercel-env.txt; then
            echo 'temporary_scanner_credential_present=true'
          else
            echo 'temporary_scanner_credential_present=false'
          fi
          code="$(curl -sS --max-time 30 -o /tmp/readiness.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?diagnostic=lock&ts=$(date +%s)")"
          echo "readiness_http=$code"
          test "$code" = "200"
          node - /tmp/readiness.json "$EXPECTED_MAC_FINGERPRINT" <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`readiness_ok=${body.ok===true}`);
          console.log(`runtime_fingerprint_match=${body.runtimeSourceFingerprint===process.argv[3]}`);
          console.log(`configured=${body.configured===true}`);
          console.log(`reachable=${body.reachable===true}`);
          NODE
