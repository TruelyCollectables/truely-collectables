name: Query Safe v2 Checklist Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/query-safe-v2-checklist-run.yml"

permissions:
  contents: write
  actions: read

jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Query safe-v2 and superseded checklist runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_BRANCH: ops/mainstream-checklist-status
          STATUS_PATH: docs/operations/instacomp-full-checklist-safe-v2-live-run.json
        run: |
          set -euo pipefail
          base="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows"
          auth=(--header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")
          curl --silent --show-error --fail "${auth[@]}" "$base/ingest-full-master-checklist-archive-safe-v2.yml/runs?branch=main&per_page=10" > "$RUNNER_TEMP/safe.json"
          curl --silent --show-error --fail "${auth[@]}" "$base/ingest-full-master-checklist-archive.yml/runs?branch=main&per_page=10" > "$RUNNER_TEMP/old.json"
          jq -n \
            --slurpfile safe "$RUNNER_TEMP/safe.json" \
            --slurpfile old "$RUNNER_TEMP/old.json" \
            '{
              schema:"tcos.checklist.safeV2LiveRun.v1",
              checkedAt:(now|todateiso8601),
              safeV2:([ $safe[0].workflow_runs[] | select(.event != "pull_request") ][0] | {workflow:.name,runId:(.id|tostring),runNumber:(.run_number|tostring),status:.status,conclusion:.conclusion,event:.event,sourceSha:.head_sha,branch:.head_branch,createdAt:.created_at,updatedAt:.updated_at}),
              superseded:([ $old[0].workflow_runs[] | select(.event != "pull_request") ][0] | {workflow:.name,runId:(.id|tostring),runNumber:(.run_number|tostring),status:.status,conclusion:.conclusion,event:.event,sourceSha:.head_sha,branch:.head_branch,createdAt:.created_at,updatedAt:.updated_at})
            }' > "$RUNNER_TEMP/live.json"
          cat "$RUNNER_TEMP/live.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/live.json" "$STATUS_PATH"
          git add "$STATUS_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Query safe-v2 checklist live run [skip ci]"
            git push origin "HEAD:$STATUS_BRANCH"
          fi