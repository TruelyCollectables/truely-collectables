name: Sunday Launch One Build

on:
  push:
    branches:
      - launch/sunday-one-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-one-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Sunday launch contract
        run: node --import tsx scripts/run-sunday-launch-one-build.ts

      - name: Run shipping verification
        run: npm run verify:shipping

      - name: Run lint
        run: npm run lint

      - name: Build production application once
        run: npm run build
