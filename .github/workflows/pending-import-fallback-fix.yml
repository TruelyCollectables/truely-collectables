name: Pending Import Fallback One-Time Fix

on:
  push:
    branches:
      - agent/pending-import-without-lifecycle-migration-20260725
    paths:
      - ".github/workflows/pending-import-fallback-fix.yml"

permissions:
  contents: write

jobs:
  patch-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pending-import-without-lifecycle-migration-20260725
      - name: Allow Pending Listings before lifecycle migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/app/api/admin/verified-reference-import/route.ts")
          text = path.read_text()

          old = '    const results: Array<Record<string, unknown>> = [];\n\n    for (const [index, record] of records.entries()) {'
          new = '    const results: Array<Record<string, unknown>> = [];\n    let lifecycleTablesAvailable = true;\n\n    for (const [index, record] of records.entries()) {'
          assert old in text
          text = text.replace(old, new, 1)

          pattern = re.compile(r'''        const \{ data: existingAsset, error: existingError \} = await supabase\n          \.from\("collectible_assets"\)\n          \.select\("id,inventory_item_id,legacy_product_id,title"\)\n          \.eq\("store_id", actor\.storeId\)\n          \.eq\("source_record_key", sourceRecordKey\)\n          \.maybeSingle\(\);\n\n        if \(existingError\) \{\n          if \(missingCollectibleAssetTables\(existingError\)\) \{\n            throw new InstaCompJobServerError\(\n              "Collectible lifecycle tables are not installed yet\. Apply the collectible-asset migration before importing\.",\n              503,\n              "COLLECTIBLE_ASSET_MIGRATION_REQUIRED",\n            \);\n          \}\n          throw existingError;\n        \}\n\n        if \(existingAsset\) \{\n          results\.push\(\{\n            recordId,\n            status: "skipped_existing",\n            assetId: existingAsset\.id,\n            inventoryItemId: existingAsset\.inventory_item_id,\n            legacyProductId: existingAsset\.legacy_product_id,\n            title: existingAsset\.title,\n            editUrl: existingAsset\.inventory_item_id\n              \? `/seller/inventory\?status=draft&search=\$\{encodeURIComponent\(recordId\)\}`\n              : null,\n          \}\);\n          continue;\n        \}\n''')
          replacement = '''        const sku = `VR-${batch}-${recordId}`
          .toUpperCase()
          .replace(/[^A-Z0-9-]+/g, "-")
          .slice(0, 80);

        let existingAsset: {
          id: string;
          inventory_item_id: string | null;
          legacy_product_id: number | null;
          title: string;
        } | null = null;
        const existingAssetResult = await supabase
          .from("collectible_assets")
          .select("id,inventory_item_id,legacy_product_id,title")
          .eq("store_id", actor.storeId)
          .eq("source_record_key", sourceRecordKey)
          .maybeSingle();

        if (existingAssetResult.error) {
          if (missingCollectibleAssetTables(existingAssetResult.error)) {
            lifecycleTablesAvailable = false;
          } else {
            throw existingAssetResult.error;
          }
        } else {
          existingAsset = existingAssetResult.data;
        }

        if (existingAsset) {
          results.push({
            recordId,
            status: "skipped_existing",
            assetId: existingAsset.id,
            inventoryItemId: existingAsset.inventory_item_id,
            legacyProductId: existingAsset.legacy_product_id,
            title: existingAsset.title,
            editUrl: existingAsset.inventory_item_id
              ? `/seller/inventory?status=draft&search=${encodeURIComponent(sku)}`
              : null,
          });
          continue;
        }

        if (!lifecycleTablesAvailable) {
          const { data: existingInventory, error: existingInventoryError } =
            await supabase
              .from("inventory_items")
              .select("id,legacy_product_id,title,sku,status")
              .eq("store_id", actor.storeId)
              .eq("sku", sku)
              .maybeSingle();
          if (existingInventoryError) throw existingInventoryError;
          if (existingInventory) {
            results.push({
              recordId,
              status: "skipped_existing",
              assetId: null,
              inventoryItemId: existingInventory.id,
              legacyProductId: existingInventory.legacy_product_id,
              title: existingInventory.title,
              lifecycleBackfillPending: true,
              editUrl: `/seller/inventory?status=draft&search=${encodeURIComponent(sku)}`,
            });
            continue;
          }
        }
'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, count

          old_sku = '''        const sku = `VR-${batch}-${recordId}`
          .toUpperCase()
          .replace(/[^A-Z0-9-]+/g, "-")
          .slice(0, 80);

'''
          assert text.count(old_sku) == 2, text.count(old_sku)
          # Keep the first (moved before duplicate checks); remove the later duplicate.
          first = text.find(old_sku)
          second = text.find(old_sku, first + len(old_sku))
          text = text[:second] + text[second + len(old_sku):]

          old_meta = '          price_pending: true,\n        };'
          new_meta = '          price_pending: true,\n          lifecycle_backfill_pending: !lifecycleTablesAvailable,\n        };'
          assert old_meta in text
          text = text.replace(old_meta, new_meta, 1)

          old_updates = '''        if (updates[0].error) throw updates[0].error;
        if (updates[1].error) throw updates[1].error;

        const { data: asset, error: assetError } = await supabase
'''
          new_updates = '''        if (updates[0].error) throw updates[0].error;
        if (updates[1].error) throw updates[1].error;

        if (!lifecycleTablesAvailable) {
          results.push({
            recordId,
            status: "created",
            assetId: null,
            inventoryItemId,
            legacyProductId,
            sku,
            title,
            graderVerificationStatus: graderVerification.status,
            graderVerificationUrl: graderVerification.verificationUrl,
            lifecycleBackfillPending: true,
            editUrl: `/seller/inventory?status=draft&search=${encodeURIComponent(sku)}`,
          });
          continue;
        }

        const { data: asset, error: assetError } = await supabase
'''
          assert old_updates in text
          text = text.replace(old_updates, new_updates, 1)

          path.write_text(text)
          PY
          git diff --check
          grep -n "lifecycleBackfillPending\|lifecycleTablesAvailable" src/app/api/admin/verified-reference-import/route.ts
      - name: Commit Pending Listings fallback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables CI"
          git config user.email "sales@truelycollectables.com"
          git add src/app/api/admin/verified-reference-import/route.ts
          git commit -m "Allow verified drafts before lifecycle migration"
          git push origin HEAD:agent/pending-import-without-lifecycle-migration-20260725
