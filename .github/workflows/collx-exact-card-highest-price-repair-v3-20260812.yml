name: CollX Exact Card Highest Price Repair V3 20260812

on:
  push:
    branches: ["ops/collx-exact-highest-price-20260812"]
    paths:
      - ".github/workflows/collx-exact-card-highest-price-repair-v3-20260812.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"
  EXPECTED_SOURCE_ROWS: "6909"
  EXPECTED_SOURCE_SHA: "e5675ad8a23c345bf76aa7f28d73fe5cf8f56452a2bff4595b92a88a6358e904"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repair code
        uses: actions/checkout@v4
        with:
          ref: ops/collx-exact-highest-price-20260812
          path: repair

      - name: Checkout authoritative CollX migration source
        uses: actions/checkout@v4
        with:
          ref: ops/collx-full-inventory-migration-20260811
          path: migration

      - name: Reconstruct checksum-locked CollX source
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/collx-exact-repair
          mkdir -p "$WORK"
          cat \
            migration/.github/ops/collx-full-metadata.part{00..09} \
            migration/.github/ops/collx-full-metadata.part10m0 \
            migration/.github/ops/collx-full-metadata.part10m1 \
            migration/.github/ops/collx-full-metadata.part11 \
            migration/.github/ops/collx-full-metadata.part12 \
            migration/.github/ops/collx-full-metadata.part13 \
            migration/.github/ops/collx-full-metadata.part14m \
            migration/.github/ops/collx-full-metadata.part15m > "$WORK/source.xz.b64"
          base64 -d "$WORK/source.xz.b64" | xz -d > "$WORK/source.csv"
          test "$(sha256sum "$WORK/source.csv" | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA"
          test "$(($(wc -l < "$WORK/source.csv")-1))" = "$EXPECTED_SOURCE_ROWS"

      - name: Remove invalid products timestamp assignments only
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=repair/.github/ops/collx-exact-highest-repair-20260812.py
          test "$(grep -o ',updated_at=now()' "$SCRIPT" | wc -l)" -eq 2
          sed -i 's/,updated_at=now()//g' "$SCRIPT"
          test "$(grep -o ',updated_at=now()' "$SCRIPT" | wc -l)" -eq 0
          grep -q "set quantity=g.target_quantity,price=g.target_price_cents::numeric/100,archived_at=null" "$SCRIPT"
          grep -q "set quantity=0,archived_at=now()" "$SCRIPT"

      - name: Apply guarded highest-price exact-card consolidation
        shell: bash
        env:
          COLLX_SOURCE: /tmp/collx-exact-repair/source.csv
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 repair/.github/ops/collx-exact-highest-repair-20260812.py
