name: Public Rate Limit Security Gate

on:
  pull_request:
    paths:
      - "src/lib/public-endpoint-rate-limit.ts"
      - "src/lib/client-identity.ts"
      - "src/app/api/checkout/route.ts"
      - "src/app/api/offers/create/route.ts"
      - "supabase/migrations/20260630113000_create_public_endpoint_rate_limit_events.sql"
      - "supabase/migrations/20260726213000_harden_public_endpoint_rate_limit_privileges.sql"
      - "scripts/run-public-rate-limit-fail-closed-simulations.ts"
      - ".github/workflows/public-rate-limit-security-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/public-endpoint-rate-limit.ts"
      - "src/lib/client-identity.ts"
      - "src/app/api/checkout/route.ts"
      - "src/app/api/offers/create/route.ts"
      - "supabase/migrations/20260630113000_create_public_endpoint_rate_limit_events.sql"
      - "supabase/migrations/20260726213000_harden_public_endpoint_rate_limit_privileges.sql"
      - "scripts/run-public-rate-limit-fail-closed-simulations.ts"
      - ".github/workflows/public-rate-limit-security-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-rate-limit-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      IP_INTELLIGENCE_REQUIRED: "false"
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production fail-closed rate limiting and privacy
        id: rate_limit_gate
        continue-on-error: true
        run: node --import tsx scripts/run-public-rate-limit-fail-closed-simulations.ts > public-rate-limit-security.log 2>&1

      - name: Upload public rate-limit security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rate-limit-security-evidence
          path: public-rate-limit-security.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce public rate-limit security
        if: steps.rate_limit_gate.outcome == 'failure'
        run: |
          cat public-rate-limit-security.log
          exit 1

      - name: Validate launch database schema definitions
        run: node scripts/run-launch-database-schema-definition-simulations.mjs

      - name: Validate checkout webhook idempotency
        run: node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts

      - name: Validate offer checkout idempotency
        run: node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
