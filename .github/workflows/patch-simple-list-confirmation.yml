name: Patch Simple List Confirmation

on:
  push:
    branches: [agent/simplified-list-route]
    paths:
      - ".github/workflows/patch-simple-list-confirmation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplified-list-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind confirmation to exact action and selection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/list/SimpleListingQueue.tsx')
          text = path.read_text()
          replacements = [
            ('async function runAction(action: DualMarketplaceAction, ids = selectedIds) {', 'async function runAction(\n    action: DualMarketplaceAction,\n    ids = selectedIds,\n    confirmed = false,\n  ) {'),
            ('if (includesEbay && !pendingPublish) {', 'if (includesEbay && !confirmed) {'),
            ('void runAction(pendingPublish.action, pendingPublish.ids)', 'void runAction(pendingPublish.action, pendingPublish.ids, true)'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Verify targeted lint
        run: npx eslint src/app/list/SimpleListingQueue.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/list/SimpleListingQueue.tsx
          git commit -m "Bind marketplace confirmation to exact selection"
          git push origin HEAD:agent/simplified-list-route
