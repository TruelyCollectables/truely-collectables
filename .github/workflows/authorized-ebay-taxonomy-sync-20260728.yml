name: Authorized Production eBay Taxonomy Sync 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-ebay-taxonomy-sync-20260728.yml"
      - "scripts/run-production-ebay-taxonomy-sync.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-production-ebay-taxonomy-sync
  cancel-in-progress: true

jobs:
  sync-and-verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/ebay-taxonomy-sync-20260728')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PRODUCTION_ORIGIN: https://truelycollectables.com
      EBAY_IMPORT_LIMIT: "100"
      EBAY_IMPORT_MAX_PAGES: "25"
    steps:
      - name: Check out operations runner
        uses: actions/checkout@v4
        with:
          ref: ops/ebay-taxonomy-sync-20260728
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run complete paged eBay taxonomy sync and storefront verification
        run: node scripts/run-production-ebay-taxonomy-sync.mjs

      - name: Upload complete eBay sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ebay-taxonomy-sync-${{ github.run_number }}
          path: ebay-taxonomy-sync
          if-no-files-found: warn
          retention-days: 30
