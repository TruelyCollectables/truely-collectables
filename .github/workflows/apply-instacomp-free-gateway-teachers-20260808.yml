name: Apply InstaComp Free Gateway Teachers 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-instacomp-free-gateway-teachers-20260808.mjs'
      - '.github/workflows/apply-instacomp-free-gateway-teachers-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply free-tier teacher patch
        run: |
          node scripts/apply-instacomp-free-gateway-teachers-20260808.mjs
          git diff --check
      - name: Commit runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/instacomp-teacher-market-provider.ts \
            src/lib/instacomp-teacher-runtime-status.ts \
            src/app/api/release/instacomp-gateway-teacher-smoke/route.ts \
            src/app/api/release/instacomp-teacher-runtime-diagnostics/route.ts \
            .github/workflows/instacomp-teacher-production-proof.yml
          git commit -m 'Use free-tier Gateway teachers for InstaComp'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
