name: Patch Simplified List Build and Mobile Regression

on:
  push:
    branches: [agent/simplified-list-route]
    paths:
      - ".github/workflows/patch-simplified-list-build-and-mobile.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-at-least-32-characters
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplified-list-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact TypeScript and mobile regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          endpoint = Path('src/app/api/admin/simple-list-drafts/route.ts')
          text = endpoint.read_text()
          old = 'error instanceof InventoryEngineError ? error.status : 500'
          new = 'error instanceof InventoryEngineError ? error.statusCode : 500'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one InventoryEngineError status access, found {text.count(old)}')
          endpoint.write_text(text.replace(old, new))

          mobile = Path('scripts/run-mobile-buyer-flow-simulations.ts')
          text = mobile.read_text()
          old = '/<MobileNavigation links=\\{navigationLinks\\} \\/>/'
          new = '/<MobileNavigation links=\\{mobileNavigationLinks\\} \\/>/'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one stale MobileNavigation assertion, found {text.count(old)}')
          text = text.replace(old, new)
          anchor = '  "/account",\n]) {'
          replacement = '  "/account",\n  "/admin",\n]) {'
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one mobile path-list anchor, found {text.count(anchor)}')
          mobile.write_text(text.replace(anchor, replacement))
          PY
      - name: Validate mobile flow and targeted lint
        run: |
          node --import tsx scripts/run-mobile-buyer-flow-simulations.ts
          npx eslint src/app/api/admin/simple-list-drafts/route.ts scripts/run-mobile-buyer-flow-simulations.ts
      - name: Validate production build
        run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/admin/simple-list-drafts/route.ts scripts/run-mobile-buyer-flow-simulations.ts
          git commit -m "Fix simplified listing build and mobile regression"
          git push origin HEAD:agent/simplified-list-route
