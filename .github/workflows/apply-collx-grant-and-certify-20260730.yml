name: Apply CollX Grant And Certify 20260730

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: apply-collx-grant-and-certify-20260730
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 09651b6d2476df7e92467b661820e6e9ba30b8ce
  EXPECTED_BRANCH: ops/apply-collx-grant-and-certify-20260730
  PREVIOUS_RUN: "30547697261"
  EXACT_DEPLOYMENT_ID: dpl_DHDeMqzhNit5zXhWLfVL5gDV659X
  PRODUCT_PATH: /product/489878
  EVIDENCE_DIR: .audit/final-lighthouse-median-20260730

jobs:
  finalize-debug-certificate:
    if: github.event.pull_request.head.ref == 'ops/apply-collx-grant-and-certify-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_API_TOKEN: ${{ github.token }}

    steps:
      - name: Check out guarded continuation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact main and one-file continuation scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/apply-collx-grant-and-certify-20260730.yml"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          test -n "${GH_API_TOKEN:-}"
          mkdir -p "$EVIDENCE_DIR/lighthouse"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"

      - name: Bind successful grant deployment routes and hosted invariants
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_API_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/TruelyCollectables/truely-collectables/actions/runs/$PREVIOUS_RUN/jobs?per_page=100" > "$EVIDENCE_DIR/previous-jobs.json"
          for step in \
            'Fail closed on exact main migration and one-file operations scope' \
            'Bind passing release build and rollback validation' \
            'Apply committed least-privilege Production migration' \
            'Verify product route recovered before redeployment' \
            'Deploy exact current main to Vercel Production' \
            'Verify exact Production metadata routes boundaries and data invariants'; do
            jq -e --arg step "$step" '.jobs[]|select(.name=="apply-collx-grant-and-certify")|.steps[]|select(.name==$step)|.conclusion=="success"' "$EVIDENCE_DIR/previous-jobs.json" >/dev/null
          done
          rm -f "$EVIDENCE_DIR/previous-jobs.json"
          jq -n --arg sha "$EXPECTED_MAIN_SHA" --arg deployment "$EXACT_DEPLOYMENT_ID" --argjson run "$PREVIOUS_RUN" '{ok:true,exactProductionSha:$sha,exactProductionDeploymentId:$deployment,boundRunId:$run,leastPrivilegeGrantApplied:true,productRouteRecovered:true,releaseBuildPassed:true,allCustomerRoutesPassed:true,protectedBoundariesPassed:true,hostedDataInvariantsPassed:true,verifiedAt:(now|todate)}' > "$EVIDENCE_DIR/evidence-binding.json"

      - name: Reconfirm live product and customer route health
        shell: bash
        run: |
          set -euo pipefail
          rows='[]'; blockers=()
          for spec in 'home|/' 'shop|/shop' "product|$PRODUCT_PATH" 'cart|/cart' 'signup|/account/signup' 'orders|/account/orders' 'returns|/returns'; do
            name="${spec%%|*}"; path="${spec#*|}"
            code="$(curl -L -sS --max-time 75 -o "$RUNNER_TEMP/$name.html" -w '%{http_code}' "https://truelycollectables.com$path" || true)"
            rows="$(jq -c --arg name "$name" --arg path "$path" --argjson code "${code:-0}" '. + [{name:$name,path:$path,status:$code}]' <<<"$rows")"
            [ "$code" = 200 ] || blockers+=("$name=$code")
          done
          grep -Fq 'Caitlin Clark' "$RUNNER_TEMP/product.html" || blockers+=("product marker")
          jq -n --argjson rows "$rows" --argjson blockerCount "${#blockers[@]}" '{ok:($blockerCount==0),routes:$rows,blockerCount:$blockerCount,verifiedAt:(now|todate)}' > "$EVIDENCE_DIR/route-recheck.json"
          if [ "${#blockers[@]}" -ne 0 ]; then printf 'ROUTE BLOCKER: %s\n' "${blockers[@]}" >&2; exit 1; fi

      - name: Run three warmed homepage Lighthouse samples
        shell: bash
        run: |
          set -euo pipefail
          for warm in 1 2 3; do curl -L -fsS --max-time 75 -o /dev/null https://truelycollectables.com/; done
          for sample in 1 2 3; do
            npx --yes lighthouse@12.8.2 https://truelycollectables.com/ --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path="$EVIDENCE_DIR/lighthouse/home-$sample.json"
          done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const rows=[];
          for(let sample=1;sample<=3;sample++){
            const v=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/lighthouse/home-${sample}.json`,'utf8'));
            const c=v.categories||{};
            rows.push({sample,performance:Math.round((c.performance?.score||0)*100),accessibility:Math.round((c.accessibility?.score||0)*100),bestPractices:Math.round((c['best-practices']?.score||0)*100),seo:Math.round((c.seo?.score||0)*100),fcpMs:Math.round(v.audits?.['first-contentful-paint']?.numericValue||0),lcpMs:Math.round(v.audits?.['largest-contentful-paint']?.numericValue||0),tbtMs:Math.round(v.audits?.['total-blocking-time']?.numericValue||0)});
          }
          const performance=rows.map(r=>r.performance).sort((a,b)=>a-b);
          const medianPerformance=performance[1];
          const passingPerformanceSamples=rows.filter(r=>r.performance>=70).length;
          const blockers=[];
          if(medianPerformance<70)blockers.push(`home median performance ${medianPerformance}`);
          if(passingPerformanceSamples<2)blockers.push(`home passing samples ${passingPerformanceSamples}/3`);
          for(const row of rows){
            if(row.accessibility<95)blockers.push(`sample ${row.sample} accessibility ${row.accessibility}`);
            if(row.bestPractices<95)blockers.push(`sample ${row.sample} best-practices ${row.bestPractices}`);
            if(row.seo<95)blockers.push(`sample ${row.sample} SEO ${row.seo}`);
          }
          const result={ok:blockers.length===0,method:'three warmed mobile samples; median performance gate',rows,medianPerformance,passingPerformanceSamples,threshold:70,blockers,verifiedAt:new Date().toISOString()};
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/lighthouse-median-summary.json',JSON.stringify(result,null,2));
          if(blockers.length)throw new Error(blockers.join('; '));
          NODE

      - name: Issue strict final debug certificate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok==true' "$EVIDENCE_DIR/evidence-binding.json" >/dev/null
          jq -e '.ok==true and .blockerCount==0' "$EVIDENCE_DIR/route-recheck.json" >/dev/null
          jq -e '.ok==true and .medianPerformance>=70 and .passingPerformanceSamples>=2 and (.blockers|length)==0' "$EVIDENCE_DIR/lighthouse-median-summary.json" >/dev/null
          jq -n --arg sha "$EXPECTED_MAIN_SHA" --arg deployment "$EXACT_DEPLOYMENT_ID" --arg run "$GITHUB_RUN_ID" --argjson median "$(jq -r .medianPerformance "$EVIDENCE_DIR/lighthouse-median-summary.json")" '{schema:"truelycollectables.finalDebugAfterGrantCertificate.v1",result:"PASS",blockerCount:0,exactProductionSha:$sha,exactProductionDeploymentId:$deployment,workflowRunId:($run|tonumber),homepageLighthouseMedian:$median,homepageLighthouseMethod:"three warmed mobile samples",productRouteRecovered:true,leastPrivilegeGrantApplied:true,publicRolesDenied:true,releaseBuildPassed:true,allCustomerRoutesPassed:true,protectedBoundariesPassed:true,hostedDataInvariantsPassed:true,lighthousePassed:true,productionMutationLimitedToCommittedGrant:true,emailSent:false,realMoneyCharge:false,realPostagePurchase:false,physicalShipment:false,issuedAt:(now|todate)}' > "$EVIDENCE_DIR/final-debug-certificate.json"

      - name: Upload sanitized final debug certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-debug-after-collx-grant-20260730
          path: .audit/final-lighthouse-median-20260730
          if-no-files-found: error
          retention-days: 90
