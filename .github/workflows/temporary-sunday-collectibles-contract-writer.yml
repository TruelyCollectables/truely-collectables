name: Temporary Sunday Collectibles Contract Writer

on:
  push:
    branches:
      - agent/collectibles-catalog-sync-20260728
    paths:
      - ".github/workflows/temporary-sunday-collectibles-contract-writer.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-sunday-collectibles-contract-writer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunday-collectibles-contract-writer
  cancel-in-progress: true

jobs:
  update-test-and-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collectibles-catalog-sync-20260728
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update Sunday shop title contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-sunday-launch-one-build.ts')
          text = path.read_text()
          old = '    \'title: "Shop Sports Cards"\','
          new = '    \'title: "Shop Sports Cards & Collectibles"\','
          if old not in text and new not in text:
              raise SystemExit('Could not locate Sunday shop title contract')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install exact dependencies
        run: npm ci
      - name: Run Sunday launch contract
        run: node --import tsx scripts/run-sunday-launch-one-build.ts
      - name: Commit verified contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-sunday-launch-one-build.ts
          git commit -m "Update Sunday launch contract for collectibles"
          git push origin HEAD:agent/collectibles-catalog-sync-20260728
