name: Diagnose Checklist Writer Transport 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-checklist-writer-transport-20260803.yml"

permissions:
  contents: read

concurrency:
  group: pokemon-checklist-registry-production
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: d0784767fd664bf0960bf28e71afd7ca15533182
  EXPECTED_BRANCH: ops/diagnose-checklist-writer-transport-20260803
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/checklist-writer-transport-20260803

jobs:
  diagnose-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "origin/$EXPECTED_BRANCH"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/diagnose-checklist-writer-transport-20260803.yml'
          git diff --check "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/checklist-writer-transport"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install diagnostic dependency and resolve Production project
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false pg@8.16.3
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel
          npx vercel@56.2.0 link --yes --project truely-collectables \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/checklist-writer-transport/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

          PRODUCTION_ENV_PATH="$RUNNER_TEMP/checklist-writer-transport/production.env" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            parsed[key] = value;
          }
          const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
          if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
          console.log(`::add-mask::${productionUrl}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`);
          NODE

      - name: Probe bounded writer transports and delete temporary role
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { Client } = require('pg');
          const productionUrl = String(process.env.NEXT_PUBLIC_SUPABASE_URL || '');
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const api = `https://api.supabase.com/v1/projects/${projectRef}`;
          const headers = { Authorization: `Bearer ${accessToken}`, Accept: 'application/json', 'Content-Type': 'application/json' };

          async function request(endpoint, options = {}) {
            const response = await fetch(`${api}${endpoint}`, { headers, ...options });
            const text = await response.text();
            if (!response.ok && !options.allowFailure) throw new Error(`${options.method || 'GET'} ${endpoint} failed HTTP ${response.status}: ${text.slice(0, 700)}`);
            if (!response.ok) return null;
            return text ? JSON.parse(text) : {};
          }

          async function audit(label) {
            const query = `with active_versions as (select * from public.checklist_versions where is_active), identity_counts as (
              select v.id, v.normalized_identity_count expected_identities, count(i.id)::bigint actual_identities
              from active_versions v left join public.checklist_card_identities i on i.version_id=v.id
              group by v.id,v.normalized_identity_count)
              select json_build_object(
                'releases',(select count(*) from public.checklist_releases),
                'active_versions',(select count(*) from active_versions),
                'active_cards',(select count(*) from public.checklist_cards c join active_versions v on v.id=c.version_id),
                'active_identities',(select count(*) from public.checklist_card_identities i join active_versions v on v.id=i.version_id),
                'identity_deficit_versions',(select count(*) from identity_counts where actual_identities<>expected_identities),
                'failed_import_runs',(select count(*) from public.checklist_import_runs where status='failed'),
                'temporary_login_roles',(select count(*) from pg_roles where rolname like 'cli_login_%'),
                'target_count',(select count(*) from public.checklist_releases where slug in ('2024-bowman-chrome-baseball','2025-bowman-baseball','2024-panini-prizm-wnba','2025-panini-prizm-wnba','2024-panini-select-wnba','2025-panini-select-wnba'))
              ) state;`;
            const rows = await request('/database/query', { method: 'POST', body: JSON.stringify({ query, parameters: [], read_only: true }) });
            const state = rows?.[0]?.state;
            if (!state) throw new Error(`${label} audit returned no state`);
            return state;
          }

          function requireState(state, label, roles) {
            const expected = { releases:297, active_versions:297, active_cards:35987, active_identities:44216, identity_deficit_versions:0, failed_import_runs:0, temporary_login_roles:roles, target_count:0 };
            const failures=[];
            for (const [key,value] of Object.entries(expected)) if (Number(state[key]) !== value) failures.push(`${key}=${state[key]}, expected=${value}`);
            if (failures.length) throw new Error(`${label} blocked: ${failures.join(', ')}`);
          }

          function parseConnection(value, user, password, poolMode, source) {
            try {
              const url = new URL(String(value).replace(/^postgres:\/\//,'postgresql://'));
              return { host:url.hostname, port:Number(url.port || 5432), database:url.pathname.replace(/^\//,'') || 'postgres', user, password, poolMode, source };
            } catch { return null; }
          }

          (async () => {
            const before = await audit('before');
            requireState(before, 'before', 0);
            let login = null;
            const attempts = [];
            try {
              login = await request('/cli/login-role', { method:'POST', body:JSON.stringify({ read_only:false }) });
              if (!login?.role || !login?.password) throw new Error('Temporary login role response incomplete');
              console.log(`::add-mask::${login.password}`);
              const during = await audit('during');
              requireState(during, 'during', 1);

              const users = [...new Set([login.role.includes('.') ? login.role : `${login.role}.${projectRef}`, login.role])];
              const candidates = [];
              const shared = await request('/config/database/pooler', { allowFailure:true });
              if (Array.isArray(shared)) {
                for (const entry of shared) {
                  for (const user of users) {
                    const parsed = parseConnection(entry?.connection_string || entry?.connectionString || '', user, login.password, String(entry?.pool_mode || 'unknown'), 'shared-pooler');
                    if (parsed) candidates.push(parsed);
                    if (entry?.db_host) candidates.push({ host:String(entry.db_host), port:Number(entry.db_port || 5432), database:String(entry.db_name || 'postgres'), user, password:login.password, poolMode:String(entry?.pool_mode || 'unknown'), source:'shared-pooler-fields' });
                  }
                }
              }
              const dedicated = await request('/config/database/pgbouncer', { allowFailure:true });
              if (dedicated && typeof dedicated === 'object') {
                for (const user of users) {
                  const parsed = parseConnection(dedicated.connection_string || dedicated.connectionString || '', user, login.password, String(dedicated.pool_mode || 'transaction'), 'dedicated-pooler');
                  if (parsed) candidates.push(parsed);
                }
              }
              candidates.push({ host:`db.${projectRef}.supabase.co`, port:5432, database:'postgres', user:login.role, password:login.password, poolMode:'direct', source:'direct-fallback' });
              const unique = new Map();
              for (const candidate of candidates) {
                const key=[candidate.host,candidate.port,candidate.database,candidate.user].join('|');
                if (!unique.has(key)) unique.set(key,candidate);
              }

              for (const candidate of unique.values()) {
                const started = Date.now();
                const client = new Client({ host:candidate.host, port:candidate.port, database:candidate.database, user:candidate.user, password:candidate.password, ssl:{ rejectUnauthorized:false }, connectionTimeoutMillis:6000, query_timeout:6000, statement_timeout:6000, application_name:'tcos-checklist-transport-diagnostic' });
                try {
                  await client.connect();
                  const base = await client.query(`select current_user, session_user, has_function_privilege(current_user,'public.tcos_apply_checklist_import_plan(jsonb,text,text,bigint,text,text,text)','EXECUTE') can_execute_writer`);
                  let writerRole = 'current_user';
                  let canExecute = base.rows?.[0]?.can_execute_writer === true;
                  if (!canExecute) {
                    await client.query('begin');
                    try {
                      await client.query('set local role service_role');
                      const elevated = await client.query(`select has_function_privilege(current_user,'public.tcos_apply_checklist_import_plan(jsonb,text,text,bigint,text,text,text)','EXECUTE') can_execute_writer`);
                      canExecute = elevated.rows?.[0]?.can_execute_writer === true;
                      writerRole = canExecute ? 'service_role' : 'none';
                    } finally { await client.query('rollback').catch(()=>undefined); }
                  }
                  attempts.push({ source:candidate.source, poolMode:candidate.poolMode, hostClass:candidate.host.includes('pooler.supabase.com') ? 'supabase-pooler' : 'supabase-direct', userClass:candidate.user.includes('.') ? 'project-qualified-temporary-login' : 'temporary-login', connected:true, writerRole, canExecuteWriter:canExecute, elapsedMs:Date.now()-started });
                  console.log(JSON.stringify(attempts.at(-1)));
                  if (canExecute) break;
                } catch (error) {
                  attempts.push({ source:candidate.source, poolMode:candidate.poolMode, hostClass:candidate.host.includes('pooler.supabase.com') ? 'supabase-pooler' : 'supabase-direct', userClass:candidate.user.includes('.') ? 'project-qualified-temporary-login' : 'temporary-login', connected:false, errorClass:error?.code || error?.name || 'Error', elapsedMs:Date.now()-started });
                  console.log(JSON.stringify(attempts.at(-1)));
                } finally { await client.end().catch(()=>undefined); }
              }
              if (!attempts.some((attempt)=>attempt.canExecuteWriter === true)) throw new Error('No bounded writer transport succeeded');
            } finally {
              if (login) await request('/cli/login-role', { method:'DELETE' });
            }
            const after = await audit('after');
            requireState(after, 'after', 0);
            const receipt = { schema:'tcos.checklist.writerTransportDiagnostic.v1', generatedAt:new Date().toISOString(), status:'passed', before, attempts, selected:attempts.find((attempt)=>attempt.canExecuteWriter === true), after, safety:{ productionChecklistWrites:false, temporaryLoginRoleDeleted:true, migrationsApplied:false, deploymentPerformed:false } };
            fs.mkdirSync(process.env.EVIDENCE_DIR,{recursive:true});
            fs.writeFileSync(path.join(process.env.EVIDENCE_DIR,'transport.json'),`${JSON.stringify(receipt,null,2)}\n`);
            console.log(JSON.stringify(receipt,null,2));
          })().catch((error)=>{ console.error(error instanceof Error ? error.stack || error.message : String(error)); process.exit(1); });
          NODE

      - name: Upload sanitized transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-writer-transport-20260803
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/checklist-writer-transport"
          rm -f .env.local .env.production.local
