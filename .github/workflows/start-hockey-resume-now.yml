name: Start Hockey Resume Now

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/start-hockey-resume-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-hockey-resume:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch dedicated Hockey Production resume
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          WORKFLOW: instacomp-requested-hockey-finalize-resume-production.yml
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching $WORKFLOW on $REF"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/dispatches" \
            -d "{\"ref\":\"$REF\"}"
          echo "Hockey Production resume dispatch accepted"

