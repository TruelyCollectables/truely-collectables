name: Sentinel Live Census 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sentinel-live-census-20260808.yml'
      - 'scripts/sentinel-live-census-20260808.marker'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_8mJZCaMhTddaKgcFFJYPwWu0P4mk
      VERCEL_ORG_ID: team_cDDhCqEiYlz0KJQ3ATLJH7nz
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Fail closed on census-only scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/sentinel-live-census-20260808.yml'
          test "${changed[1]}" = 'scripts/sentinel-live-census-20260808.marker'
          test -n "$VERCEL_TOKEN"
          test -n "$GH_SUPABASE_ACCESS_TOKEN"

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Audit Production environment names only
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@58.8.0 env ls production --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" \
            | sed -E 's/[[:space:]]+/ /g' \
            | grep -E 'INSTACOMP_AI_LOCAL_(URL|KEY)|INSTACOMP_SENTINEL_ARCHIVE_TOKEN|NEXT_PUBLIC_SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY' \
            || true

      - name: Query live Sentinel through Production env runtime without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          runtime_script="$RUNNER_TEMP/sentinel-runtime-census.py"
          cat > "$runtime_script" <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          local_url = str(os.environ.get('INSTACOMP_AI_LOCAL_URL') or '').strip().rstrip('/')
          local_key = str(os.environ.get('INSTACOMP_AI_LOCAL_KEY') or '').strip()

          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'available': False,
              'reason': None,
          }

          if not local_url.startswith('https://'):
              report['reason'] = 'Production env runtime did not expose INSTACOMP_AI_LOCAL_URL to CLI env run.'
          elif len(local_key) < 32:
              report['reason'] = 'Production env runtime did not expose INSTACOMP_AI_LOCAL_KEY to CLI env run.'
          else:
              def get_json(path):
                  req = urllib.request.Request(
                      f'{local_url}{path}',
                      headers={'X-InstaComp-AI-Key': local_key, 'accept': 'application/json'},
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return json.loads(response.read().decode('utf-8'))

              status = get_json('/v1/checklist-sentinel/status')
              targets_payload = get_json('/v1/checklist-sentinel/targets?limit=5000')
              downloads_payload = get_json('/v1/checklist-sentinel/downloads?limit=5000')
              targets = list((targets_payload or {}).get('targets') or [])
              downloads = list((downloads_payload or {}).get('downloads') or [])
              latest = status.get('latest_job') or {}
              report.update({
                  'available': True,
                  'reason': None,
                  'name': status.get('name'),
                  'enabled': status.get('enabled'),
                  'targets': status.get('targets'),
                  'latest_job': {
                      'job_id': latest.get('job_id'),
                      'status': latest.get('status'),
                      'trigger': latest.get('trigger'),
                      'started_at': latest.get('started_at'),
                      'heartbeat_at': latest.get('heartbeat_at'),
                      'current_target_key': latest.get('current_target_key'),
                      'processed_targets': latest.get('processed_targets'),
                      'total_targets': latest.get('total_targets'),
                      'found_count': latest.get('found_count'),
                      'downloaded_count': latest.get('downloaded_count'),
                      'imported_count': latest.get('imported_count'),
                      'duplicate_count': latest.get('duplicate_count'),
                      'failed_count': latest.get('failed_count'),
                  },
                  'freeze_protection': status.get('freeze_protection'),
                  'registry_import_configured': status.get('registry_import_configured'),
                  'target_feed_configured': status.get('target_feed_configured'),
                  'listed_target_rows': len(targets),
                  'listed_download_rows': len(downloads),
                  'target_rows': targets,
              })

          print('SENTINEL_RUNTIME_CENSUS_JSON_START')
          print(json.dumps(report, indent=2, sort_keys=True))
          print('SENTINEL_RUNTIME_CENSUS_JSON_END')
          PY

          npx vercel@58.8.0 env run -e production --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" -- \
            python3 "$runtime_script"
          rm -f "$runtime_script"

      - name: Resolve protected Production Supabase credentials
        shell: bash
        run: bash scripts/resolve-mainstream-checklist-production-env.sh

      - name: Query complete Production Registry and mainstream 2000+ progress read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_PATH"
          set +a
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"

          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          import { loadMainstreamChecklistManifest } from './scripts/mainstream-checklist/manifest.mjs';
          import { isVerifiedNonPromotable } from './scripts/mainstream-checklist/verified-exceptions.mjs';

          const db = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });

          async function exactCount(table, apply) {
            let query = db.from(table).select('*', { count: 'exact', head: true });
            if (apply) query = apply(query);
            const { count, error } = await query;
            if (error) return { exists: false, error: error.message };
            return { exists: true, count: Number(count || 0) };
          }

          async function allRows(table, select) {
            const out = [];
            for (let from = 0; ; from += 1000) {
              const { data, error } = await db.from(table).select(select).range(from, from + 999);
              if (error) throw new Error(`${table}: ${error.message}`);
              out.push(...(data || []));
              if (!data || data.length < 1000) break;
            }
            return out;
          }

          const candidateTableNames = [
            'checklist_sets',
            'checklist_releases',
            'checklist_versions',
            'checklist_cards',
            'checklist_identities',
            'checklist_parallel_definitions',
            'checklist_source_catalog',
          ];
          const candidateTableCounts = {};
          for (const table of candidateTableNames) {
            candidateTableCounts[table] = await exactCount(table);
          }

          const versionRows = await allRows('checklist_versions', 'id,status,is_active');
          const versionStatusCounts = {};
          const versionActiveCounts = { active: 0, inactive: 0 };
          let activeLiveVersions = 0;
          let pendingLikeVersions = 0;
          const pendingLikeStatuses = new Set(['pending','queued','processing','review','review_required','draft','staged','validated']);
          for (const row of versionRows) {
            const status = String(row.status ?? 'null');
            versionStatusCounts[status] = (versionStatusCounts[status] || 0) + 1;
            if (row.is_active === true) versionActiveCounts.active += 1;
            else versionActiveCounts.inactive += 1;
            if (row.is_active === true && status === 'live') activeLiveVersions += 1;
            if (pendingLikeStatuses.has(status.toLowerCase())) pendingLikeVersions += 1;
          }

          const catalogRowsAll = await allRows(
            'checklist_source_catalog',
            'source_url,status,last_checked_at,validation_counts,issue_summary,metadata'
          );
          const sourceCatalogStatusCounts = {};
          for (const row of catalogRowsAll) {
            const status = String(row.status ?? 'null');
            sourceCatalogStatusCounts[status] = (sourceCatalogStatusCounts[status] || 0) + 1;
          }

          const manifest = loadMainstreamChecklistManifest();
          const byUrl = new Map(manifest.entries.map((entry) => [entry.sourceUrl, entry]));
          const urls = manifest.entries.map((entry) => entry.sourceUrl);
          const rows = [];
          for (let i = 0; i < urls.length; i += 100) {
            const { data, error } = await db
              .from('checklist_source_catalog')
              .select('source_url,status,last_checked_at,validation_counts,issue_summary,metadata')
              .in('source_url', urls.slice(i, i + 100));
            if (error) throw new Error(error.message);
            rows.push(...(data || []));
          }

          const catalogByUrl = new Map(rows.map((row) => [row.source_url, row]));
          const mainstreamStatusCounts = {};
          const issueCounts = {};
          let rawArchived = 0;
          let promotedFinite = 0;
          let classifiedExceptions = 0;
          let cards = 0;
          let identities = 0;
          const promoted = [];
          const remaining = [];
          const exceptions = [];
          const missingCatalogRows = [];

          for (const entry of manifest.entries) {
            const row = catalogByUrl.get(entry.sourceUrl);
            const exception = entry.disposition === 'attachment_only' || isVerifiedNonPromotable(entry);
            if (!row) {
              mainstreamStatusCounts.missing_catalog_row = (mainstreamStatusCounts.missing_catalog_row || 0) + 1;
              if (exception) exceptions.push({ id: entry.id, status: 'missing_catalog_row', disposition: entry.disposition || null });
              else {
                missingCatalogRows.push(entry.id);
                remaining.push({ id: entry.id, status: 'missing_catalog_row', issues: [] });
              }
              continue;
            }
            mainstreamStatusCounts[row.status] = (mainstreamStatusCounts[row.status] || 0) + 1;
            if (row.metadata?.rawArchived === true) rawArchived += 1;
            for (const issue of row.issue_summary || []) {
              if (!issue?.code) continue;
              issueCounts[issue.code] = (issueCounts[issue.code] || 0) + 1;
            }
            if (exception) {
              if (row.status === 'quarantined') classifiedExceptions += 1;
              exceptions.push({ id: entry.id, status: row.status, disposition: entry.disposition || null });
              continue;
            }
            if (['imported','unchanged'].includes(row.status)) {
              promotedFinite += 1;
              const rowCards = Number(row.validation_counts?.cards || 0);
              const rowIdentities = Number(row.validation_counts?.identities || 0);
              cards += rowCards;
              identities += rowIdentities;
              promoted.push({ id: entry.id, status: row.status, cards: rowCards, identities: rowIdentities });
            } else {
              remaining.push({
                id: entry.id,
                status: row.status,
                cards: Number(row.validation_counts?.cards || 0),
                identities: Number(row.validation_counts?.identities || 0),
                issues: (row.issue_summary || []).slice(0, 5).map((issue) => ({ code: issue.code, message: issue.message })),
              });
            }
          }

          const promotableUniverse = manifest.entries.filter(
            (entry) => entry.disposition !== 'attachment_only' && !isVerifiedNonPromotable(entry)
          ).length;
          const exceptionUniverse = manifest.entries.length - promotableUniverse;
          const sortedIssueCounts = Object.fromEntries(Object.entries(issueCounts).sort((a,b) => b[1] - a[1]));

          console.log('REGISTRY_MAINSTREAM_CENSUS_JSON_START');
          console.log(JSON.stringify({
            checkedAt: new Date().toISOString(),
            registryDatabase: {
              candidateTableCounts,
              checklistVersionRows: versionRows.length,
              checklistVersionStatusCounts: versionStatusCounts,
              checklistVersionActiveCounts: versionActiveCounts,
              activeLiveVersions,
              pendingLikeVersions,
              sourceCatalogRows: catalogRowsAll.length,
              sourceCatalogStatusCounts,
            },
            mainstream2000Plus: {
              manifestEntries: manifest.entries.length,
              promotableUniverse,
              exceptionUniverse,
              catalogRowsMatched: rows.length,
              rawArchived,
              promotedFinite,
              remainingFinite: promotableUniverse - promotedFinite,
              classifiedExceptions,
              statusCounts: mainstreamStatusCounts,
              promotedTotals: { cards, identities },
              issueCounts: sortedIssueCounts,
              missingCatalogRows,
              remaining,
              exceptions,
            },
          }, null, 2));
          console.log('REGISTRY_MAINSTREAM_CENSUS_JSON_END');
          NODE

      - name: Destroy temporary credential files
        if: always()
        shell: bash
        run: |
          rm -f .env.sentinel-census
          rm -rf "$RUNNER_TEMP/mainstream-checklist-ingestion"
          rm -f "$RUNNER_TEMP/sentinel-runtime-census.py"
