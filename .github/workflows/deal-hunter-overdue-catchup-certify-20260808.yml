name: Deal Hunter Overdue Catchup Certify 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/deal-hunter-overdue-catchup-20260808.marker'
      - 'scripts/patch-deal-hunter-overdue-catchup-20260808.py'
      - '.github/workflows/deal-hunter-overdue-catchup-certify-20260808.yml'

permissions:
  contents: write

jobs:
  certify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Install Mac service dependencies
        working-directory: services/instacomp-ai
        run: pip install -r requirements.txt

      - name: Apply exact catch-up patch
        run: python scripts/patch-deal-hunter-overdue-catchup-20260808.py

      - name: Compile Deal Hunter
        working-directory: services/instacomp-ai
        run: python -m py_compile app/deal_hunter.py app/deal_hunter_routes.py app/deal_hunter_store.py

      - name: Run Deal Hunter scheduler tests
        working-directory: services/instacomp-ai
        run: pytest -q tests/test_deal_hunter_scheduler.py

      - name: Prove only intended runtime/test files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'services/instacomp-ai/app/deal_hunter.py\nservices/instacomp-ai/tests/test_deal_hunter_scheduler.py'
          test "$changed" = "$expected"

      - name: Materialize certified fix and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Truely Collectables CI'
          git config user.email 'actions@users.noreply.github.com'
          git add services/instacomp-ai/app/deal_hunter.py services/instacomp-ai/tests/test_deal_hunter_scheduler.py
          git rm scripts/patch-deal-hunter-overdue-catchup-20260808.py
          git rm src/lib/deal-hunter-overdue-catchup-20260808.marker
          git rm .github/workflows/deal-hunter-overdue-catchup-certify-20260808.yml
          git commit -m 'Keep Deal Hunter cadence after slow runs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
