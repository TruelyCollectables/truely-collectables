name: Temporary InstaComp SerpApi Schema Writer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-instacomp-serpapi-schema-writer.yml"
      - "scripts/apply-instacomp-serpapi-schema-fix.py"
      - "scripts/harden-instacomp-visual-review-types.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-instacomp-serpapi-schema-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply SerpApi schema patch
        run: |
          set -euo pipefail
          echo "Applying SerpApi schema patch v2"
          python -m py_compile scripts/apply-instacomp-serpapi-schema-fix.py scripts/harden-instacomp-visual-review-types.py
          python scripts/apply-instacomp-serpapi-schema-fix.py
          python scripts/harden-instacomp-visual-review-types.py
          python scripts/check-instacomp-control-characters.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        run: |
          set -euo pipefail
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-live-pipeline-regressions.ts
          node --import tsx scripts/run-instacomp-provider-safety-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-batch-drop-regressions.ts

      - name: Lint schema fix
        run: |
          npx eslint \
            src/lib/instacomp-exact-market-provider.ts \
            scripts/run-instacomp-exact-market-proof-regressions.ts

      - name: Build production application
        run: npm run build

      - name: Commit tested schema fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/instacomp-exact-market-provider.ts \
            scripts/run-instacomp-exact-market-proof-regressions.ts \
            scripts/run-instacomp-final-materialization.py
          git diff --cached --check
          git diff --cached --quiet && { echo "SerpApi schema fix already committed"; exit 0; }
          git commit -m "Normalize documented SerpApi shipping strings"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
