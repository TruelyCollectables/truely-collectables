name: KINGMAKER Pricing Decision

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-pricing-decision.ts"
      - "src/lib/instacomp-pricing-request-security.ts"
      - "src/app/api/instacomp/pricing/decision/route.ts"
      - "scripts/run-kingmaker-pricing-decision-regressions.ts"
      - ".github/workflows/kingmaker-pricing-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pricing-decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pricing decision regressions
        run: node --import tsx scripts/run-kingmaker-pricing-decision-regressions.ts
      - name: Safety contracts
        run: |
          set -euo pipefail
          grep -Fq 'advisory_only' src/lib/kingmaker-pricing-decision.ts
          grep -Fq 'three_verified_sold_comps_required' src/lib/kingmaker-pricing-decision.ts
          grep -Fq 'exact_identity_required' src/lib/kingmaker-pricing-decision.ts
          grep -Fq 'suppliedInstaCompServerOwnedPricingFields' src/app/api/instacomp/pricing/decision/route.ts
          grep -Fq 'exactIdentity: pricing?.status === "verified"' src/app/api/instacomp/pricing/decision/route.ts
          grep -Fq 'soldComps: []' src/app/api/instacomp/pricing/decision/route.ts
          grep -Fq 'completedSales: "authoritative_loader_required"' src/app/api/instacomp/pricing/decision/route.ts
          ! grep -Fq 'body.exactIdentity' src/app/api/instacomp/pricing/decision/route.ts
          ! grep -Fq 'body.soldComps' src/app/api/instacomp/pricing/decision/route.ts
          ! grep -RIni 'beckett' src/lib/kingmaker-pricing-decision.ts src/lib/instacomp-pricing-request-security.ts src/app/api/instacomp/pricing/decision/route.ts scripts/run-kingmaker-pricing-decision-regressions.ts
      - name: Lint
        run: npx eslint src/lib/kingmaker-pricing-decision.ts src/lib/instacomp-pricing-request-security.ts src/app/api/instacomp/pricing/decision/route.ts scripts/run-kingmaker-pricing-decision-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder-admin-session
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
