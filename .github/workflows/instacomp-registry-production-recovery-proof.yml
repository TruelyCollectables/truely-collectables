name: InstaComp Registry Authority Retirement Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-registry-production-recovery-proof.yml"
      - ".github/workflows/instacomp-registry-recovery-verify.yml"
      - "services/instacomp-ai/app/checklist.py"
      - "services/instacomp-ai/app/config.py"
      - "services/instacomp-ai/app/authoritative_registry_gateway.py"
      - "services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v*.py"
      - "services/instacomp-ai/scripts/install-sentinel-control.sh"
      - "src/lib/instacomp-mac-registry-client.ts"
      - "src/lib/instacomp-learning-server.ts"
      - "src/app/api/instacomp/registry-holdout-lock*/route.ts"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-cloud-registry-authority-retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install InstaComp Python runtime
        run: python -m pip install --disable-pip-version-check -r services/instacomp-ai/requirements.txt
      - name: Compile authority code
        run: python -m py_compile services/instacomp-ai/app/checklist.py services/instacomp-ai/app/config.py services/instacomp-ai/app/authoritative_registry_gateway.py services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v5.py services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v6.py services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py
      - name: Prove unseen benchmark routes target Mac Registry only
        run: |
          set -euo pipefail
          grep -F 'HOLDOUT_ROUTE = "/api/instacomp/registry-lock"' services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v5.py
          grep -F 'FAST_ROUTE = "/api/instacomp/registry-lock"' services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v6.py
          grep -F 'SCOPED_FAST_ROUTE = "/api/instacomp/registry-lock"' services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v8.py
          grep -F 'LIVE_PREFLIGHT_ROUTE = "/api/instacomp/registry-lock"' services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v10.py
          ! grep -R -E 'registry-holdout-lock-(fast|scoped|player-card)' services/instacomp-ai/scripts/benchmark_lora_unseen_holdout_v*.py
      - name: Prove no cloud Registry fallback remains in active Mac code
        run: |
          set -euo pipefail
          ! grep -R -E 'INSTACOMP_AI_REGISTRY_URL.*truelycollectables\.com|default.*truelycollectables\.com' services/instacomp-ai/app services/instacomp-ai/scripts/install-sentinel-control.sh
          grep -F 'http://127.0.0.1:8787' services/instacomp-ai/scripts/install-sentinel-control.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove web identity/holdout runtime has no Supabase checklist reads
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'from\("checklist_(cards|versions|card_identities|releases|sets)' src/app/api/instacomp src/lib/instacomp-* --include='*.ts' --include='*.tsx'
          for route in src/app/api/instacomp/registry-holdout-lock*/route.ts; do grep -q 'postInstaCompMacRegistry' "$route"; done
      - run: npx tsc --noEmit --pretty false
