name: InstaComp Registry Production Recovery Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-registry-production-recovery-proof.yml"
      - "services/instacomp-ai/app/checklist.py"
      - "services/instacomp-ai/app/authoritative_registry_gateway.py"
      - "src/lib/instacomp-registry-lock-request.ts"
      - "src/app/api/instacomp/registry-lock/route.ts"
      - "src/lib/instacomp-learning-server.ts"
      - "scripts/run-instacomp-registry-production-data-regression.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-registry-production-recovery-proof.yml"
      - "services/instacomp-ai/app/checklist.py"
      - "services/instacomp-ai/app/authoritative_registry_gateway.py"
      - "src/lib/instacomp-registry-lock-request.ts"
      - "src/app/api/instacomp/registry-lock/route.ts"
      - "src/lib/instacomp-learning-server.ts"
      - "scripts/run-instacomp-registry-production-data-regression.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-registry-production-recovery-proof-${{ github.event_name }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
  INSTACOMP_AI_REGISTRY_URL: https://truelycollectables.com

jobs:
  prove-production-registry-data-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked application dependencies
        run: npm ci --ignore-scripts

      - name: Install InstaComp Python runtime
        run: python -m pip install --disable-pip-version-check -r services/instacomp-ai/requirements.txt

      - name: Install Cloudflare credential tooling without changing the lockfile
        run: npm install --no-save --package-lock=false wrangler@latest

      - name: Recover production Registry database credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo 'SUPABASE_ACCESS_TOKEN is unavailable.'; exit 2; }
          curl -sS --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -o /tmp/instacomp-registry-api-keys.json
          node <<'NODE'
          const fs = require('node:fs');
          const keys = JSON.parse(fs.readFileSync('/tmp/instacomp-registry-api-keys.json', 'utf8'));
          if (!Array.isArray(keys) || !keys.length) throw new Error('Supabase returned no API keys.');
          const normalized = keys.map((row) => ({
            discriminator: String(row?.name || row?.type || '').trim().toLowerCase(),
            value: String(row?.api_key || '').trim(),
          }));
          const serverKey = normalized.find((row) => ['service_role', 'secret'].includes(row.discriminator) && row.value);
          if (!serverKey) throw new Error('Supabase server API key was not resolved.');
          const ref = String(process.env.SUPABASE_PROJECT_REF || '').trim();
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL=https://${ref}.supabase.co\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_ROLE_KEY=${serverKey.value}\n`);
          console.log('PASS production Registry credentials recovered from Supabase management API; values withheld.');
          NODE

      - name: Prove all five Frozen Five Registry identities three times in production data
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "=== production Registry data proof ${run}/3 ==="
            node --import tsx scripts/run-instacomp-registry-production-data-regression.ts \
              | tee "/tmp/production-registry-proof-${run}.log"
            grep -q 'PASS production Registry data resolves all five Frozen Five canonical identities exactly' "/tmp/production-registry-proof-${run}.log"
          done

      - name: Install short-lived Production acceptance credential
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf 'INSTACOMP_AI_REGISTRY_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'INSTACOMP_ACCEPTANCE_SERVICE_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx --no-install wrangler secret put INSTACOMP_ACCEPTANCE_SERVICE_TOKEN \
            --config wrangler.production-route.jsonc
          echo 'PASS short-lived acceptance credential installed without rotating permanent Mac Registry auth.'

      - name: Hammer exact Frozen Five through live authoritative Python gateway
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/instacomp-ai python - <<'PY'
          import asyncio

          from app.authoritative_registry_gateway import AuthoritativeRegistryChecklistGateway
          from app.models import CardIdentity, ChecklistOutcome

          CASES = [
              {
                  "key": "sonia-122-base-from-real-bad-reader-payload",
                  "identity": CardIdentity(
                      year="2025",
                      brand="Prizm",
                      set_name="2025 Panini Prizm WNBA - Silver Prizms",
                      card_number="22",
                      player="Sonia Citron",
                      team="Washington Mystics",
                      sport="Basketball",
                  ),
                  "ocr": "SONIA CITRON ROOKIE PRIZ PRZN RC CARD 22 WASHINGTON MYSTICS",
                  "identity_id": "2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f",
                  "card_number": "122",
                  "player": "Sonia Citron",
              },
              {
                  "key": "malonga-116-ice",
                  "identity": CardIdentity(
                      year="2025",
                      manufacturer="Panini",
                      brand="Prizm",
                      set_name="2025 Panini Prizm WNBA",
                      card_number="116",
                      player="Dominique Malonga",
                      sport="Basketball",
                      league="WNBA",
                      parallel="Ice",
                  ),
                  "ocr": None,
                  "identity_id": "bde0577b-72e8-4e59-8287-89aaf2f9e7e2",
                  "card_number": "116",
                  "player": "Dominique Malonga",
              },
              {
                  "key": "sonia-13-groovy",
                  "identity": CardIdentity(
                      year="2025",
                      manufacturer="Panini",
                      brand="Prizm",
                      set_name="2025 Panini Prizm WNBA Groovy",
                      card_number="13",
                      player="Sonia Citron",
                      sport="Basketball",
                      league="WNBA",
                      parallel="Base",
                  ),
                  "ocr": "SONIA CITRON GROOVY 13 PANINI",
                  "identity_id": "c58ffc4f-e1c7-4cd9-b6e2-599af5a29044",
                  "card_number": "13",
                  "player": "Sonia Citron",
              },
              {
                  "key": "paige-5-ice",
                  "identity": CardIdentity(
                      year="2025",
                      manufacturer="Panini",
                      brand="Prizm",
                      set_name="2025 Panini Prizm WNBA",
                      card_number="5",
                      player="Paige Bueckers",
                      sport="Basketball",
                      league="WNBA",
                      parallel="Ice",
                  ),
                  "ocr": None,
                  "identity_id": "575556fe-fdd4-4083-baee-c5071ed3161f",
                  "card_number": "5",
                  "player": "Paige Bueckers",
              },
              {
                  "key": "rickea-118-base-from-actual-guarded-reader-payload",
                  "identity": CardIdentity(
                      year="2025",
                      manufacturer="Panini",
                      brand="Panini Prizm",
                      set_name="2025 Panini Prizm WNBA - Green Prizms",
                      card_number="118",
                      player="Rickea Jackson",
                      sport="Basketball",
                  ),
                  "ocr": "PANINI PRNINI PRIZN LOS SANGELES ANCELES RICKEA ACKSON LOS ANGELES SPARKS No. PRIZM 118 RICKEAJACKSON 2025 PANINI - WNBA PRIZM BASKETBALL WNBPA 2025",
                  "identity_id": "70ad307e-06bb-45c2-90ea-689b6e2f302e",
                  "card_number": "118",
                  "player": "Rickea Jackson",
              },
          ]

          async def main():
              gateway = AuthoritativeRegistryChecklistGateway(
                  timeout_seconds=20.0,
                  max_attempts=3,
                  retry_backoff_seconds=0.5,
              )
              passed = 0
              total = 10 * len(CASES)
              for round_number in range(1, 11):
                  for case in CASES:
                      result, diagnostics = await gateway.match_with_diagnostics(
                          case["identity"],
                          case["ocr"],
                      )
                      assert diagnostics["registry_http_status"] == 200, (
                          case["key"],
                          diagnostics,
                      )
                      assert diagnostics["registry_status"] == "exact_match", (
                          case["key"],
                          diagnostics,
                      )
                      assert 1 <= diagnostics["registry_attempts"] <= 3, (
                          case["key"],
                          diagnostics,
                      )
                      assert result.outcome == ChecklistOutcome.EXACT_MATCH, (
                          case["key"],
                          result,
                          diagnostics,
                      )
                      assert result.identity_id == case["identity_id"], (
                          case["key"],
                          result.identity_id,
                      )
                      assert result.identity is not None
                      assert result.identity.card_number == case["card_number"], (
                          case["key"],
                          result.identity.card_number,
                      )
                      assert result.identity.player == case["player"], (
                          case["key"],
                          result.identity.player,
                      )
                      passed += 1
                      print(
                          f"PASS live gateway round={round_number}/10 "
                          f"case={case['key']} attempts={diagnostics['registry_attempts']} "
                          f"identity={result.identity_id} card={result.identity.card_number}"
                      )
              assert passed == total
              print(f"PASS live Production authoritative Python gateway Frozen Five {passed}/{total}")

          asyncio.run(main())
          PY

      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: Remove short-lived Production acceptance credential
        if: always()
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npx --no-install wrangler secret delete INSTACOMP_ACCEPTANCE_SERVICE_TOKEN \
            --config wrangler.production-route.jsonc \
            --yes
          status=$?
          if [ "$status" -ne 0 ]; then
            echo 'FAILED to remove short-lived Production acceptance credential.' >&2
            exit "$status"
          fi
          echo 'PASS short-lived Production acceptance credential removed.'

      - name: Remove recovered Registry secret material
        if: always()
        shell: bash
        run: shred -u /tmp/instacomp-registry-api-keys.json 2>/dev/null || true
