name: InstaComp Registry Production Recovery Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-registry-production-recovery-proof.yml"
      - "src/lib/instacomp-registry-lock-request.ts"
      - "src/app/api/instacomp/registry-lock/route.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-registry-production-recovery-proof.yml"
      - "src/lib/instacomp-registry-lock-request.ts"
      - "src/app/api/instacomp/registry-lock/route.ts"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: instacomp-registry-production-recovery-proof-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  prove-live-registry-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted production vault
        uses: actions/download-artifact@v4
        with:
          name: truely-production-secrets-vault-31773508121
          path: /tmp/truely-production-vault
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31773508121

      - name: Download separate recovery key
        uses: actions/download-artifact@v4
        with:
          name: truely-production-secrets-recovery-key-31773508121
          path: /tmp/truely-production-key
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31773508121

      - name: Prove live Sonia 22-to-122 Registry recovery
        shell: bash
        env:
          PROOF_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createDecipheriv, createHash } = require('node:crypto');

          async function main() {
            function filesBelow(root) {
              return fs.readdirSync(root, { recursive: true, withFileTypes: true })
                .filter((entry) => entry.isFile())
                .map((entry) => path.join(entry.parentPath || entry.path, entry.name));
            }

            const vaultPath = filesBelow('/tmp/truely-production-vault')
              .find((file) => file.endsWith('.tcosvault'));
            const keyPath = filesBelow('/tmp/truely-production-key')
              .find((file) => file.endsWith('.recovery-key.txt'));
            if (!vaultPath || !keyPath) throw new Error('Production recovery artifacts are incomplete.');

            const envelope = JSON.parse(fs.readFileSync(vaultPath, 'utf8'));
            const keyText = fs.readFileSync(keyPath, 'utf8');
            const keyMatch = keyText.match(/(?:^|\n)key: ([A-Za-z0-9_-]+)(?:\n|$)/);
            if (!keyMatch) throw new Error('Production recovery key is invalid.');

            const decipher = createDecipheriv(
              'aes-256-gcm',
              Buffer.from(keyMatch[1], 'base64url'),
              Buffer.from(envelope.iv, 'base64'),
            );
            decipher.setAuthTag(Buffer.from(envelope.authenticationTag, 'base64'));
            const plaintext = Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
              decipher.final(),
            ]);
            const digest = createHash('sha256').update(plaintext).digest('hex');
            if (digest !== envelope.plaintextSha256) throw new Error('Production vault checksum failed.');

            const payload = JSON.parse(plaintext.toString('utf8'));
            const variables = {
              ...(payload?.sources?.vercelProductionApplicationVariables || {}),
              ...(payload?.sources?.githubActionsReferencedSecrets || {}),
            };
            const sentinelToken = String(variables.INSTACOMP_SENTINEL_ARCHIVE_TOKEN || '').trim();
            if (sentinelToken.length < 32) {
              throw new Error('Production vault does not contain the shared InstaComp Sentinel archive token.');
            }

            const endpoint = 'https://truelycollectables.com/api/instacomp/registry-lock';
            const expectedIdentity = '2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f';
            const expectedFingerprint = '4366f96b6cf8b136e5ae4da70c35539d56e1793de0a42bcccbf970a892791e59';
            const preDeployProof = process.env.PROOF_EVENT_NAME === 'pull_request';
            const body = {
              year: '2025',
              manufacturer: null,
              brand: 'Prizm',
              // PR proves the hypothesis against the currently deployed resolver:
              // retaining release scope is sufficient for the existing bounded
              // 22->122 recovery. Main/push proves the new sanitizer transforms
              // the original bad Silver title correctly after Cloudflare deploy.
              setName: preDeployProof
                ? '2025 Panini Prizm WNBA'
                : '2025 Panini Prizm WNBA - Silver Prizms',
              subset: null,
              cardNumber: '22',
              player: 'Sonia Citron',
              team: 'Washington Mystics',
              sport: 'Basketball',
              league: null,
              serialNumber: null,
              isAuto: null,
              isRelic: null,
              parallel: null,
              variation: null,
              ocrText: 'SONIA CITRON ROOKIE PRIZ PRZN RC CARD 22 WASHINGTON MYSTICS',
            };

            let last = 'No request attempted.';
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const response = await fetch(endpoint, {
                  method: 'POST',
                  headers: {
                    accept: 'application/json',
                    'content-type': 'application/json',
                    'x-instacomp-client': preDeployProof
                      ? 'github-predeploy-release-scope-proof'
                      : 'github-production-recovery-proof',
                    'x-instacomp-sentinel-archive-token': sentinelToken,
                  },
                  body: JSON.stringify(body),
                  redirect: 'manual',
                  signal: AbortSignal.timeout(60_000),
                });
                const data = await response.json().catch(() => ({}));
                const reasons = Array.isArray(data?.reasons) ? data.reasons.map(String) : [];
                const lockedCardNumber = String(data?.lockedFields?.cardNumber || '');
                const valid =
                  response.status === 200 &&
                  data?.ok === true &&
                  data?.status === 'exact_match' &&
                  data?.registryIdentityId === expectedIdentity &&
                  data?.registryFingerprintSha256 === expectedFingerprint &&
                  lockedCardNumber === '122' &&
                  reasons.some((reason) => reason === 'unique_leading_digit_card_number_recovery:22->122');

                if (valid) {
                  console.log(
                    preDeployProof
                      ? 'PASS live pre-deploy proof: release-scoped Sonia #22 resolves uniquely to canonical #122.'
                      : 'PASS live deployed proof: original Silver-title Sonia #22 evidence resolves uniquely to canonical #122.',
                  );
                  return;
                }
                last = `attempt=${attempt} status=${response.status} registryStatus=${data?.status || null} resolverStatus=${data?.resolverStatus || null} candidateCount=${data?.candidateCount ?? null} identity=${data?.registryIdentityId || null} card=${lockedCardNumber || null} reasons=${JSON.stringify(reasons)}`;
              } catch (error) {
                last = `attempt=${attempt} error=${error instanceof Error ? error.message : String(error)}`;
              }
              console.log(`Waiting for Registry proof: ${last}`);
              await new Promise((resolve) => setTimeout(resolve, 20_000));
            }
            throw new Error(`Live Registry recovery proof failed: ${last}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Remove recovered secret material
        if: always()
        shell: bash
        run: |
          find /tmp/truely-production-vault /tmp/truely-production-key -type f -exec shred -u {} + 2>/dev/null || true
