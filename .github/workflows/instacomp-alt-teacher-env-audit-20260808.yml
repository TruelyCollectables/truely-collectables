name: InstaComp alternate teacher env audit 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/instacomp-alt-teacher-env-audit-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read Production env names only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > /tmp/vercel-env-list.txt
          mkdir -p .verification
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('/tmp/vercel-env-list.txt','utf8');
          const names=[
            'OPENROUTER_API_KEY',
            'TOGETHER_API_KEY',
            'FIREWORKS_API_KEY',
            'DEEPSEEK_API_KEY',
            'MISTRAL_API_KEY',
            'COHERE_API_KEY',
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'HF_TOKEN',
            'HUGGINGFACE_API_KEY',
            'GOOGLE_API_KEY',
            'AZURE_OPENAI_API_KEY',
            'AZURE_OPENAI_ENDPOINT',
            'AWS_BEDROCK_ACCESS_KEY_ID',
            'AWS_ACCESS_KEY_ID',
          ];
          const presence={};
          for(const name of names){
            presence[name]=new RegExp(`(^|\\n)\\s*${name.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')}\\s`, 'm').test(text);
          }
          const payload={
            schema:'truelycollectables.instacompAltTeacherEnvPresence.v1',
            production:true,
            presence,
            secretValuesExposed:false,
            checkedAt:new Date().toISOString(),
          };
          fs.writeFileSync('.verification/instacomp-alt-teacher-env-presence.json',JSON.stringify(payload,null,2)+'\n');
          NODE
          rm -f /tmp/vercel-env-list.txt

      - name: Commit safe presence receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .verification/instacomp-alt-teacher-env-presence.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record safe alternate teacher env presence'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
