name: Reconcile eBay PDF Purchases 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/reconcile-ebay-pdf-only-production.mjs"
      - "scripts/reconcile-ebay-pdf-purchases-production.mjs"
      - "scripts/enforce-ebay-pdf-all-in-purchase-ledger.mjs"
      - "vercel.json"
      - ".github/workflows/reconcile-ebay-pdf-purchases-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-ebay-pdf-purchases-20260807
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Checkout reconciliation ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Run reconciliation inside a fail-closed Production build
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --prod \
            --force \
            --yes \
            --logs \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee ebay-reconciliation-vercel-build.log
          grep -q "PDF orders matched: 25/25" ebay-reconciliation-vercel-build.log
          grep -q "PDF line items represented: 28/28" ebay-reconciliation-vercel-build.log
          grep -q "PDF ALL-IN total represented: \$528.52" ebay-reconciliation-vercel-build.log
          grep -q "Final canonical verification: 28/28" ebay-reconciliation-vercel-build.log

      - name: Restore clean latest-main Production deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout --detach origin/main
          rm -rf .vercel
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
          npx vercel@56.2.0 deploy \
            --prod \
            --force \
            --yes \
            --logs \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee clean-main-vercel-build.log

      - name: Upload build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebay-purchase-reconciliation-build-logs
          path: |
            ebay-reconciliation-vercel-build.log
            clean-main-vercel-build.log
          if-no-files-found: warn
