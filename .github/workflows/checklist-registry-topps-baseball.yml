name: Checklist Registry Topps Baseball

on:
  pull_request:
    paths:
      - "src/lib/checklist-registry/topps-baseball-*.ts"
      - "src/lib/checklist-registry/source-adapter.ts"
      - "src/lib/checklist-registry/server.ts"
      - "scripts/run-topps-baseball-*.ts"
      - ".github/workflows/checklist-registry-topps-baseball.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checklist-registry-topps-baseball-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-topps-baseball:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency security verification
        run: node scripts/run-dependency-security-audit.mjs
      - name: Topps parser regressions
        run: node --import tsx scripts/run-topps-baseball-text-parser-regressions.ts
      - name: Registry TypeScript contracts
        run: npx tsc --noEmit
      - name: Diff integrity
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
