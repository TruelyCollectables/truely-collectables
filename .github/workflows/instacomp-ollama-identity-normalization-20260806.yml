name: InstaComp Ollama Identity Normalization 20260806

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch-instacomp-ollama-identity-normalization.py"
      - "services/instacomp-ai/app/ollama.py"
      - "services/instacomp-ai/tests/test_prizm_surface_parallel.py"
      - ".github/workflows/instacomp-ollama-identity-normalization-20260806.yml"

permissions:
  contents: write

concurrency:
  group: instacomp-ollama-identity-normalization-20260806
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-ollama-numeric-identity-normalization-20260806
          fetch-depth: 0

      - name: Apply runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-instacomp-ollama-identity-normalization.py
          grep -q 'card_number' services/instacomp-ai/app/ollama.py
          grep -q 'misclassifying a valid model answer as model_unavailable' services/instacomp-ai/app/ollama.py
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Compile and run Mac service tests
        shell: bash
        run: |
          set -euo pipefail
          pip install -r services/instacomp-ai/requirements.txt
          python -m compileall services/instacomp-ai/app services/instacomp-ai/tests
          PYTHONPATH=services/instacomp-ai pytest -q services/instacomp-ai/tests

      - name: Persist runtime file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/instacomp-ai/app/ollama.py
          if ! git diff --cached --quiet; then
            git commit -m "Normalize numeric Ollama identity fields before validation [skip ci]"
            git push origin HEAD:fix/instacomp-ollama-numeric-identity-normalization-20260806
          fi
