name: InstaComp V8 Last Two Cert 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/patch-instacomp-v8-last-two-20260807.py"
      - ".github/workflows/instacomp-v8-last-two-cert-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-v8-last-two-cert-20260807
  cancel-in-progress: true

env:
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: truelycollectables-projects

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-v8-last-two-20260807
          fetch-depth: 0

      - name: Apply last-two repair
        run: python scripts/ops/patch-instacomp-v8-last-two-20260807.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Serial evidence guard regression
        shell: bash
        run: |
          set -euo pipefail
          npx tsx -e '
            import assert from "node:assert/strict";
            import { applyInstaCompSerialEvidenceGuard } from "./src/lib/instacomp-identity-guard";
            const ai={player:"Dominique Malonga",year:"2025",brand:"Panini",setName:"Base",cardNumber:"116",parallel:"Prizms Ice",serialNumber:"/299",team:"Seattle Storm",sport:"Basketball",isRookie:true,isAuto:false,isRelic:false,conditionGuess:null,confidence:0.98,notes:null};
            const suppressed=applyInstaCompSerialEvidenceGuard(ai,[]);
            assert.equal(suppressed.serialNumber,null);
            assert.match(String(suppressed.notes||""),/suppressed uncorroborated serial/i);
            const confirmed=applyInstaCompSerialEvidenceGuard(ai,["/299"]);
            assert.equal(confirmed.serialNumber,"/299");
            console.log("PASS serial guard suppresses stale /299 and preserves corroborated serial");
          '

      - name: Full TypeScript compile
        run: npx tsc --noEmit

      - name: Resolve Production Registry read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$RUNNER_TEMP/production.env"
          runtime_file="$RUNNER_TEMP/registry-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node - <<'NODE'
          const fs=require('node:fs');
          const parsed={};
          for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)){
            const line=raw.trim();if(!line||line.startsWith('#'))continue;
            const i=line.indexOf('=');if(i<1)continue;
            const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();
            if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}
            parsed[k]=v;
          }
          (async()=>{
            const url=String(parsed.NEXT_PUBLIC_SUPABASE_URL||'').trim();
            if(!url)throw new Error('Missing Production Supabase URL');
            const ref=new URL(url).hostname.split('.')[0];
            const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});
            const text=await r.text();if(!r.ok)throw new Error(`Supabase keys HTTP ${r.status}`);
            const keys=text?JSON.parse(text):[];const val=e=>String(e?.api_key||e?.key||e?.value||'');
            const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));
            const legacy=keys.find(e=>e?.name==='service_role'&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==='service_role'&&/^eyJ/.test(val(e)));
            const key=val(modern||legacy);if(!key)throw new Error('No Production server key');
            console.log(`::add-mask::${url}`);console.log(`::add-mask::${key}`);
            fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(url)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(key)}\n`,{mode:0o600});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Live Registry proof for all five route semantics
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/registry-env.sh"
          cat > "$RUNNER_TEMP/live-proof.ts" <<'TS'
          import assert from "node:assert/strict";
          import { applyInstaCompSerialEvidenceGuard } from "./src/lib/instacomp-identity-guard";
          import { revalidateChecklistRegistryReceipt, resolveChecklistRegistry } from "./src/lib/instacomp-learning-server";

          async function exactDirect(input:any, expected:string, fp:string) {
            const r=await resolveChecklistRegistry(input,{evidenceTrusted:false});
            assert.equal(r.status,"internal_exact_match",`${input.player} direct: ${r.status} ${r.reasons.join(',')}`);
            assert.equal(r.candidateCount,1,`${input.player} candidateCount`);
            assert.equal(r.match?.identityId,expected,`${input.player} UUID`);
            assert.equal(r.match?.fingerprintSha256,fp,`${input.player} fingerprint`);
          }
          async function exactReceipt(ai:any, expected:string, fp:string) {
            const r=await revalidateChecklistRegistryReceipt({ai,identityId:expected,fingerprintSha256:fp});
            assert.ok(r,`${ai.player} receipt missing`);
            assert.equal(r.status,"internal_exact_match",`${ai.player} receipt status`);
            assert.equal(r.match?.identityId,expected,`${ai.player} receipt UUID`);
            assert.equal(r.match?.fingerprintSha256,fp,`${ai.player} receipt fingerprint`);
          }

          async function main(){
            await exactDirect({player:"Sonia Citron",year:"2025",brand:"Panini",setName:"2025 Panini Prizm WNBA",cardNumber:"122",parallel:null},"2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f","4366f96b6cf8b136e5ae4da70c35539d56e1793de0a42bcccbf970a892791e59");
            const malongaBad={player:"Dominique Malonga",year:"2025",brand:"Panini",setName:"Base",cardNumber:"116",parallel:"Prizms Ice",serialNumber:"/299",team:"Seattle Storm",sport:"Basketball",isRookie:true,isAuto:false,isRelic:false,conditionGuess:null,confidence:0.98,notes:null};
            const malonga=applyInstaCompSerialEvidenceGuard(malongaBad,[]);
            assert.equal(malonga.serialNumber,null);
            await exactReceipt(malonga,"bde0577b-72e8-4e59-8287-89aaf2f9e7e2","112f66efaa6b13de4f33e18f632a5c364c8bd2895b610d157a538748c858ba32");
            await exactDirect({player:"Sonia Citron",year:"2025",brand:"Panini",setName:"PRIZM",cardNumber:"13",parallel:null,registryVisibleText:"GROOVY SONIA CITRON PRIZM WNBA"},"c58ffc4f-e1c7-4cd9-b6e2-599af5a29044","dd4d9c92ff0cc4b985ef0b3aa29c8bcfb882ffe27021aa8809fde3c97db7a2ad");
            await exactReceipt({player:"Paige Bueckers",year:"2025",brand:"Panini",setName:"Base",cardNumber:"5",parallel:"Prizms Ice",team:"Dallas Wings",sport:"Basketball",isRookie:true,isAuto:false,isRelic:false},"575556fe-fdd4-4083-baee-c5071ed3161f","66531f084322d986e26c569e12a152bada033904c67b7068c00572c3efaa7d42");
            await exactDirect({player:"Rickea Jackson",year:"2025",brand:"Panini",setName:"PRIZM",cardNumber:"118",parallel:null,registryVisibleText:"RICKEA JACKSON PRIZM WNBA LOS ANGELES SPARKS"},"70ad307e-06bb-45c2-90ea-689b6e2f302e","bdbf4845dae6d1da4d783fd23d9c387883769cd68aee3c663b144013bb891028");
            console.log("PASS live Registry path proof for all five frozen identities");
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          cp "$RUNNER_TEMP/live-proof.ts" scripts/.tmp-v8-live-proof.ts
          npx tsx scripts/.tmp-v8-live-proof.ts
          rm -f scripts/.tmp-v8-live-proof.ts

      - name: Source safety boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/app/api/instacomp/scan/route.ts' \
            'src/lib/instacomp-identity-guard.ts' \
            'src/lib/instacomp-learning-server.ts' | sort)"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- services/instacomp-ai)"
          grep -Fq 'applyInstaCompSerialEvidenceGuard' src/app/api/instacomp/scan/route.ts
          grep -Fq 'Serial evidence guard suppressed uncorroborated serial' src/lib/instacomp-identity-guard.ts
          grep -Fq 'checklistProductLineCoverageMatches' src/lib/instacomp-learning-server.ts
          grep -Fq 'productLineOnlySetEvidence && !softVisibleSetRows.length' src/lib/instacomp-learning-server.ts

      - name: Commit certified permanent source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/instacomp/scan/route.ts src/lib/instacomp-identity-guard.ts src/lib/instacomp-learning-server.ts
          git commit -m 'Fix Malonga serial and Rickea product-line Registry resolution'
          git push origin HEAD:fix/instacomp-v8-last-two-20260807
