name: Query Pending Receiving

on:
  push:
    branches:
      - main
    paths:
      - src/app/api/internal/pending-receiving/route.js
      - scripts/query-pending-receiving.mjs
      - .github/workflows/query-pending-receiving.yml
      - ops_pending_receiving_audit_20260731.txt

permissions:
  contents: write

concurrency:
  group: query-pending-receiving-production
  cancel-in-progress: false

jobs:
  query-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
    steps:
      - name: Check out newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link Vercel Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

      - name: Provision one-time protected read key
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/pending-receiving-read-secret"
          openssl rand -hex 32 > "$secret_file"
          chmod 600 "$secret_file"
          read_secret="$(cat "$secret_file")"
          test -n "$read_secret"
          echo "::add-mask::$read_secret"
          npx vercel@56.2.0 env add PENDING_RECEIVING_READ_SECRET production \
            --force \
            --sensitive \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            < "$secret_file" >/dev/null
          printf 'PENDING_RECEIVING_READ_SECRET=%s\n' "$read_secret" >> "$GITHUB_ENV"
          rm -f "$secret_file"

      - name: Deploy current main to Production
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --no-color \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" | tail -n 1)"
          test -n "$deployment_url"
          echo "PENDING_RECEIVING_PRODUCTION_DEPLOY=complete"

      - name: Query current pending receiving list
        shell: bash
        run: |
          set -euo pipefail
          node scripts/query-pending-receiving.mjs

      - name: Upload current pending receiving list
        uses: actions/upload-artifact@v4
        with:
          name: pending-receiving-current
          path: |
            audit/pending-receiving-current.json
            audit/pending-receiving-current.md
          if-no-files-found: error
          retention-days: 1

      - name: Commit read-only audit receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add audit/pending-receiving-current.json audit/pending-receiving-current.md
          if git diff --cached --quiet; then
            echo "Audit receipt unchanged."
            exit 0
          fi
          git commit -m "Record current pending receiving list [skip ci]"
          git push origin HEAD:main
