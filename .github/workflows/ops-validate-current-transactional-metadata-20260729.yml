name: Publish Corrected Full Launch Audit Workflow 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-validate-current-transactional-metadata-20260729.yml"
      - "ops-output/ops-truely-full-launch-audit-20260729.yml"

permissions:
  contents: write

concurrency:
  group: publish-corrected-full-launch-audit-workflow-20260729
  cancel-in-progress: false

jobs:
  publish-audit-workflow-blob:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/validate-transactional-metadata-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: 7765f115d44e2629d47cc38871273dacdafcb8e7
      EXPECTED_AUDIT_SHA: 3417c615337436df896cfe9d3238f5d29ae33518
      AUDIT_BRANCH: ops/truely-full-launch-audit-20260729
      AUDIT_WORKFLOW: .github/workflows/ops-truely-full-launch-audit-20260729.yml
      OUTPUT_FILE: ops-output/ops-truely-full-launch-audit-20260729.yml
    steps:
      - name: Check out operations branch
        uses: actions/checkout@v4
        with:
          ref: ops/validate-transactional-metadata-20260729
          fetch-depth: 0

      - name: Confirm exact current source and audit revisions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$AUDIT_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/$AUDIT_BRANCH)" = "$EXPECTED_AUDIT_SHA"
          git show "origin/$AUDIT_BRANCH:$AUDIT_WORKFLOW" > /tmp/full-launch-audit.yml

      - name: Generate and validate corrected audit workflow blob
        shell: bash
        run: |
          set -euo pipefail
          python ops-tools/patch-full-launch-audit-20260729.py
          git diff --check -- "$OUTPUT_FILE"
          grep -Fq 'runtime-env-presence.json' "$OUTPUT_FILE"
          grep -Fq "const transactionalPages = new Set(['cart', 'signup']);" "$OUTPUT_FILE"
          grep -Fq 'row.crawlable !== 0' "$OUTPUT_FILE"
          grep -Fq 'row.seo < 90 || row.crawlable !== 1' "$OUTPUT_FILE"
          python - <<'PY'
          from pathlib import Path
          text = Path('ops-output/ops-truely-full-launch-audit-20260729.yml').read_text(encoding='utf-8')
          if text.count('Run read-only Production integration and data audit') != 1:
              raise SystemExit('Runtime audit step count changed unexpectedly.')
          if text.count('Grade Lighthouse reports') != 1:
              raise SystemExit('Lighthouse grader count changed unexpectedly.')
          PY

      - name: Publish corrected audit workflow blob outside workflow directory
        shell: bash
        run: |
          set -euo pipefail
          git add "$OUTPUT_FILE"
          if git diff --cached --quiet; then
            echo 'Corrected audit workflow blob is already published.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish corrected full launch audit workflow blob'
          git push origin HEAD:ops/validate-transactional-metadata-20260729

      - name: Upload corrected audit workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-full-launch-audit-workflow-${{ github.run_number }}
          path: ops-output/ops-truely-full-launch-audit-20260729.yml
          if-no-files-found: error
          retention-days: 7
