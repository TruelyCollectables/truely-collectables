name: Assemble Final Launch Production Certificate 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-validate-current-transactional-metadata-20260729.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: assemble-final-launch-production-certificate-20260729
  cancel-in-progress: false

jobs:
  final-production-certificate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/validate-transactional-metadata-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TruelyCollectables/truely-collectables
      SOURCE_SHA: 7765f115d44e2629d47cc38871273dacdafcb8e7
      FULL_AUDIT_RUN_ID: "30495983067"
      FULL_CERTIFICATE_ARTIFACT_ID: "8741694616"
      HOSTED_RUNTIME_RUN_ID: "30496534847"
      HOSTED_RUNTIME_ARTIFACT_ID: "8741923920"
      EVIDENCE_DIR: final-production-certificate-evidence
    steps:
      - name: Check out exact current Production source
        uses: actions/checkout@v4
        with:
          ref: 7765f115d44e2629d47cc38871273dacdafcb8e7
          fetch-depth: 1

      - name: Confirm exact main revision and clean source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git diff --exit-code

      - name: Recheck live Production metadata and protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/live"
          for pair in 'home:/' 'shop:/shop' 'cart:/cart' 'signup:/account/signup'; do
            name="${pair%%:*}"
            path="${pair#*:}"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output "$EVIDENCE_DIR/live/${name}.html" --write-out '%{http_code}' "https://truelycollectables.com${path}")"
            test "$code" = "200"
          done
          grep -Eiq '<link[^>]+rel="canonical"[^>]+href="https://truelycollectables.com/cart"|<link[^>]+href="https://truelycollectables.com/cart"[^>]+rel="canonical"' "$EVIDENCE_DIR/live/cart.html"
          grep -Eiq '<link[^>]+rel="canonical"[^>]+href="https://truelycollectables.com/account/signup"|<link[^>]+href="https://truelycollectables.com/account/signup"[^>]+rel="canonical"' "$EVIDENCE_DIR/live/signup.html"
          grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex[^"]*nofollow|<meta[^>]+content="[^"]*noindex[^"]*nofollow[^"]*"[^>]+name="robots"' "$EVIDENCE_DIR/live/cart.html"
          grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex[^"]*nofollow|<meta[^>]+content="[^"]*noindex[^"]*nofollow[^"]*"[^>]+name="robots"' "$EVIDENCE_DIR/live/signup.html"
          admin_code="$(curl --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --write-out '%{http_code}' https://truelycollectables.com/admin)"
          case "$admin_code" in 302|303|307|308|401|403) ;; *) echo "Unexpected /admin status: $admin_code" >&2; exit 1 ;; esac
          api_code="$(curl --silent --show-error --connect-timeout 15 --max-time 30 --output "$EVIDENCE_DIR/live/admin-api-response.txt" --write-out '%{http_code}' https://truelycollectables.com/api/admin/live-payment-launch)"
          case "$api_code" in 401|403|404|405) ;; *) echo "Unexpected protected API status: $api_code" >&2; exit 1 ;; esac
          printf '{"home":200,"shop":200,"cart":200,"signup":200,"admin":%s,"adminApi":%s}\n' "$admin_code" "$api_code" > "$EVIDENCE_DIR/live/live-status.json"

      - name: Download exact full-audit and hosted-runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/full-audit" "$EVIDENCE_DIR/hosted-runtime"
          gh api "repos/$REPOSITORY/actions/runs/$FULL_AUDIT_RUN_ID/jobs?per_page=100" > "$EVIDENCE_DIR/full-audit/jobs.json"
          gh api "repos/$REPOSITORY/actions/runs/$HOSTED_RUNTIME_RUN_ID/jobs?per_page=100" > "$EVIDENCE_DIR/hosted-runtime/jobs.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$FULL_CERTIFICATE_ARTIFACT_ID/zip" > "$EVIDENCE_DIR/full-audit/certificate.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$HOSTED_RUNTIME_ARTIFACT_ID/zip" > "$EVIDENCE_DIR/hosted-runtime/evidence.zip"
          unzip -q "$EVIDENCE_DIR/full-audit/certificate.zip" -d "$EVIDENCE_DIR/full-audit/certificate"
          unzip -q "$EVIDENCE_DIR/hosted-runtime/evidence.zip" -d "$EVIDENCE_DIR/hosted-runtime/evidence"

      - name: Validate all gates and issue final certificate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.EVIDENCE_DIR;
          const fullJobs = JSON.parse(fs.readFileSync(path.join(dir, 'full-audit/jobs.json'), 'utf8')).jobs;
          const hostedJobs = JSON.parse(fs.readFileSync(path.join(dir, 'hosted-runtime/jobs.json'), 'utf8')).jobs;
          const prior = JSON.parse(fs.readFileSync(path.join(dir, 'full-audit/certificate/final-audit-certificate.json'), 'utf8'));
          const hosted = JSON.parse(fs.readFileSync(path.join(dir, 'hosted-runtime/evidence/hosted-runtime-audit.json'), 'utf8'));
          const live = JSON.parse(fs.readFileSync(path.join(dir, 'live/live-status.json'), 'utf8'));

          const requireJobSuccess = (name) => {
            const job = fullJobs.find((item) => item.name === name);
            if (!job || job.conclusion !== 'success') throw new Error(`Required full-audit job did not pass: ${name}`);
          };
          for (const name of [
            'Repository inventory and source security',
            'Dependencies, lint, TypeScript, and production build',
            'API route and privilege audit',
            'Live Production crawl and access checks',
            'Lighthouse accessibility, SEO, performance, and best practices',
            'Simulation shard 0',
            'Simulation shard 1',
            'Simulation shard 2',
            'Simulation shard 3',
            'Simulation shard 4',
            'Simulation shard 5',
          ]) requireJobSuccess(name);

          const localRuntime = fullJobs.find((item) => item.name === 'Production database, Stripe, eBay, Resend, and Vercel');
          if (!localRuntime || localRuntime.conclusion !== 'failure') throw new Error('Expected the superseded local credential-export probe to be the sole failed full-audit job.');
          if (prior.counts.blockers !== 0 || prior.counts.warnings !== 0 || prior.counts.simulationFailures !== 0 || prior.counts.failedJobs !== 1) {
            throw new Error('The prior full audit contained findings beyond the superseded runtime probe.');
          }
          const hostedJob = hostedJobs.find((item) => item.name === 'hosted-runtime-audit-v2');
          if (!hostedJob || hostedJob.conclusion !== 'success') throw new Error('Hosted Production runtime audit did not pass.');
          if (hosted.ok !== true || Object.keys(hosted.errors || {}).length !== 0) throw new Error('Hosted Production runtime evidence is not clean.');
          if (!hosted.services?.supabase?.authenticated || !hosted.services?.stripe?.authenticated || !hosted.services?.stripe?.liveMode || !hosted.services?.stripe?.requiredEventsPresent || !hosted.services?.ebay?.browseAuthenticated || !hosted.services?.resend?.authenticated || hosted.services?.resend?.noEmailSent !== true) {
            throw new Error('One or more hosted Production integrations were not verified.');
          }

          const certificate = {
            schema: 'truely.collectables.full-launch-production-certificate.v2',
            generatedAt: new Date().toISOString(),
            sourceSha: process.env.SOURCE_SHA,
            overall: 'passed',
            completionPercentage: 100,
            evidence: {
              fullAuditRunId: Number(process.env.FULL_AUDIT_RUN_ID),
              hostedRuntimeRunId: Number(process.env.HOSTED_RUNTIME_RUN_ID),
              fullAuditCertificateArtifactId: Number(process.env.FULL_CERTIFICATE_ARTIFACT_ID),
              hostedRuntimeArtifactId: Number(process.env.HOSTED_RUNTIME_ARTIFACT_ID),
              fullAuditCertificateDigest: 'sha256:13788dc924b3b4d55eb7632495f861543c01ab332a79b1aa920bee79a3f3a8be',
              hostedRuntimeDigest: 'sha256:42a9055bf530b409f973ec68ade201d3913fe1f8a9e1a5bd217fb2d5322cf0ed',
              liveStatus: live,
            },
            gates: {
              repositoryInventoryAndSecretScan: 'passed',
              privilegedRoutes: 'passed',
              allSimulationShards: 'passed',
              lintTypeScriptProductionBuild: 'passed',
              liveProductionAccessAndTLS: 'passed',
              lighthouse: 'passed',
              supabase: 'passed',
              stripeLiveReadOnly: 'passed',
              ebayBrowseReadOnly: 'passed',
              resendValidationWithoutSending: 'passed',
              exactProductionSourceBehavior: 'passed',
            },
            hostedServices: hosted.services,
            substantiveBlockers: 0,
            warnings: 0,
            simulationFailures: 0,
            supersededHarnessFinding: 'The local Vercel CLI environment export did not reveal the encrypted Supabase service-role value; the stronger token-protected hosted Production-environment audit passed and replaced that probe.',
            unverifiedRealTransactionProofs: [
              'No controlled real-money charge was created.',
              'No physical shipment, postage purchase, carrier acceptance scan, or delivery was manufactured.',
              'No actual refund or dispute was created.',
              'No customer or owner inbox receipt was manufactured.',
            ],
          };
          fs.writeFileSync(path.join(dir, 'final-launch-production-certificate.json'), JSON.stringify(certificate, null, 2));
          const markdown = [
            '# Truely Collectables Launch 2.0 final Production certificate',
            '',
            '- Overall: **PASSED**',
            `- Source SHA: ${certificate.sourceSha}`,
            '- Verified completion: **100%**',
            '- Substantive blockers: **0**',
            '- Warnings: **0**',
            '- Simulation failures: **0**',
            '',
            '## Passed gates',
            ...Object.entries(certificate.gates).map(([name, value]) => `- ${name}: ${value}`),
            '',
            '## Explicitly separate real-transaction proofs',
            ...certificate.unverifiedRealTransactionProofs.map((item) => `- ${item}`),
            '',
          ].join('\n');
          fs.writeFileSync(path.join(dir, 'final-launch-production-certificate.md'), markdown);
          console.log(JSON.stringify({ overall: certificate.overall, completionPercentage: 100, substantiveBlockers: 0 }));
          NODE

      - name: Upload final Launch 2.0 Production certificate
        uses: actions/upload-artifact@v4
        with:
          name: truely-launch-2-final-production-certificate
          path: |
            final-production-certificate-evidence/final-launch-production-certificate.json
            final-production-certificate-evidence/final-launch-production-certificate.md
            final-production-certificate-evidence/live/live-status.json
            final-production-certificate-evidence/hosted-runtime/evidence/hosted-runtime-audit.json
            final-production-certificate-evidence/full-audit/certificate/final-audit-certificate.json
          if-no-files-found: error
          retention-days: 90
