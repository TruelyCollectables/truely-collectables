name: InstaComp Seller Display Apply Now

on:
  push:
    branches:
      - agent/instacomp-fast-workbench-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-fast-workbench-final
          fetch-depth: 0
      - name: Materialize seller audit display
        run: python3 scripts/apply-instacomp-seller-display-fix.py
      - name: Persist seller audit display
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/instacomp/scan/route.ts \
            src/app/admin/instacomp/fast/InstaCompFastWorkbench.tsx \
            scripts/instacomp-fast-workbench-certify.mjs
          if git diff --cached --quiet; then
            echo "Seller audit display already materialized."
            exit 0
          fi
          git commit -m "Show complete eBay seller audit data"
          git push origin HEAD:agent/instacomp-fast-workbench-final
