name: Read Live Registry Scope 20260816

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/read-live-registry-scope-20260816.yml"

permissions:
  contents: read

jobs:
  read-live-registry-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
    steps:
      - name: Query exact live Checklist Registry inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p evidence
          node <<'NODE'
          const fs = require('node:fs');
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const projectRef = String(process.env.SUPABASE_PROJECT_REF || '');
          if (!accessToken || !projectRef) throw new Error('Supabase audit credentials are unavailable.');

          const query = `
            with active_versions as (
              select
                v.id,
                v.release_id,
                v.status as version_status,
                v.normalized_card_count,
                v.normalized_identity_count,
                v.activated_at
              from public.checklist_versions v
              where v.is_active
            ), inventory as (
              select
                r.slug,
                r.product_name,
                m.name as manufacturer,
                s.name as sport,
                s.slug as sport_slug,
                l.name as league,
                l.slug as league_slug,
                r.release_year,
                r.season,
                r.checklist_status,
                r.import_status,
                av.id is not null as active_version,
                av.version_status,
                coalesce(av.normalized_card_count, 0) as cards,
                coalesce(av.normalized_identity_count, 0) as identities,
                av.activated_at,
                (
                  av.id is not null
                  and av.version_status in ('live','revised')
                  and coalesce(av.normalized_card_count, 0) > 0
                  and coalesce(av.normalized_identity_count, 0) > 0
                ) as ready
              from public.checklist_releases r
              join public.checklist_manufacturers m on m.id = r.manufacturer_id
              join public.checklist_sports s on s.id = r.sport_id
              left join public.checklist_leagues l on l.id = r.league_id
              left join active_versions av on av.release_id = r.id
            ), scoped as (
              select *,
                coalesce(
                  substring(season from '(20[0-9]{2})')::int,
                  substring(release_year from '(20[0-9]{2})')::int,
                  substring(slug from '(20[0-9]{2})')::int
                ) as scope_year
              from inventory
            )
            select json_build_object(
              'schema', 'tcos.checklist.liveScopeInventory.v2',
              'checkedAt', now(),
              'source', 'production-supabase-management-api-read-only',
              'totals', json_build_object(
                'allReleaseRows', (select count(*) from inventory),
                'allActiveVersions', (select count(*) from active_versions),
                'hockeyRows', (select count(*) from scoped where lower(sport_slug) = 'hockey' and scope_year >= 2021),
                'hockeyReady', (select count(*) from scoped where lower(sport_slug) = 'hockey' and scope_year >= 2021 and ready),
                'wnbaRows', (select count(*) from scoped where (lower(coalesce(league_slug,'')) = 'wnba' or lower(product_name) like '%wnba%' or lower(slug) like '%wnba%') and scope_year in (2024, 2025)),
                'wnbaReady', (select count(*) from scoped where (lower(coalesce(league_slug,'')) = 'wnba' or lower(product_name) like '%wnba%' or lower(slug) like '%wnba%') and scope_year in (2024, 2025) and ready)
              ),
              'hockey', coalesce((
                select json_agg(json_build_object(
                  'slug', slug,
                  'productName', product_name,
                  'manufacturer', manufacturer,
                  'sport', sport,
                  'league', league,
                  'releaseYear', release_year,
                  'season', season,
                  'checklistStatus', checklist_status,
                  'importStatus', import_status,
                  'activeVersion', active_version,
                  'versionStatus', version_status,
                  'cards', cards,
                  'identities', identities,
                  'activatedAt', activated_at,
                  'ready', ready
                ) order by scope_year, manufacturer, product_name, slug)
                from scoped
                where lower(sport_slug) = 'hockey' and scope_year >= 2021
              ), '[]'::json),
              'wnba', coalesce((
                select json_agg(json_build_object(
                  'slug', slug,
                  'productName', product_name,
                  'manufacturer', manufacturer,
                  'sport', sport,
                  'league', league,
                  'releaseYear', release_year,
                  'season', season,
                  'checklistStatus', checklist_status,
                  'importStatus', import_status,
                  'activeVersion', active_version,
                  'versionStatus', version_status,
                  'cards', cards,
                  'identities', identities,
                  'activatedAt', activated_at,
                  'ready', ready
                ) order by scope_year, manufacturer, product_name, slug)
                from scoped
                where (lower(coalesce(league_slug,'')) = 'wnba' or lower(product_name) like '%wnba%' or lower(slug) like '%wnba%')
                  and scope_year in (2024, 2025)
              ), '[]'::json),
              'safety', json_build_object(
                'readOnlyManagementQuery', true,
                'productionDatabaseWrites', false,
                'migrationsApplied', false,
                'deploymentPerformed', false
              )
            ) as inventory;
          `;

          (async () => {
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${accessToken}`,
                Accept: 'application/json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ query, parameters: [], read_only: true }),
              signal: AbortSignal.timeout(30000),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Read-only Registry audit failed HTTP ${response.status}: ${text.slice(0, 1000)}`);
            const rows = text ? JSON.parse(text) : [];
            const inventory = rows?.[0]?.inventory;
            if (!inventory) throw new Error('Read-only Registry audit returned no inventory.');
            fs.writeFileSync('evidence/registry-scope-inventory.json', `${JSON.stringify(inventory, null, 2)}\n`);
            console.log(JSON.stringify(inventory, null, 2));
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack || error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Upload sanitized inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-registry-scope-inventory-20260816
          path: evidence/registry-scope-inventory.json
          if-no-files-found: error
          retention-days: 30
