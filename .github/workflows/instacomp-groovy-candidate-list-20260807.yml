name: InstaComp Groovy Candidate List 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-groovy-candidate-list-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  TEMP_DIR: /tmp/instacomp-groovy-candidate-list-20260807

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and resolve read-only Production credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMP_DIR"
          npm ci
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$TEMP_DIR/production.env"; runtime_file="$TEMP_DIR/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node - <<'NODE'
          const fs=require('node:fs'); const p={};
          for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('#'))continue;const i=line.indexOf('=');if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}p[k]=v}
          (async()=>{const u=String(p.NEXT_PUBLIC_SUPABASE_URL||'').trim();if(!u)throw Error('Missing Production Supabase URL');const ref=new URL(u).hostname.split('.')[0];const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});const text=await r.text();if(!r.ok)throw Error(`Supabase key lookup HTTP ${r.status}`);const keys=text?JSON.parse(text):[];const val=e=>String(e?.api_key||e?.key||e?.value||'');const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));const legacy=keys.find(e=>e?.name==='service_role'&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==='service_role'&&/^eyJ/.test(val(e)));const key=val(modern||legacy);if(!key)throw Error('No server key');console.log(`::add-mask::${u}`);console.log(`::add-mask::${key}`);fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(u)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(key)}\n`,{mode:0o600})})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: List Sonia Citron card 13 identities in 2025 Prizm WNBA
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          node - <<'NODE'
          const {createClient}=require('@supabase/supabase-js');
          const db=createClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.SUPABASE_SERVICE_ROLE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
          const die=(label,e)=>{throw new Error(`${label}: ${e?.message||JSON.stringify(e)}`)};
          (async()=>{
            let q=await db.from('checklist_players').select('id,canonical_name').eq('canonical_name','Sonia Citron').limit(10); if(q.error)die('players',q.error);
            console.log('PLAYERS='+JSON.stringify(q.data));
            const playerIds=(q.data||[]).map(x=>x.id); if(!playerIds.length)throw Error('No Sonia player id');
            q=await db.from('checklist_card_players').select('card_id,player_id').in('player_id',playerIds).limit(5000); if(q.error)die('card_players',q.error);
            const linked=[...new Set((q.data||[]).map(x=>x.card_id))]; console.log(`LINKED_CARD_COUNT=${linked.length}`);
            q=await db.from('checklist_cards').select('id,release_id,version_id,set_id,card_number,normalized_card_number,variation,autograph_status,memorabilia_status').in('id',linked).eq('normalized_card_number','13').limit(500); if(q.error)die('cards',q.error);
            const cards=q.data||[]; console.log(`SONIA_CARD13_COUNT=${cards.length}`); if(!cards.length)return;
            const setIds=[...new Set(cards.map(x=>x.set_id).filter(Boolean))]; const releaseIds=[...new Set(cards.map(x=>x.release_id).filter(Boolean))]; const cardIds=cards.map(x=>x.id);
            const [setsR,releasesR,idsR,teamsR]=await Promise.all([
              db.from('checklist_sets').select('id,name,release_id,version_id').in('id',setIds),
              db.from('checklist_releases').select('id,product_name,release_year,season,manufacturer:checklist_manufacturers(name),brand:checklist_brands(name),sport:checklist_sports(name),league:checklist_leagues(name)').in('id',releaseIds),
              db.from('checklist_card_identities').select('id,card_id,fingerprint_sha256,variation,autograph_status,memorabilia_status,parallel:checklist_parallels(name,serial_run)').in('card_id',cardIds),
              db.from('checklist_card_teams').select('card_id,team:checklist_teams(canonical_name)').in('card_id',cardIds),
            ]);
            for(const [label,r] of [['sets',setsR],['releases',releasesR],['identities',idsR],['teams',teamsR]]) if(r.error)die(label,r.error);
            const sets=new Map((setsR.data||[]).map(x=>[x.id,x])); const releases=new Map((releasesR.data||[]).map(x=>[x.id,x]));
            const idsBy=new Map(); for(const x of idsR.data||[]){const a=idsBy.get(x.card_id)||[];a.push(x);idsBy.set(x.card_id,a)}
            const teamsBy=new Map(); for(const x of teamsR.data||[]){const a=teamsBy.get(x.card_id)||[];a.push(x.team?.canonical_name||null);teamsBy.set(x.card_id,a)}
            const rows=[];
            for(const c of cards){const s=sets.get(c.set_id)||{};const rel=releases.get(c.release_id)||{};if(String(rel.release_year||rel.season||'').slice(0,4)!=='2025')continue;if(!/prizm/i.test(String(rel.product_name||''))||!/wnba/i.test(String(rel.product_name||'')))continue;for(const i of idsBy.get(c.id)||[]){rows.push({cardId:c.id,identityId:i.id,fingerprint:i.fingerprint_sha256,set:s.name||null,product:rel.product_name||null,manufacturer:rel.manufacturer?.name||null,brand:rel.brand?.name||null,cardNumber:c.card_number,parallel:i.parallel?.name||'Base',serialRun:i.parallel?.serial_run??null,variation:i.variation||c.variation||null,auto:i.autograph_status||c.autograph_status||null,relic:i.memorabilia_status||c.memorabilia_status||null,teams:teamsBy.get(c.id)||[]})}}
            rows.sort((a,b)=>String(a.set).localeCompare(String(b.set))||String(a.parallel).localeCompare(String(b.parallel)));
            console.log('SONIA13_IDENTITIES='+JSON.stringify(rows,null,2));
            console.log(`MATCHING_IDENTITIES=${rows.length}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove temporary files
        if: always()
        run: rm -rf "$TEMP_DIR"
