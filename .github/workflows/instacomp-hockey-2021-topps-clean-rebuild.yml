name: InstaComp Hockey 2021 Topps Clean Rebuild

on:
  push:
    branches:
      - main
    paths:
      - ".github/hockey-2021-topps-clean-rebuild-trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: instacomp-hockey-2021-topps-clean-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 90
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DOWNLOADED_CHECKLIST_CORPUS_ROOT: /home/runner/work/_temp/hockey-2021-topps/corpus
      TOPPS_HOCKEY_SOURCE_ROOT: /home/runner/work/_temp/hockey-2021-topps/topps
      TOPPS_HOCKEY_RECEIPT: /home/runner/work/_temp/hockey-2021-topps/receipt.json
      CHECKLIST_REGISTRY_SET_CHUNK: '50'
      CHECKLIST_REGISTRY_CARD_CHUNK: '50'
      CHECKLIST_REGISTRY_PARALLEL_CHUNK: '50'
      CHECKLIST_REGISTRY_IDENTITY_CHUNK: '100'
      CHECKLIST_REGISTRY_UPLOAD_ATTEMPTS: '4'
      STATUS_BRANCH: ops/hockey-2021-topps-rebuild-status

    steps:
      - name: Checkout certified Hockey recovery branch
        uses: actions/checkout@v4
        with:
          ref: feature/instacomp-target-checklists-20260816
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install deterministic PDF reader
        run: python3 -m pip install --disable-pip-version-check pypdf

      - name: Resolve Production Supabase credentials
        run: node scripts/instacomp-target-checklists/resolve-production-supabase.mjs

      - name: Download immutable source corpus
        uses: actions/download-artifact@v4
        with:
          name: requested-hockey-wnba-source-corpus-complete-31992954544
          path: /home/runner/work/_temp/hockey-2021-topps/corpus
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31992954544

      - name: Patch clean rebuild version and RPC transport
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instacomp-target-checklists/patch-final-six-production.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          adapter=Path('src/lib/checklist-registry/topps-hockey-text-adapter.ts')
          s=adapter.read_text()
          s=s.replace('export const TOPPS_HOCKEY_TEXT_ADAPTER_VERSION = "1.0.1" as const;', 'export const TOPPS_HOCKEY_TEXT_ADAPTER_VERSION = "1.0.2-clean-rebuild-20260820" as const;')
          adapter.write_text(s)
          apply=Path('scripts/instacomp-target-checklists/apply-official-topps-hockey-management.ts')
          t=apply.read_text()
          block='''const TARGETS = [
            {
              key: "2021-nhl-stickers",
              title: "2021 Topps NHL Stickers",
              sourceUrl: "https://cdn.shopify.com/s/files/1/0662/9749/5709/files/CheckList_21NHLS_VERSION2.pdf",
              minCards: 600,
            },
          ] as const;'''
          t,n=re.subn(r'const TARGETS = \[[\s\S]*?\] as const;', block, t, count=1)
          if n != 1: raise SystemExit('Could not narrow Topps targets to 2021')
          apply.write_text(t)
          PY

      - name: Stage 2021 official Topps source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TOPPS_HOCKEY_SOURCE_ROOT"
          src="$(find "$DOWNLOADED_CHECKLIST_CORPUS_ROOT" -type f -name '*hockey_2021_topps_nhl-stickers.pdf' | head -1)"
          test -n "$src"
          cp "$src" "$TOPPS_HOCKEY_SOURCE_ROOT/2021-nhl-stickers.pdf"
          python3 scripts/instacomp-target-checklists/pdf-to-layout-text.py "$TOPPS_HOCKEY_SOURCE_ROOT/2021-nhl-stickers.pdf" "$TOPPS_HOCKEY_SOURCE_ROOT/2021-nhl-stickers.txt"
          test -s "$TOPPS_HOCKEY_SOURCE_ROOT/2021-nhl-stickers.txt"

      - name: Persist clean 2021 Topps version
        run: node --import tsx scripts/instacomp-target-checklists/apply-official-topps-hockey-management.ts

      - name: Publish rebuild receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan hockey-2021-topps-status-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p data/ops
          cp "$TOPPS_HOCKEY_RECEIPT" data/ops/hockey-2021-topps-clean-rebuild.json 2>/dev/null || printf '%s\n' '{"failedCount":1,"unresolvedCount":1}' > data/ops/hockey-2021-topps-clean-rebuild.json
          git add data/ops
          git commit -m "ops(checklists): publish 2021 Topps clean rebuild receipt [skip ci]"
          git push --force origin "HEAD:${STATUS_BRANCH}"

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/hockey-2021-topps" .env.local .env.production.local .vercel
