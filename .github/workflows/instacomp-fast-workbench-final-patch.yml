name: InstaComp Fast Workbench Final Patch

on:
  push:
    branches:
      - agent/instacomp-fast-workbench-final

permissions:
  contents: write

concurrency:
  group: instacomp-fast-workbench-final-patch
  cancel-in-progress: false

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-fast-workbench-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final audited patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-instacomp-fast-workbench-final-patch.py
          python3 scripts/apply-instacomp-final-audit-fixes.py
          python3 scripts/apply-repo-audit-fixes.py

      - name: Refresh lockfile for patched dependency override
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact audited dependency tree
        run: npm ci

      - name: Run dependency security gate
        run: node scripts/run-dependency-security-audit.mjs

      - name: Run admin dashboard gate
        run: npm run verify:admin-dashboard

      - name: Run season-year simulations
        run: node --import tsx scripts/run-instacomp-season-year-simulations.ts

      - name: Certify fast workbench wiring
        run: node scripts/instacomp-fast-workbench-certify.mjs

      - name: Verify InstaComp-only identity gate
        run: node scripts/check-instacomp-provider-fallback.mjs

      - name: TypeScript check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run InstaComp accuracy regressions
        run: npm run simulate:instacomp-accuracy

      - name: Run InstaComp consensus regressions
        run: npm run simulate:instacomp-consensus

      - name: Run InstaComp catalog identity regressions
        run: npm run simulate:instacomp-catalog-identity

      - name: Run InstaComp knowledge regressions
        run: npm run simulate:instacomp-card-knowledge

      - name: Run InstaComp identity guard regressions
        run: npm run simulate:instacomp-identity-guard

      - name: Run InstaComp scan review regressions
        run: npm run simulate:instacomp-scan-review

      - name: Persist tested patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated patch remained to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/instacomp/scan/route.ts \
            src/app/admin/instacomp/fast/InstaCompFastWorkbench.tsx \
            src/lib/instacomp-consensus.ts \
            src/app/admin/instacomp/checklist-sentinel/page.tsx \
            package.json \
            package-lock.json
          git commit -m "Finalize InstaComp and FBI CIA audit fixes"
          git push origin HEAD:agent/instacomp-fast-workbench-final
