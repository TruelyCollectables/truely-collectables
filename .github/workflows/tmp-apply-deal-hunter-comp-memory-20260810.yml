name: Temporary Apply Deal Hunter Comp Memory 20260810

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 1045 && github.event.pull_request.head.ref == 'agent/deal-hunter-comp-memory-20260810' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/deal-hunter-comp-memory-20260810

      - name: Apply source patch
        run: python3 scripts/apply-deal-hunter-market-memory-first-20260810.py

      - name: Verify source contract
        run: node scripts/run-deal-hunter-market-memory-first-contract.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and diff validation
        run: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
          git diff --check

      - name: Commit validated patch to feature branch
        run: |
          set -euo pipefail
          rm -f scripts/apply-deal-hunter-market-memory-first-20260810.py
          rm -f .github/workflows/ops-deal-hunter-comp-memory-patch-20260810.yml
          rm -f .github/workflows/ops-deal-hunter-comp-memory-pr-patch-20260810.yml
          git config user.name 'truelycollectables-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use InstaComp market memory before paid sold search'
          git push origin HEAD:agent/deal-hunter-comp-memory-20260810
