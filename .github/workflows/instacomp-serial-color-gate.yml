name: InstaComp Serial Color Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/instacomp-serial-color-checklist-gate'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-serial-color-checklist-gate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply deterministic checklist gate
        run: python3 scripts/apply-instacomp-serial-color-gate.py

      - name: Run targeted regression
        run: npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts

      - name: Run existing evidence-first regression
        run: npx tsx scripts/run-instacomp-evidence-first-regressions.ts

      - name: Lint changed logic and regressions
        run: npx eslint src/lib/instacomp-learning-server.ts scripts/run-instacomp-serial-color-gate-regressions.ts

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-learning-server.ts scripts/run-instacomp-serial-color-gate-regressions.ts
          if ! git diff --cached --quiet; then
            git commit -m "Require serial and visible parallel agreement"
            git push origin HEAD:fix/instacomp-serial-color-checklist-gate
          fi
