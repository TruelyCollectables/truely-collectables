name: InstaComp Deal Hunter Listing Hint Repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/deal-hunter-listing-hint-repair.marker'
      - '.github/workflows/instacomp-deal-hunter-listing-hint-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply controlled Registry lookup hints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/api/instacomp/scan/route.ts')
          s=p.read_text()
          old='''function extractUntrustedListingIdentityHint(value: unknown) {
  const title = String(value || "").trim().slice(0, 1000);
  if (!title) return { title: null, year: null, cardNumber: null };
  const year = title.match(/\\b((?:19|20)\\d{2})(?:[-/]\\d{2,4})?\\b/)?.[1] || null;
  const cardNumber =
    title.match(/(?:\\bcard\\s*)?#\\s*([A-Za-z0-9][A-Za-z0-9.-]{0,24})\\b/i)?.[1] || null;
  return { title, year, cardNumber };
}
'''
          new='''function extractUntrustedListingIdentityHint(value: unknown) {
  const title = String(value || "").trim().slice(0, 1000);
  if (!title) return { title: null, year: null, cardNumber: null, brand: null, setName: null };
  const season =
    title.match(/\\b((?:19|20)\\d{2}[-/](?:\\d{2}|(?:19|20)\\d{2}))\\b/)?.[1] ||
    title.match(/\\b((?:19|20)\\d{2})\\b/)?.[1] || null;
  const cardNumber =
    title.match(/(?:\\bcard\\s*)?#\\s*([A-Za-z0-9][A-Za-z0-9.-]{0,24})\\b/i)?.[1] || null;
  const productRules: Array<{ pattern: RegExp; brand: string; setName: string }> = [
    { pattern: /\\bO-?Pee-?Chee\\s+Platinum\\b/i, brand: "O-Pee-Chee", setName: "O-Pee-Chee Platinum" },
    { pattern: /\\bNational\\s+Hockey\\s+Card\\s+Day\\b/i, brand: "Upper Deck", setName: "National Hockey Card Day" },
    { pattern: /\\bParkhurst\\b/i, brand: "Upper Deck", setName: "Parkhurst" },
    { pattern: /\\bSPx\\b/i, brand: "Upper Deck", setName: "SPx" },
    { pattern: /\\bFlair\\b/i, brand: "Upper Deck", setName: "Flair" },
    { pattern: /\\bTopps\\s+Now\\b/i, brand: "Topps", setName: "Topps Now" },
    { pattern: /\\bPrizm\\b/i, brand: "Panini", setName: "Prizm" },
    { pattern: /\\bBowman\\s+Draft\\b/i, brand: "Topps", setName: "Bowman Draft" },
    { pattern: /\\bBowman\\b/i, brand: "Topps", setName: "Bowman" },
  ];
  const product = productRules.find((rule) => rule.pattern.test(title)) || null;
  const brand = product?.brand || (/\\bUpper\\s+Deck\\b/i.test(title) ? "Upper Deck" : null);
  return { title, year: season, cardNumber, brand, setName: product?.setName || null };
}
'''
          if old not in s: raise SystemExit('v1 hint helper anchor not found')
          s=s.replace(old,new,1)
          old2='''    const registryProbeAi = {
      ...evidenceAi,
      ...(listingIdentityHint.year ? { year: listingIdentityHint.year } : {}),
      ...(listingIdentityHint.cardNumber ? { cardNumber: listingIdentityHint.cardNumber } : {}),
    };'''
          new2='''    const registryProbeAi = {
      ...evidenceAi,
      ...(listingIdentityHint.year ? { year: listingIdentityHint.year } : {}),
      ...(listingIdentityHint.brand ? { brand: listingIdentityHint.brand } : {}),
      ...(listingIdentityHint.setName ? { setName: listingIdentityHint.setName } : {}),
      ...(listingIdentityHint.cardNumber ? { cardNumber: listingIdentityHint.cardNumber } : {}),
    };'''
          if old2 not in s: raise SystemExit('registry probe anchor not found')
          s=s.replace(old2,new2,1)
          old3='''        untrustedListingIdentityHint: {
          supplied: Boolean(listingIdentityHint.title),
          year: listingIdentityHint.year,
          cardNumber: listingIdentityHint.cardNumber,
          trustedForIdentity: false,
        },'''
          new3='''        untrustedListingIdentityHint: {
          supplied: Boolean(listingIdentityHint.title),
          year: listingIdentityHint.year,
          brand: listingIdentityHint.brand,
          setName: listingIdentityHint.setName,
          cardNumber: listingIdentityHint.cardNumber,
          trustedForIdentity: false,
        },'''
          if old3 not in s: raise SystemExit('diagnostics anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY

      - name: Assert controlled title hint contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          cases=[
            ('2025-26 Upper Deck Parkhurst - Rookies Ivan Demidov #236 (RC)',('2025-26','Upper Deck','Parkhurst','236')),
            ('Upper Deck 2025-26 Flair Ivan Demidov #190 Rookie Montreal Canadiens NHL',('2025-26','Upper Deck','Flair','190')),
            ('O-Pee-Chee Platinum Marquee Rookie Ivan Demidov #232 Canadiens NHL 2025-26',('2025-26','O-Pee-Chee','O-Pee-Chee Platinum','232')),
            ('2026 Upper Deck National Hockey Card Day Ivan Demidov RC #NHCD-31 Rookie Card',('2026','Upper Deck','National Hockey Card Day','NHCD-31')),
            ('2025-26 NHL TOPPS NOW Sticker #87 - Ivan Demidov',('2025-26','Topps','Topps Now','87')),
            ('Panini 2025 Prizm WNBA Sonia Citron #148 RC Rookie',('2025','Panini','Prizm','148')),
            ('2025 Bowman Draft - Chrome Franklin Arias #BDC-13 Sky Blue Refractor',('2025','Topps','Bowman Draft','BDC-13')),
          ]
          def parse(t):
            m=re.search(r'\\b((?:19|20)\\d{2}[-/](?:\\d{2}|(?:19|20)\\d{2}))\\b',t) or re.search(r'\\b((?:19|20)\\d{2})\\b',t)
            c=re.search(r'(?:\\bcard\\s*)?#\\s*([A-Za-z0-9][A-Za-z0-9.-]{0,24})\\b',t,re.I)
            rules=[(r'O-?Pee-?Chee\\s+Platinum','O-Pee-Chee','O-Pee-Chee Platinum'),(r'National\\s+Hockey\\s+Card\\s+Day','Upper Deck','National Hockey Card Day'),(r'Parkhurst','Upper Deck','Parkhurst'),(r'SPx','Upper Deck','SPx'),(r'Flair','Upper Deck','Flair'),(r'Topps\\s+Now','Topps','Topps Now'),(r'Prizm','Panini','Prizm'),(r'Bowman\\s+Draft','Topps','Bowman Draft'),(r'Bowman','Topps','Bowman')]
            product=next(((b,s) for p,b,s in rules if re.search(p,t,re.I)),None)
            brand,setn=product if product else (('Upper Deck',None) if re.search(r'Upper\\s+Deck',t,re.I) else (None,None))
            return (m.group(1) if m else None,brand,setn,c.group(1) if c else None)
          for title,expected in cases:
            got=parse(title); assert got==expected,(title,got,expected)
          print('controlled listing Registry coordinates: 7/7 passed')
          PY
          grep -q 'listingIdentityHint.brand' src/app/api/instacomp/scan/route.ts
          grep -q 'listingIdentityHint.setName' src/app/api/instacomp/scan/route.ts
          grep -q 'trustedForIdentity: false' src/app/api/instacomp/scan/route.ts

      - name: Install compile and production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Commit generated source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TruelyCollectables CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/api/instacomp/scan/route.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Deal Hunter Registry set hint bridge'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
