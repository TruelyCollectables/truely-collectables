name: Patch Checklist Active Version Filter

on:
  push:
    branches:
      - agent/checklist-versioned-identity-repair

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/checklist-versioned-identity-repair
          fetch-depth: 0

      - name: Restrict Registry lookup to the active live version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/instacomp-learning-server.ts")
          text = path.read_text()

          relation_old = '''        "memorabilia_status",
                  "set:checklist_sets(id,name,normalized_name)",'''
          relation_new = '''        "memorabilia_status",
                  "version:checklist_versions!inner(id,is_active,status)",
                  "set:checklist_sets(id,name,normalized_name)",'''

          filter_old = '''    .eq("normalized_card_number", cardNumber)
              .limit(150);'''
          filter_new = '''    .eq("normalized_card_number", cardNumber)
              .eq("version.is_active", true)
              .eq("version.status", "live")
              .limit(150);'''

          changed = False
          if "version:checklist_versions!inner(id,is_active,status)" not in text:
              if relation_old not in text:
                  raise SystemExit("Registry select relation anchor was not found")
              text = text.replace(relation_old, relation_new, 1)
              changed = True

          if '.eq("version.is_active", true)' not in text:
              if filter_old not in text:
                  raise SystemExit("Registry active-version filter anchor was not found")
              text = text.replace(filter_old, filter_new, 1)
              changed = True

          if changed:
              path.write_text(text)
          PY

      - name: Commit patch once
        run: |
          if git diff --quiet -- src/lib/instacomp-learning-server.ts; then
            echo "Active-version filter already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-learning-server.ts
          git commit -m "Filter Registry matches to active versions"
          git push origin HEAD:agent/checklist-versioned-identity-repair
