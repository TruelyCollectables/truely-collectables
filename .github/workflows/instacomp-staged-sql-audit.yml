name: InstaComp Staged SQL Audit

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/instacomp-staged-sql-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read live staged checklist function definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -n "$GH_SUPABASE_ACCESS_TOKEN"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o evidence/projects.json \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' evidence/projects.json)
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          read -r -d '' sql <<'SQL' || true
          select
            p.proname,
            pg_catalog.pg_get_function_identity_arguments(p.oid) as identity_arguments,
            pg_catalog.pg_get_functiondef(p.oid) as definition
          from pg_catalog.pg_proc as p
          join pg_catalog.pg_namespace as n on n.oid = p.pronamespace
          where n.nspname = 'public'
            and p.proname in (
              'tcos_begin_checklist_import_plan',
              'tcos_append_checklist_import_chunk',
              'tcos_finalize_checklist_import_plan'
            )
          order by p.proname;
          SQL
          jq -cn --arg query "$sql" '{query:$query,read_only:true}' > evidence/query.json
          curl --silent --show-error --fail --retry 4 --retry-all-errors --retry-delay 2 --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @evidence/query.json \
            -o evidence/staged-functions.json \
            "https://api.supabase.com/v1/projects/$project_ref/database/query"
          rm -f evidence/projects.json evidence/query.json
          jq -e 'length == 3' evidence/staged-functions.json
          jq -r '.[] | "===== " + .proname + " =====\n" + .definition + "\n"' evidence/staged-functions.json
      - name: Upload staged SQL audit
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-staged-sql-audit-${{ github.run_id }}
          path: evidence/staged-functions.json
          if-no-files-found: error
          retention-days: 30
