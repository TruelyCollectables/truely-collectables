name: InstaComp Inventory Training Snapshot 20260812

on:
  push:
    branches:
      - main
      - fix/instacomp-direct-db-snapshot-20260812
    paths:
      - '.github/workflows/instacomp-inventory-training-snapshot-20260812.yml'
      - 'services/instacomp-ai/scripts/inventory_training_git_snapshot.py'
      - 'services/instacomp-ai/scripts/sync_all_inventory_training_truth_resilient.py'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: instacomp-inventory-training-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SNAPSHOT_BRANCH: generated/instacomp-inventory-training-snapshot
      SNAPSHOT_PATH: services/instacomp-ai/data/training/inventory-training-production-snapshot.json.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export authoritative inventory through Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          API = 'https://api.supabase.com/v1'
          TOKEN = os.environ['SUPABASE_ACCESS_TOKEN']
          OUT = Path('/tmp/inventory-training-production-snapshot.json.gz')
          BATCH = 500
          MAX_ROWS = 100_000
          TRANSIENT = {408, 425, 429, 500, 502, 503, 504, 520, 521, 522, 523, 524, 525, 526}

          def req(method, path, body=None, timeout=180, retries=8):
              data = None if body is None else json.dumps(body).encode('utf-8')
              last = None
              for attempt in range(1, retries + 1):
                  request = urllib.request.Request(
                      API + path,
                      data=data,
                      method=method,
                      headers={
                          'Authorization': f'Bearer {TOKEN}',
                          'Accept': 'application/json',
                          'Content-Type': 'application/json',
                          'User-Agent': 'TruelyCollectables-InstaComp-InventorySnapshot/1.0',
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          raw = response.read()
                          status = int(response.status)
                  except urllib.error.HTTPError as exc:
                      status = int(exc.code)
                      raw = exc.read()
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = f'{type(exc).__name__}: {exc}'
                      if attempt >= retries:
                          raise RuntimeError(f'{method} {path} transport failure after {retries} attempts: {last}') from exc
                      delay = min(2 ** (attempt - 1), 15)
                      print(f'RETRY management API {method} {path}: {last}; sleeping {delay}s', flush=True)
                      time.sleep(delay)
                      continue

                  text = raw.decode('utf-8', 'replace')
                  try:
                      payload = json.loads(text) if text else None
                  except json.JSONDecodeError:
                      payload = text
                  if status in (200, 201):
                      return payload
                  last = f'HTTP {status}: {str(payload)[:1200]}'
                  if status in TRANSIENT and attempt < retries:
                      delay = min(2 ** (attempt - 1), 15)
                      print(f'RETRY management API {method} {path}: {last}; sleeping {delay}s', flush=True)
                      time.sleep(delay)
                      continue
                  raise RuntimeError(f'{method} {path} failed: {last}')
              raise RuntimeError(f'{method} {path} failed after retries: {last}')

          projects = req('GET', '/projects', timeout=45)
          candidates = [
              project for project in (projects or [])
              if 'truely' in str(project.get('name') or '').lower()
              or 'collect' in str(project.get('name') or '').lower()
          ]
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one Truely Collectables Supabase project, got {len(candidates)}')
          ref = str(candidates[0].get('id') or candidates[0].get('ref') or '').strip()
          if not ref:
              raise SystemExit('Could not resolve Supabase project ref')

          def sql(query):
              payload = req(
                  'POST',
                  f'/projects/{ref}/database/query',
                  {'query': query, 'parameters': [], 'read_only': True},
                  timeout=180,
              )
              if not isinstance(payload, list):
                  raise RuntimeError(f'Unexpected database/query payload: {type(payload).__name__}')
              return payload

          table_specs = {
              'inventory_items': 'id',
              'inventory_images': 'inventory_item_id, sort_order, image_url',
              'inventory_attributes': 'inventory_item_id, attribute_name, attribute_value',
              'products': 'id',
          }
          tables = {}
          for table, order_by in table_specs.items():
              rows = []
              for offset in range(0, MAX_ROWS, BATCH):
                  query = (
                      f'select * from public.{table} '
                      f'order by {order_by} offset {offset} limit {BATCH};'
                  )
                  page = sql(query)
                  rows.extend(page)
                  print(f'SNAPSHOT {table} offset={offset} page={len(page)} total={len(rows)}', flush=True)
                  if len(page) < BATCH:
                      break
              else:
                  raise SystemExit(f'{table} exceeded MAX_ROWS={MAX_ROWS}; refusing incomplete snapshot')
              tables[table] = rows

          row_counts = {name: len(rows) for name, rows in tables.items()}
          if row_counts['inventory_items'] <= 0:
              raise SystemExit('Refusing to publish empty inventory_items snapshot')
          collx_rows = sum(
              1 for row in tables['inventory_items']
              if str(row.get('sku') or '').strip().upper().startswith('COLLX-')
          )

          payload = {
              'schema_version': 'tcos.instacomp-ai.inventory-training-production-snapshot.v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source': 'supabase_management_database_query_read_only',
              'source_project_ref': ref,
              'source_git_sha': os.environ.get('GITHUB_SHA'),
              'row_counts': row_counts,
              'collx_inventory_rows': collx_rows,
              'tables': tables,
          }
          encoded = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          OUT.parent.mkdir(parents=True, exist_ok=True)
          with OUT.open('wb') as handle:
              with gzip.GzipFile(filename='', mode='wb', fileobj=handle, compresslevel=9, mtime=0) as zipped:
                  zipped.write(encoded)
          digest = hashlib.sha256(OUT.read_bytes()).hexdigest()
          size = OUT.stat().st_size
          print('SNAPSHOT_ROW_COUNTS=' + json.dumps(row_counts, sort_keys=True))
          print(f'SNAPSHOT_COLLX_ROWS={collx_rows}')
          print(f'SNAPSHOT_BYTES={size}')
          print(f'SNAPSHOT_SHA256={digest}')
          if size >= 95 * 1024 * 1024:
              raise SystemExit(f'Snapshot is too large for safe Git transport: {size} bytes')
          PY

      - name: Publish snapshot to generated Git branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TruelyCollectables Automation'
          git config user.email 'david@truelycollectables.com'
          git fetch origin "${SNAPSHOT_BRANCH}" || true
          git checkout -B "${SNAPSHOT_BRANCH}" "${GITHUB_SHA}"
          mkdir -p "$(dirname "${SNAPSHOT_PATH}")"
          cp /tmp/inventory-training-production-snapshot.json.gz "${SNAPSHOT_PATH}"
          git add -f "${SNAPSHOT_PATH}"
          if git diff --cached --quiet; then
            echo 'Snapshot bytes unchanged; generated branch already current.'
          else
            git commit -m "Refresh InstaComp inventory training snapshot"
          fi
          git push --force origin "HEAD:refs/heads/${SNAPSHOT_BRANCH}"
          echo "SNAPSHOT_PUBLISHED_BRANCH=${SNAPSHOT_BRANCH}"
