name: InstaComp Inventory Training Snapshot 20260812

on:
  push:
    branches:
      - main
      - fix/instacomp-direct-db-snapshot-20260812
    paths:
      - '.github/workflows/instacomp-inventory-training-snapshot-20260812.yml'
      - 'services/instacomp-ai/scripts/inventory_training_git_snapshot.py'
      - 'services/instacomp-ai/scripts/sync_all_inventory_training_truth_resilient.py'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: instacomp-inventory-training-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SNAPSHOT_BRANCH: generated/instacomp-inventory-training-snapshot
      SNAPSHOT_PATH: services/instacomp-ai/data/training/inventory-training-production-snapshot.enc.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export and encrypt authoritative inventory through Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import hmac
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          API = 'https://api.supabase.com/v1'
          TOKEN = os.environ['SUPABASE_ACCESS_TOKEN']
          OUT = Path('/tmp/inventory-training-production-snapshot.enc.json')
          ITEM_BATCH = 50
          MAX_ITEMS = 100_000
          TRANSIENT = {408, 425, 429, 500, 502, 503, 504, 520, 521, 522, 523, 524, 525, 526}

          DESIRED_COLUMNS = {
              'inventory_items': [
                  'id', 'store_id', 'sku', 'title', 'description', 'category',
                  'price', 'condition', 'quantity', 'legacy_product_id',
                  'card_uuid', 'metadata',
              ],
              'inventory_images': [
                  'id', 'inventory_item_id', 'image_url', 'alt_text',
                  'sort_order', 'is_primary',
              ],
              'inventory_attributes': [
                  'id', 'inventory_item_id', 'attribute_name', 'attribute_value',
                  'sort_order',
              ],
              'products': [
                  'id', 'card_uuid', 'sku', 'title', 'description', 'category',
                  'image_url', 'photos', 'metadata', 'sport', 'league', 'year',
                  'season', 'manufacturer', 'brand', 'set', 'set_name', 'subset',
                  'player', 'team', 'card_number', 'parallel', 'variation',
                  'serial_number', 'serial_run', 'rookie', 'autograph',
                  'inscription', 'inscription_text', 'memorabilia',
                  'memorabilia_type',
              ],
          }

          def req(method, path, body=None, timeout=180, retries=8):
              data = None if body is None else json.dumps(body).encode('utf-8')
              last = None
              for attempt in range(1, retries + 1):
                  request = urllib.request.Request(
                      API + path,
                      data=data,
                      method=method,
                      headers={
                          'Authorization': f'Bearer {TOKEN}',
                          'Accept': 'application/json',
                          'Content-Type': 'application/json',
                          'User-Agent': 'TruelyCollectables-InstaComp-InventorySnapshot/2.0',
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          raw = response.read()
                          status = int(response.status)
                  except urllib.error.HTTPError as exc:
                      status = int(exc.code)
                      raw = exc.read()
                  except (urllib.error.URLError, TimeoutError) as exc:
                      last = f'{type(exc).__name__}: {exc}'
                      if attempt >= retries:
                          raise RuntimeError(f'{method} {path} transport failure after {retries} attempts: {last}') from exc
                      delay = min(2 ** (attempt - 1), 15)
                      print(f'RETRY management API {method} {path}: transport failure; sleeping {delay}s', flush=True)
                      time.sleep(delay)
                      continue

                  text = raw.decode('utf-8', 'replace')
                  try:
                      payload = json.loads(text) if text else None
                  except json.JSONDecodeError:
                      payload = text
                  if status in (200, 201):
                      return payload
                  last = f'HTTP {status}'
                  if status in TRANSIENT and attempt < retries:
                      delay = min(2 ** (attempt - 1), 15)
                      print(f'RETRY management API {method} {path}: HTTP {status}; sleeping {delay}s', flush=True)
                      time.sleep(delay)
                      continue
                  raise RuntimeError(f'{method} {path} failed: HTTP {status}')
              raise RuntimeError(f'{method} {path} failed after retries: {last}')

          projects = req('GET', '/projects', timeout=45)
          candidates = [
              project for project in (projects or [])
              if 'truely' in str(project.get('name') or '').lower()
              or 'collect' in str(project.get('name') or '').lower()
          ]
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one Truely Collectables Supabase project, got {len(candidates)}')
          ref = str(candidates[0].get('id') or candidates[0].get('ref') or '').strip()
          if not ref:
              raise SystemExit('Could not resolve Supabase project ref')

          api_keys = req('GET', f'/projects/{ref}/api-keys?reveal=true', timeout=45)
          if not isinstance(api_keys, list):
              raise SystemExit('Could not retrieve project API keys for encrypted snapshot transport')
          service_key = None
          for row in api_keys:
              name = str((row or {}).get('name') or '').strip().lower().replace('-', '_').replace(' ', '_')
              candidate = str((row or {}).get('api_key') or '').strip()
              if candidate and name == 'service_role':
                  service_key = candidate
                  break
          if not service_key:
              raise SystemExit('Could not resolve the Production service_role key for snapshot encryption')
          print(f'::add-mask::{service_key}')

          def sql(query):
              payload = req(
                  'POST',
                  f'/projects/{ref}/database/query',
                  {'query': query, 'parameters': [], 'read_only': True},
                  timeout=180,
              )
              if not isinstance(payload, list):
                  raise RuntimeError(f'Unexpected database/query payload: {type(payload).__name__}')
              return payload

          def existing_columns(table):
              rows = sql(
                  "select column_name from information_schema.columns "
                  "where table_schema='public' and table_name=" + json.dumps(table) + " "
                  "order by ordinal_position;"
              )
              available = {str(row.get('column_name') or '') for row in rows}
              selected = [column for column in DESIRED_COLUMNS[table] if column in available]
              if not selected:
                  raise SystemExit(f'No expected columns found for public.{table}')
              return selected

          columns = {table: existing_columns(table) for table in DESIRED_COLUMNS}
          for required_table, required_columns in {
              'inventory_items': {'id', 'sku', 'title'},
              'inventory_images': {'inventory_item_id', 'image_url'},
              'inventory_attributes': {'inventory_item_id', 'attribute_name', 'attribute_value'},
              'products': {'id'},
          }.items():
              missing = sorted(required_columns - set(columns[required_table]))
              if missing:
                  raise SystemExit(f'Production schema missing required {required_table} columns: {missing}')

          def select_list(table, alias=None):
              prefix = f'{alias}.' if alias else ''
              return ','.join(f'{prefix}"{column}"' for column in columns[table])

          def uuid_literals(values):
              safe = []
              for value in values:
                  safe.append(f"'{uuid.UUID(str(value))}'::uuid")
              return ','.join(safe)

          items = []
          images = []
          attributes = []
          products_by_id = {}
          last_id = None

          while True:
              if len(items) >= MAX_ITEMS:
                  raise SystemExit(f'inventory_items exceeded MAX_ITEMS={MAX_ITEMS}; refusing incomplete snapshot')
              where = '' if last_id is None else f"where id > '{uuid.UUID(str(last_id))}'::uuid"
              item_page = sql(
                  f'select {select_list("inventory_items")} '
                  f'from public.inventory_items {where} order by id limit {ITEM_BATCH};'
              )
              if not item_page:
                  break
              if len(item_page) > ITEM_BATCH:
                  raise SystemExit('Management API returned more inventory rows than requested')
              page_ids = [row.get('id') for row in item_page]
              if any(not value for value in page_ids):
                  raise SystemExit('Inventory snapshot page contained a row without id')
              id_sql = uuid_literals(page_ids)

              image_page = sql(
                  f'select {select_list("inventory_images")} '
                  f'from public.inventory_images where inventory_item_id in ({id_sql}) '
                  f'order by inventory_item_id, sort_order, id;'
              )
              attribute_page = sql(
                  f'select {select_list("inventory_attributes")} '
                  f'from public.inventory_attributes where inventory_item_id in ({id_sql}) '
                  f'order by inventory_item_id, sort_order, id;'
              )

              product_page = sql(
                  f'select distinct {select_list("products", "p")} '
                  f'from public.products p join public.inventory_items i on i.legacy_product_id = p.id '
                  f'where i.id in ({id_sql}) order by p.id;'
              )
              if 'card_uuid' in columns['inventory_items'] and 'card_uuid' in columns['products']:
                  product_page += sql(
                      f'select distinct {select_list("products", "p")} '
                      f'from public.products p join public.inventory_items i on i.card_uuid = p.card_uuid '
                      f'where i.id in ({id_sql}) and i.card_uuid is not null order by p.id;'
                  )

              items.extend(item_page)
              images.extend(image_page)
              attributes.extend(attribute_page)
              for product in product_page:
                  product_id = str(product.get('id') or '').strip()
                  if product_id:
                      products_by_id[product_id] = product

              last_id = page_ids[-1]
              print(
                  'SNAPSHOT inventory batch '
                  f'items={len(items)} images={len(images)} attributes={len(attributes)} '
                  f'linked_products={len(products_by_id)}',
                  flush=True,
              )
              if len(item_page) < ITEM_BATCH:
                  break

          if not items:
              raise SystemExit('Refusing to publish empty inventory_items snapshot')
          if len({str(row.get('id')) for row in items}) != len(items):
              raise SystemExit('Duplicate inventory item IDs detected in keyset snapshot')

          products = [products_by_id[key] for key in sorted(products_by_id)]
          tables = {
              'inventory_items': items,
              'inventory_images': images,
              'inventory_attributes': attributes,
              'products': products,
          }
          row_counts = {name: len(rows) for name, rows in tables.items()}
          collx_rows = sum(
              1 for row in items
              if str(row.get('sku') or '').strip().upper().startswith('COLLX-')
          )

          snapshot = {
              'schema_version': 'tcos.instacomp-ai.inventory-training-production-snapshot.v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source': 'supabase_management_database_query_read_only_keyset_v2',
              'source_git_sha': os.environ.get('GITHUB_SHA'),
              'row_counts': row_counts,
              'collx_inventory_rows': collx_rows,
              'tables': tables,
          }
          encoded = json.dumps(snapshot, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          compressed = gzip.compress(encoded, compresslevel=9, mtime=0)

          enc_pass = hashlib.sha256(b'instacomp-snapshot-encryption-v1\0' + service_key.encode('utf-8')).hexdigest()
          mac_key = hashlib.sha256(b'instacomp-snapshot-mac-v1\0' + service_key.encode('utf-8')).digest()
          env = dict(os.environ)
          env['INSTACOMP_SNAPSHOT_ENC_PASS'] = enc_pass
          encrypted = subprocess.run(
              [
                  'openssl', 'enc', '-aes-256-cbc', '-pbkdf2', '-iter', '200000', '-salt',
                  '-pass', 'env:INSTACOMP_SNAPSHOT_ENC_PASS',
              ],
              input=compressed,
              capture_output=True,
              check=False,
              env=env,
          )
          if encrypted.returncode != 0 or not encrypted.stdout:
              raise SystemExit('OpenSSL snapshot encryption failed')
          ciphertext = encrypted.stdout
          digest = hmac.new(mac_key, ciphertext, hashlib.sha256).hexdigest()
          envelope = {
              'schema_version': 'tcos.instacomp-ai.inventory-training-encrypted-envelope.v1',
              'algorithm': 'openssl-aes-256-cbc-pbkdf2-sha256-hmac-v1',
              'pbkdf2_iterations': 200000,
              'hmac_sha256': digest,
              'ciphertext_base64': base64.b64encode(ciphertext).decode('ascii'),
          }
          OUT.write_text(json.dumps(envelope, sort_keys=True, separators=(',', ':')), encoding='utf-8')
          size = OUT.stat().st_size
          print('SNAPSHOT_ROW_COUNTS=' + json.dumps(row_counts, sort_keys=True))
          print(f'SNAPSHOT_COLLX_ROWS={collx_rows}')
          print(f'ENCRYPTED_SNAPSHOT_BYTES={size}')
          if size >= 95 * 1024 * 1024:
              raise SystemExit(f'Encrypted snapshot is too large for safe Git transport: {size} bytes')
          PY

      - name: Publish encrypted snapshot to generated Git branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TruelyCollectables Automation'
          git config user.email 'david@truelycollectables.com'
          git fetch origin "${SNAPSHOT_BRANCH}" || true
          git checkout -B "${SNAPSHOT_BRANCH}" "${GITHUB_SHA}"
          mkdir -p "$(dirname "${SNAPSHOT_PATH}")"
          cp /tmp/inventory-training-production-snapshot.enc.json "${SNAPSHOT_PATH}"
          git add -f "${SNAPSHOT_PATH}"
          if git diff --cached --quiet; then
            echo 'Encrypted snapshot bytes unchanged; generated branch already current.'
          else
            git commit -m "Refresh encrypted InstaComp inventory training snapshot"
          fi
          git push --force origin "HEAD:refs/heads/${SNAPSHOT_BRANCH}"
          echo "ENCRYPTED_SNAPSHOT_PUBLISHED_BRANCH=${SNAPSHOT_BRANCH}"
