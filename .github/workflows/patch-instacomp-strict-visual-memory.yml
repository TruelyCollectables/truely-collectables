name: Patch InstaComp Strict Visual Memory

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-local-engine-primary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          pip install -r services/instacomp-ai/requirements.txt
          npm ci
      - name: Require close front and back visual matches
        run: |
          python - <<'PY'
          from pathlib import Path

          storage_path = Path('services/instacomp-ai/app/storage.py')
          storage = storage_path.read_text()
          old = '''        best: tuple[float, sqlite3.Row, list[str]] | None = None
                  for row in rows:
                      front_distance = perceptual_hash_distance(
                          front_perceptual_hash,
                          row["front_perceptual_hash"],
                      )
                      if front_distance is None or front_distance > 8:
                          continue

                      reasons = [f"front_visual_distance:{front_distance}"]
                      distances = [front_distance]
                      if back_perceptual_hash:
                          back_distance = perceptual_hash_distance(
                              back_perceptual_hash,
                              row["back_perceptual_hash"],
                          )
                          if back_distance is None or back_distance > 8:
                              continue
                          distances.append(back_distance)
                          reasons.append(f"back_visual_distance:{back_distance}")
                      elif front_distance > 4:
                          continue

                      score = 1.0 - (sum(distances) / len(distances)) / 64.0
                      if score < 0.875:
                          continue
                      reasons.append("trusted_visual_memory")
                      if best is None or score > best[0]:
                          best = (score, row, reasons)
          '''
          new = '''        # Near-visual automation requires both sides. One-sided or looser
                  # matches fall through to the Ollama backup rather than risking a wrong
                  # player, parallel, autograph, relic, inscription, or print run.
                  if not back_perceptual_hash:
                      return None

                  best: tuple[float, sqlite3.Row, list[str]] | None = None
                  for row in rows:
                      front_distance = perceptual_hash_distance(
                          front_perceptual_hash,
                          row["front_perceptual_hash"],
                      )
                      if front_distance is None or front_distance > 4:
                          continue

                      back_distance = perceptual_hash_distance(
                          back_perceptual_hash,
                          row["back_perceptual_hash"],
                      )
                      if back_distance is None or back_distance > 4:
                          continue

                      reasons = [
                          f"front_visual_distance:{front_distance}",
                          f"back_visual_distance:{back_distance}",
                      ]
                      distances = [front_distance, back_distance]
                      score = 1.0 - (sum(distances) / len(distances)) / 64.0
                      if score < 0.9375:
                          continue
                      reasons.append("trusted_visual_memory")
                      if best is None or score > best[0]:
                          best = (score, row, reasons)
          '''
          if old not in storage:
              raise SystemExit('visual matcher anchor missing')
          storage_path.write_text(storage.replace(old, new, 1))

          test_path = Path('services/instacomp-ai/tests/test_registry_pipeline.py')
          tests = test_path.read_text()
          addition = '''

          def test_near_visual_memory_requires_close_front_and_back(tmp_path: Path):
              store = MemoryStore(tmp_path / "memory.sqlite3")
              store.initialize()
              save_test_scan(store)
              identity = CardIdentity(
                  year="2025",
                  manufacturer="Panini",
                  set_name="Prizm WNBA",
                  player="Sonia Citron",
                  card_number="122",
                  parallel="Base",
              )
              store.create_lesson(
                  LessonCreate(
                      scan_id="scan-1",
                      state=LearningState.OPERATOR_CONFIRMED,
                      identity=identity,
                      verification_source="operator",
                      operator_id="owner",
                  )
              )
              close_match = store.find_trusted_image_match(
                  image_pair_sha256="f" * 64,
                  front_perceptual_hash="0123456789abcdef",
                  back_perceptual_hash="fedcba9876543210",
              )
              assert close_match is not None
              assert "trusted_visual_memory" in close_match.reasons
              assert store.find_trusted_image_match(
                  image_pair_sha256="f" * 64,
                  front_perceptual_hash="0123456789abcdef",
                  back_perceptual_hash=None,
              ) is None
              assert store.find_trusted_image_match(
                  image_pair_sha256="f" * 64,
                  front_perceptual_hash="0123456789abcde0",
                  back_perceptual_hash="fedcba98765432ef",
              ) is None
          '''
          if 'test_near_visual_memory_requires_close_front_and_back' not in tests:
              test_path.write_text(tests + addition)

          contract_path = Path('scripts/check-instacomp-local-primary-contract.mjs')
          contract = contract_path.read_text()
          contract_anchor = '''requireText(
            storage,
            "trusted_visual_memory",
            "Trusted near-visual memory matching is required.",
          );
          '''
          contract_addition = '''requireText(
            storage,
            "if not back_perceptual_hash:",
            "Near-visual automation must require both sides.",
          );
          requireText(
            storage,
            "front_distance > 4",
            "Front visual-memory distance must stay strict.",
          );
          requireText(
            storage,
            "back_distance > 4",
            "Back visual-memory distance must stay strict.",
          );
          requireText(
            storage,
            "score < 0.9375",
            "Near-visual trusted-memory confidence must remain at least 93.75%.",
          );
          '''
          if 'Near-visual automation must require both sides.' not in contract:
              if contract_anchor not in contract:
                  raise SystemExit('contract visual-memory anchor missing')
              contract_path.write_text(
                  contract.replace(
                      contract_anchor,
                      contract_anchor + contract_addition,
                      1,
                  )
              )
          PY
          rm .github/workflows/patch-instacomp-strict-visual-memory.yml
      - name: Certify strict matcher
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://example.com
          INSTACOMP_SERVICE_TOKEN: placeholder-service-token
        run: |
          cd services/instacomp-ai
          python -m compileall app tests
          pytest -q
          cd ../..
          node scripts/check-instacomp-local-primary-contract.mjs
          npx eslint src/app/api/instacomp/scan/route.ts src/app/api/instacomp/internal-readiness/route.ts src/app/api/account/seller/inventory/instacomp-card-edit/route.ts src/lib/instacomp-ai-local.ts
          npx tsc --noEmit
          npm run build
      - name: Commit verified strict matcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[strict-visual-memory-patched] Require close front and back match"
          git push origin HEAD:fix/instacomp-local-engine-primary
