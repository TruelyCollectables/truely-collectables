name: Guarded SOLD Simulation Health Contract 20260730

on:
  pull_request:
    branches:
      - fix/launch2-sold-lifecycle-certify-20260730
    paths:
      - ".github/workflows/guarded-sold-sim-health-contract-20260730.yml"
      - "scripts/run-sold-lifecycle-simulations.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guarded-sold-sim-health-contract-20260730
  cancel-in-progress: false

env:
  EXPECTED_BASE_SHA: 51388f8c796dcbfe3b2fa1512371fe1eebd050c1
  EXPECTED_BRANCH: fix/sold-sim-permanent-health-contract-20260730
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  CRON_SECRET: build-validation-cron-secret-that-is-long-enough
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact child scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin fix/launch2-sold-lifecycle-certify-20260730
          test "$(git rev-parse origin/fix/launch2-sold-lifecycle-certify-20260730)" = "$EXPECTED_BASE_SHA"
          unexpected="$(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | grep -Ev '^(\.github/workflows/guarded-sold-sim-health-contract-20260730\.yml|scripts/run-sold-lifecycle-simulations\.mjs)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected child changes:\n%s\n' "$unexpected" >&2; exit 1; }
          git diff --check "$EXPECTED_BASE_SHA"...HEAD
          test ! -e src/app/api/fulfillment-health/route.ts
          if grep -Fq 'fulfillmentHealth' scripts/run-sold-lifecycle-simulations.mjs; then exit 1; fi
          grep -Fq 'const adminOrdersHealth' scripts/run-sold-lifecycle-simulations.mjs
          grep -Fq 'checks: 164' scripts/run-sold-lifecycle-simulations.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run issue 253 simulations
        run: |
          node scripts/run-sold-lifecycle-simulations.mjs
          node scripts/run-sold-trigger-order-simulation.mjs

      - name: Run privileged route gates
        run: |
          node scripts/run-privileged-api-route-audit.mjs
          npm run simulate:privileged-route-auth

      - name: Run repository lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run full Production build
        run: npm run build
