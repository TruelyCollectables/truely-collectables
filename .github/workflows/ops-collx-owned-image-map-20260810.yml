name: Ops CollX Owned Image Map 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-owned-image-map-20260810.yml"
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/collx-owned-map"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json; else npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null; fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-owned-map/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
      - name: Snapshot owned CollX image assignments
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import{setTimeout as sleep}from'node:timers/promises';
          const STORE='00000000-0000-4000-8000-000000000001';
          function envParse(t){const e={};for(const raw of t.split(/\r?\n/)){const l=raw.trim();if(!l||l.startsWith('#'))continue;const i=l.indexOf('=');if(i<1)continue;const k=l.slice(0,i).trim();let v=l.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}else if(v.startsWith("'")&&v.endsWith("'"))v=v.slice(1,-1);e[k]=v}return e}
          const root=path.join(process.env.RUNNER_TEMP,'collx-owned-map'),env=envParse(fs.readFileSync(path.join(root,'production.env'),'utf8')),base=env.NEXT_PUBLIC_SUPABASE_URL;if(!base)throw new Error('Supabase URL unavailable');
          const ref=new URL(base).hostname.split('.')[0],token=process.env.GH_SUPABASE_ACCESS_TOKEN,endpoint=`https://api.supabase.com/v1/projects/${ref}/database/query`;
          async function q(sql){let last='';for(let a=1;a<=10;a++){try{const r=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({query:sql,parameters:[],read_only:true}),signal:AbortSignal.timeout(30000)});const t=await r.text();if(r.ok)return t?JSON.parse(t):[];last=`${r.status} ${t.slice(0,500)}`}catch(e){last=String(e?.message||e)}if(a<10)await sleep(Math.min(8000,a*700))}throw new Error(last)}
          const rows=await q(`select z.image_url,z.alt_text,z.is_primary,z.sort_order,i.id inventory_item_id,i.legacy_product_id product_id,i.status,i.quantity inventory_quantity,p.title,p.price,p.quantity product_quantity,p.ebay_item_id from public.inventory_images z join public.inventory_items i on i.id=z.inventory_item_id join public.products p on p.id=i.legacy_product_id and p.store_id='${STORE}'::uuid where i.store_id='${STORE}'::uuid and z.image_url like '%/storage/v1/object/public/truely-product-images/collx-mirror/%' order by i.id,z.sort_order,z.id;`);
          const out={generated_at:new Date().toISOString(),count:rows.length,rows};fs.writeFileSync(path.join(root,'owned-image-map.json'),JSON.stringify(out,null,2));console.log(JSON.stringify({ownedImageRows:rows.length,inventoryItems:new Set(rows.map(r=>r.inventory_item_id)).size}));
          NODE
          rm -f "$RUNNER_TEMP/collx-owned-map/production.env"
      - name: Upload owned image map
        uses: actions/upload-artifact@v4
        with:
          name: collx-owned-image-map
          path: ${{ runner.temp }}/collx-owned-map/owned-image-map.json
          retention-days: 2
          if-no-files-found: error
