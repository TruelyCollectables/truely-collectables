name: Ops Gateway Teacher Repair Runner 20260810

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/instacomp-gateway-perplexity-teacher-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python scripts/ops/apply-instacomp-gateway-perplexity-teacher-repair.py

      - name: Run focused teacher regressions and TypeScript
        run: |
          set -euo pipefail
          npm ci --ignore-scripts >/dev/null
          node --import tsx scripts/run-instacomp-groq-runtime-status-simulations.ts
          node --import tsx scripts/run-instacomp-gateway-perplexity-teacher-simulations.ts
          node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts
          npx tsc --noEmit

      - name: Publish only permanent source and tests
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/instacomp-teacher-comp-mode.yml
          rm -f .github/workflows/repair-instacomp-gateway-perplexity-teacher-20260810.yml
          rm -f scripts/ops/apply-instacomp-gateway-perplexity-teacher-repair.py
          git config user.name 'Truely Collectables CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/instacomp-teacher-comp-mode.yml \
                  .github/workflows/repair-instacomp-gateway-perplexity-teacher-20260810.yml \
                  scripts/ops/apply-instacomp-gateway-perplexity-teacher-repair.py \
                  src/lib/instacomp-teacher-market-provider.ts \
                  src/lib/instacomp-teacher-runtime-status.ts \
                  scripts/run-instacomp-groq-runtime-status-simulations.ts \
                  scripts/run-instacomp-gateway-perplexity-teacher-simulations.ts
          git diff --cached --check
          git commit -m 'Add Vercel Gateway Perplexity comp teacher'
          git push origin "HEAD:$HEAD_BRANCH"
