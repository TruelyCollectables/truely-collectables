name: Card and Sale Identity Enrichment

on:
  push:
    branches: [main]
    paths:
      - "src/lib/card-identity.ts"
      - "src/lib/card-sale-identity-backfill.ts"
      - "src/app/api/internal/card-sale-identity-backfill/route.ts"
      - ".github/workflows/card-sale-identity-enrichment.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/lib/card-sale-identity-backfill.ts"
      - "src/app/api/internal/card-sale-identity-backfill/route.ts"
      - ".github/workflows/card-sale-identity-enrichment.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: card-sale-identity-enrichment-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate runtime endpoint files
        run: |
          test -f src/lib/card-sale-identity-backfill.ts
          test -f src/app/api/internal/card-sale-identity-backfill/route.ts

      - name: Link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Force fresh Production deployment
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(npx vercel@56.2.0 deploy --prod --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)
          test -n "$DEPLOYMENT_URL"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "Deployed $DEPLOYMENT_URL"

      - name: Invoke protected runtime backfill
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const site = process.env.DEPLOYMENT_URL;
          const token = process.env.VERCEL_TOKEN;
          if (!site || !token) throw new Error('Deployment URL and Vercel token are required');
          const endpoint = new URL('/api/internal/card-sale-identity-backfill', site).toString();
          let lastError = 'endpoint unavailable';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(endpoint, { method: 'POST', headers: { 'x-vercel-token': token } });
              const body = await response.text();
              const report = `Production backfill response\n\n- Deployment: ${site}\n- Attempt: ${attempt}\n- HTTP status: ${response.status}\n- Body: \`${body.slice(0, 4000).replaceAll('`', "'")}\``;
              if (process.env.GH_PR_NUMBER) {
                await fetch(`https://api.github.com/repos/${process.env.GH_REPOSITORY}/issues/${process.env.GH_PR_NUMBER}/comments`, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
                  body: JSON.stringify({ body: report }),
                });
              }
              if (response.ok) { console.log(body); process.exit(0); }
              lastError = `HTTP ${response.status}: ${body}`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          throw new Error(lastError);
          NODE

