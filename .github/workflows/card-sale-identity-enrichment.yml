name: Card and Sale Identity Enrichment

on:
  push:
    branches: [main]
    paths:
      - "src/lib/card-identity.ts"
      - "src/lib/card-sale-identity-backfill.ts"
      - "src/lib/server-inventory-engine.ts"
      - "src/app/api/internal/card-sale-identity-backfill/route.ts"
      - "scripts/run-card-identity-simulations.ts"
      - ".github/workflows/card-sale-identity-enrichment.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/lib/card-identity.ts"
      - "src/lib/card-sale-identity-backfill.ts"
      - "src/lib/server-inventory-engine.ts"
      - "src/app/api/internal/card-sale-identity-backfill/route.ts"
      - "scripts/run-card-identity-simulations.ts"
      - ".github/workflows/card-sale-identity-enrichment.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-sale-identity-enrichment-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run player identity simulations
        run: node --import tsx scripts/run-card-identity-simulations.ts

      - name: Validate runtime endpoint files
        run: |
          test -f src/lib/card-identity.ts
          test -f src/lib/card-sale-identity-backfill.ts
          test -f src/lib/server-inventory-engine.ts
          test -f src/app/api/internal/card-sale-identity-backfill/route.ts

      - name: Link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Pull Production environment securely
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env pull .env.production.local --yes \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
          chmod 600 .env.production.local

      - name: Deploy current main to Production
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Verify Production revision and full-catalog steady state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          process.loadEnvFile('.env.production.local');
          const site = process.env.NEXT_PUBLIC_SITE_URL || 'https://truelycollectables.com';
          const token = process.env.VERCEL_TOKEN;
          const expectedRevision = 'player-name-v7';
          if (!token) throw new Error('VERCEL_TOKEN is required');

          const endpoint = new URL('/api/internal/card-sale-identity-backfill', site);
          const revisionEndpoint = new URL(endpoint);
          revisionEndpoint.searchParams.set('revision', '1');
          let lastError = 'revision endpoint unavailable';

          for (let attempt = 1; attempt <= 40; attempt += 1) {
            try {
              revisionEndpoint.searchParams.set('nonce', `${Date.now()}-${attempt}`);
              const response = await fetch(revisionEndpoint, {
                method: 'GET',
                headers: { 'x-vercel-token': token },
                cache: 'no-store',
              });
              const body = await response.text();
              if (response.ok) {
                const result = JSON.parse(body);
                if (result?.revision === expectedRevision) {
                  lastError = '';
                  break;
                }
                lastError = `Production still has revision ${result?.revision || 'missing'}; expected ${expectedRevision}`;
              } else {
                lastError = `Revision check HTTP ${response.status}: ${body}`;
              }
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }

            console.log(`Attempt ${attempt} waiting for verified production revision: ${lastError}`);
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }

          if (lastError) throw new Error(lastError);

          async function runBackfill(label) {
            let attemptError = `${label} has not run yet`;
            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const guardedEndpoint = new URL(endpoint);
              guardedEndpoint.searchParams.set('expectedRevision', expectedRevision);
              guardedEndpoint.searchParams.set('nonce', `${Date.now()}-${attempt}`);

              try {
                const response = await fetch(guardedEndpoint, {
                  method: 'POST',
                  headers: { 'x-vercel-token': token },
                  cache: 'no-store',
                });
                const body = await response.text();
                const result = JSON.parse(body);

                if (response.ok && result?.revision === expectedRevision) {
                  console.log(`${label}: ${body}`);
                  return result;
                }

                attemptError = `${label} HTTP ${response.status}, revision ${result?.revision || 'missing'}: ${body}`;
              } catch (error) {
                attemptError = error instanceof Error ? error.message : String(error);
              }

              console.log(`Attempt ${attempt} retrying guarded ${label}: ${attemptError}`);
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }
            throw new Error(attemptError);
          }

          const firstPass = await runBackfill('First full-catalog pass');
          const secondPass = await runBackfill('Steady-state verification pass');

          const namedUnresolved = (secondPass.unresolvedSamples || []).filter(
            (sample) => String(sample?.title || '').trim().toLowerCase() !== 'untitled',
          );

          if (Number(secondPass.playersUpdated || 0) !== 0) {
            throw new Error(`Steady-state pass still updated ${secondPass.playersUpdated} player rows.`);
          }
          if (Number(secondPass.playersCleared || 0) !== 0) {
            throw new Error(`Steady-state pass still cleared ${secondPass.playersCleared} player rows.`);
          }
          if (Number(secondPass.invalidExistingPlayers || 0) !== 0) {
            throw new Error(`Steady-state pass still found ${secondPass.invalidExistingPlayers} invalid player values.`);
          }
          if (namedUnresolved.length > 0) {
            throw new Error(`Named products remain unresolved: ${JSON.stringify(namedUnresolved)}`);
          }
          if (Number(secondPass.productsScanned || 0) < 1) {
            throw new Error('Steady-state pass scanned no products.');
          }

          console.log(JSON.stringify({
            success: true,
            revision: expectedRevision,
            firstPass,
            steadyState: secondPass,
          }));
          NODE
