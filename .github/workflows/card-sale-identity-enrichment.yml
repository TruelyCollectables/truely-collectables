name: Card and Sale Identity Enrichment

on:
  push:
    branches: [main]
    paths:
      - "src/lib/card-identity.ts"
      - "src/lib/card-sale-identity-backfill.ts"
      - "src/app/api/internal/card-sale-identity-backfill/route.ts"
      - ".github/workflows/card-sale-identity-enrichment.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/lib/card-sale-identity-backfill.ts"
      - "src/app/api/internal/card-sale-identity-backfill/route.ts"
      - ".github/workflows/card-sale-identity-enrichment.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-sale-identity-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate runtime endpoint files
        run: |
          test -f src/lib/card-sale-identity-backfill.ts
          test -f src/app/api/internal/card-sale-identity-backfill/route.ts

      - name: Link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Pull Production environment securely
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env pull .env.production.local --yes \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
          chmod 600 .env.production.local

      - name: Invoke protected runtime backfill
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          process.loadEnvFile('.env.production.local');
          const secret = process.env.CRON_SECRET;
          const site = process.env.NEXT_PUBLIC_SITE_URL || 'https://truelycollectables.com';
          if (!secret) throw new Error('CRON_SECRET is required');
          const endpoint = new URL('/api/internal/card-sale-identity-backfill', site).toString();
          let lastError = 'endpoint unavailable';
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { Authorization: `Bearer ${secret}` },
              });
              const body = await response.text();
              if (response.ok) {
                console.log(body);
                process.exit(0);
              }
              lastError = `HTTP ${response.status}: ${body}`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            console.log(`Attempt ${attempt} waiting for deployed runtime endpoint: ${lastError}`);
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          throw new Error(lastError);
          NODE
