name: Launch 2 Email Lifecycle Fix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/order-notification-*.ts"
      - "src/lib/order-notifications.ts"
      - "src/lib/checkout-order-finalization.ts"
      - "src/app/api/admin/orders/mark-fulfilled/route.ts"
      - "src/app/api/orders/mark-shipped/route.ts"
      - "src/app/api/orders/update-tracking/route.ts"
      - "src/app/admin/orders/[id]/**"
      - "supabase/migrations/20260730070000_expand_order_notification_lifecycle.sql"
      - "scripts/run-order-lifecycle-email-simulations.ts"
      - "scripts/apply-launch2-email-lifecycle-patches.mjs"
      - "package.json"
      - ".github/workflows/launch2-email-lifecycle-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launch2-email-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic lifecycle patches
        run: node scripts/apply-launch2-email-lifecycle-patches.mjs

      - name: Run lifecycle and existing notification regressions
        run: |
          npm run simulate:order-lifecycle-emails
          node --import tsx scripts/run-order-notification-hardening-simulations.ts

      - name: Run shipping and privilege regressions
        run: |
          npm run verify:shipping
          npm run simulate:admin-shipping
          npm run simulate:privileged-route-auth

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          ADMIN_SESSION_SECRET: placeholder-admin-session-secret
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
        run: npm run build

      - name: Commit exact passing generated source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated source changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/order-notifications.ts src/lib/checkout-order-finalization.ts 'src/app/admin/orders/[id]/page.tsx' package.json
          git commit -m "Complete order email and fulfillment lifecycle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
