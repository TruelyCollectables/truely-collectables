name: CollX Park Unpriced Pending 20260812

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/collx-park-unpriced-pending-20260812.yml'

permissions:
  contents: read

concurrency:
  group: collx-park-unpriced-pending-20260812
  cancel-in-progress: false

jobs:
  park-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: 00000000-0000-4000-8000-000000000001
      SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
    steps:
      - name: Park unpriced non-eBay CollX cards as drafts and verify remaining live inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time

          API='https://api.supabase.com/v1'
          TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']
          STORE=os.environ['FLAGSHIP_STORE_ID']
          REF=os.environ['SUPABASE_PROJECT_REF']

          def req(method,path,body=None,timeout=90,retries=7):
              last=None
              for attempt in range(retries):
                  out=tempfile.NamedTemporaryFile(delete=False); out.close()
                  cmd=['curl','-sS','--max-time',str(timeout),'-X',method,
                       '-H',f'Authorization: Bearer {TOKEN}',
                       '-H','Accept: application/json',
                       '-H','Content-Type: application/json',
                       '-o',out.name,'-w','%{http_code}',API+path]
                  if body is not None:
                      cmd += ['--data-binary',json.dumps(body)]
                  p=subprocess.run(cmd,capture_output=True,text=True)
                  raw=open(out.name).read(); os.unlink(out.name)
                  try: payload=json.loads(raw) if raw else None
                  except Exception: payload=raw
                  try: status=int((p.stdout or '0').strip()[-3:])
                  except Exception: status=0
                  if status in (200,201): return payload
                  last=(status,payload)
                  if status in (0,429,500,502,503,504,522,524,544) and attempt+1 < retries:
                      time.sleep(2*(attempt+1)); continue
                  break
              raise RuntimeError(f'{method} {path} HTTP {last[0] if last else 0}: {str(last[1] if last else "")[:2000]}')

          target_where=f"""
            p.store_id='{STORE}'::uuid
            and p.sku>='COLLX-' and p.sku<'COLLY'
            and p.ebay_item_id is null
            and p.archived_at is null
            and p.quantity>0
            and p.price<=0
          """

          pre_q=f"""
          with target as (
            select p.id, p.sku, p.quantity
            from public.products p
            where {target_where}
          ), bridged as (
            select distinct t.id
            from target t
            where exists (
              select 1 from public.inventory_items ii
              where ii.store_id='{STORE}'::uuid
                and (ii.legacy_product_id=t.id or (ii.legacy_product_id is null and ii.sku=t.sku))
            )
          )
          select
            (select count(*) from target)::int as target_rows,
            (select coalesce(sum(quantity),0) from target)::int as target_units,
            (select count(*) from bridged)::int as bridged_target_rows;
          """
          pre=req('POST',f'/projects/{REF}/database/query',{'query':pre_q,'parameters':[],'read_only':True},90)
          print('COLLX_PENDING_PRE='+json.dumps(pre,sort_keys=True,default=str))
          row=(pre or [{}])[0]
          if int(row.get('target_rows') or 0) != 144:
              raise SystemExit(f"Safety stop: expected exactly 144 current unpriced CollX rows, found {row.get('target_rows')}")
          if int(row.get('target_units') or 0) != 144:
              raise SystemExit(f"Safety stop: expected exactly 144 current unpriced CollX units, found {row.get('target_units')}")
          if int(row.get('bridged_target_rows') or 0) != 144:
              raise SystemExit(f"Safety stop: expected all 144 targets to have inventory bridge rows, found {row.get('bridged_target_rows')}")

          mutate_q=f"""
          with target as (
            select p.id, p.sku
            from public.products p
            where {target_where}
          ), updated as (
            update public.inventory_items ii
               set status='draft', updated_at=now()
              from target t
             where ii.store_id='{STORE}'::uuid
               and (ii.legacy_product_id=t.id or (ii.legacy_product_id is null and ii.sku=t.sku))
            returning ii.id
          )
          select count(*)::int as inventory_rows_updated from updated;
          """
          changed=req('POST',f'/projects/{REF}/database/query',{'query':mutate_q,'parameters':[],'read_only':False},90)
          print('COLLX_PENDING_MUTATION='+json.dumps(changed,sort_keys=True,default=str))

          verify_q=f"""
          with collx as (
            select p.*
            from public.products p
            where p.store_id='{STORE}'::uuid
              and p.sku>='COLLX-' and p.sku<'COLLY'
              and p.ebay_item_id is null
          ), eligible as (
            select p.id, p.sku
            from collx p
            where p.archived_at is null
              and p.quantity>0
              and p.price>0
              and nullif(btrim(p.image_url),'') is not null
          ), pending as (
            select p.id, p.sku
            from collx p
            where p.archived_at is null and p.quantity>0 and p.price<=0
          )
          select
            (select count(*) from collx)::int as total_rows,
            (select coalesce(sum(greatest(quantity,0)),0) from collx)::int as total_units,
            (select count(*) from collx where archived_at is not null)::int as archived_rows,
            (select coalesce(sum(greatest(quantity,0)),0) from collx where archived_at is not null)::int as archived_units,
            (select count(*) from eligible)::int as eligible_rows,
            (select coalesce(sum(quantity),0) from collx where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is not null)::int as eligible_units,
            (select count(*) from pending)::int as pending_rows,
            (select coalesce(sum(quantity),0) from collx where archived_at is null and quantity>0 and price<=0)::int as pending_units,
            (select count(*) from pending p where exists (
              select 1 from public.inventory_items ii
              where ii.store_id='{STORE}'::uuid
                and (ii.legacy_product_id=p.id or (ii.legacy_product_id is null and ii.sku=p.sku))
                and ii.status='draft'
            ))::int as pending_draft_rows,
            (select count(*) from eligible e where exists (
              select 1 from public.inventory_items ii
              where ii.store_id='{STORE}'::uuid
                and (ii.legacy_product_id=e.id or (ii.legacy_product_id is null and ii.sku=e.sku))
                and ii.status='active'
            ))::int as eligible_active_rows,
            (select count(*) from eligible e where not exists (
              select 1 from public.inventory_items ii
              where ii.store_id='{STORE}'::uuid
                and (ii.legacy_product_id=e.id or (ii.legacy_product_id is null and ii.sku=e.sku))
            ))::int as eligible_missing_bridge_rows,
            (select count(*) from eligible e where exists (
              select 1 from public.inventory_items ii
              where ii.store_id='{STORE}'::uuid
                and (ii.legacy_product_id=e.id or (ii.legacy_product_id is null and ii.sku=e.sku))
            ) and not exists (
              select 1 from public.inventory_items ii
              where ii.store_id='{STORE}'::uuid
                and (ii.legacy_product_id=e.id or (ii.legacy_product_id is null and ii.sku=e.sku))
                and ii.status='active'
            ))::int as eligible_nonactive_rows,
            (select count(*) from collx where archived_at is null and quantity<=0)::int as active_zero_qty_rows,
            (select count(*) from collx where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is null)::int as missing_front_rows;
          """
          verify=req('POST',f'/projects/{REF}/database/query',{'query':verify_q,'parameters':[],'read_only':True},90)
          print('COLLX_PENDING_VERIFY='+json.dumps(verify,sort_keys=True,default=str))
          v=(verify or [{}])[0]
          expected={
              'total_rows':6155,
              'total_units':6315,
              'archived_rows':740,
              'archived_units':0,
              'eligible_rows':5271,
              'eligible_units':6171,
              'pending_rows':144,
              'pending_units':144,
              'pending_draft_rows':144,
              'eligible_active_rows':5271,
              'eligible_missing_bridge_rows':0,
              'eligible_nonactive_rows':0,
              'active_zero_qty_rows':0,
              'missing_front_rows':0,
          }
          failures=[]
          for k,want in expected.items():
              got=int(v.get(k) or 0)
              if got!=want:
                  failures.append(f'{k}={got} expected {want}')
          if failures:
              raise SystemExit('Verification failed: '+'; '.join(failures))
          print('COLLX_PENDING_PARK=SUCCESS')
          PY
