name: Dual Marketplace Audit

on:
  pull_request:
    paths:
      - "src/app/admin/products/new/**"
      - "src/app/api/admin/dual-marketplace-listings/**"
      - "src/lib/dual-marketplace-*.ts"
      - "src/lib/ebay-inventory-publisher*.ts"
      - "src/lib/ebay-listing-content.ts"
      - "scripts/run-dual-marketplace-*-simulations.ts"
      - "scripts/run-dual-marketplace-condition-boundary-audit.ts"
      - ".github/workflows/dual-marketplace-audit.yml"
  push:
    branches:
      - "agent/dual-marketplace-card-intake"
    paths:
      - "src/app/admin/products/new/**"
      - "src/app/api/admin/dual-marketplace-listings/**"
      - "src/lib/dual-marketplace-*.ts"
      - "src/lib/ebay-inventory-publisher*.ts"
      - "src/lib/ebay-listing-content.ts"
      - "scripts/run-dual-marketplace-*-simulations.ts"
      - "scripts/run-dual-marketplace-condition-boundary-audit.ts"
      - ".github/workflows/dual-marketplace-audit.yml"

permissions:
  contents: write

jobs:
  focused-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run adversarial listing simulations
        run: node --import tsx scripts/run-dual-marketplace-audit-simulations.ts
      - name: Run edge and reconciliation simulations
        run: node --import tsx scripts/run-dual-marketplace-edge-audit-simulations.ts
      - name: Run exact condition boundary audit
        run: node --import tsx scripts/run-dual-marketplace-condition-boundary-audit.ts
      - name: Lint audited listing files
        run: >-
          npx eslint
          src/app/admin/products/new/AuditedDualMarketplaceListingStudio.tsx
          src/app/admin/products/new/DualMarketplaceListingStudio.tsx
          src/app/api/admin/dual-marketplace-listings/route.ts
          src/lib/dual-marketplace-admin-route.ts
          src/lib/dual-marketplace-admin-route-guard.ts
          src/lib/dual-marketplace-listing.ts
          src/lib/dual-marketplace-pricing.ts
          src/lib/dual-marketplace-workflow.ts
          src/lib/ebay-inventory-publisher.ts
          src/lib/ebay-inventory-publisher-audited.ts
          src/lib/ebay-inventory-publisher-strict.ts
          src/lib/ebay-listing-content.ts
          scripts/run-dual-marketplace-audit-simulations.ts
          scripts/run-dual-marketplace-edge-audit-simulations.ts
          scripts/run-dual-marketplace-condition-boundary-audit.ts

  apply-simplified-admin-navigation:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/simplified-list-route'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplified-list-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact admin navigation and regression updates
        run: |
          python - <<'PY'
          from pathlib import Path

          admin = Path('src/app/admin/page.tsx')
          text = admin.read_text()
          old_card = '''    {
      href: "/admin/instacomp-direct",
      eyebrow: "Scan desk",
      title: "Fix scans before they become bad inventory",
      detail:
        "Remove bad scan rows, merge selected quantities, retry OCR, and turn clean InstaComp™ results into priced drafts from the focused Direct lane.",
      cta: "Open InstaComp™ Direct",
      tone: "border-blue-200 bg-blue-50 text-blue-950",
    },'''
          new_card = '''    {
      href: "/list",
      eyebrow: "Listing desk",
      title: "Upload, InstaComp™, edit, and list cards",
      detail:
        "Use the simplified photo-first workspace to scan selected cards, edit every field and quantity, then publish one, several, or all selected cards.",
      cta: "Open List Cards",
      tone: "border-blue-200 bg-blue-50 text-blue-950",
    },'''
          if text.count(old_card) != 1:
              raise SystemExit(f'Expected one primary scan action card, found {text.count(old_card)}')
          text = text.replace(old_card, new_card)
          old_links = '''        { href: "/admin/instacomp-direct", label: "Direct Scan Lab" },
        { href: "/admin/instacomp", label: "Scan Lab" },
        { href: "/admin/quick-list", label: "Quick List" },'''
          new_links = '''        { href: "/list", label: "List Cards" },
        { href: "/admin/instacomp/mobile", label: "InstaComp Mobile" },
        { href: "/admin/instacomp-direct", label: "Direct Scan Lab" },
        { href: "/admin/instacomp", label: "Scan Lab" },
        { href: "/admin/quick-list", label: "Quick List" },'''
          if text.count(old_links) != 1:
              raise SystemExit(f'Expected one inventory tool link block, found {text.count(old_links)}')
          text = text.replace(old_links, new_links)
          old_new_product = '{ href: "/admin/products/new", label: "New Product" },'
          if text.count(old_new_product) != 1:
              raise SystemExit(f'Expected one old new-product link, found {text.count(old_new_product)}')
          text = text.replace(old_new_product, '{ href: "/list", label: "List Cards" },')
          admin.write_text(text)

          smoke = Path('scripts/smoke-admin-runtime.mjs')
          text = smoke.read_text()
          old = '''  {
    path: "/admin/instacomp-direct",
    auth: true,
    expectedText: "InstaComp™ Direct Scan Lab",
  },'''
          new = '''  {
    path: "/admin/instacomp-direct",
    auth: true,
    expectedText: "InstaComp™ Direct Scan Lab",
  },
  {
    path: "/admin/instacomp/mobile",
    auth: true,
    expectedText: "InstaComp Mobile",
  },'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one InstaComp Direct smoke block, found {text.count(old)}')
          text = text.replace(old, new)
          old = '''  {
    path: "/admin/products/new",
    auth: true,
    expectedText: "Add products",
  },'''
          new = '''  {
    path: "/admin/products/new",
    auth: true,
    expectedText: "List Cards",
  },'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy product smoke block, found {text.count(old)}')
          smoke.write_text(text.replace(old, new))

          sim = Path('scripts/run-admin-dashboard-actions-simulations.mjs')
          text = sim.read_text()
          old = 'const adminNoDeadEndExemptions = new Set(["/admin", "/admin/login"]);'
          new = 'const adminNoDeadEndExemptions = new Set(["/admin", "/admin/login", "/admin/products/new"]);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one no-dead-end exemption set, found {text.count(old)}')
          text = text.replace(old, new)
          read_anchor = '''const adminNewProductPageSource = await readFile(
  new URL("../src/app/admin/products/new/page.tsx", import.meta.url),
  "utf8",
);
'''
          read_insert = read_anchor + '''const simplifiedListPageSource = await readFile(
  new URL("../src/app/list/page.tsx", import.meta.url),
  "utf8",
);
'''
          if text.count(read_anchor) != 1:
              raise SystemExit(f'Expected one legacy product source read, found {text.count(read_anchor)}')
          text = text.replace(read_anchor, read_insert)
          old_scenario = '''  for (const fragment of [
    "Add manual product",
    "Create one manual store product from the form fields without publishing it to eBay.",
    "Adds the product to TCOS inventory only; marketplace publishing remains a separate admin step.",
  ]) {
    assert(
      adminNewProductPageSource.includes(fragment),
      `Expected manual product action-scope fragment ${fragment}.`,
    );
  }'''
          new_scenario = '''  assert(
    adminNewProductPageSource.includes('redirect("/list")'),
    "Expected the legacy new-product route to redirect to /list.",
  );
  for (const fragment of [
    "List Cards",
    "Upload photos",
    "Run InstaComp™",
    "Review and list selected",
  ]) {
    assert(
      simplifiedListPageSource.includes(fragment),
      `Expected simplified list action-scope fragment ${fragment}.`,
    );
  }
  for (const fragment of [
    'href: "/list"',
    'cta: "Open List Cards"',
    '{ href: "/admin/instacomp/mobile", label: "InstaComp Mobile" }',
  ]) {
    assert(
      adminPageSource.includes(fragment),
      `Expected admin listing shortcut fragment ${fragment}.`,
    );
  }'''
          if text.count(old_scenario) != 1:
              raise SystemExit(f'Expected one old manual-product scenario block, found {text.count(old_scenario)}')
          sim.write_text(text.replace(old_scenario, new_scenario))
          PY
      - name: Validate admin dashboard and list audits
        run: |
          npm run verify:admin-dashboard
          node scripts/run-simplified-list-route-audit.mjs
          npx eslint src/app/admin/page.tsx scripts/smoke-admin-runtime.mjs scripts/run-admin-dashboard-actions-simulations.mjs
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx scripts/smoke-admin-runtime.mjs scripts/run-admin-dashboard-actions-simulations.mjs
          git commit -m "Link admin directly to simplified list workspace"
          git push origin HEAD:agent/simplified-list-route
