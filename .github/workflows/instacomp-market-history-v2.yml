name: InstaComp Exact Card Market History v2

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/instacomp-market-history.ts"
      - "src/app/api/instacomp/market-history/route.ts"
      - "scripts/run-instacomp-market-history-simulations.ts"
      - "supabase/migrations/20260807_instacomp_exact_card_market_history.sql"
      - "services/instacomp-ai/app/deal_hunter_learning.py"
      - "services/instacomp-ai/app/training_routes.py"
      - "services/instacomp-ai/tests/test_deal_hunter_decision_learning.py"
      - ".github/workflows/instacomp-market-history-v2.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: TypeScript compile
        run: npx tsc --noEmit --pretty false
      - name: Market history behavior simulation
        run: node --import tsx scripts/run-instacomp-market-history-simulations.ts
      - name: Deal Hunter decision-learning tests
        env:
          PYTHONPATH: services/instacomp-ai
        run: python -m unittest services/instacomp-ai/tests/test_deal_hunter_decision_learning.py
      - name: Append-only SQL contract
        run: |
          python - <<'PY'
          from pathlib import Path
          sql = Path('supabase/migrations/20260807_instacomp_exact_card_market_history.sql').read_text()
          required = [
            'tcos_card_market_identities', 'tcos_card_market_observations',
            "observation_kind in ('ASK', 'SOLD', 'PURCHASE', 'OWN_SALE')",
            'tcos_card_market_observations_no_update',
            'tcos_card_market_observations_no_delete', 'append-only'
          ]
          missing = [x for x in required if x not in sql]
          if missing:
            raise SystemExit(f'Missing SQL contracts: {missing}')
          print('Append-only SQL contract passed.')
          PY
