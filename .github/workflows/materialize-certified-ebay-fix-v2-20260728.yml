name: Materialize Certified eBay Fix V2 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-certified-ebay-fix-v2-20260728.yml"

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/diagnose-stable-ebay-differences-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnose-stable-ebay-differences-20260728
          fetch-depth: 1
      - name: Apply candidate repair
        run: python scripts/temporary_apply_stable_ebay_difference_repair.py
      - name: Install dependencies
        run: npm ci
      - name: Run validations with captured diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p certification-logs certified/src/lib certified/src/app/api/cron/ebay-store-fixed-price-sync
          status=0
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts > certification-logs/taxonomy.log 2>&1 || status=1
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts > certification-logs/ebay-images.log 2>&1 || status=1
          npx eslint src/lib/ebay-authoritative-store-sync.ts src/app/api/cron/ebay-store-fixed-price-sync/route.ts > certification-logs/eslint.log 2>&1 || status=1
          npm run build > certification-logs/build.log 2>&1 || status=1
          printf '%s\n' "$status" > certification-logs/status.txt
          cp src/lib/ebay-authoritative-store-sync.ts certified/src/lib/
          cp src/app/api/cron/ebay-store-fixed-price-sync/route.ts certified/src/app/api/cron/ebay-store-fixed-price-sync/
          git diff -- src/lib/ebay-authoritative-store-sync.ts src/app/api/cron/ebay-store-fixed-price-sync/route.ts > certified/certified.patch
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materialized-certified-ebay-fix-v2-${{ github.run_number }}
          path: |
            certification-logs
            certified
          if-no-files-found: error
          retention-days: 7
