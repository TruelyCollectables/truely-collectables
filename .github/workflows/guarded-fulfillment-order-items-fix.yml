name: Guarded fulfillment order-items repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: guarded-fulfillment-order-items-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/fulfillment-order-items-runtime-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out guarded branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact production source base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "ad5758557e14f10ae9294a4a8de4dd69d188b58d"

      - name: Apply explicit order-items loading
        run: node scripts/apply-fulfillment-order-items-runtime-fix.mjs

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R --line-number --fixed-string 'order_items (' \
            src/app/admin/orders/page.tsx \
            'src/app/admin/orders/[id]/page.tsx' \
            'src/app/admin/orders/[id]/packing-slip/page.tsx'
          grep -R --line-number --fixed-string '.from("order_items")' \
            src/app/admin/orders/page.tsx \
            'src/app/admin/orders/[id]/page.tsx' \
            'src/app/admin/orders/[id]/packing-slip/page.tsx'

      - name: Install dependencies
        run: npm ci

      - name: Run fulfillment regression
        run: npm run simulate:admin-shipping-actions

      - name: Run focused lint
        run: >-
          npx eslint
          src/app/admin/orders/page.tsx
          'src/app/admin/orders/[id]/page.tsx'
          'src/app/admin/orders/[id]/packing-slip/page.tsx'
          scripts/run-admin-shipping-actions-simulations.mjs

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Remove one-time repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-fulfillment-order-items-runtime-fix.mjs
          rm .github/workflows/guarded-fulfillment-order-items-fix.yml
          git diff --check

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/admin/orders/page.tsx \
            'src/app/admin/orders/[id]/page.tsx' \
            'src/app/admin/orders/[id]/packing-slip/page.tsx' \
            scripts/run-admin-shipping-actions-simulations.mjs \
            scripts/apply-fulfillment-order-items-runtime-fix.mjs \
            .github/workflows/guarded-fulfillment-order-items-fix.yml
          git commit -m "Fix fulfillment order item loading"
          git push origin "HEAD:${{ github.head_ref }}"
