name: KINGMAKER Phase 6 Scale Control

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-phase-6-*.ts"
      - "scripts/run-kingmaker-phase-6-*.ts"
      - "supabase/migrations/20260803140000_kingmaker_phase_6_scale_control.sql"
      - ".github/workflows/kingmaker-phase-6-scale-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingmaker-phase-6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-scale-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Phase 6 scale control regressions
        run: node --import tsx scripts/run-kingmaker-phase-6-scale-control-regressions.ts
      - name: Migration security contracts
        shell: bash
        run: |
          set -euo pipefail
          migration=supabase/migrations/20260803140000_kingmaker_phase_6_scale_control.sql
          for table in \
            tcos_kingmaker_tenant_policies \
            tcos_kingmaker_usage_windows \
            tcos_kingmaker_readiness_verdicts \
            tcos_kingmaker_alert_deliveries \
            tcos_kingmaker_audit_replays
          do
            grep -q "$table" "$migration"
          done
          test "$(grep -c 'enable row level security' "$migration")" -eq 5
          test "$(grep -c 'revoke all' "$migration")" -eq 5
          test "$(grep -c 'grant all' "$migration")" -eq 5
          ! grep -Eiq 'grant .* to (anon|authenticated)' "$migration"
      - name: Diff integrity
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Lint Phase 6
        run: npx eslint src/lib/kingmaker-phase-6-*.ts scripts/run-kingmaker-phase-6-*.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder-admin-session
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
