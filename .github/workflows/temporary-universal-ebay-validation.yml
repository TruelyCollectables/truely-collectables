name: Temporary Universal eBay Validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-repair-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out universal repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-universal-ebay-sold-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run regression, lint, and build
        id: validate
        continue-on-error: true
        run: |
          set +e
          LOG=/tmp/universal-ebay-validation.log
          : > "$LOG"

          npm ci >> "$LOG" 2>&1
          INSTALL=$?

          REGRESSION=99
          LINT=99
          BUILD=99
          if [ "$INSTALL" -eq 0 ]; then
            node --import tsx scripts/run-instacomp-universal-ebay-sold-regressions.ts >> "$LOG" 2>&1
            REGRESSION=$?
            npm run lint >> "$LOG" 2>&1
            LINT=$?
            npm run build >> "$LOG" 2>&1
            BUILD=$?
          fi

          mkdir -p docs
          {
            echo "install=$INSTALL"
            echo "regression=$REGRESSION"
            echo "lint=$LINT"
            echo "build=$BUILD"
            echo "validated_commit=$(git rev-parse HEAD)"
            echo "--- log tail ---"
            tail -n 160 "$LOG"
          } > docs/universal-ebay-validation-result.txt

          echo "install=$INSTALL" >> "$GITHUB_OUTPUT"
          echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
          echo "lint=$LINT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Commit validation evidence to repair branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/universal-ebay-validation-result.txt
          git commit -m "Record universal eBay validation result" || true
          git push origin HEAD:agent/instacomp-universal-ebay-sold-20260726

      - name: Enforce validation
        if: always()
        run: |
          test "${{ steps.validate.outputs.install }}" = "0"
          test "${{ steps.validate.outputs.regression }}" = "0"
          test "${{ steps.validate.outputs.lint }}" = "0"
          test "${{ steps.validate.outputs.build }}" = "0"
