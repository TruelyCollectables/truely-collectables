name: Probe TCDB Checklist DOM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tcdb-checklist-dom.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and inspect one known TCDB checklist
        shell: bash
        env:
          STATUS_BRANCH: ops/mainstream-checklist-status
          STATUS_PATH: docs/operations/tcdb-checklist-dom-probe.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tcdb-probe"
          node --input-type=module > "$RUNNER_TEMP/tcdb-probe/probe.json" <<'NODE'
          const url = 'https://www.tcdb.com/Checklist.cfm/sid/4466/2001-Fleer-Genuine';
          const response = await fetch(url, {
            headers: {
              'User-Agent': 'TCOS-TCDB-DOM-Probe/1.0',
              'Accept': 'text/html,application/xhtml+xml,*/*;q=0.1',
            },
            redirect: 'follow',
            signal: AbortSignal.timeout(90000),
          });
          const html = await response.text();
          const needle = 'Donovan McNabb';
          const at = html.indexOf(needle);
          const start = Math.max(0, at - 2200);
          const end = Math.min(html.length, at + 2200);
          const sanitize = (value) => value
            .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, '')
            .replace(/\s+/g, ' ')
            .slice(0, 5000);
          const hrefs = [...html.matchAll(/href=["']([^"']+)["']/gi)].map(m => m[1]);
          const sampleCardHrefs = hrefs.filter(h => /ViewCard\.cfm/i.test(h)).slice(0, 8);
          const result = {
            checkedAt: new Date().toISOString(),
            status: response.status,
            finalUrl: response.url,
            contentType: response.headers.get('content-type'),
            bytes: Buffer.byteLength(html),
            counts: {
              tr: (html.match(/<tr\b/gi) || []).length,
              td: (html.match(/<td\b/gi) || []).length,
              li: (html.match(/<li\b/gi) || []).length,
              viewCardHref: (html.match(/ViewCard\.cfm/gi) || []).length,
              totalCardsText: (html.match(/Total Cards/gi) || []).length,
              playerNeedle: at >= 0 ? 1 : 0,
            },
            sampleCardHrefs,
            aroundFirstPlayer: at >= 0 ? sanitize(html.slice(start, end)) : null,
          };
          console.log(JSON.stringify(result, null, 2));
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/tcdb-probe/probe.json" "$STATUS_PATH"
          git add "$STATUS_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Probe TCDB checklist DOM [skip ci]"
            git push origin "HEAD:$STATUS_BRANCH"
          fi
