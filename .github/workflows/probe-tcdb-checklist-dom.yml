name: Probe TCDB Checklist DOM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tcdb-checklist-dom.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and inspect one known TCDB checklist through direct and reader paths
        shell: bash
        env:
          STATUS_BRANCH: ops/mainstream-checklist-status
          STATUS_PATH: docs/operations/tcdb-checklist-dom-probe.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tcdb-probe"
          node --input-type=module > "$RUNNER_TEMP/tcdb-probe/probe.json" <<'NODE'
          const target = 'https://www.tcdb.com/Checklist.cfm/sid/4466/2001-Fleer-Genuine';
          const candidates = [
            { mode: 'direct', url: target },
            { mode: 'reader-https', url: `https://r.jina.ai/${target}` },
            { mode: 'reader-http', url: `https://r.jina.ai/http://www.tcdb.com/Checklist.cfm/sid/4466/2001-Fleer-Genuine` },
          ];
          const results = [];
          for (const candidate of candidates) {
            try {
              const response = await fetch(candidate.url, {
                headers: {
                  'User-Agent': 'TCOS-TCDB-DOM-Probe/1.2',
                  'Accept': candidate.mode === 'direct' ? 'text/html,application/xhtml+xml,*/*;q=0.1' : 'text/plain,text/markdown,*/*;q=0.1',
                },
                redirect: 'follow',
                signal: AbortSignal.timeout(90000),
              });
              const body = await response.text();
              const plain = body.replace(/\s+/g, ' ');
              const at = body.search(/Donovan McNabb/i);
              results.push({
                mode: candidate.mode,
                status: response.status,
                finalUrl: response.url,
                contentType: response.headers.get('content-type'),
                bytes: Buffer.byteLength(body),
                hasTotal155: /Total Cards:?\s*155/i.test(body),
                hasDonovanMcNabb: at >= 0,
                cardLineLikeCount: (body.match(/(?:^|\n)\s*(?:[-*+]\s+)?1(?:\s*\||\s+)Donovan McNabb/gi) || []).length,
                pipeRows: (body.match(/\|/g) || []).length,
                sample: plain.slice(0, 900),
                aroundPlayer: at >= 0 ? body.slice(Math.max(0, at - 900), Math.min(body.length, at + 1300)).replace(/\r/g, '') : null,
              });
            } catch (error) {
              results.push({ mode: candidate.mode, error: error instanceof Error ? error.message : String(error) });
            }
          }
          console.log(JSON.stringify({ checkedAt: new Date().toISOString(), target, results }, null, 2));
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/tcdb-probe/probe.json" "$STATUS_PATH"
          git add "$STATUS_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Probe TCDB reader card rows [skip ci]"
            git push origin "HEAD:$STATUS_BRANCH"
          fi
