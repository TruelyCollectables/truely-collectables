name: Probe TCDB Checklist DOM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tcdb-checklist-dom.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect TCDB reader checklist pagination and related-set counts
        shell: bash
        env:
          STATUS_BRANCH: ops/mainstream-checklist-status
          STATUS_PATH: docs/operations/tcdb-checklist-dom-probe.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tcdb-probe"
          node --input-type=module > "$RUNNER_TEMP/tcdb-probe/probe.json" <<'NODE'
          const targets = [
            {
              label: 'checklist',
              url: 'https://r.jina.ai/https://www.tcdb.com/Checklist.cfm/sid/4466/2001-Fleer-Genuine',
              needle: /Donovan McNabb/i,
            },
            {
              label: 'inserts',
              url: 'https://r.jina.ai/https://www.tcdb.com/Inserts.cfm/sid/59899/2011-Panini-Gridiron-Gear',
              needle: /Insert|Parallel/i,
            },
          ];
          const results = [];
          for (const target of targets) {
            try {
              const response = await fetch(target.url, {
                headers: {
                  'User-Agent': 'TCOS-TCDB-DOM-Probe/1.3',
                  'Accept': 'text/plain,text/markdown,*/*;q=0.1',
                },
                redirect: 'follow',
                signal: AbortSignal.timeout(90000),
              });
              const body = await response.text();
              const at = body.search(target.needle);
              const childSids = [...new Set(
                [...body.matchAll(/\((https?:\/\/(?:www\.)?tcdb\.com\/(?:ViewSet|ViewAllSet|Checklist)\.cfm\/sid\/(\d+)[^)]*)\)/gi)]
                  .map(match => match[2])
              )];
              const pageIndexes = [...new Set(
                [...body.matchAll(/[?&]PageIndex=(\d+)/gi)].map(match => Number(match[1]))
              )].sort((a,b) => a-b);
              const countMatches = [...body.matchAll(/(?:Total\s+Cards|Cards|Insert\s+Sets|Parallel\s+Sets)[^\n]{0,80}/gi)]
                .slice(0, 20)
                .map(match => match[0].replace(/\s+/g, ' '));
              results.push({
                label: target.label,
                status: response.status,
                bytes: Buffer.byteLength(body),
                pageIndexes,
                childSetCount: childSids.length,
                childSids: childSids.slice(0, 20),
                countMatches,
                aroundNeedle: at >= 0 ? body.slice(Math.max(0, at - 1200), Math.min(body.length, at + 2200)).replace(/\r/g, '') : null,
              });
            } catch (error) {
              results.push({ label: target.label, error: error instanceof Error ? error.message : String(error) });
            }
          }
          console.log(JSON.stringify({ checkedAt: new Date().toISOString(), results }, null, 2));
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp "$RUNNER_TEMP/tcdb-probe/probe.json" "$STATUS_PATH"
          git add "$STATUS_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Probe TCDB reader related-set counts [skip ci]"
            git push origin "HEAD:$STATUS_BRANCH"
          fi
