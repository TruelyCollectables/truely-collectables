name: Temporary InstaComp Exact Market Proof Main Trigger

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-exact-market-proof-pr
  cancel-in-progress: true

jobs:
  patch-test-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
      INSTACOMP_BYPASS_CACHE: "1"
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-proof-20260726
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply hardening and run three proof passes
        shell: bash
        run: |
          set +e
          mkdir -p docs .codex-run
          : > .codex-run/instacomp-exact-market-proof.log

          npm ci >> .codex-run/instacomp-exact-market-proof.log 2>&1
          INSTALL=$?

          if grep -q "serpapi_ebay_v6_" src/lib/instacomp-ebay-serp-provider.ts; then
            node scripts/repair-instacomp-exact-market-proof.mjs >> .codex-run/instacomp-exact-market-proof.log 2>&1
          else
            node scripts/apply-instacomp-exact-market-proof.mjs >> .codex-run/instacomp-exact-market-proof.log 2>&1
            node scripts/repair-instacomp-exact-market-proof.mjs >> .codex-run/instacomp-exact-market-proof.log 2>&1
          fi
          PATCH=$?

          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS1=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS2=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS3=$?

          LIVE_ENV_ARGS=()
          if [ -z "${SERPAPI_API_KEY:-}" ] && [ -n "${VERCEL_TOKEN:-}" ]; then
            mkdir -p .vercel
            if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
              printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
              VERCEL_LINK=0
            else
              npx vercel link --yes --project truely-collectables --scope truelycollectables-projects --token "$VERCEL_TOKEN" >> .codex-run/instacomp-exact-market-proof.log 2>&1
              VERCEL_LINK=$?
            fi
            if [ "$VERCEL_LINK" -eq 0 ]; then
              npx vercel env pull .env.production.local --yes --environment=production --token "$VERCEL_TOKEN" >> .codex-run/instacomp-exact-market-proof.log 2>&1
              VERCEL_PULL=$?
              if [ "$VERCEL_PULL" -eq 0 ] && [ -f .env.production.local ]; then
                LIVE_ENV_ARGS=(--env-file=.env.production.local)
              fi
            fi
          fi

          unset SERPAPI_API_KEY
          unset EBAY_CLIENT_ID EBAY_CLIENT_SECRET
          unset GOOGLE_CSE_API_KEY GOOGLE_CUSTOM_SEARCH_API_KEY GOOGLE_CSE_CX GOOGLE_CUSTOM_SEARCH_CX
          unset PRICECHARTING_API_TOKEN SPORTSCARDSPRO_API_TOKEN SPORTSCARDS_PRO_API_TOKEN

          node "${LIVE_ENV_ARGS[@]}" -e '
            const names = [
              "SERPAPI_API_KEY",
              "EBAY_CLIENT_ID",
              "EBAY_CLIENT_SECRET",
              "GOOGLE_CSE_API_KEY",
              "GOOGLE_CUSTOM_SEARCH_API_KEY",
              "GOOGLE_CSE_CX",
              "GOOGLE_CUSTOM_SEARCH_CX",
              "PRICECHARTING_API_TOKEN",
              "SPORTSCARDSPRO_API_TOKEN",
              "SPORTSCARDS_PRO_API_TOKEN"
            ];
            console.log("provider_env_presence=" + JSON.stringify(Object.fromEntries(names.map((name) => [name, Boolean(process.env[name])]))));
          ' >> .codex-run/instacomp-exact-market-proof.log 2>&1

          node "${LIVE_ENV_ARGS[@]}" --import tsx scripts/run-instacomp-batch-001-live-market-proof.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          LIVE=$?

          npm run lint >> .codex-run/instacomp-exact-market-proof.log 2>&1
          LINT=$?
          npm run build >> .codex-run/instacomp-exact-market-proof.log 2>&1
          BUILD=$?

          rm -rf .vercel .env.production.local .env.local

          {
            echo "install=$INSTALL"
            echo "patch=$PATCH"
            echo "regression_pass_1=$PASS1"
            echo "regression_pass_2=$PASS2"
            echo "regression_pass_3=$PASS3"
            echo "live_six_card_market_proof=$LIVE"
            echo "lint=$LINT"
            echo "build=$BUILD"
            echo "validated_source_commit=$(git rev-parse HEAD)"
            echo "--- provider configuration (presence only) ---"
            grep "provider_env_presence=" .codex-run/instacomp-exact-market-proof.log || true
            echo "--- assertions and errors with context ---"
            grep -nE -B 5 -A 16 "AssertionError|Error:|Transform failed|release remains blocked|Live exact-market proof is blocked|Failed to|error TS|✖|Vercel" .codex-run/instacomp-exact-market-proof.log | tail -n 360 || true
            echo "--- log head ---"
            head -n 180 .codex-run/instacomp-exact-market-proof.log
            echo "--- log tail ---"
            tail -n 280 .codex-run/instacomp-exact-market-proof.log
          } > docs/instacomp-exact-market-validation.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "Validate repaired InstaComp exact sold and active proof" || true
          git push origin HEAD:agent/instacomp-exact-market-proof-20260726
          PUSH=$?

          test "$INSTALL" -eq 0 && \
          test "$PATCH" -eq 0 && \
          test "$PASS1" -eq 0 && \
          test "$PASS2" -eq 0 && \
          test "$PASS3" -eq 0 && \
          test "$LIVE" -eq 0 && \
          test "$LINT" -eq 0 && \
          test "$BUILD" -eq 0 && \
          test "$PUSH" -eq 0