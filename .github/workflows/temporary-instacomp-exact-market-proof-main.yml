name: Temporary InstaComp Exact Market Proof Main Trigger

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-exact-market-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-prove-current-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
      INSTACOMP_BYPASS_CACHE: "1"
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out current event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate hardening sources without mutation
        id: source_integrity
        run: |
          python -m py_compile scripts/harden-instacomp-*.py scripts/run-instacomp-certification-safe.py scripts/run-instacomp-certification-round2-safe.py
          python - <<'PY'
          from pathlib import Path

          for path in (
              Path("src/lib/instacomp-curated-checklist.ts"),
              Path("src/app/api/instacomp/benchmark/ebay-25/route.ts"),
          ):
              if "\x08" in path.read_text():
                  raise SystemExit(f"InstaComp source contains a hidden backspace control character: {path}")
          PY
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code

      - name: Run three deterministic proof passes
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p docs .codex-run
          : > .codex-run/instacomp-exact-market-proof.log
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS1=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS2=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS3=$?
          echo "pass1=$PASS1" >> "$GITHUB_OUTPUT"
          echo "pass2=$PASS2" >> "$GITHUB_OUTPUT"
          echo "pass3=$PASS3" >> "$GITHUB_OUTPUT"
          test "$PASS1" -eq 0 && test "$PASS2" -eq 0 && test "$PASS3" -eq 0

      - name: Pull production provider configuration
        id: provider_env
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .codex-run .vercel
          : > .codex-run/instacomp-provider-env.log
          LIVE_ENV_FILE=""
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
              printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
              VERCEL_LINK=0
            else
              npx vercel link --yes --project truely-collectables --scope truelycollectables-projects --token "$VERCEL_TOKEN" >> .codex-run/instacomp-provider-env.log 2>&1
              VERCEL_LINK=$?
            fi
            if [ "$VERCEL_LINK" -eq 0 ]; then
              npx vercel env pull .env.production.local --yes --environment=production --token "$VERCEL_TOKEN" >> .codex-run/instacomp-provider-env.log 2>&1
              VERCEL_PULL=$?
              if [ "$VERCEL_PULL" -eq 0 ] && [ -f .env.production.local ]; then
                LIVE_ENV_FILE=".env.production.local"
              fi
            fi
          fi
          echo "env_file=$LIVE_ENV_FILE" >> "$GITHUB_OUTPUT"
          test -n "$LIVE_ENV_FILE"

      - name: Run live six-card exact-market proof
        id: live_proof
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LIVE_ENV_FILE="${{ steps.provider_env.outputs.env_file }}"
          LIVE_ENV_ARGS=()
          if [ -n "$LIVE_ENV_FILE" ] && [ -f "$LIVE_ENV_FILE" ]; then
            LIVE_ENV_ARGS=(--env-file="$LIVE_ENV_FILE")
          fi
          unset SERPAPI_API_KEY OPENAI_API_KEY
          unset EBAY_CLIENT_ID EBAY_CLIENT_SECRET
          unset GOOGLE_CSE_API_KEY GOOGLE_CUSTOM_SEARCH_API_KEY GOOGLE_CSE_CX GOOGLE_CUSTOM_SEARCH_CX
          unset PRICECHARTING_API_TOKEN SPORTSCARDSPRO_API_TOKEN SPORTSCARDS_PRO_API_TOKEN
          node "${LIVE_ENV_ARGS[@]}" -e '
            const names = ["SERPAPI_API_KEY", "OPENAI_API_KEY", "EBAY_CLIENT_ID", "EBAY_CLIENT_SECRET"];
            console.log("provider_env_presence=" + JSON.stringify(Object.fromEntries(names.map((name) => [name, Boolean(process.env[name])]))));
          ' >> .codex-run/instacomp-exact-market-proof.log 2>&1
          node "${LIVE_ENV_ARGS[@]}" --import tsx scripts/run-instacomp-batch-001-live-market-proof.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1

      - name: Lint repository
        id: lint
        continue-on-error: true
        run: npm run lint >> .codex-run/instacomp-exact-market-proof.log 2>&1

      - name: Build production application
        id: build
        continue-on-error: true
        run: npm run build >> .codex-run/instacomp-exact-market-proof.log 2>&1

      - name: Write validation report
        if: always()
        shell: bash
        run: |
          mkdir -p docs .codex-run
          {
            echo "validated_source_commit=$(git rev-parse HEAD)"
            echo "source_integrity=${{ steps.source_integrity.outcome }}"
            echo "regression_pass_1=${{ steps.regressions.outputs.pass1 }}"
            echo "regression_pass_2=${{ steps.regressions.outputs.pass2 }}"
            echo "regression_pass_3=${{ steps.regressions.outputs.pass3 }}"
            echo "provider_env=${{ steps.provider_env.outcome }}"
            echo "live_six_card_market_proof=${{ steps.live_proof.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "--- provider configuration (presence only) ---"
            grep "provider_env_presence=" .codex-run/instacomp-exact-market-proof.log || true
            echo "--- assertions and errors with context ---"
            grep -nE -B 5 -A 16 "AssertionError|Error:|Transform failed|Live exact-market proof is blocked|Failed to|error TS|✖|Vercel" .codex-run/instacomp-exact-market-proof.log | tail -n 360 || true
            echo "--- log head ---"
            head -n 180 .codex-run/instacomp-exact-market-proof.log || true
            echo "--- log tail ---"
            tail -n 280 .codex-run/instacomp-exact-market-proof.log || true
          } > docs/instacomp-exact-market-validation.txt
          rm -rf .vercel .env.production.local .env.local

      - name: Upload exact-market validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-exact-market-validation-${{ github.run_number }}
          path: |
            docs/instacomp-exact-market-validation.txt
            docs/instacomp-batch-001-live-market-proof.json
            .codex-run/instacomp-exact-market-proof.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce proof result
        if: always()
        run: |
          test "${{ steps.source_integrity.outcome }}" = "success"
          test "${{ steps.regressions.outcome }}" = "success"
          test "${{ steps.provider_env.outcome }}" = "success"
          test "${{ steps.live_proof.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
