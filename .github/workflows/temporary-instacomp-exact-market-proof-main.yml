name: Temporary InstaComp Exact Market Production Proof

# Credential verification rerun after Vercel and GitHub secrets were updated on 2026-07-27.
on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/temporary-instacomp-exact-market-proof-main.yml"
      - "scripts/run-instacomp-batch-001-live-market-proof.ts"
      - "scripts/run-instacomp-*-regressions.ts"
      - "src/lib/instacomp*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-exact-market-production-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-prove-current-head:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
      INSTACOMP_BYPASS_CACHE: "1"

    steps:
      - name: Check out current revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate committed source without mutation
        id: source_integrity
        run: |
          set -euo pipefail
          python -m py_compile scripts/harden-instacomp-*.py scripts/run-instacomp-certification-safe.py scripts/run-instacomp-certification-round2-safe.py
          python scripts/check-instacomp-control-characters.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code

      - name: Run deterministic proof passes
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p docs .codex-run
          : > .codex-run/instacomp-exact-market-proof.log
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS1=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS2=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          PASS3=$?
          node --import tsx scripts/run-instacomp-live-pipeline-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          LIVE_REGRESSIONS=$?
          node --import tsx scripts/run-instacomp-provider-safety-regressions.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1
          SAFETY_REGRESSIONS=$?
          echo "pass1=$PASS1" >> "$GITHUB_OUTPUT"
          echo "pass2=$PASS2" >> "$GITHUB_OUTPUT"
          echo "pass3=$PASS3" >> "$GITHUB_OUTPUT"
          echo "live_regressions=$LIVE_REGRESSIONS" >> "$GITHUB_OUTPUT"
          echo "safety_regressions=$SAFETY_REGRESSIONS" >> "$GITHUB_OUTPUT"
          test "$PASS1" -eq 0 && test "$PASS2" -eq 0 && test "$PASS3" -eq 0 && test "$LIVE_REGRESSIONS" -eq 0 && test "$SAFETY_REGRESSIONS" -eq 0

      - name: Resolve production provider credentials
        id: provider_env
        continue-on-error: true
        shell: bash
        env:
          GITHUB_SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GITHUB_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .codex-run .vercel
          : > .codex-run/instacomp-provider-env.log
          VERCEL_ENV_FILE=""

          if [ -n "${VERCEL_TOKEN:-}" ]; then
            if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
              printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
              VERCEL_LINK=0
            else
              npx vercel link --yes --project truely-collectables --scope truelycollectables-projects --token "$VERCEL_TOKEN" >> .codex-run/instacomp-provider-env.log 2>&1
              VERCEL_LINK=$?
            fi
            if [ "$VERCEL_LINK" -eq 0 ]; then
              npx vercel env pull .env.production.local --yes --environment=production --token "$VERCEL_TOKEN" >> .codex-run/instacomp-provider-env.log 2>&1 || true
              if [ -f .env.production.local ]; then
                VERCEL_ENV_FILE=".env.production.local"
              fi
            fi
          fi

          ENV_ARGS=()
          if [ -n "$VERCEL_ENV_FILE" ]; then
            ENV_ARGS=(--env-file="$VERCEL_ENV_FILE")
          fi

          node "${ENV_ARGS[@]}" <<'NODE'
          const fs = require("node:fs");
          const fromVercel = {
            SERPAPI_API_KEY: String(process.env.SERPAPI_API_KEY || "").trim(),
            OPENAI_API_KEY: String(process.env.OPENAI_API_KEY || "").trim(),
          };
          const resolved = {
            SERPAPI_API_KEY: fromVercel.SERPAPI_API_KEY || String(process.env.GITHUB_SERPAPI_API_KEY || "").trim(),
            OPENAI_API_KEY: fromVercel.OPENAI_API_KEY || String(process.env.GITHUB_OPENAI_API_KEY || "").trim(),
          };
          const source = {
            serpApi: fromVercel.SERPAPI_API_KEY ? "vercel_production" : resolved.SERPAPI_API_KEY ? "github_actions" : "absent",
            openAi: fromVercel.OPENAI_API_KEY ? "vercel_production" : resolved.OPENAI_API_KEY ? "github_actions" : "absent",
          };
          fs.writeFileSync(
            ".env.instacomp.resolved",
            Object.entries(resolved).map(([name, value]) => `${name}=${JSON.stringify(value)}`).join("\n") + "\n",
            { mode: 0o600 },
          );
          fs.appendFileSync(
            ".codex-run/instacomp-provider-env.log",
            `provider_env_presence=${JSON.stringify({ serpApi: Boolean(resolved.SERPAPI_API_KEY), openAi: Boolean(resolved.OPENAI_API_KEY) })}\n` +
              `provider_env_source=${JSON.stringify(source)}\n`,
          );
          if (!resolved.SERPAPI_API_KEY || !resolved.OPENAI_API_KEY) process.exit(1);
          NODE
          echo "env_file=.env.instacomp.resolved" >> "$GITHUB_OUTPUT"

      - name: Validate OpenAI production credential
        id: openai_auth
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --env-file="${{ steps.provider_env.outputs.env_file }}" <<'NODE' >> .codex-run/instacomp-exact-market-proof.log 2>&1
          const response = await fetch("https://api.openai.com/v1/models", {
            headers: { Authorization: `Bearer ${process.env.OPENAI_API_KEY}` },
            signal: AbortSignal.timeout(30000),
          });
          console.log(`openai_credential_status=${response.status}`);
          if (!response.ok) process.exit(1);
          NODE

      - name: Run live six-card exact-market provider proof
        id: live_proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --env-file="${{ steps.provider_env.outputs.env_file }}" --import tsx scripts/run-instacomp-batch-001-live-market-proof.ts >> .codex-run/instacomp-exact-market-proof.log 2>&1

      - name: Lint repository
        id: lint
        continue-on-error: true
        run: npm run lint >> .codex-run/instacomp-exact-market-proof.log 2>&1

      - name: Build production application
        id: build
        continue-on-error: true
        run: npm run build >> .codex-run/instacomp-exact-market-proof.log 2>&1

      - name: Write validation report
        if: always()
        shell: bash
        run: |
          mkdir -p docs .codex-run
          {
            echo "validated_source_commit=$(git rev-parse HEAD)"
            echo "source_integrity=${{ steps.source_integrity.outcome }}"
            echo "regression_pass_1=${{ steps.regressions.outputs.pass1 }}"
            echo "regression_pass_2=${{ steps.regressions.outputs.pass2 }}"
            echo "regression_pass_3=${{ steps.regressions.outputs.pass3 }}"
            echo "live_pipeline_regressions=${{ steps.regressions.outputs.live_regressions }}"
            echo "provider_safety_regressions=${{ steps.regressions.outputs.safety_regressions }}"
            echo "provider_env=${{ steps.provider_env.outcome }}"
            echo "openai_credential=${{ steps.openai_auth.outcome }}"
            echo "live_six_card_market_provider_proof=${{ steps.live_proof.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "--- provider configuration (presence and source only) ---"
            cat .codex-run/instacomp-provider-env.log || true
            echo "--- assertions and errors with context ---"
            grep -nE -B 5 -A 16 "AssertionError|Error:|Transform failed|provider proof is blocked|Failed to|error TS|✖|openai_credential_status" .codex-run/instacomp-exact-market-proof.log | tail -n 360 || true
            echo "--- log head ---"
            head -n 180 .codex-run/instacomp-exact-market-proof.log || true
            echo "--- log tail ---"
            tail -n 280 .codex-run/instacomp-exact-market-proof.log || true
          } > docs/instacomp-exact-market-validation.txt
          rm -rf .vercel .env.production.local .env.instacomp.resolved .env.local

      - name: Upload exact-market validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-exact-market-validation-${{ github.run_number }}
          path: |
            docs/instacomp-exact-market-validation.txt
            docs/instacomp-batch-001-live-market-proof.json
            .codex-run/instacomp-exact-market-proof.log
            .codex-run/instacomp-provider-env.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce proof result
        if: always()
        run: |
          test "${{ steps.source_integrity.outcome }}" = "success"
          test "${{ steps.regressions.outcome }}" = "success"
          test "${{ steps.provider_env.outcome }}" = "success"
          test "${{ steps.openai_auth.outcome }}" = "success"
          test "${{ steps.live_proof.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
