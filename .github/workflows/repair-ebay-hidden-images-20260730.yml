name: Repair eBay Hidden Images 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repair-ebay-hidden-images-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-ebay-hidden-images-20260730
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/diagnose-ebay-hidden-images-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ops/diagnose-ebay-hidden-images-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Vercel and create one-time repair token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          work="$RUNNER_TEMP/ebay-hidden-image-repair"
          mkdir -p "$work" .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" > "$work/token"
          echo "::add-mask::$token"
          printf '%s\n' "$token" | npx vercel@56.2.0 env add EBAY_HIDDEN_IMAGE_REPAIR_TOKEN production --force \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Add protected full-image repair route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/app/api/internal/ebay-hidden-image-repair
          cat > src/app/api/internal/ebay-hidden-image-repair/route.ts <<'ROUTE'
          import { timingSafeEqual } from "node:crypto";
          import { createSupabaseServerClient } from "../../../../../lib/supabase-server";
          import { getActiveStoreId } from "../../../../../lib/stores";

          export const dynamic = "force-dynamic";
          export const maxDuration = 300;

          const TARGET_IDS = [
            1682,1692,1709,1723,1779,1863,1976,1983,1988,1992,
            2003,2019,2036,2052,2094,2103,2117,2183,2210,2211,
            2213,2228,2240,2241,2260,2273,2286,2291,2313,2315,
            2336,2366,2373,2386,2391,2411,2413,2419,2448,10650,
            10658,10664,10665,10666,10684,10685,10688,10689,10692,10699,
          ];
          const MAX_IMAGES = 20;
          const CONCURRENCY = 5;

          type ProductRow = {
            id: number;
            title: string;
            ebay_item_id: string | null;
            sku: string | null;
            image_url: string | null;
          };
          type InventoryRow = {
            id: string;
            legacy_product_id: number;
            title: string;
            sku: string | null;
            metadata: Record<string, unknown> | null;
          };
          type ImageRow = {
            id: string;
            inventory_item_id: string;
            image_url: string;
            sort_order: number;
            is_primary: boolean;
          };

          function safeEqual(left: string, right: string) {
            const a = Buffer.from(left);
            const b = Buffer.from(right);
            return a.length === b.length && timingSafeEqual(a, b);
          }

          function decodeXml(value: string) {
            return value
              .trim()
              .replace(/^<!\[CDATA\[/, "")
              .replace(/\]\]>$/, "")
              .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(Number.parseInt(hex, 16)))
              .replace(/&#([0-9]+);/g, (_, decimal) => String.fromCodePoint(Number.parseInt(decimal, 10)))
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&amp;/g, "&");
          }

          function xmlBlock(xml: string, tag: string) {
            return new RegExp(`<${tag}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${tag}>`, "i").exec(xml)?.[1] || null;
          }
          function xmlBlocks(xml: string, tag: string) {
            return Array.from(xml.matchAll(new RegExp(`<${tag}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${tag}>`, "gi")), match => match[1]);
          }
          function xmlText(xml: string, tag: string) {
            const block = xmlBlock(xml, tag);
            return block === null ? null : decodeXml(block);
          }

          function highResolution(value: unknown) {
            const cleaned = String(value || "").trim();
            if (!cleaned) return "";
            return cleaned.replace(/\/s-l\d+\.(jpg|jpeg|png|webp)(\?.*)?$/i, "/s-l1600.$1$2");
          }

          function imageIdentity(value: unknown) {
            const normalized = highResolution(value);
            if (!normalized) return "";
            try {
              const url = new URL(normalized);
              if (url.hostname.toLowerCase() === "i.ebayimg.com") {
                const modern = /^\/images\/g\/([^/]+)\//i.exec(url.pathname)?.[1];
                const legacy = /\/z\/([^/]+)\/\$_\d+\.(?:jpe?g|png|webp)$/i.exec(url.pathname)?.[1];
                const key = modern || legacy;
                if (key) return `ebay:${key}`;
              }
              url.hash = "";
              return url.toString();
            } catch {
              return normalized;
            }
          }

          function normalize(values: unknown[]) {
            const result: string[] = [];
            const seen = new Set<string>();
            for (const value of values) {
              const url = highResolution(value);
              const identity = imageIdentity(url);
              if (!url || !identity || seen.has(identity)) continue;
              seen.add(identity);
              result.push(url);
              if (result.length >= MAX_IMAGES) break;
            }
            return result;
          }

          function trustedDescriptionImages(description: string) {
            const urls: string[] = [];
            for (const match of description.matchAll(/(?:src|data-src|href)\s*=\s*["']([^"']+)["']/gi)) {
              const raw = decodeXml(match[1]);
              try {
                const parsed = new URL(raw);
                const host = parsed.hostname.toLowerCase();
                const path = parsed.pathname.toLowerCase();
                const trustedHost = host === "i.ebayimg.com" || host === "storage.googleapis.com" || host.endsWith(".googleusercontent.com") || host.endsWith(".cloudfront.net");
                const imagePath = /\.(?:jpe?g|png|webp)$/i.test(path) || host === "i.ebayimg.com";
                if (trustedHost && imagePath) urls.push(raw);
              } catch {
                // Ignore non-absolute and non-image links.
              }
            }
            return normalize(urls);
          }

          async function verifyImage(url: string) {
            const request = async (method: "HEAD" | "GET") => fetch(url, {
              method,
              redirect: "follow",
              headers: method === "GET" ? { Range: "bytes=0-0" } : undefined,
              signal: AbortSignal.timeout(15000),
            });
            try {
              let response = await request("HEAD");
              if (response.status === 405 || response.status === 501) response = await request("GET");
              const type = response.headers.get("content-type") || "";
              return (response.status === 200 || response.status === 206) && type.toLowerCase().startsWith("image/");
            } catch {
              return false;
            }
          }

          async function runWorkers<T>(items: T[], worker: (item: T) => Promise<void>) {
            let cursor = 0;
            async function run() {
              while (cursor < items.length) {
                const item = items[cursor++];
                await worker(item);
              }
            }
            await Promise.all(Array.from({ length: Math.min(CONCURRENCY, Math.max(items.length, 1)) }, () => run()));
          }

          async function refreshAccessToken(supabase: ReturnType<typeof createSupabaseServerClient>, storeId: string) {
            const clientId = process.env.EBAY_CLIENT_ID;
            const clientSecret = process.env.EBAY_CLIENT_SECRET;
            if (!clientId || !clientSecret) throw new Error("Missing eBay client credentials.");
            const { data, error } = await supabase
              .from("ebay_tokens")
              .select("refresh_token")
              .eq("store_id", storeId)
              .order("created_at", { ascending: false })
              .limit(1)
              .maybeSingle();
            if (error) throw error;
            if (!data?.refresh_token) throw new Error("No eBay refresh token is available.");
            const response = await fetch("https://api.ebay.com/identity/v1/oauth2/token", {
              method: "POST",
              headers: {
                Authorization: `Basic ${Buffer.from(`${clientId}:${clientSecret}`).toString("base64")}`,
                "Content-Type": "application/x-www-form-urlencoded",
              },
              body: new URLSearchParams({
                grant_type: "refresh_token",
                refresh_token: String(data.refresh_token),
                scope: [
                  "https://api.ebay.com/oauth/api_scope",
                  "https://api.ebay.com/oauth/api_scope/sell.inventory",
                ].join(" "),
              }),
              signal: AbortSignal.timeout(20000),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.access_token) throw new Error(payload.error_description || payload.error || "eBay token refresh failed.");
            return String(payload.access_token);
          }

          async function getItemSources(accessToken: string, itemId: string) {
            const response = await fetch("https://api.ebay.com/ws/api.dll", {
              method: "POST",
              headers: {
                "Content-Type": "text/xml",
                "X-EBAY-API-CALL-NAME": "GetItem",
                "X-EBAY-API-COMPATIBILITY-LEVEL": "1409",
                "X-EBAY-API-SITEID": "0",
                "X-EBAY-API-IAF-TOKEN": accessToken,
              },
              body: `<?xml version="1.0" encoding="utf-8"?>
              <GetItemRequest xmlns="urn:ebay:apis:eBLBaseComponents">
                <DetailLevel>ReturnAll</DetailLevel>
                <IncludeItemSpecifics>true</IncludeItemSpecifics>
                <ItemID>${itemId}</ItemID>
              </GetItemRequest>`,
              signal: AbortSignal.timeout(30000),
            });
            const xml = await response.text();
            const ack = xmlText(xml, "Ack") || "Failure";
            if (!response.ok || !["Success", "Warning"].includes(ack)) {
              throw new Error(xmlText(xmlBlock(xml, "Errors") || xml, "LongMessage") || `GetItem failed with ${response.status}.`);
            }
            const item = xmlBlock(xml, "Item") || "";
            const pictureDetails = xmlBlock(item, "PictureDetails") || "";
            const pictureUrls = normalize([
              ...xmlBlocks(pictureDetails, "PictureURL").map(decodeXml),
              xmlText(pictureDetails, "GalleryURL"),
            ]);
            const description = xmlText(item, "Description") || "";
            return {
              pictureUrls,
              descriptionImages: trustedDescriptionImages(description),
              descriptionLength: description.length,
            };
          }

          async function getInventoryImages(accessToken: string, skus: string[]) {
            const found: string[] = [];
            const attempts: Array<{ sku: string; status: number }> = [];
            for (const sku of Array.from(new Set(skus.filter(Boolean)))) {
              const response = await fetch(`https://api.ebay.com/sell/inventory/v1/inventory_item/${encodeURIComponent(sku)}`, {
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  "Content-Language": "en-US",
                },
                signal: AbortSignal.timeout(20000),
              });
              attempts.push({ sku, status: response.status });
              if (!response.ok) continue;
              const payload = await response.json().catch(() => ({}));
              const imageUrls = Array.isArray(payload?.product?.imageUrls) ? payload.product.imageUrls : [];
              found.push(...imageUrls);
            }
            return { images: normalize(found), attempts };
          }

          function metadataSku(metadata: Record<string, unknown> | null) {
            if (!metadata) return [];
            return [metadata.ebay_sku, metadata.sku, metadata.inventory_sku]
              .map(value => String(value || "").trim())
              .filter(Boolean);
          }

          async function reconcileInventoryImages(
            supabase: ReturnType<typeof createSupabaseServerClient>,
            inventory: InventoryRow,
            existing: ImageRow[],
            remoteImages: string[],
          ) {
            const finalImages = normalize([
              ...remoteImages,
              ...existing.slice().sort((a, b) => a.sort_order - b.sort_order).map(row => row.image_url),
            ]);
            if (!finalImages.length) return { finalImages, changed: false };
            const current = normalize(existing.slice().sort((a, b) => a.sort_order - b.sort_order).map(row => row.image_url));
            const changed = current.length !== finalImages.length || current.some((url, index) => imageIdentity(url) !== imageIdentity(finalImages[index]));
            if (!changed) return { finalImages, changed: false };
            const { error: deleteError } = await supabase.from("inventory_images").delete().eq("inventory_item_id", inventory.id);
            if (deleteError) throw deleteError;
            const { error: insertError } = await supabase.from("inventory_images").insert(
              finalImages.map((imageUrl, index) => ({
                inventory_item_id: inventory.id,
                image_url: imageUrl,
                alt_text: `${inventory.title} ${index === 0 ? "front" : index === 1 ? "back" : `detail ${index + 1}`}`,
                sort_order: index,
                is_primary: index === 0,
              })),
            );
            if (insertError) throw insertError;
            return { finalImages, changed: true };
          }

          export async function POST(request: Request) {
            const expected = process.env.EBAY_HIDDEN_IMAGE_REPAIR_TOKEN || "";
            const supplied = request.headers.get("x-tcos-repair-token") || "";
            if (!expected || !safeEqual(expected, supplied)) return Response.json({ error: "Unauthorized" }, { status: 401 });

            const startedAt = new Date().toISOString();
            const supabase = createSupabaseServerClient({ admin: true });
            const storeId = getActiveStoreId();
            const accessToken = await refreshAccessToken(supabase, storeId);

            const { data: productData, error: productError } = await supabase
              .from("products")
              .select("id,title,ebay_item_id,sku,image_url")
              .eq("store_id", storeId)
              .in("id", TARGET_IDS)
              .order("id", { ascending: true });
            if (productError) throw productError;
            const products = (productData || []) as ProductRow[];

            const { data: inventoryData, error: inventoryError } = await supabase
              .from("inventory_items")
              .select("id,legacy_product_id,title,sku,metadata")
              .eq("store_id", storeId)
              .in("legacy_product_id", TARGET_IDS)
              .order("legacy_product_id", { ascending: true });
            if (inventoryError) throw inventoryError;
            const inventories = (inventoryData || []) as InventoryRow[];
            const inventoryIds = inventories.map(row => row.id);
            const imageRows: ImageRow[] = [];
            for (let index = 0; index < inventoryIds.length; index += 20) {
              const chunk = inventoryIds.slice(index, index + 20);
              const { data, error } = await supabase
                .from("inventory_images")
                .select("id,inventory_item_id,image_url,sort_order,is_primary")
                .in("inventory_item_id", chunk)
                .order("inventory_item_id", { ascending: true })
                .order("sort_order", { ascending: true });
              if (error) throw error;
              imageRows.push(...((data || []) as ImageRow[]));
            }

            const inventoriesByProduct = new Map<number, InventoryRow[]>();
            for (const row of inventories) {
              const list = inventoriesByProduct.get(Number(row.legacy_product_id)) || [];
              list.push(row);
              inventoriesByProduct.set(Number(row.legacy_product_id), list);
            }
            const imagesByInventory = new Map<string, ImageRow[]>();
            for (const row of imageRows) {
              const list = imagesByInventory.get(row.inventory_item_id) || [];
              list.push(row);
              imagesByInventory.set(row.inventory_item_id, list);
            }

            const results: Array<Record<string, unknown>> = [];
            await runWorkers(products, async product => {
              const linked = inventoriesByProduct.get(Number(product.id)) || [];
              const skuCandidates = [
                product.sku,
                ...linked.map(row => row.sku),
                ...linked.flatMap(row => metadataSku(row.metadata)),
              ].map(value => String(value || "").trim()).filter(Boolean);
              try {
                const trading = product.ebay_item_id ? await getItemSources(accessToken, String(product.ebay_item_id)) : { pictureUrls: [], descriptionImages: [], descriptionLength: 0 };
                const inventoryApi = await getInventoryImages(accessToken, skuCandidates);
                const trustedRemote = normalize([
                  ...inventoryApi.images,
                  ...trading.pictureUrls,
                  ...trading.descriptionImages,
                ]);
                const verifiedRemote: string[] = [];
                for (const url of trustedRemote) {
                  if (await verifyImage(url)) verifiedRemote.push(url);
                }
                const finalSets: string[][] = [];
                let changedRows = 0;
                for (const inventory of linked) {
                  const reconciled = await reconcileInventoryImages(
                    supabase,
                    inventory,
                    imagesByInventory.get(inventory.id) || [],
                    verifiedRemote,
                  );
                  finalSets.push(reconciled.finalImages);
                  if (reconciled.changed) changedRows += 1;
                }
                const combined = normalize([...verifiedRemote, ...finalSets.flat()]);
                if (combined[0]) {
                  const { error } = await supabase.from("products").update({ image_url: combined[0] }).eq("store_id", storeId).eq("id", product.id);
                  if (error) throw error;
                }
                results.push({
                  productId: product.id,
                  title: product.title,
                  ebayItemId: product.ebay_item_id,
                  linkedInventoryRows: linked.length,
                  skuCandidates,
                  inventoryApiAttempts: inventoryApi.attempts,
                  inventoryApiImages: inventoryApi.images,
                  tradingPictureUrls: trading.pictureUrls,
                  descriptionImages: trading.descriptionImages,
                  descriptionLength: trading.descriptionLength,
                  verifiedRemoteImages: verifiedRemote,
                  finalImages: combined,
                  finalImageCount: combined.length,
                  changedInventoryRows: changedRows,
                  hasBack: combined.length >= 2,
                });
              } catch (error) {
                results.push({
                  productId: product.id,
                  title: product.title,
                  error: error instanceof Error ? error.message.slice(0, 500) : String(error),
                  hasBack: false,
                });
              }
            });

            results.sort((a, b) => Number(a.productId) - Number(b.productId));
            const repaired = results.filter(row => row.hasBack === true).length;
            const stillMissing = results.filter(row => row.hasBack !== true).map(row => ({ productId: row.productId, title: row.title, error: row.error || null }));
            return Response.json({
              success: true,
              event: "ebay_hidden_image_repair_completed",
              startedAt,
              completedAt: new Date().toISOString(),
              storeId,
              requestedProducts: TARGET_IDS.length,
              foundProducts: products.length,
              productsWithFrontBack: repaired,
              stillMissingCount: stillMissing.length,
              stillMissing,
              results,
            }, { headers: { "Cache-Control": "no-store" } });
          }
          ROUTE
          git diff --check

      - name: Deploy protected repair runtime
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ebay-hidden-image-repair"
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee "$work/deploy.log"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$work/deploy.log" | tail -1)"
          test -n "$deployment_url"
          printf '%s' "$deployment_url" > "$work/deployment-url"

      - name: Pull every trusted picture source and repair all 50 products
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ebay-hidden-image-repair"
          token="$(cat "$work/token")"
          deployment_url="$(cat "$work/deployment-url")"
          response="$work/response.json"
          echo "::add-mask::$token"
          status="$(curl -sS --max-time 330 \
            -H "x-tcos-repair-token: $token" \
            -X POST -o "$response" -w '%{http_code}' \
            "$deployment_url/api/internal/ebay-hidden-image-repair?run=${GITHUB_RUN_ID}" || true)"
          echo "repair_status=$status"
          cat "$response" || true
          echo
          test "$status" = "200"
          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!receipt.success) throw new Error('Repair receipt was not successful.');
          console.log(JSON.stringify({
            requestedProducts: receipt.requestedProducts,
            foundProducts: receipt.foundProducts,
            productsWithFrontBack: receipt.productsWithFrontBack,
            stillMissingCount: receipt.stillMissingCount,
            stillMissing: receipt.stillMissing,
            sourceSummary: receipt.results.map((row) => ({
              productId: row.productId,
              inventoryApiCount: row.inventoryApiImages?.length || 0,
              tradingCount: row.tradingPictureUrls?.length || 0,
              descriptionCount: row.descriptionImages?.length || 0,
              finalImageCount: row.finalImageCount || 0,
              hasBack: row.hasBack,
            })),
          }, null, 2));
          NODE

      - name: Remove temporary route and deploy clean latest main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env rm EBAY_HIDDEN_IMAGE_REPAIR_TOKEN production --yes \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/ebay-hidden-image-repair"
