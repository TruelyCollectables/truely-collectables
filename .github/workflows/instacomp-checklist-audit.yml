name: InstaComp Checklist Audit

on:
  push:
    branches:
      - fix/instacomp-checklist-audit
  pull_request:
    paths:
      - ".github/workflows/instacomp-checklist-audit.yml"
      - "scripts/patch-instacomp-checklist-audit.py"
      - "scripts/check-instacomp-checklist-audit.mjs"
      - "services/instacomp-ai/**"
      - "src/lib/instacomp-ai-local.ts"
      - "src/app/api/instacomp/**"
      - "src/app/api/account/seller/inventory/instacomp-front-back/route.ts"
      - "src/app/api/account/seller/inventory/instacomp-job-status/route.ts"
      - "src/app/kingmaker/pending/page.tsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-checklist-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply checklist audit runtime patch
        run: python scripts/patch-instacomp-checklist-audit.py

      - name: Install Mac service dependencies
        run: python -m pip install -r services/instacomp-ai/requirements.txt

      - name: Compile Mac service
        run: python -m compileall -q services/instacomp-ai/app services/instacomp-ai/tests

      - name: Run checklist audit regressions
        working-directory: services/instacomp-ai
        run: python -m pytest -q tests/test_checklist_audit.py tests/test_storage_migration.py tests/test_prizm_surface_parallel.py

      - name: Run audit architecture gate
        run: node scripts/check-instacomp-checklist-audit.mjs

      - name: Install website dependencies
        run: npm ci

      - name: Lint changed application files
        run: >-
          npx eslint
          src/lib/instacomp-ai-local.ts
          src/app/api/instacomp/checklist-coverage/route.ts
          src/app/api/instacomp/internal-readiness/route.ts
          src/app/api/account/seller/inventory/instacomp-front-back/route.ts
          src/app/api/account/seller/inventory/instacomp-job-status/route.ts
          src/app/kingmaker/pending/page.tsx

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit certified runtime files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/instacomp-ai/app/models.py \
            services/instacomp-ai/app/printed_evidence.py \
            services/instacomp-ai/app/checklist.py \
            services/instacomp-ai/app/main.py \
            services/instacomp-ai/tests/test_checklist_audit.py \
            src/lib/instacomp-ai-local.ts \
            src/app/api/instacomp/checklist-coverage/route.ts \
            src/app/api/instacomp/internal-readiness/route.ts \
            src/app/api/account/seller/inventory/instacomp-front-back/route.ts \
            src/app/api/account/seller/inventory/instacomp-job-status/route.ts \
            src/app/kingmaker/pending/page.tsx
          if git diff --cached --quiet; then
            echo "Certified runtime files are already committed."
            exit 0
          fi
          git commit -m "Expose end-to-end InstaComp checklist audit receipts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
