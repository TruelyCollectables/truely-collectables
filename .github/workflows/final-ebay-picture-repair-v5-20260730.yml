name: Final eBay Picture Repair V5 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-ebay-picture-repair-v5-20260730.yml"
      - "scripts/generate-ebay-picture-repair-route.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-ebay-picture-repair-v5-20260730
  cancel-in-progress: false

jobs:
  repair-verify-clean:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/final-ebay-picture-repair-v5-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects

    steps:
      - name: Check out isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: ops/final-ebay-picture-repair-v5-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Production and generate repair route
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          work="$RUNNER_TEMP/final-ebay-picture-repair-v5"
          mkdir -p "$work" .vercel src/app/api/internal/ebay-hidden-image-repair

          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 pull --yes --environment production \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

          token="$(openssl rand -hex 32)"
          printf '%s' "$token" > "$work/token"
          echo "::add-mask::$token"

          git fetch origin ops/diagnose-ebay-hidden-images-20260730
          git show origin/ops/diagnose-ebay-hidden-images-20260730:.github/workflows/repair-ebay-hidden-images-20260730.yml > "$work/source.yml"

          node --check scripts/generate-ebay-picture-repair-route.mjs
          node scripts/generate-ebay-picture-repair-route.mjs \
            "$work/source.yml" \
            src/app/api/internal/ebay-hidden-image-repair/route.ts \
            "$token"

          grep -Fq 'trading.error' src/app/api/internal/ebay-hidden-image-repair/route.ts
          grep -Fq 'getPublicListingImages' src/app/api/internal/ebay-hidden-image-repair/route.ts
          grep -Fq 'publicListingImages' src/app/api/internal/ebay-hidden-image-repair/route.ts
          grep -Fq 'inventoryApi.error' src/app/api/internal/ebay-hidden-image-repair/route.ts
          grep -Fq 'const CONCURRENCY = 2;' src/app/api/internal/ebay-hidden-image-repair/route.ts
          ! grep -Fq 'getActiveStoreId' src/app/api/internal/ebay-hidden-image-repair/route.ts
          git diff --check

      - name: Validate generated route before deployment
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
          ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
          ADMIN_PASSWORD: build-validation-admin-password
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_validation
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
          STRIPE_WEBHOOK_SECRET: whsec_build_validation
          EBAY_CLIENT_ID: build-validation-client-id
          EBAY_CLIENT_SECRET: build-validation-client-secret
          EBAY_ENVIRONMENT: production
          CRON_SECRET: build-validation-cron-secret-that-is-long-enough
          RESEND_API_KEY: re_build_validation
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: |
          set -euo pipefail
          rm -f .env.local
          npx tsc --noEmit --pretty false
          npm run build
          git diff --check

      - name: Deploy protected repair runtime
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/final-ebay-picture-repair-v5"
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee "$work/deploy.log"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$work/deploy.log" | tail -1)"
          test -n "$deployment_url"
          printf '%s' "$deployment_url" > "$work/deployment-url"

      - name: Recover every picture despite Trading quota exhaustion
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/final-ebay-picture-repair-v5"
          token="$(cat "$work/token")"
          deployment_url="$(cat "$work/deployment-url")"
          response="$work/response.json"
          echo "::add-mask::$token"
          status="$(curl -sS --max-time 330 \
            -H "x-tcos-repair-token: $token" \
            -X POST -o "$response" -w '%{http_code}' \
            "$deployment_url/api/internal/ebay-hidden-image-repair?run=${GITHUB_RUN_ID}" || true)"
          echo "repair_status=$status"
          cat "$response" || true
          echo
          test "$status" = "200"

          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const summary = {
            requestedProducts: receipt.requestedProducts,
            foundProducts: receipt.foundProducts,
            productsWithFrontBack: receipt.productsWithFrontBack,
            stillMissingCount: receipt.stillMissingCount,
            stillMissing: receipt.stillMissing,
            products: (receipt.results || []).map(row => ({
              productId: row.productId,
              title: row.title,
              inventoryApiCount: row.inventoryApiImages?.length || 0,
              inventoryStatuses: row.inventoryApiAttempts || [],
              inventoryError: row.inventoryApiError || null,
              tradingCount: row.tradingPictureUrls?.length || 0,
              tradingError: row.tradingError || null,
              descriptionCount: row.descriptionImages?.length || 0,
              publicPageCount: row.publicListingImages?.length || 0,
              publicPageStatus: row.publicListingStatus || 0,
              publicPageError: row.publicListingError || null,
              finalImageCount: row.finalImageCount || 0,
              changedInventoryRows: row.changedInventoryRows || 0,
              hasBack: row.hasBack === true,
              error: row.error || null,
            })),
          };
          console.log('BUILD_GATED_EBAY_PICTURE_REPAIR=' + JSON.stringify(summary));
          console.log(JSON.stringify(summary, null, 2));
          if (!receipt.success) throw new Error('Repair receipt failed.');
          if (summary.requestedProducts !== 50 || summary.foundProducts !== 50) throw new Error('The full 50-product set was not loaded.');
          if (summary.stillMissingCount !== 0) throw new Error(`${summary.stillMissingCount} products still lack a second verified image.`);
          NODE

      - name: Remove temporary route and redeploy clean latest main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify live product image APIs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for id in 1682 1692 10684; do
            response="$RUNNER_TEMP/product-images-${id}.json"
            status="$(curl -sS -L --max-time 60 -o "$response" -w '%{http_code}' \
              "https://truelycollectables.com/api/storefront/product-images/${id}?final_picture_repair_v5=${GITHUB_RUN_ID}")"
            echo "product=${id} status=${status}"
            cat "$response"
            echo
            test "$status" = "200"
            node - "$response" <<'NODE'
            const fs = require('node:fs');
            const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            if (!body.hasFront || !body.hasBack || !Array.isArray(body.images) || body.images.length < 2) {
              throw new Error(`Live product ${body.productId} does not expose at least two images.`);
            }
            NODE
          done

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/final-ebay-picture-repair-v5"
