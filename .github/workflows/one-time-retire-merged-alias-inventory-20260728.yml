name: One-Time Retire Merged Alias Inventory 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-retire-merged-alias-inventory-20260728.yml"

permissions:
  contents: write

concurrency:
  group: one-time-retire-merged-alias-inventory-20260728
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/retire-merged-alias-inventory-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retire-merged-alias-inventory-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Retire merged alias inventory rows
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          public_path = Path('src/lib/server-inventory-engine.ts')
          replace_once(
              public_path,
              '''import { isLaunchCollectible } from "./sports-card-launch-scope";
          import type { StorefrontSort } from "./storefront-taxonomy";''',
              '''import { isLaunchCollectible } from "./sports-card-launch-scope";
          import { isMergedEbayAliasItemId } from "./ebay-merged-listing-groups";
          import type { StorefrontSort } from "./storefront-taxonomy";''',
              'public alias import',
          )
          replace_once(
              public_path,
              '''class PublicStorefrontInventoryEngine extends InventoryEngine {
            async listAvailable(''',
              '''function isPublicStorefrontItem(item: {
            ebayItemId: string | null;
          }) {
            return (
              isLaunchCollectible(item as never) &&
              !isMergedEbayAliasItemId(item.ebayItemId)
            );
          }

          class PublicStorefrontInventoryEngine extends InventoryEngine {
            async listAvailable(''',
              'public item helper',
          )
          replace_once(
              public_path,
              '''    const items = await super.listAvailable(params);
              return items.filter(isLaunchCollectible);''',
              '''    const items = await super.listAvailable(params);
              return items.filter(isPublicStorefrontItem);''',
              'public list alias exclusion',
          )
          replace_once(
              public_path,
              '''    return item && isLaunchCollectible(item) ? item : null;''',
              '''    return item && isPublicStorefrontItem(item) ? item : null;''',
              'public detail alias exclusion',
          )
          replace_once(
              public_path,
              '''    return items.filter(isLaunchCollectible);''',
              '''    return items.filter(isPublicStorefrontItem);''',
              'public bulk alias exclusion',
          )

          sync_path = Path('src/lib/ebay-authoritative-store-sync.ts')
          replace_once(
              sync_path,
              '''import { EBAY_MERGED_LISTING_GROUPS } from "./ebay-merged-listing-groups";''',
              '''import {
            EBAY_MERGED_LISTING_GROUPS,
            isMergedEbayAliasItemId,
          } from "./ebay-merged-listing-groups";''',
              'authoritative alias import',
          )
          replace_once(
              sync_path,
              '''    inserted = 0;
              updated = 0;
              unchanged = 0;
              deactivated = 0;
              const changedListings = effectiveRemoteListings.filter((listing) => {''',
              '''    inserted = 0;
              updated = 0;
              unchanged = 0;
              deactivated = 0;

              const mergedAliasLocals = locals.filter((local) =>
                isMergedEbayAliasItemId(local.ebay_item_id),
              );
              await runWorkers(mergedAliasLocals, async (local) => {
                try {
                  const changed = await deactivateLocalProduct({ ...params, local });
                  if (changed) deactivated += 1;
                } catch (error) {
                  errors.push({
                    itemId: String(local.ebay_item_id || ""),
                    title: local.title,
                    error: syncErrorMessage(
                      error,
                      "Could not retire merged alias inventory.",
                    ),
                  });
                }
              });

              const changedListings = effectiveRemoteListings.filter((listing) => {''',
              'retire alias inventory rows',
          )

          taxonomy_path = Path('scripts/run-storefront-taxonomy-regressions.ts')
          taxonomy = taxonomy_path.read_text()
          marker = '''assert.match(
            fixedPriceBackfillSource,
            /isMergedEbayListingMember\\(listing\\)/,
            "Quantity reconciliation must leave merged listing groups to the authoritative aggregate sync.",
          );'''
          addition = marker + '''
          assert.match(
            authoritativeSyncSource,
            /const mergedAliasLocals = locals\\.filter[\\s\\S]*isMergedEbayAliasItemId[\\s\\S]*deactivateLocalProduct/,
            "Authoritative sync must retire local rows for active merged aliases.",
          );'''
          if taxonomy.count(marker) != 1:
              raise SystemExit('taxonomy alias retirement marker was not unique')
          taxonomy_path.write_text(taxonomy.replace(marker, addition, 1))

          simulation_path = Path('scripts/run-ebay-import-admin-client-simulations.ts')
          simulation = simulation_path.read_text()
          marker = '''assert.match(
            publicInventoryEngine,
            /items\\.filter\\(isLaunchCollectible\\)/,
            "Every public inventory feed must enforce the approved catalog exclusions.",
          );'''
          replacement = '''assert.match(
            publicInventoryEngine,
            /isPublicStorefrontItem[\\s\\S]*isLaunchCollectible[\\s\\S]*isMergedEbayAliasItemId/,
            "Every public inventory feed must enforce catalog exclusions and hide merged aliases.",
          );'''
          if simulation.count(marker) != 1:
              raise SystemExit('public inventory regression marker was not unique')
          simulation_path.write_text(simulation.replace(marker, replacement, 1))

          Path('.github/workflows/one-time-retire-merged-alias-inventory-20260728.yml').unlink()
          PY

      - name: Validate final alias retirement
        run: |
          set -euo pipefail
          npm ci
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
          npx eslint src/lib/server-inventory-engine.ts src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts scripts/run-ebay-import-admin-client-simulations.ts
          npm run build

      - name: Commit validated alias retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Retire merged alias inventory rows"
          git push origin HEAD:agent/retire-merged-alias-inventory-20260728
