name: CollX Full Row Post-Rebuild Audit 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-full-row-postrebuild-audit-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"
  EXPECTED: "6155"
  LIVE: "6011"
  DRAFT: "144"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Audit every current CollX row against preserved pre-rebuild source metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess
          API='https://api.supabase.com/v1'; TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']; STORE=os.environ['FLAGSHIP_STORE_ID']
          EXPECTED=int(os.environ['EXPECTED']); LIVE=int(os.environ['LIVE']); DRAFT=int(os.environ['DRAFT'])
          def req(method,path,body=None,timeout=120):
              cmd=['curl','-sS','--max-time',str(timeout),'-X',method,'-H',f'Authorization: Bearer {TOKEN}','-H','Accept: application/json','-H','Content-Type: application/json','-o','/tmp/sb.json','-w','%{http_code}',API+path]
              if body is not None: cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True); raw=open('/tmp/sb.json').read() if os.path.exists('/tmp/sb.json') else ''
              try: payload=json.loads(raw) if raw else None
              except Exception: payload=raw
              try: status=int((p.stdout or '0').strip()[-3:])
              except Exception: status=0
              return status,payload
          s,projects=req('GET','/projects',timeout=30)
          cand=[p for p in projects] if s==200 and isinstance(projects,list) else []
          cand=[p for p in cand if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(cand)!=1: raise SystemExit(2)
          ref=str(cand[0].get('id') or cand[0].get('ref') or ''); BASE=f'https://{ref}.supabase.co/storage/v1/object/public/truely-product-images/collx-full/20260811'
          def sql(q):
              st,b=req('POST',f'/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':True},120)
              if st not in (200,201): print('SQL_FAILURE',st,json.dumps(b,default=str)); raise SystemExit(3)
              return b
          result=sql(f"""
          with curp as (
            select * from public.products where store_id='{STORE}'::uuid and sku>='COLLX-' and sku<'COLLY'
          ), curi as (
            select * from public.inventory_items where store_id='{STORE}'::uuid and sku>='COLLX-' and sku<'COLLY'
          ), bp as (
            select * from public.ops_collx_rebuild_v2_backup_products_20260811
          ), bi as (
            select * from public.ops_collx_rebuild_v2_backup_items_20260811
          ), paired as (
            select p.*,i.id iid,i.title ititle,i.description idescription,i.category icategory,i.condition icondition,i.price iprice,i.currency icurrency,i.quantity iquantity,i.status istatus,
                   bp.title bptitle,bp.description bpdescription,bp.player bpplayer,bp.sport bpsport,
                   bi.title bititle,bi.description bidescription,bi.category bicategory,bi.condition bicondition,bi.price biprice,bi.currency bicurrency,
                   bi.metadata bimetadata
            from curp p join curi i on i.legacy_product_id=p.id and i.sku=p.sku
            join bp on bp.id=p.id and bp.sku=p.sku
            join bi on bi.id=i.id and bi.legacy_product_id=p.id and bi.sku=p.sku
          )
          select
            (select count(*)::int from curp) current_products,
            (select count(*)::int from curi) current_items,
            (select count(*)::int from paired) exact_four_way_pairs,
            (select count(*)::int from paired where substring(sku from 7)<>coalesce(bimetadata->>'collx_id','')) collx_id_mismatches,
            (select count(*)::int from paired where coalesce((bimetadata->>'original_quantity')::int,-1)<>quantity or coalesce((bimetadata->>'original_quantity')::int,-1)<>iquantity) source_quantity_mismatches,
            (select count(*)::int from paired where title is distinct from bptitle or player is distinct from bpplayer or sport is distinct from bpsport) product_identity_mismatches,
            (select count(*)::int from paired where ititle is distinct from bititle or idescription is distinct from bidescription or icategory is distinct from bicategory or icondition is distinct from bicondition or iprice is distinct from biprice or icurrency is distinct from bicurrency) inventory_source_field_mismatches,
            (select count(*)::int from paired where quantity<=0 or iquantity<=0) nonpositive_source_quantities,
            (select count(*)::int from paired where istatus='active' and (price<=0 or iprice<=0)) active_price_mismatches,
            (select count(*)::int from paired where istatus='active' and price is distinct from iprice) active_product_item_price_mismatches,
            (select count(*)::int from paired where istatus='draft' and price<>0) draft_product_price_mismatches,
            (select count(*)::int from paired where istatus='active') active_items,
            (select count(*)::int from paired where istatus='draft') draft_items,
            (select count(*)::int from paired where image_url is not null and image_url<>'{BASE}/'||substring(sku from 7)||'/front.jpg') wrong_product_front_identity,
            (select count(*)::int from public.inventory_images x join curi i on i.id=x.inventory_item_id where x.image_url not in ('{BASE}/'||substring(i.sku from 7)||'/front.jpg','{BASE}/'||substring(i.sku from 7)||'/back.jpg')) wrong_inventory_image_identity,
            (select count(*)::int from paired where exists(select 1 from storage.objects o where o.bucket_id='truely-product-images' and o.name='collx-full/20260811/'||substring(sku from 7)||'/front.jpg') and image_url is distinct from '{BASE}/'||substring(sku from 7)||'/front.jpg') missing_or_wrong_product_front,
            (select count(*)::int from paired where exists(select 1 from storage.objects o where o.bucket_id='truely-product-images' and o.name='collx-full/20260811/'||substring(sku from 7)||'/front.jpg') and not exists(select 1 from public.inventory_images x where x.inventory_item_id=iid and x.image_url='{BASE}/'||substring(sku from 7)||'/front.jpg' and x.sort_order=0 and x.is_primary=true)) missing_inventory_front,
            (select count(*)::int from paired where exists(select 1 from storage.objects o where o.bucket_id='truely-product-images' and o.name='collx-full/20260811/'||substring(sku from 7)||'/back.jpg') and not exists(select 1 from public.inventory_images x where x.inventory_item_id=iid and x.image_url='{BASE}/'||substring(sku from 7)||'/back.jpg' and x.sort_order=1 and x.is_primary=false)) missing_inventory_back,
            (select count(distinct image_url)::int from curp where image_url is not null) distinct_product_fronts,
            (select count(*)::int from curp where image_url is not null) products_with_front,
            (select coalesce(sum(quantity),0)::int from curp) total_units,
            (select count(*)::int from paired where coalesce((bimetadata->>'original_quantity')::int,1)<>1) non_one_source_quantity_rows;
          """)
          print('FULL_ROW_AUDIT='+json.dumps(result,default=str)); r=result[0]
          if int(r['current_products'])!=EXPECTED or int(r['current_items'])!=EXPECTED or int(r['exact_four_way_pairs'])!=EXPECTED: raise SystemExit(10)
          for k in ('collx_id_mismatches','source_quantity_mismatches','product_identity_mismatches','inventory_source_field_mismatches','nonpositive_source_quantities','active_price_mismatches','active_product_item_price_mismatches','draft_product_price_mismatches','wrong_product_front_identity','wrong_inventory_image_identity','missing_or_wrong_product_front','missing_inventory_front','missing_inventory_back'):
              if int(r[k] or 0)!=0: print('MISMATCH',k,r[k]); raise SystemExit(11)
          if int(r['active_items'])!=LIVE or int(r['draft_items'])!=DRAFT: raise SystemExit(12)
          if int(r['distinct_product_fronts'])!=int(r['products_with_front']): raise SystemExit(13)
          if int(r['total_units'])!=6316: raise SystemExit(14)
          if int(r['non_one_source_quantity_rows'])!=7: raise SystemExit(15)
          print('COLLX_ALL_6155_ROWS_AUDITED=SUCCESS')
          PY
