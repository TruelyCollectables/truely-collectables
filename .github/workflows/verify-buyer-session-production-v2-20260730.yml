name: Verify Buyer Session Production V2 20260730

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/app/api/release/buyer-session-live-test/route.ts"
      - ".github/workflows/verify-buyer-session-production-v2-20260730.yml"

permissions:
  contents: read

concurrency:
  group: verify-buyer-session-production-20260730
  cancel-in-progress: false

jobs:
  deploy-test-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/verify-buyer-session-production-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      SOURCE_SHA: 15898bfeeadd484b998e327182849a646f2c39f9
      NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
      ADMIN_SESSION_SECRET: build-validation-admin-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-validation-admin-password
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_validation
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
      STRIPE_WEBHOOK_SECRET: whsec_build_validation
      EBAY_CLIENT_ID: build-validation-client-id
      EBAY_CLIENT_SECRET: build-validation-client-secret
      EBAY_ENVIRONMENT: production
      CRON_SECRET: build-validation-cron-secret-that-is-long-enough
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out isolated verifier branch
        uses: actions/checkout@v4
        with:
          ref: ops/verify-buyer-session-production-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove exact permanent source plus temporary verifier files
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          git diff --name-only "$SOURCE_SHA" HEAD | sort > /tmp/actual-files.txt
          printf '%s\n' \
            '.github/workflows/verify-buyer-session-production-v2-20260730.yml' \
            'src/app/api/release/buyer-session-live-test/route.ts' \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Link exact Vercel project first
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .buyer-session-evidence
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi
          test -s .vercel/project.json
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN"

      - name: Validate temporary verifier build
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit --pretty false
          npm run build

      - name: Deploy protected temporary verifier runtime
        id: temporary_deploy
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee .buyer-session-evidence/temporary-deploy.log
          TEMPORARY_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' .buyer-session-evidence/temporary-deploy.log | tail -n 1)"
          test -n "$TEMPORARY_URL"
          echo "temporary_url=$TEMPORARY_URL" >> "$GITHUB_OUTPUT"
          echo "TEMPORARY_URL=$TEMPORARY_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$TEMPORARY_URL" > .buyer-session-evidence/temporary-deployment-url.txt

      - name: Prove temporary account route is private
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
            --output .buyer-session-evidence/unauthorized-route.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"create"}' \
            "$TEMPORARY_URL/api/release/buyer-session-live-test" || true)"
          test "$code" = "401"

      - name: Create disposable confirmed buyer
        run: |
          set -euo pipefail
          TEST_EMAIL="tcos-buyer-session-${GITHUB_RUN_ID}@example.com"
          TEST_PASSWORD="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_EMAIL=$TEST_EMAIL" >> "$GITHUB_ENV"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          payload="$(jq -n --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{action:"create",email:$email,password:$password}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .buyer-session-evidence/create-user.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$TEMPORARY_URL/api/release/buyer-session-live-test" || true)"
          test "$code" = "200"
          USER_ID="$(jq -r '.userId // empty' .buyer-session-evidence/create-user.json)"
          test -n "$USER_ID"
          echo "USER_ID=$USER_ID" >> "$GITHUB_ENV"

      - name: Obtain refresh token through the real buyer login route
        run: |
          set -euo pipefail
          payload="$(jq -n --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output /tmp/buyer-login.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$TEMPORARY_URL/api/account/login" || true)"
          test "$code" = "200"
          ACCESS_TOKEN="$(jq -r '.session.access_token // empty' /tmp/buyer-login.json)"
          REFRESH_TOKEN="$(jq -r '.session.refresh_token // empty' /tmp/buyer-login.json)"
          test -n "$ACCESS_TOKEN"
          test -n "$REFRESH_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"

      - name: Install headless Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove stale-token recovery and mobile navigation in a real browser
        env:
          DEPLOYMENT_URL: ${{ steps.temporary_deploy.outputs.temporary_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          (async () => {
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const login = JSON.parse(fs.readFileSync('/tmp/buyer-login.json', 'utf8'));
            const staleSession = {
              access_token: 'expired.tcos.live.test.token',
              refresh_token: login.session.refresh_token,
              expires_at: 1,
              user: { id: login.userId, email: login.email },
            };

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              userAgent: 'TCOS-Buyer-Session-Production-Verifier/20260730',
            });
            const page = await context.newPage();
            const orderStatuses = [];
            const pageErrors = [];

            page.on('response', (response) => {
              try {
                const url = new URL(response.url());
                if (url.pathname === '/api/account/orders') orderStatuses.push(response.status());
              } catch {}
            });
            page.on('pageerror', (error) => pageErrors.push(String(error.message || error)));

            await page.addInitScript((session) => {
              window.localStorage.setItem('tcos_account_session', JSON.stringify(session));
            }, staleSession);

            await page.goto(`${deploymentUrl}/account/orders`, {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            });
            await page.waitForFunction(() => {
              const text = document.body.innerText;
              return text.includes('No linked orders yet') || text.includes('Order #');
            }, null, { timeout: 60_000 });
            await page.waitForTimeout(750);

            const bodyText = await page.locator('body').innerText();
            if (bodyText.includes('Unauthorized')) throw new Error('Orders still displayed Unauthorized.');
            if (bodyText.includes('Orders could not be loaded')) throw new Error('Orders displayed the failure panel.');
            if (!orderStatuses.includes(200)) throw new Error(`No successful orders response: ${JSON.stringify(orderStatuses)}`);
            if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);

            const storedSession = await page.evaluate(() => {
              const raw = window.localStorage.getItem('tcos_account_session');
              return raw ? JSON.parse(raw) : null;
            });
            if (!storedSession?.access_token) throw new Error('Session disappeared instead of refreshing.');
            if (storedSession.access_token === staleSession.access_token) throw new Error('Stale token remained stored.');

            const mobileNav = page.locator('[aria-label="Mobile store navigation"]');
            await mobileNav.waitFor({ state: 'visible', timeout: 30_000 });
            const firstLabel = (await mobileNav.getByRole('link').first().innerText()).trim();
            if (firstLabel !== 'Shop') throw new Error(`Expected first link Shop, received ${firstLabel}.`);

            await mobileNav.evaluate((element) => { element.scrollLeft = element.scrollWidth; });
            await mobileNav.getByRole('link', { name: 'Account', exact: true }).click();
            await page.waitForURL((url) => url.pathname === '/account', { timeout: 60_000 });
            const accountNav = page.locator('[aria-label="Mobile store navigation"]');
            await accountNav.waitFor({ state: 'visible', timeout: 30_000 });
            await page.waitForTimeout(500);
            const scrollLeft = await accountNav.evaluate((element) => element.scrollLeft);
            if (Math.abs(scrollLeft) > 1) throw new Error(`Mobile navigation stayed shifted: ${scrollLeft}.`);
            const firstBox = await accountNav.getByRole('link').first().boundingBox();
            if (!firstBox || firstBox.x < -1) throw new Error(`First mobile link is clipped: ${JSON.stringify(firstBox)}.`);

            await page.screenshot({ path: '.buyer-session-evidence/buyer-session-live.png', fullPage: true });
            const evidence = {
              ok: true,
              staleAccessTokenReplaced: true,
              orderStatuses,
              ordersFailurePanelVisible: false,
              unauthorizedVisible: false,
              mobileFirstLink: firstLabel,
              mobileScrollAfterRouteChange: scrollLeft,
              pageErrorCount: pageErrors.length,
            };
            fs.writeFileSync('.buyer-session-evidence/browser-evidence.json', JSON.stringify(evidence, null, 2));
            console.log(JSON.stringify(evidence));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Delete disposable buyer
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${TEMPORARY_URL:-}" ] || [ -z "${USER_ID:-}" ]; then
            echo "No disposable buyer was created."
            exit 0
          fi
          payload="$(jq -n --arg userId "$USER_ID" '{action:"cleanup",userId:$userId}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .buyer-session-evidence/cleanup-user.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$TEMPORARY_URL/api/release/buyer-session-live-test" || true)"
          test "$code" = "200"
          test "$(jq -r '.success' .buyer-session-evidence/cleanup-user.json)" = "true"

      - name: Redeploy exact clean merged main
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${TEMPORARY_URL:-}" ]; then
            echo "No temporary Production deployment occurred; no rollback deployment is needed."
            exit 0
          fi
          rm -rf /tmp/tcos-clean-buyer-session
          git worktree add --detach /tmp/tcos-clean-buyer-session "$SOURCE_SHA"
          mkdir -p /tmp/tcos-clean-buyer-session/.vercel
          cp .vercel/project.json /tmp/tcos-clean-buyer-session/.vercel/project.json
          cd /tmp/tcos-clean-buyer-session
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee "$GITHUB_WORKSPACE/.buyer-session-evidence/clean-deploy.log"
          CLEAN_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$GITHUB_WORKSPACE/.buyer-session-evidence/clean-deploy.log" | tail -n 1)"
          test -n "$CLEAN_URL"
          echo "CLEAN_URL=$CLEAN_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$CLEAN_URL" > "$GITHUB_WORKSPACE/.buyer-session-evidence/clean-deployment-url.txt"

      - name: Verify clean custom-domain promotion and secure boundaries
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${CLEAN_URL:-}" ]; then
            echo "No temporary deployment required cleanup verification."
            exit 0
          fi
          ready=""
          for attempt in $(seq 1 36); do
            orders_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-orders.html --write-out '%{http_code}' https://truelycollectables.com/account/orders || true)"
            api_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-orders-api.json --write-out '%{http_code}' https://truelycollectables.com/api/account/orders || true)"
            verifier_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-verifier.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"action":"create"}' https://truelycollectables.com/api/release/buyer-session-live-test || true)"
            echo "attempt=$attempt orders=$orders_code api=$api_code verifier=$verifier_code"
            if [ "$orders_code" = "200" ] && [ "$api_code" = "401" ] && [ "$verifier_code" = "404" ]; then
              grep -q 'Your Orders' /tmp/live-orders.html
              ready=1
              break
            fi
            sleep 10
          done
          test -n "$ready"
          clean_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/clean-orders.html --write-out '%{http_code}' "$CLEAN_URL/account/orders" || true)"
          test "$clean_code" = "200"
          grep -q 'Your Orders' /tmp/clean-orders.html
          cat > .buyer-session-evidence/final-live-boundary.json <<JSON
          {
            "ok": true,
            "sourceSha": "$SOURCE_SHA",
            "cleanDeploymentUrl": "$CLEAN_URL",
            "customDomainOrdersStatus": 200,
            "customDomainUnauthenticatedOrdersApiStatus": 401,
            "temporaryVerifierRouteStatusAfterCleanDeploy": 404
          }
          JSON

      - name: Upload sanitized buyer-session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyer-session-production-v2-20260730-${{ github.run_number }}
          path: .buyer-session-evidence
          if-no-files-found: warn
          retention-days: 30
