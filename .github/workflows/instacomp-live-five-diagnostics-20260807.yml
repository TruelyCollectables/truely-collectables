name: InstaComp Live Five Diagnostics 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-live-five-diagnostics-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and resolve read-only Production credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci >/dev/null
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$RUNNER_TEMP/production.env"
          runtime_file="$RUNNER_TEMP/runtime.json"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node -e '
            const fs=require("node:fs");
            const parsed={};
            for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,"utf8").split(/\r?\n/)){
              const i=raw.indexOf("="); if(i<1) continue;
              const k=raw.slice(0,i).trim(); let v=raw.slice(i+1).trim();
              if(v.startsWith("\"")&&v.endsWith("\"")){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}
              else if(v.startsWith("\u0027")&&v.endsWith("\u0027")) v=v.slice(1,-1);
              parsed[k]=v;
            }
            (async()=>{
              const url=String(parsed.NEXT_PUBLIC_SUPABASE_URL||"").trim();
              const localUrl=String(parsed.INSTACOMP_AI_LOCAL_URL||"").trim().replace(/\/+$/,"");
              const localKey=String(parsed.INSTACOMP_AI_LOCAL_KEY||"").trim();
              if(!url||!localUrl||localKey.length<32) throw new Error("Required read-only Production/Mac bridge values are missing");
              const ref=new URL(url).hostname.split(".")[0];
              const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});
              const text=await r.text(); if(!r.ok) throw new Error(`Supabase key lookup HTTP ${r.status}`);
              const keys=JSON.parse(text); const val=e=>String(e?.api_key||e?.key||e?.value||"");
              const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));
              const legacy=keys.find(e=>e?.name==="service_role"&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==="service_role"&&/^eyJ/.test(val(e)));
              const key=val(modern||legacy); if(!key) throw new Error("No Production server key");
              for(const secret of [url,key,localUrl,localKey]) console.log(`::add-mask::${secret}`);
              fs.writeFileSync(process.env.RUNTIME_PATH,JSON.stringify({url,key,localUrl,localKey}),{mode:0o600});
            })().catch(e=>{console.error(e);process.exit(1)});
          '

      - name: Locate frozen-five acceptance scans by time and identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/instacomp-live-five-diagnostics-20260807
          node --input-type=module -e '
            import fs from "node:fs";
            import { createClient } from "@supabase/supabase-js";
            const {url,key}=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/runtime.json","utf8"));
            const db=createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false}});
            const {data,error}=await db.from("instacomp_scans")
              .select("id,created_at,raw_ai_result,raw_comp_results")
              .gte("created_at","2026-08-07T19:50:00Z")
              .order("created_at",{ascending:false})
              .limit(80);
            if(error) throw error;
            const wanted=/sonia citron|dominique malonga|paige bueckers|rickea jackson/i;
            const picked=(data||[]).filter(r=>wanted.test(String(r.raw_ai_result?.player||""))).map(r=>{
              const ai=r.raw_ai_result||{}; const comp=r.raw_comp_results||{};
              return {id:r.id,created_at:r.created_at,ai:{player:ai.player,year:ai.year,brand:ai.brand,setName:ai.setName,cardNumber:ai.cardNumber,parallel:ai.parallel,internalScanId:ai.internalScanId,internalStatus:ai.internalStatus,internalChecklistOutcome:ai.internalChecklistOutcome,internalChecklistReasons:ai.internalChecklistReasons,internalMatchSource:ai.internalMatchSource},checklistRegistry:comp.checklistRegistry||{},identityDecision:comp.identityDecision||{},consensus:comp.consensus||{}};
            });
            fs.writeFileSync("evidence/instacomp-live-five-diagnostics-20260807/scans.json",JSON.stringify({count:picked.length,scans:picked},null,2));
            console.log(JSON.stringify({count:picked.length,scans:picked.map(s=>({created_at:s.created_at,player:s.ai.player,cardNumber:s.ai.cardNumber,internalScanId:s.ai.internalScanId,internalStatus:s.ai.internalStatus}))},null,2));
            if(!picked.some(s=>s.ai.internalScanId)) throw new Error("No recent frozen-five internal Mac scan IDs were found");
          '

      - name: Fetch sanitized Mac scan archives and OCR boxes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const runtime=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/runtime.json","utf8"));
            const scans=JSON.parse(fs.readFileSync("evidence/instacomp-live-five-diagnostics-20260807/scans.json","utf8")).scans||[];
            const seen=new Set(); const archives=[];
            for(const row of scans){
              const scanId=String(row.ai?.internalScanId||"").trim();
              if(!scanId||seen.has(scanId)) continue; seen.add(scanId);
              const response=await fetch(`${runtime.localUrl}/v1/scans/${encodeURIComponent(scanId)}/archive`,{headers:{"X-InstaComp-AI-Key":runtime.localKey,"Cache-Control":"no-cache"},signal:AbortSignal.timeout(30000)});
              const raw=await response.text(); let payload={}; try{payload=raw?JSON.parse(raw):{}}catch{payload={parseError:raw.slice(0,300)}}
              if(!response.ok){archives.push({scanId,httpStatus:response.status,error:payload});continue;}
              const lv=payload.local_vision||{};
              archives.push({scanId,httpStatus:response.status,status:payload.status,checklist:payload.checklist||{},localSuggestion:payload.local_suggestion?{identity:payload.local_suggestion.identity,evidence:payload.local_suggestion.evidence,confidence:payload.local_suggestion.confidence,explanation:payload.local_suggestion.explanation}:null,localVision:lv?{identityHints:lv.identity_hints||{},combinedText:lv.combined_text||"",appleVisionAvailable:lv.apple_vision_available,front:{ocr:lv.front?.ocr||[],errors:lv.front?.errors||[]},back:{ocr:lv.back?.ocr||[],errors:lv.back?.errors||[]}}:null});
            }
            fs.writeFileSync("evidence/instacomp-live-five-diagnostics-20260807/mac-archives.json",JSON.stringify({count:archives.length,archives},null,2));
            for(const a of archives){
              const all=[...(a.localVision?.front?.ocr||[]),...(a.localVision?.back?.ocr||[])];
              console.log(JSON.stringify({scanId:a.scanId,status:a.status,identityHints:a.localVision?.identityHints||null,ocr:all.map(o=>({side:o.side,text:o.text,confidence:o.confidence,box:o.box}))},null,2));
            }
          '

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-live-five-diagnostics-20260807
          path: evidence/instacomp-live-five-diagnostics-20260807
          retention-days: 30
