# Forced start: 2026-08-04T20:03:00-06:00
name: Topps Panini Master Vacuum

on:
  push:
    paths:
      - "scripts/discover-topps-panini-master-indexes.ts"
      - "scripts/discover-panini-checklists-via-public-indexes.ts"
      - "scripts/archive-topps-seed-sets.ts"
      - "scripts/archive-panini-seed-sets.ts"
      - "data/topps-checklist-seeds.json"
      - "data/panini-checklist-seeds.json"
      - ".github/workflows/topps-panini-master-vacuum.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: topps-panini-master-vacuum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vacuum:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Restore verified 818-entry Topps registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/topps-restore && mkdir -p /tmp/topps-restore
          gh api repos/${{ github.repository }}/actions/artifacts/8908907441/zip > /tmp/topps-restore.zip
          unzip -q /tmp/topps-restore.zip -d /tmp/topps-restore
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          function walk(dir) { for (const n of readdirSync(dir)) { const p=join(dir,n); if (statSync(p).isDirectory()) { const x=walk(p); if(x)return x; } else if(n==='topps.json') return p; } }
          const p=walk('/tmp/topps-restore'); if(!p) throw new Error('Topps manifest missing');
          const m=JSON.parse(readFileSync(p,'utf8')); const current=JSON.parse(readFileSync('data/topps-checklist-seeds.json','utf8')); const map=new Map(current.map(x=>[x.url,x]));
          for(const x of [...(m.files||[]),...(m.failures||[])]) if(x.url) map.set(x.url,{title:x.title||x.filename||'Official Topps Checklist',sport:x.sport||x.category||'Miscellaneous',year:x.year||'Unknown',...(x.sourcePage?{sourcePage:x.sourcePage}:{}),url:x.url});
          const rows=[...map.values()]; writeFileSync('data/topps-checklist-seeds.json',JSON.stringify(rows,null,2)+'\n'); if(rows.length<818) throw new Error(`Only ${rows.length} Topps seeds restored`); console.log(JSON.stringify({toppsSeeds:rows.length}));
          NODE

      - name: Master public-index sweep pass 1
        continue-on-error: true
        timeout-minutes: 32
        run: node --import tsx scripts/discover-topps-panini-master-indexes.ts

      - name: Panini historical index sweep
        continue-on-error: true
        timeout-minutes: 12
        run: node --import tsx scripts/discover-panini-checklists-via-public-indexes.ts

      - name: Download Topps expanded registry pass 1
        continue-on-error: true
        timeout-minutes: 150
        run: node --import tsx scripts/archive-topps-seed-sets.ts

      - name: Download Panini expanded registry pass 1
        continue-on-error: true
        timeout-minutes: 90
        run: node --import tsx scripts/archive-panini-seed-sets.ts

      - name: Master public-index sweep pass 2
        continue-on-error: true
        timeout-minutes: 32
        run: node --import tsx scripts/discover-topps-panini-master-indexes.ts

      - name: Download Topps expanded registry pass 2
        continue-on-error: true
        timeout-minutes: 150
        run: node --import tsx scripts/archive-topps-seed-sets.ts

      - name: Download Panini expanded registry pass 2
        continue-on-error: true
        timeout-minutes: 90
        run: node --import tsx scripts/archive-panini-seed-sets.ts

      - name: Package Topps and Panini master vacuum
        if: always()
        run: |
          mkdir -p .topps-panini-master/manifests .topps-panini-master/discovery .topps-panini-master/seeds
          test ! -d .topps-seed-archive || cp -a .topps-seed-archive/Topps .topps-panini-master/
          test ! -d .panini-seed-archive || cp -a .panini-seed-archive/Panini .topps-panini-master/
          test ! -f .topps-seed-archive/manifest.json || cp .topps-seed-archive/manifest.json .topps-panini-master/manifests/topps.json
          test ! -f .panini-seed-archive/manifest.json || cp .panini-seed-archive/manifest.json .topps-panini-master/manifests/panini.json
          test ! -f .master-index-discovery/report.json || cp .master-index-discovery/report.json .topps-panini-master/discovery/master-index.json
          test ! -f .panini-index-discovery/report.json || cp .panini-index-discovery/report.json .topps-panini-master/discovery/panini-index.json
          cp data/topps-checklist-seeds.json data/panini-checklist-seeds.json .topps-panini-master/seeds/
          tar -czf topps-panini-master-vacuum.tar.gz .topps-panini-master

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topps-panini-master-vacuum-${{ github.run_id }}
          path: topps-panini-master-vacuum.tar.gz
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topps-panini-master-status-${{ github.run_id }}
          path: |
            .topps-panini-master/manifests/*.json
            .topps-panini-master/discovery/*.json
            .topps-panini-master/seeds/*.json
          if-no-files-found: error
          retention-days: 90
