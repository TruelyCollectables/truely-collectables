name: Send Durable Admin Password Reset 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-database-admin-auth-production-deploy-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-database-admin-password-reset
  cancel-in-progress: true

jobs:
  verify-and-send-reset:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/database-admin-auth-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify durable owner recovery is live
        run: |
          set -euo pipefail
          mkdir -p /tmp/admin-auth-evidence
          login_code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 \
            --output /tmp/admin-auth-evidence/login.html \
            --write-out '%{http_code}' \
            https://truelycollectables.com/admin/login || true)"
          echo "login HTTP=$login_code bytes=$(wc -c < /tmp/admin-auth-evidence/login.html 2>/dev/null || echo 0)"
          test "$login_code" = "200"
          grep -Fq "Email Owner Reset Link" /tmp/admin-auth-evidence/login.html
          grep -Fq "survives every deployment" /tmp/admin-auth-evidence/login.html

          api_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
            --output /tmp/admin-auth-evidence/token-api.json \
            --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            'https://truelycollectables.com/api/admin/market-intel/profit-hunter-token?reveal=1' || true)"
          echo "unauthenticated token API HTTP=$api_code"
          test "$api_code" = "401"

      - name: Send one real owner reset email
        run: |
          set -euo pipefail
          response_code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output /tmp/admin-auth-evidence/reset-request-body.html \
            --dump-header /tmp/admin-auth-evidence/reset-request.headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'next=/api/admin/market-intel/profit-hunter-token?reveal=1' \
            https://truelycollectables.com/api/admin/password-reset/request || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, ""); print substr($0, 11)}' /tmp/admin-auth-evidence/reset-request.headers | tail -n 1)"
          echo "reset-request HTTP=$response_code location=$location"
          case "$response_code" in
            302|303|307|308) ;;
            *) echo "Reset request did not return a safe redirect."; exit 1 ;;
          esac
          printf '%s' "$location" | grep -Fq 'reset=sent'
          if printf '%s' "$location" | grep -Eq 'reset=(email_error|storage_error)'; then
            echo "Reset request failed before delivery."
            exit 1
          fi
          echo "OWNER_RESET_EMAIL_REQUEST_ACCEPTED"
