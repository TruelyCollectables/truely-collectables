name: Order Notification Hardening

on:
  pull_request:
    paths:
      - "supabase/migrations/20260726150000_order_notification_outbox.sql"
      - "src/lib/order-notifications.ts"
      - "src/lib/checkout-order-finalization.ts"
      - "src/app/api/orders/mark-shipped/**"
      - "src/app/api/orders/update-tracking/**"
      - "src/app/api/cron/order-notifications/**"
      - "src/app/api/admin/order-notifications/**"
      - "src/app/admin/order-notifications/**"
      - "scripts/run-order-notification-hardening-simulations.ts"
      - ".github/workflows/order-notification-hardening.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260726150000_order_notification_outbox.sql"
      - "src/lib/order-notifications.ts"
      - "src/lib/checkout-order-finalization.ts"
      - "src/app/api/orders/mark-shipped/**"
      - "src/app/api/orders/update-tracking/**"
      - "src/app/api/cron/order-notifications/**"
      - "src/app/api/admin/order-notifications/**"
      - "src/app/admin/order-notifications/**"
      - "scripts/run-order-notification-hardening-simulations.ts"
      - ".github/workflows/order-notification-hardening.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      RESEND_API_KEY: re_build_only_placeholder
      CRON_SECRET: build-only-placeholder-cron-secret
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate order notification hardening
        run: node --import tsx scripts/run-order-notification-hardening-simulations.ts

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
