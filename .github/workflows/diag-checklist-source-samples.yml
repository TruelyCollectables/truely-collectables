name: Diagnostic Checklist Source Samples

on:
  push:
    branches:
      - diag/checklist-source-samples-20260816

permissions:
  contents: read
  actions: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download master source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/8972198573/zip" \
            -o /tmp/master.zip
          mkdir -p /tmp/master-artifact samples
          unzip -q /tmp/master.zip -d /tmp/master-artifact
          tarball=/tmp/master-artifact/sports-card-checklist-master-archive.tar.gz
          test -f "$tarball"
          tar -xzf "$tarball" -C samples --strip-components=0 -- \
            '.card-checklist-master-archive/SORTED/basketball/2024/panini/prizm-wnba-team-set-lists-and-details/beckett/1505c2fe642d-2024-panini-prizm-wnba-basketball-checklist-team-set-lists-and-details/checklist.txt' \
            '.card-checklist-master-archive/SORTED/basketball/2024/panini/prizm-wnba-team-set-lists-and-details/beckett/1505c2fe642d-2024-panini-prizm-wnba-basketball-checklist-team-set-lists-and-details/001--2024-panini-prizm-wnba-basketball-checklist.xlsx' \
            '.card-checklist-master-archive/SORTED/hockey/2024-25/upper-deck/black-diamond-team-set-lists-and-details/beckett/0c6dfacc77da-2024-25-upper-deck-black-diamond-hockey-checklist-team-set-lists-and-details/checklist.txt' \
            '.card-checklist-master-archive/SORTED/hockey/2024-25/upper-deck/black-diamond-team-set-lists-and-details/beckett/0c6dfacc77da-2024-25-upper-deck-black-diamond-hockey-checklist-team-set-lists-and-details/001--2024-25-upper-deck-black-diamond-hockey-checklist.xlsx' \
            '.card-checklist-master-archive/SORTED/hockey/2021-22/fleer/ultra-and-odds/cardboardconnection/ec625dbb129b-2021-22-fleer-ultra-hockey-cards-checklist-and-odds/checklist.txt' \
            '.card-checklist-master-archive/SORTED/hockey/2021-22/upper-deck/ahl-american-league/cardboardconnection/7145a65ede14-2021-22-upper-deck-ahl-american-hockey-league-cards-checklist/checklist.txt'
          find samples -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: checklist-source-samples-${{ github.run_id }}
          path: samples/.card-checklist-master-archive/**
          if-no-files-found: error
          retention-days: 7
