name: Temporary InstaComp Key Verification Status

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/temporary-instacomp-key-verification-status.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: instacomp-key-verification-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com

    steps:
      - name: Check out current revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve provider credentials
        id: provider_env
        continue-on-error: true
        env:
          GITHUB_SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GITHUB_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          VERCEL_ENV_FILE=""
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
              printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
              VERCEL_LINK=0
            else
              npx vercel link --yes --project truely-collectables --scope truelycollectables-projects --token "$VERCEL_TOKEN" >/dev/null 2>&1
              VERCEL_LINK=$?
            fi
            if [ "$VERCEL_LINK" -eq 0 ]; then
              npx vercel env pull .env.production.local --yes --environment=production --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              [ -f .env.production.local ] && VERCEL_ENV_FILE=.env.production.local
            fi
          fi

          ENV_ARGS=()
          [ -n "$VERCEL_ENV_FILE" ] && ENV_ARGS=(--env-file="$VERCEL_ENV_FILE")
          node "${ENV_ARGS[@]}" <<'NODE'
          const fs = require("node:fs");
          const vercel = {
            SERPAPI_API_KEY: String(process.env.SERPAPI_API_KEY || "").trim(),
            OPENAI_API_KEY: String(process.env.OPENAI_API_KEY || "").trim(),
          };
          const github = {
            SERPAPI_API_KEY: String(process.env.GITHUB_SERPAPI_API_KEY || "").trim(),
            OPENAI_API_KEY: String(process.env.GITHUB_OPENAI_API_KEY || "").trim(),
          };
          const resolved = {
            SERPAPI_API_KEY: vercel.SERPAPI_API_KEY || github.SERPAPI_API_KEY,
            OPENAI_API_KEY: vercel.OPENAI_API_KEY || github.OPENAI_API_KEY,
          };
          const source = [
            vercel.OPENAI_API_KEY ? "openai:vercel" : github.OPENAI_API_KEY ? "openai:github" : "openai:absent",
            vercel.SERPAPI_API_KEY ? "serpapi:vercel" : github.SERPAPI_API_KEY ? "serpapi:github" : "serpapi:absent",
          ].join(",");
          fs.writeFileSync(
            ".env.instacomp.resolved",
            Object.entries(resolved).map(([name, value]) => `${name}=${JSON.stringify(value)}`).join("\n") + "\n",
            { mode: 0o600 },
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source=${source}\n`);
          if (!resolved.OPENAI_API_KEY || !resolved.SERPAPI_API_KEY) process.exit(1);
          NODE

      - name: Validate OpenAI key
        id: openai_auth
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.env.instacomp.resolved <<'NODE'
          const response = await fetch("https://api.openai.com/v1/models", {
            headers: { Authorization: `Bearer ${process.env.OPENAI_API_KEY}` },
            signal: AbortSignal.timeout(30000),
          });
          console.log(`OpenAI credential HTTP status: ${response.status}`);
          if (!response.ok) process.exit(1);
          NODE

      - name: Validate SerpApi key
        id: serpapi_auth
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.env.instacomp.resolved <<'NODE'
          const url = new URL("https://serpapi.com/search.json");
          url.searchParams.set("engine", "ebay");
          url.searchParams.set("ebay_domain", "ebay.com");
          url.searchParams.set("_nkw", "sports card");
          url.searchParams.set("_ipg", "1");
          url.searchParams.set("api_key", process.env.SERPAPI_API_KEY);
          const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
          const payload = await response.json().catch(() => ({}));
          console.log(`SerpApi credential HTTP status: ${response.status}`);
          if (!response.ok || payload?.error) process.exit(1);
          NODE

      - name: Run six-card exact-market proof
        id: live_proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.env.instacomp.resolved --import tsx scripts/run-instacomp-batch-001-live-market-proof.ts

      - name: Publish sanitized verification statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PROVIDER_ENV: ${{ steps.provider_env.outcome }}
          OPENAI_AUTH: ${{ steps.openai_auth.outcome }}
          SERPAPI_AUTH: ${{ steps.serpapi_auth.outcome }}
          LIVE_PROOF: ${{ steps.live_proof.outcome }}
          KEY_SOURCE: ${{ steps.provider_env.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          credential_state=failure
          proof_state=failure
          [ "$PROVIDER_ENV" = success ] && [ "$OPENAI_AUTH" = success ] && [ "$SERPAPI_AUTH" = success ] && credential_state=success
          [ "$LIVE_PROOF" = success ] && proof_state=success

          post_status() {
            local state="$1" context="$2" description="$3"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
              -d "$(node -e 'console.log(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3]}))' "$state" "$context" "$description")" >/dev/null
          }

          post_status "$credential_state" "instacomp/provider-credentials" "env=$PROVIDER_ENV openai=$OPENAI_AUTH serpapi=$SERPAPI_AUTH $KEY_SOURCE"
          post_status "$proof_state" "instacomp/live-six-card-proof" "six-card exact-market proof=$LIVE_PROOF"
          rm -rf .vercel .env.production.local .env.instacomp.resolved

      - name: Enforce verification result
        if: always()
        run: |
          test "${{ steps.provider_env.outcome }}" = success
          test "${{ steps.openai_auth.outcome }}" = success
          test "${{ steps.serpapi_auth.outcome }}" = success
          test "${{ steps.live_proof.outcome }}" = success
