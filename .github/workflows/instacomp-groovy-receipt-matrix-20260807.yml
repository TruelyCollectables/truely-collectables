name: InstaComp Groovy Receipt Matrix 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-groovy-receipt-matrix-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  TEMP_DIR: /tmp/instacomp-groovy-receipt-matrix-20260807

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-registry-consensus-final-v3-20260807
          fetch-depth: 0

      - name: Apply pending web-only repairs in workspace
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/patch-instacomp-registry-consensus-final-v3-20260807.py
          python scripts/ops/patch-instacomp-exact-receipt-serial-v4-20260807.py
          python scripts/ops/patch-instacomp-exact-receipt-serial-zero-v5-20260807.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and resolve read-only Production credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMP_DIR"
          npm ci
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$TEMP_DIR/production.env"; runtime_file="$TEMP_DIR/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node - <<'NODE'
          const fs=require('node:fs'); const p={};
          for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('#'))continue;const i=line.indexOf('=');if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}p[k]=v}
          (async()=>{const u=String(p.NEXT_PUBLIC_SUPABASE_URL||'').trim();if(!u)throw Error('Missing Production Supabase URL');const ref=new URL(u).hostname.split('.')[0];const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});const text=await r.text();if(!r.ok)throw Error(`Supabase key lookup HTTP ${r.status}`);const keys=text?JSON.parse(text):[];const val=e=>String(e?.api_key||e?.key||e?.value||'');const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));const legacy=keys.find(e=>e?.name==='service_role'&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==='service_role'&&/^eyJ/.test(val(e)));const key=val(modern||legacy);if(!key)throw Error('No server key');console.log(`::add-mask::${u}`);console.log(`::add-mask::${key}`);fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(u)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(key)}\n`,{mode:0o600})})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Run Groovy Registry field isolation matrix
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          cat > groovy-matrix-temp.ts <<'TS'
          import { resolveChecklistRegistry } from "./src/lib/instacomp-learning-server";
          const expected="c58ffc4f-e1c7-4cd9-b6e2-599af5a29044";
          const original:any={player:"Sonia Citron",year:"2025",brand:"Panini",setName:"PRIZM",cardNumber:"13",parallel:null,team:"Washington Mystics",sport:"Basketball",isRookie:true,isAuto:false,isRelic:false};
          const variants:any[]=[
            ["original",original],
            ["noTeam",{...original,team:null}],
            ["noSport",{...original,sport:null}],
            ["noRookie",{...original,isRookie:null}],
            ["parallelBase",{...original,parallel:"Base"}],
            ["setGroovy",{...original,setName:"Groovy"}],
            ["setGroovyBase",{...original,setName:"Groovy",parallel:"Base"}],
            ["minimalPrizm",{player:"Sonia Citron",year:"2025",brand:"Panini",setName:"PRIZM",cardNumber:"13",isAuto:false,isRelic:false}],
            ["minimalGroovy",{player:"Sonia Citron",year:"2025",brand:"Panini",setName:"Groovy",cardNumber:"13",isAuto:false,isRelic:false}],
          ];
          async function main(){
            for(const [name,ai] of variants){
              const r=await resolveChecklistRegistry(ai,{evidenceTrusted:false});
              console.log("MATRIX="+JSON.stringify({name,status:r.status,id:r.match?.identityId||null,fp:r.match?.fingerprintSha256||null,set:r.match?.setName||null,parallel:r.match?.parallel||null,team:r.match?.team||null,serialRun:r.match?.serialRun??null,candidateCount:r.candidateCount,reasons:r.reasons,expectedMatch:r.match?.identityId===expected}));
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          npx tsx groovy-matrix-temp.ts
          rm -f groovy-matrix-temp.ts

      - name: Remove temporary files
        if: always()
        run: rm -rf "$TEMP_DIR" groovy-matrix-temp.ts
