name: Checklist Apply Coordinate WNBA Hockey 20260815

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checklist-apply-coordinate-wnba-hockey-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read live Registry indexes and incomplete imports
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/registry-probe"
          mkdir -p "$root"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o "$root/projects.json" \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          sql=$(cat <<'SQL'
          select jsonb_build_object(
            'indexes', coalesce((
              select jsonb_agg(jsonb_build_object('table', tablename, 'name', indexname, 'definition', indexdef) order by tablename,indexname)
              from pg_indexes
              where schemaname='public' and tablename in ('checklist_sets','checklist_cards','checklist_parallels','checklist_card_identities','checklist_versions')
            ), '[]'::jsonb),
            'incomplete', coalesce((
              select jsonb_agg(jsonb_build_object(
                'versionId',v.id,'releaseId',v.release_id,'product',r.product_name,'season',r.season,'year',r.release_year,
                'status',v.status,'active',v.is_active,'sourceRows',v.source_row_count,'cards',v.normalized_card_count,
                'identities',v.normalized_identity_count,'metadata',v.metadata
              ) order by v.created_at desc)
              from checklist_versions v join checklist_releases r on r.id=v.release_id
              where v.status in ('importing','failed','validation_required')
            ), '[]'::jsonb)
          ) as registry_probe;
          SQL
          )
          jq -n --arg query "$sql" '{query:$query}' > "$root/query.json"
          curl --silent --show-error --fail --retry 2 --retry-all-errors --retry-delay 2 --max-time 60 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$root/query.json" \
            -o "$root/schema.json" \
            "https://api.supabase.com/v1/projects/$project_ref/database/query"
          jq . "$root/schema.json"
      - name: Upload exact schema
        uses: actions/upload-artifact@v4
        with:
          name: registry-index-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/registry-probe/schema.json
          if-no-files-found: error
          retention-days: 7
