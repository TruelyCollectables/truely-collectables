name: Checklist Apply Coordinate WNBA Hockey 20260815

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checklist-apply-coordinate-wnba-hockey-20260815.yml'
      - 'scripts/mainstream-checklist/staged-registry-writer.mjs'
      - 'scripts/apply-exhaustive-staged-plans.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  staged-production-apply:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 180
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      COORDINATE_HARVEST_ROOT: /home/runner/work/_temp/exhaustive-staged
      COORDINATE_APPLY_RECEIPT: /home/runner/work/_temp/exhaustive-staged/production-staged-apply-receipt.json
      COORDINATE_APPLY_MAX_SETS: '250'
      COORDINATE_SOURCE_RUN_ID: '31924171342'
      COORDINATE_DB_HEALTH_ATTEMPTS: '18'
      COORDINATE_DB_HEALTH_DELAY_MS: '5000'
      CHECKLIST_REGISTRY_SET_CHUNK: '100'
      CHECKLIST_REGISTRY_CARD_CHUNK: '75'
      CHECKLIST_REGISTRY_PARALLEL_CHUNK: '100'
      CHECKLIST_REGISTRY_IDENTITY_CHUNK: '150'
      CHECKLIST_REGISTRY_RPC_ATTEMPTS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve Production Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/staged-production"
          mkdir -p "$root"
          test -n "$GH_SUPABASE_ACCESS_TOKEN"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o "$root/projects.json" \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o "$root/api-keys.json" \
            "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$root/api-keys.json")"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$project_ref.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Download validated exhaustive harvest
        uses: actions/download-artifact@v4
        with:
          name: exhaustive-hockey-wnba-31924171342
          path: /home/runner/work/_temp/exhaustive-staged
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31924171342

      - name: Prove validated input bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s "$COORDINATE_HARVEST_ROOT/output/summary.json"
          jq '{targetCount,resultCount,readyCount,validationFailedCount,failedCount,totalCards,totalParallels,totalIdentities}' "$COORDINATE_HARVEST_ROOT/output/summary.json"

      - name: Apply every clean plan through proven staged Registry RPCs
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/apply-exhaustive-staged-plans.mjs

      - name: Print Production staged receipt
        if: always()
        shell: bash
        run: |
          receipt="$COORDINATE_APPLY_RECEIPT"
          if [ -s "$receipt" ]; then
            jq '{sourceHarvestRunId,summaryCounts,requestedCount,attemptedCount,persistedCount,persistedCards,persistedParallels,persistedIdentities,results:[.results[]|{exactSetKey,status,counts,error,transactionCounts:.transaction.counts}]}' "$receipt"
          else
            echo 'No Production staged receipt was created.'
          fi

      - name: Upload Production staged receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-production-staged-${{ github.run_id }}
          path: /home/runner/work/_temp/exhaustive-staged/production-staged-apply-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup protected files
        if: always()
        run: rm -rf "$RUNNER_TEMP/staged-production" .env.local .env.production.local .vercel
