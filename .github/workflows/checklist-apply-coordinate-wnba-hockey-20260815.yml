name: Checklist Apply Coordinate WNBA Hockey 20260815

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checklist-apply-coordinate-wnba-hockey-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read exact live Registry writer definition
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/registry-probe"
          mkdir -p "$root"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o "$root/projects.json" \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          sql=$(cat <<'SQL'
          select jsonb_build_object(
            'functions', coalesce((
              select jsonb_agg(jsonb_build_object(
                'name', p.proname,
                'args', pg_get_function_identity_arguments(p.oid),
                'definition', pg_get_functiondef(p.oid)
              ) order by p.proname)
              from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and (p.proname='tcos_apply_checklist_import_plan' or p.proname like 'tcos%checklist%')
            ), '[]'::jsonb),
            'columns', coalesce((
              select jsonb_agg(jsonb_build_object(
                'table', table_name,'column',column_name,'type',data_type,'nullable',is_nullable,'default',column_default
              ) order by table_name, ordinal_position)
              from information_schema.columns
              where table_schema='public' and table_name like 'checklist_%'
            ), '[]'::jsonb),
            'constraints', coalesce((
              select jsonb_agg(jsonb_build_object(
                'table', c.relname,'name',con.conname,'type',con.contype,'definition',pg_get_constraintdef(con.oid)
              ) order by c.relname,con.conname)
              from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relname like 'checklist_%'
            ), '[]'::jsonb)
          ) as registry_schema;
          SQL
          )
          jq -n --arg query "$sql" '{query:$query}' > "$root/query.json"
          curl --silent --show-error --fail --retry 2 --retry-all-errors --retry-delay 2 --max-time 60 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$root/query.json" \
            -o "$root/schema.json" \
            "https://api.supabase.com/v1/projects/$project_ref/database/query"
          jq . "$root/schema.json"
      - name: Upload exact schema
        uses: actions/upload-artifact@v4
        with:
          name: registry-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/registry-probe/schema.json
          if-no-files-found: error
          retention-days: 7
