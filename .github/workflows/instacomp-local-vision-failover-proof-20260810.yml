name: InstaComp Local Vision Failover Proof 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-local-vision-failover-proof-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FIX_SHA: b763f55098b50b2984083fb3355403f08737d75c

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_SHA }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - name: Install InstaComp service dependencies
        working-directory: services/instacomp-ai
        run: python -m pip install -r requirements.txt
      - name: Prove local vision HTTP 500 failover regression
        working-directory: services/instacomp-ai
        run: python -m pytest -q tests/test_local_vision_failover.py

  full-service-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_SHA }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - name: Install InstaComp service dependencies
        working-directory: services/instacomp-ai
        run: python -m pip install -r requirements.txt
      - name: Run complete InstaComp service suite
        working-directory: services/instacomp-ai
        run: python -m pytest -q
