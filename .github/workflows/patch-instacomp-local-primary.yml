name: Patch InstaComp Local Primary

on:
  push:
    branches:
      - fix/instacomp-local-engine-primary

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: ${{ !contains(github.event.head_commit.message, '[local-primary-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-local-engine-primary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          pip install -r services/instacomp-ai/requirements.txt
      - name: Make InstaComp internal engine primary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/api/instacomp/scan/route.ts')
          text = path.read_text()

          import_anchor = '''import {
            buildChecklistRegistryCatalogEvidence,
            buildChecklistRegistryReviewEvidence,
            buildInstaCompEvidenceIdentityDecision,
            resolveChecklistRegistry,
          } from "../../../../lib/instacomp-learning-server";
          '''
          local_import = '''import {
            analyzeWithInstaCompAiLocal,
            hasConfiguredInstaCompAiLocal,
            instaCompAiLocalScanToAi,
          } from "../../../../lib/instacomp-ai-local";
          '''
          if local_import not in text:
              if import_anchor not in text:
                  raise SystemExit('learning-server import anchor not found')
              text = text.replace(import_anchor, import_anchor + local_import, 1)

          function_pattern = re.compile(
              r'async function identifyCardWithConfiguredProviderFailover\(params: \{.*?\n\}\n\nexport async function POST',
              re.S,
          )
          replacement = '''async function identifyCardWithConfiguredProviderFailover(params: {
            frontImage: File;
            backImage?: File | null;
            frontDataUrl: string;
            backDataUrl?: string;
            detailImages: InstaCompDetailImage[];
            externalOcr: ExternalOcrResult | null;
          }) {
            return runInstaCompPrimaryAiFailover<InstaCompAiResult>([
              {
                provider: "instacomp_internal",
                family: "instacomp_internal",
                configured: hasConfiguredInstaCompAiLocal(),
                run: async () => {
                  const scan = await analyzeWithInstaCompAiLocal({
                    front: params.frontImage,
                    back: params.backImage || null,
                    timeoutMs: 150_000,
                  });
                  const ai = instaCompAiLocalScanToAi(scan);
                  if (!ai) {
                    throw new Error(
                      `InstaComp internal engine returned ${scan.status} without usable identity evidence.`,
                    );
                  }
                  return ai;
                },
              },
              {
                provider: "openai_emergency",
                family: "openai",
                configured: Boolean(OPENAI_API_KEY),
                run: () =>
                  identifyCardWithOpenAI(
                    params.frontDataUrl,
                    params.backDataUrl,
                    params.detailImages.slice(0, 8),
                    params.externalOcr,
                  ),
              },
            ]);
          }

          export async function POST'''
          text, count = function_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'provider failover block replacement count was {count}')

          preflight_pattern = re.compile(
              r'    const preflightSerialOcrPromise = shouldPreflightSerialVision\(\{.*?\n      : null;\n',
              re.S,
          )
          text, count = preflight_pattern.subn(
              '    // OpenAI serial vision is emergency-only; never preflight it before InstaComp.\n'
              '    const preflightSerialOcrPromise = null;\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'preflight serial replacement count was {count}')

          old_call = '''    const primaryAiResult = await identifyCardWithConfiguredProviderFailover({
              frontDataUrl,
              backDataUrl,
              detailImages,
              externalOcr,
            });'''
          new_call = '''    const primaryAiResult = await identifyCardWithConfiguredProviderFailover({
              frontImage,
              backImage: backImageForScan,
              frontDataUrl,
              backDataUrl,
              detailImages,
              externalOcr,
            });'''
          if old_call not in text:
              raise SystemExit('primary provider call anchor not found')
          text = text.replace(old_call, new_call, 1)

          serial_condition = '''        : shouldRunSerialVision({
                    ai: baseAi,
                    externalOcr,
                    requestedTier: requestedAiCouncilTier,
                  })
              ? await optionalInstaCompProviderResult('''
          serial_replacement = '''        : primaryAiResult.family === "openai" && shouldRunSerialVision({
                    ai: baseAi,
                    externalOcr,
                    requestedTier: requestedAiCouncilTier,
                  })
              ? await optionalInstaCompProviderResult('''
          if serial_condition not in text:
              raise SystemExit('serial emergency condition anchor not found')
          text = text.replace(serial_condition, serial_replacement, 1)

          council_call = '''      runSecondaryVision: consensusEscalation.runSecondaryVision,'''
          council_replacement = '''      runSecondaryVision:
                primaryAiResult.family !== "instacomp_internal" &&
                consensusEscalation.runSecondaryVision,'''
          if council_call not in text:
              raise SystemExit('council call anchor not found')
          text = text.replace(council_call, council_replacement, 1)

          path.write_text(text)
          PY
          rm .github/workflows/patch-instacomp-local-primary.yml
      - name: Python service tests
        working-directory: services/instacomp-ai
        run: |
          python -m compileall app tests
          pytest -q
      - name: Website certification
        run: |
          npx eslint src/app/api/instacomp/scan/route.ts src/lib/instacomp-ai-local.ts
          npx tsc --noEmit
          npm run build
      - name: Verify architecture contract
        run: |
          python - <<'PY'
          from pathlib import Path
          route = Path('src/app/api/instacomp/scan/route.ts').read_text()
          service = Path('services/instacomp-ai/app/main.py').read_text()
          assert route.index('provider: "instacomp_internal"') < route.index('provider: "openai_emergency"')
          assert 'provider: "openai_primary"' not in route
          assert 'PRIMARY ENGINE: exact and near-visual trusted InstaComp memory' in service
          assert service.index('find_trusted_image_match') < service.index('reader.analyze')
          assert 'OpenAI' not in Path('services/instacomp-ai/app/ollama.py').read_text().split('class OllamaReader')[0]
          print('InstaComp -> Ollama backup -> OpenAI emergency contract verified')
          PY
      - name: Commit patched route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/instacomp/scan/route.ts src/lib/instacomp-ai-local.ts services/instacomp-ai .github/workflows/patch-instacomp-local-primary.yml
          git commit -m "[local-primary-patched] Make InstaComp internal engine primary"
          git push origin HEAD:fix/instacomp-local-engine-primary
