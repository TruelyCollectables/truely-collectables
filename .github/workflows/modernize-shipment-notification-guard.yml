name: Modernize Shipment Notification Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modernize-shipment-notification-guard
  cancel-in-progress: true

jobs:
  modernize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/dual-marketplace-card-intake'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Modernize shipment notification guard
        run: node scripts/modernize-shipment-notification-guard.mjs
      - name: Validate guard source
        run: |
          grep -q 'enqueueAndAttemptOrderNotification' scripts/check-production-guardrails.mjs
          ! grep -q 'fetch("https://api.resend.com/emails"' scripts/check-production-guardrails.mjs
          git diff --check
      - name: Commit guard modernization
        run: |
          if git diff --quiet -- scripts/check-production-guardrails.mjs; then
            echo 'Guard is already modernized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-production-guardrails.mjs
          git commit -m "Modernize shipment notification production guard"
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
