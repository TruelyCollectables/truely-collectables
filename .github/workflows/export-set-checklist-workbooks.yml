name: Export Set Checklist Workbooks

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Sports Card Checklist Phase 1 run ID containing the master archive
        required: true
        default: "31100986894"
      master_artifact_id:
        description: Artifact ID for sports-card-checklist-master-archive
        required: true
        default: "8972198573"
      start_year:
        description: First mainstream sports year to export
        required: true
        default: "2000"
      end_year:
        description: Last mainstream sports year to export
        required: true
        default: "2026"
      workers:
        description: Parallel workbook writer processes
        required: true
        default: "4"
  pull_request:
    paths:
      - "scripts/export-set-checklist-workbooks.py"
      - ".github/workflows/export-set-checklist-workbooks.yml"
  push:
    branches:
      - "feature/universal-sports-checklist-universe-20260805"
    paths:
      - "scripts/export-set-checklist-workbooks.py"
      - ".github/workflows/export-set-checklist-workbooks.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: export-set-checklist-workbooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Build one workbook per canonical set
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '31100986894' }}
      MASTER_ARTIFACT_ID: ${{ inputs.master_artifact_id || '8972198573' }}
      START_YEAR: ${{ inputs.start_year || '2000' }}
      END_YEAR: ${{ inputs.end_year || '2026' }}
      WORKERS: ${{ inputs.workers || '4' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exporter syntax
        run: python -m py_compile scripts/export-set-checklist-workbooks.py

      - name: Install deterministic XLSX writer
        run: python -m pip install --disable-pip-version-check --no-cache-dir XlsxWriter==3.2.5

      - name: Download run #50 master archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MASTER_ARTIFACT_ID}/zip" \
            --output master-artifact.zip
          mkdir -p downloaded-master-artifact
          unzip -q master-artifact.zip -d downloaded-master-artifact
          test -f downloaded-master-artifact/sports-card-checklist-master-archive.tar.gz
          tar -xzf downloaded-master-artifact/sports-card-checklist-master-archive.tar.gz \
            .card-checklist-master-archive
          test -f .card-checklist-master-archive/master-sets.json
          test -f .card-checklist-master-archive/source-items.json
          test -f .card-checklist-master-archive/phase1-sports-2000-plus/sports-sets.json
          rm -f master-artifact.zip downloaded-master-artifact/sports-card-checklist-master-archive.tar.gz

      - name: Export deduplicated set workbooks
        env:
          CHECKLIST_MASTER_ROOT: .card-checklist-master-archive
          CHECKLIST_WORKBOOK_OUTPUT: .card-checklist-set-workbooks
          CHECKLIST_WORKBOOK_START_YEAR: ${{ env.START_YEAR }}
          CHECKLIST_WORKBOOK_END_YEAR: ${{ env.END_YEAR }}
          CHECKLIST_WORKBOOK_WORKERS: ${{ env.WORKERS }}
        run: |
          python scripts/export-set-checklist-workbooks.py --clean
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.card-checklist-set-workbooks/manifest.json').read_text())
          assert manifest['generatedWorkbooks'] == manifest['canonicalSets']
          assert manifest['duplicateSetRecordsRemoved'] >= 0
          assert 0 <= manifest['knownSetChecklistReadiness'] <= 1
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload workbook index and duplicate audit
        uses: actions/upload-artifact@v4
        with:
          name: set-checklist-workbook-index-${{ github.run_id }}
          path: |
            .card-checklist-set-workbooks/TCOS-Checklist-Workbook-Index.xlsx
            .card-checklist-set-workbooks/manifest.json
            .card-checklist-set-workbooks/set-workbooks.json
            .card-checklist-set-workbooks/set-workbooks.csv
            .card-checklist-set-workbooks/duplicate-set-groups.json
            .card-checklist-set-workbooks/duplicate-set-groups.csv
          if-no-files-found: error
          retention-days: 90

      - name: Upload baseball set workbooks
        uses: actions/upload-artifact@v4
        with:
          name: set-checklist-workbooks-baseball-${{ github.run_id }}
          path: .card-checklist-set-workbooks/baseball
          if-no-files-found: error
          retention-days: 90

      - name: Upload football set workbooks
        uses: actions/upload-artifact@v4
        with:
          name: set-checklist-workbooks-football-${{ github.run_id }}
          path: .card-checklist-set-workbooks/football
          if-no-files-found: error
          retention-days: 90

      - name: Upload basketball set workbooks
        uses: actions/upload-artifact@v4
        with:
          name: set-checklist-workbooks-basketball-${{ github.run_id }}
          path: .card-checklist-set-workbooks/basketball
          if-no-files-found: error
          retention-days: 90

      - name: Upload hockey set workbooks
        uses: actions/upload-artifact@v4
        with:
          name: set-checklist-workbooks-hockey-${{ github.run_id }}
          path: .card-checklist-set-workbooks/hockey
          if-no-files-found: error
          retention-days: 90

      - name: Upload soccer set workbooks
        uses: actions/upload-artifact@v4
        with:
          name: set-checklist-workbooks-soccer-${{ github.run_id }}
          path: .card-checklist-set-workbooks/soccer
          if-no-files-found: error
          retention-days: 90

      - name: Upload remaining sports set workbooks
        uses: actions/upload-artifact@v4
        with:
          name: set-checklist-workbooks-other-sports-${{ github.run_id }}
          path: |
            .card-checklist-set-workbooks/racing
            .card-checklist-set-workbooks/wrestling
            .card-checklist-set-workbooks/mma
            .card-checklist-set-workbooks/boxing
            .card-checklist-set-workbooks/golf
            .card-checklist-set-workbooks/tennis
            .card-checklist-set-workbooks/multi-sport
          if-no-files-found: error
          retention-days: 90
