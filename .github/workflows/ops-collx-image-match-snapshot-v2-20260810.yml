name: Ops CollX Image Match Snapshot V2 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-image-match-snapshot-v2-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/collx-image-snapshot"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-image-snapshot/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Snapshot live product and image identity only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { setTimeout as sleep } from 'node:timers/promises';

          const envPath = path.join(process.env.RUNNER_TEMP, 'collx-image-snapshot', 'production.env');
          const text = fs.readFileSync(envPath, 'utf8');
          const env = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            env[key] = value;
          }

          const productionUrl = env.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) {
            throw new Error('Production NEXT_PUBLIC_SUPABASE_URL was not pulled from Vercel.');
          }
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !token) throw new Error('Production Supabase management access unavailable.');
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;
          const storeId = '00000000-0000-4000-8000-000000000001';

          function isTransient(status, body) {
            return [429, 500, 502, 503, 504, 522, 524, 544].includes(status) ||
              /timeout|connection terminated|terminating connection|administrator command|57P01|temporar|cloudflare|network/i.test(body);
          }

          async function query(sql, label) {
            let last = '';
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              let response;
              let body = '';
              try {
                response = await fetch(endpoint, {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ query: sql, parameters: [], read_only: true }),
                });
                body = await response.text();
              } catch (error) {
                last = String(error?.message || error);
                if (attempt === 10) throw new Error(`${label} transport failed: ${last}`);
                console.log(`${label}: transport retry ${attempt}/10`);
                await sleep(Math.min(15000, 1000 * attempt));
                continue;
              }
              if (response.ok) return body ? JSON.parse(body) : [];
              last = `HTTP ${response.status}: ${body.slice(0, 800)}`;
              if (!isTransient(response.status, body) || attempt === 10) {
                throw new Error(`${label} failed: ${last}`);
              }
              console.log(`${label}: transient ${response.status}; retry ${attempt}/10`);
              await sleep(Math.min(15000, 1000 * attempt));
            }
            throw new Error(`${label} failed: ${last}`);
          }

          async function paged(sqlBase, label, pageSize = 100) {
            const rows = [];
            for (let offset = 0; offset < 50000; offset += pageSize) {
              const batch = await query(`${sqlBase}\nlimit ${pageSize} offset ${offset};`, `${label} offset ${offset}`);
              rows.push(...batch);
              console.log(JSON.stringify({ label, offset, fetched: batch.length, total: rows.length }));
              if (batch.length < pageSize) return rows;
            }
            throw new Error(`${label} exceeded 50,000 rows.`);
          }

          const products = await paged(`
            select id, store_id, sku, title, player, sport, ebay_item_id, image_url,
                   quantity, price, archived_at, sold_at
            from public.products
            where store_id = '${storeId}'::uuid
            order by id
          `, 'products', 200);

          const inventoryItems = await paged(`
            select id, store_id, legacy_product_id, card_uuid, sku, title, status, quantity, price
            from public.inventory_items
            where store_id = '${storeId}'::uuid
            order by id
          `, 'inventory_items', 200);

          const inventoryImages = await paged(`
            select img.id, img.inventory_item_id, img.image_url, img.alt_text,
                   img.sort_order, img.is_primary
            from public.inventory_images img
            join public.inventory_items i on i.id = img.inventory_item_id
            where i.store_id = '${storeId}'::uuid
            order by img.inventory_item_id, img.sort_order, img.id
          `, 'inventory_images', 100);

          const output = {
            generated_at: new Date().toISOString(),
            store_id: storeId,
            products,
            inventory_items: inventoryItems,
            inventory_images: inventoryImages,
          };
          const outPath = path.join(process.env.RUNNER_TEMP, 'collx-image-snapshot', 'live-inventory.json');
          fs.writeFileSync(outPath, JSON.stringify(output, null, 2));
          console.log(JSON.stringify({
            products: products.length,
            inventory_items: inventoryItems.length,
            inventory_images: inventoryImages.length,
          }));
          NODE
          rm -f "$RUNNER_TEMP/collx-image-snapshot/production.env"

      - name: Upload live inventory snapshot
        uses: actions/upload-artifact@v4
        with:
          name: collx-image-live-inventory-snapshot-v2
          path: ${{ runner.temp }}/collx-image-snapshot/live-inventory.json
          retention-days: 1
          if-no-files-found: error
