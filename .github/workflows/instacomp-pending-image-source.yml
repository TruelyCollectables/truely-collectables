name: InstaComp Pending Image Source

on:
  pull_request:
    paths:
      - "src/app/api/account/seller/instacomp-pending/route.ts"
      - "src/app/api/instacomp/pending-image-repair-push/route.ts"
      - "scripts/run-instacomp-pending-image-source-regressions.ts"
      - ".github/workflows/instacomp-pending-image-source.yml"
  push:
    paths:
      - "src/app/api/account/seller/instacomp-pending/route.ts"
      - "src/app/api/instacomp/pending-image-repair-push/route.ts"
      - "scripts/run-instacomp-pending-image-source-regressions.ts"
      - ".github/workflows/instacomp-pending-image-source.yml"

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pending image source regressions
        run: node --import tsx scripts/run-instacomp-pending-image-source-regressions.ts
      - name: Lint changed files
        run: >-
          npx eslint
          src/app/api/account/seller/instacomp-pending/route.ts
          src/app/api/instacomp/pending-image-repair-push/route.ts
          scripts/run-instacomp-pending-image-source-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://example.com
          INSTACOMP_SERVICE_TOKEN: placeholder-service-token
        run: npm run build
