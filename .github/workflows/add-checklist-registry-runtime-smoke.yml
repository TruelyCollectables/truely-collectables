name: Add Checklist Registry Runtime Smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/instacomp-learning-registry-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instacomp-learning-registry-v1
          fetch-depth: 0

      - name: Add Checklist Registry to protected runtime smoke
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/smoke-admin-runtime.mjs')
          text = path.read_text()
          marker = '''  {
            path: "/admin/inventory",
            auth: true,
            expectedText: "Inventory Bridge",
          },
          '''
          addition = '''  {
            path: "/admin/instacomp/checklists",
            auth: true,
            expectedText: "Checklist Registry",
          },
          ''' + marker
          if '/admin/instacomp/checklists' in text:
              raise SystemExit('Checklist Registry smoke route already exists')
          if marker not in text:
              raise SystemExit('Inventory smoke route insertion point not found')
          path.write_text(text.replace(marker, addition, 1))
          PY

      - name: Verify admin dashboard contract
        run: npm run simulate:admin-dashboard-actions

      - name: Commit verified smoke coverage
        run: |
          rm .github/workflows/add-checklist-registry-runtime-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-admin-runtime.mjs .github/workflows/add-checklist-registry-runtime-smoke.yml
          git commit -m "Add Checklist Registry to admin runtime smoke coverage"
          git push origin HEAD:feature/instacomp-learning-registry-v1
