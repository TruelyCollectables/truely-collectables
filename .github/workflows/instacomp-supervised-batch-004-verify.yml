name: InstaComp Supervised Batch 004 Verify

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-supervised-batch-004-verify.yml"
      - "scripts/verify-instacomp-supervised-batch-004-runtime-contract.mjs"
      - "scripts/fixtures/instacomp-supervised-batch-004-cards-76-100.json"
      - "src/lib/instacomp-supervised-batch-004.ts"
      - "src/app/api/release/instacomp-supervised-batch-004/route.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-supervised-batch-004-verify.yml"
      - "scripts/verify-instacomp-supervised-batch-004-runtime-contract.mjs"
      - "scripts/fixtures/instacomp-supervised-batch-004-cards-76-100.json"
      - "src/lib/instacomp-supervised-batch-004.ts"
      - "src/app/api/release/instacomp-supervised-batch-004/route.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify read-only supervised Batch 004 runtime contract
        run: node scripts/verify-instacomp-supervised-batch-004-runtime-contract.mjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false

  live-production-verification:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERIFY_URL: https://truelycollectables.com/api/release/instacomp-supervised-batch-004
    steps:
      - name: Wait for Production route and verify live internal memory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          receipt="$RUNNER_TEMP/instacomp-batch-004-live-verification.json"
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o "$receipt" -w '%{http_code}' --max-time 40 \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Accept: application/json' \
              "$VERIFY_URL" || true)"
            if [[ "$code" == "200" ]] && node - "$receipt" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.exit(payload?.success === true ? 0 : 1);
          NODE
            then
              ready=1
              break
            fi
            sleep 10
          done
          if [[ "$ready" != "1" ]]; then
            echo "Production Batch 004 verifier did not become ready." >&2
            cat "$receipt" >&2 || true
            exit 1
          fi
          node - "$receipt" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const summary = {
            batch: payload.batch,
            total: payload.total,
            trustedMemoryVerified: payload.trustedMemoryVerified,
            registryExpectedCandidateVerified: payload.registryExpectedCandidateVerified,
            missingTrustedMemoryOrdinals: payload.missingTrustedMemoryOrdinals,
            missingRegistryOrdinals: payload.missingRegistryOrdinals,
            allTrustedMemoryVerified: payload.allTrustedMemoryVerified,
            allRegistryCandidatesVerified: payload.allRegistryCandidatesVerified,
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## InstaComp Batch 004 live verification\n\n\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\`\n`);
          NODE
          mkdir -p audits/instacomp-supervised
          cp "$receipt" audits/instacomp-supervised/batch-004-live-verification.json
      - name: Upload live verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-supervised-batch-004-live-verification
          path: audits/instacomp-supervised/batch-004-live-verification.json
          if-no-files-found: error
          retention-days: 30
