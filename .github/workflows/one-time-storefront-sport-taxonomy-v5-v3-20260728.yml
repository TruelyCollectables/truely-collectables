name: One-Time Storefront Sport Taxonomy V5 V3 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-storefront-sport-taxonomy-v5-v3-20260728.yml"

permissions:
  contents: write

concurrency:
  group: one-time-storefront-sport-taxonomy-v5-v3-20260728
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/storefront-sport-taxonomy-v5-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-sport-taxonomy-v5-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Preserve TypeScript regexes and apply taxonomy v5
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/temporary_storefront_sport_taxonomy_v5.py')
          text = path.read_text()
          replacements = {
            "detect_section = '''": "detect_section = r'''",
            "detect_features = '''": "detect_features = r'''",
            "strong_autograph = '''": "strong_autograph = r'''",
            "music_preference = music_preference_marker + '''": "music_preference = music_preference_marker + r'''",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{old}: expected one match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python scripts/temporary_storefront_sport_taxonomy_v5.py

      - name: Remove temporary writer files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-storefront-sport-taxonomy-v5-20260728.yml \
            .github/workflows/one-time-storefront-sport-taxonomy-v5-v2-20260728.yml \
            .github/workflows/one-time-storefront-sport-taxonomy-v5-v3-20260728.yml \
            scripts/temporary_storefront_sport_taxonomy_v5.py

      - name: Validate taxonomy and storefront changes
        run: |
          set -euo pipefail
          npm ci
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
          npx eslint src/lib/storefront-taxonomy.ts src/lib/ebay-category-mapper.ts src/lib/ebay-authoritative-store-sync.ts src/lib/sports-card-launch-scope.ts src/app/shop/page.tsx 'src/app/product/[id]/page.tsx' scripts/run-storefront-taxonomy-regressions.ts scripts/run-ebay-import-admin-client-simulations.ts
          npm run build

      - name: Commit validated taxonomy v5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Separate storefront sports and tighten autograph detection"
          git push origin HEAD:agent/storefront-sport-taxonomy-v5-20260728
