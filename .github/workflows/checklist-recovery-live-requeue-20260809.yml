name: Checklist Recovery Live Requeue 20260809

on:
  push:
    branches:
      - ops/checklist-recovery-live-20260809
    paths:
      - ".github/workflows/checklist-recovery-live-requeue-20260809.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/checklist-recovery-live-requeue-20260809.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: checklist-recovery-live-requeue-20260809
  cancel-in-progress: false

jobs:
  requeue-live-sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://truelycollectables.com

    steps:
      - uses: actions/checkout@v4

      - name: Build exact audited recovery request
        shell: bash
        env:
          RECOVERY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('data/checklist-recovery-modern-gap-keys.txt')
          keys = [
              line.strip()
              for line in path.read_text('utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          if len(keys) != 375 or len(set(keys)) != 375:
              raise SystemExit(f'Expected 375 unique audited keys, got {len(keys)} rows / {len(set(keys))} unique')
          payload = {
              'action': 'requeue-audited-recovery',
              'githubRunId': int(os.environ['RECOVERY_RUN_ID']),
              'targetKeys': keys,
          }
          Path('/tmp/recovery-request.json').write_text(json.dumps(payload), encoding='utf-8')
          print('Prepared exact 375-target audited recovery request.')
          PY

      - name: Ask Production to requeue the physical Mac Sentinel
        shell: bash
        env:
          RECOVERY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 \
            -X POST \
            -H "content-type: application/json" \
            -H "x-tcos-github-recovery-token: $RECOVERY_TOKEN" \
            --data-binary @/tmp/recovery-request.json \
            "$SITE_URL/api/instacomp/checklist-sentinel" > /tmp/recovery-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/recovery-response.json').read_text('utf-8'))
          if payload.get('ok') is not True:
              raise SystemExit(f'Production recovery bridge rejected the campaign: {payload}')
          if int(payload.get('auditedTargetCount') or 0) != 375:
              raise SystemExit(f'Production did not certify all 375 audited targets: {payload}')
          requeued = payload.get('requeued') or {}
          if requeued.get('ok') is not True:
              raise SystemExit(f'Physical Mac requeue failed: {requeued}')
          result = requeued.get('requeue') or {}
          if int(result.get('matched') or 0) < 300:
              raise SystemExit(f'Physical Mac matched too few audited targets: {result}')
          print('Audited target count:', payload.get('auditedTargetCount'))
          print('Refresh result:', json.dumps(payload.get('refreshed') or {}, sort_keys=True))
          print('Requeue result:', json.dumps(result, sort_keys=True))
          print('Launch result:', json.dumps(requeued.get('launch') or {}, sort_keys=True))
          print('Post-requeue target counts:', json.dumps(requeued.get('targets') or {}, sort_keys=True))
          print('PASS  Live 375-target recovery campaign accepted through Production by physical Mac Sentinel.')
          PY
