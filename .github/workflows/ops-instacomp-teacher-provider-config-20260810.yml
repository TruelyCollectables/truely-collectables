name: Ops InstaComp Teacher Provider Config 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-instacomp-teacher-provider-config-20260810.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_URL: https://truelycollectables.com
    steps:
      - uses: actions/checkout@v4

      - name: Probe existing provider configuration without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

          node - <<'NODE'
          const names = {
            OPENROUTER_API_KEY: process.env.GH_OPENROUTER_API_KEY,
            CLOUDFLARE_ACCOUNT_ID: process.env.GH_CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_AUTH_TOKEN: process.env.GH_CLOUDFLARE_AUTH_TOKEN,
            CLOUDFLARE_API_TOKEN: process.env.GH_CLOUDFLARE_API_TOKEN,
          };
          console.log('GITHUB_SECRET_PRESENCE=' + JSON.stringify(
            Object.fromEntries(Object.entries(names).map(([k,v]) => [k, Boolean(String(v || '').trim())]))
          ));
          NODE

          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v2/teams?limit=100' > teams.json
          TEAM_ID=$(node - <<'NODE'
          const p=require('./teams.json');
          const team=(p.teams||[]).find(t=>t.slug==='truelycollectables-projects');
          if(!team?.id) process.exit(2);
          process.stdout.write(team.id);
          NODE
          )
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/truely-collectables?teamId=$TEAM_ID" > project.json
          PROJECT_ID=$(node - <<'NODE'
          const p=require('./project.json');
          if(!p.id) process.exit(2);
          process.stdout.write(p.id);
          NODE
          )
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID" > envs.json
          node - <<'NODE'
          const p=require('./envs.json');
          const wanted=new Set([
            'OPENROUTER_API_KEY','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_AUTH_TOKEN','CLOUDFLARE_API_TOKEN',
            'INSTACOMP_TEACHER_OPENROUTER_MODEL','INSTACOMP_TEACHER_CLOUDFLARE_MODEL'
          ]);
          const rows=(p.envs||[]).filter(e=>wanted.has(e.key)).map(e=>({key:e.key,target:e.target||[],type:e.type||null,id:Boolean(e.id)}));
          console.log('VERCEL_PROVIDER_ENV_KEYS=' + JSON.stringify(rows));
          NODE

          curl -fsS --max-time 90 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$SITE_URL/api/release/instacomp-teacher-runtime-diagnostics" > runtime.json
          node - <<'NODE'
          const p=require('./runtime.json');
          if(!p.success) throw new Error('runtime diagnostics failed');
          const c=p.configuration||{};
          console.log('PRODUCTION_TEACHER_CONFIGURATION=' + JSON.stringify({
            geminiConfigured:Boolean(c.geminiConfigured),
            groqConfigured:Boolean(c.groqConfigured),
            openRouterConfigured:Boolean(c.openRouterConfigured),
            cloudflareConfigured:Boolean(c.cloudflareConfigured),
            votingTeacherCount:Number(c.votingTeacherCount||0),
            requiredVotes:Number(c.requiredVotes||0),
            teacherConsensusOperational:Boolean(c.teacherConsensusOperational),
          }));
          NODE
