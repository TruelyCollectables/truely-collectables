name: Patch Japanese Phase 4C Energy Aliases

on:
  push:
    branches:
      - agent/pokemon-ja-phase4c-historical-product-resolver
    paths:
      - ".github/workflows/patch-pokemon-ja-phase4c-energy-aliases.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pokemon-ja-phase4c-historical-product-resolver
          fetch-depth: 0

      - name: Add exact unnumbered energy crosswalks
        run: |
          python - <<'PY'
          from pathlib import Path

          resolver = Path('scripts/resolve-pokemon-japanese-historical-products.ts')
          text = resolver.read_text()

          anchor = '''};

function usage() {'''
          insertion = '''};

const BASIC_ENERGY_NAME_BY_SOURCE_ID: Record<string, string> = {
  GRA: "基本草エネルギー",
  FIR: "基本炎エネルギー",
  WAT: "基本水エネルギー",
  LIG: "基本雷エネルギー",
  PSY: "基本超エネルギー",
  FIG: "基本闘エネルギー",
  DAR: "基本悪エネルギー",
  MET: "基本鋼エネルギー",
};
const BASIC_ENERGY_NAME_KEYS = new Set(
  Object.values(BASIC_ENERGY_NAME_BY_SOURCE_ID).map((name) =>
    canonicalNameKey(name),
  ),
);

function usage() {'''
          if 'BASIC_ENERGY_NAME_BY_SOURCE_ID' not in text:
              if anchor not in text:
                  raise SystemExit('Energy alias insertion anchor not found')
              text = text.replace(anchor, insertion, 1)

          old = '''  const unresolvedMissingNames: CandidateGroupEvaluation["unresolvedMissingNames"] = [];
  const knownNameMismatches: CandidateGroupEvaluation["knownNameMismatches"] = [];
  let sourceMatchedCards = 0;
  let resolvedMissingNames = 0;
  for (const sourceCard of params.source.sourceCards) {
    const candidates = officialByLocalId.get(sourceCard.normalizedLocalId) || [];
    if (candidates.length !== 1) {
      unresolvedMissingNames.push({
        localId: sourceCard.localId,
        sourcePath: sourceCard.sourcePath,
        candidateOfficialCardIDs: candidates.map((row) => row.cardID),
        reason: candidates.length === 0 ? "official_printed_number_missing" : "official_printed_number_duplicated",
      });
      continue;
    }
    sourceMatchedCards += 1;
    const official = candidates[0];
    if (!sourceCard.name) resolvedMissingNames += 1;
    else if (canonicalNameKey(sourceCard.name) !== canonicalNameKey(official.name)) {
      knownNameMismatches.push({
        localId: sourceCard.localId,
        sourceName: sourceCard.name,
        officialName: clean(official.name),
        officialCardID: official.cardID,
        officialUrl: official.url,
      });
    }
  }
  const sourceIds = new Set(params.source.sourceCards.map((card) => card.normalizedLocalId));
  const officialOnlyCards = comparable.filter((detail) => {
    const key = normalizedLocalId(detail.normalizedLocalId);
    return key && !sourceIds.has(key);
  });
  const sourceOnlyLocalIds = unresolvedMissingNames.map((row) => row.localId);
  const unnumberedOfficialCards = comparable.filter((detail) => !normalizedLocalId(detail.normalizedLocalId));
  const reasons: string[] = [];
  if (detailFetchFailures) reasons.push("official_detail_fetch_failed");
  if (!comparable.length) reasons.push("no_target_set_cards");
  if (sourceOnlyLocalIds.length) reasons.push("source_cards_not_crosswalked");
  if (duplicateOfficialLocalIds.length) reasons.push("duplicate_official_printed_numbers");
  if (knownNameMismatches.length) reasons.push("known_japanese_name_mismatch");
  if (unnumberedOfficialCards.length) reasons.push("unnumbered_official_cards");
  if (resolvedMissingNames !== params.source.missingJapaneseCardNames) reasons.push("missing_names_not_fully_resolved");'''
          new = '''  const unresolvedMissingNames: CandidateGroupEvaluation["unresolvedMissingNames"] = [];
  const knownNameMismatches: CandidateGroupEvaluation["knownNameMismatches"] = [];
  const unnumberedOfficialCards = comparable.filter(
    (detail) => !normalizedLocalId(detail.normalizedLocalId),
  );
  const unnumberedByName = new Map<string, OfficialDetail[]>();
  for (const detail of unnumberedOfficialCards) {
    const key = canonicalNameKey(detail.name);
    const rows = unnumberedByName.get(key) || [];
    rows.push(detail);
    unnumberedByName.set(key, rows);
  }
  const usedUnnumberedCardIDs = new Set<string>();
  let sourceMatchedCards = 0;
  let resolvedMissingNames = 0;
  for (const sourceCard of params.source.sourceCards) {
    let candidates = officialByLocalId.get(sourceCard.normalizedLocalId) || [];
    const expectedEnergyName =
      BASIC_ENERGY_NAME_BY_SOURCE_ID[sourceCard.normalizedLocalId];
    if (!candidates.length && expectedEnergyName) {
      candidates = (unnumberedByName.get(canonicalNameKey(expectedEnergyName)) || [])
        .filter((detail) => !usedUnnumberedCardIDs.has(detail.cardID));
    }
    if (candidates.length !== 1) {
      unresolvedMissingNames.push({
        localId: sourceCard.localId,
        sourcePath: sourceCard.sourcePath,
        candidateOfficialCardIDs: candidates.map((row) => row.cardID),
        reason:
          candidates.length === 0
            ? "official_printed_number_or_energy_alias_missing"
            : "official_printed_number_or_energy_alias_duplicated",
      });
      continue;
    }
    sourceMatchedCards += 1;
    const official = candidates[0];
    if (!normalizedLocalId(official.normalizedLocalId)) {
      usedUnnumberedCardIDs.add(official.cardID);
    }
    if (!sourceCard.name) resolvedMissingNames += 1;
    else if (canonicalNameKey(sourceCard.name) !== canonicalNameKey(official.name)) {
      knownNameMismatches.push({
        localId: sourceCard.localId,
        sourceName: sourceCard.name,
        officialName: clean(official.name),
        officialCardID: official.cardID,
        officialUrl: official.url,
      });
    }
  }
  const sourceIds = new Set(
    params.source.sourceCards.map((card) => card.normalizedLocalId),
  );
  const officialOnlyCards = comparable.filter((detail) => {
    const key = normalizedLocalId(detail.normalizedLocalId);
    if (key) return !sourceIds.has(key);
    return (
      BASIC_ENERGY_NAME_KEYS.has(canonicalNameKey(detail.name)) &&
      !usedUnnumberedCardIDs.has(detail.cardID)
    );
  });
  const unsupportedUnnumberedOfficialCards = unnumberedOfficialCards.filter(
    (detail) => !BASIC_ENERGY_NAME_KEYS.has(canonicalNameKey(detail.name)),
  );
  const sourceOnlyLocalIds = unresolvedMissingNames.map((row) => row.localId);
  const reasons: string[] = [];
  if (detailFetchFailures) reasons.push("official_detail_fetch_failed");
  if (!comparable.length) reasons.push("no_target_set_cards");
  if (sourceOnlyLocalIds.length) reasons.push("source_cards_not_crosswalked");
  if (duplicateOfficialLocalIds.length) reasons.push("duplicate_official_printed_numbers");
  if (knownNameMismatches.length) reasons.push("known_japanese_name_mismatch");
  if (unsupportedUnnumberedOfficialCards.length) {
    reasons.push("unsupported_unnumbered_official_cards");
  }
  if (resolvedMissingNames !== params.source.missingJapaneseCardNames) reasons.push("missing_names_not_fully_resolved");'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'usedUnnumberedCardIDs' not in text:
              raise SystemExit('Resolver evaluation block anchor not found')
          resolver.write_text(text)

          simulation = Path('scripts/run-pokemon-japanese-historical-product-resolver-simulations.ts')
          text = simulation.read_text()
          anchor = '''const alternatePopulation = evaluateCandidateGroup({'''
          addition = '''const energyAliasSource = {
  ...source,
  officialCardCount: 1,
  missingJapaneseCardNames: 1,
  sourceCards: [
    {
      localId: "GRA",
      normalizedLocalId: "GRA",
      sourcePath: "data-asia/S/SYN/GRA.ts",
      name: null,
    },
  ],
};
const unnumberedEnergy = detail({
  id: "30",
  localId: null,
  name: "基本草エネルギー",
});
const energyAlias = evaluateCandidateGroup({
  source: energyAliasSource as never,
  seed: { products: [productA], reason: "simulation_energy_alias" },
  details: [unnumberedEnergy],
});
assert.equal(energyAlias.valid, true);
assert.equal(energyAlias.sourceMatchedCards, 1);
assert.equal(energyAlias.resolvedMissingNames, 1);
assert.equal(energyAlias.officialOnlyCards.length, 0);

const energyAddition = evaluateCandidateGroup({
  source: source as never,
  seed: { products: [productA], reason: "simulation_energy_addition" },
  details: [...complete, unnumberedEnergy],
});
assert.equal(energyAddition.valid, true);
assert.equal(energyAddition.officialOnlyCards.length, 1);

const unsupportedUnnumbered = evaluateCandidateGroup({
  source: source as never,
  seed: { products: [productA], reason: "simulation_unsupported_unnumbered" },
  details: [
    ...complete,
    detail({ id: "31", localId: null, name: "番号なし特典カード" }),
  ],
});
assert.equal(unsupportedUnnumbered.valid, false);
assert.ok(
  unsupportedUnnumbered.reasons.includes(
    "unsupported_unnumbered_official_cards",
  ),
);

const alternatePopulation = evaluateCandidateGroup({'''
          if 'simulation_energy_alias' not in text:
              if anchor not in text:
                  raise SystemExit('Simulation insertion anchor not found')
              text = text.replace(anchor, addition, 1)
          text = text.replace('      assertions: 18,', '      assertions: 26,')
          simulation.write_text(text)
          PY

      - name: Commit source patch
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/resolve-pokemon-japanese-historical-products.ts \
            scripts/run-pokemon-japanese-historical-product-resolver-simulations.ts
          then
            echo "Energy aliases already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/resolve-pokemon-japanese-historical-products.ts \
            scripts/run-pokemon-japanese-historical-product-resolver-simulations.ts
          git commit -m "Resolve unnumbered Japanese energy aliases"
          git push origin HEAD:agent/pokemon-ja-phase4c-historical-product-resolver
