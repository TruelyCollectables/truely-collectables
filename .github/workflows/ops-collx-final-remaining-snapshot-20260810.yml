name: Ops CollX Final Remaining Snapshot 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-final-remaining-snapshot-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/collx-final-remaining"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-final-remaining/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Snapshot active products still missing CollX images
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { setTimeout as sleep } from 'node:timers/promises';

          function parseEnv(text) {
            const env = {};
            for (const rawLine of text.split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith('#')) continue;
              const index = line.indexOf('=');
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              env[key] = value;
            }
            return env;
          }

          const envPath = path.join(process.env.RUNNER_TEMP, 'collx-final-remaining', 'production.env');
          const env = parseEnv(fs.readFileSync(envPath, 'utf8'));
          const productionUrl = env.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) throw new Error('Production Supabase URL unavailable.');
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !token) throw new Error('Production Supabase management access unavailable.');
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;
          const storeId = '00000000-0000-4000-8000-000000000001';

          function transient(status, body) {
            return [429,500,502,503,504,522,524,544].includes(status) || /timeout|connection terminated|terminating connection|administrator command|57P01|temporar|cloudflare|network/i.test(body);
          }
          async function query(sql, label) {
            let last = '';
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              let response; let body = '';
              try {
                response = await fetch(endpoint, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ query: sql, parameters: [], read_only: true }),
                });
                body = await response.text();
              } catch (error) {
                last = String(error?.message || error);
                if (attempt === 10) throw new Error(`${label}: ${last}`);
                await sleep(Math.min(15000, 1000 * attempt));
                continue;
              }
              if (response.ok) return body ? JSON.parse(body) : [];
              last = `HTTP ${response.status}: ${body.slice(0,1000)}`;
              if (!transient(response.status, body) || attempt === 10) throw new Error(`${label}: ${last}`);
              await sleep(Math.min(15000, 1000 * attempt));
            }
            throw new Error(`${label}: ${last}`);
          }

          const rows = await query(`
            select p.id as product_id,
                   i.id as inventory_item_id,
                   p.title, p.player, p.sport, p.price, p.quantity as product_quantity,
                   p.ebay_item_id, p.image_url,
                   i.status, i.quantity as inventory_quantity,
                   coalesce(array_remove(array_agg(img.image_url order by img.sort_order, img.id), null), '{}'::text[]) as image_urls,
                   count(*) filter (where img.image_url like 'https://storage.googleapis.com/collx-product-images/%'
                                      or img.image_url like 'https://storage.googleapis.com/collx-user-cards/%') as collx_image_count
            from public.products p
            join public.inventory_items i
              on i.legacy_product_id = p.id
             and i.store_id = '${storeId}'::uuid
            left join public.inventory_images img on img.inventory_item_id = i.id
            where p.store_id = '${storeId}'::uuid
              and i.status = 'active'
              and coalesce(i.quantity, 0) > 0
              and p.archived_at is null
              and coalesce(p.quantity, 0) > 0
              and coalesce(p.price, 0) > 0
              and nullif(btrim(coalesce(p.ebay_item_id, '')), '') is not null
            group by p.id, i.id, p.title, p.player, p.sport, p.price, p.quantity, p.ebay_item_id, p.image_url, i.status, i.quantity
            having count(*) filter (where img.image_url like 'https://storage.googleapis.com/collx-product-images/%'
                                      or img.image_url like 'https://storage.googleapis.com/collx-user-cards/%') = 0
            order by p.id;
          `, 'remaining snapshot');

          const out = {
            generated_at: new Date().toISOString(),
            count: rows.length,
            rows,
          };
          const outPath = path.join(process.env.RUNNER_TEMP, 'collx-final-remaining', 'remaining.json');
          fs.writeFileSync(outPath, JSON.stringify(out, null, 2));
          console.log(JSON.stringify({ remaining: rows.length }));
          NODE
          rm -f "$RUNNER_TEMP/collx-final-remaining/production.env"

      - name: Upload remaining snapshot
        uses: actions/upload-artifact@v4
        with:
          name: collx-final-remaining-snapshot
          path: ${{ runner.temp }}/collx-final-remaining/remaining.json
          retention-days: 1
          if-no-files-found: error
