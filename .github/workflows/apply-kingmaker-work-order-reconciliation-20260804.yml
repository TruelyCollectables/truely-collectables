name: Apply KINGMAKER Work Order Reconciliation 20260804

on:
  pull_request:
    paths:
      - ".github/workflows/apply-kingmaker-work-order-reconciliation-20260804.yml"

permissions:
  contents: read

jobs:
  apply-refresh-reconcile-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: Production

    env:
      EXPECTED_MAIN_SHA: 66cda0f561b82863956676c8cad2d035ca8c94c4
      EXPECTED_BRANCH: ops/apply-kingmaker-work-order-reconciliation-20260804
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RECEIPT_PATH: evidence/kingmaker-work-order-reconciliation-production-20260804/receipt.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/apply-kingmaker-work-order-reconciliation-20260804
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/apply-kingmaker-work-order-reconciliation-20260804.yml'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          git checkout --detach "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/work-order-reconciliation-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/work-order-reconciliation-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/work-order-reconciliation-production/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/work-order-reconciliation-production/production.env" >> "$GITHUB_ENV"

      - name: Apply reconciliation, refresh coverage, and deploy Production
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const { mkdirSync, readFileSync, writeFileSync } = require("node:fs");
          const { dirname, resolve } = require("node:path");

          const migrationPath =
            "supabase/migrations/20260804070000_private_pricing_work_order_reconciliation.sql";
          const receiptPath = resolve(process.env.RECEIPT_PATH);
          const managementToken = process.env.GH_SUPABASE_ACCESS_TOKEN;
          const envFile = process.env.PRODUCTION_ENV_FILE;

          function parseEnv(contents) {
            const parsed = {};
            for (const raw of String(contents || "").split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith("#")) continue;
              const index = line.indexOf("=");
              if (index < 1) continue;
              const key = line.slice(0, index).trim().replace(/^export\s+/, "");
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }

          function projectRef(url) {
            const match = String(url || "").match(/^https:\/\/([a-z0-9]+)\.supabase\.co\/?$/i);
            if (!match) throw new Error("Production database URL was not resolved.");
            return match[1];
          }

          function firstRow(result) {
            return Array.isArray(result) ? result[0] || {} : result || {};
          }

          function firstValue(result) {
            return Object.values(firstRow(result))[0];
          }

          function asObject(value, label) {
            if (value && typeof value === "object" && !Array.isArray(value)) return value;
            if (typeof value === "string") {
              const parsed = JSON.parse(value);
              if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
            }
            throw new Error(`${label} did not return a JSON object.`);
          }

          function numeric(row, field) {
            const value = Number(row?.[field] ?? 0);
            if (!Number.isFinite(value)) throw new Error(`Invalid numeric field ${field}.`);
            return value;
          }

          async function managementQuery(project, query, readOnly, stage) {
            const response = await fetch(
              `https://api.supabase.com/v1/projects/${project}/database/query`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${managementToken}`,
                  "Content-Type": "application/json",
                  Accept: "application/json",
                },
                body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
                signal: AbortSignal.timeout(119000),
              },
            );
            const text = await response.text();
            if (!response.ok) {
              throw new Error(
                `Production ${stage} failed with HTTP ${response.status}: ${text.slice(0, 800)}`,
              );
            }
            return text ? JSON.parse(text) : [];
          }

          function vercel(args) {
            const result = spawnSync(
              "npx",
              [
                "vercel@56.2.0",
                ...args,
                "--scope",
                process.env.VERCEL_SCOPE,
                "--token",
                process.env.VERCEL_TOKEN,
              ],
              {
                cwd: process.cwd(),
                encoding: "utf8",
                maxBuffer: 30 * 1024 * 1024,
              },
            );
            if (result.error || result.status !== 0) {
              const diagnostics = `${result.stdout || ""}\n${result.stderr || ""}`
                .replace(/(?:eyJ|sb_secret_)[A-Za-z0-9._-]{20,}/g, "[masked]")
                .replace(/[A-Za-z0-9_-]{60,}/g, "[masked]")
                .slice(0, 1000);
              throw new Error(`Vercel command failed: ${diagnostics}`);
            }
          }

          function protectedStatsSql() {
            return `
              select
                count(*)::bigint as total_rows,
                count(*) filter (where identity_match_status = 'exact')::bigint as exact_rows,
                count(*) filter (where identity_match_status = 'ambiguous')::bigint as ambiguous_rows,
                count(*) filter (where identity_match_status = 'unmatched')::bigint as unmatched_rows,
                count(*) filter (where identity_match_status = 'not_applicable')::bigint as not_applicable_rows,
                count(*) filter (
                  where low_observation_id is not null or high_observation_id is not null
                )::bigint as linked_observation_rows,
                (select count(*) from public.tcos_kingmaker_observations)::bigint as observation_rows
              from public.tcos_kingmaker_price_entries;
            `;
          }

          function workOrderStatsSql() {
            return `
              select
                count(*)::bigint as total_rows,
                count(*) filter (where status = 'queued')::bigint as queued_rows,
                count(*) filter (where status = 'in_progress')::bigint as in_progress_rows,
                count(*) filter (where status = 'blocked')::bigint as blocked_rows,
                count(*) filter (where status = 'resolved')::bigint as resolved_rows,
                count(*) filter (where status = 'completed')::bigint as completed_rows,
                count(*) filter (where status = 'dismissed')::bigint as dismissed_rows,
                md5(coalesce(string_agg(
                  attack_key || ':' || md5(notes),
                  '|' order by attack_key
                ), '')) as private_note_digest,
                (select count(*) from public.tcos_kingmaker_private_pricing_work_order_audit
                  where actor_type = 'system')::bigint as system_audit_rows,
                (select count(*) from public.tcos_kingmaker_private_pricing_work_order_audit
                  where actor_type = 'system' and action = 'auto_resolved')::bigint
                  as system_auto_resolved_rows,
                (select count(*) from public.tcos_kingmaker_private_pricing_work_order_audit
                  where actor_type = 'system' and action = 'auto_reopened')::bigint
                  as system_auto_reopened_rows
              from public.tcos_kingmaker_private_pricing_work_orders;
            `;
          }

          function verificationSql() {
            return `
              select
                to_regprocedure('public.tcos_reconcile_kingmaker_private_pricing_work_orders()') is not null as reconcile_rpc_present,
                to_regprocedure('public.tcos_reconcile_private_pricing_work_orders_after_refresh()') is not null as trigger_function_present,
                exists (
                  select 1 from pg_trigger
                  where tgrelid = 'public.tcos_kingmaker_private_pricing_attack_state'::regclass
                    and tgname = 'tcos_private_pricing_work_orders_reconcile_after_refresh'
                    and tgenabled <> 'D'
                    and not tgisinternal
                ) as refresh_trigger_enabled,
                exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'tcos_kingmaker_private_pricing_work_orders'
                    and column_name = 'resolved_at'
                ) as resolved_at_present,
                exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'tcos_kingmaker_private_pricing_work_orders'
                    and column_name = 'reopened_at'
                ) as reopened_at_present,
                exists (
                  select 1 from information_schema.columns
                  where table_schema = 'public'
                    and table_name = 'tcos_kingmaker_private_pricing_work_orders'
                    and column_name = 'resolution_cycle'
                ) as resolution_cycle_present,
                exists (
                  select 1 from pg_constraint
                  where conrelid = 'public.tcos_kingmaker_private_pricing_work_orders'::regclass
                    and conname = 'tcos_km_work_order_status_check'
                    and pg_get_constraintdef(oid) like '%resolved%'
                ) as resolved_status_allowed,
                exists (
                  select 1 from pg_constraint
                  where conrelid = 'public.tcos_kingmaker_private_pricing_work_order_audit'::regclass
                    and conname = 'tcos_km_work_order_audit_action_check'
                    and pg_get_constraintdef(oid) like '%auto_resolved%'
                    and pg_get_constraintdef(oid) like '%auto_reopened%'
                ) as system_actions_allowed,
                exists (
                  select 1 from pg_constraint
                  where conrelid = 'public.tcos_kingmaker_private_pricing_work_order_audit'::regclass
                    and conname = 'tcos_km_work_order_audit_actor_check'
                    and pg_get_constraintdef(oid) like '%system%'
                ) as system_actor_allowed,
                not has_function_privilege('anon','public.tcos_reconcile_kingmaker_private_pricing_work_orders()','execute') as anon_reconcile_revoked,
                not has_function_privilege('authenticated','public.tcos_reconcile_kingmaker_private_pricing_work_orders()','execute') as authenticated_reconcile_revoked,
                has_function_privilege('service_role','public.tcos_reconcile_kingmaker_private_pricing_work_orders()','execute') as service_reconcile_granted;
            `;
          }

          function baseRefreshSql() {
            return `
              set statement_timeout = '110s';
              set role service_role;
              select public.tcos_refresh_kingmaker_private_pricing_coverage_snapshot(true) as result;
            `;
          }

          function attackRefreshSql() {
            return `
              set statement_timeout = '40s';
              set role service_role;
              select public.tcos_refresh_kingmaker_private_pricing_attack_queue(true) as result;
            `;
          }

          function reportSql() {
            return `
              set statement_timeout = '15s';
              set role service_role;
              select public.tcos_kingmaker_private_pricing_work_orders_report(
                100,
                0,
                null,
                null
              ) as result;
            `;
          }

          function assertSanitized(value) {
            const serialized = JSON.stringify(value).toLowerCase();
            for (const forbidden of [
              "raw_text",
              "original_filename",
              "source_sha256",
              "source_storage_bucket",
              "source_storage_object_path",
              "storage_object_path",
              "value_low",
              "value_high",
              "low_observation_id",
              "high_observation_id",
              "attackkey",
              "notes",
            ]) {
              if (serialized.includes(forbidden)) {
                throw new Error(`Sanitized receipt contained prohibited field ${forbidden}.`);
              }
            }
          }

          function publicWorkStats(row) {
            return {
              total: numeric(row, "total_rows"),
              queued: numeric(row, "queued_rows"),
              inProgress: numeric(row, "in_progress_rows"),
              blocked: numeric(row, "blocked_rows"),
              resolved: numeric(row, "resolved_rows"),
              completed: numeric(row, "completed_rows"),
              dismissed: numeric(row, "dismissed_rows"),
              systemAuditRows: numeric(row, "system_audit_rows"),
              systemAutoResolvedRows: numeric(row, "system_auto_resolved_rows"),
              systemAutoReopenedRows: numeric(row, "system_auto_reopened_rows"),
            };
          }

          async function main() {
            if (!managementToken || !envFile || !process.env.VERCEL_TOKEN) {
              throw new Error("Protected Production credentials are required.");
            }
            console.log(`::add-mask::${managementToken}`);

            const productionEnv = parseEnv(readFileSync(envFile, "utf8"));
            const productionUrl =
              productionEnv.NEXT_PUBLIC_SUPABASE_URL || productionEnv.SUPABASE_URL;
            const project = projectRef(productionUrl);

            const protectedBefore = firstRow(
              await managementQuery(project, protectedStatsSql(), true, "pre-apply protected statistics"),
            );
            const workBefore = firstRow(
              await managementQuery(project, workOrderStatsSql(), true, "pre-apply work-order statistics"),
            );

            const migrationSql = readFileSync(migrationPath, "utf8");
            await managementQuery(project, migrationSql, false, "reconciliation migration");

            const verification = firstRow(
              await managementQuery(project, verificationSql(), true, "reconciliation verification"),
            );
            for (const [field, value] of Object.entries(verification)) {
              if (value !== true) throw new Error(`Production verification failed: ${field}.`);
            }

            const baseRefresh = asObject(
              firstValue(await managementQuery(project, baseRefreshSql(), false, "base coverage refresh")),
              "Base coverage refresh",
            );
            if (baseRefresh.status !== "succeeded" || baseRefresh.refreshed !== true) {
              throw new Error(`Base coverage refresh returned ${String(baseRefresh.status || "unknown")}.`);
            }

            const attackRefresh = asObject(
              firstValue(await managementQuery(project, attackRefreshSql(), false, "attack queue refresh and reconciliation")),
              "Attack queue refresh",
            );
            if (attackRefresh.status !== "succeeded" || attackRefresh.refreshed !== true) {
              throw new Error(`Attack queue refresh returned ${String(attackRefresh.status || "unknown")}.`);
            }

            const workAfter = firstRow(
              await managementQuery(project, workOrderStatsSql(), true, "post-reconciliation work-order statistics"),
            );
            const protectedAfter = firstRow(
              await managementQuery(project, protectedStatsSql(), true, "post-reconciliation protected statistics"),
            );

            if (numeric(workAfter, "total_rows") !== numeric(workBefore, "total_rows")) {
              throw new Error("Reconciliation changed the total number of work orders.");
            }
            if (workAfter.private_note_digest !== workBefore.private_note_digest) {
              throw new Error("Reconciliation changed private operator notes.");
            }
            if (numeric(workAfter, "completed_rows") !== numeric(workBefore, "completed_rows")) {
              throw new Error("Reconciliation changed manually completed work.");
            }
            if (numeric(workAfter, "dismissed_rows") !== numeric(workBefore, "dismissed_rows")) {
              throw new Error("Reconciliation changed manually dismissed work.");
            }

            const autoResolved =
              numeric(workAfter, "system_auto_resolved_rows") -
              numeric(workBefore, "system_auto_resolved_rows");
            const autoReopened =
              numeric(workAfter, "system_auto_reopened_rows") -
              numeric(workBefore, "system_auto_reopened_rows");
            const systemAuditDelta =
              numeric(workAfter, "system_audit_rows") -
              numeric(workBefore, "system_audit_rows");

            if (autoResolved < 0 || autoReopened < 0 || systemAuditDelta < 0) {
              throw new Error("System reconciliation audit counts moved backward.");
            }
            if (systemAuditDelta !== autoResolved + autoReopened) {
              throw new Error("System reconciliation audit totals do not reconcile.");
            }

            const openBefore =
              numeric(workBefore, "queued_rows") +
              numeric(workBefore, "in_progress_rows") +
              numeric(workBefore, "blocked_rows");
            const openAfter =
              numeric(workAfter, "queued_rows") +
              numeric(workAfter, "in_progress_rows") +
              numeric(workAfter, "blocked_rows");
            if (openAfter !== openBefore - autoResolved + autoReopened) {
              throw new Error("Open work-order totals do not reconcile to automatic transitions.");
            }
            if (
              numeric(workAfter, "resolved_rows") !==
              numeric(workBefore, "resolved_rows") + autoResolved - autoReopened
            ) {
              throw new Error("Resolved work-order totals do not reconcile to automatic transitions.");
            }

            for (const field of [
              "total_rows",
              "exact_rows",
              "ambiguous_rows",
              "unmatched_rows",
              "not_applicable_rows",
              "linked_observation_rows",
              "observation_rows",
            ]) {
              if (numeric(protectedAfter, field) !== numeric(protectedBefore, field)) {
                throw new Error(`Reconciliation rollout changed protected field ${field}.`);
              }
            }

            const report = asObject(
              firstValue(await managementQuery(project, reportSql(), false, "work-order report")),
              "Work-order report",
            );
            if (report.boundary !== "private_coverage_work_orders_only") {
              throw new Error("Work-order report boundary verification failed.");
            }

            vercel(["deploy", "--prod", "--yes", "--force"]);

            const receipt = {
              schema: "tcos.kingmaker.workOrderReconciliationProductionReceipt.v1",
              status: "passed",
              generatedAt: new Date().toISOString(),
              deployedCommit: process.env.EXPECTED_MAIN_SHA,
              migration: {
                path: migrationPath,
                sha256: createHash("sha256").update(migrationSql).digest("hex"),
              },
              verification,
              baseRefresh: {
                status: baseRefresh.status,
                refreshed: baseRefresh.refreshed,
                durationMs: Number(baseRefresh.durationMs || 0),
                groups: Number(baseRefresh.totalGroups || 0),
              },
              attackRefresh: {
                status: attackRefresh.status,
                refreshed: attackRefresh.refreshed,
                durationMs: Number(attackRefresh.durationMs || 0),
                groups: Number(attackRefresh.totalGroups || 0),
              },
              reconciliation: {
                automaticallyResolved: autoResolved,
                automaticallyReopened: autoReopened,
                systemAuditDelta,
                privateNotesUnchanged: true,
                manualCompletedUnchanged: true,
                manualDismissedUnchanged: true,
              },
              workOrdersBefore: publicWorkStats(workBefore),
              workOrdersAfter: publicWorkStats(workAfter),
              report: {
                boundary: report.boundary,
                generatedAt: report.generatedAt,
                summary: report.summary,
                pagination: report.pagination,
              },
              protectedBefore: {
                totalRows: numeric(protectedBefore, "total_rows"),
                exact: numeric(protectedBefore, "exact_rows"),
                ambiguous: numeric(protectedBefore, "ambiguous_rows"),
                unmatched: numeric(protectedBefore, "unmatched_rows"),
                notApplicable: numeric(protectedBefore, "not_applicable_rows"),
                linkedObservationRows: numeric(protectedBefore, "linked_observation_rows"),
                observationRows: numeric(protectedBefore, "observation_rows"),
              },
              protectedAfter: {
                totalRows: numeric(protectedAfter, "total_rows"),
                exact: numeric(protectedAfter, "exact_rows"),
                ambiguous: numeric(protectedAfter, "ambiguous_rows"),
                unmatched: numeric(protectedAfter, "unmatched_rows"),
                notApplicable: numeric(protectedAfter, "not_applicable_rows"),
                linkedObservationRows: numeric(protectedAfter, "linked_observation_rows"),
                observationRows: numeric(protectedAfter, "observation_rows"),
              },
              productionDeploymentCompleted: true,
              pricesPromotedByThisOperation: 0,
              secretsPersisted: false,
            };

            assertSanitized(receipt);
            mkdirSync(dirname(receiptPath), { recursive: true });
            writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(
              `Work-order reconciliation passed: ${autoResolved} resolved, ${autoReopened} reopened, and zero pricing mutation.`,
            );
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Require sanitized Production receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT_PATH"
          node - <<'NODE'
          const receipt = require(`./${process.env.RECEIPT_PATH}`);
          if (
            receipt.status !== "passed" ||
            receipt.baseRefresh?.status !== "succeeded" ||
            receipt.attackRefresh?.status !== "succeeded" ||
            receipt.reconciliation?.privateNotesUnchanged !== true ||
            receipt.reconciliation?.manualCompletedUnchanged !== true ||
            receipt.reconciliation?.manualDismissedUnchanged !== true ||
            receipt.productionDeploymentCompleted !== true ||
            receipt.pricesPromotedByThisOperation !== 0 ||
            receipt.secretsPersisted !== false
          ) {
            process.exit(1);
          }
          NODE

      - name: Upload sanitized Production receipt
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-work-order-reconciliation-production-20260804
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30
