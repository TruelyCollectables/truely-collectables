name: Validate Post-Sale eBay Quantity Safety 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-post-sale-outbox-safety-20260729.yml"
      - "scripts/apply-post-sale-outbox-safety-20260729.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-post-sale-ebay-quantity-safety-20260729
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
  ADMIN_SESSION_SECRET: build-only-placeholder-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-only-placeholder-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_only_placeholder
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
  EBAY_CLIENT_ID: build-only-placeholder-client-id
  EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out safety branch
        uses: actions/checkout@v4
        with:
          ref: fix/launch-money-inventory-safety-20260729
          fetch-depth: 0

      - name: Fetch reviewed audit source
        run: git fetch origin pull/142/head:refs/remotes/origin/pr142

      - name: Apply post-sale safety patch
        run: node scripts/apply-post-sale-outbox-safety-20260729.mjs

      - name: Remove one-time writer and workflow
        run: |
          rm -f scripts/apply-post-sale-outbox-safety-20260729.mjs
          rm -f .github/workflows/validate-post-sale-outbox-safety-20260729.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Format changed TypeScript and JSON
        run: npx prettier --write package.json scripts/run-post-sale-ebay-sync-simulations.ts src/lib/ebay-quantity-sync-safety.ts src/lib/ebay-quantity-sync-outbox.ts src/lib/order-notifications.ts src/app/api/cron/ebay-store-fixed-price-sync/route.ts

      - name: Validate SQL transaction and schema contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20260726233000_post_sale_ebay_quantity_sync_outbox.sql \
            supabase/migrations/20260727142000_harden_post_sale_outbox_constraints.sql \
            supabase/migrations/20260727143000_order_notification_retry_backoff.sql
          do
            grep -Eiq '^begin;' "$file"
            grep -Eiq '^commit;' "$file"
          done

      - name: Run focused post-sale regression
        run: npm run simulate:post-sale-ebay-sync

      - name: Run checkout and webhook regressions
        run: |
          node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts
          node --import tsx scripts/run-order-notification-hardening-simulations.ts
          node scripts/run-ebay-import-admin-client-simulations.ts

      - name: Run migration coverage
        run: node scripts/run-launch-database-migration-coverage.mjs

      - name: Run targeted ESLint
        run: npx eslint src/lib/ebay-quantity-sync-safety.ts src/lib/ebay-quantity-sync-outbox.ts src/lib/order-notifications.ts src/app/api/cron/ebay-store-fixed-price-sync/route.ts scripts/run-post-sale-ebay-sync-simulations.ts

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run full production build
        run: npm run build

      - name: Confirm clean source-only patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/apply-post-sale-outbox-safety-20260729.mjs
          test ! -e .github/workflows/validate-post-sale-outbox-safety-20260729.yml
          git status --short

      - name: Commit validated safety patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Audit"
          git config user.email "audit@truelycollectables.com"
          git add package.json scripts/run-post-sale-ebay-sync-simulations.ts src/lib/ebay-quantity-sync-safety.ts src/lib/ebay-quantity-sync-outbox.ts src/lib/order-notifications.ts src/app/api/cron/ebay-store-fixed-price-sync/route.ts supabase/migrations/20260726233000_post_sale_ebay_quantity_sync_outbox.sql supabase/migrations/20260727142000_harden_post_sale_outbox_constraints.sql supabase/migrations/20260727143000_order_notification_retry_backoff.sql scripts/apply-post-sale-outbox-safety-20260729.mjs .github/workflows/validate-post-sale-outbox-safety-20260729.yml
          git commit -m "Prevent post-sale eBay quantity resurrection"
          git push origin HEAD:fix/launch-money-inventory-safety-20260729
