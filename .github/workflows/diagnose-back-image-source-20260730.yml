name: Diagnose Back Image Source 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-back-image-source-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-back-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/diagnose-gallery-render-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Production environment and retrieve server key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/back-source"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/back-source/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const workDir = path.join(process.env.RUNNER_TEMP, 'back-source');
          const text = fs.readFileSync(path.join(workDir, 'production.env'), 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const url = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!url) throw new Error('Production Supabase URL missing.');
          const projectRef = new URL(url).hostname.split('.')[0];
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` } },
          );
          const body = await response.text();
          if (!response.ok) throw new Error(`Key retrieval failed: HTTP ${response.status}: ${body.slice(0, 500)}`);
          const keys = JSON.parse(body);
          const elevated = keys.find((entry) => typeof entry?.api_key === 'string' && entry.api_key.startsWith('sb_secret_'))
            || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase().includes('service'));
          if (!elevated?.api_key) throw new Error('No elevated key returned.');
          console.log('::add-mask::' + elevated.api_key);
          fs.writeFileSync(path.join(workDir, 'service-key'), elevated.api_key, { mode: 0o600 });
          NODE

      - name: Inspect metadata and probe likely CollX back URLs
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/back-source/service-key")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
            node --env-file="$RUNNER_TEMP/back-source/production.env" --import tsx --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          import { getActiveStoreId } from './src/lib/stores.ts';

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { autoRefreshToken: false, persistSession: false } },
          );
          const storeId = getActiveStoreId();

          function collectUrls(value, path = '$', out = []) {
            if (typeof value === 'string' && /^https?:\/\//i.test(value.trim())) {
              out.push({ path, url: value.trim() });
            } else if (Array.isArray(value)) {
              value.forEach((entry, index) => collectUrls(entry, `${path}[${index}]`, out));
            } else if (value && typeof value === 'object') {
              for (const [key, entry] of Object.entries(value)) collectUrls(entry, `${path}.${key}`, out);
            }
            return out;
          }

          async function probe(url) {
            try {
              const response = await fetch(url, {
                method: 'HEAD',
                redirect: 'follow',
                signal: AbortSignal.timeout(15000),
              });
              return { url, status: response.status, contentType: response.headers.get('content-type'), length: response.headers.get('content-length') };
            } catch (error) {
              return { url, error: error instanceof Error ? error.message : String(error) };
            }
          }

          for (const productId of [2135, 2080, 2052, 2411, 2122]) {
            const { data: item, error: itemError } = await supabase
              .from('inventory_items')
              .select('id,legacy_product_id,title,metadata,notes,description')
              .eq('store_id', storeId)
              .eq('legacy_product_id', productId)
              .order('updated_at', { ascending: false })
              .limit(1)
              .single();
            if (itemError) throw itemError;
            const { data: images, error: imageError } = await supabase
              .from('inventory_images')
              .select('image_url,sort_order,alt_text')
              .eq('inventory_item_id', item.id)
              .order('sort_order', { ascending: true });
            if (imageError) throw imageError;
            const metadataUrls = collectUrls(item.metadata || {});
            const currentUrls = (images || []).map((row) => row.image_url);
            const guesses = new Set();
            for (const url of [...currentUrls, ...metadataUrls.map((entry) => entry.url)]) {
              if (/-front(?=\.[a-z]+(?:\?|$))/i.test(url)) guesses.add(url.replace(/-front(?=\.[a-z]+(?:\?|$))/i, '-back'));
              if (/\/front(?=\.[a-z]+(?:\?|$))/i.test(url)) guesses.add(url.replace(/\/front(?=\.[a-z]+(?:\?|$))/i, '/back'));
              if (/_front(?=\.[a-z]+(?:\?|$))/i.test(url)) guesses.add(url.replace(/_front(?=\.[a-z]+(?:\?|$))/i, '_back'));
            }
            const probes = await Promise.all(Array.from(guesses).map(probe));
            console.log(JSON.stringify({
              productId,
              inventoryItemId: item.id,
              metadata: item.metadata,
              metadataUrls,
              imageRows: images,
              guessedBackProbes: probes,
            }, null, 2));
          }

          const { data: backRows, error: backError } = await supabase
            .from('inventory_images')
            .select('inventory_item_id,image_url,sort_order,alt_text')
            .or('image_url.ilike.%back%,alt_text.ilike.%back%')
            .limit(1000);
          if (backError) throw backError;
          const actualBackUrlRows = (backRows || []).filter((row) => /back/i.test(String(row.image_url || '')));
          console.log(JSON.stringify({
            backLabeledRowsSampleCount: (backRows || []).length,
            urlActuallyContainsBackCount: actualBackUrlRows.length,
            actualBackUrlSamples: actualBackUrlRows.slice(0, 25),
          }, null, 2));
          NODE

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/back-source"
