name: KINGMAKER Pricing Profiles

on:
  pull_request:
    paths:
      - "src/lib/kingmaker-pricing-profile.ts"
      - "src/app/api/instacomp/pricing/profiles/route.ts"
      - "scripts/run-kingmaker-pricing-profile-regressions.ts"
      - "supabase/migrations/20260803190000_kingmaker_pricing_profiles.sql"
      - ".github/workflows/kingmaker-pricing-profiles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pricing-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pricing profile regressions
        run: node --import tsx scripts/run-kingmaker-pricing-profile-regressions.ts
      - name: Privacy and ownership contracts
        run: |
          set -euo pipefail
          grep -q 'enable row level security' supabase/migrations/20260803190000_kingmaker_pricing_profiles.sql
          grep -q 'revoke all.*anon, authenticated' supabase/migrations/20260803190000_kingmaker_pricing_profiles.sql
          grep -q 'seller_account_id' src/app/api/instacomp/pricing/profiles/route.ts
          grep -q 'sourceDisclosure: null' src/app/api/instacomp/pricing/profiles/route.ts
          ! grep -RIni 'beckett' src/lib/kingmaker-pricing-profile.ts src/app/api/instacomp/pricing/profiles/route.ts scripts/run-kingmaker-pricing-profile-regressions.ts supabase/migrations/20260803190000_kingmaker_pricing_profiles.sql
      - name: Lint
        run: npx eslint src/lib/kingmaker-pricing-profile.ts src/app/api/instacomp/pricing/profiles/route.ts scripts/run-kingmaker-pricing-profile-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder-admin-session
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
