name: Patch Final Certificate Gitleaks Baseline 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-final-certificate-gitleaks-baseline-20260729.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/launch-2-final-certificate-ad575-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/launch-2-final-certificate-ad575-20260729
          fetch-depth: 0
      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ad5758557e14f10ae9294a4a8de4dd69d188b58d"
          test "$(git hash-object .github/workflows/launch-2-final-certificate-ad575-20260729.yml)" = "39838788716f885b6f55156955749d1946f47c84"
      - name: Patch exact Gitleaks classification block
        shell: bash
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
        run: |
          set -euo pipefail
          python -c 'import os,base64; from pathlib import Path; p=Path(".github/workflows/launch-2-final-certificate-ad575-20260729.yml"); t=p.read_text(); old=base64.b64decode(os.environ["OLD_BLOCK_B64"]).decode(); new=base64.b64decode(os.environ["NEW_BLOCK_B64"]).decode(); assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1))'
          git diff --check
          grep -Fq 'gitleaks-classification.json' .github/workflows/launch-2-final-certificate-ad575-20260729.yml
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/launch-2-final-certificate-ad575-20260729.yml"); puts "Final certificate YAML parsed."'
      - name: Stage validated workflow as ordinary data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certificate-staging
          cp .github/workflows/launch-2-final-certificate-ad575-20260729.yml certificate-staging/launch-2-final-certificate-ad575-20260729.yml
          sha256sum certificate-staging/launch-2-final-certificate-ad575-20260729.yml > certificate-staging/launch-2-final-certificate-ad575-20260729.sha256
          git checkout -- .github/workflows/launch-2-final-certificate-ad575-20260729.yml
          git diff --quiet
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add certificate-staging/launch-2-final-certificate-ad575-20260729.yml certificate-staging/launch-2-final-certificate-ad575-20260729.sha256
          git commit -m "Stage exact Gitleaks false-positive baseline"
          git push origin HEAD:ops/launch-2-final-certificate-ad575-20260729
