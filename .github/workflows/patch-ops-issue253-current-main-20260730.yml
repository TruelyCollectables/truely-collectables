name: Patch Ops Issue 253 Current Main 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-ops-issue253-current-main-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/launch2-issue253-production-apply-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/launch2-issue253-production-apply-20260730
          fetch-depth: 0

      - name: Patch exact current main guard and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "eff61e573154f4ad2ccc05eae0fe3fa542e94a95"
          target=.github/workflows/ops-launch2-issue253-production-apply-20260730.yml
          test "$(git hash-object "$target")" = "a20cda41d0a01690d02443c6418f3cabcdf9e05b"
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ops-launch2-issue253-production-apply-20260730.yml')
          text = path.read_text()
          old = 'EXPECTED_MAIN_SHA: 11b95609b4af979283c1d72cf1019f1bc0e9fc85'
          new = 'EXPECTED_MAIN_SHA: eff61e573154f4ad2ccc05eae0fe3fa542e94a95'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old SHA guard, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/patch-ops-issue253-current-main-20260730.yml
          git diff --check
          grep -Fq 'EXPECTED_MAIN_SHA: eff61e573154f4ad2ccc05eae0fe3fa542e94a95' "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "Pin issue 253 Production apply to exact current main"
          git push origin HEAD:ops/launch2-issue253-production-apply-20260730
