name: Deal Hunter regression test

on:
  push:
    branches:
      - agent/fix-deal-hunter-test-runner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install InstaComp dependencies
        working-directory: services/instacomp-ai
        run: python -m pip install -r requirements.txt
      - name: Compile guarded learning path
        working-directory: services/instacomp-ai
        run: |
          python -m py_compile \
            scripts/sync_all_inventory_training_truth_snapshot_only.py \
            scripts/sync_all_inventory_training_truth_v3.py \
            scripts/train_lora_full_inventory.py \
            scripts/finish_deal_hunter_ai_learning.py \
            tests/test_inventory_learning_completion.py
      - name: Run exact direct regression command
        working-directory: services/instacomp-ai
        run: python tests/test_inventory_learning_completion.py -v
      - name: Run unittest discovery too
        working-directory: services/instacomp-ai
        run: python -m unittest discover -s tests -p 'test_inventory_learning_completion.py' -v
