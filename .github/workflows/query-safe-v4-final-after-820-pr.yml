name: Query Safe v4 Final After 820

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/query-safe-v4-final-after-820-pr.yml"

permissions:
  contents: read
  actions: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query latest non-PR safe-v4-final run and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(--header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")
          curl --silent --show-error --fail "${auth[@]}" "$base/actions/workflows/ingest-full-master-checklist-archive-safe-v4-final.yml/runs?branch=main&per_page=20" > "$RUNNER_TEMP/runs.json"
          run_id=$(jq -r '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty' "$RUNNER_TEMP/runs.json")
          test -n "$run_id"
          curl --silent --show-error --fail "${auth[@]}" "$base/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -n \
            --slurpfile runs "$RUNNER_TEMP/runs.json" \
            --slurpfile jobs "$RUNNER_TEMP/jobs.json" \
            '{
              schema:"tcos.checklist.safeV4FinalPost521RetryObserver.v1",
              checkedAt:(now|todateiso8601),
              run:([ $runs[0].workflow_runs[] | select(.event != "pull_request") ][0] | {name,id,run_number,event,status,conclusion,head_branch,head_sha,created_at,updated_at,html_url}),
              jobs:($jobs[0].jobs | map({id,name,status,conclusion,started_at,completed_at,steps:(.steps // [] | map({name,status,conclusion,number}))}))
            }'
