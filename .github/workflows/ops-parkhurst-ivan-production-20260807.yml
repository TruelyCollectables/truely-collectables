name: Ops Parkhurst Ivan Production Repair 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-parkhurst-ivan-production-20260807.yml"
      - "src/lib/checklist-registry/upper-deck-2025-26-normalized-html.ts"
  push:
    branches:
      - ops/parkhurst-ivan-production-20260807
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  TEMP_DIR: /tmp/parkhurst-ivan-production-20260807

jobs:
  import-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/parkhurst-ivan-production-20260807
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve Production Registry credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMP_DIR"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$TEMP_DIR/production.env"
          runtime_file="$TEMP_DIR/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node - <<'NODE'
          const fs=require('node:fs'); const parsed={};
          for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)){
            const line=raw.trim(); if(!line||line.startsWith('#'))continue;
            const i=line.indexOf('='); if(i<1)continue;
            const k=line.slice(0,i).trim(); let v=line.slice(i+1).trim();
            if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}} parsed[k]=v;
          }
          (async()=>{
            const u=String(parsed.NEXT_PUBLIC_SUPABASE_URL||'').trim(); if(!u)throw Error('Missing Production Supabase URL');
            const ref=new URL(u).hostname.split('.')[0];
            const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});
            const text=await r.text(); if(!r.ok)throw Error(`Supabase key lookup HTTP ${r.status}`);
            const keys=text?JSON.parse(text):[]; const val=e=>String(e?.api_key||e?.key||e?.value||'');
            const modern=keys.find(e=>/^sb_secret_/i.test(val(e)));
            const legacy=keys.find(e=>e?.name==='service_role'&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==='service_role'&&/^eyJ/.test(val(e)));
            const key=val(modern||legacy); if(!key)throw Error('No Production server key');
            console.log(`::add-mask::${u}`); console.log(`::add-mask::${key}`);
            fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(u)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(key)}\nexport SUPABASE_PROJECT_REF=${JSON.stringify(ref)}\n`,{mode:0o600});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Repair live Registry taxonomy upserts and timeout
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          node - <<'NODE'
          const ref=process.env.SUPABASE_PROJECT_REF;
          const token=process.env.GH_SUPABASE_ACCESS_TOKEN;
          if(!ref||!token) throw new Error('Missing Supabase management context');
          const endpoint=`https://api.supabase.com/v1/projects/${ref}/database/query`;
          async function query(sql, readOnly=false){
            const r=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({query:sql,read_only:readOnly})});
            const text=await r.text();
            if(!r.ok) throw new Error(`Supabase query HTTP ${r.status}: ${text.slice(0,1000)}`);
            return text?JSON.parse(text):null;
          }
          function oneReplace(source, regex, replacement, label){
            let count=0;
            const out=source.replace(regex,(...args)=>{count++; return typeof replacement==='function'?replacement(...args):replacement;});
            if(count!==1) throw new Error(`${label}: expected exactly one live function block, found ${count}`);
            return out;
          }
          (async()=>{
            const rows=await query(`SELECT p.oid::regprocedure::text AS signature, pg_get_functiondef(p.oid) AS definition FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='tcos_apply_checklist_import_plan';`,true);
            if(!Array.isArray(rows)||rows.length!==1||!rows[0]?.definition) throw new Error(`Unexpected writer definition response: ${JSON.stringify(rows).slice(0,1000)}`);
            let def=String(rows[0].definition);
            def=oneReplace(def,/select id into v_manufacturer_id\s+from public\.checklist_manufacturers\s+where slug = v_manufacturer_slug;\s+if v_manufacturer_id is null then\s+insert into public\.checklist_manufacturers\(name, slug\)\s+values \(v_release->>'manufacturer', v_manufacturer_slug\)\s+returning id into v_manufacturer_id;\s+end if;/i,`insert into public.checklist_manufacturers(name, slug)\n  values (v_release->>'manufacturer', v_manufacturer_slug)\n  on conflict (slug) do update set name = excluded.name, active = true\n  returning id into v_manufacturer_id;`,'manufacturer upsert');
            def=oneReplace(def,/select id into v_sport_id\s+from public\.checklist_sports\s+where slug = v_sport_slug;\s+if v_sport_id is null then\s+insert into public\.checklist_sports\(name, slug\)\s+values \(v_release->>'sport', v_sport_slug\)\s+returning id into v_sport_id;\s+end if;/i,`insert into public.checklist_sports(name, slug)\n  values (v_release->>'sport', v_sport_slug)\n  on conflict (slug) do update set name = excluded.name, active = true\n  returning id into v_sport_id;`,'sport upsert');
            def=oneReplace(def,/select id into v_brand_id\s+from public\.checklist_brands\s+where manufacturer_id = v_manufacturer_id and slug = v_brand_slug;\s+if v_brand_id is null then\s+insert into public\.checklist_brands\(manufacturer_id, name, slug\)\s+values \(v_manufacturer_id, v_release->>'brand', v_brand_slug\)\s+returning id into v_brand_id;\s+end if;/i,`insert into public.checklist_brands(manufacturer_id, name, slug)\n    values (v_manufacturer_id, v_release->>'brand', v_brand_slug)\n    on conflict (manufacturer_id, slug) do update set name = excluded.name, active = true\n    returning id into v_brand_id;`,'brand upsert');
            def=oneReplace(def,/select id into v_league_id\s+from public\.checklist_leagues\s+where sport_id = v_sport_id and slug = v_league_slug;\s+if v_league_id is null then\s+insert into public\.checklist_leagues\(sport_id, name, slug\)\s+values \(v_sport_id, v_release->>'league', v_league_slug\)\s+returning id into v_league_id;\s+end if;/i,`insert into public.checklist_leagues(sport_id, name, slug)\n    values (v_sport_id, v_release->>'league', v_league_slug)\n    on conflict (sport_id, slug) do update set name = excluded.name, active = true\n    returning id into v_league_id;`,'league upsert');
            await query(def,false);
            await query(`DO $$ DECLARE r record; BEGIN FOR r IN SELECT p.oid::regprocedure::text AS signature FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='tcos_apply_checklist_import_plan' LOOP EXECUTE format('ALTER FUNCTION %s SET statement_timeout = %L', r.signature, '5min'); END LOOP; END $$;`,false);
            const verify=await query(`SELECT pg_get_functiondef(p.oid) AS definition, p.proconfig FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='tcos_apply_checklist_import_plan';`,true);
            const live=String(verify?.[0]?.definition||'');
            for(const needle of ['on conflict (slug) do update set name = excluded.name, active = true','on conflict (manufacturer_id, slug) do update set name = excluded.name, active = true','on conflict (sport_id, slug) do update set name = excluded.name, active = true']){
              if(!live.toLowerCase().includes(needle)) throw new Error(`Live writer missing ${needle}`);
            }
            if(!JSON.stringify(verify?.[0]?.proconfig||[]).includes('statement_timeout=5min')) throw new Error('Live writer timeout is not 5min');
            console.log('REGISTRY_TAXONOMY_UPSERT_REPAIR_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Validate, import Parkhurst, and prove Ivan 236
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          cat > parkhurst-proof-temp.ts <<'TS'
          import assert from "node:assert/strict";
          import { importChecklistArtifact } from "./src/lib/checklist-registry/server";
          import { resolveChecklistRegistry } from "./src/lib/instacomp-learning-server";
          import type { ChecklistSourceArtifact } from "./src/lib/checklist-registry/source-adapter";

          async function main() {
            const url="https://upperdeck.com/checklist/2025-26-parkhurst-checklist/";
            const response=await fetch(url,{headers:{Accept:"text/html,application/xhtml+xml","Cache-Control":"no-cache","User-Agent":"TCOS-Checklist-Registry/1.0"},redirect:"follow",signal:AbortSignal.timeout(60000)});
            assert.equal(response.ok,true,`Parkhurst source HTTP ${response.status}`);
            const content=await response.text();
            assert.ok(content.length>10000,`Parkhurst source too small: ${content.length}`);
            const artifact:ChecklistSourceArtifact={sourceUrl:url,originalFilename:"2025-26-parkhurst.html",mimeType:"text/html",content,retrievedAt:new Date().toISOString(),authority:"official_manufacturer",redistributionAllowed:false};
            const validation=await importChecklistArtifact({artifact,validateOnly:true});
            const errors=validation.plan.validation.issues.filter((x:any)=>x.severity==="error");
            assert.equal(validation.ok,true,`Parkhurst validation failed: ${JSON.stringify(errors)}`);
            assert.equal(validation.plan.validation.status,"passed");
            const number236=(validation.plan.cards as any[]).filter((c:any)=>String(c.cardNumber).trim()==="236");
            const cards=number236.filter((c:any)=>(c.players||[]).some((p:any)=>String(p).toLowerCase().includes("ivan demidov")));
            assert.ok(cards.length>=1,'Ivan Demidov #236 absent from normalized Parkhurst plan');
            const setKeys=[...new Set(cards.map((c:any)=>c.setSourceKey).filter(Boolean))];
            const sets=(validation.plan.sets as any[]).filter((s:any)=>setKeys.includes(s.sourceKey||s.setSourceKey||s.source_key));
            console.log('PARKHURST_VALIDATED',JSON.stringify({counts:validation.plan.validation.counts,ivanCards:cards,setKeys,sets}));
            const imported=await importChecklistArtifact({artifact});
            assert.equal(imported.ok,true,'Parkhurst Production import did not return ok');
            console.log('PARKHURST_IMPORTED',JSON.stringify({persistence:imported.persistence,counts:imported.plan.validation.counts}));
            const logicalCandidates=[...new Set([...sets.flatMap((s:any)=>[s.name,s.displayName,s.normalizedName,s.title]),'Rookies','Base Set - Rookies','Base Set','Base'].filter(Boolean).map(String))];
            let exact:any=null; const attempts:any[]=[];
            for(const setName of logicalCandidates){
              const r=await resolveChecklistRegistry({player:'Ivan Demidov',year:'2025-26',brand:'Upper Deck',setName,cardNumber:'236',parallel:'Base',team:'Montreal Canadiens',sport:'Hockey',league:'NHL',isRookie:true,isAuto:false,isRelic:false},{evidenceTrusted:true});
              attempts.push({setName,status:r.status,reasons:r.reasons,match:r.match?{identityId:r.match.identityId,fingerprintSha256:r.match.fingerprintSha256,setName:r.match.setName,product:r.match.product,player:r.match.player,cardNumber:r.match.cardNumber}:null});
              if(r.status==='internal_exact_match'&&r.match){exact=r;break;}
            }
            console.log('IVAN_RESOLVER_ATTEMPTS',JSON.stringify(attempts));
            assert.ok(exact?.match,'Ivan #236 did not resolve exactly after Parkhurst import');
            assert.equal(exact.match.player,'Ivan Demidov');
            assert.equal(String(exact.match.cardNumber),'236');
            assert.match(String(exact.match.product||''),/Parkhurst/i);
            assert.ok(exact.match.identityId&&exact.match.fingerprintSha256,'Ivan #236 missing Registry receipt');
            console.log('PASS_IVAN_PARKHURST_236',JSON.stringify({identityId:exact.match.identityId,fingerprintSha256:exact.match.fingerprintSha256,setName:exact.match.setName,product:exact.match.product}));
          }
          main().catch((error)=>{console.error(error);process.exit(1)});
          TS
          npx tsx parkhurst-proof-temp.ts

      - name: Cleanup
        if: always()
        run: rm -rf "$TEMP_DIR" parkhurst-proof-temp.ts
