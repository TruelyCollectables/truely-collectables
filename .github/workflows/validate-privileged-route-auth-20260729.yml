name: Validate Privileged Route Authorization 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-privileged-route-auth-20260729.yml"
      - "scripts/run-privileged-route-auth-regressions.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-privileged-route-auth-20260729
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
  ADMIN_SESSION_SECRET: build-only-placeholder-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-only-placeholder-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_only_placeholder
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
  EBAY_CLIENT_ID: build-only-placeholder-client-id
  EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/prove-privileged-route-auth-20260729
          fetch-depth: 0

      - name: Add permanent privileged-route authorization regression
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/run-privileged-route-auth-regressions.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const read = async (path) =>
            readFile(new URL(`../${path}`, import.meta.url), "utf8");

          const proxy = await read("src/proxy.ts");
          const actorGuard = await read("src/lib/instacomp-job-server.ts");

          for (const fragment of [
            'pathname.startsWith("/api/ebay")',
            'pathname.startsWith("/api/orders")',
            'pathname.startsWith("/admin")',
            "isValidAdminSessionValue",
          ]) {
            assert.ok(proxy.includes(fragment), `Missing proxy guard fragment: ${fragment}`);
          }

          for (const fragment of [
            "export async function requireInstaCompJobActor",
            "isValidInstaCompServiceRequest(request)",
            "supabase.auth.getUser(token)",
            '.eq("role", "seller")',
            '.eq("status", "active")',
            'profile?.account_status === "active"',
            "isValidAdminSessionValue(adminSession)",
            "INSTACOMP_JOB_UNAUTHORIZED",
            "401",
            '.eq("store_id", actor.storeId)',
            '.eq("seller_account_id", actor.sellerAccountId)',
          ]) {
            assert.ok(
              actorGuard.includes(fragment),
              `Missing shared InstaComp authorization control: ${fragment}`,
            );
          }

          const actorGuardedRoutes = [
            "src/app/api/account/seller/quick-list/route.ts",
            "src/app/api/instacomp/draft-listings/route.ts",
            "src/app/api/instacomp/jobs/route.ts",
            "src/app/api/instacomp/jobs/[id]/route.ts",
            "src/app/api/instacomp/jobs/[id]/items/route.ts",
            "src/app/api/instacomp/jobs/[id]/items/[itemId]/route.ts",
            "src/app/api/instacomp/jobs/[id]/knowledge-base/route.ts",
            "src/app/api/instacomp/trade-items/route.ts",
          ];

          for (const path of actorGuardedRoutes) {
            const source = await read(path);
            assert.ok(
              source.includes("requireInstaCompJobActor") &&
                /await\s+requireInstaCompJobActor\s*\(/.test(source),
              `${path} must invoke the shared active-seller/admin actor guard.`,
            );
          }

          const proxyGuardedRoutes = [
            {
              path: "src/app/api/ebay/publish/images/route.ts",
              prefix: 'pathname.startsWith("/api/ebay")',
            },
            {
              path: "src/app/api/orders/mark-shipped/route.ts",
              prefix: 'pathname.startsWith("/api/orders")',
            },
            {
              path: "src/app/api/orders/update-tracking/route.ts",
              prefix: 'pathname.startsWith("/api/orders")',
            },
          ];

          for (const { path, prefix } of proxyGuardedRoutes) {
            const source = await read(path);
            assert.ok(
              /export\s+async\s+function\s+(POST|PUT|PATCH|DELETE)/.test(source),
              `${path} must remain a mutation route covered by the proxy boundary.`,
            );
            assert.ok(proxy.includes(prefix), `${path} is missing proxy protection.`);
          }

          const sellerPage = await read("src/app/seller/page.tsx");
          assert.ok(
            sellerPage.includes("if (!session)") &&
              sellerPage.includes("Log in through your TCOS account first"),
            "The public seller shell must stop before loading private seller data.",
          );

          console.log(
            "Privileged route authorization regressions passed for all 11 audit-flagged mutation routes and the locked seller shell.",
          );
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path("package.json")
          text = path.read_text()
          anchor = '    "simulate:admin-login": "node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/run-admin-login-simulations.mjs",\n'
          addition = anchor + '    "simulate:privileged-route-auth": "node scripts/run-privileged-route-auth-regressions.mjs",\n'
          if text.count(anchor) != 1:
              raise SystemExit("Expected one package script anchor")
          path.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Remove one-time validation workflow
        run: rm -f .github/workflows/validate-privileged-route-auth-20260729.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run privileged-route and neighboring security regressions
        run: |
          npm run simulate:privileged-route-auth
          npm run simulate:admin-login
          npm run simulate:admin-security-actions
          npm run simulate:admin-ebay-actions
          npm run simulate:admin-order-review-actions
          npm run simulate:instacomp-jobs

      - name: Run lint
        run: npm run lint

      - name: Run standalone TypeScript check
        run: npx tsc --noEmit

      - name: Run full Production build
        run: npm run build

      - name: Verify narrow source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf '%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              scripts/run-privileged-route-auth-regressions.mjs|package.json|.github/workflows/validate-privileged-route-auth-20260729.yml) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done

      - name: Commit validated route authorization proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Audit Bot"
          git config user.email "sales@truelycollectables.com"
          git add -A
          git commit -m "Add privileged route authorization regression"
          git push origin HEAD:agent/prove-privileged-route-auth-20260729
