name: Checklist Priority Hockey 2021Plus Production 20260815

on:
  push:
    branches:
      - ops/checklist-conveyor-live-20260815
    paths:
      - '.github/workflows/checklist-priority-hockey-2021plus-production-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PUBLIC_WEB_MINIMUM_CARD_ROWS: '25'
  SOURCE_RUN_ID: '31885532759'

jobs:
  hockey-production:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 110
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SHARD: ${{ matrix.shard }}
      SHARDS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          npm ci

      - name: Enable GoGTS structured normalization
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path='scripts/mainstream-checklist/source-tools.mjs';
          let s=readFileSync(path,'utf8');
          const ia='import { extname, resolve } from "node:path";\n';
          const il='import { normalizeGoGtsStructuredText } from "./gogts-structured-normalizer.mjs";\n';
          if(!s.includes(il)) {
            if(!s.includes(ia)) throw new Error('normalizer import anchor missing');
            s=s.replace(ia,ia+il);
          }
          const old='  const text = extractText(downloaded, filename);';
          const replacement='  const text = normalizeGoGtsStructuredText(extractText(downloaded, filename));';
          if(!s.includes(replacement)) {
            if(!s.includes(old)) throw new Error('parser handoff anchor missing');
            s=s.replace(old,replacement);
          }
          writeFileSync(path,s);
          NODE
          node --check scripts/mainstream-checklist/source-tools.mjs
          node --check scripts/promote-mainstream-2005plus-public-web-candidates.mjs

      - name: Resolve Production Supabase
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hockey-prod-$SHARD"; mkdir -p "$root"
          curl -sS --fail --retry 6 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o "$root/projects.json" https://api.supabase.com/v1/projects
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          curl -sS --fail --retry 6 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o "$root/keys.json" "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$root/keys.json")"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$project_ref.supabase.co" >> "$GITHUB_ENV"
          echo "RESOLVED_SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Download authoritative harvested target universe
        uses: actions/download-artifact@v4
        with:
          name: checklist-mainstream-gogts-harvest-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/hockey-source-${{ matrix.shard }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Build exact 2021-22+ hockey shard
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/hockey-source-$SHARD/catalog.json"
          out="$RUNNER_TEMP/hockey-$SHARD"
          mkdir -p "$out/receipts"
          test -s "$source"
          SOURCE="$source" OUT="$out" SHARD="$SHARD" SHARDS="$SHARDS" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const catalog=JSON.parse(readFileSync(process.env.SOURCE,'utf8'));
          const all=[];
          const seen=new Set();
          for(const row of catalog){
            const key=String(row?.metadata?.masterArchiveExactSetKey||row?.metadata?.exactSetKey||'').toLowerCase();
            if(!key.startsWith('hockey|')) continue;
            const parts=key.split('|');
            if(parts.length!==4) continue;
            const year=Number(((parts[1]||'').match(/\d{4}/)||[])[0]||0);
            if(year<2021) continue;
            if(!row.source_url||seen.has(key)) continue;
            seen.add(key);
            all.push({exactSetKey:key,sourceUrl:String(row.source_url),releaseName:row.release_name||null});
          }
          all.sort((a,b)=>a.exactSetKey.localeCompare(b.exactSetKey));
          const shard=Number(process.env.SHARD), shards=Number(process.env.SHARDS);
          const selected=all.filter((_,i)=>i%shards===shard);
          writeFileSync(join(process.env.OUT,'all-targets.json'),JSON.stringify({count:all.length,targets:all},null,2));
          writeFileSync(join(process.env.OUT,'targets.json'),JSON.stringify({count:selected.length,shard,shards,targets:selected},null,2));
          console.log(`HOCKEY_UNIVERSE=${all.length} SHARD=${shard} TARGETS=${selected.length}`);
          if(all.length!==100) throw new Error(`Expected recovered hockey universe of 100, got ${all.length}`);
          NODE

      - name: Apply and independently verify Production persistence
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hockey-$SHARD"
          OUT="$out" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';

          const out=process.env.OUT;
          const targets=JSON.parse(readFileSync(join(out,'targets.json'),'utf8')).targets;
          const summary={
            schema:'tcos.checklist.hockey2021PlusProductionShard.v1',
            runId:process.env.GITHUB_RUN_ID||null,
            shard:Number(process.env.SHARD),
            targetCount:targets.length,
            verified:0,
            cards:0,
            netNew:0,
            alreadyPresent:0,
            failed:0,
            results:[],
            startedAt:new Date().toISOString()
          };

          function apply(target,label){
            const slug=target.exactSetKey.replace(/[^a-zA-Z0-9_.-]+/g,'_');
            const queue=join(out,`queue-${slug}-${label}.json`);
            const filter=join(out,`filter-${slug}-${label}.json`);
            const receipt=join(out,'receipts',`${slug}-${label}.json`);
            const validated=join(out,'receipts',`${slug}-${label}-validated.json`);
            const season=target.exactSetKey.split('|')[1]||'';
            const year=Number((season.match(/\d{4}/)||[])[0]||0);
            writeFileSync(queue,JSON.stringify({
              schema:'tcos.checklist.mainstream2005plusCandidateValidationQueue.v1',
              count:1,
              targets:[{
                exactSetKey:target.exactSetKey,
                year,
                sport:'hockey',
                sourceArtifact:'gogts-harvest-31885532759-priority-hockey-20260815',
                exactCandidateCount:1,
                trustedAutoImportCandidateCount:1,
                candidates:[]
              }]
            },null,2));
            writeFileSync(filter,JSON.stringify({
              schema:'tcos.checklist.priorityHockeyTarget.v1',
              targets:[{exactSetKey:target.exactSetKey,sourceUrl:target.sourceUrl}]
            },null,2));
            const child=spawnSync('node',['--import','tsx','scripts/promote-mainstream-2005plus-public-web-candidates.mjs'],{
              encoding:'utf8',
              timeout:120000,
              env:{
                ...process.env,
                PUBLIC_WEB_CANDIDATE_QUEUE:queue,
                PUBLIC_WEB_TARGET_FILTER:filter,
                PUBLIC_WEB_PROMOTION_APPLY:'true',
                PUBLIC_WEB_PROMOTION_OUTPUT:receipt,
                PUBLIC_WEB_VALIDATED_TARGETS_OUTPUT:validated
              }
            });
            if(child.stdout) process.stdout.write(child.stdout.slice(-7000));
            if(child.stderr) process.stderr.write(child.stderr.slice(-5000));
            try{
              const r=JSON.parse(readFileSync(receipt,'utf8'));
              return (r.results||[]).find(x=>String(x.exactSetKey).toLowerCase()===target.exactSetKey)||(r.results||[])[0]||null;
            }catch{return null;}
          }

          for(let i=0;i<targets.length;i++){
            const target=targets[i];
            console.log(`=== HOCKEY SHARD ${process.env.SHARD} ${i+1}/${targets.length} ${target.exactSetKey} ===`);
            let first=apply(target,'apply');
            let reason=first?.message||(first?.errors||[]).join('; ')||`apply ${first?.status||'no receipt'}`;
            if(first?.status==='imported'&&first?.persistence?.ok===true){
              const verify=apply(target,'verify');
              if(verify?.status==='imported'&&verify?.persistence?.ok===true&&verify?.persistence?.idempotent===true){
                const already=first.persistence?.idempotent===true;
                const cards=Number(first.counts?.cards||verify.counts?.cards||0);
                summary.verified++;
                summary.cards+=cards;
                if(already) summary.alreadyPresent++; else summary.netNew++;
                summary.results.push({
                  exactSetKey:target.exactSetKey,
                  status:'verified-production',
                  cards,
                  sourceUrl:target.sourceUrl,
                  firstPersistence:first.persistence,
                  verificationPersistence:verify.persistence
                });
                console.log(`>>> HOCKEY VERIFIED ${already?'ALREADY':'NET-NEW'} ${target.exactSetKey} cards=${cards}`);
                writeFileSync(join(out,'summary.json'),JSON.stringify(summary,null,2));
                continue;
              }
              reason=verify?.message||(verify?.errors||[]).join('; ')||`verification ${verify?.status||'no receipt'}`;
            }
            summary.failed++;
            summary.results.push({exactSetKey:target.exactSetKey,status:'failed',sourceUrl:target.sourceUrl,reason});
            console.error(`--- HOCKEY FAILED ${target.exactSetKey}: ${reason}`);
            writeFileSync(join(out,'summary.json'),JSON.stringify(summary,null,2));
          }

          summary.completedAt=new Date().toISOString();
          writeFileSync(join(out,'summary.json'),JSON.stringify(summary,null,2));
          console.log('FINAL_HOCKEY_SHARD_SUMMARY '+JSON.stringify({
            shard:summary.shard,
            targetCount:summary.targetCount,
            verified:summary.verified,
            cards:summary.cards,
            netNew:summary.netNew,
            alreadyPresent:summary.alreadyPresent,
            failed:summary.failed
          }));
          if(summary.failed) process.exitCode=2;
          NODE

      - name: Upload shard receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-hockey-2021plus-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/hockey-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/hockey-prod-$SHARD" .env.local .env.production.local .vercel
