name: Repair Admin Audit Script 20260809

on:
  push:
    branches:
      - fix/kingmaker-certify-current-head-20260809
    paths:
      - ".github/workflows/repair-admin-audit-after-full-file-write-20260809.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-certify-current-head-20260809
          fetch-depth: 0

      - name: Restore exact audit script and apply Advanced Admin ownership fix
        run: |
          set -euo pipefail
          git show 8a2e83747484df21e347af24e11ba732c0536468:scripts/run-admin-dashboard-actions-simulations.mjs > scripts/run-admin-dashboard-actions-simulations.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-admin-dashboard-actions-simulations.mjs')
          source = path.read_text('utf-8')
          old = 'const adminDashboardLinkExemptions = new Set(["/admin", "/admin/login"]);'
          new = 'const adminDashboardLinkExemptions = new Set(["/admin", "/admin/login", "/admin/advanced"]);'
          if old not in source:
              raise SystemExit('Admin dashboard link exemption marker not found')
          source = source.replace(old, new, 1)
          path.write_text(source, 'utf-8')
          PY
          git diff --check

      - name: Persist repaired audit script
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-admin-dashboard-actions-simulations.mjs
          git commit -m "Fix Advanced Admin static-link audit ownership"
          git push origin HEAD:fix/kingmaker-certify-current-head-20260809
