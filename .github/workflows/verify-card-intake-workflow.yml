name: Verify permanent card intake workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-at-least-32-characters
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/permanent-card-intake-workflow

      - name: Update product-status test for Card Intake
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-admin-product-status-simulations.mjs')
          text = path.read_text()
          text = text.replace(
              'new URL("../src/app/list/page.tsx", import.meta.url)',
              'new URL("../src/app/admin/pending-card-import/page.tsx", import.meta.url)',
              1,
          )
          text = text.replace(
              'new URL("../src/app/api/admin/simple-list-drafts/route.ts", import.meta.url)',
              'new URL("../src/app/api/admin/pending-card-import/route.ts", import.meta.url)',
              1,
          )

          start_marker = 'scenario("new product intake redirects to the protected simplified listing workspace", () => {'
          end_marker = 'scenario("inventory engine enforces admin product status policy", () => {'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              replacement = '''scenario("new product intake redirects to permanent Card Intake & Listing", () => {
            assert(
              newProductPageSource.includes('redirect("/admin/pending-card-import")'),
              "Expected the legacy new-product route to redirect to Card Intake & Listing.",
            );

            for (const fragment of [
              "PendingCardImportClient",
              "SimpleListingQueue",
              "Card Intake & Listing",
              "InstaComp 2.0",
            ]) {
              assert(
                simplifiedListPageSource.includes(fragment),
                `Expected Card Intake page fragment ${fragment}.`,
              );
            }

            for (const fragment of [
              'actor.type !== "admin"',
              "A front card photo is required.",
              "price: 0",
              "quantity: 1",
              "createSellerDraftProduct",
              "excludedFromInstaComp: true",
              "excludedFromMarketComps: true",
            ]) {
              assert(
                simpleListDraftRouteSource.includes(fragment),
                `Expected pending card import route fragment ${fragment}.`,
              );
            }
          });

          '''
              text = text[:start] + replacement + text[end:]
          elif 'new product intake redirects to permanent Card Intake & Listing' not in text:
              raise SystemExit('Legacy new-product listing scenario was not found.')

          path.write_text(text)
          PY

      - name: Commit product-status test update
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/run-admin-product-status-simulations.mjs
            git commit -m "Update product-status tests for Card Intake"
            git push origin HEAD:agent/permanent-card-intake-workflow
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/run-simplified-list-route-audit.mjs
      - run: npm run verify:admin-dashboard
      - run: npm run build
