name: KINGMAKER Audit Effect Repair Cert 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/patch-kingmaker-instacomp-audit-effect-20260807.py"
      - ".github/workflows/kingmaker-audit-effect-repair-cert-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingmaker-audit-effect-repair-cert-20260807
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: fix/kingmaker-instacomp-audit-effect-20260807

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-key
      ADMIN_PASSWORD: build-only-admin-password
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-sufficient-length
      STRIPE_SECRET_KEY: sk_test_build_only
      STRIPE_WEBHOOK_SECRET: whsec_build_only
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      EBAY_CLIENT_ID: build-only-client-id
      EBAY_CLIENT_SECRET: build-only-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Apply exact effect repair
        run: python scripts/ops/patch-kingmaker-instacomp-audit-effect-20260807.py

      - name: Prove source patch is effect-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'src/app/kingmaker/instacomp-audit/page.tsx'
          git diff --check
          patch="$(git diff -- src/app/kingmaker/instacomp-audit/page.tsx)"
          echo "$patch"
          echo "$patch" | grep -Fq 'const timer = window.setTimeout(() => {'
          echo "$patch" | grep -Fq 'return () => window.clearTimeout(timer);'
          ! echo "$patch" | grep -Fq 'shadow-[7px_7px_0_#0891b2]'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Current KINGMAKER architecture contract
        run: node scripts/certify-kingmaker-instacomp-architecture.mjs

      - name: Focused lint
        run: npx eslint src/app/kingmaker/instacomp-audit/page.tsx

      - name: Full TypeScript
        run: npx tsc --noEmit

      - name: Full Production build
        run: npm run build

      - name: Commit only certified runtime repair
        shell: bash
        run: |
          set -euo pipefail
          echo 'Post-build working tree:'
          git status --short
          # prebuild intentionally stamps the current build SHA into this generated file.
          # Reset only that known generated artifact before asserting the runtime diff.
          git checkout -- public/instacomp-release.json
          changed="$(git diff --name-only)"
          test "$changed" = 'src/app/kingmaker/instacomp-audit/page.tsx'
          patch="$(git diff -- src/app/kingmaker/instacomp-audit/page.tsx)"
          echo "$patch" | grep -Fq 'const timer = window.setTimeout(() => {'
          echo "$patch" | grep -Fq 'return () => window.clearTimeout(timer);'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/kingmaker/instacomp-audit/page.tsx
          git commit -m 'Fix KINGMAKER audit initial load effect'
          git push origin HEAD:${EXPECTED_BRANCH}
