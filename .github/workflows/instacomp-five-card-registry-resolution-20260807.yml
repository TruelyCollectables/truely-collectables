name: InstaComp Five Card Registry Resolution 20260807

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/ops/run-instacomp-five-card-registry-resolution.ts"
      - ".github/workflows/instacomp-five-card-registry-resolution-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/instacomp-five-card-registry-resolution-20260807

jobs:
  resolve-five:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/instacomp-five-card-registry-resolution-20260807
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve exact Production database credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/instacomp-five-card-registry" "$EVIDENCE_DIR"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/instacomp-five-card-registry/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PROD_ENV="$RUNNER_TEMP/instacomp-five-card-registry/production.env" RUNTIME_ENV="$RUNNER_TEMP/instacomp-five-card-registry/runtime-env.sh" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PROD_ENV, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i < 1) continue;
            const key = line.slice(0, i).trim();
            let value = line.slice(i + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value = JSON.parse(value); } catch { value = value.slice(1,-1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1,-1);
            parsed[key] = value;
          }
          const url = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
          if (!url) throw new Error('Missing Production Supabase URL');
          const projectRef = new URL(url).hostname.split('.')[0];
          const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` },
          });
          const raw = await response.text();
          if (!response.ok) throw new Error(`Supabase key lookup HTTP ${response.status}: ${raw.slice(0,300)}`);
          const keys = raw ? JSON.parse(raw) : [];
          const serviceRole = keys.find((key) => key?.name === 'service_role' && /^eyJ/.test(String(key?.api_key || ''))) || keys.find((key) => key?.secret_jwt_template?.role === 'service_role' && /^eyJ/.test(String(key?.api_key || '')));
          if (!serviceRole?.api_key) throw new Error('Legacy service_role JWT not found');
          console.log('::add-mask::' + serviceRole.api_key);
          fs.writeFileSync(process.env.RUNTIME_ENV, [
            `export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(url)}`,
            `export SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(String(serviceRole.api_key))}`,
          ].join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Resolve all five exact Registry identities
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/instacomp-five-card-registry/runtime-env.sh"
          node --import tsx scripts/ops/run-instacomp-five-card-registry-resolution.ts --output "$EVIDENCE_DIR/receipt.json"
          cat "$EVIDENCE_DIR/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instacomp-five-card-registry-resolution-20260807
          path: evidence/instacomp-five-card-registry-resolution-20260807/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove local credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/instacomp-five-card-registry" .vercel
