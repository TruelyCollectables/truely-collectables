name: Patch InstaComp Primary OpenAI Failover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-instacomp-primary-openai-failover.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-instacomp-primary-openai-failover
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Add OpenAI primary identity fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/api/instacomp/scan/route.ts')
          text = path.read_text()

          old = '''async function identifyCardWithConfiguredProviderFailover(params: {
                frontImage: File;
                backImage?: File | null;
                frontDataUrl: string;
                backDataUrl?: string;
                detailImages: InstaCompDetailImage[];
                externalOcr: ExternalOcrResult | null;
              }) {
                return runInstaCompPrimaryAiFailover<InstaCompAiResult>([
                  {
                    provider: "instacomp_internal",
                    family: "instacomp_internal",
                    configured: hasConfiguredInstaCompAiLocal(),
                    run: async () => {
                      const scan = await analyzeWithInstaCompAiLocal({
                        front: params.frontImage,
                        back: params.backImage || null,
                        printedEvidence: params.externalOcr,
                        timeoutMs: 150_000,
                      });
                      const ai = instaCompAiLocalScanToAi(scan);
                      if (!ai) {
                        throw new Error(
                          `InstaComp internal engine returned ${scan.status} without usable identity evidence.`,
                        );
                      }
                      return ai;
                    },
                  },
                ]);
              }
          '''

          # Current route indentation is intentionally ignored if another safe
          # formatter has touched it. Match the stable candidate tail instead.
          tail = '''        {
          provider: "instacomp_internal",
          family: "instacomp_internal",
          configured: hasConfiguredInstaCompAiLocal(),
          run: async () => {
            const scan = await analyzeWithInstaCompAiLocal({
              front: params.frontImage,
              back: params.backImage || null,
              printedEvidence: params.externalOcr,
              timeoutMs: 150_000,
            });
            const ai = instaCompAiLocalScanToAi(scan);
            if (!ai) {
              throw new Error(
                `InstaComp internal engine returned ${scan.status} without usable identity evidence.`,
              );
            }
            return ai;
          },
        },
      ]);
'''
          replacement = '''        {
          provider: "instacomp_internal",
          family: "instacomp_internal",
          configured: hasConfiguredInstaCompAiLocal(),
          run: async () => {
            const scan = await analyzeWithInstaCompAiLocal({
              front: params.frontImage,
              back: params.backImage || null,
              printedEvidence: params.externalOcr,
              timeoutMs: 150_000,
            });
            const ai = instaCompAiLocalScanToAi(scan);
            if (!ai) {
              throw new Error(
                `InstaComp internal engine returned ${scan.status} without usable identity evidence.`,
              );
            }
            return ai;
          },
        },
        {
          provider: "openai_primary",
          family: "openai",
          configured: Boolean(OPENAI_API_KEY),
          run: () =>
            identifyCardWithOpenAI(
              params.frontDataUrl,
              params.backDataUrl,
              params.detailImages,
              params.externalOcr,
              { readerFocus: "primary" },
            ),
        },
      ]);
'''

          marker = 'provider: "openai_primary"'
          if marker in text:
              print('OpenAI primary identity fallback is already present.')
          else:
              if text.count(tail) != 1:
                  raise SystemExit(f'Primary identity candidate tail found {text.count(tail)} times; refusing ambiguous patch.')
              text = text.replace(tail, replacement, 1)
              path.write_text(text)
              print('OpenAI primary identity fallback inserted after Mac/internal reader.')
          PY

      - name: Run identity and consensus regressions
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/run-instacomp-registry-consensus-bridge-regression.ts \
            scripts/run-instacomp-live-shedeur-107-regression.ts \
            scripts/run-instacomp-identity-firewall-regressions.ts \
            scripts/run-instacomp-serial-color-gate-regressions.ts; do
            if [ -f "$script" ]; then npx tsx "$script"; fi
          done
          if [ -f scripts/run-instacomp-ai-provider-failover-regressions.ts ]; then
            npx tsx scripts/run-instacomp-ai-provider-failover-regressions.ts
          fi

      - name: Lint and typecheck
        run: |
          npx eslint src/app/api/instacomp/scan/route.ts src/lib/instacomp-ai-provider-failover.ts
          npx tsc --noEmit

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
          ADMIN_PASSWORD: build-only-placeholder-password
          ADMIN_SESSION_SECRET: build-only-placeholder-admin-session-secret
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          STRIPE_SECRET_KEY: sk_test_build_only_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
          EBAY_CLIENT_ID: build-only-placeholder-client-id
          EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: npm run build

      - name: Commit validated scanner patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/app/api/instacomp/scan/route.ts; then
            echo 'Validated scanner patch already committed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/instacomp/scan/route.ts
          git commit -m "Add OpenAI primary fallback to InstaComp identity scan"
          git pull --rebase origin main
          git push origin HEAD:main
