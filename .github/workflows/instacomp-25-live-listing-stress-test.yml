name: InstaComp 25 Live Listing Stress Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-25-live-listing-stress-test.yml"

permissions:
  contents: write

concurrency:
  group: instacomp-25-live-listing-stress-test
  cancel-in-progress: false

jobs:
  live-stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE_URL: https://truelycollectables.com
      RESULT_BRANCH: instacomp-audit-results
      RESULT_PATH: audits/instacomp-25-live-listing-stress-test/latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run protected mixed 25-card InstaComp recognition stress test
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          result="$RUNNER_TEMP/instacomp-25-live-listing-stress-test.json"
          curl -fsS --max-time 840 \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" \
            "$SITE_URL/api/release/instacomp-25-card-stress-test-v3" \
            > "$result"
          node - "$result" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (payload.success !== true) {
            throw new Error(`Stress endpoint failed: ${JSON.stringify(payload).slice(0, 3000)}`);
          }
          const summary = payload.summary || {};
          if (Number(summary.selectedListings) !== 25) {
            throw new Error(`Expected 25 selected listings, got ${summary.selectedListings ?? 'missing'}.`);
          }
          if (!Array.isArray(payload.results) || payload.results.length !== 25) {
            throw new Error(`Expected 25 result rows, got ${Array.isArray(payload.results) ? payload.results.length : 'missing'}.`);
          }
          console.log(JSON.stringify({
            completedAt: payload.completedAt || null,
            selectedListings: summary.selectedListings,
            cardsPassed: summary.cardsPassed,
            cardsFailed: summary.cardsFailed,
            cardAccuracyPercent: summary.cardAccuracyPercent,
            fieldChecksPassed: summary.fieldChecksPassed,
            fieldChecksTotal: summary.fieldChecksTotal,
            fieldAccuracyPercent: summary.fieldAccuracyPercent,
            autographCards: summary.autographCards,
            memorabiliaCards: summary.memorabiliaCards,
            serialNumberedCards: summary.serialNumberedCards,
            parallelCards: summary.parallelCards,
            rookieCards: summary.rookieCards,
            frontBackVerified: summary.frontBackVerified,
            perfect: summary.perfect === true,
          }, null, 2));
          NODE

      - name: Upload full stress-test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-25-live-listing-stress-test
          path: ${{ runner.temp }}/instacomp-25-live-listing-stress-test.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish latest audit receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/instacomp-25-live-listing-stress-test.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/heads/$RESULT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RESULT_BRANCH"
            git switch -C "$RESULT_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$RESULT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$(dirname "$RESULT_PATH")"
          cp "$result" "$RESULT_PATH"
          git add "$RESULT_PATH"
          git commit -m "Update InstaComp 25-card live stress result"
          git push --force origin "$RESULT_BRANCH"
