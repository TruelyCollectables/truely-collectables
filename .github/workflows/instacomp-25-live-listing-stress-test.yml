name: InstaComp 25 Live Listing Stress Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-25-live-listing-stress-test.yml"

permissions:
  contents: write

concurrency:
  group: instacomp-25-live-listing-stress-test
  cancel-in-progress: false

jobs:
  live-stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE_URL: https://truelycollectables.com
      RESULT_BRANCH: instacomp-audit-results
      RESULT_DIR: audits/instacomp-25-live-listing-stress-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture physical Mac preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          body="$RUNNER_TEMP/instacomp-25-mac-status-body.json"
          receipt="$RUNNER_TEMP/instacomp-25-mac-status.json"
          code="$(curl -sS --max-time 60 \
            -o "$body" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" \
            "$SITE_URL/api/release/instacomp-deal-hunter-learning-self-test?mode=status" || true)"
          HTTP_CODE="$code" BODY_PATH="$body" RECEIPT_PATH="$receipt" node <<'NODE'
          const fs = require('fs');
          const code = Number(process.env.HTTP_CODE || 0);
          const bodyPath = process.env.BODY_PATH;
          const receiptPath = process.env.RECEIPT_PATH;
          const raw = bodyPath && fs.existsSync(bodyPath) ? fs.readFileSync(bodyPath, 'utf8') : '';
          let payload = null;
          try { payload = raw ? JSON.parse(raw) : null; }
          catch { payload = raw ? { raw: raw.slice(0, 3000) } : null; }
          const receipt = {
            checkedAt: new Date().toISOString(),
            httpStatus: code || null,
            requestOk: code >= 200 && code < 300,
            success: payload?.success === true,
            physicalMacHealthy: payload?.physicalMacHealthy === true,
            scheduler: payload?.scheduler || null,
            recentRuns: Array.isArray(payload?.runs) ? payload.runs.slice(0, 8) : [],
            error: payload?.error ? String(payload.error).slice(0, 3000) : null,
            response: payload,
          };
          fs.writeFileSync(receiptPath, JSON.stringify(receipt, null, 2));
          console.log(JSON.stringify(receipt, null, 2));
          NODE

      - name: Run protected mixed 25-card InstaComp recognition stress test
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/instacomp-25-live-listing-stress-test.json"
          curl -fsS --max-time 840 \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Accept: application/json" \
            "$SITE_URL/api/release/instacomp-25-card-stress-test-v3" \
            > "$result"
          node - "$result" <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.success !== true) throw new Error(JSON.stringify(p).slice(0, 3000));
          if (Number(p.summary?.selectedListings) !== 25 || !Array.isArray(p.results) || p.results.length !== 25) {
            throw new Error('Stress response did not contain 25 card results.');
          }
          console.log(JSON.stringify(p.summary, null, 2));
          NODE

      - name: Upload stress receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-25-live-listing-stress-test
          path: |
            ${{ runner.temp }}/instacomp-25-live-listing-stress-test.json
            ${{ runner.temp }}/instacomp-25-mac-status.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish latest audit receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/heads/$RESULT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RESULT_BRANCH"
            git switch -C "$RESULT_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$RESULT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$RESULT_DIR"
          test -f "$RUNNER_TEMP/instacomp-25-mac-status.json" && cp "$RUNNER_TEMP/instacomp-25-mac-status.json" "$RESULT_DIR/mac-status.json" || true
          test -f "$RUNNER_TEMP/instacomp-25-live-listing-stress-test.json" && cp "$RUNNER_TEMP/instacomp-25-live-listing-stress-test.json" "$RESULT_DIR/latest.json" || true
          git add "$RESULT_DIR"
          if git diff --cached --quiet; then
            echo "No receipt changes to publish."
            exit 0
          fi
          git commit -m "Update InstaComp 25-card stress receipts"
          git push --force origin "$RESULT_BRANCH"
