name: Verify Production Fulfillment Hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-production-fulfillment-hotfix.yml"
      - ".vercel-deploy-trigger"
      - "vercel.json"
      - "src/app/admin/orders/**"
      - "src/app/api/build-info/route.ts"
      - "src/app/api/admin-orders-health/route.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-production-fulfillment-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for live fulfillment hotfix
        shell: bash
        run: |
          set -u
          expected='fulfillment-hotfix-2026-07-29-2018-mt'
          build_url='https://truelycollectables.com/api/build-info'
          health_url='https://truelycollectables.com/api/admin-orders-health'

          for attempt in $(seq 1 72); do
            build_body="$(curl --location --silent --show-error --max-time 20 "$build_url" 2>/dev/null || true)"
            health_body="$(curl --location --silent --show-error --max-time 20 "$health_url" 2>/dev/null || true)"

            if printf '%s' "$build_body" | grep -Fq "$expected" && \
               printf '%s' "$health_body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' && \
               printf '%s' "$health_body" | grep -Fq 'admin-orders-service-role'; then
              echo "LIVE_PRODUCTION_BUILD_VERIFIED=$expected"
              echo "LIVE_ADMIN_ORDERS_SERVICE_ROLE_VERIFIED=true"
              exit 0
            fi

            echo "Attempt $attempt/72: Production has not proven the fulfillment hotfix yet."
            sleep 10
          done

          echo "Production verification failed after 12 minutes."
          echo "Last build response: ${build_body:-<empty>}"
          echo "Last health response: ${health_body:-<empty>}"
          exit 1
