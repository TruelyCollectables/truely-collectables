name: Guarded Shop Filter Accessibility Fix 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/guarded-shop-filter-accessibility-fix-20260729.yml"
      - "src/app/shop/page.tsx"
      - "scripts/run-shop-filter-accessibility-contract.mjs"

permissions:
  contents: write

concurrency:
  group: guarded-shop-filter-accessibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/shop-filter-accessibility-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_BASE_SHA: 8baee1bb26a17f974388b4d8e50b4321bbdfb685
      NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-validation-admin-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-validation-admin-password
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard exact base and branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$SOURCE_BASE_SHA"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/guarded-shop-filter-accessibility-fix-20260729.yml|src/app/shop/page.tsx|scripts/run-shop-filter-accessibility-contract.mjs) ;;
              *) echo "Unexpected branch file: $file" >&2; exit 1 ;;
            esac
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply exact accessible-name repair and permanent regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/app/shop/page.tsx")
          text = source_path.read_text()
          replacements = [
              (
                  '        <select\n          name="section"',
                  '        <select\n          aria-label="Filter by section"\n          name="section"',
              ),
              (
                  '        <select\n          name="feature"',
                  '        <select\n          aria-label="Filter by card feature"\n          name="feature"',
              ),
              (
                  '        <select\n          name="sort"',
                  '        <select\n          aria-label="Sort inventory"\n          name="sort"',
              ),
          ]
          for before, after in replacements:
              if after in text:
                  continue
              if before not in text:
                  raise SystemExit(f"Expected shop filter anchor missing: {before!r}")
              text = text.replace(before, after, 1)
          source_path.write_text(text)

          test_path = Path("scripts/run-shop-filter-accessibility-contract.mjs")
          test_path.write_text('''import fs from "node:fs";\n\nconst source = fs.readFileSync("src/app/shop/page.tsx", "utf8");\nconst controls = [\n  { name: "section", label: "Filter by section" },\n  { name: "feature", label: "Filter by card feature" },\n  { name: "sort", label: "Sort inventory" },\n];\n\nfor (const control of controls) {\n  const escaped = control.label.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");\n  const pattern = new RegExp(`<select\\\\s+aria-label="${escaped}"\\\\s+name="${control.name}"`);\n  if (!pattern.test(source)) {\n    throw new Error(`Shop ${control.name} select is missing its accessible name.`);\n  }\n  const occurrences = source.split(`aria-label="${control.label}"`).length - 1;\n  if (occurrences !== 1) {\n    throw new Error(`Expected exactly one ${control.label} accessible name; found ${occurrences}.`);\n  }\n}\n\nconsole.log("Shop filter accessibility contract passed for all three select controls.");\n''')
          PY
          git diff --check

      - name: Run focused accessibility contract
        run: node scripts/run-shop-filter-accessibility-contract.mjs

      - name: Run lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run full Production build
        run: npm run build

      - name: Commit only validated source and regression
        shell: bash
        run: |
          set -euo pipefail
          git add src/app/shop/page.tsx scripts/run-shop-filter-accessibility-contract.mjs
          if git diff --cached --quiet; then
            echo "Exact source repair already committed; validation-only pass complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Label shop filter controls for accessibility"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
