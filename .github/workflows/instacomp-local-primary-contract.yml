name: InstaComp Local Primary Contract

on:
  pull_request:
    paths:
      - "src/lib/instacomp.ts"
      - "src/lib/instacomp-checklist-first-server.ts"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/app/admin/instacomp/fast/**"
      - "scripts/smoke-admin-runtime.mjs"
      - "scripts/apply-instacomp-seller-display-fix.py"
      - "scripts/apply-instacomp-ocr-registry-context-fix.py"
      - ".github/workflows/instacomp-local-primary-contract.yml"

permissions:
  contents: write

concurrency:
  group: instacomp-local-primary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materialize final audited source
        run: |
          python3 scripts/apply-instacomp-ocr-registry-context-fix.py
          python3 scripts/apply-instacomp-seller-display-fix.py
      - name: Verify materialized source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'boundedProductCandidates' src/lib/instacomp-checklist-first-server.ts
          grep -q 'sellerFeedbackPercent' src/lib/instacomp.ts
          grep -q 'item?.seller?.username' src/app/api/instacomp/scan/route.ts
          grep -q 'Item #' src/app/admin/instacomp/fast/InstaCompFastWorkbench.tsx
          grep -q 'path: "/admin/instacomp/checklist-sentinel"' scripts/smoke-admin-runtime.mjs
          grep -q 'path: "/admin/instacomp/fast"' scripts/smoke-admin-runtime.mjs
      - name: Persist materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/instacomp/scan/route.ts \
            src/app/admin/instacomp/fast/InstaCompFastWorkbench.tsx \
            src/lib/instacomp.ts \
            src/lib/instacomp-checklist-first-server.ts \
            scripts/run-instacomp-ocr-registry-primary-regressions.ts \
            scripts/instacomp-fast-workbench-certify.mjs \
            scripts/smoke-admin-runtime.mjs
          if git diff --cached --quiet; then
            echo "Final audited source already materialized."
          else
            git commit -m "Materialize final InstaComp audit fixes"
            git push origin HEAD:${{ github.head_ref }}
          fi
