name: InstaComp Local Primary Contract

on:
  pull_request:
    paths:
      - "services/instacomp-ai/**"
      - "src/lib/instacomp-ai-local.ts"
      - "src/lib/instacomp-ai-provider-failover.ts"
      - "src/lib/instacomp-ai-council-runtime.ts"
      - "src/lib/instacomp-checklist-first-server.ts"
      - "src/lib/instacomp-identity-guard.ts"
      - "src/app/api/instacomp/scan/route.ts"
      - "src/app/api/instacomp/internal-readiness/route.ts"
      - "src/app/api/account/seller/inventory/instacomp-card-edit/route.ts"
      - "scripts/check-instacomp-local-primary-contract.mjs"
      - "scripts/check-instacomp-provider-fallback.mjs"
      - "scripts/check-instacomp-no-external-reader-plan.mjs"
      - "scripts/run-instacomp-ai-council-runtime-regressions.ts"
      - "scripts/run-instacomp-internal-fail-closed-regressions.ts"
      - "scripts/run-instacomp-ocr-registry-primary-regressions.ts"
      - "scripts/run-instacomp-prizm-surface-regressions.ts"
      - ".github/workflows/instacomp-local-primary-contract.yml"
      - ".github/ops/collx-launch-trigger-20260811.txt"

permissions:
  contents: read

concurrency:
  group: instacomp-local-primary-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.event.pull_request.number != 1116
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r services/instacomp-ai/requirements.txt
          npm ci
      - name: Verify current candidate source
        shell: bash
        run: |
          set -euo pipefail
          echo "certifying $(git rev-parse HEAD)"
          git diff --check
      - name: Internal fail-closed regressions
        run: node --import tsx scripts/run-instacomp-internal-fail-closed-regressions.ts
      - name: Council runtime hard-stop regressions
        run: node --import tsx scripts/run-instacomp-ai-council-runtime-regressions.ts
      - name: OCR to Registry primary regressions
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: node --import tsx scripts/run-instacomp-ocr-registry-primary-regressions.ts
      - name: Prizm surface regressions
        run: node --import tsx scripts/run-instacomp-prizm-surface-regressions.ts
      - name: Internal architecture contract
        run: node scripts/check-instacomp-local-primary-contract.mjs
      - name: InstaComp-only identity gate
        run: node scripts/check-instacomp-provider-fallback.mjs
      - name: No external reader execution gate
        run: node scripts/check-instacomp-no-external-reader-plan.mjs
      - name: Mac engine tests
        working-directory: services/instacomp-ai
        run: |
          python -m compileall app tests
          pytest -q
      - name: Lint local-primary files
        run: >-
          npx eslint
          src/app/api/instacomp/scan/route.ts
          src/app/api/instacomp/internal-readiness/route.ts
          src/app/api/account/seller/inventory/instacomp-card-edit/route.ts
          src/lib/instacomp-ai-local.ts
          src/lib/instacomp-ai-provider-failover.ts
          src/lib/instacomp-ai-council-runtime.ts
          src/lib/instacomp-checklist-first-server.ts
          src/lib/instacomp-identity-guard.ts
          scripts/run-instacomp-ai-council-runtime-regressions.ts
          scripts/run-instacomp-internal-fail-closed-regressions.ts
          scripts/run-instacomp-ocr-registry-primary-regressions.ts
          scripts/run-instacomp-prizm-surface-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://example.com
          INSTACOMP_SERVICE_TOKEN: placeholder-service-token
          INTERNAL_PUBLISH_WEBHOOK_SECRET: placeholder-internal-publish-secret
          INTERNAL_IMPORT_WEBHOOK_SECRET: placeholder-internal-import-secret
        run: |
          npm run build
          git checkout -- public/instacomp-release.json

  collx_full_classify:
    if: github.event.pull_request.number == 1116
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STORE_ID: 00000000-0000-4000-8000-000000000001
      EXPECTED_ROWS: "6909"
      EXPECTED_SHA: e5675ad8a23c345bf76aa7f28d73fe5cf8f56452a2bff4595b92a88a6358e904
      WORK: /tmp/collx-full-classify
    steps:
      - name: Checkout isolated migration branch
        uses: actions/checkout@v4
        with:
          ref: ops/collx-full-inventory-migration-20260811
      - name: Reconstruct source and harden classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK" .vercel
          grep -Ev 'part(10|14|15)$' .github/ops/collx-full-metadata.sha256 | sha256sum -c -
          cat .github/ops/collx-full-metadata.part{00..09} .github/ops/collx-full-metadata.part10m0 .github/ops/collx-full-metadata.part10m1 .github/ops/collx-full-metadata.part11 .github/ops/collx-full-metadata.part12 .github/ops/collx-full-metadata.part13 .github/ops/collx-full-metadata.part14m .github/ops/collx-full-metadata.part15m > "$WORK/source.xz.b64"
          base64 -d "$WORK/source.xz.b64" | xz -d > "$WORK/source.csv"
          test "$(sha256sum "$WORK/source.csv" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(($(wc -l < "$WORK/source.csv")-1))" = "$EXPECTED_ROWS"
          cat .github/ops/collx-full-classify.py.part{00..01} > "$WORK/classify.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['WORK'])/'classify.py'; s=p.read_text()
          a=s.index('def db(q):'); b=s.index('def fnum',a)
          hardened='''def db(q):
 body=json.dumps({'query':q,'parameters':[],'read_only':True}).encode(); last=''
 for attempt in range(1,13):
  req=urllib.request.Request(ep,data=body,method='POST',headers={'Authorization':f'Bearer {mgmt}','Content-Type':'application/json','User-Agent':'Mozilla/5.0 (TruelyCollectables GitHub Actions)'})
  try:
   with urllib.request.urlopen(req,timeout=90) as r:return json.loads(r.read() or b'[]')
  except Exception as e:
   code=getattr(e,'code',None); last=f'{type(e).__name__}:{code}:{e}'
   if code not in (403,408,409,425,429,500,502,503,504,520,522,524,544) and attempt>=2: raise
   if attempt<12: time.sleep(min(10.0,attempt*.8))
 raise RuntimeError('Production DB query failed after retries: '+last)
'''
          s=s[:a]+hardened+s[b:]
          a=s.index('ebay=db('); b=s.index("print(json.dumps({'sourceRows'",a)
          efficient='''ebay=db(f"""select p.id,p.title,p.description,p.price,p.quantity,p.image_url,p.sport,p.player,p.sku,p.ebay_item_id from public.products p where p.store_id='{STORE}'::uuid and p.archived_at is null and nullif(btrim(coalesce(p.ebay_item_id,'')),'') is not null order by p.id""")
imgrows=db(f"""select i.legacy_product_id product_id,jsonb_agg(z.image_url) inventory_images from public.inventory_items i join public.products p on p.id=i.legacy_product_id join public.inventory_images z on z.inventory_item_id=i.id where p.store_id='{STORE}'::uuid and p.archived_at is null and nullif(btrim(coalesce(p.ebay_item_id,'')),'') is not null group by i.legacy_product_id""")
imap={int(x['product_id']):x.get('inventory_images') or [] for x in imgrows}
for p0 in ebay:p0['inventory_images']=imap.get(int(p0['id']),[])
existing={str(x['sku'])[6:] for x in db(f"select sku from public.products where store_id='{STORE}'::uuid and sku like 'COLLX-%'") if str(x.get('sku') or '').startswith('COLLX-')}
'''
          p.write_text(s[:a]+efficient+s[b:])
          PY
      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$WORK/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
      - name: Install fingerprint tools
        run: python3 -m pip install --quiet Pillow ImageHash
      - name: Classify full CollX collection
        run: python3 "$WORK/classify.py"
      - name: Remove Production env copy
        if: always()
        run: rm -f "$WORK/production.env"
      - name: Upload full classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-full-migration-classification-carrier
          path: |
            ${{ env.WORK }}/classification.json
            ${{ env.WORK }}/receipt.json
          retention-days: 7
          if-no-files-found: warn
