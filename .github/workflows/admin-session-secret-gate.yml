name: Admin Session Secret Gate

on:
  pull_request:
    paths:
      - "src/lib/admin-session.ts"
      - "src/app/api/admin/login/route.ts"
      - "src/app/admin/launch-readiness/**"
      - "src/app/api/admin/launch-readiness/route.ts"
      - "scripts/run-admin-login-simulations.mjs"
      - "scripts/run-admin-session-secret-fail-closed-simulations.mjs"
      - ".github/workflows/admin-session-secret-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/admin-session.ts"
      - "src/app/api/admin/login/route.ts"
      - "src/app/admin/launch-readiness/**"
      - "src/app/api/admin/launch-readiness/route.ts"
      - "scripts/run-admin-login-simulations.mjs"
      - "scripts/run-admin-session-secret-fail-closed-simulations.mjs"
      - ".github/workflows/admin-session-secret-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-session-secret-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate fail-closed session-secret contract
        run: node scripts/run-admin-session-secret-fail-closed-simulations.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate admin login behavior
        run: node --import tsx scripts/run-admin-login-simulations.mjs
