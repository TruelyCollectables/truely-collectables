name: CollX Pending REST Finalize 20260812

on:
  push:
    branches: [main]
    paths:
      - '.github/collx-pending-rest-finalize-trigger-20260812'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      STORE_ID: 00000000-0000-4000-8000-000000000001
    steps:
      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel "$RUNNER_TEMP/collx-pending-final"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull "$RUNNER_TEMP/collx-pending-final/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Park current unpriced CollX cards and certify Production storefront mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          env_path=os.path.join(os.environ['RUNNER_TEMP'],'collx-pending-final','production.env')
          vals={}
          for raw in open(env_path,encoding='utf-8'):
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              k,v=line.split('=',1); v=v.strip()
              if len(v)>=2 and v[0]==v[-1]=='"':
                  try: v=json.loads(v)
                  except Exception: v=v[1:-1]
              vals[k.strip()]=v
          base=(vals.get('NEXT_PUBLIC_SUPABASE_URL') or '').rstrip('/')
          key=vals.get('SUPABASE_SERVICE_ROLE_KEY') or ''
          if not base or not key: raise SystemExit('Production Supabase URL/service role key missing from Vercel env')
          print('::add-mask::'+key)
          store=os.environ['STORE_ID']
          headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'}

          def call(method,table,params=None,body=None,prefer=None):
              qs=urllib.parse.urlencode(params or {},safe='(),.*-_:')
              url=f'{base}/rest/v1/{table}'+(('?'+qs) if qs else '')
              h=dict(headers)
              if prefer: h['Prefer']=prefer
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as resp:
                      raw=resp.read().decode()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'{method} {table} HTTP {e.code}: {e.read().decode()[:1600]}')

          def get_all(table,base_params,select,order='id.asc'):
              rows=[]; offset=0
              while True:
                  params=dict(base_params); params.update({'select':select,'order':order,'limit':'1000','offset':str(offset)})
                  batch=call('GET',table,params) or []
                  rows.extend(batch)
                  if len(batch)<1000: break
                  offset+=1000
                  if offset>50000: raise SystemExit('Pagination safety stop')
              return rows

          pfilters={'store_id':'eq.'+store,'sku':'gte.COLLX-','sku':'lt.COLLY','ebay_item_id':'is.null'}
          products=get_all('products',pfilters,'id,sku,title,quantity,price,image_url,archived_at,ebay_item_id')
          inv=get_all('inventory_items',{'store_id':'eq.'+store},'id,legacy_product_id,sku,status,quantity,price')

          by_legacy={}; by_sku={}
          for x in inv:
              if x.get('legacy_product_id') is not None: by_legacy[int(x['legacy_product_id'])]=x
              if x.get('sku'): by_sku[str(x['sku'])]=x
          def chosen(p): return by_legacy.get(int(p['id'])) or by_sku.get(str(p.get('sku') or ''))
          def num(v):
              try: return float(v or 0)
              except Exception: return 0.0

          target=[p for p in products if p.get('archived_at') is None and num(p.get('quantity'))>0 and num(p.get('price'))<=0]
          target_units=sum(int(num(p.get('quantity'))) for p in target)
          bridged=sum(1 for p in target if chosen(p) is not None)
          print('COLLX_REST_PENDING_PRE='+json.dumps({'target_rows':len(target),'target_units':target_units,'bridged_rows':bridged},sort_keys=True))
          if (len(target),target_units,bridged)!=(127,127,127):
              raise SystemExit(f'Safety stop: current pending shape is {(len(target),target_units,bridged)}, expected (127,127,127)')

          now=datetime.now(timezone.utc).isoformat()
          ids=[str(int(p['id'])) for p in target]
          skus=[str(p['sku']) for p in target]
          def chunks(seq,n=40):
              for i in range(0,len(seq),n): yield seq[i:i+n]
          for c in chunks(ids):
              call('PATCH','inventory_items',{'store_id':'eq.'+store,'legacy_product_id':'in.('+','.join(c)+')'},{'status':'draft','updated_at':now},'return=minimal')
          for c in chunks(skus):
              call('PATCH','inventory_items',{'store_id':'eq.'+store,'sku':'in.('+','.join(c)+')'},{'status':'draft','updated_at':now},'return=minimal')

          inv=get_all('inventory_items',{'store_id':'eq.'+store},'id,legacy_product_id,sku,status,quantity,price')
          by_legacy={}; by_sku={}
          for x in inv:
              if x.get('legacy_product_id') is not None: by_legacy[int(x['legacy_product_id'])]=x
              if x.get('sku'): by_sku[str(x['sku'])]=x
          def chosen2(p): return by_legacy.get(int(p['id'])) or by_sku.get(str(p.get('sku') or ''))

          pending_draft=sum(1 for p in target if chosen2(p) and chosen2(p).get('status')=='draft')
          current=[p for p in products if p.get('archived_at') is None and num(p.get('quantity'))>0]
          positive=[p for p in current if num(p.get('price'))>0]
          positive_with_front=[p for p in positive if str(p.get('image_url') or '').strip()]
          storefront=[]
          missing_bridge=[]; nonactive=[]; inv_zero_qty=[]; inv_zero_price=[]; price_mismatch=[]; qty_mismatch=[]
          for p in positive_with_front:
              x=chosen2(p)
              if not x:
                  missing_bridge.append(p); continue
              if x.get('status')!='active': nonactive.append((p,x))
              if num(x.get('quantity'))<=0: inv_zero_qty.append((p,x))
              if num(x.get('price'))<=0: inv_zero_price.append((p,x))
              if round(num(x.get('price')),2)!=round(num(p.get('price')),2): price_mismatch.append((p,x))
              if int(num(x.get('quantity')))!=int(num(p.get('quantity'))): qty_mismatch.append((p,x))
              if x.get('status')=='active' and num(x.get('quantity'))>0:
                  storefront.append((p,x))
          archived_leaks=[]
          for p in products:
              if p.get('archived_at') is None or num(p.get('price'))<=0 or not str(p.get('image_url') or '').strip(): continue
              x=chosen2(p)
              if x and x.get('status')=='active' and num(x.get('quantity'))>0: archived_leaks.append((p,x))
          audit={
              'total_rows':len(products),
              'total_units':sum(max(0,int(num(p.get('quantity')))) for p in products),
              'archived_rows':sum(1 for p in products if p.get('archived_at') is not None),
              'archived_units':sum(max(0,int(num(p.get('quantity')))) for p in products if p.get('archived_at') is not None),
              'pending_rows':len(target),'pending_units':target_units,'pending_selected_draft_rows':pending_draft,
              'current_positive_rows':len(positive),'current_positive_with_front_rows':len(positive_with_front),
              'storefront_rows':len(storefront),'storefront_units':sum(int(num(x.get('quantity'))) for _,x in storefront),
              'positive_missing_bridge_rows':len(missing_bridge),'positive_nonactive_rows':len(nonactive),'positive_inventory_zero_qty_rows':len(inv_zero_qty),'positive_inventory_zero_price_rows':len(inv_zero_price),'positive_price_mismatch_rows':len(price_mismatch),'positive_quantity_mismatch_rows':len(qty_mismatch),'archived_storefront_leak_rows':len(archived_leaks),
              'current_missing_front_rows':sum(1 for p in positive if not str(p.get('image_url') or '').strip()),
          }
          print('COLLX_REST_FINAL_AUDIT='+json.dumps(audit,sort_keys=True))
          def sample(pairs):
              out=[]
              for item in pairs[:12]:
                  p=item[0] if isinstance(item,tuple) else item; x=item[1] if isinstance(item,tuple) else chosen2(p)
                  out.append({'id':p.get('id'),'sku':p.get('sku'),'title':str(p.get('title') or '')[:100],'product_price':p.get('price'),'inventory_price':x.get('price') if x else None,'product_qty':p.get('quantity'),'inventory_qty':x.get('quantity') if x else None,'status':x.get('status') if x else None})
              return out
          if any([missing_bridge,nonactive,inv_zero_qty,inv_zero_price,price_mismatch,qty_mismatch,archived_leaks]):
              print('COLLX_REST_BLOCKER_SAMPLE='+json.dumps({'missing_bridge':sample(missing_bridge),'nonactive':sample(nonactive),'inventory_zero_qty':sample(inv_zero_qty),'inventory_zero_price':sample(inv_zero_price),'price_mismatch':sample(price_mismatch),'qty_mismatch':sample(qty_mismatch),'archived_leaks':sample(archived_leaks)},sort_keys=True))
          if pending_draft!=127: raise SystemExit(f'Pending park verification failed: {pending_draft}/127 selected inventory rows are draft')
          print('COLLX_REST_PENDING_PARK=SUCCESS')
          PY
