name: Apply Internal Deploy Gate CI

on:
  push:
    branches:
      - agent/internal-deploy-environment-gate-20260726
    paths:
      - scripts/apply-internal-deploy-gate-ci.mjs
      - .github/workflows/apply-internal-deploy-gate-ci.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'TruelyCollectables'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/internal-deploy-environment-gate-20260726
          fetch-depth: 0

      - name: Apply exact CI transformation
        run: node scripts/apply-internal-deploy-gate-ci.mjs

      - name: Validate workflow diff
        run: git diff --check

      - name: Commit transformed workflow
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/active-market-integrity.yml; then
            echo "No release workflow change was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/active-market-integrity.yml
          git commit -m "Run internal deploy environment gate in CI"
          git push origin HEAD:agent/internal-deploy-environment-gate-20260726
