name: Emergency Apply CollX Storefront Grant 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/emergency-apply-collx-storefront-grant-20260730.yml"
      - "supabase/migrations/20260730133000_grant_collx_boundary_view_service_role.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-collx-storefront-grant-20260730
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/issue253-emergency-collx-grant-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4

      - name: Fail closed on repair scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "fix/issue253-emergency-collx-grant-20260730"
          test -f supabase/migrations/20260730133000_grant_collx_boundary_view_service_role.sql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply least-privilege Production grant and verify ACL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/collx-storefront-repair"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-storefront-repair/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const envPath = path.join(process.env.RUNNER_TEMP, 'collx-storefront-repair', 'production.env');
          const text = fs.readFileSync(envPath, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }

          const productionUrl = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) {
            throw new Error('Production NEXT_PUBLIC_SUPABASE_URL was not pulled from Vercel.');
          }
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !token) throw new Error('Production Supabase credentials are unavailable.');

          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;
          const request = async (query, readOnly) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
            });
            const body = await response.text();
            if (!response.ok) {
              const safe = body
                .replace(/postgres(?:ql)?:\/\/[^\s"']+/gi, 'postgresql://[REDACTED]')
                .replace(/Bearer\s+[A-Za-z0-9._~+/=-]+/gi, 'Bearer [REDACTED]')
                .slice(0, 4000);
              throw new Error(`Supabase Production repair failed with HTTP ${response.status}: ${safe}`);
            }
            return body ? JSON.parse(body) : [];
          };

          const migrationPath = path.join('supabase', 'migrations', '20260730133000_grant_collx_boundary_view_service_role.sql');
          const migrationSql = fs.readFileSync(migrationPath, 'utf8').trim();
          if (!migrationSql) throw new Error('Emergency grant migration is empty.');
          await request(migrationSql, false);

          const verification = await request(`
            select
              to_regclass('public.collx_only_inventory_boundary_violations') is not null as view_exists,
              has_table_privilege('service_role', 'public.collx_only_inventory_boundary_violations', 'select') as service_role_can_select,
              has_table_privilege('anon', 'public.collx_only_inventory_boundary_violations', 'select') as anon_can_select,
              has_table_privilege('authenticated', 'public.collx_only_inventory_boundary_violations', 'select') as authenticated_can_select;
          `, true);
          const row = Array.isArray(verification) ? verification[0] : null;
          if (!row?.view_exists || !row?.service_role_can_select || row?.anon_can_select || row?.authenticated_can_select) {
            throw new Error(`Unexpected CollX boundary ACL verification: ${JSON.stringify(verification).slice(0, 1000)}`);
          }
          console.log('Production CollX boundary view grant applied and ACL verified.');
          NODE
          rm -f "$RUNNER_TEMP/collx-storefront-repair/production.env"

      - name: Verify live storefront inventory route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -fsSL --max-time 30 "https://truelycollectables.com/shop?repair_run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if [ -n "$body" ] \
              && ! grep -Fq "permission denied for view collx_only_inventory_boundary_violations" <<<"$body" \
              && grep -Eq "Shop Sports Cards|active cards & collectibles|View Card / Item" <<<"$body"; then
              echo "Live /shop inventory response verified on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo "Live /shop did not recover after the Production ACL repair." >&2
          exit 1
