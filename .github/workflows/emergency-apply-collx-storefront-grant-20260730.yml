name: Emergency Apply CollX Storefront Grant 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/emergency-apply-collx-storefront-grant-20260730.yml"
      - "supabase/migrations/20260730133000_grant_collx_boundary_view_service_role.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-collx-storefront-grant-20260730
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/issue253-emergency-collx-grant-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4

      - name: Fail closed on repair scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "fix/issue253-emergency-collx-grant-20260730"
          test -f supabase/migrations/20260730133000_grant_collx_boundary_view_service_role.sql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair storefront sold-history server client in deployment workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/shop/page.tsx")
          text = path.read_text()
          old = "const supabase = createSupabaseServerClient();"
          new = "const supabase = createSupabaseServerClient({ admin: true });"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit("Expected storefront Supabase client line was not found.")
          PY
          grep -Fq 'const supabase = createSupabaseServerClient({ admin: true });' src/app/shop/page.tsx
          echo "Storefront sold-history query now uses the protected server client."

      - name: Link Vercel project and pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/collx-storefront-repair"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-storefront-repair/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Apply grant, reload PostgREST, and retrieve verified server key
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { setTimeout as sleep } from 'node:timers/promises';

          const workDir = path.join(process.env.RUNNER_TEMP, 'collx-storefront-repair');
          const envPath = path.join(workDir, 'production.env');
          const text = fs.readFileSync(envPath, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }

          const productionUrl = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) {
            throw new Error('Production NEXT_PUBLIC_SUPABASE_URL was not pulled from Vercel.');
          }
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !token) throw new Error('Production Supabase credentials are unavailable.');

          const databaseEndpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;
          const databaseRequest = async (query, readOnly) => {
            const response = await fetch(databaseEndpoint, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
            });
            const body = await response.text();
            if (!response.ok) {
              const safe = body
                .replace(/postgres(?:ql)?:\/\/[^\s"']+/gi, 'postgresql://[REDACTED]')
                .replace(/Bearer\s+[A-Za-z0-9._~+/=-]+/gi, 'Bearer [REDACTED]')
                .slice(0, 4000);
              throw new Error(`Supabase Production database repair failed with HTTP ${response.status}: ${safe}`);
            }
            return body ? JSON.parse(body) : [];
          };

          const migrationPath = path.join('supabase', 'migrations', '20260730133000_grant_collx_boundary_view_service_role.sql');
          const migrationSql = fs.readFileSync(migrationPath, 'utf8').trim();
          if (!migrationSql) throw new Error('Emergency grant migration is empty.');
          await databaseRequest(migrationSql, false);
          await databaseRequest("notify pgrst, 'reload schema';", false);

          const verification = await databaseRequest(`
            select
              to_regclass('public.collx_only_inventory_boundary_violations') is not null as view_exists,
              has_table_privilege('service_role', 'public.collx_only_inventory_boundary_violations', 'select') as service_role_can_select,
              has_table_privilege('anon', 'public.collx_only_inventory_boundary_violations', 'select') as anon_can_select,
              has_table_privilege('authenticated', 'public.collx_only_inventory_boundary_violations', 'select') as authenticated_can_select;
          `, true);
          const row = Array.isArray(verification) ? verification[0] : null;
          if (!row?.view_exists || !row?.service_role_can_select || row?.anon_can_select || row?.authenticated_can_select) {
            throw new Error(`Unexpected CollX boundary ACL verification: ${JSON.stringify(verification).slice(0, 1000)}`);
          }

          const keysResponse = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          const keysText = await keysResponse.text();
          if (!keysResponse.ok) {
            throw new Error(`Unable to retrieve Production Supabase API keys: HTTP ${keysResponse.status}: ${keysText.slice(0, 2000)}`);
          }
          const keys = JSON.parse(keysText);
          const elevated = Array.isArray(keys)
            ? keys.find((entry) => typeof entry?.api_key === 'string' && entry.api_key.startsWith('sb_secret_'))
              || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase() === 'service_role')
              || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase().includes('service'))
            : null;
          const serviceKey = elevated?.api_key;
          if (!serviceKey) throw new Error('No elevated Supabase secret/service_role API key was returned.');
          console.log('::add-mask::' + serviceKey);

          let lastStatus = 0;
          let lastBody = '';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const response = await fetch(
              `${productionUrl}/rest/v1/collx_only_inventory_boundary_violations?select=legacy_product_id&limit=1`,
              {
                headers: {
                  apikey: serviceKey,
                  Authorization: `Bearer ${serviceKey}`,
                },
              },
            );
            lastStatus = response.status;
            lastBody = await response.text();
            if (response.ok) {
              fs.writeFileSync(path.join(workDir, 'service-role-key'), serviceKey, { mode: 0o600 });
              console.log(`Verified elevated Supabase REST access on attempt ${attempt}.`);
              process.exit(0);
            }
            await sleep(5000);
          }
          const safeBody = lastBody.replaceAll(serviceKey, '[REDACTED]').slice(0, 2000);
          throw new Error(`Verified elevated key could not query the boundary view: HTTP ${lastStatus}: ${safeBody}`);
          NODE

      - name: Install Production service-role key
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/collx-storefront-repair/service-role-key"
          test -s "$key_file"
          service_key="$(cat "$key_file")"
          echo "::add-mask::$service_key"
          printf '%s\n' "$service_key" | npx vercel@56.2.0 env add SUPABASE_SERVICE_ROLE_KEY production \
            --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          echo "Production SUPABASE_SERVICE_ROLE_KEY installed in Vercel."

      - name: Redeploy repaired application to Production
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy --prod --yes --force \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify live storefront inventory route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --max-time 45 "https://truelycollectables.com/shop?repair_run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if [ -n "$body" ] \
              && ! grep -Fq "permission denied for view collx_only_inventory_boundary_violations" <<<"$body" \
              && ! grep -Fq "Missing Supabase service role key environment variable" <<<"$body" \
              && grep -Eq "Shop Sports Cards|active cards & collectibles|View Card / Item" <<<"$body"; then
              echo "Live /shop inventory response verified on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo "Live /shop did not recover after the Production database, credential, code, and deploy repair." >&2
          exit 1

      - name: Remove temporary secret files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/collx-storefront-repair/production.env"
          rm -f "$RUNNER_TEMP/collx-storefront-repair/service-role-key"
