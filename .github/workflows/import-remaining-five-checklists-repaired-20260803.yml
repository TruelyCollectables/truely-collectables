name: Import Remaining Five Repaired Checklists 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-remaining-five-checklists-repaired-20260803.yml"
      - "scripts/ops/remaining-five-payload/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: pokemon-checklist-registry-production
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: d0784767fd664bf0960bf28e71afd7ca15533182
  EXPECTED_BRANCH: ops/import-remaining-five-checklists-repaired-20260803
  VALIDATION_ARTIFACT_ID: "8845633740"
  VALIDATION_ARTIFACT_SHA256: 780963f8bdbdbb2ab5cedb3ac0c727f6f14155c8e7fee94c0e92c9e937fb9239
  IMPORTER_SHA256: 9c0a098baf9768e98b1ad36e5746485b3a7ed16b756c3791d7c2d5bbbcbac7d8
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/remaining-five-checklists-repaired-20260803

jobs:
  repair-import-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "origin/$EXPECTED_BRANCH"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          test "${changed[0]}" = '.github/workflows/import-remaining-five-checklists-repaired-20260803.yml'
          test "${changed[1]}" = 'scripts/ops/remaining-five-payload/part-00.b64'
          test "${changed[2]}" = 'scripts/ops/remaining-five-payload/part-01.b64'
          test "${changed[3]}" = 'scripts/ops/remaining-five-payload/part-02.b64'
          test "${changed[4]}" = 'scripts/ops/remaining-five-payload/part-03.b64'
          git diff --check "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          printf '{"schema":"tcos.checklist.remainingFiveRunContext.v1","runId":"%s","productionWritesAuthorized":true,"releaseCount":5}\n' \
            "$GITHUB_RUN_ID" > "$EVIDENCE_DIR/run-context.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and resolve masked Production credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false pg@8.16.3
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/remaining-five-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/remaining-five-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$RUNNER_TEMP/remaining-five-production/production.env" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim(); if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('='); if (index < 1) continue;
            const key = line.slice(0, index).trim(); let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value = JSON.parse(value); } catch { value = value.slice(1, -1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            parsed[key] = value;
          }
          (async () => {
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
            if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            let serviceKey = String(parsed.SUPABASE_SERVICE_ROLE_KEY || parsed.SUPABASE_SECRET_KEY || Object.entries(parsed).find(([key, value]) => /^SUPABASE_SECRET_.*_KEY$/.test(key) && value)?.[1] || '');
            if (!serviceKey) {
              const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, { headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` } });
              const text = await response.text();
              if (!response.ok) throw new Error(`Supabase API-key lookup failed with HTTP ${response.status}: ${text.slice(0, 500)}`);
              const keys = text ? JSON.parse(text) : [];
              if (!Array.isArray(keys)) throw new Error('Supabase API-key lookup returned an unexpected payload');
              const legacy = keys.find((key) => key?.name === 'service_role' && key?.api_key);
              const roleSecret = keys.find((key) => key?.secret_jwt_template?.role === 'service_role' && key?.api_key);
              const secret = keys.find((key) => key?.type === 'secret' && key?.api_key);
              serviceKey = String(legacy?.api_key || roleSecret?.api_key || secret?.api_key || '');
            }
            if (!serviceKey) throw new Error('No elevated Supabase API key could be resolved');
            for (const value of [productionUrl, serviceKey]) console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_ROLE_KEY<<SUPABASE_KEY_EOF\n${serviceKey}\nSUPABASE_KEY_EOF\n`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Download validation artifact and materialize pinned importer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remaining-five-artifact"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" -o "$RUNNER_TEMP/remaining-five-artifact.zip"
          echo "$VALIDATION_ARTIFACT_SHA256  $RUNNER_TEMP/remaining-five-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/remaining-five-artifact.zip" -d "$RUNNER_TEMP/remaining-five-artifact"
          cat scripts/ops/remaining-five-payload/part-*.b64 > "$RUNNER_TEMP/importer.gz.b64"
          tr -d '\r\n' < "$RUNNER_TEMP/importer.gz.b64" | base64 -d | gzip -d > scripts/ops/import-remaining-five-checklists-repaired-20260803.mjs
          echo "$IMPORTER_SHA256  scripts/ops/import-remaining-five-checklists-repaired-20260803.mjs" | sha256sum -c -
          node --check scripts/ops/import-remaining-five-checklists-repaired-20260803.mjs

      - name: Require exact passing source files without writes
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/remaining-five-artifact" node - <<'NODE'
          const fs = require('node:fs'); const path = require('node:path');
          const receipt = JSON.parse(fs.readFileSync(path.join(process.env.ARTIFACT_ROOT, 'validation.json'), 'utf8'));
          const expected = {
            '2025-panini-prizm-wnba': [8883,14,350,146,8883],
            '2024-panini-select-wnba': [8480,17,560,174,8480],
            '2025-panini-select-wnba': [11744,17,553,232,11744],
            '2024-bowman-chrome-baseball': [9419,29,823,124,9419],
            '2025-bowman-baseball': [21539,28,963,239,21539],
          };
          if (receipt.schema !== 'tcos.checklist.sixReleaseValidation.v1' || receipt.status !== 'passed') throw new Error('Pinned validation receipt did not pass');
          if (receipt.safety?.productionDatabaseWrites !== false || receipt.safety?.rowSourcesNeverRepresentedAsOfficialManufacturer !== true) throw new Error('Pinned validation safety receipt is wrong');
          for (const [id, values] of Object.entries(expected)) {
            const result = receipt.results?.find((entry) => entry.id === id); const keys = ['rows','sets','cards','parallels','identities'];
            if (!result || result.validationStatus !== 'passed') throw new Error(`${id} source validation did not pass`);
            keys.forEach((key, index) => { if (Number(result.counts?.[key]) !== values[index]) throw new Error(`${id} ${key} is wrong`); });
            const dir = path.join(process.env.ARTIFACT_ROOT, 'private', id);
            if (!fs.existsSync(path.join(dir, `${id}.plan.json`)) || !fs.existsSync(path.join(dir, `${id}.xlsx`))) throw new Error(`${id} source files are missing`);
          }
          console.log(JSON.stringify({ status:'passed', releaseCount:5 }, null, 2));
          NODE

      - name: Repair, import, and audit remaining five releases
        shell: bash
        env:
          ALLOW_PRODUCTION_REMAINING_CHECKLIST_IMPORT: "YES"
          ARTIFACT_ROOT: ${{ runner.temp }}/remaining-five-artifact
        run: |
          set -euo pipefail
          node scripts/ops/import-remaining-five-checklists-repaired-20260803.mjs --apply --artifact-root "$ARTIFACT_ROOT" \
            --receipt "$EVIDENCE_DIR/production-import.json" --failure-receipt "$EVIDENCE_DIR/failure.json"

      - name: Require exact passing Production receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/remaining-five-checklists-repaired-20260803/production-import.json', 'utf8'));
          const expected = {
            '2025-panini-prizm-wnba':[349,8879,'6a7dff2b6233fb95353b578fdcce3f244092774cc279a687cac86c0d7b4dbe53',1,1,0,4],
            '2024-panini-select-wnba':[550,8440,'7007383c1060244c5c2cf6377d0f0991376a40176e29fe4c1a89c2ab1854101f',10,10,0,40],
            '2025-panini-select-wnba':[548,11724,'121cef5d40943155e83d7e4a5d26ccb517cf2fa3e319ab9ced2a2ffb87737ccb',5,5,0,20],
            '2024-bowman-chrome-baseball':[779,9243,'cc77a438df9d099525b0e71fa84c6342b269f3f135c9a44a3c1a6a10c41747f0',50,44,12,176],
            '2025-bowman-baseball':[939,21514,'15666cb5c08d699241d1eb97b27977b2720c1091c7d642078b36b550c297f14d',2,2,0,25],
          };
          if (receipt.schema !== 'tcos.checklist.remainingFiveRepairedProductionImport.v1' || receipt.status !== 'passed' || receipt.imports?.length !== 5) throw new Error('Remaining-five receipt did not pass');
          for (const [id, wanted] of Object.entries(expected)) {
            const entry = receipt.imports.find((item) => item.id === id); if (!entry) throw new Error(`Missing ${id}`);
            const repair = entry.repair || {};
            const actual = [Number(entry.repairedCounts?.cards),Number(entry.repairedCounts?.identities),entry.repairedPlanSha256,repair.duplicateGroups,repair.mergeGroups,repair.disambiguatedCards,repair.duplicateIdentitiesRemoved];
            if (JSON.stringify(actual) !== JSON.stringify(wanted)) throw new Error(`${id} repaired contract is wrong`);
            if (repair.schema !== 'tcos.checklist.databaseCardKeyRepair.v1' || repair.status !== 'passed' || repair.integrity?.uniqueDatabaseCardKeys !== wanted[0] || repair.integrity?.uniqueFingerprints !== wanted[1]) throw new Error(`${id} repair integrity is incomplete`);
          }
          const final = receipt.finalAudit || {};
          const finalExpected = { releases:303, active_versions:303, active_cards:39487, active_identities:110718, identity_deficit_versions:0, failed_import_runs:0, registry_public_grants:0, temporary_login_roles:0 };
          for (const [key,value] of Object.entries(finalExpected)) if (Number(final[key]) !== value) throw new Error(`Unexpected final ${key}: ${final[key]}`);
          if (final.targets?.length !== 5 || final.private_source_bucket !== true || final.writer_rpc !== true) throw new Error('Final audit is incomplete');
          const connection = receipt.postgresConnection || {};
          if (connection.source !== 'shared-pooler' || connection.poolMode !== 'transaction' || connection.userClass !== 'project-qualified-temporary-login' || connection.writerRole !== 'service_role') throw new Error('Unverified writer transport');
          const safety = receipt.safety || {};
          for (const key of ['databaseCardKeyRepairsValidated','multiSubjectCardsCanonicalized','duplicatePrintedNumbersDisambiguated','exactVerifiedTransportOnly','noCandidateLoop','noSleepPreflight','eachReleaseAuditedBeforeNext','temporaryLoginRoleDeleted']) if (safety[key] !== true) throw new Error(`Missing safety ${key}`);
          if (safety.migrationsApplied !== false || safety.deploymentPerformed !== false) throw new Error('Unexpected migration or deployment');
          console.log(JSON.stringify({ status:receipt.status, imports:receipt.imports.map((entry)=>({id:entry.id,counts:entry.repairedCounts})), final }, null, 2));
          NODE

      - name: Capture read-only Production state after failure
        if: failure()
        shell: bash
        run: |
          set +e
          node - <<'NODE'
          const fs = require('node:fs'); const productionUrl = String(process.env.NEXT_PUBLIC_SUPABASE_URL || ''); const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const output = `${process.env.EVIDENCE_DIR}/workflow-failure-audit.json`;
          (async () => {
            if (!productionUrl || !accessToken) return;
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            const slugs = ['2025-panini-prizm-wnba','2024-panini-select-wnba','2025-panini-select-wnba','2024-bowman-chrome-baseball','2025-bowman-baseball'].map((value)=>`'${value}'`).join(',');
            const query = `with active_versions as (select * from public.checklist_versions where is_active), identity_counts as (select v.id,v.normalized_identity_count expected_identities,count(i.id)::bigint actual_identities from active_versions v left join public.checklist_card_identities i on i.version_id=v.id group by v.id,v.normalized_identity_count) select json_build_object('releases',(select count(*) from public.checklist_releases),'active_versions',(select count(*) from active_versions),'active_cards',(select count(*) from public.checklist_cards c join active_versions v on v.id=c.version_id),'active_identities',(select count(*) from public.checklist_card_identities i join active_versions v on v.id=i.version_id),'identity_deficit_versions',(select count(*) from identity_counts where actual_identities<>expected_identities),'failed_import_runs',(select count(*) from public.checklist_import_runs where status='failed'),'temporary_login_roles',(select count(*) from pg_roles where rolname like 'cli_login_%'),'targets',(select coalesce(jsonb_agg(slug order by slug),'[]'::jsonb) from public.checklist_releases where slug in (${slugs}))) state;`;
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, { method:'POST', headers:{ Authorization:`Bearer ${accessToken}`, Accept:'application/json', 'Content-Type':'application/json' }, body:JSON.stringify({ query, parameters:[], read_only:true }) });
            const text = await response.text(); const payload = response.ok ? {status:'captured',state:(text?JSON.parse(text):[])?.[0]?.state||null} : {status:'audit_failed',httpStatus:response.status};
            fs.writeFileSync(output, `${JSON.stringify(payload,null,2)}\n`);
          })().catch((error)=>fs.writeFileSync(output,`${JSON.stringify({status:'audit_exception',error:String(error?.message||error).slice(0,500)},null,2)}\n`));
          NODE

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-five-checklists-repaired-production-20260803
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/remaining-five-production" "$RUNNER_TEMP/remaining-five-artifact"
          rm -f "$RUNNER_TEMP/remaining-five-artifact.zip" "$RUNNER_TEMP/importer.gz.b64"
          rm -f scripts/ops/import-remaining-five-checklists-repaired-20260803.mjs
          rm -f .env.local .env.production.local
