name: InstaComp Local Witness Diagnostic 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-local-witness-diagnostic-20260810.yml"
      - "src/app/api/instacomp/ops/local-witness-diagnostic/route.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: instacomp-production-acceptance-global
  cancel-in-progress: false

env:
  PINNED_SAFE_MAIN: c2e0a56b5252a965aea4c301bd29b12b46d9b4f6
  EXPECTED_BRANCH: ops/instacomp-local-witness-diagnostic-20260810-1454
  EXPECTED_MAC_FINGERPRINT: 5ab5a655abf8352f5eac7c1df836028ff839f9fb784afd9dd3b3c487c1cd605d
  FROZEN_IMAGE_ARTIFACT_ID: "8994498762"
  SONIA_INVENTORY_ID: ef0e06a3-a6de-4242-8c52-52b420185850
  SONIA_FRONT_SHA256: eaacec37493b419f1d397df739aedd9df218639ded876c481b2fb28b2b3eb2b1
  SONIA_BACK_SHA256: 3ecd070456e09342ed83ca88193ed2d029cd8a77ed5b2e2ae1ce443e9866978c
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  EVIDENCE_DIR: evidence/instacomp-local-witness-diagnostic-20260810
  TEMP_DIR: /tmp/instacomp-local-witness-diagnostic-20260810

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Lock safe source and diagnostic-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$PINNED_SAFE_MAIN" "$current_main"
          protected="$(git diff --name-only "$PINNED_SAFE_MAIN" "$current_main" -- \
            services/instacomp-ai \
            src/app/api/instacomp/scan/route.ts \
            src/lib/instacomp-ai-local.ts \
            src/lib/instacomp-consensus.ts \
            src/lib/instacomp-ai-council-security.ts | sort)"
          test -z "$protected"
          merge_base="$(git merge-base "$PINNED_SAFE_MAIN" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/instacomp-local-witness-diagnostic-20260810.yml' \
            'src/app/api/instacomp/ops/local-witness-diagnostic/route.ts' | sort)"
          test "$changed" = "$expected"
          grep -Fq 'tcos.instacomp.localWitnessDiagnostic.v1' src/app/api/instacomp/ops/local-witness-diagnostic/route.ts
          grep -Fq 'FROZEN_IMAGE_HASH_MISMATCH' src/app/api/instacomp/ops/local-witness-diagnostic/route.ts
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR/frozen"
          echo "START_MAIN=$current_main" >> "$GITHUB_ENV"
          printf '{"pinnedSafeMain":"%s","startMain":"%s","protectedSourceDrift":false,"diagnosticOnly":true}\n' "$PINNED_SAFE_MAIN" "$current_main" > "$EVIDENCE_DIR/source-lock.json"

      - name: Prove exact repaired Mac is live before mutation
        shell: bash
        run: |
          set -euo pipefail
          out="$EVIDENCE_DIR/readiness-before.json"
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?witness-diagnostic=before&ts=$(date +%s)")"
          test "$code" = "200"
          node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const k of ["ok","configured","reachable","internalMemoryReady","checklistReady","localModelReady"])if(b[k]!==true)throw new Error(`${k}=${b[k]}`);if(b.runtimeSourceFingerprint!==process.argv[2])throw new Error(`fingerprint=${b.runtimeSourceFingerprint}`);' "$out" "$EXPECTED_MAC_FINGERPRINT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, typecheck, and link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm ci >/dev/null
          npx tsc --noEmit
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Download immutable frozen Sonia pair and prove hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_IMAGE_ARTIFACT_ID}/zip" > "$TEMP_DIR/frozen.zip"
          unzip -q "$TEMP_DIR/frozen.zip" -d "$TEMP_DIR/frozen"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          test -f "$front" && test -f "$back"
          test "$(sha256sum "$front" | awk '{print $1}')" = "$SONIA_FRONT_SHA256"
          test "$(sha256sum "$back" | awk '{print $1}')" = "$SONIA_BACK_SHA256"
          printf '{"frontSha256":"%s","backSha256":"%s","exact":true}\n' "$SONIA_FRONT_SHA256" "$SONIA_BACK_SHA256" > "$EVIDENCE_DIR/frozen-image-proof.json"

      - name: Prove stale acceptance credential absent
        shell: bash
        run: |
          set -euo pipefail
          list="$TEMP_DIR/env-before.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          if grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"; then
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          fi
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"

      - name: Provision isolated acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          secret="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy temporary read-only diagnostic bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/diagnostic-deploy.log" 2>&1
          touch "$TEMP_DIR/diagnostic-deployed"

      - name: Run frozen Sonia witness diagnostic through protected bridge
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$token"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          result="$EVIDENCE_DIR/sonia-local-witness.json"
          ready=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 280 -o "$result" -w '%{http_code}' -X POST \
              -H "x-tcos-instacomp-service-token: $token" \
              -F "front=@${front};type=image/jpeg" \
              -F "back=@${back};type=image/jpeg" \
              "$PRODUCTION_ORIGIN/api/instacomp/ops/local-witness-diagnostic?attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ]; then cat "$result"; exit 1; fi
            sleep 5
          done
          test "$ready" = "1"
          cat "$result"
          node - "$result" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(b.ok!==true) throw new Error(`diagnostic failed ${b.code||''}`);
          if(b.schema!=='tcos.instacomp.localWitnessDiagnostic.v1') throw new Error(`schema=${b.schema}`);
          if(!b.localVision) throw new Error('localVision missing');
          NODE
          touch "$TEMP_DIR/diagnostic-complete"

      - name: Remove isolated acceptance credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          for attempt in 1 2 3; do
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$TEMP_DIR/env-cleanup.txt"
            if ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$TEMP_DIR/env-cleanup.txt"; then touch "$TEMP_DIR/token-removed"; break; fi
            sleep 3
          done
          test -f "$TEMP_DIR/token-removed"

      - name: Clean redeploy latest main and prove temporary route removed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/diagnostic-deployed" ]; then exit 0; fi
          test -f "$TEMP_DIR/token-removed"
          git fetch origin main --quiet
          clean_main="$(git rev-parse origin/main)"
          git checkout --detach "$clean_main"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/clean-deploy.log" 2>&1
          out="$EVIDENCE_DIR/readiness-after.json"
          ready=0
          for attempt in $(seq 1 18); do
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?witness-diagnostic=after&attempt=$attempt&ts=$(date +%s)")"
            if [ "$code" = "200" ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(b.runtimeSourceFingerprint!==process.argv[2])process.exit(1);for(const k of ["ok","configured","reachable","internalMemoryReady","checklistReady","localModelReady"])if(b[k]!==true)process.exit(1);' "$out" "$EXPECTED_MAC_FINGERPRINT"; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"
          route_code="$(curl -sS --max-time 30 -o "$TEMP_DIR/removed-route.txt" -w '%{http_code}' -X POST "$PRODUCTION_ORIGIN/api/instacomp/ops/local-witness-diagnostic?removed=1&ts=$(date +%s)")"
          test "$route_code" = "404"
          printf '{"clean":true,"startMain":"%s","deployedMain":"%s","acceptanceCredentialPresent":false,"temporaryRouteRemoved":true,"runtimeSourceFingerprint":"%s","diagnosticCompleted":%s}\n' \
            "$START_MAIN" "$clean_main" "$EXPECTED_MAC_FINGERPRINT" "$([ -f "$TEMP_DIR/diagnostic-complete" ] && echo true || echo false)" > "$EVIDENCE_DIR/cleanup-proof.json"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-local-witness-diagnostic-20260810
          path: evidence/instacomp-local-witness-diagnostic-20260810
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR" .vercel .env.local .env.production.local
