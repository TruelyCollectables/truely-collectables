name: Install InstaComp Gateway SDK 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/install-instacomp-gateway-sdk-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned current Gateway dependencies
        run: npm install --save-exact ai@latest @ai-sdk/gateway@latest

      - name: Verify dependency resolution
        run: |
          npm ls ai @ai-sdk/gateway
          git diff --check

      - name: Commit generated package files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Vercel AI Gateway dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
