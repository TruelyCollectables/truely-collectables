name: Merchant feed validation

on:
  pull_request:
    paths:
      - "src/app/google-merchant-feed.xml/route.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/merchant-feed-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:isolated
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder-service-role-key
