name: Ops Apply InstaComp Local Secondary Witness 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/patch-instacomp-local-secondary-witness-20260810.py'
      - '.github/workflows/ops-apply-instacomp-local-secondary-witness-20260810.yml'

permissions:
  contents: write

concurrency:
  group: instacomp-local-secondary-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-certify:
    if: github.event.pull_request.head.ref == 'fix/instacomp-local-secondary-identity-witness-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-local-secondary-identity-witness-20260810
          fetch-depth: 0

      - name: Prove exact repair base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = '370f3eb178a22cf66c1240c82ffc05a84511040a'
          test "$(git merge-base HEAD origin/main)" = '370f3eb178a22cf66c1240c82ffc05a84511040a'

      - name: Apply Mac-local secondary witness repair
        run: python scripts/ops/patch-instacomp-local-secondary-witness-20260810.py

      - name: Reject malformed diff
        run: git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r services/instacomp-ai/requirements.txt
          npm ci

      - name: Run targeted Mac secondary witness test
        working-directory: services/instacomp-ai
        run: pytest -q tests/test_local_secondary_witness.py tests/test_lora_runtime_candidate.py tests/test_local_vision_failover.py tests/test_apple_vision_fail_closed.py

      - name: Preserve no-external-reader identity boundary
        run: node scripts/check-instacomp-no-external-reader-plan.mjs

      - name: Run council and fail-closed regressions
        run: |
          node --import tsx scripts/run-instacomp-ai-council-runtime-regressions.ts
          node --import tsx scripts/run-instacomp-internal-fail-closed-regressions.ts
          node --import tsx scripts/run-instacomp-ocr-registry-primary-regressions.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint changed runtime files
        run: npx eslint src/app/api/instacomp/scan/route.ts src/lib/instacomp-ai-local.ts scripts/run-instacomp-ai-council-runtime-regressions.ts scripts/run-instacomp-internal-fail-closed-regressions.ts scripts/run-instacomp-ocr-registry-primary-regressions.ts

      - name: Compile complete Mac service
        working-directory: services/instacomp-ai
        run: python -m compileall app tests

      - name: Remove one-shot machinery
        shell: bash
        run: |
          rm -f scripts/ops/patch-instacomp-local-secondary-witness-20260810.py
          rm -f .github/workflows/ops-apply-instacomp-local-secondary-witness-20260810.yml

      - name: Commit certified product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TruelyCollectables'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add independent Mac-local secondary identity witness'
          git push origin HEAD:fix/instacomp-local-secondary-identity-witness-20260810
