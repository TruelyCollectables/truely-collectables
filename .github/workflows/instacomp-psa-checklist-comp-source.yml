name: InstaComp PSA Checklist and Comp Source

on:
  pull_request:
    branches: [main]
    paths:
      - "services/instacomp-ai/app/sentinel.py"
      - "services/instacomp-ai/app/sentinel_routes.py"
      - "services/instacomp-ai/app/sentinel_sources.py"
      - "services/instacomp-ai/app/psa_verified_sets.py"
      - "services/instacomp-ai/tests/test_sentinel_psa_sources.py"
      - "services/instacomp-ai/tests/test_sentinel_psa_verified_index.py"
      - "services/instacomp-ai/tests/test_sentinel_registry_recovery_gate.py"
      - "services/instacomp-ai/scripts/probe-psa-sentinel.py"
      - "src/app/api/instacomp/checklist-sentinel/import/route.ts"
      - "src/lib/checklist-registry/psa-apr-html.ts"
      - "src/lib/checklist-registry/server.ts"
      - "src/lib/checklist-registry/source-adapter.ts"
      - "src/lib/instacomp-teacher-market-provider.ts"
      - "scripts/run-psa-apr-checklist-adapter-simulations.ts"
      - "scripts/run-instacomp-teacher-market-provider-simulations.ts"
      - ".github/workflows/instacomp-psa-checklist-comp-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Python service dependencies
        run: pip install -r services/instacomp-ai/requirements.txt
      - name: Compile Sentinel source layer
        run: python -m compileall -q services/instacomp-ai/app
      - name: Run PSA Sentinel and Registry recovery-gate tests
        working-directory: services/instacomp-ai
        run: pytest -q tests/test_sentinel_psa_sources.py tests/test_sentinel_psa_verified_index.py tests/test_sentinel_registry_recovery_gate.py
      - name: Read-only live PSA probe through actual Sentinel source client
        working-directory: services/instacomp-ai
        shell: bash
        run: |
          set -euo pipefail
          python scripts/probe-psa-sentinel.py | tee ../../psa-checklist-probe.jsonl
      - name: Install web dependencies
        run: npm ci
      - name: Run PSA APR Checklist Registry adapter simulations
        run: node --import tsx scripts/run-psa-apr-checklist-adapter-simulations.ts
      - name: Run PSA graded-comp teacher regressions
        run: node --import tsx scripts/run-instacomp-teacher-market-provider-simulations.ts
      - name: Typecheck integrated Registry and teacher paths
        run: npx tsc --noEmit
      - name: Production build gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build
      - name: Upload sanitized PSA recovery probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psa-checklist-recovery-probe-${{ github.run_id }}
          path: psa-checklist-probe.jsonl
          if-no-files-found: warn
          retention-days: 14
