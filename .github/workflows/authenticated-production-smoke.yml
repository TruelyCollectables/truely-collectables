name: Authenticated Production Smoke And Stripe Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/audit-authenticated-production-readiness.mjs"
      - "scripts/verify-production-stripe-cron.mjs"
      - ".github/workflows/authenticated-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
      SMOKE_BASE_URL: https://truelycollectables.com
    steps:
      - name: Check out temporary launch-audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/one-hour-launch-audit-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify protected Production Stripe reconciliation
        run: node scripts/verify-production-stripe-cron.mjs

      - name: Check admin smoke secret availability
        id: admin_secret
        shell: bash
        run: |
          if test -n "${SMOKE_ADMIN_PASSWORD:-}"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SMOKE_ADMIN_PASSWORD is unavailable; protected Stripe verification completed."
          fi

      - name: Run authenticated redacted Launch Readiness audit
        if: ${{ steps.admin_secret.outputs.available == 'true' }}
        id: readiness
        continue-on-error: true
        run: node scripts/audit-authenticated-production-readiness.mjs > authenticated-production-readiness.log 2>&1

      - name: Run complete existing Production smoke suite
        if: ${{ steps.admin_secret.outputs.available == 'true' }}
        id: smoke
        continue-on-error: true
        run: node scripts/smoke-production.mjs > production-smoke.log 2>&1

      - name: Upload redacted smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-production-smoke-evidence
          path: |
            production-stripe-cron-verification.json
            authenticated-production-readiness.json
            authenticated-production-readiness.log
            production-smoke.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce authenticated readiness and smoke when available
        if: ${{ steps.admin_secret.outputs.available == 'true' && (steps.readiness.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        run: |
          echo "Authenticated Production readiness or smoke failed. Review the redacted artifact."
          exit 1
