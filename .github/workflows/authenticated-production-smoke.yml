name: Protected Live-Payment Readiness Check

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authenticated-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-live-payment-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
    steps:
      - name: Call protected Production readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TCOS_CRON_SECRET:-}" || { echo "TCOS_CRON_SECRET is missing"; exit 1; }
          status=$(curl --silent --show-error \
            --output protected-live-payment-readiness.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${TCOS_CRON_SECRET}" \
            "https://truelycollectables.com/api/cron/live-payment-readiness")
          echo "HTTP status: $status"
          test "$status" = "200"
          jq -e '.success == true and .simulatedFinalRuntimeSwitch == true' protected-live-payment-readiness.json >/dev/null

      - name: Upload redacted live-payment readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-live-payment-readiness-evidence
          path: protected-live-payment-readiness.json
          if-no-files-found: error
          retention-days: 7
