name: Apply Recently Sold And Gallery Fix 20260730

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-recently-sold-gallery-fix-20260730
  cancel-in-progress: true

jobs:
  patch-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/recently-sold-and-back-images-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/recently-sold-and-back-images-20260730
          fetch-depth: 0

      - name: Fail closed on exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "fix/recently-sold-and-back-images-20260730"
          test -f src/app/components/ProductImageGallery.tsx
          test -f src/app/recently-sold/page.tsx
          test -f scripts/apply-recently-sold-gallery-fix.mjs
          git diff --check

      - name: Wire product pages to the front and back gallery
        run: node scripts/apply-recently-sold-gallery-fix.mjs

      - name: Run focused contracts
        run: node scripts/run-recently-sold-gallery-contracts.mjs

      - name: Commit durable product gallery wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add src/app/product/'[id]'/page.tsx src/app/product/'[id]'/layout.tsx
          if git diff --cached --quiet; then
            echo "Product gallery wiring is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Show front and back photos on product pages"
          git push origin HEAD:fix/recently-sold-and-back-images-20260730
