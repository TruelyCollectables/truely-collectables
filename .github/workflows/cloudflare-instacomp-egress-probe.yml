name: Cloudflare InstaComp Egress Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-instacomp-egress-probe-trigger'

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.122.0
      - name: Deploy isolated workers.dev InstaComp egress probe
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/worker.mjs <<'EOF'
          export default {
            async fetch() {
              const started=Date.now();
              try {
                const r=await fetch('https://instacomp.truelycollectables.com/health',{headers:{accept:'application/json'},redirect:'manual',signal:AbortSignal.timeout(10000)});
                const body=await r.json().catch(()=>null);
                return Response.json({ok:r.ok,status:r.status,elapsedMs:Date.now()-started,healthOk:body?.ok===true,database:body?.database||null,checklist:body?.checklist||null});
              } catch (e) {
                return Response.json({ok:false,elapsedMs:Date.now()-started,errorName:e?.name||'unknown',error:String(e?.message||e).slice(0,180)},{status:503});
              }
            }
          }
          EOF
          cat >/tmp/wrangler.jsonc <<'EOF'
          {
            "name":"truely-instacomp-egress-probe",
            "main":"/tmp/worker.mjs",
            "compatibility_date":"2026-08-12",
            "compatibility_flags":["nodejs_compat","global_fetch_strictly_public"],
            "workers_dev":true
          }
          EOF
          npx wrangler deploy --config /tmp/wrangler.jsonc >/tmp/deploy.log 2>&1
          cat /tmp/deploy.log
          sleep 2
          curl -sS --max-time 20 'https://truely-instacomp-egress-probe.truelycollectables.workers.dev/' -o /tmp/result.json -w '%{http_code} %{time_total}\n'
          cat /tmp/result.json
          echo
          node -e "const b=require('/tmp/result.json'); if(!b.ok||b.status!==200||!b.healthOk||b.database!=='ready'||b.checklist!=='ready') process.exit(1);"
