name: Temporary InstaComp OpenAI Web Fallback

on:
  push:
    branches:
      - agent/instacomp-exact-market-proof-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-proof-20260726
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply cited OpenAI exact-market fallback
        run: node scripts/apply-instacomp-openai-web-fallback.mjs
      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-instacomp-openai-web-fallback.mjs
          rm -f .github/workflows/temporary-instacomp-openai-web-fallback.yml
      - name: Exactness pass 1
        run: node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
      - name: Exactness pass 2
        run: node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
      - name: Exactness pass 3
        run: node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified fallback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cited OpenAI exact-market fallback"
          git push origin HEAD:agent/instacomp-exact-market-proof-20260726
