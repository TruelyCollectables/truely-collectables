name: Patch Checklist Sentinel Admin Link 20260809

on:
  push:
    branches:
      - fix/kingmaker-certify-current-head-20260809
    paths:
      - ".github/workflows/patch-checklist-sentinel-link-20260809.yml"

permissions:
  contents: write

jobs:
  patch-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-certify-current-head-20260809
          fetch-depth: 0

      - name: Add Checklist Sentinel to Advanced Admin scan controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/admin/LegacyAdminDashboard.tsx')
          source = path.read_text('utf-8')
          anchor = '        { href: "/admin/instacomp/checklists", label: "Checklist Registry" },\n'
          addition = anchor + '        { href: "/admin/instacomp/checklist-sentinel", label: "Checklist Sentinel™" },\n'
          if '/admin/instacomp/checklist-sentinel' not in source:
              if anchor not in source:
                  raise SystemExit('Checklist Registry navigation anchor not found')
              source = source.replace(anchor, addition, 1)
          path.write_text(source, 'utf-8')
          PY
          git diff --check

      - name: Persist navigation repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/LegacyAdminDashboard.tsx
          if git diff --cached --quiet; then
            echo "Checklist Sentinel link already present."
          else
            git commit -m "Link Checklist Sentinel from Advanced Admin"
            git push origin HEAD:fix/kingmaker-certify-current-head-20260809
          fi
