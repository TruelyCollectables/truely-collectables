name: Apply Storefront Identity Scope Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply-storefront-identity-scope-correction.py"
      - ".github/workflows/apply-storefront-identity-scope-correction.yml"
  push:
    branches:
      - agent/storefront-remove-ip-intelligence-launch-blocker-20260726
    paths:
      - "scripts/apply-storefront-identity-scope-correction.py"
      - ".github/workflows/apply-storefront-identity-scope-correction.yml"

permissions:
  contents: write

jobs:
  apply-correction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/storefront-remove-ip-intelligence-launch-blocker-20260726
          fetch-depth: 0

      - name: Apply scoped storefront correction
        run: python scripts/apply-storefront-identity-scope-correction.py

      - name: Commit corrected launch scope
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/live-payment-launch-core.ts \
            src/app/admin/launch-readiness/page.tsx \
            scripts/audit-vercel-production-environment.mjs \
            scripts/run-live-payment-identity-gate-simulations.ts \
            .github/workflows/live-payment-identity-gate.yml
          if git diff --cached --quiet; then
            echo "No storefront scope changes were needed."
            exit 0
          fi
          git commit -m "Keep VPN intelligence out of storefront launch scope"
          git push origin HEAD:agent/storefront-remove-ip-intelligence-launch-blocker-20260726
