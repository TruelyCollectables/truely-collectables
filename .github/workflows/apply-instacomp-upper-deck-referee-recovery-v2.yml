name: Apply InstaComp Upper Deck Referee Recovery V2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-instacomp-upper-deck-referee-recovery-v2.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/instacomp-upper-deck-referee-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-upper-deck-referee-recovery
          fetch-depth: 0

      - name: Fail closed on exact branch and base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "fix/instacomp-upper-deck-referee-recovery"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "86e6f67536d239b8bf3dc7a4e4489b806ab3d944"
          test ! -f .codex-run/upper-deck-referee-patch.py

      - name: Reapply audited patch with explicit Base correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex-run
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path(".github/workflows/apply-instacomp-upper-deck-referee-recovery.yml").read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          patch_script = Path(".codex-run/upper-deck-referee-patch.py")
          patch_script.write_text(script)
          subprocess.run(["python", str(patch_script)], check=True)

          source = Path("src/lib/instacomp-learning-server.ts")
          text = source.read_text()
          old = '''function targetParallelProfile(ai: Record<string, any>, setContext: unknown) {
            const setTokens = new Set(meaningfulTokens(setContext));
            const directTokens = checklistParallelTokens(ai.parallel).filter(
              (token) =>
                !setTokens.has(token) &&
                !GENERIC_PARALLEL_EVIDENCE_TOKENS.has(token),
            );
            const noteTokens = visibleParallelNoteTokens(ai.notes);
            const signatureTokens = noteTokens.length ? noteTokens : directTokens;
            const baseLike =
              !signatureTokens.length &&
              (isBaseParallel(ai.parallel) ||
                directTokens.length === 0 ||
                evidenceTextIsUncertain(ai.parallel));
            return {
              baseLike,
              signature: [...new Set(signatureTokens)].sort().join(" "),
            };
          }
          '''
          new = '''function targetParallelProfile(ai: Record<string, any>, setContext: unknown) {
            const setTokens = new Set(meaningfulTokens(setContext));
            const explicitBase = isBaseParallel(ai.parallel);
            const directTokens = explicitBase
              ? []
              : checklistParallelTokens(ai.parallel).filter(
                  (token) =>
                    !setTokens.has(token) &&
                    !GENERIC_PARALLEL_EVIDENCE_TOKENS.has(token),
                );
            const noteTokens = visibleParallelNoteTokens(ai.notes);
            const signatureTokens = noteTokens.length ? noteTokens : directTokens;
            const baseLike =
              explicitBase ||
              (!signatureTokens.length &&
                (directTokens.length === 0 ||
                  evidenceTextIsUncertain(ai.parallel)));
            return {
              baseLike,
              signature: [...new Set(signatureTokens)].sort().join(" "),
            };
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"Explicit Base correction anchor changed; refusing to patch ({text.count(old)} matches)."
              )
          source.write_text(text.replace(old, new, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prove focused recovery and hard rejections
        run: |
          node --import tsx scripts/run-instacomp-upper-deck-referee-recovery-regression.ts
          npx tsx scripts/run-instacomp-registry-consensus-bridge-regression.ts
          npx tsx scripts/run-instacomp-live-shedeur-107-regression.ts
          npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts
          npx tsx scripts/run-instacomp-identity-firewall-regressions.ts

      - name: Lint patched source and regression
        run: |
          npx eslint \
            src/lib/instacomp-learning-server.ts \
            scripts/run-instacomp-upper-deck-referee-recovery-regression.ts
          git diff --check

      - name: Commit focused matcher repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .codex-run/upper-deck-referee-patch.py
          test -n "$(git status --short src/lib/instacomp-learning-server.ts)"
          test -z "$(git status --short --untracked-files=all .codex-run)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-learning-server.ts
          git commit -m "Recover unique Upper Deck Registry identities"
          git push origin HEAD:fix/instacomp-upper-deck-referee-recovery
