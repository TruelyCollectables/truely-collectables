name: Diagnose eBay Browse Images V2 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-ebay-browse-images-v2-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-browse-images:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/diagnose-ebay-browse-images-v2-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: bc7ee9822d91873bc2cbc2be7eb917eb5b29b566

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/ebay-browse-v2"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/ebay-browse-v2/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/ebay-browse-v2/production.env"

      - name: Compare Trading and Browse image results
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createClient } from '@supabase/supabase-js';

          const workDir = path.join(process.env.RUNNER_TEMP, 'ebay-browse-v2');
          const envText = fs.readFileSync(path.join(workDir, 'production.env'), 'utf8');
          const env = {};
          for (const rawLine of envText.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            env[key] = value;
          }

          const productionUrl = env.NEXT_PUBLIC_SUPABASE_URL;
          const clientId = env.EBAY_CLIENT_ID;
          const clientSecret = env.EBAY_CLIENT_SECRET;
          if (!productionUrl || !clientId || !clientSecret) {
            throw new Error('Required Production Supabase/eBay environment values were not pulled.');
          }
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const managementToken = process.env.GH_SUPABASE_ACCESS_TOKEN;
          const keysResponse = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${managementToken}` } },
          );
          const keysBody = await keysResponse.json().catch(() => ({}));
          if (!keysResponse.ok || !Array.isArray(keysBody)) {
            throw new Error(`Unable to retrieve Production Supabase keys: ${keysResponse.status}`);
          }
          const elevated =
            keysBody.find((entry) => typeof entry?.api_key === 'string' && entry.api_key.startsWith('sb_secret_')) ||
            keysBody.find((entry) => String(entry?.name || '').toLowerCase() === 'service_role') ||
            keysBody.find((entry) => String(entry?.name || '').toLowerCase().includes('service'));
          const serviceKey = elevated?.api_key;
          if (!serviceKey) throw new Error('No Production elevated Supabase key was returned.');
          console.log('::add-mask::' + serviceKey);

          const supabase = createClient(productionUrl, serviceKey, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const productIds = [1682, 1692, 1709, 1723, 1779, 2052, 2241];
          const { data: products, error } = await supabase
            .from('products')
            .select('id,title,ebay_item_id,quantity')
            .in('id', productIds)
            .order('id', { ascending: true });
          if (error) throw error;
          if (!products?.length) throw new Error('No diagnostic products were found.');

          const basic = Buffer.from(`${clientId}:${clientSecret}`).toString('base64');
          const tokenResponse = await fetch('https://api.ebay.com/identity/v1/oauth2/token', {
            method: 'POST',
            headers: {
              Authorization: `Basic ${basic}`,
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
              grant_type: 'client_credentials',
              scope: 'https://api.ebay.com/oauth/api_scope',
            }),
          });
          const tokenBody = await tokenResponse.json().catch(() => ({}));
          if (!tokenResponse.ok || !tokenBody.access_token) {
            throw new Error(`Application token failed: ${tokenResponse.status} ${JSON.stringify(tokenBody).slice(0, 1000)}`);
          }
          const token = tokenBody.access_token;
          console.log('::add-mask::' + token);

          const results = [];
          for (const product of products) {
            const legacyItemId = String(product.ebay_item_id || '');
            const endpoint = new URL('https://api.ebay.com/buy/browse/v1/item/get_item_by_legacy_id');
            endpoint.searchParams.set('legacy_item_id', legacyItemId);
            const response = await fetch(endpoint, {
              headers: {
                Authorization: `Bearer ${token}`,
                'X-EBAY-C-MARKETPLACE-ID': 'EBAY_US',
              },
            });
            const body = await response.json().catch(() => ({}));
            const primary = body?.image?.imageUrl ? [body.image.imageUrl] : [];
            const additional = Array.isArray(body?.additionalImages)
              ? body.additionalImages.map((entry) => entry?.imageUrl).filter(Boolean)
              : [];
            const productPrimary = body?.product?.image?.imageUrl ? [body.product.image.imageUrl] : [];
            const productAdditional = Array.isArray(body?.product?.additionalImages)
              ? body.product.additionalImages.map((entry) => entry?.imageUrl).filter(Boolean)
              : [];
            results.push({
              productId: Number(product.id),
              legacyItemId,
              title: String(product.title || '').slice(0, 110),
              browseStatus: response.status,
              browseItemId: body?.itemId || null,
              listingPictures: [...new Set([...primary, ...additional])],
              listingPictureCount: new Set([...primary, ...additional]).size,
              productPictures: [...new Set([...productPrimary, ...productAdditional])],
              productPictureCount: new Set([...productPrimary, ...productAdditional]).size,
              errors: body?.errors || null,
            });
          }
          console.log(JSON.stringify({ results }, null, 2));
          NODE

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/ebay-browse-v2"
