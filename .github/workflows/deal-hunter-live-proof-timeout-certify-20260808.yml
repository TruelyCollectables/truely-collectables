name: Deal Hunter Live Proof Timeout Certify 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch-deal-hunter-live-proof-timeout-20260808.py'
      - 'src/lib/deal-hunter-live-proof-timeout-20260808.marker'
      - '.github/workflows/deal-hunter-live-proof-timeout-certify-20260808.yml'

permissions:
  contents: write

jobs:
  certify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact timeout patch
        run: python3 scripts/patch-deal-hunter-live-proof-timeout-20260808.py
      - name: Prove bounded long-run contract
        shell: bash
        run: |
          set -euo pipefail
          route=src/app/api/release/instacomp-deal-hunter-learning-self-test/route.ts
          grep -F 'export const maxDuration = 800;' "$route" >/dev/null
          grep -F 'attempt < 120' "$route" >/dev/null
          grep -F 'requireNewHistory' "$route" >/dev/null
          grep -F 'delta <= 0' "$route" >/dev/null
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Materialize proof-only repair and remove temporary harness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'Truely Collectables CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/api/release/instacomp-deal-hunter-learning-self-test/route.ts
          git rm scripts/patch-deal-hunter-live-proof-timeout-20260808.py
          git rm src/lib/deal-hunter-live-proof-timeout-20260808.marker
          git rm .github/workflows/deal-hunter-live-proof-timeout-certify-20260808.yml
          git commit -m 'Allow strict Deal Hunter proof to finish long batches'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
