name: Apply InstaComp 8-30 AI Council

on:
  push:
    branches:
      - feature/instacomp-ai-council-30
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-instacomp-ai-council-30
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[council-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out council branch
        uses: actions/checkout@v4
        with:
          ref: feature/instacomp-ai-council-30
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic route patch
        run: python3 scripts/apply-instacomp-ai-council-30.py

      - name: Install exact dependencies
        run: npm ci

      - name: Run evidence-first regressions
        run: npx tsx scripts/run-instacomp-evidence-first-regressions.ts

      - name: Run AI council regressions
        run: npx tsx scripts/run-instacomp-ai-council-30-regressions.ts

      - name: Lint changed implementation
        run: |
          npx eslint \
            src/app/api/instacomp/scan/route.ts \
            scripts/run-instacomp-ai-council-30-regressions.ts

      - name: Build production application
        run: npm run build

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-instacomp-ai-council-30.py
          rm -f .github/workflows/apply-instacomp-ai-council-30.yml

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "No implementation changes were produced."
            exit 1
          }
          git commit -m "Expand InstaComp AI council to 8-30 readers [council-applied]"
          git push origin HEAD:feature/instacomp-ai-council-30
