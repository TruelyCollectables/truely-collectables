name: Launch 2 Issue 253 B30F084 Production Retry 2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/launch2-issue253-b30f084-production-retry2-20260730.yml"

permissions:
  contents: read

concurrency:
  group: launch2-issue253-b30f084-production-retry2-20260730
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: b30f084775775d258e02affafd695028261c12c9
  EXPECTED_BRANCH: ops/launch2-final-b30f084-20260730
  SOURCE_AUDIT_BRANCH: deploy/issue253-hosted-cutover-v3-20260730
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  EVIDENCE_DIR: .audit/launch2-issue253-b30f084-production-retry2
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  CRON_SECRET: build-validation-cron-secret-that-is-long-enough
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  certify-production:
    if: github.event.pull_request.head.ref == 'ops/launch2-final-b30f084-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out guarded operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed and prepare corrected hosted audit runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git fetch origin "+refs/heads/$SOURCE_AUDIT_BRANCH:refs/remotes/origin/$SOURCE_AUDIT_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          expected=(
            .github/workflows/launch2-issue253-b30f084-production-20260730.yml
            .github/workflows/launch2-issue253-b30f084-production-retry2-20260730.yml
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/launch2-b30f084-retry2"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"
          runner="$RUNNER_TEMP/launch2-b30f084-retry2/issue253-cutover.mjs"
          git show "origin/$SOURCE_AUDIT_BRANCH:scripts/run-issue253-hosted-cutover-v3.mjs" > "$runner"
          RUNNER_PATH="$runner" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = process.env.RUNNER_PATH;
          let text = fs.readFileSync(file, 'utf8');
          const stale = "coalesce(metadata->>'sold_price_status', '')";
          const count = text.split(stale).length - 1;
          if (count !== 2) throw new Error(`Expected two stale sold-price checks, found ${count}.`);
          text = text.replaceAll(stale, "coalesce(sold_price_status, '')");
          fs.writeFileSync(file, text);
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Revalidate exact cleaned main
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-sold-lifecycle-simulations.mjs | tee "$EVIDENCE_DIR/sold-lifecycle.log"
          node scripts/run-sold-trigger-order-simulation.mjs | tee "$EVIDENCE_DIR/sold-trigger.log"
          node scripts/run-privileged-api-route-audit.mjs | tee "$EVIDENCE_DIR/privileged-route-audit.log"
          npm run simulate:privileged-route-auth | tee "$EVIDENCE_DIR/privileged-route-auth.log"
          node scripts/verify-issue253-marketplace-runtime-self-test-contract.mjs | tee "$EVIDENCE_DIR/marketplace-runtime-contract.log"
          node scripts/verify-platform-fee-service-role-delete-grant.mjs | tee "$EVIDENCE_DIR/platform-fee-grant-contract.log"
          npm audit --audit-level=high
          npm run lint
          npx tsc --noEmit --pretty false
          npm run build
          git diff --check

      - name: Link Vercel and derive Production database context
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/launch2-b30f084-retry2"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          envfile="$RUNNER_TEMP/launch2-b30f084-retry2/production.env"
          npx vercel@56.2.0 env pull "$envfile" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          printf 'PRODUCTION_ENV_FILE=%s\n' "$envfile" >> "$GITHUB_ENV"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(process.env.PRODUCTION_ENV_FILE, 'utf8');
          const env = {};
          for (const raw of text.split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i < 1) continue;
            let value = line.slice(i + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value = JSON.parse(value); } catch { value = value.slice(1, -1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            env[line.slice(0, i).trim()] = value;
          }
          const url = String(env.NEXT_PUBLIC_SUPABASE_URL || '').trim();
          if (!/^https:\/\//.test(url)) throw new Error('Production Supabase URL is unavailable.');
          const ref = new URL(url).hostname.split('.')[0];
          if (!ref) throw new Error('Production Supabase project reference is unavailable.');
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_SUPABASE_PROJECT_REF=${ref}\n`);
          NODE

      - name: Rotate and mask canonical Production admin session secret
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/launch2-b30f084-retry2/admin-session-secret.txt"
          openssl rand -hex 48 > "$secret_file"
          chmod 600 "$secret_file"
          secret="$(tr -d '\r\n' < "$secret_file")"
          test "${#secret}" -ge 64
          echo "::add-mask::$secret"
          cat "$secret_file" | npx vercel@56.2.0 env add ADMIN_SESSION_SECRET production --sensitive --force --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          ADMIN_PRODUCTION_SECRET="$secret" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { createHmac } from 'node:crypto';
          const secret = process.env.ADMIN_PRODUCTION_SECRET;
          const issuedAt = String(Math.floor(Date.now() / 1000));
          const signature = createHmac('sha256', secret).update(issuedAt).digest('base64url');
          const session = `${issuedAt}.${signature}`;
          console.log(`::add-mask::${session}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ADMIN_SESSION_VALUE=${session}\n`);
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/admin-session-config-receipt.json`, JSON.stringify({ ok: true, exactMainSha: process.env.EXPECTED_MAIN_SHA, productionSecretRotated: true, sensitiveVariable: true, secretValueRecorded: false, configuredAt: new Date().toISOString() }, null, 2));
          NODE
          rm -f "$secret_file"

      - name: Reconfirm exact main before hosted mutation
        run: git fetch origin main && test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Apply and verify narrow Production grant
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PRODUCTION_SUPABASE_PROJECT_REF}/database/query`;
          const query = async (sql, readOnly = false) => {
            const response = await fetch(endpoint, { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ query: sql, parameters: [], read_only: readOnly }) });
            const body = await response.text();
            if (!response.ok) throw new Error(`Supabase HTTP ${response.status}: ${body.slice(0, 1200)}`);
            return body ? JSON.parse(body) : [];
          };
          await query(fs.readFileSync('supabase/migrations/20260730050000_grant_platform_fee_delete_service_role.sql', 'utf8'));
          const row = (await query(`select has_table_privilege('service_role','public.platform_fee_ledger_entries','DELETE') service_role_delete, has_table_privilege('anon','public.platform_fee_ledger_entries','DELETE') anon_delete, has_table_privilege('authenticated','public.platform_fee_ledger_entries','DELETE') authenticated_delete;`, true))?.[0] || {};
          if (row.service_role_delete !== true || row.anon_delete === true || row.authenticated_delete === true) throw new Error(`Unsafe privilege state: ${JSON.stringify(row)}`);
          fs.writeFileSync(path.join(process.env.EVIDENCE_DIR, 'platform-fee-grant-production.json'), JSON.stringify({ ok: true, exactMainSha: process.env.EXPECTED_MAIN_SHA, serviceRoleDelete: true, anonDelete: false, authenticatedDelete: false, verifiedAt: new Date().toISOString() }, null, 2));
          NODE

      - name: Apply repeatable issue 253 migrations and historical backfill
        run: node "$RUNNER_TEMP/launch2-b30f084-retry2/issue253-cutover.mjs" migrate

      - name: Run rollback-only CollX-via-eBay race proof
        run: node "$RUNNER_TEMP/launch2-b30f084-retry2/issue253-cutover.mjs" rollback-proof

      - name: Resolve latest order for safe admin proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PRODUCTION_SUPABASE_PROJECT_REF}/database/query`;
          const response = await fetch(endpoint, { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ query: `select id::text id from public.orders order by created_at desc limit 1;`, parameters: [], read_only: true }) });
          const body = await response.text();
          if (!response.ok) throw new Error(`Latest-order query HTTP ${response.status}: ${body.slice(0, 1000)}`);
          const id = (body ? JSON.parse(body) : [])?.[0]?.id;
          if (!id) throw new Error('No Production order is available for read-only admin proof.');
          fs.appendFileSync(process.env.GITHUB_ENV, `LATEST_ORDER_ID=${id}\n`);
          NODE

      - name: Reconfirm exact main before Production deployment
        run: git fetch origin main && test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Deploy detached exact cleaned main to Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          exact="$RUNNER_TEMP/launch2-b30f084-exact"
          rm -rf "$exact"
          git worktree add --detach "$exact" "$EXPECTED_MAIN_SHA"
          test "$(git -C "$exact" rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -z "$(git -C "$exact" status --porcelain)"
          mkdir -p "$exact/.vercel"
          cp .vercel/project.json "$exact/.vercel/project.json"
          cd "$exact"
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz --meta "githubCommitSha=$EXPECTED_MAIN_SHA" --meta "launchPurpose=issue253-b30f084-retry2" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/vercel-deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$GITHUB_WORKSPACE/$EVIDENCE_DIR/vercel-deploy.log" | tail -n 1)"
          test -n "$url"
          printf '%s\n' "$url" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/deployment-url.txt"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify exact Production metadata and public boundaries
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          host="${DEPLOYMENT_URL#https://}"
          curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?slug=$VERCEL_SCOPE" > "$EVIDENCE_DIR/deployment.json"
          DEPLOYMENT_JSON="$(cat "$EVIDENCE_DIR/deployment.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(process.env.DEPLOYMENT_JSON || '{}');
          const aliases = Array.isArray(value.alias) ? value.alias : Array.isArray(value.aliases) ? value.aliases : [];
          const sha = String(value?.meta?.githubCommitSha || '');
          if (String(value.target).toLowerCase() !== 'production' || String(value.readyState).toUpperCase() !== 'READY' || sha !== process.env.EXPECTED_MAIN_SHA || !aliases.includes('truelycollectables.com')) throw new Error(`Exact Production metadata failed: ${JSON.stringify({ target: value.target, readyState: value.readyState, sha, aliases })}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/exact-production.json', JSON.stringify({ ok: true, deploymentId: value.id, deploymentHost: value.url, exactMainSha: sha, customDomainAlias: 'truelycollectables.com', verifiedAt: new Date().toISOString() }, null, 2));
          NODE
          rm -f "$EVIDENCE_DIR/deployment.json"
          for base in "$DEPLOYMENT_URL" https://truelycollectables.com; do
            test "$(curl --location --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/")" = 200
            test "$(curl --location --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/shop")" = 200
            test "$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/admin")" = 307
            test "$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/api/admin-orders-health")" = 401
          done

      - name: Verify protected admin pages fee cleanup and refund guard
        shell: bash
        run: |
          set -euo pipefail
          cookie="tcos_admin_auth_v3=$ADMIN_SESSION_VALUE"
          for path in /admin '/admin/orders?tab=all' "/admin/orders/$LATEST_ORDER_ID" "/admin/orders/$LATEST_ORDER_ID/packing-slip" /admin/products; do
            safe="$(printf '%s' "$path" | tr '/?=&' '____')"
            code="$(curl --silent --show-error --max-time 90 --cookie "$cookie" --dump-header "$EVIDENCE_DIR/${safe}.headers" --output "$EVIDENCE_DIR/${safe}.html" --write-out '%{http_code}' "https://truelycollectables.com$path")"
            test "$code" = 200
            grep -qi 'set-cookie:.*tcos_admin_auth_v3=' "$EVIDENCE_DIR/${safe}.headers"
          done
          fee_code="$(curl --silent --show-error --max-time 90 --request POST --cookie "$cookie" --output "$EVIDENCE_DIR/fee-cleanup.json" --write-out '%{http_code}' https://truelycollectables.com/api/admin/reconcile-platform-fees)"
          test "$fee_code" = 200
          FEE_BODY="$(cat "$EVIDENCE_DIR/fee-cleanup.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(process.env.FEE_BODY || '{}');
          if (value.success !== true) throw new Error(`Fee cleanup failed: ${JSON.stringify(value)}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/admin-runtime-receipt.json', JSON.stringify({ adminNavigation: 'passed', sessionRefresh: 'passed', platformFeeCleanup: 'passed', removedFeeRows: Number(value.removedCount || 0), refundIssued: false, verifiedAt: new Date().toISOString() }, null, 2));
          NODE
          REFUND_ORDER_ID="$LATEST_ORDER_ID" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw = process.env.REFUND_ORDER_ID;
          const orderId = /^\d+$/.test(raw) ? Number(raw) : raw;
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/refund-request.json`, JSON.stringify({ orderId, reason: 'Launch audit safety check; confirmation intentionally withheld.', confirmed: false }));
          NODE
          refund_code="$(curl --silent --show-error --max-time 90 --request POST --cookie "$cookie" --header 'Content-Type: application/json' --data-binary "@$EVIDENCE_DIR/refund-request.json" --output "$EVIDENCE_DIR/refund-guard.json" --write-out '%{http_code}' https://truelycollectables.com/api/orders/refund)"
          test "$refund_code" = 400
          grep -qi 'confirm' "$EVIDENCE_DIR/refund-guard.json"
          rm -f "$EVIDENCE_DIR"/*.html "$EVIDENCE_DIR"/*.headers "$EVIDENCE_DIR/fee-cleanup.json "$EVIDENCE_DIR/refund-request.json" "$EVIDENCE_DIR/refund-guard.json"

      - name: Run protected issue 253 marketplace convergence chain
        shell: bash
        run: |
          set -euo pipefail
          for step in ebay-order-sales ebay-full-sync seller-reconciliation sold-archive; do
            code="$(curl --silent --show-error --max-time 300 --request POST --header "Authorization: Bearer $VERCEL_TOKEN" --output "$EVIDENCE_DIR/runtime-${step}.json" --write-out '%{http_code}' "https://truelycollectables.com/api/release/issue253-marketplace-self-test?step=${step}")"
            test "$code" = 200 || { cat "$EVIDENCE_DIR/runtime-${step}.json" >&2; exit 1; }
            STEP="$step" node - <<'NODE'
            const fs = require('node:fs');
            const step = process.env.STEP;
            const value = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/runtime-${step}.json`, 'utf8'));
            if (value.success !== true || value.cronSecretConfigured !== true || Number(value.upstreamStatus) !== 200) throw new Error(`Marketplace step ${step} failed: ${JSON.stringify(value)}`);
            NODE
          done

      - name: Audit final issue 253 state and indirect CollX evidence
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/launch2-b30f084-retry2/issue253-cutover.mjs" post-sync-audit
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PRODUCTION_SUPABASE_PROJECT_REF}/database/query`;
          const response = await fetch(endpoint, { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ read_only: true, parameters: [], query: `select json_build_object(
            'collx_via_linked_ebay_sales',(select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay'),
            'chain_evidence_rows',(select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay' and evidence->>'source_chain'='collx_or_ebay_to_ebay_to_truely_collectables'),
            'collx_only_boundary_violations',(select count(*) from public.collx_only_inventory_boundary_violations),
            'active_zero_guards',(select count(*) from public.ebay_inbound_sale_guards where active and protected_quantity=0),
            'violated_guards',(select count(*) from public.ebay_inbound_sale_guards g where active and (coalesce((select p.quantity from public.products p where p.id=g.legacy_product_id and p.seller_id=g.store_id),0)>g.protected_quantity or coalesce((select i.quantity from public.inventory_items i where i.id=g.inventory_item_id),0)>g.protected_quantity)),
            'maximum_propagation_minutes',json_build_object('completed_order_poll',5,'inactive_full_sync',15,'seller_reconciliation',15),
            'captured_at',now()) receipt;` }) });
          const body = await response.text();
          if (!response.ok) throw new Error(`Final DB audit HTTP ${response.status}: ${body.slice(0, 1000)}`);
          const receipt = JSON.parse(body)?.[0]?.receipt || {};
          const blockers = [];
          if (Number(receipt.collx_via_linked_ebay_sales || 0) < 1) blockers.push('no existing indirect eBay/CollX sale evidence');
          if (Number(receipt.chain_evidence_rows || 0) < 1) blockers.push('no persisted indirect source-chain evidence');
          if (Number(receipt.collx_only_boundary_violations || 0) !== 0) blockers.push('CollX-only boundary violation');
          if (Number(receipt.violated_guards || 0) !== 0) blockers.push('protected sold stock restoration violation');
          fs.writeFileSync(path.join(process.env.EVIDENCE_DIR, 'collx-indirect-production.json'), JSON.stringify({ ok: blockers.length === 0, exactMainSha: process.env.EXPECTED_MAIN_SHA, receipt, blockers, realMarketplaceOrderCreatedByAudit: false, verifiedAt: new Date().toISOString() }, null, 2));
          if (blockers.length) throw new Error(blockers.join('; '));
          NODE

      - name: Upload sanitized exact Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-issue253-b30f084-production-retry2-evidence
          path: .audit/launch2-issue253-b30f084-production-retry2
          if-no-files-found: error
          retention-days: 90

      - name: Remove pulled Production environment
        if: always()
        run: rm -f "$RUNNER_TEMP/launch2-b30f084-retry2/production.env"
