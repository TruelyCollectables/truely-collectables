name: Ops CollX Image Match Snapshot 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-image-match-snapshot-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel "$RUNNER_TEMP/collx-image-snapshot"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-image-snapshot/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Snapshot live product and image identity only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const envPath = path.join(process.env.RUNNER_TEMP, 'collx-image-snapshot', 'production.env');
          const text = fs.readFileSync(envPath, 'utf8');
          const env = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            env[key] = value;
          }

          const baseUrl = env.NEXT_PUBLIC_SUPABASE_URL;
          const serviceKey = env.SUPABASE_SERVICE_ROLE_KEY;
          if (!baseUrl || !serviceKey) throw new Error('Production Supabase credentials are unavailable.');
          console.log('::add-mask::' + serviceKey);
          const storeId = '00000000-0000-4000-8000-000000000001';

          async function readAll(table, select, extra = '') {
            const rows = [];
            for (let offset = 0; offset < 50000; offset += 1000) {
              const url = new URL(`/rest/v1/${table}`, baseUrl);
              url.searchParams.set('select', select);
              url.searchParams.set('store_id', `eq.${storeId}`);
              if (extra) {
                for (const [key, value] of new URLSearchParams(extra)) url.searchParams.set(key, value);
              }
              const response = await fetch(url, {
                headers: {
                  apikey: serviceKey,
                  Authorization: `Bearer ${serviceKey}`,
                  Range: `${offset}-${offset + 999}`,
                  Prefer: 'count=exact',
                },
              });
              if (!response.ok) throw new Error(`${table} snapshot failed: HTTP ${response.status} ${await response.text()}`);
              const batch = await response.json();
              rows.push(...batch);
              if (batch.length < 1000) break;
            }
            return rows;
          }

          const products = await readAll(
            'products',
            'id,store_id,sku,title,player,sport,ebay_item_id,image_url,quantity,status,archived_at'
          );
          const inventoryItems = await readAll(
            'inventory_items',
            'id,store_id,legacy_product_id,sku,title,status,quantity,metadata'
          );

          const inventoryIds = inventoryItems.map((row) => row.id);
          const inventoryImages = [];
          for (let index = 0; index < inventoryIds.length; index += 100) {
            const chunk = inventoryIds.slice(index, index + 100);
            if (!chunk.length) continue;
            const url = new URL('/rest/v1/inventory_images', baseUrl);
            url.searchParams.set('select', 'id,inventory_item_id,image_url,alt_text,sort_order,is_primary');
            url.searchParams.set('inventory_item_id', `in.(${chunk.join(',')})`);
            const response = await fetch(url, {
              headers: { apikey: serviceKey, Authorization: `Bearer ${serviceKey}` },
            });
            if (!response.ok) throw new Error(`inventory_images snapshot failed: HTTP ${response.status} ${await response.text()}`);
            inventoryImages.push(...await response.json());
          }

          const output = {
            generated_at: new Date().toISOString(),
            store_id: storeId,
            products,
            inventory_items: inventoryItems,
            inventory_images: inventoryImages,
          };
          const outPath = path.join(process.env.RUNNER_TEMP, 'collx-image-snapshot', 'live-inventory.json');
          fs.writeFileSync(outPath, JSON.stringify(output, null, 2));
          console.log(JSON.stringify({
            products: products.length,
            inventory_items: inventoryItems.length,
            inventory_images: inventoryImages.length,
          }));
          NODE
          rm -f "$RUNNER_TEMP/collx-image-snapshot/production.env"

      - name: Upload live inventory snapshot
        uses: actions/upload-artifact@v4
        with:
          name: collx-image-live-inventory-snapshot
          path: ${{ runner.temp }}/collx-image-snapshot/live-inventory.json
          retention-days: 1
          if-no-files-found: error
