name: InstaComp Frozen Five Production Proof 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-frozen-five-production-proof-20260807.yml"
      - "scripts/ops/run-instacomp-frozen-five-production-proof.ts"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_BRANCH: ops/instacomp-frozen-five-production-proof-20260807
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/instacomp-frozen-five-production-proof-20260807

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$EXPECTED_BRANCH)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and resolve exact Production proof credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/instacomp-frozen-five-proof"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/instacomp-frozen-five-proof/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

          PRODUCTION_ENV_PATH="$RUNNER_TEMP/instacomp-frozen-five-proof/production.env" \
          RUNTIME_ENV_PATH="$RUNNER_TEMP/instacomp-frozen-five-proof/runtime-env.sh" \
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          (async () => {
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
            if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, {
              headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` },
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Supabase key lookup failed with HTTP ${response.status}: ${body.slice(0, 300)}`);
            const keys = body ? JSON.parse(body) : [];
            if (!Array.isArray(keys)) throw new Error('Supabase key lookup returned a non-array payload');
            const keyValue = (entry) => String(entry?.api_key || entry?.key || entry?.value || '');
            const modernSecret = keys.find((entry) => /^sb_secret_/i.test(keyValue(entry)));
            const legacyServiceRole =
              keys.find((entry) => entry?.name === 'service_role' && /^eyJ/.test(keyValue(entry))) ||
              keys.find((entry) => entry?.secret_jwt_template?.role === 'service_role' && /^eyJ/.test(keyValue(entry)));
            const serverKey = keyValue(modernSecret || legacyServiceRole);
            if (!serverKey) throw new Error('No current Supabase secret key or legacy service_role key was found');

            const explicitServiceToken = String(parsed.INSTACOMP_SERVICE_TOKEN || '').trim();
            const adminSessionSecret = String(parsed.ADMIN_SESSION_SECRET || '').trim();
            const serviceToken = explicitServiceToken || (adminSessionSecret
              ? crypto.createHmac('sha256', adminSessionSecret)
                  .update('TCOS Profit Hunter InstaComp service bearer v1', 'utf8')
                  .digest('base64url')
              : '');
            if (!serviceToken) throw new Error('Production InstaComp service token cannot be resolved');

            console.log(`supabase_server_key_kind=${/^sb_secret_/i.test(serverKey) ? 'secret' : 'legacy_service_role'}`);
            console.log(`instacomp_service_token_source=${explicitServiceToken ? 'explicit' : 'derived'}`);
            const values = {
              NEXT_PUBLIC_SUPABASE_URL: productionUrl,
              SUPABASE_SERVICE_ROLE_KEY: serverKey,
              INSTACOMP_SERVICE_TOKEN: serviceToken,
            };
            for (const value of Object.values(values)) console.log(`::add-mask::${value}`);
            fs.writeFileSync(
              process.env.RUNTIME_ENV_PATH,
              Object.entries(values).map(([key, value]) => `export ${key}=${JSON.stringify(value)}`).join('\n') + '\n',
              { mode: 0o600 },
            );
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Switch frozen proof setup to existing service-auth contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ops/run-instacomp-frozen-five-production-proof.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Frozen proof contract changed; expected one match, got {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              'async function callScanner(front: File, back: File, accessToken: string) {',
              'async function callScanner(front: File, back: File, serviceToken: string) {',
          )
          replace_once(
              '      Authorization: `Bearer ${accessToken}`,' ,
              '      "x-tcos-instacomp-service-token": serviceToken,',
          )
          replace_once(
              '  const anonKey = txt(process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY);\n  if (!supabaseUrl || !serviceKey || !anonKey) throw new Error("Production Supabase URL, service-role JWT, and anon key are required");',
              '  const serviceToken = txt(process.env.INSTACOMP_SERVICE_TOKEN);\n  if (!supabaseUrl || !serviceKey || !serviceToken) throw new Error("Production Supabase URL, server key, and InstaComp service token are required");',
          )
          replace_once(
              '  const staleAccountsDeleted = await cleanStaleTestAccounts(admin);',
              '  const staleAccountsDeleted = 0;',
          )
          replace_once(
              '    temporarySeller: { created: false, deleted: false },',
              '    authentication: { mode: "instacomp_service_token" },',
          )
          replace_once(
              '  let accountId = "";\n  try {\n    const seller = await createTestSeller(admin, supabaseUrl, anonKey);\n    accountId = seller.accountId;\n    receipt.temporarySeller.created = true;\n\n',
              '  try {\n',
          )
          replace_once(
              '      const response = await callScanner(front.file, back.file, seller.accessToken);',
              '      const response = await callScanner(front.file, back.file, serviceToken);',
          )
          replace_once(
              '''  } finally {\n    if (accountId) {\n      try {\n        await deleteTestAccount(admin, accountId);\n        receipt.temporarySeller.deleted = true;\n      } catch (error) {\n        receipt.temporarySeller.cleanupError = error instanceof Error ? error.message : String(error);\n      }\n    }\n    receipt.finishedAt = new Date().toISOString();\n    await writeFile(output, `${JSON.stringify(receipt, null, 2)}\\n`);\n  }''',
              '''  } finally {\n    receipt.finishedAt = new Date().toISOString();\n    await writeFile(output, `${JSON.stringify(receipt, null, 2)}\\n`);\n  }''',
          )
          replace_once(
              '    temporarySellerDeleted: receipt.temporarySeller.deleted,',
              '    authenticationMode: receipt.authentication.mode,',
          )
          replace_once(
              '  if (receipt.temporarySeller.deleted !== true) process.exitCode = 2;\n  else if (receipt.status !== "passed") process.exitCode = 1;',
              '  if (receipt.status !== "passed") process.exitCode = 1;',
          )

          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only)" = "scripts/ops/run-instacomp-frozen-five-production-proof.ts"
          grep -Fq '"x-tcos-instacomp-service-token": serviceToken' scripts/ops/run-instacomp-frozen-five-production-proof.ts
          grep -Fq 'authentication: { mode: "instacomp_service_token" }' scripts/ops/run-instacomp-frozen-five-production-proof.ts
          ! grep -Fq 'const seller = await createTestSeller' scripts/ops/run-instacomp-frozen-five-production-proof.ts
          ! grep -Fq 'callScanner(front.file, back.file, seller.accessToken)' scripts/ops/run-instacomp-frozen-five-production-proof.ts
          grep -Fq 'imageTruthArtifactId: 8994498762' scripts/ops/run-instacomp-frozen-five-production-proof.ts
          grep -Fq 'registryCandidateArtifactId: 8993929571' scripts/ops/run-instacomp-frozen-five-production-proof.ts
          grep -Fq 'exactRegistryIdentity: actual.registryIdentityId === truth.registryIdentityId' scripts/ops/run-instacomp-frozen-five-production-proof.ts
          grep -Fq 'receipt.testedCards === 5 && receipt.passedCards === 5' scripts/ops/run-instacomp-frozen-five-production-proof.ts

      - name: Typecheck frozen proof harness
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Run same five physical cards through live Production scanner
        shell: bash
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/instacomp-frozen-five-proof/runtime-env.sh"
          mkdir -p "$EVIDENCE_DIR"
          node --import tsx scripts/ops/run-instacomp-frozen-five-production-proof.ts \
            --output "$EVIDENCE_DIR/receipt.json"
          status=$?
          echo "proof_exit_status=$status"
          test -f "$EVIDENCE_DIR/receipt.json"
          cat "$EVIDENCE_DIR/receipt.json"
          exit "$status"

      - name: Upload frozen five-card proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-frozen-five-production-proof-20260807
          path: evidence/instacomp-frozen-five-production-proof-20260807
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/instacomp-frozen-five-proof"
          rm -f .env.local .env.production.local
