name: Apply InstaComp Benchmark Same-Origin Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-instacomp-benchmark-same-origin-fix.yml"
      - "src/lib/instacomp-benchmark-request-security.ts"
      - "scripts/run-instacomp-benchmark-request-security-regression.ts"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/instacomp-benchmark-same-origin'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-benchmark-same-origin
          fetch-depth: 0

      - name: Fail closed on branch and base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "fix/instacomp-benchmark-same-origin"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "f0ebe3293de39750067a88c347c0612e198e094f"

      - name: Patch authenticated benchmark live-scan request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/api/instacomp/benchmark/ebay-25/route.ts")
          text = path.read_text()

          import_anchor = '''import {
            ADMIN_SESSION_COOKIE_NAME,
            createAdminSessionValue,
          } from "../../../../../lib/admin-session";
          '''
          import_addition = import_anchor + '''import {
            buildInstaCompBenchmarkLiveScanUrl,
            buildInstaCompBenchmarkSameOriginHeaders,
          } from "../../../../../lib/instacomp-benchmark-request-security";
          '''
          if text.count(import_anchor) != 1:
              raise SystemExit("Admin-session import anchor changed; refusing to patch.")
          text = text.replace(import_anchor, import_addition, 1)

          request_anchor = '''    const adminSession = await createAdminSessionValue();
              const scanRequest = new NextRequest("https://instacomp-benchmark.local/api/instacomp/live-scan", {
                method: "POST",
                headers: {
                  cookie: `${ADMIN_SESSION_COOKIE_NAME}=${encodeURIComponent(adminSession)}`,
                  "x-forwarded-for": "127.0.0.1",
                  "x-instacomp-benchmark-ephemeral": clean(process.env.INSTACOMP_BENCHMARK_TOKEN),
                },
                body: formData,
              });
          '''
          request_replacement = '''    const adminSession = await createAdminSessionValue();
              const scanUrl = buildInstaCompBenchmarkLiveScanUrl(request.url);
              const scanRequest = new NextRequest(scanUrl, {
                method: "POST",
                headers: {
                  ...buildInstaCompBenchmarkSameOriginHeaders(scanUrl),
                  cookie: `${ADMIN_SESSION_COOKIE_NAME}=${encodeURIComponent(adminSession)}`,
                  "x-forwarded-for": "127.0.0.1",
                  "x-instacomp-benchmark-ephemeral": clean(process.env.INSTACOMP_BENCHMARK_TOKEN),
                },
                body: formData,
              });
          '''
          if text.count(request_anchor) != 1:
              raise SystemExit("Benchmark live-scan request anchor changed; refusing to patch.")
          text = text.replace(request_anchor, request_replacement, 1)
          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prove same-origin security contract
        run: |
          node --import tsx scripts/run-instacomp-benchmark-request-security-regression.ts
          npm run simulate:privileged-route-auth

      - name: Lint permanent repair
        run: |
          npx eslint \
            src/app/api/instacomp/benchmark/ebay-25/route.ts \
            src/lib/instacomp-benchmark-request-security.ts \
            scripts/run-instacomp-benchmark-request-security-regression.ts
          git diff --check

      - name: Commit focused source repair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short src/app/api/instacomp/benchmark/ebay-25/route.ts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/instacomp/benchmark/ebay-25/route.ts
          git commit -m "Fix benchmark same-origin live scan request"
          git push origin HEAD:fix/instacomp-benchmark-same-origin
