name: Temporary InstaComp Dependency Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-instacomp-dependency-audit.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Capture complete audit
        continue-on-error: true
        run: npm audit --json > npm-audit-all.json

      - name: Capture production-only audit
        continue-on-error: true
        run: npm audit --omit=dev --json > npm-audit-production.json

      - name: Write audit summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const read = (path) => {
            try { return JSON.parse(fs.readFileSync(path, "utf8")); }
            catch { return {}; }
          };
          const all = read("npm-audit-all.json");
          const production = read("npm-audit-production.json");
          const summary = {
            all: all.metadata?.vulnerabilities || null,
            production: production.metadata?.vulnerabilities || null,
            allAdvisories: Object.entries(all.vulnerabilities || {}).map(([name, row]) => ({
              name,
              severity: row.severity,
              direct: row.isDirect,
              via: (row.via || []).map((item) => typeof item === "string" ? item : item.title),
              range: row.range,
              fixAvailable: row.fixAvailable,
            })),
            productionAdvisories: Object.entries(production.vulnerabilities || {}).map(([name, row]) => ({
              name,
              severity: row.severity,
              direct: row.isDirect,
              via: (row.via || []).map((item) => typeof item === "string" ? item : item.title),
              range: row.range,
              fixAvailable: row.fixAvailable,
            })),
          };
          fs.writeFileSync("npm-audit-summary.json", JSON.stringify(summary, null, 2) + "\n");
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-dependency-audit-${{ github.run_number }}
          path: |
            npm-audit-all.json
            npm-audit-production.json
            npm-audit-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce production dependency safety
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit-production.json", "utf8"));
          const counts = audit.metadata?.vulnerabilities || {};
          const blocking = Number(counts.high || 0) + Number(counts.critical || 0);
          if (blocking > 0) process.exit(1);
          NODE

  patched-lint-tree-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve patched lint trial lockfile
        run: |
          npm pkg set 'devDependencies.eslint=10.8.0'
          npm pkg set 'overrides.minimatch=10.2.5'
          npm pkg set 'overrides.brace-expansion=5.0.8'
          npm install --package-lock-only

      - name: Install patched lint trial tree
        run: npm ci

      - name: Enforce zero full-tree high or critical advisories
        run: |
          npm audit --json > npm-audit-patched-lint.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit-patched-lint.json", "utf8"));
          const counts = audit.metadata?.vulnerabilities || {};
          const blocking = Number(counts.high || 0) + Number(counts.critical || 0);
          console.log(JSON.stringify(counts));
          if (blocking > 0) process.exit(1);
          NODE

      - name: Run full lint with patched lint tree
        run: npm run lint

      - name: Build production application with patched lint tree
        run: npm run build

      - name: Upload patched lint compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-lint-compatibility-${{ github.run_number }}
          path: |
            package.json
            package-lock.json
            npm-audit-patched-lint.json
          if-no-files-found: warn
          retention-days: 7
