name: Checklist Registry Pokémon Japanese Unnumbered Energy

on:
  pull_request:
    paths:
      - "scripts/resolve-pokemon-japanese-unnumbered-energy-sets.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-unnumbered-energy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checklist-registry-pokemon-ja-unnumbered-energy-${{ github.ref }}
  cancel-in-progress: true

env:
  TCGDEX_SOURCE_COMMIT: 138c145b80f1a0d6a533f98fd3afe1ffc5b4f8d6

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint unnumbered energy resolver
        run: >-
          npx eslint
          scripts/resolve-pokemon-japanese-unnumbered-energy-sets.ts

      - name: Check out pinned TCGdex source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex-run
          git clone --filter=blob:none https://github.com/tcgdex/cards-database.git \
            .codex-run/tcgdex-cards-database
          git -C .codex-run/tcgdex-cards-database checkout --detach "$TCGDEX_SOURCE_COMMIT"
          test "$(git -C .codex-run/tcgdex-cards-database rev-parse HEAD)" = "$TCGDEX_SOURCE_COMMIT"

      - name: Rebuild Japanese source receipt
        run: |
          node --import tsx scripts/build-tcgdex-japanese-registry-bundles.ts \
            .codex-run/tcgdex-cards-database \
            .codex-run/tcgdex-ja-registry-bundles \
            --receipt .codex-run/tcgdex-ja-build-receipt.json \
            > .codex-run/tcgdex-ja-build-output.json

      - name: Rebuild Phase 4A source classification
        run: |
          node --import tsx scripts/inventory-pokemon-japanese-incomplete-sets.ts \
            .codex-run/tcgdex-cards-database \
            --build-receipt .codex-run/tcgdex-ja-build-receipt.json \
            --delay-ms 75 \
            --continue-on-error \
            --receipt .codex-run/pokemon-ja-incomplete-inventory-receipt.json \
            --queue .codex-run/pokemon-ja-incomplete-inventory-queue.json \
            > .codex-run/pokemon-ja-incomplete-inventory-output.json

      - name: Require the three energy targets
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/pokemon-ja-incomplete-inventory-receipt.json');
          const expected = ['S8a', 'S8b', 'S10b'];
          const rows = expected.map((setId) =>
            receipt.rows.find((row) => row.setId.toLowerCase() === setId.toLowerCase())
          );
          const checks = {
            schema: receipt.schema === 'tcos.checklist.pokemonJapaneseIncompleteInventory.v1',
            sourceCommit: receipt.sourceCommit === process.env.TCGDEX_SOURCE_COMMIT,
            rowsFound: rows.every(Boolean),
            rowsUnmapped: rows.every((row) => row?.status === 'official_source_unmapped'),
            failedSets: receipt.totals?.failedSets === 0,
          };
          console.log(JSON.stringify({ checks, rows: rows.map((row) => ({
            setId: row?.setId,
            status: row?.status,
            sourceCardCount: row?.sourceCardCount,
            missingJapaneseCardNames: row?.missingJapaneseCardNames,
          })) }, null, 2));
          if (Object.values(checks).some((value) => value !== true)) process.exit(1);
          NODE

      - name: Upload pinned source receipts
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-unnumbered-energy-source-receipts
          path: |
            .codex-run/tcgdex-ja-build-receipt.json
            .codex-run/pokemon-ja-incomplete-inventory-receipt.json
          if-no-files-found: error
          retention-days: 90

  resolve-set:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - set: S8a
            key: s8a
            sourceCards: 33
            officialCards: 34
            numberMatches: 25
            aliasMatches: 8
            numberedAdditions: 1
            unnumberedAdditions: 0
          - set: S8b
            key: s8b
            sourceCards: 181
            officialCards: 279
            numberMatches: 181
            aliasMatches: 0
            numberedAdditions: 90
            unnumberedAdditions: 8
          - set: S10b
            key: s10b
            sourceCards: 79
            officialCards: 101
            numberMatches: 71
            aliasMatches: 8
            numberedAdditions: 22
            unnumberedAdditions: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out pinned TCGdex source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex-run
          git clone --filter=blob:none https://github.com/tcgdex/cards-database.git \
            .codex-run/tcgdex-cards-database
          git -C .codex-run/tcgdex-cards-database checkout --detach "$TCGDEX_SOURCE_COMMIT"
          test "$(git -C .codex-run/tcgdex-cards-database rev-parse HEAD)" = "$TCGDEX_SOURCE_COMMIT"

      - name: Download pinned source receipts
        uses: actions/download-artifact@v4
        with:
          name: pokemon-ja-unnumbered-energy-source-receipts
          path: .codex-run/source-receipts

      - name: Resolve ${{ matrix.set }} unnumbered energies
        run: |
          node --import tsx scripts/resolve-pokemon-japanese-unnumbered-energy-sets.ts \
            .codex-run/tcgdex-cards-database \
            --build-receipt .codex-run/source-receipts/tcgdex-ja-build-receipt.json \
            --phase4a-receipt .codex-run/source-receipts/pokemon-ja-incomplete-inventory-receipt.json \
            --set "${{ matrix.set }}" \
            --delay-ms 250 \
            --continue-on-error \
            --receipt .codex-run/pokemon-ja-unnumbered-energy-resolution-receipt.json \
            --queue .codex-run/pokemon-ja-unnumbered-energy-resolution-queue.json \
            > .codex-run/pokemon-ja-unnumbered-energy-resolution-output.json

      - name: Require exact ${{ matrix.set }} resolution
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/pokemon-ja-unnumbered-energy-resolution-receipt.json');
          const row = receipt.rows?.[0];
          const checks = {
            schema: receipt.schema === 'tcos.checklist.pokemonJapaneseUnnumberedEnergyResolution.v1',
            mode: receipt.mode === 'read_only_unnumbered_energy_resolution',
            sourceCommit: receipt.sourceCommit === process.env.TCGDEX_SOURCE_COMMIT,
            attemptedSets: receipt.attemptedSets === 1,
            successfulSets: receipt.successfulSets === 1,
            failedSets: receipt.failedSets === 0,
            setId: row?.setId?.toLowerCase() === '${{ matrix.set }}'.toLowerCase(),
            status: row?.status === 'resolved',
            sourceCards: row?.sourceCards === Number('${{ matrix.sourceCards }}'),
            officialCards: row?.officialCards === Number('${{ matrix.officialCards }}'),
            numberMatches: row?.sourceNumberMatches === Number('${{ matrix.numberMatches }}'),
            aliasMatches: row?.sourceEnergyAliasMatches === Number('${{ matrix.aliasMatches }}'),
            resolvedNames: row?.resolvedMissingNames === Number('${{ matrix.sourceCards }}'),
            numberedAdditions: row?.numberedOfficialAdditions === Number('${{ matrix.numberedAdditions }}'),
            unnumberedAdditions: row?.unnumberedEnergyAdditions === Number('${{ matrix.unnumberedAdditions }}'),
            noDetailFailures: row?.detailFetchFailures === 0,
            crosswalkComplete: row?.sourceCrosswalk?.length === Number('${{ matrix.sourceCards }}'),
            additionsComplete:
              row?.officialAdditions?.length ===
              Number('${{ matrix.numberedAdditions }}') + Number('${{ matrix.unnumberedAdditions }}'),
          };
          console.log(JSON.stringify({ checks, row: {
            setId: row?.setId,
            setName: row?.setName,
            status: row?.status,
            product: row?.product,
            sourceCards: row?.sourceCards,
            officialCards: row?.officialCards,
            sourceNumberMatches: row?.sourceNumberMatches,
            sourceEnergyAliasMatches: row?.sourceEnergyAliasMatches,
            resolvedMissingNames: row?.resolvedMissingNames,
            numberedOfficialAdditions: row?.numberedOfficialAdditions,
            unnumberedEnergyAdditions: row?.unnumberedEnergyAdditions,
            detailFetchFailures: row?.detailFetchFailures,
            error: row?.error,
          } }, null, 2));
          if (Object.values(checks).some((value) => value !== true)) process.exit(1);
          NODE

      - name: Upload ${{ matrix.set }} energy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-unnumbered-energy-${{ matrix.key }}
          path: |
            .codex-run/pokemon-ja-unnumbered-energy-resolution-receipt.json
            .codex-run/pokemon-ja-unnumbered-energy-resolution-queue.json
            .codex-run/pokemon-ja-unnumbered-energy-resolution-output.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [prepare, resolve-set]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download all energy evidence
        uses: actions/download-artifact@v4
        with:
          pattern: pokemon-ja-unnumbered-energy-*
          path: .codex-run/energy-results

      - name: Require exact three-set aggregate
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }
          const files = walk('.codex-run/energy-results')
            .filter((file) => file.endsWith('pokemon-ja-unnumbered-energy-resolution-receipt.json'));
          const receipts = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')));
          const rows = receipts.flatMap((receipt) => receipt.rows || [])
            .sort((left, right) => left.setId.localeCompare(right.setId));
          const totals = rows.reduce((sum, row) => {
            for (const key of Object.keys(sum)) sum[key] += Number(row[key] || 0);
            return sum;
          }, {
            sourceCards: 0,
            missingJapaneseCardNames: 0,
            officialCards: 0,
            numberedOfficialCards: 0,
            unnumberedOfficialCards: 0,
            sourceNumberMatches: 0,
            sourceEnergyAliasMatches: 0,
            resolvedMissingNames: 0,
            numberedOfficialAdditions: 0,
            unnumberedEnergyAdditions: 0,
            detailFetchFailures: 0,
          });
          const checks = {
            receipts: receipts.length === 3,
            rows: rows.length === 3,
            uniqueSets: new Set(rows.map((row) => row.setId.toLowerCase())).size === 3,
            allResolved: rows.every((row) => row.status === 'resolved' && !row.error),
            sourceCards: totals.sourceCards === 293,
            missingNames: totals.missingJapaneseCardNames === 293,
            officialCards: totals.officialCards === 414,
            numberedOfficialCards: totals.numberedOfficialCards === 390,
            unnumberedOfficialCards: totals.unnumberedOfficialCards === 24,
            numberMatches: totals.sourceNumberMatches === 277,
            aliasMatches: totals.sourceEnergyAliasMatches === 16,
            resolvedNames: totals.resolvedMissingNames === 293,
            numberedAdditions: totals.numberedOfficialAdditions === 113,
            unnumberedAdditions: totals.unnumberedEnergyAdditions === 8,
            noDetailFailures: totals.detailFetchFailures === 0,
          };
          const summary = {
            schema: 'tcos.checklist.pokemonJapaneseUnnumberedEnergyResolutionAggregate.v1',
            mode: 'read_only_isolated_unnumbered_energy_resolution',
            sourceCommit: process.env.TCGDEX_SOURCE_COMMIT,
            attemptedSets: rows.length,
            totals,
            rows: rows.map((row) => ({
              setId: row.setId,
              setName: row.setName,
              status: row.status,
              product: row.product,
              sourceCards: row.sourceCards,
              officialCards: row.officialCards,
              sourceNumberMatches: row.sourceNumberMatches,
              sourceEnergyAliasMatches: row.sourceEnergyAliasMatches,
              resolvedMissingNames: row.resolvedMissingNames,
              numberedOfficialAdditions: row.numberedOfficialAdditions,
              unnumberedEnergyAdditions: row.unnumberedEnergyAdditions,
              error: row.error,
            })),
          };
          fs.writeFileSync(
            '.codex-run/pokemon-ja-unnumbered-energy-resolution-aggregate.json',
            `${JSON.stringify(summary, null, 2)}\n`,
          );
          console.log(JSON.stringify({ checks, summary }, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# Japanese unnumbered-energy resolution',
            '',
            '```json',
            JSON.stringify(summary, null, 2),
            '```',
            '',
          ].join('\n'));
          if (Object.values(checks).some((value) => value !== true)) process.exit(1);
          NODE

      - name: Upload aggregate energy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ja-unnumbered-energy-aggregate
          path: |
            .codex-run/pokemon-ja-unnumbered-energy-resolution-aggregate.json
            .codex-run/energy-results
          if-no-files-found: error
          retention-days: 90
