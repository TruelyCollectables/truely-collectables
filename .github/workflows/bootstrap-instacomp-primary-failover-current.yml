name: Bootstrap Current-Main InstaComp Provider Failover

on:
  pull_request:
    paths:
      - "src/lib/instacomp-ai-provider-failover.ts"
      - "scripts/run-instacomp-primary-ai-failover-regression.ts"
      - "scripts/bootstrap-instacomp-primary-failover-current.py"
      - ".github/workflows/bootstrap-instacomp-primary-failover-current.yml"

permissions:
  contents: write

jobs:
  patch-guarded-pr-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact current-main route integration
        run: python3 scripts/bootstrap-instacomp-primary-failover-current.py
      - name: Run hostile provider failover regression
        run: npx tsx scripts/run-instacomp-primary-ai-failover-regression.ts
      - name: Lint patched boundary
        run: npx eslint src/app/api/instacomp/scan/route.ts src/lib/instacomp-ai-provider-failover.ts scripts/run-instacomp-primary-ai-failover-regression.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit only to the guarded pull-request branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -n "$HEAD_BRANCH"
          test "$HEAD_BRANCH" != "main"
          git rm scripts/bootstrap-instacomp-primary-failover-current.py
          git rm .github/workflows/bootstrap-instacomp-primary-failover-current.yml
          git add src/app/api/instacomp/scan/route.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire bounded provider failover into current InstaComp route"
          git push origin "HEAD:$HEAD_BRANCH"
