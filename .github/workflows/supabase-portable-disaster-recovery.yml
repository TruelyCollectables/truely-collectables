name: Supabase Portable Disaster Recovery Snapshot

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
  PINNED_MAIN_SHA: 7659fe3da536f8ce48f0b14b2a17b2ec09831a07

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_MAIN_SHA }}
          fetch-depth: 1
          path: pinned-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Supabase management credential
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 2; }
          mkdir -p /tmp/tc-supabase-portable/{database,auth,storage/objects,metadata}
          echo 'Supabase management credential present. Secret values will not be printed.'

      - name: Create portable database dumps with Supabase CLI
        shell: bash
        run: |
          set -u
          umask 077
          ROOT=/tmp/tc-supabase-portable
          DB="$ROOT/database"
          META="$ROOT/metadata"
          cd "$GITHUB_WORKSPACE/pinned-source"

          : > "$META/database-dump-status.txt"
          run_dump() {
            label="$1"; shift
            echo "START $label" >> "$META/database-dump-status.txt"
            if timeout 35m npx --yes supabase@latest "$@" >"/tmp/${label}.out" 2>"/tmp/${label}.err"; then
              echo "OK $label" >> "$META/database-dump-status.txt"
            else
              code=$?
              echo "FAIL $label exit=$code" >> "$META/database-dump-status.txt"
            fi
            rm -f "/tmp/${label}.out" "/tmp/${label}.err"
          }

          if timeout 5m npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" >/tmp/sb-link.out 2>/tmp/sb-link.err; then
            echo 'OK link' >> "$META/database-dump-status.txt"
          else
            echo "FAIL link exit=$?" >> "$META/database-dump-status.txt"
          fi
          rm -f /tmp/sb-link.out /tmp/sb-link.err

          run_dump roles db dump --linked -f "$DB/roles.sql" --role-only
          run_dump schema db dump --linked -f "$DB/schema.sql"
          run_dump data db dump --linked -f "$DB/data.sql" --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes
          run_dump migration-schema db dump --linked -f "$DB/migration-schema.sql" --schema supabase_migrations
          run_dump migration-data db dump --linked -f "$DB/migration-data.sql" --use-copy --data-only --schema supabase_migrations

          if timeout 20m npx --yes supabase@latest db diff --linked --schema auth,storage > "$DB/auth-storage-custom-changes.sql" 2>/tmp/sb-diff.err; then
            echo 'OK auth-storage-diff' >> "$META/database-dump-status.txt"
          else
            echo "FAIL auth-storage-diff exit=$?" >> "$META/database-dump-status.txt"
            rm -f "$DB/auth-storage-custom-changes.sql"
          fi
          rm -f /tmp/sb-diff.err

          for f in "$DB"/*; do
            [ -f "$f" ] || continue
            printf '%s\t%s\n' "$(basename "$f")" "$(wc -c < "$f")" >> "$META/database-file-sizes.tsv"
          done

      - name: Export Auth users and Storage object bytes concurrently
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p /tmp/tc-supabase-tool
          cd /tmp/tc-supabase-tool
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @supabase/supabase-js@2
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';

          const root='/tmp/tc-supabase-portable';
          const meta=path.join(root,'metadata');
          const authDir=path.join(root,'auth');
          const objRoot=path.join(root,'storage','objects');
          const ref=process.env.SUPABASE_PROJECT_REF;
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const result={createdAt:new Date().toISOString(),projectRef:ref,pinnedMainSha:process.env.PINNED_MAIN_SHA,authUsers:0,authErrors:[],buckets:[],objects:[],storageBytes:0,storageErrors:[]};
          const clean=s=>String(s||'').replace(/[\\/\0]/g,'_')||'_';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function retry(fn,attempts=7){let last;for(let i=0;i<attempts;i++){try{const r=await fn();if(!r?.error)return r;last=r;const s=Number(r.error?.status||r.error?.statusCode||0);if(![429,500,502,503,504,520,522,524,544].includes(s))return r;}catch(e){last={data:null,error:e};}await sleep(Math.min(10000,750*2**Math.min(i,4)));}return last;}

          const kr=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}});
          if(!kr.ok) throw new Error(`Management API key retrieval failed HTTP ${kr.status}`);
          const keys=await kr.json();
          const k=keys.find(x=>String(x?.name||'').toLowerCase()==='service_role'&&x?.api_key)||keys.find(x=>String(x?.type||'').toLowerCase()==='secret'&&x?.api_key)||keys.find(x=>String(x?.api_key||'').startsWith('sb_secret_'));
          if(!k?.api_key) throw new Error('No server-side Supabase API key resolved');
          const sb=createClient(`https://${ref}.supabase.co`,k.api_key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});

          const users=fs.createWriteStream(path.join(authDir,'users.jsonl'),{mode:0o600});
          for(let page=1;;page++){
            const r=await retry(()=>sb.auth.admin.listUsers({page,perPage:1000}));
            if(r?.error){result.authErrors.push({page,error:r.error.message||String(r.error)});break;}
            const rows=r?.data?.users||[]; for(const u of rows) users.write(JSON.stringify(u)+'\n'); result.authUsers+=rows.length; if(rows.length<1000)break;
          }
          await new Promise(resolve=>users.end(resolve));

          const br=await retry(()=>sb.storage.listBuckets({limit:1000,offset:0}));
          if(br?.error){result.storageErrors.push({operation:'listBuckets',error:br.error.message||String(br.error)});} else {
            const buckets=br.data||[];
            async function collect(bucket,prefix='',out=[]){let offset=0;for(;;){const r=await retry(()=>sb.storage.from(bucket).list(prefix,{limit:1000,offset,sortBy:{column:'name',order:'asc'}}));if(r?.error){result.storageErrors.push({bucket,prefix,operation:'list',error:r.error.message||String(r.error)});return out;}const rows=r.data||[];for(const item of rows){const p=prefix?`${prefix}/${item.name}`:item.name;if(item.id===null||item.id===undefined)await collect(bucket,p,out);else out.push({bucket,path:p,metadata:item.metadata||null});}if(rows.length<1000)break;offset+=rows.length;}return out;}
            for(const b of buckets){
              result.buckets.push({id:b.id,name:b.name,public:b.public,fileSizeLimit:b.file_size_limit??null,allowedMimeTypes:b.allowed_mime_types??null});
              const items=await collect(b.id);
              let cursor=0;
              async function worker(){for(;;){const i=cursor++;if(i>=items.length)return;const item=items[i];const r=await retry(()=>sb.storage.from(item.bucket).download(item.path));if(r?.error||!r?.data){result.storageErrors.push({bucket:item.bucket,path:item.path,operation:'download',error:r?.error?.message||'No data'});continue;}const bytes=Buffer.from(await r.data.arrayBuffer());const target=path.join(objRoot,clean(item.bucket),...item.path.split('/').map(clean));fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});fs.writeFileSync(target,bytes,{mode:0o600});result.storageBytes+=bytes.length;result.objects.push({bucket:item.bucket,path:item.path,bytes:bytes.length,sha256:sha(bytes),localPath:path.relative(root,target),metadata:item.metadata});}}
              await Promise.all(Array.from({length:Math.min(8,Math.max(1,items.length))},()=>worker()));
            }
          }
          fs.writeFileSync(path.join(meta,'portable-manifest.json'),JSON.stringify(result,null,2)+'\n',{mode:0o600});
          fs.writeFileSync(path.join(meta,'portable-summary.txt'),[
            `createdAt=${result.createdAt}`,
            `authUsers=${result.authUsers}`,
            `authErrors=${result.authErrors.length}`,
            `storageBuckets=${result.buckets.length}`,
            `storageObjects=${result.objects.length}`,
            `storageBytes=${result.storageBytes}`,
            `storageErrors=${result.storageErrors.length}`
          ].join('\n')+'\n',{mode:0o600});
          console.log(`Portable non-DB snapshot: auth=${result.authUsers}, buckets=${result.buckets.length}, objects=${result.objects.length}, errors=${result.authErrors.length+result.storageErrors.length}`);
          NODE

      - name: Write recovery metadata and encrypt archive
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          ROOT=/tmp/tc-supabase-portable
          cat > "$ROOT/metadata/RECOVERY-NOTES.txt" <<EOF
          Production source SHA: $PINNED_MAIN_SHA
          Supabase project ref: $SUPABASE_PROJECT_REF
          Database files use the Supabase CLI logical dump format where the provider allowed the linked dump.
          Auth users and Storage object bytes are also exported independently for disaster recovery.
          EOF
          (cd "$ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > metadata/PLAINTEXT-SHA256SUMS.txt)
          tar -C /tmp -czf /tmp/TruelyCollectables-supabase-portable-2026-08-15.tar.gz tc-supabase-portable
          openssl rand -base64 48 > /tmp/TruelyCollectables-supabase-portable-2026-08-15.recovery-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 310000 -md sha256 \
            -in /tmp/TruelyCollectables-supabase-portable-2026-08-15.tar.gz \
            -out /tmp/TruelyCollectables-supabase-portable-2026-08-15.tar.gz.enc \
            -pass file:/tmp/TruelyCollectables-supabase-portable-2026-08-15.recovery-key.txt
          sha256sum /tmp/TruelyCollectables-supabase-portable-2026-08-15.tar.gz.enc > /tmp/TruelyCollectables-supabase-portable-2026-08-15.sha256
          rm -f /tmp/TruelyCollectables-supabase-portable-2026-08-15.tar.gz

      - name: Upload encrypted portable Supabase backup
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-supabase-portable-encrypted-2026-08-15
          path: |
            /tmp/TruelyCollectables-supabase-portable-2026-08-15.tar.gz.enc
            /tmp/TruelyCollectables-supabase-portable-2026-08-15.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload portable Supabase recovery key separately
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-supabase-portable-recovery-key-2026-08-15
          path: /tmp/TruelyCollectables-supabase-portable-2026-08-15.recovery-key.txt
          if-no-files-found: error
          retention-days: 1
