name: Disaster Recovery Live Infrastructure Snapshot

on:
  push:
    branches:
      - backup/disaster-recovery-2026-08-15

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require read-only recovery credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          for key in CF_ACCOUNT_ID CF_API_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            [ -n "${!key:-}" ] || { echo "Missing required recovery credential: $key"; exit 2; }
          done
          echo 'Recovery credentials present. Secret values will not be printed.'

      - name: Capture Cloudflare and Supabase live state
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p /tmp/tc-live-snapshot/cloudflare /tmp/tc-live-snapshot/supabase/data /tmp/tc-live-snapshot/metadata
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = '/tmp/tc-live-snapshot';
          const cfDir = path.join(root, 'cloudflare');
          const sbDir = path.join(root, 'supabase');
          const dataDir = path.join(sbDir, 'data');
          const errors = [];
          const notes = [];
          const cfAccount = process.env.CF_ACCOUNT_ID;
          const cfToken = process.env.CF_API_TOKEN;
          const sbToken = process.env.SUPABASE_ACCESS_TOKEN;
          const sbRef = process.env.SUPABASE_PROJECT_REF;

          function writeJson(file, value) {
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n', { mode: 0o600 });
          }
          function safe(s) { return String(s).replace(/[^A-Za-z0-9._-]+/g, '_'); }
          async function req(url, options = {}) {
            const res = await fetch(url, options);
            const text = await res.text();
            let body;
            try { body = text ? JSON.parse(text) : null; } catch { body = { raw: text }; }
            return { ok: res.ok, status: res.status, body };
          }
          function rowsFrom(x) {
            if (Array.isArray(x)) return x;
            if (!x || typeof x !== 'object') return [];
            for (const key of ['data', 'result', 'rows']) {
              if (Array.isArray(x[key])) return x[key];
              if (x[key] && typeof x[key] === 'object') {
                for (const sub of ['data', 'rows', 'result']) if (Array.isArray(x[key][sub])) return x[key][sub];
              }
            }
            return [];
          }

          const cfHeaders = { Authorization: `Bearer ${cfToken}`, 'Content-Type': 'application/json' };
          async function cfGet(name, endpoint) {
            try {
              const r = await req(`https://api.cloudflare.com/client/v4${endpoint}`, { headers: cfHeaders });
              writeJson(path.join(cfDir, safe(name) + '.json'), r);
              if (!r.ok) errors.push(`Cloudflare ${name}: HTTP ${r.status}`);
              return r;
            } catch (e) {
              errors.push(`Cloudflare ${name}: ${e.message}`);
              writeJson(path.join(cfDir, safe(name) + '.json'), { ok: false, error: e.message });
              return { ok: false, body: null };
            }
          }

          const scripts = await cfGet('workers-scripts', `/accounts/${cfAccount}/workers/scripts`);
          const scriptRows = Array.isArray(scripts.body?.result) ? scripts.body.result : [];
          for (const script of scriptRows) {
            const id = script?.id || script?.name;
            if (!id) continue;
            await cfGet(`worker-${id}-settings`, `/accounts/${cfAccount}/workers/scripts/${encodeURIComponent(id)}/settings`);
            await cfGet(`worker-${id}-deployments`, `/accounts/${cfAccount}/workers/scripts/${encodeURIComponent(id)}/deployments`);
            await cfGet(`worker-${id}-versions`, `/accounts/${cfAccount}/workers/scripts/${encodeURIComponent(id)}/versions`);
          }
          await cfGet('workers-account-subdomain', `/accounts/${cfAccount}/workers/subdomain`);
          await cfGet('workers-custom-domains', `/accounts/${cfAccount}/workers/domains/records?per_page=1000`);
          await cfGet('pages-projects', `/accounts/${cfAccount}/pages/projects?per_page=100`);
          await cfGet('kv-namespaces', `/accounts/${cfAccount}/storage/kv/namespaces?per_page=100`);
          await cfGet('d1-databases', `/accounts/${cfAccount}/d1/database?per_page=100`);
          await cfGet('r2-buckets', `/accounts/${cfAccount}/r2/buckets`);
          await cfGet('queues', `/accounts/${cfAccount}/queues?per_page=100`);
          await cfGet('hyperdrive-configs', `/accounts/${cfAccount}/hyperdrive/configs`);
          const zones = await cfGet('zones', `/zones?account.id=${encodeURIComponent(cfAccount)}&per_page=50`);
          const zoneRows = Array.isArray(zones.body?.result) ? zones.body.result : [];
          for (const zone of zoneRows) {
            if (!zone?.id) continue;
            await cfGet(`zone-${zone.name || zone.id}-dns-records`, `/zones/${zone.id}/dns_records?per_page=5000`);
            await cfGet(`zone-${zone.name || zone.id}-worker-routes`, `/zones/${zone.id}/workers/routes`);
            await cfGet(`zone-${zone.name || zone.id}-settings`, `/zones/${zone.id}/settings`);
          }

          const sbHeaders = { Authorization: `Bearer ${sbToken}`, 'Content-Type': 'application/json' };
          async function sbGet(name, endpoint) {
            try {
              const r = await req(`https://api.supabase.com${endpoint}`, { headers: sbHeaders });
              writeJson(path.join(sbDir, safe(name) + '.json'), r);
              if (!r.ok) errors.push(`Supabase ${name}: HTTP ${r.status}`);
              return r;
            } catch (e) {
              errors.push(`Supabase ${name}: ${e.message}`);
              writeJson(path.join(sbDir, safe(name) + '.json'), { ok: false, error: e.message });
              return { ok: false, body: null };
            }
          }
          async function sql(name, query, save = true) {
            try {
              const r = await req(`https://api.supabase.com/v1/projects/${sbRef}/database/query/read-only`, {
                method: 'POST', headers: sbHeaders, body: JSON.stringify({ query, parameters: [] })
              });
              if (save) writeJson(path.join(sbDir, safe(name) + '.json'), r);
              if (!r.ok) errors.push(`Supabase SQL ${name}: HTTP ${r.status}`);
              return r;
            } catch (e) {
              errors.push(`Supabase SQL ${name}: ${e.message}`);
              if (save) writeJson(path.join(sbDir, safe(name) + '.json'), { ok: false, error: e.message });
              return { ok: false, body: null };
            }
          }

          await sbGet('projects', '/v1/projects');
          await sbGet('project', `/v1/projects/${sbRef}`);
          await sbGet('database-backups', `/v1/projects/${sbRef}/database/backups`);
          await sbGet('security-advisors', `/v1/projects/${sbRef}/advisors/security`);
          await sbGet('performance-advisors', `/v1/projects/${sbRef}/advisors/performance`);

          await sql('database-identity', `select current_database() as database_name, current_user as database_user, version() as postgres_version, now() as captured_at, pg_database_size(current_database()) as database_size_bytes`);
          await sql('schemas', `select schema_name, schema_owner from information_schema.schemata order by schema_name`);
          const tableResp = await sql('tables', `select table_schema, table_name, table_type from information_schema.tables where table_schema not in ('pg_catalog','information_schema') order by table_schema, table_name`);
          await sql('columns', `select table_schema, table_name, ordinal_position, column_name, data_type, udt_name, is_nullable, column_default from information_schema.columns where table_schema not in ('pg_catalog','information_schema') order by table_schema, table_name, ordinal_position`);
          await sql('constraints', `select n.nspname as schema_name, c.relname as table_name, con.conname as constraint_name, con.contype as constraint_type, pg_get_constraintdef(con.oid, true) as definition from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname not in ('pg_catalog','information_schema') order by n.nspname,c.relname,con.conname`);
          await sql('indexes', `select schemaname, tablename, indexname, indexdef from pg_indexes where schemaname not in ('pg_catalog','information_schema') order by schemaname,tablename,indexname`);
          await sql('views', `select schemaname, viewname, definition from pg_views where schemaname not in ('pg_catalog','information_schema') order by schemaname,viewname`);
          await sql('materialized-views', `select schemaname, matviewname, definition from pg_matviews where schemaname not in ('pg_catalog','information_schema') order by schemaname,matviewname`);
          await sql('functions', `select n.nspname as schema_name, p.proname as function_name, pg_get_function_identity_arguments(p.oid) as arguments, pg_get_functiondef(p.oid) as definition from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname not in ('pg_catalog','information_schema') order by n.nspname,p.proname`);
          await sql('triggers', `select event_object_schema, event_object_table, trigger_name, action_timing, event_manipulation, action_statement from information_schema.triggers order by event_object_schema,event_object_table,trigger_name`);
          await sql('extensions', `select extname, extversion from pg_extension order by extname`);
          await sql('rls-policies', `select schemaname, tablename, policyname, permissive, roles, cmd, qual, with_check from pg_policies order by schemaname,tablename,policyname`);
          await sql('publications', `select pubname, puballtables, pubinsert, pubupdate, pubdelete, pubtruncate from pg_publication order by pubname`);
          await sql('migration-history', `select * from supabase_migrations.schema_migrations order by version`, true);

          const tableRows = rowsFrom(tableResp.body).filter(r => r && r.table_schema && r.table_name && r.table_type === 'BASE TABLE');
          writeJson(path.join(sbDir, 'data-export-table-list.json'), tableRows);
          let exportedTables = 0;
          let exportedRows = 0;
          const pageSize = 500;
          for (const t of tableRows) {
            const schema = String(t.table_schema);
            const table = String(t.table_name);
            const ident = `"${schema.replaceAll('"','""')}"."${table.replaceAll('"','""')}"`;
            const key = safe(`${schema}.${table}`);
            const countResp = await sql(`count-${key}`, `select count(*)::bigint as row_count from ${ident}`, false);
            writeJson(path.join(dataDir, `${key}.count.json`), countResp);
            if (!countResp.ok) continue;
            const out = fs.createWriteStream(path.join(dataDir, `${key}.jsonl`), { mode: 0o600 });
            let offset = 0;
            let tableRowsWritten = 0;
            for (;;) {
              const page = await sql(`page-${key}-${offset}`, `select * from ${ident} limit ${pageSize} offset ${offset}`, false);
              if (!page.ok) {
                writeJson(path.join(dataDir, `${key}.error-${offset}.json`), page);
                break;
              }
              const rows = rowsFrom(page.body);
              if (!rows.length) break;
              for (const row of rows) out.write(JSON.stringify(row) + '\n');
              tableRowsWritten += rows.length;
              exportedRows += rows.length;
              offset += rows.length;
              if (rows.length < pageSize) break;
              if (offset > 2000000) {
                errors.push(`Supabase table ${schema}.${table}: safety cap reached at ${offset} rows`);
                break;
              }
            }
            out.end();
            exportedTables++;
            notes.push(`Exported ${schema}.${table}: ${tableRowsWritten} row(s)`);
          }

          writeJson(path.join(root, 'metadata', 'snapshot-summary.json'), {
            createdAt: new Date().toISOString(),
            githubRepository: process.env.GITHUB_REPOSITORY,
            githubSha: process.env.GITHUB_SHA,
            supabaseProjectRef: sbRef,
            cloudflareAccountIdPresent: Boolean(cfAccount),
            cloudflareWorkerCount: scriptRows.length,
            cloudflareZoneCount: zoneRows.length,
            supabaseBaseTablesDiscovered: tableRows.length,
            supabaseTablesExported: exportedTables,
            supabaseRowsExported: exportedRows,
            errors,
            notes,
            limitations: [
              'Cloudflare secret values are write-only and are intentionally recovered from the separate encrypted production-secrets vault.',
              'Cloudflare R2 object bytes are not downloaded by this metadata snapshot.',
              'Supabase Storage object bytes are not part of database backup data.',
              'The SQL data export is read-only and paginated; it is not a transactionally consistent pg_dump.'
            ]
          });
          console.log(`Live snapshot complete: Cloudflare workers=${scriptRows.length}, zones=${zoneRows.length}, Supabase tables=${tableRows.length}, rows=${exportedRows}, recordedErrors=${errors.length}`);
          NODE

      - name: Encrypt live snapshot and create separate recovery key
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          tar -C /tmp -czf /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.tar.gz tc-live-snapshot
          openssl rand -base64 48 > /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.recovery-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 310000 -md sha256 \
            -in /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.tar.gz \
            -out /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.tar.gz.enc \
            -pass file:/tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.recovery-key.txt
          sha256sum /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.tar.gz.enc \
            > /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.sha256
          rm -f /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.tar.gz

      - name: Upload encrypted live recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-live-infrastructure-data-encrypted-2026-08-15
          path: |
            /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.tar.gz.enc
            /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload recovery key separately
        uses: actions/upload-artifact@v4
        with:
          name: TruelyCollectables-live-infrastructure-data-recovery-key-2026-08-15
          path: /tmp/TruelyCollectables-live-infrastructure-data-2026-08-15.recovery-key.txt
          if-no-files-found: error
          retention-days: 1
