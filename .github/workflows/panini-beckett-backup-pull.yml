name: Panini Beckett Backup Pull

on:
  pull_request:
    paths:
      - "scripts/pull-panini-checklists-from-beckett.ts"
      - "scripts/organize-panini-checklist-archive.ts"
      - ".github/workflows/panini-beckett-backup-pull.yml"
  push:
    branches:
      - "agent/panini-archive-sorting-20260805"
    paths:
      - "scripts/pull-panini-checklists-from-beckett.ts"
      - "scripts/organize-panini-checklist-archive.ts"
      - ".github/workflows/panini-beckett-backup-pull.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panini-beckett-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-panini:
    name: Pull and Sort Panini Sets From Beckett
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crawl Beckett Panini checklist archives
        env:
          BECKETT_MAX_PAGES: 60
          BECKETT_MAX_ARTICLES: 2500
        run: node --import tsx scripts/pull-panini-checklists-from-beckett.ts
      - name: Sort by sport, season, product, and source
        env:
          PANINI_ARCHIVE_INPUTS: ".panini-beckett-archive/articles=beckett,.panini-beckett-archive/files=beckett"
          PANINI_ORGANIZED_OUTPUT: ".panini-beckett-organized"
        run: node --import tsx scripts/organize-panini-checklist-archive.ts
      - name: Package raw and organized Panini backup archives
        if: always()
        run: tar -czf panini-beckett-checklists.tar.gz .panini-beckett-archive .panini-beckett-organized
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panini-beckett-checklists-${{ github.run_id }}
          path: panini-beckett-checklists.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panini-beckett-status-${{ github.run_id }}
          path: |
            .panini-beckett-archive/manifest.json
            .panini-beckett-organized/catalog.json
            .panini-beckett-organized/catalog.csv
          if-no-files-found: error
          retention-days: 90
