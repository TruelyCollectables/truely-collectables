name: Checklist GoGTS Progress Probe 20260815

on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/checklist-gogts-progress-probe-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  progress:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Resolve Production Supabase
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gogts-progress"
          mkdir -p "$root"
          test -n "$GH_SUPABASE_ACCESS_TOKEN"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --max-time 45 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$root/projects.json" \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --max-time 45 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$root/api-keys.json" \
            "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$root/api-keys.json")"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_URL=https://$project_ref.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Count offline GoGTS Production rows
        shell: bash
        run: |
          set -euo pipefail
          count_rows() {
            local status="$1"
            local headers="$RUNNER_TEMP/gogts-${status}.headers"
            curl --silent --show-error --fail --max-time 45 \
              --request HEAD \
              --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Prefer: count=exact" \
              --dump-header "$headers" \
              --output /dev/null \
              "$SUPABASE_URL/rest/v1/checklist_source_catalog?select=source_url&status=eq.${status}&metadata-%3E%3EgogtsOfflineArchive=eq.true"
            awk 'BEGIN{IGNORECASE=1} /^content-range:/ {gsub("\r",""); split($0,a,"/"); print a[2]}' "$headers" | tail -1
          }
          imported="$(count_rows imported)"
          quarantined="$(count_rows quarantined)"
          validated="$(count_rows validated)"
          echo "GOGTS_OFFLINE_IMPORTED=$imported"
          echo "GOGTS_OFFLINE_QUARANTINED=$quarantined"
          echo "GOGTS_OFFLINE_VALIDATED=$validated"
          echo "GOGTS_OFFLINE_ACCOUNTED=$((imported + quarantined + validated))"
