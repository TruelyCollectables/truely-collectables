name: Cloudflare Live Product Tail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.122.0
      - name: List routed Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler secret list --name truely-collectables-preview --format json > /tmp/secrets.json
          node - <<'NODE'
          const fs = require("fs");
          const rows = JSON.parse(fs.readFileSync("/tmp/secrets.json","utf8"));
          const names = (Array.isArray(rows) ? rows : []).map(x => String(x?.name || "")).filter(Boolean).sort();
          console.log("SECRET_NAMES=" + names.join(","));
          NODE
      - name: List retained Worker versions and deployments
        shell: bash
        run: |
          set -euo pipefail
          echo "--- VERSIONS ---"
          npx --no-install wrangler versions list --name truely-collectables-preview 2>&1
          echo "--- DEPLOYMENTS ---"
          npx --no-install wrangler deployments list --name truely-collectables-preview 2>&1
