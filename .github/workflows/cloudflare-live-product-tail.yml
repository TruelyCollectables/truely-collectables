name: Cloudflare Live Product Tail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-live-product-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      URL: https://truely-collectables-preview.truelycollectables.workers.dev/product/1991
    steps:
      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.122.0

      - name: Tail Worker while probing product
        shell: bash
        run: |
          set +e
          timeout 35s npx wrangler tail truely-collectables-preview --format json > /tmp/tail.log 2>&1 &
          tail_pid=$!
          sleep 5
          curl -L -sS --max-time 18 -D /tmp/product.headers -o /tmp/product.body -w 'HTTP=%{http_code} TIME=%{time_total} BYTES=%{size_download}\n' "$URL" || true
          sleep 4
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo '--- response headers ---'
          cat /tmp/product.headers 2>/dev/null || true
          echo '--- worker tail ---'
          cat /tmp/tail.log 2>/dev/null || true
