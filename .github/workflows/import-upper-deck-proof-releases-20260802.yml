name: Audit Upper Deck Timeout State 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-upper-deck-proof-releases-20260802.yml"
      - "scripts/ops/import-upper-deck-proof-releases-20260802.ts"

permissions:
  contents: read

concurrency:
  group: audit-upper-deck-timeout-state-20260802
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 603c7e297167535a5be141851b98002fabeeca45
  EXPECTED_BRANCH: ops/import-upper-deck-proof-releases-20260802
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/upper-deck-timeout-audit-20260802

jobs:
  audit-timeout-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/import-upper-deck-proof-releases-20260802.yml'
          test "${changed[1]}" = 'scripts/ops/import-upper-deck-proof-releases-20260802.ts'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          cp scripts/ops/import-upper-deck-proof-releases-20260802.ts \
            "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts" \
            scripts/ops/import-upper-deck-proof-releases-20260802.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and resolve masked Production URL
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"

          mkdir -p .vercel "$RUNNER_TEMP/upper-deck-timeout-audit"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi

          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/upper-deck-timeout-audit/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

          PRODUCTION_ENV_PATH="$RUNNER_TEMP/upper-deck-timeout-audit/production.env" node - <<'NODE'
          const fs = require('node:fs');
          function parseEnv(filePath) {
            const parsed = {};
            for (const raw of fs.readFileSync(filePath, 'utf8').split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const index = line.indexOf('=');
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }
          const parsed = parseEnv(process.env.PRODUCTION_ENV_PATH);
          const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
          if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL in Production environment');
          console.log(`::add-mask::${productionUrl}`);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`,
          );
          NODE

      - name: Audit database and private source storage without writes
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/ops/import-upper-deck-proof-releases-20260802.ts \
            --audit-only \
            --receipt "$EVIDENCE_DIR/timeout-audit.json"

      - name: Require sanitized read-only audit receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(
            fs.readFileSync('evidence/upper-deck-timeout-audit-20260802/timeout-audit.json', 'utf8'),
          );
          if (receipt.status !== 'observed') throw new Error('Timeout audit did not complete.');
          if (!['clean_absent', 'fully_imported', 'partial_or_dirty'].includes(receipt.classification)) {
            throw new Error(`Unexpected timeout classification ${receipt.classification}`);
          }
          const safety = receipt.safety || {};
          if (safety.productionDatabaseReads !== true ||
              safety.productionDatabaseWrites !== false ||
              safety.storageReads !== true ||
              safety.storageWrites !== false ||
              safety.migrationsApplied !== false ||
              safety.deploymentPerformed !== false) {
            throw new Error('Read-only audit safety receipt is incomplete.');
          }
          console.log(JSON.stringify({
            classification: receipt.classification,
            global: receipt.audit?.global,
            targets: receipt.audit?.targets,
            targetStorageObjects: receipt.audit?.targetStorageObjects,
            recentNonterminalRuns: receipt.audit?.recentNonterminalRuns,
          }, null, 2));
          NODE

      - name: Upload sanitized timeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-deck-timeout-audit-20260802
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/upper-deck-timeout-audit/production.env"
          rm -f .env.local .env.production.local
