name: Import Upper Deck Proof Releases 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-upper-deck-proof-releases-20260802.yml"
      - "scripts/ops/import-upper-deck-proof-releases-20260802.ts"

permissions:
  contents: read

concurrency:
  group: import-upper-deck-proof-releases-20260802
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 603c7e297167535a5be141851b98002fabeeca45
  EXPECTED_BRANCH: ops/import-upper-deck-proof-releases-20260802
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/upper-deck-proof-production-20260802

jobs:
  audit-import-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/import-upper-deck-proof-releases-20260802.yml'
          test "${changed[1]}" = 'scripts/ops/import-upper-deck-proof-releases-20260802.ts'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          cp scripts/ops/import-upper-deck-proof-releases-20260802.ts "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts" scripts/ops/import-upper-deck-proof-releases-20260802.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and resolve masked Production credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false pg@8.16.3
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/upper-deck-proof-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/upper-deck-proof-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$RUNNER_TEMP/upper-deck-proof-production/production.env" node - <<'NODE'
          const fs = require('node:fs');
          function parseEnv(filePath) {
            const parsed = {};
            for (const raw of fs.readFileSync(filePath, 'utf8').split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const index = line.indexOf('=');
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
              parsed[key] = value;
            }
            return parsed;
          }
          (async () => {
            const parsed = parseEnv(process.env.PRODUCTION_ENV_PATH);
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
            if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            let serviceKey = String(parsed.SUPABASE_SERVICE_ROLE_KEY || parsed.SUPABASE_SECRET_KEY || Object.entries(parsed).find(([key, value]) => /^SUPABASE_SECRET_.*_KEY$/.test(key) && value)?.[1] || '');
            if (!serviceKey) {
              const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, { headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` } });
              const text = await response.text();
              if (!response.ok) throw new Error(`Supabase API-key lookup failed with HTTP ${response.status}: ${text.slice(0, 500)}`);
              const keys = text ? JSON.parse(text) : [];
              const legacy = keys.find((key) => key?.name === 'service_role' && key?.api_key);
              const roleSecret = keys.find((key) => key?.secret_jwt_template?.role === 'service_role' && key?.api_key);
              const secret = keys.find((key) => key?.type === 'secret' && key?.api_key);
              serviceKey = String(legacy?.api_key || roleSecret?.api_key || secret?.api_key || '');
            }
            if (!serviceKey) throw new Error('No elevated Supabase API key could be resolved');
            for (const value of [productionUrl, serviceKey]) console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_ROLE_KEY<<SUPABASE_KEY_EOF\n${serviceKey}\nSUPABASE_KEY_EOF\n`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Apply fail-closed service-role and payload-integrity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ops/import-upper-deck-proof-releases-20260802.ts')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''      if (privilege.rows?.[0]?.can_execute_writer !== true) {
                  throw new Error("temporary role cannot execute the Registry writer");
                }

                await client.query("begin");
                try {
                  await client.query("set local statement_timeout = '120s'");''',
          '''      let writerRole = "current_user";
                if (privilege.rows?.[0]?.can_execute_writer !== true) {
                  await client.query("begin");
                  try {
                    await client.query("set local role service_role");
                    const elevated = await client.query(`select
                      current_user as current_user,
                      has_function_privilege(
                        current_user,
                        'public.tcos_apply_checklist_import_plan(jsonb,text,text,bigint,text,text,text)',
                        'EXECUTE'
                      ) as can_execute_writer`);
                    if (elevated.rows?.[0]?.can_execute_writer !== true) {
                      throw new Error("service_role cannot execute the Registry writer");
                    }
                    writerRole = "service_role";
                    await client.query("rollback");
                  } catch (error) {
                    await client.query("rollback").catch(() => undefined);
                    throw error;
                  }
                }

                await client.query("begin");
                try {
                  if (writerRole === "service_role") {
                    await client.query("set local role service_role");
                  }
                  await client.query("set local statement_timeout = '120s'");''',
          'connect privilege escalation')

          replace_once(
          '''        const probe = await client.query(
                    `select
                      jsonb_array_length(($1::jsonb)->'cards')::integer as cards,
                      jsonb_array_length(($1::jsonb)->'identities')::integer as identities,
                      octet_length($1::text)::integer as serialized_bytes`,
                    [serialized],
                  );
                  const observed = probe.rows?.[0];
                  if (
                    Number(observed?.cards) !== entry.source.expected.cards ||
                    Number(observed?.identities) !== entry.source.expected.identities ||
                    Number(observed?.serialized_bytes) !==
                      Buffer.byteLength(serialized, "utf8")
                  ) {
                    throw new Error(`${entry.source.id} PostgreSQL payload probe failed.`);
                  }
                  payloads.push({
                    id: entry.source.id,
                    cards: Number(observed.cards),
                    identities: Number(observed.identities),
                    serializedBytes: Number(observed.serialized_bytes),
                  });''',
          '''        const expectedPayloadSha256 = sha256(serialized);
                  const probe = await client.query(
                    `select
                      jsonb_array_length(($1::jsonb)->'cards')::integer as cards,
                      jsonb_array_length(($1::jsonb)->'identities')::integer as identities,
                      encode(digest($1::text, 'sha256'), 'hex') as payload_sha256`,
                    [serialized],
                  );
                  const observed = probe.rows?.[0];
                  const observedPayloadSha256 = String(observed?.payload_sha256 || "");
                  if (
                    Number(observed?.cards) !== entry.source.expected.cards ||
                    Number(observed?.identities) !== entry.source.expected.identities ||
                    observedPayloadSha256 !== expectedPayloadSha256
                  ) {
                    throw new Error(
                      `${entry.source.id} PostgreSQL payload probe failed: ${JSON.stringify({
                        observedCards: Number(observed?.cards),
                        expectedCards: entry.source.expected.cards,
                        observedIdentities: Number(observed?.identities),
                        expectedIdentities: entry.source.expected.identities,
                        payloadShaMatches: observedPayloadSha256 === expectedPayloadSha256,
                      })}`,
                    );
                  }
                  payloads.push({
                    id: entry.source.id,
                    cards: Number(observed.cards),
                    identities: Number(observed.identities),
                    payloadSha256: observedPayloadSha256,
                  });''',
          'payload integrity probe')

          replace_once(
          '''      return {
                  client,
                  receipt: {''',
          '''      return {
                  client,
                  writerRole,
                  receipt: {''',
          'return writer role')

          replace_once(
          '''          writerPrivilegeVerified: true,
                    delaySeconds: 35,''',
          '''          writerPrivilegeVerified: true,
                    writerRole,
                    delaySeconds: 35,''',
          'receipt writer role')

          replace_once(
          '''  client: any;
            entry: PreparedSource;''',
          '''  client: any;
            writerRole: string;
            entry: PreparedSource;''',
          'persist parameter type')

          replace_once(
          '''  const { client, entry, baseline, expectedImported } = params;''',
          '''  const { client, writerRole, entry, baseline, expectedImported } = params;''',
          'persist destructure')

          replace_once(
          '''    await client.query("begin");
              try {
                await client.query("set local statement_timeout = '15min'");''',
          '''    await client.query("begin");
              try {
                if (writerRole === "service_role") {
                  await client.query("set local role service_role");
                }
                await client.query("set local statement_timeout = '15min'");''',
          'writer transaction role')

          replace_once(
          '''  let postgresClient: any = null;
            let connectionReceipt: Record<string, unknown> | null = null;''',
          '''  let postgresClient: any = null;
            let writerRole = "current_user";
            let connectionReceipt: Record<string, unknown> | null = null;''',
          'main writer role variable')

          replace_once(
          '''    postgresClient = connected.client;
              connectionReceipt = connected.receipt;''',
          '''    postgresClient = connected.client;
              writerRole = connected.writerRole;
              connectionReceipt = connected.receipt;''',
          'main writer role assignment')

          replace_once(
          '''        client: postgresClient,
                  entry,''',
          '''        client: postgresClient,
                  writerRole,
                  entry,''',
          'persist writer role argument')

          path.write_text(text)
          PY
          grep -q 'set local role service_role' scripts/ops/import-upper-deck-proof-releases-20260802.ts
          grep -q 'payloadShaMatches' scripts/ops/import-upper-deck-proof-releases-20260802.ts
          test "$(grep -c 'writerRole = connected.writerRole' scripts/ops/import-upper-deck-proof-releases-20260802.ts)" -eq 1

      - name: Import Allure canary then Series 1 through temporary Postgres login
        shell: bash
        env:
          ALLOW_PRODUCTION_UPPER_DECK_IMPORT: "YES"
        run: |
          set -euo pipefail
          npx tsx scripts/ops/import-upper-deck-proof-releases-20260802.ts --apply --receipt "$EVIDENCE_DIR/production-import.json"

      - name: Require sanitized passing receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'evidence/upper-deck-proof-production-20260802/production-import.json';
          const receipt = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (receipt.schema !== 'tcos.checklist.upperDeckProofProductionImport.v3' || receipt.status !== 'passed') throw new Error('Upper Deck Production receipt did not pass.');
          if (receipt.imports?.length !== 2 || receipt.auditStates?.length !== 3 || receipt.finalTargets?.length !== 2) throw new Error('Upper Deck verification cardinality is wrong.');
          const preflight = receipt.postgresConnectionPreflight || {};
          if (preflight.writerPrivilegeVerified !== true || !['current_user', 'service_role'].includes(preflight.writerRole) || preflight.delaySeconds !== 35 || preflight.planPayloads?.length !== 2 || preflight.planPayloads.some((entry) => !/^[a-f0-9]{64}$/.test(String(entry.payloadSha256 || '')))) throw new Error('Temporary PostgreSQL preflight is incomplete.');
          const totals = receipt.imports.reduce((sum, entry) => ({ cards: sum.cards + Number(entry.counts?.cards || 0), identities: sum.identities + Number(entry.counts?.identities || 0) }), { cards: 0, identities: 0 });
          if (totals.cards !== 2454 || totals.identities !== 7318) throw new Error(`Unexpected totals ${JSON.stringify(totals)}`);
          if (receipt.imports.some((entry) => entry.transport !== 'temporary-postgresql-login')) throw new Error('Wrong writer transport.');
          const safety = receipt.safety || {};
          if (safety.semanticDigestPinned !== true || safety.rawSourceHashRecorded !== true || safety.writerTransport !== 'temporary-postgresql-login' || safety.managementApiBodyLimitBypassed !== true || safety.postgrestStatementTimeoutBypassed !== true || safety.canaryVerifiedBeforeSecondImport !== true || safety.temporaryLoginRoleDeleted !== true || safety.migrationsApplied !== false || safety.deploymentPerformed !== false || safety.rawOfficialHtmlIncluded !== false) throw new Error('Safety receipt is incomplete.');
          console.log(JSON.stringify({ status: receipt.status, totals, finalTargets: receipt.finalTargets }, null, 2));
          NODE

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-deck-proof-production-20260802
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/upper-deck-proof-production/production.env"
          rm -f .env.local .env.production.local
