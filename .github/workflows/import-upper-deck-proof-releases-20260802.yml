name: Import Upper Deck Proof Releases 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-upper-deck-proof-releases-20260802.yml"
      - "scripts/ops/import-upper-deck-proof-releases-20260802.ts"

permissions:
  contents: read

concurrency:
  group: import-upper-deck-proof-releases-20260802
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 603c7e297167535a5be141851b98002fabeeca45
  EXPECTED_BRANCH: ops/import-upper-deck-proof-releases-20260802
  EVIDENCE_DIR: evidence/upper-deck-normalized-digest-20260802

jobs:
  observe-normalized-digests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/import-upper-deck-proof-releases-20260802.yml'
          test "${changed[1]}" = 'scripts/ops/import-upper-deck-proof-releases-20260802.ts'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          cp scripts/ops/import-upper-deck-proof-releases-20260802.ts \
            "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts" \
            scripts/ops/import-upper-deck-proof-releases-20260802.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Observe normalized checklist digests without Production access
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/ops/import-upper-deck-proof-releases-20260802.ts \
            --observe-only \
            --receipt "$EVIDENCE_DIR/normalized-digests.json"

      - name: Require safe observation receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/upper-deck-normalized-digest-20260802/normalized-digests.json', 'utf8'));
          if (receipt.status !== 'observed') throw new Error('Digest observation did not complete.');
          if (receipt.sources?.length !== 2) throw new Error('Expected exactly two observed sources.');
          for (const source of receipt.sources) {
            if (!/^[0-9a-f]{64}$/.test(source.normalizedPlanSha256 || '')) {
              throw new Error(`Missing normalized digest for ${source.id}`);
            }
            if (!source.knownIdentityProofs?.every((proof) => proof.found === true)) {
              throw new Error(`Known identity proof failed for ${source.id}`);
            }
          }
          const safety = receipt.safety || {};
          if (safety.productionDatabaseReads !== false ||
              safety.productionDatabaseWrites !== false ||
              safety.migrationsApplied !== false ||
              safety.deploymentPerformed !== false ||
              safety.rawOfficialHtmlIncluded !== false) {
            throw new Error('Observation safety receipt is incomplete.');
          }
          console.log(JSON.stringify(receipt.sources.map((source) => ({
            id: source.id,
            rawSha256: source.rawSha256,
            rawSizeBytes: source.rawSizeBytes,
            normalizedPlanSha256: source.normalizedPlanSha256,
            counts: source.counts,
          })), null, 2));
          NODE

      - name: Upload sanitized digest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-deck-normalized-digest-20260802
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
