name: Import Upper Deck Proof Releases 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-upper-deck-proof-releases-20260802.yml"
      - "scripts/ops/import-upper-deck-proof-releases-20260802.ts"

permissions:
  contents: read

concurrency:
  group: import-upper-deck-proof-releases-20260802
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 603c7e297167535a5be141851b98002fabeeca45
  EXPECTED_BRANCH: ops/import-upper-deck-proof-releases-20260802
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/upper-deck-proof-production-20260802

jobs:
  audit-import-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/import-upper-deck-proof-releases-20260802.yml'
          test "${changed[1]}" = 'scripts/ops/import-upper-deck-proof-releases-20260802.ts'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          cp scripts/ops/import-upper-deck-proof-releases-20260802.ts \
            "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/import-upper-deck-proof-releases-20260802.ts" \
            scripts/ops/import-upper-deck-proof-releases-20260802.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and resolve masked Production credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"

          mkdir -p .vercel "$RUNNER_TEMP/upper-deck-proof-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi

          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/upper-deck-proof-production/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

          PRODUCTION_ENV_PATH="$RUNNER_TEMP/upper-deck-proof-production/production.env" node - <<'NODE'
          const fs = require('node:fs');

          function parseEnv(filePath) {
            const parsed = {};
            for (const raw of fs.readFileSync(filePath, 'utf8').split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const index = line.indexOf('=');
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }

          (async () => {
            const parsed = parseEnv(process.env.PRODUCTION_ENV_PATH);
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
            if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL in Production environment');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            if (!projectRef) throw new Error('Could not resolve Production Supabase project ref');

            let serviceKey = String(
              parsed.SUPABASE_SERVICE_ROLE_KEY ||
              parsed.SUPABASE_SECRET_KEY ||
              Object.entries(parsed).find(([key, value]) => /^SUPABASE_SECRET_.*_KEY$/.test(key) && value)?.[1] ||
              ''
            );

            if (!serviceKey) {
              const response = await fetch(
                `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
                { headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` } },
              );
              const text = await response.text();
              if (!response.ok) {
                throw new Error(`Supabase API-key lookup failed with HTTP ${response.status}: ${text.slice(0, 500)}`);
              }
              const keys = text ? JSON.parse(text) : [];
              if (!Array.isArray(keys)) throw new Error('Supabase API-key lookup returned an unexpected payload');
              const legacy = keys.find((key) => key?.name === 'service_role' && key?.api_key);
              const roleSecret = keys.find((key) => key?.secret_jwt_template?.role === 'service_role' && key?.api_key);
              const secret = keys.find((key) => key?.type === 'secret' && key?.api_key);
              serviceKey = String(legacy?.api_key || roleSecret?.api_key || secret?.api_key || '');
            }

            if (!serviceKey) throw new Error('No elevated Supabase API key could be resolved');
            for (const value of [productionUrl, serviceKey]) console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_ROLE_KEY<<SUPABASE_KEY_EOF\n${serviceKey}\nSUPABASE_KEY_EOF\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Import Allure canary then Series 1 and verify Production
        shell: bash
        env:
          ALLOW_PRODUCTION_UPPER_DECK_IMPORT: "YES"
        run: |
          set -euo pipefail
          npx tsx scripts/ops/import-upper-deck-proof-releases-20260802.ts \
            --apply \
            --receipt "$EVIDENCE_DIR/production-import.json"

      - name: Require sanitized passing receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/upper-deck-proof-production-20260802/production-import.json', 'utf8'));
          if (receipt.status !== 'passed') throw new Error('Upper Deck Production receipt did not pass.');
          if (receipt.imports?.length !== 2) throw new Error('Expected exactly two imported releases.');
          if (receipt.finalTargets?.length !== 2) throw new Error('Expected exactly two verified target releases.');
          const totals = receipt.imports.reduce((sum, entry) => ({
            cards: sum.cards + Number(entry.counts?.cards || 0),
            identities: sum.identities + Number(entry.counts?.identities || 0),
          }), { cards: 0, identities: 0 });
          if (totals.cards !== 2454 || totals.identities !== 7318) {
            throw new Error(`Unexpected totals ${JSON.stringify(totals)}`);
          }
          if (receipt.safety?.migrationsApplied !== false || receipt.safety?.deploymentPerformed !== false) {
            throw new Error('Safety receipt is incomplete.');
          }
          console.log(JSON.stringify({ status: receipt.status, totals, finalTargets: receipt.finalTargets }, null, 2));
          NODE

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-deck-proof-production-20260802
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/upper-deck-proof-production/production.env"
          rm -f .env.local .env.production.local
