name: KINGMAKER Unified Admin Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/kingmaker-unified-admin-workflow.yml"
      - "scripts/patch-kingmaker-pending-full-review.py"
      - "scripts/patch-kingmaker-pending-compatibility.py"
      - "scripts/patch-kingmaker-architecture-rotation-contract.py"
      - "scripts/certify-kingmaker-instacomp-architecture.mjs"
      - "scripts/run-admin-dashboard-actions-simulations.mjs"
      - "scripts/check-production-guardrails.mjs"
      - "src/lib/instacomp-learning-server.ts"
      - "src/app/admin/**"
      - "src/app/kingmaker/**"
      - "src/app/api/account/seller/instacomp-pending/route.ts"
      - "src/app/api/account/seller/inventory/instacomp-card-edit/route.ts"
      - "src/app/api/account/seller/inventory/instacomp-image-rotate/route.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingmaker-unified-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  persist-semantic-safety-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/kingmaker-certify-current-head-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore raw unresolved surface fail-closed guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/instacomp-learning-server.ts')
          source = path.read_text('utf-8')
          if 'const unresolvedSurfaceRisk =' not in source:
              needle = 'if (parallelProfile.baseLike && adjacentYearRecovered) {'
              index = source.find(needle)
              if index < 0:
                  raise SystemExit('Registry surface guard target not found')
              line_start = source.rfind('\n', 0, index) + 1
              indent = source[line_start:index]
              old_block = (
                  f'{indent}{needle}\n'
                  f'{indent}  continue;\n'
                  f'{indent}}}'
              )
              if old_block not in source:
                  raise SystemExit('Registry surface guard block shape changed')
              new_block = (
                  f'{indent}const unresolvedSurfaceRisk =\n'
                  f'{indent}  parallelProfile.surfaceRisk && ai.parallelEvidenceAdjudicated !== true;\n'
                  f'{indent}if (\n'
                  f'{indent}  parallelProfile.baseLike &&\n'
                  f'{indent}  (unresolvedSurfaceRisk || adjacentYearRecovered)\n'
                  f'{indent}) {{\n'
                  f'{indent}  continue;\n'
                  f'{indent}}}'
              )
              source = source.replace(old_block, new_block, 1)
              source = source.replace(
                  'Free-form finish/color prose from one scanner may not veto an otherwise',
                  'Raw unresolved finish/color evidence must remain fail-closed for Base.',
                  1,
              )
              source = source.replace(
                  'exact Base Registry candidate after a conflict-free multi-reader council.',
                  'Only a conflict-free multi-reader council may mark note evidence as adjudicated.',
                  1,
              )
              source = source.replace(
                  'Adjacent-year Base recovery remains fail-closed.',
                  'Adjacent-year Base recovery remains fail-closed regardless of note adjudication.',
                  1,
              )
          path.write_text(source, 'utf-8')
          PY
          git diff --check

      - name: Persist safety repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-learning-server.ts
          if git diff --cached --quiet; then
            echo "Registry surface safety guard is already repaired."
          else
            git commit -m "Restore fail-closed Registry surface evidence guard"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify compatibility patches are already applied
        run: |
          set -euo pipefail
          python3 scripts/patch-kingmaker-pending-full-review.py
          python3 scripts/patch-kingmaker-pending-compatibility.py
          python3 scripts/patch-kingmaker-architecture-rotation-contract.py
          git diff --check
          if ! git diff --exit-code; then
            echo 'KINGMAKER compatibility patch scripts changed the checked-out candidate.' >&2
            echo 'Commit those generated changes before certification; refusing a false-green run.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Existing KINGMAKER FBI contract
        run: node scripts/check-kingmaker-fbi-contract.mjs

      - name: Existing scan-to-list release matrix
        run: node --import tsx scripts/run-instacomp-scan-to-list-release-gate.ts

      - name: Reconciled KINGMAKER architecture contract
        run: node scripts/certify-kingmaker-instacomp-architecture.mjs

      - name: TypeScript contract
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: npx tsc --noEmit --pretty false

      - name: KINGMAKER unified workflow contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('src/app/admin/page.tsx').read_text('utf-8')
          layout = Path('src/app/admin/layout.tsx').read_text('utf-8')
          home = Path('src/app/kingmaker/page.tsx').read_text('utf-8')
          queue = Path('src/app/kingmaker/KingmakerInstaCompQueue.tsx').read_text('utf-8')
          pending = Path('src/app/kingmaker/pending/page.tsx').read_text('utf-8')
          pending_api = Path('src/app/api/account/seller/instacomp-pending/route.ts').read_text('utf-8')
          edit_api = Path('src/app/api/account/seller/inventory/instacomp-card-edit/route.ts').read_text('utf-8')
          rotate_api = Path('src/app/api/account/seller/inventory/instacomp-image-rotate/route.ts').read_text('utf-8')
          architecture = Path('scripts/certify-kingmaker-instacomp-architecture.mjs').read_text('utf-8')

          assert 'Enter KINGMAKER' in admin
          assert '/admin/advanced' in admin and '/admin/advanced' in layout
          assert 'LegacyAdminDashboard' not in admin
          assert 'KingmakerInstaCompQueue' in home
          assert '/api/account/seller/instacomp-scan/intake' in queue
          assert 'cardUuid' in queue
          assert 'multiple' in queue
          assert 'Nothing publishes automatically' in queue
          assert 'Edit All Fields' in pending
          assert 'Rotate 90°' in pending
          assert 'rotatedImageFile' in pending
          assert 'formData.set("frontImage", frontImage)' in pending
          assert 'formData.set("backImage", backImage)' in pending
          assert 'Retry This Card' in pending
          assert 'Replace Manual Identity with AI' in pending
          assert 'Re-scan and Replace Locked Identity' in pending
          assert 'Blank no longer means Base.' in pending
          assert 'No Base or look-alike parallel was substituted.' in pending
          assert 'soldCompEvidence' in pending and 'activeCompetition' in pending
          assert 'standardizedTitle' in pending
          assert '.replace(/\\bBase\\b/gi' in pending
          assert 'cardUuid:' in pending_api and 'identity:' in pending_api
          assert 'displayTitle' in edit_api and '.replace(/\\bBase\\b/gi' in edit_api
          assert 'description: nextDescription' in edit_api
          assert 'persistNormalizedInstaCompImagePair' in rotate_api
          assert 'form.get("frontImage") ?? form.get("front")' in rotate_api
          assert 'form.get("backImage") ?? form.get("back")' in rotate_api
          assert 'published: false' in rotate_api
          assert 'rotatedImageFile' in architecture
          assert 'formData.set("frontImage", frontImage)' not in architecture.split('for (const forbidden of [', 1)[1].split(']) {', 1)[0]
          print('PASS KINGMAKER unified scan -> Pending -> correction -> pricing workflow contract')
          PY
