name: Launch 2 Final Issue 253 F7B164 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/launch2-final-issue253-f7b164-20260730.yml"

permissions:
  contents: read

concurrency:
  group: launch2-final-issue253-f7b164-20260730
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: f7b164543e1b6189fa6dbc5404f21fc29c01dfe8
  EXPECTED_BRANCH: ops/launch2-final-f7b164-20260730
  SOURCE_AUDIT_BRANCH: deploy/issue253-hosted-cutover-v3-20260730
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  EVIDENCE_DIR: .audit/launch2-final-issue253-f7b164
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  CRON_SECRET: build-validation-cron-secret-that-is-long-enough
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  certify-cutover:
    if: github.event.pull_request.head.ref == 'ops/launch2-final-f7b164-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out guarded operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact current main and operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git fetch origin "+refs/heads/$SOURCE_AUDIT_BRANCH:refs/remotes/origin/$SOURCE_AUDIT_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/launch2-final-issue253-f7b164-20260730.yml"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/launch2-final-f7b164"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"
          git show "origin/$SOURCE_AUDIT_BRANCH:scripts/run-issue253-hosted-cutover-v3.mjs" > "$RUNNER_TEMP/launch2-final-f7b164/issue253-cutover.mjs"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Revalidate exact source gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-sold-lifecycle-simulations.mjs | tee "$EVIDENCE_DIR/sold-lifecycle-simulations.log"
          node scripts/run-sold-trigger-order-simulation.mjs | tee "$EVIDENCE_DIR/sold-trigger-order-simulation.log"
          node scripts/run-privileged-api-route-audit.mjs | tee "$EVIDENCE_DIR/privileged-route-audit.log"
          npm run simulate:privileged-route-auth | tee "$EVIDENCE_DIR/privileged-route-auth.log"
          node scripts/verify-runtime-admin-orders-self-test-contract.mjs | tee "$EVIDENCE_DIR/runtime-admin-contract.log"
          node scripts/verify-issue253-marketplace-runtime-self-test-contract.mjs | tee "$EVIDENCE_DIR/runtime-marketplace-contract.log"
          node scripts/verify-platform-fee-service-role-delete-grant.mjs | tee "$EVIDENCE_DIR/platform-fee-grant-contract.log"
          npm audit --json > "$EVIDENCE_DIR/npm-audit.json" || true
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          if ((counts.high || 0) !== 0 || (counts.critical || 0) !== 0) throw new Error(`High or critical advisories remain: ${JSON.stringify(counts)}`);
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/npm-audit-summary.json', JSON.stringify(counts, null, 2));
          NODE
          npm run lint
          npx tsc --noEmit --pretty false
          npm run build
          git diff --check

      - name: Link Vercel and pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/launch2-final-f7b164"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/launch2-final-f7b164/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          printf 'PRODUCTION_ENV_FILE=%s\n' "$RUNNER_TEMP/launch2-final-f7b164/production.env" >> "$GITHUB_ENV"

      - name: Reconfirm exact main before database mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Apply narrow service-role DELETE grant to Production
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const envText = fs.readFileSync(process.env.PRODUCTION_ENV_FILE, 'utf8');
          const parsed = {};
          for (const raw of envText.split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i < 1) continue;
            const key = line.slice(0, i).trim();
            let value = line.slice(i + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value = JSON.parse(value); } catch { value = value.slice(1, -1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            parsed[key] = value;
          }
          const url = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '').trim();
          if (!/^https:\/\//.test(url)) throw new Error('Production Supabase URL unavailable.');
          const projectRef = new URL(url).hostname.split('.')[0];
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          async function query(sql, readOnly = false) {
            const response = await fetch(endpoint, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ query: sql, parameters: [], read_only: readOnly }) });
            const body = await response.text();
            if (!response.ok) throw new Error(`Supabase grant application HTTP ${response.status}: ${body.replace(/Bearer\s+\S+/gi, 'Bearer [REDACTED]').slice(0, 1200)}`);
            return body ? JSON.parse(body) : [];
          }
          const migration = fs.readFileSync('supabase/migrations/20260730050000_grant_platform_fee_delete_service_role.sql', 'utf8');
          await query(migration, false);
          const rows = await query(`select has_table_privilege('service_role','public.platform_fee_ledger_entries','DELETE') service_role_delete, has_table_privilege('anon','public.platform_fee_ledger_entries','DELETE') anon_delete, has_table_privilege('authenticated','public.platform_fee_ledger_entries','DELETE') authenticated_delete;`, true);
          const receipt = rows?.[0] || {};
          if (receipt.service_role_delete !== true || receipt.anon_delete === true || receipt.authenticated_delete === true) throw new Error(`Unsafe or ineffective grant state: ${JSON.stringify(receipt)}`);
          fs.writeFileSync(path.join(process.env.EVIDENCE_DIR, 'platform-fee-grant-production-receipt.json'), JSON.stringify({ ok: true, exactMainSha: process.env.EXPECTED_MAIN_SHA, serviceRoleDelete: true, anonDelete: false, authenticatedDelete: false, appliedAt: new Date().toISOString() }, null, 2));
          NODE

      - name: Apply repeatable issue 253 migrations and historical backfill
        run: node "$RUNNER_TEMP/launch2-final-f7b164/issue253-cutover.mjs" migrate

      - name: Run rollback-only CollX-via-linked-eBay propagation proof
        run: node "$RUNNER_TEMP/launch2-final-f7b164/issue253-cutover.mjs" rollback-proof

      - name: Reconfirm exact main before Production deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Deploy detached exact main to Vercel Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          exact="$RUNNER_TEMP/launch2-final-exact-main"
          rm -rf "$exact"
          git worktree add --detach "$exact" "$EXPECTED_MAIN_SHA"
          test "$(git -C "$exact" rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test -z "$(git -C "$exact" status --porcelain)"
          mkdir -p "$exact/.vercel"
          cp .vercel/project.json "$exact/.vercel/project.json"
          cd "$exact"
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz --meta "githubCommitSha=$EXPECTED_MAIN_SHA" --meta "launchPurpose=launch2-final-issue253-f7b164" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/vercel-deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$GITHUB_WORKSPACE/$EVIDENCE_DIR/vercel-deploy.log" | tail -n 1)"
          test -n "$url"
          printf '%s\n' "$url" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/deployment-url.txt"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployment metadata and public boundaries
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$deployment_host?slug=$VERCEL_SCOPE" > "$EVIDENCE_DIR/vercel-deployment.json"
          DEPLOYMENT_JSON="$(cat "$EVIDENCE_DIR/vercel-deployment.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(process.env.DEPLOYMENT_JSON || '{}');
          const aliases = Array.isArray(value.alias) ? value.alias : Array.isArray(value.aliases) ? value.aliases : [];
          const sha = String(value?.meta?.githubCommitSha || '').trim();
          if (String(value.target || '').toLowerCase() !== 'production' || String(value.readyState || '').toUpperCase() !== 'READY') throw new Error('Deployment is not READY Production.');
          if (sha !== process.env.EXPECTED_MAIN_SHA) throw new Error(`Deployment SHA mismatch: ${sha}`);
          if (!aliases.includes('truelycollectables.com')) throw new Error('Custom-domain alias missing.');
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/exact-production-receipt.json', JSON.stringify({ ok: true, deploymentId: value.id, deploymentHost: value.url, exactMainSha: sha, target: value.target, readyState: value.readyState, customDomainAlias: 'truelycollectables.com', verifiedAt: new Date().toISOString() }, null, 2));
          NODE
          rm -f "$EVIDENCE_DIR/vercel-deployment.json"
          for base in "$DEPLOYMENT_URL" https://truelycollectables.com; do
            test "$(curl --location --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/")" = 200
            test "$(curl --location --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/shop")" = 200
            test "$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/admin")" = 307
            test "$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$base/api/admin-orders-health")" = 401
          done

      - name: Verify protected admin runtime after grant
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 300 --request POST --header "Authorization: Bearer $VERCEL_TOKEN" --output "$EVIDENCE_DIR/runtime-admin-orders-self-test.json" --write-out '%{http_code}' https://truelycollectables.com/api/release/admin-orders-self-test)"
          test "$code" = 200 || { cat "$EVIDENCE_DIR/runtime-admin-orders-self-test.json" >&2; exit 1; }
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/runtime-admin-orders-self-test.json','utf8'));
          if (value.success !== true || value.adminNavigation !== 'passed' || value.sessionRefresh !== 'passed' || value.refundConfirmationGuard !== 'passed' || value.refundIssued !== false || Number(value.directStoreTcosFeesRemaining) !== 0) throw new Error(`Protected admin runtime failed: ${JSON.stringify(value)}`);
          NODE

      - name: Run protected issue 253 marketplace chain
        shell: bash
        run: |
          set -euo pipefail
          for step in ebay-order-sales ebay-full-sync seller-reconciliation sold-archive; do
            code="$(curl --silent --show-error --max-time 300 --request POST --header "Authorization: Bearer $VERCEL_TOKEN" --output "$EVIDENCE_DIR/runtime-${step}.json" --write-out '%{http_code}' "https://truelycollectables.com/api/release/issue253-marketplace-self-test?step=${step}")"
            test "$code" = 200 || { echo "Runtime $step HTTP $code" >&2; cat "$EVIDENCE_DIR/runtime-${step}.json" >&2; exit 1; }
            STEP="$step" node - <<'NODE'
            const fs = require('node:fs');
            const step = process.env.STEP;
            const value = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/runtime-${step}.json`, 'utf8'));
            if (value.success !== true || value.cronSecretConfigured !== true || Number(value.upstreamStatus) !== 200) throw new Error(`Runtime marketplace step ${step} failed.`);
            NODE
          done

      - name: Audit final issue 253 state and CollX indirect evidence
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/launch2-final-f7b164/issue253-cutover.mjs" post-sync-audit
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const text = fs.readFileSync(process.env.PRODUCTION_ENV_FILE, 'utf8');
          const parsed = {};
          for (const raw of text.split(/\r?\n/)) { const line=raw.trim(); if(!line||line.startsWith('#')) continue; const i=line.indexOf('='); if(i<1) continue; let v=line.slice(i+1).trim(); if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}} else if(v.startsWith("'")&&v.endsWith("'"))v=v.slice(1,-1); parsed[line.slice(0,i).trim()]=v; }
          const projectRef = new URL(parsed.NEXT_PUBLIC_SUPABASE_URL).hostname.split('.')[0];
          const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query`, { method:'POST', headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`,'Content-Type':'application/json'}, body:JSON.stringify({read_only:true,parameters:[],query:`select json_build_object(
            'collx_via_linked_ebay_sales', (select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay'),
            'chain_evidence_rows', (select count(*) from public.collectible_sales where source_marketplace='ebay_or_collx_via_ebay' and evidence->>'source_chain'='collx_or_ebay_to_ebay_to_truely_collectables'),
            'collx_only_boundary_violations', (select count(*) from public.collx_only_inventory_boundary_violations),
            'active_zero_stock_guards', (select count(*) from public.ebay_inbound_sale_guards where active and protected_quantity=0),
            'violated_guards', (select count(*) from public.ebay_inbound_sale_guards g where active and (coalesce((select p.quantity from public.products p where p.id=g.legacy_product_id and p.seller_id=g.store_id),0)>g.protected_quantity or coalesce((select i.quantity from public.inventory_items i where i.id=g.inventory_item_id),0)>g.protected_quantity)),
            'maximum_propagation_minutes', json_build_object('completed_order_poll',5,'inactive_full_sync',15,'seller_reconciliation',15),
            'captured_at', now()) receipt;`}) });
          const body = await response.text(); if(!response.ok) throw new Error(`Final DB audit HTTP ${response.status}: ${body.slice(0,1000)}`);
          const rows=JSON.parse(body); const receipt=rows?.[0]?.receipt||{};
          const blockers=[];
          if(Number(receipt.collx_via_linked_ebay_sales||0)<1) blockers.push('no genuine existing eBay-or-CollX-via-eBay sale evidence exists');
          if(Number(receipt.chain_evidence_rows||0)<1) blockers.push('no persisted indirect source-chain evidence exists');
          if(Number(receipt.collx_only_boundary_violations||0)!==0) blockers.push('CollX-only storefront boundary violation exists');
          if(Number(receipt.violated_guards||0)!==0) blockers.push('protected sold stock was restored');
          fs.writeFileSync(path.join(process.env.EVIDENCE_DIR,'collx-indirect-production-receipt.json'),JSON.stringify({ok:blockers.length===0,exactMainSha:process.env.EXPECTED_MAIN_SHA,receipt,blockers,realMarketplaceOrderCreatedByAudit:false,verifiedAt:new Date().toISOString()},null,2));
          if(blockers.length) throw new Error(blockers.join('; '));
          NODE

      - name: Upload sanitized exact Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-final-issue253-f7b164-evidence
          path: .audit/launch2-final-issue253-f7b164
          if-no-files-found: error
          retention-days: 90

      - name: Remove pulled Production environment
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/launch2-final-f7b164/production.env"
