name: Authorized Launch 2 Final Production Certificate V3 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/authorized-launch-2-final-production-certificate-v3-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: authorized-launch-2-final-production-certificate-v3-20260729
  cancel-in-progress: false

jobs:
  certify-existing-exact-candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/launch-2-final-production-certificate-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 7765f115d44e2629d47cc38871273dacdafcb8e7
      CANDIDATE_URL: truely-collectables-c5u743y7v-truelycollectables-projects.vercel.app
      CANDIDATE_ID: dpl_E2yDcMnq5QAUWdrNC6AU9ek48iF8
      FULL_AUDIT_RUN_ID: "30495983067"
      HOSTED_RUNTIME_RUN_ID: "30496484637"
      METADATA_VALIDATION_RUN_ID: "30495716130"
      MONEY_INVENTORY_CUTOVER_RUN_ID: "30492028134"
      FINAL_BUILD_RUN_ID: "30497069040"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      EVIDENCE_DIR: /tmp/launch-2-final-certificate-v3
    steps:
      - name: Check out exact current source
        uses: actions/checkout@v4
        with:
          ref: 7765f115d44e2629d47cc38871273dacdafcb8e7
          fetch-depth: 1

      - name: Verify current main and every prerequisite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          node - <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const repo = process.env.GITHUB_REPOSITORY;
            const headers = { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            async function get(path) {
              const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { headers });
              if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
              return response.json();
            }
            async function run(id) {
              const value = await get(`/actions/runs/${id}`);
              const jobs = (await get(`/actions/runs/${id}/jobs?per_page=100`)).jobs || [];
              return { value, jobs };
            }
            const main = await get('/git/ref/heads/main');
            if (main.object?.sha !== process.env.SOURCE_SHA) throw new Error(`main moved to ${main.object?.sha || 'unknown'}`);

            const full = await run(process.env.FULL_AUDIT_RUN_ID);
            const required = [
              'API route and privilege audit',
              'Lighthouse accessibility, SEO, performance, and best practices',
              'Repository inventory and source security',
              'Dependencies, lint, TypeScript, and production build',
              'Simulation shard 0','Simulation shard 1','Simulation shard 2','Simulation shard 3','Simulation shard 4','Simulation shard 5',
              'Live Production crawl and access checks',
            ];
            const fullMap = Object.fromEntries(full.jobs.map((job) => [job.name, job.conclusion]));
            for (const name of required) if (fullMap[name] !== 'success') throw new Error(`${name}=${fullMap[name] || 'missing'}`);

            const hosted = await run(process.env.HOSTED_RUNTIME_RUN_ID);
            if (!hosted.jobs.some((job) => job.name === 'hosted-runtime-audit-v2' && job.conclusion === 'success')) throw new Error('Hosted runtime V2 did not pass.');
            const metadata = await run(process.env.METADATA_VALIDATION_RUN_ID);
            if (!metadata.jobs.some((job) => job.name === 'validate' && job.conclusion === 'success')) throw new Error('Transactional metadata validation did not pass.');
            const cutover = await run(process.env.MONEY_INVENTORY_CUTOVER_RUN_ID);
            if (cutover.value.conclusion !== 'success') throw new Error(`Money/inventory cutover=${cutover.value.conclusion}`);
            const finalBuild = await run(process.env.FINAL_BUILD_RUN_ID);
            const buildJob = finalBuild.jobs.find((job) => job.name === 'certify-and-deploy-v2');
            const stepMap = Object.fromEntries((buildJob?.steps || []).map((step) => [step.name, step.conclusion]));
            for (const name of ['Verify current main and exact evidence','Re-run exact regression lint TypeScript and Production build','Link exact Vercel project']) {
              if (stepMap[name] !== 'success') throw new Error(`Final exact-source gate did not pass: ${name}=${stepMap[name] || 'missing'}`);
            }
            fs.writeFileSync(process.env.EVIDENCE_DIR + '/prerequisites.json', JSON.stringify({
              ok: true,
              sourceSha: process.env.SOURCE_SHA,
              currentMain: main.object.sha,
              fullAuditRunId: Number(process.env.FULL_AUDIT_RUN_ID),
              hostedRuntimeRunId: Number(process.env.HOSTED_RUNTIME_RUN_ID),
              metadataValidationRunId: Number(process.env.METADATA_VALIDATION_RUN_ID),
              moneyInventoryCutoverRunId: Number(process.env.MONEY_INVENTORY_CUTOVER_RUN_ID),
              finalBuildRunId: Number(process.env.FINAL_BUILD_RUN_ID),
              requiredFullJobs: Object.fromEntries(required.map((name) => [name, fullMap[name]])),
              finalSourceSteps: stepMap,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Verify candidate source metadata through Vercel API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$CANDIDATE_URL?slug=$VERCEL_SCOPE" \
            > "$EVIDENCE_DIR/candidate-deployment.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/candidate-deployment.json', 'utf8'));
          const actualId = value.id || value.uid;
          if (actualId !== process.env.CANDIDATE_ID) throw new Error(`Candidate ID mismatch: ${actualId}`);
          if (value.readyState !== 'READY') throw new Error(`Candidate state=${value.readyState}`);
          if (value.target !== 'production') throw new Error(`Candidate target=${value.target}`);
          if (value.meta?.launchSourceSha !== process.env.SOURCE_SHA) {
            throw new Error(`Candidate source metadata=${value.meta?.launchSourceSha || 'missing'}`);
          }
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/candidate-source-proof.json', JSON.stringify({
            ok: true,
            id: actualId,
            url: value.url,
            target: value.target,
            readyState: value.readyState,
            launchSourceSha: value.meta.launchSourceSha,
            launchPurpose: value.meta.launchPurpose || null,
          }, null, 2));
          NODE
          rm -f "$EVIDENCE_DIR/candidate-deployment.json"

      - name: Smoke exact candidate before promotion
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://$CANDIDATE_URL"
          for path in / /shop /cart /account/signup /account/login /shipping /returns /buyer-protection; do
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output "$EVIDENCE_DIR/candidate-${path//\//-}.html" --write-out '%{http_code}' "$BASE$path")"
            test "$code" = "200"
          done
          grep -Eiq 'rel="canonical"[^>]+href="https://truelycollectables.com/cart"|href="https://truelycollectables.com/cart"[^>]+rel="canonical"' "$EVIDENCE_DIR/candidate--cart.html"
          grep -Eiq 'name="robots"[^>]+noindex[^>]+nofollow|content="[^"]*noindex[^"]*nofollow[^"]*"[^>]+name="robots"' "$EVIDENCE_DIR/candidate--cart.html"
          grep -Eiq 'rel="canonical"[^>]+href="https://truelycollectables.com/account/signup"|href="https://truelycollectables.com/account/signup"[^>]+rel="canonical"' "$EVIDENCE_DIR/candidate--account-signup.html"
          admin="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /dev/null --write-out '%{http_code}' "$BASE/admin")"
          case "$admin" in 301|302|303|307|308|401|403) ;; *) exit 1 ;; esac
          webhook="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$BASE/api/webhook")"
          test "$webhook" = "400"

      - name: Promote only the exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! npx vercel@56.2.0 promote "https://$CANDIDATE_URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/promote.log" 2>&1; then
            npx vercel@56.2.0 alias set "https://$CANDIDATE_URL" truelycollectables.com --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >> "$EVIDENCE_DIR/promote.log" 2>&1
            npx vercel@56.2.0 alias set "https://$CANDIDATE_URL" www.truelycollectables.com --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >> "$EVIDENCE_DIR/promote.log" 2>&1
            npx vercel@56.2.0 alias set "https://$CANDIDATE_URL" truely-collectables.vercel.app --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >> "$EVIDENCE_DIR/promote.log" 2>&1
          fi

      - name: Verify exact live deployment and write final certificate
        shell: bash
        run: |
          set -euo pipefail
          ready=''
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output "$EVIDENCE_DIR/live-signup.html" --write-out '%{http_code}' https://truelycollectables.com/account/signup || true)"
            if [ "$code" = "200" ] && grep -Eiq 'href="https://truelycollectables.com/account/signup"' "$EVIDENCE_DIR/live-signup.html"; then ready=1; break; fi
            sleep 10
          done
          test -n "$ready"
          npx vercel@56.2.0 inspect https://truelycollectables.com --json --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/live-inspect.json"
          live_id="$(node -e "const x=require(process.argv[1]);console.log(x.id||x.uid||'')" "$EVIDENCE_DIR/live-inspect.json")"
          test "$live_id" = "$CANDIDATE_ID"
          for path in / /shop /cart /account/login /shipping /returns /buyer-protection; do
            test "$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output /dev/null --write-out '%{http_code}' "https://truelycollectables.com$path")" = "200"
          done
          admin="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /dev/null --write-out '%{http_code}' https://truelycollectables.com/admin)"
          case "$admin" in 301|302|303|307|308|401|403) ;; *) exit 1 ;; esac
          webhook="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' https://truelycollectables.com/api/webhook)"
          test "$webhook" = "400"
          node - <<'NODE'
          const fs = require('node:fs');
          const prerequisites = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/prerequisites.json', 'utf8'));
          const source = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/candidate-source-proof.json', 'utf8'));
          const certificate = {
            status: 'COMPLETE',
            launch: 'TruelyCollectables.com Launch 2.0',
            certifiedAt: new Date().toISOString(),
            sourceSha: process.env.SOURCE_SHA,
            exactProductionDeploymentId: process.env.CANDIDATE_ID,
            exactProductionDeploymentUrl: process.env.CANDIDATE_URL,
            exactDeploymentMatch: true,
            prerequisites,
            candidateSourceProof: source,
            passed: [
              'tracked-source-secret-scan',
              'privileged-route-protection',
              'all-applicable-simulations',
              'lint',
              'standalone-typescript',
              'production-build',
              'lighthouse-policy',
              'live-production-crawl',
              'supabase-hosted-proof',
              'live-stripe-and-webhook-proof',
              'ebay-hosted-proof',
              'resend-authenticated-no-send-proof',
              'money-and-inventory-safety-cutover',
              'exact-production-deployment',
            ],
            unclaimedRealWorldProofs: [
              'controlled-real-money-charge',
              'physical-delivery',
              'real-refund',
              'real-dispute',
              'actual-inbox-receipt',
            ],
          };
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/launch-2-final-production-certificate.json', JSON.stringify(certificate, null, 2));
          fs.writeFileSync(process.env.EVIDENCE_DIR + '/launch-2-final-production-certificate.md', `# TruelyCollectables.com Launch 2.0 — COMPLETE\n\n- Exact source: \`${certificate.sourceSha}\`\n- Exact Production deployment: \`${certificate.exactProductionDeploymentId}\`\n- Certified: ${certificate.certifiedAt}\n\nAll applicable technical launch gates passed. Real-money charge, physical delivery, refund, dispute, and actual inbox receipt remain separate and are not claimed.\n`);
          NODE

      - name: Upload final Production certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-2-final-production-certificate-v3-${{ github.run_number }}
          path: /tmp/launch-2-final-certificate-v3
          if-no-files-found: error
          retention-days: 90
