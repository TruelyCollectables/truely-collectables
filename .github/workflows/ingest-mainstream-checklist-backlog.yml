name: Ingest Mainstream Checklists 2000 Plus

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ingest-mainstream-checklist-backlog.yml"
      - "scripts/ingest-mainstream-checklist-backlog.mjs"
      - "scripts/mainstream-checklist/**"
      - "scripts/test-mainstream-checklist-fetch-patch.mjs"
      - "scripts/test-mainstream-checklist-parser-v2.mjs"
      - "scripts/assert-mainstream-checklist-production-complete.mjs"
      - "scripts/classify-mainstream-checklist-exceptions.mjs"
      - "scripts/resolve-mainstream-checklist-production-env.sh"
      - "scripts/bootstrap-mainstream-checklist-schema.sh"
      - "scripts/repair-mainstream-checklist-schema.sh"
      - "supabase/migrations/20260807033000_checklist_registry_writer_repair.sql"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ingest-mainstream-checklist-backlog.yml"
      - "scripts/ingest-mainstream-checklist-backlog.mjs"
      - "scripts/mainstream-checklist/**"
      - "scripts/test-mainstream-checklist-fetch-patch.mjs"
      - "scripts/test-mainstream-checklist-parser-v2.mjs"
      - "scripts/assert-mainstream-checklist-production-complete.mjs"
      - "scripts/classify-mainstream-checklist-exceptions.mjs"
      - "scripts/resolve-mainstream-checklist-production-env.sh"
      - "scripts/bootstrap-mainstream-checklist-schema.sh"
      - "scripts/repair-mainstream-checklist-schema.sh"
      - "supabase/migrations/20260807033000_checklist_registry_writer_repair.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate sources or apply clean imports to the Checklist Registry
        required: true
        type: choice
        options:
          - validate
          - apply
        default: apply
  schedule:
    - cron: "41 8 * * *"

permissions:
  contents: write

concurrency:
  group: instacomp-mainstream-checklist-backlog-2000-plus
  cancel-in-progress: true

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production helper syntax
        run: |
          bash -n scripts/resolve-mainstream-checklist-production-env.sh
          bash -n scripts/bootstrap-mainstream-checklist-schema.sh
          bash -n scripts/repair-mainstream-checklist-schema.sh
          node --check scripts/mainstream-checklist/html-semantic-prepatch.mjs
          node --check scripts/mainstream-checklist/tcdb-complete-fetch.mjs
          node --check scripts/mainstream-checklist/remaining-source-fallbacks.mjs
          node --check scripts/mainstream-checklist/verified-exceptions.mjs
          node --check scripts/classify-mainstream-checklist-exceptions.mjs
      - name: Verify compressed backlog manifest and corrected disposition contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { loadMainstreamChecklistManifest } from './scripts/mainstream-checklist/manifest.mjs';
          import { VERIFIED_NON_PROMOTABLE_IDS } from './scripts/mainstream-checklist/verified-exceptions.mjs';
          const manifest = loadMainstreamChecklistManifest();
          const dispositions = manifest.entries.reduce((counts, entry) => {
            counts[entry.disposition] = (counts[entry.disposition] || 0) + 1;
            return counts;
          }, {});
          if (manifest.entries.length !== 327) throw new Error('Manifest row count mismatch.');
          if (new Set(manifest.entries.map((entry) => entry.sourceUrl)).size !== 327) {
            throw new Error('Manifest source URLs are not unique.');
          }
          if (
            dispositions.standalone !== 320 ||
            dispositions.merge_component !== 2 ||
            dispositions.attachment_only !== 5
          ) {
            throw new Error(`Historical manifest disposition mismatch: ${JSON.stringify(dispositions)}`);
          }
          if (VERIFIED_NON_PROMOTABLE_IDS.size !== 3) {
            throw new Error(`Verified correction count mismatch: ${VERIFIED_NON_PROMOTABLE_IDS.size}`);
          }
          const corrected = {
            standalone: dispositions.standalone - VERIFIED_NON_PROMOTABLE_IDS.size,
            merge_component: dispositions.merge_component,
            attachment_only: dispositions.attachment_only + VERIFIED_NON_PROMOTABLE_IDS.size,
          };
          if (corrected.standalone !== 317 || corrected.merge_component !== 2 || corrected.attachment_only !== 8) {
            throw new Error(`Corrected disposition mismatch: ${JSON.stringify(corrected)}`);
          }
          console.log(JSON.stringify({ entries: manifest.entries.length, historical: dispositions, corrected }));
          NODE
      - name: Verify source fallback, hierarchy, and section ordering
        run: node scripts/test-mainstream-checklist-fetch-patch.mjs
      - name: Verify parser scope, nested sections, and duplicate suppression
        run: node scripts/test-mainstream-checklist-parser-v2.mjs
      - name: Verify Registry writer identity conflict contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'on conflict (identity_schema, fingerprint_sha256) do nothing;' supabase/migrations/20260731161500_checklist_registry_transactional_writer.sql)" -eq 1
          ! grep -q 'where active do nothing' scripts/repair-mainstream-checklist-schema.sh

  bootstrap-production-schema:
    if: github.event_name != 'pull_request'
    needs: self-test
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve protected Production Supabase credentials
        run: bash scripts/resolve-mainstream-checklist-production-env.sh
      - name: Install and verify Checklist Registry production schema
        run: bash scripts/bootstrap-mainstream-checklist-schema.sh
      - name: Repair Registry writer uniqueness and identity conflict target
        run: bash scripts/repair-mainstream-checklist-schema.sh
      - name: Remove protected Production files
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/mainstream-checklist-ingestion" \
            "$RUNNER_TEMP/mainstream-checklist-schema" \
            "$RUNNER_TEMP/mainstream-checklist-writer-repair" \
            .env.local \
            .env.production.local

  ingest:
    if: github.event_name != 'pull_request'
    needs: [self-test, bootstrap-production-schema]
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      MAINSTREAM_CHECKLIST_APPLY: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.mode == 'apply' }}
      MAINSTREAM_CHECKLIST_BATCH_INDEX: ${{ matrix.batch }}
      MAINSTREAM_CHECKLIST_BATCH_COUNT: "8"
      MAINSTREAM_CHECKLIST_WORKERS: "3"
      MAINSTREAM_CHECKLIST_OUTPUT: .checklist-discovery/mainstream-backlog-batch-${{ matrix.batch }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic source extractors
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          pdftotext -v
      - run: npm ci
      - name: Resolve protected Production Supabase credentials
        run: bash scripts/resolve-mainstream-checklist-production-env.sh
      - name: Download, archive, normalize, validate and import backlog batch
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_PATH"
          set +a
          test -n "${RESOLVED_SUPABASE_SERVICE_ROLE_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          node \
            --import ./scripts/mainstream-checklist/html-semantic-prepatch.mjs \
            --import ./scripts/mainstream-checklist/tcdb-complete-fetch.mjs \
            --import ./scripts/mainstream-checklist/remaining-source-fallbacks.mjs \
            --import ./scripts/mainstream-checklist/fetch-patch.mjs \
            --import tsx \
            scripts/ingest-mainstream-checklist-backlog.mjs
      - name: Upload sanitized batch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainstream-checklist-backlog-batch-${{ matrix.batch }}-${{ github.run_id }}
          path: .checklist-discovery/mainstream-backlog-batch-${{ matrix.batch }}.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove protected Production files
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/mainstream-checklist-ingestion" \
            .env.local \
            .env.production.local

  reconcile:
    if: always() && github.event_name != 'pull_request'
    needs: [self-test, bootstrap-production-schema, ingest]
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 30
    env:
      MAINSTREAM_CHECKLIST_RECONCILE_ONLY: "true"
      MAINSTREAM_CHECKLIST_OUTPUT: .checklist-discovery/mainstream-backlog-reconciliation.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve protected Production Supabase credentials
        run: bash scripts/resolve-mainstream-checklist-production-env.sh
      - name: Classify verified cancelled, repack, and no-checklist exceptions
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_PATH"
          set +a
          test -n "${RESOLVED_SUPABASE_SERVICE_ROLE_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          node scripts/classify-mainstream-checklist-exceptions.mjs
      - name: Reconcile all 327 source targets against private storage and the source catalog
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_PATH"
          set +a
          test -n "${RESOLVED_SUPABASE_SERVICE_ROLE_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          node \
            --import ./scripts/mainstream-checklist/html-semantic-prepatch.mjs \
            --import ./scripts/mainstream-checklist/tcdb-complete-fetch.mjs \
            --import ./scripts/mainstream-checklist/remaining-source-fallbacks.mjs \
            --import ./scripts/mainstream-checklist/fetch-patch.mjs \
            --import tsx \
            scripts/ingest-mainstream-checklist-backlog.mjs
      - name: Prove every confirmed finite checklist is promoted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_PATH"
          set +a
          test -n "${RESOLVED_SUPABASE_SERVICE_ROLE_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          mkdir -p .checklist-discovery
          node scripts/assert-mainstream-checklist-production-complete.mjs \
            | tee .checklist-discovery/mainstream-backlog-promotion-proof.json
      - name: Upload reconciliation and promotion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainstream-checklist-backlog-reconciliation-${{ github.run_id }}
          path: |
            .checklist-discovery/mainstream-backlog-reconciliation.json
            .checklist-discovery/mainstream-backlog-promotion-proof.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist sanitized reconciliation receipt to status branch
        if: always()
        shell: bash
        env:
          STATUS_BRANCH: ops/mainstream-checklist-status
          STATUS_PATH: docs/operations/instacomp-mainstream-checklist-reconciliation.json
          PROMOTION_PATH: docs/operations/instacomp-mainstream-checklist-promotion-proof.json
        run: |
          set -euo pipefail
          receipt=.checklist-discovery/mainstream-backlog-reconciliation.json
          promotion=.checklist-discovery/mainstream-backlog-promotion-proof.json
          mkdir -p /tmp/mainstream-checklist-status
          if [[ -s "$receipt" ]]; then
            jq \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg workflow "$GITHUB_WORKFLOW" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg sourceSha "$GITHUB_SHA" \
              '. + {workflowEvidence:{runId:$runId,runAttempt:$runAttempt,workflow:$workflow,event:$event,sourceSha:$sourceSha}}' \
              "$receipt" > /tmp/mainstream-checklist-status/reconciliation.json
          else
            jq -n \
              --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg workflow "$GITHUB_WORKFLOW" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg sourceSha "$GITHUB_SHA" \
              '{schema:"tcos.checklist.mainstreamBacklogReconciliation.v1",checkedAt:$checkedAt,complete:false,error:"Reconciliation receipt was not produced.",workflowEvidence:{runId:$runId,runAttempt:$runAttempt,workflow:$workflow,event:$event,sourceSha:$sourceSha}}' \
              > /tmp/mainstream-checklist-status/reconciliation.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp /tmp/mainstream-checklist-status/reconciliation.json "$STATUS_PATH"
          if [[ -s "$promotion" ]]; then
            cp "$promotion" "$PROMOTION_PATH"
          fi
          git add "$STATUS_PATH" "$PROMOTION_PATH" 2>/dev/null || git add "$STATUS_PATH"
          if git diff --cached --quiet; then
            echo "Status receipt is unchanged."
          else
            git commit -m "Record mainstream checklist reconciliation [skip ci]"
            git push origin "HEAD:$STATUS_BRANCH"
          fi
      - name: Remove protected Production files
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/mainstream-checklist-ingestion" \
            .env.local \
            .env.production.local
