name: Ingest Mainstream Checklists 2000 Plus

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ingest-mainstream-checklist-backlog.yml"
      - "scripts/ingest-mainstream-checklist-backlog.mjs"
      - "scripts/mainstream-checklist/**"
      - "scripts/resolve-mainstream-checklist-production-env.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ingest-mainstream-checklist-backlog.yml"
      - "scripts/ingest-mainstream-checklist-backlog.mjs"
      - "scripts/mainstream-checklist/**"
      - "scripts/resolve-mainstream-checklist-production-env.sh"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate sources or apply clean imports to the Checklist Registry
        required: true
        type: choice
        options:
          - validate
          - apply
        default: apply
  schedule:
    - cron: "41 8 * * *"

permissions:
  contents: write

concurrency:
  group: instacomp-mainstream-checklist-backlog-2000-plus
  cancel-in-progress: false

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify compressed backlog manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { loadMainstreamChecklistManifest } from './scripts/mainstream-checklist/manifest.mjs';
          const manifest = loadMainstreamChecklistManifest();
          const dispositions = manifest.entries.reduce((counts, entry) => {
            counts[entry.disposition] = (counts[entry.disposition] || 0) + 1;
            return counts;
          }, {});
          if (manifest.entries.length !== 327) throw new Error('Manifest row count mismatch.');
          if (new Set(manifest.entries.map((entry) => entry.sourceUrl)).size !== 327) {
            throw new Error('Manifest source URLs are not unique.');
          }
          if (
            dispositions.standalone !== 320 ||
            dispositions.merge_component !== 2 ||
            dispositions.attachment_only !== 5
          ) {
            throw new Error(`Manifest disposition mismatch: ${JSON.stringify(dispositions)}`);
          }
          console.log(JSON.stringify({ entries: manifest.entries.length, dispositions }));
          NODE
      - name: Verify parser contract
        env:
          MAINSTREAM_CHECKLIST_SELF_TEST: "true"
        run: node --import tsx scripts/ingest-mainstream-checklist-backlog.mjs

  ingest:
    if: github.event_name != 'pull_request'
    needs: self-test
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      MAINSTREAM_CHECKLIST_APPLY: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.mode == 'apply' }}
      MAINSTREAM_CHECKLIST_BATCH_INDEX: ${{ matrix.batch }}
      MAINSTREAM_CHECKLIST_BATCH_COUNT: "8"
      MAINSTREAM_CHECKLIST_WORKERS: "3"
      MAINSTREAM_CHECKLIST_OUTPUT: .checklist-discovery/mainstream-backlog-batch-${{ matrix.batch }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic source extractors
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          pdftotext -v
      - run: npm ci
      - name: Resolve protected Production Supabase credentials
        run: bash scripts/resolve-mainstream-checklist-production-env.sh
      - name: Download, archive, normalize, validate and import backlog batch
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_PATH"
          set +a
          test -n "${RESOLVED_SUPABASE_SERVICE_ROLE_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          node --import tsx scripts/ingest-mainstream-checklist-backlog.mjs
      - name: Upload sanitized batch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainstream-checklist-backlog-batch-${{ matrix.batch }}-${{ github.run_id }}
          path: .checklist-discovery/mainstream-backlog-batch-${{ matrix.batch }}.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove protected Production files
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/mainstream-checklist-ingestion" \
            .env.local \
            .env.production.local

  reconcile:
    if: always() && github.event_name != 'pull_request'
    needs: [self-test, ingest]
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 30
    env:
      MAINSTREAM_CHECKLIST_RECONCILE_ONLY: "true"
      MAINSTREAM_CHECKLIST_OUTPUT: .checklist-discovery/mainstream-backlog-reconciliation.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve protected Production Supabase credentials
        run: bash scripts/resolve-mainstream-checklist-production-env.sh
      - name: Reconcile all 327 source targets against private storage and the source catalog
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PRODUCTION_ENV_PATH"
          set +a
          test -n "${RESOLVED_SUPABASE_SERVICE_ROLE_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"
          node --import tsx scripts/ingest-mainstream-checklist-backlog.mjs
      - name: Upload reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainstream-checklist-backlog-reconciliation-${{ github.run_id }}
          path: .checklist-discovery/mainstream-backlog-reconciliation.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist sanitized reconciliation receipt to status branch
        if: always()
        shell: bash
        env:
          STATUS_BRANCH: ops/mainstream-checklist-status
          STATUS_PATH: docs/operations/instacomp-mainstream-checklist-reconciliation.json
        run: |
          set -euo pipefail
          receipt=.checklist-discovery/mainstream-backlog-reconciliation.json
          mkdir -p /tmp/mainstream-checklist-status
          if [[ -s "$receipt" ]]; then
            jq \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg workflow "$GITHUB_WORKFLOW" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg sourceSha "$GITHUB_SHA" \
              '. + {workflowEvidence:{runId:$runId,runAttempt:$runAttempt,workflow:$workflow,event:$event,sourceSha:$sourceSha}}' \
              "$receipt" > /tmp/mainstream-checklist-status/reconciliation.json
          else
            jq -n \
              --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg workflow "$GITHUB_WORKFLOW" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg sourceSha "$GITHUB_SHA" \
              '{schema:"tcos.checklist.mainstreamBacklogReconciliation.v1",checkedAt:$checkedAt,complete:false,error:"Reconciliation receipt was not produced.",workflowEvidence:{runId:$runId,runAttempt:$runAttempt,workflow:$workflow,event:$event,sourceSha:$sourceSha}}' \
              > /tmp/mainstream-checklist-status/reconciliation.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$STATUS_BRANCH"
          git checkout -B "$STATUS_BRANCH" "origin/$STATUS_BRANCH"
          mkdir -p "$(dirname "$STATUS_PATH")"
          cp /tmp/mainstream-checklist-status/reconciliation.json "$STATUS_PATH"
          git add "$STATUS_PATH"
          if git diff --cached --quiet; then
            echo "Status receipt is unchanged."
          else
            git commit -m "Record mainstream checklist reconciliation [skip ci]"
            git push origin "HEAD:$STATUS_BRANCH"
          fi
      - name: Remove protected Production files
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/mainstream-checklist-ingestion" \
            .env.local \
            .env.production.local
