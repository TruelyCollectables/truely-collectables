name: Runtime Admin Orders Self-Test Build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/release/admin-orders-self-test/route.ts"
      - "scripts/verify-runtime-admin-orders-self-test-contract.mjs"
      - ".github/workflows/runtime-admin-orders-self-test-build.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify self-test security contract
        run: node scripts/verify-runtime-admin-orders-self-test-contract.mjs

      - name: Lint self-test route
        run: npx eslint src/app/api/release/admin-orders-self-test/route.ts

      - name: Build Production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          ADMIN_SESSION_SECRET: placeholder-admin-session-secret
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
        run: npm run build