name: InstaComp Malonga Rickea Final Cert 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/patch-instacomp-malonga-rickea-final-20260807.py"
      - "scripts/ops/cert-instacomp-malonga-rickea-final-20260807.ts"
      - ".github/workflows/instacomp-malonga-rickea-final-cert-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-malonga-rickea-final-cert-20260807
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: fix/instacomp-malonga-rickea-final-20260807
  EXPECTED_BASE: 84af4e1f7c7b90cd77bdd4f595769f709b8fd0cd
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-malonga-rickea-final-20260807
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Freeze source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/ops/patch-instacomp-malonga-rickea-final-20260807.py'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/ops/cert-instacomp-malonga-rickea-final-20260807.ts'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/instacomp-malonga-rickea-final-cert-20260807.yml'
          test -z "$(git diff --name-only "$EXPECTED_BASE"...HEAD -- services/instacomp-ai/app/local_vision.py services/instacomp-ai/app/ollama.py)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact two-defect repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/patch-instacomp-malonga-rickea-final-20260807.py
          git diff --check
          git diff -- src/lib/instacomp-ai-local.ts src/lib/instacomp-learning-server.ts

      - name: Install dependencies
        run: npm ci

      - name: Prove stale trusted serial cannot leak
        run: node --import tsx scripts/ops/cert-instacomp-malonga-rickea-final-20260807.ts pure

      - name: Full TypeScript compile
        run: npx tsc --noEmit

      - name: Resolve Production Registry proof credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/instacomp-final-two"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/instacomp-final-two/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PROD_ENV="$RUNNER_TEMP/instacomp-final-two/production.env" RUNTIME_ENV="$RUNNER_TEMP/instacomp-final-two/runtime-env.sh" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PROD_ENV, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i < 1) continue;
            const key = line.slice(0, i).trim();
            let value = line.slice(i + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) { try { value = JSON.parse(value); } catch { value = value.slice(1,-1); } }
            else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1,-1);
            parsed[key] = value;
          }
          const url = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
          if (!url) throw new Error('Missing Production Supabase URL');
          const projectRef = new URL(url).hostname.split('.')[0];
          const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` },
          });
          const raw = await response.text();
          if (!response.ok) throw new Error(`Supabase key lookup HTTP ${response.status}: ${raw.slice(0,300)}`);
          const keys = raw ? JSON.parse(raw) : [];
          const key = keys.find((k) => /^sb_secret_/.test(String(k?.api_key || '')))
            || keys.find((k) => k?.name === 'service_role' && /^eyJ/.test(String(k?.api_key || '')))
            || keys.find((k) => k?.secret_jwt_template?.role === 'service_role' && /^eyJ/.test(String(k?.api_key || '')));
          if (!key?.api_key) throw new Error('Production server key not found');
          console.log('::add-mask::' + key.api_key);
          fs.writeFileSync(process.env.RUNTIME_ENV, [
            `export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(url)}`,
            `export SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(String(key.api_key))}`,
          ].join('\n') + '\n', { mode: 0o600 });
          NODE

      - name: Live Registry proof for both remaining failures
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/instacomp-final-two/runtime-env.sh"
          node --import tsx scripts/ops/cert-instacomp-malonga-rickea-final-20260807.ts live

      - name: Source safety and commit certified repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modified < <(git diff --name-only | sort)
          printf '%s\n' "${modified[@]}"
          test "${#modified[@]}" -eq 2
          printf '%s\n' "${modified[@]}" | grep -Fx 'src/lib/instacomp-ai-local.ts'
          printf '%s\n' "${modified[@]}" | grep -Fx 'src/lib/instacomp-learning-server.ts'
          test -z "$(git diff --name-only -- services/instacomp-ai/app/local_vision.py services/instacomp-ai/app/ollama.py)"
          git config user.name 'TruelyCollectables Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/instacomp-ai-local.ts src/lib/instacomp-learning-server.ts
          git commit -m 'Fix final Malonga serial and Rickea Base resolution'
          git push origin HEAD:"$EXPECTED_BRANCH"

      - name: Remove local credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/instacomp-final-two" .vercel
