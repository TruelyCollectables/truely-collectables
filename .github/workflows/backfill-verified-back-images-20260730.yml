name: Backfill Verified Back Images 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/backfill-verified-back-images-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-verified-back-images-20260730
  cancel-in-progress: false

jobs:
  backfill-deploy-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/backfill-verified-back-images-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: f53aef4ddf18a882fabd853bc330e9f8d5945a5a
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: f53aef4ddf18a882fabd853bc330e9f8d5945a5a
          fetch-depth: 0

      - name: Fail closed on exact source and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          test -f src/lib/companion-back-image-sync.ts
          test -f src/app/api/cron/companion-back-image-sync/route.ts
          grep -Fq 'Back photo unavailable' src/app/components/ProductImageGallery.tsx
          grep -Fq '/api/cron/companion-back-image-sync' vercel.json
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Vercel and pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/verified-back-backfill"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/verified-back-backfill/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/verified-back-backfill/production.env"

      - name: Retrieve and verify Production Supabase server key
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const workDir = path.join(process.env.RUNNER_TEMP, 'verified-back-backfill');
          const envText = fs.readFileSync(path.join(workDir, 'production.env'), 'utf8');
          const parsed = {};
          for (const rawLine of envText.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const productionUrl = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) {
            throw new Error('Production NEXT_PUBLIC_SUPABASE_URL was not pulled from Vercel.');
          }
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !token) throw new Error('Production Supabase management credentials are unavailable.');

          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          const body = await response.text();
          if (!response.ok) {
            throw new Error(`Supabase API-key retrieval failed with HTTP ${response.status}: ${body.slice(0, 1000)}`);
          }
          const keys = JSON.parse(body);
          const elevated = Array.isArray(keys)
            ? keys.find((entry) => typeof entry?.api_key === 'string' && entry.api_key.startsWith('sb_secret_'))
              || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase() === 'service_role')
              || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase().includes('service'))
            : null;
          const serviceKey = elevated?.api_key;
          if (!serviceKey) throw new Error('No elevated Production Supabase server key was returned.');
          console.log('::add-mask::' + serviceKey);

          const verification = await fetch(`${productionUrl}/rest/v1/products?select=id&limit=1`, {
            headers: { apikey: serviceKey, Authorization: `Bearer ${serviceKey}` },
          });
          const verificationBody = await verification.text();
          if (!verification.ok) {
            throw new Error(`Production server key failed REST verification with HTTP ${verification.status}: ${verificationBody.slice(0, 1000)}`);
          }
          fs.writeFileSync(path.join(workDir, 'service-role-key'), serviceKey, { mode: 0o600 });
          console.log('Verified Production Supabase server key.');
          NODE

      - name: Backfill only verified companion back images
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/verified-back-backfill/service-role-key")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
            node --env-file="$RUNNER_TEMP/verified-back-backfill/production.env" --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createClient } from '@supabase/supabase-js';
          import { syncVerifiedCompanionBackImages } from './src/lib/companion-back-image-sync.ts';
          import { getActiveStoreId } from './src/lib/stores.ts';

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !key) throw new Error('Production Supabase server credentials are unavailable.');
          const supabase = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const result = await syncVerifiedCompanionBackImages({
            supabase,
            storeId: getActiveStoreId(),
          });
          if (result.errors.length) {
            throw new Error(`Verified companion back-image backfill had ${result.errors.length} database or network errors: ${JSON.stringify(result.errors.slice(0, 10))}`);
          }
          if (result.remainingCandidates !== 0) {
            throw new Error(`Verified companion back-image backfill left ${result.remainingCandidates} unprocessed candidates.`);
          }
          const receipt = {
            ...result,
            completedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'verified-back-backfill', 'backfill.json'),
            JSON.stringify(receipt, null, 2),
          );
          console.log(JSON.stringify({ verifiedBackImageBackfill: receipt }, null, 2));
          NODE

      - name: Verify Production image records after backfill
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/verified-back-backfill/service-role-key")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
            node --env-file="$RUNNER_TEMP/verified-back-backfill/production.env" --import tsx --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createClient } from '@supabase/supabase-js';
          import { getActiveStoreId } from './src/lib/stores.ts';
          import { listingImageSide } from './src/lib/listing-image-utils.ts';

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { autoRefreshToken: false, persistSession: false } },
          );
          const storeId = getActiveStoreId();
          const sampleIds = [2135, 2080, 2122, 2052, 2411];
          const samples = [];
          for (const productId of sampleIds) {
            const { data: item, error: itemError } = await supabase
              .from('inventory_items')
              .select('id,legacy_product_id,title')
              .eq('store_id', storeId)
              .eq('legacy_product_id', productId)
              .order('updated_at', { ascending: false })
              .limit(1)
              .single();
            if (itemError) throw itemError;
            const { data: rows, error: rowError } = await supabase
              .from('inventory_images')
              .select('image_url,sort_order,alt_text,is_primary')
              .eq('inventory_item_id', item.id)
              .order('sort_order', { ascending: true });
            if (rowError) throw rowError;
            samples.push({
              productId,
              title: item.title,
              rows: (rows || []).map((row) => ({
                ...row,
                detectedSide: listingImageSide(row.image_url),
              })),
            });
          }

          for (const requiredId of [2135, 2080, 2122]) {
            const sample = samples.find((entry) => entry.productId === requiredId);
            if (!sample?.rows.some((row) => row.detectedSide === 'back')) {
              throw new Error(`Expected verified back URL is still missing for product ${requiredId}.`);
            }
          }
          for (const unavailableId of [2052, 2411]) {
            const sample = samples.find((entry) => entry.productId === unavailableId);
            if (sample?.rows.some((row) => row.detectedSide === 'back')) {
              throw new Error(`Product ${unavailableId} unexpectedly received an unverified back URL.`);
            }
          }

          const { data: explicitRows, error: explicitError } = await supabase
            .from('inventory_images')
            .select('inventory_item_id,image_url,alt_text')
            .ilike('image_url', '%back%')
            .limit(5000);
          if (explicitError) throw explicitError;
          const explicitBackRows = (explicitRows || []).filter(
            (row) => listingImageSide(row.image_url) === 'back',
          );
          const receipt = {
            explicitBackImageRows: explicitBackRows.length,
            explicitBackInventoryItems: new Set(
              explicitBackRows.map((row) => String(row.inventory_item_id)),
            ).size,
            samples,
            checkedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'verified-back-backfill', 'records.json'),
            JSON.stringify(receipt, null, 2),
          );
          console.log(JSON.stringify({ verifiedBackImageRecords: receipt }, null, 2));
          NODE

      - name: Deploy exact merged application to Production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify live Recently Sold and honest back-photo behavior
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            shop_file="$RUNNER_TEMP/verified-back-backfill/shop.html"
            sold_file="$RUNNER_TEMP/verified-back-backfill/sold.html"
            verified_file="$RUNNER_TEMP/verified-back-backfill/verified.html"
            unavailable_file="$RUNNER_TEMP/verified-back-backfill/unavailable.html"

            shop_status="$(curl -sS -L --max-time 60 -o "$shop_file" -w '%{http_code}' "https://truelycollectables.com/shop?back_verify=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            sold_status="$(curl -sS -L --max-time 60 -o "$sold_file" -w '%{http_code}' "https://truelycollectables.com/recently-sold?back_verify=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            verified_status="$(curl -sS -L --max-time 60 -o "$verified_file" -w '%{http_code}' "https://truelycollectables.com/product/2135?back_verify=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            unavailable_status="$(curl -sS -L --max-time 60 -o "$unavailable_file" -w '%{http_code}' "https://truelycollectables.com/product/2052?back_verify=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"

            shop_ok=false
            sold_ok=false
            verified_ok=false
            unavailable_ok=false
            if [ "$shop_status" = "200" ] \
              && grep -Fq '/recently-sold' "$shop_file" \
              && ! grep -Fq 'Error loading products' "$shop_file"; then shop_ok=true; fi
            if [ "$sold_status" = "200" ] \
              && grep -Fq 'Recently Sold' "$sold_file" \
              && grep -Fq 'See What You Missed' "$sold_file"; then sold_ok=true; fi
            if [ "$verified_status" = "200" ] \
              && grep -Fq 'Front photo' "$verified_file" \
              && grep -Fq 'Back photo' "$verified_file" \
              && grep -Fq '58499921-back.jpg' "$verified_file"; then verified_ok=true; fi
            if [ "$unavailable_status" = "200" ] \
              && grep -Fq 'Back photo unavailable' "$unavailable_file" \
              && ! grep -Fq '29970330-front.jpg' "$unavailable_file"; then unavailable_ok=true; fi

            echo "attempt=${attempt} shop=${shop_status}/${shop_ok} sold=${sold_status}/${sold_ok} verified_back=${verified_status}/${verified_ok} unavailable=${unavailable_status}/${unavailable_ok}"
            if [ "$shop_ok" = true ] \
              && [ "$sold_ok" = true ] \
              && [ "$verified_ok" = true ] \
              && [ "$unavailable_ok" = true ]; then
              echo "Live Recently Sold and verified back-photo behavior passed."
              echo "BACKFILL_RECEIPT"
              cat "$RUNNER_TEMP/verified-back-backfill/backfill.json"
              echo "RECORD_RECEIPT"
              cat "$RUNNER_TEMP/verified-back-backfill/records.json"
              exit 0
            fi
            sleep 10
          done
          echo "Live Recently Sold or verified back-photo behavior failed." >&2
          exit 1

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/verified-back-backfill"
