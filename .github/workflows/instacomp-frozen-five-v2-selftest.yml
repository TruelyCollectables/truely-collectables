name: InstaComp Frozen Five v2 macOS self-test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-frozen-five-v2-selftest.yml"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py"
      - "services/instacomp-ai/app/authoritative_registry_gateway.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-five-v2-selftest:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile exact promotion scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py \
            services/instacomp-ai/app/authoritative_registry_gateway.py

      - name: Run exact Frozen Five v2 self-test
        run: |
          set -euo pipefail
          python services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py --self-test
