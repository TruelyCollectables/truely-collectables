name: InstaComp Frozen Five v2 macOS self-test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-frozen-five-v2-selftest.yml"
      - "services/instacomp-ai/scripts/run_frozen_five_promotion.sh"
      - "services/instacomp-ai/scripts/run-local.sh"
      - "services/instacomp-ai/scripts/ensure-runtime-dependencies.sh"
      - "services/instacomp-ai/scripts/enable-lora-candidate-macos.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py"
      - "services/instacomp-ai/scripts/diagnose_lora_frozen_five_all.py"
      - "services/instacomp-ai/app/authoritative_registry_gateway.py"
      - "services/instacomp-ai/app/config.py"
      - "services/instacomp-ai/app/local_vision.py"
      - "services/instacomp-ai/app/pattern_memory.py"
      - "services/instacomp-ai/app/training.py"
      - "services/instacomp-ai/app/__init__.py"
      - "services/instacomp-ai/tests/test_opencv_pattern_native.py"
      - "services/instacomp-ai/tests/test_local_learning_stack.py"
      - "services/instacomp-ai/requirements.txt"
      - "src/lib/instacomp-registry-lock-request.ts"
      - "scripts/run-instacomp-registry-lock-request-regression.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-frozen-five-v2-selftest.yml"
      - "services/instacomp-ai/scripts/run_frozen_five_promotion.sh"
      - "services/instacomp-ai/scripts/run-local.sh"
      - "services/instacomp-ai/scripts/ensure-runtime-dependencies.sh"
      - "services/instacomp-ai/scripts/enable-lora-candidate-macos.sh"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py"
      - "services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py"
      - "services/instacomp-ai/scripts/diagnose_lora_frozen_five_all.py"
      - "services/instacomp-ai/app/authoritative_registry_gateway.py"
      - "services/instacomp-ai/app/config.py"
      - "services/instacomp-ai/app/local_vision.py"
      - "services/instacomp-ai/app/pattern_memory.py"
      - "services/instacomp-ai/app/training.py"
      - "services/instacomp-ai/app/__init__.py"
      - "services/instacomp-ai/tests/test_opencv_pattern_native.py"
      - "services/instacomp-ai/tests/test_local_learning_stack.py"
      - "services/instacomp-ai/requirements.txt"
      - "src/lib/instacomp-registry-lock-request.ts"
      - "scripts/run-instacomp-registry-lock-request-regression.ts"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  frozen-five-v2-selftest:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prove runtime synchronizer repairs stale native dependencies
        run: |
          set -euo pipefail
          python -m venv services/instacomp-ai/.venv
          bash services/instacomp-ai/scripts/ensure-runtime-dependencies.sh \
            services/instacomp-ai/.venv/bin/python \
            | tee /tmp/instacomp-runtime-sync-first.log
          grep -q 'PASS InstaComp runtime dependencies synchronized' /tmp/instacomp-runtime-sync-first.log
          services/instacomp-ai/.venv/bin/python - <<'PY'
          import cv2, numpy
          assert cv2.__version__ == "4.12.0", cv2.__version__
          assert numpy.__version__ == "2.2.6", numpy.__version__
          print("PASS exact native runtime pins installed")
          PY

          services/instacomp-ai/.venv/bin/python -m pip install \
            --disable-pip-version-check --no-deps 'numpy==2.3.5' >/dev/null
          services/instacomp-ai/.venv/bin/python - <<'PY'
          import numpy
          assert numpy.__version__ == "2.3.5", numpy.__version__
          print("PASS stale native dependency fixture created")
          PY

          bash services/instacomp-ai/scripts/ensure-runtime-dependencies.sh \
            services/instacomp-ai/.venv/bin/python \
            | tee /tmp/instacomp-runtime-sync-repair.log
          grep -q 'Synchronizing InstaComp runtime dependencies' /tmp/instacomp-runtime-sync-repair.log
          grep -q 'PASS InstaComp runtime dependencies synchronized' /tmp/instacomp-runtime-sync-repair.log
          services/instacomp-ai/.venv/bin/python - <<'PY'
          import cv2, numpy
          assert cv2.__version__ == "4.12.0", cv2.__version__
          assert numpy.__version__ == "2.2.6", numpy.__version__
          print("PASS stale native runtime repaired to exact pins")
          PY

          bash services/instacomp-ai/scripts/ensure-runtime-dependencies.sh \
            services/instacomp-ai/.venv/bin/python \
            | tee /tmp/instacomp-runtime-sync-idempotent.log
          grep -q 'PASS InstaComp runtime dependencies synchronized' /tmp/instacomp-runtime-sync-idempotent.log
          if grep -q 'Synchronizing InstaComp runtime dependencies' /tmp/instacomp-runtime-sync-idempotent.log; then
            echo 'Runtime synchronizer was not idempotent.' >&2
            exit 1
          fi

      - name: Mount immutable Frozen Five physical images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/instacomp-five-card-image-truth-20260807
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8994498762/zip" \
            -o /tmp/instacomp-five-card-image-truth-20260807.zip
          unzip -q /tmp/instacomp-five-card-image-truth-20260807.zip \
            -d /tmp/instacomp-five-card-image-truth-20260807
          test "$(find /tmp/instacomp-five-card-image-truth-20260807 -name '*.jpg' -type f | wc -l | tr -d ' ')" = "10"
          test -f /tmp/instacomp-five-card-image-truth-20260807/receipt.json
          echo "PASS immutable Frozen Five physical image artifact mounted"

      - name: Prove exact synchronized runtime handles all physical images three times
        env:
          INSTACOMP_FROZEN_IMAGE_DIR: /tmp/instacomp-five-card-image-truth-20260807
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            PYTHONPATH=services/instacomp-ai \
              services/instacomp-ai/.venv/bin/python -m pytest -q \
              services/instacomp-ai/tests/test_opencv_pattern_native.py \
              | tee "/tmp/opencv-pattern-native-${run}.log"
          done

      - name: Prove exact Registry truth cannot poison the next training export three times
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            PYTHONPATH=services/instacomp-ai \
              services/instacomp-ai/.venv/bin/python -m pytest -q \
              services/instacomp-ai/tests/test_local_learning_stack.py \
              | tee "/tmp/local-learning-registry-truth-${run}.log"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install TypeScript regression dependencies
        run: npm ci --ignore-scripts

      - name: Prove Rickea Registry request keeps Prizm while dropping unsupported Green three times
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            node --import tsx scripts/run-instacomp-registry-lock-request-regression.ts \
              | tee "/tmp/rickea-registry-lock-request-${run}.log"
            grep -q 'PASS Registry-lock request keeps product family' "/tmp/rickea-registry-lock-request-${run}.log"
          done
          npx tsc --noEmit

      - name: Compile exact promotion and runtime scripts
        run: |
          set -euo pipefail
          services/instacomp-ai/.venv/bin/python -m py_compile \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_five.py \
            services/instacomp-ai/scripts/promote_lora_candidate_frozen_five_v2.py \
            services/instacomp-ai/scripts/diagnose_lora_frozen_five_all.py \
            services/instacomp-ai/app/authoritative_registry_gateway.py \
            services/instacomp-ai/app/local_vision.py \
            services/instacomp-ai/app/training.py
          bash -n services/instacomp-ai/scripts/ensure-runtime-dependencies.sh
          bash -n services/instacomp-ai/scripts/run-local.sh
          bash -n services/instacomp-ai/scripts/run_frozen_five_promotion.sh
          bash -n services/instacomp-ai/scripts/enable-lora-candidate-macos.sh

      - name: Prove full diagnostic never stops at the first failed card three times
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            services/instacomp-ai/.venv/bin/python \
              services/instacomp-ai/scripts/diagnose_lora_frozen_five_all.py --self-test \
              | tee "/tmp/frozen-five-full-diagnostic-selftest-${run}.log"
            grep -q 'PASS full five continues after card failure' "/tmp/frozen-five-full-diagnostic-selftest-${run}.log"
            grep -q 'PASS per-card exceptions do not hide later diagnostics' "/tmp/frozen-five-full-diagnostic-selftest-${run}.log"
            grep -q 'PASS teacher truth is retained in diagnostic records' "/tmp/frozen-five-full-diagnostic-selftest-${run}.log"
          done

      - name: Prove stale exported LoRA flag cannot override updated env file
        run: |
          set -euo pipefail
          cat > services/instacomp-ai/.env <<'ENV'
          INSTACOMP_AI_SENTINEL_ARCHIVE_TOKEN=ci-registry-auth-fixture
          INSTACOMP_AI_LORA_CANDIDATE_ENABLED=true
          INSTACOMP_AI_LORA_CANDIDATE_URL=http://127.0.0.1:8791
          ENV
          chmod 600 services/instacomp-ai/.env
          export INSTACOMP_AI_LORA_CANDIDATE_ENABLED=false
          export INSTACOMP_AI_LORA_CANDIDATE_URL=http://127.0.0.1:9999
          (
            cd services/instacomp-ai
            env \
              -u INSTACOMP_AI_LORA_CANDIDATE_ENABLED \
              -u INSTACOMP_AI_LORA_CANDIDATE_URL \
              .venv/bin/python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          config_path = Path("app/config.py").resolve()
          spec = importlib.util.spec_from_file_location("instacomp_config_regression", config_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          settings = module.settings
          assert settings.lora_candidate_enabled is True, settings.lora_candidate_enabled
          assert settings.lora_candidate_url == "http://127.0.0.1:8791", settings.lora_candidate_url
          print("PASS updated LoRA env file outranks stale launcher values")
          PY
          )
          unset INSTACOMP_AI_LORA_CANDIDATE_ENABLED INSTACOMP_AI_LORA_CANDIDATE_URL

      - name: Prove canonical launcher diagnostic mode three times
        run: |
          set -euo pipefail
          printf '%s\n' 'INSTACOMP_AI_SENTINEL_ARCHIVE_TOKEN=ci-registry-auth-fixture' > services/instacomp-ai/.env
          chmod 600 services/instacomp-ai/.env
          for run in 1 2 3; do
            bash services/instacomp-ai/scripts/run_frozen_five_promotion.sh --diagnostic-all --self-test \
              | tee "/tmp/frozen-five-diagnostic-launcher-${run}.log"
            grep -q 'PASS InstaComp runtime dependencies synchronized' "/tmp/frozen-five-diagnostic-launcher-${run}.log"
            grep -q 'PASS Registry client authentication configured' "/tmp/frozen-five-diagnostic-launcher-${run}.log"
            grep -q 'PASS InstaComp app import path:' "/tmp/frozen-five-diagnostic-launcher-${run}.log"
            grep -q 'PASS Frozen Five launcher mode: diagnostic' "/tmp/frozen-five-diagnostic-launcher-${run}.log"
            grep -q 'PASS full five continues after card failure' "/tmp/frozen-five-diagnostic-launcher-${run}.log"
          done

      - name: Prove canonical launcher loads protected Registry auth and runs v2 self-test
        run: |
          set -euo pipefail
          bash services/instacomp-ai/scripts/run_frozen_five_promotion.sh --self-test \
            | tee /tmp/frozen-five-v2-launcher.log
          grep -q 'PASS InstaComp runtime dependencies synchronized' /tmp/frozen-five-v2-launcher.log
          grep -q 'PASS Registry client authentication configured' /tmp/frozen-five-v2-launcher.log
          grep -q 'PASS InstaComp app import path:' /tmp/frozen-five-v2-launcher.log
          grep -q 'PASS Frozen Five launcher mode: promotion' /tmp/frozen-five-v2-launcher.log
          grep -q 'PASS failed-case candidate and raw Registry diagnostics are retained' /tmp/frozen-five-v2-launcher.log
          rm -f services/instacomp-ai/.env
