name: Apply KINGMAKER Private Pricing Coverage 20260803

on:
  pull_request:
    paths:
      - ".github/workflows/apply-kingmaker-private-pricing-coverage-20260803.yml"

permissions:
  contents: read

jobs:
  apply-and-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production

    env:
      EXPECTED_MAIN_SHA: 80189711431dc900c3c2e5dfd692b27224b6bc2a
      EXPECTED_BRANCH: ops/apply-kingmaker-private-pricing-coverage-20260803
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RECEIPT_PATH: evidence/kingmaker-private-pricing-coverage-production-20260803/receipt.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/apply-kingmaker-private-pricing-coverage-20260803
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/apply-kingmaker-private-pricing-coverage-20260803.yml'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          git checkout --detach "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/kingmaker-private-pricing-coverage"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/kingmaker-private-pricing-coverage/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/kingmaker-private-pricing-coverage/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/kingmaker-private-pricing-coverage/production.env" >> "$GITHUB_ENV"

      - name: Apply aggregate coverage report and capture Production receipt
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { mkdirSync, readFileSync, writeFileSync } = require("node:fs");
          const { dirname, resolve } = require("node:path");

          const migrationPath = "supabase/migrations/20260804034500_kingmaker_private_pricing_coverage.sql";
          const receiptPath = resolve(process.env.RECEIPT_PATH);
          const token = process.env.GH_SUPABASE_ACCESS_TOKEN;
          const envFile = process.env.PRODUCTION_ENV_FILE;

          function parseEnv(contents) {
            const parsed = {};
            for (const raw of String(contents || "").split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith("#")) continue;
              const index = line.indexOf("=");
              if (index < 1) continue;
              const key = line.slice(0, index).trim().replace(/^export\s+/, "");
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }

          function projectRef(url) {
            const match = String(url || "").match(/^https:\/\/([a-z0-9]+)\.supabase\.co\/?$/i);
            if (!match) throw new Error("Production database URL was not resolved.");
            return match[1];
          }

          async function queryManagement(project, query, readOnly, stage) {
            const response = await fetch(`https://api.supabase.com/v1/projects/${project}/database/query`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
              signal: AbortSignal.timeout(119000),
            });
            const text = await response.text();
            if (!response.ok) {
              throw new Error(`Production ${stage} failed with HTTP ${response.status}: ${text.slice(0, 800)}`);
            }
            return text ? JSON.parse(text) : [];
          }

          async function callServiceRpc(productionUrl, serviceKey) {
            const response = await fetch(
              `${productionUrl.replace(/\/$/, "")}/rest/v1/rpc/tcos_kingmaker_private_pricing_coverage_report`,
              {
                method: "POST",
                headers: {
                  apikey: serviceKey,
                  Authorization: `Bearer ${serviceKey}`,
                  "Content-Type": "application/json",
                  Accept: "application/json",
                },
                body: JSON.stringify({
                  p_limit: 100,
                  p_offset: 0,
                  p_gap_type: null,
                  p_sport: null,
                  p_search: null,
                }),
                signal: AbortSignal.timeout(119000),
              },
            );
            const text = await response.text();
            if (!response.ok) {
              throw new Error(
                `Production service-role coverage RPC failed with HTTP ${response.status}: ${text.slice(0, 800)}`,
              );
            }
            return text ? JSON.parse(text) : {};
          }

          function firstRow(result) {
            return Array.isArray(result) ? result[0] || {} : result || {};
          }

          function jsonObject(value, label) {
            if (value && typeof value === "object" && !Array.isArray(value)) return value;
            if (typeof value === "string") {
              const parsed = JSON.parse(value);
              if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
            }
            if (Array.isArray(value) && value.length === 1) {
              return jsonObject(value[0], label);
            }
            throw new Error(`${label} did not return an object.`);
          }

          function number(row, field) {
            const value = Number(row?.[field] ?? 0);
            if (!Number.isFinite(value)) throw new Error(`Invalid numeric field ${field}.`);
            return value;
          }

          function statsSql() {
            return `
              select
                count(*)::bigint as total_rows,
                count(*) filter (where identity_match_status = 'exact')::bigint as exact_rows,
                count(*) filter (where identity_match_status = 'ambiguous')::bigint as ambiguous_rows,
                count(*) filter (where identity_match_status = 'unmatched')::bigint as unmatched_rows,
                count(*) filter (where identity_match_status = 'not_applicable')::bigint as not_applicable_rows,
                count(*) filter (
                  where low_observation_id is not null or high_observation_id is not null
                )::bigint as linked_observation_rows
              from public.tcos_kingmaker_price_entries;
            `;
          }

          function verificationSql() {
            return `
              select
                to_regprocedure(
                  'public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)'
                ) is not null as report_rpc_present,
                to_regclass(
                  'public.tcos_kingmaker_price_entries_private_coverage_idx'
                ) is not null as coverage_index_present,
                not has_function_privilege(
                  'anon',
                  'public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)',
                  'execute'
                ) as anon_execute_revoked,
                not has_function_privilege(
                  'authenticated',
                  'public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)',
                  'execute'
                ) as authenticated_execute_revoked,
                has_function_privilege(
                  'service_role',
                  'public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)',
                  'execute'
                ) as service_execute_granted;
            `;
          }

          function assertNoPrivateFields(value) {
            const serialized = JSON.stringify(value).toLowerCase();
            for (const forbidden of [
              "raw_text",
              "original_filename",
              "source_sha256",
              "value_low",
              "value_high",
              "storage_object_path",
            ]) {
              if (serialized.includes(forbidden)) {
                throw new Error(`Coverage receipt contains prohibited field ${forbidden}.`);
              }
            }
          }

          async function main() {
            if (!token || !envFile) throw new Error("Protected Production credentials are required.");
            console.log(`::add-mask::${token}`);
            const productionEnv = parseEnv(readFileSync(envFile, "utf8"));
            const productionUrl =
              productionEnv.NEXT_PUBLIC_SUPABASE_URL || productionEnv.SUPABASE_URL;
            const serviceKey = productionEnv.SUPABASE_SERVICE_ROLE_KEY;
            if (!productionUrl || !serviceKey) {
              throw new Error("Production service-role RPC credentials were not resolved.");
            }
            console.log(`::add-mask::${serviceKey}`);
            const project = projectRef(productionUrl);
            const migrationSql = readFileSync(migrationPath, "utf8");

            const before = firstRow(await queryManagement(project, statsSql(), true, "pre-apply statistics"));
            await queryManagement(project, migrationSql, false, "coverage migration");

            const verification = firstRow(
              await queryManagement(project, verificationSql(), true, "coverage verification"),
            );
            for (const [field, value] of Object.entries(verification)) {
              if (value !== true) throw new Error(`Production verification failed: ${field}.`);
            }

            const report = jsonObject(
              await callServiceRpc(productionUrl, serviceKey),
              "Coverage report",
            );
            if (report.boundary !== "aggregate_private_reference_only") {
              throw new Error("Coverage report boundary verification failed.");
            }
            assertNoPrivateFields(report);

            const after = firstRow(await queryManagement(project, statsSql(), true, "post-apply statistics"));
            for (const field of [
              "total_rows",
              "exact_rows",
              "ambiguous_rows",
              "unmatched_rows",
              "not_applicable_rows",
              "linked_observation_rows",
            ]) {
              if (number(after, field) !== number(before, field)) {
                throw new Error(`Coverage reporting changed Production field ${field}.`);
              }
            }

            const receipt = {
              schema: "tcos.kingmaker.privatePricingCoverageProductionReceipt.v1",
              status: "passed",
              generatedAt: new Date().toISOString(),
              migration: {
                path: migrationPath,
                sha256: createHash("sha256").update(migrationSql).digest("hex"),
              },
              before: {
                totalRows: number(before, "total_rows"),
                exact: number(before, "exact_rows"),
                ambiguous: number(before, "ambiguous_rows"),
                unmatched: number(before, "unmatched_rows"),
                notApplicable: number(before, "not_applicable_rows"),
                linkedObservationRows: number(before, "linked_observation_rows"),
              },
              after: {
                totalRows: number(after, "total_rows"),
                exact: number(after, "exact_rows"),
                ambiguous: number(after, "ambiguous_rows"),
                unmatched: number(after, "unmatched_rows"),
                notApplicable: number(after, "not_applicable_rows"),
                linkedObservationRows: number(after, "linked_observation_rows"),
              },
              coverage: {
                boundary: report.boundary,
                generatedAt: report.generatedAt,
                summary: report.summary,
                pagination: report.pagination,
                topRows: report.rows,
              },
              verification,
              serviceRoleRpcVerified: true,
              pricesPromotedByThisOperation: 0,
              recordsMutatedByReport: 0,
              secretsPersisted: false,
            };
            assertNoPrivateFields(receipt);
            mkdirSync(dirname(receiptPath), { recursive: true });
            writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(
              `Private pricing coverage passed: ${report.summary?.unresolvedRows || 0} unresolved rows across ${report.summary?.totalGroups || 0} ranked groups.`,
            );
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Require sanitized Production receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT_PATH"
          node -e 'const r=require("./"+process.env.RECEIPT_PATH); if(r.status!=="passed"||r.serviceRoleRpcVerified!==true||r.pricesPromotedByThisOperation!==0||r.recordsMutatedByReport!==0||r.secretsPersisted!==false) process.exit(1);'

      - name: Upload sanitized Production receipt
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-private-pricing-coverage-production-20260803
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30
