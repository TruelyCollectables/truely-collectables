name: Apply KINGMAKER Private Pricing Coverage 20260803

on:
  pull_request:
    paths:
      - ".github/workflows/apply-kingmaker-private-pricing-coverage-20260803.yml"
      - ".github/scripts/apply-kingmaker-private-pricing-coverage-20260803.mjs"

permissions:
  contents: read

jobs:
  apply-and-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production

    env:
      EXPECTED_MAIN_SHA: 80189711431dc900c3c2e5dfd692b27224b6bc2a
      EXPECTED_BRANCH: ops/apply-kingmaker-private-pricing-coverage-20260803
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RECEIPT_PATH: evidence/kingmaker-private-pricing-coverage-production-20260803/receipt.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/apply-kingmaker-private-pricing-coverage-20260803
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/apply-kingmaker-private-pricing-coverage-20260803.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/scripts/apply-kingmaker-private-pricing-coverage-20260803.mjs'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          cp .github/scripts/apply-kingmaker-private-pricing-coverage-20260803.mjs "$RUNNER_TEMP/apply-private-pricing-coverage.mjs"
          git checkout --detach "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/kingmaker-private-pricing-coverage"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/kingmaker-private-pricing-coverage/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/kingmaker-private-pricing-coverage/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/kingmaker-private-pricing-coverage/production.env" >> "$GITHUB_ENV"

      - name: Apply report, provision runtime secret, and deploy Production
        shell: bash
        run: node "$RUNNER_TEMP/apply-private-pricing-coverage.mjs"

      - name: Require sanitized Production receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT_PATH"
          node - <<'NODE'
          const receipt = require(`./${process.env.RECEIPT_PATH}`);
          const validProvisioning = ["existing", "added", "updated"].includes(
            receipt.vercelProductionServiceKeyProvisioning,
          );
          if (
            receipt.status !== "passed" ||
            receipt.serviceRoleRpcVerified !== true ||
            !validProvisioning ||
            receipt.productionDeploymentCompleted !== true ||
            receipt.pricesPromotedByThisOperation !== 0 ||
            receipt.recordsMutatedByReport !== 0 ||
            receipt.secretsPersistedInReceipt !== false
          ) {
            process.exit(1);
          }
          NODE

      - name: Upload sanitized Production receipt
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-private-pricing-coverage-production-20260803
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30
