name: Deploy Shipping Audit Contract 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-shipping-audit-contract-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-shipping-audit-contract-20260729
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      DEPLOY_SOURCE_SHA: 6d3a6ac37362bda8778f2d2ad7ed57cb364e46cb
    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: 6d3a6ac37362bda8778f2d2ad7ed57cb364e46cb
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Deploy exact merged revision to Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Production storefront and protected admin boundary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          for url in "$DEPLOYMENT_URL" "https://truelycollectables.com"; do
            root_code="$(curl --location --silent --show-error --output /tmp/root.html --write-out '%{http_code}' "$url/")"
            shop_code="$(curl --location --silent --show-error --output /tmp/shop.html --write-out '%{http_code}' "$url/shop")"
            admin_code="$(curl --silent --show-error --output /tmp/admin.html --write-out '%{http_code}' "$url/admin")"
            login_code="$(curl --location --silent --show-error --output /tmp/login.html --write-out '%{http_code}' "$url/admin/login")"
            test "$root_code" = "200"
            test "$shop_code" = "200"
            test "$admin_code" = "307"
            test "$login_code" = "200"
            grep -Fq "Admin Login" /tmp/login.html
          done
          echo "Verified exact shipping remediation deployment and admin boundary."
