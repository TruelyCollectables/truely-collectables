name: InstaComp Mac Registry Recovery Verify

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-registry-recovery-verify.yml"
      - "services/instacomp-ai/app/checklist.py"
      - "services/instacomp-ai/app/config.py"
      - "services/instacomp-ai/app/authoritative_registry_gateway.py"
      - "services/instacomp-ai/scripts/install-sentinel-control.sh"
      - "src/lib/instacomp-mac-registry-client.ts"
      - "src/app/api/instacomp/registry-holdout-lock*/route.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mac-registry-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install InstaComp Python runtime
        run: python -m pip install --disable-pip-version-check -r services/instacomp-ai/requirements.txt
      - name: Prove Registry URLs fail closed to loopback only
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/instacomp-ai python - <<'PY'
          import os
          from app.checklist import _registry_base_url, _registry_headers
          from app.config import settings
          settings.registry_url = ""
          settings.api_key = "configured-local-key"
          for key in ("INSTACOMP_AI_REGISTRY_URL", "INSTACOMP_AI_API_KEY"):
              os.environ.pop(key, None)
          assert _registry_base_url() is None
          for remote in ("https://truelycollectables.com", "https://registry.example.test"):
              os.environ["INSTACOMP_AI_REGISTRY_URL"] = remote
              assert _registry_base_url() is None
          os.environ["INSTACOMP_AI_REGISTRY_URL"] = "http://127.0.0.1:8787/"
          assert _registry_base_url() == "http://127.0.0.1:8787"
          headers = _registry_headers()
          assert headers["x-instacomp-ai-key"] == "configured-local-key"
          assert "authorization" not in headers
          print("PASS Mac Registry is loopback-only and authenticated")
          PY
      - name: Prove installer cannot resurrect cloud Registry authority
        run: |
          set -euo pipefail
          grep -F 'set_local_env INSTACOMP_AI_REGISTRY_URL "http://127.0.0.1:8787"' services/instacomp-ai/scripts/install-sentinel-control.sh
          ! grep -F 'set_local_env INSTACOMP_AI_REGISTRY_URL "$site_url"' services/instacomp-ai/scripts/install-sentinel-control.sh
      - name: Prove holdout compatibility routes are Mac proxies only
        run: |
          set -euo pipefail
          for route in src/app/api/instacomp/registry-holdout-lock*/route.ts; do
            grep -q 'postInstaCompMacRegistry' "$route"
            ! grep -Eq '@supabase|createClient|checklist_cards|checklist_versions|checklist_card_identities' "$route"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit --pretty false
