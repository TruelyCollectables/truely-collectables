name: CollX Storefront Sellability Audit 20260812

on:
  push:
    paths:
      - '.github/workflows/collx-sellability-audit-20260812.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: 00000000-0000-4000-8000-000000000001
    steps:
      - name: Classify current non-eBay CollX inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time
          API='https://api.supabase.com/v1'
          TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']
          STORE=os.environ['FLAGSHIP_STORE_ID']

          def req(method,path,body=None,timeout=90,retries=6):
              last=None
              for attempt in range(retries):
                  out=tempfile.NamedTemporaryFile(delete=False); out.close()
                  cmd=['curl','-sS','--max-time',str(timeout),'-X',method,
                       '-H',f'Authorization: Bearer {TOKEN}',
                       '-H','Accept: application/json',
                       '-H','Content-Type: application/json',
                       '-o',out.name,'-w','%{http_code}',API+path]
                  if body is not None: cmd += ['--data-binary',json.dumps(body)]
                  p=subprocess.run(cmd,capture_output=True,text=True)
                  raw=open(out.name).read(); os.unlink(out.name)
                  try: payload=json.loads(raw) if raw else None
                  except Exception: payload=raw
                  try: status=int((p.stdout or '0').strip()[-3:])
                  except Exception: status=0
                  if status in (200,201): return payload
                  last=(status,payload)
                  if status in (0,429,500,502,503,504,522,524,544) and attempt+1 < retries:
                      time.sleep(2*(attempt+1)); continue
                  break
              raise RuntimeError(f'{method} {path} HTTP {last[0] if last else 0}: {str(last[1] if last else "")[:2000]}')

          projects=req('GET','/projects',timeout=30)
          cand=[p for p in projects if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(cand)!=1: raise SystemExit(f'Expected one Truely project, got {len(cand)}')
          ref=str(cand[0].get('id') or cand[0].get('ref') or '')

          q=f"""
          select
            count(*)::int total_rows,
            coalesce(sum(greatest(quantity,0)),0)::int total_units,
            count(*) filter (where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is not null)::int live_rows,
            coalesce(sum(quantity) filter (where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is not null),0)::int live_units,
            count(*) filter (where archived_at is not null)::int archived_rows,
            coalesce(sum(greatest(quantity,0)) filter (where archived_at is not null),0)::int archived_units,
            count(*) filter (where archived_at is null and quantity<=0)::int zero_qty_rows,
            count(*) filter (where archived_at is null and quantity>0 and price<=0)::int bad_price_rows,
            coalesce(sum(quantity) filter (where archived_at is null and quantity>0 and price<=0),0)::int bad_price_units,
            count(*) filter (where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is null)::int missing_front_rows,
            coalesce(sum(quantity) filter (where archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is null),0)::int missing_front_units
          from public.products
          where store_id='{STORE}'::uuid
            and sku>='COLLX-' and sku<'COLLY'
            and ebay_item_id is null;
          """
          result=req('POST',f'/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':True},90)
          print('COLLX_NON_EBAY_CLASSIFICATION='+json.dumps(result,sort_keys=True,default=str))
          print('COLLX_CLASSIFY=SUCCESS')
          PY
