name: InstaComp LoRA Launcher Mac

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-lora-launcher-macos.yml"
      - "services/instacomp-ai/scripts/run_lora_training.py"
      - "services/instacomp-ai/scripts/run_lora_training_checkpoint_safe.py"
      - "services/instacomp-ai/scripts/run-lora-training-safe.sh"
      - "services/instacomp-ai/scripts/mlx_vlm_lora_safe_resume.py"
      - "services/instacomp-ai/scripts/validate_lora_candidate.py"
      - "services/instacomp-ai/scripts/lora-resume-freeze-patch/sitecustomize.py"
      - "services/instacomp-ai/tests/test_lora_launcher_path.py"
      - "services/instacomp-ai/tests/test_lora_checkpoint_safe.py"
      - "services/instacomp-ai/tests/test_lora_candidate_validation.py"
      - "services/instacomp-ai/requirements-training.txt"
      - "services/instacomp-ai/requirements-lora-runtime.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-lora-launcher-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac-preflight:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/instacomp-ai/requirements.txt
            services/instacomp-ai/requirements-training.txt
            services/instacomp-ai/requirements-lora-runtime.txt

      - name: Install InstaComp service-side training bridge
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r services/instacomp-ai/requirements-training.txt

      - name: Compile launcher and service package
        run: |
          set -euo pipefail
          python -m compileall -q \
            services/instacomp-ai/app \
            services/instacomp-ai/scripts/run_lora_training.py \
            services/instacomp-ai/scripts/run_lora_training_checkpoint_safe.py \
            services/instacomp-ai/scripts/mlx_vlm_lora_safe_resume.py \
            services/instacomp-ai/scripts/validate_lora_candidate.py \
            services/instacomp-ai/scripts/lora-resume-freeze-patch/sitecustomize.py

      - name: Prove launcher and validation contracts
        run: |
          set -euo pipefail
          PYTHONPATH=services/instacomp-ai python -m pytest -q \
            services/instacomp-ai/tests/test_lora_launcher_path.py \
            services/instacomp-ai/tests/test_lora_checkpoint_safe.py \
            services/instacomp-ai/tests/test_lora_candidate_validation.py

      - name: Bootstrap and preflight isolated MLX LoRA runtime on macOS
        working-directory: services/instacomp-ai
        run: |
          set -euo pipefail
          python scripts/run_lora_training.py --preflight-only

      - name: Verify isolated fixed MLX-VLM multi-image release
        run: |
          set -euo pipefail
          services/instacomp-ai/.venv-lora/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("mlx-vlm") == "0.6.8", version("mlx-vlm")
          print("PASS isolated mlx-vlm 0.6.8 multi-image SFT fix is installed")
          PY

      - name: Verify safe resume launcher activates base-freeze patch
        run: |
          set -euo pipefail
          PYTHON=python bash services/instacomp-ai/scripts/run-lora-training-safe.sh --preflight-only
          grep -q 'trainer_utils.freeze_model(model)' services/instacomp-ai/scripts/lora-resume-freeze-patch/sitecustomize.py
          echo "PASS safe resume freezes base before applying adapter weights"

      - name: Smoke test resumed adapter has LoRA-only trainable tensors
        env:
          INSTACOMP_MLX_SAFE_RESUME: "1"
          PYTHONPATH: services/instacomp-ai/scripts/lora-resume-freeze-patch
        run: |
          set -euo pipefail
          services/instacomp-ai/.venv-lora/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          import mlx.nn as nn
          from mlx.utils import tree_flatten
          from mlx_vlm.trainer import utils

          class Config:
              pass

          class TinyLanguage(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.q_proj = nn.Linear(8, 8)
                  self.k_proj = nn.Linear(8, 8)

          class TinyModel(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.language_model = TinyLanguage()
                  self.config = Config()

          with tempfile.TemporaryDirectory() as tmp:
              bundle = Path(tmp) / "adapter"
              bundle.mkdir()

              fresh = TinyModel()
              modules = utils.find_all_linear_names(fresh.language_model)
              fresh = utils.get_peft_model(
                  fresh,
                  modules,
                  rank=2,
                  alpha=4,
                  dropout=0.0,
                  verbose=False,
              )
              utils.save_adapter(fresh, bundle / "adapters.safetensors")

              resumed = TinyModel()
              resumed = utils.apply_lora_layers(resumed, bundle)
              names = [name for name, _ in tree_flatten(resumed.trainable_parameters())]
              assert names, "resume produced no trainable tensors"
              assert all(name.endswith(("lora_a", "lora_b")) for name in names), names
              print("PASS resumed adapter exposes LoRA tensors only:", names)
          PY
