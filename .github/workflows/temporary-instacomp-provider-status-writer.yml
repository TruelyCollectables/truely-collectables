name: Temporary InstaComp Provider Status Writer

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/temporary-instacomp-provider-status-writer.yml"
      - "scripts/apply-instacomp-provider-status-fix.py"
      - "scripts/run-instacomp-exact-provider-regressions.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-provider-status-writer
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply provider-status fix
        run: python scripts/apply-instacomp-provider-status-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused regressions
        run: |
          node --import tsx scripts/run-instacomp-exact-provider-regressions.ts
          node --import tsx scripts/run-instacomp-live-pipeline-regressions.ts
          node --import tsx scripts/run-instacomp-provider-safety-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts

      - name: Lint provider paths
        run: npx eslint src/lib/instacomp-exact-market-provider.ts scripts/run-instacomp-exact-provider-regressions.ts

      - name: Build production application
        run: npm run build

      - name: Commit provider-status fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-exact-market-provider.ts
          if git diff --cached --quiet; then
            echo "Provider status source already current."
            exit 0
          fi
          git commit -m "Handle empty SerpApi exact searches without provider errors"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
