name: Patch InstaComp OCR Registry Primary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-local-engine-primary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          pip install -r services/instacomp-ai/requirements.txt
          npm ci
      - name: Wire bounded OCR through internal Registry before Ollama
        run: |
          python - <<'PY'
          from pathlib import Path

          # Export the pure OCR enrichment helper for permanent regressions.
          server_path = Path('src/lib/instacomp-checklist-first-server.ts')
          server = server_path.read_text()
          server = server.replace(
              'function enrichInputFromOcr(\n',
              'export function enrichInstaCompChecklistInputFromOcr(\n',
              1,
          )
          server = server.replace(
              'const enriched = enrichInputFromOcr(input, candidates);',
              'const enriched = enrichInstaCompChecklistInputFromOcr(input, candidates);',
              1,
          )
          if 'export function enrichInstaCompChecklistInputFromOcr' not in server:
              raise SystemExit('OCR enrichment export patch failed')
          server_path.write_text(server)

          # Send the bounded OCR receipt with the same front/back card request.
          client_path = Path('src/lib/instacomp-ai-local.ts')
          client = client_path.read_text()
          old_signature = '''export async function analyzeWithInstaCompAiLocal(params: {
            front: Blob;
            back?: Blob | null;
            timeoutMs?: number;
          }): Promise<InstaCompAiLocalScan> {'''
          new_signature = '''export async function analyzeWithInstaCompAiLocal(params: {
            front: Blob;
            back?: Blob | null;
            printedEvidence?: {
              provider?: string;
              text?: string;
              serialNumber?: string | null;
              checkedImages?: number;
              conflicts?: string[];
            } | null;
            timeoutMs?: number;
          }): Promise<InstaCompAiLocalScan> {'''
          if old_signature not in client:
              raise SystemExit('local client signature anchor missing')
          client = client.replace(old_signature, new_signature, 1)
          old_body = '''  body.append("front", params.front, "front.jpg");
            if (params.back) body.append("back", params.back, "back.jpg");
            const response = await fetch'''
          new_body = '''  body.append("front", params.front, "front.jpg");
            if (params.back) body.append("back", params.back, "back.jpg");
            if (params.printedEvidence?.text) {
              body.append(
                "printed_evidence_json",
                JSON.stringify({
                  provider: text(params.printedEvidence.provider)?.slice(0, 120) || null,
                  text: String(params.printedEvidence.text).slice(0, 12_000),
                  serialNumber:
                    text(params.printedEvidence.serialNumber)?.slice(0, 80) || null,
                  checkedImages: Math.max(
                    0,
                    Math.min(Number(params.printedEvidence.checkedImages) || 0, 64),
                  ),
                  conflicts: Array.isArray(params.printedEvidence.conflicts)
                    ? params.printedEvidence.conflicts
                        .map((value) => text(value)?.slice(0, 160))
                        .filter(Boolean)
                        .slice(0, 20)
                    : [],
                }),
              );
            }
            const response = await fetch'''
          if old_body not in client:
              raise SystemExit('local client body anchor missing')
          client_path.write_text(client.replace(old_body, new_body, 1))

          # The website already completed bounded OCR. Forward it to InstaComp.
          route_path = Path('src/app/api/instacomp/scan/route.ts')
          route = route_path.read_text()
          old_route = '''              front: params.frontImage,
                        back: params.backImage || null,
                        timeoutMs: 150_000,'''
          new_route = '''              front: params.frontImage,
                        back: params.backImage || null,
                        printedEvidence: params.externalOcr,
                        timeoutMs: 150_000,'''
          if old_route not in route:
              raise SystemExit('website local-call anchor missing')
          route_path.write_text(route.replace(old_route, new_route, 1))

          # Internal service: exact image memory -> OCR/Registry -> Ollama backup.
          main_path = Path('services/instacomp-ai/app/main.py')
          main = main_path.read_text()
          main = main.replace(
              'from fastapi import Depends, FastAPI, File, Header, HTTPException, Query, UploadFile',
              'from fastapi import Depends, FastAPI, File, Form, Header, HTTPException, Query, UploadFile',
              1,
          )
          import_anchor = 'from .ollama import OllamaReader\n'
          printed_import = '''from .printed_evidence import (
              identity_from_printed_evidence,
              parse_printed_evidence,
          )
          '''
          if printed_import not in main:
              if import_anchor not in main:
                  raise SystemExit('printed evidence import anchor missing')
              main = main.replace(import_anchor, import_anchor + printed_import, 1)

          old_signature = '''async def analyze_scan(
              front: UploadFile = File(...),
              back: UploadFile | None = File(default=None),
          ) -> AnalyzeResponse:'''
          new_signature = '''async def analyze_scan(
              front: UploadFile = File(...),
              back: UploadFile | None = File(default=None),
              printed_evidence_json: str | None = Form(default=None),
          ) -> AnalyzeResponse:'''
          if old_signature not in main:
              raise SystemExit('FastAPI scan signature anchor missing')
          main = main.replace(old_signature, new_signature, 1)

          hash_anchor = '''    combined_hash = pair_hash(
              front_image.sha256,
              back_image.sha256 if back_image else None,
          )
          '''
          hash_replacement = '''    combined_hash = pair_hash(
              front_image.sha256,
              back_image.sha256 if back_image else None,
          )
              printed_evidence = parse_printed_evidence(printed_evidence_json)
              printed_identity = identity_from_printed_evidence(printed_evidence)
              printed_text = printed_evidence.text if printed_evidence else None
          '''
          if hash_anchor not in main:
              raise SystemExit('combined hash anchor missing')
          main = main.replace(hash_anchor, hash_replacement, 1)

          backup_anchor = '''    # BACKUP READER: Ollama is called only for a card the internal visual memory
              # did not know. Its suggestion is evidence, not trusted identity.
          '''
          registry_block = '''    # PRIMARY ENGINE STEP TWO: bounded printed text and the Checklist
              # Registry. A checklist-known card does not need Ollama or OpenAI.
              printed_registry = (
                  await checklist_gateway.match(printed_identity, printed_text)
                  if printed_identity.card_number
                  else ChecklistResult(
                      outcome=ChecklistOutcome.INPUT_INCOMPLETE,
                      reasons=["Printed evidence did not contain a labeled card number."],
                  )
              )
              if (
                  printed_registry.outcome == ChecklistOutcome.EXACT_MATCH
                  and printed_registry.identity
                  and printed_registry.identity_id
              ):
                  trusted_identity = printed_registry.identity
                  status = "trusted_memory_match"
                  _save_scan(
                      scan_id=scan_id,
                      created_at=created_at,
                      front_image=front_image,
                      back_image=back_image,
                      combined_hash=combined_hash,
                      suggestion=None,
                      checklist_result=printed_registry,
                      status=status,
                  )
                  store.create_lesson(
                      LessonCreate(
                          scan_id=scan_id,
                          state=LearningState.CHECKLIST_CONFIRMED,
                          identity=trusted_identity,
                          verification_source=f"registry:{printed_registry.identity_id}",
                          notes=(
                              "Resolved by bounded printed evidence and the Checklist Registry before Ollama."
                          ),
                      )
                  )
                  return AnalyzeResponse(
                      scan_id=scan_id,
                      created_at=created_at,
                      status=status,
                      front_sha256=front_image.sha256,
                      back_sha256=back_image.sha256 if back_image else None,
                      image_pair_sha256=combined_hash,
                      front_reference_sha256=front_image.reference_sha256,
                      back_reference_sha256=(
                          back_image.reference_sha256 if back_image else None
                      ),
                      front_perceptual_hash=front_image.perceptual_hash,
                      back_perceptual_hash=(
                          back_image.perceptual_hash if back_image else None
                      ),
                      back_evidence=[],
                      memory_matches=[],
                      local_suggestion=None,
                      checklist=printed_registry,
                      trusted_identity=trusted_identity,
                      match_source="checklist_registry",
                      visual_match_score=None,
                      canonical_filename=canonical_filename(trusted_identity),
                      pricing_allowed=True,
                      learning_allowed=True,
                      next_action=(
                          "Checklist identity resolved internally from printed card evidence. Continue to verified comps."
                      ),
                  )

              # BACKUP READER: Ollama is called only when trusted image memory and
              # bounded OCR/Checklist Registry resolution did not identify the card.
          '''
          if backup_anchor not in main:
              raise SystemExit('Ollama backup anchor missing')
          main = main.replace(backup_anchor, registry_block, 1)

          main = main.replace(
              'checklist_result = await checklist_gateway.match(proposed_identity)',
              'checklist_result = await checklist_gateway.match(\n'
              '            proposed_identity,\n'
              '            printed_text,\n'
              '        )',
              1,
          )
          main_path.write_text(main)

          # Permanent focused workflow includes the pure OCR/Registry regression.
          workflow_path = Path('.github/workflows/instacomp-local-primary-contract.yml')
          workflow = workflow_path.read_text()
          test_anchor = '''      - name: Internal architecture contract
                  run: node scripts/check-instacomp-local-primary-contract.mjs
          '''
          test_replacement = '''      - name: Internal architecture contract
                  run: node scripts/check-instacomp-local-primary-contract.mjs
                - name: OCR to Registry primary regressions
                  run: node --import tsx scripts/run-instacomp-ocr-registry-primary-regressions.ts
          '''
          if test_anchor not in workflow:
              raise SystemExit('permanent workflow test anchor missing')
          workflow_path.write_text(workflow.replace(test_anchor, test_replacement, 1))

          # Permanent static contract prevents an accidental return to model-first.
          contract_path = Path('scripts/check-instacomp-local-primary-contract.mjs')
          contract = contract_path.read_text()
          marker = '''requireText(
            client,
            "internalScanId: safeScanId(scan.scan_id)",
            "The website must retain the internal scan receipt for later teaching.",
          );
          '''
          addition = '''requireText(
            route,
            "printedEvidence: params.externalOcr",
            "The website must forward bounded printed evidence to InstaComp.",
          );
          requireText(
            client,
            '"printed_evidence_json"',
            "The local client must carry bounded printed evidence with the card.",
          );
          requireText(
            service,
            "printed_registry = (",
            "The local engine must query the Checklist Registry before Ollama.",
          );
          if (service.indexOf("printed_registry = (") >= service.indexOf("reader.analyze")) {
            throw new Error("OCR/Checklist Registry resolution must run before Ollama backup.");
          }
          requireText(
            service,
            'match_source="checklist_registry"',
            "OCR-resolved cards must record Checklist Registry provenance.",
          );
          '''
          if 'The website must forward bounded printed evidence to InstaComp.' not in contract:
              if marker not in contract:
                  raise SystemExit('permanent contract marker missing')
              contract_path.write_text(contract.replace(marker, addition + marker, 1))
          PY
          rm .github/workflows/patch-instacomp-ocr-registry-primary.yml
      - name: Certify internal OCR and Registry path
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://example.com
          INSTACOMP_SERVICE_TOKEN: placeholder-service-token
        run: |
          cd services/instacomp-ai
          python -m compileall app tests
          pytest -q
          cd ../..
          node --import tsx scripts/run-instacomp-ocr-registry-primary-regressions.ts
          node scripts/check-instacomp-local-primary-contract.mjs
          npx eslint src/app/api/instacomp/scan/route.ts src/app/api/instacomp/checklist-lookup/route.ts src/app/api/instacomp/internal-readiness/route.ts src/app/api/account/seller/inventory/instacomp-card-edit/route.ts src/lib/instacomp-ai-local.ts src/lib/instacomp-checklist-first.ts src/lib/instacomp-checklist-first-server.ts
          npx tsc --noEmit
          npm run build
      - name: Commit verified OCR Registry path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ocr-registry-primary-patched] Resolve checklist cards before Ollama"
          git push origin HEAD:fix/instacomp-local-engine-primary
