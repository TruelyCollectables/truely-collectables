name: InstaComp Ollama Compact Local Evidence 20260807

on:
  push:
    branches:
      - fix/instacomp-ollama-compact-local-evidence-20260807
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref != 'ops/collx-full-inventory-migration-20260811'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'fix/instacomp-ollama-compact-local-evidence-20260807' }}
          fetch-depth: 0
      - name: Apply compact evidence repair
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'def _compact_ocr' services/instacomp-ai/app/ollama.py; then echo 'runtime already contains compact evidence repair'; else python3 scripts/patch-instacomp-ollama-compact-local-evidence.py; fi
          git diff --check
          grep -q 'def _compact_ocr' services/instacomp-ai/app/ollama.py
          grep -q 'Full OCR boxes and raw measurements' services/instacomp-ai/app/ollama.py
          grep -q 'prompt_chars' services/instacomp-ai/app/ollama.py
          grep -q 'def _safe_ollama_error_detail' services/instacomp-ai/app/main.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - name: Install and certify complete service
        working-directory: services/instacomp-ai
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m compileall app tests scripts
          PYTHONPATH=. pytest -q tests/test_ollama_compact_local_evidence.py
          PYTHONPATH=. pytest -q
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: '22'
          cache: npm
      - name: Certify TypeScript and production build
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  collx-full-classify:
    if: github.head_ref == 'ops/collx-full-inventory-migration-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STORE_ID: 00000000-0000-4000-8000-000000000001
      WORK: /tmp/collx-full-classify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/collx-full-inventory-migration-20260811
          fetch-depth: 1
      - name: Run authoritative full CollX classifier
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ops/run-collx-full-classifier-20260811.sh
      - name: Upload classifier receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-full-classification-proven-workflow
          path: |
            /tmp/collx-full-classify/classification.json
            /tmp/collx-full-classify/receipt.json
          retention-days: 7
          if-no-files-found: warn
