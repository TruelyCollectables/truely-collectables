name: InstaComp Ollama Compact Local Evidence 20260807

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collx-full-migration-v3-20260811
  cancel-in-progress: true

jobs:
  collx-guard-diagnostic:
    if: github.head_ref == 'ops/collx-full-inventory-migration-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      WORK: /tmp/collx-guard-diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/collx-full-inventory-migration-20260811
          fetch-depth: 1
      - name: Resolve Production Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK" .vercel
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull "$WORK/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          python3 - <<'PY'
          import os,re
          text=open(os.path.join(os.environ['WORK'],'production.env')).read()
          m=re.search(r'^NEXT_PUBLIC_SUPABASE_URL=(?:"|\')?https://([a-z0-9]+)\.supabase\.co(?:"|\')?$',text,re.M)
          if not m: raise SystemExit('Could not resolve Supabase project ref')
          open(os.path.join(os.environ['WORK'],'ref.txt'),'w').write(m.group(1))
          PY
      - name: Inspect inventory trigger functions and partial shell counts
        shell: bash
        run: |
          set -euo pipefail
          REF="$(cat "$WORK/ref.txt")"
          python3 - <<'PY'
          import json,os
          q="""
          with trigger_rows as (
            select n.nspname as table_schema,c.relname as table_name,t.tgname as trigger_name,
                   pg_get_triggerdef(t.oid) as trigger_def,
                   pn.nspname as function_schema,p.proname as function_name,
                   pg_get_functiondef(t.tgfoid) as function_def
            from pg_trigger t
            join pg_class c on c.oid=t.tgrelid
            join pg_namespace n on n.oid=c.relnamespace
            join pg_proc p on p.oid=t.tgfoid
            join pg_namespace pn on pn.oid=p.pronamespace
            where not t.tgisinternal and n.nspname='public' and c.relname='inventory_items'
          )
          select jsonb_build_object(
            'triggers', coalesce((select jsonb_agg(to_jsonb(trigger_rows)) from trigger_rows), '[]'::jsonb),
            'collx_products', (select count(*) from public.products where sku like 'COLLX-%'),
            'collx_product_distinct_skus', (select count(distinct sku) from public.products where sku like 'COLLX-%'),
            'collx_products_with_ebay', (select count(*) from public.products where sku like 'COLLX-%' and ebay_item_id is not null),
            'collx_items', (select count(*) from public.inventory_items where sku like 'COLLX-%'),
            'unreferenced_collx_product_shells', (
              select count(*) from public.products p
              where p.sku like 'COLLX-%' and p.ebay_item_id is null
                and not exists (select 1 from public.inventory_items i where i.legacy_product_id=p.id)
            )
          ) as diagnostics;
          """
          open(os.path.join(os.environ['WORK'],'query.json'),'w').write(json.dumps({'query':q,'parameters':[],'read_only':True}))
          PY
          code="$(curl -sS -o "$WORK/diagnostics.json" -w '%{http_code}' --max-time 90 \
            -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$WORK/query.json" \
            "https://api.supabase.com/v1/projects/$REF/database/query" || true)"
          echo "http=$code"
          cat "$WORK/diagnostics.json" || true
          test "$code" = '200'
      - name: Upload guard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-live-guard-diagnostics-v2
          path: /tmp/collx-guard-diagnostic/diagnostics.json
          retention-days: 7
          if-no-files-found: warn
