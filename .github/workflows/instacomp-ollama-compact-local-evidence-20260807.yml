name: InstaComp Ollama Compact Local Evidence 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-ollama-compact-local-evidence-20260807.yml"
      - "services/instacomp-ai/app/ollama.py"
      - "services/instacomp-ai/app/teacher_vision_prompt_evidence.py"
      - "services/instacomp-ai/app/teacher_vision_training.py"
      - "services/instacomp-ai/scripts/run_teacher_vision_lora_training.py"
      - "services/instacomp-ai/tests/test_ollama_compact_local_evidence.py"
      - "services/instacomp-ai/tests/test_teacher_vision_prompt_evidence.py"
      - "services/instacomp-ai/tests/test_teacher_vision_training.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-compact-local-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Certify compact evidence and teacher prompt boundaries
        shell: bash
        run: |
          set -euo pipefail
          pip install -r services/instacomp-ai/requirements.txt
          python -m compileall services/instacomp-ai/app services/instacomp-ai/tests services/instacomp-ai/scripts
          PYTHONPATH=services/instacomp-ai pytest -q \
            services/instacomp-ai/tests/test_ollama_compact_local_evidence.py \
            services/instacomp-ai/tests/test_teacher_vision_prompt_evidence.py \
            services/instacomp-ai/tests/test_teacher_vision_training.py
          grep -q 'def _compact_ocr' services/instacomp-ai/app/ollama.py
          grep -q 'def local_vision_prompt_payload' services/instacomp-ai/app/ollama.py
          grep -q 'compact_training_examples_for_prompt' services/instacomp-ai/scripts/run_teacher_vision_lora_training.py
          grep -q 'raw_local_vision_preserved_in_database' services/instacomp-ai/scripts/run_teacher_vision_lora_training.py
          git diff --check
