name: InstaComp Ollama Compact Local Evidence 20260807

on:
  push:
    branches:
      - fix/instacomp-ollama-compact-local-evidence-20260807
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-ollama-collx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.head_ref != 'ops/collx-full-inventory-migration-20260811'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'fix/instacomp-ollama-compact-local-evidence-20260807' }}
          fetch-depth: 0
      - name: Apply compact evidence repair
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'def _compact_ocr' services/instacomp-ai/app/ollama.py; then echo 'runtime already contains compact evidence repair'; else python3 scripts/patch-instacomp-ollama-compact-local-evidence.py; fi
          git diff --check
          grep -q 'def _compact_ocr' services/instacomp-ai/app/ollama.py
          grep -q 'Full OCR boxes and raw measurements' services/instacomp-ai/app/ollama.py
          grep -q 'prompt_chars' services/instacomp-ai/app/ollama.py
          grep -q 'def _safe_ollama_error_detail' services/instacomp-ai/app/main.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - name: Install and certify complete service
        working-directory: services/instacomp-ai
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m compileall app tests scripts
          PYTHONPATH=. pytest -q tests/test_ollama_compact_local_evidence.py
          PYTHONPATH=. pytest -q
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: '22'
          cache: npm
      - name: Certify TypeScript and production build
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  collx-full-migrate:
    if: github.head_ref == 'ops/collx-full-inventory-migration-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SOURCE_SHA: e5675ad8a23c345bf76aa7f28d73fe5cf8f56452a2bff4595b92a88a6358e904
      SOURCE_ROWS: '6909'
      WORK: /tmp/collx-full-migrate
      ROUTE_URL: https://truely-collectables.vercel.app/api/ops/collx-full-migration-20260811
    steps:
      - name: Check out migration source
        uses: actions/checkout@v4
        with:
          ref: ops/collx-full-inventory-migration-20260811
          fetch-depth: 1

      - name: Reconstruct authoritative 6909-row CollX source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/results" .vercel
          grep -Ev 'part(10|14|15)$' .github/ops/collx-full-metadata.sha256 | sha256sum -c -
          cat \
            .github/ops/collx-full-metadata.part{00..09} \
            .github/ops/collx-full-metadata.part10m0 \
            .github/ops/collx-full-metadata.part10m1 \
            .github/ops/collx-full-metadata.part11 \
            .github/ops/collx-full-metadata.part12 \
            .github/ops/collx-full-metadata.part13 \
            .github/ops/collx-full-metadata.part14m \
            .github/ops/collx-full-metadata.part15m > "$WORK/source.xz.b64"
          base64 -d "$WORK/source.xz.b64" | xz -d > "$WORK/source.csv"
          test "$(sha256sum "$WORK/source.csv" | awk '{print $1}')" = "$SOURCE_SHA"
          test "$(($(wc -l < "$WORK/source.csv")-1))" = "$SOURCE_ROWS"

      - name: Resolve Supabase project and inspect service health
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull "$WORK/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          python3 - <<'PY'
          import os,re
          text=open(os.path.join(os.environ['WORK'],'production.env')).read()
          m=re.search(r'^NEXT_PUBLIC_SUPABASE_URL=(?:"|\')?(https://([a-z0-9]+)\.supabase\.co)(?:"|\')?$',text,re.M)
          if not m: raise SystemExit('Could not resolve Supabase ref from Production env')
          open(os.path.join(os.environ['WORK'],'supabase-ref.txt'),'w').write(m.group(2))
          PY
          REF="$(cat "$WORK/supabase-ref.txt")"
          curl -sS --max-time 30 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$REF/health?services=db&services=rest&services=storage&timeout_ms=20000" \
            -o "$WORK/results/supabase-health-before.json" -w '%{http_code}\n' | tee "$WORK/results/supabase-health-before-code.txt"
          cat "$WORK/results/supabase-health-before.json" || true

      - name: Recover project if live database route is still timing out
        shell: bash
        run: |
          set -euo pipefail
          REF="$(cat "$WORK/supabase-ref.txt")"
          code="$(curl -sS -o "$WORK/results/route-before-restart.json" -w '%{http_code}' --max-time 30 "$ROUTE_URL" || true)"
          cat "$WORK/results/route-before-restart.json" || true
          if [ "$code" -ge 500 ] 2>/dev/null || grep -Eqi 'database timed out|connection to the database timed out|upstream request timeout' "$WORK/results/route-before-restart.json" 2>/dev/null; then
            echo 'Project-specific database route is unhealthy; restarting Supabase project.'
            curl --silent --show-error --fail-with-body -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/$REF/restart" \
              -o "$WORK/results/supabase-restart.json"
            cat "$WORK/results/supabase-restart.json" || true
            healthy=0
            for n in $(seq 1 60); do
              sleep 5
              hcode="$(curl -sS -o "$WORK/results/supabase-health-poll.json" -w '%{http_code}' --max-time 30 \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$REF/health?services=db&services=rest&services=storage&timeout_ms=20000" || true)"
              rcode="$(curl -sS -o "$WORK/results/route-health-poll.json" -w '%{http_code}' --max-time 20 "$ROUTE_URL" || true)"
              if [ "$hcode" = '200' ] && [ "$rcode" != '000' ] && [ "$rcode" -lt 500 ] 2>/dev/null; then healthy=1; break; fi
            done
            test "$healthy" = '1'
          else
            echo 'Live database route is responding; restart not required.'
          fi

      - name: Classify all CollX rows against live eBay inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --retry 4 --retry-delay 5 --retry-all-errors --max-time 300 \
            -H 'Content-Type: text/csv' --data-binary @"$WORK/source.csv" \
            "$ROUTE_URL?mode=classify" | tee "$WORK/results/classification-response.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['WORK'],'results','classification-response.json')
          d=json.load(open(p))
          assert d.get('success') is True, d
          assert d.get('sourceRows')==6909, d
          accounted=int(d.get('existingCollxImports',0))+int(d.get('duplicateCollxRows',0))+int(d.get('importCandidateRows',0))
          assert accounted==6909,(accounted,d)
          print(json.dumps({'accounted':accounted,'importCandidateRows':d['importCandidateRows'],'duplicateCollxRows':d['duplicateCollxRows'],'existingCollxImports':d['existingCollxImports']},indent=2))
          PY

      - name: Import every classified CollX-only row as draft inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,json,os,urllib.request,urllib.error,time
          work=os.environ['WORK']; route=os.environ['ROUTE_URL']; body=open(os.path.join(work,'source.csv'),'rb').read()
          classification=json.load(open(os.path.join(work,'results','classification-response.json')))
          total=int(classification['importCandidateRows']); batch=100
          offsets=list(range(0,total,batch))
          def one(offset):
              last=''
              for attempt in range(1,5):
                  url=f'{route}?mode=import&offset={offset}&limit={batch}'
                  req=urllib.request.Request(url,data=body,method='POST',headers={'Content-Type':'text/csv','User-Agent':'TruelyCollectables-full-CollX-migration/20260811'})
                  try:
                      with urllib.request.urlopen(req,timeout=320) as r: payload=json.loads(r.read() or b'{}')
                      if payload.get('success') is True and int(payload.get('completed',-1)) == int(payload.get('requested',-2)):
                          open(os.path.join(work,'results',f'import-{offset:06d}.json'),'w').write(json.dumps(payload,indent=2))
                          return payload
                      last=f'bad receipt {payload}'
                  except Exception as e: last=repr(e)
                  time.sleep(attempt*3)
              raise RuntimeError(f'batch {offset} failed after retries: {last}')
          receipts=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
              future_map={ex.submit(one,o):o for o in offsets}
              for fut in concurrent.futures.as_completed(future_map):
                  receipt=fut.result(); receipts.append(receipt)
                  print(json.dumps({'offset':receipt['offset'],'completed':receipt['completed'],'total':receipt['total'],'frontsCopied':receipt['frontsCopied'],'backsCopied':receipt['backsCopied'],'imageErrors':len(receipt.get('imageErrors',[]))}))
          summary={'totalExpected':total,'batchReceipts':len(receipts),'completed':sum(int(x['completed']) for x in receipts),'frontsCopied':sum(int(x['frontsCopied']) for x in receipts),'backsCopied':sum(int(x['backsCopied']) for x in receipts),'reportedImageErrors':sum(len(x.get('imageErrors',[])) for x in receipts)}
          open(os.path.join(work,'results','import-summary.json'),'w').write(json.dumps(summary,indent=2))
          assert summary['completed']==total,summary
          print(json.dumps(summary,indent=2))
          PY

      - name: Verify complete migration and not-for-sale gate
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --retry 4 --retry-delay 5 --retry-all-errors --max-time 300 \
            "$ROUTE_URL" | tee "$WORK/results/verification.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['WORK'],'results','verification.json')))
          assert d.get('success') is True,d
          assert d.get('allClassifiedImportsPresent') is True,d
          assert d.get('allImportsNotForSale') is True,d
          assert int(d.get('missingProducts',-1))==0,d
          assert int(d.get('missingItems',-1))==0,d
          assert int(d.get('activeItems',-1))==0,d
          assert int(d.get('collxHostedProductImages',-1))==0,d
          print(json.dumps(d,indent=2))
          PY

      - name: Upload full migration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-full-migration-production-receipts
          path: |
            /tmp/collx-full-migrate/results
          retention-days: 14
          if-no-files-found: warn
