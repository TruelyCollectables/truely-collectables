name: InstaComp Ollama Compact Local Evidence 20260807

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collx-full-migration-v3-20260811
  cancel-in-progress: true

jobs:
  collx-inventory-smoke:
    if: github.head_ref == 'ops/collx-full-inventory-migration-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: e5675ad8a23c345bf76aa7f28d73fe5cf8f56452a2bff4595b92a88a6358e904
      SOURCE_ROWS: '6909'
      WORK: /tmp/collx-inventory-smoke
      ROUTE_URL: https://truely-collectables.vercel.app/api/ops/collx-full-migration-v2-20260811
    steps:
      - name: Check out migration source
        uses: actions/checkout@v4
        with:
          ref: ops/collx-full-inventory-migration-20260811
          fetch-depth: 1
      - name: Reconstruct authoritative 6909-row metadata source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          grep -Ev 'part(10|14|15)$' .github/ops/collx-full-metadata.sha256 | sha256sum -c -
          cat \
            .github/ops/collx-full-metadata.part{00..09} \
            .github/ops/collx-full-metadata.part10m0 \
            .github/ops/collx-full-metadata.part10m1 \
            .github/ops/collx-full-metadata.part11 \
            .github/ops/collx-full-metadata.part12 \
            .github/ops/collx-full-metadata.part13 \
            .github/ops/collx-full-metadata.part14m \
            .github/ops/collx-full-metadata.part15m > "$WORK/source.xz.b64"
          base64 -d "$WORK/source.xz.b64" | xz -d > "$WORK/source.csv"
          test "$(sha256sum "$WORK/source.csv" | awk '{print $1}')" = "$SOURCE_SHA"
          test "$(($(wc -l < "$WORK/source.csv")-1))" = "$SOURCE_ROWS"
      - name: Refresh classification
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 120 \
            -H 'Content-Type: text/csv' --data-binary @"$WORK/source.csv" \
            "$ROUTE_URL?mode=classify" | tee "$WORK/classification.json"
      - name: Smoke one CollX inventory insert
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$WORK/smoke.json" -w '%{http_code}' --max-time 120 \
            -H 'Content-Type: text/csv' --data-binary @"$WORK/source.csv" \
            "$ROUTE_URL?mode=import&offset=0&limit=1" || true)"
          echo "HTTP=$code"
          cat "$WORK/smoke.json" || true
          test "$code" = '200'
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['WORK'],'smoke.json')))
          assert d.get('success') is True,d
          assert d.get('requested')==1,d
          assert d.get('completed')==1,d
          PY
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-inventory-smoke-evidence
          path: /tmp/collx-inventory-smoke
          retention-days: 7
          if-no-files-found: warn
