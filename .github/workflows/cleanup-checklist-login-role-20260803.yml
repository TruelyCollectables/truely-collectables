name: Cleanup Checklist Login Role 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-checklist-login-role-20260803.yml"

permissions:
  contents: read

concurrency:
  group: pokemon-checklist-registry-production
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: d0784767fd664bf0960bf28e71afd7ca15533182
  EXPECTED_BRANCH: ops/cleanup-checklist-login-role-20260803
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/checklist-login-role-cleanup-20260803

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "origin/$EXPECTED_BRANCH"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/cleanup-checklist-login-role-20260803.yml'
          git diff --check "$EXPECTED_MAIN_SHA"..."origin/$EXPECTED_BRANCH"
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/checklist-login-role-cleanup"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Production project credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel
          npx vercel@56.2.0 link --yes --project truely-collectables \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/checklist-login-role-cleanup/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

          PRODUCTION_ENV_PATH="$RUNNER_TEMP/checklist-login-role-cleanup/production.env" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
          if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
          console.log(`::add-mask::${productionUrl}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SUPABASE_URL<<SUPABASE_URL_EOF\n${productionUrl}\nSUPABASE_URL_EOF\n`);
          NODE

      - name: Verify orphan, delete it, and verify Production health
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const productionUrl = String(process.env.NEXT_PUBLIC_SUPABASE_URL || '');
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          const api = `https://api.supabase.com/v1/projects/${projectRef}`;
          const headers = {
            Authorization: `Bearer ${accessToken}`,
            Accept: 'application/json',
            'Content-Type': 'application/json',
          };
          const targets = [
            '2024-bowman-chrome-baseball',
            '2025-bowman-baseball',
            '2024-panini-prizm-wnba',
            '2025-panini-prizm-wnba',
            '2024-panini-select-wnba',
            '2025-panini-select-wnba',
          ];
          const quoted = targets.map((value) => `'${value}'`).join(', ');
          const query = `with active_versions as (
              select * from public.checklist_versions where is_active
            ), identity_counts as (
              select v.id, v.normalized_identity_count as expected_identities,
                count(i.id)::bigint as actual_identities
              from active_versions v
              left join public.checklist_card_identities i on i.version_id = v.id
              group by v.id, v.normalized_identity_count
            )
            select json_build_object(
              'releases', (select count(*) from public.checklist_releases),
              'active_versions', (select count(*) from active_versions),
              'active_cards', (select count(*) from public.checklist_cards c join active_versions v on v.id = c.version_id),
              'active_identities', (select count(*) from public.checklist_card_identities i join active_versions v on v.id = i.version_id),
              'identity_deficit_versions', (select count(*) from identity_counts where actual_identities <> expected_identities),
              'failed_import_runs', (select count(*) from public.checklist_import_runs where status = 'failed'),
              'registry_public_grants', (
                select count(*) from information_schema.role_table_grants
                where table_schema = 'public'
                  and table_name like 'checklist\\_%' escape '\\'
                  and grantee in ('anon', 'authenticated')
              ),
              'writer_rpc', to_regprocedure('public.tcos_apply_checklist_import_plan(jsonb,text,text,bigint,text,text,text)') is not null,
              'private_source_bucket', exists (
                select 1 from storage.buckets where id = 'tcos-checklist-source-files' and public = false
              ),
              'temporary_login_roles', (select count(*) from pg_roles where rolname like 'cli_login_%'),
              'target_count', (select count(*) from public.checklist_releases where slug in (${quoted}))
            ) as state;`;

          async function audit(label) {
            const response = await fetch(`${api}/database/query`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ query, parameters: [], read_only: true }),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${label} audit failed with HTTP ${response.status}: ${text.slice(0, 1000)}`);
            const rows = text ? JSON.parse(text) : [];
            const state = rows?.[0]?.state;
            if (!state) throw new Error(`${label} audit returned no state`);
            return state;
          }

          function requireBaseline(state, label, expectedRoles) {
            const expected = {
              releases: 297,
              active_versions: 297,
              active_cards: 35987,
              active_identities: 44216,
              identity_deficit_versions: 0,
              failed_import_runs: 0,
              registry_public_grants: 0,
              writer_rpc: true,
              private_source_bucket: true,
              target_count: 0,
              temporary_login_roles: expectedRoles,
            };
            const mismatches = [];
            for (const [key, value] of Object.entries(expected)) {
              const actual = typeof value === 'boolean' ? state[key] : Number(state[key]);
              if (actual !== value) mismatches.push(`${key}=${actual}, expected=${value}`);
            }
            if (mismatches.length) throw new Error(`${label} blocked: ${mismatches.join(', ')}`);
          }

          (async () => {
            const before = await audit('before-cleanup');
            requireBaseline(before, 'before-cleanup', 1);

            const deletion = await fetch(`${api}/cli/login-role`, {
              method: 'DELETE',
              headers,
            });
            const deletionText = await deletion.text();
            if (!deletion.ok) throw new Error(`Login-role deletion failed with HTTP ${deletion.status}: ${deletionText.slice(0, 1000)}`);

            const after = await audit('after-cleanup');
            requireBaseline(after, 'after-cleanup', 0);

            const receipt = {
              schema: 'tcos.checklist.loginRoleCleanup.v1',
              generatedAt: new Date().toISOString(),
              status: 'passed',
              sourceCanceledRunId: 30787556855,
              before,
              after,
              safety: {
                deletedOnlyTemporaryCliLoginRole: true,
                checklistRowsChanged: false,
                migrationsApplied: false,
                deploymentPerformed: false,
              },
            };
            fs.mkdirSync(process.env.EVIDENCE_DIR, { recursive: true });
            fs.writeFileSync(path.join(process.env.EVIDENCE_DIR, 'cleanup.json'), `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(JSON.stringify(receipt, null, 2));
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack || error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Upload sanitized cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-login-role-cleanup-20260803
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary Production files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/checklist-login-role-cleanup"
          rm -f .env.local .env.production.local
