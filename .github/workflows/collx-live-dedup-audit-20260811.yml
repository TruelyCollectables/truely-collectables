name: CollX Confirmed Duplicate Repair 20260811

on:
  push:
    branches: [ops/collx-live-dedup-20260811]
    paths:
      - ".github/workflows/collx-live-dedup-audit-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collx-confirmed-duplicate-repair-20260811
  cancel-in-progress: false

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"
  KEEP_SKU: "COLLX-1111931109962371072"
  ARCHIVE_SKU: "COLLX-1116438452553061376"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Archive owner-confirmed duplicate and verify one physical unit remains sellable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess

          API='https://api.supabase.com/v1'
          TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']
          STORE=os.environ['FLAGSHIP_STORE_ID']
          KEEP=os.environ['KEEP_SKU']
          ARCHIVE=os.environ['ARCHIVE_SKU']

          def req(method,path,body=None,timeout=60):
              cmd=['curl','-sS','--max-time',str(timeout),'-X',method,
                   '-H',f'Authorization: Bearer {TOKEN}',
                   '-H','Accept: application/json','-H','Content-Type: application/json',
                   '-o','/tmp/sb.json','-w','%{http_code}',API+path]
              if body is not None:
                  cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              raw=open('/tmp/sb.json').read() if os.path.exists('/tmp/sb.json') else ''
              try: payload=json.loads(raw) if raw else None
              except Exception: payload=raw
              try: status=int((p.stdout or '0').strip()[-3:])
              except Exception: status=599
              if p.returncode != 0 and status == 0:
                  status,payload=599,{'error':p.stderr.strip()}
              return status,payload

          s,projects=req('GET','/projects',timeout=30)
          if s!=200 or not isinstance(projects,list):
              print('PROJECT_LIST_FAILURE',s,projects); raise SystemExit(2)
          candidates=[p for p in projects if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(candidates)!=1:
              print('PROJECT_CANDIDATES',json.dumps(candidates,default=str)); raise SystemExit(3)
          ref=str(candidates[0].get('id') or candidates[0].get('ref') or '')
          print('PROJECT_REF='+ref)

          def sql(q, read_only=True):
              status,body=req('POST',f'/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':read_only},60)
              if status not in (200,201):
                  print('SQL_FAILURE',status,json.dumps(body,default=str)); raise SystemExit(4)
              return body

          pre=sql(f"""
          select p.id as product_id,p.sku,p.title,p.player,p.price,p.quantity,p.image_url,p.archived_at,p.ebay_item_id,
                 i.id as inventory_item_id,i.status as inventory_status,i.quantity as inventory_quantity,i.legacy_product_id,i.notes,i.metadata
          from public.products p
          left join public.inventory_items i
            on i.store_id=p.store_id and (i.legacy_product_id=p.id or i.sku=p.sku)
          where p.store_id='{STORE}'::uuid and p.sku in ('{KEEP}','{ARCHIVE}')
          order by p.sku;
          """)
          print('PRE_REPAIR='+json.dumps(pre,default=str))
          if not isinstance(pre,list) or len(pre)!=2:
              raise SystemExit('REFUSING_UNEXPECTED_PAIR_COUNT')
          b={str(r.get('sku')):r for r in pre}
          if set(b)!={KEEP,ARCHIVE}:
              raise SystemExit('REFUSING_UNEXPECTED_SKUS')
          keep=b[KEEP]; dup=b[ARCHIVE]
          if int(keep.get('product_id') or 0)!=504323 or int(dup.get('product_id') or 0)!=504137:
              raise SystemExit('REFUSING_PRODUCT_ID_MISMATCH')
          kt=str(keep.get('title') or ''); dt=str(dup.get('title') or '')
          if kt!=dt or 'Score Select Throwback' not in kt or 'Wilson #11' not in kt:
              raise SystemExit('REFUSING_CARD_IDENTITY_MISMATCH')
          if str(keep.get('ebay_item_id') or '').strip() or str(dup.get('ebay_item_id') or '').strip():
              raise SystemExit('REFUSING_EBAY_LINKED_PAIR')
          if int(keep.get('quantity') or 0)!=1 or int(keep.get('inventory_quantity') or 0)!=1 or keep.get('archived_at') is not None or str(keep.get('inventory_status') or '')!='active':
              raise SystemExit('REFUSING_KEEP_STATE_MISMATCH')

          already = (int(dup.get('quantity') or 0)==0 and int(dup.get('inventory_quantity') or 0)==0 and dup.get('archived_at') is not None and str(dup.get('inventory_status') or '')!='active')
          if already:
              print('DUPLICATE_ALREADY_ARCHIVED=true')
          else:
              if int(dup.get('quantity') or 0)!=1 or int(dup.get('inventory_quantity') or 0)!=1 or dup.get('archived_at') is not None or str(dup.get('inventory_status') or '')!='active':
                  raise SystemExit('REFUSING_DUP_STATE_MISMATCH')
              iid=str(dup.get('inventory_item_id') or '')
              if not iid:
                  raise SystemExit('REFUSING_MISSING_INVENTORY_ITEM')
              result=sql(f"""
              WITH updated_item AS (
                UPDATE public.inventory_items
                SET quantity=0,
                    status='draft',
                    notes=CASE
                      WHEN NULLIF(BTRIM(notes),'') IS NULL THEN 'Confirmed duplicate physical card; archived 2026-08-11; keep {KEEP}'
                      WHEN notes ILIKE '%Confirmed duplicate physical card%' THEN notes
                      ELSE BTRIM(notes) || ' | Confirmed duplicate physical card; archived 2026-08-11; keep {KEEP}'
                    END,
                    metadata=COALESCE(metadata,'{{}}'::jsonb) || jsonb_build_object(
                      'confirmed_duplicate_20260811',jsonb_build_object('state','archived','keep_sku','{KEEP}','reason','owner confirmed only one physical copy exists','recorded_at',now())
                    ),
                    updated_at=now()
                WHERE id='{iid}'::uuid AND store_id='{STORE}'::uuid AND sku='{ARCHIVE}' AND quantity=1 AND status='active'
                RETURNING id
              ), updated_product AS (
                UPDATE public.products
                SET quantity=0,archived_at=now()
                WHERE id=504137 AND store_id='{STORE}'::uuid AND sku='{ARCHIVE}' AND quantity=1 AND archived_at is null
                  AND EXISTS (SELECT 1 FROM updated_item)
                RETURNING id
              )
              SELECT (SELECT count(*)::int FROM updated_item) AS updated_items,
                     (SELECT count(*)::int FROM updated_product) AS updated_products;
              """, False)
              print('REPAIR_RESULT='+json.dumps(result,default=str))
              if not isinstance(result,list) or len(result)!=1 or int(result[0].get('updated_items') or 0)!=1 or int(result[0].get('updated_products') or 0)!=1:
                  raise SystemExit('REPAIR_ATOMIC_COUNT_FAILURE')

          post=sql(f"""
          select p.id as product_id,p.sku,p.title,p.quantity,p.archived_at,
                 i.id as inventory_item_id,i.status as inventory_status,i.quantity as inventory_quantity,i.metadata
          from public.products p
          left join public.inventory_items i
            on i.store_id=p.store_id and (i.legacy_product_id=p.id or i.sku=p.sku)
          where p.store_id='{STORE}'::uuid and p.sku in ('{KEEP}','{ARCHIVE}')
          order by p.sku;
          """)
          print('POST_REPAIR='+json.dumps(post,default=str))
          pb={str(r.get('sku')):r for r in post}
          keep=pb.get(KEEP,{}); dup=pb.get(ARCHIVE,{})
          if int(keep.get('quantity') or 0)!=1 or int(keep.get('inventory_quantity') or 0)!=1 or keep.get('archived_at') is not None or str(keep.get('inventory_status') or '')!='active':
              raise SystemExit('KEEP_VERIFICATION_FAILURE')
          if int(dup.get('quantity') or 0)!=0 or int(dup.get('inventory_quantity') or 0)!=0 or dup.get('archived_at') is None or str(dup.get('inventory_status') or '')=='active':
              raise SystemExit('ARCHIVE_VERIFICATION_FAILURE')

          live=sql(f"""
          select count(*)::int as live_rows,coalesce(sum(quantity),0)::int as live_units
          from public.products
          where store_id='{STORE}'::uuid and sku in ('{KEEP}','{ARCHIVE}')
            and archived_at is null and quantity>0 and price>0 and nullif(btrim(image_url),'') is not null;
          """)
          print('PAIR_LIVE_VERIFY='+json.dumps(live,default=str))
          if not isinstance(live,list) or len(live)!=1 or int(live[0].get('live_rows') or 0)!=1 or int(live[0].get('live_units') or 0)!=1:
              raise SystemExit('PAIR_LIVE_VERIFY_FAILURE')
          print('CONFIRMED_AJA_DUPLICATE_REPAIR=SUCCESS')
          PY
