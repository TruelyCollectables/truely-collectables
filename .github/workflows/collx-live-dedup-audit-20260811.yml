name: CollX Live Duplicate Audit 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-live-dedup-audit-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Audit guarded same-price CollX consolidation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess
          API='https://api.supabase.com/v1'; TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']; STORE=os.environ['FLAGSHIP_STORE_ID']
          def req(method,path,body=None,timeout=60):
              cmd=['curl','-sS','--max-time',str(timeout),'-X',method,'-H',f'Authorization: Bearer {TOKEN}','-H','Accept: application/json','-H','Content-Type: application/json','-o','/tmp/sb.json','-w','%{http_code}',API+path]
              if body is not None: cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True); raw=open('/tmp/sb.json').read() if os.path.exists('/tmp/sb.json') else ''
              try: payload=json.loads(raw) if raw else None
              except Exception: payload=raw
              try: status=int((p.stdout or '0').strip()[-3:])
              except Exception: status=0
              if p.returncode != 0 and status == 0: status,payload=599,{'error':p.stderr.strip()}
              return status,payload
          s,projects=req('GET','/projects',timeout=30)
          candidates=[p for p in projects] if s==200 and isinstance(projects,list) else []
          candidates=[p for p in candidates if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(candidates)!=1: print('PROJECT_FAILURE',s,json.dumps(candidates,default=str)); raise SystemExit(2)
          ref=str(candidates[0].get('id') or candidates[0].get('ref') or ''); print('PROJECT_REF='+ref)
          def sql(q):
              status,body=req('POST',f'/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':True},60)
              if status not in (200,201): print('SQL_FAILURE',status,json.dumps(body,default=str)); raise SystemExit(3)
              return body

          audit=sql(f"""
          with live as (
            select p.id product_id,p.sku,p.title,p.player,p.price,p.quantity,p.image_url,p.ebay_item_id,
                   i.id inventory_item_id,i.quantity inventory_quantity,i.price inventory_price,i.status inventory_status,
                   lower(regexp_replace(btrim(coalesce(p.title,'')),'\\s+',' ','g')) nt,
                   lower(regexp_replace(btrim(coalesce(p.player,'')),'\\s+',' ','g')) np,
                   round(p.price*100)::bigint price_cents
            from public.products p
            join public.inventory_items i on i.store_id=p.store_id and i.legacy_product_id=p.id
            where p.store_id='{STORE}'::uuid
              and p.sku >= 'COLLX-' and p.sku < 'COLLY'
              and p.archived_at is null and p.quantity>0 and p.price>0
              and nullif(btrim(p.image_url),'') is not null
              and coalesce(btrim(p.ebay_item_id::text),'')=''
              and i.status='active' and i.quantity=p.quantity and round(i.price*100)=round(p.price*100)
          ), grouped as (
            select nt,np,price_cents,count(*)::int copies,sum(quantity)::int total_quantity,
                   min(product_id) keeper_product_id,
                   array_agg(product_id order by product_id) product_ids,
                   array_agg(inventory_item_id order by product_id) inventory_item_ids,
                   array_agg(sku order by product_id) skus
            from live group by nt,np,price_cents having count(*)>1
          ), candidate_products as (
            select unnest(product_ids) product_id from grouped
          ), reserved as (
            select distinct r.legacy_product_id
            from public.checkout_inventory_reservations r
            join candidate_products c on c.product_id=r.legacy_product_id
            where r.store_id='{STORE}'::uuid and r.status='active' and r.expires_at>now()
          )
          select
            (select count(*)::int from live) eligible_live_rows,
            (select count(*)::int from grouped) same_price_groups,
            (select coalesce(sum(copies-1),0)::int from grouped) extra_tiles,
            (select coalesce(sum(total_quantity),0)::int from grouped) units_in_groups,
            (select count(*)::int from reserved) actively_reserved_candidate_products,
            (select count(*)::int from public.products p where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY' and p.archived_at is null and p.quantity>0 and coalesce(btrim(p.ebay_item_id::text),'')<>'') ebay_linked_live_collx,
            (select count(*)::int from public.products p left join public.inventory_items i on i.store_id=p.store_id and i.legacy_product_id=p.id where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY' and p.archived_at is null and p.quantity>0 and (i.id is null or i.quantity<>p.quantity or round(i.price*100)<>round(p.price*100) or i.status<>'active')) bridge_mismatch_live_collx;
          """)
          print('GUARD_AUDIT='+json.dumps(audit,default=str))

          aja=sql(f"""
          select p.id product_id,p.sku,p.title,p.player,p.price,p.quantity,i.id inventory_item_id,i.status,i.quantity inventory_quantity,
                 exists(select 1 from public.checkout_inventory_reservations r where r.store_id=p.store_id and r.legacy_product_id=p.id and r.status='active' and r.expires_at>now()) actively_reserved
          from public.products p join public.inventory_items i on i.store_id=p.store_id and i.legacy_product_id=p.id
          where p.store_id='{STORE}'::uuid and p.archived_at is null and p.quantity>0
            and p.sku >= 'COLLX-' and p.sku < 'COLLY'
            and lower(p.title) like '%score select throwback%' and lower(p.title) like '%wilson%'
          order by p.id;
          """)
          print('AJA_PREVIEW='+json.dumps(aja,default=str))

          groups=sql(f"""
          with live as (
            select p.id product_id,p.sku,p.title,p.player,p.price,p.quantity,i.id inventory_item_id,
                   lower(regexp_replace(btrim(coalesce(p.title,'')),'\\s+',' ','g')) nt,
                   lower(regexp_replace(btrim(coalesce(p.player,'')),'\\s+',' ','g')) np,
                   round(p.price*100)::bigint price_cents
            from public.products p join public.inventory_items i on i.store_id=p.store_id and i.legacy_product_id=p.id
            where p.store_id='{STORE}'::uuid and p.sku >= 'COLLX-' and p.sku < 'COLLY' and p.archived_at is null and p.quantity>0 and p.price>0
              and nullif(btrim(p.image_url),'') is not null and coalesce(btrim(p.ebay_item_id::text),'')=''
              and i.status='active' and i.quantity=p.quantity and round(i.price*100)=round(p.price*100)
          )
          select nt,np,price_cents,count(*)::int copies,sum(quantity)::int total_quantity,min(product_id) keeper_product_id,array_agg(product_id order by product_id) product_ids,array_agg(sku order by product_id) skus
          from live group by nt,np,price_cents having count(*)>1 order by copies desc,nt limit 25;
          """)
          print('TOP_SAFE_GROUPS='+json.dumps(groups,default=str))
          print('COLLX_GUARDED_CONSOLIDATION_AUDIT=SUCCESS')
          PY
