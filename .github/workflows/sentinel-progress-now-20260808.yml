name: Sentinel Progress Now 20260808

on:
  push:
    branches:
      - ops/sentinel-progress-now-20260808
    paths:
      - .github/workflows/sentinel-progress-now-20260808.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      RESULT_PATH: audits/sentinel-progress-now.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/sentinel-progress-now-20260808
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read live Sentinel progress
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/sentinel-progress" .vercel "$(dirname "$RESULT_PATH")"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/sentinel-progress/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          export PRODUCTION_ENV_FILE="$RUNNER_TEMP/sentinel-progress/production.env"
          node <<'NODE'
          const fs = require('fs');
          const envText = fs.readFileSync(process.env.PRODUCTION_ENV_FILE, 'utf8');
          function value(key) {
            const m = envText.match(new RegExp(`^${key}=(?:"([^"]*)"|'([^']*)'|([^\\r\\n]*))`, 'm'));
            return String(m?.[1] ?? m?.[2] ?? m?.[3] ?? '').trim();
          }
          const base = value('INSTACOMP_AI_LOCAL_URL').replace(/\/+$/, '');
          const key = value('INSTACOMP_AI_LOCAL_KEY');
          if (!/^https:\/\/[^/]+\.truelycollectables\.com$/i.test(base) || !key) {
            throw new Error('Production Mac coordinates unavailable.');
          }
          (async () => {
            const response = await fetch(base + '/v1/checklist-sentinel/status', {
              headers: { 'X-InstaComp-AI-Key': key, Accept: 'application/json' },
              cache: 'no-store',
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Sentinel status HTTP ${response.status}`);
            const status = await response.json();
            const job = status.latest_job || {};
            const targets = status.targets || {};
            const pending = Number(targets.pending || 0);
            const sprintBaseline = 278;
            const sprintProcessed = Math.max(0, Math.min(sprintBaseline, sprintBaseline - pending));
            const sprintPct = sprintBaseline ? +(sprintProcessed * 100 / sprintBaseline).toFixed(1) : 0;
            const total = Number(job.total_targets || 0);
            const processed = Number(job.processed_targets || 0);
            const batchPct = total ? +(processed * 100 / total).toFixed(1) : +(Number(job.progress_percent || 0).toFixed(1));
            const out = {
              checkedAt: new Date().toISOString(),
              jobId: job.job_id || null,
              status: job.status || null,
              trigger: job.trigger || null,
              currentTarget: job.current_target_key || null,
              batchProcessed: processed,
              batchTotal: total,
              batchPct,
              found: Number(job.found_count || 0),
              downloaded: Number(job.downloaded_count || 0),
              imported: Number(job.imported_count || 0),
              failed: Number(job.failed_count || 0),
              targets,
              sprintBaseline,
              sprintProcessed,
              sprintPct,
              freezeStale: Boolean(status?.freeze_protection?.stale),
              heartbeatAt: job.heartbeat_at || null,
            };
            fs.writeFileSync(process.env.RESULT_PATH, JSON.stringify(out, null, 2) + '\n');
            console.log('SENTINEL_PROGRESS=' + JSON.stringify(out));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Publish progress receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          git commit -m 'Update live Sentinel progress receipt'
          git push origin HEAD:ops/sentinel-progress-now-20260808

      - name: Remove pulled Production environment
        if: always()
        run: rm -f "$RUNNER_TEMP/sentinel-progress/production.env"
