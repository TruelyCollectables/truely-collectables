name: Apply InstaComp Audit Round Two Core Patch

# One-time same-repository PR transformation. The successful job deletes this file.
on:
  pull_request:
    paths:
      - "scripts/apply-instacomp-audit-round2-core.mjs"
      - ".github/workflows/apply-instacomp-audit-round2-core.yml"

permissions:
  contents: write

concurrency:
  group: apply-instacomp-audit-round2-core-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-core-hardening:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair one-time transformer portability
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-instacomp-audit-round2-core.mjs')
          source = path.read_text()

          old_counter = '  const matches = [...source.matchAll(regex)];'
          new_counter = '''  const matcher = new RegExp(
            regex.source,
            regex.flags.includes("g") ? regex.flags : `${regex.flags}g`,
          );
          const matches = [...source.matchAll(matcher)];'''
          if old_counter in source:
              source = source.replace(old_counter, new_counter)

          old_before = "'      method: \"POST\",\\n      headers:'"
          new_before = "'method: \"POST\",'"
          old_after = "'      method: \"POST\",\\n      signal,\\n      headers:'"
          new_after = "'method: \"POST\",\\n      signal,'"
          if source.count(old_before) != 2 or source.count(old_after) != 2:
              raise SystemExit(
                  f'provider cancellation markers unexpected: before={source.count(old_before)} after={source.count(old_after)}'
              )
          source = source.replace(old_before, new_before)
          source = source.replace(old_after, new_after)

          path.write_text(source)
          PY

      - name: Apply deterministic scanner patch
        run: node scripts/apply-instacomp-audit-round2-core.mjs

      - name: Verify core hardening markers
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/app/api/instacomp/scan/route.ts', 'utf8');
          for (const marker of [
            'INSTACOMP_AUDIT_ROUND2_CORE_V1',
            'resolveInstaCompCouncilPolicy',
            'aiCouncilPolicy.effectiveTier',
            'normalizeOpenAiCompatibleBaseUrl',
            'openAiCompatibleProviderFamily',
            'formatUntrustedOcrEvidence',
            'operation: (signal: AbortSignal) => Promise<T>',
            'signal: options.signal',
            'const externalSerialCandidate = externalOcr?.serialNumber || null',
            'A serial candidate from OCR must be visibly confirmed',
          ]) {
            if (!source.includes(marker)) throw new Error(`Missing core hardening marker: ${marker}`);
          }
          if (source.includes('Use this text heavily for exact player')) {
            throw new Error('Raw hostile OCR instruction remains in the primary prompt.');
          }
          NODE

      - name: Remove one-time patch machinery and commit permanent code
        run: |
          git rm scripts/apply-instacomp-audit-round2-core.mjs
          git rm .github/workflows/apply-instacomp-audit-round2-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/instacomp/scan/route.ts
          git commit -m "Harden AI council cost, endpoint, OCR, and cancellation boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
