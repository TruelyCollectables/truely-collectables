name: InstaComp Five Card Production Proof 20260806

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-five-card-production-proof-20260806.yml"
      - "scripts/ops/patch-instacomp-back-designation.py"
      - "scripts/ops/run-instacomp-five-card-production-proof.ts"
      - "src/app/admin/page.tsx"
      - "src/lib/instacomp-image-orientation.ts"

permissions:
  actions: read
  contents: write

concurrency:
  group: instacomp-five-card-production-proof-20260806
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: ops/instacomp-five-card-proof-admin-button-20260806
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/instacomp-five-card-production-proof-20260806

jobs:
  prove-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact branch and apply designation repair
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$EXPECTED_BRANCH)"
          python3 scripts/ops/patch-instacomp-back-designation.py
          git diff --check
          grep -q 'backStandalonePrizm' src/lib/instacomp-image-orientation.ts
          grep -q 'backDesignationConfidence' src/lib/instacomp-image-orientation.ts
          grep -q 'OPEN KINGMAKER' src/app/admin/page.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/instacomp-five-card-proof"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/instacomp-five-card-proof/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$RUNNER_TEMP/instacomp-five-card-proof/production.env" RUNTIME_ENV_PATH="$RUNNER_TEMP/instacomp-five-card-proof/runtime-env.sh" node - <<'NODE'
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          (async () => {
            const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
            if (!productionUrl) throw new Error('Missing NEXT_PUBLIC_SUPABASE_URL');
            const projectRef = new URL(productionUrl).hostname.split('.')[0];
            let serviceKey = String(
              parsed.SUPABASE_SERVICE_ROLE_KEY ||
              parsed.SUPABASE_SECRET_KEY ||
              Object.entries(parsed).find(([key, value]) => /^SUPABASE_SECRET_.*_KEY$/.test(key) && value)?.[1] ||
              ''
            );
            if (!serviceKey) {
              const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`, {
                headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` },
              });
              const body = await response.text();
              if (!response.ok) throw new Error(`Supabase key lookup failed with HTTP ${response.status}: ${body.slice(0, 300)}`);
              const keys = body ? JSON.parse(body) : [];
              const legacy = keys.find((key) => key?.name === 'service_role' && key?.api_key);
              const roleSecret = keys.find((key) => key?.secret_jwt_template?.role === 'service_role' && key?.api_key);
              const secret = keys.find((key) => key?.type === 'secret' && key?.api_key);
              serviceKey = String(legacy?.api_key || roleSecret?.api_key || secret?.api_key || '');
            }
            if (!serviceKey) throw new Error('No Production service-role key could be resolved');
            parsed.SUPABASE_SERVICE_ROLE_KEY = serviceKey;
            for (const value of Object.values(parsed)) {
              if (value) console.log(`::add-mask::${value}`);
            }
            const lines = Object.entries(parsed)
              .filter(([key]) => /^[A-Z_][A-Z0-9_]*$/.test(key))
              .map(([key, value]) => `export ${key}=${JSON.stringify(String(value))}`);
            fs.writeFileSync(process.env.RUNTIME_ENV_PATH, `${lines.join('\n')}\n`, { mode: 0o600 });
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Prove five cards, build, commit repair, and deploy Production
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/instacomp-five-card-proof/runtime-env.sh"
          mkdir -p "$EVIDENCE_DIR"

          echo "=== TYPESCRIPT ==="
          ./node_modules/.bin/tsc --noEmit

          echo "=== FIVE REAL CARD PROOF ==="
          node --import tsx scripts/ops/run-instacomp-five-card-production-proof.ts \
            --output "$EVIDENCE_DIR/five-card-proof.json"

          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/instacomp-five-card-production-proof-20260806/five-card-proof.json', 'utf8'));
          if (receipt.status !== 'passed' || receipt.testedCards !== 5 || receipt.passedCards !== 5) {
            throw new Error('Five-card proof did not pass 5/5');
          }
          NODE

          echo "=== PRODUCTION BUILD ==="
          npx vercel@56.2.0 build --prod --token "$VERCEL_TOKEN"
          grep -R -q "OPEN KINGMAKER" .vercel/output

          echo "=== PERSISTING RUNTIME REPAIR ==="
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp-image-orientation.ts
          if ! git diff --cached --quiet; then
            git commit -m "Capture WNBA back designation receipt [skip ci]"
            git push origin "HEAD:$EXPECTED_BRANCH"
          fi

          echo "=== PRODUCTION DEPLOY ==="
          npx vercel@56.2.0 deploy --prebuilt --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee "$EVIDENCE_DIR/vercel-deploy.txt"

          echo "=== PRODUCTION READINESS ==="
          curl -fsS "https://truelycollectables.com/api/instacomp/internal-readiness?ts=$(date +%s)" \
            -o "$EVIDENCE_DIR/readiness.json"
          cat "$EVIDENCE_DIR/readiness.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const readiness = JSON.parse(fs.readFileSync('evidence/instacomp-five-card-production-proof-20260806/readiness.json', 'utf8'));
          if (readiness.ok !== true || readiness.reachable !== true || readiness.checklistReady !== true) {
            throw new Error(`Production readiness failed: ${JSON.stringify(readiness)}`);
          }
          NODE

          echo "=== ADMIN KINGMAKER BUTTON ==="
          ADMIN_SESSION=$(node --import tsx -e 'import { createAdminSessionValue } from "./src/lib/admin-session.ts"; console.log(await createAdminSessionValue());')
          curl -fsS -H "Cookie: tcos_admin_auth_v3=$ADMIN_SESSION" \
            "https://truelycollectables.com/admin?proof=$(date +%s)" \
            -o "$EVIDENCE_DIR/admin.html"
          grep -q "OPEN KINGMAKER" "$EVIDENCE_DIR/admin.html"
          printf '{"status":"passed","buttonText":"OPEN KINGMAKER","href":"/kingmaker"}\n' \
            > "$EVIDENCE_DIR/admin-button.json"

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-five-card-production-proof-20260806
          path: evidence/instacomp-five-card-production-proof-20260806
          if-no-files-found: warn
          retention-days: 90

      - name: Remove Production environment files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/instacomp-five-card-proof"
          rm -f .env.local .env.production.local
