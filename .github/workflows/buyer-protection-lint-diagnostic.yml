name: Buyer Protection Lint Diagnostic

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/buyer-protection-lint-diagnostic.yml"

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture lint output
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyer-protection-lint-output
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce lint
        if: steps.lint.outcome == 'failure'
        run: exit 1
