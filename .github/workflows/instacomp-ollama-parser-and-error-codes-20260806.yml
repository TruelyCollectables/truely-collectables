name: InstaComp Ollama Parser and Error Codes 20260806

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch-instacomp-ollama-parser-and-error-codes.py"
      - "services/instacomp-ai/app/ollama.py"
      - "services/instacomp-ai/app/main.py"
      - "services/instacomp-ai/app/config.py"
      - "services/instacomp-ai/tests/test_ollama_parser_resilience.py"
      - "services/instacomp-ai/tests/test_training_only_teacher_runtime.py"
      - ".github/workflows/instacomp-ollama-parser-and-error-codes-20260806.yml"

permissions:
  contents: read

concurrency:
  group: instacomp-ollama-parser-and-error-codes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Compile and certify current runtime source
        shell: bash
        run: |
          set -euo pipefail
          pip install -r services/instacomp-ai/requirements.txt
          python -m compileall services/instacomp-ai/app services/instacomp-ai/tests
          PYTHONPATH=services/instacomp-ai pytest -q \
            services/instacomp-ai/tests/test_ollama_parser_resilience.py \
            services/instacomp-ai/tests/test_training_only_teacher_runtime.py
          grep -q 'normalize_confidence' services/instacomp-ai/app/ollama.py
          grep -q 'ollama_runtime_reader_enabled' services/instacomp-ai/app/main.py
          git diff --check
