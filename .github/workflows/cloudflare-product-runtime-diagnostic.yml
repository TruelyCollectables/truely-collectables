name: Cloudflare Product Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-product-runtime-diagnostic.yml'
      - 'src/app/api/internal/cloudflare-product-runtime-probe/route.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-cloudflare-product-runtime-diagnostic
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  PREVIEW_URL: https://truely-collectables-preview.truelycollectables.workers.dev

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.2 wrangler@4.122.0 vercel@56.2.0 dotenv@latest

      - name: Pull build environment and recover redacted Supabase keys
        shell: bash
        run: |
          set -euo pipefail
          npx vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --no-color >/dev/null
          umask 077
          npx vercel env pull .env.production.local --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes --no-color >/dev/null
          node <<'NODE'
          const fs=require('node:fs'); const dotenv=require('dotenv');
          async function main(){
            const path='.env.production.local'; const env=dotenv.parse(fs.readFileSync(path));
            const needAnon=!String(env.NEXT_PUBLIC_SUPABASE_ANON_KEY||'').trim();
            const needService=!String(env.SUPABASE_SERVICE_ROLE_KEY||'').trim();
            if(needAnon||needService){
              const r=await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/api-keys?reveal=true`,{headers:{authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,accept:'application/json'}});
              if(!r.ok) throw new Error(`Supabase API HTTP ${r.status}`);
              const keys=await r.json();
              const anon=keys.find(k=>String(k?.name||'').toLowerCase()==='anon'&&k?.api_key)?.api_key || keys.find(k=>String(k?.type||'').toLowerCase()==='publishable'&&k?.api_key)?.api_key;
              const service=keys.find(k=>String(k?.name||'').toLowerCase()==='service_role'&&k?.api_key)?.api_key || keys.find(k=>String(k?.type||'').toLowerCase()==='secret'&&k?.api_key)?.api_key;
              if(needAnon){if(!anon) throw new Error('anon key unavailable'); env.NEXT_PUBLIC_SUPABASE_ANON_KEY=String(anon); console.log(`::add-mask::${anon}`);}
              if(needService){if(!service) throw new Error('service key unavailable'); env.SUPABASE_SERVICE_ROLE_KEY=String(service); console.log(`::add-mask::${service}`);}
              fs.writeFileSync(path,Object.entries(env).map(([k,v])=>`${k}=${JSON.stringify(String(v??''))}`).join('\n')+'\n',{mode:0o600});
            }
          }
          main().catch(e=>{console.error(e.message||String(e));process.exit(1)});
          NODE

      - name: Build and deploy diagnostic current main
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const dotenv=require('dotenv'); const {spawnSync}=require('node:child_process');
          const env=dotenv.parse(fs.readFileSync('.env.production.local'));
          const r=spawnSync('npx',['opennextjs-cloudflare','build'],{stdio:'inherit',env:{...process.env,...env}});
          process.exit(r.status??1);
          NODE
          npx wrangler deploy --config wrangler.preview.jsonc

      - name: Run isolated product runtime probe
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -sS --max-time 50 -D /tmp/probe.headers "$PREVIEW_URL/api/internal/cloudflare-product-runtime-probe" -o /tmp/probe.json -w '%{http_code}' > /tmp/probe.status
          cat /tmp/probe.json
          echo
          echo "HTTP $(cat /tmp/probe.status)"
          grep -qi '^x-truely-origin: cloudflare-worker' /tmp/probe.headers || { echo 'Missing Cloudflare origin proof'; exit 20; }

      - name: Cleanup
        if: always()
        run: rm -f .env.production.local /tmp/probe.headers /tmp/probe.json /tmp/probe.status
