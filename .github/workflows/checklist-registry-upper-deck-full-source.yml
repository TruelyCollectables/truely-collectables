name: Checklist Registry Upper Deck Full Source

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/checklist-registry-upper-deck-full-source.yml"
      - "scripts/validate-upper-deck-official-sources.ts"
      - "src/lib/checklist-registry/upper-deck-html.ts"
      - "src/lib/checklist-registry/upper-deck-official-html.ts"
      - "src/lib/checklist-registry/source-adapter.ts"
      - "src/lib/checklist-registry/identity.ts"
      - "src/lib/checklist-registry/storage.ts"

permissions:
  contents: read

jobs:
  validate-complete-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate complete official Upper Deck pages without writes
        run: |
          npx tsx scripts/validate-upper-deck-official-sources.ts \
            --output .upper-deck-work/full-source-validation.json

      - name: Lint full-source validator
        run: npx eslint scripts/validate-upper-deck-official-sources.ts

      - name: Upload sanitized validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-deck-full-source-validation
          path: .upper-deck-work/full-source-validation.json
          if-no-files-found: warn
          retention-days: 30
