name: Guarded fulfillment Production build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: guarded-fulfillment-production-build-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-build:
    if: github.head_ref == 'fix/fulfillment-order-items-runtime-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify repair and exact base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "ad5758557e14f10ae9294a4a8de4dd69d188b58d"
          ! grep -R --line-number --fixed-string 'order_items (' \
            src/app/admin/orders/page.tsx \
            'src/app/admin/orders/[id]/page.tsx' \
            'src/app/admin/orders/[id]/packing-slip/page.tsx'
          test "$(grep -R --fixed-string '.from("order_items")' \
            src/app/admin/orders/page.tsx \
            'src/app/admin/orders/[id]/page.tsx' \
            'src/app/admin/orders/[id]/packing-slip/page.tsx' | wc -l)" -eq 3

      - name: Install dependencies
        run: npm ci

      - name: Run fulfillment regression
        run: npm run simulate:admin-shipping-actions

      - name: Run focused lint
        run: >-
          npx eslint
          src/app/admin/orders/page.tsx
          'src/app/admin/orders/[id]/page.tsx'
          'src/app/admin/orders/[id]/packing-slip/page.tsx'
          scripts/run-admin-shipping-actions-simulations.mjs

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Run Production build
        run: npm run build

      - name: Remove one-time build workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/guarded-fulfillment-production-build.yml
          git diff --check

      - name: Commit validated final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/guarded-fulfillment-production-build.yml
          git commit -m "Validate fulfillment Production build"
          git push origin "HEAD:${{ github.head_ref }}"
