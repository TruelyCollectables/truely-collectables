name: InstaComp Market Observation Retractions

on:
  pull_request:
    paths:
      - "src/lib/instacomp-market-history.ts"
      - "scripts/run-instacomp-market-retraction-regressions.ts"
      - "supabase/migrations/*market_observation_retractions.sql"
      - ".github/workflows/instacomp-market-observation-retractions.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/instacomp-market-history.ts"
      - "scripts/run-instacomp-market-retraction-regressions.ts"
      - "supabase/migrations/*market_observation_retractions.sql"
      - ".github/workflows/instacomp-market-observation-retractions.yml"

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prove retracted observations cannot reach market trend calculations
        run: node --import tsx scripts/run-instacomp-market-retraction-regressions.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
