name: CollX Storefront Post-Publish Verify 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-storefront-postpublish-verify-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"
    steps:
      - name: Verify live shop and CollX product pages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess, time
          API='https://api.supabase.com/v1'
          TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']
          STORE=os.environ['FLAGSHIP_STORE_ID']

          def curl(url, timeout=30):
              p=subprocess.run(['curl','-sS','-L','--connect-timeout','8','--max-time',str(timeout),'-o','/tmp/body','-w','%{http_code}',url],capture_output=True,text=True)
              try: code=int((p.stdout or '0').strip()[-3:])
              except Exception: code=599
              try: body=open('/tmp/body',errors='ignore').read()
              except Exception: body=''
              return code,body,p.stderr.strip()

          def api(method,path,body=None,timeout=30):
              cmd=['curl','-sS','--max-time',str(timeout),'-X',method,'-H',f'Authorization: Bearer {TOKEN}','-H','Accept: application/json','-H','Content-Type: application/json','-o','/tmp/sb','-w','%{http_code}',API+path]
              if body is not None: cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              try: code=int((p.stdout or '0').strip()[-3:])
              except Exception: code=599
              raw=''
              try: raw=open('/tmp/sb').read()
              except Exception: pass
              try: data=json.loads(raw) if raw else None
              except Exception: data=raw
              return code,data

          s,projects=api('GET','/projects')
          if s!=200 or not isinstance(projects,list): raise SystemExit(2)
          c=[p for p in projects if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(c)!=1: raise SystemExit(3)
          ref=str(c[0].get('id') or c[0].get('ref') or '')
          q=f"select id,sku,title,price,quantity,image_url from public.products where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY' and price>0 and quantity>0 and image_url is not null order by sku limit 3;"
          qs,rows=api('POST',f'/projects/{ref}/database/query/read-only',{'query':q,'parameters':[]},30)
          print('SAMPLE_PRODUCTS',qs,json.dumps(rows,default=str))
          if qs not in (200,201) or not isinstance(rows,list) or len(rows)<3: raise SystemExit(4)

          shop_ok=False
          for n in range(1,7):
              code,body,err=curl('https://truelycollectables.com/shop',30)
              links=body.count('href="/product/')
              empty='No active cards or collectibles found' in body
              print('SHOP_PROBE',n,'http',code,'product_links',links,'empty',empty,'err',err[:200])
              if code==200 and links>0 and not empty:
                  shop_ok=True; break
              time.sleep(5)
          if not shop_ok: raise SystemExit(5)

          for row in rows:
              pid=row['id']; sku=row['sku']
              ok=False
              for n in range(1,4):
                  code,body,err=curl(f'https://truelycollectables.com/product/{pid}',30)
                  has_title=str(row.get('title') or '')[:24].lower() in body.lower() if row.get('title') else True
                  has_price=str(row.get('price') or '').split('.')[0] in body
                  has_image='img' in body.lower()
                  print('PRODUCT_PROBE',sku,n,'http',code,'title',has_title,'price',has_price,'image',has_image,'err',err[:160])
                  if code==200 and has_title and has_image:
                      ok=True; break
                  time.sleep(3)
              if not ok: raise SystemExit(6)

          print('COLLX_STOREFRONT_POSTPUBLISH_VERIFY=SUCCESS')
          PY
