name: Apply Active Market Evidence Ledger UI

on:
  push:
    branches:
      - agent/show-active-market-evidence-ledger
    paths:
      - "src/app/seller/inventory/ActiveMarketEvidenceLedger.tsx"
      - "scripts/apply-active-market-evidence-ledger-ui.mjs"
      - ".github/workflows/apply-active-market-evidence-ledger-ui.yml"

permissions:
  contents: write

jobs:
  apply-ledger-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply evidence ledger UI
        run: node scripts/apply-active-market-evidence-ledger-ui.mjs

      - name: Validate patch
        run: git diff --check

      - name: Commit patched Seller Inventory
        run: |
          if git diff --quiet; then
            echo "Seller Inventory was already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/seller/inventory/SellerActiveInventoryPricing.tsx
          git commit -m "Show Active Market evidence ledger"
          git push origin HEAD:${{ github.ref_name }}
