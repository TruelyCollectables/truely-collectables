name: Ops CollX Visual Match Diagnostic 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-visual-match-diagnostic-20260810.yml"
      - ".github/ops/collx-visual-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and checksum-lock candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          chunks = [Path(f'.github/ops/collx-visual-manifest.chunk{i}').read_text().strip() for i in range(6)]
          packed = ''.join(chunks)
          if len(packed) != 46064:
              raise SystemExit(f'packed manifest length mismatch: {len(packed)}')
          raw = gzip.decompress(base64.b64decode(packed))
          digest = hashlib.sha256(raw).hexdigest()
          expected = 'cd8ddd1a66ae749bf058a820dfd1570b85a8d29c0c0a8a5e7acf3a88d58fdcd7'
          if digest != expected:
              raise SystemExit(f'manifest checksum mismatch: {digest}')
          # Recreate the exact four legacy pieces expected by the existing read-only matcher.
          sizes = [12000, 12000, 12000, 10064]
          offset = 0
          for i, size in enumerate(sizes):
              Path(f'.github/ops/collx-visual-candidates.part{i}').write_text(packed[offset:offset+size])
              offset += size
          print(f'candidate manifest verified: {digest}, packed={len(packed)}')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image fingerprint dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 ImageHash==4.3.2

      - name: Run read-only visual comparison
        run: python .github/ops/collx-visual-match-diagnostic.py

      - name: Upload visual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-visual-match-diagnostic
          path: ${{ runner.temp }}/collx-visual-match/
          retention-days: 2
          if-no-files-found: error
