name: Ops CollX Visual Match Diagnostic 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-visual-match-diagnostic-20260810.yml"
      - ".github/ops/collx-visual-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image fingerprint dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 ImageHash==4.3.2

      - name: Run read-only visual comparison
        run: python .github/ops/collx-visual-match-diagnostic.py

      - name: Upload visual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-visual-match-diagnostic
          path: ${{ runner.temp }}/collx-visual-match/
          retention-days: 2
          if-no-files-found: error
