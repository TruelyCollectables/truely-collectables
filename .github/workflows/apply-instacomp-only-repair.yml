name: Apply InstaComp-only repair

on:
  push:
    branches:
      - fix/instacomp-only-no-openai-emergency

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-only-no-openai-emergency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"{label}: anchor missing")
              target.write_text(text.replace(old, new, 1))

          route_path = "src/app/api/instacomp/scan/route.ts"
          replace_once(
              route_path,
              '''        {
                  provider: "openai_emergency",
                  family: "openai",
                  configured: Boolean(OPENAI_API_KEY),
                  run: () =>
                    identifyCardWithOpenAI(
                      params.frontDataUrl,
                      params.backDataUrl,
                      params.detailImages.slice(0, 8),
                      params.externalOcr,
                    ),
                },
          ''',
              "",
              "remove OpenAI emergency identity reader",
          )
          replace_once(
              route_path,
              '''    // OpenAI serial vision is emergency-only; never preflight it before InstaComp.
              const preflightSerialOcrPromise = null;

              const primaryAiResult = await identifyCardWithConfiguredProviderFailover({
          ''',
              '''    // InstaComp AI is the only identity engine. External serial vision is disabled.
              const primaryAiResult = await identifyCardWithConfiguredProviderFailover({
          ''',
              "remove emergency serial preflight",
          )
          replace_once(
              route_path,
              '''    const serialOcr =
                    (preflightSerialOcrPromise
                      ? await preflightSerialOcrPromise
                      : primaryAiResult.family === "openai" && shouldRunSerialVision({
                            ai: baseAi,
                            externalOcr,
                            requestedTier: requestedAiCouncilTier,
                          })
                        ? await optionalInstaCompProviderResult(
                            detectSerialNumberWithOpenAI(
                              frontDataUrl,
                              backDataUrl,
                              detailImages.slice(0, 16),
                              externalOcr,
                            ),
                          )
                        : null);
          ''',
              '''    const serialOcr = null;
          ''',
              "disable external serial reader",
          )
          replace_once(
              route_path,
              '''    const aiCouncilRaw = await runInstaCompAiCouncil({
                    runSecondaryVision:
                    primaryAiResult.family !== "instacomp_internal" &&
                    consensusEscalation.runSecondaryVision,
                    requestedTier: requestedAiCouncilTier,
          ''',
              '''    const aiCouncilRaw = await runInstaCompAiCouncil({
                    runSecondaryVision: false,
                    requestedTier: "basic",
          ''',
              "disable external AI council",
          )

          Path("src/lib/instacomp-ai-provider-failover.ts").write_text(r'''export type InstaCompAiProviderCandidate<T> = {
            provider: string;
            family: string;
            configured: boolean;
            run: () => Promise<T>;
          };

          export type InstaCompAiProviderAttempt = {
            provider: string;
            family: string;
            status: "completed" | "not_configured" | "error" | "skipped";
            message: string | null;
          };

          export type InstaCompAiFailoverError = Error & {
            code?: string;
            attempts?: InstaCompAiProviderAttempt[];
          };

          export const INSTACOMP_PRIMARY_FAILOVER_MAX_ATTEMPTS = 5;

          const INTERNAL_FAMILY = "instacomp_internal";
          const INTERNAL_PROVIDER = "instacomp_internal";

          function errorText(error: unknown) {
            return String(error instanceof Error ? error.message : error).trim();
          }

          export function sanitizeInstaCompProviderFailure(error: unknown) {
            const text = errorText(error).toLowerCase();
            if (/internal engine.*not configured|instacomp_ai_local_url/.test(text)) {
              return "internal_engine_not_configured";
            }
            if (/internal engine.*offline|fetch failed|econnrefused|enotfound|network/.test(text)) {
              return "internal_engine_unreachable";
            }
            if (/abort|cancel/.test(text)) return "cancelled";
            if (/timeout|timed out|deadline/.test(text)) return "timeout";
            if (/quota|rate.?limit|too many requests|\b429\b/.test(text)) {
              return "quota_or_rate_limit";
            }
            if (/model.*not found|does not exist|not.*access|unsupported model/.test(text)) {
              return "model_unavailable";
            }
            if (/unauthori[sz]ed|forbidden|invalid api key|\b401\b|\b403\b/.test(text)) {
              return "authentication_failed";
            }
            if (/unavailable|overloaded|gateway|\b50[0234]\b/.test(text)) {
              return "provider_unavailable";
            }
            if (/json|schema|no scan content|invalid response/.test(text)) {
              return "invalid_provider_response";
            }
            return "provider_error";
          }

          function isInternalCandidate(candidate: InstaCompAiProviderCandidate<unknown>) {
            return (
              String(candidate.family || "").trim().toLowerCase() === INTERNAL_FAMILY ||
              String(candidate.provider || "").trim().toLowerCase() === INTERNAL_PROVIDER
            );
          }

          function internalEngineError(params: {
            code: string;
            message: string;
            attempts: InstaCompAiProviderAttempt[];
          }) {
            const error = new Error(params.message) as InstaCompAiFailoverError;
            error.code = params.code;
            error.attempts = params.attempts;
            return error;
          }

          export async function runInstaCompPrimaryAiFailover<T>(
            candidates: InstaCompAiProviderCandidate<T>[],
            options: { maximumAttempts?: number } = {},
          ) {
            const attempts: InstaCompAiProviderAttempt[] = [];
            const attemptedFamilies = new Set<string>();
            const maximumAttempts = Math.max(
              1,
              Math.min(
                Math.trunc(
                  options.maximumAttempts || INSTACOMP_PRIMARY_FAILOVER_MAX_ATTEMPTS,
                ),
                INSTACOMP_PRIMARY_FAILOVER_MAX_ATTEMPTS,
              ),
            );
            let paidAttempts = 0;

            for (const candidate of candidates) {
              const family = String(candidate.family || "unknown").trim().toLowerCase();
              const internalCandidate = isInternalCandidate(candidate);

              if (!candidate.configured) {
                attempts.push({
                  provider: candidate.provider,
                  family,
                  status: "not_configured",
                  message: internalCandidate
                    ? "internal_engine_not_configured"
                    : "not_configured",
                });

                if (internalCandidate) {
                  throw internalEngineError({
                    code: "INSTACOMP_INTERNAL_ENGINE_NOT_CONFIGURED",
                    message:
                      "InstaComp AI is not configured for Production. Configure INSTACOMP_AI_LOCAL_URL with the secure Mac service URL.",
                    attempts,
                  });
                }
                continue;
              }

              if (attemptedFamilies.has(family)) {
                attempts.push({
                  provider: candidate.provider,
                  family,
                  status: "skipped",
                  message: "duplicate_family",
                });
                continue;
              }

              if (paidAttempts >= maximumAttempts) {
                attempts.push({
                  provider: candidate.provider,
                  family,
                  status: "skipped",
                  message: "attempt_budget_exhausted",
                });
                continue;
              }

              attemptedFamilies.add(family);
              paidAttempts += 1;

              try {
                const value = await candidate.run();
                attempts.push({
                  provider: candidate.provider,
                  family,
                  status: "completed",
                  message: null,
                });
                return { value, provider: candidate.provider, family, attempts };
              } catch (error) {
                const sanitized = sanitizeInstaCompProviderFailure(error);
                attempts.push({
                  provider: candidate.provider,
                  family,
                  status: "error",
                  message: sanitized,
                });

                if (internalCandidate) {
                  const unavailable = [
                    "internal_engine_unreachable",
                    "timeout",
                    "cancelled",
                  ].includes(sanitized);
                  throw internalEngineError({
                    code: unavailable
                      ? "INSTACOMP_INTERNAL_ENGINE_OFFLINE"
                      : "INSTACOMP_INTERNAL_ENGINE_SCAN_FAILED",
                    message: unavailable
                      ? "InstaComp AI could not be reached. Check the Mac service and its secure tunnel, then retry."
                      : "InstaComp AI did not return usable identity evidence. No external identity provider was called. Review the Mac service logs and retry.",
                    attempts,
                  });
                }
              }
            }

            const summary = attempts
              .filter((attempt) => attempt.status === "error")
              .map(
                (attempt) =>
                  `${attempt.provider}:${attempt.message || "provider_error"}`,
              )
              .join(", ");
            const error = new Error(
              summary
                ? `No configured InstaComp AI identity reader completed successfully. Reader failures: ${summary}.`
                : "No configured InstaComp AI identity reader completed successfully.",
            ) as InstaCompAiFailoverError;
            error.code = "INSTACOMP_AI_READERS_UNAVAILABLE";
            error.attempts = attempts;
            throw error;
          }

          export async function optionalInstaCompProviderResult<T>(
            operation: Promise<T>,
          ): Promise<T | null> {
            try {
              return await operation;
            } catch {
              return null;
            }
          }
          ''')

          Path("src/app/api/instacomp/internal-readiness/route.ts").write_text(r'''import { lookup } from "node:dns/promises";
          import { NextResponse } from "next/server";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";

          const HEALTH_TIMEOUT_MS = 20_000;
          const DNS_TIMEOUT_MS = 5_000;

          function configuredLocalUrl() {
            const value = String(process.env.INSTACOMP_AI_LOCAL_URL || "")
              .trim()
              .replace(/\/+$/, "");
            if (!/^https?:\/\//i.test(value)) return null;
            if (
              process.env.NODE_ENV === "production" &&
              /^https?:\/\/(?:127\.0\.0\.1|localhost)(?::|\/|$)/i.test(value)
            ) {
              return null;
            }
            return value;
          }

          function readinessResponse(
            payload: Record<string, unknown>,
            status = 200,
          ) {
            return NextResponse.json(payload, {
              status,
              headers: {
                "Cache-Control": "private, no-store, max-age=0",
                "X-Content-Type-Options": "nosniff",
              },
            });
          }

          function normalizedErrorCode(value: unknown) {
            const code = String(value || "")
              .trim()
              .toUpperCase();
            const allowed = new Set([
              "ENOTFOUND",
              "EAI_AGAIN",
              "ECONNREFUSED",
              "ECONNRESET",
              "ETIMEDOUT",
              "EHOSTUNREACH",
              "ENETUNREACH",
              "UND_ERR_CONNECT_TIMEOUT",
              "UND_ERR_HEADERS_TIMEOUT",
              "CERT_HAS_EXPIRED",
              "ERR_TLS_CERT_ALTNAME_INVALID",
              "DEPTH_ZERO_SELF_SIGNED_CERT",
            ]);
            return allowed.has(code) ? code.toLowerCase() : null;
          }

          function safeNetworkFailure(error: unknown) {
            const record =
              error && typeof error === "object"
                ? (error as Record<string, unknown>)
                : null;
            const cause =
              record?.cause && typeof record.cause === "object"
                ? (record.cause as Record<string, unknown>)
                : null;
            const name = String(record?.name || "").trim();
            const message = String(record?.message || "").toLowerCase();
            const timedOut =
              name === "TimeoutError" ||
              name === "AbortError" ||
              /timeout|timed out/.test(message);
            const code =
              normalizedErrorCode(cause?.code) || normalizedErrorCode(record?.code);

            return {
              reason: timedOut
                ? "internal_engine_health_timeout"
                : code
                  ? `internal_engine_network_${code}`
                  : "internal_engine_health_unreachable",
              networkErrorCode: code,
              networkErrorName:
                name === "TypeError" || name === "TimeoutError" || name === "AbortError"
                  ? name
                  : null,
            };
          }

          async function resolveConfiguredHostname(baseUrl: string) {
            const hostname = new URL(baseUrl).hostname;
            try {
              const records = await Promise.race([
                lookup(hostname, { all: true, verbatim: true }),
                new Promise<never>((_, reject) => {
                  setTimeout(() => reject(new Error("dns_timeout")), DNS_TIMEOUT_MS);
                }),
              ]);
              return {
                dnsResolved: records.length > 0,
                dnsRecordCount: records.length,
                dnsFamilies: Array.from(
                  new Set(records.map((record) => record.family)),
                ).sort(),
                dnsErrorCode: null,
              };
            } catch (error) {
              const record =
                error && typeof error === "object"
                  ? (error as Record<string, unknown>)
                  : null;
              const code = normalizedErrorCode(record?.code);
              return {
                dnsResolved: false,
                dnsRecordCount: 0,
                dnsFamilies: [] as number[],
                dnsErrorCode: code || "dns_lookup_failed",
              };
            }
          }

          export async function GET() {
            const baseUrl = configuredLocalUrl();
            if (!baseUrl) {
              return readinessResponse(
                {
                  ok: false,
                  configured: false,
                  reachable: false,
                  dnsResolved: false,
                  internalMemoryReady: false,
                  checklistReady: false,
                  localModelReady: false,
                  architecture: ["instacomp_ai"],
                  reason: "internal_engine_url_not_configured",
                },
                503,
              );
            }

            const dns = await resolveConfiguredHostname(baseUrl);

            try {
              const headers = new Headers();
              const key = String(process.env.INSTACOMP_AI_LOCAL_KEY || "").trim();
              if (key) headers.set("X-InstaComp-AI-Key", key);
              const response = await fetch(`${baseUrl}/health`, {
                headers,
                cache: "no-store",
                redirect: "error",
                signal: AbortSignal.timeout(HEALTH_TIMEOUT_MS),
              });
              const health = (await response.json().catch(() => null)) as
                | Record<string, unknown>
                | null;
              if (!response.ok || !health) {
                return readinessResponse(
                  {
                    ok: false,
                    configured: true,
                    reachable: true,
                    ...dns,
                    internalMemoryReady: false,
                    checklistReady: false,
                    localModelReady: false,
                    architecture: ["instacomp_ai"],
                    reason: `internal_health_http_${response.status}`,
                  },
                  503,
                );
              }

              const internalMemoryReady = health.database === "ready";
              const checklistReady = health.checklist === "ready";
              const localModelReady = health.ollama === "ready";
              const ok = internalMemoryReady && checklistReady && localModelReady;
              return readinessResponse(
                {
                  ok,
                  configured: true,
                  reachable: true,
                  ...dns,
                  internalMemoryReady,
                  checklistReady,
                  localModelReady,
                  app: typeof health.app === "string" ? health.app : "InstaComp AI",
                  version: typeof health.version === "string" ? health.version : null,
                  architecture: ["instacomp_ai"],
                  reason: ok ? null : "internal_engine_not_fully_ready",
                },
                ok ? 200 : 503,
              );
            } catch (error) {
              const failure = safeNetworkFailure(error);
              return readinessResponse(
                {
                  ok: false,
                  configured: true,
                  reachable: false,
                  ...dns,
                  internalMemoryReady: false,
                  checklistReady: false,
                  localModelReady: false,
                  architecture: ["instacomp_ai"],
                  ...failure,
                },
                503,
              );
            }
          }
          ''')

          replace_once(
              "services/instacomp-ai/app/storage.py",
              '''                CREATE INDEX IF NOT EXISTS scans_pair_hash_idx ON scans(image_pair_sha256);
                              CREATE INDEX IF NOT EXISTS scans_front_phash_idx ON scans(front_perceptual_hash);
                              CREATE TABLE IF NOT EXISTS lessons (
          ''',
              '''                CREATE INDEX IF NOT EXISTS scans_pair_hash_idx ON scans(image_pair_sha256);
                              CREATE TABLE IF NOT EXISTS lessons (
          ''',
              "defer perceptual-hash index until after migration",
          )

          Path("scripts/check-instacomp-provider-fallback.mjs").write_text(r'''import fs from "node:fs";

          const failover = fs.readFileSync(
            "src/lib/instacomp-ai-provider-failover.ts",
            "utf8",
          );
          const scan = fs.readFileSync("src/app/api/instacomp/scan/route.ts", "utf8");
          const readiness = fs.readFileSync(
            "src/app/api/instacomp/internal-readiness/route.ts",
            "utf8",
          );
          const failures = [];

          if (!failover.includes("INSTACOMP_INTERNAL_ENGINE_NOT_CONFIGURED")) {
            failures.push("missing internal-engine configuration failure");
          }
          if (!failover.includes("INSTACOMP_INTERNAL_ENGINE_OFFLINE")) {
            failures.push("missing internal-engine offline failure");
          }
          if (!failover.includes("INSTACOMP_INTERNAL_ENGINE_SCAN_FAILED")) {
            failures.push("missing internal-engine scan failure");
          }
          if (failover.includes("isInstaCompInternalEmergencyEligible")) {
            failures.push("emergency eligibility gate still exists");
          }
          if (scan.includes('provider: "openai_emergency"')) {
            failures.push("OpenAI emergency identity reader still exists");
          }
          if (!scan.includes('provider: "instacomp_internal"')) {
            failures.push("InstaComp internal identity reader is missing");
          }
          if (!scan.includes("const serialOcr = null;")) {
            failures.push("external serial identity reader is not disabled");
          }
          if (!scan.includes('runSecondaryVision: false')) {
            failures.push("external AI council is not disabled");
          }
          if (!scan.includes('requestedTier: "basic"')) {
            failures.push("AI council is not pinned to its zero-reader tier");
          }
          if (readiness.includes("openAiEmergencyConfigured")) {
            failures.push("readiness still advertises OpenAI emergency");
          }
          if (readiness.includes("openai_emergency")) {
            failures.push("readiness architecture still includes OpenAI emergency");
          }
          if (!readiness.includes('architecture: ["instacomp_ai"]')) {
            failures.push("readiness does not advertise the single InstaComp AI engine");
          }

          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          console.log("InstaComp-only identity gate PASSED");
          ''')

          Path("scripts/run-instacomp-internal-fail-closed-regressions.ts").write_text(r'''import assert from "node:assert/strict";
          import {
            runInstaCompPrimaryAiFailover,
            type InstaCompAiFailoverError,
          } from "../src/lib/instacomp-ai-provider-failover";

          async function expectFailure(
            operation: Promise<unknown>,
            code: string,
          ) {
            try {
              await operation;
              assert.fail(`Expected ${code}.`);
            } catch (error) {
              const failure = error as InstaCompAiFailoverError;
              assert.equal(failure.code, code);
              return failure;
            }
          }

          async function main() {
            let externalCalls = 0;
            const externalCandidate = {
              provider: "external_identity_reader",
              family: "external",
              configured: true,
              run: async () => {
                externalCalls += 1;
                return { source: "external" };
              },
            };

            await expectFailure(
              runInstaCompPrimaryAiFailover([
                {
                  provider: "instacomp_internal",
                  family: "instacomp_internal",
                  configured: false,
                  run: async () => ({ source: "should_not_run" }),
                },
                externalCandidate,
              ]),
              "INSTACOMP_INTERNAL_ENGINE_NOT_CONFIGURED",
            );
            assert.equal(externalCalls, 0);

            await expectFailure(
              runInstaCompPrimaryAiFailover([
                {
                  provider: "instacomp_internal",
                  family: "instacomp_internal",
                  configured: true,
                  run: async () => {
                    throw new Error("fetch failed: ECONNREFUSED");
                  },
                },
                externalCandidate,
              ]),
              "INSTACOMP_INTERNAL_ENGINE_OFFLINE",
            );
            assert.equal(externalCalls, 0);

            await expectFailure(
              runInstaCompPrimaryAiFailover([
                {
                  provider: "instacomp_internal",
                  family: "instacomp_internal",
                  configured: true,
                  run: async () => {
                    throw new Error(
                      "InstaComp internal engine returned model_unavailable without usable identity evidence.",
                    );
                  },
                },
                externalCandidate,
              ]),
              "INSTACOMP_INTERNAL_ENGINE_SCAN_FAILED",
            );
            assert.equal(externalCalls, 0);

            const internal = await runInstaCompPrimaryAiFailover([
              {
                provider: "instacomp_internal",
                family: "instacomp_internal",
                configured: true,
                run: async () => ({ source: "instacomp_internal" }),
              },
              externalCandidate,
            ]);
            assert.equal(internal.provider, "instacomp_internal");
            assert.equal(externalCalls, 0);

            console.log(
              "InstaComp fail-closed regressions passed: no internal outcome reaches an external identity reader.",
            );
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          ''')

          contract_path = Path("scripts/check-instacomp-local-primary-contract.mjs")
          contract = contract_path.read_text()
          old = '''const internalProvider = route.indexOf('provider: "instacomp_internal"');
          const emergencyProvider = route.indexOf('provider: "openai_emergency"');
          if (internalProvider < 0 || emergencyProvider < 0 || internalProvider >= emergencyProvider) {
            throw new Error(
              "Website provider order must be InstaComp internal first and OpenAI emergency second.",
            );
          }
          if (route.includes('provider: "openai_primary"')) {
            throw new Error("OpenAI may not be configured as the primary card reader.");
          }
          requireText(
            route,
            "const preflightSerialOcrPromise = null;",
            "OpenAI serial vision must not preflight before InstaComp.",
          );
          requireText(
            route,
            'primaryAiResult.family === "openai" && shouldRunSerialVision',
            "OpenAI serial vision must be limited to the emergency OpenAI path.",
          );
          requireText(
            route,
            'primaryAiResult.family !== "instacomp_internal"',
            "Known internal matches must not start the external AI council.",
          );
          '''
          new = '''const internalProvider = route.indexOf('provider: "instacomp_internal"');
          if (internalProvider < 0) {
            throw new Error("Website must use the InstaComp internal identity reader.");
          }
          if (route.includes('provider: "openai_emergency"')) {
            throw new Error("OpenAI emergency may not be an identity reader.");
          }
          requireText(
            route,
            "const serialOcr = null;",
            "External serial identity reading must remain disabled.",
          );
          requireText(
            route,
            "runSecondaryVision: false",
            "External AI council execution must remain disabled.",
          );
          requireText(
            route,
            'requestedTier: "basic"',
            "The external AI council must remain on its zero-reader tier.",
          );
          '''
          if old not in contract:
              raise SystemExit("local-primary provider contract anchor missing")
          contract = contract.replace(old, new, 1)
          contract = contract.replace(
              '''requireText(
            readinessRoute,
            "checklistReady",
            "Production readiness must include the Checklist Registry.",
          );
          ''',
              '''requireText(
            readinessRoute,
            "checklistReady",
            "Production readiness must include the Checklist Registry.",
          );
          requireText(
            readinessRoute,
            "localModelReady",
            "Production readiness must include the InstaComp local model.",
          );
          if (readinessRoute.includes("openAiEmergencyConfigured")) {
            throw new Error("Production readiness may not advertise OpenAI emergency.");
          }
          if (readinessRoute.includes("ollamaBackupReady")) {
            throw new Error("Production readiness must expose the component as InstaComp local model readiness.");
          }
          requireText(
            readinessRoute,
            'architecture: ["instacomp_ai"]',
            "Production readiness must advertise one InstaComp AI engine.",
          );
          ''',
              1,
          )
          contract = contract.replace(
              '''console.log(
            "InstaComp internal memory -> Checklist Registry -> Ollama backup -> OpenAI emergency contract passed.",
          );
          ''',
              '''console.log(
            "InstaComp AI-only identity contract passed.",
          );
          ''',
              1,
          )
          contract_path.write_text(contract)

          test_path = Path("services/instacomp-ai/tests/test_storage_migration.py")
          test_path.write_text(r'''from __future__ import annotations

          import sqlite3

          from app.storage import MemoryStore


          def test_initialize_migrates_legacy_scan_table_before_creating_phash_index(tmp_path):
              database_path = tmp_path / "legacy.sqlite3"
              connection = sqlite3.connect(database_path)
              connection.executescript(
                  """
                  CREATE TABLE scans (
                      scan_id TEXT PRIMARY KEY,
                      created_at TEXT NOT NULL,
                      front_sha256 TEXT NOT NULL,
                      back_sha256 TEXT,
                      image_pair_sha256 TEXT NOT NULL,
                      local_suggestion_json TEXT,
                      checklist_json TEXT NOT NULL,
                      status TEXT NOT NULL
                  );
                  """
              )
              connection.close()

              MemoryStore(database_path).initialize()

              connection = sqlite3.connect(database_path)
              columns = {
                  row[1]
                  for row in connection.execute("PRAGMA table_info(scans)").fetchall()
              }
              indexes = {
                  row[1]
                  for row in connection.execute("PRAGMA index_list(scans)").fetchall()
              }
              connection.close()

              assert {
                  "front_reference_sha256",
                  "back_reference_sha256",
                  "front_perceptual_hash",
                  "back_perceptual_hash",
              }.issubset(columns)
              assert "scans_front_phash_idx" in indexes
          ''')

          workflow_path = Path(".github/workflows/instacomp-local-primary-contract.yml")
          workflow = workflow_path.read_text()
          workflow = workflow.replace(
              '''      - "scripts/check-instacomp-local-primary-contract.mjs"
          ''',
              '''      - "scripts/check-instacomp-local-primary-contract.mjs"
                - "scripts/check-instacomp-provider-fallback.mjs"
          ''',
              1,
          )
          workflow = workflow.replace(
              '''      - name: Internal architecture contract
                run: node scripts/check-instacomp-local-primary-contract.mjs
          ''',
              '''      - name: Internal architecture contract
                run: node scripts/check-instacomp-local-primary-contract.mjs
              - name: InstaComp-only identity gate
                run: node scripts/check-instacomp-provider-fallback.mjs
          ''',
              1,
          )
          workflow_path.write_text(workflow)

          print("InstaComp-only repair applied")
          PY
