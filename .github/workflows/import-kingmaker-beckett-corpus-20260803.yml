name: Import KINGMAKER Beckett Corpus 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-kingmaker-beckett-corpus-20260803.yml"
      - "scripts/ops/import-kingmaker-beckett-corpus-20260803.mjs"
      - "scripts/ops/import-kingmaker-beckett-corpus-20260803.ready"

permissions:
  contents: read

concurrency:
  group: import-kingmaker-beckett-corpus-20260803
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: ops/import-kingmaker-beckett-corpus-20260803
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  GH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GH_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  DRIVE_FILE_ID: 1uBtwoVY9CNl7aO6-eDeXnFZLSLSRgXQa
  EVIDENCE_DIR: evidence/kingmaker-beckett-production-import-20260803

jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = '.github/workflows/import-kingmaker-beckett-corpus-20260803.yml'
          test "${changed[1]}" = 'scripts/ops/import-kingmaker-beckett-corpus-20260803.mjs'
          test "${changed[2]}" = 'scripts/ops/import-kingmaker-beckett-corpus-20260803.ready'
          git diff --check origin/main...HEAD
          cp scripts/ops/import-kingmaker-beckett-corpus-20260803.mjs "$RUNNER_TEMP/import.mjs"
          git checkout --detach origin/main
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/import.mjs" scripts/ops/import-kingmaker-beckett-corpus-20260803.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --no-cache-dir gdown
          sudo apt-get update
          sudo apt-get install --yes unzip

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          [ -z "${GH_SUPABASE_SERVICE_ROLE_KEY:-}" ] || echo "::add-mask::$GH_SUPABASE_SERVICE_ROLE_KEY"
          [ -z "${GH_SUPABASE_SERVICE_KEY:-}" ] || echo "::add-mask::$GH_SUPABASE_SERVICE_KEY"
          mkdir -p .vercel "$RUNNER_TEMP/prod"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/prod/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/prod/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/prod/production.env" >> "$GITHUB_ENV"

      - name: Download encrypted corpus
        shell: bash
        run: |
          set -euo pipefail
          gdown "$DRIVE_FILE_ID" -O "$RUNNER_TEMP/corpus.tar"
          echo 'd36d658f415283a313268b10ac55894844fb22e39a62d02d99ac94f844a29bc0  '"$RUNNER_TEMP/corpus.tar" | sha256sum --check

      - name: Decrypt, stage, match, and verify
        shell: bash
        env:
          ALLOW_KINGMAKER_BECKETT_IMPORT: "YES"
          ENCRYPTED_TAR_PATH: ${{ runner.temp }}/corpus.tar
          WORK_DIR: ${{ runner.temp }}/beckett-import
          RECEIPT_PATH: evidence/kingmaker-beckett-production-import-20260803/receipt.json
        run: node scripts/ops/import-kingmaker-beckett-corpus-20260803.mjs

      - name: Require passing receipt
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'evidence/kingmaker-beckett-production-import-20260803/receipt.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.status !== 'passed') throw new Error('Import failed');
          if (r.certifiedCorpus?.guides !== 5 || r.certifiedCorpus?.pages !== 642 || r.certifiedCorpus?.rows !== 128636) throw new Error('Corpus mismatch');
          if (r.production?.entries < 128636 || r.production?.promoted !== 0) throw new Error('Production verification failed');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: kingmaker-beckett-production-import-20260803
          path: evidence/kingmaker-beckett-production-import-20260803/receipt.json
          if-no-files-found: error
          retention-days: 30
