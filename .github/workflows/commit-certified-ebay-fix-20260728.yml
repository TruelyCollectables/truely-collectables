name: Commit Certified eBay Fix 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/commit-certified-ebay-fix-20260728.yml"

permissions:
  contents: write

jobs:
  commit-certified-files:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/diagnose-stable-ebay-differences-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnose-stable-ebay-differences-20260728
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply previously certified production patch
        run: |
          set -euo pipefail
          python scripts/temporary_apply_stable_ebay_difference_repair.py
          git diff --check
      - name: Remove temporary certification files
        run: |
          rm -f \
            scripts/temporary_apply_stable_ebay_difference_repair.py \
            .github/workflows/one-time-diagnose-stable-ebay-differences-20260728.yml \
            .github/workflows/one-time-diagnose-stable-ebay-differences-v2-20260728.yml \
            .github/workflows/diagnose-stable-ebay-difference-writer-20260728.yml \
            .github/workflows/certify-stable-ebay-difference-repair-20260728.yml \
            .github/workflows/materialize-certified-ebay-fix-20260728.yml \
            .github/workflows/materialize-certified-ebay-fix-v2-20260728.yml \
            .github/workflows/commit-certified-ebay-fix-20260728.yml
          git checkout -- \
            scripts/run-storefront-taxonomy-regressions.ts \
            scripts/run-ebay-import-admin-client-simulations.ts
      - name: Commit certified production files
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Diagnose and stabilize eBay inventory differences"
          git push origin HEAD:agent/diagnose-stable-ebay-differences-20260728
