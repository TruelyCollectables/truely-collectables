name: Validate Tracked Credential Removal 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-secret-removal-20260729.yml"
      - ".gitignore"
      - "ENV_BACKUP_DO_NOT_DELETE.txt"

permissions:
  contents: write

concurrency:
  group: validate-secret-removal-20260729
  cancel-in-progress: true

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-only-placeholder-admin-password
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-leaked-vercel-backup-20260729
          fetch-depth: 0

      - name: Verify narrow remediation diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              .gitignore|ENV_BACKUP_DO_NOT_DELETE.txt|.github/workflows/validate-secret-removal-20260729.yml) ;;
              *) echo "Unexpected remediation file: $file" >&2; exit 1 ;;
            esac
          done
          if git ls-files --error-unmatch ENV_BACKUP_DO_NOT_DELETE.txt >/dev/null 2>&1; then
            echo "Credential backup remains tracked" >&2
            exit 1
          fi
          grep -Fxq '/ENV_BACKUP_DO_NOT_DELETE.txt' .gitignore

      - name: Scan every tracked text file for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const files = execFileSync('git', ['ls-files', '-z']).toString('utf8').split('\0').filter(Boolean);
          const textExtensions = new Set(['.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.md','.mdx','.sql','.css','.scss','.html','.xml','.yml','.yaml','.toml','.sh','.txt','.csv','.tsv','.graphql','.gql','.prisma']);
          const patterns = [
            ['stripe_secret', /sk_(?:live|test)_[A-Za-z0-9_-]{16,}/g],
            ['stripe_webhook_secret', /whsec_[A-Za-z0-9_-]{16,}/g],
            ['github_token', /gh[pousr]_[A-Za-z0-9_]{20,}/g],
            ['private_key', /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/g],
            ['aws_key', /AKIA[0-9A-Z]{16}/g],
            ['jwt', /eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}/g],
          ];
          const findings = [];
          for (const file of files) {
            const ext = path.extname(file).toLowerCase();
            if (!textExtensions.has(ext) && !file.endsWith('.env.example') && !['Dockerfile','Procfile','LICENSE'].includes(path.basename(file))) continue;
            let text;
            try {
              const stat = fs.statSync(file);
              if (!stat.isFile() || stat.size > 3000000) continue;
              text = fs.readFileSync(file, 'utf8');
            } catch { continue; }
            const lower = `${file}\n${text}`.toLowerCase();
            const fixture = /fixture|example|placeholder|mock|test|simulation/.test(lower);
            for (const [name, regex] of patterns) {
              regex.lastIndex = 0;
              for (const match of text.matchAll(regex)) {
                const value = match[0];
                if (/placeholder|example|build.only|test.fixture/i.test(value) || fixture) continue;
                findings.push({ name, file });
              }
            }
          }
          if (findings.length) {
            console.error(JSON.stringify(findings, null, 2));
            process.exit(1);
          }
          console.log(`Secret scan passed across ${files.length} tracked files.`);
          NODE

      - name: Install exact dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run standalone TypeScript check
        run: npx tsc --noEmit

      - name: Run full Production build
        run: npm run build

      - name: Remove one-time validation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-secret-removal-20260729.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-secret-removal-20260729.yml
          git commit -m "Remove one-time credential-removal validation workflow"
          git push origin HEAD:agent/remove-leaked-vercel-backup-20260729
