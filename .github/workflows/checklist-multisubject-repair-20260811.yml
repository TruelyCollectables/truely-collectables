name: Checklist Multi-Subject Repair 20260811

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/checklist-multisubject-repair-20260811.yml"
      - "ops/checklist-multisubject-repair-20260811.txt"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/checklist-multisubject-cards-20260811'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch source-proven multi-subject card handling
        shell: python3 {0}
        run: |
          from pathlib import Path
          p = Path('scripts/mainstream-checklist/source-tools.mjs')
          text = p.read_text('utf-8')

          anchor = '''function parseCardFromCells(cells) {'''
          helper = r'''function explicitlyMultiSubjectSet(name) {
  const text = normalized(name).toLowerCase();
  if (!text) return false;
  const multi = /\b(?:dual|triple|quad|quartet|quint(?:uple)?|sextet|six[- ]?way|octet|eight[- ]?way|multi(?:ple)?|combo|combination|pairing|book|booklet|ensemble)\b/i.test(text);
  const hitType = /\b(?:autograph|signature|signed|relic|memorabilia|patch|swatch|jersey|book|booklet)\b/i.test(text);
  return multi && hitType;
}

function parseCardFromCells(cells) {'''
          if anchor not in text:
              raise SystemExit('parseCardFromCells anchor missing')
          text = text.replace(anchor, helper, 1)

          old_status = '''      const setType = inferSetType(setName);
      cards.push({'''
          new_status = '''      const setText = normalized(setName).toLowerCase();
      const hasAutograph = /autograph|signature|signed/.test(setText);
      const hasMemorabilia = /relic|memorabilia|patch|swatch|jersey/.test(setText);
      cards.push({'''
          if old_status not in text:
              raise SystemExit('setType anchor missing')
          text = text.replace(old_status, new_status, 1)
          text = text.replace('''        autographStatus: setType === "autograph" ? "autograph" : "non-auto",
        memorabiliaStatus:
          setType === "memorabilia" ? "memorabilia" : "non-memorabilia",''', '''        autographStatus: hasAutograph ? "autograph" : "non-auto",
        memorabiliaStatus: hasMemorabilia ? "memorabilia" : "non-memorabilia",''', 1)

          old_dedupe = '''  const deduped = [];
  const exact = new Set();
  const byNumber = new Map();
  for (const card of cards) {
    const subject = card.players
      .map((value) => value.toLowerCase())
      .sort()
      .join("+");
    const numberKey = `${card.setName.toLowerCase()}::${card.cardNumber.toLowerCase()}`;
    const exactKey = `${numberKey}::${subject}`;
    if (exact.has(exactKey)) continue;
    exact.add(exactKey);
    const prior = byNumber.get(numberKey);
    if (prior && prior !== subject) {
      errors.push({
        code: "reference_card_number_subject_conflict",
        severity: "error",
        message: `${card.setName} #${card.cardNumber} maps to conflicting subjects.`,
      });
      continue;
    }
    byNumber.set(numberKey, subject);
    deduped.push(card);
  }'''
          new_dedupe = '''  const deduped = [];
  const exact = new Set();
  const byNumber = new Map();
  for (const card of cards) {
    const subject = card.players
      .map((value) => value.toLowerCase())
      .sort()
      .join("+");
    const numberKey = `${card.setName.toLowerCase()}::${card.cardNumber.toLowerCase()}`;
    const exactKey = `${numberKey}::${subject}`;
    if (exact.has(exactKey)) continue;
    exact.add(exactKey);
    const prior = byNumber.get(numberKey);
    if (prior && prior.subject !== subject) {
      const sameVariation = normalized(prior.card.variation || "") === normalized(card.variation || "");
      if (sameVariation && explicitlyMultiSubjectSet(card.setName)) {
        prior.card.players = [...new Set([...prior.card.players, ...card.players])];
        prior.card.teams = [...new Set([...prior.card.teams, ...card.teams])];
        prior.card.rookieDesignation = prior.card.rookieDesignation || card.rookieDesignation;
        prior.card.firstBowmanDesignation = prior.card.firstBowmanDesignation || card.firstBowmanDesignation;
        if (card.autographStatus === "autograph") prior.card.autographStatus = "autograph";
        if (card.memorabiliaStatus === "memorabilia") prior.card.memorabiliaStatus = "memorabilia";
        prior.card.sourceNotes = normalized(`${prior.card.sourceNotes}; ${card.sourceNotes}; source-proven multi-subject card`);
        prior.subject = prior.card.players
          .map((value) => value.toLowerCase())
          .sort()
          .join("+");
        continue;
      }
      errors.push({
        code: "reference_card_number_subject_conflict",
        severity: "error",
        message: `${card.setName} #${card.cardNumber} maps to conflicting subjects.`,
      });
      continue;
    }
    byNumber.set(numberKey, { subject, card });
    deduped.push(card);
  }'''
          if old_dedupe not in text:
              raise SystemExit('dedupe anchor missing')
          text = text.replace(old_dedupe, new_dedupe, 1)

          old_return = '''  return {
    status: "passed",
    cards: parsed.cards.length,
    parallels: parsed.parallels.length,
    metadataRowsIgnored: true,
    nestedSectionsPreserved: true,
  };'''
          new_return = '''  const multiAuto = parseChecklist(
    { minimumCardRows: 1 },
    [
      "## Ultimate Autograph Book Card",
      "UAC-1 | Alpha Player | Team A",
      "UAC-1 | Beta Player | Team B",
      "UAC-1 | Gamma Player | Team C",
    ].join("\\n"),
  );
  if (multiAuto.errors.length || multiAuto.cards.length !== 1 || multiAuto.cards[0].players.length !== 3 || multiAuto.cards[0].autographStatus !== "autograph") {
    throw new Error(`Multi-subject autograph parser self-test failed: ${JSON.stringify(multiAuto)}`);
  }

  const multiMem = parseChecklist(
    { minimumCardRows: 1 },
    [
      "## Dual Patch Memorabilia",
      "DPM-1 | Alpha Player | Team A",
      "DPM-1 | Beta Player | Team B",
    ].join("\\n"),
  );
  if (multiMem.errors.length || multiMem.cards.length !== 1 || multiMem.cards[0].players.length !== 2 || multiMem.cards[0].memorabiliaStatus !== "memorabilia") {
    throw new Error(`Multi-subject memorabilia parser self-test failed: ${JSON.stringify(multiMem)}`);
  }

  const autoRelic = parseChecklist(
    { minimumCardRows: 1 },
    [
      "## Dual Autograph Patch Booklet",
      "DAPB-1 | Alpha Player | Team A",
      "DAPB-1 | Beta Player | Team B",
    ].join("\\n"),
  );
  if (autoRelic.errors.length || autoRelic.cards.length !== 1 || autoRelic.cards[0].autographStatus !== "autograph" || autoRelic.cards[0].memorabiliaStatus !== "memorabilia") {
    throw new Error(`Multi-subject auto-memorabilia parser self-test failed: ${JSON.stringify(autoRelic)}`);
  }

  const ordinaryConflict = parseChecklist(
    { minimumCardRows: 1 },
    [
      "## Base Set",
      "1 | Alpha Player",
      "1 | Beta Player",
    ].join("\\n"),
  );
  if (!ordinaryConflict.errors.some((issue) => issue.code === "reference_card_number_subject_conflict")) {
    throw new Error(`Ordinary conflict guard was weakened: ${JSON.stringify(ordinaryConflict)}`);
  }

  return {
    status: "passed",
    cards: parsed.cards.length,
    parallels: parsed.parallels.length,
    metadataRowsIgnored: true,
    nestedSectionsPreserved: true,
    multiSubjectCardsSupported: true,
  };'''
          if old_return not in text:
              raise SystemExit('self-test return anchor missing')
          text = text.replace(old_return, new_return, 1)
          p.write_text(text, 'utf-8')

      - name: Install exact dependencies
        run: npm ci

      - name: Prove parser and build contract
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import { parseChecklist, runParserSelfTest } from './scripts/mainstream-checklist/source-tools.mjs';
          console.log(JSON.stringify(runParserSelfTest()));
          const book = parseChecklist({minimumCardRows:1}, ['## Ultimate Autograph Book Card','UAC-1 | A One','UAC-1 | B Two','UAC-1 | C Three'].join('\n'));
          if (book.errors.length || book.cards.length !== 1 || book.cards[0].players.length !== 3) throw new Error(JSON.stringify(book));
          const combo = parseChecklist({minimumCardRows:1}, ['## Quad Autograph Memorabilia Booklet','QAMB-1 | A One','QAMB-1 | B Two','QAMB-1 | C Three','QAMB-1 | D Four'].join('\n'));
          if (combo.errors.length || combo.cards[0].autographStatus !== 'autograph' || combo.cards[0].memorabiliaStatus !== 'memorabilia') throw new Error(JSON.stringify(combo));
          const conflict = parseChecklist({minimumCardRows:1}, ['## Base Set','1 | A One','1 | B Two'].join('\n'));
          if (!conflict.errors.some(x => x.code === 'reference_card_number_subject_conflict')) throw new Error('ordinary conflict guard weakened');
          NODE
          npx tsc --noEmit --pretty false

      - name: Commit permanent source fix and remove one-shot plumbing
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/checklist-multisubject-repair-20260811.yml ops/checklist-multisubject-repair-20260811.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mainstream-checklist/source-tools.mjs .github/workflows/checklist-multisubject-repair-20260811.yml ops/checklist-multisubject-repair-20260811.txt
          git commit -m "Support source-proven multi-subject checklist cards"
          git push origin HEAD:${GITHUB_HEAD_REF}
