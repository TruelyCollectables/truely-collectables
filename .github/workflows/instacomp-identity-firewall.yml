name: InstaComp Identity Firewall

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-harden-and-validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.head_ref == 'fix/instacomp-identity-firewall' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      IP_INTELLIGENCE_REQUIRED: "false"
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-identity-firewall
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic identity firewall
        run: python3 scripts/apply-instacomp-identity-firewall.py

      - name: Run identity firewall regressions
        run: npx tsx scripts/run-instacomp-identity-firewall-regressions.ts

      - name: Run serial and color regressions
        run: npx tsx scripts/run-instacomp-serial-color-gate-regressions.ts

      - name: Run evidence-first regressions
        run: npx tsx scripts/run-instacomp-evidence-first-regressions.ts

      - name: Run adversarial V2 simulations
        run: npx tsx scripts/run-instacomp-v2-hardening-simulations.ts

      - name: Run scan review simulations
        run: npx tsx scripts/run-instacomp-scan-review-simulations.ts

      - name: Run checklist complexity simulations
        run: npx tsx scripts/run-checklist-complexity-simulations.ts

      - name: Lint identity firewall boundary
        run: >-
          npx eslint
          src/lib/instacomp-learning-server.ts
          src/lib/instacomp-consensus.ts
          src/app/api/instacomp/scan/route.ts
          scripts/run-instacomp-identity-firewall-regressions.ts
          scripts/run-instacomp-serial-color-gate-regressions.ts
          scripts/run-instacomp-v2-hardening-simulations.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated firewall implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/instacomp-learning-server.ts \
            src/lib/instacomp-consensus.ts \
            src/app/api/instacomp/scan/route.ts
          if ! git diff --cached --quiet; then
            git commit -m "Harden InstaComp exact identity firewall"
            git push origin HEAD:fix/instacomp-identity-firewall
          fi
