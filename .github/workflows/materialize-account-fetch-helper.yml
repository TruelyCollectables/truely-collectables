name: Materialize Buyer Account Fetch Helper

on:
  push:
    branches:
      - fix/buyer-account-session-refresh-20260730
    paths:
      - "scripts/apply-account-fetch-helper.mjs"
      - ".github/workflows/materialize-account-fetch-helper.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/buyer-account-session-refresh-20260730
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace direct buyer account fetch calls
        run: node scripts/apply-account-fetch-helper.mjs
      - name: Commit materialized account dashboard
        run: |
          set -euo pipefail
          git add src/app/account/page.tsx
          if git diff --cached --quiet; then
            echo "Buyer account dashboard already uses the authenticated fetch helper."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use refreshed sessions for all buyer account requests"
          git push origin HEAD:fix/buyer-account-session-refresh-20260730
