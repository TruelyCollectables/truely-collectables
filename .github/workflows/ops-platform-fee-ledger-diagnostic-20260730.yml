name: Ops Platform Fee Ledger Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-platform-fee-ledger-diagnostic-20260730.yml"

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: 12b1988c7a0a822303ee77ba80b56c75c339c33c
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'ops/launch2-issue253-production-apply-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin exact source and derive Production database
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/platform-fee-diagnostic"
          npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/platform-fee-diagnostic/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(`${process.env.RUNNER_TEMP}/platform-fee-diagnostic/production.env`, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            parsed[key] = value;
          }
          const url = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '').trim();
          if (!/^https:\/\//.test(url)) throw new Error('Production Supabase URL unavailable.');
          const projectRef = new URL(url).hostname.split('.')[0];
          if (!projectRef) throw new Error('Production Supabase project ref unavailable.');
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_SUPABASE_PROJECT_REF=${projectRef}\n`);
          NODE

      - name: Query only aggregate schema and row state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PRODUCTION_SUPABASE_PROJECT_REF}/database/query`;
          const sql = `
            select json_build_object(
              'table_exists', to_regclass('public.platform_fee_ledger_entries') is not null,
              'columns', coalesce((
                select json_agg(json_build_object('name', column_name, 'type', data_type, 'nullable', is_nullable) order by ordinal_position)
                from information_schema.columns
                where table_schema='public' and table_name='platform_fee_ledger_entries'
                  and column_name in ('id','store_id','source_type','seller_account_id')
              ), '[]'::json),
              'required_column_count', (
                select count(*) from information_schema.columns
                where table_schema='public' and table_name='platform_fee_ledger_entries'
                  and column_name in ('id','store_id','source_type','seller_account_id')
              ),
              'matching_direct_store_rows', case when to_regclass('public.platform_fee_ledger_entries') is null then null else (
                select count(*) from public.platform_fee_ledger_entries
                where source_type='tcos_website_checkout' and seller_account_id is null
              ) end,
              'total_rows', case when to_regclass('public.platform_fee_ledger_entries') is null then null else (select count(*) from public.platform_fee_ledger_entries) end,
              'captured_at', now()
            ) as receipt;`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: sql, parameters: [], read_only: true }),
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Diagnostic query HTTP ${response.status}: ${body.slice(0, 1000)}`);
          const rows = body ? JSON.parse(body) : [];
          const receipt = (Array.isArray(rows) ? rows[0]?.receipt : rows?.receipt) || rows;
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'platform-fee-diagnostic', 'platform-fee-ledger-receipt.json'), JSON.stringify({ exactMainSha: process.env.EXPECTED_MAIN_SHA, receipt, aggregateOnly: true, capturedAt: new Date().toISOString() }, null, 2));
          console.log(JSON.stringify(receipt));
          NODE
          rm -f "$RUNNER_TEMP/platform-fee-diagnostic/production.env"

      - uses: actions/upload-artifact@v4
        with:
          name: platform-fee-ledger-diagnostic-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ runner.temp }}/platform-fee-diagnostic
          if-no-files-found: error
          retention-days: 14
