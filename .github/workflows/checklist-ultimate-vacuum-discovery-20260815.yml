name: Checklist Ultimate Vacuum Discovery 20260815

on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/checklist-ultimate-vacuum-discovery-20260815.yml'
      - 'scripts/mainstream-checklist/ultimate-vacuum-discovery.mjs'
      - 'scripts/mainstream-checklist/ultimate-vacuum-source-router.mjs'
      - 'scripts/mainstream-checklist/ultimate-vacuum-human-handoff.mjs'
      - 'ops/checklists/ultimate-vacuum-source-policy-20260815.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Ultimate Vacuum: discovery only. Production persistence remains behind the strict checklist validator.
jobs:
  discover:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify vacuum scripts
        run: |
          node --check scripts/mainstream-checklist/ultimate-vacuum-discovery.mjs
          node --check scripts/mainstream-checklist/ultimate-vacuum-source-router.mjs
          node --check scripts/mainstream-checklist/ultimate-vacuum-human-handoff.mjs

      - name: Cast shard across checklist sources
        shell: bash
        env:
          VACUUM_SHARD_INDEX: ${{ matrix.shard }}
          VACUUM_SHARD_COUNT: '8'
          VACUUM_MAX_PAGES: '450'
          VACUUM_MAX_SITEMAPS_PER_HOST: '40'
          VACUUM_REQUEST_TIMEOUT_MS: '12000'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ultimate-vacuum-${{ matrix.shard }}"
          mkdir -p "$root"
          VACUUM_DISCOVERY_OUTPUT="$root/discovery.json" \
          VACUUM_EVENTS_OUTPUT="$root/events.ndjson" \
          node scripts/mainstream-checklist/ultimate-vacuum-discovery.mjs
          test -s "$root/discovery.json"
          jq -e '.schema=="tcos.checklist.ultimateVacuumDiscovery.v1"' "$root/discovery.json" >/dev/null

      - name: Rank live discoveries and negative-cache junk
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ultimate-vacuum-${{ matrix.shard }}"
          cp ops/checklists/ultimate-vacuum-source-state-20260815.json "$root/state.json"
          VACUUM_STATE="$root/state.json" \
          VACUUM_EVENTS="$root/events.ndjson" \
          VACUUM_CANDIDATES="$root/discovery.json" \
          VACUUM_OUTPUT="$root/ranked.json" \
          node scripts/mainstream-checklist/ultimate-vacuum-source-router.mjs
          test -s "$root/ranked.json"
          jq '{generatedAt,candidateCount,rankedCount,skippedCount,top:.ranked[:20]}' "$root/ranked.json"

      - name: Upload shard discoveries
        uses: actions/upload-artifact@v4
        with:
          name: checklist-ultimate-vacuum-discovery-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ultimate-vacuum-${{ matrix.shard }}
          retention-days: 30

  aggregate-learning:
    needs: discover
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all successful shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checklist-ultimate-vacuum-discovery-${{ github.run_id }}-shard-*
          path: ${{ runner.temp }}/vacuum-shards

      - name: Merge outcomes, persist learning, and build human handoff
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vacuum-shards"
          all="$RUNNER_TEMP/ultimate-vacuum-all-events.ndjson"
          : > "$all"
          find "$root" -type f -name events.ndjson -print0 | sort -z | xargs -0 -r cat >> "$all"

          cp ops/checklists/ultimate-vacuum-source-state-20260815.json "$RUNNER_TEMP/merged-vacuum-state.json"
          printf '{"candidates":[]}\n' > "$RUNNER_TEMP/empty-vacuum-candidates.json"
          VACUUM_STATE="$RUNNER_TEMP/merged-vacuum-state.json" \
          VACUUM_EVENTS="$all" \
          VACUUM_CANDIDATES="$RUNNER_TEMP/empty-vacuum-candidates.json" \
          VACUUM_OUTPUT="$RUNNER_TEMP/merged-vacuum-ranked.json" \
          node scripts/mainstream-checklist/ultimate-vacuum-source-router.mjs

          VACUUM_EVENTS="$all" \
          VACUUM_HUMAN_HANDOFF_OUTPUT="ops/checklists/ultimate-vacuum-human-handoff-20260815.json" \
          node scripts/mainstream-checklist/ultimate-vacuum-human-handoff.mjs

          cp "$RUNNER_TEMP/merged-vacuum-state.json" ops/checklists/ultimate-vacuum-source-state-20260815.json
          jq '{generatedAt,totalBlockedUrls,actionableCount,skipCount,counts}' ops/checklists/ultimate-vacuum-human-handoff-20260815.json

      - name: Persist source learning and handoff queue without retriggering vacuum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TCOS Ultimate Vacuum"
          git config user.email "david@truelycollectables.com"
          git add ops/checklists/ultimate-vacuum-source-state-20260815.json ops/checklists/ultimate-vacuum-human-handoff-20260815.json
          if git diff --cached --quiet; then
            echo "Vacuum learning unchanged"
          else
            git commit -m "checklists: persist vacuum learning $GITHUB_RUN_ID"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload merged learning and human handoff
        uses: actions/upload-artifact@v4
        with:
          name: checklist-ultimate-vacuum-learning-${{ github.run_id }}
          path: |
            ops/checklists/ultimate-vacuum-source-state-20260815.json
            ops/checklists/ultimate-vacuum-human-handoff-20260815.json
            ${{ runner.temp }}/ultimate-vacuum-all-events.ndjson
          retention-days: 30
