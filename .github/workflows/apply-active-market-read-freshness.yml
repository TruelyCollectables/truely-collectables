name: Apply Active Market Read Freshness

on:
  push:
    branches:
      - agent/quarantine-stale-active-market-results
    paths:
      - "scripts/apply-active-market-read-freshness.mjs"
      - ".github/workflows/apply-active-market-read-freshness.yml"

permissions:
  contents: write

jobs:
  apply-read-freshness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply read freshness quarantine
        run: node scripts/apply-active-market-read-freshness.mjs

      - name: Validate patch
        run: git diff --check

      - name: Commit patched production files
        run: |
          if git diff --quiet; then
            echo "Read freshness quarantine was already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/account/seller/inventory/active-pricing/route.ts src/app/seller/inventory/SellerActiveInventoryPricing.tsx
          git commit -m "Quarantine stale Active Market results on load"
          git push origin HEAD:${{ github.ref_name }}
