name: Apply Titanic Final Hardening Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".audit/titanic-hardening.patch"
      - ".github/workflows/apply-titanic-final-patch.yml"

permissions:
  contents: write

jobs:
  apply-final-hardening:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/emergency-post-launch-audit-fixes-20260726
          fetch-depth: 0

      - name: Apply reviewed patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          test -f .audit/titanic-hardening.patch
          git apply --check .audit/titanic-hardening.patch
          git apply .audit/titanic-hardening.patch
          rm .audit/titanic-hardening.patch
          rmdir .audit 2>/dev/null || true
          rm .github/workflows/apply-titanic-final-patch.yml
          git config user.name "Truely Collectables Audit"
          git config user.email "sales@truelycollectables.com"
          git add -A
          git commit -m "Finalize Titanic storefront hardening"
          git push origin HEAD:agent/emergency-post-launch-audit-fixes-20260726
