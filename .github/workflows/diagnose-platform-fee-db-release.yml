name: Diagnose Platform Fee DB Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-platform-fee-db-release.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect live database migration application references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MANAGEMENT API SQL REFERENCES ==='
          grep -RInE \
            'api\.supabase\.com/v1/projects|database/query|supabase_migrations|schema_migrations|migration.*apply|apply.*migration|db push|migration up' \
            . --exclude-dir=.git --exclude='package-lock.json' 2>/dev/null \
            | head -3000 || true
          echo '=== PACKAGE DATABASE COMMANDS ==='
          node -e '
            const p=require("./package.json");
            for (const [k,v] of Object.entries(p.scripts||{})) {
              if (/supabase|database|migration|schema|bootstrap/i.test(`${k} ${v}`)) console.log(`${k}=${v}`);
            }
          '