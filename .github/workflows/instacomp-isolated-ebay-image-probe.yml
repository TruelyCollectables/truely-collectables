name: InstaComp Isolated eBay Image Probe

on:
  push:
    branches:
      - agent/instacomp-live-torture-isolated-20260727
    paths:
      - ".github/workflows/instacomp-isolated-ebay-image-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: instacomp-isolated-ebay-image-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Open run tracking issue
        id: tracking
        run: |
          ISSUE_NUMBER="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="InstaComp isolated image probe run ${GITHUB_RUN_ID}" \
            -f body="Pinned to commit \`${GITHUB_SHA}\`. Probing SerpApi and public eBay item pages for multiple listing images." \
            --jq .number)"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check out pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe SerpApi and public listing paths
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          async function main() {
            const query = "2024-25 Upper Deck Series 1 Lane Hutson Young Guns 229";
            const search = new URL("https://serpapi.com/search.json");
            search.searchParams.set("engine", "ebay");
            search.searchParams.set("ebay_domain", "ebay.com");
            search.searchParams.set("_nkw", query);
            search.searchParams.set("_ipg", "10");
            search.searchParams.set("api_key", process.env.SERPAPI_API_KEY);
            const response = await fetch(search, { signal: AbortSignal.timeout(45000) });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.error) throw new Error(String(payload.error || response.statusText));
            const rows = Array.isArray(payload.organic_results) ? payload.organic_results : [];
            const first = rows.find((row) => row && row.link && row.title);
            if (!first) throw new Error("SerpApi returned no usable listing row.");

            function imageFields(value, path = "root", depth = 0, out = []) {
              if (depth > 6 || value == null) return out;
              if (typeof value === "string") {
                if (/image|photo|picture|thumb|gallery/i.test(path) || (/^https?:\/\//i.test(value) && /ebayimg|image/i.test(value))) {
                  out.push({ path, value: value.slice(0, 1200) });
                }
                return out;
              }
              if (Array.isArray(value)) {
                value.forEach((item, index) => imageFields(item, `${path}[${index}]`, depth + 1, out));
                return out;
              }
              if (typeof value === "object") {
                Object.entries(value).forEach(([key, item]) => imageFields(item, `${path}.${key}`, depth + 1, out));
              }
              return out;
            }

            const listingUrl = String(first.link);
            const attempts = [];
            async function fetchText(label, url) {
              try {
                const res = await fetch(url, {
                  redirect: "follow",
                  headers: {
                    "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
                    "accept-language": "en-US,en;q=0.9",
                    accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  },
                  signal: AbortSignal.timeout(30000),
                });
                const text = await res.text();
                const urls = Array.from(new Set(text.match(/https?:\\?\/\\?\/[^"'<> ]+(?:jpg|jpeg|png|webp)(?:\?[^"'<> ]*)?/gi) || []))
                  .map((url) => url.replaceAll("\\/", "/"))
                  .filter((url) => /ebayimg|i\.ebayimg/i.test(url));
                const pictureIds = Array.from(new Set(urls.map((url) => url.match(/\/images\/g\/([^/]+)\//)?.[1]).filter(Boolean)));
                attempts.push({ label, url, status: res.status, finalUrl: res.url, length: text.length, imageUrlCount: urls.length, pictureIdCount: pictureIds.length, urls: urls.slice(0, 30), pictureIds: pictureIds.slice(0, 30), first500: text.slice(0, 500) });
              } catch (error) {
                attempts.push({ label, url, error: error instanceof Error ? error.message : String(error) });
              }
            }

            const parsed = new URL(listingUrl);
            await fetchText("ebay_item", listingUrl);
            await fetchText("ebay_item_query", `${listingUrl}${listingUrl.includes("?") ? "&" : "?"}mkevt=1&mkcid=1&mkrid=711-53200-19255-0`);
            await fetchText("jina_http", `https://r.jina.ai/http://${parsed.host}${parsed.pathname}`);
            await fetchText("jina_https", `https://r.jina.ai/https://${parsed.host}${parsed.pathname}`);

            const report = {
              query,
              serpStatus: response.status,
              organicCount: rows.length,
              firstResultKeys: Object.keys(first),
              firstResult: {
                title: first.title,
                link: first.link,
                productId: first.product_id || null,
                imageFields: imageFields(first),
              },
              attempts,
            };
            fs.writeFileSync("instacomp-ebay-public-image-source-probe.json", `${JSON.stringify(report, null, 2)}\n`);
            console.log(JSON.stringify({
              firstResultKeys: report.firstResultKeys,
              imageFields: report.firstResult.imageFields,
              attempts: attempts.map(({ label, status, length, imageUrlCount, pictureIdCount, error }) => ({ label, status, length, imageUrlCount, pictureIdCount, error })),
            }, null, 2));
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-isolated-ebay-image-probe-${{ github.run_number }}
          path: instacomp-ebay-public-image-source-probe.json
          if-no-files-found: error
          retention-days: 7

      - name: Close tracking issue with result
        if: always()
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ steps.tracking.outputs.issue_number }}/comments" \
            -f body="Probe job completed with status **${{ job.status }}**. Actions run: ${GITHUB_RUN_ID}."
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${{ steps.tracking.outputs.issue_number }}" \
            -f state=closed
