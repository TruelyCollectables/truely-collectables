name: CollX Indexed Production Publish 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-indexed-production-publish-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collx-indexed-production-publish-20260811
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"
      EXPECTED_ELIGIBLE: "6011"
    steps:
      - name: Publish indexed CollX inventory atomically
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, subprocess, sys, time

          API = "https://api.supabase.com/v1"
          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          STORE = os.environ["FLAGSHIP_STORE_ID"]
          EXPECTED = int(os.environ["EXPECTED_ELIGIBLE"])
          BATCH = 100

          def request(method, path, body=None, timeout=60):
              cmd=["curl","-sS","--max-time",str(timeout),"-X",method,
                   "-H",f"Authorization: Bearer {TOKEN}",
                   "-H","Accept: application/json","-H","Content-Type: application/json",
                   "-o","/tmp/sb.json","-w","%{http_code}",API+path]
              if body is not None:
                  cmd += ["--data-binary", json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              raw=""
              try: raw=open('/tmp/sb.json').read()
              except Exception: pass
              try: payload=json.loads(raw) if raw else None
              except Exception: payload=raw
              try: status=int((p.stdout or '0').strip()[-3:])
              except Exception: status=599
              if p.returncode != 0 and status == 0:
                  status,payload=599,{"error":p.stderr.strip()}
              return status,payload

          s,projects=request('GET','/projects',timeout=30)
          if s!=200 or not isinstance(projects,list):
              print('PROJECT_LIST_FAILURE',s,projects); raise SystemExit(2)
          candidates=[p for p in projects if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(candidates)!=1:
              print('PROJECT_CANDIDATES',json.dumps(candidates,default=str)); raise SystemExit(3)
          ref=str(candidates[0].get('id') or candidates[0].get('ref') or '')
          print('PROJECT_REF='+ref)
          print('PROJECT_STATUS='+str(candidates[0].get('status')))

          def sql(query, timeout=60):
              return request('POST',f'/projects/{ref}/database/query',{'query':query,'parameters':[],'read_only':False},timeout)

          # Refresh planner stats before the indexed write path. Failure is non-fatal;
          # the actual publisher never depends on a full-table aggregate.
          ast,abody=sql('ANALYZE public.inventory_items; ANALYZE public.inventory_images; ANALYZE public.products;',45)
          print('ANALYZE_STATUS',ast)
          if ast not in (200,201): print('ANALYZE_WARNING',json.dumps(abody,default=str))

          def batch_sql(limit):
              return f"""
              WITH collx_items AS MATERIALIZED (
                SELECT i.*
                FROM public.inventory_items i
                WHERE i.store_id = '{STORE}'::uuid
                  AND i.sku >= 'COLLX-'
                  AND i.sku < 'COLLY'
                  AND i.quantity > 0
                  AND i.status <> 'active'
                ORDER BY i.store_id, i.sku
                LIMIT 100000
              ), candidate AS MATERIALIZED (
                SELECT
                  i.id AS item_id,
                  i.store_id,
                  i.sku,
                  i.price AS item_price,
                  i.quantity AS item_quantity,
                  p.id AS product_id,
                  COALESCE(
                    CASE
                      WHEN NULLIF(BTRIM(p.image_url), '') IS NOT NULL
                       AND lower(BTRIM(p.image_url)) !~ '^https?://[^/]*collx'
                       AND lower(BTRIM(p.image_url)) NOT LIKE 'https://storage.googleapis.com/collx-product-images/%'
                       AND lower(BTRIM(p.image_url)) NOT LIKE 'http://storage.googleapis.com/collx-product-images/%'
                      THEN BTRIM(p.image_url)
                    END,
                    image_pick.image_url
                  ) AS primary_image
                FROM collx_items i
                JOIN LATERAL (
                  SELECT p.*
                  FROM public.products p
                  WHERE p.store_id = i.store_id
                    AND p.sku >= 'COLLX-'
                    AND p.sku < 'COLLY'
                    AND (p.id = i.legacy_product_id OR p.sku = i.sku)
                  ORDER BY CASE WHEN p.id = i.legacy_product_id THEN 0 ELSE 1 END, p.id
                  LIMIT 1
                ) p ON true
                LEFT JOIN LATERAL (
                  SELECT BTRIM(ii.image_url) AS image_url
                  FROM public.inventory_images ii
                  WHERE ii.inventory_item_id = i.id
                    AND NULLIF(BTRIM(ii.image_url), '') IS NOT NULL
                    AND lower(BTRIM(ii.image_url)) !~ '^https?://[^/]*collx'
                    AND lower(BTRIM(ii.image_url)) NOT LIKE 'https://storage.googleapis.com/collx-product-images/%'
                    AND lower(BTRIM(ii.image_url)) NOT LIKE 'http://storage.googleapis.com/collx-product-images/%'
                  ORDER BY COALESCE(ii.is_primary,false) DESC, COALESCE(ii.sort_order,2147483647) ASC
                  LIMIT 1
                ) image_pick ON true
                WHERE COALESCE(BTRIM(p.ebay_item_id::text),'') = ''
                  AND COALESCE(i.price,0) > 0
                  AND COALESCE(
                    CASE
                      WHEN NULLIF(BTRIM(p.image_url), '') IS NOT NULL
                       AND lower(BTRIM(p.image_url)) !~ '^https?://[^/]*collx'
                       AND lower(BTRIM(p.image_url)) NOT LIKE 'https://storage.googleapis.com/collx-product-images/%'
                       AND lower(BTRIM(p.image_url)) NOT LIKE 'http://storage.googleapis.com/collx-product-images/%'
                      THEN BTRIM(p.image_url)
                    END,
                    image_pick.image_url
                  ) IS NOT NULL
                ORDER BY i.sku
                LIMIT {int(limit)}
              ), updated_items AS (
                UPDATE public.inventory_items i
                SET
                  status = 'active',
                  description = NULLIF(BTRIM(regexp_replace(COALESCE(i.description,''), E'\\n*Migrated as DRAFT / NOT FOR SALE pending owner review\\.?', '', 'gi')), ''),
                  notes = CASE
                    WHEN NULLIF(BTRIM(i.notes),'') IS NULL THEN 'Activated for sale 2026-08-11'
                    WHEN i.notes ILIKE '%Activated for sale 2026-08-11%' THEN BTRIM(regexp_replace(i.notes, '\\s*\\|\\s*DRAFT / NOT FOR SALE', '', 'gi'))
                    ELSE BTRIM(regexp_replace(i.notes, '\\s*\\|\\s*DRAFT / NOT FOR SALE', '', 'gi')) || ' | Activated for sale 2026-08-11'
                  END,
                  metadata = jsonb_build_object(
                    'sale_activation_20260811', jsonb_build_object('state','active','recorded_at',now()),
                    'migration_quarantine_released', true
                  ),
                  updated_at = now()
                FROM candidate c
                WHERE i.id = c.item_id AND i.store_id = c.store_id
                RETURNING i.id
              ), updated_products AS (
                UPDATE public.products p
                SET
                  image_url = c.primary_image,
                  price = c.item_price,
                  quantity = c.item_quantity,
                  description = NULLIF(BTRIM(regexp_replace(COALESCE(p.description,''), E'\\n*Migrated as DRAFT / NOT FOR SALE pending owner review\\.?', '', 'gi')), ''),
                  archived_at = NULL
                FROM candidate c
                JOIN updated_items u ON u.id = c.item_id
                WHERE p.id = c.product_id AND p.store_id = c.store_id
                RETURNING p.id
              )
              SELECT
                (SELECT count(*)::int FROM candidate) AS candidates,
                (SELECT count(*)::int FROM updated_items) AS updated_items,
                (SELECT count(*)::int FROM updated_products) AS updated_products;
              """

          total=0
          exhausted=False
          for iteration in range(1, 80):
              limit = 1 if iteration == 1 else BATCH
              status,body=sql(batch_sql(limit),90)
              print('BATCH_RESULT',iteration,'HTTP',status,json.dumps(body,default=str))
              if status not in (200,201) or not isinstance(body,list) or not body:
                  raise SystemExit(10)
              row=body[0]
              c=int(row.get('candidates') or 0)
              ui=int(row.get('updated_items') or 0)
              up=int(row.get('updated_products') or 0)
              if c != ui or c != up:
                  print('ATOMIC_COUNT_MISMATCH',row); raise SystemExit(11)
              if c == 0:
                  exhausted=True
                  break
              total += c
              print(f'ACTIVATED_TOTAL={total}')
              if total > EXPECTED:
                  print('REFUSING_OVER_EXPECTED',total,EXPECTED); raise SystemExit(12)
              if iteration > 1:
                  time.sleep(0.20)

          print(f'FINAL_ACTIVATED_TOTAL={total}')
          print(f'EXPECTED_ELIGIBLE={EXPECTED}')
          print(f'EXHAUSTED={str(exhausted).lower()}')
          if not exhausted or total != EXPECTED:
              raise SystemExit(13)

          verify_products = f"""
            select
              count(*) filter (where price>0 and quantity>0 and NULLIF(BTRIM(image_url),'') is not null)::int as sellable_collx_products,
              count(*) filter (where price>0 and quantity>0 and (
                lower(BTRIM(image_url)) ~ '^https?://[^/]*collx' or
                lower(BTRIM(image_url)) like 'https://storage.googleapis.com/collx-product-images/%' or
                lower(BTRIM(image_url)) like 'http://storage.googleapis.com/collx-product-images/%'
              ))::int as live_external_collx_images
            from public.products
            where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY';
          """
          vs,vbody=sql(verify_products,45)
          print('VERIFY_PRODUCTS',vs,json.dumps(vbody,default=str))
          if vs not in (200,201) or not isinstance(vbody,list) or not vbody:
              raise SystemExit(14)
          vr=vbody[0]
          if int(vr.get('sellable_collx_products') or 0) != EXPECTED:
              raise SystemExit(15)
          if int(vr.get('live_external_collx_images') or 0) != 0:
              raise SystemExit(16)

          sample_sql=f"select sku,status,quantity,price from public.inventory_items where store_id='{STORE}'::uuid and sku >= 'COLLX-' and sku < 'COLLY' and status='active' order by store_id,sku limit 10;"
          ss,sbody=sql(sample_sql,30)
          print('VERIFY_ACTIVE_SAMPLE',ss,json.dumps(sbody,default=str))
          if ss not in (200,201) or not isinstance(sbody,list) or len(sbody)<1:
              raise SystemExit(17)
          print('COLLX_INDEXED_PRODUCTION_PUBLISH=SUCCESS')
          PY
