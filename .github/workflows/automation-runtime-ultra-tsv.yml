name: Build Ultra Compact Automation Runtime TSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automation-runtime-ultra-tsv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build ultra compact TSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,re
          RUN='dh-20260730T170046Z-7d4c2a91';SEQ=4
          with open('tmp/automation-runtime-results.json') as f:raw=json.load(f)
          obs=raw.get('fetchedAt') or '2026-07-30T17:05:44Z'
          lab={'wnba':'WNBA','ivan_demidov':'IVAN','matvei_michkov_young_guns':'MICHKOV YG','matvei_michkov_opc_platinum':'MICHKOV OPCP','baseball_prospects':'MLB PROSPECT','signed_baseballs':'SIGNED BALL'}
          def clean(v):
            if v is None:return ''
            if isinstance(v,bool):return 'TRUE' if v else 'FALSE'
            s=str(v).replace('\t',' ').replace('\r',' ').replace('\n',' ').strip()
            if s and s[0] in '=+-@':s="'"+s
            return s
          def j(v):return json.dumps(v,separators=(',',':'),ensure_ascii=False)
          m={}
          for ep,o in raw.get('endpoints',{}).items():
            for c in (o.get('data') or {}).get('results') or []:
              k=str(c.get('listingItemId') or c.get('listingUrl') or '')
              if not k:continue
              if k not in m:m[k]={'eps':set([ep]),**c}
              else:
                x=m[k];x['eps'].add(ep);x['queryFamilyIds']=sorted(set((x.get('queryFamilyIds') or [])+(c.get('queryFamilyIds') or [])));x['preliminaryRisks']=sorted(set((x.get('preliminaryRisks') or [])+(c.get('preliminaryRisks') or [])))
          with open('tmp/automation-runtime-candidates-ultra.tsv','w') as f:
            for k,c in sorted(m.items(),key=lambda x:(sorted(x[1]['eps'])[0],str(x[1].get('listingItemId') or ''))):
              eps=sorted(c.pop('eps'));dig=hashlib.sha1(('|'.join(eps)+'|'+k).encode()).hexdigest()[:18];rawid=str(c.get('listingItemId') or '');nums=re.findall(r'\d{9,15}',rawid);num=nums[0] if nums else '';url='https://www.ebay.com/itm/'+num if num else str(c.get('listingUrl') or '').split('?')[0];q=c.get('queryFamilyIds') or [];risks=c.get('preliminaryRisks') or []
              row=['']*77
              vals={0:'cand-s4-ebay-'+dig,1:RUN,2:SEQ,3:obs,4:'+'.join(lab.get(e,e) for e in eps)+'/'+str(c.get('lane') or ''),5:c.get('watchedPerson') or '',6:c.get('itemType') or '',7:'eBay',8:c.get('sellerName') or '',10:rawid,11:url,12:'LIVE',13:str(c.get('title') or '')[:180],14:j({'q':q}),15:'{"status":"UNVERIFIED"}',16:'preliminary|'+dig,17:'ebay|'+str(c.get('sellerName') or 'unknown')+'|'+rawid,20:False,21:False,22:False,23:False,24:'{}',35:'UNASSESSED',36:j(risks),37:c.get('itemPrice'),38:c.get('inboundShipping'),55:'INSUFFICIENT',72:'MANUAL REVIEW / UNPRICED',73:False,74:False,75:j(['identity_unverified','exact_comps_missing','costs_unknown','owned_copy_check_missing']+risks),76:j({'ep':eps,'q':q,'id':rawid})}
              for i,v in vals.items():row[i]=v
              f.write('\t'.join(clean(v) for v in row)+'\n')
          PY
      - name: Commit ultra TSV
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/automation-runtime-candidates-ultra.tsv
          git commit -m 'Build ultra compact automation runtime candidate rows' || exit 0
          git push origin HEAD:main
