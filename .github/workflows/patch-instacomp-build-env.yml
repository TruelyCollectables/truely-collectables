name: Patch InstaComp Build Environment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-local-engine-primary
          fetch-depth: 0
      - name: Add confirmed missing build variable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-instacomp-ocr-registry-primary.yml')
          text = path.read_text()
          anchor = '          INSTACOMP_SERVICE_TOKEN: placeholder-service-token\n'
          addition = '          INTERNAL_PUBLISH_WEBHOOK_SECRET: placeholder-internal-publish-secret\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('certification environment anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text)
          PY
          rm .github/workflows/patch-instacomp-build-env.yml
      - name: Commit test-environment repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[build-env-patched] Add publish webhook build placeholder"
          git push origin HEAD:fix/instacomp-local-engine-primary
