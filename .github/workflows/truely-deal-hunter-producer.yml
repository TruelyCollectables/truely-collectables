name: Truely Collectables Deal Hunter Producer

on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/truely-deal-hunter-producer.yml"
      - "scripts/run-truely-deal-hunter-producer.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/truely-deal-hunter-producer.yml"
      - "scripts/run-truely-deal-hunter-producer.mjs"

permissions:
  contents: write

concurrency:
  group: truely-deal-hunter-producer
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate all native marketplace feeds
        id: producer
        continue-on-error: true
        run: node scripts/run-truely-deal-hunter-producer.mjs

      - name: Upload diagnostic producer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truely-deal-hunter-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-run/truely-deal-hunter-producer/
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest artifact to fixed data branch
        if: always()
        env:
          DATA_BRANCH: truely-deal-hunter-feed
        run: |
          set -euo pipefail
          test -f .codex-run/truely-deal-hunter-producer/producer-artifact.json
          test -f .codex-run/truely-deal-hunter-producer/producer-summary.json
          test -f .codex-run/truely-deal-hunter-producer/producer-summary.md

          rm -rf /tmp/truely-deal-hunter-feed
          mkdir -p /tmp/truely-deal-hunter-feed
          cp -R .codex-run/truely-deal-hunter-producer/. /tmp/truely-deal-hunter-feed/

          git config user.name "Truely Collectables Automation"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan "$DATA_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p data
          cp -R /tmp/truely-deal-hunter-feed/. data/
          cat > data/published-metadata.json <<EOF
          {
            "schema": "TRUELY_COLLECTABLES_DEAL_HUNTER_PUBLISHED_V1",
            "source_main_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git add data
          git commit -m "Update Truely Collectables Deal Hunter feed"
          git push --force origin HEAD:"$DATA_BRANCH"

      - name: Enforce producer result
        if: steps.producer.outcome != 'success'
        run: exit 1
