name: Truely Collectables Deal Hunter Producer

# Sequence 14 recovery staging trigger 2 after the authoritative handoff STARTED row.
on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/truely-deal-hunter-producer.yml"
      - "scripts/run-truely-deal-hunter-producer.mjs"
      - "scripts/build-truely-handoff-csv.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/truely-deal-hunter-producer.yml"
      - "scripts/run-truely-deal-hunter-producer.mjs"
      - "scripts/build-truely-handoff-csv.py"

permissions:
  contents: write

concurrency:
  group: truely-deal-hunter-producer
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate producer contract on pull requests
        if: github.event_name == 'pull_request'
        run: |
          node --check scripts/run-truely-deal-hunter-producer.mjs
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const source = fs.readFileSync("scripts/run-truely-deal-hunter-producer.mjs", "utf8");
          assert.match(source, /key: "wnba"[\s\S]*?expectedFamilyCount: 25/);
          assert.match(source, /requiresSourceStatus: true/);
          assert.match(source, /sourceStatus\.status !== "COMPLETE"/);
          assert.match(source, /sourceStatus\.sort !== "newlyListed"/);
          console.log("Producer PR contract: OK");
          NODE

      - name: Fetch and validate all native marketplace feeds
        id: producer
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/run-truely-deal-hunter-producer.mjs

      - name: Build immutable sequence 14 handoff CSVs
        if: github.event_name != 'pull_request' && steps.producer.outcome == 'success'
        env:
          HANDOFF_RUN_ID: dh-20260731T184251Z-gha-recovery
          HANDOFF_SEQUENCE: "14"
        run: python scripts/build-truely-handoff-csv.py

      - name: Publish sequence 14 staging files
        if: github.event_name != 'pull_request' && steps.producer.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage_dir="$(mktemp -d)"
          cp .codex-run/truely-deal-hunter-producer/handoff-candidates.csv "$stage_dir/candidates.csv"
          cp .codex-run/truely-deal-hunter-producer/handoff-coverage.csv "$stage_dir/coverage.csv"
          cp .codex-run/truely-deal-hunter-producer/handoff-manifest.json "$stage_dir/manifest.json"
          git fetch origin deal-hunter-feed
          git worktree add /tmp/deal-hunter-feed origin/deal-hunter-feed
          mkdir -p /tmp/deal-hunter-feed/sequence-14
          cp "$stage_dir/candidates.csv" /tmp/deal-hunter-feed/sequence-14/candidates.csv
          cp "$stage_dir/coverage.csv" /tmp/deal-hunter-feed/sequence-14/coverage.csv
          cp "$stage_dir/manifest.json" /tmp/deal-hunter-feed/sequence-14/manifest.json
          cd /tmp/deal-hunter-feed
          git config user.name "Truely Collectables Automation"
          git config user.email "actions@users.noreply.github.com"
          git add sequence-14
          if ! git diff --cached --quiet; then
            git commit -m "Publish Deal Hunter sequence 14 handoff"
            git push origin HEAD:deal-hunter-feed
          fi

      - name: Upload authoritative producer artifact
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: truely-deal-hunter-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-run/truely-deal-hunter-producer/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce producer result
        if: github.event_name != 'pull_request' && steps.producer.outcome != 'success'
        run: exit 1
