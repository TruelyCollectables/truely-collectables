name: Temporary InstaComp Image-First Progress Patcher

on:
  push:
    branches:
      - agent/instacomp-visible-progress-20260726

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out progress branch
        uses: actions/checkout@v4
        with:
          ref: agent/instacomp-visible-progress-20260726
          fetch-depth: 0

      - name: Apply image-first and progress patch
        run: node scripts/apply-instacomp-image-first-progress.mjs

      - name: Validate image-first progress regression
        run: node scripts/run-instacomp-image-first-progress-regressions.mjs

      - name: Commit patched branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify mislabeled comp images and show live InstaComp progress"
          git push origin HEAD:agent/instacomp-visible-progress-20260726
