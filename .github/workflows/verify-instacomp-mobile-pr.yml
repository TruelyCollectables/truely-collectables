name: Verify InstaComp Mobile Production

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/admin/instacomp/mobile/**"
      - ".github/workflows/verify-instacomp-mobile-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-instacomp-mobile-production-legacy-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-verifier-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use the protected in-runtime v3 verifier
        run: |
          echo "PASS: legacy password-pull verifier retired."
          echo "The Vercel CLI masks sensitive Production values, so this workflow no longer attempts to extract ADMIN_PASSWORD."
          echo "Verify InstaComp Mobile Production v3 is the canonical pull-request Production verifier."
