name: Import 2025-26 Upper Deck Hockey

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run validation only or guarded Production import"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - apply

permissions:
  contents: read

concurrency:
  group: import-upper-deck-2025-26-hockey
  cancel-in-progress: false

jobs:
  checklist-registry-import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all official sources
        if: inputs.mode == 'validate'
        run: |
          npx tsx scripts/import-upper-deck-2025-26-hockey.ts \
            --output .upper-deck-work/2025-26-hockey-validation-receipt.json

      - name: Run guarded canary and batch import
        if: inputs.mode == 'apply'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx scripts/import-upper-deck-2025-26-hockey.ts \
            --apply \
            --confirm-season=2025-26-hockey \
            --output .upper-deck-work/2025-26-hockey-production-receipt.json

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upper-deck-2025-26-hockey-${{ inputs.mode }}-receipt
          path: .upper-deck-work/*.json
          if-no-files-found: warn
          retention-days: 90
