name: InstaComp Registry Legacy Base Production Proof 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-registry-legacy-base-production-proof-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-production-acceptance-global
  cancel-in-progress: false

env:
  PROOF_MAIN_SHA: 35ed012115ce18265f7701ac57e7c7749d688a36
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  EVIDENCE_DIR: evidence/instacomp-registry-legacy-base-production-proof-20260810
  TEMP_DIR: /tmp/instacomp-registry-legacy-base-production-proof-20260810

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_MAIN_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Lock exact merged source and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROOF_MAIN_SHA"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR"
          grep -Fq 'normalized === "base" ? "" : normalized' src/lib/instacomp-checklist-first.ts
          printf '{"proofMain":"%s","legacyBaseHandling":true,"registryMutation":false,"macMutation":false}\n' "$PROOF_MAIN_SHA" > "$EVIDENCE_DIR/source-lock.json"

      - name: Install and link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm ci >/dev/null
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Prove stale acceptance credential absent
        shell: bash
        run: |
          set -euo pipefail
          list="$TEMP_DIR/env-before.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          if grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"; then
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          fi
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"

      - name: Provision isolated acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          secret="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy exact merged Registry fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          log="$EVIDENCE_DIR/proof-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          touch "$TEMP_DIR/proof-deployed"

      - name: Prove Sonia trusted-memory identity locks exactly
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$token"
          request="$TEMP_DIR/request.json"
          response="$EVIDENCE_DIR/sonia-122-orange-cracked-ice.json"
          cat > "$request" <<'JSON'
          {
            "year": "2025",
            "manufacturer": "Panini",
            "brand": "Panini Prizm WNBA",
            "setName": "Base",
            "cardNumber": "122",
            "player": "Sonia Citron",
            "parallel": "Orange Cracked Ice Prizm",
            "isAuto": false,
            "isRelic": false
          }
          JSON
          code="$(curl -sS --max-time 45 -o "$response" -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-tcos-instacomp-service-token: $token" \
            --data-binary "@$request" \
            "$PRODUCTION_ORIGIN/api/instacomp/checklist-lookup")"
          test "$code" = "200"
          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const id = String(body.registryIdentityId || body.identityId || '').trim();
          const fingerprint = String(body.registryFingerprintSha256 || body.fingerprintSha256 || '').trim();
          if (body.ok !== true) throw new Error(`ok=${body.ok}`);
          if (body.status !== 'exact_match') throw new Error(`status=${body.status}`);
          if (body.aiRequired !== false) throw new Error(`aiRequired=${body.aiRequired}`);
          if (body.candidateCount !== 1) throw new Error(`candidateCount=${body.candidateCount}`);
          if (!id) throw new Error('missing Registry identity ID');
          if (!/^[0-9a-f]{64}$/i.test(fingerprint)) throw new Error('missing/invalid Registry fingerprint');
          const locked = body.lockedFields || {};
          if (String(locked.player || '') !== 'Sonia Citron') throw new Error(`player=${locked.player}`);
          if (String(locked.cardNumber || '') !== '122') throw new Error(`cardNumber=${locked.cardNumber}`);
          console.log(JSON.stringify({
            status: 'passed',
            registryIdentityId: id,
            registryFingerprintSha256: fingerprint,
            candidateCount: body.candidateCount,
            identificationPath: body.identificationPath,
            nothingPublished: true,
          }, null, 2));
          NODE

      - name: Remove isolated acceptance credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          list="$TEMP_DIR/env-after.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"
          touch "$TEMP_DIR/token-removed"

      - name: Clean redeploy current main without proof credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/proof-deployed" ]; then exit 0; fi
          test -f "$TEMP_DIR/token-removed"
          git fetch origin main --quiet
          git checkout --detach origin/main
          clean_sha="$(git rev-parse HEAD)"
          log="$EVIDENCE_DIR/clean-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          printf '{"clean":true,"deployedMain":"%s","acceptanceCredentialPresent":false}\n' "$clean_sha" > "$EVIDENCE_DIR/cleanup-proof.json"

      - name: Upload Production proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-registry-legacy-base-production-proof-20260810
          path: evidence/instacomp-registry-legacy-base-production-proof-20260810
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR" .env.local .env.production.local
