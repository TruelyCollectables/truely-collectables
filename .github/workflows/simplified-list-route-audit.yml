name: Simplified List Route Audit

on:
  pull_request:
    paths:
      - "src/app/list/**"
      - "src/app/api/admin/simple-list-drafts/**"
      - "src/app/admin/products/new/page.tsx"
      - "src/app/admin/page.tsx"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-simplified-list-route-audit.mjs"
      - "scripts/run-admin-dashboard-actions-simulations.mjs"
      - "scripts/smoke-admin-runtime.mjs"
      - ".github/workflows/simplified-list-route-audit.yml"
  push:
    branches:
      - "agent/simplified-list-route"
    paths:
      - "src/app/list/**"
      - "src/app/api/admin/simple-list-drafts/**"
      - "src/app/admin/products/new/page.tsx"
      - "src/app/admin/page.tsx"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-simplified-list-route-audit.mjs"
      - "scripts/run-admin-dashboard-actions-simulations.mjs"
      - "scripts/smoke-admin-runtime.mjs"
      - ".github/workflows/simplified-list-route-audit.yml"

permissions:
  contents: write

jobs:
  finalize-kingmaker-admin-route:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/kingmaker-morning-intel'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out KINGMAKER branch
        uses: actions/checkout@v4
        with:
          ref: agent/kingmaker-morning-intel
          fetch-depth: 0
      - name: Add permanent KINGMAKER command-center route
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("src/app/admin/page.tsx")
          route = '/admin/market-intel/kingmaker/morning-intelligence'
          marker = '        { href: "/admin/market-intel", label: "Command Desk" },\n'
          addition = '''        {
          href: "/admin/market-intel/kingmaker/morning-intelligence",
          label: "KINGMAKER Morning Intelligence",
        },
'''
          source = page.read_text()
          if route not in source:
              if source.count(marker) != 1:
                  raise SystemExit("Expected exactly one Market Intel Command Desk marker")
              source = source.replace(marker, marker + addition, 1)
              page.write_text(source)
          if page.read_text().count(route) != 1:
              raise SystemExit("KINGMAKER route must appear exactly once")

          for temporary in [
              Path(".github/workflows/kingmaker-admin-route-fix.yml"),
          ]:
              if temporary.exists():
                  temporary.unlink()
          PY
      - name: Commit exact repair
        run: |
          git diff --check
          if git diff --quiet; then
            echo "KINGMAKER admin route already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx .github/workflows/kingmaker-admin-route-fix.yml
          git commit -m "Finalize KINGMAKER admin navigation contract"
          git push origin HEAD:agent/kingmaker-morning-intel

  focused-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-at-least-32-characters
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run simplified route contract audit
        run: node scripts/run-simplified-list-route-audit.mjs
      - name: Verify admin dashboard integration
        run: npm run verify:admin-dashboard
      - name: Lint simplified listing files
        run: >-
          npx eslint
          src/app/list/page.tsx
          src/app/list/layout.tsx
          src/app/list/SimpleListIntake.tsx
          src/app/list/SimpleListingQueue.tsx
          src/app/api/admin/simple-list-drafts/route.ts
          src/app/admin/products/new/page.tsx
          src/app/admin/page.tsx
          src/app/components/AdminInstaCompMobileShortcut.tsx
          scripts/run-simplified-list-route-audit.mjs
          scripts/run-admin-dashboard-actions-simulations.mjs
          scripts/smoke-admin-runtime.mjs
      - name: Build production application
        run: npm run build
