name: Simplified List Route Audit

on:
  pull_request:
    paths:
      - "src/app/list/**"
      - "src/app/api/admin/simple-list-drafts/**"
      - "src/app/admin/products/new/page.tsx"
      - "src/app/admin/page.tsx"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-simplified-list-route-audit.mjs"
      - "scripts/run-admin-dashboard-actions-simulations.mjs"
      - "scripts/smoke-admin-runtime.mjs"
      - "scripts/patch-list-admin-navigation.py"
      - ".github/workflows/simplified-list-route-audit.yml"
  push:
    branches:
      - "agent/simplified-list-route"
    paths:
      - "src/app/list/**"
      - "src/app/api/admin/simple-list-drafts/**"
      - "src/app/admin/products/new/page.tsx"
      - "src/app/admin/page.tsx"
      - "src/app/components/AdminInstaCompMobileShortcut.tsx"
      - "scripts/run-simplified-list-route-audit.mjs"
      - "scripts/run-admin-dashboard-actions-simulations.mjs"
      - "scripts/smoke-admin-runtime.mjs"
      - "scripts/patch-list-admin-navigation.py"
      - ".github/workflows/simplified-list-route-audit.yml"

permissions:
  contents: write

jobs:
  focused-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-at-least-32-characters
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run simplified route contract audit
        run: node scripts/run-simplified-list-route-audit.mjs
      - name: Lint simplified listing files
        run: >-
          npx eslint
          src/app/list/page.tsx
          src/app/list/layout.tsx
          src/app/list/SimpleListIntake.tsx
          src/app/list/SimpleListingQueue.tsx
          src/app/api/admin/simple-list-drafts/route.ts
          src/app/admin/products/new/page.tsx
          src/app/components/AdminInstaCompMobileShortcut.tsx
          scripts/run-simplified-list-route-audit.mjs
      - name: Build production application
        run: npm run build

  apply-admin-list-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/simplified-list-route'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplified-list-route
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply exact patch
        run: python scripts/patch-list-admin-navigation.py
      - name: Validate patched admin and listing contracts
        run: |
          npm run verify:admin-dashboard
          node scripts/run-simplified-list-route-audit.mjs
          npx eslint src/app/admin/page.tsx scripts/smoke-admin-runtime.mjs scripts/run-admin-dashboard-actions-simulations.mjs
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/page.tsx scripts/smoke-admin-runtime.mjs scripts/run-admin-dashboard-actions-simulations.mjs
          git commit -m "Link admin directly to simplified list workspace"
          git push origin HEAD:agent/simplified-list-route
