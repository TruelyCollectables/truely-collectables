name: Resume PR 393 Production Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resume-pr393-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-pr393-production-release
  cancel-in-progress: false

jobs:
  configure-deploy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Add fail-closed Production shipping variables
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'dry_run' | npx vercel@56.2.0 env add \
            TCOS_SHIPPING_PURCHASE_MODE production --force \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          printf '%s' 'false' | npx vercel@56.2.0 env add \
            TCOS_LIVE_SHIPPING_ENABLED production --force \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Audit Production environment names
        run: npm run audit:vercel-production-env

      - name: Deploy current main to Production
        run: npm run deploy:production

      - name: Run repository Production smoke test
        run: npm run smoke:production

      - name: Verify live PR 393 routes and headers
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA:0:12}-$(date +%s)"
          mkdir -p "$RUNNER_TEMP/pr393-resume"
          routes=("" "shop" "account" "account/login" "cart" "buyer-protection" "robots.txt" "sitemap.xml")
          for index in "${!routes[@]}"; do
            route="${routes[$index]}"
            output="$RUNNER_TEMP/pr393-resume/route-$index.txt"
            curl --fail --silent --show-error --location --retry 6 --retry-all-errors \
              -H "Cache-Control: no-cache" \
              -A "TruelyCollectablesPR393Resume/1.0" \
              "https://truelycollectables.com/${route}?pr393_resume=${stamp}-${index}" \
              -o "$output"
            if grep -Eqi "Error loading products|permission denied for view|Missing Supabase environment variables|Internal Server Error" "$output"; then
              echo "Live route failed: /$route" >&2
              grep -Ei "Error loading products|permission denied for view|Missing Supabase environment variables|Internal Server Error" "$output" || true
              exit 1
            fi
            echo "PASS /$route"
          done
          grep -Fq "Find the collectible your collection is missing" "$RUNNER_TEMP/pr393-resume/route-0.txt"
          grep -Fq "Shop Sports Cards" "$RUNNER_TEMP/pr393-resume/route-1.txt"
          grep -Fq "Shipment Protection" "$RUNNER_TEMP/pr393-resume/route-5.txt"
          headers="$RUNNER_TEMP/pr393-resume/headers.txt"
          curl --fail --silent --show-error --location --head \
            "https://truelycollectables.com/?pr393_headers=$stamp" -o "$headers"
          grep -Eqi '^strict-transport-security:' "$headers"
          grep -Eqi '^content-security-policy:' "$headers"
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' "$headers"
          echo "PR #393 Production deployment verified."
