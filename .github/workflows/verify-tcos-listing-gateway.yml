name: Verify TCOS listing gateway

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_SESSION_SECRET: build-only-admin-session-secret-with-at-least-32-characters
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      OPENAI_API_KEY: build-only-placeholder-openai-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tcos-listing-gateway-v2

      - name: Fix InstaComp recommendation action
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/api/admin/card-listing-queue/route.ts')
          text = path.read_text()
          old = 'action: text(decision.action, 80) || null,'
          new = 'action: text(decision.recommendation.action, 80) || null,'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected InstaComp decision action marker was not found.')
          path.write_text(text)
          PY

      - name: Commit recommendation fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/api/admin/card-listing-queue/route.ts
            git commit -m "Fix TCOS InstaComp recommendation action"
            git push origin HEAD:agent/tcos-listing-gateway-v2
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/run-tcos-listing-gateway-audit.mjs
      - run: node scripts/run-simplified-list-route-audit.mjs
      - run: npm run verify:admin-dashboard
      - run: npm run build
