name: Deploy Profit Hunter Server Cron

on:
  push:
    branches: [main]
    paths:
      - "src/lib/profit-hunter-server-run.js"
      - "src/app/api/cron/profit-hunter/route.js"
      - "scripts/run-profit-hunter-server-cron-contracts.mjs"
      - "vercel.json"
      - ".github/workflows/deploy-profit-hunter-server-cron.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-profit-hunter-server-cron
  cancel-in-progress: true

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate Profit Hunter server contracts
        run: |
          set -euo pipefail
          node --check src/lib/profit-hunter-server-run.js
          node --check src/app/api/cron/profit-hunter/route.js
          node scripts/run-profit-hunter-server-cron-contracts.mjs
          npx eslint src/lib/profit-hunter-server-run.js src/app/api/cron/profit-hunter/route.js scripts/run-profit-hunter-server-cron-contracts.mjs
          git diff --check

      - name: Link Production Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Audit Production environment names
        run: npm run audit:vercel-production-env

      - name: Deploy newest stable main to Production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Profit Hunter Production deployment attempt $attempt/3"
            git fetch --prune origin main
            git reset --hard origin/main
            npm ci
            npx vercel@56.2.0 link --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"

            set +e
            npm run deploy:production 2>&1 | tee "$RUNNER_TEMP/profit-hunter-deploy-$attempt.log"
            deploy_status=${PIPESTATUS[0]}
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              echo "Production deployment completed from $(git rev-parse HEAD)."
              exit 0
            fi

            if grep -Fq "Local HEAD does not match origin/main" "$RUNNER_TEMP/profit-hunter-deploy-$attempt.log" && [ "$attempt" -lt 3 ]; then
              echo "main advanced during deployment; refreshing and retrying."
              sleep 5
              continue
            fi

            exit "$deploy_status"
          done
          exit 1

      - name: Verify live server cron route and deployed commit
        id: verify_live
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse --short=12 HEAD)"
          full_sha="$(git rev-parse HEAD)"
          url="https://truelycollectables.com/api/cron/profit-hunter?statusOnly=1&verify=$(date +%s)"
          body="$RUNNER_TEMP/profit-hunter-status.json"

          for attempt in $(seq 1 24); do
            echo "Live verification attempt $attempt/24"
            if curl --fail --silent --show-error --location \
              --max-time 60 --retry 2 --retry-all-errors \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -A "TCOSProfitHunterDeploy/1.0" \
              "$url&attempt=$attempt" -o "$body"; then
              cat "$body"
              if node - "$body" "$expected" <<'NODE'
          const fs = require("node:fs");
          const [path, expected] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          if (payload.code !== "PROFIT_HUNTER_SERVER_CRON_READY") process.exit(1);
          if (payload.executionPath !== "vercel_server_cron") process.exit(1);
          if (payload.contract?.expectedTotalFamilies !== 51) process.exit(1);
          if (payload.deployment?.commitSha !== expected) process.exit(1);
          NODE
              then
                echo "deployed_sha=$full_sha" >> "$GITHUB_OUTPUT"
                echo "deployed_short_sha=$expected" >> "$GITHUB_OUTPUT"
                echo "Live Profit Hunter cron verified at commit $expected."
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Live Profit Hunter cron did not verify at expected commit $expected." >&2
          exit 1

      - name: Pull Production server authorizations from Vercel
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/profit-hunter-production.env"
          npx vercel@56.2.0 env pull "$env_file" \
            --environment=production \
            --yes \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_SCOPE" >/dev/null

          node - "$env_file" "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const [path, githubEnv] = process.argv.slice(2);
          const lines = fs.readFileSync(path, "utf8").split(/\r?\n/);

          function readValue(name) {
            const prefix = `${name}=`;
            const line = lines.find((entry) => entry.startsWith(prefix));
            if (!line) return "";
            const raw = line.slice(prefix.length).trim();
            if (!raw) return "";
            if (raw.startsWith('"')) {
              try {
                return String(JSON.parse(raw));
              } catch {
                return "";
              }
            }
            return raw;
          }

          const entries = [
            ["PROFIT_HUNTER_MARKET_SECRET", readValue("MARKET_INTEL_INGEST_SECRET")],
            ["PROFIT_HUNTER_CRON_SECRET", readValue("CRON_SECRET")],
          ].filter(([, value]) => value);

          if (!entries.length) {
            throw new Error(
              "Neither MARKET_INTEL_INGEST_SECRET nor CRON_SECRET was available from Vercel Production.",
            );
          }

          for (const [name, value] of entries) {
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(githubEnv, `${name}=${value}\n`);
          }
          console.log(`Loaded ${entries.length} masked Production authorization candidate(s).`);
          NODE

      - name: Force and verify one complete server-side Profit Hunter cycle
        id: force_run
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/profit-hunter-forced-run.json"
          endpoint="https://truelycollectables.com/api/cron/profit-hunter?force=1&perQuery=20&deploy_test=$(date +%s)"
          successful_secret=""

          candidates=(
            "market_intel:${PROFIT_HUNTER_MARKET_SECRET:-}"
            "vercel_cron:${PROFIT_HUNTER_CRON_SECRET:-}"
          )

          for candidate in "${candidates[@]}"; do
            label="${candidate%%:*}"
            secret="${candidate#*:}"
            if [ -z "$secret" ]; then
              continue
            fi

            echo "Trying masked Production authorization: $label"
            http_code="$(curl --silent --show-error --location \
              --max-time 300 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${secret}" \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -A "TCOSProfitHunterForcedRun/1.0" \
              -o "$response" -w '%{http_code}' \
              "$endpoint&auth_source=$label")"

            if [ "$http_code" = "200" ]; then
              successful_secret="$label"
              break
            fi

            echo "Authorization $label returned HTTP $http_code."
            cat "$response"
          done

          if [ -z "$successful_secret" ]; then
            echo "No Production authorization candidate could force the Profit Hunter run." >&2
            exit 1
          fi

          cat "$response"
          node - "$response" "$GITHUB_OUTPUT" "$successful_secret" <<'NODE'
          const fs = require("node:fs");
          const [path, output, authSource] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          if (payload.ok !== true) process.exit(1);
          if (payload.nativeEbayUsed !== true) process.exit(1);
          if (payload.queryFamilyCount !== 51) process.exit(1);
          if (payload.successfulQueryCount !== 51) process.exit(1);
          if (payload.failedQueryCount !== 0) process.exit(1);
          fs.appendFileSync(
            output,
            [
              `report_id=${payload.reportId || ""}`,
              `raw_results=${payload.rawResultCount || 0}`,
              `deduplicated_results=${payload.deduplicatedResultCount || 0}`,
              `actionable_count=${payload.exactCompActionableCount || 0}`,
              `duration_ms=${payload.durationMs || 0}`,
              `auth_source=${authSource}`,
            ].join("\n") + "\n",
          );
          NODE

      - name: Record verified server deployment and 51-family run
        shell: bash
        env:
          DEPLOYED_SHA: ${{ steps.verify_live.outputs.deployed_sha }}
          REPORT_ID: ${{ steps.force_run.outputs.report_id }}
          RAW_RESULTS: ${{ steps.force_run.outputs.raw_results }}
          DEDUPLICATED_RESULTS: ${{ steps.force_run.outputs.deduplicated_results }}
          ACTIONABLE_COUNT: ${{ steps.force_run.outputs.actionable_count }}
          DURATION_MS: ${{ steps.force_run.outputs.duration_ms }}
          AUTH_SOURCE: ${{ steps.force_run.outputs.auth_source }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin main
          git reset --hard origin/main
          mkdir -p deployment-receipts
          cat > deployment-receipts/profit-hunter-server-cron.md <<EOF
          # Profit Hunter Server Cron — Production Verification

          - Result: verified
          - Execution path: Vercel server cron
          - Production source commit: ${DEPLOYED_SHA}
          - Native eBay query families: 51/51 complete
          - Failed query families: 0
          - Raw results: ${RAW_RESULTS}
          - Deduplicated results: ${DEDUPLICATED_RESULTS}
          - Exact-comp actionable results: ${ACTIONABLE_COUNT}
          - Saved report ID: ${REPORT_ID}
          - Forced-run duration: ${DURATION_MS} ms
          - Verified authorization path: ${AUTH_SOURCE}
          - Mountain schedule: 7 AM, 9 AM, 11 AM, 1 PM, 3 PM, 5 PM, 7 PM, 9 PM
          - Overnight execution: disabled by America/Denver schedule guard
          - Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add deployment-receipts/profit-hunter-server-cron.md
          git commit -m "Record verified Profit Hunter server run [skip ci]"
          git push origin HEAD:main
