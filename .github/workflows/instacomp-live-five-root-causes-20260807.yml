name: InstaComp Live Five Root Causes 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/patch-instacomp-live-five-root-causes-20260807.py"
      - ".github/workflows/instacomp-live-five-root-causes-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-live-five-root-causes-20260807
  cancel-in-progress: true

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-live-five-root-causes-20260807
          fetch-depth: 0

      - name: Apply proven root-cause repairs
        run: python scripts/ops/patch-instacomp-live-five-root-causes-20260807.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Certify Mac service
        shell: bash
        run: |
          set -euo pipefail
          cd services/instacomp-ai
          python -m pip install -q -r requirements.txt
          python -m pytest -q
          python -m compileall -q app
          bash -n scripts/update-live-from-main.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Certify website and isolated acceptance auth
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --import tsx scripts/run-instacomp-service-auth-simulations.ts
          npx tsc --noEmit

      - name: Source-contract safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'memory_registry_verified = bool(' services/instacomp-ai/app/main.py
          grep -Fq 'trusted_identity = memory_registry_result.identity' services/instacomp-ai/app/main.py
          grep -Fq 'trusted_text_registry_verified = bool(' services/instacomp-ai/app/main.py
          grep -Fq 'brand: text(identity.manufacturer ?? identity.brand)' src/lib/instacomp-ai-local.ts
          grep -Fq 'INSTACOMP_ACCEPTANCE_SERVICE_TOKEN' src/lib/instacomp-job-server.ts
          grep -Fq 'acceptance.length >= 32' src/lib/instacomp-job-server.ts
          grep -Fq 'registry_token="$(read_env_value "$env_file" INSTACOMP_AI_REGISTRY_TOKEN)"' services/instacomp-ai/scripts/update-live-from-main.sh
          grep -Fq 'set_vercel_env INSTACOMP_SERVICE_TOKEN "$registry_token" production sensitive' services/instacomp-ai/scripts/update-live-from-main.sh
          grep -Fq 'PASS  Permanent Mac Registry credential accepted through Production.' services/instacomp-ai/scripts/update-live-from-main.sh
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'scripts/run-instacomp-service-auth-simulations.ts' \
            'services/instacomp-ai/app/main.py' \
            'services/instacomp-ai/scripts/update-live-from-main.sh' \
            'src/lib/instacomp-ai-local.ts' \
            'src/lib/instacomp-job-server.ts' | sort)"
          test "$changed" = "$expected"

      - name: Commit certified source repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run-instacomp-service-auth-simulations.ts \
            services/instacomp-ai/app/main.py \
            services/instacomp-ai/scripts/update-live-from-main.sh \
            src/lib/instacomp-ai-local.ts \
            src/lib/instacomp-job-server.ts
          git commit -m 'Fix InstaComp Registry auth and stale memory precedence'
          git push origin HEAD:fix/instacomp-live-five-root-causes-20260807
