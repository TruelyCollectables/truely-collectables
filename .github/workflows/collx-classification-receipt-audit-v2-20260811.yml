name: CollX Classification Receipt Audit V2 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-classification-receipt-audit-v2-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read private saved CollX classification receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json,os,subprocess
          API='https://api.supabase.com/v1'; TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']; STORE=os.environ['FLAGSHIP_STORE_ID']
          def call(url,headers=None,method='GET',body=None):
              cmd=['curl','-sS','--max-time','120','-X',method,'-o','/tmp/out','-w','%{http_code}']
              for k,v in (headers or {}).items(): cmd += ['-H',f'{k}: {v}']
              if body is not None: cmd += ['--data-binary',json.dumps(body)]
              cmd += [url]
              p=subprocess.run(cmd,capture_output=True,text=True); raw=open('/tmp/out').read() if os.path.exists('/tmp/out') else ''
              try:data=json.loads(raw) if raw else None
              except:data=raw
              return int((p.stdout or '0').strip()[-3:]),data
          s,ps=call(API+'/projects',{'Authorization':f'Bearer {TOKEN}','Accept':'application/json'})
          cs=[p for p in ps] if s==200 and isinstance(ps,list) else []
          cs=[p for p in cs if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(cs)!=1: raise SystemExit(2)
          ref=str(cs[0].get('id') or cs[0].get('ref'))
          ks,kdata=call(f'{API}/projects/{ref}/api-keys',{'Authorization':f'Bearer {TOKEN}','Accept':'application/json'})
          if ks!=200 or not isinstance(kdata,list): print('KEY_LOOKUP_STATUS',ks); raise SystemExit(3)
          svc=None
          for k in kdata:
              name=str(k.get('name') or k.get('type') or '').lower()
              if name in ('service_role','secret') or 'service' in name:
                  svc=str(k.get('api_key') or k.get('key') or '')
                  if svc: break
          if not svc: print('NO_SERVER_STORAGE_KEY'); raise SystemExit(4)
          print('::add-mask::'+svc)
          storage=f'https://{ref}.supabase.co/storage/v1/object/authenticated/truely-product-images/ops/collx-full-migration-20260811/classification.json'
          ss,c=call(storage,{'Authorization':f'Bearer {svc}','apikey':svc})
          if ss!=200 or not isinstance(c,dict): print('CLASSIFICATION_DOWNLOAD_STATUS',ss); raise SystemExit(5)
          imports=[str(x) for x in c.get('import_collx_ids') or []]; matches=c.get('matches') or []
          q=f"select substring(sku from 7) collx_id from public.products where store_id='{STORE}'::uuid and sku>='COLLX-' and sku<'COLLY';"
          ds,db=call(f'{API}/projects/{ref}/database/query',{'Authorization':f'Bearer {TOKEN}','Accept':'application/json','Content-Type':'application/json'},'POST',{'query':q,'parameters':[],'read_only':True})
          if ds not in (200,201): raise SystemExit(6)
          dbids={str(x['collx_id']) for x in db}; importset=set(imports); matchids={str(x.get('collx_id')) for x in matches if x.get('collx_id') is not None}
          from collections import Counter
          out={'schema':c.get('schema'),'sourceRows':c.get('sourceRows'),'sourceSha':c.get('sourceSha'),'summary':c.get('summary'),'import_ids':len(imports),'unique_import_ids':len(importset),'match_rows':len(matches),'unique_match_ids':len(matchids),'db_collx_ids':len(dbids),'imports_missing_db':len(importset-dbids),'db_not_classified_import':len(dbids-importset),'import_match_overlap':len(importset&matchids),'classified_union':len(importset|matchids),'match_reason_counts':Counter(str(x.get('reason')) for x in matches)}
          print('CLASSIFICATION_RECEIPT='+json.dumps(out,default=str))
          if int(c.get('sourceRows') or 0)!=6909 or len(importset)!=6155 or len(matchids)!=754 or len(importset|matchids)!=6909 or importset&matchids or importset!=dbids: raise SystemExit(10)
          print('COLLX_CLASSIFICATION_RECEIPT_V2=SUCCESS')
          PY
