# Priority lane: drain all other checklist writers, then load the eight WNBA PDFs alone.
name: Checklist WNBA Priority Production Load 20260815

on:
  push:
    branches:
      - ops/checklist-conveyor-live-20260815
    paths:
      - '.github/workflows/checklist-wnba-priority-production-load-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PUBLIC_WEB_MINIMUM_CARD_ROWS: '25'

jobs:
  wnba-production-load:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 110
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Drain overlapping checklist workflow runs
        shell: bash
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checklist-drain"
          mkdir -p "$root"
          repo="$GITHUB_REPOSITORY"
          self="$GITHUB_RUN_ID"

          list_conflicts() {
            : > "$root/conflicts.txt"
            for state in in_progress queued; do
              curl --silent --show-error --fail --retry 3 --retry-all-errors --max-time 30 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_ACTIONS_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$repo/actions/runs?status=$state&per_page=100" \
                -o "$root/$state.json"
              jq -r --arg self "$self" '
                .workflow_runs[]
                | select((.id | tostring) != $self)
                | select((.path // "") | startswith(".github/workflows/checklist-"))
                | [.id, .name, .path, .status] | @tsv
              ' "$root/$state.json" >> "$root/conflicts.txt"
            done
            sort -u "$root/conflicts.txt" -o "$root/conflicts.txt"
          }

          list_conflicts
          if [ -s "$root/conflicts.txt" ]; then
            echo "Cancelling overlapping checklist runs before the priority WNBA Production load:"
            cat "$root/conflicts.txt"
            while IFS=$'\t' read -r run_id run_name run_path run_status; do
              [ -n "$run_id" ] || continue
              echo "Cancel $run_id :: $run_name :: $run_status"
              code="$(curl --silent --show-error --output "$root/cancel-$run_id.json" --write-out '%{http_code}' \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_ACTIONS_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$repo/actions/runs/$run_id/cancel")"
              case "$code" in
                202|409) ;;
                *) echo "Unexpected cancel response $code for run $run_id"; cat "$root/cancel-$run_id.json"; exit 1 ;;
              esac
            done < "$root/conflicts.txt"
          else
            echo "No overlapping checklist workflow runs found."
          fi

          for round in 1 2 3 4 5 6 7 8 9; do
            sleep 10
            list_conflicts
            remaining="$(wc -l < "$root/conflicts.txt" | tr -d ' ')"
            echo "Checklist drain round $round: $remaining conflicting run(s) remain"
            if [ "$remaining" -eq 0 ]; then
              break
            fi
            if [ "$round" -eq 9 ]; then
              echo "Checklist writers failed to drain. Refusing to overload Production Supabase."
              cat "$root/conflicts.txt"
              exit 1
            fi
          done

          echo "Checklist writer lane is clear."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          npm ci
          node --check scripts/promote-mainstream-2005plus-public-web-candidates.mjs

      - name: Resolve Production Supabase
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wnba-production"
          mkdir -p "$root"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --max-time 45 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$root/projects.json" "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --max-time 45 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$root/api-keys.json" "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$root/api-keys.json")"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$project_ref.supabase.co" >> "$GITHUB_ENV"
          echo "RESOLVED_SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Build deterministic WNBA target queue
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wnba-load"
          mkdir -p "$out"

          OUT="$out" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const out = process.env.OUT;
          const desired = [
            { exactSetKey: 'basketball|2024|panini|origins-wnba', year: 2024, name: '2024 Panini Origins WNBA', url: 'https://gogts.net/wp-content/uploads/2024/10/2024-Panini-Origins-WNBA-Basketball-Cards-Checklist.pdf' },
            { exactSetKey: 'basketball|2024|panini|select-wnba', year: 2024, name: '2024 Panini Select WNBA', url: 'https://gogts.net/wp-content/uploads/2024/10/2024-Panini-Select-WNBA-Basketball-Cards-Checklist.pdf' },
            { exactSetKey: 'basketball|2024|panini|prizm-wnba', year: 2024, name: '2024 Panini Prizm WNBA', url: 'https://gogts.net/wp-content/uploads/2025/02/2024-Panini-Prizm-WNBA-Basketball-Cards-Checklist.pdf' },
            { exactSetKey: 'basketball|2025|panini|donruss-wnba', year: 2025, name: '2025 Donruss WNBA', url: 'https://gogts.net/wp-content/uploads/2025/09/2025-Donruss-WNBA-Basketball-Cards-Checklist.pdf' },
            { exactSetKey: 'basketball|2025|panini|prizm-wnba', year: 2025, name: '2025 Panini Prizm WNBA', url: 'https://gogts.net/wp-content/uploads/2026/03/2025-Panini-Prizm-WNBA-Basketball-Cards-Checklist.pdf' },
            { exactSetKey: 'basketball|2025|panini|select-wnba', year: 2025, name: '2025 Panini Select WNBA', url: 'https://gogts.net/wp-content/uploads/2026/04/2025-Panini-Select-WNBA-Basketball-Cards-Checklist.pdf' },
            { exactSetKey: 'basketball|2025|panini|impeccable-wnba', year: 2025, name: '2025 Panini Impeccable WNBA', url: 'https://gogts.net/wp-content/uploads/2025/12/2025-Panini-Impeccable-WNBA-Basketball-Cards-Checklist.pdf' },
            { exactSetKey: 'basketball|2025|panini|one-and-one-wnba', year: 2025, name: '2025 Panini One and One WNBA', url: 'https://gogts.net/wp-content/uploads/2026/03/2025-Panini-One-and-One-WNBA-Basketball-Cards-Checklist.pdf' }
          ];
          const targets = desired.map(d => ({
            exactSetKey: d.exactSetKey,
            year: d.year,
            sport: 'basketball',
            sourceArtifact: 'priority-wnba-production-load-20260815-direct-pdf',
            exactCandidateCount: 1,
            trustedAutoImportCandidateCount: 1,
            candidates: [],
            sourceUrl: d.url,
            desiredName: d.name,
            deterministicKey: true
          }));
          writeFileSync(join(out, 'queue.json'), JSON.stringify({
            schema: 'tcos.checklist.mainstream2005plusCandidateValidationQueue.v1',
            count: targets.length,
            targets: targets.map(({sourceUrl,desiredName,deterministicKey,...t}) => t)
          }, null, 2));
          writeFileSync(join(out, 'filter.json'), JSON.stringify({
            schema: 'tcos.checklist.wnbaPriorityTargets.v1',
            targets: targets.map(t => ({ exactSetKey: t.exactSetKey, sourceUrl: t.sourceUrl }))
          }, null, 2));
          writeFileSync(join(out, 'resolved-targets.json'), JSON.stringify({ count: targets.length, targets }, null, 2));
          console.log(JSON.stringify({ targets: targets.map(t => ({ name:t.desiredName, exactSetKey:t.exactSetKey, sourceUrl:t.sourceUrl })) }, null, 2));
          NODE

      - name: Import WNBA targets into Production Registry
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RESOLVED_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wnba-load"
          imported=false
          for attempt in 1 2 3 4 5; do
            echo "Production Registry importer attempt $attempt/5"
            if PUBLIC_WEB_CANDIDATE_QUEUE="$out/queue.json" \
              PUBLIC_WEB_TARGET_FILTER="$out/filter.json" \
              PUBLIC_WEB_PROMOTION_APPLY=true \
              PUBLIC_WEB_PROMOTION_OUTPUT="$out/receipt.json" \
              PUBLIC_WEB_VALIDATED_TARGETS_OUTPUT="$out/validated.json" \
              PUBLIC_WEB_MINING_RUN_ID="$GITHUB_RUN_ID" \
              PUBLIC_WEB_AGGREGATE_RUN_ID="$GITHUB_RUN_ID" \
              node --import tsx scripts/promote-mainstream-2005plus-public-web-candidates.mjs; then
              imported=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "Importer startup failed; retrying after ${delay}s"
              sleep "$delay"
            fi
          done
          test "$imported" = true

      - name: Require verified Production persistence for every WNBA target
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/wnba-load/receipt.json"
          jq . "$receipt"
          expected="$(jq '.count' "$RUNNER_TEMP/wnba-load/resolved-targets.json")"
          imported="$(jq '[.results[] | select(.status == "imported" and .persistence.ok == true)] | length' "$receipt")"
          echo "WNBA verified persisted: $imported / $expected"
          jq -r '.results[] | [.exactSetKey,.status,(.counts.cards // 0),(.counts.parallels // 0),(.persistence.ok // false),(.persistence.idempotent // false),(.message // "")] | @tsv' "$receipt"
          test "$imported" -eq "$expected"

      - name: Upload WNBA Production receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-wnba-priority-production-load-${{ github.run_id }}
          path: ${{ runner.temp }}/wnba-load
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup protected files
        if: always()
        run: rm -rf "$RUNNER_TEMP/wnba-production" "$RUNNER_TEMP/checklist-drain" .env.local .env.production.local .vercel
