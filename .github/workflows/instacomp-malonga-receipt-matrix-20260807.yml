name: InstaComp Malonga Receipt Matrix 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-malonga-receipt-matrix-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  TEMP_DIR: /tmp/instacomp-malonga-receipt-matrix-20260807

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-registry-consensus-final-v3-20260807
          fetch-depth: 0

      - name: Apply pending web-only repairs in workspace
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/patch-instacomp-registry-consensus-final-v3-20260807.py
          python scripts/ops/patch-instacomp-exact-receipt-serial-v4-20260807.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and resolve read-only Production credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEMP_DIR"
          npm ci
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$TEMP_DIR/production.env"; runtime_file="$TEMP_DIR/runtime-env.sh"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PRODUCTION_ENV_PATH="$env_file" RUNTIME_ENV_PATH="$runtime_file" GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node - <<'NODE'
          const fs=require('node:fs'); const parsed={};
          for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)){
            const line=raw.trim(); if(!line||line.startsWith('#'))continue; const i=line.indexOf('='); if(i<1)continue;
            const k=line.slice(0,i).trim(); let v=line.slice(i+1).trim(); if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}} parsed[k]=v;
          }
          (async()=>{
            const u=String(parsed.NEXT_PUBLIC_SUPABASE_URL||'').trim(); if(!u)throw Error('Missing Production Supabase URL');
            const ref=new URL(u).hostname.split('.')[0];
            const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`,{headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`}});
            const text=await r.text(); if(!r.ok)throw Error(`Supabase key lookup HTTP ${r.status}`);
            const keys=text?JSON.parse(text):[]; const val=e=>String(e?.api_key||e?.key||e?.value||'');
            const modern=keys.find(e=>/^sb_secret_/i.test(val(e))); const legacy=keys.find(e=>e?.name==='service_role'&&/^eyJ/.test(val(e)))||keys.find(e=>e?.secret_jwt_template?.role==='service_role'&&/^eyJ/.test(val(e)));
            const key=val(modern||legacy); if(!key)throw Error('No Production server key');
            console.log(`::add-mask::${u}`); console.log(`::add-mask::${key}`);
            fs.writeFileSync(process.env.RUNTIME_ENV_PATH,`export NEXT_PUBLIC_SUPABASE_URL=${JSON.stringify(u)}\nexport SUPABASE_SERVICE_ROLE_KEY=${JSON.stringify(key)}\n`,{mode:0o600});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Run Malonga exact-receipt field isolation matrix
        shell: bash
        run: |
          set -euo pipefail
          source "$TEMP_DIR/runtime-env.sh"
          cat > malonga-matrix-temp.ts <<'TS'
          import { revalidateChecklistRegistryReceipt, resolveChecklistRegistry } from "./src/lib/instacomp-learning-server";

          const id = "bde0577b-72e8-4e59-8287-89aaf2f9e7e2";
          const fp = "112f66efaa6b13de4f33e18f632a5c364c8bd2895b610d157a538748c858ba32";
          const original:any = {
            player:"Dominique Malonga", year:"2025", brand:"Panini", setName:"Base", cardNumber:"116",
            parallel:"Prizms Ice", serialNumber:"/299", team:"Seattle Storm", sport:"Basketball",
            isRookie:true, isAuto:false, isRelic:false,
          };
          const variants:any[] = [
            ["original", original],
            ["noSerial", {...original, serialNumber:null}],
            ["noTeam", {...original, team:null}],
            ["noSport", {...original, sport:null}],
            ["noRookie", {...original, isRookie:null}],
            ["noSerialNoTeam", {...original, serialNumber:null, team:null}],
            ["minimalIce", {player:"Dominique Malonga",year:"2025",brand:"Panini",setName:"Base",cardNumber:"116",parallel:"Prizms Ice",isAuto:false,isRelic:false}],
            ["minimalNoParallel", {player:"Dominique Malonga",year:"2025",brand:"Panini",setName:"Base",cardNumber:"116",isAuto:false,isRelic:false}],
          ];
          async function main(){
            for (const [name, ai] of variants) {
              const receipt = await revalidateChecklistRegistryReceipt({ai,identityId:id,fingerprintSha256:fp});
              const generic = await resolveChecklistRegistry(ai,{evidenceTrusted:false});
              console.log("MATRIX="+JSON.stringify({
                name,
                receipt: receipt ? {status:receipt.status,id:receipt.match?.identityId||null,fp:receipt.match?.fingerprintSha256||null,set:receipt.match?.setName||null,parallel:receipt.match?.parallel||null,team:receipt.match?.team||null,serialRun:receipt.match?.serialRun??null,reasons:receipt.reasons} : null,
                generic: {status:generic.status,id:generic.match?.identityId||null,fp:generic.match?.fingerprintSha256||null,set:generic.match?.setName||null,parallel:generic.match?.parallel||null,team:generic.match?.team||null,serialRun:generic.match?.serialRun??null,candidateCount:generic.candidateCount,reasons:generic.reasons}
              }));
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          npx tsx malonga-matrix-temp.ts
          rm -f malonga-matrix-temp.ts

      - name: Remove temporary files
        if: always()
        run: rm -rf "$TEMP_DIR" malonga-matrix-temp.ts
