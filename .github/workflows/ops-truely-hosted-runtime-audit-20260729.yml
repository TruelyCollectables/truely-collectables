name: Truely Hosted Runtime Audit 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-truely-hosted-runtime-audit-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-hosted-runtime-audit-20260729
  cancel-in-progress: false

jobs:
  hosted-runtime-audit:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/truely-full-launch-audit-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      EVIDENCE_DIR: /tmp/truely-hosted-runtime-audit
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel "$EVIDENCE_DIR"
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-identity.txt" 2>&1
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          node -e 'const p=require("./.vercel/project.json"); if(!p.orgId||!p.projectId) process.exit(1);'
          npx vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/production-env-names.txt" 2>&1
          for key in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY STRIPE_SECRET_KEY EBAY_CLIENT_ID EBAY_CLIENT_SECRET RESEND_API_KEY; do
            grep -Fq "$key" "$EVIDENCE_DIR/production-env-names.txt"
          done

      - name: Create protected read-only hosted audit route
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$AUDIT_TOKEN"
          echo "AUDIT_TOKEN=$AUDIT_TOKEN" >> "$GITHUB_ENV"
          mkdir -p src/app/api/internal/hosted-runtime-audit-20260729
          cat > src/app/api/internal/hosted-runtime-audit-20260729/route.js <<'ROUTE'
          import { timingSafeEqual } from "node:crypto";
          import Stripe from "stripe";
          import { createClient } from "@supabase/supabase-js";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";
          export const revalidate = 0;
          export const maxDuration = 120;

          function equal(left, right) {
            const a = Buffer.from(String(left || ""), "utf8");
            const b = Buffer.from(String(right || ""), "utf8");
            return a.length > 0 && a.length === b.length && timingSafeEqual(a, b);
          }

          function json(body, status = 200) {
            return Response.json(body, {
              status,
              headers: {
                "Cache-Control": "no-store, max-age=0",
                Pragma: "no-cache",
                "X-Content-Type-Options": "nosniff",
              },
            });
          }

          async function auditSupabase() {
            const url = String(process.env.NEXT_PUBLIC_SUPABASE_URL || "");
            const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || "");
            if (!url || !key) throw new Error("Supabase hosted credentials are unavailable.");
            const client = createClient(url, key, {
              auth: { persistSession: false, autoRefreshToken: false },
            });
            const products = await client.from("products").select("id", { count: "exact", head: true });
            if (products.error) throw new Error(`Supabase products audit failed: ${products.error.message}`);
            const sellers = await client.from("seller_profiles").select("id", { count: "exact", head: true });
            if (sellers.error) throw new Error(`Supabase seller audit failed: ${sellers.error.message}`);
            return {
              configured: true,
              productsReadable: true,
              sellersReadable: true,
              productCount: products.count ?? null,
              sellerCount: sellers.count ?? null,
            };
          }

          async function auditStripe() {
            const dedicated = String(process.env.STRIPE_LIVE_SECRET_KEY || "");
            const generic = String(process.env.STRIPE_SECRET_KEY || "");
            const key = dedicated.startsWith("sk_live_") ? dedicated : generic.startsWith("sk_live_") ? generic : "";
            if (!key) throw new Error("A live Stripe secret key is unavailable.");
            const stripe = new Stripe(key);
            const balance = await stripe.balance.retrieve();
            const endpoints = await stripe.webhookEndpoints.list({ limit: 100 });
            const custom = endpoints.data.filter((entry) => entry.url === "https://truelycollectables.com/api/webhook");
            if (custom.length !== 1 || custom[0].status !== "enabled") {
              throw new Error(`Expected one enabled custom-domain Stripe webhook; found ${custom.length}.`);
            }
            return {
              configured: true,
              authenticated: true,
              liveMode: balance.livemode === true,
              customWebhookCount: custom.length,
              customWebhookEnabled: custom[0].status === "enabled",
              enabledEventCount: custom[0].enabled_events.length,
            };
          }

          async function auditEbay() {
            const clientId = String(process.env.EBAY_CLIENT_ID || "");
            const clientSecret = String(process.env.EBAY_CLIENT_SECRET || "");
            if (!clientId || !clientSecret) throw new Error("eBay hosted credentials are unavailable.");
            const basic = Buffer.from(`${clientId}:${clientSecret}`).toString("base64");
            const tokenResponse = await fetch("https://api.ebay.com/identity/v1/oauth2/token", {
              method: "POST",
              headers: {
                Authorization: `Basic ${basic}`,
                "Content-Type": "application/x-www-form-urlencoded",
              },
              body: new URLSearchParams({
                grant_type: "client_credentials",
                scope: "https://api.ebay.com/oauth/api_scope",
              }),
            });
            const tokenBody = await tokenResponse.json();
            if (!tokenResponse.ok || !tokenBody.access_token) {
              throw new Error(`eBay application-token audit failed with HTTP ${tokenResponse.status}.`);
            }
            const searchResponse = await fetch("https://api.ebay.com/buy/browse/v1/item_summary/search?q=Ivan%20Demidov%20rookie%20card&limit=1", {
              headers: { Authorization: `Bearer ${tokenBody.access_token}` },
            });
            const searchBody = await searchResponse.json();
            if (!searchResponse.ok) {
              throw new Error(`eBay Browse audit failed with HTTP ${searchResponse.status}.`);
            }
            return {
              configured: true,
              applicationTokenAuthenticated: true,
              browseAuthenticated: true,
              resultCount: Array.isArray(searchBody.itemSummaries) ? searchBody.itemSummaries.length : 0,
            };
          }

          async function auditResend() {
            const key = String(process.env.RESEND_API_KEY || "");
            if (!key) throw new Error("Resend hosted credential is unavailable.");
            const result = await fetch("https://api.resend.com/emails", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${key}`,
                "Content-Type": "application/json",
                "User-Agent": "truelycollectables-launch-audit/1.0",
              },
              body: "{}",
            });
            if (result.status === 401 || result.status === 403) {
              throw new Error(`Resend authentication failed with HTTP ${result.status}.`);
            }
            if (result.ok) {
              throw new Error("The deliberately invalid Resend request unexpectedly sent an email.");
            }
            return {
              configured: true,
              authenticated: true,
              noEmailSent: true,
              validationStatus: result.status,
            };
          }

          export async function POST(request) {
            if (!equal(request.headers.get("x-tcos-runtime-audit-token"), process.env.TCOS_RUNTIME_AUDIT_TOKEN)) {
              return json({ ok: false, code: "UNAUTHORIZED" }, 401);
            }
            try {
              const [supabase, stripe, ebay, resend] = await Promise.all([
                auditSupabase(),
                auditStripe(),
                auditEbay(),
                auditResend(),
              ]);
              return json({
                ok: true,
                environment: process.env.VERCEL_ENV || null,
                supabase,
                stripe,
                ebay,
                resend,
              });
            } catch (error) {
              return json({
                ok: false,
                code: "HOSTED_RUNTIME_AUDIT_FAILED",
                error: error instanceof Error ? error.message : String(error),
              }, 500);
            }
          }
          ROUTE
          git diff --check

      - name: Stage disposable Production-environment audit deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy --prod --yes --force --skip-domain \
            --meta "launchPurpose=hosted-runtime-read-only-audit" \
            --env "TCOS_RUNTIME_AUDIT_TOKEN=$AUDIT_TOKEN" \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/vercel-deploy.log"
          AUDIT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$EVIDENCE_DIR/vercel-deploy.log" | head -n 1)"
          test -n "$AUDIT_URL"
          echo "audit_url=$AUDIT_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$AUDIT_URL" > "$EVIDENCE_DIR/audit-deployment-url.txt"

      - name: Run protected hosted runtime audit
        env:
          AUDIT_URL: ${{ steps.deploy.outputs.audit_url }}
        shell: bash
        run: |
          set -euo pipefail
          unauthorized="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output "$EVIDENCE_DIR/unauthorized.json" --write-out '%{http_code}' --request POST "$AUDIT_URL/api/internal/hosted-runtime-audit-20260729")"
          test "$unauthorized" = "401"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 180 \
            --output "$EVIDENCE_DIR/hosted-runtime-audit.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "x-tcos-runtime-audit-token: $AUDIT_TOKEN" \
            --data '{}' \
            "$AUDIT_URL/api/internal/hosted-runtime-audit-20260729")"
          test "$code" = "200"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/hosted-runtime-audit.json', 'utf8'));
          if (value.ok !== true || value.environment !== 'production') throw new Error('Hosted runtime audit did not pass in Production environment.');
          if (value.supabase?.productsReadable !== true || value.supabase?.sellersReadable !== true) throw new Error('Supabase hosted proof failed.');
          if (value.stripe?.authenticated !== true || value.stripe?.liveMode !== true || value.stripe?.customWebhookEnabled !== true) throw new Error('Stripe hosted proof failed.');
          if (value.ebay?.applicationTokenAuthenticated !== true || value.ebay?.browseAuthenticated !== true) throw new Error('eBay hosted proof failed.');
          if (value.resend?.authenticated !== true || value.resend?.noEmailSent !== true) throw new Error('Resend hosted proof failed.');
          NODE

      - name: Remove disposable audit deployment
        if: always()
        env:
          AUDIT_URL: ${{ steps.deploy.outputs.audit_url }}
        shell: bash
        run: |
          set +e
          if [ -n "${AUDIT_URL:-}" ]; then
            npx vercel@56.2.0 remove "$AUDIT_URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-remove.log" 2>&1
          fi
          exit 0

      - name: Upload sanitized hosted runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-hosted-runtime-integrations
          path: /tmp/truely-hosted-runtime-audit
          if-no-files-found: error
          retention-days: 30
