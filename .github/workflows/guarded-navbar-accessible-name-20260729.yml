name: Guarded navbar accessible name remediation 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/guarded-navbar-accessible-name-20260729.yml"
      - "src/app/components/Navbar.tsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-navbar-accessible-name-20260729
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 9be5ed27f110b87535bd8b736ad3be2ca7e21244
  EXPECTED_BRANCH: fix/launch-navbar-accessible-name-20260729
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
  ADMIN_SESSION_SECRET: build-only-placeholder-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-only-placeholder-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_only_placeholder
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
  EBAY_CLIENT_ID: build-only-placeholder-client-id
  EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on branch or main drift
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          unexpected="$(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | grep -Ev '^(\.github/workflows/guarded-navbar-accessible-name-20260729\.yml|src/app/components/Navbar\.tsx)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected branch changes:\n%s\n' "$unexpected" >&2; exit 1; }

      - name: Apply exact accessible-name repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/components/Navbar.tsx')
          text = path.read_text()
          target = '              aria-label={`${STORE_BRAND_NAME} home`}\n'
          if target in text:
              if text.count(target) != 1:
                  raise SystemExit('Expected exactly one overriding brand-link aria-label')
              text = text.replace(target, '', 1)
              path.write_text(text)

          final = path.read_text()
          if 'aria-label={`${STORE_BRAND_NAME} home`}' in final:
              raise SystemExit('Overriding brand-link aria-label remains')
          if 'href="/"' not in final or '{storeMark(STORE_BRAND_NAME)}' not in final or '{STORE_BRAND_NAME}' not in final or 'The Card Wall' not in final:
              raise SystemExit('Visible brand-link naming content was unexpectedly changed')
          PY
          git diff --check
          git diff -- src/app/components/Navbar.tsx

      - name: Install exact dependencies
        run: npm ci

      - name: Verify navbar accessible-name contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/app/components/Navbar.tsx', 'utf8');
          const brandLink = source.match(/<Link\s+href="\/"[\s\S]*?<\/Link>/)?.[0];
          if (!brandLink) throw new Error('Brand home link was not found');
          if (/aria-label=/.test(brandLink)) throw new Error('Brand home link still overrides its visible accessible name');
          for (const required of ['{storeMark(STORE_BRAND_NAME)}', '{STORE_BRAND_NAME}', 'The Card Wall']) {
            if (!brandLink.includes(required)) throw new Error(`Brand home link lost visible naming content: ${required}`);
          }
          console.log('Navbar accessible-name contract passed.');
          NODE

      - name: Run repository lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run full Production build
        run: npm run build

      - name: Commit only the validated source repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          for file in "${changed[@]}"; do
            test "$file" = "src/app/components/Navbar.tsx" || { echo "Unexpected changed file: $file" >&2; exit 1; }
          done
          if git diff --quiet; then
            echo "Exact source repair already committed; validation-only pass."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/components/Navbar.tsx
          git commit -m "Use visible navbar brand accessible name"
          git push origin "HEAD:$EXPECTED_BRANCH"
