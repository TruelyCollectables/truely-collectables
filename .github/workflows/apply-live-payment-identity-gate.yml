name: Apply Live Payment Identity Gate

on:
  push:
    branches:
      - agent/live-payment-identity-gate-20260726
    paths:
      - scripts/apply-live-payment-identity-gate.mjs
      - .github/workflows/apply-live-payment-identity-gate.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'TruelyCollectables'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out identity-gate branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-payment-identity-gate-20260726
          fetch-depth: 0

      - name: Apply exact identity-gate transformation
        run: node scripts/apply-live-payment-identity-gate.mjs

      - name: Validate patch shape
        run: git diff --check

      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet -- src/lib/live-payment-launch-core.ts src/app/admin/launch-readiness/page.tsx scripts/audit-vercel-production-environment.mjs; then
            echo "No identity-gate changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/live-payment-launch-core.ts src/app/admin/launch-readiness/page.tsx scripts/audit-vercel-production-environment.mjs
          git commit -m "Block live payments without identity intelligence"
          git push origin HEAD:agent/live-payment-identity-gate-20260726
