name: Verify Seller Inventory Admin Production 20260730

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/app/api/release/seller-inventory-admin-live-test/route.ts"
      - ".github/workflows/verify-seller-inventory-admin-production-20260730.yml"

permissions:
  contents: read

concurrency:
  group: verify-seller-inventory-admin-production-20260730
  cancel-in-progress: false

jobs:
  deploy-test-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/verify-seller-inventory-admin-production-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      SOURCE_SHA: ac0a2b2c41e9bfacddb78561e085fadc795b5e41
      NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
      ADMIN_SESSION_SECRET: build-validation-admin-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-validation-admin-password
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_validation
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
      STRIPE_WEBHOOK_SECRET: whsec_build_validation
      EBAY_CLIENT_ID: build-validation-client-id
      EBAY_CLIENT_SECRET: build-validation-client-secret
      EBAY_ENVIRONMENT: production
      CRON_SECRET: build-validation-cron-secret-that-is-long-enough
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out isolated verifier branch
        uses: actions/checkout@v4
        with:
          ref: ops/verify-seller-inventory-admin-production-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove exact current main plus temporary verifier files
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          git diff --name-only "$SOURCE_SHA" HEAD | sort > /tmp/actual-files.txt
          printf '%s\n' \
            '.github/workflows/verify-seller-inventory-admin-production-20260730.yml' \
            'src/app/api/release/seller-inventory-admin-live-test/route.ts' \
            | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Link exact Vercel project
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .seller-admin-evidence
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link \
              --yes \
              --project truely-collectables \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          fi
          test -s .vercel/project.json
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN"

      - name: Validate temporary verifier build
        run: |
          set -euo pipefail
          npm ci
          node scripts/run-seller-inventory-admin-contracts.mjs
          npm run lint
          npx tsc --noEmit --pretty false
          npm run build

      - name: Deploy protected temporary verifier runtime
        id: temporary_deploy
        run: |
          set -euo pipefail
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee .seller-admin-evidence/temporary-deploy.log
          TEMPORARY_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' .seller-admin-evidence/temporary-deploy.log | tail -n 1)"
          test -n "$TEMPORARY_URL"
          echo "temporary_url=$TEMPORARY_URL" >> "$GITHUB_OUTPUT"
          echo "TEMPORARY_URL=$TEMPORARY_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$TEMPORARY_URL" > .seller-admin-evidence/temporary-deployment-url.txt

      - name: Prove temporary setup route is private
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
            --output .seller-admin-evidence/unauthorized-route.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"setup"}' \
            "$TEMPORARY_URL/api/release/seller-inventory-admin-live-test" || true)"
          test "$code" = "401"

      - name: Create two disposable sellers and two draft listings
        run: |
          set -euo pipefail
          SELLER_A_EMAIL="tcos-seller-admin-a-${GITHUB_RUN_ID}@example.com"
          SELLER_B_EMAIL="tcos-seller-admin-b-${GITHUB_RUN_ID}@example.com"
          SELLER_A_PASSWORD="$(openssl rand -base64 48 | tr -d '\n')"
          SELLER_B_PASSWORD="$(openssl rand -base64 48 | tr -d '\n')"
          MARKER="TCOS SELLER ADMIN LIVE TEST ${GITHUB_RUN_ID}"
          echo "::add-mask::$SELLER_A_PASSWORD"
          echo "::add-mask::$SELLER_B_PASSWORD"
          echo "SELLER_A_EMAIL=$SELLER_A_EMAIL" >> "$GITHUB_ENV"
          echo "SELLER_B_EMAIL=$SELLER_B_EMAIL" >> "$GITHUB_ENV"
          echo "SELLER_A_PASSWORD=$SELLER_A_PASSWORD" >> "$GITHUB_ENV"
          echo "SELLER_B_PASSWORD=$SELLER_B_PASSWORD" >> "$GITHUB_ENV"
          echo "MARKER=$MARKER" >> "$GITHUB_ENV"
          payload="$(jq -n \
            --arg sellerAEmail "$SELLER_A_EMAIL" \
            --arg sellerAPassword "$SELLER_A_PASSWORD" \
            --arg sellerBEmail "$SELLER_B_EMAIL" \
            --arg sellerBPassword "$SELLER_B_PASSWORD" \
            --arg marker "$MARKER" \
            '{action:"setup",sellerAEmail:$sellerAEmail,sellerAPassword:$sellerAPassword,sellerBEmail:$sellerBEmail,sellerBPassword:$sellerBPassword,marker:$marker}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 120 \
            --output .seller-admin-evidence/setup.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$TEMPORARY_URL/api/release/seller-inventory-admin-live-test" || true)"
          cat .seller-admin-evidence/setup.json
          test "$code" = "200"
          test "$(jq -r '.success' .seller-admin-evidence/setup.json)" = "true"
          SELLER_A_ID="$(jq -r '.sellers.a.id // empty' .seller-admin-evidence/setup.json)"
          SELLER_B_ID="$(jq -r '.sellers.b.id // empty' .seller-admin-evidence/setup.json)"
          ITEM_A_ID="$(jq -r '.items[0].inventoryItemId // empty' .seller-admin-evidence/setup.json)"
          ITEM_B_ID="$(jq -r '.items[1].inventoryItemId // empty' .seller-admin-evidence/setup.json)"
          PRODUCT_A_ID="$(jq -r '.items[0].legacyProductId // empty' .seller-admin-evidence/setup.json)"
          PRODUCT_B_ID="$(jq -r '.items[1].legacyProductId // empty' .seller-admin-evidence/setup.json)"
          test -n "$SELLER_A_ID"
          test -n "$SELLER_B_ID"
          test -n "$ITEM_A_ID"
          test -n "$ITEM_B_ID"
          test -n "$PRODUCT_A_ID"
          test -n "$PRODUCT_B_ID"
          echo "SELLER_A_ID=$SELLER_A_ID" >> "$GITHUB_ENV"
          echo "SELLER_B_ID=$SELLER_B_ID" >> "$GITHUB_ENV"
          echo "ITEM_A_ID=$ITEM_A_ID" >> "$GITHUB_ENV"
          echo "ITEM_B_ID=$ITEM_B_ID" >> "$GITHUB_ENV"
          echo "PRODUCT_A_ID=$PRODUCT_A_ID" >> "$GITHUB_ENV"
          echo "PRODUCT_B_ID=$PRODUCT_B_ID" >> "$GITHUB_ENV"

      - name: Log in through the real account route
        run: |
          set -euo pipefail
          for seller in A B; do
            email_var="SELLER_${seller}_EMAIL"
            password_var="SELLER_${seller}_PASSWORD"
            email="${!email_var}"
            password="${!password_var}"
            payload="$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password}')"
            output="/tmp/seller-${seller,,}-login.json"
            code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
              --output "$output" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "$TEMPORARY_URL/api/account/login" || true)"
            test "$code" = "200"
            token="$(jq -r '.session.access_token // empty' "$output")"
            refresh="$(jq -r '.session.refresh_token // empty' "$output")"
            test -n "$token"
            test -n "$refresh"
            echo "::add-mask::$token"
            echo "::add-mask::$refresh"
          done

      - name: Prove individual edit, bulk edit, and cross-seller denial
        run: |
          set -euo pipefail
          ACCESS_A="$(jq -r '.session.access_token' /tmp/seller-a-login.json)"
          ACCESS_B="$(jq -r '.session.access_token' /tmp/seller-b-login.json)"

          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .seller-admin-evidence/inventory-before.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ACCESS_A" \
            "$TEMPORARY_URL/api/account/seller/inventory-admin" || true)"
          test "$code" = "200"
          test "$(jq --arg marker "$MARKER" '[.items[] | select(.title | startswith($marker))] | length' .seller-admin-evidence/inventory-before.json)" = "2"
          test "$(jq -r '.account.isStoreOwner' .seller-admin-evidence/inventory-before.json)" = "false"

          individual_payload="$(jq -n \
            --arg id "$ITEM_A_ID" \
            --arg title "$MARKER ALPHA EDITED" \
            '{items:[{inventoryItemId:$id,title:$title,player:"Live Test Player",sport:"Baseball",price:15.55,quantity:5,status:"draft",category:"sports_cards",condition:"near_mint",description:"Disposable individual seller inventory edit proof."}]}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 120 \
            --output .seller-admin-evidence/individual-edit.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ACCESS_A" \
            --header 'Content-Type: application/json' \
            --data "$individual_payload" \
            "$TEMPORARY_URL/api/account/seller/inventory-admin" || true)"
          test "$code" = "200"
          test "$(jq -r '.summary.successCount' .seller-admin-evidence/individual-edit.json)" = "1"
          test "$(jq -r '.summary.failureCount' .seller-admin-evidence/individual-edit.json)" = "0"

          bulk_payload="$(jq -n \
            --arg first "$ITEM_A_ID" \
            --arg second "$ITEM_B_ID" \
            '{items:[{inventoryItemId:$first,price:33.33,quantity:7,status:"draft",category:"trading_cards",condition:"excellent"},{inventoryItemId:$second,price:33.33,quantity:7,status:"draft",category:"trading_cards",condition:"excellent"}]}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 120 \
            --output .seller-admin-evidence/bulk-edit.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ACCESS_A" \
            --header 'Content-Type: application/json' \
            --data "$bulk_payload" \
            "$TEMPORARY_URL/api/account/seller/inventory-admin" || true)"
          test "$code" = "200"
          test "$(jq -r '.summary.successCount' .seller-admin-evidence/bulk-edit.json)" = "2"
          test "$(jq -r '.summary.failureCount' .seller-admin-evidence/bulk-edit.json)" = "0"

          hostile_payload="$(jq -n --arg id "$ITEM_A_ID" '{items:[{inventoryItemId:$id,quantity:99}]}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 120 \
            --output .seller-admin-evidence/cross-seller-denial.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $ACCESS_B" \
            --header 'Content-Type: application/json' \
            --data "$hostile_payload" \
            "$TEMPORARY_URL/api/account/seller/inventory-admin" || true)"
          test "$code" = "200"
          test "$(jq -r '.summary.successCount' .seller-admin-evidence/cross-seller-denial.json)" = "0"
          test "$(jq -r '.summary.failureCount' .seller-admin-evidence/cross-seller-denial.json)" = "1"
          denial_status="$(jq -r '.results[0].status' .seller-admin-evidence/cross-seller-denial.json)"
          test "$denial_status" = "403" -o "$denial_status" = "404"

          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            --output .seller-admin-evidence/inventory-after.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ACCESS_A" \
            "$TEMPORARY_URL/api/account/seller/inventory-admin" || true)"
          test "$code" = "200"
          test "$(jq --arg first "$ITEM_A_ID" --arg second "$ITEM_B_ID" '[.items[] | select(.inventoryItemId == $first or .inventoryItemId == $second) | select(.quantity == 7 and .price == 33.33 and .category == "trading_cards" and .condition == "excellent")] | length' .seller-admin-evidence/inventory-after.json)" = "2"

      - name: Install headless Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove Account button, inventory workspace, login return, and links in a real browser
        env:
          DEPLOYMENT_URL: ${{ steps.temporary_deploy.outputs.temporary_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          (async () => {
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const login = JSON.parse(fs.readFileSync('/tmp/seller-a-login.json', 'utf8'));
            const session = login.session;
            const marker = process.env.MARKER;
            const email = process.env.SELLER_A_EMAIL;
            const password = process.env.SELLER_A_PASSWORD;
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              userAgent: 'TCOS-Seller-Inventory-Admin-Production-Verifier/20260730',
            });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error.message || error)));
            await page.addInitScript((storedSession) => {
              window.localStorage.setItem('tcos_account_session', JSON.stringify(storedSession));
            }, session);

            await page.goto(`${deploymentUrl}/account`, { waitUntil: 'domcontentloaded', timeout: 60_000 });
            const sellerNav = page.getByRole('navigation', { name: 'Seller account administration' });
            await sellerNav.waitFor({ state: 'visible', timeout: 60_000 });
            const inventoryButton = sellerNav.getByRole('link', { name: 'Inventory Admin', exact: true });
            if ((await inventoryButton.getAttribute('href')) !== '/seller/admin/inventory') {
              throw new Error('Account Inventory Admin button has the wrong destination.');
            }
            await inventoryButton.click();
            await page.waitForURL((url) => url.pathname === '/seller/admin/inventory', { timeout: 60_000 });
            await page.getByRole('heading', { name: 'Inventory Admin', exact: true }).waitFor({ timeout: 60_000 });
            await page.getByText(marker, { exact: false }).first().waitFor({ timeout: 60_000 });

            const requiredLinks = new Map([
              ['Account', '/account'],
              ['Orders', '/account/orders'],
              ['Seller Workspace', '/seller/inventory'],
              ['View Store', '/shop'],
            ]);
            for (const [label, href] of requiredLinks) {
              const link = page.getByRole('link', { name: label, exact: true }).last();
              if ((await link.getAttribute('href')) !== href) {
                throw new Error(`${label} link expected ${href}.`);
              }
              const response = await page.request.get(`${deploymentUrl}${href}`);
              if (response.status() !== 200) {
                throw new Error(`${label} destination returned ${response.status()}.`);
              }
            }

            if (await page.getByRole('link', { name: 'Storefront', exact: true }).count()) {
              throw new Error('Draft listings exposed a misleading Storefront link.');
            }
            if (!(await page.getByRole('button', { name: 'Save Selected Edits (0)', exact: true }).count())) {
              throw new Error('Bulk save control is missing.');
            }
            if (!(await page.getByRole('button', { name: /Apply Values to 0 Selected/ }).count())) {
              throw new Error('Bulk apply control is missing.');
            }

            await page.evaluate(() => window.localStorage.removeItem('tcos_account_session'));
            await page.goto(`${deploymentUrl}/account/login?next=/seller/admin/inventory`, {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            });
            await page.getByLabel('Email').fill(email);
            await page.getByLabel('Password').fill(password);
            await page.getByRole('button', { name: 'Log In', exact: true }).click();
            await page.waitForURL((url) => url.pathname === '/seller/admin/inventory', { timeout: 60_000 });
            await page.getByRole('heading', { name: 'Inventory Admin', exact: true }).waitFor({ timeout: 60_000 });
            await page.getByText(marker, { exact: false }).first().waitFor({ timeout: 60_000 });
            if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);

            await page.screenshot({ path: '.seller-admin-evidence/seller-inventory-admin-live.png', fullPage: true });
            const evidence = {
              ok: true,
              accountButtonHref: '/seller/admin/inventory',
              loginReturnPath: '/seller/admin/inventory',
              verifiedInternalLinks: Object.fromEntries(requiredLinks),
              draftStorefrontLinkCount: 0,
              bulkControlsPresent: true,
              disposableListingCount: 2,
              pageErrorCount: pageErrors.length,
            };
            fs.writeFileSync('.seller-admin-evidence/browser-evidence.json', JSON.stringify(evidence, null, 2));
            console.log(JSON.stringify(evidence));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Delete disposable sellers and listings
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${TEMPORARY_URL:-}" ] || [ -z "${SELLER_A_ID:-}" ] || [ -z "${SELLER_B_ID:-}" ]; then
            echo "No complete disposable seller setup was created."
            exit 0
          fi
          payload="$(jq -n --arg first "$SELLER_A_ID" --arg second "$SELLER_B_ID" '{action:"cleanup",userIds:[$first,$second]}')"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 120 \
            --output .seller-admin-evidence/cleanup.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$TEMPORARY_URL/api/release/seller-inventory-admin-live-test" || true)"
          cat .seller-admin-evidence/cleanup.json
          test "$code" = "200"
          test "$(jq -r '.success' .seller-admin-evidence/cleanup.json)" = "true"
          test "$(jq '.cleanupErrors | length' .seller-admin-evidence/cleanup.json)" = "0"

      - name: Redeploy exact clean merged main
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${TEMPORARY_URL:-}" ]; then
            echo "No temporary Production deployment occurred; no cleanup deployment is required."
            exit 0
          fi
          rm -rf /tmp/tcos-clean-seller-admin
          git worktree add --detach /tmp/tcos-clean-seller-admin "$SOURCE_SHA"
          mkdir -p /tmp/tcos-clean-seller-admin/.vercel
          cp .vercel/project.json /tmp/tcos-clean-seller-admin/.vercel/project.json
          cd /tmp/tcos-clean-seller-admin
          npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --force \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee "$GITHUB_WORKSPACE/.seller-admin-evidence/clean-deploy.log"
          CLEAN_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$GITHUB_WORKSPACE/.seller-admin-evidence/clean-deploy.log" | tail -n 1)"
          test -n "$CLEAN_URL"
          echo "CLEAN_URL=$CLEAN_URL" >> "$GITHUB_ENV"
          printf '%s\n' "$CLEAN_URL" > "$GITHUB_WORKSPACE/.seller-admin-evidence/clean-deployment-url.txt"

      - name: Verify clean custom-domain promotion and route boundaries
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${CLEAN_URL:-}" ]; then
            echo "No temporary deployment required cleanup verification."
            exit 0
          fi
          ready=""
          for attempt in $(seq 1 36); do
            account_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-account.html --write-out '%{http_code}' https://truelycollectables.com/account || true)"
            inventory_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-inventory.html --write-out '%{http_code}' https://truelycollectables.com/seller/admin/inventory || true)"
            workspace_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-seller-workspace.html --write-out '%{http_code}' https://truelycollectables.com/seller/inventory || true)"
            shop_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-shop.html --write-out '%{http_code}' https://truelycollectables.com/shop || true)"
            api_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-inventory-api.json --write-out '%{http_code}' https://truelycollectables.com/api/account/seller/inventory-admin || true)"
            verifier_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/live-verifier.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"action":"setup"}' https://truelycollectables.com/api/release/seller-inventory-admin-live-test || true)"
            echo "attempt=$attempt account=$account_code inventory=$inventory_code workspace=$workspace_code shop=$shop_code api=$api_code verifier=$verifier_code"
            if [ "$account_code" = "200" ] && [ "$inventory_code" = "200" ] && [ "$workspace_code" = "200" ] && [ "$shop_code" = "200" ] && [ "$api_code" = "401" ] && [ "$verifier_code" = "404" ]; then
              grep -q 'Inventory Admin' /tmp/live-inventory.html
              grep -q 'Shop Sports Cards' /tmp/live-shop.html
              ready=1
              break
            fi
            sleep 10
          done
          test -n "$ready"
          clean_inventory_code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output /tmp/clean-inventory.html --write-out '%{http_code}' "$CLEAN_URL/seller/admin/inventory" || true)"
          test "$clean_inventory_code" = "200"
          grep -q 'Inventory Admin' /tmp/clean-inventory.html
          cat > .seller-admin-evidence/final-live-boundary.json <<JSON
          {
            "ok": true,
            "sourceSha": "$SOURCE_SHA",
            "cleanDeploymentUrl": "$CLEAN_URL",
            "accountStatus": 200,
            "inventoryAdminStatus": 200,
            "sellerWorkspaceStatus": 200,
            "shopStatus": 200,
            "unauthenticatedInventoryApiStatus": 401,
            "temporaryVerifierRouteStatusAfterCleanDeploy": 404
          }
          JSON

      - name: Upload sanitized seller-admin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-inventory-admin-production-20260730-${{ github.run_number }}
          path: .seller-admin-evidence
          if-no-files-found: warn
          retention-days: 30
