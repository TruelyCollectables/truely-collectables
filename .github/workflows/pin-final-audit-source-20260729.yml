name: Pin Final Audit Production Source 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pin-final-audit-source-20260729.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pin-final-audit-source-20260729
  cancel-in-progress: false

jobs:
  pin:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/truely-full-launch-audit-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/truely-full-launch-audit-20260729
          fetch-depth: 0

      - name: Fail closed on exact audit source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "7765f115d44e2629d47cc38871273dacdafcb8e7"
          test "$(git hash-object .github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml)" = "1e65f0632ea4a7501fee68b724f0aec494cbeaaa"

      - name: Correct only the verified certificate CLI defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml')
          text = path.read_text()
          simulation_old = (
              "          mkdir -p evidence\n"
              "          for shard in 1 2 3 4 5 6; do\n"
              "            node scripts/run-truely-launch-audit-20260729.mjs \\\n"
              "              --mode simulations \\\n"
              "              --shard \"$shard\" \\\n"
              "              --total-shards 6 \\\n"
              "              --out \"evidence/shard-$shard\"\n"
              "          done\n"
          )
          simulation_new = (
              "          mkdir -p evidence\n"
              "          rm -rf .audit/simulations\n"
              "          for shard in 0 1 2 3 4 5; do\n"
              "            node scripts/run-truely-launch-audit-20260729.mjs simulations \\\n"
              "              --shard=\"$shard\" \\\n"
              "              --shards=6\n"
              "          done\n"
              "          cp -R .audit/simulations/. evidence/\n"
          )
          if text.count(simulation_old) != 1:
              raise SystemExit(f'Expected one simulation CLI block, found {text.count(simulation_old)}.')
          text = text.replace(simulation_old, simulation_new, 1)
          live_old = (
              "      - name: Run live Production crawl and security audit\n"
              "        run: node scripts/run-truely-launch-audit-20260729.mjs --mode live-production --base-url \"$BASE_URL\" --out evidence\n"
          )
          live_new = (
              "      - name: Run live Production crawl and security audit\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          rm -rf .audit/live\n"
              "          AUDIT_BASE_URL=\"$BASE_URL\" node scripts/run-truely-launch-audit-20260729.mjs live\n"
              "          mkdir -p evidence\n"
              "          cp -R .audit/live/. evidence/\n"
          )
          if text.count(live_old) != 1:
              raise SystemExit(f'Expected one live CLI block, found {text.count(live_old)}.')
          text = text.replace(live_old, live_new, 1)
          path.write_text(text)
          PY
          git diff --check
          grep -Fq 'node scripts/run-truely-launch-audit-20260729.mjs simulations' .github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml
          grep -Fq 'AUDIT_BASE_URL="$BASE_URL" node scripts/run-truely-launch-audit-20260729.mjs live' .github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml
          if grep -Fq -- '--mode simulations' .github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml; then exit 1; fi
          if grep -Fq -- '--mode live-production' .github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml; then exit 1; fi
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml"); puts "Certificate workflow YAML parsed."'

      - name: Stage validated certificate workflow as ordinary data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-staging-v2
          cp .github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml audit-staging-v2/ops-truely-full-launch-certificate-v2-20260729.yml
          sha256sum audit-staging-v2/ops-truely-full-launch-certificate-v2-20260729.yml > audit-staging-v2/ops-truely-full-launch-certificate-v2-20260729.sha256
          git checkout -- .github/workflows/ops-truely-full-launch-certificate-v2-20260729.yml
          git diff --quiet
          test -f audit-staging-v2/ops-truely-full-launch-certificate-v2-20260729.yml
          test -f audit-staging-v2/ops-truely-full-launch-certificate-v2-20260729.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-staging-v2/ops-truely-full-launch-certificate-v2-20260729.yml audit-staging-v2/ops-truely-full-launch-certificate-v2-20260729.sha256
          git commit -m "Stage corrected Production certificate V2 workflow"
          git push origin HEAD:ops/truely-full-launch-audit-20260729
