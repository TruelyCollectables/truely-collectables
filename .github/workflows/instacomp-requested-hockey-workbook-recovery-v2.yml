name: InstaComp Requested Hockey Recovery Queue

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/instacomp-requested-hockey-workbook-recovery-v2.yml'
      - 'scripts/instacomp-target-checklists/run-parameterized-workbook-recovery.mjs'
      - 'scripts/instacomp-target-checklists/resolve-production-supabase.mjs'
      - 'scripts/instacomp-target-checklists/apply-certified-layout-pdfs.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: instacomp-requested-hockey-wave-production
  cancel-in-progress: false

jobs:
  recover-requested-hockey:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 240
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERIFIED_HARVEST_ROOT: /home/runner/work/_temp/requested-hockey-recovery
      CERTIFIED_LAYOUT_PDF_PLAN_DIR: /home/runner/work/_temp/requested-hockey-recovery/combined-pdf-plans
      CERTIFIED_LAYOUT_PDF_APPLY_RECEIPT: /home/runner/work/_temp/requested-hockey-recovery/layout-pdf-apply-receipt.json
      CERTIFIED_LAYOUT_PDF_EXACT_KEYS_JSON: '["hockey|2021-22|topps|sticker-collection-nhl","hockey|2022-23|upper-deck|o-pee-chee-nhl","hockey|2022|leaf|art-of","hockey|2021-22|upper-deck|the-cup-nhl","hockey|2022-23|upper-deck|premier-nhl","hockey|2023-24|upper-deck|skybox-metal-universe-nhl","hockey|2024-25|upper-deck|series-two-nhl","hockey|2024-25|upper-deck|sp-authentic-nhl"]'
      CHECKLIST_REGISTRY_SET_CHUNK: '100'
      CHECKLIST_REGISTRY_CARD_CHUNK: '75'
      CHECKLIST_REGISTRY_PARALLEL_CHUNK: '100'
      CHECKLIST_REGISTRY_IDENTITY_CHUNK: '150'
      CHECKLIST_REGISTRY_RPC_ATTEMPTS: '5'
      CHECKLIST_REGISTRY_UPLOAD_ATTEMPTS: '5'
      WORKBOOK_TARGET_ATTEMPTS: '4'
      WORKBOOK_TARGET_RETRY_DELAY_MS: '15000'
      CERTIFIED_LAYOUT_PDF_ATTEMPTS: '4'
      CERTIFIED_LAYOUT_PDF_RETRY_MS: '15000'
      CERTIFIED_LAYOUT_PDF_PREFLIGHT_ATTEMPTS: '5'
      CERTIFIED_LAYOUT_PDF_WAVE_SIZE: '4'
      CERTIFIED_LAYOUT_PDF_WAVE_DELAY_MS: '300000'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install workbook readers
        run: python3 -m pip install --disable-pip-version-check openpyxl xlrd
      - name: Resolve Production Supabase credentials
        run: node scripts/instacomp-target-checklists/resolve-production-supabase.mjs

      - name: Download immutable 122-catalog harvest
        uses: actions/download-artifact@v4
        with:
          name: exhaustive-hockey-wnba-31924171342
          path: /home/runner/work/_temp/requested-hockey-recovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31924171342

      - name: Prove immutable source bundle
        run: jq -e '.targetCount == 122 and .readyCount == 90 and .validationFailedCount == 32 and .failedCount == 0' "$VERIFIED_HARVEST_ROOT/output/summary.json"

      - name: Download certified easy PDF recovery plans
        uses: actions/download-artifact@v4
        with:
          name: instacomp-layout-pdf-recovery-31975826952
          path: /home/runner/work/_temp/requested-hockey-recovery/pdf-easy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31975826952

      - name: Download certified duplicate-number PDF recovery plans
        uses: actions/download-artifact@v4
        with:
          name: instacomp-source-duplicate-pdf-recovery-31976899232
          path: /home/runner/work/_temp/requested-hockey-recovery/pdf-duplicates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31976899232

      - name: Prove and combine eight certified PDF plans
        shell: bash
        run: |
          set -euo pipefail
          easy="$VERIFIED_HARVEST_ROOT/pdf-easy/layout-pdf-recovery-receipt.json"
          duplicate="$VERIFIED_HARVEST_ROOT/pdf-duplicates/source-duplicate-pdf-recovery-receipt.json"
          test -s "$easy"
          test -s "$duplicate"
          jq -e '.targetCount == 3 and .validatedCount == 3 and .unresolvedCount == 0' "$easy"
          jq -e '.targetCount == 5 and .validatedCount == 5 and .unresolvedCount == 0' "$duplicate"
          mkdir -p "$CERTIFIED_LAYOUT_PDF_PLAN_DIR"
          cp "$VERIFIED_HARVEST_ROOT"/pdf-easy/layout-pdf-plans/*.json "$CERTIFIED_LAYOUT_PDF_PLAN_DIR"/
          cp "$VERIFIED_HARVEST_ROOT"/pdf-duplicates/source-duplicate-pdf-plans/*.json "$CERTIFIED_LAYOUT_PDF_PLAN_DIR"/
          test "$(find "$CERTIFIED_LAYOUT_PDF_PLAN_DIR" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = '8'

      - name: Recover seven requested workbook holdouts in waves of four
        id: workbook_recovery
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          root="$VERIFIED_HARVEST_ROOT/workbook-recovery-v2"
          mkdir -p "$root"
          keys=(
            'hockey|2021-22|upper-deck|black-diamond-nhl'
            'hockey|2021-22|upper-deck|o-pee-chee-nhl'
            'hockey|2021-22|upper-deck|sp-game-used-nhl'
            'hockey|2023|leaf|ultimate'
            'hockey|2024|leaf|metal-legends'
            'hockey|2025|upper-deck|national-hockey-card-day'
            'hockey|2026|upper-deck|national-hockey-card-day'
          )
          overall=0
          receipts=()
          for ((offset=0; offset<${#keys[@]}; offset+=4)); do
            wave=$((offset/4+1))
            echo "=== REQUESTED WORKBOOK WAVE $wave ==="
            pids=()
            wave_logs=()
            for ((j=offset; j<offset+4 && j<${#keys[@]}; j++)); do
              key="${keys[$j]}"
              receipt="$root/receipt-$j.json"
              log="$root/target-$j.log"
              receipts+=("$receipt")
              wave_logs+=("$log")
              payload="$(jq -cn --arg k "$key" '[$k]')"
              (
                export RECOVERY_EXACT_KEYS_JSON="$payload"
                export WORKBOOK_RECOVERY_RECEIPT="$receipt"
                node --import tsx scripts/instacomp-target-checklists/run-parameterized-workbook-recovery.mjs
              ) >"$log" 2>&1 &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do
              if ! wait "$pid"; then overall=1; fi
            done
            for log in "${wave_logs[@]}"; do cat "$log"; done
            if (( offset+4 < ${#keys[@]} )); then
              echo 'Five-minute workbook wave gap.'
              sleep 300
            fi
          done
          existing=()
          for receipt in "${receipts[@]}"; do
            [[ -s "$receipt" ]] && existing+=("$receipt")
          done
          if (( ${#existing[@]} )); then
            jq -s '{schema:"tcos.requestedHockeyWorkbookRecoveryCombined.v4",targetCount:7,receiptCount:length,persistedCount:(map(.persistedCount // 0)|add // 0),unresolvedCount:(map(.unresolvedCount // 0)|add // 0),persistedCards:(map(.persistedCards // 0)|add // 0),persistedIdentities:(map(.persistedIdentities // 0)|add // 0),receipts:.}' "${existing[@]}" > "$root/combined.json"
          else
            printf '%s\n' '{"schema":"tcos.requestedHockeyWorkbookRecoveryCombined.v4","targetCount":7,"receiptCount":0,"persistedCount":0,"unresolvedCount":7}' > "$root/combined.json"
            overall=1
          fi
          jq '{targetCount,receiptCount,persistedCount,unresolvedCount,persistedCards,persistedIdentities}' "$root/combined.json"
          exit "$overall"

      - name: Apply eight certified requested Hockey PDF catalogs in waves of four
        id: pdf_apply
        continue-on-error: true
        run: node --import tsx scripts/instacomp-target-checklists/apply-certified-layout-pdfs.mjs

      - name: Show combined requested Hockey recovery result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workbook="$VERIFIED_HARVEST_ROOT/workbook-recovery-v2/combined.json"
          pdf="$CERTIFIED_LAYOUT_PDF_APPLY_RECEIPT"
          echo '--- workbook recovery ---'
          test -s "$workbook" && jq '{targetCount,receiptCount,persistedCount,unresolvedCount,persistedCards,persistedIdentities}' "$workbook" || true
          echo '--- certified PDF apply ---'
          test -s "$pdf" && jq '{targetCount,persistedCount,alreadyLiveCount,failedCount,results:[.results[]|{exactSetKey,status,counts,error}]}' "$pdf" || true

      - name: Upload requested Hockey recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-requested-hockey-recovery-${{ github.run_id }}
          path: |
            /home/runner/work/_temp/requested-hockey-recovery/workbook-recovery-v2
            /home/runner/work/_temp/requested-hockey-recovery/layout-pdf-apply-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce recovery receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workbook="$VERIFIED_HARVEST_ROOT/workbook-recovery-v2/combined.json"
          pdf="$CERTIFIED_LAYOUT_PDF_APPLY_RECEIPT"
          test -s "$workbook"
          test -s "$pdf"
          jq -e '.receiptCount == 7 and .unresolvedCount == 0' "$workbook"
          jq -e '.targetCount == 8 and .failedCount == 0 and ((.persistedCount + .alreadyLiveCount) == 8)' "$pdf"
