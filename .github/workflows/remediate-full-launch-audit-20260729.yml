name: Remediate Full Launch Audit 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/remediate-full-launch-audit-20260729.yml"
      - "scripts/apply-full-launch-audit-remediation-20260729.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remediate-full-launch-audit-20260729
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
  ADMIN_SESSION_SECRET: build-only-placeholder-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-only-placeholder-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_only_placeholder
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
  EBAY_CLIENT_ID: build-only-placeholder-client-id
  EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  patch-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/full-launch-audit-remediation-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-launch-audit-remediation-20260729
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply remediation patch
        run: python scripts/apply-full-launch-audit-remediation-20260729.py

      - name: Remove one-time writer and workflow
        run: |
          rm scripts/apply-full-launch-audit-remediation-20260729.py
          rm .github/workflows/remediate-full-launch-audit-20260729.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Format remediation source
        run: |
          npx prettier --write \
            package.json \
            scripts/run-admin-dashboard-actions-simulations.mjs \
            scripts/run-admin-live-launch-gate-simulations.mjs \
            scripts/run-privileged-route-auth-regressions.mjs \
            scripts/smoke-admin-runtime.mjs \
            src/app/account/signup/layout.tsx \
            src/app/admin/order-notifications/page.tsx \
            src/app/admin/page.tsx \
            src/app/cart/page.tsx \
            src/app/page.tsx \
            src/app/shop/page.tsx \
            src/lib/lettertrack-export.ts \
            src/lib/shipping-simulations.ts

      - name: Run focused remediation regressions
        run: |
          npm run simulate:admin-dashboard-actions
          npm run simulate:shipping
          npm run simulate:admin-live-launch-gates
          npm run simulate:privileged-route-auth
          npm run simulate:admin-login
          node --import tsx scripts/run-buyer-account-no-card-regressions.ts
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts

      - name: Run ESLint
        run: npx eslint .

      - name: Run standalone TypeScript check
        run: npx tsc --noEmit

      - name: Run full production build
        run: npm run build

      - name: Confirm clean intended patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          allowed='^(.gitignore|ENV_BACKUP_DO_NOT_DELETE.txt|package.json|scripts/run-admin-dashboard-actions-simulations.mjs|scripts/run-admin-live-launch-gate-simulations.mjs|scripts/run-privileged-route-auth-regressions.mjs|scripts/smoke-admin-runtime.mjs|src/app/account/signup/layout.tsx|src/app/admin/order-notifications/page.tsx|src/app/admin/page.tsx|src/app/cart/page.tsx|src/app/page.tsx|src/app/shop/page.tsx|src/lib/lettertrack-export.ts|src/lib/shipping-simulations.ts)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected changed file: $file" >&2; exit 1; }
          done
          test ! -e ENV_BACKUP_DO_NOT_DELETE.txt
          test ! -e scripts/apply-full-launch-audit-remediation-20260729.py
          test ! -e .github/workflows/remediate-full-launch-audit-20260729.yml

      - name: Commit validated remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remediate full launch audit findings"
          git push origin HEAD:agent/full-launch-audit-remediation-20260729
