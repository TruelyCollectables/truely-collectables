name: Temporary InstaComp Key Verification PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-instacomp-key-verification-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-keys-and-six-card-proof:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/instacomp-exact-market-final-20260726')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com

    steps:
      - name: Confirm secrets are present
        run: |
          test -n "${OPENAI_API_KEY:-}"
          test -n "${SERPAPI_API_KEY:-}"

      - name: Validate OpenAI key
        run: |
          node <<'NODE'
          const response = await fetch("https://api.openai.com/v1/models", {
            headers: { Authorization: `Bearer ${process.env.OPENAI_API_KEY}` },
            signal: AbortSignal.timeout(30000),
          });
          console.log(`OpenAI credential HTTP status: ${response.status}`);
          if (!response.ok) process.exit(1);
          NODE

      - name: Validate SerpApi key
        run: |
          node <<'NODE'
          const url = new URL("https://serpapi.com/search.json");
          url.searchParams.set("engine", "ebay");
          url.searchParams.set("ebay_domain", "ebay.com");
          url.searchParams.set("_nkw", "sports card");
          url.searchParams.set("_ipg", "1");
          url.searchParams.set("api_key", process.env.SERPAPI_API_KEY);
          const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
          const payload = await response.json().catch(() => ({}));
          console.log(`SerpApi credential HTTP status: ${response.status}`);
          if (!response.ok || payload?.error) process.exit(1);
          NODE

      - name: Check out current PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run six-card exact-market proof
        run: node --import tsx scripts/run-instacomp-batch-001-live-market-proof.ts
