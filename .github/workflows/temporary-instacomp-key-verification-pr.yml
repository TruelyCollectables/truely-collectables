name: Temporary InstaComp Key Verification PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-instacomp-key-verification-pr.yml"
      - "scripts/apply-instacomp-provider-status-fix.py"
      - "scripts/run-instacomp-exact-provider-regressions.ts"
      - "scripts/run-instacomp-batch-001-live-market-proof.ts"
      - "src/lib/instacomp-exact-market-provider.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-visible-key-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify-keys-and-provider-proof:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/instacomp-exact-market-final-20260726')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Check out immutable audit revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run exact-provider regressions
        run: node --import tsx scripts/run-instacomp-exact-provider-regressions.ts

      - name: Validate OpenAI key
        run: |
          node <<'NODE'
          const response = await fetch("https://api.openai.com/v1/models", {
            headers: { Authorization: `Bearer ${process.env.OPENAI_API_KEY}` },
            signal: AbortSignal.timeout(30000),
          });
          console.log(`OpenAI credential HTTP status: ${response.status}`);
          if (!response.ok) process.exit(1);
          NODE

      - name: Validate SerpApi key
        run: |
          node <<'NODE'
          const url = new URL("https://serpapi.com/search.json");
          url.searchParams.set("engine", "ebay");
          url.searchParams.set("ebay_domain", "ebay.com");
          url.searchParams.set("_nkw", "sports card");
          url.searchParams.set("_ipg", "1");
          url.searchParams.set("api_key", process.env.SERPAPI_API_KEY);
          const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
          const payload = await response.json().catch(() => ({}));
          console.log(`SerpApi credential HTTP status: ${response.status}`);
          if (!response.ok || payload?.error) process.exit(1);
          NODE

      - name: Run live provider and rare-card safety proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs .codex-run
          node --import tsx scripts/run-instacomp-batch-001-live-market-proof.ts 2>&1 | tee .codex-run/instacomp-six-card-proof.log

      - name: Lint provider proof paths
        run: >-
          npx eslint
          src/lib/instacomp-exact-market-provider.ts
          scripts/run-instacomp-exact-provider-regressions.ts
          scripts/run-instacomp-batch-001-live-market-proof.ts

      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
          ADMIN_PASSWORD: build-only-placeholder-password
          ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
          STRIPE_SECRET_KEY: sk_test_build_only_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build-only-placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
          EBAY_CLIENT_ID: build-only-placeholder-client-id
          EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: npm run build

      - name: Upload provider proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-six-card-proof-${{ github.run_number }}
          path: |
            docs/instacomp-batch-001-live-market-proof.json
            .codex-run/instacomp-six-card-proof.log
          if-no-files-found: warn
          retention-days: 30
