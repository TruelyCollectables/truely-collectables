name: Allisha Exact Back Verify 20260812

on:
  push:
    branches: [fix/collx-back-images-20260812]
    paths:
      - "scripts/verify-repair-allisha-back-20260812.mjs"
      - ".github/workflows/allisha-exact-back-verify-20260812.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allisha-exact-back-verify-20260812
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Production Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          mkdir -p .vercel "$RUNNER_TEMP/allisha-back-verify"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/allisha-back-verify/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'allisha-back-verify');
          const text = fs.readFileSync(path.join(dir, 'production.env'), 'utf8');
          const env = {};
          for (const raw of text.split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i < 1) continue;
            const key = line.slice(0, i).trim();
            let value = line.slice(i + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            env[key] = value;
          }
          const url = env.NEXT_PUBLIC_SUPABASE_URL;
          if (!url) throw new Error('NEXT_PUBLIC_SUPABASE_URL missing from Production env');
          const ref = new URL(url).hostname.split('.')[0];
          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` },
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Supabase key retrieval HTTP ${response.status}: ${body.slice(0, 500)}`);
          const keys = JSON.parse(body);
          const row = keys.find((x) => typeof x?.api_key === 'string' && x.api_key.startsWith('sb_secret_'))
            || keys.find((x) => String(x?.name || '').toLowerCase() === 'service_role')
            || keys.find((x) => String(x?.name || '').toLowerCase().includes('service'));
          if (!row?.api_key) throw new Error('No Production service-role key returned');
          console.log('::add-mask::' + row.api_key);
          fs.writeFileSync(path.join(dir, 'service-role-key'), row.api_key, { mode: 0o600 });
          fs.writeFileSync(path.join(dir, 'supabase-url'), url, { mode: 0o600 });
          console.log('PRODUCTION_EXACT_VERIFY_CREDENTIALS=VERIFIED');
          NODE

      - name: Repair and verify exact Allisha Green Ice back
        shell: bash
        run: |
          set -euo pipefail
          service_key="$(cat "$RUNNER_TEMP/allisha-back-verify/service-role-key")"
          supabase_url="$(cat "$RUNNER_TEMP/allisha-back-verify/supabase-url")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
          NEXT_PUBLIC_SUPABASE_URL="$supabase_url" \
          OUTPUT_DIR="$RUNNER_TEMP/allisha-back-verify" \
            node --import tsx scripts/verify-repair-allisha-back-20260812.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allisha-exact-back-verify-20260812
          path: ${{ runner.temp }}/allisha-back-verify/*.json
          if-no-files-found: warn
          retention-days: 7
