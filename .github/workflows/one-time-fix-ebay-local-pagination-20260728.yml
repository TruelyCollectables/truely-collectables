name: One-Time Fix eBay Local Pagination 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-fix-ebay-local-pagination-20260728.yml"

permissions:
  contents: write

concurrency:
  group: one-time-fix-ebay-local-pagination-20260728
  cancel-in-progress: false

jobs:
  patch-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-ebay-local-pagination-20260728'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-ebay-local-pagination-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Patch authoritative sync pagination and convergence
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/lib/ebay-authoritative-store-sync.ts')
          source = source_path.read_text()

          def literal_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one literal match, found {count}')
              source = source.replace(old, new, 1)

          def regex_once(pattern: str, replacement: str, label: str) -> None:
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')

          literal_once(
              'const APPLY_CONCURRENCY = 8;\nconst STOREFRONT_TAXONOMY_VERSION = 4;',
              'const APPLY_CONCURRENCY = 8;\nconst LOCAL_PAGE_SIZE = 1000;\nconst MAX_LOCAL_PAGES = 50;\nconst STOREFRONT_TAXONOMY_VERSION = 4;',
              'pagination constants',
          )

          regex_once(
              r'''function positiveMoney\(value: unknown\) \{\n  const parsed = Number\(value\);\n  return Number\.isFinite\(parsed\) && parsed > 0 \? parsed : 0;\n\}\n\n(?=function decodeXml)''',
              '''function positiveMoney(value: unknown) {
            const parsed = Number(value);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
          }

          function syncErrorMessage(error: unknown, fallback: string) {
            if (error instanceof Error) return error.message.slice(0, 500);
            if (typeof error === "string") return error.slice(0, 500);

            const value = recordValue(error);
            const parts = [
              value.message ? String(value.message) : null,
              value.code ? `code=${String(value.code)}` : null,
              value.details ? `details=${String(value.details)}` : null,
              value.hint ? `hint=${String(value.hint)}` : null,
            ].filter((part): part is string => Boolean(part));
            if (parts.length) return parts.join(" | ").slice(0, 500);

            try {
              const serialized = JSON.stringify(error);
              if (serialized && serialized !== "{}") return serialized.slice(0, 500);
            } catch {
              // Fall through to the bounded generic message.
            }
            return fallback;
          }

          ''',
              'structured sync errors',
          )

          replacement = '''async function readAllLocalProducts(params: {
            supabase: SupabaseClient;
            storeId: string;
          }) {
            const rows: LocalProduct[] = [];

            for (let page = 0; page < MAX_LOCAL_PAGES; page += 1) {
              const from = page * LOCAL_PAGE_SIZE;
              const { data, error } = await params.supabase
                .from("products")
                .select(
                  "id,seller_account_id,sku,title,description,price,quantity,image_url,ebay_item_id,sport,last_seen_at",
                )
                .eq("store_id", params.storeId)
                .not("ebay_item_id", "is", null)
                .order("id", { ascending: true })
                .range(from, from + LOCAL_PAGE_SIZE - 1);
              if (error) throw error;

              const batch = (data || []) as LocalProduct[];
              rows.push(...batch);
              if (batch.length < LOCAL_PAGE_SIZE) return rows;
            }

            throw new Error(
              `Local eBay-linked product pagination exceeded ${MAX_LOCAL_PAGES * LOCAL_PAGE_SIZE} rows.`,
            );
          }

          async function deactivateLocalProduct(params: {
            supabase: SupabaseClient;
            storeId: string;
            local: LocalProduct;
          }) {
            const now = new Date().toISOString();
            let changed = false;

            if (Number(params.local.quantity) > 0) {
              const { data, error } = await params.supabase
                .from("products")
                .update({ quantity: 0, last_seen_at: now })
                .eq("id", params.local.id)
                .eq("store_id", params.storeId)
                .gt("quantity", 0)
                .select("id")
                .maybeSingle();
              if (error) throw error;
              changed = Boolean(data?.id);
            }

            const repository = new InventoryRepository(
              params.storeId,
              params.supabase,
            );
            const inventory = await repository.getByLegacyProductId(params.local.id);
            if (
              inventory &&
              (Number(inventory.quantity || 0) > 0 || inventory.status !== "sold")
            ) {
              await repository.update(inventory.id, {
                quantity: 0,
                status: "sold",
                metadata: {
                  ...recordValue(inventory.metadata),
                  ebay_not_active_at_last_full_sync: now,
                },
              });
              changed = true;
            }

            return changed;
          }

          async function runWorkers'''
          regex_once(
              r'''async function deactivateLocalProduct\(params: \{[\s\S]*?\n\}\n\nasync function runWorkers''',
              replacement,
              'paginated local load and idempotent deactivation',
          )

          regex_once(
              r'''  const \{ data: localRows, error: localError \} = await params\.supabase[\s\S]*?\n  const locals = \(localRows \|\| \[\]\) as LocalProduct\[\];''',
              '''  const locals = await readAllLocalProducts({
            supabase: params.supabase,
            storeId: params.storeId,
          });''',
              'uncapped local product query',
          )

          regex_once(
              r'''error:\s*error instanceof Error\s*\? error\.message\s*:\s*"Unknown sync failure\.",''',
              'error: syncErrorMessage(error, "Unknown sync failure."),',
              'upsert error details',
          )
          regex_once(
              r'''error:\s*error instanceof Error\s*\? error\.message\s*:\s*"Could not refresh sync timestamps\.",''',
              '''error: syncErrorMessage(
                  error,
                  "Could not refresh sync timestamps.",
                ),''',
              'bulk touch error details',
          )
          regex_once(
              r'''await deactivateLocalProduct\(\{ \.\.\.params, local \}\);\n\s*deactivated \+= 1;''',
              '''const changed = await deactivateLocalProduct({ ...params, local });
                  if (changed) deactivated += 1;''',
              'idempotent deactivate count',
          )
          regex_once(
              r'''error:\s*error instanceof Error\s*\? error\.message\s*:\s*"Unknown deactivate failure\.",''',
              '''error: syncErrorMessage(
                      error,
                      "Unknown deactivate failure.",
                    ),''',
              'deactivate error details',
          )

          source_path.write_text(source)

          test_path = Path('scripts/run-storefront-taxonomy-regressions.ts')
          test_source = test_path.read_text()
          if 'import fs from "node:fs";' not in test_source:
              test_source = test_source.replace(
                  'import assert from "node:assert/strict";\n',
                  'import assert from "node:assert/strict";\nimport fs from "node:fs";\n',
                  1,
              )

          marker = 'console.log("Storefront taxonomy regressions passed.");'
          regression = '''const authoritativeSyncSource = fs.readFileSync(
            "src/lib/ebay-authoritative-store-sync.ts",
            "utf8",
          );
          assert.ok(authoritativeSyncSource.includes("const LOCAL_PAGE_SIZE = 1000;"));
          assert.ok(
            authoritativeSyncSource.includes(
              ".range(from, from + LOCAL_PAGE_SIZE - 1);",
            ),
          );
          assert.ok(
            authoritativeSyncSource.includes(
              "const locals = await readAllLocalProducts({",
            ),
          );
          assert.ok(
            authoritativeSyncSource.includes(
              "const changed = await deactivateLocalProduct({ ...params, local });",
            ),
          );
          assert.ok(authoritativeSyncSource.includes("if (changed) deactivated += 1;"));
          assert.ok(authoritativeSyncSource.includes("return changed;"));
          assert.ok(
            authoritativeSyncSource.includes(
              'syncErrorMessage(error, "Unknown sync failure.")',
            ),
          );

          console.log("Storefront taxonomy regressions passed.");'''
          if regression not in test_source:
              if test_source.count(marker) != 1:
                  raise SystemExit('test marker was not unique')
              test_source = test_source.replace(marker, regression, 1)
          test_path.write_text(test_source)

          for workflow_name in (
              '.github/workflows/one-time-fix-ebay-local-pagination-20260728.yml',
              '.github/workflows/one-time-add-pagination-validation-env-20260728.yml',
          ):
              workflow = Path(workflow_name)
              if workflow.exists():
                  workflow.unlink()
          PY

      - name: Verify patch before commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pagination-fix-validation
          npm ci --silent > pagination-fix-validation/npm-ci.log 2>&1 || {
            echo 'npm ci failed'; tail -n 120 pagination-fix-validation/npm-ci.log; exit 1;
          }
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts > pagination-fix-validation/regressions.log 2>&1 || {
            echo 'regressions failed'; cat pagination-fix-validation/regressions.log; exit 1;
          }
          npx eslint src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts > pagination-fix-validation/eslint.log 2>&1 || {
            echo 'eslint failed'; cat pagination-fix-validation/eslint.log; exit 1;
          }
          npm run build > pagination-fix-validation/build.log 2>&1 || {
            echo 'build failed'; tail -n 160 pagination-fix-validation/build.log; exit 1;
          }
          printf 'all validation passed\n' > pagination-fix-validation/result.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebay-local-pagination-validation-${{ github.run_number }}
          path: pagination-fix-validation
          if-no-files-found: warn
          retention-days: 7

      - name: Commit patched sync engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts .github/workflows/one-time-fix-ebay-local-pagination-20260728.yml .github/workflows/one-time-add-pagination-validation-env-20260728.yml
          git commit -m "Paginate all eBay-linked products and converge cleanup"
          git push origin HEAD:agent/fix-ebay-local-pagination-20260728
