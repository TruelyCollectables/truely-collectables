name: Apply InstaComp Publication Boundary Round Two

on:
  pull_request:
    paths:
      - ".github/workflows/apply-instacomp-publication-boundary-round2.yml"

permissions:
  contents: write

concurrency:
  group: instacomp-round2-branch-writer
  cancel-in-progress: false

jobs:
  apply-publication-boundary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Enforce exact-origin Card Intake and permanent-scan publication authorization
        run: |
          python - <<'PY'
          from pathlib import Path

          pending = Path('src/app/api/admin/pending-card-import/route.ts')
          source = pending.read_text()
          import_marker = 'import crypto from "node:crypto";\n'
          import_value = '''import crypto from "node:crypto";
          import {
            AdminMutationSecurityError,
            assertTrustedAdminMutationRequest,
          } from "../../../../lib/admin-request-security";
          '''
          if 'admin-request-security' not in source:
              if source.count(import_marker) != 1:
                  raise SystemExit('pending import security import marker missing')
              source = source.replace(import_marker, import_value, 1)
          post_marker = '''export async function POST(request: Request) {
            try {
              const actor = await requireInstaCompJobActor(request);'''
          post_value = '''export async function POST(request: Request) {
            try {
              assertTrustedAdminMutationRequest(request);
              const actor = await requireInstaCompJobActor(request);'''
          if 'assertTrustedAdminMutationRequest(request);' not in source:
              if source.count(post_marker) != 1:
                  raise SystemExit('pending import POST marker missing')
              source = source.replace(post_marker, post_value, 1)
          catch_marker = '''    const status = error instanceof InventoryEngineError ? error.statusCode : 500;'''
          catch_value = '''    const status =
              error instanceof AdminMutationSecurityError
                ? error.status
                : error instanceof InventoryEngineError
                  ? error.statusCode
                  : 500;'''
          if source.count(catch_marker) != 1:
              raise SystemExit('pending import catch marker missing')
          source = source.replace(catch_marker, catch_value, 1)
          pending.write_text(source)

          queue = Path('src/app/api/admin/card-listing-queue/route.ts')
          source = queue.read_text()
          queue_import = 'import { NextRequest } from "next/server";\n'
          queue_import_value = '''import { NextRequest } from "next/server";
          import {
            AdminMutationSecurityError,
            assertTrustedAdminMutationRequest,
          } from "../../../../lib/admin-request-security";
          '''
          if 'admin-request-security' not in source:
              if source.count(queue_import) != 1:
                  raise SystemExit('queue security import marker missing')
              source = source.replace(queue_import, queue_import_value, 1)
          for signature in [
              'export async function POST(request: NextRequest) {',
              'export async function DELETE(request: Request) {',
          ]:
              marker = f'''{signature}
            try {{
              await requireAdmin(request);'''
              replacement = f'''{signature}
            try {{
              assertTrustedAdminMutationRequest(request);
              await requireAdmin(request);'''
              if marker not in source:
                  raise SystemExit(f'queue mutation marker missing: {signature}')
              source = source.replace(marker, replacement, 1)
          catch_marker = '''  } catch (error) {
              if ('''
          catch_value = '''  } catch (error) {
              if (error instanceof AdminMutationSecurityError) {
                return Response.json(
                  { success: false, error: error.message, code: error.code },
                  { status: error.status },
                );
              }
              if ('''
          catch_count = source.count(catch_marker)
          if catch_count < 2:
              raise SystemExit(f'queue catch marker count was {catch_count}')
          source = source.replace(catch_marker, catch_value)
          queue.write_text(source)

          guard = Path('src/lib/dual-marketplace-admin-route-guard.ts')
          source = guard.read_text()
          guard_import = 'import { ebayListingContentProblems } from "./ebay-listing-content";\n'
          guard_import_value = '''import { adminMutationSecurityDecision } from "./admin-request-security";
          import { ebayListingContentProblems } from "./ebay-listing-content";
          '''
          if 'adminMutationSecurityDecision' not in source:
              if source.count(guard_import) != 1:
                  raise SystemExit('dual guard security import marker missing')
              source = source.replace(guard_import, guard_import_value, 1)
          guard_post = '''export async function handleGuardedDualMarketplacePost(request: Request) {
            normalizePercentEnvironment();'''
          guard_post_value = '''export async function handleGuardedDualMarketplacePost(request: Request) {
            const mutation = adminMutationSecurityDecision(request);
            if (!mutation.allowed) {
              return Response.json(
                {
                  success: false,
                  error: mutation.reason || "Privileged listing mutation rejected.",
                  code: mutation.code,
                },
                { status: 403 },
              );
            }
            normalizePercentEnvironment();'''
          if source.count(guard_post) != 1:
              raise SystemExit('dual guard POST marker missing')
          source = source.replace(guard_post, guard_post_value, 1)
          guard.write_text(source)

          route = Path('src/lib/dual-marketplace-admin-route.ts')
          source = route.read_text()
          route_import = 'import { ebayListingContentProblems } from "./ebay-listing-content";\n'
          route_import_value = '''import { ebayListingContentProblems } from "./ebay-listing-content";
          import {
            buildInstaCompScanPayload,
            evaluateInstaCompPublicationGate,
          } from "./instacomp-publication-gate";
          '''
          if 'evaluateInstaCompPublicationGate' not in source:
              if source.count(route_import) != 1:
                  raise SystemExit('dual route publication import marker missing')
              source = source.replace(route_import, route_import_value, 1)

          activation_marker = '''async function activateWebsite(params: {
            supabase: ReturnType<typeof getSupabaseClient>;'''
          authorization = '''async function requireInstaCompPublicationAuthorization(params: {
            supabase: ReturnType<typeof getSupabaseClient>;
            prepared: PreparedListing;
          }) {
            const metadata = record(params.prepared.inventory.metadata);
            const scanId = nullableText(record(metadata.instacomp).scanId, 160);
            let scanPayload: ReturnType<typeof buildInstaCompScanPayload> | null = null;

            if (scanId) {
              const { data: scan, error } = await params.supabase
                .from("instacomp_scans")
                .select("id,raw_ai_result,raw_comp_results")
                .eq("id", scanId)
                .maybeSingle();
              if (error) throw error;
              if (scan) {
                scanPayload = buildInstaCompScanPayload({
                  scanId: scan.id,
                  rawAiResult: scan.raw_ai_result,
                  rawCompResults: scan.raw_comp_results,
                });
              }
            }

            const authorization = evaluateInstaCompPublicationGate({
              metadata,
              scanPayload,
            });
            if (!authorization.allowed) {
              throw new Error(
                `InstaComp publication gate blocked this draft: ${authorization.reasons.join(", ") || "authorization_missing"}.`,
              );
            }
            return authorization;
          }

          async function activateWebsite(params: {
            supabase: ReturnType<typeof getSupabaseClient>;'''
          if source.count(activation_marker) != 1:
              raise SystemExit('publication authorization insertion marker missing')
          source = source.replace(activation_marker, authorization, 1)

          save_marker = '''        prepared = prepareListing({
                  inventory,
                  product: inventory.legacy_product_id
                    ? data.productsById.get(Number(inventory.legacy_product_id)) || null
                    : null,
                  images: data.imagesByInventoryId.get(inventory.id) || [],
                  incoming,
                  feeProfile,
                });
                await saveDraftMetadata({ supabase, storeId, prepared });'''
          save_value = '''        prepared = prepareListing({
                  inventory,
                  product: inventory.legacy_product_id
                    ? data.productsById.get(Number(inventory.legacy_product_id)) || null
                    : null,
                  images: data.imagesByInventoryId.get(inventory.id) || [],
                  incoming,
                  feeProfile,
                });
                if (action !== "save") {
                  await requireInstaCompPublicationAuthorization({
                    supabase,
                    prepared,
                  });
                }
                await saveDraftMetadata({ supabase, storeId, prepared });'''
          if source.count(save_marker) != 1:
              raise SystemExit('publication authorization call marker missing')
          source = source.replace(save_marker, save_value, 1)
          route.write_text(source)
          PY

      - name: Verify publication boundary attacks
        run: |
          npm ci
          node --import tsx scripts/run-instacomp-publication-gate-regressions.ts
          node --import tsx scripts/run-instacomp-audit-round2-security-regressions.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const intake = fs.readFileSync('src/app/api/admin/pending-card-import/route.ts', 'utf8');
          const queue = fs.readFileSync('src/app/api/admin/card-listing-queue/route.ts', 'utf8');
          const guard = fs.readFileSync('src/lib/dual-marketplace-admin-route-guard.ts', 'utf8');
          const route = fs.readFileSync('src/lib/dual-marketplace-admin-route.ts', 'utf8');
          for (const source of [intake, queue]) {
            if (!source.includes('assertTrustedAdminMutationRequest(request);')) {
              throw new Error('A Card Intake mutation path lacks exact-origin enforcement.');
            }
          }
          for (const marker of [
            'adminMutationSecurityDecision(request)',
            'Privileged listing mutation rejected',
          ]) {
            if (!guard.includes(marker)) throw new Error(`Missing listing mutation marker: ${marker}`);
          }
          for (const marker of [
            'requireInstaCompPublicationAuthorization',
            '.from("instacomp_scans")',
            'evaluateInstaCompPublicationGate',
            'if (action !== "save")',
            'InstaComp publication gate blocked this draft',
          ]) {
            if (!route.includes(marker)) throw new Error(`Missing publication gate marker: ${marker}`);
          }
          if (!intake.includes('price: 0') || !intake.includes('status: "draft"')) {
            throw new Error('Card Intake no longer forces a zero-price unpublished draft.');
          }
          NODE
          npx eslint \
            src/app/api/admin/pending-card-import/route.ts \
            src/app/api/admin/card-listing-queue/route.ts \
            src/lib/dual-marketplace-admin-route-guard.ts \
            src/lib/dual-marketplace-admin-route.ts \
            src/lib/instacomp-publication-gate.ts \
            scripts/run-instacomp-publication-gate-regressions.ts
          npx tsc --noEmit --pretty false

      - name: Commit permanent fix and remove one-time workflow
        run: |
          git rm -f .github/workflows/apply-instacomp-publication-boundary-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/admin/pending-card-import/route.ts \
            src/app/api/admin/card-listing-queue/route.ts \
            src/lib/dual-marketplace-admin-route-guard.ts \
            src/lib/dual-marketplace-admin-route.ts
          git commit -m "Enforce permanent-scan authorization at publication boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
