name: Apply InstaComp Publication Boundary Round Two

on:
  pull_request:
    paths:
      - ".github/workflows/apply-instacomp-publication-boundary-round2.yml"

permissions:
  contents: write

concurrency:
  group: instacomp-round2-branch-writer
  cancel-in-progress: false

jobs:
  apply-publication-boundary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Enforce exact-origin Card Intake and permanent-scan publication authorization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(source: str, pattern: str, replacement: str, label: str) -> str:
              compiled = re.compile(pattern, re.MULTILINE | re.DOTALL)
              source, count = compiled.subn(lambda _match: replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'{label} replacement count was {count}')
              return source

          security_import = textwrap.dedent('''\
          import { adminMutationSecurityDecision } from "../../../../lib/admin-request-security";
          ''')
          mutation_block = textwrap.dedent('''\
            const mutation = adminMutationSecurityDecision(request);
            if (!mutation.allowed) {
              return Response.json(
                {
                  success: false,
                  error: mutation.reason || "Privileged mutation rejected.",
                  code: mutation.code,
                },
                { status: 403 },
              );
            }
          ''')

          pending = Path('src/app/api/admin/pending-card-import/route.ts')
          source = pending.read_text()
          if 'adminMutationSecurityDecision' not in source:
              source = replace_once(
                  source,
                  r'^(import \{ createHash, randomUUID \} from "node:crypto";\n)',
                  r'\1' + security_import,
                  'pending security import',
              )
          if 'const mutation = adminMutationSecurityDecision(request);' not in source:
              source = replace_once(
                  source,
                  r'(export async function POST\(request: Request\) \{\n)',
                  r'\1' + mutation_block,
                  'pending POST origin guard',
              )
          pending.write_text(source)

          queue = Path('src/app/api/admin/card-listing-queue/route.ts')
          source = queue.read_text()
          if 'adminMutationSecurityDecision' not in source:
              source = replace_once(
                  source,
                  r'^(import \{ NextRequest \} from "next/server";\n)',
                  r'\1' + security_import,
                  'queue security import',
              )
          for signature, label in [
              (r'export async function POST\(request: NextRequest\) \{\n', 'queue POST origin guard'),
              (r'export async function DELETE\(request: Request\) \{\n', 'queue DELETE origin guard'),
          ]:
              pattern = f'({signature})'
              match = re.search(pattern, source, re.MULTILINE)
              if not match:
                  raise SystemExit(f'{label} signature missing')
              block_start = match.end()
              nearby = source[block_start:block_start + 500]
              if 'adminMutationSecurityDecision(request)' not in nearby:
                  source = source[:block_start] + mutation_block + source[block_start:]
          queue.write_text(source)

          guard = Path('src/lib/dual-marketplace-admin-route-guard.ts')
          source = guard.read_text()
          if 'adminMutationSecurityDecision' not in source:
              source = replace_once(
                  source,
                  r'^(import \{ ebayListingContentProblems \} from "\.\/ebay-listing-content";\n)',
                  'import { adminMutationSecurityDecision } from "./admin-request-security";\n\\1',
                  'dual guard security import',
              )
          if 'Privileged listing mutation rejected.' not in source:
              guard_block = textwrap.dedent('''\
                const mutation = adminMutationSecurityDecision(request);
                if (!mutation.allowed) {
                  return Response.json(
                    {
                      success: false,
                      error: mutation.reason || "Privileged listing mutation rejected.",
                      code: mutation.code,
                    },
                    { status: 403 },
                  );
                }
              ''')
              source = replace_once(
                  source,
                  r'(export async function handleGuardedDualMarketplacePost\(request: Request\) \{\n)',
                  r'\1' + guard_block,
                  'dual guard POST origin guard',
              )
          guard.write_text(source)

          route = Path('src/lib/dual-marketplace-admin-route.ts')
          source = route.read_text()
          if 'evaluateInstaCompPublicationGate' not in source:
              publication_import = textwrap.dedent('''\
              import {
                buildInstaCompScanPayload,
                evaluateInstaCompPublicationGate,
              } from "./instacomp-publication-gate";
              ''')
              source = replace_once(
                  source,
                  r'^(import \{ ebayListingContentProblems \} from "\.\/ebay-listing-content";\n)',
                  r'\1' + publication_import,
                  'publication gate import',
              )

          if 'async function requireInstaCompPublicationAuthorization' not in source:
              authorization = textwrap.dedent('''\
              async function requireInstaCompPublicationAuthorization(params: {
                supabase: ReturnType<typeof getSupabaseClient>;
                prepared: PreparedListing;
              }) {
                const metadata = record(params.prepared.inventory.metadata);
                const scanId = nullableText(record(metadata.instacomp).scanId, 160);
                let scanPayload: ReturnType<typeof buildInstaCompScanPayload> | null = null;

                if (scanId) {
                  const { data: scan, error } = await params.supabase
                    .from("instacomp_scans")
                    .select("id,raw_ai_result,raw_comp_results")
                    .eq("id", scanId)
                    .maybeSingle();
                  if (error) throw error;
                  if (scan) {
                    scanPayload = buildInstaCompScanPayload({
                      scanId: scan.id,
                      rawAiResult: scan.raw_ai_result,
                      rawCompResults: scan.raw_comp_results,
                    });
                  }
                }

                const authorization = evaluateInstaCompPublicationGate({
                  metadata,
                  scanPayload,
                });
                if (!authorization.allowed) {
                  throw new Error(
                    `InstaComp publication gate blocked this draft: ${authorization.reasons.join(", ") || "authorization_missing"}.`,
                  );
                }
                return authorization;
              }

              ''')
              source = replace_once(
                  source,
                  r'(?=async function activateWebsite\(params: \{)',
                  authorization,
                  'publication authorization function',
              )

          if 'await requireInstaCompPublicationAuthorization({' not in source:
              call = textwrap.dedent('''\
                if (action !== "save") {
                  await requireInstaCompPublicationAuthorization({
                    supabase,
                    prepared,
                  });
                }
              ''')
              source = replace_once(
                  source,
                  r'(\n\s*prepared = prepareListing\(\{[\s\S]*?\n\s*\}\);)(\n\s*await saveDraftMetadata\(\{ supabase, storeId, prepared \}\);)',
                  r'\1\n' + call + r'\2',
                  'publication authorization call',
              )
          route.write_text(source)
          PY

      - name: Verify publication boundary attacks
        run: |
          npm ci
          node --import tsx scripts/run-instacomp-publication-gate-regressions.ts
          node --import tsx scripts/run-instacomp-audit-round2-security-regressions.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const intake = fs.readFileSync('src/app/api/admin/pending-card-import/route.ts', 'utf8');
          const queue = fs.readFileSync('src/app/api/admin/card-listing-queue/route.ts', 'utf8');
          const guard = fs.readFileSync('src/lib/dual-marketplace-admin-route-guard.ts', 'utf8');
          const route = fs.readFileSync('src/lib/dual-marketplace-admin-route.ts', 'utf8');
          for (const source of [intake, queue]) {
            if (!source.includes('adminMutationSecurityDecision(request)')) {
              throw new Error('A Card Intake mutation path lacks exact-origin enforcement.');
            }
          }
          for (const marker of [
            'adminMutationSecurityDecision(request)',
            'Privileged listing mutation rejected',
          ]) {
            if (!guard.includes(marker)) throw new Error(`Missing listing mutation marker: ${marker}`);
          }
          for (const marker of [
            'requireInstaCompPublicationAuthorization',
            '.from("instacomp_scans")',
            'evaluateInstaCompPublicationGate',
            'if (action !== "save")',
            'InstaComp publication gate blocked this draft',
          ]) {
            if (!route.includes(marker)) throw new Error(`Missing publication gate marker: ${marker}`);
          }
          if (!intake.includes('price: 0') || !intake.includes('status: "draft"')) {
            throw new Error('Card Intake no longer forces a zero-price unpublished draft.');
          }
          NODE
          npx eslint \
            src/app/api/admin/pending-card-import/route.ts \
            src/app/api/admin/card-listing-queue/route.ts \
            src/lib/dual-marketplace-admin-route-guard.ts \
            src/lib/dual-marketplace-admin-route.ts \
            src/lib/instacomp-publication-gate.ts \
            scripts/run-instacomp-publication-gate-regressions.ts
          npx tsc --noEmit --pretty false

      - name: Commit permanent fix and remove one-time workflow
        run: |
          git rm -f .github/workflows/apply-instacomp-publication-boundary-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/admin/pending-card-import/route.ts \
            src/app/api/admin/card-listing-queue/route.ts \
            src/lib/dual-marketplace-admin-route-guard.ts \
            src/lib/dual-marketplace-admin-route.ts
          git commit -m "Enforce permanent-scan authorization at publication boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
