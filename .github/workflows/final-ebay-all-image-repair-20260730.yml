name: Final eBay All Image Repair 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-ebay-all-image-repair-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-ebay-all-image-repair-20260730
  cancel-in-progress: false

jobs:
  repair-and-certify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/final-ebay-all-image-repair-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      SOURCE_BRANCH: ops/diagnose-ebay-hidden-images-20260730

    steps:
      - name: Check out isolated operations branch
        uses: actions/checkout@v4
        with:
          ref: ops/final-ebay-all-image-repair-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link Vercel and create isolated repair token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          work="$RUNNER_TEMP/final-ebay-image-repair"
          mkdir -p "$work" .vercel
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          token="$(openssl rand -hex 32)"
          printf '%s' "$token" > "$work/token"
          echo "::add-mask::$token"
          printf '%s\n' "$token" | npx vercel@56.2.0 env add EBAY_FINAL_IMAGE_REPAIR_TOKEN_20260730 production --force \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Build corrected protected repair route
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/final-ebay-image-repair"
          git fetch origin "$SOURCE_BRANCH"
          git show "origin/$SOURCE_BRANCH:.github/workflows/repair-ebay-hidden-images-20260730.yml" > "$work/source-workflow.yml"
          route=src/app/api/internal/final-ebay-image-repair/route.ts
          mkdir -p "$(dirname "$route")"
          awk '
            /cat > src\/app\/api\/internal\/ebay-hidden-image-repair\/route\.ts <<'"'"'ROUTE'"'"'/ { capture=1; next }
            capture && /^          ROUTE$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' "$work/source-workflow.yml" > "$route"
          test -s "$route"
          sed -i 's#../../../../../lib/supabase-server#../../../../lib/supabase-server#' "$route"
          sed -i '/lib\/stores/d' "$route"
          sed -i 's/const storeId = getActiveStoreId();/const storeId = "00000000-0000-4000-8000-000000000001";/' "$route"
          sed -i 's/EBAY_HIDDEN_IMAGE_REPAIR_TOKEN/EBAY_FINAL_IMAGE_REPAIR_TOKEN_20260730/g' "$route"
          ! grep -Fq 'getActiveStoreId' "$route"
          grep -Fq 'from "../../../../lib/supabase-server"' "$route"
          grep -Fq 'EBAY_FINAL_IMAGE_REPAIR_TOKEN_20260730' "$route"
          grep -Fq 'sell/inventory/v1/inventory_item' "$route"
          grep -Fq 'trustedDescriptionImages' "$route"
          git diff --check

      - name: Deploy isolated repair runtime
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/final-ebay-image-repair"
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee "$work/deploy.log"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$work/deploy.log" | tail -1)"
          test -n "$deployment_url"
          printf '%s' "$deployment_url" > "$work/deployment-url"

      - name: Pull every picture source and update all linked inventory rows
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/final-ebay-image-repair"
          token="$(cat "$work/token")"
          deployment_url="$(cat "$work/deployment-url")"
          response="$work/response.json"
          echo "::add-mask::$token"
          status="$(curl -sS --max-time 330 \
            -H "x-tcos-repair-token: $token" \
            -X POST -o "$response" -w '%{http_code}' \
            "$deployment_url/api/internal/final-ebay-image-repair?run=${GITHUB_RUN_ID}" || true)"
          echo "repair_status=$status"
          cat "$response" || true
          echo
          test "$status" = "200"
          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!receipt.success) throw new Error('Repair receipt was not successful.');
          const summary = {
            requestedProducts: receipt.requestedProducts,
            foundProducts: receipt.foundProducts,
            productsWithFrontBack: receipt.productsWithFrontBack,
            stillMissingCount: receipt.stillMissingCount,
            stillMissing: receipt.stillMissing,
            sourceSummary: receipt.results.map((row) => ({
              productId: row.productId,
              title: row.title,
              inventoryApiCount: row.inventoryApiImages?.length || 0,
              tradingCount: row.tradingPictureUrls?.length || 0,
              descriptionCount: row.descriptionImages?.length || 0,
              finalImageCount: row.finalImageCount || 0,
              changedInventoryRows: row.changedInventoryRows || 0,
              hasBack: row.hasBack,
              inventoryApiAttempts: row.inventoryApiAttempts || [],
              error: row.error || null,
            })),
          };
          console.log('FINAL_IMAGE_REPAIR_SUMMARY=' + JSON.stringify(summary));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Remove temporary route and deploy clean latest main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env rm EBAY_FINAL_IMAGE_REPAIR_TOKEN_20260730 production --yes \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/final-ebay-image-repair"
