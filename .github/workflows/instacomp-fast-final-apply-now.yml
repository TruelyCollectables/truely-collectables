name: InstaComp Fast Final Apply Now

on:
  push:
    branches:
      - agent/instacomp-fast-workbench-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-fast-workbench-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize final audited source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-instacomp-fast-workbench-final-patch.py
          python3 scripts/apply-instacomp-final-audit-fixes.py
          python3 scripts/apply-repo-audit-fixes.py
          npm install --package-lock-only --ignore-scripts
      - name: Persist final audited source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/instacomp/scan/route.ts \
            src/app/admin/instacomp/fast/InstaCompFastWorkbench.tsx \
            src/lib/instacomp-consensus.ts \
            src/app/admin/instacomp/checklist-sentinel/page.tsx \
            package.json \
            package-lock.json
          if git diff --cached --quiet; then
            echo "Final audited source already materialized."
            exit 0
          fi
          git commit -m "Materialize final InstaComp audit fixes"
          git push origin HEAD:agent/instacomp-fast-workbench-final
