name: Ops CollX Spreadsheet Reconcile 41 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-sheet-reconcile-41-20260810.yml"
      - ".github/ops/collx-sheet-reconcile-41.b64gz"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-collx-sheet-reconcile-41-20260810
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/collx-sheet-reconcile"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-sheet-reconcile/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Apply spreadsheet-linked image reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { setTimeout as sleep } from 'node:timers/promises';

          const EXPECTED_SHA='4663d6828d200b76618cfb47c741c191d69c6b3ebc896e8407ba05dfa49ff440';
          const EXPECTED_ROWS=41;
          const STORE='00000000-0000-4000-8000-000000000001';
          function fail(m){throw new Error(m)}
          function parseEnv(text){const e={};for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('#'))continue;const i=line.indexOf('=');if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}else if(v.startsWith("'")&&v.endsWith("'"))v=v.slice(1,-1);e[k]=v}return e}
          function sqlJson(rows){return `'${JSON.stringify(rows).replaceAll("'","''")}'::jsonb`}

          const packed=fs.readFileSync('.github/ops/collx-sheet-reconcile-41.b64gz','utf8').trim();
          const raw=gunzipSync(Buffer.from(packed,'base64'));
          const sha=crypto.createHash('sha256').update(raw).digest('hex');
          if(sha!==EXPECTED_SHA)fail(`Manifest SHA mismatch ${sha}`);
          const manifest=JSON.parse(raw.toString('utf8'));
          if(!Array.isArray(manifest)||manifest.length!==EXPECTED_ROWS)fail(`Expected ${EXPECTED_ROWS} rows, got ${manifest?.length}`);
          if(new Set(manifest.map(r=>r.i)).size!==EXPECTED_ROWS||new Set(manifest.map(r=>Number(r.p))).size!==EXPECTED_ROWS||new Set(manifest.map(r=>String(r.c))).size!==EXPECTED_ROWS)fail('Manifest is not one-to-one');
          for(const r of manifest){if(!String(r.f||'').includes('/storage/v1/object/public/truely-product-images/collx-mirror/'))fail(`Front is not owned storage: ${r.p}`);if(r.b&&!String(r.b).includes('/storage/v1/object/public/truely-product-images/collx-mirror/'))fail(`Back is not owned storage: ${r.p}`)}
          console.log(JSON.stringify({manifestRows:manifest.length,manifestSha256:sha}));

          const env=parseEnv(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'collx-sheet-reconcile','production.env'),'utf8'));
          const base=env.NEXT_PUBLIC_SUPABASE_URL;if(!base)fail('Production Supabase URL unavailable');
          const ref=new URL(base).hostname.split('.')[0];
          const token=process.env.GH_SUPABASE_ACCESS_TOKEN;
          const endpoint=`https://api.supabase.com/v1/projects/${ref}/database/query`;
          async function db(sql,readOnly,label){let last='';for(let a=1;a<=10;a++){try{const r=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({query:sql,parameters:[],read_only:readOnly}),signal:AbortSignal.timeout(30000)});const t=await r.text();if(r.ok)return t?JSON.parse(t):[];last=`HTTP ${r.status}: ${t.slice(0,800)}`;if(![429,500,502,503,504,522,524,544].includes(r.status)&&!/timeout|57P01|connection/i.test(t))fail(`${label}: ${last}`)}catch(e){last=String(e?.message||e)}if(a<10)await sleep(Math.min(8000,a*650))}fail(`${label}: ${last}`)}

          // Verify every owned URL still serves an image before any database write.
          const urls=[...new Set(manifest.flatMap(r=>[r.f,r.b].filter(Boolean)))];
          let next=0;const errors=[];
          async function verifyWorker(){while(true){const i=next++;if(i>=urls.length)return;const url=urls[i];let ok=false,last='';for(let a=1;a<=6&&!ok;a++){try{const r=await fetch(url,{headers:{Range:'bytes=0-0'},signal:AbortSignal.timeout(20000)});const type=r.headers.get('content-type')||'';if(r.ok&&type.toLowerCase().startsWith('image/'))ok=true;else last=`${r.status} ${type}`}catch(e){last=String(e?.message||e)}if(!ok&&a<6)await sleep(a*400)}if(!ok)errors.push({url,error:last})}}
          await Promise.all(Array.from({length:5},()=>verifyWorker()));
          if(errors.length)fail(`Owned image verification failed: ${JSON.stringify(errors.slice(0,5))}`);
          console.log(`Verified ${urls.length} owned images.`);

          // Fail closed per row. Rows already completed by an earlier pass are skipped, not duplicated.
          const guarded=await db(`
            with m as (
              select * from jsonb_to_recordset(${sqlJson(manifest)})
                as x(i text,p bigint,c text,f text,b text,reason text,score numeric,margin numeric)
            ), s as (
              select m.*, i.id live_i, i.store_id, i.legacy_product_id, i.status, i.quantity iq,
                     p.id live_p, p.quantity pq, p.price, p.archived_at, p.ebay_item_id,
                     (select count(*) from public.inventory_images z where z.inventory_item_id=i.id and (z.alt_text like 'CollX verified %' or z.image_url like '%/truely-product-images/collx-mirror/%')) as target_owned,
                     (select count(*) from public.inventory_images z where z.inventory_item_id<>i.id and z.image_url=m.f) as reused_front
              from m
              left join public.inventory_items i on i.id=m.i::uuid
              left join public.products p on p.id=m.p and p.store_id='${STORE}'::uuid
            )
            select *, case
              when live_i is null then 'inventory_missing'
              when store_id<>'${STORE}'::uuid then 'wrong_store'
              when legacy_product_id is distinct from p then 'mapping_changed'
              when status<>'active' or coalesce(iq,0)<=0 then 'inventory_inactive'
              when live_p is null or archived_at is not null or coalesce(pq,0)<=0 or coalesce(price,0)<=0 then 'product_inactive'
              when nullif(btrim(coalesce(ebay_item_id,'')),'') is null then 'ebay_missing'
              when target_owned<>0 then 'already_completed'
              when reused_front<>0 then 'physical_scan_already_used'
              else 'valid'
            end reason_live
            from s;
          `,true,'live guard');
          const byPid=new Map(guarded.map(r=>[Number(r.p),r]));
          const valid=manifest.filter(r=>byPid.get(Number(r.p))?.reason_live==='valid');
          const skipped=guarded.filter(r=>r.reason_live!=='valid');
          console.log(JSON.stringify({valid:valid.length,skipped:skipped.length,skipReasons:Object.fromEntries(Object.entries(skipped.reduce((a,r)=>(a[r.reason_live]=(a[r.reason_live]||0)+1,a),{})))}));
          if(valid.length<1)fail('No new rows remain after live guards');

          for(let offset=0;offset<valid.length;offset+=20){const batch=valid.slice(offset,offset+20);await db(`
            begin;
            with m as (select * from jsonb_to_recordset(${sqlJson(batch)}) as x(i text,p bigint,c text,f text,b text,reason text,score numeric,margin numeric))
            update public.products p set image_url=m.f from m where p.id=m.p and p.store_id='${STORE}'::uuid;
            with m as (select * from jsonb_to_recordset(${sqlJson(batch)}) as x(i text,p bigint,c text,f text,b text,reason text,score numeric,margin numeric))
            update public.inventory_images z set is_primary=false where z.inventory_item_id in (select i::uuid from m) and z.is_primary=true;
            with m as (select * from jsonb_to_recordset(${sqlJson(batch)}) as x(i text,p bigint,c text,f text,b text,reason text,score numeric,margin numeric)), rows as (
              select i::uuid inventory_item_id,f image_url,('CollX verified front; collx_id='||c||'; spreadsheet reconciliation')::text alt_text,-2 sort_order,true is_primary from m
              union all
              select i::uuid,b,('CollX verified back; collx_id='||c||'; spreadsheet reconciliation')::text,-1,false from m where b is not null
            )
            insert into public.inventory_images(inventory_item_id,image_url,alt_text,sort_order,is_primary) select * from rows;
            commit;
          `,false,`apply batch ${Math.floor(offset/20)+1}`)}

          const bad=await db(`
            with m as (select * from jsonb_to_recordset(${sqlJson(valid)}) as x(i text,p bigint,c text,f text,b text,reason text,score numeric,margin numeric)), a as (
              select m.*,p.image_url,
                     count(*) filter(where z.image_url=m.f) fr,
                     count(*) filter(where z.image_url=m.f and z.is_primary) pr,
                     count(*) filter(where m.b is not null and z.image_url=m.b) br
              from m join public.products p on p.id=m.p and p.store_id='${STORE}'::uuid
              join public.inventory_items i on i.id=m.i::uuid and i.legacy_product_id=m.p
              left join public.inventory_images z on z.inventory_item_id=i.id
              group by m.i,m.p,m.c,m.f,m.b,m.reason,m.score,m.margin,p.image_url
            ) select * from a where image_url is distinct from f or fr<>1 or pr<>1 or (b is not null and br<>1);
          `,true,'post verification');
          if(bad.length)fail(`Post verification failed: ${JSON.stringify(bad.slice(0,5))}`);

          const receipt={ok:true,event:'collx_spreadsheet_reconciliation',manifestSha256:sha,requested:manifest.length,imported:valid.length,skipped:skipped.length,fronts:valid.length,backs:valid.filter(r=>r.b).length,skipReasons:skipped.reduce((a,r)=>(a[r.reason_live]=(a[r.reason_live]||0)+1,a),{}),priceQuantityStatusTouched:false,customerOrderDataTouched:false,completedAt:new Date().toISOString()};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'collx-sheet-reconcile','receipt.json'),JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          NODE

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-spreadsheet-reconcile-41-receipt
          path: ${{ runner.temp }}/collx-sheet-reconcile/receipt.json
          retention-days: 7
          if-no-files-found: warn
