name: One-Time Storefront Taxonomy V7 No Junk Buckets V2 20260728

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-storefront-taxonomy-v7-no-junk-buckets-v2-20260728.yml"

permissions:
  contents: write

concurrency:
  group: one-time-storefront-taxonomy-v7-no-junk-buckets-v2-20260728
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/storefront-taxonomy-v7-no-junk-buckets-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-taxonomy-v7-no-junk-buckets-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply structural taxonomy v7 integration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          def regex_once(path: Path, pattern: str, replacement: str, label: str) -> None:
              text = path.read_text()
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(updated)

          types_path = Path('src/modules/inventory/types.ts')
          regex_once(
              types_path,
              r'export type StorefrontFeatureFlags = \{\s*autograph: boolean;\s*rookie: boolean;\s*graded: boolean;\s*numbered: boolean;\s*\};',
              '''export type StorefrontFeatureFlags = {
            autograph: boolean;
            memorabilia: boolean;
            rookie: boolean;
            graded: boolean;
            numbered: boolean;
          };''',
              'inventory feature flags',
          )

          shop = Path('src/app/shop/page.tsx')
          regex_once(
              shop,
              r'import \{\s*sortStorefrontSections,\s*type StorefrontSort,\s*\} from "\.\./\.\./lib/storefront-taxonomy";',
              '''import {
            COLLECTIBLE_SECTIONS,
            SPORT_SECTIONS,
            sortStorefrontSections,
            type StorefrontSort,
          } from "../../lib/storefront-taxonomy";''',
              'shop taxonomy imports',
          )
          regex_once(
              shop,
              r'const QUICK_SECTIONS = \[[\s\S]*?\];\n',
              '''const FEATURE_LINKS = [
            { key: "autograph", label: "Autographs" },
            { key: "memorabilia", label: "Memorabilia Cards" },
            { key: "graded", label: "Graded Cards" },
            { key: "rookie", label: "Rookie Cards" },
            { key: "numbered", label: "Numbered Cards" },
          ] as const;
          ''',
              'shop feature links',
          )
          text = shop.read_text()
          marker = '  if (params.feature === "autograph") return "Autographed Items";'
          if text.count(marker) != 1:
              raise SystemExit('autograph heading marker was not unique')
          text = text.replace(
              marker,
              marker + '\n  if (params.feature === "memorabilia") return "Memorabilia Cards";',
              1,
          )
          shop.write_text(text)
          regex_once(
              shop,
              r'  const badges = \[[\s\S]*?\]\.filter\(Boolean\) as string\[\];',
              '''  const badges = [
            product.features.autograph ? "Autograph" : null,
            product.features.memorabilia ? "Memorabilia Card" : null,
            product.features.graded ? "Graded Card" : null,
            product.features.rookie ? "Rookie Card" : null,
            product.features.numbered ? "Numbered" : null,
          ].filter(Boolean) as string[];''',
              'feature badge labels',
          )
          regex_once(
              shop,
              r'  const activeFilters = Boolean\(q \|\| section \|\| feature \|\| sort !== "section"\);[\s\S]*?  \]\);\n\n  return \(',
              '''  const activeFilters = Boolean(q || section || feature || sort !== "section");
            const sectionOptions = sortStorefrontSections([
              ...SPORT_SECTIONS,
              ...COLLECTIBLE_SECTIONS,
              ...sections,
            ]);

            return (''',
              'section option sources',
          )
          navigation = '''      <section className="mb-8 space-y-5">
            <div>
              <p className="mb-2 text-xs font-black uppercase tracking-[0.14em] text-neutral-500">Shop by sport</p>
              <nav className="flex flex-wrap gap-2" aria-label="Shop by sport">
                <Link href="/shop" className="rounded-full border-2 border-neutral-950 bg-white px-4 py-2 text-sm font-black hover:bg-yellow-300">All Inventory</Link>
                {SPORT_SECTIONS.map((name) => (
                  <Link key={name} href={shopHref({ section: name })} className={`rounded-full border-2 border-neutral-950 px-4 py-2 text-sm font-black ${section === name && !feature ? "bg-yellow-300" : "bg-white hover:bg-yellow-300"}`}>{name}</Link>
                ))}
              </nav>
            </div>
            <div>
              <p className="mb-2 text-xs font-black uppercase tracking-[0.14em] text-neutral-500">Collectible types</p>
              <nav className="flex flex-wrap gap-2" aria-label="Collectible types">
                {COLLECTIBLE_SECTIONS.map((name) => (
                  <Link key={name} href={shopHref({ section: name })} className={`rounded-full border-2 border-neutral-950 px-4 py-2 text-sm font-black ${section === name && !feature ? "bg-yellow-300" : "bg-white hover:bg-yellow-300"}`}>{name}</Link>
                ))}
              </nav>
            </div>
            <div>
              <p className="mb-2 text-xs font-black uppercase tracking-[0.14em] text-neutral-500">Card features</p>
              <nav className="flex flex-wrap gap-2" aria-label="Card features">
                {FEATURE_LINKS.map((item) => (
                  <Link key={item.key} href={shopHref({ feature: item.key })} className={`rounded-full border-2 border-neutral-950 px-4 py-2 text-sm font-black ${feature === item.key ? "bg-yellow-300" : "bg-white hover:bg-yellow-300"}`}>{item.label}</Link>
                ))}
              </nav>
            </div>
          </section>

          <form'''
          regex_once(
              shop,
              r'      <nav[\s\S]*?      </nav>\n\n      <form',
              navigation,
              'sport and feature navigation',
          )
          regex_once(
              shop,
              r'<option value="autograph">Autographs</option>\s*<option value="rookie">Rookies</option>\s*<option value="graded">Graded</option>\s*<option value="numbered">Numbered</option>',
              '''<option value="autograph">Autographs</option>
                    <option value="memorabilia">Memorabilia Cards</option>
                    <option value="graded">Graded Cards</option>
                    <option value="rookie">Rookie Cards</option>
                    <option value="numbered">Numbered Cards</option>''',
              'feature select options',
          )

          launch = Path('src/lib/sports-card-launch-scope.ts')
          regex_once(
              launch,
              r'const ALLOWED_SECTIONS = new Set\(\[[\s\S]*?\]\);',
              '''const ALLOWED_SECTIONS = new Set([
            "Baseball", "NBA", "WNBA", "Basketball", "Football", "Hockey", "Soccer",
            "Wrestling", "MMA / UFC", "Boxing", "Golf", "Tennis", "Racing / NASCAR",
            "Cricket", "Lacrosse", "Volleyball", "Rugby", "Olympics / Track & Field",
            "Poker", "Skateboarding", "Multi-Sport", "Sealed Wax", "Pucks", "Balls",
            "Jerseys", "Helmets", "Bats & Gloves", "Photos & Prints", "Tickets & Programs",
            "Pins & Souvenirs", "Signs & Display", "Music", "Trading Card Games",
            "Entertainment & Pop Culture", "Comics", "Coins", "Toys & Figures",
            "Watches & Accessories",
          ]);''',
              'explicit launch sections',
          )
          replace_once(
              launch,
              '  if (!title || PARTS_PATTERN.test(searchable)) return false;',
              '''  if (
            !title ||
            section === "Needs Review" ||
            ["Other Sports", "Other Collectables", "Other Collectibles", "Memorabilia", "Autographs"].includes(section) ||
            PARTS_PATTERN.test(searchable)
          ) {
            return false;
          }''',
              'review and deprecated section exclusion',
          )
          regex_once(
              launch,
              r'  if \(ALLOWED_CATEGORIES\.has\(category\)\) return true;\s*  if \(ALLOWED_SECTIONS\.has\(section\)\) return true;[\s\S]*?  return true;',
              '''  if (ALLOWED_SECTIONS.has(section)) return true;
            if (ALLOWED_CATEGORIES.has(category) && section !== "Needs Review") return true;
            return false;''',
              'explicit launch allowlist',
          )

          sync = Path('src/lib/ebay-authoritative-store-sync.ts')
          replace_once(sync, 'const STOREFRONT_TAXONOMY_VERSION = 6;', 'const STOREFRONT_TAXONOMY_VERSION = 7;', 'authoritative taxonomy version')

          tests = Path('scripts/run-storefront-taxonomy-regressions.ts')
          source = tests.read_text()
          if 'const taxonomyV7Cases =' in source:
              raise SystemExit('taxonomy v7 tests already exist')
          source += r'''

          const taxonomyV7Cases = [
            ["1993-94 Stadium Club #17 Nick Van Exel Beam Team Members Only", "NBA"],
            ["1997-98 Leaf #6 Paul Kariya Fractal Matrix Die Cuts SSP", "Hockey"],
            ["2001 SP Authentic #31 Peter Jacobsen Gold #/500", "Golf"],
            ["2006 Razor WPT Showdown Signatures Hoyt Corkins WSOP Royalty SSP Auto", "Poker"],
            ["2013 Leaf Keeping It Real Autos Bam Margera RC SP /25", "Skateboarding"],
            ["2025 Score #35 Jaxson Dart Red", "Football"],
            ["2025 Topps Chrome Update John Rave RC Auto Orange Refractors /25", "Baseball"],
            ["2025-26 SkyBox Metal Universe #150 Ivan Demidov", "Hockey"],
            ["2026 Donruss #1 Paige Bueckers Donruss Ballpark Stars RC", "WNBA"],
            ["ME05: Pitch Black #077/084 Gladion's Final Battle", "Trading Card Games"],
            ["Prize Pack Series Cards #005 Basic Psychic Energy", "Trading Card Games"],
            ["Saturn Automotive GM Dealer Quartz Wristwatch Water Resistant Japan Movement NEW", "Watches & Accessories"],
            ["NOAH HANIFIN Limited Edition 2024 Preseason Pin Vegas Golden Knights SGA NEW", "Pins & Souvenirs"],
            ["Vegas Golden Knights vanity license plate for player Alex Tuch TUCH", "Signs & Display"],
            ["The Beastie Boys ALL 3 Signed CD Booklet PSA Authenticated", "Music"],
            ["2024 POP CENTURY RETRO TV AUTO ED MARINARO 1/1 AUTOGRAPH HILL STREET BLUES", "Entertainment & Pop Culture"],
          ] as const;
          for (const [title, expectedSection] of taxonomyV7Cases) {
            const result = classifyStorefrontItem({ title, primaryCategory: "other_collectable" });
            assert.equal(result.section, expectedSection, title);
            assert.ok(!["Other Collectables", "Other Sports", "Memorabilia"].includes(result.section));
          }
          const baseballJerseyCard = classifyStorefrontItem({ title: "2004 SkyBox LE #20 Josh Beckett PINSTRIPE Jersey Proof /299", rawSport: "Baseball", primaryCategory: "memorabilia" });
          assert.equal(baseballJerseyCard.section, "Baseball");
          assert.equal(baseballJerseyCard.features.memorabilia, true);
          const hockeyRelicCard = classifyStorefrontItem({ title: "2017-18 SP Game Used #FW-JQ Jonathan Quick Frameworks Jumbo Jersey Relic", rawSport: "Ice Hockey", primaryCategory: "memorabilia" });
          assert.equal(hockeyRelicCard.section, "Hockey");
          assert.equal(hockeyRelicCard.features.memorabilia, true);
          const gradedBaseball = classifyStorefrontItem({ title: "1989 Upper Deck #13 Gary Sheffield RC PSA 10", primaryCategory: "sports_cards" });
          assert.equal(gradedBaseball.section, "Baseball");
          assert.equal(gradedBaseball.features.graded, true);
          assert.equal(gradedBaseball.features.rookie, true);
          const multiFeatureCard = classifyStorefrontItem({ title: "2025 Panini Origins Shedeur Sanders RC Jumbo Patch Auto Pink RPA FOTL /12 PSA 9", primaryCategory: "sports_cards" });
          assert.equal(multiFeatureCard.section, "Football");
          assert.equal(multiFeatureCard.features.autograph, true);
          assert.equal(multiFeatureCard.features.memorabilia, true);
          assert.equal(multiFeatureCard.features.graded, true);
          assert.equal(multiFeatureCard.features.rookie, true);
          assert.equal(multiFeatureCard.features.numbered, true);
          assert.equal(matchesStorefrontFilters(baseballJerseyCard, { feature: "memorabilia cards" }), true);
          assert.deepEqual(sortStorefrontSections(["Other Sports", "Baseball", "Memorabilia", "Other Collectables", "Hockey", "Needs Review"]), ["Baseball", "Hockey"]);
          '''
          tests.write_text(source)

          for name in [
              '.github/workflows/one-time-storefront-taxonomy-v7-no-junk-buckets-20260728.yml',
              '.github/workflows/one-time-storefront-taxonomy-v7-no-junk-buckets-v2-20260728.yml',
          ]:
              path = Path(name)
              if path.exists(): path.unlink()
          PY

      - name: Format and validate taxonomy v7
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write src/lib/storefront-taxonomy.ts src/modules/inventory/types.ts src/app/shop/page.tsx src/lib/sports-card-launch-scope.ts src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          node --import tsx scripts/run-ebay-import-admin-client-simulations.ts
          npx eslint src/lib/storefront-taxonomy.ts src/modules/inventory/types.ts src/app/shop/page.tsx src/lib/sports-card-launch-scope.ts src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts
          npm run build

      - name: Commit validated taxonomy v7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add -A
          git commit -m "Eliminate fallback storefront buckets"
          git push origin HEAD:agent/storefront-taxonomy-v7-no-junk-buckets-20260728
