name: Apply Order Notification Hardening

on:
  push:
    branches:
      - agent/order-notification-hardening-20260726

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/order-notification-hardening-20260726
          fetch-depth: 0

      - name: Patch order event callers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected source block missing in {path}")
              file.write_text(text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str):
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count == 0:
                  if replacement.strip() in text:
                      return
                  raise SystemExit(f"Expected regex block missing in {path}")
              file.write_text(updated)

          checkout = "src/lib/checkout-order-finalization.ts"
          replace_once(
              checkout,
              'import { persistBuyerProtectionForOrder } from "./buyer-protection-order";\n',
              'import { persistBuyerProtectionForOrder } from "./buyer-protection-order";\nimport { enqueueAndAttemptOrderNotification } from "./order-notifications";\n',
          )
          replace_once(
              checkout,
              '  return { orderId };\n}',
              '''  if (!isE2ETest) {
    try {
      await enqueueAndAttemptOrderNotification({
        supabase,
        storeId,
        orderId,
        notificationType: "payment_confirmation",
        recipientEmail: customerEmail,
        recipientName: customerName,
        payload: {
          orderId,
          customerName,
          total,
          subtotal,
          shippingAmount,
          shippingName,
          items: (ledgerOrderItems || []).map((item) => ({
            title: String(item.title || "Item"),
            quantity: Number(item.quantity || 1),
            price: Number(item.price || 0),
          })),
        },
      });
    } catch (notificationError: any) {
      console.error(
        "Payment confirmation notification failed:",
        notificationError?.message || notificationError,
      );
    }
  }

  return { orderId };
}''',
          )

          shipped = "src/app/api/orders/mark-shipped/route.ts"
          replace_once(
              shipped,
              'import { getStoreSettings } from "../../../../lib/store-settings";\n',
              '',
          )
          replace_once(
              shipped,
              'import { getActiveStoreId } from "../../../../lib/stores";\n',
              'import { getActiveStoreId } from "../../../../lib/stores";\nimport { enqueueAndAttemptOrderNotification } from "../../../../lib/order-notifications";\n',
          )
          regex_once(
              shipped,
              r'function trackingUrl\(carrier: string, trackingNumber: string\) \{.*?\n\}\n\nfunction storeName\(value: string\) \{.*?\n\}\n\n',
              '',
          )
          replace_once(
              shipped,
              '''    const resendApiKey = process.env.RESEND_API_KEY;
    const supabase = createSupabaseServerClient({ admin: true });
    const storeId = getActiveStoreId();
    const storeSettings = await getStoreSettings(supabase, storeId);
    const activeStoreName = storeName(storeSettings.displayName);
''',
              '''    const supabase = createSupabaseServerClient({ admin: true });
    const storeId = getActiveStoreId();
''',
          )
          replace_once(
              shipped,
              '''        status,
        fulfillment_status
''',
              '''        status,
        fulfillment_status,
        shipped_at
''',
          )
          replace_once(
              shipped,
              '    const shippedAt = new Date().toISOString();\n',
              '    const shippedAt = order.shipped_at || new Date().toISOString();\n',
          )
          regex_once(
              shipped,
              r'    let emailSent = false;.*?    return NextResponse\.json\(\{\n      success: true,\n      emailSent,\n      emailError,\n    \}\);',
              '''    let notification = null;
    let notificationError: string | null = null;

    try {
      notification = await enqueueAndAttemptOrderNotification({
        supabase,
        storeId,
        orderId,
        notificationType: "shipment_confirmation",
        recipientEmail: order.customer_email,
        recipientName: order.customer_name,
        payload: {
          orderId,
          customerName: order.customer_name,
          carrier: order.carrier,
          trackingNumber: order.tracking_number,
        },
      });
    } catch (error: any) {
      notificationError = error?.message || "Shipment notification failed";
      console.error("Shipment notification failed:", notificationError);
    }

    return NextResponse.json({
      success: true,
      emailSent: notification?.sent === true,
      emailQueued: Boolean(notification),
      notificationId: notification?.notificationId || null,
      notificationStatus: notification?.status || null,
      emailError: notification?.error || notificationError,
    });''',
          )

          tracking = "src/app/api/orders/update-tracking/route.ts"
          replace_once(
              tracking,
              'import { getActiveStoreId } from "../../../../lib/stores";\n',
              'import { getActiveStoreId } from "../../../../lib/stores";\nimport { enqueueAndAttemptOrderNotification } from "../../../../lib/order-notifications";\n',
          )
          replace_once(
              tracking,
              '''    if (isDryRunShippingReference(trackingNumber)) {
      return NextResponse.json(
        {
          error:
            "TCOS dry-run tracking cannot be saved manually. Buy or record a real label before saving tracking.",
        },
        { status: 409 },
      );
    }

    let activeShippingLabel: ActiveShippingLabel | null = null;
''',
              '''    if (isDryRunShippingReference(trackingNumber)) {
      return NextResponse.json(
        {
          error:
            "TCOS dry-run tracking cannot be saved manually. Buy or record a real label before saving tracking.",
        },
        { status: 409 },
      );
    }

    const { data: order, error: orderLookupError } = await supabase
      .from("orders")
      .select(
        "id,customer_email,customer_name,carrier,tracking_number,shipped_at,fulfillment_status",
      )
      .eq("id", orderId)
      .eq("store_id", storeId)
      .single();

    if (orderLookupError || !order) {
      return NextResponse.json({ error: "Order not found" }, { status: 404 });
    }

    const trackingChanged =
      String(order.carrier || "").trim() !== carrier ||
      String(order.tracking_number || "").trim() !== trackingNumber;

    let activeShippingLabel: ActiveShippingLabel | null = null;
''',
          )
          replace_once(
              tracking,
              '    return NextResponse.json({ success: true });\n',
              '''    let notification = null;
    let notificationError: string | null = null;

    if (trackingChanged && order.shipped_at) {
      try {
        notification = await enqueueAndAttemptOrderNotification({
          supabase,
          storeId,
          orderId,
          notificationType: "tracking_updated",
          recipientEmail: order.customer_email,
          recipientName: order.customer_name,
          payload: {
            orderId,
            customerName: order.customer_name,
            carrier,
            trackingNumber,
          },
        });
      } catch (error: any) {
        notificationError = error?.message || "Tracking update notification failed";
        console.error("Tracking update notification failed:", notificationError);
      }
    }

    return NextResponse.json({
      success: true,
      emailSent: notification?.sent === true,
      emailQueued: Boolean(notification),
      notificationId: notification?.notificationId || null,
      notificationStatus: notification?.status || null,
      emailError: notification?.error || notificationError,
    });
''',
          )
          PY

      - name: Commit patched callers
        run: |
          if git diff --quiet; then
            echo "Order notification callers already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/checkout-order-finalization.ts src/app/api/orders/mark-shipped/route.ts src/app/api/orders/update-tracking/route.ts
          git commit -m "Wire durable notifications into order events"
          git push origin HEAD:agent/order-notification-hardening-20260726
