name: Apply Active Market Direct Proof Integrity

on:
  push:
    branches:
      - agent/prove-active-market-competitors-directly
    paths:
      - "scripts/apply-active-market-direct-proof-integrity.mjs"
      - ".github/workflows/apply-active-market-direct-proof-integrity.yml"

permissions:
  contents: write

jobs:
  apply-integrity-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply direct proof integrity patch
        run: node scripts/apply-active-market-direct-proof-integrity.mjs

      - name: Validate patch
        run: git diff --check

      - name: Commit integrity patch
        run: |
          if git diff --quiet; then
            echo "Direct proof integrity requirement was already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/active-market-integrity-audit.ts scripts/run-active-market-integrity-simulations.ts
          git commit -m "Require direct proof in Active Market integrity"
          git push origin HEAD:${{ github.ref_name }}
