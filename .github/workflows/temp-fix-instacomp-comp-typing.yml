name: Temporary InstaComp Comp Typing Patch

on:
  push:
    branches:
      - agent/instacomp-pending-review-overhaul-20260726
    paths:
      - scripts/temp-fix-instacomp-comp-typing.py
      - .github/workflows/temp-fix-instacomp-comp-typing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-pending-review-overhaul-20260726
          fetch-depth: 0
      - run: python scripts/temp-fix-instacomp-comp-typing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Type comp evidence flags explicitly"
            git push origin HEAD:agent/instacomp-pending-review-overhaul-20260726
          fi
