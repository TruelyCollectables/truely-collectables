name: Emergency Commit Shop Server Client Fix 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/emergency-commit-shop-server-client-fix-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-durable-fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/issue253-emergency-collx-grant-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue253-emergency-collx-grant-20260730
          fetch-depth: 0

      - name: Apply and commit durable shop fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/shop/page.tsx")
          text = path.read_text()
          old = "const supabase = createSupabaseServerClient();"
          new = "const supabase = createSupabaseServerClient({ admin: true });"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("Expected storefront Supabase client line was not found.")
          PY
          grep -Fq 'const supabase = createSupabaseServerClient({ admin: true });' src/app/shop/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/shop/page.tsx
          if git diff --cached --quiet; then
            echo "Durable shop fix is already committed."
            exit 0
          fi
          git commit -m "Use protected server client for shop sold history"
          git push origin HEAD:fix/issue253-emergency-collx-grant-20260730
