name: InstaComp Local Hard Facts Patch 20260807

on:
  push:
    branches:
      - fix/instacomp-registry-recovery-hard-facts-20260807
    paths:
      - "scripts/ops/patch-instacomp-local-hard-facts-20260807.py"
      - ".github/workflows/instacomp-local-hard-facts-patch-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-registry-recovery-hard-facts-20260807
          fetch-depth: 0
      - name: Apply exact local hard-fact repair
        run: python scripts/ops/patch-instacomp-local-hard-facts-20260807.py
      - name: Mac-service Python tests
        shell: bash
        run: |
          set -euo pipefail
          cd services/instacomp-ai
          python -m pip install -q -r requirements.txt
          python -m pytest -q tests/test_ocr_registry_hard_facts.py
          python -m py_compile app/local_vision.py app/ollama.py
      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'services/instacomp-ai/app/local_vision.py' 'services/instacomp-ai/tests/test_ocr_registry_hard_facts.py' | sort)"
          test "$changed" = "$expected"
      - name: Commit certified local parser repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/instacomp-ai/app/local_vision.py services/instacomp-ai/tests/test_ocr_registry_hard_facts.py
          git commit -m 'Harden InstaComp physical card number and year OCR'
          git push origin HEAD:fix/instacomp-registry-recovery-hard-facts-20260807
