name: InstaComp teacher env sync certify

on:
  push:
    branches:
      - fix/instacomp-groq-teacher-20260808
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  certify-and-apply:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[teacher-env-sync-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out teacher branch
        uses: actions/checkout@v4
        with:
          ref: fix/instacomp-groq-teacher-20260808
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply one-command teacher credential sync
        run: node scripts/apply-instacomp-teacher-env-sync.mjs

      - name: Reject malformed shell patch
        run: |
          git diff --check
          bash -n services/instacomp-ai/scripts/update-live-from-main.sh

      - name: Verify no-secret teacher env sync contract
        run: node scripts/run-instacomp-mac-teacher-env-sync-simulations.mjs

      - name: Run Mac service source regressions
        run: python3 -m compileall -q services/instacomp-ai/app

      - name: Commit certified updater change
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "Truely Collectables CI"
          git config user.email "actions@users.noreply.github.com"
          git add services/instacomp-ai/scripts/update-live-from-main.sh
          git commit -m "Sync teacher credentials in Mac updater [teacher-env-sync-applied]"
          git push origin HEAD:fix/instacomp-groq-teacher-20260808
