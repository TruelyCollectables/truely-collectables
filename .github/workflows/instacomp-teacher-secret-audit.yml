name: InstaComp Teacher Secret Presence Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/instacomp-teacher-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GEMINI_API_KEY_VALUE: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      ANTHROPIC_API_KEY_VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY_VALUE: ${{ secrets.XAI_API_KEY }}
      GROQ_API_KEY_VALUE: ${{ secrets.GROQ_API_KEY }}
      PERPLEXITY_API_KEY_VALUE: ${{ secrets.PERPLEXITY_API_KEY }}
      OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Print presence booleans only
        shell: bash
        run: |
          set -euo pipefail
          present() { if [[ -n "${1:-}" ]]; then printf 'true'; else printf 'false'; fi; }
          echo "GEMINI_API_KEY_PRESENT=$(present "$GEMINI_API_KEY_VALUE")"
          echo "GOOGLE_GEMINI_API_KEY_PRESENT=$(present "$GOOGLE_GEMINI_API_KEY_VALUE")"
          echo "ANTHROPIC_API_KEY_PRESENT=$(present "$ANTHROPIC_API_KEY_VALUE")"
          echo "XAI_API_KEY_PRESENT=$(present "$XAI_API_KEY_VALUE")"
          echo "GROQ_API_KEY_PRESENT=$(present "$GROQ_API_KEY_VALUE")"
          echo "PERPLEXITY_API_KEY_PRESENT=$(present "$PERPLEXITY_API_KEY_VALUE")"
          echo "OPENAI_API_KEY_PRESENT=$(present "$OPENAI_API_KEY_VALUE")"
