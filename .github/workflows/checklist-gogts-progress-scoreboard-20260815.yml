name: Checklist GoGTS Production Scoreboard 20260815

# Read-only scoreboard; never takes the Production writer lock.
on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/checklist-gogts-progress-scoreboard-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  scoreboard:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Resolve Production Supabase read credentials
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gogts-scoreboard"; mkdir -p "$root"
          curl --silent --show-error --fail --retry 3 --retry-all-errors --max-time 30 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" --output "$root/projects.json" \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          project_ref="${candidates[0]}"
          curl --silent --show-error --fail --retry 3 --retry-all-errors --max-time 30 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" --output "$root/api-keys.json" \
            "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$root/api-keys.json")"
          test -n "$service_key"; echo "::add-mask::$service_key"
          echo "SB_URL=https://$project_ref.supabase.co" >> "$GITHUB_ENV"
          echo "SB_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Count GoGTS imports since accelerated writer started
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gogts-scoreboard"
          headers="$root/count.headers"; body="$root/count.json"
          query='select=source_url&status=eq.imported&source_url=like.https%3A%2F%2Fgogts.net%2F%2A&imported_at=gte.2026-08-15T21%3A02%3A45Z'
          curl --silent --show-error --fail --retry 2 --retry-all-errors --max-time 20 \
            --dump-header "$headers" --header "apikey: $SB_KEY" --header "Authorization: Bearer $SB_KEY" \
            --header "Prefer: count=exact" --output "$body" \
            "$SB_URL/rest/v1/checklist_source_catalog?$query&limit=1"
          count="$(tr -d '\r' < "$headers" | awk -F'/' 'tolower($1) ~ /^content-range:/ {print $2}' | tail -1)"
          latest="$root/latest.json"
          curl --silent --show-error --fail --retry 2 --retry-all-errors --max-time 20 \
            --header "apikey: $SB_KEY" --header "Authorization: Bearer $SB_KEY" --output "$latest" \
            "$SB_URL/rest/v1/checklist_source_catalog?select=source_url,imported_at,status&status=eq.imported&source_url=like.https%3A%2F%2Fgogts.net%2F%2A&imported_at=gte.2026-08-15T21%3A02%3A45Z&order=imported_at.desc.nullslast&limit=10"
          jq -n --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson importedSinceStart "${count:-0}" --slurpfile latest "$latest" \
            '{generatedAt:$now,writerStartedAt:"2026-08-15T21:02:45Z",gogtsImportedRowsSinceStart:$importedSinceStart,latest:$latest[0]}' \
            > "$root/scoreboard.json"
          cat "$root/scoreboard.json"
      - name: Upload scoreboard
        uses: actions/upload-artifact@v4
        with:
          name: checklist-gogts-production-scoreboard-${{ github.run_id }}
          path: ${{ runner.temp }}/gogts-scoreboard/scoreboard.json
          retention-days: 7
