name: Checklist GoGTS Production Scoreboard 20260815

# Read-only Management API scoreboard; never takes the Production writer lock.
on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/checklist-gogts-progress-scoreboard-20260815.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  scoreboard:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Resolve Production project
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gogts-scoreboard"; mkdir -p "$root"
          curl --silent --show-error --fail --retry 2 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --output "$root/projects.json" "https://api.supabase.com/v1/projects"
          mapfile -t refs < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#refs[@]}" -eq 1
          echo "PROJECT_REF=${refs[0]}" >> "$GITHUB_ENV"
      - name: Read live GoGTS progress through Management SQL
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gogts-scoreboard"
          jq -n --arg q "
            select jsonb_build_object(
              'captured_at', clock_timestamp(),
              'gogts_imported_total', (
                select count(*) from public.checklist_source_catalog
                where status='imported' and source_url like 'https://gogts.net/%'
              ),
              'latest', coalesce((
                select jsonb_agg(x order by x.imported_at desc) from (
                  select source_url, imported_at,
                         metadata->>'masterArchiveExactSetKey' as exact_set_key
                  from public.checklist_source_catalog
                  where status='imported' and source_url like 'https://gogts.net/%'
                  order by imported_at desc nulls last
                  limit 10
                ) x
              ), '[]'::jsonb),
              'active_db', coalesce((
                select jsonb_agg(x order by x.query_start) from (
                  select pid, state, wait_event_type, wait_event,
                         clock_timestamp()-query_start as query_age,
                         left(query,300) as query
                  from pg_catalog.pg_stat_activity
                  where datname=current_database() and pid<>pg_backend_pid() and state<>'idle'
                ) x
              ), '[]'::jsonb)
            ) as scoreboard;
          " '{query:$q}' > "$root/request.json"
          curl --silent --show-error --fail --retry 1 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @"$root/request.json" \
            --output "$root/result.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query/read-only"
          jq '.[0].scoreboard' "$root/result.json" > "$root/scoreboard.json"
          cat "$root/scoreboard.json"
      - name: Export compact exact-set snapshot through Management SQL
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gogts-scoreboard"
          jq -n --arg q "
            with exact_rows as (
              select lower(coalesce(metadata->>'masterArchiveExactSetKey', metadata->>'exactSetKey')) as exact_set_key,
                     bool_or(status='imported') as imported
              from public.checklist_source_catalog
              where coalesce(metadata->>'masterArchiveExactSetKey', metadata->>'exactSetKey') is not null
              group by 1
            )
            select jsonb_build_object(
              'schema','tcos.checklist.masterExactSetSnapshot.v1',
              'generatedAt',clock_timestamp(),
              'count',(select count(*) from exact_rows where exact_set_key like '%|%|%|%'),
              'sets',coalesce((
                select jsonb_agg(jsonb_build_object('exactSetKey',exact_set_key,'imported',imported) order by exact_set_key)
                from exact_rows
                where exact_set_key like '%|%|%|%'
              ),'[]'::jsonb)
            ) as snapshot;
          " '{query:$q}' > "$root/snapshot-request.json"
          curl --silent --show-error --fail --retry 2 --retry-all-errors --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @"$root/snapshot-request.json" \
            --output "$root/snapshot-result.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query/read-only"
          jq '.[0].snapshot' "$root/snapshot-result.json" > "$root/master-exact-set-snapshot.json"
          jq '{schema,generatedAt,count,imported:(.sets|map(select(.imported==true))|length)}' "$root/master-exact-set-snapshot.json"
      - name: Upload scoreboard and exact-set snapshot
        uses: actions/upload-artifact@v4
        with:
          name: checklist-production-snapshot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gogts-scoreboard/scoreboard.json
            ${{ runner.temp }}/gogts-scoreboard/master-exact-set-snapshot.json
          retention-days: 30
