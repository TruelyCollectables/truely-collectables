name: Audit Unresolved Storefront Buckets 20260728

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-junk-storefront-buckets-20260728.yml"

permissions:
  contents: read

jobs:
  audit-buckets:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/audit-storefront-taxonomy-v5-20260728'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/audit-storefront-taxonomy-v5-20260728
          fetch-depth: 1

      - name: Fetch unresolved section pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bucket-audit/pages
          fetch_page() {
            key="$1"; path="$2"
            curl --location --fail --silent --show-error \
              --connect-timeout 15 --max-time 120 \
              --header 'Cache-Control: no-cache' \
              --output "bucket-audit/pages/${key}.html" \
              "https://truelycollectables.com${path}"
          }
          fetch_page other_collectables '/shop?section=Other%20Collectables'
          fetch_page other_sports '/shop?section=Other%20Sports'
          fetch_page memorabilia '/shop?section=Memorabilia'
          fetch_page all '/shop'

      - name: Extract titles and counts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const decode = (value) => value
            .replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"')
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ')
            .replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          const html = (key) => fs.readFileSync(`bucket-audit/pages/${key}.html`, 'utf8');
          const text = (key) => decode(html(key).replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' '));
          const count = (key) => {
            const match = text(key).match(/([\d,]+) active cards & collectibles/i);
            return match ? Number(match[1].replaceAll(',', '')) : null;
          };
          const titles = (key) => Array.from(html(key).matchAll(/<h2[^>]*>([\s\S]*?)<\/h2>/gi), (match) => decode(match[1]));
          const result = {
            capturedAt: new Date().toISOString(),
            counts: {
              all: count('all'),
              otherCollectables: count('other_collectables'),
              otherSports: count('other_sports'),
              memorabilia: count('memorabilia'),
            },
            titles: {
              otherCollectables: titles('other_collectables'),
              otherSports: titles('other_sports'),
              memorabilia: titles('memorabilia'),
            },
          };
          fs.writeFileSync('bucket-audit/unresolved-buckets.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result));
          NODE

      - name: Upload unresolved bucket audit
        uses: actions/upload-artifact@v4
        with:
          name: unresolved-storefront-buckets-${{ github.run_number }}
          path: bucket-audit
          if-no-files-found: error
          retention-days: 30
