name: InstaComp Legacy Card UUID Migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-legacy-card-uuid-migration.yml"
      - "scripts/patch-instacomp-legacy-card-uuid-migration.py"
      - "scripts/patch-instacomp-legacy-card-uuid-test-import.py"
      - "services/instacomp-ai/app/storage.py"
      - "services/instacomp-ai/scripts/import_supervised_203_trusted.py"
      - "services/instacomp-ai/tests/test_card_uuid_tracking.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-legacy-card-uuid-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: fix/instacomp-legacy-card-uuid-migration-20260808

jobs:
  repair-test-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Apply legacy UUID repair
        run: |
          set -euo pipefail
          python3 scripts/patch-instacomp-legacy-card-uuid-migration.py
          python3 scripts/patch-instacomp-legacy-card-uuid-test-import.py
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Run UUID regressions and complete InstaComp service suite
        run: |
          set -euo pipefail
          pip install -r services/instacomp-ai/requirements.txt
          python -m compileall -q services/instacomp-ai/app services/instacomp-ai/tests services/instacomp-ai/scripts/import_supervised_203_trusted.py
          PYTHONPATH=services/instacomp-ai pytest -q services/instacomp-ai/tests/test_card_uuid_tracking.py
          PYTHONPATH=services/instacomp-ai pytest -q services/instacomp-ai/tests

      - name: Persist repaired runtime and regressions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/instacomp-ai/app/storage.py \
            services/instacomp-ai/scripts/import_supervised_203_trusted.py \
            services/instacomp-ai/tests/test_card_uuid_tracking.py
          if ! git diff --cached --quiet; then
            git commit -m "Repair legacy physical-card UUIDs before 203 import [skip ci]"
            git push origin "HEAD:$EXPECTED_BRANCH"
          fi
