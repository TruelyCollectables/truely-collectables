name: InstaComp Targeted Repair

on:
  push:
    branches:
      - fix/instacomp-blue-velocity-and-no-openai-handoff
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-blue-velocity-and-no-openai-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: pip install -r services/instacomp-ai/requirements.txt
      - run: python scripts/patch-instacomp-blue-velocity-no-openai.py
      - name: Targeted assertions
        run: |
          grep -q 'Blue Velocity Prizm' services/instacomp-ai/app/ollama.py
          grep -q 'repeated directional/chevron or streaked velocity pattern' services/instacomp-ai/app/ollama.py
          grep -q 'irregular shattered polygon or ice-fragment facets' services/instacomp-ai/app/ollama.py
          grep -q 'No external identity provider was called' services/instacomp-ai/app/main.py
          ! grep -q 'The website may use OpenAI only as the emergency teacher' services/instacomp-ai/app/main.py
          ! grep -q 'provider: "openai_emergency"' src/app/api/instacomp/scan/route.ts
          ! grep -q 'provider: "openai_primary"' src/app/api/instacomp/scan/route.ts
      - run: |
          cd services/instacomp-ai
          python -m compileall app tests
          pytest -q
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Commit repaired runtime files
        run: |
          if git diff --quiet; then
            echo 'No runtime changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/instacomp-ai/app/main.py services/instacomp-ai/app/ollama.py
          git commit -m 'Fix Blue Velocity identity and remove stale external handoff'
          git push
