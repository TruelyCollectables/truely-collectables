name: Ops Launch 2 Issue 253 Production Retry 5

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-launch2-issue253-production-retry5-20260730.yml"

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: eff61e573154f4ad2ccc05eae0fe3fa542e94a95
  EXPECTED_DEPLOYMENT_HOST: truely-collectables-5e24ee37w-truelycollectables-projects.vercel.app
  EXPECTED_DEPLOYMENT_ID: dpl_8j6PqKKBvzwJbF2jXMx4KUEgsJcN
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables

jobs:
  verify-production:
    if: github.event.pull_request.head.ref == 'ops/launch2-issue253-production-apply-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fail closed on exact current source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p "$RUNNER_TEMP/launch2-issue253-retry5"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$RUNNER_TEMP/launch2-issue253-retry5/exact-main-sha.txt"

      - name: Verify exact Vercel Production deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/launch2-issue253-retry5"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$EXPECTED_DEPLOYMENT_ID?slug=$VERCEL_SCOPE" \
            > "$evidence/vercel-deployment.json"
          DEPLOYMENT_JSON="$(cat "$evidence/vercel-deployment.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const value = JSON.parse(process.env.DEPLOYMENT_JSON || '{}');
          const expectedSha = process.env.EXPECTED_MAIN_SHA;
          const expectedHost = process.env.EXPECTED_DEPLOYMENT_HOST;
          const aliases = Array.isArray(value.alias) ? value.alias : Array.isArray(value.aliases) ? value.aliases : [];
          const metaSha = String(value?.meta?.githubCommitSha || value?.meta?.githubCommitRef || '').trim();
          if (String(value.id || '') !== process.env.EXPECTED_DEPLOYMENT_ID) throw new Error(`Unexpected deployment id: ${value.id}`);
          if (String(value.url || '') !== expectedHost) throw new Error(`Unexpected deployment host: ${value.url}`);
          if (String(value.target || '').toLowerCase() !== 'production') throw new Error(`Deployment target is not Production: ${value.target}`);
          if (String(value.readyState || '').toUpperCase() !== 'READY') throw new Error(`Deployment is not READY: ${value.readyState}`);
          if (metaSha !== expectedSha) throw new Error(`Deployment metadata SHA ${metaSha || '<missing>'} does not equal ${expectedSha}.`);
          if (!aliases.includes('truelycollectables.com')) throw new Error('Production custom-domain alias is absent from deployment metadata.');
          const receipt = {
            ok: true,
            deploymentId: value.id,
            deploymentHost: value.url,
            target: value.target,
            readyState: value.readyState,
            exactMainSha: expectedSha,
            metadataSha: metaSha,
            customDomainAlias: 'truelycollectables.com',
            createdAt: value.createdAt || value.created,
            verifiedAt: new Date().toISOString(),
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'launch2-issue253-retry5', 'exact-deployment-receipt.json'), JSON.stringify(receipt, null, 2));
          NODE
          rm -f "$evidence/vercel-deployment.json"

      - name: Derive Production database context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/launch2-issue253-production"
          npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/launch2-issue253-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(`${process.env.RUNNER_TEMP}/launch2-issue253-production/production.env`, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            parsed[key] = value;
          }
          const url = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '').trim();
          if (!/^https:\/\//.test(url)) throw new Error('Production Supabase URL is unavailable.');
          const projectRef = new URL(url).hostname.split('.')[0];
          if (!projectRef) throw new Error('Unable to derive Supabase project ref.');
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_SUPABASE_PROJECT_REF=${projectRef}\n`);
          NODE

      - name: Verify hosted issue 253 invariants and backfill
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PRODUCTION_SUPABASE_PROJECT_REF}/database/query`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              read_only: true,
              parameters: [],
              query: `select json_build_object(
                'required_relations', (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('collectible_assets','collectible_asset_events','collectible_grader_verifications','collectible_market_snapshots','collectible_sales','instacomp_internal_sold_comps','collx_only_inventory_boundary_violations','ebay_inbound_sale_guards')),
                'sale_records_total', (select count(*) from public.collectible_sales),
                'sale_records_verified', (select count(*) from public.collectible_sales where evidence_status='verified'),
                'sale_records_manual', (select count(*) from public.collectible_sales where evidence_status='manual'),
                'sale_records_unresolved', (select count(*) from public.collectible_sales where evidence_status='unresolved'),
                'verified_or_manual_price_missing', (select count(*) from public.collectible_sales where evidence_status in ('verified','manual') and sold_price is null),
                'null_price_not_flagged_unresolved', (select count(*) from public.collectible_sales where sold_price is null and evidence_status <> 'unresolved'),
                'historical_sold_products_without_sale_record', (select count(*) from public.products p where p.sold_at < timestamptz '2026-07-28 00:00:00+00' and not exists (select 1 from public.collectible_sales s where s.store_id=p.store_id and s.legacy_product_id=p.id)),
                'collx_only_boundary_violations', (select count(*) from public.collx_only_inventory_boundary_violations),
                'active_inbound_sale_guards', (select count(*) from public.ebay_inbound_sale_guards where active),
                'duplicate_sale_event_groups', (select count(*) from (select store_id,event_key from public.collectible_sales group by store_id,event_key having count(*) > 1) d),
                'negative_product_quantities', (select count(*) from public.products where quantity < 0),
                'negative_inventory_quantities', (select count(*) from public.inventory_items where quantity < 0),
                'sold_stock_restoration_violations', (select count(*) from public.products where sold_at is not null and quantity > 0),
                'inactive_guard_trigger_count', (select count(*) from pg_trigger where tgname='capture_ebay_inactive_collectible_sale' and not tgisinternal),
                'inactive_guard_function_installed', (select case when to_regprocedure('public.capture_ebay_inactive_collectible_sale()') is null then false else position('ebay_inbound_sale_guards' in pg_get_functiondef(to_regprocedure('public.capture_ebay_inactive_collectible_sale()'))) > 0 end),
                'captured_at', now()
              ) as receipt;`,
            }),
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Hosted invariant query failed with HTTP ${response.status}: ${body.slice(0, 1000)}`);
          const rows = body ? JSON.parse(body) : [];
          const receipt = (Array.isArray(rows) ? rows[0]?.receipt : rows?.receipt) || rows;
          for (const key of ['verified_or_manual_price_missing','null_price_not_flagged_unresolved','historical_sold_products_without_sale_record','collx_only_boundary_violations','duplicate_sale_event_groups','negative_product_quantities','negative_inventory_quantities','sold_stock_restoration_violations']) {
            if (Number(receipt[key]) !== 0) throw new Error(`${key}=${receipt[key]}`);
          }
          if (Number(receipt.required_relations) !== 8 || Number(receipt.inactive_guard_trigger_count) !== 1 || receipt.inactive_guard_function_installed !== true) throw new Error(`Hosted issue 253 structure failed: ${JSON.stringify(receipt)}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'launch2-issue253-retry5', 'hosted-schema-backfill-receipt.json'), JSON.stringify({ ok: true, exactMainSha: process.env.EXPECTED_MAIN_SHA, receipt, containsOnlyAggregateCounts: true, verifiedAt: new Date().toISOString() }, null, 2));
          NODE
          rm -f "$RUNNER_TEMP/launch2-issue253-production/production.env"

      - name: Verify live storefront and protected runtime
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/launch2-issue253-retry5"
          home_code="$(curl --location --silent --show-error --max-time 30 --output "$evidence/home.html" --write-out '%{http_code}' https://truelycollectables.com/)"
          shop_code="$(curl --location --silent --show-error --max-time 30 --output "$evidence/shop.html" --write-out '%{http_code}' https://truelycollectables.com/shop)"
          runtime_code="$(curl --silent --show-error --max-time 90 --request POST --header "Authorization: Bearer $VERCEL_TOKEN" --output "$evidence/runtime-admin-self-test.json" --write-out '%{http_code}' https://truelycollectables.com/api/release/admin-orders-self-test)"
          unsigned_health="$(curl --location --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' https://truelycollectables.com/api/admin-orders-health)"
          test "$home_code" = 200
          test "$shop_code" = 200
          test "$runtime_code" = 200
          test "$unsigned_health" = 401
          RUNTIME_SELF_TEST="$(cat "$evidence/runtime-admin-self-test.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const value = JSON.parse(process.env.RUNTIME_SELF_TEST || '{}');
          if (value.success !== true || value.adminNavigation !== 'passed' || value.sessionRefresh !== 'passed' || value.refundConfirmationGuard !== 'passed' || value.refundIssued !== false || Number(value.directStoreTcosFeesRemaining) !== 0) throw new Error(`Protected runtime self-test failed: ${JSON.stringify(value)}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'launch2-issue253-retry5', 'live-boundary-receipt.json'), JSON.stringify({ ok: true, exactMainSha: process.env.EXPECTED_MAIN_SHA, deploymentId: process.env.EXPECTED_DEPLOYMENT_ID, deploymentHost: process.env.EXPECTED_DEPLOYMENT_HOST, homeStatus: 200, shopStatus: 200, protectedRuntimeStatus: 200, unsignedAdminHealthStatus: 401, runtime: value, verifiedAt: new Date().toISOString() }, null, 2));
          NODE
          rm -f "$evidence/home.html" "$evidence/shop.html" "$evidence/runtime-admin-self-test.json"

      - name: Upload sanitized exact Production evidence
        uses: actions/upload-artifact@v4
        with:
          name: launch2-issue253-production-retry5-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ runner.temp }}/launch2-issue253-retry5
          if-no-files-found: error
          retention-days: 30
