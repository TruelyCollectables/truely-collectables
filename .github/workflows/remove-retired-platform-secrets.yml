name: Remove Retired Platform Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-retired-platform-secrets.yml'

permissions:
  actions: write
  contents: read

jobs:
  remove-secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete retired deployment secrets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            code="$(curl -sS -X DELETE -o /tmp/result -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/$name")"
            echo "SECRET_DELETE name=$name http=$code"
            case "$code" in
              204|404) ;;
              *) exit 1 ;;
            esac
          done
