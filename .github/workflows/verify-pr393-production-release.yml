name: Verify PR 393 Production Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pr393-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pr393-production-release
  cancel-in-progress: false

jobs:
  final-live-production-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Certify public routes, release content, headers, and admin boundary
        shell: bash
        env:
          PRODUCTION_ORIGIN: https://truelycollectables.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin = String(process.env.PRODUCTION_ORIGIN || "").replace(/\/$/, "");
          if (origin !== "https://truelycollectables.com") {
            throw new Error(`Unexpected Production origin: ${origin || "missing"}`);
          }

          const sourceSha = process.env.GITHUB_SHA || "unknown";
          const stamp = `${sourceSha.slice(0, 12)}-${Date.now()}`;
          const fatalMarkers = [
            "Error loading products",
            "permission denied for view",
            "Missing Supabase environment variables",
            "Internal Server Error",
          ];
          const routes = [
            {
              path: "/",
              expected: "Find the collectible your collection is missing",
              label: "homepage hero",
            },
            {
              path: "/shop",
              expected: "Shop Sports Cards & Collectibles",
              label: "live shop heading",
            },
            {
              path: "/account",
              expected: "Your Collector Account",
              label: "collector account entry",
              alternates: ["Account Login", "Create Account"],
            },
            {
              path: "/account/login",
              expected: "No card verification is required for buyer accounts",
              label: "buyer login policy",
            },
            {
              path: "/cart",
              expected: "Shopping Cart",
              label: "shopping cart",
            },
            {
              path: "/buyer-protection",
              expected: "Truely Collectables Shipment Protection",
              label: "Shipment Protection terms",
            },
            {
              path: "/robots.txt",
              expected: "User-agent",
              label: "robots policy",
              contentType: "text/plain",
            },
            {
              path: "/sitemap.xml",
              expected: "urlset",
              label: "sitemap",
              contentType: "xml",
            },
          ];

          function decodeEntities(value) {
            return value
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">");
          }

          function visibleText(html) {
            return decodeEntities(
              html
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/<script[\s\S]*?<\/script>/gi, " ")
                .replace(/<style[\s\S]*?<\/style>/gi, " ")
                .replace(/<[^>]+>/g, " ")
                .replace(/\s+/g, " ")
                .trim(),
            );
          }

          function safeDiagnostic(text) {
            return visibleText(text)
              .replace(/\b(?:sk|rk|pk)_(?:live|test)_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .replace(/\bwhsec_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .slice(0, 320);
          }

          async function fetchWithRetry(url, options = {}) {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(url, {
                  ...options,
                  headers: {
                    "cache-control": "no-cache",
                    pragma: "no-cache",
                    "user-agent": "TruelyCollectablesPR393FinalCertification/1.0",
                    ...(options.headers || {}),
                  },
                  signal: AbortSignal.timeout(60_000),
                });
                if (response.status >= 500 && attempt < 6) {
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1_000));
                  continue;
                }
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < 6) {
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1_000));
                  continue;
                }
              }
            }
            throw lastError || new Error(`Request failed: ${url}`);
          }

          const results = [];
          for (let index = 0; index < routes.length; index += 1) {
            const check = routes[index];
            const separator = check.path.includes("?") ? "&" : "?";
            const url = `${origin}${check.path}${separator}pr393_final=${stamp}-${index}`;
            const response = await fetchWithRetry(url, { redirect: "follow" });
            const body = await response.text();
            const text = visibleText(body);
            const contentType = response.headers.get("content-type") || "";

            if (response.status < 200 || response.status >= 400) {
              throw new Error(
                `${check.label} returned HTTP ${response.status} at ${response.url}; diagnostic=${safeDiagnostic(body)}`,
              );
            }

            const fatal = fatalMarkers.find(
              (marker) => body.includes(marker) || text.includes(marker),
            );
            if (fatal) {
              throw new Error(
                `${check.label} exposed fatal marker "${fatal}"; diagnostic=${safeDiagnostic(body)}`,
              );
            }

            const candidates = [check.expected, ...(check.alternates || [])];
            const matched = candidates.find(
              (candidate) => body.includes(candidate) || text.includes(candidate),
            );
            if (!matched) {
              throw new Error(
                `${check.label} missed expected visible text (${candidates.join(" | ")}); diagnostic=${safeDiagnostic(body)}`,
              );
            }

            if (check.contentType && !contentType.toLowerCase().includes(check.contentType)) {
              throw new Error(
                `${check.label} returned unexpected content-type ${contentType || "missing"}`,
              );
            }

            results.push({
              path: check.path,
              status: response.status,
              matched,
              contentType,
            });
            console.log(`PASS ${check.path} — ${check.label} — ${matched}`);
          }

          const homeResponse = await fetchWithRetry(
            `${origin}/?pr393_headers=${stamp}`,
            { redirect: "manual" },
          );
          const requiredHeaders = [
            "strict-transport-security",
            "content-security-policy",
            "x-content-type-options",
            "x-frame-options",
          ];
          for (const header of requiredHeaders) {
            const value = homeResponse.headers.get(header);
            if (!value) {
              throw new Error(`Production homepage is missing required security header: ${header}`);
            }
            if (header === "x-content-type-options" && value.toLowerCase() !== "nosniff") {
              throw new Error(`x-content-type-options must be nosniff; received ${value}`);
            }
            console.log(`PASS header ${header}`);
          }

          for (const adminPath of ["/admin", "/admin/products/new", "/admin/orders"]) {
            const response = await fetchWithRetry(
              `${origin}${adminPath}?pr393_boundary=${stamp}`,
              { redirect: "manual" },
            );
            const location = response.headers.get("location") || "";
            if (![302, 303, 307, 308].includes(response.status) || !location.includes("/admin/login")) {
              throw new Error(
                `Unauthenticated ${adminPath} boundary failed: status=${response.status}; location=${location || "missing"}`,
              );
            }
            console.log(`PASS unauthenticated boundary ${adminPath} -> ${location}`);
          }

          console.log(`FINAL_PRODUCTION_CERTIFICATION=passed`);
          console.log(`CERTIFIED_SOURCE_SHA=${sourceSha}`);
          console.log(`CERTIFIED_ROUTE_COUNT=${results.length}`);
          NODE
