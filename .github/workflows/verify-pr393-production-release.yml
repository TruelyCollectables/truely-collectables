name: Verify PR 393 Production Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pr393-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pr393-production-release
  cancel-in-progress: false

jobs:
  final-live-production-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Certify live Production
        shell: bash
        env:
          PRODUCTION_ORIGIN: https://truelycollectables.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin = String(process.env.PRODUCTION_ORIGIN || "").replace(/\/$/, "");
          const sourceSha = process.env.GITHUB_SHA || "unknown";
          const stamp = `${sourceSha.slice(0, 12)}-${Date.now()}`;
          const fatalMarkers = [
            "Error loading products",
            "permission denied for view",
            "Missing Supabase environment variables",
            "Internal Server Error",
          ];
          const checks = [
            ["/", "Find the collectible your collection is missing", "homepage"],
            ["/shop", "Shop Sports Cards & Collectibles", "shop"],
            ["/account", "Checking your account", "account bootstrap"],
            ["/account/login", "No card verification is required for buyer accounts", "buyer login"],
            ["/cart", "Shopping Cart", "cart"],
            ["/buyer-protection", "Truely Collectables Shipment Protection", "Shipment Protection"],
            ["/robots.txt", "User-Agent", "robots"],
            ["/sitemap.xml", "urlset", "sitemap"],
          ];

          function visibleText(value) {
            return value
              .replace(/<!--[\s\S]*?-->/g, " ")
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/\s+/g, " ")
              .trim();
          }

          function diagnostic(value) {
            return visibleText(value)
              .replace(/\b(?:sk|rk|pk)_(?:live|test)_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .replace(/\bwhsec_[A-Za-z0-9_=-]{8,}\b/g, "[redacted]")
              .slice(0, 360);
          }

          async function request(url, redirect = "manual") {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(url, {
                  redirect,
                  headers: {
                    "cache-control": "no-cache",
                    pragma: "no-cache",
                    "user-agent": "TruelyCollectablesPR393FinalCertification/2.0",
                  },
                  signal: AbortSignal.timeout(60_000),
                });
                if (response.status >= 500 && attempt < 6) {
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1_000));
                  continue;
                }
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < 6) {
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1_000));
                  continue;
                }
              }
            }
            throw lastError || new Error(`Request failed: ${url}`);
          }

          for (let index = 0; index < checks.length; index += 1) {
            const [path, expected, label] = checks[index];
            const url = `${origin}${path}?pr393_final=${stamp}-${index}`;
            const initial = await request(url, "manual");
            const location = initial.headers.get("location") || "";
            console.log(`TRACE ${path} initial=${initial.status} location=${location || "none"}`);

            let response = initial;
            if ([301, 302, 303, 307, 308].includes(initial.status)) {
              response = await request(url, "follow");
            }
            const body = await response.text();
            const text = visibleText(body);
            const finalUrl = new URL(response.url);
            console.log(`TRACE ${path} final=${response.status} finalUrl=${response.url}`);

            if (path === "/account/login") {
              if ([301, 302, 303, 307, 308].includes(initial.status)) {
                throw new Error(
                  `Buyer login unexpectedly redirected: initial=${initial.status}; location=${location || "missing"}; final=${response.url}; diagnostic=${diagnostic(body)}`,
                );
              }
              if (finalUrl.pathname !== "/account/login") {
                throw new Error(
                  `Buyer login resolved to the wrong route: final=${response.url}; diagnostic=${diagnostic(body)}`,
                );
              }
            }

            if (response.status < 200 || response.status >= 400) {
              throw new Error(`${label} returned HTTP ${response.status} at ${response.url}`);
            }
            const fatal = fatalMarkers.find((marker) => body.includes(marker) || text.includes(marker));
            if (fatal) {
              throw new Error(`${label} exposed fatal marker ${fatal}; diagnostic=${diagnostic(body)}`);
            }
            if (!body.includes(expected) && !text.includes(expected)) {
              throw new Error(`${label} missed ${expected}; final=${response.url}; diagnostic=${diagnostic(body)}`);
            }
            console.log(`PASS ${path} — ${label} — ${expected}`);
          }

          const home = await request(`${origin}/?pr393_headers=${stamp}`, "manual");
          for (const header of [
            "strict-transport-security",
            "content-security-policy",
            "x-content-type-options",
            "x-frame-options",
          ]) {
            const value = home.headers.get(header);
            if (!value) throw new Error(`Missing security header: ${header}`);
            if (header === "x-content-type-options" && value.toLowerCase() !== "nosniff") {
              throw new Error(`x-content-type-options must be nosniff; received ${value}`);
            }
            console.log(`PASS header ${header}`);
          }

          for (const path of ["/admin", "/admin/products/new", "/admin/orders"]) {
            const response = await request(`${origin}${path}?pr393_boundary=${stamp}`, "manual");
            const location = response.headers.get("location") || "";
            if (![302, 303, 307, 308].includes(response.status) || !location.includes("/admin/login")) {
              throw new Error(`Unauthenticated ${path} boundary failed: status=${response.status}; location=${location || "missing"}`);
            }
            console.log(`PASS unauthenticated boundary ${path}`);
          }

          console.log("FINAL_PRODUCTION_CERTIFICATION=passed");
          console.log(`CERTIFIED_SOURCE_SHA=${sourceSha}`);
          console.log(`CERTIFIED_ROUTE_COUNT=${checks.length}`);
          NODE
