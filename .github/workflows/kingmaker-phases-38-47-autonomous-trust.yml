name: KINGMAKER Phases 38-47 Autonomous Trust

on:
  pull_request:
    paths:
      - 'src/lib/kingmaker-phases-38-47-autonomous-trust.ts'
      - 'scripts/run-kingmaker-phases-38-47-autonomous-trust-regressions.ts'
      - 'supabase/migrations/20260803191500_kingmaker_phases_38_47_autonomous_trust.sql'
      - '.github/workflows/kingmaker-phases-38-47-autonomous-trust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Phases 38-47 regressions
        run: node --import tsx scripts/run-kingmaker-phases-38-47-autonomous-trust-regressions.ts
      - name: Migration security
        run: |
          set -euo pipefail
          file='supabase/migrations/20260803191500_kingmaker_phases_38_47_autonomous_trust.sql'
          grep -Eiq 'enable row level security' "$file"
          grep -Eiq 'revoke all .* from anon, authenticated' "$file"
          grep -Eiq 'grant all .* to service_role' "$file"
          ! grep -Eiq 'grant .* to (anon|authenticated)' "$file"
      - name: Dependency security
        run: node scripts/run-dependency-security-audit.mjs
      - name: Lint
        run: npx eslint src/lib/kingmaker-phases-38-47-autonomous-trust.ts scripts/run-kingmaker-phases-38-47-autonomous-trust-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff integrity
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Production build
        run: npm run build
