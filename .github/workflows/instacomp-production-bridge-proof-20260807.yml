name: InstaComp Production Bridge Proof 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-production-bridge-proof-20260807.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-production-bridge-proof-20260807
  cancel-in-progress: true

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  EXPECTED_MAC_FINGERPRINT: dfc2dc241f61cd615b0811c68f7b843dd44c19e22fd29adc7d839ee1e62289cb

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read-only Production readiness and exact Mac fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/instacomp-production-bridge-proof-20260807
          out=evidence/instacomp-production-bridge-proof-20260807/readiness.json
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/internal-readiness?bridgeproof=1&ts=$(date +%s)")"
          echo "readiness_http=$code"
          cat "$out"
          test "$code" = "200"
          node -e 'const fs=require("node:fs"); const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const expected=process.argv[2]; for (const k of ["ok","configured","reachable","internalMemoryReady","checklistReady","localModelReady"]) if (b[k]!==true) throw new Error(`Readiness failed: ${k}=${b[k]}`); if (b.runtimeSourceFingerprint!==expected) throw new Error(`Fingerprint mismatch: ${b.runtimeSourceFingerprint}`); console.log(`PASS exact Mac fingerprint ${expected}`);' "$out" "$EXPECTED_MAC_FINGERPRINT"

      - name: Read-only Production Sentinel proxy proof
        shell: bash
        run: |
          set -euo pipefail
          npm ci >/dev/null
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          env_file="$RUNNER_TEMP/production.env"
          npx --yes vercel@56.2.0 env pull "$env_file" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          token="$(ENV_FILE="$env_file" node -e 'const fs=require("node:fs"); const lines=fs.readFileSync(process.env.ENV_FILE,"utf8").split(/\r?\n/); let value=""; for (const raw of lines){const i=raw.indexOf("="); if(i<1) continue; if(raw.slice(0,i).trim()!=="INSTACOMP_SENTINEL_ARCHIVE_TOKEN") continue; let v=raw.slice(i+1).trim(); if(v.startsWith("\"")&&v.endsWith("\"")){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}} else if(v.startsWith("\u0027")&&v.endsWith("\u0027")) v=v.slice(1,-1); value=v; break} process.stdout.write(value);')"
          test "${#token}" -ge 32
          echo "::add-mask::$token"
          out=evidence/instacomp-production-bridge-proof-20260807/sentinel.json
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H "x-instacomp-sentinel-archive-token: $token" -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/api/instacomp/checklist-sentinel?view=status&bridgeproof=1&ts=$(date +%s)")"
          echo "sentinel_http=$code"
          cat "$out"
          test "$code" = "200"
          node -e 'const fs=require("node:fs"); const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(b.ok!==true) throw new Error("Sentinel proxy ok=false"); if(b.data?.name!=="InstaComp AI Checklist Sentinel™") throw new Error(`Unexpected Sentinel name: ${b.data?.name}`); console.log("PASS Production Sentinel proxy authenticated to Mac");' "$out"

      - name: Upload bridge proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-production-bridge-proof-20260807
          path: evidence/instacomp-production-bridge-proof-20260807
          retention-days: 90
