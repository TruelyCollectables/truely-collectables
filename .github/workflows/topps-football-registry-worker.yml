name: Topps Football Registry Worker
run-name: Topps Football Registry Worker — ${{ github.event_name }}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - agent/topps-isolated-sport-pipelines
    paths:
      - ".github/workflows/topps-football-registry-worker.yml"
      - "scripts/run-topps-football-worker.ts"
      - "scripts/run-topps-football-regressions.ts"
      - "src/lib/checklist-registry/server.ts"
      - "src/lib/checklist-registry/topps-sport-pipelines.ts"
      - "src/lib/checklist-registry/topps-football-text.ts"
      - "src/lib/checklist-registry/topps-football-text-adapter.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/topps-football-registry-worker.yml"
      - "scripts/run-topps-football-worker.ts"
      - "scripts/run-topps-football-regressions.ts"
      - "src/lib/checklist-registry/server.ts"
      - "src/lib/checklist-registry/topps-sport-pipelines.ts"
      - "src/lib/checklist-registry/topps-football-text.ts"
      - "src/lib/checklist-registry/topps-football-text-adapter.ts"

permissions:
  contents: read

concurrency:
  group: topps-football-registry-worker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-football-worker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Certify parser, sport isolation, source trust, and retry boundaries
        run: npx tsx scripts/run-topps-football-regressions.ts
      - name: Prove pull-request validation cannot execute the Production worker
        run: |
          set -euo pipefail
          test -z "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
      - name: Lint Football worker boundary
        run: >-
          npx eslint
          scripts/run-topps-football-worker.ts
          scripts/run-topps-football-regressions.ts
          src/lib/checklist-registry/topps-sport-pipelines.ts
          src/lib/checklist-registry/topps-football-text.ts
          src/lib/checklist-registry/topps-football-text-adapter.ts
      - name: TypeScript
        run: npx tsc --noEmit

  football-only-production:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE || vars.SUPABASE_SERVICE_ROLE_KEY }}
      TOPPS_FOOTBALL_MAX_PRODUCTS: "500"
      TOPPS_FOOTBALL_MAX_SOURCES: "100"
      TOPPS_FOOTBALL_OUTPUT: .checklist-discovery/topps-football-worker-receipt.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/topps-isolated-sport-pipelines
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve protected Production credentials
        run: |
          set -euo pipefail
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "No Supabase URL resolved from NEXT_PUBLIC_SUPABASE_URL, SUPABASE_URL, or matching Production variables."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "No Supabase service key resolved from SUPABASE_SERVICE_ROLE_KEY, SUPABASE_SERVICE_KEY, SUPABASE_SERVICE_ROLE, or matching Production variables."
            exit 1
          fi
          echo "Production Supabase credentials resolved."
      - name: Install deterministic PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - run: npm ci
      - name: Re-run Football certification before Production access
        run: npx tsx scripts/run-topps-football-regressions.ts
      - name: Run isolated Topps Football discovery and Registry import
        run: node --import tsx scripts/run-topps-football-worker.ts
      - name: Verify Football-only receipt
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, writeFileSync } from 'node:fs';
          const path = process.env.TOPPS_FOOTBALL_OUTPUT;
          if (!path || !existsSync(path)) throw new Error(`Missing Topps Football receipt: ${path || '(unset)'}`);
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          if (receipt.manufacturer !== 'Topps' || receipt.sport !== 'Football') throw new Error('Topps Football worker crossed its boundary.');
          if ((receipt.totals?.selected ?? 0) > 100) throw new Error('Topps Football worker exceeded the 100-source limit.');
          const t = receipt.totals || {};
          const lines = [
            '# Topps Football Registry Worker', '',
            `**Production Football sources:** ${receipt.productionSourceCount ?? 0}`,
            `**Selected:** ${t.selected ?? 0}`,
            `**Imported:** ${t.imported ?? 0}`,
            `**Quarantined:** ${t.quarantined ?? 0}`,
            `**Failed:** ${t.failed ?? 0}`,
            `**Sets:** ${t.sets ?? 0}`,
            `**Cards:** ${t.cards ?? 0}`,
            `**Identities:** ${t.identities ?? 0}`,
          ];
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`, { flag: 'a' });
          NODE
      - name: Upload sanitized Football receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topps-football-registry-worker-receipt
          path: .checklist-discovery/topps-football-worker-receipt.json
          if-no-files-found: warn
          retention-days: 90
