name: Topps Football Registry Worker
run-name: Topps Football Registry Worker — ${{ github.event_name }}

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/topps-football-registry-worker.yml"
      - "scripts/run-topps-football-worker.ts"
      - "scripts/run-topps-football-regressions.ts"
      - "src/lib/checklist-registry/server.ts"
      - "src/lib/checklist-registry/topps-sport-pipelines.ts"
      - "src/lib/checklist-registry/topps-football-text.ts"
      - "src/lib/checklist-registry/topps-football-text-adapter.ts"
  push:
    branches:
      - agent/topps-isolated-sport-pipelines
    paths:
      - ".github/workflows/topps-football-registry-worker.yml"
      - "scripts/run-topps-football-worker.ts"
      - "scripts/run-topps-football-regressions.ts"
      - "src/lib/checklist-registry/server.ts"
      - "src/lib/checklist-registry/topps-sport-pipelines.ts"
      - "src/lib/checklist-registry/topps-football-text.ts"
      - "src/lib/checklist-registry/topps-football-text-adapter.ts"

permissions:
  contents: write

concurrency:
  group: topps-football-registry-worker
  cancel-in-progress: false

jobs:
  football-only:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOPPS_FOOTBALL_MAX_PRODUCTS: "500"
      TOPPS_FOOTBALL_MAX_SOURCES: "100"
      TOPPS_FOOTBALL_OUTPUT: .checklist-discovery/topps-football-worker-receipt.json
      TOPPS_FOOTBALL_AUDIT: docs/registry-audits/topps-football-latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/topps-isolated-sport-pipelines
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - run: npm ci
      - name: Re-run Football certification before Production access
        run: npx tsx scripts/run-topps-football-regressions.ts
      - name: Run isolated Topps Football discovery and Registry import
        run: node --import tsx scripts/run-topps-football-worker.ts
      - name: Verify Football-only receipt
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdirSync, readFileSync, existsSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          const path = process.env.TOPPS_FOOTBALL_OUTPUT;
          const audit = process.env.TOPPS_FOOTBALL_AUDIT;
          if (!path || !existsSync(path)) throw new Error(`Missing Topps Football receipt: ${path || '(unset)'}`);
          if (!audit) throw new Error('TOPPS_FOOTBALL_AUDIT is required.');
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          if (receipt.manufacturer !== 'Topps' || receipt.sport !== 'Football') {
            throw new Error('Topps Football worker crossed its manufacturer or sport boundary.');
          }
          if ((receipt.totals?.selected ?? 0) > 100) throw new Error('Topps Football worker exceeded the 100-source hourly limit.');
          for (const result of receipt.results || []) {
            if (result.manufacturer && result.manufacturer !== 'Topps') throw new Error('Receipt contains a non-Topps result.');
            if (result.sport && result.sport !== 'Football') throw new Error('Receipt contains a non-Football result.');
          }
          mkdirSync(dirname(audit), { recursive: true });
          copyFileSync(path, audit);
          const t = receipt.totals || {};
          const lines = [
            '# Topps Football Registry Worker',
            '',
            `**Production Football sources:** ${receipt.productionSourceCount ?? 0}`,
            `**Selected this hour:** ${t.selected ?? 0}`,
            `**Imported:** ${t.imported ?? 0}`,
            `**Quarantined:** ${t.quarantined ?? 0}`,
            `**Failed:** ${t.failed ?? 0}`,
            `**Sets:** ${t.sets ?? 0}`,
            `**Cards:** ${t.cards ?? 0}`,
            `**Parallels:** ${t.parallels ?? 0}`,
            `**Identities:** ${t.identities ?? 0}`,
          ];
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`, { flag: 'a' });
          NODE
      - name: Persist sanitized Football audit
        if: always()
        run: |
          if [ ! -f "$TOPPS_FOOTBALL_AUDIT" ]; then
            echo "No verified Football audit was produced."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TOPPS_FOOTBALL_AUDIT"
          if git diff --cached --quiet; then
            echo "Football audit is unchanged."
          else
            git commit -m "audit: update Topps Football registry receipt"
            git push origin HEAD:agent/topps-isolated-sport-pipelines
          fi
      - name: Upload Football receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topps-football-registry-worker-receipt
          path: |
            .checklist-discovery/topps-football-worker-receipt.json
            docs/registry-audits/topps-football-latest.json
          if-no-files-found: error
          retention-days: 90
