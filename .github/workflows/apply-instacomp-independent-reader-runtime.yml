name: Apply InstaComp Primary Identity Failover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-instacomp-independent-reader-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-instacomp-primary-identity-failover
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Patch scanner
        run: node scripts/patch-instacomp-primary-openai-failover.mjs

      - name: Validate scanner
        run: |
          npx eslint src/app/api/instacomp/scan/route.ts src/lib/instacomp-ai-provider-failover.ts
          npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "build-only-placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "build-only-placeholder-service-role-key"
          ADMIN_PASSWORD: "build-only-placeholder-password"
          ADMIN_SESSION_SECRET: "build-only-placeholder-admin-session-secret"
          NEXT_PUBLIC_SITE_URL: "https://truelycollectables.com"
          STRIPE_SECRET_KEY: "sk_test_build_only_placeholder"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_build_only_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_build_only_placeholder"
          EBAY_CLIENT_ID: "build-only-placeholder-client-id"
          EBAY_CLIENT_SECRET: "build-only-placeholder-client-secret"
          EBAY_ENVIRONMENT: "production"
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: "dry_run"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
        run: npm run build

      - name: Commit and push validated scanner patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/app/api/instacomp/scan/route.ts; then
            echo "Scanner already patched on current main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/instacomp/scan/route.ts
          git commit -m "Add OpenAI primary fallback to InstaComp identity scan"

          # The build can update generated tracked files. They were intentionally
          # excluded from the scanner commit; discard only those post-build
          # working-tree changes so Git can safely rebase the validated commit.
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
