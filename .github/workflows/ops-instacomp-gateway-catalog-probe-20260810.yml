name: Ops InstaComp Gateway Catalog Probe 20260810

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ops-instacomp-gateway-catalog-probe-20260810.yml'
      - 'src/app/api/release/ops-oidc-presence/route.ts'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT: truely-collectables
    steps:
      - uses: actions/checkout@v4

      - name: Obtain fresh Vercel deployment OIDC credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s .env.local
          set -a
          source .env.local
          set +a
          test -n "${VERCEL_OIDC_TOKEN:-}"
          echo 'VERCEL_OIDC_PRESENT=true'

      - name: Prove direct OpenAI-compatible Gateway Sonar path
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.local
          set +a
          node - <<'NODE'
          const token=String(process.env.VERCEL_OIDC_TOKEN||'').trim();
          if(!token) throw new Error('Missing Vercel OIDC token.');
          const prompt=[
            'You are an independent sports-card market teacher for InstaComp.',
            'Search the live web for this exact raw card: 2025 Panini Prizm WNBA Hailey Van Lith #139 Cracked Ice Prizm.',
            'Return JSON only with keys sold, active, notes.',
            'For sold rows use only direct https://www.ebay.com/itm/<item-id> URLs with exact itemPrice, shippingPrice and YYYY-MM-DD soldAt. Never guess. Empty arrays are correct when exact proof is unavailable.'
          ].join('\n');
          async function main(){
            const response=await fetch('https://ai-gateway.vercel.sh/v1/chat/completions',{
              method:'POST',
              headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
              body:JSON.stringify({model:'perplexity/sonar',temperature:0,messages:[{role:'user',content:prompt}],max_tokens:1800}),
              signal:AbortSignal.timeout(90000),
            });
            const payload=await response.json().catch(()=>({}));
            const text=String(payload?.choices?.[0]?.message?.content||'').trim();
            let parsed=null; try{const s=text.indexOf('{'),e=text.lastIndexOf('}');if(s>=0&&e>=s)parsed=JSON.parse(text.slice(s,e+1));}catch{}
            const sold=Array.isArray(parsed?.sold)?parsed.sold:[];
            console.log('GATEWAY_DIRECT_SONAR_SMOKE='+JSON.stringify({http:response.status,ok:response.ok&&Boolean(text),model:payload?.model||'perplexity/sonar',textPresent:Boolean(text),returnedSoldCount:sold.length,error:response.ok?null:String(payload?.error?.message||'').slice(0,500)}));
            if(!response.ok||!text) process.exit(1);
          }
          main().catch(error=>{console.error(String(error?.message||error).slice(0,700));process.exit(1)});
          NODE

      - name: Deploy preview and prove Function OIDC presence
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(npx --yes vercel@latest deploy --yes --archive=tgz --cwd . --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')"
          test -n "$DEPLOYMENT_URL"
          echo "PREVIEW_DEPLOYMENT_CREATED=true"
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/oidc.json -w '%{http_code}' --max-time 30 "$DEPLOYMENT_URL/api/release/ops-oidc-presence" || true)"
            if [ "$code" = "200" ]; then
              node - <<'NODE'
              const p=require('/tmp/oidc.json');
              console.log('DEPLOYED_FUNCTION_OIDC='+JSON.stringify(p));
              if(!p.success||!p.vercelRuntime||!p.vercelOidcPresent) process.exit(1);
              NODE
              exit 0
            fi
            sleep 2
          done
          echo 'Preview OIDC presence endpoint did not become reachable.' >&2
          cat /tmp/oidc.json 2>/dev/null || true
          exit 1
