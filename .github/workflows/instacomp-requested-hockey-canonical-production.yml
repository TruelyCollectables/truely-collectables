name: InstaComp Requested Hockey Canonical Production

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/instacomp-requested-hockey-canonical-production.yml'
      - 'scripts/instacomp-target-checklists/canonicalize-registry-plans.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: instacomp-requested-hockey-management-production
  cancel-in-progress: true

jobs:
  apply-requested-hockey-canonical:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 240
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERIFIED_HARVEST_ROOT: /home/runner/work/_temp/requested-hockey-canonical
      VERIFIED_SOURCE_RUN_ID: '31924171342'
      REQUESTED_HOCKEY_RECEIPT: /home/runner/work/_temp/requested-hockey-canonical/requested-hockey-management-receipt.json
      REQUESTED_HOCKEY_WAVE_SIZE: '2'
      REQUESTED_HOCKEY_WAVE_DELAY_MS: '5000'
      REQUESTED_HOCKEY_TARGET_ATTEMPTS: '4'
      REQUESTED_HOCKEY_TARGET_RETRY_MS: '10000'
      CHECKLIST_MANAGEMENT_QUERY_ATTEMPTS: '5'
      CHECKLIST_REGISTRY_SET_CHUNK: '25'
      CHECKLIST_REGISTRY_CARD_CHUNK: '25'
      CHECKLIST_REGISTRY_PARALLEL_CHUNK: '25'
      CHECKLIST_REGISTRY_IDENTITY_CHUNK: '25'
      CHECKLIST_REGISTRY_UPLOAD_ATTEMPTS: '5'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve Production Supabase credentials
        run: node scripts/instacomp-target-checklists/resolve-production-supabase.mjs

      - name: Download immutable 122-catalog harvest
        uses: actions/download-artifact@v4
        with:
          name: exhaustive-hockey-wnba-31924171342
          path: /home/runner/work/_temp/requested-hockey-canonical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31924171342

      - name: Prove immutable source bundle
        run: jq -e '.targetCount == 122 and .readyCount == 90 and .validationFailedCount == 32 and .failedCount == 0' "$VERIFIED_HARVEST_ROOT/output/summary.json"

      - name: Canonicalize plans to exact Production Registry uniqueness
        run: |
          node scripts/instacomp-target-checklists/canonicalize-registry-plans.mjs
          jq -e '.targetCount == 83 and .changedCount == 23 and .parallelRowsRemoved == 414 and .identityRowsRemoved == 1300' "$VERIFIED_HARVEST_ROOT/output/registry-plan-canonicalization-receipt.json"

      - name: Compact staged BEGIN payload and harden target retry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          writer = Path('scripts/instacomp-target-checklists/management-staged-registry-writer.mjs')
          text = writer.read_text()
          old = '${jsonSql(plan, "plan")}'
          new = '${jsonSql({ schema: plan.schema, adapterId: plan.adapterId, adapterVersion: plan.adapterVersion, source: plan.source, release: plan.release, validation: { status: plan.validation.status, counts: plan.validation.counts } }, "plan")}'
          if old not in text:
              raise SystemExit('Expected full-plan BEGIN payload was not found')
          writer.write_text(text.replace(old, new, 1))

          apply = Path('scripts/instacomp-target-checklists/apply-requested-hockey-management.mjs')
          text = apply.read_text()
          old = r'/timeout|timed out|too many connections|connection terminated|connection reset|connection refused|could not query the database|fetch failed|network|aborted|temporar/i'
          new = r'/timeout|timed out|too many connections|connection terminated|connection reset|connection refused|could not query the database|web server is down|ssl handshake|\\b52[125]\\b|\\b544\\b|fetch failed|network|aborted|temporar/i'
          if old not in text:
              raise SystemExit('Expected target retry regex was not found')
          apply.write_text(text.replace(old, new, 1))
          PY
          grep -F 'validation: { status: plan.validation.status, counts: plan.validation.counts }' scripts/instacomp-target-checklists/management-staged-registry-writer.mjs

      - name: Apply only missing validated Hockey through canonical management SQL
        run: node --import tsx scripts/instacomp-target-checklists/apply-requested-hockey-management.mjs

      - name: Prove validated Hockey residual is zero
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REQUESTED_HOCKEY_RECEIPT"
          jq '{updatedAt,transport,requestedHockeyReadyCount,wave,alreadyLiveCount,missingCount,persistedCount,failedCount,persistedCards,persistedIdentities}' "$REQUESTED_HOCKEY_RECEIPT"
          jq -e '.requestedHockeyReadyCount == 83 and .failedCount == 0 and (.alreadyLiveCount + .persistedCount) == 83' "$REQUESTED_HOCKEY_RECEIPT"

      - name: Upload canonical management receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-requested-hockey-canonical-${{ github.run_id }}
          path: |
            /home/runner/work/_temp/requested-hockey-canonical/requested-hockey-management-receipt.json
            /home/runner/work/_temp/requested-hockey-canonical/output/registry-plan-canonicalization-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup protected files
        if: always()
        run: rm -rf "$RUNNER_TEMP/requested-hockey-canonical" .env.local .env.production.local .vercel
