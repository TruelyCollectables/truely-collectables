name: Diagnose Gallery Data 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-gallery-data-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-data:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/diagnose-gallery-render-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/gallery-data"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/gallery-data/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Inspect normalized image sets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const envPath = path.join(process.env.RUNNER_TEMP, 'gallery-data', 'production.env');
          const text = fs.readFileSync(envPath, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          const url = parsed.NEXT_PUBLIC_SUPABASE_URL;
          if (!url) throw new Error('Production Supabase URL missing.');
          const projectRef = new URL(url).hostname.split('.')[0];
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}` } },
          );
          const body = await response.text();
          if (!response.ok) throw new Error(`Key retrieval failed: HTTP ${response.status}: ${body.slice(0, 500)}`);
          const keys = JSON.parse(body);
          const elevated = keys.find((entry) => typeof entry?.api_key === 'string' && entry.api_key.startsWith('sb_secret_'))
            || keys.find((entry) => typeof entry?.api_key === 'string' && String(entry?.name || '').toLowerCase().includes('service'));
          if (!elevated?.api_key) throw new Error('No elevated key returned.');
          console.log('::add-mask::' + elevated.api_key);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'gallery-data', 'service-key'), elevated.api_key, { mode: 0o600 });
          NODE

          service_key="$(cat "$RUNNER_TEMP/gallery-data/service-key")"
          echo "::add-mask::$service_key"
          SUPABASE_SERVICE_ROLE_KEY="$service_key" \
            node --env-file="$RUNNER_TEMP/gallery-data/production.env" --import tsx --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';
          import {
            listingImageIdentity,
            normalizeListingImageUrls,
            selectFrontBackListingImages,
          } from './src/lib/listing-image-utils.ts';
          import { getActiveStoreId } from './src/lib/stores.ts';

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { autoRefreshToken: false, persistSession: false } },
          );
          const storeId = getActiveStoreId();
          for (const productId of [2135, 2080, 2052, 2411, 2122]) {
            const { data: product, error: productError } = await supabase
              .from('products')
              .select('id,title,image_url,ebay_item_id')
              .eq('store_id', storeId)
              .eq('id', productId)
              .single();
            if (productError) throw productError;
            const { data: item, error: itemError } = await supabase
              .from('inventory_items')
              .select('id,legacy_product_id')
              .eq('store_id', storeId)
              .eq('legacy_product_id', productId)
              .order('updated_at', { ascending: false })
              .limit(1)
              .single();
            if (itemError) throw itemError;
            const { data: images, error: imagesError } = await supabase
              .from('inventory_images')
              .select('image_url,sort_order,is_primary,alt_text')
              .eq('inventory_item_id', item.id)
              .order('sort_order', { ascending: true });
            if (imagesError) throw imagesError;
            const raw = [product.image_url, ...(images || []).map((row) => row.image_url)];
            console.log(JSON.stringify({
              productId,
              title: product.title,
              ebayItemId: product.ebay_item_id,
              productImage: product.image_url,
              inventoryItemId: item.id,
              rows: images,
              identities: raw.map((value) => ({ value, identity: listingImageIdentity(value) })),
              normalized: normalizeListingImageUrls(raw),
              frontBack: selectFrontBackListingImages(raw),
            }, null, 2));
          }
          NODE

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/gallery-data"
