name: Deal Hunter PGRST retry test

on:
  push:
    branches:
      - agent/deal-hunter-pgrst-retry

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install InstaComp dependencies
        working-directory: services/instacomp-ai
        run: python -m pip install -r requirements.txt
      - name: Compile guarded Deal Hunter learning path
        working-directory: services/instacomp-ai
        run: |
          python -m py_compile \
            scripts/sync_all_inventory_training_truth_snapshot_only.py \
            scripts/sync_all_inventory_training_truth_v3.py \
            scripts/train_lora_full_inventory.py \
            scripts/finish_deal_hunter_ai_learning.py \
            tests/test_inventory_learning_completion.py \
            tests/test_supabase_read_retry.py
      - name: Run snapshot and completion regression tests
        working-directory: services/instacomp-ai
        run: python tests/test_inventory_learning_completion.py -v
      - name: Run exact Supabase PGRST retry regression tests
        working-directory: services/instacomp-ai
        run: python tests/test_supabase_read_retry.py -v
