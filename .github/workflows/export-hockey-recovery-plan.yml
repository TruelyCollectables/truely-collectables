name: Export Hockey Recovery Plan

on:
  push:
    branches: [main]
    paths:
      - '.github/hockey-recovery-export-trigger'
      - 'scripts/export-hockey-recovery-plan.ts'
      - '.github/workflows/export-hockey-recovery-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Parse 2022-23 Ice with repaired serial normalization
        env:
          HOCKEY_RECOVERY_URL: https://upperdeck.com/checklist/2022-23-ice-checklist/
          HOCKEY_RECOVERY_OUTPUT: .hockey-recovery/ice-2022-23-plan.json
        run: npx tsx scripts/export-hockey-recovery-plan.ts
      - name: Publish normalized recovery plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C ops/hockey-recovery-plan
          mkdir -p data/ops/hockey-recovery
          cp .hockey-recovery/ice-2022-23-plan.json data/ops/hockey-recovery/ice-2022-23-plan.json
          git add data/ops/hockey-recovery/ice-2022-23-plan.json
          git commit -m 'ops(checklists): publish 2022-23 Ice recovery plan' || true
          git push --force origin HEAD:ops/hockey-recovery-plan
