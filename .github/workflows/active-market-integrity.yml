name: Integrity and Release Validation

on:
  pull_request:
    paths:
      - "src/lib/active-market-*.ts"
      - "src/app/api/**/route.ts"
      - "src/proxy.ts"
      - "src/app/seller/inventory/SellerActiveInventoryPricing.tsx"
      - "scripts/run-active-market-*-simulations.ts"
      - "src/lib/checkout-inventory-reservations.ts"
      - "src/lib/checkout-order-finalization.ts"
      - "src/lib/live-payment-launch*.ts"
      - "src/lib/live-payment-status-presentation.ts"
      - "src/lib/marketplace-token-crypto.ts"
      - "src/lib/post-purchase-status.ts"
      - "src/lib/legal.ts"
      - "src/app/admin/live-payment-launch/**"
      - "src/app/admin/ebay/import-runner/EbayImportRunner.tsx"
      - "src/app/product/**"
      - "src/app/success/**"
      - "src/app/account/orders/**"
      - "src/components/ClearCartOnSuccess.tsx"
      - "src/lib/ebay-front-back-image-sync.ts"
      - "src/lib/listing-image-utils.ts"
      - "src/modules/inventory/admin-engine.ts"
      - "src/modules/inventory/index.ts"
      - "src/app/layout.tsx"
      - "src/app/components/Navbar.tsx"
      - "src/app/components/CheckoutButton.tsx"
      - "src/app/components/Footer.tsx"
      - "src/app/components/PolicyShell.tsx"
      - "src/app/shop/**"
      - "src/app/cart/**"
      - "src/app/terms/page.tsx"
      - "src/app/privacy/**"
      - "src/app/shipping/**"
      - "src/app/returns/**"
      - "src/app/contact/**"
      - "src/app/sitemap.ts"
      - "scripts/run-sunday-launch-one-build.ts"
      - "scripts/run-live-payment-owner-marker-simulations.ts"
      - "scripts/run-live-payment-status-color-simulations.ts"
      - "scripts/run-ebay-import-admin-client-simulations.ts"
      - "scripts/run-checkout-webhook-idempotency-simulations.ts"
      - "scripts/run-offer-checkout-idempotency-simulations.ts"
      - "scripts/run-ebay-oauth-state-simulations.ts"
      - "scripts/run-public-trust-policy-simulations.ts"
      - "scripts/run-mobile-buyer-flow-simulations.ts"
      - "scripts/run-post-purchase-buyer-flow-simulations.ts"
      - "scripts/run-privileged-api-route-audit.mjs"
      - "scripts/run-launch-database-migration-coverage.mjs"
      - "scripts/run-launch-database-schema-definition-simulations.mjs"
      - "scripts/run-hardened-checkout-function-migration-simulations.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/active-market-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/active-market-*.ts"
      - "src/app/api/**/route.ts"
      - "src/proxy.ts"
      - "src/app/seller/inventory/SellerActiveInventoryPricing.tsx"
      - "scripts/run-active-market-*-simulations.ts"
      - "src/lib/checkout-inventory-reservations.ts"
      - "src/lib/checkout-order-finalization.ts"
      - "src/lib/live-payment-launch*.ts"
      - "src/lib/live-payment-status-presentation.ts"
      - "src/lib/marketplace-token-crypto.ts"
      - "src/lib/post-purchase-status.ts"
      - "src/lib/legal.ts"
      - "src/app/admin/live-payment-launch/**"
      - "src/app/admin/ebay/import-runner/EbayImportRunner.tsx"
      - "src/app/product/**"
      - "src/app/success/**"
      - "src/app/account/orders/**"
      - "src/components/ClearCartOnSuccess.tsx"
      - "src/lib/ebay-front-back-image-sync.ts"
      - "src/lib/listing-image-utils.ts"
      - "src/modules/inventory/admin-engine.ts"
      - "src/modules/inventory/index.ts"
      - "src/app/layout.tsx"
      - "src/app/components/Navbar.tsx"
      - "src/app/components/CheckoutButton.tsx"
      - "src/app/components/Footer.tsx"
      - "src/app/components/PolicyShell.tsx"
      - "src/app/shop/**"
      - "src/app/cart/**"
      - "src/app/terms/page.tsx"
      - "src/app/privacy/**"
      - "src/app/shipping/**"
      - "src/app/returns/**"
      - "src/app/contact/**"
      - "src/app/sitemap.ts"
      - "scripts/run-sunday-launch-one-build.ts"
      - "scripts/run-live-payment-owner-marker-simulations.ts"
      - "scripts/run-live-payment-status-color-simulations.ts"
      - "scripts/run-ebay-import-admin-client-simulations.ts"
      - "scripts/run-checkout-webhook-idempotency-simulations.ts"
      - "scripts/run-offer-checkout-idempotency-simulations.ts"
      - "scripts/run-ebay-oauth-state-simulations.ts"
      - "scripts/run-public-trust-policy-simulations.ts"
      - "scripts/run-mobile-buyer-flow-simulations.ts"
      - "scripts/run-post-purchase-buyer-flow-simulations.ts"
      - "scripts/run-privileged-api-route-audit.mjs"
      - "scripts/run-launch-database-migration-coverage.mjs"
      - "scripts/run-launch-database-schema-definition-simulations.mjs"
      - "scripts/run-hardened-checkout-function-migration-simulations.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/active-market-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-market-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Active Market integrity simulations
        run: node --import tsx scripts/run-active-market-integrity-simulations.ts

      - name: Run Active Market evidence accounting simulations
        run: node --import tsx scripts/run-active-market-accounting-simulations.ts

      - name: Run Active Market source coverage simulations
        run: node --import tsx scripts/run-active-market-source-coverage-simulations.ts

      - name: Run Active Market scan lease simulations
        run: node --import tsx scripts/run-active-market-scan-lease-simulations.ts

      - name: Run Active Market read freshness simulations
        run: node --import tsx scripts/run-active-market-read-freshness-simulations.ts

      - name: Run Active Market direct competitor proof simulations
        run: node --import tsx scripts/run-active-market-competitor-proof-simulations.ts

  launch-release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit launch database migration coverage
        id: migration_coverage_audit
        continue-on-error: true
        run: node scripts/run-launch-database-migration-coverage.mjs

      - name: Upload launch database migration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-database-migration-coverage
          path: launch-database-migration-coverage.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate launch database schema definitions
        run: node scripts/run-launch-database-schema-definition-simulations.mjs

      - name: Validate hardened checkout function migration
        run: node scripts/run-hardened-checkout-function-migration-simulations.mjs

      - name: Audit privileged API route protection
        id: privileged_api_audit
        continue-on-error: true
        run: node scripts/run-privileged-api-route-audit.mjs

      - name: Upload privileged API route audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privileged-api-route-audit
          path: privileged-api-route-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce launch database migration coverage
        if: steps.migration_coverage_audit.outcome == 'failure'
        run: exit 1

      - name: Enforce privileged API route audit
        if: steps.privileged_api_audit.outcome == 'failure'
        run: exit 1

      - name: Install dependencies
        run: npm ci

      - name: Validate eBay OAuth state security
        run: node --import tsx scripts/run-ebay-oauth-state-simulations.ts

      - name: Validate Sunday launch contract
        run: node --import tsx scripts/run-sunday-launch-one-build.ts

      - name: Validate payment owner marker
        run: node --import tsx scripts/run-live-payment-owner-marker-simulations.ts

      - name: Validate public trust policies
        run: node --import tsx scripts/run-public-trust-policy-simulations.ts

      - name: Validate mobile buyer flow
        run: node --import tsx scripts/run-mobile-buyer-flow-simulations.ts

      - name: Validate post-purchase buyer flow
        run: node --import tsx scripts/run-post-purchase-buyer-flow-simulations.ts

      - name: Validate live payment semantic colors
        run: node --import tsx scripts/run-live-payment-status-color-simulations.ts

      - name: Validate eBay admin client
        run: node --import tsx scripts/run-ebay-import-admin-client-simulations.ts

      - name: Validate checkout webhook idempotency
        run: node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts

      - name: Validate offer checkout idempotency
        run: node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
