name: Active Market Integrity

on:
  pull_request:
    paths:
      - "src/lib/active-market-*.ts"
      - "src/app/api/account/seller/inventory/**/active-market-attack/route.ts"
      - "src/app/api/account/seller/inventory/active-pricing/route.ts"
      - "src/app/seller/inventory/SellerActiveInventoryPricing.tsx"
      - "scripts/run-active-market-integrity-simulations.ts"
      - "scripts/run-active-market-accounting-simulations.ts"
      - "scripts/run-active-market-source-coverage-simulations.ts"
      - "scripts/run-active-market-scan-lease-simulations.ts"
      - "scripts/run-active-market-read-freshness-simulations.ts"
      - "scripts/run-active-market-competitor-proof-simulations.ts"
      - ".github/workflows/active-market-integrity.yml"
  push:
    branches:
      - main
      - launch/sunday-one-build
    paths:
      - "src/lib/active-market-*.ts"
      - "src/app/api/account/seller/inventory/**/active-market-attack/route.ts"
      - "src/app/api/account/seller/inventory/active-pricing/route.ts"
      - "src/app/seller/inventory/SellerActiveInventoryPricing.tsx"
      - "scripts/run-active-market-integrity-simulations.ts"
      - "scripts/run-active-market-accounting-simulations.ts"
      - "scripts/run-active-market-source-coverage-simulations.ts"
      - "scripts/run-active-market-scan-lease-simulations.ts"
      - "scripts/run-active-market-read-freshness-simulations.ts"
      - "scripts/run-active-market-competitor-proof-simulations.ts"
      - ".github/workflows/active-market-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-regressions:
    if: github.ref != 'refs/heads/launch/sunday-one-build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Active Market integrity simulations
        run: node --import tsx scripts/run-active-market-integrity-simulations.ts

      - name: Run Active Market evidence accounting simulations
        run: node --import tsx scripts/run-active-market-accounting-simulations.ts

      - name: Run Active Market source coverage simulations
        run: node --import tsx scripts/run-active-market-source-coverage-simulations.ts

      - name: Run Active Market scan lease simulations
        run: node --import tsx scripts/run-active-market-scan-lease-simulations.ts

      - name: Run Active Market read freshness simulations
        run: node --import tsx scripts/run-active-market-read-freshness-simulations.ts

      - name: Run Active Market direct competitor proof simulations
        run: node --import tsx scripts/run-active-market-competitor-proof-simulations.ts

  sunday-launch-one-build:
    if: github.ref == 'refs/heads/launch/sunday-one-build' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_BUILD_MODE: one-combined-launch-build
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare result directory
        run: mkdir -p .launch-build

      - id: install
        name: Install dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee .launch-build/install.log

      - id: contract
        name: Verify Sunday launch contract
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --import tsx scripts/run-sunday-launch-one-build.ts 2>&1 | tee .launch-build/contract.log

      - id: shipping
        name: Run shipping verification
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:shipping 2>&1 | tee .launch-build/shipping.log

      - id: lint
        name: Run lint
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .launch-build/lint.log

      - id: build
        name: Build production application once
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .launch-build/build.log

      - name: Write launch build receipt
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          SHIPPING_OUTCOME: ${{ steps.shipping.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          outcomes = {
              "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
              "launch_contract": os.environ.get("CONTRACT_OUTCOME", "unknown"),
              "shipping": os.environ.get("SHIPPING_OUTCOME", "unknown"),
              "lint": os.environ.get("LINT_OUTCOME", "unknown"),
              "production_build": os.environ.get("BUILD_OUTCOME", "unknown"),
          }
          receipt = {
              "suite": "truely-sunday-launch-one-build-v1",
              "commit": os.environ.get("COMMIT_SHA"),
              "passed": all(value == "success" for value in outcomes.values()),
              "outcomes": outcomes,
          }
          with open(".launch-build/result.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2)
              handle.write("\n")
          PY

      - name: Save launch build receipt and logs
        if: always()
        shell: bash
        run: |
          for file in .launch-build/*.log; do
            [ -f "$file" ] || continue
            tail -n 500 "$file" > "$file.tail"
            mv "$file.tail" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .launch-build
          git commit -m "Record Sunday launch build result [skip ci]" || true
          git push origin HEAD:launch/sunday-one-build

      - name: Enforce green launch build
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          SHIPPING_OUTCOME: ${{ steps.shipping.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          test "$INSTALL_OUTCOME" = success
          test "$CONTRACT_OUTCOME" = success
          test "$SHIPPING_OUTCOME" = success
          test "$LINT_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
