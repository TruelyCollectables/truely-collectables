name: Active Market Integrity

on:
  pull_request:
    paths:
      - "src/lib/active-market-*.ts"
      - "src/app/api/account/seller/inventory/**/active-market-attack/route.ts"
      - "src/app/api/account/seller/inventory/active-pricing/route.ts"
      - "src/app/seller/inventory/SellerActiveInventoryPricing.tsx"
      - "scripts/run-active-market-integrity-simulations.ts"
      - "scripts/run-active-market-accounting-simulations.ts"
      - "scripts/run-active-market-source-coverage-simulations.ts"
      - "scripts/run-active-market-scan-lease-simulations.ts"
      - "scripts/run-active-market-read-freshness-simulations.ts"
      - "scripts/run-active-market-competitor-proof-simulations.ts"
      - ".github/workflows/active-market-integrity.yml"
  push:
    branches:
      - main
      - launch/sunday-one-build
    paths:
      - "src/lib/active-market-*.ts"
      - "src/app/api/account/seller/inventory/**/active-market-attack/route.ts"
      - "src/app/api/account/seller/inventory/active-pricing/route.ts"
      - "src/app/seller/inventory/SellerActiveInventoryPricing.tsx"
      - "scripts/run-active-market-integrity-simulations.ts"
      - "scripts/run-active-market-accounting-simulations.ts"
      - "scripts/run-active-market-source-coverage-simulations.ts"
      - "scripts/run-active-market-scan-lease-simulations.ts"
      - "scripts/run-active-market-read-freshness-simulations.ts"
      - "scripts/run-active-market-competitor-proof-simulations.ts"
      - "src/modules/inventory/admin-engine.ts"
      - "src/modules/inventory/index.ts"
      - "src/app/api/ebay/import-listings/route.ts"
      - "src/app/admin/ebay/import-runner/EbayImportRunner.tsx"
      - "scripts/run-ebay-import-admin-client-simulations.ts"
      - ".github/workflows/active-market-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-regressions:
    if: github.ref != 'refs/heads/launch/sunday-one-build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Active Market integrity simulations
        run: node --import tsx scripts/run-active-market-integrity-simulations.ts

      - name: Run Active Market evidence accounting simulations
        run: node --import tsx scripts/run-active-market-accounting-simulations.ts

      - name: Run Active Market source coverage simulations
        run: node --import tsx scripts/run-active-market-source-coverage-simulations.ts

      - name: Run Active Market scan lease simulations
        run: node --import tsx scripts/run-active-market-scan-lease-simulations.ts

      - name: Run Active Market read freshness simulations
        run: node --import tsx scripts/run-active-market-read-freshness-simulations.ts

      - name: Run Active Market direct competitor proof simulations
        run: node --import tsx scripts/run-active-market-competitor-proof-simulations.ts

  ebay-import-safety:
    if: github.ref == 'refs/heads/launch/sunday-one-build' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: install
        name: Install dependencies
        continue-on-error: true
        run: npm ci

      - id: regression
        name: Run eBay import admin-client simulations
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node --import tsx scripts/run-ebay-import-admin-client-simulations.ts

      - id: lint
        name: Run lint
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - id: build
        name: Build production application
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Save validation receipt
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          mkdir -p .ebay-import-validation
          python - <<'PY'
          import json, os
          outcomes = {
              "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
              "regression": os.environ.get("REGRESSION_OUTCOME", "unknown"),
              "lint": os.environ.get("LINT_OUTCOME", "unknown"),
              "production_build": os.environ.get("BUILD_OUTCOME", "unknown"),
          }
          receipt = {
              "suite": "ebay-import-admin-client-fix-v1",
              "source_commit": os.environ.get("SOURCE_COMMIT"),
              "passed": all(value == "success" for value in outcomes.values()),
              "outcomes": outcomes,
          }
          with open(".ebay-import-validation/result.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2)
              handle.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ebay-import-validation/result.json
          git commit -m "Record eBay import validation [skip ci]" || true
          git push origin HEAD:launch/sunday-one-build

      - name: Enforce green validation
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          test "$INSTALL_OUTCOME" = success
          test "$REGRESSION_OUTCOME" = success
          test "$LINT_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
