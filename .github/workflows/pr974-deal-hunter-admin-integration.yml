name: PR 974 Deal Hunter Admin Integration

on:
  push:
    branches:
      - agent/instacomp-fast-overnight-audit

permissions:
  contents: write

concurrency:
  group: pr974-deal-hunter-admin-integration
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-fast-overnight-audit
          fetch-depth: 0

      - name: Integrate Deal Hunter with admin command center and smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          smoke_path = Path('scripts/smoke-admin-runtime.mjs')
          smoke = smoke_path.read_text()
          deal_route = '    path: "/admin/market-intel/deal-hunter",'
          if deal_route not in smoke:
              marker = '''  {
            path: "/admin/market-intel/deals",
            auth: true,
            expectedText: "Shark List™ Deal Engine",
          },
          '''
              replacement = marker + '''  {
            path: "/admin/market-intel/deal-hunter",
            auth: true,
            expectedText: "InstaComp AI Deal Hunter",
          },
          '''
              marker = marker.replace('          ', '')
              replacement = replacement.replace('          ', '')
              if marker not in smoke:
                  raise SystemExit('Could not locate market-intel deals smoke route')
              smoke = smoke.replace(marker, replacement, 1)
          smoke_path.write_text(smoke)

          dashboard_path = Path('src/app/admin/LegacyAdminDashboard.tsx')
          dashboard = dashboard_path.read_text()
          deal_link = '{ href: "/admin/market-intel/deal-hunter", label: "Deal Hunter AI" }'
          if deal_link not in dashboard:
              marker = '        { href: "/admin/market-intel/deals", label: "Deal Engine" },\n'
              if marker not in dashboard:
                  raise SystemExit('Could not locate Deal Engine command link')
              dashboard = dashboard.replace(marker, marker + f'        {deal_link},\n', 1)
          dashboard_path.write_text(dashboard)

          page_path = Path('src/app/admin/page.tsx')
          page = page_path.read_text()
          route_line = '  "/admin/market-intel/deal-hunter"\n'
          if route_line not in page:
              marker = '  "/admin/market-intel/deals"\n'
              if marker not in page:
                  raise SystemExit('Could not locate Deal Engine static route contract')
              page = page.replace(marker, marker + route_line, 1)
          page_path.write_text(page)
          PY

      - name: Persist integration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-admin-runtime.mjs src/app/admin/LegacyAdminDashboard.tsx src/app/admin/page.tsx
          git rm .github/workflows/pr974-deal-hunter-admin-integration.yml
          git commit -m 'Integrate Deal Hunter with admin command center'
          git push origin HEAD:agent/instacomp-fast-overnight-audit
