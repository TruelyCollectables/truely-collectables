name: Topps Baseball Catalog Accelerator
run-name: Topps Baseball Catalog Accelerator — VERIFIED — ${{ github.event_name }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/topps-baseball-catalog-accelerator.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: topps-baseball-catalog-accelerator
  cancel-in-progress: false

jobs:
  discover-and-apply:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOPPS_BASEBALL_MAX_PRODUCTS: "500"
      TOPPS_BASEBALL_DISCOVERY_OUTPUT: .checklist-discovery/topps-baseball-accelerator-discovery.json
      TOPPS_BASEBALL_BULK_APPLY: "true"
      TOPPS_BASEBALL_BULK_MAX_SOURCES: "500"
      TOPPS_BASEBALL_BULK_STATUSES: "discovered,validated,quarantined,failed"
      TOPPS_BASEBALL_BULK_OUTPUT: .checklist-discovery/topps-baseball-accelerator-import.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - run: npm ci
      - name: Discover official Topps and Bowman baseball checklists
        run: node --import tsx scripts/discover-topps-baseball-checklists.ts
      - name: Apply all clean Topps and Bowman checklists to the Registry
        run: node --import tsx scripts/bulk-import-topps-baseball-checklists.ts
      - name: Verify receipt and audit Production database
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, writeFileSync } from 'node:fs';
          import { createClient } from '@supabase/supabase-js';

          const receiptPath = process.env.TOPPS_BASEBALL_BULK_OUTPUT;
          if (!receiptPath || !existsSync(receiptPath)) {
            throw new Error(`Topps import receipt is missing: ${receiptPath || '(unset)'}`);
          }

          const receipt = JSON.parse(readFileSync(receiptPath, 'utf8'));
          if (receipt.mode !== 'apply') {
            throw new Error(`Topps importer did not run in apply mode. Actual mode: ${receipt.mode}`);
          }
          if (!receipt.totals || typeof receipt.totals !== 'object') {
            throw new Error('Topps import receipt has no totals object.');
          }

          const db = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } },
          );
          const { data, error } = await db
            .from('checklist_source_catalog')
            .select('status')
            .eq('manufacturer', 'Topps')
            .eq('sport', 'Baseball')
            .limit(5000);
          if (error) throw new Error(`Production audit failed: ${error.message}`);

          const statusCounts = {};
          for (const row of data || []) statusCounts[row.status || 'unknown'] = (statusCounts[row.status || 'unknown'] || 0) + 1;
          const catalogTotal = (data || []).length;
          if (catalogTotal === 0) throw new Error('Production audit found zero Topps Baseball catalog sources.');

          const t = receipt.totals;
          const audit = {
            verifiedAt: new Date().toISOString(),
            mode: receipt.mode,
            receiptTotals: t,
            productionCatalogTotal: catalogTotal,
            productionStatusCounts: statusCounts,
          };
          writeFileSync('.checklist-discovery/topps-baseball-production-audit.json', `${JSON.stringify(audit, null, 2)}\n`);

          const lines = [
            '# Topps Baseball Production Audit',
            '',
            `**Apply mode:** ${receipt.mode === 'apply' ? 'YES' : 'NO'}`,
            `**Sources selected this run:** ${t.selected ?? 0}`,
            `**Sources imported this run:** ${t.imported ?? 0}`,
            `**Cards imported this run:** ${t.cards ?? 0}`,
            `**Sets imported this run:** ${t.sets ?? 0}`,
            `**Parallels imported this run:** ${t.parallels ?? 0}`,
            `**Identities imported this run:** ${t.identities ?? 0}`,
            `**Quarantined this run:** ${t.quarantined ?? 0}`,
            `**Failed this run:** ${t.failed ?? 0}`,
            '',
            `**Production Topps Baseball sources:** ${catalogTotal}`,
            '',
            '## Production source statuses',
            ...Object.entries(statusCounts).sort().map(([status, count]) => `- ${status}: ${count}`),
          ];
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`, { flag: 'a' });
          console.log(JSON.stringify(audit, null, 2));
          NODE
      - name: Publish latest verified audit to repository
        run: |
          mkdir -p docs/registry-audits
          cp .checklist-discovery/topps-baseball-production-audit.json docs/registry-audits/topps-baseball-latest.json
          cp .checklist-discovery/topps-baseball-accelerator-import.json docs/registry-audits/topps-baseball-latest-import-receipt.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry-audits/topps-baseball-latest.json docs/registry-audits/topps-baseball-latest-import-receipt.json
          if git diff --cached --quiet; then
            echo "Verified Topps audit is unchanged."
          else
            git commit -m "Update verified Topps baseball registry audit [skip ci]"
            git push
          fi
      - name: Upload accelerator receipts and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topps-baseball-catalog-accelerator-receipts
          path: .checklist-discovery/*.json
          if-no-files-found: error
          retention-days: 90
