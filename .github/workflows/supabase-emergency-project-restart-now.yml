name: Supabase Emergency Storefront Performance Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-emergency-project-restart-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rfdzsoykhnngzdnvzlhz
    steps:
      - name: Add storefront query indexes and refresh planner stats
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            node -e 'process.stdout.write(JSON.stringify({query:process.argv[1],read_only:false}))' "$1" >/tmp/q.json
            code=$(curl -sS --max-time 90 -o /tmp/q.out -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' "$api" --data-binary @/tmp/q.json || true)
            echo "database_query_http=$code"
            if [ "$code" != "201" ]; then cat /tmp/q.out || true; exit 10; fi
          }
          run_sql 'create index if not exists idx_inventory_items_store_legacy_created on public.inventory_items (store_id, legacy_product_id, created_at);'
          run_sql 'create index if not exists idx_inventory_images_item_sort on public.inventory_images (inventory_item_id, sort_order);'
          run_sql 'create index if not exists idx_products_store_public_active_id on public.products (store_id, id) where price > 0 and quantity > 0 and image_url is not null and archived_at is null;'
          run_sql 'analyze public.inventory_items; analyze public.inventory_images; analyze public.products;'
          echo 'Storefront indexes ready.'

      - name: Diagnose Cloudflare product query layers
        shell: bash
        run: |
          set -euo pipefail
          url='https://truely-collectables-preview.truelycollectables.workers.dev/api/internal/cloudflare-product-runtime-probe'
          code=$(curl -sS --max-time 60 -o /tmp/probe.json -w '%{http_code}' "$url" || true)
          echo "runtime_probe_http=$code"
          cat /tmp/probe.json || true
          echo
          node <<'NODE'
          const fs=require('node:fs'); const b=JSON.parse(fs.readFileSync('/tmp/probe.json','utf8'));
          for(const r of b.results||[]) console.log(`${r.name}: ok=${r.ok} elapsedMs=${r.elapsedMs} status=${r.status??'-'} timedOut=${r.timedOut??false} detail=${r.detail??'-'}`);
          if(!b.ok) process.exit(20);
          NODE

      - name: Verify storefront response times
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'https://truelycollectables.com/product/1991|vercel-live' \
            'https://truely-collectables-preview.truelycollectables.workers.dev/product/1991|cloudflare-preview' \
            'https://truely-collectables-preview.truelycollectables.workers.dev/shop|cloudflare-shop' \
            'https://truely-collectables-preview.truelycollectables.workers.dev/|cloudflare-home'; do
            url=${spec%%|*}; label=${spec##*|}
            out=$(curl -L --fail-with-body -sS --max-time 35 -D "/tmp/${label}.headers" -o /dev/null -w '%{http_code} %{time_total}' "$url")
            echo "$label -> $out"
          done
          grep -qi '^x-truely-origin: cloudflare-worker' /tmp/cloudflare-preview.headers
          echo 'Storefront performance verified.'

      - name: Cleanup
        if: always()
        run: rm -f /tmp/q.json /tmp/q.out /tmp/probe.json /tmp/*.headers
