name: Checklist Full Corpus Recovery 4944 20260811

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checklist-full-corpus-recovery-4944-20260811.yml'
      - 'scripts/ingest-master-checklist-archive.mjs'
      - 'scripts/checklist-catalog-retry-prepatch.mjs'
      - 'scripts/mainstream-checklist/global-fetch-timeout-prepatch.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: checklist-full-corpus-recovery-4944-20260811
  cancel-in-progress: true

jobs:
  apply:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [14]
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 360
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MASTER_CHECKLIST_APPLY: 'true'
      MASTER_CHECKLIST_BATCH_INDEX: ${{ matrix.batch }}
      MASTER_CHECKLIST_BATCH_COUNT: '16'
      MASTER_CHECKLIST_WORKERS: '6'
      MASTER_CHECKLIST_SKIP_CATALOG_WRITES: 'true'
      MASTER_CHECKLIST_CORPUS_ROOT: .master-checklist-corpus
      MASTER_CHECKLIST_EXTRACTED_ROOT: .master-checklist-extracted
      MASTER_CHECKLIST_OUTPUT: evidence/checklist-full-corpus-4944/batch-${{ matrix.batch }}-receipt.json
      MASTER_CHECKLIST_CATALOG_RETRY_ATTEMPTS: '10'
      MASTER_CHECKLIST_CATALOG_RETRY_BASE_MS: '750'
      MASTER_CHECKLIST_FETCH_TIMEOUT_MS: '60000'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Prove operations-only delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          base="$(git merge-base HEAD origin/main)"
          bad="$(git diff --name-only "$base"...HEAD | grep -Ev '^(\.github/workflows/checklist-full-corpus-recovery-4944-20260811\.yml|scripts/checklist-catalog-retry-prepatch\.mjs|scripts/ingest-master-checklist-archive\.mjs|scripts/mainstream-checklist/global-fetch-timeout-prepatch\.mjs)$' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install parser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          npm ci
      - name: Test recovery guards before Production
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/mainstream-checklist/global-fetch-timeout-prepatch.mjs
          node --check scripts/checklist-catalog-retry-prepatch.mjs
          node --check scripts/ingest-master-checklist-archive.mjs
          grep -q 'AbortSignal.timeout(DEFAULT_TIMEOUT_MS)' scripts/mainstream-checklist/global-fetch-timeout-prepatch.mjs
          grep -q 'catalog-deferred' scripts/checklist-catalog-retry-prepatch.mjs
          grep -q 'safeCatalogUpsert' scripts/ingest-master-checklist-archive.mjs
          grep -q 'persistPlanSerial' scripts/ingest-master-checklist-archive.mjs
          grep -q 'registryWriter=serialized' scripts/ingest-master-checklist-archive.mjs
          grep -q '\[progress\]' scripts/ingest-master-checklist-archive.mjs
          ! grep -q 'await ensureArchiveBucket' scripts/ingest-master-checklist-archive.mjs
      - name: Download immutable sanitized full corpus
        uses: actions/download-artifact@v4
        with:
          name: master-checklist-sanitized-safe-v4-final-31200568510
          path: .master-checklist-sanitized-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '31200568510'
      - name: Verify and extract all 5,098 canonical import releases
        shell: bash
        run: |
          set -euo pipefail
          cd .master-checklist-sanitized-bundle
          sha256sum -c master-checklist-sanitized-safe-v4-final.sha256
          tar -xzf master-checklist-sanitized-safe-v4-final.tar.gz -C ..
          cd ..
          jq -e '.ok == true and .canonicalImportSets == 5098 and .runnableCandidates == 5782 and .uniqueRunnableSourceUrls == 5782 and .crossCanonicalDirectShaCollisions == 0 and .duplicateEvidenceReferencesRemaining == 0' .checklist-discovery/sanitized-master-corpus-proof-v4.json >/dev/null
          test -s ".master-checklist-corpus/batch-${{ matrix.batch }}.json"
      - name: Resolve Production Supabase through Management DB
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checklist-full-corpus-${{ matrix.batch }}"
          mkdir -p "$root"
          projects="$root/projects.json"

          for n in 1 2 3 4 5; do
            if curl --silent --show-error --fail --max-time 45 \
              --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
              --output "$projects" \
              "https://api.supabase.com/v1/projects"; then
              break
            fi
            test "$n" -lt 5 || exit 1
            sleep $((n * 3))
          done
          jq -e 'type == "array" and length > 0' "$projects" >/dev/null

          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$projects")
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one Truely Collectables Supabase project by Management API name; found ${#candidates[@]}." >&2
            jq '[.[] | {id:(.id // .ref),name,status,region}]' "$projects" >&2
            exit 1
          fi
          project_ref="${candidates[0]}"

          proof="$root/registry-proof.json"
          proof_body="$root/registry-proof-body.json"
          jq -nc --arg query "select exists(select 1 from information_schema.tables where table_schema='public' and table_name='checklist_source_catalog') as has_catalog, exists(select 1 from storage.buckets where id='tcos-checklist-source-files') as has_source_bucket;" '{query:$query,parameters:[],read_only:true}' > "$proof_body"
          for n in 1 2 3 4 5; do
            code="$(curl --silent --show-error --max-time 60 \
              --output "$proof" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$proof_body" \
              "https://api.supabase.com/v1/projects/$project_ref/database/query" || true)"
            if { [ "$code" = "200" ] || [ "$code" = "201" ]; } && jq -e 'type == "array" and length == 1 and .[0].has_catalog == true and .[0].has_source_bucket == true' "$proof" >/dev/null 2>&1; then
              break
            fi
            echo "Management DB registry proof attempt=$n http=$code" >&2
            test "$n" -lt 5 || { cat "$proof" >&2 || true; exit 1; }
            sleep $((n * 3))
          done

          keys="$root/api-keys.json"
          for n in 1 2 3 4 5; do
            if curl --silent --show-error --fail --max-time 45 \
              --header "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
              --output "$keys" \
              "https://api.supabase.com/v1/projects/$project_ref/api-keys?reveal=true"; then
              break
            fi
            test "$n" -lt 5 || exit 1
            sleep $((n * 3))
          done
          service_key="$(jq -r 'map(select((((.name // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role") or (((.id // "") | ascii_downcase | gsub("[^a-z0-9]+"; "_")) == "service_role"))) | .[0].api_key // empty' "$keys")"
          test -n "$service_key"
          echo "::add-mask::$service_key"

          project_url="https://$project_ref.supabase.co"
          production_env="$root/production.env"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$project_url" > "$production_env"
          chmod 600 "$production_env"
          echo "PRODUCTION_ENV_PATH=$production_env" >> "$GITHUB_ENV"
          echo "RESOLVED_SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
          echo "RESOLVED_SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"
          echo "Production Supabase resolved and Registry schema/source bucket verified through Management DB."
      - name: Process every release in this sanitized batch
        shell: bash
        run: |
          set -euo pipefail; set -a; source "$PRODUCTION_ENV_PATH"; set +a; export SUPABASE_SERVICE_ROLE_KEY="$RESOLVED_SUPABASE_SERVICE_ROLE_KEY"; mkdir -p "$(dirname "$MASTER_CHECKLIST_OUTPUT")"
          node --import ./scripts/mainstream-checklist/global-fetch-timeout-prepatch.mjs --import ./scripts/checklist-catalog-retry-prepatch.mjs --import ./scripts/mainstream-checklist/html-semantic-prepatch.mjs --import ./scripts/mainstream-checklist/tcdb-complete-fetch.mjs --import ./scripts/mainstream-checklist/reader-retry-prepatch.mjs --import ./scripts/mainstream-checklist/remaining-source-fallbacks.mjs --import ./scripts/mainstream-checklist/prefer-complete-reader.mjs --import ./scripts/mainstream-checklist/fetch-patch.mjs --import tsx scripts/ingest-master-checklist-archive.mjs
      - name: Print batch result and keep quarantines visible
        if: always()
        shell: bash
        run: |
          set -euo pipefail; test -s "$MASTER_CHECKLIST_OUTPUT"; jq 'if (.results|type)=="array" then {batch,statuses,normalizedTotals,catalog,results:[.results[]|{exactSetKey,status,counts,failures,catalog}]} else . end' "$MASTER_CHECKLIST_OUTPUT"
      - name: Upload full batch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-full-corpus-4944-batch-${{ matrix.batch }}
          path: evidence/checklist-full-corpus-4944/batch-${{ matrix.batch }}-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup protected files
        if: always()
        run: rm -rf "$RUNNER_TEMP/checklist-full-corpus-${{ matrix.batch }}" .env.local .env.production.local .vercel
