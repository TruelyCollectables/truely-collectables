          git apply --whitespace=error-all /tmp/audit-repair.patch
          node --check scripts/run-truely-launch-audit-20260729.mjs
          test "$(sha256sum scripts/run-truely-launch-audit-20260729.mjs | awk '{print $1}')" = "594c8aff5369e638dbedeeb94b6f40565b82491556be2c2e492b8d4069f60554"
          test "$(git diff --name-only | tr -d '\r')" = "scripts/run-truely-launch-audit-20260729.mjs"
