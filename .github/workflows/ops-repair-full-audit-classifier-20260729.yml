name: Repair Full Launch Audit Runtime Environment 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-repair-full-audit-classifier-20260729.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-full-launch-audit-runtime-20260729
  cancel-in-progress: false

jobs:
  repair-audit-branch:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/repair-full-audit-classifier-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@v4
        with:
          ref: ops/truely-full-launch-audit-20260729
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard and apply exact audit repair
        shell: bash
        run: |
