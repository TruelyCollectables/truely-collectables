name: Repair Full Launch Audit Runtime Environment 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-repair-full-audit-classifier-20260729.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-full-launch-audit-runtime-20260729
  cancel-in-progress: false

jobs:
  repair-audit-branch:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/repair-full-audit-classifier-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@v4
        with:
          ref: ops/truely-full-launch-audit-20260729
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard and repair Production environment loading
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "db4432ccea5e1b32520e2d254bdb85bb33b8137b"
          test "$(sha256sum scripts/run-truely-launch-audit-20260729.mjs | awk '{print $1}')" = "7ed1f30fd3068dbfded37551309d57deda7f9d1f237714ff026587991fd8cced"
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-truely-launch-audit-20260729.mjs")
          source = path.read_text()
          replacements = [
              (
                  'import { execFileSync, spawnSync } from "node:child_process";\n',
                  'import { execFileSync, spawnSync } from "node:child_process";\nimport { parseEnv } from "node:util";\n',
              ),
              (
                  '''    for (const match of text.matchAll(/\\.from\\(\\s*["'`]([^"'`]+)["'`]\\s*\\)/g)) tableNames.add(match[1]);''',
                  '''    for (const match of text.matchAll(/\\.from\\(\\s*["'`]([^"'`]+)["'`]\\s*\\)/g)) {\n      if (/^[a-z][a-z0-9_]*$/.test(match[1])) tableNames.add(match[1]);\n    }''',
              ),
              (
                  '''async function runtimeAudit() {\n  const findings = [];''',
                  '''function loadProductionAuditEnvironment() {\n  const envFile = path.join(ROOT, ".audit-production.env");\n  if (!fs.existsSync(envFile)) return;\n  Object.assign(process.env, parseEnv(fs.readFileSync(envFile, "utf8")));\n}\n\nasync function runtimeAudit() {\n  loadProductionAuditEnvironment();\n  const findings = [];''',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit("Runtime audit repair anchor mismatch")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          node --check scripts/run-truely-launch-audit-20260729.mjs
          test "$(git diff --name-only | tr -d '\r')" = "scripts/run-truely-launch-audit-20260729.mjs"
          git diff --check
          grep -Fq 'Object.assign(process.env, parseEnv' scripts/run-truely-launch-audit-20260729.mjs
          grep -Fq '/^[a-z][a-z0-9_]*$/' scripts/run-truely-launch-audit-20260729.mjs

      - name: Commit exact runtime audit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "truely-launch-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/run-truely-launch-audit-20260729.mjs
          git commit -m "Load exact Production env in full runtime audit"
          git push origin HEAD:ops/truely-full-launch-audit-20260729
