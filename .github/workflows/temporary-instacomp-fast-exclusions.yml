name: Temporary InstaComp Fast Exclusions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-fast-exclusions-20260726
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply and validate complete correction
        shell: bash
        run: |
          set +e
          mkdir -p docs
          : > /tmp/instacomp-fast.log

          npm ci >> /tmp/instacomp-fast.log 2>&1
          INSTALL=$?

          if grep -q "fastLane = true" src/app/api/account/seller/inventory/instacomp-universal/route.ts; then
            echo "Fast lane already applied." >> /tmp/instacomp-fast.log
            PATCH_FAST=0
          else
            node scripts/apply-instacomp-fast-exclusions.mjs >> /tmp/instacomp-fast.log 2>&1
            PATCH_FAST=$?
          fi

          if grep -q "serpapi_ebay_v4_" src/lib/instacomp-ebay-serp-provider.ts; then
            echo "Sold-cache and deterministic-exact correction already applied." >> /tmp/instacomp-fast.log
            PATCH_EXACT=0
          else
            node scripts/apply-instacomp-sold-cache-exact-override.mjs >> /tmp/instacomp-fast.log 2>&1
            PATCH_EXACT=$?
          fi

          node --import tsx scripts/run-instacomp-fast-exclusions-regressions.ts >> /tmp/instacomp-fast.log 2>&1
          REGRESSION=$?

          npm run lint >> /tmp/instacomp-fast.log 2>&1
          LINT=$?

          npm run build >> /tmp/instacomp-fast.log 2>&1
          BUILD=$?

          {
            echo "install=$INSTALL"
            echo "patch_fast=$PATCH_FAST"
            echo "patch_exact=$PATCH_EXACT"
            echo "regression=$REGRESSION"
            echo "lint=$LINT"
            echo "build=$BUILD"
            echo "validated_source_commit=$(git rev-parse HEAD)"
            echo "--- errors and assertions ---"
            grep -nE "Error:|AssertionError|error |✖|Failed to|Missing " /tmp/instacomp-fast.log | tail -n 120 || true
            echo "--- log head ---"
            head -n 120 /tmp/instacomp-fast.log
            echo "--- log tail ---"
            tail -n 120 /tmp/instacomp-fast.log
          } > docs/instacomp-fast-validation.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate faster InstaComp, sold refresh, exact matches, and exclusions" || true
          git push origin HEAD:agent/instacomp-fast-exclusions-20260726

          test "$INSTALL" -eq 0 && \
          test "$PATCH_FAST" -eq 0 && \
          test "$PATCH_EXACT" -eq 0 && \
          test "$REGRESSION" -eq 0 && \
          test "$LINT" -eq 0 && \
          test "$BUILD" -eq 0
