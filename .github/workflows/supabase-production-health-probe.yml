name: Supabase Production Health Probe

on:
  push:
    branches:
      - feature/instacomp-target-checklists-20260816
    paths:
      - '.github/workflows/supabase-production-health-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Probe Production project and service health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o evidence/projects.json https://api.supabase.com/v1/projects
          mapfile -t refs < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' evidence/projects.json)
          test "${#refs[@]}" -eq 1
          ref="${refs[0]}"
          curl --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o evidence/project.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/$ref" > evidence/project-status.txt
          for services in 'auth&services=rest&services=storage&services=realtime' 'db&services=rest&services=storage&services=auth' 'postgres&services=rest&services=storage&services=auth'; do
            safe="$(echo "$services" | tr '&=' '__')"
            code="$(curl --silent --show-error --max-time 45 \
              -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
              -o "evidence/health-$safe.json" -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/$ref/health?services=$services&timeout_ms=15000" || true)"
            printf '%s\n' "$code" > "evidence/health-$safe.status"
          done
          echo 'PROJECT:'
          jq '{ref,name,status,region,database}' evidence/project.json || cat evidence/project.json
          echo 'HEALTH RESPONSES:'
          for f in evidence/health-*.json; do echo "--- $f"; cat "$f"; echo; done
      - name: Upload health evidence
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-health-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
