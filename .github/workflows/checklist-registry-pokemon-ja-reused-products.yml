name: Checklist Registry Pokémon Japanese Reused Products

on:
  pull_request:
    paths:
      - "scripts/quarantine-pokemon-japanese-reused-products.ts"
      - "scripts/run-pokemon-japanese-reused-product-quarantine-simulations.ts"
      - "scripts/run-pokemon-japanese-official-verification.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-reused-products.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/quarantine-pokemon-japanese-reused-products.ts"
      - "scripts/run-pokemon-japanese-reused-product-quarantine-simulations.ts"
      - "scripts/run-pokemon-japanese-official-verification.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-reused-products.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-reused-official-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint quarantine workflow
        run: >-
          npx eslint
          scripts/quarantine-pokemon-japanese-reused-products.ts
          scripts/run-pokemon-japanese-reused-product-quarantine-simulations.ts
          scripts/run-pokemon-japanese-official-verification.ts

      - name: Verify reused products cannot become hard mismatches
        run: >-
          node --import tsx
          scripts/run-pokemon-japanese-reused-product-quarantine-simulations.ts
