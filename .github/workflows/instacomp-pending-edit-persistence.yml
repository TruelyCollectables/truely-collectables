name: InstaComp Pending Edit Persistence

on:
  pull_request:
    paths:
      - "src/app/api/account/seller/instacomp-pending/update/route.ts"
      - "src/app/api/account/seller/instacomp-pending/publish/route.ts"
      - "src/lib/instacomp-pending-edit.ts"
      - "scripts/run-instacomp-pending-edit-persistence-regressions.ts"
      - ".github/workflows/instacomp-pending-edit-persistence.yml"
  push:
    paths:
      - "src/app/api/account/seller/instacomp-pending/update/route.ts"
      - "src/app/api/account/seller/instacomp-pending/publish/route.ts"
      - "src/lib/instacomp-pending-edit.ts"
      - "scripts/run-instacomp-pending-edit-persistence-regressions.ts"
      - ".github/workflows/instacomp-pending-edit-persistence.yml"

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pending edit persistence regressions
        run: node --import tsx scripts/run-instacomp-pending-edit-persistence-regressions.ts
      - name: Lint changed files
        run: >-
          npx eslint
          src/app/api/account/seller/instacomp-pending/update/route.ts
          src/app/api/account/seller/instacomp-pending/publish/route.ts
          src/lib/instacomp-pending-edit.ts
          scripts/run-instacomp-pending-edit-persistence-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build
