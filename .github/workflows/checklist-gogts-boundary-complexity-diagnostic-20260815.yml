name: Checklist GoGTS Boundary Complexity Diagnostic 20260815

on:
  push:
    branches:
      - ops/checklist-ultimate-vacuum-20260815
    paths:
      - '.github/workflows/checklist-gogts-boundary-complexity-diagnostic-20260815.yml'
      - 'scripts/mainstream-checklist/gogts-boundary-complexity-diagnostic.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check --no-cache-dir openpyxl==3.1.5 xlrd==2.0.1
          npm ci
      - name: Download preserved GoGTS archive
        uses: actions/download-artifact@v4
        with:
          name: sports-card-checklist-master-archive-31100986894
          path: ${{ runner.temp }}/archive
          repository: ${{ github.repository }}
          run-id: 31100986894
          github-token: ${{ github.token }}
      - name: Extract archive
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/archive/sports-card-checklist-master-archive.tar.gz" -C "$RUNNER_TEMP/extracted"
      - name: Download preserved status index
        uses: actions/download-artifact@v4
        with:
          name: public-checklist-status-gogts-31100986894
          path: ${{ runner.temp }}/status
          repository: ${{ github.repository }}
          run-id: 31100986894
          github-token: ${{ github.token }}
      - name: Build deterministic archive queue
        env:
          ARCHIVE_ROOT: ${{ runner.temp }}/extracted
          STATUS_ROOT: ${{ runner.temp }}/status
          QUEUE_OUT: ${{ runner.temp }}/queue.json
        run: python scripts/mainstream-checklist/build-gogts-offline-queue.py
      - name: Measure boundary parse and plan complexity
        env:
          QUEUE: ${{ runner.temp }}/queue.json
          OUT: ${{ runner.temp }}/boundary-complexity.json
          INDEXES: '258,259,260,261,262,263,264'
        run: node scripts/mainstream-checklist/gogts-boundary-complexity-diagnostic.mjs
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-gogts-boundary-complexity-${{ github.run_id }}
          path: ${{ runner.temp }}/boundary-complexity.json
          if-no-files-found: warn
          retention-days: 14
