name: Supabase Checklist Registry Schema Probe 20260815

on:
  push:
    branches:
      - agent/checklist-expansion-wnba-hockey-20260815
    paths:
      - '.github/workflows/repair-instacomp-live-route-v2.yml'

permissions:
  contents: read
  actions: read

jobs:
  registry-schema-probe:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 15
    env:
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Production project
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/registry-schema-probe"
          mkdir -p "$root"
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -o "$root/projects.json" \
            "https://api.supabase.com/v1/projects"
          mapfile -t candidates < <(jq -r '.[] | select((.name // "" | ascii_downcase | contains("truely")) or (.name // "" | ascii_downcase | contains("collect"))) | (.id // .ref // empty)' "$root/projects.json")
          test "${#candidates[@]}" -eq 1
          echo "PROJECT_REF=${candidates[0]}" >> "$GITHUB_ENV"

      - name: Read Registry function and table definitions
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/registry-schema-probe"
          cat > "$root/schema.sql" <<'SQL'
          select jsonb_build_object(
            'functions', coalesce((
              select jsonb_agg(jsonb_build_object(
                'schema', n.nspname,
                'name', p.proname,
                'identity_args', pg_get_function_identity_arguments(p.oid),
                'definition', pg_get_functiondef(p.oid)
              ) order by p.proname)
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.proname in ('tcos_apply_checklist_import_plan')
            ), '[]'::jsonb),
            'tables', coalesce((
              select jsonb_agg(t.obj order by t.table_name)
              from (
                select c.table_name,
                  jsonb_build_object(
                    'table', c.table_name,
                    'columns', jsonb_agg(jsonb_build_object(
                      'name', c.column_name,
                      'type', c.data_type,
                      'udt', c.udt_name,
                      'nullable', c.is_nullable,
                      'default', c.column_default
                    ) order by c.ordinal_position),
                    'constraints', coalesce((
                      select jsonb_agg(jsonb_build_object(
                        'name', con.conname,
                        'type', con.contype,
                        'definition', pg_get_constraintdef(con.oid, true)
                      ) order by con.conname)
                      from pg_constraint con
                      join pg_class rel on rel.oid = con.conrelid
                      join pg_namespace ns on ns.oid = rel.relnamespace
                      where ns.nspname='public' and rel.relname=c.table_name
                    ), '[]'::jsonb),
                    'indexes', coalesce((
                      select jsonb_agg(jsonb_build_object('name', indexname, 'definition', indexdef) order by indexname)
                      from pg_indexes i
                      where i.schemaname='public' and i.tablename=c.table_name
                    ), '[]'::jsonb),
                    'triggers', coalesce((
                      select jsonb_agg(jsonb_build_object(
                        'name', tg.tgname,
                        'definition', pg_get_triggerdef(tg.oid, true)
                      ) order by tg.tgname)
                      from pg_trigger tg
                      join pg_class rel on rel.oid=tg.tgrelid
                      join pg_namespace ns on ns.oid=rel.relnamespace
                      where ns.nspname='public' and rel.relname=c.table_name and not tg.tgisinternal
                    ), '[]'::jsonb)
                  ) as obj
                from information_schema.columns c
                where c.table_schema='public'
                  and c.table_name like 'checklist_%'
                group by c.table_name
              ) t
            ), '[]'::jsonb)
          ) as registry_schema;
          SQL
          jq -Rs '{query:.,read_only:true}' < "$root/schema.sql" > "$root/request.json"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            -H "Authorization: Bearer $GH_SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -o "$root/result.json" -w '%{http_code}' \
            --data-binary @"$root/request.json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" || true)"
          echo "Schema probe HTTP $code"
          test "$code" = '201'
          jq -e 'type=="array" and length==1 and .[0].registry_schema.functions|length>=1' "$root/result.json" >/dev/null
          jq '.[0].registry_schema | {functions:[.functions[]|{name,identity_args}],tables:[.tables[]|{table,column_count:(.columns|length),constraint_count:(.constraints|length),index_count:(.indexes|length),trigger_count:(.triggers|length)}]}' "$root/result.json"

      - name: Upload schema probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-registry-schema-${{ github.run_id }}
          path: ${{ runner.temp }}/registry-schema-probe
          if-no-files-found: error
          retention-days: 30
