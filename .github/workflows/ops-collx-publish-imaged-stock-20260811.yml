name: Ops CollX Publish Imaged Stock 20260811

on:
  push:
    branches: [main]
    paths:
      - "src/lib/server-inventory-engine.ts"
      - "src/modules/inventory/checkout-engine.ts"
      - "src/app/api/ops/collx-publish-imaged-stock-20260811/route.ts"
      - ".github/workflows/ops-collx-publish-imaged-stock-20260811.yml"

permissions:
  contents: write

concurrency:
  group: ops-collx-publish-imaged-stock-20260811
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROUTE_URL: https://truely-collectables.vercel.app/api/ops/collx-publish-imaged-stock-20260811
      CONFIRM: collx-publish-imaged-stock-20260811
      OUT: .github/ops/collx-sale-activation-20260811.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for safe production activation writer
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 90); do
            code="$(curl -sS -o /tmp/preflight.json -w '%{http_code}' --max-time 60 "$ROUTE_URL" || true)"
            if [ "$code" = '200' ] && python3 - <<'PY'
          import json,sys
          try:
              d=json.load(open('/tmp/preflight.json'))
              ok=(
                  d.get('success') is True
                  and d.get('operation') == 'collx-publish-imaged-stock-20260811'
                  and d.get('writer') == 'safe-id-updates-v2'
                  and 'eligibleWithAtLeastOneOwnedImageAndPrice' in d
              )
          except Exception:
              ok=False
          sys.exit(0 if ok else 1)
          PY
            then
              ready=1
              cat /tmp/preflight.json
              break
            fi
            sleep 10
          done
          test "$ready" = '1'

      - name: Publish eligible CollX inventory
        shell: bash
        run: |
          set -euo pipefail
          finished=0
          for n in $(seq 1 40); do
            code="$(curl -sS -o /tmp/activation.json -w '%{http_code}' --max-time 240 \
              -X POST \
              -H "Authorization: Bearer $CONFIRM" \
              "$ROUTE_URL?batch=300" || true)"
            cat /tmp/activation.json || true
            test "$code" = '200'
            python3 -m json.tool /tmp/activation.json >/dev/null
            python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/activation.json'))
          if d.get('success') is not True or d.get('writer') != 'safe-id-updates-v2':
              sys.exit(2)
          a=d.get('after') or {}
          done=(a.get('remainingEligible') == 0 and a.get('quarantinePending') == 0)
          sys.exit(0 if done else 1)
          PY
            status=$?
            if [ "$status" = '0' ]; then
              finished=1
              break
            elif [ "$status" != '1' ]; then
              exit "$status"
            fi
            sleep 2
          done
          test "$finished" = '1'

      - name: Record final production verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/ops
          curl -fsS --max-time 120 "$ROUTE_URL" -o /tmp/final.json
          python3 - <<'PY'
          import json,time,sys
          d=json.load(open('/tmp/final.json'))
          d['verifiedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          d['verification']='production'
          failures=[]
          if d.get('success') is not True: failures.append('route_not_successful')
          if d.get('writer') != 'safe-id-updates-v2': failures.append('stale_route_version')
          if d.get('remainingEligible') != 0: failures.append('eligible_rows_remaining')
          if d.get('quarantinePending') != 0: failures.append('quarantine_not_enforced')
          if d.get('liveCollxImageRefs') != 0: failures.append('live_collx_image_refs_remaining')
          d['verificationFailures']=failures
          open('.github/ops/collx-sale-activation-20260811.json','w').write(json.dumps(d,indent=2)+'\n')
          print(json.dumps(d,indent=2))
          sys.exit(1 if failures else 0)
          PY

      - name: Persist production receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Truely Collectables Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'Record CollX sale activation verification' || true
          git push origin HEAD:main
