name: Verify InstaComp Production Live Now

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-release:
    name: Prove evidence-first release on both aliases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live release contract
        run: node scripts/check-live-instacomp-release.mjs
