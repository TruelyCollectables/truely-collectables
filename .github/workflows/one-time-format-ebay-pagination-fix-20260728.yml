name: One-Time Format eBay Pagination Fix 20260728

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-format-ebay-pagination-fix-20260728.yml"

permissions:
  contents: write

jobs:
  format-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-ebay-local-pagination-20260728'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ebay-local-pagination-20260728
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Clean generated indentation
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/lib/ebay-authoritative-store-sync.ts')
          text = path.read_text()
          replacements = {
            '''  const locals = await readAllLocalProducts({
            supabase: params.supabase,
            storeId: params.storeId,
          });''': '''  const locals = await readAllLocalProducts({
            supabase: params.supabase,
            storeId: params.storeId,
          });''',
            '''        error: syncErrorMessage(
                  error,
                  "Could not refresh sync timestamps.",
                ),''': '''        error: syncErrorMessage(
                  error,
                  "Could not refresh sync timestamps.",
                ),''',
            '''          const changed = await deactivateLocalProduct({ ...params, local });
                  if (changed) deactivated += 1;''': '''          const changed = await deactivateLocalProduct({ ...params, local });
                  if (changed) deactivated += 1;''',
            '''            error: syncErrorMessage(
                      error,
                      "Unknown deactivate failure.",
                    ),''': '''            error: syncErrorMessage(
                      error,
                      "Unknown deactivate failure.",
                    ),''',
          }

          # Normalize with explicit line-based replacements so YAML indentation cannot alter intent.
          text = text.replace(
              '  const locals = await readAllLocalProducts({\n  supabase: params.supabase,\n  storeId: params.storeId,\n});',
              '  const locals = await readAllLocalProducts({\n    supabase: params.supabase,\n    storeId: params.storeId,\n  });',
          )
          text = text.replace(
              '        error: syncErrorMessage(\n        error,\n        "Could not refresh sync timestamps.",\n      ),',
              '        error: syncErrorMessage(\n          error,\n          "Could not refresh sync timestamps.",\n        ),',
          )
          text = text.replace(
              '          const changed = await deactivateLocalProduct({ ...params, local });\n        if (changed) deactivated += 1;',
              '          const changed = await deactivateLocalProduct({ ...params, local });\n          if (changed) deactivated += 1;',
          )
          text = text.replace(
              '            error: syncErrorMessage(\n            error,\n            "Unknown deactivate failure.",\n          ),',
              '            error: syncErrorMessage(\n              error,\n              "Unknown deactivate failure.",\n            ),',
          )
          path.write_text(text)
          Path('.github/workflows/one-time-format-ebay-pagination-fix-20260728.yml').unlink()
          PY

      - name: Validate formatted patch
        run: |
          set -euo pipefail
          npm ci --silent
          node --import tsx scripts/run-storefront-taxonomy-regressions.ts
          npx eslint src/lib/ebay-authoritative-store-sync.ts scripts/run-storefront-taxonomy-regressions.ts
          npm run build

      - name: Commit formatted patch
        run: |
          set -euo pipefail
          git config user.name "Truely Collectables Automation"
          git config user.email "automation@truelycollectables.com"
          git add src/lib/ebay-authoritative-store-sync.ts .github/workflows/one-time-format-ebay-pagination-fix-20260728.yml
          git commit -m "Format eBay pagination convergence fix"
          git push origin HEAD:agent/fix-ebay-local-pagination-20260728
