name: Authorized Launch Money and Inventory Safety Continuation 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/authorized-launch-money-inventory-safety-continuation-20260729.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-launch-money-inventory-safety-production-deploy
  cancel-in-progress: false

jobs:
  continue-production-cutover:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deploy/launch-money-inventory-safety-continuation-20260729')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: 8baee1bb26a17f974388b4d8e50b4321bbdfb685
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EVIDENCE_DIR: /tmp/launch-money-inventory-continuation-evidence
      PROD_ENV_FILE: /tmp/truely-production.env
    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v4
        with:
          ref: 8baee1bb26a17f974388b4d8e50b4321bbdfb685
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR" "$PROD_ENV_FILE"
          mkdir -p .vercel "$EVIDENCE_DIR"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-identity.txt" 2>&1
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          node -e 'const p=require("./.vercel/project.json"); if(!p.orgId||!p.projectId) process.exit(1);'

      - name: Revalidate every affected source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          printf '%s\n' "$SOURCE_SHA" > "$EVIDENCE_DIR/source-sha.txt"
          npm run simulate:post-sale-ebay-sync
          npm run simulate:accepted-offer-reservations
          node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts
          node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts
          node --import tsx scripts/run-buyer-protection-simulations.ts
          node scripts/run-launch-database-migration-coverage.mjs
          node scripts/run-privileged-api-route-audit.mjs
          npm run simulate:privileged-route-auth
          node scripts/run-ebay-browse-runtime-contracts.mjs
          npm run lint
          npx tsc --noEmit --pretty false
          NEXT_PUBLIC_SUPABASE_URL=https://build-validation.invalid \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=build-validation-anon-key \
          SUPABASE_SERVICE_ROLE_KEY=build-validation-service-role-key \
          NEXT_PUBLIC_SITE_URL=https://truelycollectables.com \
            npm run build

      - name: Pull and validate Production environment without printing values
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-production-env-names.txt" 2>&1
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET CRON_SECRET; do
            grep -Fq "$key" "$EVIDENCE_DIR/vercel-production-env-names.txt"
          done
          npx vercel@56.2.0 env pull "$PROD_ENV_FILE" --environment=production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-env-pull.txt" 2>&1
          test -s "$PROD_ENV_FILE"
          set -a
          source "$PROD_ENV_FILE"
          set +a
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET CRON_SECRET; do
            value="${!key:-}"
            test -n "$value"
            echo "::add-mask::$value"
          done
          case "${STRIPE_LIVE_SECRET_KEY:-${STRIPE_SECRET_KEY:-}}" in
            sk_live_*) ;;
            *) echo "A live Stripe secret key is unavailable." >&2; exit 1 ;;
          esac
          printf '%s\n' 'Production environment values loaded and masked.' > "$EVIDENCE_DIR/production-environment-status.txt"

      - name: Verify the six applied database safety migrations
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PROD_ENV_FILE"
          set +a
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const projectRef = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL).hostname.split(".")[0];
          const query = `
            select
              to_regclass('public.ebay_quantity_sync_outbox') is not null as outbox_table,
              to_regprocedure('public.tcos_reserve_checkout_inventory(uuid,uuid,jsonb,integer)') is not null as reserve_function,
              to_regprocedure('public.tcos_decrement_order_inventory_once(uuid,bigint,bigint,integer)') is not null as decrement_function,
              to_regprocedure('public.tcos_consume_checkout_reservation_after_sale(uuid,uuid,bigint,integer,text)') is not null as consume_function,
              exists (
                select 1 from information_schema.columns
                where table_schema = 'public'
                  and table_name = 'order_notification_deliveries'
                  and column_name = 'next_attempt_at'
              ) as notification_backoff_column,
              exists (
                select 1 from pg_class c
                join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public'
                  and c.relname = 'ebay_quantity_sync_outbox'
                  and c.relrowsecurity
              ) as outbox_rls,
              (
                select count(*) from pg_trigger
                where not tgisinternal
                  and tgname in (
                    'truely_enqueue_ebay_quantity_sync_from_reservation',
                    'truely_enqueue_ebay_quantity_sync_from_order_consumption',
                    'truely_protect_pending_ebay_product_quantity',
                    'truely_protect_pending_ebay_inventory_quantity'
                  )
              ) as safety_trigger_count,
              exists (
                select 1 from pg_constraint
                where conname = 'checkout_inventory_reservations_product_store_fkey'
                  and convalidated
              ) as product_store_fk_validated,
              exists (
                select 1 from pg_constraint
                where conname = 'checkout_inventory_reservations_inventory_item_id_fkey'
                  and confdeltype = 'r'
              ) as inventory_fk_restrict;
          `;
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/database/query`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ query, parameters: [], read_only: true }),
            },
          );
          const text = await response.text();
          if (!response.ok) throw new Error(`Database verification returned HTTP ${response.status}.`);
          const rows = text ? JSON.parse(text) : [];
          const row = Array.isArray(rows) ? rows[0] : rows;
          for (const key of [
            "outbox_table",
            "reserve_function",
            "decrement_function",
            "consume_function",
            "notification_backoff_column",
            "outbox_rls",
            "product_store_fk_validated",
            "inventory_fk_restrict",
          ]) {
            if (row?.[key] !== true) throw new Error(`Database migration verification failed: ${key}`);
          }
          if (Number(row?.safety_trigger_count || 0) !== 4) {
            throw new Error("Expected four eBay safety triggers.");
          }
          fs.writeFileSync(
            process.env.EVIDENCE_DIR + "/database-migration-verification.json",
            JSON.stringify({
              ok: true,
              ...Object.fromEntries(
                Object.entries(row).map(([key, value]) => [key, typeof value === "string" && /^\d+$/.test(value) ? Number(value) : value]),
              ),
            }, null, 2),
          );
          NODE

      - name: Stage clean exact-main Production deployment without domains
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          npx vercel@56.2.0 deploy --prod --yes --force --skip-domain \
            --meta "launchSourceSha=$SOURCE_SHA" \
            --meta "launchPurpose=clean-money-inventory-safety-candidate" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            2>&1 | tee "$EVIDENCE_DIR/clean-deployment.log"
          CLEAN_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$EVIDENCE_DIR/clean-deployment.log" | tail -n 1)"
          test -n "$CLEAN_URL"
          echo "clean_url=$CLEAN_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$CLEAN_URL" > "$EVIDENCE_DIR/clean-deployment-url.txt"

      - name: Verify clean staged deployment before promotion
        env:
          CLEAN_URL: ${{ steps.clean.outputs.clean_url }}
        shell: bash
        run: |
          set -euo pipefail
          for path in / /shop /cart /account/signup /account/login /shipping /returns /buyer-protection; do
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output "$EVIDENCE_DIR/staged-${path//\//-}.html" --write-out '%{http_code}' "$CLEAN_URL$path")"
            test "$code" = "200"
          done
          grep -Fq 'No payment card is required to register' "$EVIDENCE_DIR/staged--account-signup.html"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output "$EVIDENCE_DIR/staged-webhook-unsigned.json" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "$CLEAN_URL/api/webhook")"
          test "$code" = "400"

      - name: Promote only the clean verified deployment
        env:
          CLEAN_URL: ${{ steps.clean.outputs.clean_url }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npx vercel@56.2.0 promote "$CLEAN_URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$EVIDENCE_DIR/vercel-promote.log" 2>&1; then
            printf '%s\n' 'Primary promotion command failed; applying the two known Production aliases.' >> "$EVIDENCE_DIR/vercel-promote.log"
            npx vercel@56.2.0 alias set "$CLEAN_URL" truelycollectables.com --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >> "$EVIDENCE_DIR/vercel-promote.log" 2>&1
            npx vercel@56.2.0 alias set "$CLEAN_URL" truely-collectables.vercel.app --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >> "$EVIDENCE_DIR/vercel-promote.log" 2>&1
          fi

      - name: Verify exact Production deployment and public safety
        shell: bash
        run: |
          set -euo pipefail
          ready=''
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output "$EVIDENCE_DIR/custom-signup.html" --write-out '%{http_code}' https://truelycollectables.com/account/signup || true)"
            if [ "$code" = "200" ] && grep -Fq 'No payment card is required to register' "$EVIDENCE_DIR/custom-signup.html"; then
              ready=1
              break
            fi
            sleep 10
          done
          test -n "$ready"
          for path in / /shop /cart /account/login /shipping /returns /buyer-protection; do
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 90 --output "$EVIDENCE_DIR/custom-${path//\//-}.html" --write-out '%{http_code}' "https://truelycollectables.com$path")"
            test "$code" = "200"
          done
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output "$EVIDENCE_DIR/custom-signup-probe.json" --dump-header "$EVIDENCE_DIR/custom-signup-probe.headers" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"email":"","password":"","tosAccepted":false}' https://truelycollectables.com/api/account/signup)"
          test "$code" = "400"
          grep -Eiq '^x-tcos-account-auth-card-verification: not_required' "$EVIDENCE_DIR/custom-signup-probe.headers"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 60 --output "$EVIDENCE_DIR/custom-webhook-unsigned.json" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' https://truelycollectables.com/api/webhook)"
          test "$code" = "400"

      - name: Add and verify required live Stripe webhook events
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PROD_ENV_FILE"
          set +a
          export STRIPE_CUTOVER_KEY="${STRIPE_LIVE_SECRET_KEY:-${STRIPE_SECRET_KEY:-}}"
          echo "::add-mask::$STRIPE_CUTOVER_KEY"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import Stripe from "stripe";

          const requiredEvents = [
            "checkout.session.completed",
            "checkout.session.expired",
            "refund.created",
            "refund.updated",
            "refund.failed",
            "charge.dispute.created",
            "charge.dispute.updated",
            "charge.dispute.closed",
            "charge.dispute.funds_withdrawn",
            "charge.dispute.funds_reinstated",
            "account.updated",
          ];
          const key = String(process.env.STRIPE_CUTOVER_KEY || "");
          if (!key.startsWith("sk_live_")) throw new Error("The Stripe cutover key is not live.");
          const stripe = new Stripe(key);
          const endpoints = await stripe.webhookEndpoints.list({ limit: 100 });
          const matches = endpoints.data.filter(
            (endpoint) => endpoint.url === "https://truelycollectables.com/api/webhook",
          );
          if (matches.length !== 1 || matches[0].status !== "enabled") {
            throw new Error(`Expected one enabled custom-domain Stripe webhook; found ${matches.length}.`);
          }
          const current = matches[0];
          const enabledEvents = current.enabled_events.includes("*")
            ? current.enabled_events
            : [...new Set([...current.enabled_events, ...requiredEvents])].sort();
          const updated = current.enabled_events.includes("*")
            ? current
            : await stripe.webhookEndpoints.update(current.id, { enabled_events: enabledEvents });
          const missing = requiredEvents.filter(
            (event) => !updated.enabled_events.includes("*") && !updated.enabled_events.includes(event),
          );
          if (missing.length) throw new Error(`Stripe webhook is missing ${missing.length} required events.`);
          fs.writeFileSync(
            process.env.EVIDENCE_DIR + "/stripe-webhook-cutover.json",
            JSON.stringify({
              ok: true,
              endpointCount: 1,
              url: updated.url,
              status: updated.status,
              requiredEventsPresent: true,
              enabledEventCount: updated.enabled_events.length,
            }, null, 2),
          );
          NODE

      - name: Run protected eBay convergence and verify v3 safety receipt
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PROD_ENV_FILE"
          set +a
          test "${#CRON_SECRET}" -ge 16
          echo "::add-mask::$CRON_SECRET"
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 300 --output "$EVIDENCE_DIR/ebay-safety-receipt-full.json" --write-out '%{http_code}' --header "Authorization: Bearer $CRON_SECRET" https://truelycollectables.com/api/cron/ebay-store-fixed-price-sync)"
          test "$code" = "200"
          node - <<'NODE'
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + "/ebay-safety-receipt-full.json", "utf8"));
          if (receipt.success !== true) throw new Error("Protected eBay sync did not succeed.");
          if (receipt.schema !== "truelycollectables.ebayStoreFixedPriceSyncReceipt.v3") {
            throw new Error("Unexpected eBay safety receipt schema.");
          }
          if (receipt.postSaleProtectionAvailable !== true) {
            throw new Error("Post-sale eBay quantity protection is unavailable.");
          }
          if (receipt.databaseAudit?.matchesEligibleEbayInventory !== true) {
            throw new Error("eBay inventory did not reconcile to the database.");
          }
          fs.writeFileSync(
            process.env.EVIDENCE_DIR + "/ebay-safety-receipt.json",
            JSON.stringify({
              schema: receipt.schema,
              success: receipt.success,
              postSaleProtectionAvailable: receipt.postSaleProtectionAvailable,
              warningCount: receipt.warnings?.length || 0,
              representedInventoryRows: receipt.finalAuthoritative?.representedInventoryRows || null,
            }, null, 2),
          );
          fs.rmSync(process.env.EVIDENCE_DIR + "/ebay-safety-receipt-full.json");
          NODE

      - name: Verify post-cutover database runtime safety
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PROD_ENV_FILE"
          set +a
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const projectRef = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL).hostname.split(".")[0];
          const query = `
            select
              (select count(*) from public.ebay_quantity_sync_outbox where desired_quantity < 0) as invalid_outbox_quantity,
              (select count(*) from public.ebay_quantity_sync_outbox where status = 'pending' and next_attempt_at is null) as pending_without_retry_time,
              (select count(*) from public.checkout_inventory_reservations where quantity <= 0) as invalid_reservation_quantity,
              (select count(*) from public.checkout_inventory_reservations where status = 'active' and stripe_session_id is not null) as attached_active_reservations,
              (select count(*) from public.order_notification_deliveries where status in ('failed','dead','exhausted')) as terminal_notification_failures;
          `;
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/database/query`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ query, parameters: [], read_only: true }),
            },
          );
          const text = await response.text();
          if (!response.ok) throw new Error(`Runtime database verification returned HTTP ${response.status}.`);
          const rows = text ? JSON.parse(text) : [];
          const row = Array.isArray(rows) ? rows[0] : rows;
          for (const key of [
            "invalid_outbox_quantity",
            "pending_without_retry_time",
            "invalid_reservation_quantity",
          ]) {
            if (Number(row?.[key] || 0) !== 0) {
              throw new Error(`Post-cutover database safety failed: ${key}`);
            }
          }
          fs.writeFileSync(
            process.env.EVIDENCE_DIR + "/database-runtime-safety.json",
            JSON.stringify({
              ok: true,
              ...Object.fromEntries(Object.entries(row).map(([key, value]) => [key, Number(value || 0)])),
            }, null, 2),
          );
          NODE

      - name: Remove local Production environment file
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$PROD_ENV_FILE"
          test ! -e "$PROD_ENV_FILE"
          exit 0

      - name: Upload sanitized cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-money-inventory-safety-continuation-${{ github.run_number }}
          path: /tmp/launch-money-inventory-continuation-evidence
          if-no-files-found: error
          retention-days: 30
