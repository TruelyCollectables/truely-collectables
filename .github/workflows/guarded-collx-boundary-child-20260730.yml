name: Guarded CollX Boundary Child 20260730

on:
  pull_request:
    branches:
      - fix/launch2-sold-lifecycle-certify-20260730
    paths:
      - ".github/workflows/guarded-collx-boundary-child-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-collx-boundary-child-20260730
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: fix/launch2-collx-boundary-20260730
  EXPECTED_BASE_SHA: 49a3f74861bd09e0065de2830442475cac525571
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  CRON_SECRET: build-validation-cron-secret-that-is-long-enough
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  patch-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/launch2-collx-boundary-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out guarded child branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact child scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/guarded-collx-boundary-child-20260730.yml"
          git fetch origin fix/launch2-sold-lifecycle-certify-20260730
          test "$(git rev-parse origin/fix/launch2-sold-lifecycle-certify-20260730)" = "$EXPECTED_BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply CollX-only inventory boundary
        shell: bash
        run: |
          set -euo pipefail

          cat > src/lib/server-inventory-engine.ts <<'TS'
          import {
            InventoryEngine,
            InventoryRepository,
            type UniversalInventoryItem,
          } from "../modules/inventory";
          import { isLaunchCollectible } from "./sports-card-launch-scope";
          import { isMergedEbayAliasItemId } from "./ebay-merged-listing-groups";
          import type { StorefrontSort } from "./storefront-taxonomy";
          import { getActiveStoreId } from "./stores";
          import { createSupabaseServerClient } from "./supabase-server";

          async function collxOnlyLegacyProductIds() {
            const storeId = getActiveStoreId();
            const supabase = createSupabaseServerClient({ admin: true });
            const { data, error } = await supabase
              .from("collx_only_inventory_boundary_violations")
              .select("legacy_product_id")
              .eq("store_id", storeId);

            if (error) throw error;
            return new Set(
              (data || [])
                .map((row: any) => Number(row.legacy_product_id))
                .filter(Number.isFinite),
            );
          }

          function isPublicStorefrontItem(
            item: UniversalInventoryItem,
            collxOnlyProductIds: Set<number>,
          ) {
            return (
              isLaunchCollectible(item) &&
              !collxOnlyProductIds.has(item.legacyProductId) &&
              !isMergedEbayAliasItemId(item.ebayItemId)
            );
          }

          class PublicStorefrontInventoryEngine extends InventoryEngine {
            async listAvailable(
              params: {
                query?: string;
                sport?: string;
                section?: string;
                feature?: string;
                category?: string;
                sort?: StorefrontSort;
              } = {},
            ) {
              const [items, collxOnlyProductIds] = await Promise.all([
                super.listAvailable(params),
                collxOnlyLegacyProductIds(),
              ]);
              return items.filter((item) =>
                isPublicStorefrontItem(item, collxOnlyProductIds),
              );
            }

            async listAvailableSports(): Promise<string[]> {
              const items = await this.listAvailable();

              return Array.from(
                new Set(
                  items.map((item) => item.sport?.trim()).filter(Boolean) as string[],
                ),
              ).sort();
            }

            async getByLegacyProductId(legacyProductId: number) {
              const [item, collxOnlyProductIds] = await Promise.all([
                super.getByLegacyProductId(legacyProductId),
                collxOnlyLegacyProductIds(),
              ]);
              return item && isPublicStorefrontItem(item, collxOnlyProductIds)
                ? item
                : null;
            }

            async getByLegacyProductIds(legacyProductIds: number[]) {
              const [items, collxOnlyProductIds] = await Promise.all([
                super.getByLegacyProductIds(legacyProductIds),
                collxOnlyLegacyProductIds(),
              ]);
              return items.filter((item) =>
                isPublicStorefrontItem(item, collxOnlyProductIds),
              );
            }
          }

          export function createServerInventoryEngine() {
            const storeId = getActiveStoreId();
            const supabase = createSupabaseServerClient({ admin: true });

            return new PublicStorefrontInventoryEngine(
              storeId,
              new InventoryRepository(storeId, supabase),
              supabase,
            );
          }
          TS

          cat > src/modules/inventory/checkout-engine.ts <<'TS'
          import { isLaunchSportsCard } from "../../lib/sports-card-launch-scope";
          import { getActiveStoreId } from "../../lib/stores";
          import { createSupabaseServerClient } from "../../lib/supabase-server";
          import {
            InventoryEngine as BaseInventoryEngine,
            InventoryEngineError,
          } from "./engine";
          import type { UniversalInventoryItem } from "./types";

          type CheckoutCartItem = {
            id?: unknown;
            product_id?: unknown;
            productId?: unknown;
            quantity?: unknown;
            qty?: unknown;
          };

          export class InventoryEngine extends BaseInventoryEngine {
            async requireAvailableCartItems(
              cart: CheckoutCartItem[],
            ): Promise<UniversalInventoryItem[]> {
              const items = await super.requireAvailableCartItems(cart);
              const supabase = createSupabaseServerClient({ admin: true });
              const { data, error } = await supabase
                .from("collx_only_inventory_boundary_violations")
                .select("legacy_product_id")
                .eq("store_id", getActiveStoreId())
                .in(
                  "legacy_product_id",
                  items.map((item) => item.legacyProductId),
                );

              if (error) {
                throw new InventoryEngineError(
                  "Unable to verify marketplace inventory boundaries",
                  503,
                );
              }

              const collxOnlyProductIds = new Set(
                (data || []).map((row: any) => Number(row.legacy_product_id)),
              );
              const blockedItem = items.find(
                (item) =>
                  !isLaunchSportsCard(item) ||
                  collxOnlyProductIds.has(item.legacyProductId),
              );

              if (blockedItem) {
                throw new InventoryEngineError(
                  `Product ${blockedItem.legacyProductId} is not available for purchase`,
                  400,
                );
              }

              return items;
            }
          }
          TS

          cat > supabase/migrations/20260730002800_enforce_collx_inventory_boundary.sql <<'SQL'
          -- Launch 2.0 issue #253: CollX-only inventory is excluded until a direct connector is verified.
          -- A future direct connector may remove this guard only after exact-card mapping,
          -- quantity/listing-state sync, actual sale price/date/reference ingestion,
          -- eBay-linked duplicate prevention, immediate cross-channel stock protection,
          -- InstaComp sale-evidence preservation, and race/retry/duplicate/reconciliation tests pass.
          create or replace function public.inventory_metadata_mentions_collx(p_metadata jsonb)
          returns boolean
          language plpgsql
          immutable
          set search_path = public
          as $$
          declare
            source_text text;
          begin
            source_text := lower(concat_ws(' ',
              p_metadata ->> 'source_marketplace',
              p_metadata ->> 'sourceMarketplace',
              p_metadata ->> 'marketplace',
              p_metadata ->> 'marketplaces',
              p_metadata ->> 'source_marketplaces',
              p_metadata ->> 'sourceMarketplaces',
              p_metadata ->> 'listing_marketplace',
              p_metadata ->> 'listingMarketplace',
              p_metadata ->> 'inventory_source',
              p_metadata ->> 'inventorySource',
              p_metadata ->> 'source',
              p_metadata ->> 'origin'
            ));
            return source_text ~ '(^|[^a-z0-9])collx([^a-z0-9]|$)';
          end;
          $$;

          create or replace view public.collx_only_inventory_boundary_violations
          with (security_invoker = true)
          as
          select
            i.id as inventory_item_id,
            i.store_id,
            i.legacy_product_id,
            i.sku,
            p.ebay_item_id
          from public.inventory_items i
          left join public.products p
            on p.store_id = i.store_id
           and (
             p.id = i.legacy_product_id
             or (i.legacy_product_id is null and i.sku is not null and p.sku = i.sku)
           )
          where public.inventory_metadata_mentions_collx(i.metadata)
            and nullif(btrim(coalesce(p.ebay_item_id, '')), '') is null;

          create or replace function public.enforce_collx_inventory_boundary()
          returns trigger
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            linked_ebay_item_id text;
          begin
            if not public.inventory_metadata_mentions_collx(new.metadata) then
              return new;
            end if;

            select nullif(btrim(p.ebay_item_id), '')
              into linked_ebay_item_id
            from public.products p
            where p.store_id = new.store_id
              and (
                p.id = new.legacy_product_id
                or (new.legacy_product_id is null and new.sku is not null and p.sku = new.sku)
              )
            order by (p.id = new.legacy_product_id) desc
            limit 1;

            if linked_ebay_item_id is null then
              raise exception using
                errcode = '23514',
                message = 'COLLX_ONLY_INVENTORY_BLOCKED',
                detail = 'CollX-only inventory cannot be imported or published until a direct CollX inventory-and-sales connector is verified.';
            end if;

            return new;
          end;
          $$;

          drop trigger if exists enforce_collx_inventory_boundary on public.inventory_items;
          create trigger enforce_collx_inventory_boundary
          before insert or update of store_id, legacy_product_id, sku, metadata
          on public.inventory_items
          for each row execute function public.enforce_collx_inventory_boundary();

          revoke all on function public.enforce_collx_inventory_boundary() from public, anon, authenticated;
          grant execute on function public.enforce_collx_inventory_boundary() to service_role;
          SQL

          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != count:
                  raise SystemExit(f"{path}: expected {count} anchor(s), found {text.count(old)}")
              p.write_text(text.replace(old, new, count))

          sale = "src/lib/collectible-sale-history.ts"
          replace(
              sale,
              "  ).toISOString();\n\n  const { data: products, error: productError } = await params.supabase",
              "  ).toISOString();\n\n  const { data: collxOnlyRows, error: collxOnlyError } = await params.supabase\n    .from(\"collx_only_inventory_boundary_violations\")\n    .select(\"legacy_product_id\")\n    .eq(\"store_id\", params.storeId);\n  if (collxOnlyError) throw collxOnlyError;\n  const collxOnlyProductIds = new Set(\n    (collxOnlyRows || []).map((row: any) => Number(row.legacy_product_id)),\n  );\n\n  const { data: products, error: productError } = await params.supabase",
          )
          replace(
              sale,
              "    .filter((item) => isLaunchCollectible(item))\n    .filter((item) => !isMergedEbayAliasItemId(item.ebayItemId))",
              "    .filter((item) => isLaunchCollectible(item))\n    .filter((item) => !collxOnlyProductIds.has(item.legacyProductId))\n    .filter((item) => !isMergedEbayAliasItemId(item.ebayItemId))",
          )
          replace(
              sale,
              "}) {\n  const { data, error } = await params.supabase\n    .from(\"products\")",
              "}) {\n  const { data: collxBoundary, error: collxBoundaryError } = await params.supabase\n    .from(\"collx_only_inventory_boundary_violations\")\n    .select(\"legacy_product_id\")\n    .eq(\"store_id\", params.storeId)\n    .eq(\"legacy_product_id\", params.legacyProductId)\n    .maybeSingle();\n  if (collxBoundaryError) throw collxBoundaryError;\n  if (collxBoundary) return null;\n\n  const { data, error } = await params.supabase\n    .from(\"products\")",
          )

          sim = "scripts/run-sold-lifecycle-simulations.mjs"
          replace(
              sim,
              'const saleHistory = read("src/lib/collectible-sale-history.ts");\n',
              'const saleHistory = read("src/lib/collectible-sale-history.ts");\nconst collxBoundaryMigration = read("supabase/migrations/20260730002800_enforce_collx_inventory_boundary.sql");\nconst checkoutEngine = read("src/modules/inventory/checkout-engine.ts");\nconst publicInventoryEngine = read("src/lib/server-inventory-engine.ts");\n',
          )
          assertions = '''assert.match(collxBoundaryMigration, /collx_only_inventory_boundary_violations/);
          assert.match(collxBoundaryMigration, /COLLX_ONLY_INVENTORY_BLOCKED/);
          assert.match(collxBoundaryMigration, /before insert or update/);
          assert.match(collxBoundaryMigration, /actual sale price\/date\/reference ingestion/);
          assert.match(collxBoundaryMigration, /race\/retry\/duplicate\/reconciliation tests pass/);
          assert.match(publicInventoryEngine, /collx_only_inventory_boundary_violations/);
          assert.match(publicInventoryEngine, /!collxOnlyProductIds\.has\(item\.legacyProductId\)/);
          assert.match(checkoutEngine, /collx_only_inventory_boundary_violations/);
          assert.match(checkoutEngine, /collxOnlyProductIds\.has\(item\.legacyProductId\)/);
          assert.match(saleHistory, /collx_only_inventory_boundary_violations/);
          assert.match(saleHistory, /!collxOnlyProductIds\.has\(item\.legacyProductId\)/);
          assert.equal(fs.existsSync("src/app/api/cron/collx-inventory-sync/route.ts"), false);
          assert.equal(fs.existsSync("src/app/api/cron/collx-sales-sync/route.ts"), false);

          '''
          replace(sim, "const cronByPath = new Map(\n", assertions + "const cronByPath = new Map(\n")
          replace(sim, "      checks: 144,", "      checks: 157,")

          ci = ".github/workflows/launch2-sold-lifecycle-ci-20260729.yml"
          replace(
              ci,
              '      - "src/lib/collectible-sale-history.ts"\n',
              '      - "src/lib/collectible-sale-history.ts"\n      - "src/lib/server-inventory-engine.ts"\n      - "src/modules/inventory/checkout-engine.ts"\n',
          )
          replace(
              ci,
              '      - "supabase/migrations/20260730002700_run_sale_guards_before_restock_reset.sql"\n',
              '      - "supabase/migrations/20260730002700_run_sale_guards_before_restock_reset.sql"\n      - "supabase/migrations/20260730002800_enforce_collx_inventory_boundary.sql"\n',
          )
          PY

          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run issue 253 and CollX boundary simulations
        run: node scripts/run-sold-lifecycle-simulations.mjs

      - name: Run privileged route audit
        run: |
          node scripts/run-privileged-api-route-audit.mjs
          npm run simulate:privileged-route-auth

      - name: Run lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run Production build
        run: npm run build

      - name: Commit only validated boundary source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --porcelain=v1 -uall | cut -c4- | sort)
          expected=(
            .github/workflows/launch2-sold-lifecycle-ci-20260729.yml
            scripts/run-sold-lifecycle-simulations.mjs
            src/lib/collectible-sale-history.ts
            src/lib/server-inventory-engine.ts
            src/modules/inventory/checkout-engine.ts
            supabase/migrations/20260730002800_enforce_collx_inventory_boundary.sql
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${expected[@]}"
          git commit -m "Enforce the CollX-only inventory launch boundary"
          git push origin "HEAD:$EXPECTED_BRANCH"
