name: Sentinel Progress Quick Probe 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sentinel-progress-quick-probe-20260808.yml'
  workflow_dispatch:

permissions:
  contents: read

# Manual refresh marker: 2026-08-08T16:29:30-06:00
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe Production progress, readiness, and Mac tunnel health
        shell: bash
        run: |
          set +e
          for url in \
            'https://truelycollectables.com/api/instacomp/checklist-sentinel/progress' \
            'https://truelycollectables.com/api/instacomp/internal-readiness' \
            'https://truely-collectables.vercel.app/api/instacomp/checklist-sentinel/progress' \
            'https://truely-collectables.vercel.app/api/instacomp/internal-readiness' \
            'https://instacomp.truelycollectables.com/health'
          do
            echo "=== $url ==="
            curl -sS --connect-timeout 5 --max-time 15 -D - "$url"
            rc=$?
            echo
            echo "curl_exit=$rc"
          done
          exit 0
