name: InstaComp Real OCR Card Numbers 20260807

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/patch-instacomp-real-ocr-card-numbers-20260807.py"
      - ".github/workflows/instacomp-real-ocr-card-numbers-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instacomp-real-ocr-card-numbers-20260807
  cancel-in-progress: true

jobs:
  patch-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instacomp-live-five-root-causes-20260807
          fetch-depth: 0

      - name: Apply real OCR repair
        run: python scripts/ops/patch-instacomp-real-ocr-card-numbers-20260807.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Mac service dependencies
        working-directory: services/instacomp-ai
        run: python -m pip install -q -r requirements.txt

      - name: Exact OCR hard-fact regressions
        working-directory: services/instacomp-ai
        run: python -m pytest -q tests/test_ocr_registry_hard_facts.py

      - name: Full Mac service suite and compile
        working-directory: services/instacomp-ai
        run: |
          python -m pytest -q
          python -m compileall -q app

      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'NO(?:\.(?!\w)|\b)' services/instacomp-ai/app/local_vision.py
          grep -Fq 'max_dy = 0.34 if upper_back_label else 0.16' services/instacomp-ai/app/local_vision.py
          grep -Fq 'cy < 0.50 or candidate.confidence < 0.60' services/instacomp-ai/app/local_vision.py
          grep -Fq 'test_real_sonia_notre_dame_text_cannot_become_tre_card_number' services/instacomp-ai/tests/test_ocr_registry_hard_facts.py
          grep -Fq 'test_real_paige_split_no_label_reaches_printed_five_not_stats_table' services/instacomp-ai/tests/test_ocr_registry_hard_facts.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'services/instacomp-ai/app/local_vision.py' 'services/instacomp-ai/tests/test_ocr_registry_hard_facts.py' | sort)"
          test "$changed" = "$expected"

      - name: Commit certified OCR repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/instacomp-ai/app/local_vision.py services/instacomp-ai/tests/test_ocr_registry_hard_facts.py
          git commit -m 'Fix frozen-five card-number parsing from real OCR evidence'
          git push origin HEAD:fix/instacomp-live-five-root-causes-20260807
