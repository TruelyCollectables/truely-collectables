name: CollX Classification Key Shape Audit 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-classification-key-shape-audit-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Print sanitized API key metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json,os,subprocess
          T=os.environ['SUPABASE_ACCESS_TOKEN']; API='https://api.supabase.com/v1'
          def get(url):
            p=subprocess.run(['curl','-sS','--max-time','60','-H',f'Authorization: Bearer {T}','-H','Accept: application/json',url],capture_output=True,text=True,check=True)
            return json.loads(p.stdout)
          ps=get(API+'/projects'); cs=[p for p in ps if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if len(cs)!=1: raise SystemExit(2)
          ref=str(cs[0].get('id') or cs[0].get('ref'))
          keys=get(f'{API}/projects/{ref}/api-keys')
          safe=[]
          for k in keys:
            safe.append({x:k.get(x) for x in ('id','name','type','description','created_at','updated_at') if x in k} | {'has_api_key':bool(k.get('api_key') or k.get('key'))})
          print('SANITIZED_KEY_METADATA='+json.dumps(safe,default=str))
          PY
