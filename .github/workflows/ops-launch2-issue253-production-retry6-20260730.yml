name: Ops Launch 2 Issue 253 Production Retry 6

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-launch2-issue253-production-retry6-20260730.yml"

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: 5996991c2a2d9f2b6606715e62dfcb1d8332d4f0
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables

jobs:
  certify-deploy:
    if: github.event.pull_request.head.ref == 'ops/launch2-issue253-production-apply-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
      ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-validation-admin-password
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_validation
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
      STRIPE_WEBHOOK_SECRET: whsec_build_validation
      EBAY_CLIENT_ID: build-validation-client-id
      EBAY_CLIENT_SECRET: build-validation-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fail closed on exact source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin +refs/heads/ops/truely-full-launch-audit-20260729:refs/remotes/origin/ops/truely-full-launch-audit-20260729
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          git diff --check
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p "$RUNNER_TEMP/launch2-issue253-retry6"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$RUNNER_TEMP/launch2-issue253-retry6/exact-main-sha.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run issue 253, security, and runtime contract gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-sold-lifecycle-simulations.mjs
          node scripts/run-sold-trigger-order-simulation.mjs
          node scripts/run-privileged-api-route-audit.mjs
          npm run simulate:privileged-route-auth
          node scripts/verify-runtime-admin-orders-self-test-contract.mjs
          npm audit --audit-level=high

      - name: Run all six Launch 2 simulation shards
        shell: bash
        run: |
          set -euo pipefail
          git show origin/ops/truely-full-launch-audit-20260729:scripts/run-truely-launch-audit-20260729.mjs > scripts/.retry6-launch-audit-runner.mjs
          rm -rf .audit/simulations
          for shard in 0 1 2 3 4 5; do
            node scripts/.retry6-launch-audit-runner.mjs simulations --shard="$shard" --shards=6
          done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = '.audit/simulations';
          const files = fs.readdirSync(dir).filter((name) => /^simulation-shard-\d+\.json$/.test(name));
          if (files.length < 6) throw new Error(`Only ${files.length} simulation reports exist.`);
          const failed = files.flatMap((name) => {
            const value = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
            return (value.results || []).filter((row) => row.status !== 'passed').map((row) => ({ name: row.name, status: row.status, shard: name }));
          });
          if (failed.length) throw new Error(`Launch simulations failed: ${JSON.stringify(failed)}`);
          NODE
          rm -f scripts/.retry6-launch-audit-runner.mjs

      - name: Run lint TypeScript and Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npx tsc --noEmit --pretty false
          npm run build

      - name: Link Vercel and derive Production database context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/launch2-issue253-production"
          npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/launch2-issue253-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(`${process.env.RUNNER_TEMP}/launch2-issue253-production/production.env`, 'utf8');
          const parsed = {};
          for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) value = value.slice(1, -1);
            parsed[key] = value;
          }
          const url = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '').trim();
          if (!/^https:\/\//.test(url)) throw new Error('Production Supabase URL is unavailable.');
          const projectRef = new URL(url).hostname.split('.')[0];
          if (!projectRef) throw new Error('Unable to derive Production Supabase project reference.');
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_SUPABASE_PROJECT_REF=${projectRef}\n`);
          NODE

      - name: Verify hosted issue 253 schema and backfill invariants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const endpoint = `https://api.supabase.com/v1/projects/${process.env.PRODUCTION_SUPABASE_PROJECT_REF}/database/query`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ read_only: true, parameters: [], query: `select json_build_object(
              'required_relations', (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('collectible_assets','collectible_asset_events','collectible_grader_verifications','collectible_market_snapshots','collectible_sales','instacomp_internal_sold_comps','collx_only_inventory_boundary_violations','ebay_inbound_sale_guards')),
              'sale_records_total', (select count(*) from public.collectible_sales),
              'sale_records_verified', (select count(*) from public.collectible_sales where evidence_status='verified'),
              'sale_records_manual', (select count(*) from public.collectible_sales where evidence_status='manual'),
              'sale_records_unresolved', (select count(*) from public.collectible_sales where evidence_status='unresolved'),
              'verified_or_manual_price_missing', (select count(*) from public.collectible_sales where evidence_status in ('verified','manual') and sold_price is null),
              'null_price_not_flagged_unresolved', (select count(*) from public.collectible_sales where sold_price is null and evidence_status <> 'unresolved'),
              'historical_sold_products_without_sale_record', (select count(*) from public.products p where p.sold_at < timestamptz '2026-07-28 00:00:00+00' and not exists (select 1 from public.collectible_sales s where s.store_id=p.store_id and s.legacy_product_id=p.id)),
              'collx_only_boundary_violations', (select count(*) from public.collx_only_inventory_boundary_violations),
              'active_inbound_sale_guards', (select count(*) from public.ebay_inbound_sale_guards where active),
              'duplicate_sale_event_groups', (select count(*) from (select store_id,event_key from public.collectible_sales group by store_id,event_key having count(*) > 1) d),
              'negative_product_quantities', (select count(*) from public.products where quantity < 0),
              'negative_inventory_quantities', (select count(*) from public.inventory_items where quantity < 0),
              'sold_stock_restoration_violations', (select count(*) from public.products where sold_at is not null and quantity > 0),
              'inactive_guard_trigger_count', (select count(*) from pg_trigger where tgname='capture_ebay_inactive_collectible_sale' and not tgisinternal),
              'inactive_guard_function_installed', (select case when to_regprocedure('public.capture_ebay_inactive_collectible_sale()') is null then false else position('ebay_inbound_sale_guards' in pg_get_functiondef(to_regprocedure('public.capture_ebay_inactive_collectible_sale()'))) > 0 end),
              'captured_at', now()) as receipt;` }),
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Hosted invariant query failed with HTTP ${response.status}: ${body.slice(0, 1000)}`);
          const rows = body ? JSON.parse(body) : [];
          const receipt = (Array.isArray(rows) ? rows[0]?.receipt : rows?.receipt) || rows;
          for (const key of ['verified_or_manual_price_missing','null_price_not_flagged_unresolved','historical_sold_products_without_sale_record','collx_only_boundary_violations','duplicate_sale_event_groups','negative_product_quantities','negative_inventory_quantities','sold_stock_restoration_violations']) if (Number(receipt[key]) !== 0) throw new Error(`${key}=${receipt[key]}`);
          if (Number(receipt.required_relations) !== 8 || Number(receipt.inactive_guard_trigger_count) !== 1 || receipt.inactive_guard_function_installed !== true) throw new Error(`Hosted issue 253 structure failed: ${JSON.stringify(receipt)}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'launch2-issue253-retry6', 'hosted-schema-backfill-receipt.json'), JSON.stringify({ ok: true, exactMainSha: process.env.EXPECTED_MAIN_SHA, receipt, containsOnlyAggregateCounts: true, verifiedAt: new Date().toISOString() }, null, 2));
          NODE

      - name: Deploy exact certified main to Vercel Production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          deployment_url="$(npx vercel@56.2.0 deploy --prod --yes --force --archive=tgz --meta "githubCommitSha=$EXPECTED_MAIN_SHA" --meta "launchGate=issue253-retry6" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          deployment_url="$(printf '%s' "$deployment_url" | tail -n 1 | tr -d '\r\n')"
          test -n "$deployment_url"
          deployment_host="${deployment_url#https://}"
          printf 'DEPLOYMENT_URL=%s\nDEPLOYMENT_HOST=%s\n' "$deployment_url" "$deployment_host" >> "$GITHUB_ENV"
          printf '%s\n' "$deployment_url" > "$RUNNER_TEMP/launch2-issue253-retry6/deployment-url.txt"

      - name: Verify exact deployment metadata and live runtime
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/launch2-issue253-retry6"
          curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST?slug=$VERCEL_SCOPE" > "$evidence/deployment.json"
          DEPLOYMENT_JSON="$(cat "$evidence/deployment.json")" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const value = JSON.parse(process.env.DEPLOYMENT_JSON || '{}');
          const aliases = Array.isArray(value.alias) ? value.alias : Array.isArray(value.aliases) ? value.aliases : [];
          const metaSha = String(value?.meta?.githubCommitSha || '').trim();
          if (String(value.target || '').toLowerCase() !== 'production') throw new Error(`Target=${value.target}`);
          if (String(value.readyState || '').toUpperCase() !== 'READY') throw new Error(`ReadyState=${value.readyState}`);
          if (metaSha !== process.env.EXPECTED_MAIN_SHA) throw new Error(`Metadata SHA=${metaSha}`);
          if (!aliases.includes('truelycollectables.com')) throw new Error('Custom domain alias missing.');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'launch2-issue253-retry6', 'exact-deployment-receipt.json'), JSON.stringify({ ok: true, deploymentId: value.id, deploymentHost: value.url, target: value.target, readyState: value.readyState, exactMainSha: process.env.EXPECTED_MAIN_SHA, metadataSha: metaSha, customDomainAlias: 'truelycollectables.com', verifiedAt: new Date().toISOString() }, null, 2));
          NODE
          rm -f "$evidence/deployment.json"

          success=false
          for attempt in $(seq 1 72); do
            home_code="$(curl --location --silent --show-error --max-time 30 --output "$evidence/home.body" --write-out '%{http_code}' https://truelycollectables.com/ || true)"
            shop_code="$(curl --location --silent --show-error --max-time 30 --output "$evidence/shop.body" --write-out '%{http_code}' https://truelycollectables.com/shop || true)"
            runtime_code="$(curl --silent --show-error --max-time 90 --request POST --header "Authorization: Bearer $VERCEL_TOKEN" --output "$evidence/runtime.json" --write-out '%{http_code}' https://truelycollectables.com/api/release/admin-orders-self-test || true)"
            unsigned_health="$(curl --location --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' https://truelycollectables.com/api/admin-orders-health || true)"
            if [ "$home_code" = 200 ] && [ "$shop_code" = 200 ] && [ "$runtime_code" = 200 ] && [ "$unsigned_health" = 401 ]; then
              RUNTIME_SELF_TEST="$(cat "$evidence/runtime.json")" node --input-type=module - <<'NODE'
              import fs from 'node:fs';
              import path from 'node:path';
              const value = JSON.parse(process.env.RUNTIME_SELF_TEST || '{}');
              if (value.success !== true || value.adminNavigation !== 'passed' || value.sessionRefresh !== 'passed' || value.refundConfirmationGuard !== 'passed' || value.refundIssued !== false || Number(value.directStoreTcosFeesRemaining) !== 0) throw new Error(`Runtime self-test failed: ${JSON.stringify(value)}`);
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'launch2-issue253-retry6', 'live-runtime-receipt.json'), JSON.stringify({ ok: true, exactMainSha: process.env.EXPECTED_MAIN_SHA, homeStatus: 200, shopStatus: 200, protectedRuntimeStatus: 200, unsignedAdminHealthStatus: 401, runtime: value, verifiedAt: new Date().toISOString() }, null, 2));
              NODE
              success=true
              break
            fi
            sleep 10
          done
          test "$success" = true
          rm -f "$evidence/home.body" "$evidence/shop.body" "$evidence/runtime.json" "$RUNNER_TEMP/launch2-issue253-production/production.env"

      - name: Upload sanitized exact Production evidence
        uses: actions/upload-artifact@v4
        with:
          name: launch2-issue253-production-retry6-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ runner.temp }}/launch2-issue253-retry6
          if-no-files-found: error
          retention-days: 30
