name: Stripe Live Credential Gate

on:
  pull_request:
    paths:
      - "src/lib/stripe-credentials.ts"
      - "src/lib/live-payment-launch*.ts"
      - "src/app/api/checkout/route.ts"
      - "src/app/api/webhook/route.ts"
      - "scripts/status-live-money.ts"
      - "scripts/live-money-env-packet.mjs"
      - "scripts/run-stripe-live-credential-fail-closed-simulations.ts"
      - ".github/workflows/stripe-live-credential-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/stripe-credentials.ts"
      - "src/lib/live-payment-launch*.ts"
      - "src/app/api/checkout/route.ts"
      - "src/app/api/webhook/route.ts"
      - "scripts/status-live-money.ts"
      - "scripts/live-money-env-packet.mjs"
      - "scripts/run-stripe-live-credential-fail-closed-simulations.ts"
      - ".github/workflows/stripe-live-credential-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-live-credential-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dedicated live credential contract
        run: node --import tsx scripts/run-stripe-live-credential-fail-closed-simulations.ts

      - name: Validate checkout webhook idempotency
        run: node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts

      - name: Validate offer checkout idempotency
        run: node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
