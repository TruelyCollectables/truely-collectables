name: Ops Deal Hunter Post-Failover Proof 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-deal-hunter-post-failover-proof-20260810.yml'

permissions:
  contents: read

concurrency:
  group: ops-deal-hunter-post-failover-proof-20260810
  cancel-in-progress: false

env:
  REQUIRED_FIX: e1cb79d1a83d90d812e7a50bb2d4f9eab3a943f2
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  SITE_URL: https://truelycollectables.com

jobs:
  deploy-and-hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock latest main containing Deal Hunter repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUIRED_FIX" origin/main
          git checkout --detach origin/main
          deployed_sha="$(git rev-parse HEAD)"
          echo "DEPLOYED_SHA=$deployed_sha" >> "$GITHUB_ENV"
          echo "deploying_main=$deployed_sha"
          test -f src/app/api/instacomp/deal-hunter/evaluate/resilient-core.ts
          grep -Fq 'registryExactLockRequired: true' src/app/api/instacomp/deal-hunter/evaluate/resilient-core.ts
          grep -Fq 'from "./resilient-core"' src/app/api/instacomp/deal-hunter/evaluate/route.ts

      - name: Deploy latest repaired main to Production
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee deploy.log
          grep -Fq 'https://' deploy.log

      - name: Wait for Deal Hunter scheduler to be idle and capture baseline
        shell: bash
        run: |
          set -euo pipefail
          : > pre.json
          for i in $(seq 1 80); do
            code="$(curl -sS --max-time 45 -o pre.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$SITE_URL/api/release/instacomp-deal-hunter-learning-self-test?mode=status" || true)"
            if [ "$code" = 200 ]; then
              running="$(node -e "const p=require('./pre.json'); process.stdout.write(String(Boolean(p.scheduler?.running)))")"
              if [ "$running" = false ]; then break; fi
            fi
            sleep 15
          done
          cat pre.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('pre.json','utf8'));
          if(!p.success) throw new Error(JSON.stringify(p));
          if(!p.physicalMacHealthy) throw new Error('Physical Mac unhealthy');
          if(!p.scheduler?.enabled) throw new Error('Deal Hunter scheduler disabled');
          if(!p.scheduler?.evaluationKeyConfigured) throw new Error('Deal Hunter evaluation key missing');
          if(p.scheduler?.running) throw new Error('Deal Hunter scheduler never became idle');
          fs.appendFileSync(process.env.GITHUB_ENV,`PRE_COMPLETED=${p.scheduler.lastCompletedAt||''}\n`);
          console.log('PRE_COMPLETED='+String(p.scheduler.lastCompletedAt||''));
          NODE

      - name: Force one real card Deal Hunter run
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 300 -o trigger.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$SITE_URL/api/release/instacomp-deal-hunter-learning-self-test?pass=1" || true)"
          echo "trigger_http=$code"
          test -s trigger.json && cat trigger.json || true

      - name: Poll durable run receipt
        shell: bash
        run: |
          set -euo pipefail
          : > status.json
          completed=""
          for i in $(seq 1 160); do
            code="$(curl -sS --max-time 45 -o status.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$SITE_URL/api/release/instacomp-deal-hunter-learning-self-test?mode=status" || true)"
            if [ "$code" = 200 ]; then
              completed="$(node -e "const p=require('./status.json'); process.stdout.write(String(p.scheduler?.lastCompletedAt||''))")"
              running="$(node -e "const p=require('./status.json'); process.stdout.write(String(Boolean(p.scheduler?.running)))")"
              if [ -n "$completed" ] && [ "$completed" != "$PRE_COMPLETED" ] && [ "$running" = false ]; then break; fi
            fi
            sleep 15
          done
          cat status.json
          node - <<'NODE'
          const p=require('./status.json');
          const latest=Array.isArray(p.runs)?p.runs[0]:null;
          console.log('DEAL_HUNTER_FINAL_RUN='+JSON.stringify(latest));
          if(!p.success) throw new Error('Status route failed');
          if(!p.physicalMacHealthy) throw new Error('Physical Mac unhealthy');
          if(!latest) throw new Error('No Deal Hunter run receipt');
          if(latest.status!=='completed') throw new Error('Latest run not completed: '+JSON.stringify(latest));
          if(Number(latest.discoveryCount||0)<=0) throw new Error('Zero discovered');
          if(Number(latest.evaluatedCount||0)<=0) throw new Error('Zero evaluated');
          process.stdout.write('RUN_ID='+String(latest.runId||''));
          require('fs').appendFileSync(process.env.GITHUB_ENV,'RUN_ID='+String(latest.runId||'')+'\n');
          NODE

      - name: Read candidate outcomes for this run
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$SITE_URL/api/release/instacomp-deal-hunter-candidate-diagnostics" > diagnostics.json
          node - <<'NODE'
          const p=require('./diagnostics.json');
          if(!p.success) throw new Error(JSON.stringify(p));
          const runId=process.env.RUN_ID;
          const mac=(Array.isArray(p.macCandidates)?p.macCandidates:[]).filter(r=>r.runId===runId);
          const prod=(Array.isArray(p.productionCandidates)?p.productionCandidates:[]).filter(r=>r.run_id===runId);
          const errorCounts={}; const labelCounts={};
          for(const r of mac){
            const e=r.errorCode||'NONE'; errorCounts[e]=(errorCounts[e]||0)+1;
            const l=r.dealLabel||'NONE'; labelCounts[l]=(labelCounts[l]||0)+1;
          }
          const actionable=mac.filter(r=>r.actionable||r.alertworthy);
          const receipt={
            deployedSha:process.env.DEPLOYED_SHA,
            runId,
            macCandidateCount:mac.length,
            productionCandidateCount:prod.length,
            errorCounts,
            dealLabelCounts:labelCounts,
            actionable,
            candidates:mac,
            checkedAt:p.checkedAt||null
          };
          console.log('DEAL_HUNTER_CANDIDATE_RECEIPT='+JSON.stringify(receipt));
          const evalFailures=mac.filter(r=>r.errorCode==='DEAL_HUNTER_EVALUATION_FAILED');
          if(evalFailures.length===mac.length && mac.length>0) throw new Error('All evaluated cards still failed at the evaluation layer');
          NODE
