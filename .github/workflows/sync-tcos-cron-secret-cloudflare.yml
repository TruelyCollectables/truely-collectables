name: Sync Production AI Secrets to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-tcos-cron-secret-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.123.0

      - name: Report provider secret availability by name only
        shell: bash
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY GOOGLE_GEMINI_API_KEY GROQ_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "GITHUB_PROVIDER_SECRET ${name}=present"
            else
              echo "GITHUB_PROVIDER_SECRET ${name}=missing"
            fi
          done

          for config in wrangler.jsonc wrangler.production-route.jsonc; do
            label=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).name)" "$config")
            npx --no-install wrangler secret list --format json --config "$config" > "/tmp/${label}-secret-names.json"
            WORKER_LABEL="$label" SECRET_FILE="/tmp/${label}-secret-names.json" node <<'NODE'
            const fs = require('node:fs');
            const rows = JSON.parse(fs.readFileSync(process.env.SECRET_FILE, 'utf8'));
            const names = new Set((Array.isArray(rows) ? rows : []).map((row) => String(row?.name || '')));
            for (const name of ['INSTACOMP_AI_LOCAL_KEY','OPENAI_API_KEY','GEMINI_API_KEY','GOOGLE_GEMINI_API_KEY','GROQ_API_KEY','TCOS_CRON_SECRET']) {
              console.log(`CLOUDFLARE_PROVIDER_SECRET worker=${process.env.WORKER_LABEL} ${name}=${names.has(name) ? 'present' : 'missing'}`);
            }
            NODE
            shred -u "/tmp/${label}-secret-names.json"
          done

      - name: Synchronize trusted runtime credentials without logging values
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${TCOS_CRON_SECRET:-}" ] || { echo 'TCOS_CRON_SECRET missing.'; exit 2; }
          [ -n "${OPENAI_API_KEY:-}" ] || { echo 'OPENAI_API_KEY missing.'; exit 2; }
          for config in wrangler.jsonc wrangler.production-route.jsonc; do
            printf '%s' "$TCOS_CRON_SECRET" | npx --no-install wrangler secret put TCOS_CRON_SECRET --config "$config"
            printf '%s' "$OPENAI_API_KEY" | npx --no-install wrangler secret put OPENAI_API_KEY --config "$config"
            if [ -n "${GEMINI_API_KEY:-}" ]; then
              printf '%s' "$GEMINI_API_KEY" | npx --no-install wrangler secret put GEMINI_API_KEY --config "$config"
            elif [ -n "${GOOGLE_GEMINI_API_KEY:-}" ]; then
              printf '%s' "$GOOGLE_GEMINI_API_KEY" | npx --no-install wrangler secret put GOOGLE_GEMINI_API_KEY --config "$config"
            fi
            if [ -n "${GROQ_API_KEY:-}" ]; then
              printf '%s' "$GROQ_API_KEY" | npx --no-install wrangler secret put GROQ_API_KEY --config "$config"
            fi
          done
          echo 'Production AI credentials synchronized where configured; values withheld.'
