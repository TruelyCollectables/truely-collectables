name: Sync TCOS Cron Secret to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-tcos-cron-secret-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.123.0
      - name: Synchronize trusted cron credential without logging value
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${TCOS_CRON_SECRET:-}" ] || { echo 'TCOS_CRON_SECRET missing.'; exit 2; }
          printf '%s' "$TCOS_CRON_SECRET" | npx --no-install wrangler secret put TCOS_CRON_SECRET --config wrangler.jsonc
          printf '%s' "$TCOS_CRON_SECRET" | npx --no-install wrangler secret put TCOS_CRON_SECRET --config wrangler.production-route.jsonc
          echo 'TCOS_CRON_SECRET synchronized to scheduler and routed production Workers; value withheld.'
