name: Ops CollX Migration Progress Probe 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-full-classify-launch-20260811.yml"

permissions:
  contents: write

concurrency:
  group: ops-collx-migration-progress-probe-20260811
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROUTE_URL: https://truely-collectables.vercel.app/api/ops/collx-full-migration-v2-20260811
      OUT: .github/ops/collx-import-progress.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Read live migration counts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/ops
          ok=0
          for n in $(seq 1 6); do
            code="$(curl -sS -o /tmp/progress.json -w '%{http_code}' --max-time 60 "$ROUTE_URL" || true)"
            if [ "$code" = '200' ] && python3 -m json.tool /tmp/progress.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" = '1' ]; then
            python3 - <<'PY'
          import json,time
          d=json.load(open('/tmp/progress.json'))
          d['probeRecordedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          open('.github/ops/collx-import-progress.json','w').write(json.dumps(d,indent=2)+'\n')
          PY
          else
            python3 - <<'PY'
          import json,time
          open('.github/ops/collx-import-progress.json','w').write(json.dumps({'success':False,'probeError':'live route did not return HTTP 200','probeRecordedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())},indent=2)+'\n')
          PY
          fi
          cat "$OUT"
      - name: Persist read-only progress receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Truely Collectables Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'Record CollX migration progress' || true
          git push origin HEAD:main
