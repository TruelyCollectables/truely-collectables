name: Ops CollX Migration Endpoint Cleanup 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-full-classify-launch-20260811.yml"

permissions:
  contents: read

concurrency:
  group: ops-collx-migration-endpoint-cleanup-20260811
  cancel-in-progress: true

jobs:
  deploy-clean-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Deploy current clean main to Production
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 deploy --prod --force --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --build-env TCOS_RELEASE_COMMIT="$MAIN_SHA"
      - name: Prove migration endpoints are gone
        shell: bash
        run: |
          set -euo pipefail
          base='https://truelycollectables.com/api/ops'
          for route in \
            collx-full-migration-20260811 \
            collx-full-migration-v2-20260811 \
            collx-image-backfill-20260811 \
            collx-image-backfill-v2-20260811; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 "$base/$route" || true)"
            echo "$route HTTP=$code"
            test "$code" = '404'
          done
