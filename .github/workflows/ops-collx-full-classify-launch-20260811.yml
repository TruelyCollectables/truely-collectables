name: Ops CollX Full Classify Launch 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-full-classify-launch-20260811.yml"

permissions:
  contents: write

concurrency:
  group: ops-collx-full-classify-launch-20260811
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STORE_ID: 00000000-0000-4000-8000-000000000001
      WORK: /tmp/collx-full-classify
    steps:
      - name: Check out isolated migration branch
        uses: actions/checkout@v4
        with:
          ref: ops/collx-full-inventory-migration-20260811
          fetch-depth: 1

      - name: Record launch heartbeat
        shell: bash
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/ops/collx-push-classifier-heartbeat.txt
          git config user.name 'Truely Collectables Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/ops/collx-push-classifier-heartbeat.txt
          git commit -m 'Record CollX push classifier heartbeat' || true
          git push origin HEAD:ops/collx-full-inventory-migration-20260811

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full CollX classifier
        shell: bash
        run: |
          set +e
          mkdir -p "$WORK"
          bash scripts/ops/run-collx-full-classifier-20260811.sh > "$WORK/run.log" 2>&1
          code=$?
          echo "$code" > "$WORK/exit-code.txt"
          cat "$WORK/run.log"
          exit "$code"

      - name: Publish classifier result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/collx-full-inventory-migration-20260811
          git reset --hard origin/ops/collx-full-inventory-migration-20260811
          mkdir -p .github/ops
          if [ -s "$WORK/receipt.json" ]; then cp "$WORK/receipt.json" .github/ops/collx-full-classification-receipt.json; fi
          if [ -s "$WORK/classification.json" ]; then cp "$WORK/classification.json" .github/ops/collx-full-classification-result.json; fi
          if [ -s "$WORK/run.log" ]; then cp "$WORK/run.log" .github/ops/collx-full-classifier-run.log; fi
          if [ -s "$WORK/exit-code.txt" ]; then cp "$WORK/exit-code.txt" .github/ops/collx-full-classifier-exit-code.txt; fi
          python3 - <<'PY'
          import json,os,time
          from pathlib import Path
          w=Path(os.environ['WORK'])
          code=None
          try: code=int((w/'exit-code.txt').read_text().strip())
          except: pass
          out={'completed':(w/'classification.json').exists(),'receiptPresent':(w/'receipt.json').exists(),'exitCode':code,'publishedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          Path('.github/ops/collx-full-classifier-status.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name 'Truely Collectables Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/ops/collx-full-classification-receipt.json .github/ops/collx-full-classification-result.json .github/ops/collx-full-classifier-run.log .github/ops/collx-full-classifier-exit-code.txt .github/ops/collx-full-classifier-status.json 2>/dev/null || git add .github/ops/collx-full-classifier-status.json
          git commit -m 'Record full CollX migration classification diagnostics' || true
          git push origin HEAD:ops/collx-full-inventory-migration-20260811

      - name: Remove Production env copy
        if: always()
        run: rm -f "$WORK/production.env"
