name: InstaComp Explicit Base Production Repair 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-explicit-base-production-repair-20260810.yml"
      - "src/app/api/instacomp/ops/frozen-sonia-repair/route.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: instacomp-production-acceptance-global
  cancel-in-progress: false

env:
  PROOF_MAIN_SHA: 2f6599cbd9a190a02269da4a80064156c48e8a0a
  PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  FROZEN_IMAGE_ARTIFACT_ID: "8994498762"
  SONIA_INVENTORY_ID: ef0e06a3-a6de-4242-8c52-52b420185850
  SONIA_FRONT_SHA256: eaacec37493b419f1d397df739aedd9df218639ded876c481b2fb28b2b3eb2b1
  SONIA_BACK_SHA256: 3ecd070456e09342ed83ca88193ed2d029cd8a77ed5b2e2ae1ce443e9866978c
  SONIA_REGISTRY_ID: 2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f
  SONIA_REGISTRY_FINGERPRINT: 4366f96b6cf8b136e5ae4da70c35539d56e1793de0a42bcccbf970a892791e59
  EVIDENCE_DIR: evidence/instacomp-explicit-base-production-repair-20260810
  TEMP_DIR: /tmp/instacomp-explicit-base-production-repair-20260810

jobs:
  prove-and-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_HEAD_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Lock exact main plus temporary two-file ops delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROOF_HEAD_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          changed="$(git diff --name-only "$PROOF_MAIN_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/instacomp-explicit-base-production-repair-20260810.yml' \
            'src/app/api/instacomp/ops/frozen-sonia-repair/route.ts' | sort)"
          test "$changed" = "$expected"
          grep -Fq 'FROZEN_IMAGE_HASH_MISMATCH' src/app/api/instacomp/ops/frozen-sonia-repair/route.ts
          grep -Fq 'EXPECTED_REGISTRY_ID = "2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f"' src/app/api/instacomp/ops/frozen-sonia-repair/route.ts
          grep -Fq 'ACCEPTANCE_AUTH_REJECTED' src/app/api/instacomp/ops/frozen-sonia-repair/route.ts
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR/frozen"
          printf '{"proofMain":"%s","proofHead":"%s","frozenImageArtifactId":%s,"registryMutation":false,"inventoryMutation":false,"pricingMutation":false,"publishingMutation":false,"modelWeightsMutation":false,"temporaryOpsDelta":["workflow","one-card repair route"]}\n' \
            "$PROOF_MAIN_SHA" "$PROOF_HEAD_SHA" "$FROZEN_IMAGE_ARTIFACT_ID" > "$EVIDENCE_DIR/source-lock.json"

      - name: Install dependencies and link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm ci >/dev/null
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: TypeScript compile temporary route
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Download immutable frozen-five images and prove Sonia hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_IMAGE_ARTIFACT_ID}/zip" > "$TEMP_DIR/frozen.zip"
          unzip -q "$TEMP_DIR/frozen.zip" -d "$TEMP_DIR/frozen"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          test -f "$front" && test -f "$back"
          test "$(sha256sum "$front" | awk '{print $1}')" = "$SONIA_FRONT_SHA256"
          test "$(sha256sum "$back" | awk '{print $1}')" = "$SONIA_BACK_SHA256"
          cp "$TEMP_DIR/frozen/receipt.json" "$EVIDENCE_DIR/frozen-image-receipt.json"
          printf '{"frontSha256":"%s","backSha256":"%s","exact":true}\n' "$SONIA_FRONT_SHA256" "$SONIA_BACK_SHA256" > "$EVIDENCE_DIR/sonia-image-proof.json"

      - name: Prove stale acceptance credential absent
        shell: bash
        run: |
          set -euo pipefail
          list="$TEMP_DIR/env-before.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          if grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"; then
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          fi
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"

      - name: Provision isolated acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          secret="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy exact temporary proof head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROOF_HEAD_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          log="$EVIDENCE_DIR/proof-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          touch "$TEMP_DIR/proof-deployed"

      - name: Prove frozen Sonia Base locks exact Registry UUID and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$token"
          request="$TEMP_DIR/registry-request.json"
          response="$EVIDENCE_DIR/sonia-base-registry.json"
          cat > "$request" <<'JSON'
          {
            "year": "2025",
            "manufacturer": "Panini",
            "brand": "Panini Prizm WNBA",
            "setName": "Base",
            "cardNumber": "122",
            "player": "Sonia Citron",
            "parallel": "Base",
            "isAuto": false,
            "isRelic": false
          }
          JSON
          code="$(curl -sS --max-time 45 -o "$response" -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-tcos-instacomp-service-token: $token" \
            --data-binary "@$request" \
            "$PRODUCTION_ORIGIN/api/instacomp/checklist-lookup")"
          test "$code" = "200"
          SONIA_REGISTRY_ID="$SONIA_REGISTRY_ID" SONIA_REGISTRY_FINGERPRINT="$SONIA_REGISTRY_FINGERPRINT" node - "$response" <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const id=String(body.registryIdentityId||body.identityId||'').trim();
          const fp=String(body.registryFingerprintSha256||body.fingerprintSha256||'').trim().toLowerCase();
          if(body.ok!==true) throw new Error(`ok=${body.ok}`);
          if(body.status!=='exact_match') throw new Error(`status=${body.status}`);
          if(body.aiRequired!==false) throw new Error(`aiRequired=${body.aiRequired}`);
          if(body.candidateCount!==1) throw new Error(`candidateCount=${body.candidateCount}`);
          if(id!==process.env.SONIA_REGISTRY_ID) throw new Error(`identityId=${id}`);
          if(fp!==process.env.SONIA_REGISTRY_FINGERPRINT) throw new Error(`fingerprint=${fp}`);
          const locked=body.lockedFields||{};
          if(String(locked.player||'')!=='Sonia Citron') throw new Error(`player=${locked.player}`);
          if(String(locked.cardNumber||'')!=='122') throw new Error(`cardNumber=${locked.cardNumber}`);
          if(String(locked.parallel||'')!=='Base') throw new Error(`parallel=${locked.parallel}`);
          console.log(JSON.stringify({status:'passed',registryIdentityId:id,registryFingerprintSha256:fp,candidateCount:body.candidateCount},null,2));
          NODE
          touch "$TEMP_DIR/registry-proved"

      - name: Repair frozen Sonia memory through one-card internal bridge and rerun Mac analyze
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TEMP_DIR/registry-proved"
          token="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$token"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          result="$EVIDENCE_DIR/frozen-sonia-repair.json"
          code="$(curl -sS --max-time 280 -o "$result" -w '%{http_code}' -X POST \
            -H "x-tcos-instacomp-service-token: $token" \
            -F "front=@${front};type=image/jpeg" \
            -F "back=@${back};type=image/jpeg" \
            "$PRODUCTION_ORIGIN/api/instacomp/ops/frozen-sonia-repair")"
          test "$code" = "200"
          SONIA_REGISTRY_ID="$SONIA_REGISTRY_ID" SONIA_REGISTRY_FINGERPRINT="$SONIA_REGISTRY_FINGERPRINT" node - "$result" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(b.ok!==true) throw new Error(`ok=${b.ok} code=${b.code||''} error=${b.error||''}`);
          if(b.registry?.identityId!==process.env.SONIA_REGISTRY_ID) throw new Error(`registry=${b.registry?.identityId}`);
          if(String(b.registry?.fingerprintSha256||'').toLowerCase()!==process.env.SONIA_REGISTRY_FINGERPRINT) throw new Error('registry fingerprint mismatch');
          if(b.lesson?.trusted!==true||b.lesson?.state!=='operator_confirmed') throw new Error('corrected lesson not trusted');
          if(b.analyze?.status!=='trusted_memory_match'||b.analyze?.matchSource!=='exact_image_pair') throw new Error(`analyze=${b.analyze?.status}/${b.analyze?.matchSource}`);
          if(b.analyze?.pricingAllowed!==true||b.analyze?.learningAllowed!==true) throw new Error('pricing/learning gate not open');
          if(b.analyze?.checklistOutcome!=='exact_match'||b.analyze?.registryIdentityId!==process.env.SONIA_REGISTRY_ID) throw new Error('Mac Registry exact lock missing');
          if(b.analyze?.identity?.player!=='Sonia Citron'||b.analyze?.identity?.card_number!=='122'||b.analyze?.identity?.parallel!=='Base') throw new Error('trusted Base identity mismatch');
          if(b.nothingPublished!==true||b.inventoryMutation!==false||b.pricingMutation!==false||b.modelWeightsMutation!==false) throw new Error('mutation boundary violated');
          console.log(JSON.stringify({status:'passed',lesson:b.lesson,analyze:b.analyze,nothingPublished:b.nothingPublished},null,2));
          NODE
          touch "$TEMP_DIR/mac-scan-passed"

      - name: Remove isolated acceptance credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          list="$TEMP_DIR/env-after.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"
          touch "$TEMP_DIR/token-removed"

      - name: Clean redeploy current main without proof route or credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/proof-deployed" ]; then exit 0; fi
          test -f "$TEMP_DIR/token-removed"
          git fetch --no-tags --depth=1 origin main
          git checkout --detach origin/main
          clean_sha="$(git rev-parse HEAD)"
          test ! -f src/app/api/instacomp/ops/frozen-sonia-repair/route.ts
          log="$EVIDENCE_DIR/clean-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          code="$(curl -sS --max-time 30 -o "$EVIDENCE_DIR/temporary-route-after-cleanup.txt" -w '%{http_code}' -X POST "$PRODUCTION_ORIGIN/api/instacomp/ops/frozen-sonia-repair")"
          test "$code" = "404"
          printf '{"clean":true,"deployedMain":"%s","acceptanceCredentialPresent":false,"temporaryRepairRoutePresent":false,"correctedMacLessonPersists":true}\n' "$clean_sha" > "$EVIDENCE_DIR/cleanup-proof.json"
          touch "$TEMP_DIR/clean-redeployed"

      - name: Final pass marker
        if: always()
        shell: bash
        run: |
          if [ -f "$TEMP_DIR/registry-proved" ] && [ -f "$TEMP_DIR/mac-scan-passed" ] && [ -f "$TEMP_DIR/token-removed" ] && [ -f "$TEMP_DIR/clean-redeployed" ]; then
            printf '{"status":"passed","registryExact":true,"correctedLessonCreated":true,"directMacAnalyze200":true,"temporaryRouteRemoved":true,"acceptanceCredentialRemoved":true,"nothingPublished":true}\n' > "$EVIDENCE_DIR/final.json"
          else
            printf '{"status":"incomplete_or_failed","registryExact":%s,"correctedLessonCreated":%s,"directMacAnalyze200":%s,"temporaryRouteRemoved":%s,"acceptanceCredentialRemoved":%s,"nothingPublished":true}\n' \
              "$([ -f "$TEMP_DIR/registry-proved" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/mac-scan-passed" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/mac-scan-passed" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/clean-redeployed" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/token-removed" ] && echo true || echo false)" > "$EVIDENCE_DIR/final.json"
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-explicit-base-production-repair-20260810
          path: evidence/instacomp-explicit-base-production-repair-20260810
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR" .env.local .env.production.local
