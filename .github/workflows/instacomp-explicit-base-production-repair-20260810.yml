name: InstaComp Explicit Base Production Repair 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-explicit-base-production-repair-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: instacomp-production-acceptance-global
  cancel-in-progress: false

env:
  PROOF_MAIN_SHA: 2f6599cbd9a190a02269da4a80064156c48e8a0a
  CANONICAL_MAC_URL: https://instacomp.truelycollectables.com
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_ORIGIN: https://truelycollectables.com
  FROZEN_IMAGE_ARTIFACT_ID: "8994498762"
  SONIA_INVENTORY_ID: ef0e06a3-a6de-4242-8c52-52b420185850
  SONIA_FRONT_SHA256: eaacec37493b419f1d397df739aedd9df218639ded876c481b2fb28b2b3eb2b1
  SONIA_BACK_SHA256: 3ecd070456e09342ed83ca88193ed2d029cd8a77ed5b2e2ae1ce443e9866978c
  SONIA_NORMALIZED_FRONT_SHA256: 9dac4f6e94ff5d2180c0dda73008ec46f214dfde2cd59314493186ce1b5dc46d
  SONIA_NORMALIZED_BACK_SHA256: 5feb7d055f8ba36c6b8f6e8ad9622d1587d1267614d9ce9c2bfb841f04ff20e8
  SONIA_REGISTRY_ID: 2a7d4ddd-e9f7-4ce2-904c-b1a17b33ae4f
  SONIA_REGISTRY_FINGERPRINT: 4366f96b6cf8b136e5ae4da70c35539d56e1793de0a42bcccbf970a892791e59
  EVIDENCE_DIR: evidence/instacomp-explicit-base-production-repair-20260810
  TEMP_DIR: /tmp/instacomp-explicit-base-production-repair-20260810

jobs:
  prove-and-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_MAIN_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Lock exact merged source and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROOF_MAIN_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR" "$TEMP_DIR/frozen"
          grep -Fq 'return "base";' src/lib/instacomp-checklist-first.ts
          grep -Fq 'Explicit Base is real' src/lib/instacomp-checklist-first.ts
          printf '{"proofMain":"%s","frozenImageArtifactId":%s,"registryMutation":false,"inventoryMutation":false,"pricingMutation":false,"publishingMutation":false,"intendedMacMutation":"one corrected operator-confirmed lesson for exact frozen Sonia image pair"}\n' "$PROOF_MAIN_SHA" "$FROZEN_IMAGE_ARTIFACT_ID" > "$EVIDENCE_DIR/source-lock.json"

      - name: Install and link Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm ci >/dev/null
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull "$TEMP_DIR/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Recover existing Mac credential privately
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_ENV_PATH="$TEMP_DIR/production.env" RUNTIME_ENV_PATH="$TEMP_DIR/runtime-env.sh" CANONICAL_MAC_URL="$CANONICAL_MAC_URL" node - <<'NODE'
          const fs=require('node:fs');
          const p={};
          for(const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH,'utf8').split(/\r?\n/)){
            const line=raw.trim(); if(!line||line.startsWith('#')) continue;
            const i=line.indexOf('='); if(i<1) continue;
            const k=line.slice(0,i).trim(); let v=line.slice(i+1).trim();
            if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}
            else if(v.startsWith("'")&&v.endsWith("'")) v=v.slice(1,-1);
            p[k]=v;
          }
          const localUrl=String(process.env.CANONICAL_MAC_URL||'').trim().replace(/\/+$/,'');
          const localKey=String(p.INSTACOMP_AI_LOCAL_KEY||'').trim();
          if(localUrl!=='https://instacomp.truelycollectables.com') throw new Error('Canonical Mac tunnel contract changed');
          if(!/^[0-9a-fA-F]{64}$/.test(localKey)) throw new Error('Production INSTACOMP_AI_LOCAL_KEY is not the expected 256-bit key');
          console.log(`::add-mask::${localKey}`);
          fs.writeFileSync(process.env.RUNTIME_ENV_PATH,[
            `export INSTACOMP_AI_LOCAL_URL=${JSON.stringify(localUrl)}`,
            `export INSTACOMP_AI_LOCAL_KEY=${JSON.stringify(localKey)}`,
            ''
          ].join('\n'),{mode:0o600});
          console.log('PASS existing synchronized Mac credential recovered privately');
          NODE

      - name: Download immutable frozen-five images and prove Sonia hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_IMAGE_ARTIFACT_ID}/zip" > "$TEMP_DIR/frozen.zip"
          unzip -q "$TEMP_DIR/frozen.zip" -d "$TEMP_DIR/frozen"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          test -f "$front" && test -f "$back"
          test "$(sha256sum "$front" | awk '{print $1}')" = "$SONIA_FRONT_SHA256"
          test "$(sha256sum "$back" | awk '{print $1}')" = "$SONIA_BACK_SHA256"
          cp "$TEMP_DIR/frozen/receipt.json" "$EVIDENCE_DIR/frozen-image-receipt.json"
          printf '{"frontSha256":"%s","backSha256":"%s","exact":true}\n' "$SONIA_FRONT_SHA256" "$SONIA_BACK_SHA256" > "$EVIDENCE_DIR/sonia-image-proof.json"

      - name: Prove stale acceptance credential absent
        shell: bash
        run: |
          set -euo pipefail
          list="$TEMP_DIR/env-before.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          if grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"; then
            npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          fi
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"

      - name: Provision isolated acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$TEMP_DIR/acceptance-token"
          chmod 600 "$TEMP_DIR/acceptance-token"
          secret="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$secret"
          npx --yes vercel@56.2.0 env add INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$TEMP_DIR/acceptance-token" >/dev/null
          touch "$TEMP_DIR/token-provisioned"

      - name: Deploy exact merged explicit-Base fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$PROOF_MAIN_SHA"
          log="$EVIDENCE_DIR/proof-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          touch "$TEMP_DIR/proof-deployed"

      - name: Prove frozen Sonia Base locks exact Registry UUID and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$TEMP_DIR/acceptance-token")"
          echo "::add-mask::$token"
          request="$TEMP_DIR/registry-request.json"
          response="$EVIDENCE_DIR/sonia-base-registry.json"
          cat > "$request" <<'JSON'
          {
            "year": "2025",
            "manufacturer": "Panini",
            "brand": "Panini Prizm WNBA",
            "setName": "Base",
            "cardNumber": "122",
            "player": "Sonia Citron",
            "parallel": "Base",
            "isAuto": false,
            "isRelic": false
          }
          JSON
          code="$(curl -sS --max-time 45 -o "$response" -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-tcos-instacomp-service-token: $token" \
            --data-binary "@$request" \
            "$PRODUCTION_ORIGIN/api/instacomp/checklist-lookup")"
          test "$code" = "200"
          SONIA_REGISTRY_ID="$SONIA_REGISTRY_ID" SONIA_REGISTRY_FINGERPRINT="$SONIA_REGISTRY_FINGERPRINT" node - "$response" <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const id=String(body.registryIdentityId||body.identityId||'').trim();
          const fp=String(body.registryFingerprintSha256||body.fingerprintSha256||'').trim().toLowerCase();
          if(body.ok!==true) throw new Error(`ok=${body.ok}`);
          if(body.status!=='exact_match') throw new Error(`status=${body.status}`);
          if(body.aiRequired!==false) throw new Error(`aiRequired=${body.aiRequired}`);
          if(body.candidateCount!==1) throw new Error(`candidateCount=${body.candidateCount}`);
          if(id!==process.env.SONIA_REGISTRY_ID) throw new Error(`identityId=${id}`);
          if(fp!==process.env.SONIA_REGISTRY_FINGERPRINT) throw new Error(`fingerprint=${fp}`);
          const locked=body.lockedFields||{};
          for(const [k,v] of [['player','Sonia Citron'],['cardNumber','122'],['parallel','Base']]){
            if(String(locked[k]??'')!==v) throw new Error(`${k}=${locked[k]}`);
          }
          console.log(JSON.stringify({status:'passed',registryIdentityId:id,registryFingerprintSha256:fp,candidateCount:body.candidateCount,identificationPath:body.identificationPath},null,2));
          NODE
          touch "$TEMP_DIR/registry-proved"

      - name: Read current Mac runtime and stale Sonia memory before correction
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TEMP_DIR/registry-proved"
          source "$TEMP_DIR/runtime-env.sh"
          curl -fsS --max-time 30 "$INSTACOMP_AI_LOCAL_URL/v1/runtime-identity" > "$EVIDENCE_DIR/mac-runtime-before.json"
          curl -fsS --max-time 30 -H "X-InstaComp-AI-Key: $INSTACOMP_AI_LOCAL_KEY" \
            --get --data-urlencode 'player=Sonia Citron' --data-urlencode 'year=2025' \
            --data-urlencode 'set_name=Base' --data-urlencode 'card_number=122' \
            --data-urlencode 'parallel=Orange Cracked Ice Prizm' --data-urlencode 'limit=10' \
            "$INSTACOMP_AI_LOCAL_URL/v1/lessons/search" > "$EVIDENCE_DIR/sonia-memory-before.json"

      - name: Archive exact frozen pair without identity and add corrected operator lesson
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TEMP_DIR/registry-proved"
          source "$TEMP_DIR/runtime-env.sh"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          archive="$EVIDENCE_DIR/sonia-supervised-archive.json"
          code="$(curl -sS --max-time 90 -o "$archive" -w '%{http_code}' -X POST \
            -H "X-InstaComp-AI-Key: $INSTACOMP_AI_LOCAL_KEY" \
            -F "front=@${front};type=image/jpeg" \
            -F "back=@${back};type=image/jpeg" \
            "$INSTACOMP_AI_LOCAL_URL/v1/scans/supervised-archive")"
          test "$code" = "200"
          SONIA_NORMALIZED_FRONT_SHA256="$SONIA_NORMALIZED_FRONT_SHA256" SONIA_NORMALIZED_BACK_SHA256="$SONIA_NORMALIZED_BACK_SHA256" node - "$archive" "$TEMP_DIR/lesson-request.json" <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!a.scan_id) throw new Error('supervised archive missing scan_id');
          if(a.identity_created!==false||a.nothing_published!==true) throw new Error('supervised archive crossed identity/publishing boundary');
          if(String(a.front_sha256||'')!==process.env.SONIA_NORMALIZED_FRONT_SHA256) throw new Error(`normalized front hash=${a.front_sha256}`);
          if(String(a.back_sha256||'')!==process.env.SONIA_NORMALIZED_BACK_SHA256) throw new Error(`normalized back hash=${a.back_sha256}`);
          const lesson={
            scan_id:a.scan_id,
            state:'operator_confirmed',
            identity:{
              sport:'Basketball',
              year:'2025',
              manufacturer:'Panini',
              brand:'Prizm',
              set_name:'Base',
              player:'Sonia Citron',
              team:'Washington Mystics',
              card_number:'122',
              parallel:'Base',
              autograph:false,
              memorabilia:false
            },
            verification_source:`frozen_acceptance_v8_registry:${process.env.SONIA_REGISTRY_ID}`,
            operator_id:'tcos_frozen_truth_repair_20260810',
            notes:`Corrected exact frozen-image trusted memory after Production Registry locked canonical Base UUID ${process.env.SONIA_REGISTRY_ID} fingerprint ${process.env.SONIA_REGISTRY_FINGERPRINT}. No inventory, pricing, or publishing mutation.`,
            rejected_identity:{
              year:'2025',
              manufacturer:'Panini',
              brand:'Panini Prizm WNBA',
              set_name:'Base',
              player:'Sonia Citron',
              card_number:'122',
              parallel:'Orange Cracked Ice Prizm'
            }
          };
          fs.writeFileSync(process.argv[3],JSON.stringify(lesson));
          NODE
          lesson="$EVIDENCE_DIR/sonia-corrected-lesson.json"
          code="$(curl -sS --max-time 45 -o "$lesson" -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-InstaComp-AI-Key: $INSTACOMP_AI_LOCAL_KEY" \
            --data-binary "@$TEMP_DIR/lesson-request.json" \
            "$INSTACOMP_AI_LOCAL_URL/v1/lessons")"
          test "$code" = "200"
          node - "$lesson" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(b.state!=='operator_confirmed'||b.trusted!==true) throw new Error(`lesson state/trust ${b.state}/${b.trusted}`);
          if(b.identity?.player!=='Sonia Citron'||b.identity?.card_number!=='122'||b.identity?.parallel!=='Base') throw new Error('corrected lesson identity mismatch');
          if(b.rejected_identity?.parallel!=='Orange Cracked Ice Prizm') throw new Error('rejected stale identity not recorded');
          console.log(JSON.stringify({lesson_id:b.lesson_id,scan_id:b.scan_id,state:b.state,trusted:b.trusted,identity:b.identity,rejected_identity:b.rejected_identity,training_example_id:b.training_example_id},null,2));
          NODE
          touch "$TEMP_DIR/lesson-corrected"

      - name: Re-run exact frozen Sonia through unchanged live Mac analyze path
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TEMP_DIR/lesson-corrected"
          source "$TEMP_DIR/runtime-env.sh"
          front="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-front.jpg"
          back="$TEMP_DIR/frozen/01-${SONIA_INVENTORY_ID}-back.jpg"
          result="$EVIDENCE_DIR/sonia-direct-mac-after-correction.json"
          code="$(curl -sS --max-time 180 -o "$result" -w '%{http_code}' -X POST \
            -H "X-InstaComp-AI-Key: $INSTACOMP_AI_LOCAL_KEY" \
            -F "front=@${front};type=image/jpeg" \
            -F "back=@${back};type=image/jpeg" \
            "$INSTACOMP_AI_LOCAL_URL/v1/scans/analyze")"
          test "$code" = "200"
          SONIA_REGISTRY_ID="$SONIA_REGISTRY_ID" SONIA_REGISTRY_FINGERPRINT="$SONIA_REGISTRY_FINGERPRINT" node - "$result" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(b.status!=='trusted_memory_match') throw new Error(`status=${b.status}`);
          if(b.match_source!=='exact_image_pair') throw new Error(`match_source=${b.match_source}`);
          if(b.pricing_allowed!==true||b.learning_allowed!==true) throw new Error(`pricing/learning=${b.pricing_allowed}/${b.learning_allowed}`);
          if(b.trusted_identity?.player!=='Sonia Citron'||b.trusted_identity?.card_number!=='122'||b.trusted_identity?.parallel!=='Base') throw new Error('trusted identity mismatch');
          if(b.checklist?.outcome!=='exact_match') throw new Error(`checklist=${b.checklist?.outcome}`);
          if(String(b.checklist?.identity_id||'')!==process.env.SONIA_REGISTRY_ID) throw new Error(`identity_id=${b.checklist?.identity_id}`);
          const receipts=Array.isArray(b.checklist?.source_receipts)?b.checklist.source_receipts:[];
          if(!receipts.includes(`registry_fingerprint:${process.env.SONIA_REGISTRY_FINGERPRINT}`)) throw new Error('exact Registry fingerprint receipt missing');
          console.log(JSON.stringify({status:b.status,match_source:b.match_source,pricing_allowed:b.pricing_allowed,identity:b.trusted_identity,registryIdentityId:b.checklist.identity_id,sourceReceipts:receipts,localVisionPresent:Boolean(b.local_vision)},null,2));
          NODE
          touch "$TEMP_DIR/mac-scan-passed"

      - name: Remove isolated acceptance credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/token-provisioned" ]; then exit 0; fi
          npx --yes vercel@56.2.0 env rm INSTACOMP_ACCEPTANCE_SERVICE_TOKEN production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          list="$TEMP_DIR/env-after.txt"
          npx --yes vercel@56.2.0 env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" > "$list"
          ! grep -Eq '(^|[[:space:]])INSTACOMP_ACCEPTANCE_SERVICE_TOKEN([[:space:]]|$)' "$list"
          rm -f "$list"
          touch "$TEMP_DIR/token-removed"

      - name: Clean redeploy current main without proof credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$TEMP_DIR/proof-deployed" ]; then exit 0; fi
          test -f "$TEMP_DIR/token-removed"
          git fetch --no-tags --depth=1 origin main
          git checkout --detach origin/main
          clean_sha="$(git rev-parse HEAD)"
          log="$EVIDENCE_DIR/clean-deploy.log"
          npx --yes vercel@56.2.0 deploy --prod --yes --force --archive=tgz --no-color --cwd "$GITHUB_WORKSPACE" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 | tee "$log"
          printf '{"clean":true,"deployedMain":"%s","acceptanceCredentialPresent":false,"macLessonCorrectionPersists":true}\n' "$clean_sha" > "$EVIDENCE_DIR/cleanup-proof.json"

      - name: Final pass marker
        if: always()
        shell: bash
        run: |
          if [ -f "$TEMP_DIR/mac-scan-passed" ] && [ -f "$TEMP_DIR/token-removed" ]; then
            printf '{"status":"passed","registryExact":true,"correctedLessonCreated":true,"directMacAnalyze200":true,"nothingPublished":true}\n' > "$EVIDENCE_DIR/final.json"
          else
            printf '{"status":"incomplete_or_failed","registryExact":%s,"correctedLessonCreated":%s,"directMacAnalyze200":%s,"nothingPublished":true}\n' \
              "$([ -f "$TEMP_DIR/registry-proved" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/lesson-corrected" ] && echo true || echo false)" \
              "$([ -f "$TEMP_DIR/mac-scan-passed" ] && echo true || echo false)" > "$EVIDENCE_DIR/final.json"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-explicit-base-production-repair-20260810
          path: evidence/instacomp-explicit-base-production-repair-20260810
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary files
        if: always()
        shell: bash
        run: rm -rf "$TEMP_DIR" .env.local .env.production.local
