name: Fix InstaComp Vercel archive deploy

on:
  push:
    branches:
      - fix/instacomp-vercel-archive-deploy-20260808
  pull_request:
    branches:
      - main
    paths:
      - services/instacomp-ai/scripts/update-live-from-main.sh
      - .github/workflows/fix-instacomp-vercel-archive-deploy-20260808.yml

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch updater to use Vercel archive mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/instacomp-ai/scripts/update-live-from-main.sh')
          s = p.read_text('utf-8')
          old = 'npx vercel --prod --yes --cwd "$repo_root"'
          new = 'npx vercel --prod --yes --archive=tgz --cwd "$repo_root"'
          if new in s:
              print('Archive deploy already present')
          else:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one Vercel production deploy command, found {count}')
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Shell syntax check
        run: bash -n services/instacomp-ai/scripts/update-live-from-main.sh

      - name: Certify archive deploy contract
        run: |
          grep -F 'npx vercel --prod --yes --archive=tgz --cwd "$repo_root"' services/instacomp-ai/scripts/update-live-from-main.sh
          if grep -F 'npx vercel --prod --yes --cwd "$repo_root"' services/instacomp-ai/scripts/update-live-from-main.sh; then
            echo 'Unarchived production deploy command still present' >&2
            exit 1
          fi

      - name: Commit runtime fix on branch push
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- services/instacomp-ai/scripts/update-live-from-main.sh; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/instacomp-ai/scripts/update-live-from-main.sh
          git commit -m 'Fix InstaComp Mac updater Vercel archive deploy'
          git push
