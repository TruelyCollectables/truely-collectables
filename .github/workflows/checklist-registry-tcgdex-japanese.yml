name: Checklist Registry TCGdex Japanese

on:
  pull_request:
    paths:
      - "src/lib/checklist-registry/tcgdex-japanese.ts"
      - "src/lib/checklist-registry/server.ts"
      - "scripts/build-tcgdex-japanese-registry-bundles.ts"
      - "scripts/import-tcgdex-japanese-registry-bundles.ts"
      - "scripts/run-checklist-registry-tcgdex-japanese-simulations.ts"
      - "scripts/fixtures/checklist-registry/tcgdex-japanese-set-bundle.fixture.json"
      - ".github/workflows/checklist-registry-tcgdex-japanese.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/checklist-registry/tcgdex-japanese.ts"
      - "src/lib/checklist-registry/server.ts"
      - "scripts/build-tcgdex-japanese-registry-bundles.ts"
      - "scripts/import-tcgdex-japanese-registry-bundles.ts"
      - "scripts/run-checklist-registry-tcgdex-japanese-simulations.ts"
      - "scripts/fixtures/checklist-registry/tcgdex-japanese-set-bundle.fixture.json"
      - ".github/workflows/checklist-registry-tcgdex-japanese.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tcgdex-japanese-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load builder command
        run: npx tsx scripts/build-tcgdex-japanese-registry-bundles.ts --help

      - name: Run Japanese base-card adapter simulation
        run: npx tsx scripts/run-checklist-registry-tcgdex-japanese-simulations.ts

      - name: Validate Japanese fixture without database writes
        run: >-
          npx tsx scripts/import-tcgdex-japanese-registry-bundles.ts
          scripts/fixtures/checklist-registry/tcgdex-japanese-set-bundle.fixture.json
          --receipt .codex-run/tcgdex-ja-fixture-validation-receipt.json

      - name: Check out current TCGdex source
        run: >-
          git clone --depth 1
          https://github.com/tcgdex/cards-database.git
          .codex-run/tcgdex-cards-database

      - name: Build complete Japanese set bundles from TCGdex
        run: >-
          npx tsx scripts/build-tcgdex-japanese-registry-bundles.ts
          .codex-run/tcgdex-cards-database
          .codex-run/tcgdex-ja-registry-bundles
          --receipt .codex-run/tcgdex-ja-build-receipt.json

      - name: Verify builder and source-gap receipt
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/tcgdex-ja-build-receipt.json');
          if (receipt.failedSets !== 0) throw new Error(`Japanese builder failures: ${receipt.failedSets}`);
          if (receipt.builtSets < 1) throw new Error('Japanese builder produced no complete sets');
          if (receipt.totals.cards < 1) throw new Error('Japanese builder produced no cards');
          console.log(JSON.stringify({
            discoveredSetDefinitions: receipt.discoveredSetDefinitions,
            builtSets: receipt.builtSets,
            incompleteJapaneseSets: receipt.incompleteJapaneseSets,
            skippedNonJapaneseSets: receipt.skippedNonJapaneseSets,
            cards: receipt.totals.cards,
            variantEvidence: receipt.totals.variantEvidence,
            missingJapaneseCardNames: receipt.totals.missingJapaneseCardNames,
            failedSets: receipt.failedSets,
          }, null, 2));
          NODE

      - name: Validate every complete Japanese bundle
        run: >-
          npx tsx scripts/import-tcgdex-japanese-registry-bundles.ts
          .codex-run/tcgdex-ja-registry-bundles
          --continue-on-error
          --receipt .codex-run/tcgdex-ja-full-validation-receipt.json

      - name: Verify complete validation receipt
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/tcgdex-ja-full-validation-receipt.json');
          if (receipt.failedFiles !== 0) throw new Error(`Japanese validation failures: ${receipt.failedFiles}`);
          if (receipt.successfulFiles !== receipt.attemptedFiles) throw new Error('Not every complete Japanese bundle validated');
          console.log(JSON.stringify({
            attemptedFiles: receipt.attemptedFiles,
            successfulFiles: receipt.successfulFiles,
            failedFiles: receipt.failedFiles,
            totals: receipt.totals,
          }, null, 2));
          NODE
