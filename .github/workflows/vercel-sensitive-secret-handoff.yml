name: Vercel Sensitive Secret Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/vercel-sensitive-secret-handoff-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-vercel-sensitive-secret-handoff
  cancel-in-progress: false

jobs:
  handoff:
    name: Stage Vercel Production and migrate sensitive values to Cloudflare preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_PROJECT_NAME: truely-collectables
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PREVIEW_WORKER: truely-collectables-preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require account credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in VERCEL_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 2
          fi

      - name: Install migration tooling
        run: npm install --no-save --package-lock=false vercel@58.10.0 wrangler@4.122.0 dotenv@latest

      - name: Link only the Truely Vercel project
        shell: bash
        run: |
          set -euo pipefail
          npx vercel link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color >/dev/null
          rm -f .env.local .env.production.local

      - name: Stage Production without assigning any domains and migrate secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          npx vercel env pull /tmp/vercel-production-names.env \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --yes \
            --no-color >/dev/null

          EXPORT_KEY=$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")
          echo "::add-mask::$EXPORT_KEY"

          DEPLOYMENT_URL=$(npx vercel deploy \
            --prod \
            --skip-domain \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --env "TCOS_CF_SECRET_EXPORT_KEY=$EXPORT_KEY" \
            --no-color)

          if ! printf '%s' "$DEPLOYMENT_URL" | grep -qE '^https://[^[:space:]]+\.vercel\.app$'; then
            echo 'Staged Vercel deployment did not return a valid deployment URL.'
            exit 3
          fi
          echo "Staged Production deployment created without domain assignment: $DEPLOYMENT_URL"

          export EXPORT_KEY DEPLOYMENT_URL
          node <<'NODE'
          const fs = require('node:fs');
          const dotenv = require('dotenv');
          const parsed = dotenv.parse(fs.readFileSync('/tmp/vercel-production-names.env'));
          const platformPrefixes = ['VERCEL_', 'AWS_', 'GITHUB_', 'ACTIONS_', 'RUNNER_'];
          const platformExact = new Set([
            'PATH', 'HOME', 'PWD', 'OLDPWD', 'SHELL', 'USER', 'LOGNAME', 'HOSTNAME',
            'NODE_ENV', 'NODE_VERSION', 'NPM_CONFIG_PREFIX', 'NPM_CONFIG_USERCONFIG',
            'NX_DAEMON', 'TURBO_CACHE', 'TURBO_DOWNLOAD_LOCAL_ENABLED',
            'TURBO_REMOTE_ONLY', 'TURBO_RUN_SUMMARY',
          ]);
          const names = Object.keys(parsed)
            .filter((name) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(name))
            .filter((name) => !platformPrefixes.some((prefix) => name.startsWith(prefix)))
            .filter((name) => !platformExact.has(name))
            .filter((name) => name !== 'TCOS_CF_SECRET_EXPORT_KEY')
            .sort();
          fs.writeFileSync('/tmp/export-request.json', JSON.stringify({ names }), { mode: 0o600 });
          console.log(`Requesting encrypted handoff for ${names.length} configured application variable name(s).`);
          NODE

          curl --fail-with-body --silent --show-error --max-time 30 \
            "$DEPLOYMENT_URL/api/internal/cloudflare-secret-export" \
            -X POST \
            -H "Authorization: Bearer $EXPORT_KEY" \
            -H 'X-TCOS-Secret-Export-Confirm: truely-cloudflare-cutover-v1' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/export-request.json \
            -o /tmp/encrypted-export.json

          node <<'NODE'
          const fs = require('node:fs');
          const { createDecipheriv, createHash } = require('node:crypto');

          const keyMaterial = String(process.env.EXPORT_KEY || '');
          if (keyMaterial.length < 32) throw new Error('One-time export key is unavailable.');

          const envelope = JSON.parse(fs.readFileSync('/tmp/encrypted-export.json', 'utf8'));
          if (!envelope?.ok || envelope?.version !== 1 || envelope?.algorithm !== 'aes-256-gcm') {
            throw new Error('Staged deployment returned an invalid encrypted export envelope.');
          }

          const key = createHash('sha256').update(keyMaterial, 'utf8').digest();
          const decipher = createDecipheriv('aes-256-gcm', key, Buffer.from(envelope.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
          const plaintext = Buffer.concat([
            decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
            decipher.final(),
          ]).toString('utf8');
          const payload = JSON.parse(plaintext);
          const values = payload?.values && typeof payload.values === 'object' ? payload.values : {};

          const cleaned = {};
          for (const [name, rawValue] of Object.entries(values)) {
            const value = String(rawValue ?? '');
            if (!value) continue;
            console.log(`::add-mask::${value}`);
            cleaned[name] = value;
          }

          const criticalGroups = [
            ['NEXT_PUBLIC_SUPABASE_URL'],
            ['NEXT_PUBLIC_SUPABASE_ANON_KEY'],
            ['SUPABASE_SERVICE_ROLE_KEY'],
            ['NEXT_PUBLIC_SITE_URL'],
            ['ADMIN_PASSWORD'],
            ['ADMIN_SESSION_SECRET'],
            ['EBAY_CLIENT_ID'],
            ['EBAY_CLIENT_SECRET'],
            ['EBAY_ENVIRONMENT'],
            ['RESEND_API_KEY'],
            ['STRIPE_LIVE_SECRET_KEY', 'STRIPE_SECRET_KEY'],
            ['STRIPE_LIVE_WEBHOOK_SECRET', 'STRIPE_WEBHOOK_SECRET'],
            ['NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY'],
            ['INSTACOMP_AI_LOCAL_URL'],
            ['INSTACOMP_AI_LOCAL_KEY'],
          ];
          const missingGroups = criticalGroups.filter(
            (group) => !group.some((name) => String(cleaned[name] || '').trim()),
          );
          if (missingGroups.length) {
            console.error(`Staged Production runtime did not expose critical application secret group(s): ${missingGroups.map((group) => group.join('|')).join(', ')}`);
            process.exit(4);
          }

          fs.writeFileSync('/tmp/cloudflare-migrated-secrets.json', JSON.stringify(cleaned), { mode: 0o600 });
          const unavailable = Array.isArray(envelope.unavailableNames) ? envelope.unavailableNames : [];
          console.log(`Encrypted Vercel runtime handoff recovered ${Object.keys(cleaned).length} application variable(s).`);
          console.log(`Configured names unavailable at staged runtime (${unavailable.length}): ${unavailable.join(', ') || '(none)'}`);
          NODE

          npx wrangler secret bulk /tmp/cloudflare-migrated-secrets.json \
            --name "$CF_PREVIEW_WORKER"

          echo 'Sensitive Production values migrated to the isolated Cloudflare preview Worker.'

      - name: Clean encrypted and plaintext migration material
        if: always()
        shell: bash
        run: |
          rm -f \
            /tmp/vercel-production-names.env \
            /tmp/export-request.json \
            /tmp/encrypted-export.json \
            /tmp/cloudflare-migrated-secrets.json \
            .env.local \
            .env.production.local
