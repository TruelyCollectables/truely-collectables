name: Patch Admin Audits For KINGMAKER Split 20260809

on:
  push:
    branches:
      - fix/kingmaker-certify-current-head-20260809
    paths:
      - ".github/workflows/patch-admin-audits-kingmaker-split-20260809.yml"

permissions:
  contents: write

jobs:
  patch-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-certify-current-head-20260809
          fetch-depth: 0

      - name: Patch audit contracts for Admin architecture split
        run: |
          set -euo pipefail
          python3 scripts/patch-admin-audits-for-kingmaker-split.py
          git diff --check

      - name: Persist migrated audit contracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-admin-dashboard-actions-simulations.mjs scripts/check-production-guardrails.mjs
          if git diff --cached --quiet; then
            echo "Audit contracts already migrated."
          else
            git commit -m "Align admin audits with KINGMAKER architecture split [skip ci]"
            git push origin HEAD:fix/kingmaker-certify-current-head-20260809
          fi
