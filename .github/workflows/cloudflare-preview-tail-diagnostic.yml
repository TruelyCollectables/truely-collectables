name: Cloudflare Preview Tail Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-preview-tail-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BASE_URL: https://truely-collectables-preview.truelycollectables.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler for live tail
        run: npm install --global wrangler@4.122.0

      - name: Tail Worker while probing preview
        shell: bash
        run: |
          set -u
          rm -f tail.log

          timeout 55s wrangler tail truely-collectables-preview --format json >tail.log 2>&1 &
          tail_pid=$!
          sleep 5

          probe() {
            local label="$1"
            local path="$2"
            local seconds="$3"
            local body headers
            body=$(mktemp)
            headers=$(mktemp)
            echo "=== ${label}: ${path} ==="
            curl -sS --max-time "$seconds" -D "$headers" -o "$body" -w 'HTTP %{http_code} total=%{time_total}s\n' "${BASE_URL}${path}" || true
            head -n 20 "$headers" || true
            if [ -s "$body" ]; then
              echo 'Body first 300 bytes:'
              head -c 300 "$body" || true
              echo
            fi
            rm -f "$body" "$headers"
          }

          probe 'static middleware bypass' '/favicon.ico' 5
          probe 'cron middleware exempt' '/api/cron/profit-hunter' 6
          probe 'Stripe webhook middleware exempt GET' '/api/stripe/webhook' 6
          probe 'protected API through middleware' '/api/ebay/test' 6
          probe 'public admin through middleware' '/admin/login' 8
          probe 'Supabase-backed homepage' '/' 10

          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          echo '=== wrangler tail output ==='
          cat tail.log || true
