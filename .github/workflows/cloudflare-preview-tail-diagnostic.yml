name: Cloudflare Preview Tail Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-preview-tail-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BASE_URL: https://truely-collectables-preview.truelycollectables.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tail Worker while probing preview
        shell: bash
        run: |
          set -u
          rm -f tail.log root.headers root.body favicon.headers favicon.body

          timeout 40s npx --yes wrangler@latest tail truely-collectables-preview --format json >tail.log 2>&1 &
          tail_pid=$!
          sleep 8

          echo '=== favicon probe (middleware bypass) ==='
          curl -sS --max-time 8 -D favicon.headers -o favicon.body -w 'HTTP %{http_code} total=%{time_total}s\n' "${BASE_URL}/favicon.ico" || true
          head -n 20 favicon.headers || true

          echo '=== root probe ==='
          curl -sS --max-time 15 -D root.headers -o root.body -w 'HTTP %{http_code} total=%{time_total}s\n' "${BASE_URL}/" || true
          head -n 30 root.headers || true
          if [ -s root.body ]; then
            echo 'Root body first 500 bytes:'
            head -c 500 root.body || true
            echo
          fi

          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          echo '=== wrangler tail output ==='
          cat tail.log || true
