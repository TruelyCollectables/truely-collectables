name: Guarded ESLint Audit Remediation 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/guarded-eslint-audit-remediation-20260729.yml"
      - "package.json"
      - "package-lock.json"
      - "vendor/brace-expansion-compat/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-eslint-audit-remediation-20260729
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 7765f115d44e2629d47cc38871273dacdafcb8e7
  EXPECTED_BRANCH: fix/launch-eslint-audit-20260729
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on branch and main drift
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main ops/truely-full-launch-audit-20260729
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          unexpected="$(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | grep -Ev '^(\.github/workflows/guarded-eslint-audit-remediation-20260729\.yml|package\.json|package-lock\.json|vendor/brace-expansion-compat/(package\.json|index\.cjs))$' || true)"
          test -z "$unexpected" || { printf 'Unexpected branch changes:\n%s\n' "$unexpected" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current tree and apply patched compatibility package
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p vendor/brace-expansion-compat
          cat > vendor/brace-expansion-compat/package.json <<'JSON'
          {
            "name": "brace-expansion",
            "version": "5.0.8",
            "private": true,
            "main": "index.cjs",
            "license": "MIT",
            "dependencies": {
              "brace-expansion-safe-core": "npm:brace-expansion@5.0.8"
            }
          }
          JSON
          cat > vendor/brace-expansion-compat/index.cjs <<'CJS'
          'use strict';
          const secureCore = require('brace-expansion-safe-core');
          const expand = typeof secureCore === 'function' ? secureCore : secureCore.expand;
          if (typeof expand !== 'function') throw new TypeError('Patched core did not expose expand().');
          module.exports = expand;
          module.exports.expand = expand;
          CJS
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.devDependencies?.eslint !== '^9') throw new Error(`Unsupported ESLint source range: ${pkg.devDependencies?.eslint}`);
          pkg.devDependencies['brace-expansion'] = 'file:vendor/brace-expansion-compat';
          pkg.overrides = { ...(pkg.overrides || {}), 'brace-expansion': '$brace-expansion' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install
          git diff --check

      - name: Prove compatibility and zero high or critical advisories
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.devDependencies?.eslint !== '^9') throw new Error('ESLint 9 support changed.');
          if (pkg.devDependencies?.['eslint-config-next'] !== '16.2.12') throw new Error('eslint-config-next changed.');
          if (pkg.devDependencies?.['brace-expansion'] !== 'file:vendor/brace-expansion-compat') throw new Error('Compatibility dependency missing.');
          if (pkg.overrides?.['brace-expansion'] !== '$brace-expansion') throw new Error('Override missing.');
          const expand = require('brace-expansion');
          if (typeof expand !== 'function' || expand.expand !== expand) throw new Error('Legacy callable API not preserved.');
          const actual = expand('card-{front,back}.jpg');
          if (JSON.stringify(actual) !== JSON.stringify(['card-front.jpg', 'card-back.jpg'])) throw new Error(`Bad expansion: ${JSON.stringify(actual)}`);
          NODE
          npm audit --json > npm-audit.json || audit_status=$?
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log(JSON.stringify(counts));
          if ((counts.high || 0) !== 0 || (counts.critical || 0) !== 0) throw new Error(`High/critical advisories remain: ${JSON.stringify(counts)}`);
          NODE
          npm audit --audit-level=high
          npm ls eslint eslint-config-next minimatch brace-expansion brace-expansion-safe-core

      - name: Run all six Launch 2.0 simulation shards
        shell: bash
        run: |
          set -euo pipefail
          git show origin/ops/truely-full-launch-audit-20260729:scripts/run-truely-launch-audit-20260729.mjs > scripts/.guarded-launch-audit-runner-20260729.mjs
          rm -rf .audit/simulations
          for shard in 0 1 2 3 4 5; do
            node scripts/.guarded-launch-audit-runner-20260729.mjs simulations --shard="$shard" --shards=6
          done
          rm -f scripts/.guarded-launch-audit-runner-20260729.mjs
          test "$(find .audit/simulations -name '*.json' -type f | wc -l | tr -d ' ')" -ge 6

      - name: Run repository lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run full Production build
        run: npm run build

      - name: Commit only the validated dependency repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit npm-audit.json
          rm -f scripts/.guarded-launch-audit-runner-20260729.mjs
          git diff --check
          mapfile -t changed < <(git status --porcelain=v1 -uall | cut -c4-)
          expected=(package-lock.json package.json vendor/brace-expansion-compat/index.cjs vendor/brace-expansion-compat/package.json)
          mapfile -t sorted_changed < <(printf '%s\n' "${changed[@]}" | sort)
          test "${#sorted_changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${sorted_changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json vendor/brace-expansion-compat/package.json vendor/brace-expansion-compat/index.cjs
          git commit -m "Harden lint dependencies against brace expansion DoS"
          git push origin "HEAD:$EXPECTED_BRANCH"
