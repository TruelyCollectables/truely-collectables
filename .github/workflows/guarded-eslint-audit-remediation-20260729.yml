name: Guarded ESLint Audit Remediation 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/guarded-eslint-audit-remediation-20260729.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-eslint-audit-remediation-20260729
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 7765f115d44e2629d47cc38871273dacdafcb8e7
  EXPECTED_BRANCH: fix/launch-eslint-audit-20260729
  NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
  ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-validation-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_validation
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
  STRIPE_WEBHOOK_SECRET: whsec_build_validation
  EBAY_CLIENT_ID: build-validation-client-id
  EBAY_CLIENT_SECRET: build-validation-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on branch and main drift
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main ops/truely-full-launch-audit-20260729
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          unexpected="$(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | grep -Ev '^(\.github/workflows/guarded-eslint-audit-remediation-20260729\.yml|package\.json|package-lock\.json)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected branch changes:\n%s\n' "$unexpected" >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current exact dependency tree
        run: npm ci

      - name: Apply targeted ESLint security upgrade
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact eslint@10.8.0
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.devDependencies?.eslint !== '10.8.0') {
            throw new Error(`Expected exact ESLint 10.8.0, found ${pkg.devDependencies?.eslint}`);
          }
          if (pkg.devDependencies?.['eslint-config-next'] !== '16.2.12') {
            throw new Error('eslint-config-next changed unexpectedly.');
          }
          NODE
          git diff --check
          git diff -- package.json package-lock.json

      - name: Enforce zero high or critical npm advisories
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > npm-audit.json || audit_status=$?
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log(JSON.stringify(counts));
          if ((counts.high || 0) !== 0 || (counts.critical || 0) !== 0) {
            throw new Error(`High/critical advisories remain: ${JSON.stringify(counts)}`);
          }
          NODE
          npm audit --audit-level=high
          npm ls eslint eslint-config-next minimatch brace-expansion

      - name: Run all six Launch 2.0 simulation shards
        shell: bash
        run: |
          set -euo pipefail
          git show origin/ops/truely-full-launch-audit-20260729:scripts/run-truely-launch-audit-20260729.mjs > scripts/.guarded-launch-audit-runner-20260729.mjs
          rm -rf .audit/simulations
          for shard in 0 1 2 3 4 5; do
            node scripts/.guarded-launch-audit-runner-20260729.mjs simulations --shard="$shard" --shards=6
          done
          rm -f scripts/.guarded-launch-audit-runner-20260729.mjs
          test "$(find .audit/simulations -name '*.json' -type f | wc -l | tr -d ' ')" -ge 6

      - name: Run repository lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run full Production build
        run: npm run build

      - name: Commit only the validated dependency repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit npm-audit.json
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for file in "${changed[@]}"; do
            case "$file" in
              package.json|package-lock.json) ;;
              *) echo "Unexpected changed or untracked file: $file" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Upgrade ESLint to clear high-severity audit findings"
          git push origin "HEAD:$EXPECTED_BRANCH"
