name: Cloudflare Production Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deal-hunter-cloudflare-production-release.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "wrangler.production-route.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deal-hunter-cloudflare-production-release
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install Cloudflare deployment tooling without changing the lockfile
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest

      - name: Recover production build environment from Supabase management API
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TCOS_CRON_SECRET: ${{ secrets.TCOS_CRON_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo 'SUPABASE_ACCESS_TOKEN is unavailable.'; exit 2; }
          [ -n "${SUPABASE_PROJECT_REF:-}" ] || { echo 'SUPABASE_PROJECT_REF is unavailable.'; exit 2; }

          curl -sS --fail-with-body --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -o /tmp/supabase-api-keys.json

          node <<'NODE'
          const fs = require('node:fs');
          const keys = JSON.parse(fs.readFileSync('/tmp/supabase-api-keys.json', 'utf8'));
          if (!Array.isArray(keys) || !keys.length) throw new Error('Supabase returned no API keys.');
          const normalized = keys.map((row) => ({
            ...row,
            discriminator: String(row?.name || row?.type || '').trim().toLowerCase(),
            value: String(row?.api_key || '').trim(),
          }));
          const publicKey = normalized.find((row) => ['anon', 'publishable'].includes(row.discriminator) && row.value);
          const serverKey = normalized.find((row) => ['service_role', 'secret'].includes(row.discriminator) && row.value);
          if (!publicKey) throw new Error('Supabase public API key was not resolved.');
          if (!serverKey) throw new Error('Supabase server API key was not resolved.');

          const ref = String(process.env.SUPABASE_PROJECT_REF || '').trim();
          const buildEnv = {
            NEXT_PUBLIC_SUPABASE_URL: `https://${ref}.supabase.co`,
            SUPABASE_URL: `https://${ref}.supabase.co`,
            NEXT_PUBLIC_SUPABASE_ANON_KEY: publicKey.value,
            SUPABASE_SERVICE_ROLE_KEY: serverKey.value,
            OPENAI_API_KEY: String(process.env.OPENAI_API_KEY || '').trim(),
            TCOS_CRON_SECRET: String(process.env.TCOS_CRON_SECRET || '').trim(),
            NEXT_PUBLIC_SITE_URL: 'https://truelycollectables.com',
            SITE_URL: 'https://truelycollectables.com',
            TCOS_DEPLOYMENT_ENV: 'production',
            TCOS_GIT_COMMIT_SHA: process.env.GITHUB_SHA,
            TCOS_GIT_COMMIT_REF: 'main',
          };
          fs.writeFileSync('/tmp/deal-hunter-production-env.json', JSON.stringify(buildEnv), { mode: 0o600 });
          console.log(`Production build environment recovered directly from Supabase: ${Object.keys(buildEnv).length} fields; values withheld.`);
          NODE
          shred -u /tmp/supabase-api-keys.json

      - name: Build current main for Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const buildEnv = JSON.parse(fs.readFileSync('/tmp/deal-hunter-production-env.json', 'utf8'));
          const result = spawnSync(
            'npx',
            ['--no-install', 'opennextjs-cloudflare', 'build'],
            {
              stdio: 'inherit',
              env: { ...process.env, ...buildEnv, NODE_ENV: 'production' },
            },
          );
          process.exit(result.status ?? 1);
          NODE

      - name: Validate scheduler and routed Worker split
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const scheduler = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const routed = JSON.parse(fs.readFileSync('wrangler.production-route.jsonc', 'utf8'));
          if (scheduler.name !== 'truely-collectables') throw new Error(`Unexpected scheduler Worker: ${scheduler.name}`);
          if (routed.name !== 'truely-collectables-preview') throw new Error(`Unexpected routed production Worker: ${routed.name}`);
          if (!scheduler.triggers?.crons?.length) throw new Error('Scheduler Worker must retain its cron trigger.');
          if (routed.triggers?.crons?.length) throw new Error('Routed production Worker must not have cron triggers.');
          console.log('Cloudflare target split validated: scheduler + routed production Worker.');
          NODE

      - name: Deploy current main to scheduler Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy --config wrangler.jsonc --keep-vars

      - name: Deploy current main to routed production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy --config wrangler.production-route.jsonc --keep-vars

      - name: Verify routed Deal Hunter execution
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = 'https://truelycollectables.com/api/tcos/deal-hunter-native-ebay?perQuery=1&scope=ivan_demidov';
          let lastFailure = 'No request attempted.';
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const response = await fetch(`${endpoint}&release_check=${Date.now()}`, {
                headers: { Accept: 'application/json' },
                redirect: 'manual',
                signal: AbortSignal.timeout(60_000),
              });
              const payload = await response.json();
              const valid =
                response.status === 200 &&
                response.headers.get('x-truely-origin') === 'cloudflare-worker' &&
                payload?.ok === true &&
                payload?.schema === 'TCOS_NATIVE_EBAY_FEED_V1' &&
                payload?.queryFamilyCount === 3 &&
                payload?.successfulQueryCount === 3 &&
                payload?.failedQueryCount === 0 &&
                payload?.nativeEbayUsed === true;
              if (valid) {
                console.log('Production Deal Hunter verified: Cloudflare Worker, 3/3 Ivan Demidov query families complete.');
                process.exit(0);
              }
              lastFailure = `attempt=${attempt} status=${response.status} successful=${payload?.successfulQueryCount} failed=${payload?.failedQueryCount}`;
            } catch (error) {
              lastFailure = `attempt=${attempt} error=${error instanceof Error ? error.message : String(error)}`;
            }
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          throw new Error(`Production Deal Hunter verification failed: ${lastFailure}`);
          NODE

      - name: Remove recovered secret material
        if: always()
        shell: bash
        run: |
          shred -u /tmp/supabase-api-keys.json /tmp/deal-hunter-production-env.json 2>/dev/null || true
