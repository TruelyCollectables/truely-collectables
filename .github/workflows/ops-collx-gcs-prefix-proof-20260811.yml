name: Ops CollX GCS Prefix Proof 20260811
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-gcs-prefix-proof-20260811.yml"
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove prefix listing or fail closed
        shell: bash
        run: |
          set -euo pipefail
          prefix='1129514363171081216-'
          url="https://storage.googleapis.com/storage/v1/b/collx-product-images/o?prefix=${prefix}"
          code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/list.json" -w '%{http_code}' "$url")"
          echo "http=$code"
          cat "$RUNNER_TEMP/list.json" | head -c 1200
          echo
          test "$code" = "200"
          python3 - <<'PY'
import json,os
p=os.environ['RUNNER_TEMP']+'/list.json'
x=json.load(open(p))
names=[r['name'] for r in x.get('items',[])]
print(names)
assert any(n.startswith('1129514363171081216-1-') for n in names)
assert any(n.startswith('1129514363171081216-2-') for n in names)
PY
