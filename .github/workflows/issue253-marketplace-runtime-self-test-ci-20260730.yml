name: Issue 253 Marketplace Runtime Self Test CI 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue253-marketplace-runtime-self-test-ci-20260730.yml"
      - "src/app/api/release/issue253-marketplace-self-test/route.ts"
      - "scripts/verify-issue253-marketplace-runtime-self-test-contract.mjs"
      - "src/lib/vercel-release-runtime-auth.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue253-marketplace-runtime-self-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/issue253-runtime-marketplace-self-test-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-validation.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-validation-service-role-key
      ADMIN_SESSION_SECRET: build-validation-session-secret-that-is-long-enough
      ADMIN_PASSWORD: build-validation-admin-password
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      STRIPE_SECRET_KEY: sk_test_build_validation
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_validation
      STRIPE_WEBHOOK_SECRET: whsec_build_validation
      EBAY_CLIENT_ID: build-validation-client-id
      EBAY_CLIENT_SECRET: build-validation-client-secret
      EBAY_ENVIRONMENT: production
      CRON_SECRET: build-validation-cron-secret-that-is-long-enough
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on exact branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "fix/issue253-runtime-marketplace-self-test-20260730"
          git fetch origin main
          git diff --check origin/main...HEAD
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          expected=(
            .github/workflows/issue253-marketplace-runtime-self-test-ci-20260730.yml
            scripts/verify-issue253-marketplace-runtime-self-test-contract.mjs
            src/app/api/release/issue253-marketplace-self-test/route.ts
            src/lib/vercel-release-runtime-auth.ts
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run runtime marketplace contract
        run: node scripts/verify-issue253-marketplace-runtime-self-test-contract.mjs

      - name: Run issue 253 simulations
        run: |
          node scripts/run-sold-lifecycle-simulations.mjs
          node scripts/run-sold-trigger-order-simulation.mjs

      - name: Run privileged route gates
        run: |
          node scripts/run-privileged-api-route-audit.mjs
          npm run simulate:privileged-route-auth

      - name: Run lint
        run: npm run lint

      - name: Run standalone TypeScript
        run: npx tsc --noEmit --pretty false

      - name: Run Production build
        run: npm run build
