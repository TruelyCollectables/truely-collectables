name: Ops CollX Active Image Import V4 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-active-image-import-v4-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-collx-active-image-import-v4-20260810
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/collx-image-import"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-image-import/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Build and syntax-check V4 importer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/ops-collx-active-image-import-20260810.yml').read_text()
          marker = "          node --input-type=module - <<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          NODE\n", start)
          source_lines = source[start:end].splitlines()
          lines = [line[10:] if line.startswith('          ') else line for line in source_lines]

          out = []
          guard_replaced = 0
          delete_replaced = 0
          count_replaced = 0
          back_count_replaced = 0
          manifest_replaced = 0
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.strip() == "const EXPECTED_COUNT = 466;":
                  out.append(line.replace('466', '463'))
                  count_replaced += 1
                  index += 1
                  continue
              if line.strip() == "const manifest = JSON.parse(raw.toString('utf8'));":
                  indent = line[:len(line) - len(line.lstrip())]
                  out.extend([
                      indent + "const rawManifest = JSON.parse(raw.toString('utf8'));",
                      indent + "if (!Array.isArray(rawManifest) || rawManifest.length !== 466) fail(`Frozen manifest must contain exactly 466 rows, received ${rawManifest?.length ?? 'non-array'}.`);",
                      indent + "const excludedDuplicateProductIds = new Set([2234, 10678, 2247]);",
                      indent + "const excludedDuplicateAssignments = rawManifest.filter((row) => excludedDuplicateProductIds.has(Number(row.p)));",
                      indent + "if (excludedDuplicateAssignments.length !== 3) fail(`Expected exactly 3 duplicate assignments to exclude, received ${excludedDuplicateAssignments.length}.`);",
                      indent + "const manifest = rawManifest.filter((row) => !excludedDuplicateProductIds.has(Number(row.p)));",
                  ])
                  manifest_replaced += 1
                  index += 1
                  continue
              if "if (backCount !== 422)" in line:
                  out.append(line.replace('422', '420'))
                  back_count_replaced += 1
                  index += 1
                  continue
              if "const expectedPrefix = `https://storage.googleapis.com/collx-product-images/${row.c}-`;" in line:
                  if index + 2 >= len(lines) or 'Invalid CollX front URL' not in lines[index + 1] or 'Invalid CollX back URL' not in lines[index + 2]:
                      raise SystemExit('V1 URL guard shape changed; refusing to patch.')
                  indent = line[:len(line) - len(line.lstrip())]
                  out.extend([
                      indent + "const front = String(row.f || '');",
                      indent + "const back = String(row.b || '');",
                      indent + "const productPrefix = `https://storage.googleapis.com/collx-product-images/${row.c}-`;",
                      indent + "const legacyPrefix = 'https://storage.googleapis.com/collx-user-cards/';",
                      indent + "const legacySideValid = (url, side) => {",
                      indent + "  if (!url.startsWith(legacyPrefix)) return false;",
                      indent + "  try {",
                      indent + "    const pathname = new URL(url).pathname.toLowerCase();",
                      indent + "    return pathname.includes(`-${String(row.c).toLowerCase()}-${side}.`) && /\\.(?:jpe?g|png|webp)$/.test(pathname);",
                      indent + "  } catch {",
                      indent + "    return false;",
                      indent + "  }",
                      indent + "};",
                      indent + "const frontValid = front.startsWith(`${productPrefix}1-`) || legacySideValid(front, 'front');",
                      indent + "const backValid = !back || back.startsWith(`${productPrefix}2-`) || legacySideValid(back, 'back');",
                      indent + "if (!frontValid) fail(`Invalid CollX front URL for ${row.c}: ${front}`);",
                      indent + "if (!backValid) fail(`Invalid CollX back URL for ${row.c}: ${back}`);",
                  ])
                  guard_replaced += 1
                  index += 3
                  continue
              if "and img.image_url like 'https://storage.googleapis.com/collx-product-images/%';" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "and (img.image_url like 'https://storage.googleapis.com/collx-product-images/%' or img.image_url like 'https://storage.googleapis.com/collx-user-cards/%');")
                  delete_replaced += 1
                  index += 1
                  continue
              out.append(line)
              index += 1

          expected = {
              'guard': guard_replaced,
              'delete': delete_replaced,
              'count': count_replaced,
              'back_count': back_count_replaced,
              'manifest': manifest_replaced,
          }
          if any(value != 1 for value in expected.values()):
              raise SystemExit(f'V4 patch contract failed: {expected}')

          target = Path('/tmp/collx-active-image-import-v4.mjs')
          target.write_text('\n'.join(out) + '\n')
          print(f'Built V4 importer with one-to-one duplicate exclusions: {expected}.')
          PY
          node --check /tmp/collx-active-image-import-v4.mjs
          grep -q "excludedDuplicateProductIds" /tmp/collx-active-image-import-v4.mjs
          grep -q "collx-user-cards" /tmp/collx-active-image-import-v4.mjs
          grep -q "const EXPECTED_COUNT = 463" /tmp/collx-active-image-import-v4.mjs
          grep -q "backCount !== 420" /tmp/collx-active-image-import-v4.mjs

      - name: Verify manifest, live targets, remote images, and apply image-only import
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/collx-active-image-import-v4.mjs
          rm -f "$RUNNER_TEMP/collx-image-import/production.env"

      - name: Upload import receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collx-active-image-import-v4-receipt
          path: ${{ runner.temp }}/collx-image-import/receipt.json
          retention-days: 7
          if-no-files-found: warn
