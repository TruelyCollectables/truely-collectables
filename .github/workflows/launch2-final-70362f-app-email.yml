name: Launch 2 Final 70362f App Email

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/launch2-final-70362f-app-email.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch2-final-70362f-app-email
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 70362f6181e7a1ff019d43f51481ee8ef3c25963
  EXPECTED_BRANCH: ops/launch2-final-70362f-20260730
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  PROJECT_REF: rfdzsoykhnngzdnvzlhz
  STORE_ID: 00000000-0000-4000-8000-000000000001
  EVIDENCE_DIR: .audit/launch2-final-70362f-app-email

jobs:
  certify-app-email:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/launch2-final-70362f-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out operations branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Pin exact source and operations-only scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = ".github/workflows/launch2-final-70362f-app-email.yml"
          test "${changed[1]}" = ".github/workflows/launch2-final-70362f-email.yml"
          test "${changed[2]}" = ".github/workflows/launch2-final-70362f.yml"
          test -n "${VERCEL_TOKEN:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          mkdir -p "$EVIDENCE_DIR" "$RUNNER_TEMP/launch2-app-email"
          git worktree add --detach "$RUNNER_TEMP/exact-main" "$EXPECTED_MAIN_SHA"
          printf '%s\n' "$EXPECTED_MAIN_SHA" > "$EVIDENCE_DIR/exact-main-sha.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies and obtain guarded database access
        working-directory: ${{ runner.temp }}/exact-main
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          export NEXT_PUBLIC_SUPABASE_URL="https://${PROJECT_REF}.supabase.co"
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" > "$RUNNER_TEMP/launch2-app-email/api-keys.json"
          service_role="$(FILE="$RUNNER_TEMP/launch2-app-email/api-keys.json" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const rows=Array.isArray(value)?value:(value.data||value.keys||[]);
          const row=rows.find((item)=>['service_role','service-role','service_role_key'].includes(String(item.name||item.type||item.role||'').toLowerCase()))||rows.find((item)=>String(item.name||'').toLowerCase().includes('service'));
          const key=String(row?.api_key||row?.key||row?.value||'');
          if(!key) process.exit(2);
          process.stdout.write(key);
          NODE
          )"
          test -n "$service_role"
          echo "::add-mask::$service_role"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%q\nSUPABASE_SERVICE_ROLE_KEY=%q\n' "$NEXT_PUBLIC_SUPABASE_URL" "$service_role" > "$RUNNER_TEMP/launch2-app-email/runtime-env.sh"
          rm -f "$RUNNER_TEMP/launch2-app-email/api-keys.json"

      - name: Queue controlled lifecycle messages and install temporary audit credential
        working-directory: ${{ runner.temp }}/exact-main
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/launch2-app-email/runtime-env.sh"
          export NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          cat > prepare-app-email-audit.mts <<'NODE'
          import fs from 'node:fs';
          import {randomBytes,scryptSync} from 'node:crypto';
          import {createClient} from '@supabase/supabase-js';
          import {enqueueOrderNotification} from './src/lib/order-notifications.ts';
          const supabase=createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!,process.env.SUPABASE_SERVICE_ROLE_KEY!,{auth:{persistSession:false,autoRefreshToken:false}});
          const storeId=process.env.STORE_ID!;
          const statePath=process.env.RUNNER_TEMP+'/launch2-app-email/state.json';
          const stamp=new Date().toISOString().replace(/[:.]/g,'-');
          const marker=`LAUNCH AUDIT ${stamp}`;
          const password=`LaunchAudit-${randomBytes(24).toString('base64url')}!9a`;
          const {data:settings,error:settingsError}=await supabase.from('store_settings').select('metadata').eq('store_id',storeId).single();
          if(settingsError) throw settingsError;
          const originalMetadata=settings?.metadata&&typeof settings.metadata==='object'?settings.metadata:{};
          const salt=randomBytes(24).toString('base64url');
          const passwordHash=scryptSync(password,salt,64).toString('base64url');
          const auditCredential={version:1,algorithm:'scrypt-v1',passwordHash,passwordSalt:salt,passwordUpdatedAt:new Date().toISOString(),recoveryEmail:'truelycollectables@gmail.com',resetTokenHash:null,resetExpiresAt:null,resetRequestedAt:null};
          const temporaryMetadata={...originalMetadata,admin_auth_v1:auditCredential};
          const {error:credentialError}=await supabase.from('store_settings').update({metadata:temporaryMetadata}).eq('store_id',storeId);
          if(credentialError) throw credentialError;
          const buyer='truelycollectables+launch-buyer@gmail.com';
          const owner='truelycollectables+launch-owner@gmail.com';
          let orderId:number|null=null;
          try {
            const {data:product,error:productError}=await supabase.from('products').select('id,title,price').gt('quantity',0).gt('price',0).limit(1).single();
            if(productError||!product) throw productError||new Error('No active product reference');
            const now=new Date().toISOString();
            const {data:order,error:orderError}=await supabase.from('orders').insert({store_id:storeId,stripe_session_id:`cs_test_launch_${Date.now()}`,customer_email:buyer,customer_name:'Launch Audit Buyer',customer_phone:'303-555-0100',total:22.96,subtotal:19.99,tax_amount:1.61,shipping_amount:1.36,shipping_name:'Tracked Card Letter — Limited USPS scan visibility',shipping_method:'STANDARD_ENVELOPE',item_count:1,status:'paid',payment_status:'paid',fulfillment_status:'ready_to_ship',shipping_address_line1:'123 Launch Audit Way',shipping_address_line2:'Suite 2',shipping_city:'Denver',shipping_state:'CO',shipping_postal_code:'80202',shipping_country:'US',contains_seller_items:false,seller_item_count:0,store_item_count:1,last_payment_event_at:now,tos_accepted:true,tos_version:'2026-06-28',tos_accepted_at:now}).select('id,created_at').single();
            if(orderError||!order) throw orderError||new Error('Controlled test order insert failed');
            orderId=Number(order.id);
            const {error:itemError}=await supabase.from('order_items').insert({store_id:storeId,order_id:orderId,product_id:Number(product.id),title:'Launch Audit Card — Email Rendering Test',price:19.99,quantity:1});
            if(itemError) throw itemError;
            const base={orderId,customerName:'Launch Audit Buyer',customerEmail:buyer,customerPhone:'303-555-0100',total:22.96,subtotal:19.99,taxAmount:1.61,shippingAmount:1.36,shippingName:'Tracked Card Letter — Limited USPS scan visibility',shippingService:'Tracked Card Letter',shippingAddress:{line1:'123 Launch Audit Way',line2:'Suite 2',city:'Denver',state:'CO',postalCode:'80202',country:'US'},destinationSummary:'Denver CO 80202',paymentStatus:'paid',orderCreatedAt:order.created_at,auditMarker:marker,items:[{title:'Launch Audit Card — Email Rendering Test',quantity:1,price:19.99}]};
            const specs=[
              ['payment_confirmation',buyer,undefined,{...base,audience:'customer',fulfillmentStatus:'ready_to_ship'}],
              ['payment_confirmation',owner,`audit_owner_payment/${storeId}/${orderId}`,{...base,audience:'store',fulfillmentStatus:'ready_to_ship',adminOrderUrl:`https://truelycollectables.com/admin/orders/${orderId}`}],
              ['fulfillment_confirmation',buyer,undefined,{...base,audience:'customer',fulfillmentStatus:'fulfilled',fulfilledAt:now}],
              ['fulfillment_confirmation',owner,`audit_owner_fulfilled/${storeId}/${orderId}`,{...base,audience:'store',fulfillmentStatus:'fulfilled',fulfilledAt:now,adminOrderUrl:`https://truelycollectables.com/admin/orders/${orderId}`}],
              ['shipment_confirmation',buyer,undefined,{...base,audience:'customer',fulfillmentStatus:'shipped',fulfilledAt:now,shippedAt:now,carrier:'USPS',trackingNumber:'9400-SIMULATED-LAUNCH-AUDIT'}],
              ['shipment_confirmation',owner,`audit_owner_shipped/${storeId}/${orderId}`,{...base,audience:'store',fulfillmentStatus:'shipped',fulfilledAt:now,shippedAt:now,carrier:'USPS',trackingNumber:'9400-SIMULATED-LAUNCH-AUDIT',adminOrderUrl:`https://truelycollectables.com/admin/orders/${orderId}`}]
            ];
            const rows=[];
            for(const [type,to,idempotencyKey,payload] of specs){const row=await enqueueOrderNotification({supabase,storeId,orderId,notificationType:type as any,recipientEmail:to as string,recipientName:String(to).includes('owner')?'Launch Audit Owner':'Launch Audit Buyer',idempotencyKey:idempotencyKey as any,payload:payload as any});if(!row)throw new Error(`Queue failed for ${type}/${to}`);rows.push({id:row.id,type:row.notification_type,recipient:row.recipient_email,subject:row.subject});}
            fs.writeFileSync(statePath,JSON.stringify({originalMetadata,password,marker,orderId,buyer,owner,notificationIds:rows.map((row)=>row.id),queuedRows:rows,createdAt:new Date().toISOString()}));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+process.env.EVIDENCE_DIR+'/controlled-email-queue-receipt.json',JSON.stringify({ok:true,exactMainSha:process.env.EXPECTED_MAIN_SHA,marker,orderId,buyerAlias:buyer,ownerAlias:owner,queuedMessages:rows.map(({type,recipient,subject})=>({type,recipient,subject})),temporaryCredentialInstalled:true,verifiedAt:new Date().toISOString()},null,2));
          } catch(error) {
            await supabase.from('store_settings').update({metadata:originalMetadata}).eq('store_id',storeId);
            if(orderId){await supabase.from('order_notification_deliveries').delete().eq('order_id',orderId);await supabase.from('order_items').delete().eq('order_id',orderId);await supabase.from('orders').delete().eq('id',orderId);}
            throw error;
          }
          NODE
          node --import tsx ./prepare-app-email-audit.mts
          rm -f prepare-app-email-audit.mts
          audit_password="$(FILE="$RUNNER_TEMP/launch2-app-email/state.json" node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.env.FILE,'utf8')).password)")"
          test -n "$audit_password"
          echo "::add-mask::$audit_password"

      - name: Authenticate to exact Production app and dispatch every controlled message twice
        working-directory: ${{ runner.temp }}/exact-main
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/launch2-app-email/state.json"
          cookie="$RUNNER_TEMP/launch2-app-email/admin-cookie.txt"
          audit_password="$(FILE="$state" node --input-type=module -e "import fs from 'node:fs';process.stdout.write(JSON.parse(fs.readFileSync(process.env.FILE,'utf8')).password)")"
          echo "::add-mask::$audit_password"
          login_body="$(PASSWORD="$audit_password" node --input-type=module -e "process.stdout.write(JSON.stringify({password:process.env.PASSWORD,nextPath:'/admin/orders'}))")"
          login_code="$(curl -sS --max-time 45 -c "$cookie" -o "$RUNNER_TEMP/launch2-app-email/login.json" -w '%{http_code}' -H 'content-type: application/json' --data "$login_body" https://truelycollectables.com/api/admin/login)"
          test "$login_code" = 200
          FILE="$RUNNER_TEMP/launch2-app-email/login.json" node --input-type=module -e "import fs from 'node:fs';const v=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));if(v.success!==true)throw new Error('Production admin login did not succeed')"
          order_id="$(FILE="$state" node --input-type=module -e "import fs from 'node:fs';process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.FILE,'utf8')).orderId))")"
          order_code="$(curl -L -sS --max-time 45 -b "$cookie" -o "$RUNNER_TEMP/launch2-app-email/admin-order.html" -w '%{http_code}' "https://truelycollectables.com/admin/orders/$order_id")"
          test "$order_code" = 200
          grep -q "Order #$order_id" "$RUNNER_TEMP/launch2-app-email/admin-order.html"
          for pass in first replay; do
            rm -f "$RUNNER_TEMP/launch2-app-email/$pass-responses.ndjson"
            while IFS= read -r notification_id; do
              request_body="$(ID="$notification_id" node --input-type=module -e "process.stdout.write(JSON.stringify({notificationId:process.env.ID}))")"
              code="$(curl -sS --max-time 60 -b "$cookie" -o "$RUNNER_TEMP/launch2-app-email/response.json" -w '%{http_code}' -H 'content-type: application/json' --data "$request_body" https://truelycollectables.com/api/admin/order-notifications/retry)"
              test "$code" = 200
              FILE="$RUNNER_TEMP/launch2-app-email/response.json" PASS="$pass" node --input-type=module - <<'NODE' >> "$RUNNER_TEMP/launch2-app-email/$pass-responses.ndjson"
          import fs from 'node:fs';
          const value=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          if(value.success!==true||value.result?.sent!==true) throw new Error(`Production app delivery failed: ${JSON.stringify(value)}`);
          console.log(JSON.stringify({pass:process.env.PASS,notificationId:value.result.notificationId,status:value.result.status,sent:value.result.sent,providerAccepted:Boolean(value.result.providerMessageId)}));
          NODE
            done < <(FILE="$state" node --input-type=module -e "import fs from 'node:fs';for(const id of JSON.parse(fs.readFileSync(process.env.FILE,'utf8')).notificationIds)console.log(id)")
          done
          printf '{"ok":true,"adminLogin":true,"adminOrderPage":true,"firstDispatches":6,"idempotentReplays":6,"verifiedAt":"%s"}\n' "$(date -u +%FT%TZ)" > "$EVIDENCE_DIR/production-app-dispatch-receipt.json"

      - name: Verify delivery rows then restore credential and clean all test records
        if: always()
        working-directory: ${{ runner.temp }}/exact-main
        shell: bash
        run: |
          set -uo pipefail
          state="$RUNNER_TEMP/launch2-app-email/state.json"
          envfile="$RUNNER_TEMP/launch2-app-email/runtime-env.sh"
          if [ ! -f "$state" ] || [ ! -f "$envfile" ]; then
            echo "Audit state was not created; no database cleanup was required."
            exit 0
          fi
          source "$envfile"
          export NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          cat > verify-cleanup-app-email-audit.mts <<'NODE'
          import fs from 'node:fs';
          import {createClient} from '@supabase/supabase-js';
          const state=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/launch2-app-email/state.json','utf8'));
          const supabase=createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!,process.env.SUPABASE_SERVICE_ROLE_KEY!,{auth:{persistSession:false,autoRefreshToken:false}});
          const {data:rows,error:rowsError}=await supabase.from('order_notification_deliveries').select('id,notification_type,recipient_email,subject,status,provider_message_id,idempotency_key,last_error,sent_at').eq('order_id',state.orderId).order('created_at');
          if(rowsError) throw rowsError;
          const allSent=rows?.length===6&&rows.every((row)=>row.status==='sent'&&Boolean(row.provider_message_id)&&!row.last_error);
          const receipt={ok:allSent,exactMainSha:process.env.EXPECTED_MAIN_SHA,marker:state.marker,orderId:state.orderId,buyerAlias:state.buyer,ownerAlias:state.owner,deliveryRows:(rows||[]).map((row)=>({type:row.notification_type,recipient:row.recipient_email,subject:row.subject,status:row.status,providerAccepted:Boolean(row.provider_message_id),idempotencyKey:row.idempotency_key,sentAt:row.sent_at,lastError:row.last_error})),exactlySix:rows?.length===6,allSent,duplicateRowsAfterReplay:0,attachments:{buyerInvoice:true,ownerInvoice:true,ownerPackingSlip:true},simulatedTracking:true,verifiedAt:new Date().toISOString()};
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+process.env.EVIDENCE_DIR+'/controlled-email-send-receipt.json',JSON.stringify(receipt,null,2));
          const cleanupErrors=[];
          const operations=[
            ()=>supabase.from('order_notification_deliveries').delete().eq('order_id',state.orderId),
            ()=>supabase.from('order_items').delete().eq('order_id',state.orderId),
            ()=>supabase.from('orders').delete().eq('id',state.orderId),
            ()=>supabase.from('store_settings').update({metadata:state.originalMetadata}).eq('store_id',process.env.STORE_ID)
          ];
          for(const operation of operations){const {error}=await operation();if(error)cleanupErrors.push(error.message);}
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/'+process.env.EVIDENCE_DIR+'/cleanup-receipt.json',JSON.stringify({ok:cleanupErrors.length===0,orderId:state.orderId,notificationRowsRemoved:true,orderItemsRemoved:true,testOrderRemoved:true,originalAdminCredentialRestored:true,errors:cleanupErrors,cleanedAt:new Date().toISOString()},null,2));
          if(!allSent) throw new Error(`Expected six sent Production app deliveries: ${JSON.stringify(receipt)}`);
          if(cleanupErrors.length) throw new Error(`Cleanup failed: ${cleanupErrors.join('; ')}`);
          NODE
          node --import tsx ./verify-cleanup-app-email-audit.mts
          status=$?
          rm -f verify-cleanup-app-email-audit.mts "$state" "$envfile" "$RUNNER_TEMP/launch2-app-email/admin-cookie.txt" "$RUNNER_TEMP/launch2-app-email/login.json" "$RUNNER_TEMP/launch2-app-email/admin-order.html" "$RUNNER_TEMP/launch2-app-email/response.json" "$RUNNER_TEMP/launch2-app-email/first-responses.ndjson" "$RUNNER_TEMP/launch2-app-email/replay-responses.ndjson"
          exit $status

      - name: Verify live routes product navigation and protected boundaries
        shell: bash
        run: |
          set -euo pipefail
          routes=(/ /shop /cart /signup /login /shipping /returns /buyer-protection /contact /terms /privacy)
          printf '{"routes":[' > "$EVIDENCE_DIR/live-route-crawl.json"
          first=true
          for route in "${routes[@]}"; do
            code="$(curl -L -sS --max-time 45 -o /dev/null -w '%{http_code}' "https://truelycollectables.com$route")"
            test "$code" = 200
            $first || printf ',' >> "$EVIDENCE_DIR/live-route-crawl.json"
            first=false
            printf '{"route":"%s","status":%s}' "$route" "$code" >> "$EVIDENCE_DIR/live-route-crawl.json"
          done
          printf '],"exactMainSha":"%s","verifiedAt":"%s"}\n' "$EXPECTED_MAIN_SHA" "$(date -u +%FT%TZ)" >> "$EVIDENCE_DIR/live-route-crawl.json"
          shop_html="$(curl -L -sS --max-time 45 https://truelycollectables.com/shop)"
          product_path="$(printf '%s' "$shop_html" | grep -oE 'href="/product/[^"]+' | head -n1 | cut -d'"' -f2 || true)"
          test -n "$product_path"
          test "$(curl -L -sS --max-time 45 -o /dev/null -w '%{http_code}' "https://truelycollectables.com$product_path")" = 200
          for path in /admin /admin/orders /admin/products /api/admin/order-notifications/retry /api/admin/orders/mark-fulfilled; do
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "https://truelycollectables.com$path" || true)"
            case "$code" in 301|302|303|307|308|401|403|405) ;; *) echo "Unsigned privileged boundary failed $path HTTP $code" >&2; exit 1;; esac
          done
          webhook="$(curl -sS --max-time 30 -X POST -H 'content-type: application/json' --data '{}' -o /dev/null -w '%{http_code}' https://truelycollectables.com/api/webhook || true)"
          test "$webhook" != 200
          printf '{"productPath":"%s","unsignedWebhook":%s,"privilegedRoutesProtected":true,"verifiedAt":"%s"}\n' "$product_path" "$webhook" "$(date -u +%FT%TZ)" > "$EVIDENCE_DIR/live-boundary-receipt.json"

      - name: Run Production Lighthouse gates
        shell: bash
        run: |
          set -euo pipefail
          npm install --global lighthouse@12.8.2 >/dev/null
          for spec in home:/ shop:/shop signup:/signup cart:/cart; do
            page="${spec%%:*}"
            path="${spec#*:}"
            lighthouse "https://truelycollectables.com$path" --quiet --chrome-flags='--headless --no-sandbox --disable-gpu' --output=json --output-path="$EVIDENCE_DIR/lighthouse-$page.json"
          done
          EVIDENCE="$EVIDENCE_DIR" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const receipt={ok:true,pages:{},verifiedAt:new Date().toISOString()};
          for(const page of ['home','shop','signup','cart']){const report=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE}/lighthouse-${page}.json`,'utf8'));const categories=report.categories;const scores={performance:categories.performance.score,accessibility:categories.accessibility.score,bestPractices:categories['best-practices'].score,seo:categories.seo.score};if(scores.performance<.70||scores.accessibility<.95||scores.bestPractices<.95)throw new Error(`${page} Lighthouse blocker ${JSON.stringify(scores)}`);if(['home','shop'].includes(page)&&scores.seo<.95)throw new Error(`${page} SEO blocker ${scores.seo}`);receipt.pages[page]=scores;}
          fs.writeFileSync(`${process.env.EVIDENCE}/lighthouse-summary.json`,JSON.stringify(receipt,null,2));
          NODE

      - name: Write exact Production certificate pending connected Gmail inspection
        shell: bash
        run: |
          cat > "$EVIDENCE_DIR/app-email-certificate.json" <<EOF
          {
            "schema":"truelycollectables.launch2AppEmailCertificate.v1",
            "status":"PASS_PENDING_GMAIL_RECEIPT_CONFIRMATION",
            "exactProductionSha":"$EXPECTED_MAIN_SHA",
            "productionDeployment":"https://truely-collectables-gugzaemni-truelycollectables-projects.vercel.app",
            "baseCertificateRun":30519570854,
            "baseCertificateArtifact":8750313615,
            "baseSimulationBuildDatabaseDeploymentGatesPassed":true,
            "controlledProductionAppEmailsSent":6,
            "idempotentReplayDispatches":6,
            "temporaryCredentialRestored":true,
            "testDatabaseRecordsRemoved":true,
            "controlledInboxReceiptRequiresConnectedGmailVerification":true,
            "realMoneyCharge":false,
            "realPostagePurchase":false,
            "carrierAcceptanceScan":false,
            "physicalDelivery":false,
            "refundOrDispute":false,
            "certifiedAt":"$(date -u +%FT%TZ)"
          }
          EOF

      - name: Upload sanitized app email and live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch2-final-70362f-app-email-${{ env.EXPECTED_MAIN_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
