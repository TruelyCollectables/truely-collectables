name: Checklist Registry Pokémon Japanese Official Verification

on:
  pull_request:
    paths:
      - "scripts/verify-pokemon-japanese-official-sources.ts"
      - "scripts/finalize-pokemon-japanese-official-verification.ts"
      - "scripts/run-pokemon-japanese-official-verification.ts"
      - "scripts/build-tcgdex-japanese-registry-bundles.ts"
      - "src/lib/checklist-registry/tcgdex-japanese.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-official.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/verify-pokemon-japanese-official-sources.ts"
      - "scripts/finalize-pokemon-japanese-official-verification.ts"
      - "scripts/run-pokemon-japanese-official-verification.ts"
      - "scripts/build-tcgdex-japanese-registry-bundles.ts"
      - "src/lib/checklist-registry/tcgdex-japanese.ts"
      - ".github/workflows/checklist-registry-pokemon-ja-official.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-japanese-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint official-source verifier
        run: >-
          npx eslint
          scripts/verify-pokemon-japanese-official-sources.ts
          scripts/finalize-pokemon-japanese-official-verification.ts
          scripts/run-pokemon-japanese-official-verification.ts

      - name: Check out current TCGdex source
        run: >-
          git clone --depth 1
          https://github.com/tcgdex/cards-database.git
          .codex-run/tcgdex-cards-database

      - name: Build Japanese Registry bundles
        run: >-
          npx tsx scripts/build-tcgdex-japanese-registry-bundles.ts
          .codex-run/tcgdex-cards-database
          .codex-run/tcgdex-ja-registry-bundles
          --receipt .codex-run/tcgdex-ja-build-receipt.json

      - name: Resolve official mappings for every complete Japanese bundle
        run: >-
          npx tsx scripts/run-pokemon-japanese-official-verification.ts
          .codex-run/tcgdex-ja-registry-bundles
          --mapping-only
          --delay-ms 50
          --receipt .codex-run/pokemon-ja-official-mapping-receipt.json
          --queue .codex-run/pokemon-ja-official-mapping-queue.json

      - name: Verify mapping receipt
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/pokemon-ja-official-mapping-receipt.json');
          if (receipt.attemptedSets !== 98) throw new Error(`Expected 98 complete Japanese bundles, received ${receipt.attemptedSets}`);
          if (receipt.officialSource.productOptions < 80) throw new Error(`Official product option list unexpectedly small: ${receipt.officialSource.productOptions}`);
          if ((receipt.statusCounts.failed || 0) !== 0) throw new Error(`Mapping failures: ${receipt.statusCounts.failed}`);
          if ((receipt.statusCounts.manual_review || 0) < 1) throw new Error('No official Japanese products were mapped');
          console.log(JSON.stringify({
            attemptedSets: receipt.attemptedSets,
            statusCounts: receipt.statusCounts,
            totals: receipt.totals,
          }, null, 2));
          NODE

      - name: Verify Pokémon Card 151 against live official API and detail pages
        run: >-
          npx tsx scripts/run-pokemon-japanese-official-verification.ts
          .codex-run/tcgdex-ja-registry-bundles
          --set SV2a
          --delay-ms 100
          --detail-samples 5
          --receipt .codex-run/pokemon-ja-sv2a-official-receipt.json
          --queue .codex-run/pokemon-ja-sv2a-official-queue.json

      - name: Verify live official-source receipt
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/pokemon-ja-sv2a-official-receipt.json');
          const row = receipt.rows[0];
          console.log(JSON.stringify({
            setId: row.setId,
            status: row.status,
            reasons: row.reasons,
            officialProduct: row.officialProduct,
            registryCardCount: row.registryCardCount,
            officialCardCount: row.officialCollectedCount,
            officialComparableCount: row.officialComparableCount,
            officialHitCount: row.officialHitCount,
            countMatches: row.countMatches,
            setCodeMatches: row.setCodeMatches,
            nameMultisetMatches: row.nameMultisetMatches,
            orderedNameMismatchCount: row.orderedNameMismatchCount,
            orderedNameMismatches: row.orderedNameMismatches.slice(0, 10),
            missingOfficialNamesInRegistry: row.missingOfficialNamesInRegistry,
            extraRegistryNames: row.extraRegistryNames,
            detailSamples: row.detailEvidence,
          }, null, 2));
          if (receipt.attemptedSets !== 1) throw new Error(`Unexpected audited set count: ${receipt.attemptedSets}`);
          if (row.setId !== 'SV2a') throw new Error(`Unexpected set: ${row.setId}`);
          if (!['verified', 'manual_review'].includes(row.status)) {
            throw new Error(`SV2a official verification status: ${row.status} ${JSON.stringify(row.reasons)}`);
          }
          if (row.registryCardCount !== 210 || row.officialCollectedCount !== 210 || row.officialComparableCount !== 210 || row.officialHitCount !== 210) {
            throw new Error(`SV2a count mismatch: ${JSON.stringify({ registry: row.registryCardCount, collected: row.officialCollectedCount, comparable: row.officialComparableCount, hit: row.officialHitCount })}`);
          }
          if (row.countMatches !== true || row.setCodeMatches !== true || row.nameMultisetMatches !== true) {
            throw new Error(`SV2a hard comparison failed: ${JSON.stringify({ countMatches: row.countMatches, setCodeMatches: row.setCodeMatches, nameMultisetMatches: row.nameMultisetMatches })}`);
          }
          if (row.detailEvidence.length < 5) throw new Error(`Unexpected detail sample count: ${row.detailEvidence.length}`);
          if (row.detailEvidence.some((detail) => detail.error || detail.nameMatches === false || detail.numberMatches === false || detail.setCodeMatches === false)) {
            throw new Error(`SV2a detail evidence mismatch: ${JSON.stringify(row.detailEvidence)}`);
          }
          if (receipt.totals.printedNumberMismatches !== 0) throw new Error(`Printed-number mismatches: ${receipt.totals.printedNumberMismatches}`);
          NODE

      - name: Recheck the ten reported hard mismatches
        run: >-
          npx tsx scripts/run-pokemon-japanese-official-verification.ts
          .codex-run/tcgdex-ja-registry-bundles
          --set M-P
          --set MC
          --set SV1a
          --set SV1S
          --set SV1V
          --set SV5K
          --set SV8
          --set SVK
          --set SVLN
          --set SVLS
          --delay-ms 75
          --detail-samples 3
          --receipt .codex-run/pokemon-ja-triage-official-receipt.json
          --queue .codex-run/pokemon-ja-triage-official-queue.json

      - name: Verify corrected discrepancy classifications
        run: |
          node - <<'NODE'
          const receipt = require('./.codex-run/pokemon-ja-triage-official-receipt.json');
          const mismatchIds = receipt.rows
            .filter((row) => row.status === 'mismatch')
            .map((row) => row.setId)
            .sort();
          const expectedMismatchIds = ['M-P', 'SV5K', 'SV8'];
          const resolvedIds = ['MC', 'SV1a', 'SV1S', 'SV1V', 'SVK', 'SVLN', 'SVLS'];
          console.log(JSON.stringify({
            attemptedSets: receipt.attemptedSets,
            statusCounts: receipt.statusCounts,
            totals: receipt.totals,
            mismatchIds,
            rows: receipt.rows.map((row) => ({
              setId: row.setId,
              status: row.status,
              registryCards: row.registryCardCount,
              officialProductCards: row.officialCollectedCount,
              officialComparableCards: row.officialComparableCount,
              officialExcludedCards: row.officialExcludedCount,
              officialExcludedSetCodes: row.officialExcludedSetCodes,
              reasons: row.reasons,
            })),
          }, null, 2));
          if (receipt.attemptedSets !== 10) throw new Error(`Unexpected triage set count: ${receipt.attemptedSets}`);
          if ((receipt.statusCounts.failed || 0) !== 0) throw new Error(`Triage failures: ${receipt.statusCounts.failed}`);
          if (JSON.stringify(mismatchIds) !== JSON.stringify(expectedMismatchIds)) {
            throw new Error(`Unexpected hard mismatches: ${JSON.stringify(mismatchIds)}`);
          }
          for (const setId of resolvedIds) {
            const row = receipt.rows.find((candidate) => candidate.setId === setId);
            if (!row || row.status === 'mismatch' || row.status === 'failed') {
              throw new Error(`${setId} was not resolved: ${JSON.stringify(row)}`);
            }
          }
          const mp = receipt.rows.find((row) => row.setId === 'M-P');
          if (!mp || mp.registryCardCount !== 83 || mp.officialComparableCount !== 106 || mp.officialExcludedCount !== 8) {
            throw new Error(`Unexpected M-P comparison: ${JSON.stringify(mp)}`);
          }
          if ((receipt.totals.excludedOfficialCards || 0) < 1) {
            throw new Error('No mixed-product official cards were excluded');
          }
          if ((receipt.totals.printedNumberMismatches || 0) !== 0) {
            throw new Error(`False printed-number mismatches remain: ${receipt.totals.printedNumberMismatches}`);
          }
          NODE
