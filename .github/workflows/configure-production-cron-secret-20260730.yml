name: Configure Production Cron Secret 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/configure-production-cron-secret-20260730.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'deploy/issue253-hosted-cutover-v2-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: eff61e573154f4ad2ccc05eae0fe3fa542e94a95
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/issue253-hosted-cutover-v2-20260730
          fetch-depth: 0

      - name: Fail closed on exact main and helper scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/configure-production-cron-secret-20260730.yml"
          test "${changed[1]}" = ".github/workflows/issue253-hosted-cutover-v2-20260730.yml"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD

      - name: Set up Vercel project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel "$RUNNER_TEMP/cron-secret-config"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Confirm Production cron secret is currently absent
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/cron-secret-config/before.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(process.env.RUNNER_TEMP + '/cron-secret-config/before.env', 'utf8');
          const exists = text.split(/\r?\n/).some((line) => /^CRON_SECRET=/.test(line.trim()));
          if (exists) throw new Error('CRON_SECRET already exists; refusing to replace it blindly.');
          NODE

      - name: Generate and add sensitive Production cron secret
        shell: bash
        run: |
          set -euo pipefail
          openssl rand -hex 32 > "$RUNNER_TEMP/cron-secret-config/value.txt"
          secret="$(cat "$RUNNER_TEMP/cron-secret-config/value.txt")"
          test "${#secret}" -eq 64
          echo "::add-mask::$secret"
          npx vercel@56.2.0 env add CRON_SECRET production --force --sensitive \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            < "$RUNNER_TEMP/cron-secret-config/value.txt" >/dev/null

      - name: Verify Production cron secret round-trip without disclosure
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/cron-secret-config/after.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const expected = fs.readFileSync(process.env.RUNNER_TEMP + '/cron-secret-config/value.txt', 'utf8').trim();
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + '/cron-secret-config/after.env', 'utf8').split(/\r?\n/);
          const row = lines.find((line) => /^CRON_SECRET=/.test(line.trim()));
          if (!row) throw new Error('CRON_SECRET was not returned by Vercel after configuration.');
          let actual = row.slice(row.indexOf('=') + 1).trim();
          if (actual.startsWith('"') && actual.endsWith('"')) actual = JSON.parse(actual);
          else if (actual.startsWith("'") && actual.endsWith("'")) actual = actual.slice(1, -1);
          if (actual !== expected) throw new Error('CRON_SECRET round-trip value mismatch.');
          fs.writeFileSync('.audit-cron-secret-receipt.json', JSON.stringify({
            ok: true,
            environment: 'production',
            sensitive: true,
            sha256: crypto.createHash('sha256').update(actual).digest('hex'),
            configuredAt: new Date().toISOString(),
          }, null, 2));
          NODE
          rm -f "$RUNNER_TEMP/cron-secret-config/value.txt" "$RUNNER_TEMP/cron-secret-config/before.env" "$RUNNER_TEMP/cron-secret-config/after.env"

      - name: Upload sanitized configuration receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-cron-secret-configuration-receipt
          path: .audit-cron-secret-receipt.json
          if-no-files-found: error
          retention-days: 90
