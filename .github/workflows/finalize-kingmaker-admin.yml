name: Finalize KINGMAKER admin integration

on:
  push:
    branches:
      - agent/kingmaker-morning-intel
    paths:
      - ".github/workflows/finalize-kingmaker-admin.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kingmaker-morning-intel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore canonical dashboard and add KINGMAKER route
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy = Path("src/app/admin/LegacyAdminDashboard.tsx")
          page = Path("src/app/admin/page.tsx")
          source = legacy.read_text()
          marker = '        { href: "/admin/market-intel", label: "Command Desk" },\n'
          addition = '''        {
          href: "/admin/market-intel/kingmaker/morning-intelligence",
          label: "KINGMAKER Morning Intelligence",
        },
'''
          route = '/admin/market-intel/kingmaker/morning-intelligence'

          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one Market Intel Command Desk marker")
          if route not in source:
              source = source.replace(marker, marker + addition, 1)
          if source.count(route) != 1:
              raise SystemExit("KINGMAKER route must appear exactly once")

          page.write_text(source)
          legacy.unlink()
          Path(".github/workflows/finalize-kingmaker-admin.yml").unlink()
          PY
      - name: Validate complete admin and KINGMAKER surface
        run: |
          git diff --check
          npm run verify:admin-dashboard
          npx eslint src/app/admin/page.tsx
          npx tsc --noEmit
          node scripts/run-kingmaker-morning-intelligence-route-contracts.mjs
      - name: Commit final admin integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize KINGMAKER admin command integration"
          git push origin HEAD:agent/kingmaker-morning-intel
