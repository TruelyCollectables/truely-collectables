name: Release InstaComp Mobile live

on:
  push:
    branches: [main]
    paths:
      - "src/app/admin/instacomp/mobile/**"
      - "src/app/api/internal/instacomp-mobile-live-verify/**"
      - ".github/workflows/release-instacomp-mobile-live.yml"

permissions:
  contents: write

concurrency:
  group: release-instacomp-mobile-live
  cancel-in-progress: false

jobs:
  release-and-certify:
    if: "!contains(github.event.head_commit.message, '[skip instacomp release]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify source contract
        run: |
          set -euo pipefail
          grep -F 'MobileInstaCompScanner' src/app/admin/instacomp/mobile/page.tsx
          grep -F 'Built for portrait mode' src/app/admin/instacomp/mobile/page.tsx
          grep -F 'Run InstaComp' src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx
          grep -F 'Sold comps (' src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx
          grep -F 'Current listings (' src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx
          grep -F 'Approx total' src/app/admin/instacomp/mobile/MobileInstaCompScanner.tsx
          ! grep -Fq 'InstaComp™ Auto-Pilot' src/app/admin/instacomp/mobile/page.tsx

      - name: Link Vercel project
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Provision temporary runtime verification secret
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/instacomp-live-verify-secret"
          openssl rand -hex 32 > "$secret_file"
          chmod 600 "$secret_file"
          secret="$(cat "$secret_file")"
          echo "::add-mask::$secret"
          npx vercel@56.2.0 env add INSTACOMP_LIVE_VERIFY_SECRET production --force --sensitive --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" < "$secret_file" >/dev/null

      - name: Deploy current main to Production
        id: deploy
        run: |
          set -euo pipefail
          output="$(npx vercel@56.2.0 deploy --prod --yes --no-color --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify protected live pages inside Production runtime
        id: verify
        run: |
          set -euo pipefail
          secret="$(cat "$RUNNER_TEMP/instacomp-live-verify-secret")"
          code=""
          for attempt in $(seq 1 24); do
            code="$(curl -sS -L --max-time 120 -o "$RUNNER_TEMP/live-verify.json" -w '%{http_code}' -H "x-instacomp-live-verify: $secret" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -A 'TCOSMobileReleaseVerifier/1.0' "$PRODUCTION_ORIGIN/api/internal/instacomp-mobile-live-verify?attempt=$attempt&sha=$GITHUB_SHA")"
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          echo "LIVE_VERIFY_HTTP_STATUS=$code"
          if [ -f "$RUNNER_TEMP/live-verify.json" ]; then
            cat "$RUNNER_TEMP/live-verify.json"
          else
            echo '{"ok":false,"error":"Verifier returned no response body."}'
          fi
          test "$code" = "200"
          node - "$RUNNER_TEMP/live-verify.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!payload.ok) throw new Error(payload.error || 'Runtime verification failed');
          const required = ['adminDashboard','instacompMobile','cardStudio','noAutoPilot','noBatchControls','portraitRevision','compSource'];
          for (const key of required) {
            if (payload.checks?.[key] !== true) throw new Error(`Missing live check: ${key}`);
          }
          NODE

      - name: Remove temporary runtime secret
        if: always()
        run: |
          set +e
          npx vercel@56.2.0 env rm INSTACOMP_LIVE_VERIFY_SECRET production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1

      - name: Redeploy clean Production without temporary secret
        id: clean_deploy
        if: always()
        run: |
          set -euo pipefail
          output="$(npx vercel@56.2.0 deploy --prod --yes --no-color --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Commit live verification receipt
        if: steps.verify.outcome == 'success' && steps.clean_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p deployment-receipts
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployment-receipts/instacomp-mobile-live.md <<EOF
          # InstaComp Mobile Production Verification

          - Verified at: $timestamp
          - Source commit: $GITHUB_SHA
          - Production domain: https://truelycollectables.com
          - Clean Production deployment: ${{ steps.clean_deploy.outputs.url }}
          - Admin dashboard: PASS
          - InstaComp Mobile portrait layout: PASS
          - Auto-Pilot absent: PASS
          - Desktop batch controls absent: PASS
          - Sold comps/current listings/approximate total source: PASS
          - Card Studio: PASS
          - Temporary verification secret removed before final redeploy: PASS
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-receipts/instacomp-mobile-live.md
          git commit -m "Record verified InstaComp Mobile Production release [skip instacomp release]"
          git push origin HEAD:main
