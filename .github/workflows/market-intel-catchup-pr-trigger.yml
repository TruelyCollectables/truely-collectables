name: Market Intel Live Catch-up Trigger

on:
  pull_request:
    branches: [main]
    paths:
      - "market-intel-catchup-trigger.txt"

permissions:
  contents: read

jobs:
  run-live-catchup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
    steps:
      - name: Verify live protected route
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/market-intel-unauthorized.json"
          status="$(curl --silent --show-error --location \
            --retry 5 --retry-all-errors \
            --max-time 60 \
            --output "$body" \
            --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -A 'TCOSMarketIntelPRCatchup/1.0' \
            "$PRODUCTION_ORIGIN/api/cron/market-intel/reports/daily-catchup?verify=$(date +%s)")"
          test "$status" = "401"
          echo "MARKET_INTEL_CATCHUP_ROUTE_PROTECTED=passed"

      - name: Load Production cron authorization without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          env_file="$RUNNER_TEMP/market-intel-production.env"
          npx vercel@56.2.0 env pull "$env_file" \
            --yes \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          chmod 600 "$env_file"
          set -a
          source "$env_file"
          set +a
          test -n "${CRON_SECRET:-}"
          echo "::add-mask::$CRON_SECRET"
          printf '%s' "$CRON_SECRET" > "$RUNNER_TEMP/market-intel-cron-secret"
          chmod 600 "$RUNNER_TEMP/market-intel-cron-secret"

      - name: Refresh sources, rebuild report, and deliver
        shell: bash
        run: |
          set -euo pipefail
          cron_secret="$(cat "$RUNNER_TEMP/market-intel-cron-secret")"
          test -n "$cron_secret"
          echo "::add-mask::$cron_secret"
          body="$RUNNER_TEMP/market-intel-catchup.json"
          status="$(curl --silent --show-error --location \
            --retry 2 --retry-all-errors \
            --max-time 310 \
            --output "$body" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $cron_secret" \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -A 'TCOSMarketIntelPRCatchup/1.0' \
            "$PRODUCTION_ORIGIN/api/cron/market-intel/reports/daily-catchup?run=$(date +%s)")"
          test "$status" = "200"
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.error) throw new Error(payload.error);
          const refresh = payload.refresh || payload.report?.report_json?.sourceFreshness || {};
          const delivery = payload.delivery || {};
          console.log(`MARKET_INTEL_REPORT_ID=${payload.report?.id || payload.reportId || "unknown"}`);
          console.log(`MARKET_INTEL_REPORT_DATE=${payload.report?.report_date || "unknown"}`);
          console.log(`MARKET_INTEL_HEADLINE=${payload.report?.headline || "unknown"}`);
          console.log(`MARKET_INTEL_REFRESHED=${payload.refreshed ?? false}`);
          console.log(`MARKET_INTEL_SKIPPED=${payload.skipped ?? false}`);
          console.log(`MARKET_INTEL_REASON=${payload.reason || delivery.reason || "none"}`);
          console.log(`MARKET_INTEL_SOURCE_STATUS=${refresh.status || "unknown"}`);
          console.log(`MARKET_INTEL_REFRESHED_AT=${refresh.refreshedAt || payload.refreshedAt || "unknown"}`);
          console.log(`MARKET_INTEL_ACTIVE_IDENTITIES=${refresh.activeIdentityCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_TARGETS=${refresh.targetCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_SUCCESSFUL_TARGETS=${refresh.successfulTargetCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_FAILED_TARGETS=${refresh.failedTargetCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_SKIPPED_IDENTITIES=${refresh.skippedIdentityCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_CANDIDATES_ACCEPTED=${refresh.candidatesAccepted ?? "unknown"}`);
          console.log(`MARKET_INTEL_LISTINGS_CREATED=${refresh.listingsCreated ?? "unknown"}`);
          console.log(`MARKET_INTEL_LISTINGS_UPDATED=${refresh.listingsUpdated ?? "unknown"}`);
          console.log(`MARKET_INTEL_PRICE_CHANGES=${refresh.priceChanges ?? "unknown"}`);
          console.log(`MARKET_INTEL_LISTINGS_SCORED=${refresh.listingsScored ?? "unknown"}`);
          console.log(`MARKET_INTEL_ENDED_AUCTIONS=${refresh.cleanup?.endedAuctions ?? "unknown"}`);
          console.log(`MARKET_INTEL_MARKED_STALE=${refresh.cleanup?.markedStale ?? "unknown"}`);
          console.log(`MARKET_INTEL_DELIVERED=${delivery.delivered ?? false}`);
          console.log(`MARKET_INTEL_ALREADY_DELIVERED=${delivery.alreadyDelivered ?? false}`);
          console.log(`MARKET_INTEL_DELIVERY_SKIPPED=${delivery.skipped ?? false}`);
          console.log(`MARKET_INTEL_DELIVERY_FAILED=${delivery.failed ?? false}`);
          console.log(`MARKET_INTEL_DELIVERY_ERROR=${delivery.error || "none"}`);
          NODE
