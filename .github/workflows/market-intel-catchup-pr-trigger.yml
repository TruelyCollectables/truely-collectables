name: Market Intel Live Catch-up Trigger

on:
  pull_request:
    branches: [main]
    paths:
      - "market-intel-catchup-trigger.txt"

permissions:
  contents: read

jobs:
  run-live-catchup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      PRODUCTION_ORIGIN: https://truelycollectables.com
    steps:
      - name: Verify live protected daily report route
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/market-intel-unauthorized.json"
          status="$(curl --silent --show-error --location \
            --retry 5 --retry-all-errors \
            --max-time 60 \
            --output "$body" \
            --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -A 'TCOSMarketIntelPRCatchup/1.0' \
            "$PRODUCTION_ORIGIN/api/cron/market-intel/reports/daily?verify=$(date +%s)")"
          test "$status" = "401"
          echo "MARKET_INTEL_DAILY_ROUTE_PROTECTED=passed"

      - name: Link Vercel Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

      - name: Provision secure Market Intel authorization and redeploy Production
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/market-intel-run-secret"
          openssl rand -hex 32 > "$secret_file"
          chmod 600 "$secret_file"
          run_secret="$(cat "$secret_file")"
          echo "::add-mask::$run_secret"

          npx vercel@56.2.0 env add MARKET_INTEL_INGEST_SECRET production \
            --force \
            --sensitive \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            < "$secret_file" >/dev/null
          echo "MARKET_INTEL_PRODUCTION_AUTHORIZATION=configured"

          list_output="$(npx vercel@56.2.0 list truely-collectables \
            --prod \
            --no-color \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" 2>&1)"
          deployment_url="$(printf '%s\n' "$list_output" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | head -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Unable to resolve the current Production deployment URL." >&2
            printf '%s\n' "$list_output" >&2
            exit 1
          fi

          redeployed_url="$(npx vercel@56.2.0 redeploy "$deployment_url" \
            --target=production \
            --no-color \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN")"
          test -n "$redeployed_url"
          echo "MARKET_INTEL_PRODUCTION_REDEPLOY=complete"

          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl --silent --show-error --location \
              --max-time 60 \
              --output "$RUNNER_TEMP/market-intel-post-redeploy.json" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -A 'TCOSMarketIntelPRCatchup/1.0' \
              "$PRODUCTION_ORIGIN/api/cron/market-intel/reports/daily?postRedeploy=$(date +%s)")"
            if [ "$status" = "401" ]; then
              echo "MARKET_INTEL_PRODUCTION_ROUTE=ready"
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then sleep 8; fi
          done
          echo "Production route did not become ready after redeployment." >&2
          exit 1

      - name: Refresh every source, rebuild report, and deliver
        shell: bash
        run: |
          set -euo pipefail
          run_secret="$(cat "$RUNNER_TEMP/market-intel-run-secret")"
          test -n "$run_secret"
          echo "::add-mask::$run_secret"
          body="$RUNNER_TEMP/market-intel-daily.json"
          status="$(curl --silent --show-error --location \
            --retry 2 --retry-all-errors \
            --max-time 310 \
            --output "$body" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $run_secret" \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -A 'TCOSMarketIntelPRCatchup/1.0' \
            "$PRODUCTION_ORIGIN/api/cron/market-intel/reports/daily?run=$(date +%s)")"
          if [ "$status" != "200" ]; then
            echo "Daily Market Intel route returned HTTP $status." >&2
            cat "$body" >&2 || true
            exit 1
          fi
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.error) throw new Error(payload.error);
          const refresh = payload.refresh || payload.report?.report_json?.sourceFreshness || {};
          const delivery = payload.delivery || {};
          console.log(`MARKET_INTEL_REPORT_ID=${payload.report?.id || payload.reportId || "unknown"}`);
          console.log(`MARKET_INTEL_REPORT_DATE=${payload.report?.report_date || "unknown"}`);
          console.log(`MARKET_INTEL_HEADLINE=${payload.report?.headline || "unknown"}`);
          console.log(`MARKET_INTEL_SOURCE_STATUS=${refresh.status || "unknown"}`);
          console.log(`MARKET_INTEL_REFRESHED_AT=${refresh.refreshedAt || "unknown"}`);
          console.log(`MARKET_INTEL_ACTIVE_IDENTITIES=${refresh.activeIdentityCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_TARGETS=${refresh.targetCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_SUCCESSFUL_TARGETS=${refresh.successfulTargetCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_FAILED_TARGETS=${refresh.failedTargetCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_SKIPPED_IDENTITIES=${refresh.skippedIdentityCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_CANDIDATES_ACCEPTED=${refresh.candidatesAccepted ?? "unknown"}`);
          console.log(`MARKET_INTEL_LISTINGS_CREATED=${refresh.listingsCreated ?? "unknown"}`);
          console.log(`MARKET_INTEL_LISTINGS_UPDATED=${refresh.listingsUpdated ?? "unknown"}`);
          console.log(`MARKET_INTEL_PRICE_CHANGES=${refresh.priceChanges ?? "unknown"}`);
          console.log(`MARKET_INTEL_LISTINGS_SCORED=${refresh.listingsScored ?? "unknown"}`);
          console.log(`MARKET_INTEL_ENDED_AUCTIONS=${refresh.cleanup?.endedAuctions ?? "unknown"}`);
          console.log(`MARKET_INTEL_MARKED_STALE=${refresh.cleanup?.markedStale ?? "unknown"}`);
          console.log(`MARKET_INTEL_PENDING_ALERTS=${payload.pendingAlertCount ?? "unknown"}`);
          console.log(`MARKET_INTEL_DELIVERED=${delivery.delivered ?? false}`);
          console.log(`MARKET_INTEL_ALREADY_DELIVERED=${delivery.alreadyDelivered ?? false}`);
          console.log(`MARKET_INTEL_DELIVERY_SKIPPED=${delivery.skipped ?? false}`);
          console.log(`MARKET_INTEL_DELIVERY_FAILED=${delivery.failed ?? false}`);
          console.log(`MARKET_INTEL_DELIVERY_ERROR=${delivery.error || "none"}`);
          NODE
