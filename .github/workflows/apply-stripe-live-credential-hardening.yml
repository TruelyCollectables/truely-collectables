name: Apply Stripe Live Credential Hardening

on:
  push:
    branches:
      - agent/stripe-live-credentials-fail-closed-20260726
    paths:
      - scripts/apply-stripe-live-credential-hardening.mjs
      - .github/workflows/apply-stripe-live-credential-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'TruelyCollectables'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/stripe-live-credentials-fail-closed-20260726
          fetch-depth: 0

      - name: Apply exact Stripe live credential transformation
        run: node scripts/apply-stripe-live-credential-hardening.mjs

      - name: Validate patch shape
        run: git diff --check

      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet -- src/lib/stripe-credentials.ts scripts/status-live-money.ts scripts/live-money-env-packet.mjs; then
            echo "No Stripe live credential hardening changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/stripe-credentials.ts scripts/status-live-money.ts scripts/live-money-env-packet.mjs
          git commit -m "Require dedicated Stripe live credentials"
          git push origin HEAD:agent/stripe-live-credentials-fail-closed-20260726
