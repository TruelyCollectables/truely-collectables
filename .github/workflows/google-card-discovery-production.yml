name: Google Card Discovery Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-card-discovery-production.yml"
      - "src/app/google-merchant-feed.xml/route.ts"
      - "supabase/migrations/20260801031000_grant_collx_boundary_view_select_service_role.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-card-discovery-production
  cancel-in-progress: false

jobs:
  migrate-deploy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify release contents
        shell: bash
        run: |
          set -euo pipefail
          test -f src/app/google-merchant-feed.xml/route.ts
          test -f supabase/migrations/20260801031000_grant_collx_boundary_view_select_service_role.sql
          grep -Fq 'xmlns:g="http://base.google.com/ns/1.0"' src/app/google-merchant-feed.xml/route.ts
          grep -Fq 'grant select on table public.collx_only_inventory_boundary_violations to service_role;' \
            supabase/migrations/20260801031000_grant_collx_boundary_view_select_service_role.sql
          if grep -Eqi 'grant[[:space:]]+select.*to[[:space:]]+(anon|authenticated)' \
            supabase/migrations/20260801031000_grant_collx_boundary_view_select_service_role.sql; then
            echo "Migration must not grant the boundary view to a public role." >&2
            exit 1
          fi

      - name: Link Vercel project and pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/google-card-discovery"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          fi
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"
          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/google-card-discovery/production.env" \
            --yes \
            --environment production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

      - name: Apply and verify storefront permission migration
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ runner.temp }}/google-card-discovery/production.env
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          function parseEnvFile(file) {
            const parsed = {};
            for (const rawLine of fs.readFileSync(file, "utf8").split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith("#")) continue;
              const index = line.indexOf("=");
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }

          const envFile = process.env.PRODUCTION_ENV_FILE;
          const accessToken = process.env.GH_SUPABASE_ACCESS_TOKEN;
          if (!envFile || !accessToken) {
            throw new Error("Production environment file and Supabase access token are required.");
          }

          const env = parseEnvFile(envFile);
          const productionUrl = env.NEXT_PUBLIC_SUPABASE_URL;
          if (!productionUrl || !/^https:\/\//.test(productionUrl)) {
            throw new Error("Production Supabase URL was not pulled from Vercel.");
          }

          const projectRef = new URL(productionUrl).hostname.split(".")[0];
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;

          async function databaseQuery(query, readOnly = false) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Supabase query failed with HTTP ${response.status}: ${body.slice(0, 2000)}`);
            }
            return body;
          }

          const migrationPath =
            "supabase/migrations/20260801031000_grant_collx_boundary_view_select_service_role.sql";
          await databaseQuery(fs.readFileSync(migrationPath, "utf8"), false);

          const verificationBody = await databaseQuery(`
            select
              has_table_privilege(
                'service_role',
                'public.collx_only_inventory_boundary_violations',
                'select'
              ) as service_role_can_select,
              has_table_privilege(
                'anon',
                'public.collx_only_inventory_boundary_violations',
                'select'
              ) as anon_can_select,
              has_table_privilege(
                'authenticated',
                'public.collx_only_inventory_boundary_violations',
                'select'
              ) as authenticated_can_select;
          `, true);
          const rows = JSON.parse(verificationBody);
          const row = Array.isArray(rows) ? rows[0] : rows;
          if (row?.service_role_can_select !== true) {
            throw new Error("Production service_role still cannot read the storefront boundary view.");
          }
          if (row?.anon_can_select === true || row?.authenticated_can_select === true) {
            throw new Error("A public role unexpectedly received storefront boundary view access.");
          }

          console.log(`Production storefront permission verified for project ${projectRef}.`);
          NODE
          rm -f "$PRODUCTION_ENV_FILE"

      - name: Run supported Production deployment
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:production

      - name: Run repository Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:production

      - name: Verify live Google discovery surfaces
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_SHA:0:12}-$(date +%s)"
          output_dir="$RUNNER_TEMP/google-card-discovery/live"
          mkdir -p "$output_dir"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            -A "TruelyCollectablesGoogleDiscoveryRelease/1.0" \
            "https://truelycollectables.com/shop?google_release=$stamp" \
            -o "$output_dir/shop.html"
          if grep -Eqi "Error loading products|permission denied for view|Internal Server Error" \
            "$output_dir/shop.html"; then
            echo "The live Shop page still contains a storefront loading error." >&2
            exit 1
          fi
          grep -Fq "Shop Sports Cards" "$output_dir/shop.html"
          grep -Fq "/product/" "$output_dir/shop.html"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            -A "TruelyCollectablesGoogleDiscoveryRelease/1.0" \
            "https://truelycollectables.com/google-merchant-feed.xml?google_release=$stamp" \
            -o "$output_dir/google-merchant-feed.xml"
          grep -Fq '<rss version="2.0" xmlns:g="http://base.google.com/ns/1.0">' \
            "$output_dir/google-merchant-feed.xml"
          grep -Fq "<g:id>" "$output_dir/google-merchant-feed.xml"
          grep -Fq "<g:title>" "$output_dir/google-merchant-feed.xml"
          grep -Fq "<g:price>" "$output_dir/google-merchant-feed.xml"
          grep -Fq "<g:availability>in stock</g:availability>" \
            "$output_dir/google-merchant-feed.xml"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            -A "TruelyCollectablesGoogleDiscoveryRelease/1.0" \
            "https://truelycollectables.com/sitemap.xml?google_release=$stamp" \
            -o "$output_dir/sitemap.xml"
          grep -Fq "https://truelycollectables.com/product/" "$output_dir/sitemap.xml"

          echo "Production Google card discovery release passed live verification."
