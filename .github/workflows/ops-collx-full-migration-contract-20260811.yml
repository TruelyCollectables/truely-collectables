name: Ops CollX Full Migration Contract 20260811

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-collx-full-migration-contract-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove CollX image discovery by collx_id
        shell: bash
        run: |
          set -euo pipefail
          prefix='1129514363171081216-'
          url="https://storage.googleapis.com/storage/v1/b/collx-product-images/o?prefix=${prefix}"
          code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/gcs-list.json" -w '%{http_code}' "$url")"
          test "$code" = "200"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/gcs-list.json'))
          names=[r['name'] for r in x.get('items',[])]
          print({'names':names})
          assert any(n.startswith('1129514363171081216-1-') for n in names)
          assert any(n.startswith('1129514363171081216-2-') for n in names)
          PY
      - name: Probe public TruelyCollectables collection feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collx-public"
          curl -fsSL --max-time 30 -A 'Mozilla/5.0' -D "$RUNNER_TEMP/collx-public/headers.txt" -o "$RUNNER_TEMP/collx-public/profile.html" 'https://share.collx.app/TruelyCollectables'
          python3 - <<'PY'
          import json,re,os,html
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'collx-public/profile.html'
          s=p.read_text(errors='replace')
          print({'bytes':len(s),'containsTruely':('Truely Collectables' in s or 'TruelyCollectables' in s)})
          item_counts=sorted(set(int(x.replace(',','')) for x in re.findall(r'([0-9][0-9,]{2,})\s+Items',s,re.I)))
          print({'itemCounts':item_counts[:20]})
          urls=sorted(set(html.unescape(x) for x in re.findall(r'https?://[^"\'<> ]+',s)))
          api=[u for u in urls if 'collx' in u.lower() or '/api/' in u.lower()]
          print('candidate_urls')
          for u in api[:100]: print(u[:500])
          next_data=re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',s,re.S|re.I)
          if next_data:
              raw=html.unescape(next_data.group(1))
              (p.parent/'next-data.json').write_text(raw)
              try:
                  x=json.loads(raw)
                  print({'nextDataKeys':list(x)[:20],'buildId':x.get('buildId')})
              except Exception as e: print({'nextDataParseError':str(e)})
          scripts=sorted(set(html.unescape(x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I)))
          (p.parent/'scripts.txt').write_text('\n'.join(scripts))
          print({'scriptCount':len(scripts),'scripts':scripts[:30]})
          PY
      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel "$RUNNER_TEMP/collx-contract"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/collx-contract/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
      - name: Snapshot schema and current inventory contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function parseEnv(text){const e={};for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line.startsWith('#'))continue;const i=line.indexOf('=');if(i<1)continue;const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}}else if(v.startsWith("'")&&v.endsWith("'"))v=v.slice(1,-1);e[k]=v}return e}
          const env=parseEnv(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'collx-contract','production.env'),'utf8'));
          const base=env.NEXT_PUBLIC_SUPABASE_URL;if(!base)throw new Error('Supabase URL unavailable');
          const ref=new URL(base).hostname.split('.')[0];
          const mgmt=process.env.GH_SUPABASE_ACCESS_TOKEN;if(!mgmt)throw new Error('Management token unavailable');
          const endpoint=`https://api.supabase.com/v1/projects/${ref}/database/query`;
          async function db(query){const r=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${mgmt}`,'Content-Type':'application/json'},body:JSON.stringify({query,parameters:[],read_only:true}),signal:AbortSignal.timeout(30000)});const t=await r.text();if(!r.ok)throw new Error(`${r.status}: ${t.slice(0,800)}`);return t?JSON.parse(t):[]}
          const tables=['products','inventory_items','inventory_images','seller_profiles','stores'];
          const schema=await db(`select table_name,column_name,data_type,udt_name,is_nullable,column_default,identity_generation from information_schema.columns where table_schema='public' and table_name in (${tables.map(t=>`'${t}'`).join(',')}) order by table_name,ordinal_position`);
          const constraints=await db(`select tc.table_name,tc.constraint_name,tc.constraint_type,kcu.column_name,ccu.table_name foreign_table_name,ccu.column_name foreign_column_name from information_schema.table_constraints tc left join information_schema.key_column_usage kcu on tc.constraint_name=kcu.constraint_name and tc.table_schema=kcu.table_schema left join information_schema.constraint_column_usage ccu on tc.constraint_name=ccu.constraint_name and tc.table_schema=ccu.table_schema where tc.table_schema='public' and tc.table_name in (${tables.map(t=>`'${t}'`).join(',')}) order by tc.table_name,tc.constraint_name,kcu.ordinal_position`);
          const counts=await db(`select (select count(*) from public.products) products,(select count(*) from public.inventory_items) inventory_items,(select count(*) from public.inventory_images) inventory_images,(select count(*) from public.products where nullif(btrim(coalesce(ebay_item_id,'')),'') is not null and archived_at is null) ebay_products,(select count(*) from public.inventory_items i join public.products p on p.id=i.legacy_product_id where nullif(btrim(coalesce(p.ebay_item_id,'')),'') is not null and p.archived_at is null) ebay_inventory_items`);
          const samples=await db(`select p.*, i.id inventory_item_id,i.card_uuid,i.status inventory_status,i.quantity inventory_quantity,i.price inventory_price from public.products p left join public.inventory_items i on i.legacy_product_id=p.id where p.store_id='00000000-0000-4000-8000-000000000001'::uuid order by p.id desc limit 5`);
          const sellers=await db(`select * from public.seller_profiles limit 10`);
          const payload={generated_at:new Date().toISOString(),schema,constraints,counts,samples,sellers,gcsPrefixDiscovery:true,publicCollectionProbe:true};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'collx-contract','contract.json'),JSON.stringify(payload,null,2));
          console.log(JSON.stringify({counts:counts[0],schemaRows:schema.length,constraints:constraints.length,sellerRows:sellers.length,gcsPrefixDiscovery:true,publicCollectionProbe:true},null,2));
          NODE
          rm -f "$RUNNER_TEMP/collx-contract/production.env"
      - name: Upload contract and public probe
        uses: actions/upload-artifact@v4
        with:
          name: collx-full-migration-contract
          path: |
            ${{ runner.temp }}/collx-contract/contract.json
            ${{ runner.temp }}/collx-public/profile.html
            ${{ runner.temp }}/collx-public/headers.txt
            ${{ runner.temp }}/collx-public/next-data.json
            ${{ runner.temp }}/collx-public/scripts.txt
          retention-days: 3
          if-no-files-found: warn
