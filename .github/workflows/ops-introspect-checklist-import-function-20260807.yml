name: Ops Introspect Checklist Import Function 20260807

on:
  push:
    branches: [ops/parkhurst-ivan-production-20260807]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  introspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/parkhurst-ivan-production-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Production function definition
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@56.2.0 env pull /tmp/prod.env --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          PROD_ENV=/tmp/prod.env GH_SUPABASE_ACCESS_TOKEN="$GH_SUPABASE_ACCESS_TOKEN" node - <<'NODE'
          const fs=require('node:fs');
          const parsed={};
          for(const raw of fs.readFileSync(process.env.PROD_ENV,'utf8').split(/\r?\n/)){
            const line=raw.trim(); if(!line||line.startsWith('#')) continue;
            const i=line.indexOf('='); if(i<1) continue;
            const k=line.slice(0,i).trim(); let v=line.slice(i+1).trim();
            if(v.startsWith('"')&&v.endsWith('"')){try{v=JSON.parse(v)}catch{v=v.slice(1,-1)}} parsed[k]=v;
          }
          (async()=>{
            const u=String(parsed.NEXT_PUBLIC_SUPABASE_URL||'').trim(); if(!u) throw new Error('Missing Production Supabase URL');
            const ref=new URL(u).hostname.split('.')[0];
            const query=`SELECT p.oid::regprocedure::text AS signature, pg_get_functiondef(p.oid) AS definition FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='tcos_apply_checklist_import_plan';`;
            const r=await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_SUPABASE_ACCESS_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({query,read_only:true})});
            const text=await r.text(); if(!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0,1000)}`);
            console.log('CHECKLIST_IMPORT_FUNCTION_DEF');
            console.log(text);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: echo introspection-trigger-2
