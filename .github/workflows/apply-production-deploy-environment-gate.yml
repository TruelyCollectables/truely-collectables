name: Apply Production Deploy Environment Gate

on:
  push:
    branches:
      - agent/production-deploy-environment-gate-20260726
    paths:
      - scripts/apply-production-deploy-environment-gate.mjs
      - .github/workflows/apply-production-deploy-environment-gate.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'TruelyCollectables'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-deploy-environment-gate-20260726
          fetch-depth: 0

      - name: Apply exact package script transformation
        run: node scripts/apply-production-deploy-environment-gate.mjs

      - name: Validate package and diff
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"
          git diff --check

      - name: Commit transformed package
        shell: bash
        run: |
          if git diff --quiet -- package.json; then
            echo "No package.json change was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Gate production deploy on Vercel environment audit"
          git push origin HEAD:agent/production-deploy-environment-gate-20260726
