name: InstaComp eBay Price Insights Capture

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/instacomp-ebay-price-insights-capture.yml"
      - "src/lib/instacomp-ebay-price-insights.ts"
      - "src/lib/instacomp-exact-market-provider.ts"
      - "src/lib/instacomp.ts"
      - "src/app/api/instacomp/market-history/route.ts"
      - "scripts/verify-instacomp-ebay-price-insights-capture.ts"
      - "scripts/patch-instacomp-denominator-only-sold-comp.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_BRANCH: feature/instacomp-ebay-price-insights-capture-20260809

jobs:
  exact-sold-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0
      - name: Apply exact-market denominator-only print-run repair
        run: |
          python3 scripts/patch-instacomp-denominator-only-sold-comp.py
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Price Insights exact sold firewall
        run: npx tsx scripts/verify-instacomp-ebay-price-insights-capture.ts
      - name: TypeScript contract
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: npx tsc --noEmit
      - name: Persist tested exact-market repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/instacomp.ts
          if ! git diff --cached --quiet; then
            git commit -m "Accept denominator-only exact sold print runs [skip ci]"
            git push origin "HEAD:$EXPECTED_BRANCH"
          fi
