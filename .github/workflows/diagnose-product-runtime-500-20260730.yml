name: Diagnose Product Runtime 500 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-product-runtime-500-20260730.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-product-runtime-500-20260730
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: bb765778806f4bf658da4fc185d38e43fd9a3fba
  EXPECTED_BRANCH: ops/final-readonly-debug-audit-20260730
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT: truely-collectables
  DEPLOYMENT_ID: dpl_J3RhfkcrmbmXbqfht25qastSvxqC
  PRODUCT_PATH: /product/489878
  EVIDENCE_DIR: .audit/product-runtime-500-20260730

jobs:
  diagnose-product-runtime:
    if: github.event.pull_request.head.ref == 'ops/final-readonly-debug-audit-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out guarded diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact main and one-file diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/diagnose-product-runtime-500-20260730.yml"
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          mkdir -p "$EVIDENCE_DIR"

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null

      - name: Trigger uniquely marked product failure
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          marker="final-debug-${GITHUB_RUN_ID}-$(date -u +%s)"
          url="https://truelycollectables.com${PRODUCT_PATH}?audit_debug=${marker}"
          code="$(curl -sS --max-time 90 -D "$EVIDENCE_DIR/product-response-headers.txt" -o "$EVIDENCE_DIR/product-response.html" -w '%{http_code}' "$url" || true)"
          printf '%s\n' "$marker" > "$EVIDENCE_DIR/request-marker.txt"
          printf '%s\n' "$code" > "$EVIDENCE_DIR/product-status.txt"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "PRODUCT_DIAGNOSTIC marker=$marker status=$code"
          test "$code" = 500

      - name: Collect matching Vercel Production runtime logs
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          npx vercel@56.2.0 logs \
            --project "$VERCEL_PROJECT" \
            --deployment "$DEPLOYMENT_ID" \
            --environment production \
            --status-code 500 \
            --since 30m \
            --limit 100 \
            --json \
            --expand \
            --no-branch \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            > "$EVIDENCE_DIR/vercel-runtime-logs.jsonl"
          test -s "$EVIDENCE_DIR/vercel-runtime-logs.jsonl"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path=process.env.EVIDENCE_DIR+'/vercel-runtime-logs.jsonl';
          const marker=fs.readFileSync(process.env.EVIDENCE_DIR+'/request-marker.txt','utf8').trim();
          const lines=fs.readFileSync(path,'utf8').split(/\r?\n/).filter(Boolean);
          const rows=[];
          for(const line of lines){try{const row=JSON.parse(line);const text=JSON.stringify(row);if(text.includes('/product/489878')||text.includes(marker))rows.push(row);}catch{}}
          const sanitized=rows.map((row)=>({timestamp:row.timestamp||row.time||null,level:row.level||null,statusCode:row.statusCode||row.status||null,requestPath:row.requestPath||row.path||null,message:row.message||row.text||row.error||null,requestId:row.requestId||null}));
          fs.writeFileSync(process.env.EVIDENCE_DIR+'/matching-product-runtime-logs.json',JSON.stringify({marker,matchCount:sanitized.length,rows:sanitized},null,2));
          if(!sanitized.length)throw new Error('No matching product runtime logs found');
          NODE
          rm -f "$EVIDENCE_DIR/vercel-runtime-logs.jsonl"

      - name: Upload sanitized product runtime diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-runtime-500-diagnosis-20260730
          path: .audit/product-runtime-500-20260730
          if-no-files-found: error
          retention-days: 30
