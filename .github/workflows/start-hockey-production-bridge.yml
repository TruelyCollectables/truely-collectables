name: Start Hockey Production Bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/start-hockey-production-bridge.yml'

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  dispatch-hockey-production:
    if: startsWith(github.head_ref, 'ops/run-hockey-production-')
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch and expose Hockey Production run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: instacomp-hockey-final-six-production.yml
          HOCKEY_REF: main
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/dispatches" \
            -d "{\"ref\":\"$HOCKEY_REF\"}"
          run_json=''
          for attempt in $(seq 1 20); do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/runs?branch=$HOCKEY_REF&event=workflow_dispatch&per_page=10")"
            run_json="$(jq -c --arg started "$started_at" '.workflow_runs | map(select(.created_at >= $started)) | sort_by(.created_at) | reverse | .[0] // empty' <<<"$runs")"
            [[ -n "$run_json" ]] && break
            sleep 3
          done
          [[ -n "$run_json" ]] || { echo "Dispatch accepted but no matching run appeared"; exit 1; }
          hockey_run_id="$(jq -r '.id' <<<"$run_json")"
          hockey_status="$(jq -r '.status' <<<"$run_json")"
          hockey_url="$(jq -r '.html_url' <<<"$run_json")"
          echo "HOCKEY_RUN_ID=$hockey_run_id"
          echo "HOCKEY_STATUS=$hockey_status"
          echo "HOCKEY_URL=$hockey_url"
          payload="$(jq -nc --arg state pending --arg target_url "$hockey_url" --arg description "Final-six Hockey Production $hockey_run_id $hockey_status" --arg context "hockey-production-dispatch" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" \
            -d "$payload"

