name: Start Hockey Production Bridge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/start-hockey-production-bridge.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/start-hockey-production-bridge.yml'

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  announce:
    if: github.event_name == 'push' || github.head_ref == 'feature/instacomp-target-checklists-20260816'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish Hockey Production start
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg state pending \
            --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" \
            --arg description "Hockey Production run $RUN_ID started" \
            --arg context "hockey-production-bridge" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "$payload"

  hockey-production:
    if: github.event_name == 'push' || github.head_ref == 'feature/instacomp-target-checklists-20260816'
    needs: announce
    uses: TruelyCollectables/truely-collectables/.github/workflows/instacomp-requested-hockey-finalize-resume-production.yml@feature/instacomp-target-checklists-20260816
    secrets: inherit

  finish:
    if: ${{ always() && (github.event_name == 'push' || github.head_ref == 'feature/instacomp-target-checklists-20260816') }}
    needs:
      - announce
      - hockey-production
    runs-on: ubuntu-24.04
    steps:
      - name: Publish Hockey Production finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.hockey-production.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESULT" == "success" ]]; then state=success; else state=failure; fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg target_url "https://github.com/$REPO/actions/runs/$RUN_ID" \
            --arg description "Hockey Production run $RUN_ID $RESULT" \
            --arg context "hockey-production-bridge" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "$payload"

