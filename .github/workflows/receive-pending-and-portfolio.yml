name: Receive Pending and Show Portfolio

on:
  pull_request:
    branches:
      - main
    paths:
      - ops_receive_pending_portfolio_trigger.txt

permissions:
  contents: read

concurrency:
  group: receive-pending-portfolio-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  receive-and-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: truelycollectables-projects
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link Vercel Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx vercel@56.2.0 link --yes \
            --project truely-collectables \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null

      - name: Provision one-time protected receiving key
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/pending-receiving-action-secret"
          openssl rand -hex 32 > "$secret_file"
          chmod 600 "$secret_file"
          action_secret="$(cat "$secret_file")"
          test -n "$action_secret"
          echo "::add-mask::$action_secret"
          npx vercel@56.2.0 env add PENDING_RECEIVING_READ_SECRET production \
            --force \
            --sensitive \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            < "$secret_file" >/dev/null
          printf 'PENDING_RECEIVING_READ_SECRET=%s\n' "$action_secret" >> "$GITHUB_ENV"
          rm -f "$secret_file"

      - name: Deploy workflow source to Production
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx vercel@56.2.0 deploy \
            --prod \
            --yes \
            --no-color \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" | tail -n 1)"
          test -n "$deployment_url"
          echo "RECEIVING_PRODUCTION_DEPLOY=complete"

      - name: Receive all pending purchases and load portfolio
        shell: bash
        run: |
          set -euo pipefail
          node scripts/receive-pending-and-fetch-portfolio.mjs

      - name: Upload receipt and portfolio
        uses: actions/upload-artifact@v4
        with:
          name: received-and-portfolio-current
          path: |
            audit/received-and-portfolio-current.json
            audit/received-and-portfolio-current.md
          if-no-files-found: error
          retention-days: 1
