name: Temporary InstaComp Live Double Torture Audit

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
    paths:
      - ".github/workflows/temporary-instacomp-live-double-torture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-live-double-torture-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  live-double-torture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GITHUB_INSTACOMP_BENCHMARK_TOKEN: ${{ secrets.INSTACOMP_BENCHMARK_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      INSTACOMP_BYPASS_CACHE: "1"
      INSTACOMP_PROOF_INCLUDE_OPENAI_DISCOVERY: "1"

    steps:
      - name: Check out pinned audit commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run deterministic certification gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/pass-1 reports/pass-2 docs .codex-run
          node --import tsx scripts/run-instacomp-exact-provider-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-final-audit-regressions.ts
          node --import tsx scripts/run-instacomp-live-pipeline-regressions.ts
          node --import tsx scripts/run-instacomp-provider-safety-regressions.ts
          node --import tsx scripts/run-instacomp-batch-drop-regressions.ts
          python scripts/check-instacomp-control-characters.py
          python scripts/assert-instacomp-final-source.py
          npm run lint
          npm run build

      - name: Link correct Vercel project and resolve preview environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .codex-run
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@latest link --yes --project truely-collectables --scope truelycollectables-projects --token "$VERCEL_TOKEN"
          fi
          npx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN" > .codex-run/vercel-pull.log 2>&1

          if [ -f .vercel/.env.preview.local ]; then
            set -a
            . .vercel/.env.preview.local
            set +a
          fi

          RESOLVED_OPENAI_API_KEY="${OPENAI_API_KEY:-}"
          RESOLVED_SERPAPI_API_KEY="${SERPAPI_API_KEY:-}"
          RESOLVED_BENCHMARK_TOKEN="${GITHUB_INSTACOMP_BENCHMARK_TOKEN:-${INSTACOMP_BENCHMARK_TOKEN:-}}"

          test -n "$RESOLVED_OPENAI_API_KEY"
          test -n "$RESOLVED_SERPAPI_API_KEY"
          test "${#RESOLVED_BENCHMARK_TOKEN}" -ge 32

          echo "::add-mask::$RESOLVED_OPENAI_API_KEY"
          echo "::add-mask::$RESOLVED_SERPAPI_API_KEY"
          echo "::add-mask::$RESOLVED_BENCHMARK_TOKEN"
          printf 'OPENAI_API_KEY=%s\n' "$RESOLVED_OPENAI_API_KEY" >> "$GITHUB_ENV"
          printf 'SERPAPI_API_KEY=%s\n' "$RESOLVED_SERPAPI_API_KEY" >> "$GITHUB_ENV"
          printf 'INSTACOMP_BENCHMARK_TOKEN=%s\n' "$RESOLVED_BENCHMARK_TOKEN" >> "$GITHUB_ENV"

      - name: Validate repaired provider keys
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const openAi = await fetch("https://api.openai.com/v1/models", {
            headers: { Authorization: `Bearer ${process.env.OPENAI_API_KEY}` },
            signal: AbortSignal.timeout(30000),
          });
          console.log(`OpenAI credential HTTP status: ${openAi.status}`);
          if (!openAi.ok) process.exit(1);

          const serpUrl = new URL("https://serpapi.com/search.json");
          serpUrl.searchParams.set("engine", "ebay");
          serpUrl.searchParams.set("ebay_domain", "ebay.com");
          serpUrl.searchParams.set("_nkw", "Topps rookie card");
          serpUrl.searchParams.set("_ipg", "1");
          serpUrl.searchParams.set("api_key", process.env.SERPAPI_API_KEY);
          const serp = await fetch(serpUrl, { signal: AbortSignal.timeout(45000) });
          const payload = await serp.json().catch(() => ({}));
          console.log(`SerpApi credential HTTP status: ${serp.status}`);
          if (!serp.ok || payload?.error) process.exit(1);
          NODE

      - name: Run live six-card provider proof
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/run-instacomp-batch-001-live-market-proof.ts 2>&1 | tee .codex-run/instacomp-six-card-live-proof.log

      - name: Deploy isolated protected preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@latest deploy \
            --yes \
            --force \
            --token "$VERCEL_TOKEN" \
            --env "OPENAI_API_KEY=$OPENAI_API_KEY" \
            --env "SERPAPI_API_KEY=$SERPAPI_API_KEY" \
            --env "INSTACOMP_BENCHMARK_TOKEN=$INSTACOMP_BENCHMARK_TOKEN" \
            --env "INSTACOMP_BYPASS_CACHE=1" \
            > .codex-run/vercel-deploy.log 2>&1
          cat .codex-run/vercel-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' .codex-run/vercel-deploy.log | tail -n 1)"
          test -n "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "$DEPLOYMENT_URL" > .codex-run/instacomp-preview-url.txt

      - name: Run live 25-card torture pass one
        shell: bash
        env:
          INSTACOMP_PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          INSTACOMP_BENCHMARK_TARGET: "25"
          INSTACOMP_BENCHMARK_CONCURRENCY: "2"
          INSTACOMP_BENCHMARK_REPORT_DIR: reports/pass-1
        run: |
          set -euo pipefail
          node scripts/run-instacomp-ebay-25-through-vercel-curl.mjs 2>&1 | tee .codex-run/instacomp-25-pass-1.log

      - name: Run live 25-card torture pass two
        shell: bash
        env:
          INSTACOMP_PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          INSTACOMP_BENCHMARK_TARGET: "25"
          INSTACOMP_BENCHMARK_CONCURRENCY: "2"
          INSTACOMP_BENCHMARK_REPORT_DIR: reports/pass-2
        run: |
          set -euo pipefail
          node scripts/run-instacomp-ebay-25-through-vercel-curl.mjs 2>&1 | tee .codex-run/instacomp-25-pass-2.log

      - name: Compare and enforce both live torture reports
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const pass1 = JSON.parse(fs.readFileSync("reports/pass-1/instacomp-ebay-25-report.json", "utf8"));
          const pass2 = JSON.parse(fs.readFileSync("reports/pass-2/instacomp-ebay-25-report.json", "utf8"));

          function assertReport(report, label) {
            const s = report.summary || {};
            const failures = [];
            if (s.completedCards !== 25) failures.push(`completed ${s.completedCards}/25`);
            if (s.targetMet !== true) failures.push("target not met");
            if (s.incompleteCases !== 0) failures.push(`${s.incompleteCases} incomplete cases`);
            if (s.passedCards !== 25) failures.push(`${s.passedCards}/25 cards passed`);
            if (s.cardsWithCriticalErrors !== 0) failures.push(`${s.cardsWithCriticalErrors} cards with critical errors`);
            if (s.criticalErrors !== 0) failures.push(`${s.criticalErrors} critical errors`);
            if (s.providerErrorCards !== 0) failures.push(`${s.providerErrorCards} provider-error cards`);
            if (s.cleanupFailures !== 0) failures.push(`${s.cleanupFailures} cleanup failures`);
            if (s.catalogIdentityConfirmed !== 25) failures.push(`${s.catalogIdentityConfirmed}/25 catalog confirmations`);
            const unsupported = (report.completed || []).filter((row) =>
              (row.grade?.weirdErrors || []).some((error) => error.code === "UNSUPPORTED_PRICE_CREATED")
            );
            if (unsupported.length) failures.push(`${unsupported.length} unsupported prices`);
            if (failures.length) throw new Error(`${label} failed: ${failures.join("; ")}`);
          }

          assertReport(pass1, "pass one");
          assertReport(pass2, "pass two");

          const ids1 = (pass1.completed || []).map((row) => row.caseId).sort();
          const ids2 = (pass2.completed || []).map((row) => row.caseId).sort();
          if (JSON.stringify(ids1) !== JSON.stringify(ids2)) {
            throw new Error("The two torture passes did not grade the same 25 official cases.");
          }

          const comparison = {
            schema: "tcos.instacompLiveDoubleTortureComparison.v1",
            generatedAt: new Date().toISOString(),
            passOne: pass1.summary,
            passTwo: pass2.summary,
            stableCaseIds: ids1,
            success: true,
          };
          fs.writeFileSync(
            path.join("reports", "instacomp-live-double-torture-comparison.json"),
            `${JSON.stringify(comparison, null, 2)}\n`,
          );
          console.log("Both 25-card live torture passes satisfied every enforcement gate.");
          NODE

      - name: Upload complete live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-live-double-torture-${{ github.run_number }}
          path: |
            docs/instacomp-batch-001-live-market-proof.json
            reports/pass-1/instacomp-ebay-25-report.json
            reports/pass-1/instacomp-ebay-25-report.md
            reports/pass-2/instacomp-ebay-25-report.json
            reports/pass-2/instacomp-ebay-25-report.md
            reports/instacomp-live-double-torture-comparison.json
            .codex-run/instacomp-six-card-live-proof.log
            .codex-run/instacomp-25-pass-1.log
            .codex-run/instacomp-25-pass-2.log
            .codex-run/vercel-pull.log
            .codex-run/vercel-deploy.log
            .codex-run/instacomp-preview-url.txt
          if-no-files-found: warn
          retention-days: 30
