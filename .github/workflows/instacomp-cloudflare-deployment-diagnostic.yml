name: InstaComp Cloudflare deployment diagnostic

on:
  push:
    branches:
      - fix/instacomp-live-registry-proof-20260815
    paths:
      - ".github/workflows/instacomp-cloudflare-deployment-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Inspect live Worker deployments and versions
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID is unavailable.'; exit 2; }
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN is unavailable.'; exit 2; }
          echo '=== Cloudflare deployments ==='
          npx wrangler deployments list --name truely-collectables --json
          echo '=== Cloudflare versions ==='
          npx wrangler versions list --name truely-collectables --json
