name: Import Final Two Pokémon Checklists 20260802

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-pokemon-final-two-20260802.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: import-pokemon-final-two-20260802
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 3b4b05cfcff88336cc1f91d02f42700e7ec78fcd
  EXPECTED_BRANCH: ops/import-pokemon-final-two-20260802
  VARIANT_ARTIFACT_ID: "8841169405"
  VARIANT_ARTIFACT_SHA256: 49e564ede63d399f125b9171584e620322a325bf5e17c9371a25d1ba68ceeb44
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/pokemon-final-two-20260802

jobs:
  audit-import-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/import-pokemon-final-two-20260802.yml'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          git checkout --detach "$EXPECTED_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and resolve Production environment
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"

          mkdir -p .vercel "$RUNNER_TEMP/pokemon-final-two-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull \
            "$RUNNER_TEMP/pokemon-final-two-production/production.env" \
            --yes --environment production --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" >/dev/null
          echo "PRODUCTION_ENV_PATH=$RUNNER_TEMP/pokemon-final-two-production/production.env" >> "$GITHUB_ENV"

      - name: Download and verify the pinned final-two bundles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pokemon-final-two-artifact" .codex-run/production-bundles/variant
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VARIANT_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/pokemon-final-two-artifact.zip"
          echo "$VARIANT_ARTIFACT_SHA256  $RUNNER_TEMP/pokemon-final-two-artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pokemon-final-two-artifact.zip" \
            -d "$RUNNER_TEMP/pokemon-final-two-artifact"
          find "$RUNNER_TEMP/pokemon-final-two-artifact/pokemon-ja-variant-reconciled-bundles" \
            -maxdepth 1 -type f -name '*.bundle.json' \
            -exec cp {} .codex-run/production-bundles/variant/ \;
          test "$(find .codex-run/production-bundles/variant -type f -name '*.bundle.json' | wc -l | tr -d ' ')" = "2"

      - name: Validate S10a and S11a without Production writes
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/import-pokemon-japanese-variant-reconciled-bundles.ts \
            .codex-run/production-bundles/variant \
            --continue-on-error \
            --receipt "$EVIDENCE_DIR/validate-final-two.json" >/dev/null
          node - <<'NODE'
          const r = require('./evidence/pokemon-final-two-20260802/validate-final-two.json');
          const ok = r.attemptedFiles === 2 && r.successfulFiles === 2 &&
            r.failedFiles === 0 && r.totals?.sets === 2 &&
            r.totals?.baseCards === 193 && r.totals?.officialPrintings === 288 &&
            r.totals?.reversePokeballPrintings === 95;
          console.log(JSON.stringify(r.totals, null, 2));
          if (!ok) process.exit(1);
          NODE

      - name: Create guarded Production audit runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/audit-pokemon-final-two.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const mode = process.argv[2];
          const envPath = String(process.env.PRODUCTION_ENV_PATH || '');
          const accessToken = String(process.env.GH_SUPABASE_ACCESS_TOKEN || '');
          const sourceSha = String(process.env.EXPECTED_MAIN_SHA || '');
          const evidenceDir = String(process.env.EVIDENCE_DIR || 'evidence/pokemon-final-two-20260802');
          if (!['baseline', 'final'].includes(mode) || !envPath || !accessToken || !sourceSha) {
            throw new Error('Production audit environment is incomplete.');
          }

          const parsed = {};
          for (const raw of fs.readFileSync(envPath, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }

          const productionUrl = String(parsed.NEXT_PUBLIC_SUPABASE_URL || '');
          const projectRef = new URL(productionUrl).hostname.split('.')[0];
          if (!projectRef) throw new Error('Could not resolve Production Supabase project.');
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/database/query`;

          const query = `with active_versions as (
            select * from public.checklist_versions where is_active
          ), identity_counts as (
            select
              version_row.id,
              version_row.normalized_identity_count as expected_identities,
              count(identity_row.id)::bigint as actual_identities
            from active_versions version_row
            left join public.checklist_card_identities identity_row
              on identity_row.version_id = version_row.id
            group by version_row.id, version_row.normalized_identity_count
          ), adapter_counts as (
            select
              coalesce(release_row.metadata->>'latestAdapterId', '(none)') as adapter_id,
              count(*)::bigint as release_count
            from public.checklist_releases release_row
            group by coalesce(release_row.metadata->>'latestAdapterId', '(none)')
          )
          select json_build_object(
            'releases', (select count(*) from public.checklist_releases),
            'active_versions', (select count(*) from active_versions),
            'active_cards', (
              select count(*) from public.checklist_cards card_row
              join active_versions version_row on version_row.id = card_row.version_id
            ),
            'active_identities', (
              select count(*) from public.checklist_card_identities identity_row
              join active_versions version_row on version_row.id = identity_row.version_id
            ),
            'identity_deficit_versions', (
              select count(*) from identity_counts
              where actual_identities <> expected_identities
            ),
            'failed_import_runs', (
              select count(*) from public.checklist_import_runs where status = 'failed'
            ),
            'target_adapter_counts', coalesce((
              select jsonb_object_agg(adapter_id, release_count order by adapter_id)
              from adapter_counts
              where adapter_id in (
                'pokemon-japanese-official-incomplete-reconciled',
                'pokemon-japanese-official-historical-reconciled',
                'pokemon-japanese-official-variant-reconciled'
              )
            ), '{}'::jsonb),
            'writer_rpc', to_regprocedure(
              'public.tcos_apply_checklist_import_plan(jsonb,text,text,bigint,text,text,text)'
            ) is not null,
            'private_source_bucket', exists (
              select 1 from storage.buckets
              where id = 'tcos-checklist-source-files' and public = false
            ),
            'registry_public_grants', (
              select count(*) from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name like 'checklist\\_%' escape '\\'
                and grantee in ('anon', 'authenticated')
            )
          ) as state;`;

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${accessToken}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ query, parameters: [], read_only: true }),
          });
          const text = await response.text();
          if (!response.ok) throw new Error(`Supabase audit failed with HTTP ${response.status}: ${text.slice(0, 1000)}`);
          const rows = text ? JSON.parse(text) : [];
          const state = rows?.[0]?.state;
          if (!state) throw new Error('Production audit returned no state.');

          const adapters = state.target_adapter_counts || {};
          const expected = mode === 'baseline'
            ? {
                releases: 292,
                active_versions: 292,
                active_cards: 33290,
                active_identities: 35610,
                incomplete: 3,
                historical: 17,
                variant: 0,
              }
            : {
                releases: 294,
                active_versions: 294,
                active_cards: 33483,
                active_identities: 35898,
                incomplete: 3,
                historical: 17,
                variant: 2,
              };

          const actual = {
            releases: Number(state.releases),
            active_versions: Number(state.active_versions),
            active_cards: Number(state.active_cards),
            active_identities: Number(state.active_identities),
            incomplete: Number(adapters['pokemon-japanese-official-incomplete-reconciled'] || 0),
            historical: Number(adapters['pokemon-japanese-official-historical-reconciled'] || 0),
            variant: Number(adapters['pokemon-japanese-official-variant-reconciled'] || 0),
          };

          const mismatches = Object.entries(expected)
            .filter(([key, value]) => actual[key] !== value)
            .map(([key, value]) => `${key}=${actual[key]}, expected=${value}`);
          if (Number(state.identity_deficit_versions) !== 0) mismatches.push(`identity_deficit_versions=${state.identity_deficit_versions}`);
          if (Number(state.failed_import_runs) !== 0) mismatches.push(`failed_import_runs=${state.failed_import_runs}`);
          if (Number(state.registry_public_grants) !== 0) mismatches.push(`registry_public_grants=${state.registry_public_grants}`);
          if (state.writer_rpc !== true) mismatches.push('writer_rpc=false');
          if (state.private_source_bucket !== true) mismatches.push('private_source_bucket=false');
          if (mismatches.length) throw new Error(`Production ${mode} audit blocked: ${mismatches.join(', ')}`);

          fs.mkdirSync(evidenceDir, { recursive: true });
          fs.writeFileSync(
            path.join(evidenceDir, `production-${mode}.json`),
            `${JSON.stringify({ sourceSha, mode, state }, null, 2)}\n`,
          );
          console.log(JSON.stringify({ mode, actual }, null, 2));
          NODE

      - name: Audit exact 292-release Production baseline
        shell: bash
        run: node "$RUNNER_TEMP/audit-pokemon-final-two.mjs" baseline

      - name: Load masked service-role import environment
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const parsed = {};
          for (const raw of fs.readFileSync(process.env.PRODUCTION_ENV_PATH, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const index = line.indexOf('=');
            if (index < 1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();
            if (value.startsWith('"') && value.endsWith('"')) {
              try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
            } else if (value.startsWith("'") && value.endsWith("'")) {
              value = value.slice(1, -1);
            }
            parsed[key] = value;
          }
          for (const key of ['NEXT_PUBLIC_SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY']) {
            const value = String(parsed[key] || '');
            if (!value) throw new Error(`Missing ${key} in Production environment`);
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}<<${key}_EOF\n${value}\n${key}_EOF\n`);
          }
          NODE

      - name: Import only S10a and S11a into Production
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/import-pokemon-japanese-variant-reconciled-bundles.ts \
            .codex-run/production-bundles/variant \
            --apply --continue-on-error \
            --receipt "$EVIDENCE_DIR/import-final-two.json" >/dev/null
          node - <<'NODE'
          const r = require('./evidence/pokemon-final-two-20260802/import-final-two.json');
          const ok = r.attemptedFiles === 2 && r.successfulFiles === 2 &&
            r.failedFiles === 0 && r.totals?.sets === 2 &&
            r.totals?.baseCards === 193 && r.totals?.officialPrintings === 288 &&
            r.totals?.reversePokeballPrintings === 95;
          console.log(JSON.stringify(r.totals, null, 2));
          if (!ok) process.exit(1);
          NODE

      - name: Verify final 294-release Production state
        shell: bash
        run: node "$RUNNER_TEMP/audit-pokemon-final-two.mjs" final

      - name: Write sanitized Production summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const baseline = require('./evidence/pokemon-final-two-20260802/production-baseline.json');
          const final = require('./evidence/pokemon-final-two-20260802/production-final.json');
          const text = [
            '# Final Japanese Pokémon checklist Production import',
            '',
            `- Source SHA: \`${final.sourceSha}\``,
            `- Releases before: ${baseline.state.releases}`,
            `- Releases after: ${final.state.releases}`,
            '- Imported releases: S10a and S11a',
            '- New active cards: 193',
            '- New physical-printing identities: 288',
            '- Poké Ball reverse printings: 95',
            '- Active versions with identity deficits: 0',
            '- Public Registry grants: 0',
            '',
          ].join('\n');
          fs.writeFileSync('./evidence/pokemon-final-two-20260802/production-summary.md', text);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          NODE

      - name: Remove Production environment file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pokemon-final-two-production/production.env"

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-final-two-production-20260802
          path: evidence/pokemon-final-two-20260802
          if-no-files-found: warn
          retention-days: 90
