name: Emergency Post-Launch Safety Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/emergency-post-launch-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-launch-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out emergency audit branch
        uses: actions/checkout@v4

      - name: Capture reviewable source snapshot
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.codex-run \
            -czf emergency-audit-source.tgz \
            .github src scripts supabase package.json package-lock.json tsconfig.json next.config.* 2>/dev/null || \
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.codex-run \
            -czf emergency-audit-source.tgz \
            .github src scripts supabase package.json package-lock.json tsconfig.json

      - name: Upload reviewable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: emergency-audit-source
          path: emergency-audit-source.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Titanic randomized stress simulations
        run: node --import tsx scripts/run-titanic-release-stress-simulations.ts

      - name: Run checkout, webhook, offer, and post-sale race simulations
        run: |
          node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts
          node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts
          node --import tsx scripts/run-post-sale-ebay-sync-simulations.ts
          node --import tsx scripts/run-live-storefront-money-integrity-simulations.ts

      - name: Validate Buyer Protection
        run: node --import tsx scripts/run-buyer-protection-simulations.ts

      - name: Validate post-purchase buyer flow
        run: node --import tsx scripts/run-post-purchase-buyer-flow-simulations.ts

      - name: Validate order notification retries
        run: node --import tsx scripts/run-order-notification-hardening-simulations.ts

      - name: Validate order-review payout resolution
        run: node --import tsx scripts/run-order-review-payout-resolution-simulations.mjs

      - name: Validate financial reconciliation
        run: node --import tsx scripts/run-admin-financial-reconciliation-simulations.mjs

      - name: Validate order review actions
        run: node --import tsx scripts/run-admin-order-review-actions-simulations.mjs

      - name: Run authentication, authorization, and public security simulations
        run: |
          node scripts/run-admin-session-secret-fail-closed-simulations.mjs
          node scripts/run-admin-login-simulations.mjs
          node scripts/run-privileged-api-route-audit.mjs
          node --import tsx scripts/run-live-payment-identity-gate-simulations.ts
          node --import tsx scripts/run-public-rate-limit-fail-closed-simulations.ts
          node scripts/run-admin-security-actions-simulations.mjs

      - name: Validate eBay OAuth state security
        run: node --import tsx scripts/run-ebay-oauth-state-simulations.ts

      - name: Validate eBay duplicate merge handling
        run: node scripts/run-ebay-duplicate-merge-simulations.mjs

      - name: Validate eBay import and storefront gallery
        run: node --import tsx scripts/run-ebay-import-admin-client-simulations.ts

      - name: Validate eBay launch readiness
        run: node --import tsx scripts/run-ebay-launch-ready-simulations.ts

      - name: Validate eBay launch-readiness UI
        run: node --import tsx scripts/run-ebay-launch-ready-ui-simulations.ts

      - name: Validate shipping purchase audit
        run: node --import tsx scripts/run-shipping-purchase-audit-simulations.ts

      - name: Validate shipping calculations
        run: node --import tsx scripts/run-shipping-simulations.ts

      - name: Validate admin shipping actions
        run: node scripts/run-admin-shipping-actions-simulations.mjs

      - name: Run storefront, mobile, trust, and launch-contract simulations
        run: |
          node --import tsx scripts/run-storefront-taxonomy-gallery-simulations.ts
          node --import tsx scripts/run-mobile-buyer-flow-simulations.ts
          node --import tsx scripts/run-public-trust-policy-simulations.ts
          node --import tsx scripts/run-live-payment-owner-marker-simulations.ts
          node --import tsx scripts/run-live-payment-status-color-simulations.ts
          node --import tsx scripts/run-sunday-launch-one-build.ts

      - name: Run migration and production guardrail audits
        run: |
          node scripts/run-launch-database-migration-coverage.mjs
          node scripts/run-launch-database-schema-definition-simulations.mjs
          node scripts/run-hardened-checkout-function-migration-simulations.mjs
          node scripts/check-production-guardrails.mjs

      - name: Run lint
        run: npm run lint

      - name: Build application and capture diagnostics
        id: production_build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee emergency-build.log
          build_status=${PIPESTATUS[0]}
          echo "exit_code=${build_status}" >> "$GITHUB_OUTPUT"
          exit "$build_status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-post-launch-build-diagnostics
          path: emergency-build.log
          if-no-files-found: warn
          retention-days: 7
