name: Emergency Post-Launch Safety Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/ebay-quantity-sync-outbox.ts"
      - "src/lib/ebay-quantity-sync-safety.ts"
      - "src/app/api/cron/ebay-store-fixed-price-sync/route.ts"
      - "supabase/migrations/20260726233000_post_sale_ebay_quantity_sync_outbox.sql"
      - "scripts/run-post-sale-ebay-sync-simulations.ts"
      - ".github/workflows/emergency-post-launch-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-launch-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out emergency audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run post-sale safety simulations
        run: node --import tsx scripts/run-post-sale-ebay-sync-simulations.ts

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
