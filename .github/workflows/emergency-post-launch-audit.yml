name: Emergency Post-Launch Safety Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/emergency-post-launch-audit.yml"
  push:
    branches:
      - agent/emergency-post-launch-audit-fixes-20260726
    paths:
      - ".audit/titanic-hardening.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-titanic-patch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out emergency audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/emergency-post-launch-audit-fixes-20260726
          fetch-depth: 0

      - name: Apply audited hardening patch exactly once
        shell: bash
        run: |
          test -f .audit/titanic-hardening.patch
          git apply --check .audit/titanic-hardening.patch
          git apply .audit/titanic-hardening.patch
          rm .audit/titanic-hardening.patch
          rmdir .audit 2>/dev/null || true
          git config user.name "Truely Collectables Audit"
          git config user.email "sales@truelycollectables.com"
          git add -A
          git commit -m "Harden live checkout money and fulfillment integrity"
          git push origin HEAD:agent/emergency-post-launch-audit-fixes-20260726

  post-launch-safety:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      STRIPE_LIVE_SECRET_KEY: sk_live_build_only_placeholder
      NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: pk_live_build_only_placeholder
      STRIPE_LIVE_WEBHOOK_SECRET: whsec_live_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - name: Check out emergency audit branch
        uses: actions/checkout@v4

      - name: Capture reviewable source snapshot
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.codex-run \
            -czf emergency-audit-source.tgz \
            .github src scripts supabase package.json package-lock.json tsconfig.json next.config.* 2>/dev/null || \
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.codex-run \
            -czf emergency-audit-source.tgz \
            .github src scripts supabase package.json package-lock.json tsconfig.json

      - name: Upload reviewable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: emergency-audit-source
          path: emergency-audit-source.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run post-sale safety simulations
        run: node --import tsx scripts/run-post-sale-ebay-sync-simulations.ts

      - name: Run checkout and offer idempotency simulations
        run: |
          node --import tsx scripts/run-checkout-webhook-idempotency-simulations.ts
          node --import tsx scripts/run-offer-checkout-idempotency-simulations.ts

      - name: Run live storefront money integrity simulations
        run: node --import tsx scripts/run-live-storefront-money-integrity-simulations.ts

      - name: Run Buyer Protection and post-purchase simulations
        run: |
          node --import tsx scripts/run-buyer-protection-simulations.ts
          node --import tsx scripts/run-post-purchase-buyer-flow-simulations.ts

      - name: Run lint
        run: npm run lint

      - name: Build application and capture diagnostics
        id: production_build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee emergency-build.log
          build_status=${PIPESTATUS[0]}
          echo "exit_code=${build_status}" >> "$GITHUB_OUTPUT"
          exit "$build_status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-post-launch-build-diagnostics
          path: emergency-build.log
          if-no-files-found: error
          retention-days: 7
