name: Build Clean InstaComp Exact Market Branch

on:
  push:
    branches:
      - agent/instacomp-exact-market-final-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
      ADMIN_PASSWORD: build-only-placeholder-password
      ADMIN_SESSION_SECRET: build-only-placeholder-session-secret
      STRIPE_SECRET_KEY: sk_test_build_only_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
      EBAY_CLIENT_ID: build-only-placeholder-client-id
      EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
      EBAY_ENVIRONMENT: production
      TCOS_LIVE_PAYMENTS_ENABLED: "false"
      TCOS_SHIPPING_PURCHASE_MODE: dry_run
      TCOS_LIVE_SHIPPING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-exact-market-final-20260726
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Copy only intended exact-market files
        shell: bash
        run: |
          git fetch origin agent/instacomp-exact-market-proof-20260726
          SOURCE=origin/agent/instacomp-exact-market-proof-20260726
          files=(
            src/lib/instacomp.ts
            src/lib/instacomp-exact-market-provider.ts
            src/app/api/account/seller/inventory/instacomp/route.ts
            src/app/api/account/seller/instacomp-pending/exclude-comp/route.ts
            src/app/api/account/seller/instacomp-pending/route.ts
            src/app/seller/instacomp-pending/page.tsx
            scripts/fixtures/instacomp-batch-001-exact-market.json
            scripts/run-instacomp-exact-market-proof-regressions.ts
            scripts/run-instacomp-batch-001-live-market-proof.ts
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "$SOURCE:$file" > "$file"
          done
          rm -f .github/workflows/temporary-copy-instacomp-exact-final.yml
      - run: npm ci
      - name: Run and capture complete validation
        shell: bash
        run: |
          set +e
          mkdir -p docs
          : > docs/instacomp-clean-validation.log
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> docs/instacomp-clean-validation.log 2>&1
          PASS1=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> docs/instacomp-clean-validation.log 2>&1
          PASS2=$?
          node --import tsx scripts/run-instacomp-exact-market-proof-regressions.ts >> docs/instacomp-clean-validation.log 2>&1
          PASS3=$?
          npm run lint >> docs/instacomp-clean-validation.log 2>&1
          LINT=$?
          npm run build >> docs/instacomp-clean-validation.log 2>&1
          BUILD=$?
          {
            echo "pass1=$PASS1"
            echo "pass2=$PASS2"
            echo "pass3=$PASS3"
            echo "lint=$LINT"
            echo "build=$BUILD"
          } > docs/instacomp-clean-validation-status.txt
          exit 0
      - name: Upload clean validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instacomp-clean-validation
          path: |
            docs/instacomp-clean-validation.log
            docs/instacomp-clean-validation-status.txt
          if-no-files-found: error
      - name: Commit clean implementation only after every gate passes
        shell: bash
        run: |
          grep -q '^pass1=0$' docs/instacomp-clean-validation-status.txt
          grep -q '^pass2=0$' docs/instacomp-clean-validation-status.txt
          grep -q '^pass3=0$' docs/instacomp-clean-validation-status.txt
          grep -q '^lint=0$' docs/instacomp-clean-validation-status.txt
          grep -q '^build=0$' docs/instacomp-clean-validation-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/temporary-copy-instacomp-exact-final.yml
          git commit -m "Harden InstaComp exact sold and active matching"
          git push origin HEAD:agent/instacomp-exact-market-final-20260726
