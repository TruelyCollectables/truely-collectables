name: InstaComp Registry Legacy Base Set 20260810

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/instacomp-checklist-first.ts"
      - "scripts/run-instacomp-registry-legacy-base-set-regression.ts"
      - ".github/workflows/instacomp-registry-legacy-base-set-20260810.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove legacy Base set semantics stay fail closed
        run: node --import tsx scripts/run-instacomp-registry-legacy-base-set-regression.ts

      - name: Run related InstaComp identity simulations
        run: |
          set -euo pipefail
          npm run simulate:instacomp-catalog-identity
          npm run simulate:instacomp-identity-guard

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^
          fi
