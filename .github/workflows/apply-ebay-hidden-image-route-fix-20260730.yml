name: Apply eBay Hidden Image Route Fix 20260730

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-ebay-hidden-image-route-fix-20260730.yml"
      - ".github/workflows/repair-ebay-hidden-images-20260730.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ebay-hidden-image-route-fix-20260730
  cancel-in-progress: true

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/diagnose-ebay-hidden-images-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ops/diagnose-ebay-hidden-images-20260730
          fetch-depth: 0

      - name: Replace unavailable store helper
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/repair-ebay-hidden-images-20260730.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/repair-ebay-hidden-images-20260730.yml')
          text = path.read_text()
          text = text.replace('          import { getActiveStoreId } from "../../../../../lib/stores";\n', '')
          text = text.replace('            const storeId = getActiveStoreId();', '            const storeId = "00000000-0000-4000-8000-000000000001";')
          path.write_text(text)
          PY
          ! grep -Fq 'lib/stores' "$file"
          grep -Fq 'const storeId = "00000000-0000-4000-8000-000000000001";' "$file"
          git diff --check

      - name: Commit corrected repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/repair-ebay-hidden-images-20260730.yml
          if git diff --cached --quiet; then
            echo "Repair workflow is already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix hidden image repair route store lookup"
          git push origin HEAD:ops/diagnose-ebay-hidden-images-20260730
