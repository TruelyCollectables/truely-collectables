name: KINGMAKER Pricing Command Center

on:
  pull_request:
    paths:
      - "src/app/admin/instacomp/pricing/**"
      - "src/app/api/instacomp/pricing/command-center/**"
      - "src/app/api/instacomp/pricing/views/**"
      - "src/lib/kingmaker-pricing-command-center-server.ts"
      - "scripts/run-kingmaker-pricing-command-center-regressions.ts"
      - "supabase/migrations/20260803233000_kingmaker_pricing_command_center.sql"
      - ".github/workflows/kingmaker-pricing-command-center.yml"

permissions:
  contents: read

jobs:
  verify-pricing-command-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Command Center regressions
        run: node --import tsx scripts/run-kingmaker-pricing-command-center-regressions.ts
      - name: Privacy, ownership, and advisory contracts
        run: |
          set -euo pipefail
          grep -q 'kingmakerPricingProfileOwner' src/lib/kingmaker-pricing-command-center-server.ts
          grep -q 'advisory_only' src/lib/kingmaker-pricing-command-center-server.ts
          grep -q 'sourceDisclosure: null' src/app/api/instacomp/pricing/command-center/route.ts
          grep -q 'assertTrustedInstaCompMutationRequest' src/app/api/instacomp/pricing/views/route.ts
          grep -q 'enable row level security' supabase/migrations/20260803233000_kingmaker_pricing_command_center.sql
          ! grep -RIni 'beckett' src/app/admin/instacomp/pricing src/app/api/instacomp/pricing/command-center src/app/api/instacomp/pricing/views src/lib/kingmaker-pricing-command-center-server.ts scripts/run-kingmaker-pricing-command-center-regressions.ts
      - name: Lint
        run: npx eslint src/app/admin/instacomp/pricing src/app/api/instacomp/pricing/command-center src/app/api/instacomp/pricing/views src/lib/kingmaker-pricing-command-center-server.ts scripts/run-kingmaker-pricing-command-center-regressions.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          ADMIN_SESSION_SECRET: build-placeholder-admin-session
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build-placeholder
          EBAY_CLIENT_ID: build-placeholder
          EBAY_CLIENT_SECRET: build-placeholder
          EBAY_ENVIRONMENT: production
          TCOS_LIVE_PAYMENTS_ENABLED: "false"
          TCOS_LIVE_SHIPPING_ENABLED: "false"
          TCOS_SHIPPING_PURCHASE_MODE: dry_run
        run: npm run build
