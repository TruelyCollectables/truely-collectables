name: Bootstrap KINGMAKER Coverage Admin Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-kingmaker-coverage-admin-contract.yml"
      - "src/app/admin/instacomp/pricing/coverage/page.tsx"
      - "scripts/smoke-admin-runtime.mjs"

permissions:
  contents: write

concurrency:
  group: bootstrap-kingmaker-coverage-admin-contract
  cancel-in-progress: false

jobs:
  patch-and-retire:
    if: >-
      github.event.pull_request.head.ref == 'fix/kingmaker-coverage-admin-contract' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kingmaker-coverage-admin-contract
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Insert exact runtime-smoke route
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/smoke-admin-runtime.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const route = '    path: "/admin/instacomp/pricing/coverage",';
          if (!source.includes(route)) {
            const needle = `  {\n    path: "/admin/instacomp/pricing/analytics",\n    auth: true,\n    expectedText: "Pricing Analytics",\n  },\n`;
            if (!source.includes(needle)) {
              throw new Error('Could not locate the pricing analytics smoke-route anchor.');
            }
            const addition = `${needle}  {\n    path: "/admin/instacomp/pricing/coverage",\n    auth: true,\n    expectedText: "Coverage Attack Queue",\n  },\n`;
            source = source.replace(needle, addition);
            fs.writeFileSync(path, source);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Prove dashboard contract
        run: node scripts/run-admin-dashboard-actions-simulations.mjs

      - name: Remove temporary bootstrap and push permanent fix
        env:
          BRANCH: fix/kingmaker-coverage-admin-contract
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-kingmaker-coverage-admin-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/instacomp/pricing/coverage/page.tsx scripts/smoke-admin-runtime.mjs .github/workflows/bootstrap-kingmaker-coverage-admin-contract.yml
          git commit -m "Complete KINGMAKER coverage admin contract"
          git push origin "HEAD:${BRANCH}"
