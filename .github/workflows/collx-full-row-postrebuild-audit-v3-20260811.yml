name: CollX Full Row Post-Rebuild Audit V3 20260811

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collx-full-row-postrebuild-audit-v3-20260811.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLAGSHIP_STORE_ID: "00000000-0000-4000-8000-000000000001"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read-only audit of every imported CollX row
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json,os,subprocess
          API='https://api.supabase.com/v1'; TOKEN=os.environ['SUPABASE_ACCESS_TOKEN']; STORE=os.environ['FLAGSHIP_STORE_ID']; EXPECTED=6155
          Q={'1118487216741062656':150,'1096066047819933696':5,'1096066043650795520':5,'1054830295389308928':2,'1003302000714319872':2,'995291373047649280':2,'925094340036305920':2}
          def req(method,path,body=None):
              cmd=['curl','-sS','--max-time','120','-X',method,'-H',f'Authorization: Bearer {TOKEN}','-H','Accept: application/json','-H','Content-Type: application/json','-o','/tmp/sb.json','-w','%{http_code}',API+path]
              if body is not None: cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True); raw=open('/tmp/sb.json').read() if os.path.exists('/tmp/sb.json') else ''
              try:b=json.loads(raw) if raw else None
              except:b=raw
              return int((p.stdout or '0').strip()[-3:]),b
          s,ps=req('GET','/projects'); cs=[p for p in ps if 'truely' in str(p.get('name') or '').lower() or 'collect' in str(p.get('name') or '').lower()]
          if s!=200 or len(cs)!=1: raise SystemExit(2)
          ref=str(cs[0].get('id') or cs[0].get('ref')); BASE=f'https://{ref}.supabase.co/storage/v1/object/public/truely-product-images/collx-full/20260811'
          def sql(q):
              s,b=req('POST',f'/projects/{ref}/database/query',{'query':q,'parameters':[],'read_only':True})
              if s not in (200,201): print('SQL_FAILURE',s,json.dumps(b,default=str)); raise SystemExit(3)
              return b
          qx="CASE substring(x.sku from 7) "+' '.join(f"WHEN '{k}' THEN {v}" for k,v in Q.items())+" ELSE 1 END"
          result=sql(f"""
          with p as(select * from public.products where store_id='{STORE}'::uuid and sku>='COLLX-' and sku<'COLLY'),
               i as(select * from public.inventory_items where store_id='{STORE}'::uuid and sku>='COLLX-' and sku<'COLLY'),
               bp as(select * from public.ops_collx_rebuild_v2_backup_products_20260811),
               bi as(select * from public.ops_collx_rebuild_v2_backup_items_20260811),
               x as(
                 select p.*,i.id iid,i.title ititle,i.description idescription,i.category icategory,i.condition icondition,i.price iprice,i.currency icurrency,i.quantity iquantity,i.status istatus,
                        bp.title bptitle,bp.description bpdescription,bp.player bpplayer,bp.sport bpsport,
                        bi.title bititle,bi.description bidescription,bi.category bicategory,bi.condition bicondition,bi.price biprice,bi.currency bicurrency
                 from p join i on i.legacy_product_id=p.id and i.sku=p.sku
                 join bp on bp.id=p.id and bp.sku=p.sku
                 join bi on bi.id=i.id and bi.sku=i.sku and bi.legacy_product_id=p.id
               )
          select
            (select count(*)::int from p) products,
            (select count(*)::int from i) items,
            (select count(*)::int from x) exact_pairs_with_backup,
            (select count(*)::int from x where x.sku !~ '^COLLX-[0-9]+$') malformed_source_ids,
            (select count(*)::int from x where x.quantity<>{qx} or x.iquantity<>{qx}) csv_quantity_mismatches,
            (select count(*)::int from x where x.title is distinct from x.bptitle or x.description is distinct from x.bpdescription or x.player is distinct from x.bpplayer or x.sport is distinct from x.bpsport) product_identity_mismatches,
            (select count(*)::int from x where x.ititle is distinct from x.bititle or x.idescription is distinct from x.bidescription or x.icategory is distinct from x.bicategory or x.icondition is distinct from x.bicondition or x.iprice is distinct from x.biprice or x.icurrency is distinct from x.bicurrency) inventory_source_field_mismatches,
            (select count(*)::int from x where x.istatus='active' and (x.price is distinct from x.iprice or x.price<=0)) active_price_mismatches,
            (select count(*)::int from x where x.istatus='draft' and x.price<>0) draft_price_mismatches,
            (select count(*)::int from x where x.image_url is not null and x.image_url<>'{BASE}/'||substring(x.sku from 7)||'/front.jpg') product_front_id_mismatches,
            (select count(*)::int from public.inventory_images im join i on i.id=im.inventory_item_id where im.image_url not in ('{BASE}/'||substring(i.sku from 7)||'/front.jpg','{BASE}/'||substring(i.sku from 7)||'/back.jpg')) inventory_image_id_mismatches,
            (select count(*)::int from x where exists(select 1 from storage.objects o where o.bucket_id='truely-product-images' and o.name='collx-full/20260811/'||substring(x.sku from 7)||'/front.jpg') and not exists(select 1 from public.inventory_images im where im.inventory_item_id=x.iid and im.image_url='{BASE}/'||substring(x.sku from 7)||'/front.jpg' and im.sort_order=0 and im.is_primary=true)) missing_expected_front_rows,
            (select count(*)::int from x where exists(select 1 from storage.objects o where o.bucket_id='truely-product-images' and o.name='collx-full/20260811/'||substring(x.sku from 7)||'/back.jpg') and not exists(select 1 from public.inventory_images im where im.inventory_item_id=x.iid and im.image_url='{BASE}/'||substring(x.sku from 7)||'/back.jpg' and im.sort_order=1 and im.is_primary=false)) missing_expected_back_rows,
            (select count(*)::int from x where x.istatus='active') active_rows,
            (select count(*)::int from x where x.istatus='draft') draft_rows,
            (select coalesce(sum(x.quantity),0)::int from x) total_units,
            (select count(*)::int from x where x.quantity<>1) non_one_rows,
            (select count(distinct image_url)::int from p where image_url is not null) unique_product_fronts,
            (select count(*)::int from p where image_url is not null) product_fronts;
          """)
          print('ALL_ROW_AUDIT='+json.dumps(result,default=str)); r=result[0]
          if any(int(r[k])!=EXPECTED for k in ('products','items','exact_pairs_with_backup')): raise SystemExit(10)
          for k in ('malformed_source_ids','csv_quantity_mismatches','product_identity_mismatches','inventory_source_field_mismatches','active_price_mismatches','draft_price_mismatches','product_front_id_mismatches','inventory_image_id_mismatches','missing_expected_front_rows','missing_expected_back_rows'):
              if int(r[k] or 0)!=0: print('MISMATCH',k,r[k]); raise SystemExit(11)
          if int(r['active_rows'])!=6011 or int(r['draft_rows'])!=144 or int(r['total_units'])!=6316 or int(r['non_one_rows'])!=7: raise SystemExit(12)
          if int(r['unique_product_fronts'])!=int(r['product_fronts']): raise SystemExit(13)
          print('ALL_6155_IMPORTED_COLLX_ROWS_VERIFIED=SUCCESS')
          PY
