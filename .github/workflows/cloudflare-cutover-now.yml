name: Cloudflare Cutover Now

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-cutover-now-trigger'
      - '.github/workflows/cloudflare-cutover-now.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TEAM_SLUG: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  WORKER: truely-collectables-preview
  PREVIEW_URL: https://truely-collectables-preview.truelycollectables.workers.dev
  APEX: truelycollectables.com
  WWW: www.truelycollectables.com
  ZONE_PROBE: cf-cutover-probe.truelycollectables.com

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate Cloudflare preview and required bindings
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VERCEL_TOKEN; do test -n "${!key:-}" || { echo "Missing $key"; exit 2; }; done
          for spec in '/product/1991|product' '/shop|shop' '/|home' '/admin/login|admin' '/robots.txt|robots'; do
            path=${spec%%|*}; tag=${spec##*|}; ok=0
            for attempt in 1 2 3; do
              code=$(curl -L -sS --max-time 45 -D "/tmp/$tag.headers" -o /dev/null -w '%{http_code}' "$PREVIEW_URL$path" || true)
              echo "$path attempt=$attempt -> $code"
              if [[ "$code" =~ ^[23] ]] && grep -qi '^x-truely-origin: cloudflare-worker' "/tmp/$tag.headers"; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done
          curl -sS --fail-with-body "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/settings" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/cf-settings.json
          node <<'NODE'
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/cf-settings.json','utf8'));
          if(!r.success) throw new Error('Cloudflare settings read failed');
          const names=new Set((r.result?.bindings||[]).map(x=>x.name));
          const required=['EBAY_CLIENT_ID','EBAY_CLIENT_SECRET','STRIPE_SECRET_KEY','CRON_SECRET'];
          const missing=required.filter(x=>!names.has(x));
          console.log(`Required Cloudflare runtime bindings present=${required.length-missing.length}/${required.length}`);
          if(missing.length) throw new Error(`Missing Cloudflare bindings: ${missing.join(', ')}`);
          NODE

      - name: Resolve Vercel project and Cloudflare zone
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?slug=$VERCEL_TEAM_SLUG" -o /tmp/vercel-project.json
          node <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/vercel-project.json','utf8'));
          if(!p.id) throw new Error('Vercel project ID not resolved');
          fs.writeFileSync('/tmp/vercel-project-id',p.id); console.log(`Vercel project resolved; paused=${Boolean(p.paused)}`);
          NODE
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
          curl -sS --fail-with-body -X PUT "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "{\"hostname\":\"$ZONE_PROBE\",\"service\":\"$WORKER\",\"zone_name\":\"$APEX\"}" -o /tmp/zone-probe.json
          node <<'NODE'
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/zone-probe.json','utf8'));
          if(!r.success||!r.result?.zone_id||!r.result?.id) throw new Error('Could not resolve Cloudflare zone');
          fs.writeFileSync('/tmp/zone-id',r.result.zone_id); fs.writeFileSync('/tmp/probe-domain-id',r.result.id); console.log('Cloudflare zone resolved.');
          NODE
          probe_id=$(cat /tmp/probe-domain-id)
          curl -sS --fail-with-body -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$probe_id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null

      - name: Snapshot and switch live Worker routes
        shell: bash
        run: |
          set -euo pipefail
          zone=$(cat /tmp/zone-id); base="https://api.cloudflare.com/client/v4/zones/$zone/workers/routes"
          curl -sS --fail-with-body "$base" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/routes-before.json
          node <<'NODE'
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/routes-before.json','utf8'));
          if(!r.success||!Array.isArray(r.result)) throw new Error('Could not list Worker routes');
          const patterns=['truelycollectables.com/*','www.truelycollectables.com/*']; const s={};
          for(const p of patterns){const old=r.result.find(x=>x.pattern===p); s[p]=old?{id:old.id,script:old.script??null}:null;}
          fs.writeFileSync('/tmp/route-snapshot.json',JSON.stringify(s));
          NODE
          for pattern in 'truelycollectables.com/*' 'www.truelycollectables.com/*'; do
            route_id=$(node -e "const s=require('/tmp/route-snapshot.json'); console.log(s[process.argv[1]]?.id||'')" "$pattern")
            body=$(node -e "console.log(JSON.stringify({pattern:process.argv[1],script:process.argv[2]}))" "$pattern" "$WORKER")
            if [ -n "$route_id" ]; then
              curl -sS --fail-with-body -X PUT "$base/$route_id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/dev/null
            else
              curl -sS --fail-with-body -X POST "$base" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/dev/null
            fi
          done

      - name: Prove Cloudflare live before pausing Vercel
        shell: bash
        run: |
          set -euo pipefail
          verify(){
            local url="$1" tag="$2" ok=0
            for attempt in $(seq 1 12); do
              code=$(curl -L -sS --max-time 45 -D "/tmp/$tag.headers" -o /dev/null -w '%{http_code}' "$url" || true)
              origin=$(grep -i '^x-truely-origin:' "/tmp/$tag.headers" | tail -1 | tr -d '\r' || true)
              echo "$url attempt=$attempt -> $code ${origin:-origin-missing}"
              if [[ "$code" =~ ^[23] ]] && grep -qi '^x-truely-origin: cloudflare-worker' "/tmp/$tag.headers"; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          }
          verify "https://$APEX/product/1991" live_product
          verify "https://$APEX/shop" live_shop
          verify "https://$APEX/" live_home
          verify "https://$WWW/" live_www

      - name: Pause Vercel and prove survival
        shell: bash
        run: |
          set -euo pipefail
          project=$(cat /tmp/vercel-project-id)
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' "https://api.vercel.com/v1/projects/$project/pause?slug=$VERCEL_TEAM_SLUG" -o /tmp/vercel-pause.json
          echo 'Vercel pause request succeeded.'
          sleep 8
          for spec in "https://$APEX/product/1991|post_product" "https://$APEX/shop|post_shop" "https://$APEX/|post_home" "https://$WWW/|post_www" "https://$APEX/admin/login|post_admin"; do
            url=${spec%%|*}; tag=${spec##*|}; code=$(curl -L -sS --max-time 45 -D "/tmp/$tag.headers" -o /dev/null -w '%{http_code}' "$url" || true)
            echo "post-pause $url -> $code"; [[ "$code" =~ ^[23] ]] || exit 60; grep -qi '^x-truely-origin: cloudflare-worker' "/tmp/$tag.headers" || exit 61
          done

      - name: Enable Cloudflare scheduler and final proof
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/schedules"
          curl -sS --fail-with-body -X PUT "$endpoint" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '[{"cron":"* * * * *"}]' -o /tmp/schedule-put.json
          curl -sS --fail-with-body "$endpoint" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/schedule-get.json
          node <<'NODE'
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/schedule-get.json','utf8')); const s=r.result?.schedules||r.result||[];
          if(!Array.isArray(s)||!s.some(x=>x.cron==='* * * * *')) throw new Error('Cloudflare scheduler not confirmed'); console.log('Cloudflare scheduler confirmed active.');
          NODE
          for spec in "https://$APEX/product/1991|final_product" "https://$APEX/shop|final_shop" "https://$APEX/|final_home"; do
            url=${spec%%|*}; tag=${spec##*|}; code=$(curl -L -sS --max-time 45 -D "/tmp/$tag.headers" -o /dev/null -w '%{http_code}' "$url")
            echo "final $url -> $code"; [[ "$code" =~ ^[23] ]] || exit 70; grep -qi '^x-truely-origin: cloudflare-worker' "/tmp/$tag.headers" || exit 71
          done
          echo 'CUTOVER COMPLETE: Cloudflare serves live traffic, scheduler is active, Vercel is paused.'

      - name: Emergency rollback
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -s /tmp/zone-id ] && [ -s /tmp/route-snapshot.json ]; then
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/schedules" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '[]' >/dev/null
            if [ -s /tmp/vercel-project-id ]; then project=$(cat /tmp/vercel-project-id); curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' "https://api.vercel.com/v1/projects/$project/unpause?slug=$VERCEL_TEAM_SLUG" >/dev/null; fi
            zone=$(cat /tmp/zone-id); base="https://api.cloudflare.com/client/v4/zones/$zone/workers/routes"; curl -sS "$base" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/routes-current.json
            node <<'NODE' > /tmp/rollback.tsv
          const fs=require('fs'); const snap=JSON.parse(fs.readFileSync('/tmp/route-snapshot.json','utf8')); const current=JSON.parse(fs.readFileSync('/tmp/routes-current.json','utf8')).result||[];
          for(const [p,old] of Object.entries(snap)){const now=current.find(x=>x.pattern===p); if(old) console.log(['restore',now?.id||old.id,p,old.script??''].join('\t')); else if(now) console.log(['delete',now.id,p,''].join('\t'));}
          NODE
            while IFS=$'\t' read -r action id pattern script; do
              [ -n "$id" ] || continue
              if [ "$action" = delete ]; then curl -sS -X DELETE "$base/$id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null; else body=$(node -e "console.log(JSON.stringify({pattern:process.argv[1],script:process.argv[2]||undefined}))" "$pattern" "$script"); curl -sS -X PUT "$base/$id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body" >/dev/null; fi
            done < /tmp/rollback.tsv
          fi
          echo 'Emergency rollback attempted.'
