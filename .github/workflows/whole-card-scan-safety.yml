name: Whole-Card Scan Safety

on:
  pull_request:
    paths:
      - ".github/workflows/whole-card-scan-safety.yml"
      - "scripts/run-whole-card-scan-audit.mjs"
      - "src/app/components/WholeCardUploadGuard.tsx"
      - "src/app/globals.css"
      - "src/app/layout.tsx"
      - "src/lib/card-scan-frame-policy.ts"
      - "src/lib/instacomp-image-orientation.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/whole-card-scan-safety.yml"
      - "scripts/run-whole-card-scan-audit.mjs"
      - "src/app/components/WholeCardUploadGuard.tsx"
      - "src/app/globals.css"
      - "src/app/layout.tsx"
      - "src/lib/card-scan-frame-policy.ts"
      - "src/lib/instacomp-image-orientation.ts"

permissions:
  contents: read

concurrency:
  group: whole-card-scan-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: whole-card-scan-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify whole-card upload framing
        run: node scripts/run-whole-card-scan-audit.mjs
