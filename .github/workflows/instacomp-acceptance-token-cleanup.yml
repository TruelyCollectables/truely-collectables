name: InstaComp acceptance token cleanup

on:
  push:
    branches:
      - fix/instacomp-live-registry-proof-20260815
    paths:
      - ".github/workflows/instacomp-acceptance-token-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instacomp-acceptance-token-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Remove and verify temporary acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID is unavailable.'; exit 2; }
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN is unavailable.'; exit 2; }
          npx wrangler secret list --name truely-collectables --format json > /tmp/secrets-before.json
          if node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('/tmp/secrets-before.json','utf8'));process.exit(r.some(x=>x&&x.name==='INSTACOMP_ACCEPTANCE_SERVICE_TOKEN')?0:1)"; then
            printf 'y\n' | npx wrangler secret delete INSTACOMP_ACCEPTANCE_SERVICE_TOKEN --name truely-collectables
            sleep 3
          else
            echo 'Temporary acceptance credential was already absent.'
          fi
          npx wrangler secret list --name truely-collectables --format json > /tmp/secrets-after.json
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('/tmp/secrets-after.json','utf8'));if(r.some(x=>x&&x.name==='INSTACOMP_ACCEPTANCE_SERVICE_TOKEN'))throw new Error('Temporary acceptance credential still exists after cleanup.');console.log('PASS temporary InstaComp acceptance credential is absent from Production Worker.')"
          rm -f /tmp/secrets-before.json /tmp/secrets-after.json
