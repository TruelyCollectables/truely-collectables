name: Cloudflare Runtime Probe Now

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-runtime-probe-now-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-cloudflare-runtime-probe-now
  cancel-in-progress: true

env:
  PREVIEW_URL: https://truely-collectables-preview.truelycollectables.workers.dev
  SUPABASE_PROJECT_REF: rfdzsoykhnngzdnvzlhz
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  probe-current-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe current deployed Cloudflare runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 65 -D /tmp/probe.headers \
            "$PREVIEW_URL/api/internal/cloudflare-product-runtime-probe" \
            -o /tmp/probe.json -w '%{http_code}' > /tmp/probe.status
          cat /tmp/probe.json
          echo
          echo "HTTP $(cat /tmp/probe.status)"
          grep -qi '^x-truely-origin: cloudflare-worker' /tmp/probe.headers || {
            echo 'Missing Cloudflare origin proof'
            exit 20
          }

  probe-supabase-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Resolve production Supabase service key without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          curl -sS --fail-with-body --max-time 20 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -o /tmp/keys.json
          node <<'NODE'
          const fs = require('node:fs');
          const keys = JSON.parse(fs.readFileSync('/tmp/keys.json','utf8'));
          const service = keys.find(k => String(k?.name||'').toLowerCase() === 'service_role' && k?.api_key)?.api_key
            || keys.find(k => String(k?.type||'').toLowerCase() === 'secret' && k?.api_key)?.api_key;
          if (!service) throw new Error('Supabase service key unavailable');
          console.log(`::add-mask::${service}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_ROLE_KEY=${service}\n`);
          NODE

      - name: Query exact storefront product directly from Supabase REST
        shell: bash
        run: |
          set -euo pipefail
          base="https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/products"
          url="$base?select=id%2Ctitle%2Cprice%2Cquantity%2Cimage_url&store_id=eq.00000000-0000-4000-8000-000000000001&id=eq.1991&limit=1"
          status=$(curl -sS --max-time 20 \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Accept: application/json' \
            -o /tmp/product.json -w '%{http_code} %{time_total}' "$url")
          echo "Direct Supabase product -> $status"
          head -c 1000 /tmp/product.json || true
          echo

  inspect-supabase-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read project status and Data API configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          base="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"

          project_status=$(curl -sS --max-time 20 -H "$auth" -H 'Accept: application/json' \
            -o /tmp/project.json -w '%{http_code}' "$base")
          postgrest_status=$(curl -sS --max-time 20 -H "$auth" -H 'Accept: application/json' \
            -o /tmp/postgrest.json -w '%{http_code}' "$base/postgrest")
          context_status=$(curl -sS --max-time 20 -H "$auth" -H 'Accept: application/json' \
            -o /tmp/context.json -w '%{http_code}' "$base/database/context")

          node <<'NODE'
          const fs = require('node:fs');
          const read = p => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } };
          const project = read('/tmp/project.json');
          const postgrest = read('/tmp/postgrest.json');
          const context = read('/tmp/context.json');
          console.log('Project status:', project?.status || 'unavailable');
          console.log('PostgREST db_schema:', postgrest?.db_schema || 'unavailable');
          console.log('PostgREST extra search path:', postgrest?.db_extra_search_path || 'unavailable');
          const schemas = Array.isArray(context?.databases)
            ? [...new Set(context.databases.flatMap(db => Array.isArray(db?.schemas) ? db.schemas.map(s => s?.name).filter(Boolean) : []))].sort()
            : [];
          console.log('Database schemas:', schemas.length ? schemas.join(',') : 'unavailable');
          NODE
          echo "Control-plane HTTP: project=$project_status postgrest=$postgrest_status context=$context_status"
