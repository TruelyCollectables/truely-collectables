name: Cloudflare Runtime Probe Now

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-runtime-probe-now-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-cloudflare-runtime-probe-now
  cancel-in-progress: true

env:
  PREVIEW_URL: https://truely-collectables-preview.truelycollectables.workers.dev
  WORKER_NAME: truely-collectables-preview
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_PROJECT_NAME: truely-collectables
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  probe-instacomp:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require existing credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VERCEL_TOKEN; do
            test -n "${!key:-}" || { echo "Missing $key"; exit 2; }
          done

      - name: Probe Cloudflare InstaComp readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -D /tmp/readiness.headers \
            -o /tmp/readiness.json -w '%{http_code} %{time_total}' \
            "$PREVIEW_URL/api/instacomp/internal-readiness" || true)
          echo "Cloudflare InstaComp readiness -> $code"
          origin=$(awk 'BEGIN{IGNORECASE=1} /^x-truely-origin:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' /tmp/readiness.headers || true)
          echo "Origin proof: ${origin:-missing}"
          cat /tmp/readiness.json || true
          echo

      - name: Inspect Cloudflare binding names and types only
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            -o /tmp/settings.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")
          echo "Cloudflare Worker settings -> HTTP $status"
          test "$status" = "200"
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          const bindings = Array.isArray(body?.result?.bindings) ? body.result.bindings : [];
          const wanted = ['INSTACOMP_AI_LOCAL_URL','EBAY_CLIENT_ID','EBAY_CLIENT_SECRET','STRIPE_SECRET_KEY','CRON_SECRET'];
          for (const name of wanted) {
            const b = bindings.find(x => x?.name === name);
            console.log(`${name}: ${b ? `present (${b.type || 'unknown'})` : 'MISSING'}`);
          }
          NODE

      - name: Pull current Truely Vercel production environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.2.0 link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --no-color >/dev/null
          umask 077
          npx --yes vercel@56.2.0 env pull .env.production.local \
            --environment=production \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --yes --no-color >/dev/null
          test -s .env.production.local

      - name: Probe configured InstaComp engine without printing its URL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('.env.production.local','utf8');
          const row = text.split(/\r?\n/).find(line => line.startsWith('INSTACOMP_AI_LOCAL_URL='));
          if (!row) { console.log('Vercel INSTACOMP_AI_LOCAL_URL: MISSING'); process.exit(3); }
          let value = row.slice(row.indexOf('=') + 1).trim();
          try { value = JSON.parse(value); } catch {}
          value = String(value || '').trim().replace(/\/$/, '');
          if (!value) { console.log('Vercel INSTACOMP_AI_LOCAL_URL: EMPTY'); process.exit(4); }
          console.log('Vercel INSTACOMP_AI_LOCAL_URL: present');
          console.log(`::add-mask::${value}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `INSTACOMP_PROBE_URL=${value}/api/health/inventory\n`);
          NODE
          result=$(curl -sS --max-time 20 -o /tmp/engine.json -w '%{http_code} %{time_total}' "$INSTACOMP_PROBE_URL" || true)
          echo "Direct InstaComp health -> $result"
          head -c 2000 /tmp/engine.json || true
          echo

      - name: Cleanup
        if: always()
        run: rm -f .env.production.local /tmp/readiness.headers /tmp/readiness.json /tmp/settings.json /tmp/engine.json
