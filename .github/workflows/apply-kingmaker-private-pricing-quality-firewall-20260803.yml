name: Apply KINGMAKER Private Pricing Quality Firewall 20260803

on:
  pull_request:
    paths:
      - ".github/workflows/apply-kingmaker-private-pricing-quality-firewall-20260803.yml"

permissions:
  contents: read

jobs:
  apply-refresh-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Production

    env:
      EXPECTED_MAIN_SHA: d3034e2fa7a20191d123bbb355795eb4346a8f4d
      EXPECTED_BRANCH: ops/apply-kingmaker-private-pricing-quality-firewall-20260803
      VERCEL_SCOPE: truelycollectables-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RECEIPT_PATH: evidence/kingmaker-private-pricing-quality-firewall-production-20260803/receipt.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/apply-kingmaker-private-pricing-quality-firewall-20260803
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/apply-kingmaker-private-pricing-quality-firewall-20260803.yml'
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          git checkout --detach "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/private-pricing-quality-firewall-production"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/private-pricing-quality-firewall-production/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/private-pricing-quality-firewall-production/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/private-pricing-quality-firewall-production/production.env" >> "$GITHUB_ENV"

      - name: Apply firewall, refresh queues, and deploy Production
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const { mkdirSync, readFileSync, writeFileSync } = require("node:fs");
          const { dirname, resolve } = require("node:path");

          const migrations = [
            "supabase/migrations/20260804050000_private_pricing_coverage_quality_firewall.sql",
            "supabase/migrations/20260804050100_fix_private_pricing_quality_periods.sql",
          ];
          const receiptPath = resolve(process.env.RECEIPT_PATH);
          const managementToken = process.env.GH_SUPABASE_ACCESS_TOKEN;
          const envFile = process.env.PRODUCTION_ENV_FILE;

          function parseEnv(contents) {
            const parsed = {};
            for (const raw of String(contents || "").split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith("#")) continue;
              const index = line.indexOf("=");
              if (index < 1) continue;
              const key = line.slice(0, index).trim().replace(/^export\s+/, "");
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              parsed[key] = value;
            }
            return parsed;
          }

          function projectRef(url) {
            const match = String(url || "").match(/^https:\/\/([a-z0-9]+)\.supabase\.co\/?$/i);
            if (!match) throw new Error("Production database URL was not resolved.");
            return match[1];
          }

          function firstRow(result) {
            return Array.isArray(result) ? result[0] || {} : result || {};
          }

          function firstValue(result) {
            const row = firstRow(result);
            return Object.values(row)[0];
          }

          function asObject(value, label) {
            if (value && typeof value === "object" && !Array.isArray(value)) return value;
            if (typeof value === "string") {
              const parsed = JSON.parse(value);
              if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
            }
            throw new Error(`${label} did not return a JSON object.`);
          }

          function numeric(row, field) {
            const value = Number(row?.[field] ?? 0);
            if (!Number.isFinite(value)) throw new Error(`Invalid numeric field ${field}.`);
            return value;
          }

          async function managementQuery(project, query, readOnly, stage) {
            const response = await fetch(
              `https://api.supabase.com/v1/projects/${project}/database/query`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${managementToken}`,
                  "Content-Type": "application/json",
                  Accept: "application/json",
                },
                body: JSON.stringify({ query, parameters: [], read_only: readOnly }),
                signal: AbortSignal.timeout(119000),
              },
            );
            const text = await response.text();
            if (!response.ok) {
              throw new Error(
                `Production ${stage} failed with HTTP ${response.status}: ${text.slice(0, 800)}`,
              );
            }
            return text ? JSON.parse(text) : [];
          }

          function vercel(args) {
            const result = spawnSync(
              "npx",
              ["vercel@56.2.0", ...args, "--scope", process.env.VERCEL_SCOPE, "--token", process.env.VERCEL_TOKEN],
              {
                cwd: process.cwd(),
                encoding: "utf8",
                maxBuffer: 30 * 1024 * 1024,
              },
            );
            if (result.error || result.status !== 0) {
              const diagnostics = `${result.stdout || ""}\n${result.stderr || ""}`
                .replace(/(?:eyJ|sb_secret_)[A-Za-z0-9._-]{20,}/g, "[masked]")
                .replace(/[A-Za-z0-9_-]{60,}/g, "[masked]")
                .slice(0, 1000);
              throw new Error(`Vercel command failed: ${diagnostics}`);
            }
            return true;
          }

          function statsSql() {
            return `
              select
                count(*)::bigint as total_rows,
                count(*) filter (where identity_match_status = 'exact')::bigint as exact_rows,
                count(*) filter (where identity_match_status = 'ambiguous')::bigint as ambiguous_rows,
                count(*) filter (where identity_match_status = 'unmatched')::bigint as unmatched_rows,
                count(*) filter (where identity_match_status = 'not_applicable')::bigint as not_applicable_rows,
                count(*) filter (
                  where low_observation_id is not null or high_observation_id is not null
                )::bigint as linked_observation_rows,
                (select count(*) from public.tcos_kingmaker_observations)::bigint as observation_rows
              from public.tcos_kingmaker_price_entries;
            `;
          }

          function verificationSql() {
            return `
              select
                to_regprocedure('public.tcos_refresh_kingmaker_private_pricing_attack_queue(boolean)') is not null as attack_refresh_rpc_present,
                to_regprocedure('public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)') is not null as report_rpc_present,
                to_regclass('public.tcos_kingmaker_private_pricing_attack_queue') is not null as attack_queue_present,
                to_regclass('public.tcos_kingmaker_private_pricing_attack_state') is not null as attack_state_present,
                not has_function_privilege('anon','public.tcos_refresh_kingmaker_private_pricing_attack_queue(boolean)','execute') as anon_attack_refresh_revoked,
                not has_function_privilege('authenticated','public.tcos_refresh_kingmaker_private_pricing_attack_queue(boolean)','execute') as authenticated_attack_refresh_revoked,
                not has_function_privilege('anon','public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)','execute') as anon_report_revoked,
                not has_function_privilege('authenticated','public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)','execute') as authenticated_report_revoked,
                has_function_privilege('service_role','public.tcos_refresh_kingmaker_private_pricing_attack_queue(boolean)','execute') as service_attack_refresh_granted,
                has_function_privilege('service_role','public.tcos_kingmaker_private_pricing_coverage_report(integer,integer,text,text,text)','execute') as service_report_granted;
            `;
          }

          function baseRefreshSql() {
            return `
              set statement_timeout = '110s';
              set role service_role;
              select public.tcos_refresh_kingmaker_private_pricing_coverage_snapshot(true) as result;
            `;
          }

          function attackRefreshSql() {
            return `
              set statement_timeout = '30s';
              set role service_role;
              select public.tcos_refresh_kingmaker_private_pricing_attack_queue(true) as result;
            `;
          }

          function reportSql() {
            return `
              set statement_timeout = '15s';
              set role service_role;
              select public.tcos_kingmaker_private_pricing_coverage_report(100,0,null,null,null) as result;
            `;
          }

          function assertSanitized(value) {
            const serialized = JSON.stringify(value).toLowerCase();
            for (const forbidden of [
              "raw_text",
              "original_filename",
              "source_sha256",
              "value_low",
              "value_high",
              "storage_object_path",
            ]) {
              if (serialized.includes(forbidden)) {
                throw new Error(`Sanitized receipt contained prohibited field ${forbidden}.`);
              }
            }
          }

          async function main() {
            if (!managementToken || !envFile || !process.env.VERCEL_TOKEN) {
              throw new Error("Protected Production credentials are required.");
            }
            console.log(`::add-mask::${managementToken}`);
            const productionEnv = parseEnv(readFileSync(envFile, "utf8"));
            const productionUrl = productionEnv.NEXT_PUBLIC_SUPABASE_URL || productionEnv.SUPABASE_URL;
            const project = projectRef(productionUrl);

            const before = firstRow(
              await managementQuery(project, statsSql(), true, "pre-apply statistics"),
            );

            const migrationReceipts = [];
            for (const path of migrations) {
              const sql = readFileSync(path, "utf8");
              await managementQuery(project, sql, false, `migration ${path}`);
              migrationReceipts.push({
                path,
                sha256: createHash("sha256").update(sql).digest("hex"),
              });
            }

            const verification = firstRow(
              await managementQuery(project, verificationSql(), true, "firewall verification"),
            );
            for (const [field, value] of Object.entries(verification)) {
              if (value !== true) throw new Error(`Production verification failed: ${field}.`);
            }

            const baseRefresh = asObject(
              firstValue(await managementQuery(project, baseRefreshSql(), false, "base snapshot refresh")),
              "Base snapshot refresh",
            );
            if (baseRefresh.status !== "succeeded" || baseRefresh.refreshed !== true) {
              throw new Error(`Base snapshot refresh returned ${String(baseRefresh.status || "unknown")}.`);
            }

            const attackRefresh = asObject(
              firstValue(await managementQuery(project, attackRefreshSql(), false, "quality firewall refresh")),
              "Quality firewall refresh",
            );
            if (attackRefresh.status !== "succeeded" || attackRefresh.refreshed !== true) {
              throw new Error(`Quality firewall refresh returned ${String(attackRefresh.status || "unknown")}.`);
            }

            const report = asObject(
              firstValue(await managementQuery(project, reportSql(), false, "quality-ranked report")),
              "Quality-ranked report",
            );
            if (report.boundary !== "aggregate_private_reference_only") {
              throw new Error("Report boundary verification failed.");
            }
            if (report.snapshot?.status !== "succeeded" || report.snapshot?.dirty !== false) {
              throw new Error("Quality-ranked snapshot is not clean and current.");
            }
            if (
              Number(report.summary?.actionableRows || 0) +
              Number(report.summary?.parserReviewRows || 0) !==
              Number(report.summary?.unresolvedRows || 0)
            ) {
              throw new Error("Actionability totals do not reconcile to unresolved rows.");
            }
            assertSanitized(report);

            const after = firstRow(
              await managementQuery(project, statsSql(), true, "post-refresh statistics"),
            );
            for (const field of [
              "total_rows",
              "exact_rows",
              "ambiguous_rows",
              "unmatched_rows",
              "not_applicable_rows",
              "linked_observation_rows",
              "observation_rows",
            ]) {
              if (numeric(after, field) !== numeric(before, field)) {
                throw new Error(`Firewall rollout changed protected field ${field}.`);
              }
            }

            vercel(["deploy", "--prod", "--yes", "--force"]);

            const receipt = {
              schema: "tcos.kingmaker.privatePricingQualityFirewallProductionReceipt.v1",
              status: "passed",
              generatedAt: new Date().toISOString(),
              deployedCommit: process.env.EXPECTED_MAIN_SHA,
              migrations: migrationReceipts,
              baseRefresh,
              attackRefresh,
              coverage: {
                boundary: report.boundary,
                snapshot: report.snapshot,
                summary: report.summary,
                pagination: report.pagination,
                topRows: report.rows,
              },
              verification,
              before: {
                totalRows: numeric(before, "total_rows"),
                exact: numeric(before, "exact_rows"),
                ambiguous: numeric(before, "ambiguous_rows"),
                unmatched: numeric(before, "unmatched_rows"),
                notApplicable: numeric(before, "not_applicable_rows"),
                linkedObservationRows: numeric(before, "linked_observation_rows"),
                observationRows: numeric(before, "observation_rows"),
              },
              after: {
                totalRows: numeric(after, "total_rows"),
                exact: numeric(after, "exact_rows"),
                ambiguous: numeric(after, "ambiguous_rows"),
                unmatched: numeric(after, "unmatched_rows"),
                notApplicable: numeric(after, "not_applicable_rows"),
                linkedObservationRows: numeric(after, "linked_observation_rows"),
                observationRows: numeric(after, "observation_rows"),
              },
              productionDeploymentCompleted: true,
              pricesPromotedByThisOperation: 0,
              recordsMutatedOutsideSnapshots: 0,
              secretsPersisted: false,
            };
            assertSanitized(receipt);
            mkdirSync(dirname(receiptPath), { recursive: true });
            writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(
              `Private pricing firewall passed: ${Number(report.summary?.actionableRows || 0)} actionable rows and ${Number(report.summary?.parserReviewRows || 0)} parser-review rows.`,
            );
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Require sanitized Production receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT_PATH"
          node - <<'NODE'
          const receipt = require(`./${process.env.RECEIPT_PATH}`);
          if (
            receipt.status !== "passed" ||
            receipt.baseRefresh?.status !== "succeeded" ||
            receipt.attackRefresh?.status !== "succeeded" ||
            receipt.coverage?.snapshot?.dirty !== false ||
            receipt.productionDeploymentCompleted !== true ||
            receipt.pricesPromotedByThisOperation !== 0 ||
            receipt.recordsMutatedOutsideSnapshots !== 0 ||
            receipt.secretsPersisted !== false
          ) {
            process.exit(1);
          }
          NODE

      - name: Upload sanitized Production receipt
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-private-pricing-quality-firewall-production-20260803
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 30
