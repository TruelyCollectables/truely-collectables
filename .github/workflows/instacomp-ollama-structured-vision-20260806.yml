name: InstaComp Ollama Structured Vision 20260806

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch-instacomp-ollama-structured-vision.py"
      - "services/instacomp-ai/app/ollama.py"
      - "services/instacomp-ai/tests/**"
      - ".github/workflows/instacomp-ollama-structured-vision-20260806.yml"

permissions:
  contents: read

concurrency:
  group: instacomp-ollama-structured-vision-20260806-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    name: certify-current-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify structured Ollama runtime is already materialized
        shell: bash
        run: |
          set -euo pipefail
          echo "certifying $(git rev-parse HEAD)"
          grep -q 'OLLAMA_OUTPUT_SCHEMA = OllamaStructuredSuggestion.model_json_schema()' services/instacomp-ai/app/ollama.py
          grep -q '/api/chat' services/instacomp-ai/app/ollama.py
          grep -q 'progressive=False' services/instacomp-ai/app/ollama.py
          grep -q '"num_predict": 2048' services/instacomp-ai/app/ollama.py
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instacomp-ai/requirements.txt

      - name: Compile and run complete Mac-service suite
        shell: bash
        run: |
          set -euo pipefail
          pip install -r services/instacomp-ai/requirements.txt
          python -m compileall services/instacomp-ai/app services/instacomp-ai/tests
          PYTHONPATH=services/instacomp-ai pytest -q services/instacomp-ai/tests
