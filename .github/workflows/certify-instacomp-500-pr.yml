name: Certify InstaComp 500 repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: certify-instacomp-500-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply checklist-only review contract
        run: python scripts/apply-instacomp-500-repair.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/instacomp-ai/requirements.txt
          python -m pip install pytest

      - name: Install Node dependencies
        run: npm ci

      - name: Run Mac service tests
        run: python -m pytest services/instacomp-ai/tests -q

      - name: Run review contract simulation
        run: node --import tsx scripts/run-instacomp-review-contract-simulations.ts

      - name: Compile Python service
        run: python -m compileall -q services/instacomp-ai/app

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit certified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/instacomp-ai/app/main.py src/lib/instacomp-ai-local.ts services/instacomp-ai/tests/test_checklist_only_scan_contract.py scripts/run-instacomp-review-contract-simulations.ts
          if git diff --cached --quiet; then
            echo "Certified repair was already committed."
          else
            git commit -m "Fix InstaComp unresolved scan 500 contract"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
