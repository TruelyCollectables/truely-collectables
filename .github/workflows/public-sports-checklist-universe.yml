name: Sports Card Checklist Phase 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/checklist-sources/**"
      - "scripts/organize-universal-checklist-archive.mjs"
      - "scripts/audit-sports-2000-plus.mjs"
      - ".github/workflows/public-sports-checklist-universe.yml"
  push:
    branches:
      - "feature/universal-sports-checklist-universe-20260805"
    paths:
      - "scripts/checklist-sources/**"
      - "scripts/organize-universal-checklist-archive.mjs"
      - "scripts/audit-sports-2000-plus.mjs"
      - ".github/workflows/public-sports-checklist-universe.yml"

permissions:
  contents: read

concurrency:
  group: sports-card-checklist-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: baseballcardpedia
            script: scripts/checklist-sources/baseballcardpedia.mjs
            max_items: 10000
          - source: keyman
            script: scripts/checklist-sources/keyman.mjs
            max_items: 15000
          - source: sportscardradio
            script: scripts/checklist-sources/sportscardradio.mjs
            max_items: 10000
          - source: cardboardconnection
            script: scripts/checklist-sources/cardboardconnection.mjs
            max_items: 10000
          - source: beckett
            script: scripts/checklist-sources/beckett.mjs
            max_items: 5000
          - source: bigapplecollects
            script: scripts/checklist-sources/bigapplecollects.mjs
            max_items: 5000
          - source: cardboardchecklist
            script: scripts/checklist-sources/cardboardchecklist.mjs
            max_items: 5000
          - source: gogts
            script: scripts/checklist-sources/gogts.mjs
            max_items: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collector and sports audit syntax
        run: |
          node --check scripts/checklist-sources/shared.mjs
          node --check "${{ matrix.script }}"
          node --check scripts/organize-universal-checklist-archive.mjs
          node --check scripts/audit-sports-2000-plus.mjs
      - name: Collect public checklist and set records
        id: collect
        continue-on-error: true
        env:
          CHECKLIST_SOURCE: ${{ matrix.source }}
          CHECKLIST_MAX_ITEMS: ${{ matrix.max_items }}
          CHECKLIST_MAX_DISCOVERY_PAGES: 500
          CHECKLIST_MAX_DOWNLOAD_BYTES: 50000000
          BECKETT_MAX_PAGES: 100
        run: node "${{ matrix.script }}"
      - name: Ensure source manifest exists
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          root=".public-checklist-source-archive/${SOURCE}"
          mkdir -p "$root/items"
          if [ ! -f "$root/manifest.json" ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const source = process.env.SOURCE;
          const root = path.resolve(`.public-checklist-source-archive/${source}`);
          fs.writeFileSync(path.join(root, 'manifest.json'), JSON.stringify({
            schema: 'tcos.publicChecklistSourceArchive.v1',
            source,
            generatedAt: new Date().toISOString(),
            collectionOutcome: process.env.COLLECTION_OUTCOME || 'unknown',
            totals: { discoveredCandidates: 0, archivedItems: 0, checklistItems: 0, setIndexOnlyItems: 0 },
            failures: [{ stage: 'collector', error: 'Collector ended without producing a manifest.' }],
          }, null, 2) + '\n');
          NODE
          fi
      - name: Sort source by exact universe, season, manufacturer, product, and source
        if: ${{ steps.collect.outcome == 'success' }}
        env:
          CHECKLIST_ARCHIVE_INPUTS: ".public-checklist-source-archive/${{ matrix.source }}=${{ matrix.source }}"
          CHECKLIST_ORGANIZED_OUTPUT: ".public-checklist-organized/${{ matrix.source }}"
        run: node scripts/organize-universal-checklist-archive.mjs
      - name: Package source archive and any organized output
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          paths=(".public-checklist-source-archive/${SOURCE}")
          if [ -d ".public-checklist-organized/${SOURCE}" ]; then
            paths+=(".public-checklist-organized/${SOURCE}")
          fi
          tar -czf "checklist-source-${SOURCE}.tar.gz" "${paths[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-checklist-source-${{ matrix.source }}-${{ github.run_id }}
          path: checklist-source-${{ matrix.source }}.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-checklist-status-${{ matrix.source }}-${{ github.run_id }}
          path: |
            .public-checklist-source-archive/${{ matrix.source }}/manifest.json
            .public-checklist-organized/${{ matrix.source }}/manifest.json
            .public-checklist-organized/${{ matrix.source }}/master-sets.csv
            .public-checklist-organized/${{ matrix.source }}/source-items.csv
          if-no-files-found: warn
          retention-days: 90

  collect-instacomp-pokemon:
    name: Preserve InstaComp Pokemon lane for later phases
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Pokemon exporter and organizer syntax
        run: |
          node --check scripts/checklist-sources/instacomp-pokemon.mjs
          node --check scripts/organize-universal-checklist-archive.mjs
      - name: Export active live Pokemon releases when credentials are available
        id: collect
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTACOMP_POKEMON_MAX_RELEASES: 5000
        run: node scripts/checklist-sources/instacomp-pokemon.mjs
      - name: Ensure InstaComp Pokemon receipt exists
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          root=".internal-checklist-source-archive/instacomp-pokemon"
          mkdir -p "$root/items"
          if [ ! -f "$root/manifest.json" ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('.internal-checklist-source-archive/instacomp-pokemon');
          fs.writeFileSync(path.join(root, 'manifest.json'), JSON.stringify({
            schema: 'tcos.internalChecklistSourceArchive.v1',
            source: 'instacomp-pokemon',
            generatedAt: new Date().toISOString(),
            collectionOutcome: process.env.COLLECTION_OUTCOME || 'unknown',
            universe: 'pokemon',
            totals: { discoveredCandidates: 0, archivedItems: 0, checklistItems: 0, setIndexOnlyItems: 0 },
            failures: [{ stage: 'collector', error: 'InstaComp Pokemon exporter ended without producing a manifest.' }],
          }, null, 2) + '\n');
          NODE
          fi
      - name: Sort InstaComp Pokemon into the same Registry hierarchy
        if: ${{ steps.collect.outcome == 'success' }}
        env:
          CHECKLIST_ARCHIVE_INPUTS: ".internal-checklist-source-archive/instacomp-pokemon=instacomp-pokemon"
          CHECKLIST_ORGANIZED_OUTPUT: ".internal-checklist-organized/instacomp-pokemon"
        run: node scripts/organize-universal-checklist-archive.mjs
      - name: Package InstaComp Pokemon receipt and any exported rows
        if: always()
        run: |
          paths=(".internal-checklist-source-archive/instacomp-pokemon")
          if [ -d ".internal-checklist-organized/instacomp-pokemon" ]; then
            paths+=(".internal-checklist-organized/instacomp-pokemon")
          fi
          tar -czf checklist-source-instacomp-pokemon.tar.gz "${paths[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-checklist-source-instacomp-pokemon-${{ github.run_id }}
          path: checklist-source-instacomp-pokemon.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-checklist-status-instacomp-pokemon-${{ github.run_id }}
          path: |
            .internal-checklist-source-archive/instacomp-pokemon/manifest.json
            .internal-checklist-organized/instacomp-pokemon/manifest.json
            .internal-checklist-organized/instacomp-pokemon/master-sets.csv
            .internal-checklist-organized/instacomp-pokemon/source-items.csv
          if-no-files-found: warn
          retention-days: 90

  merge-sports-phase1:
    name: Merge Sports Card Checklist Phase 1
    needs: [collect, collect-instacomp-pokemon]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: public-checklist-source-*-${{ github.run_id }}
          path: downloaded-public-source-archives
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: internal-checklist-source-instacomp-pokemon-${{ github.run_id }}
          path: downloaded-instacomp-pokemon
      - name: Extract and verify source receipts
        run: |
          find downloaded-public-source-archives downloaded-instacomp-pokemon -type f -name '*.tar.gz' -print -exec tar -xzf {} \;
          for source in baseballcardpedia keyman sportscardradio cardboardconnection beckett bigapplecollects cardboardchecklist gogts; do
            test -f ".public-checklist-source-archive/${source}/manifest.json"
          done
          test -f ".internal-checklist-source-archive/instacomp-pokemon/manifest.json"
      - name: Build one exact-key master database
        env:
          CHECKLIST_ARCHIVE_INPUTS: ".public-checklist-source-archive/baseballcardpedia=baseballcardpedia,.public-checklist-source-archive/keyman=keyman,.public-checklist-source-archive/sportscardradio=sportscardradio,.public-checklist-source-archive/cardboardconnection=cardboardconnection,.public-checklist-source-archive/beckett=beckett,.public-checklist-source-archive/bigapplecollects=bigapplecollects,.public-checklist-source-archive/cardboardchecklist=cardboardchecklist,.public-checklist-source-archive/gogts=gogts,.internal-checklist-source-archive/instacomp-pokemon=instacomp-pokemon"
          CHECKLIST_ORGANIZED_OUTPUT: ".card-checklist-master-archive"
        run: node scripts/organize-universal-checklist-archive.mjs
      - name: Audit sports-card releases from 2000 forward
        env:
          CHECKLIST_MASTER_ROOT: ".card-checklist-master-archive"
          CHECKLIST_PHASE1_START_YEAR: 2000
        run: node scripts/audit-sports-2000-plus.mjs
      - name: Copy source receipts into the master archive
        run: |
          mkdir -p .card-checklist-master-archive/source-receipts
          for source in baseballcardpedia keyman sportscardradio cardboardconnection beckett bigapplecollects cardboardchecklist gogts; do
            cp ".public-checklist-source-archive/${source}/manifest.json" ".card-checklist-master-archive/source-receipts/${source}.json"
          done
          cp ".internal-checklist-source-archive/instacomp-pokemon/manifest.json" ".card-checklist-master-archive/source-receipts/instacomp-pokemon.json"
      - name: Package master database and source evidence
        run: |
          tar -czf sports-card-checklist-master-archive.tar.gz \
            .card-checklist-master-archive \
            .public-checklist-source-archive \
            .internal-checklist-source-archive
      - uses: actions/upload-artifact@v4
        with:
          name: sports-card-checklist-master-archive-${{ github.run_id }}
          path: sports-card-checklist-master-archive.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: sports-card-checklist-master-catalog-${{ github.run_id }}
          path: |
            .card-checklist-master-archive/manifest.json
            .card-checklist-master-archive/master-sets.json
            .card-checklist-master-archive/master-sets.csv
            .card-checklist-master-archive/source-items.json
            .card-checklist-master-archive/source-items.csv
            .card-checklist-master-archive/source-receipts/*.json
            .card-checklist-master-archive/phase1-sports-2000-plus/*
          if-no-files-found: error
          retention-days: 90
