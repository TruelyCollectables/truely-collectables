name: Apply InstaComp Core Hardening Patch

on:
  push:
    branches:
      - agent/instacomp-2-hardening-rebased
    paths:
      - "scripts/apply-instacomp-core-hardening.mjs"
      - ".github/workflows/apply-instacomp-core-hardening.yml"

permissions:
  contents: write

concurrency:
  group: apply-instacomp-core-hardening
  cancel-in-progress: false

jobs:
  apply-core-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instacomp-2-hardening-rebased
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic core-route patch
        run: node scripts/apply-instacomp-core-hardening.mjs

      - name: Validate patched route markers
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(
            'src/app/api/instacomp/scan/route.ts',
            'utf8',
          );
          for (const marker of [
            'INSTACOMP_CORE_HARDENING_V1',
            'providerFetch(',
            'verifiedInstaCompCompletedSales(',
            'hardenInstaCompMarketPayload(',
            'SECURITY BOUNDARY:',
            '.eq("store_id", actor.storeId)',
            'preNormalizeInputBytes',
            'confidence: ai.confidence',
          ]) {
            if (!source.includes(marker)) throw new Error(`Missing core hardening marker: ${marker}`);
          }
          if (source.includes('await fetch(')) {
            throw new Error('An unbounded provider fetch remains in the InstaComp core route.');
          }
          NODE

      - name: Commit patched route to the isolated branch
        run: |
          if git diff --quiet -- src/app/api/instacomp/scan/route.ts; then
            echo "Core route already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/instacomp/scan/route.ts
          git commit -m "Harden InstaComp core provider and evidence boundaries"
          git push origin HEAD:agent/instacomp-2-hardening-rebased
