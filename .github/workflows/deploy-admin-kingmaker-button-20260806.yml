name: Deploy Admin Kingmaker Button 20260806

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/admin/layout.tsx"
      - "src/app/admin/instacomp/fast/**"
      - ".github/workflows/deploy-admin-kingmaker-button-20260806.yml"
  push:
    branches: [main]
    paths:
      - "src/app/admin/layout.tsx"
      - "src/app/admin/instacomp/fast/**"
      - ".github/workflows/deploy-admin-kingmaker-button-20260806.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-admin-kingmaker-button-20260806-${{ github.event_name }}
  cancel-in-progress: false

env:
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish Production stage pending statuses
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            jq -n --arg state pending --arg context "$1" --arg description "$2" \
              '{state:$state,context:$context,description:$description}' \
              | curl -fsS -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                  -d @- >/dev/null
          }
          publish instacomp-production-verify "Verifying certified source and TypeScript"
          publish instacomp-production-vercel "Waiting for Vercel Production deploy"
          publish instacomp-production-readiness "Waiting for Production readiness probe"
          publish instacomp-production-deploy "Certified main release is running"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify KINGMAKER Admin architecture and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          grep -q 'href="/kingmaker"' src/app/admin/layout.tsx
          grep -q 'OPEN KINGMAKER' src/app/admin/layout.tsx
          grep -q 'href="/admin/advanced"' src/app/admin/layout.tsx
          grep -q 'Advanced Admin' src/app/admin/layout.tsx
          test -f src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx
          grep -q 'aiCouncilTier", "basic"' src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx
          grep -q 'frontRotation' src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx
          grep -q 'backRotation' src/app/admin/instacomp/fast/InstaCompFastDropScannerV2.tsx
          ./node_modules/.bin/tsc --noEmit

      - name: Mark source verification passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg state success --arg context instacomp-production-verify --arg description "KINGMAKER Admin contract and TypeScript passed" \
            '{state:$state,context:$context,description:$description}' \
            | curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d @- >/dev/null

      - name: Deploy merged main with Vercel Production environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          npx vercel@56.2.0 deploy --prod --yes --archive=tgz --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee /tmp/admin-kingmaker-deploy.txt

      - name: Mark Vercel Production deploy passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg state success --arg context instacomp-production-vercel --arg description "Vercel Production deployment completed" \
            '{state:$state,context:$context,description:$description}' \
            | curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d @- >/dev/null

      - name: Probe InstaComp Production readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://truelycollectables.com/api/instacomp/internal-readiness?ts=$(date +%s)" -o /tmp/readiness.json
          node - <<'NODE'
          const fs = require('node:fs');
          const readiness = JSON.parse(fs.readFileSync('/tmp/readiness.json', 'utf8'));
          if (readiness.ok !== true || readiness.reachable !== true) {
            throw new Error(`Production readiness failed: ${JSON.stringify(readiness)}`);
          }
          console.log(JSON.stringify({
            status: 'passed',
            sourceContainsKingmakerButton: true,
            sourceContainsAdvancedAdminLink: true,
            fastScannerSemanticRotation: true,
            fastScannerBasicIdentityLane: true,
            productionReachable: true,
            instaCompHref: '/kingmaker',
          }, null, 2));
          NODE

      - name: Mark Production readiness passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg state success --arg context instacomp-production-readiness --arg description "Production readiness endpoint passed" \
            '{state:$state,context:$context,description:$description}' \
            | curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d @- >/dev/null

      - name: Publish Production deploy final status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="Certified InstaComp main deployed and readiness passed"
          else
            STATE=failure
            DESCRIPTION="InstaComp Production release failed; inspect stage receipts"
          fi
          jq -n \
            --arg state "$STATE" \
            --arg context "instacomp-production-deploy" \
            --arg description "$DESCRIPTION" \
            '{state:$state,context:$context,description:$description}' \
            | curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d @- >/dev/null

# certification-deploy-stage-receipts-20260809-v2
