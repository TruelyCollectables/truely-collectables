name: Inspect Origins Production Import

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/inspect-origins-production-import.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect-production-import:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect exact merged Origins Registry production run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: f0ebe3293de39750067a88c347c0612e198e094f
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/import-2025-origins-registry-production.yml/runs?branch=main&event=push&per_page=20")"
          echo "$response" | jq -r '.workflow_runs[] | [.id,.head_sha,.status,(.conclusion // "pending"),.created_at,.html_url] | @tsv'
          run="$(echo "$response" | jq -c --arg sha "$EXPECTED_SHA" '.workflow_runs[] | select(.head_sha == $sha)' | head -n 1)"
          test -n "$run"
          echo "Matched production import run:"
          echo "$run" | jq '{id,head_sha,status,conclusion,created_at,updated_at,html_url}'
          run_id="$(echo "$run" | jq -r '.id')"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | {id,name,status,conclusion,started_at,completed_at,html_url,steps:[.steps[] | {name,status,conclusion}]}'
