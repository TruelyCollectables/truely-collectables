name: Match KINGMAKER Beckett Corpus 20260803

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/match-kingmaker-beckett-corpus-20260803.yml"
      - "scripts/ops/match-kingmaker-beckett-corpus-20260803.mjs"

permissions:
  contents: read

concurrency:
  group: match-kingmaker-beckett-corpus-20260803
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: ops/match-kingmaker-beckett-corpus-20260803
  VERCEL_SCOPE: truelycollectables-projects
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  EVIDENCE_DIR: evidence/kingmaker-beckett-production-match-20260803

jobs:
  match-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_BRANCH }}
          fetch-depth: 0

      - name: Fail closed on exact operations scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$EXPECTED_BRANCH"
          git fetch origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/match-kingmaker-beckett-corpus-20260803.yml'
          test "${changed[1]}" = 'scripts/ops/match-kingmaker-beckett-corpus-20260803.mjs'
          git diff --check origin/main...HEAD
          cp scripts/ops/match-kingmaker-beckett-corpus-20260803.mjs "$RUNNER_TEMP/match.mjs"
          git checkout --detach origin/main
          mkdir -p scripts/ops "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/match.mjs" scripts/ops/match-kingmaker-beckett-corpus-20260803.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull protected Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${GH_SUPABASE_ACCESS_TOKEN:-}"
          echo "::add-mask::$GH_SUPABASE_ACCESS_TOKEN"
          mkdir -p .vercel "$RUNNER_TEMP/prod"
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          fi
          npx vercel@56.2.0 env pull "$RUNNER_TEMP/prod/production.env" --yes --environment production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          test -s "$RUNNER_TEMP/prod/production.env"
          echo "PRODUCTION_ENV_FILE=$RUNNER_TEMP/prod/production.env" >> "$GITHUB_ENV"

      - name: Match staged corpus in bounded batches
        shell: bash
        env:
          ALLOW_KINGMAKER_BECKETT_MATCH: "YES"
          RECEIPT_PATH: evidence/kingmaker-beckett-production-match-20260803/receipt.json
        run: |
          set -euo pipefail
          node scripts/ops/match-kingmaker-beckett-corpus-20260803.mjs

      - name: Require passing matching receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'evidence/kingmaker-beckett-production-match-20260803/receipt.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.schema !== 'tcos.kingmaker.beckettProductionMatchReceipt.v1') throw new Error('Unexpected receipt schema');
          if (r.status !== 'passed') throw new Error('Matching failed');
          if (r.production?.entries !== 128636) throw new Error('Entry count mismatch');
          if (r.production?.unattempted !== 0) throw new Error('Unattempted rows remain');
          if (r.production?.promoted !== 0 || r.promotedAutomatically !== false) throw new Error('Unexpected promotion');
          NODE

      - name: Upload sanitized matching receipt
        uses: actions/upload-artifact@v4
        with:
          name: kingmaker-beckett-production-match-20260803
          path: evidence/kingmaker-beckett-production-match-20260803/receipt.json
          if-no-files-found: error
          retention-days: 30
