name: Truely Collectables Full Launch Audit 20260729

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ops-truely-full-launch-audit-20260729.yml"
      - "scripts/run-truely-launch-audit-20260729.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truely-full-launch-audit-20260729
  cancel-in-progress: false

env:
  AUDIT_BASE_URL: https://truelycollectables.com
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder-service-role-key
  ADMIN_SESSION_SECRET: build-only-placeholder-session-secret-that-is-long-enough
  ADMIN_PASSWORD: build-only-placeholder-admin-password
  NEXT_PUBLIC_SITE_URL: https://truelycollectables.com
  STRIPE_SECRET_KEY: sk_test_build_only_placeholder
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_build_only_placeholder
  EBAY_CLIENT_ID: build-only-placeholder-client-id
  EBAY_CLIENT_SECRET: build-only-placeholder-client-secret
  EBAY_ENVIRONMENT: production
  TCOS_LIVE_PAYMENTS_ENABLED: "false"
  TCOS_SHIPPING_PURCHASE_MODE: dry_run
  TCOS_LIVE_SHIPPING_ENABLED: "false"

jobs:
  repository-inventory:
    name: Repository inventory and source security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm audit-only branch changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/ops-truely-full-launch-audit-20260729.yml|scripts/run-truely-launch-audit-20260729.mjs) ;;
              *) echo "Unexpected production-source change on audit branch: $file" >&2; exit 1 ;;
            esac
          done

      - name: Run complete tracked-source inventory
        run: node scripts/run-truely-launch-audit-20260729.mjs inventory

      - name: Run independent Gitleaks snapshot scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit/inventory
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --no-git --redact \
            --report-format=json \
            --report-path=/repo/.audit/inventory/gitleaks.json \
            --exit-code=0
          node - <<'NODE'
          const fs = require('fs');
          const file = '.audit/inventory/gitleaks.json';
          let rows = [];
          try { rows = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          fs.writeFileSync('.audit/inventory/gitleaks-summary.json', JSON.stringify({ findings: rows.length }, null, 2));
          console.log(`Gitleaks current-snapshot findings: ${rows.length}`);
          NODE

      - name: Upload repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-repository-inventory
          path: .audit/inventory
          if-no-files-found: error
          retention-days: 30

  quality-build:
    name: Dependencies, lint, TypeScript, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Record dependency tree
        shell: bash
        run: |
          mkdir -p .audit/quality
          npm ls --all --json > .audit/quality/npm-dependency-tree.json || true

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > .audit/quality/npm-audit-production.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.audit/quality/npm-audit-production.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities || {};
          fs.writeFileSync('.audit/quality/npm-audit-production-summary.json', JSON.stringify(vulnerabilities, null, 2));
          console.log(vulnerabilities);
          if ((vulnerabilities.high || 0) > 0 || (vulnerabilities.critical || 0) > 0) process.exit(1);
          NODE

      - name: Record full dependency audit and outdated packages
        shell: bash
        run: |
          npm audit --json > .audit/quality/npm-audit-all.json || true
          npm outdated --json > .audit/quality/npm-outdated.json || true

      - name: Run repository lint
        run: npm run lint

      - name: Run standalone TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: Run full production build
        run: npm run build

      - name: Write quality certificate
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('.audit/quality/npm-audit-production-summary.json', 'utf8'));
          fs.writeFileSync('.audit/quality/quality-certificate.json', JSON.stringify({
            sourceSha: process.env.GITHUB_SHA,
            npmCi: 'passed',
            productionDependencyAudit: summary,
            lint: 'passed',
            typecheck: 'passed',
            productionBuild: 'passed'
          }, null, 2));
          NODE

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-quality-build
          path: .audit/quality
          if-no-files-found: warn
          retention-days: 30

  api-route-security:
    name: API route and privilege audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run independent route classifier
        run: node scripts/run-truely-launch-audit-20260729.mjs routes

      - name: Run every repository privileged-route audit script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit/routes/existing
          count=0
          while IFS= read -r file; do
            count=$((count + 1))
            name="$(basename "$file")"
            echo "Running $file"
            case "$file" in
              *.ts) node --import tsx "$file" > ".audit/routes/existing/${name}.log" 2>&1 ;;
              *) node "$file" > ".audit/routes/existing/${name}.log" 2>&1 ;;
            esac
          done < <(find scripts -maxdepth 1 -type f \( -iname '*privileged*route*' -o -iname '*api*route*audit*' -o -iname '*security*route*' \) | sort)
          echo "Existing route/security audit scripts run: $count"

      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-api-route-security
          path: .audit/routes
          if-no-files-found: error
          retention-days: 30

  simulations:
    name: Simulation shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete applicable simulation shard
        run: node scripts/run-truely-launch-audit-20260729.mjs simulations --shard=${{ matrix.shard }} --shards=6

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-simulations-${{ matrix.shard }}
          path: .audit/simulations
          if-no-files-found: error
          retention-days: 30

  live-production:
    name: Live Production crawl and access checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run live read-only Production audit
        run: node scripts/run-truely-launch-audit-20260729.mjs live

      - name: Capture TLS and DNS-facing evidence
        if: always()
        shell: bash
        run: |
          mkdir -p .audit/live
          curl --silent --show-error --location --head https://truelycollectables.com > .audit/live/custom-domain-head.txt || true
          curl --silent --show-error --location --head https://truely-collectables.vercel.app > .audit/live/vercel-alias-head.txt || true
          echo | openssl s_client -connect truelycollectables.com:443 -servername truelycollectables.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName > .audit/live/tls-certificate.txt || true

      - name: Upload live Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-live-production
          path: .audit/live
          if-no-files-found: error
          retention-days: 30

  runtime-integrations:
    name: Production database, Stripe, eBay, Resend, and Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: truelycollectables-projects
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link exact Vercel Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          mkdir -p .vercel .audit/runtime
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          else
            npx vercel@56.2.0 link --yes --project truely-collectables --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi
          npx vercel@56.2.0 whoami --token "$VERCEL_TOKEN" > .audit/runtime/vercel-identity.txt

      - name: Pull Production environment privately
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.2.0 env pull .audit-production.env \
            --environment=production \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" > .audit/runtime/vercel-env-pull.log 2>&1
          test -s .audit-production.env
          sed -E 's/=.*$/=[REDACTED]/' .audit-production.env | sort > .audit/runtime/production-env-names.txt

      - name: Inspect current Production deployment
        shell: bash
        run: |
          set +e
          npx vercel@56.2.0 inspect https://truelycollectables.com \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" > .audit/runtime/vercel-inspect.txt 2>&1
          set -e

      - name: Run read-only Production integration and data audit
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .audit-production.env
          set +a
          for key in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY STRIPE_LIVE_SECRET_KEY RESEND_API_KEY EBAY_CLIENT_ID EBAY_CLIENT_SECRET; do
            value="${!key:-}"
            test -n "$value"
            echo "::add-mask::$value"
          done
          set +e
          node scripts/run-truely-launch-audit-20260729.mjs runtime
          status=$?
          set -e
          rm -f .audit-production.env
          exit "$status"

      - name: Remove private environment file
        if: always()
        run: rm -f .audit-production.env

      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-runtime-integrations
          path: .audit/runtime
          if-no-files-found: error
          retention-days: 30

  lighthouse:
    name: Lighthouse accessibility, SEO, performance, and best practices
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Lighthouse on critical customer pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit/lighthouse
          urls=(
            "https://truelycollectables.com/"
            "https://truelycollectables.com/shop"
            "https://truelycollectables.com/account/signup"
            "https://truelycollectables.com/cart"
          )
          names=(home shop signup cart)
          for index in "${!urls[@]}"; do
            npx --yes lighthouse@12.8.2 "${urls[$index]}" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path=".audit/lighthouse/${names[$index]}.json" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet
          done

      - name: Grade Lighthouse reports
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = '.audit/lighthouse';
          const rows = [];
          let blocker = false;
          const intentionallyPrivate = new Set(['cart', 'signup']);
          for (const file of fs.readdirSync(dir).filter(name => name.endsWith('.json'))) {
            const report = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            const row = {
              page: file.replace('.json', ''),
              canonical: report.audits.canonical?.score ?? null,
              crawlable: report.audits['is-crawlable']?.score ?? null,
            };
            for (const key of ['performance', 'accessibility', 'best-practices', 'seo']) {
              row[key] = Math.round((report.categories[key]?.score || 0) * 100);
            }
            const categoryFailure = row.accessibility < 90 || row['best-practices'] < 85;
            const seoFailure = intentionallyPrivate.has(row.page)
              ? row.canonical !== 1 || row.crawlable !== 0
              : row.seo < 90;
            if (categoryFailure || seoFailure) blocker = true;
            rows.push(row);
          }
          fs.writeFileSync(path.join(dir, 'lighthouse-summary.json'), JSON.stringify({ rows, blocker }, null, 2));
          fs.writeFileSync(path.join(dir, 'lighthouse-summary.md'), '# Lighthouse summary\n\n' + rows.map(row => `- ${row.page}: Performance ${row.performance}, Accessibility ${row.accessibility}, Best Practices ${row['best-practices']}, SEO ${row.seo}`).join('\n') + '\n');
          console.table(rows);
          if (blocker) process.exit(1);
          NODE

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-launch-lighthouse
          path: .audit/lighthouse
          if-no-files-found: error
          retention-days: 30

  final-certificate:
    name: Assemble final audit certificate
    if: always()
    needs:
      - repository-inventory
      - quality-build
      - api-route-security
      - simulations
      - live-production
      - runtime-integrations
      - lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Download all audit evidence
        uses: actions/download-artifact@v4
        with:
          path: evidence

      - name: Build final certificate
        shell: bash
        env:
          RESULT_REPOSITORY: ${{ needs.repository-inventory.result }}
          RESULT_QUALITY: ${{ needs.quality-build.result }}
          RESULT_ROUTES: ${{ needs.api-route-security.result }}
          RESULT_SIMULATIONS: ${{ needs.simulations.result }}
          RESULT_LIVE: ${{ needs.live-production.result }}
          RESULT_RUNTIME: ${{ needs.runtime-integrations.result }}
          RESULT_LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          mkdir -p final-certificate
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const jobResults = {
            repositoryInventory: process.env.RESULT_REPOSITORY,
            qualityBuild: process.env.RESULT_QUALITY,
            apiRouteSecurity: process.env.RESULT_ROUTES,
            simulations: process.env.RESULT_SIMULATIONS,
            liveProduction: process.env.RESULT_LIVE,
            runtimeIntegrations: process.env.RESULT_RUNTIME,
            lighthouse: process.env.RESULT_LIGHTHOUSE,
          };
          const findings = [];
          const simulationFailures = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.json')) {
                try {
                  const value = JSON.parse(fs.readFileSync(full, 'utf8'));
                  if (Array.isArray(value.findings)) findings.push(...value.findings.map(item => ({ ...item, source: full })));
                  if (Array.isArray(value.results)) {
                    for (const row of value.results) if (row.status && row.status !== 'passed') simulationFailures.push({ name: row.name, status: row.status, source: full });
                  }
                } catch {}
              }
            }
          }
          walk('evidence');
          const blockerFindings = findings.filter(item => item.severity === 'blocker');
          const warningFindings = findings.filter(item => item.severity === 'warning');
          const jobFailures = Object.entries(jobResults).filter(([, result]) => result !== 'success');
          const overall = jobFailures.length === 0 && blockerFindings.length === 0 && simulationFailures.length === 0 ? 'verified' : 'blocked';
          const certificate = {
            schema: 'truely.collectables.full-launch-audit.v1',
            generatedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA,
            overall,
            jobResults,
            counts: {
              findings: findings.length,
              blockers: blockerFindings.length,
              warnings: warningFindings.length,
              simulationFailures: simulationFailures.length,
              failedJobs: jobFailures.length,
            },
            blockerFindings,
            warningFindings,
            simulationFailures,
            unverifiedByDesign: [
              'A real live-card charge was not created by this read-only audit.',
              'A physical shipment, postage purchase, carrier acceptance scan, delivery, refund, and dispute were not manufactured.',
              'Customer and owner email inbox receipt cannot be proven without sending a controlled real transaction or test message.',
            ],
          };
          fs.writeFileSync('final-certificate/final-audit-certificate.json', JSON.stringify(certificate, null, 2));
          fs.writeFileSync('final-certificate/final-audit-certificate.md', [
            '# Truely Collectables full launch audit certificate',
            '',
            `- Overall: **${overall.toUpperCase()}**`,
            `- Generated: ${certificate.generatedAt}`,
            `- Blockers: ${certificate.counts.blockers}`,
            `- Warnings: ${certificate.counts.warnings}`,
            `- Simulation failures: ${certificate.counts.simulationFailures}`,
            `- Failed jobs: ${certificate.counts.failedJobs}`,
            '',
            '## Job results',
            ...Object.entries(jobResults).map(([name, result]) => `- ${name}: ${result}`),
            '',
            '## Blockers',
            ...(blockerFindings.length ? blockerFindings.map(item => `- ${item.area}: ${item.message}`) : ['- None']),
            '',
            '## Warnings',
            ...(warningFindings.length ? warningFindings.map(item => `- ${item.area}: ${item.message}`) : ['- None']),
            '',
            '## Not manufactured by this read-only audit',
            ...certificate.unverifiedByDesign.map(item => `- ${item}`),
          ].join('\n') + '\n');
          console.log(JSON.stringify(certificate.counts));
          NODE

      - name: Upload final certificate
        uses: actions/upload-artifact@v4
        with:
          name: truely-full-launch-audit-certificate
          path: final-certificate
          if-no-files-found: error
          retention-days: 30
